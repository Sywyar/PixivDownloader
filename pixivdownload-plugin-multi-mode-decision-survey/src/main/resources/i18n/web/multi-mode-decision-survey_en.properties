plugin.name=Multi-user Mode Decision Survey
plugin.summary=Collects feedback on whether multi-user mode should be retained through the administrator inbox.
inbox-title=Multi-user Mode Decision Survey
inbox-body=The maintenance plan is evaluating removal of multi-user mode. Please respond if you use it now or expect to use it in the future.
question=Do you use, or expect to use, multi-user mode?
description=The current maintenance plan may remove multi-user mode. If you use it now or expect to use it in the future, please respond so we can understand your needs.
choice-yes=Yes
choice-no=No
choice-other=Other
other-placeholder=Please describe your situation
submit=Submit
submitting=Submitting...
privacy=This survey is submitted through the PostHog SDK. It only collects your response and an anonymous identifier derived one-way from a random installation identity. It does not send the raw installation identity, account, cookies, artwork, or local paths.
required=Please select an option.
other-required=Please add a description when selecting Other.
submit-failed=Submission failed. Please try again later.
completed=Thank you. Your response has been submitted.
loading=Loading survey...
unavailable=The survey is temporarily unavailable. Please try again later.
ended=This survey has ended.
