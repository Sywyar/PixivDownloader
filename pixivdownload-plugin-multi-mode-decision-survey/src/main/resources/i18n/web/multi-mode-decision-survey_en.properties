plugin.name=Multi-user Mode Decision Survey
plugin.summary=Collects feedback on whether multi-user mode should be retained through the administrator inbox.
inbox-title=Multi-user Mode Decision Survey
inbox-body=This survey measures actual use of multi-user mode. Because its current identity, data-isolation, and abuse-prevention boundaries carry security risks, the maintenance plan proposes removing it. Current users are invited to respond.
question=Do you use, or expect to use, multi-user mode?
description=This survey measures actual use of multi-user mode. The current implementation identifies visitors with a client-supplied UUID that cannot serve as a trusted authentication credential. Its download, queue, quota, and file paths also lack an audited end-to-end owner-isolation and abuse-prevention boundary, creating identity-spoofing, unauthorized-access, and resource-abuse risks. The maintenance plan therefore proposes removing multi-user mode. If you use it, we invite you to respond so we can better understand your needs. If removal is later withdrawn, we will harden its security boundaries and work to address these risks. Thank you for responding.
choice-yes=Yes
choice-no=No
choice-other=Other
other-placeholder=Please describe your situation
submit=Submit
submitting=Submitting...
privacy=This survey is submitted through the PostHog SDK. It only collects your response and an anonymous identifier derived one-way from a random installation identity. It does not send the raw installation identity, account, cookies, artwork, or local paths.
required=Please select an option.
other-required=Please add a description when selecting Other.
submit-failed=Submission failed. Please try again later.
completed=Thank you. Your response has been submitted.
loading=Loading survey...
unavailable=The survey is temporarily unavailable. Please try again later.
ended=This survey has ended.
