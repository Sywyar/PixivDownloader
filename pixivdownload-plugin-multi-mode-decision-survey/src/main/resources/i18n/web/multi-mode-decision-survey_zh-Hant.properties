plugin.name=多人模式保留調查
plugin.summary=透過管理員站內信收集是否保留多人模式的意見。
inbox-title=多人模式保留調查
inbox-body=本問卷用於調查多人模式的使用情況。由於現有身分、資料隔離與防濫用邊界存在安全風險，維護計畫擬刪除多人模式；如果您正在使用，誠邀您填寫問卷。
question=您現在或未來會使用多人模式嗎？
description=本問卷用於調查多人模式的實際使用情況。目前多人模式以用戶端可自行宣告的 UUID 識別訪客，無法將此識別碼作為可信的驗證憑據；下載、佇列、配額與檔案等鏈路也尚未完成經稽核的端到端 owner 隔離與防濫用強化，存在身分偽造、越權存取與資源濫用風險。因此維護計畫擬刪除多人模式。如果您正在使用多人模式，誠邀您填寫此問卷，讓我們了解更多需求；若後續決定不刪除，我們將強化多人模式的安全邊界，盡力解決上述風險。感謝您的填寫。
choice-yes=會使用
choice-no=不會使用
choice-other=其他
other-placeholder=請說明您的情況
submit=提交
submitting=提交中…
privacy=本問卷使用固定版本的 PostHog SDK，並向固定的事件接收介面傳送問卷回答、調查識別碼、調查專用匿名識別碼、用於投遞去重的穩定事件識別碼、完成狀態、事件時間，以及傳輸所需的事件名稱與公開專案令牌。不傳送原始安裝身分、帳戶、Cookie、作品或本機路徑。
required=請選擇一個選項。
other-required=選擇「其他」時請填寫說明。
submit-failed=提交失敗，請稍後再試。
completed=感謝您的回饋，回答已提交。
unavailable=調查暫時無法載入，請稍後再試。
ended=此調查已結束。
