plugin.name=マルチユーザーモード継続調査
plugin.summary=管理者向けサイト内メッセージで、マルチユーザーモードを継続するかどうかの意見を収集します。
inbox-title=マルチユーザーモード継続調査
inbox-body=このアンケートはマルチユーザーモードの利用状況を調査するものです。現在の身元管理、データ分離、悪用防止の境界にはセキュリティリスクがあるため、保守計画ではマルチユーザーモードの削除を予定しています。利用中の場合は、ぜひご回答ください。
question=現在、または今後マルチユーザーモードを利用しますか？
description=このアンケートはマルチユーザーモードの実際の利用状況を調査するものです。現在のマルチユーザーモードでは、クライアントが自己申告する UUID で利用者を識別していますが、この識別子を信頼できる認証情報として扱うことはできません。ダウンロード、キュー、割り当て、ファイルなどの処理も、監査済みのエンドツーエンドの owner 分離と悪用防止強化をまだ完了しておらず、身元の偽装、権限外アクセス、リソースの悪用リスクがあります。そのため、保守計画ではマルチユーザーモードの削除を予定しています。利用中の場合は、要望を把握するためぜひご回答ください。削除しないことになった場合は、マルチユーザーモードのセキュリティ境界を強化し、上記のリスク解消に努めます。ご協力ありがとうございます。
choice-yes=利用します
choice-no=利用しません
choice-other=その他
other-placeholder=状況を記入してください
submit=送信
submitting=送信中…
privacy=このアンケートは固定バージョンの PostHog SDK を使用し、固定されたイベント受信エンドポイントへ、回答、調査 ID、調査専用の匿名 ID、配信重複排除用の安定したイベント ID、完了状態、イベント時刻、送信に必要なイベント名と公開プロジェクトトークンを送信します。元のインストール ID、アカウント、Cookie、作品、ローカルパスは送信しません。
required=選択肢を1つ選んでください。
other-required=「その他」を選択した場合は説明を入力してください。
submit-failed=送信に失敗しました。しばらくしてから再試行してください。
completed=フィードバックありがとうございます。回答を送信しました。
unavailable=調査を一時的に読み込めません。しばらくしてから再試行してください。
ended=この調査は終了しました。
