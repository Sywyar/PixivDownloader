plugin.name=多人模式去留调查
plugin.summary=通过管理员站内信收集是否保留多人模式的意见。
inbox-title=多人模式去留调查
inbox-body=本问卷用于调查多人模式的使用情况。由于现有身份、数据隔离与防滥用边界存在安全风险，维护计划拟删除多人模式；如果您正在使用，诚邀填写。
question=您使用或者未来会使用多人模式吗？
description=本问卷用于调查多人模式的实际使用情况。当前多人模式以客户端可自行声明的 UUID 识别游客，无法把该标识作为可信鉴权凭据；下载、队列、配额和文件等链路也尚未完成经审计的端到端 owner 隔离与防滥用加固，存在身份伪造、越权访问和资源滥用风险。因此维护计划拟删除多人模式。如果您正在使用多人模式，诚邀您填写此问卷，让我们了解更多需求；如果后续决定不删除，我们将加固多人模式的安全边界，尽力解决上述风险。感谢您的填写。
choice-yes=会使用
choice-no=不会使用
choice-other=其他
other-placeholder=请说明您的情况
submit=提交
submitting=提交中…
privacy=本问卷使用 PostHog SDK 提交，只收集您的回答和由随机安装身份单向散列生成的匿名标识，不会发送原始安装身份、账号、Cookie、作品或本地路径。
required=请选择一个选项。
other-required=选择“其他”时请填写说明。
submit-failed=提交失败，请稍后重试。
completed=感谢反馈，您的回答已提交。
loading=正在加载调查…
unavailable=调查暂时无法加载，请稍后重试。
ended=该调查已结束。
