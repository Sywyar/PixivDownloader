plugin.name=다중 사용자 모드 유지 여부 설문
plugin.summary=관리자 사이트 내 메시지로 다중 사용자 모드 유지 여부에 대한 의견을 수집합니다.
inbox-title=다중 사용자 모드 유지 여부 설문
inbox-body=이 설문은 다중 사용자 모드의 사용 현황을 조사합니다. 현재 신원, 데이터 격리 및 오용 방지 경계에는 보안 위험이 있어 유지보수 계획에서 다중 사용자 모드를 삭제할 예정입니다. 사용 중이라면 의견을 들려 주세요.
question=다중 사용자 모드를 사용하고 있거나 앞으로 사용할 예정인가요?
description=이 설문은 다중 사용자 모드의 실제 사용 현황을 조사합니다. 현재 다중 사용자 모드는 클라이언트가 직접 선언할 수 있는 UUID로 방문자를 식별하므로 이 식별자를 신뢰할 수 있는 인증 자격 증명으로 사용할 수 없습니다. 다운로드, 대기열, 할당량, 파일 등의 경로도 감사를 거친 종단 간 소유자 격리 및 오용 방지 강화를 아직 완료하지 못해 신원 위조, 권한 초과 접근 및 리소스 오용 위험이 있습니다. 따라서 유지보수 계획에서는 다중 사용자 모드를 삭제할 예정입니다. 현재 사용 중이라면 이 설문에 참여하여 요구 사항을 알려 주세요. 이후 삭제하지 않기로 결정하면 다중 사용자 모드의 보안 경계를 강화하고 위 위험을 해결하기 위해 노력하겠습니다. 참여해 주셔서 감사합니다.
choice-yes=사용할 예정
choice-no=사용하지 않을 예정
choice-other=기타
other-placeholder=상황을 설명해 주세요
submit=제출
submitting=제출 중…
privacy=이 설문은 고정 버전의 PostHog SDK를 사용하며, 고정된 이벤트 수신 인터페이스로 설문 응답, 설문 식별자, 설문 전용 익명 식별자, 전송 중복 제거용 안정적 이벤트 식별자, 완료 상태, 이벤트 시간 및 전송에 필요한 이벤트 이름과 공개 프로젝트 토큰을 보냅니다. 원본 설치 식별자, 계정, Cookie, 작품 또는 로컬 경로는 전송하지 않습니다.
required=옵션을 하나 선택하세요.
other-required='기타'를 선택한 경우 설명을 입력하세요.
submit-failed=제출하지 못했습니다. 잠시 후 다시 시도하세요.
completed=피드백을 보내 주셔서 감사합니다. 응답이 제출되었습니다.
unavailable=설문을 일시적으로 불러올 수 없습니다. 잠시 후 다시 시도하세요.
ended=이 설문은 종료되었습니다.
