script.meta.all-in-one.description=Pixiv 다기능 다운로드 스크립트입니다. 페이지 일괄 다운로드, 사용자 일괄 다운로드, 단일 작품 일괄 가져오기, 단일 작품 다운로드(Java 백엔드 버전)를 통합합니다. 다기능 스크립트에 문제가 있으면 먼저 해당 독립 스크립트를 시도하고, 두 스크립트의 결과를 함께 첨부하여 이슈를 제출하세요.
script.meta.all-in-one.name=Pixiv All-in-One Downloader
script.meta.artwork-java.description=Java 백엔드 서비스를 통해 Pixiv 단일 작품의 이미지를 다운로드합니다
script.meta.artwork-java.name=Pixiv 작품 이미지 다운로드 도구(Java 백엔드 버전)
script.meta.artwork-local.description=Pixiv 단일 작품의 모든 이미지를 다운로드하고 다운로드한 작품을 기록합니다(로컬 저장소를 사용하며 백엔드 데이터베이스를 사용하지 않음)
script.meta.artwork-local.name=Pixiv 작품 이미지 다운로드 도구(Local download)
script.meta.experience-toolbox.description=Pixiv 탐색 경험 향상 도구 상자입니다. 각 기능은 독립적으로 필요에 따라 켜고 끌 수 있으며 계속 확장됩니다. 현재 서버에서 다운로드한 작품의 썸네일에 테두리를 추가합니다.
script.meta.experience-toolbox.name=Pixiv 탐색 경험 향상 도구 상자
script.meta.import-batch.description=단일 작품 링크 목록을 붙여 넣어 일괄 다운로드합니다. url | title 형식을 사용하며 One-Tab, N-Tab 등의 탭 관리 플러그인 내보내기 형식과 호환되고 엄격한 다운로드 상태 검사를 지원합니다.
script.meta.import-batch.name=Pixiv 단일 작품 일괄 가져오기 다운로드 도구
script.meta.page-batch.description=현재 Pixiv 페이지(검색 페이지, 팔로잉 피드, 랭킹, 사용자 홈 등)의 모든 작품을 가져옵니다
script.meta.page-batch.name=Pixiv 페이지 일괄 다운로드 도구
script.meta.user-batch.description=Pixiv 사용자 페이지에 맞춰 모든 작품 ID를 자동으로 가져오고 로컬 Java 백엔드와 연동합니다.
script.meta.user-batch.name=Pixiv 사용자 일괄 다운로드 도구
