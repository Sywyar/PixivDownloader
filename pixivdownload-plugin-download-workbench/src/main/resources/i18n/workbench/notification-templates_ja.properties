# --- プッシュ媒体 Markdown テンプレート ---
push.message.overuse-paused.title=⚠️ 認証情報ポリシーによりスケジュールタスクを停止
push.message.overuse-paused.body=認証情報ポリシーがアカウント **{{account_id}}** で手動確認の必要なイベントを検出したため、この認証情報アカウントの **{{tasks_count}}** 件のスケジュールタスクを自動的に停止しました。\n\n- ポリシーイベントの日時：{{warning_time}}\n- 停止日時：{{trigger_time}}\n\n影響を受けるタスク：\n{{tasks_list_md}}\n\n「スケジュールタスク」ページでポリシーの案内を確認し、提供元プラグインの復旧操作を使用してください。
push.message.auth-expired.title=🔑 スケジュールタスクの認証情報が利用できません。更新が必要です
push.message.auth-expired.body=スケジュールタスク **{{task_name}}**（ID {{task_id}}）にバインドされた認証情報は、提供元ポリシーにより利用できないと判定され、タスクは自動的に休止されました。\n\n- タスクの種類：{{task_type}}\n- トリガー：{{task_trigger}}\n- 休止日時：{{trigger_time}}\n- 復旧方法：提供元ポリシーに従って認証情報を更新または再バインドすると再開します（自動再試行はしません）\n\n「スケジュールタスク」ページで提供元プラグインの認証情報操作を使用してください。成功すると自動的に復旧し、隔離されていた作品を優先して再試行します。
push.message.circuit-breaker.title=🛑 スケジュールタスクをサーキットブレーカーで停止
push.message.circuit-breaker.body=スケジュールタスク **{{task_name}}**（ID {{task_id}}）が **{{consecutive_failures}}** 回連続で失敗したため、認証情報障害のサーキットブレーカーが作動して休止しました。\n\n- タスクの種類：{{task_type}}\n- トリガー：{{task_trigger}}\n- 休止日時：{{trigger_time}}\n- 復旧方法：提供元ポリシーに従って認証情報を更新または再バインドすると再開します（自動再試行はしません）\n- 直近の失敗：{{last_error_excerpt}}\n\n失敗概要を確認し、「スケジュールタスク」ページで提供元プラグインの認証情報操作を使用してください。
push.message.pending-exhausted.title=🧩 作品の自動再試行が上限に達しました。手動対応が必要です
push.message.pending-exhausted.body=スケジュールタスク **{{task_name}}**（ID {{task_id}}）の{{work_kind}}作品 **{{work_id}}** は **{{attempts}}** 回自動再試行しても失敗したため、自動再試行を停止しました。\n\n- タスクの種類：{{task_type}}\n- トリガー：{{task_trigger}}\n- 作品リンク：{{work_url}}\n- トリガー日時：{{trigger_time}}\n- 次回の予定実行：{{next_run_time}}\n- 直近の失敗：{{last_error_excerpt}}\n\n「スケジュールタスク」ページで「🧩 再試行待ち」パネルを開き、手動で対応してください。
push.message.degraded-anonymous.title=ℹ️ スケジュールタスクの認証情報を取り消し、制限された機能で継続
push.message.degraded-anonymous.body=スケジュールタスク **{{task_name}}**（ID {{task_id}}）にバインドされた任意の認証情報は利用できないため、認証情報のバインドを取り消し、提供元ポリシーが許可する制限された機能に切り替えました。今回のラウンドは正常に完了しました。\n\n- タスクの種類：{{task_type}}\n- トリガー：{{task_trigger}}\n- 今回の新規ダウンロード：{{completed}}\n- 実行時間：{{trigger_time}}\n- 次回の予定実行：{{next_run_time}}\n\n完全な機能に戻す場合は、「スケジュールタスク」ページで提供元プラグインの方法に従い、有効な認証情報を再バインドしてください。
push.message.run-failed.title=❌ スケジュールタスクの実行に失敗
push.message.run-failed.body=スケジュールタスク **{{task_name}}**（ID {{task_id}}）は今回の実行に失敗し、検出 / ダウンロードを完了できませんでした。次の周期に自動再試行します。\n\n- タスクの種類：{{task_type}}\n- トリガー：{{task_trigger}}\n- 失敗日時：{{trigger_time}}\n- 次回の予定実行：{{next_run_time}}\n- 失敗理由：{{last_error_excerpt}}\n\n失敗が続く場合は、「スケジュールタスク」ページで設定とネットワーク / プロキシを確認してください（状態が失敗に変わったときだけ 1 回通知します）。
push.message.run-summary.title=✅ スケジュールタスクの実行完了、新規ダウンロード {{completed}} 件
push.message.run-summary.body=スケジュールタスク **{{task_name}}**（ID {{task_id}}）は今回の実行に成功し、新規ダウンロードが **{{completed}}** 件あります。\n\n- タスクの種類：{{task_type}}\n- トリガー：{{task_trigger}}\n- 実行時間：{{trigger_time}}\n- 次回の予定実行：{{next_run_time}}
