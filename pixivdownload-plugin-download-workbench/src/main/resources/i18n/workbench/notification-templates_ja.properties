# スケジュールタスクプラグインが所有する通知テンプレートの文言。起動時に mail / push / inbox の安定した提供値として具体化されます。

# --- スケジューラー発の通知で共有する文言 ---
mail.template.common.brand=Pixiv ダウンロードアシスタント
mail.template.common.greeting=こんにちは、{{username}} さん：
mail.template.common.signature=— Pixiv ダウンロードアシスタントチーム
mail.template.common.footer.auto=このメールはシステムから自動送信されています。直接返信しないでください。
mail.template.common.footer.copyright=© 2026 PixivDownloader · AGPL-3.0 LICENSED
# 共通情報カードの行ラベル（タスク通知で共有）
mail.template.common.info-card.type=タスクの種類
mail.template.common.info-card.trigger=トリガー
mail.template.common.info-card.next-run=次回の予定実行
# 実行成功 / 一部機能への縮退 / 概要通知で共有：今回の新規ダウンロード数 + 実行時間
mail.template.common.info-card.completed=今回の新規ダウンロード
mail.template.common.info-card.run-time=実行時間
# 休止通知の復旧方法の行（タスクは休止し自動継続しないため、次回実行時間は表示しません）
mail.template.common.info-card.recovery=復旧方法
mail.template.common.recovery.reauthorize=「スケジュールタスク」ページで提供元のポリシーに従って認証情報を更新または再バインドすると再開します（自動再試行はしません）
# --- overuse-paused：認証情報ポリシーによるアカウント単位の停止（外部 ID は互換性のため維持） ---
mail.template.overuse-paused.subject=⚠️ 認証情報ポリシーによりスケジュールタスクを停止
mail.template.overuse-paused.category=ポリシーによる停止
mail.template.overuse-paused.eyebrow=CREDENTIAL POLICY
mail.template.overuse-paused.heading=⚠️ 同じアカウントのスケジュールタスクを認証情報ポリシーにより停止
mail.template.overuse-paused.body-para1=認証情報ポリシーが、手動確認の必要なアカウント単位のイベントを検出しました。ポリシーのリスクを確認するまで処理を続けないよう、この認証情報アカウントのスケジュールタスクを自動的に停止しました。
mail.template.overuse-paused.body-para2=「スケジュールタスク」ページでポリシーの案内を確認し、提供元プラグインの復旧操作を使用してください。対応方法を確認するまではタスクを停止したままにしてください。
mail.template.overuse-paused.info-card.label=重要な情報
mail.template.overuse-paused.info-card.account=認証情報アカウント
mail.template.overuse-paused.info-card.tasks=影響を受けるタスク数
mail.template.overuse-paused.info-card.task-list=タスク一覧
mail.template.overuse-paused.info-card.warning-time=ポリシーイベントの日時
mail.template.overuse-paused.info-card.trigger-time=停止日時
mail.template.overuse-paused.note.label=ポリシーの詳細：
mail.template.overuse-paused.note.text=以下は認証情報ポリシーが提供する安全な概要です。提供元プラグインの案内に従って復旧方法を決めてください。

# --- auth-expired：タスクの認証情報が利用できず休止（外部 ID は互換性のため維持） ---
mail.template.auth-expired.subject=🔑 スケジュールタスクの認証情報が利用できません。更新が必要です
mail.template.auth-expired.category=認証情報が利用不可
mail.template.auth-expired.eyebrow=CREDENTIAL UNAVAILABLE
mail.template.auth-expired.heading=🔑 スケジュールタスクの認証情報は利用できません
mail.template.auth-expired.body-para1=以下のスケジュールタスクにバインドされた認証情報は、提供元ポリシーにより利用できないと判定されました。認証情報の問題が解決するまで処理を続けないよう、タスクを自動的に休止しました。
mail.template.auth-expired.body-para2=「スケジュールタスク」ページで、提供元プラグインが指定する方法に従って認証情報を更新または再バインドしてください。成功すると自動的に実行を再開し、隔離されていた作品を優先して再試行します。
mail.template.auth-expired.info-card.label=重要な情報
mail.template.auth-expired.info-card.task=タスク名
mail.template.auth-expired.info-card.task-id=タスク ID
mail.template.auth-expired.info-card.reason=原因
mail.template.auth-expired.info-card.trigger-time=休止日時
mail.template.auth-expired.reason.credential-unavailable=認証情報が提供元ポリシーに拒否されたか、利用できません
mail.template.auth-expired.note.label=注意：
mail.template.auth-expired.note.text=認証情報の形式と更新方法は提供元プラグインが定義します。このメールに認証情報の内容は含まれません。

# --- circuit-breaker：連続失敗による認証情報障害の遮断（外部 ID は互換性のため維持） ---
mail.template.circuit-breaker.subject=🛑 スケジュールタスクをサーキットブレーカーで停止（{{consecutive_failures}} 回連続失敗）
mail.template.circuit-breaker.category=遮断による停止
mail.template.circuit-breaker.eyebrow=CIRCUIT BREAKER
mail.template.circuit-breaker.heading=🛑 連続失敗によりスケジュールタスクを遮断・停止
mail.template.circuit-breaker.body-para1=以下のスケジュールタスクは同じ実行ラウンドで個別の作品取得に何度も失敗し、認証情報障害のサーキットブレーカーが作動しました。利用できない可能性のある認証情報で空実行を続けないよう、タスクを休止しました。
mail.template.circuit-breaker.body-para2=直近の失敗概要を確認し、「スケジュールタスク」ページで提供元ポリシーに従って認証情報を更新または再バインドしてください。成功すると自動的に実行を再開し、隔離されていた作品を優先して再試行します。
mail.template.circuit-breaker.info-card.label=重要な情報
mail.template.circuit-breaker.info-card.task=タスク名
mail.template.circuit-breaker.info-card.task-id=タスク ID
mail.template.circuit-breaker.info-card.failures=連続失敗回数
mail.template.circuit-breaker.info-card.trigger-time=休止日時
mail.template.circuit-breaker.note.label=直近の失敗：
mail.template.circuit-breaker.note.text=以下は直近の失敗理由の概要です（認証情報は含まれません）。

# --- pending-exhausted：1 作品の自動再試行が上限に達し、手動対応が必要 ---
mail.template.pending-exhausted.subject=🧩 スケジュールタスクの作品自動再試行が上限に達しました。手動対応が必要です
mail.template.pending-exhausted.category=手動対応が必要
mail.template.pending-exhausted.eyebrow=PENDING EXHAUSTED
mail.template.pending-exhausted.heading=🧩 1 作品の自動再試行が上限に達しました
mail.template.pending-exhausted.body-para1=以下のスケジュールタスクの作品が複数回の自動再試行後も失敗し、「再試行待ち上限」（schedule.pending-max-attempts）に達しました。システムはこの作品を自動再試行せず、管理者の手動対応を待ちます。
mail.template.pending-exhausted.body-para2=「スケジュールタスク」ページでタスクの「🧩 再試行待ち」パネルを開いて詳細を確認し、必要に応じて操作してください。作品が本当に復旧不能だと確認した場合は「消去」をクリックして隔離テーブルから削除します。一時的な問題だと思われる場合は削除してください。次回の検出ループで再び該当すると、再度隔離・再試行されます。
mail.template.pending-exhausted.info-card.label=重要な情報
mail.template.pending-exhausted.info-card.task=タスク名
mail.template.pending-exhausted.info-card.task-id=タスク ID
mail.template.pending-exhausted.info-card.work=作品
mail.template.pending-exhausted.info-card.link=作品リンク
mail.template.pending-exhausted.info-card.attempts=再試行回数
mail.template.pending-exhausted.info-card.trigger-time=トリガー日時
mail.template.pending-exhausted.note.label=直近の失敗：
mail.template.pending-exhausted.note.text=以下は直近の失敗理由の概要です（認証情報は含まれません）。

# --- degraded-anonymous：利用できない任意認証情報を取り消し、制限された機能で継続（外部 ID は互換性のため維持） ---
mail.template.degraded-anonymous.subject=ℹ️ スケジュールタスクの認証情報を取り消し、制限された機能で継続
mail.template.degraded-anonymous.category=制限付きで継続
mail.template.degraded-anonymous.eyebrow=CREDENTIAL REVOKED
mail.template.degraded-anonymous.heading=ℹ️ 実行成功。制限された機能に切り替えました
mail.template.degraded-anonymous.body-para1=以下のスケジュールタスクにバインドされていた任意の認証情報は利用できないため、認証情報のバインドを取り消し、提供元ポリシーが許可する制限された機能に切り替えました。今回のラウンドは正常に完了しました。
mail.template.degraded-anonymous.body-para2=タスクは制限された機能で実行を続けます。完全な機能に戻す場合は、「スケジュールタスク」ページで提供元プラグインの方法に従い、有効な認証情報を再バインドしてください。
mail.template.degraded-anonymous.info-card.label=重要な情報
mail.template.degraded-anonymous.info-card.task=タスク名
mail.template.degraded-anonymous.info-card.task-id=タスク ID
mail.template.degraded-anonymous.note.label=注意：
mail.template.degraded-anonymous.note.text=制限された機能の具体的な範囲は提供元プラグインが定義します。このメールに認証情報の内容は含まれません。

# --- run-failed：ラウンド全体の失敗（認証関連以外） ---
mail.template.run-failed.subject=❌ スケジュールタスクの実行に失敗
mail.template.run-failed.category=実行失敗
mail.template.run-failed.eyebrow=RUN FAILED
mail.template.run-failed.heading=❌ スケジュールタスクが今回の実行に失敗
mail.template.run-failed.body-para1=以下のスケジュールタスクは今回の実行に失敗し、検出 / ダウンロードを完了できませんでした。次のスケジュール周期に自動再試行するため、手動対応は不要です。
mail.template.run-failed.body-para2=失敗が続く場合は、「スケジュールタスク」ページで設定、ネットワーク / プロキシ、Pixiv の利用可能性を確認してください。この通知は状態が非失敗から失敗に変わったときだけ 1 回送信し、連続失敗では繰り返しません。
mail.template.run-failed.info-card.label=重要な情報
mail.template.run-failed.info-card.task=タスク名
mail.template.run-failed.info-card.task-id=タスク ID
mail.template.run-failed.info-card.fail-time=失敗日時
mail.template.run-failed.note.label=失敗理由：
mail.template.run-failed.note.text=以下は今回の失敗理由の概要です（認証情報は含まれません）。

