# 计划任务插件拥有的通知模板文案；启动时物化为 mail / push 稳定贡献值。

# ── 调度器自发通知模板的共用文案 ──────────────────────────────────────
mail.template.common.brand=Pixiv 下载助手
mail.template.common.greeting=你好，{{username}}：
mail.template.common.signature=— Pixiv 下载助手 团队
mail.template.common.footer.auto=本邮件由系统自动发送，请勿直接回复。
mail.template.common.footer.copyright=© 2026 PixivDownloader · AGPL-3.0 LICENSED
# 共用信息卡行标签（任务级通知共享）
mail.template.common.info-card.type=任务类型
mail.template.common.info-card.trigger=触发方式
mail.template.common.info-card.next-run=下次预定运行
# 运行成功 / 降级 / 摘要类通知共用：本轮新下载数量 + 运行时间
mail.template.common.info-card.completed=本轮新下载
mail.template.common.info-card.run-time=运行时间
# 挂起类通知的恢复方式行（任务已挂起、不会自动续跑，故不展示下次运行时间）
mail.template.common.info-card.recovery=恢复方式
mail.template.common.recovery.reauthorize=需在「计划任务」页面按来源策略更新或重新绑定凭证后才会继续（不会自动重试）
# ── overuse-paused：凭证策略要求账号级暂停（外部 id 保持兼容）──────────
mail.template.overuse-paused.subject=⚠️ 凭证策略已暂停计划任务
mail.template.overuse-paused.category=策略暂停
mail.template.overuse-paused.eyebrow=CREDENTIAL POLICY
mail.template.overuse-paused.heading=⚠️ 凭证策略已暂停同账号计划任务
mail.template.overuse-paused.body-para1=凭证策略检测到需要人工确认的账号级事件。为避免在策略风险未确认时继续执行，系统已自动暂停该凭证账号下的计划任务。
mail.template.overuse-paused.body-para2=请到「计划任务」页面查看策略提示，并使用来源插件提供的恢复操作；确认处理方式前请保持任务暂停。
mail.template.overuse-paused.info-card.label=关键信息
mail.template.overuse-paused.info-card.account=凭证账号
mail.template.overuse-paused.info-card.tasks=受影响任务数
mail.template.overuse-paused.info-card.task-list=任务清单
mail.template.overuse-paused.info-card.warning-time=策略事件时间
mail.template.overuse-paused.info-card.trigger-time=暂停时间
mail.template.overuse-paused.note.label=策略详情：
mail.template.overuse-paused.note.text=以下为凭证策略提供的安全摘要，请根据来源插件提示决定如何恢复。

# ── auth-expired：任务凭证不可用并挂起（外部 id 保持兼容）────────────
mail.template.auth-expired.subject=🔑 计划任务凭证不可用，需更新凭证
mail.template.auth-expired.category=凭证不可用
mail.template.auth-expired.eyebrow=CREDENTIAL UNAVAILABLE
mail.template.auth-expired.heading=🔑 计划任务凭证已不可用
mail.template.auth-expired.body-para1=以下计划任务绑定的凭证已被来源策略判定为不可用，系统已自动挂起该任务，避免在凭证问题未处理时继续执行。
mail.template.auth-expired.body-para2=请到「计划任务」页面按来源插件提供的方式更新或重新绑定凭证；处理成功后会自动恢复运行，并优先重试此前被隔离的作品。
mail.template.auth-expired.info-card.label=关键信息
mail.template.auth-expired.info-card.task=任务名称
mail.template.auth-expired.info-card.task-id=任务 ID
mail.template.auth-expired.info-card.reason=原因
mail.template.auth-expired.info-card.trigger-time=挂起时间
mail.template.auth-expired.reason.credential-unavailable=凭证被来源策略拒绝或已不可用
mail.template.auth-expired.note.label=提示：
mail.template.auth-expired.note.text=凭证格式与更新方式由来源插件定义；本邮件不包含任何凭证内容。

# ── circuit-breaker：连续失败触发凭证故障熔断（外部 id 保持兼容）────
mail.template.circuit-breaker.subject=🛑 计划任务熔断挂起（连续失败 {{consecutive_failures}} 次）
mail.template.circuit-breaker.category=熔断挂起
mail.template.circuit-breaker.eyebrow=CIRCUIT BREAKER
mail.template.circuit-breaker.heading=🛑 计划任务因连续失败已熔断挂起
mail.template.circuit-breaker.body-para1=以下计划任务在同一轮运行中连续多次执行单项工作失败，已触发凭证故障熔断；系统已挂起该任务，避免继续使用可能不可用的凭证空跑。
mail.template.circuit-breaker.body-para2=请检查最近一次失败摘要，并到「计划任务」页面按来源策略更新或重新绑定凭证；处理成功后会自动恢复运行，并优先重试此前被隔离的作品。
mail.template.circuit-breaker.info-card.label=关键信息
mail.template.circuit-breaker.info-card.task=任务名称
mail.template.circuit-breaker.info-card.task-id=任务 ID
mail.template.circuit-breaker.info-card.failures=连续失败次数
mail.template.circuit-breaker.info-card.trigger-time=挂起时间
mail.template.circuit-breaker.note.label=最近一次失败：
mail.template.circuit-breaker.note.text=以下为最近一次失败的原因摘要（已脱敏，不含任何凭证）。

# ── pending-exhausted：单作品自动重试达上限 → 需人工处理 ──────────────
mail.template.pending-exhausted.subject=🧩 计划任务作品自动重试已达上限，需人工处理
mail.template.pending-exhausted.category=需人工处理
mail.template.pending-exhausted.eyebrow=PENDING EXHAUSTED
mail.template.pending-exhausted.heading=🧩 单个作品自动重试已达上限
mail.template.pending-exhausted.body-para1=以下计划任务中的某个作品在多轮自动重试后仍然失败，已达到「待重试上限」（schedule.pending-max-attempts），系统不再自动重试该作品，等待管理员手动介入。
mail.template.pending-exhausted.body-para2=请到「计划任务」页面，展开该任务的「🧩 待重试」面板查看详情，并按需操作：确认作品是否真的不可恢复时点击「清除」从隔离表中移除；如认为是瞬时问题，删除后下次发现循环若再次撞到会重新隔离与重试。
mail.template.pending-exhausted.info-card.label=关键信息
mail.template.pending-exhausted.info-card.task=任务名称
mail.template.pending-exhausted.info-card.task-id=任务 ID
mail.template.pending-exhausted.info-card.work=作品
mail.template.pending-exhausted.info-card.link=作品链接
mail.template.pending-exhausted.info-card.attempts=已重试次数
mail.template.pending-exhausted.info-card.trigger-time=触发时间
mail.template.pending-exhausted.note.label=最近一次失败：
mail.template.pending-exhausted.note.text=以下为最近一次失败的原因摘要（已脱敏，不含任何凭证）。

# ── degraded-anonymous：撤销不可用凭证并以受限能力继续（外部 id 保持兼容）──
mail.template.degraded-anonymous.subject=ℹ️ 计划任务凭证已撤销，改用受限能力继续运行
mail.template.degraded-anonymous.category=受限继续
mail.template.degraded-anonymous.eyebrow=CREDENTIAL REVOKED
mail.template.degraded-anonymous.heading=ℹ️ 运行成功，已改用受限能力
mail.template.degraded-anonymous.body-para1=以下计划任务绑定的可选凭证已不可用，系统已撤销该任务的凭证绑定，并改用来源策略允许的受限能力继续运行；本轮已成功完成。
mail.template.degraded-anonymous.body-para2=任务将继续按受限能力运行；若需恢复完整能力，请到「计划任务」页面按来源插件提供的方式重新绑定有效凭证。
mail.template.degraded-anonymous.info-card.label=关键信息
mail.template.degraded-anonymous.info-card.task=任务名称
mail.template.degraded-anonymous.info-card.task-id=任务 ID
mail.template.degraded-anonymous.note.label=提示：
mail.template.degraded-anonymous.note.text=受限能力的具体范围由来源插件定义；本邮件不包含任何凭证内容。

# ── run-failed：整轮运行失败（非鉴权类异常） ─────────────────────────
mail.template.run-failed.subject=❌ 计划任务运行失败
mail.template.run-failed.category=运行失败
mail.template.run-failed.eyebrow=RUN FAILED
mail.template.run-failed.heading=❌ 计划任务本轮运行失败
mail.template.run-failed.body-para1=以下计划任务在本轮运行中失败，未能完成发现 / 下载。系统会在下个调度周期自动重试，无需手动干预。
mail.template.run-failed.body-para2=若持续失败，请到「计划任务」页面检查任务配置、网络 / 代理与 Pixiv 可用性。本通知仅在状态由非失败转为失败时发送一次，连续失败不会重复打扰。
mail.template.run-failed.info-card.label=关键信息
mail.template.run-failed.info-card.task=任务名称
mail.template.run-failed.info-card.task-id=任务 ID
mail.template.run-failed.info-card.fail-time=失败时间
mail.template.run-failed.note.label=失败原因：
mail.template.run-failed.note.text=以下为本轮失败的原因摘要（已脱敏，不含任何凭证）。

# ── run-summary：运行成功且本轮有新下载 ───────────────────────────────
mail.template.run-summary.subject=✅ 计划任务运行完成，新增 {{completed}} 个下载
mail.template.run-summary.category=运行摘要
mail.template.run-summary.eyebrow=RUN SUMMARY
mail.template.run-summary.heading=✅ 计划任务运行完成
mail.template.run-summary.body-para1=以下计划任务本轮运行成功，并下载了若干新作品。
mail.template.run-summary.body-para2=任务将按既定周期继续运行；下次预定运行时间见下方。
mail.template.run-summary.info-card.label=关键信息
mail.template.run-summary.info-card.task=任务名称
mail.template.run-summary.info-card.task-id=任务 ID
mail.template.run-summary.note.label=说明：
mail.template.run-summary.note.text=这是一封运行摘要通知，仅在本轮有新下载时发送；无新增的运行不会发信。

# ── 推送介质 Markdown 模板 ───────────────────────────────────────────
push.message.overuse-paused.title=⚠️ 凭证策略已暂停计划任务
push.message.overuse-paused.body=凭证策略检测到账号 **{{account_id}}** 发生需要人工确认的事件，已自动暂停该凭证账号下的 **{{tasks_count}}** 个计划任务。\n\n- 策略事件时间：{{warning_time}}\n- 暂停时间：{{trigger_time}}\n\n受影响任务：\n{{tasks_list_md}}\n\n请到「计划任务」页面查看策略提示，并使用来源插件提供的恢复操作。
push.message.auth-expired.title=🔑 计划任务凭证不可用，需更新凭证
push.message.auth-expired.body=计划任务 **{{task_name}}**（ID {{task_id}}）绑定的凭证已被来源策略判定为不可用，任务已自动挂起。\n\n- 任务类型：{{task_type}}\n- 触发方式：{{task_trigger}}\n- 挂起时间：{{trigger_time}}\n- 恢复方式：需按来源策略更新或重新绑定凭证后才会继续（不会自动重试）\n\n请到「计划任务」页面使用来源插件提供的凭证操作；处理成功后会自动恢复并优先重试被隔离的作品。
push.message.circuit-breaker.title=🛑 计划任务熔断挂起
push.message.circuit-breaker.body=计划任务 **{{task_name}}**（ID {{task_id}}）连续失败 **{{consecutive_failures}}** 次，已触发凭证故障熔断并挂起。\n\n- 任务类型：{{task_type}}\n- 触发方式：{{task_trigger}}\n- 挂起时间：{{trigger_time}}\n- 恢复方式：需按来源策略更新或重新绑定凭证后才会继续（不会自动重试）\n- 最近失败：{{last_error_excerpt}}\n\n请检查失败摘要，并到「计划任务」页面使用来源插件提供的凭证操作。
push.message.pending-exhausted.title=🧩 作品自动重试已达上限，需人工处理
push.message.pending-exhausted.body=计划任务 **{{task_name}}**（ID {{task_id}}）中的{{work_kind}}作品 **{{work_id}}** 自动重试 **{{attempts}}** 次后仍失败，已停止自动重试。\n\n- 任务类型：{{task_type}}\n- 触发方式：{{task_trigger}}\n- 作品链接：{{work_url}}\n- 触发时间：{{trigger_time}}\n- 下次预定运行：{{next_run_time}}\n- 最近失败：{{last_error_excerpt}}\n\n请到「计划任务」页面展开「🧩 待重试」面板手动处理。
push.message.degraded-anonymous.title=ℹ️ 计划任务凭证已撤销，改用受限能力继续运行
push.message.degraded-anonymous.body=计划任务 **{{task_name}}**（ID {{task_id}}）绑定的可选凭证已不可用，系统已撤销凭证绑定，并改用来源策略允许的受限能力继续运行；本轮已成功完成。\n\n- 任务类型：{{task_type}}\n- 触发方式：{{task_trigger}}\n- 本轮新下载：{{completed}}\n- 运行时间：{{trigger_time}}\n- 下次预定运行：{{next_run_time}}\n\n若需恢复完整能力，请到「计划任务」页面按来源插件提供的方式重新绑定有效凭证。
push.message.run-failed.title=❌ 计划任务运行失败
push.message.run-failed.body=计划任务 **{{task_name}}**（ID {{task_id}}）本轮运行失败，未能完成发现 / 下载，将在下个周期自动重试。\n\n- 任务类型：{{task_type}}\n- 触发方式：{{task_trigger}}\n- 失败时间：{{trigger_time}}\n- 下次预定运行：{{next_run_time}}\n- 失败原因：{{last_error_excerpt}}\n\n若持续失败，请到「计划任务」页面检查配置与网络 / 代理（仅状态转入失败时通知一次）。
push.message.run-summary.title=✅ 计划任务运行完成，新增 {{completed}} 个下载
push.message.run-summary.body=计划任务 **{{task_name}}**（ID {{task_id}}）本轮运行成功，新增 **{{completed}}** 个下载。\n\n- 任务类型：{{task_type}}\n- 触发方式：{{task_trigger}}\n- 运行时间：{{trigger_time}}\n- 下次预定运行：{{next_run_time}}
