# Notification templates owned by the scheduled-task plugin and materialized as mail / push contributions.

# ── Shared copy for scheduler-driven notification templates ──────────
mail.template.common.brand=Pixiv Downloader
mail.template.common.greeting=Hello, {{username}}:
mail.template.common.signature=— The Pixiv Downloader team
mail.template.common.footer.auto=This email is sent automatically. Please do not reply directly.
mail.template.common.footer.copyright=© 2026 PixivDownloader · AGPL-3.0 LICENSED
# Shared info-card row labels (reused across task-level notifications)
mail.template.common.info-card.type=Task type
mail.template.common.info-card.trigger=Trigger
mail.template.common.info-card.next-run=Next scheduled run
# Shared by success / degraded / summary notifications: new downloads this run + run time
mail.template.common.info-card.completed=New downloads this run
mail.template.common.info-card.run-time=Run time
# Recovery row for suspended-task notifications (the task is suspended and will not resume on its own, so no next-run time is shown)
mail.template.common.info-card.recovery=Recovery
mail.template.common.recovery.reauthorize=Resumes only after you update or rebind the credential according to its source policy on the "Scheduled Tasks" page (no automatic retry)
# ── overuse-paused: credential policy requires an account-level pause (published id retained) ──
mail.template.overuse-paused.subject=⚠️ Credential policy paused scheduled tasks
mail.template.overuse-paused.category=Policy Pause
mail.template.overuse-paused.eyebrow=CREDENTIAL POLICY
mail.template.overuse-paused.heading=⚠️ Credential policy paused tasks for this account
mail.template.overuse-paused.body-para1=The credential policy detected an account-level event that requires administrator review. To avoid continuing before the policy risk is assessed, scheduled tasks for this credential account have been paused automatically.
mail.template.overuse-paused.body-para2=Review the policy guidance on the "Scheduled Tasks" page and use the recovery action supplied by the source plugin; keep the tasks paused until you choose how to proceed.
mail.template.overuse-paused.info-card.label=Details
mail.template.overuse-paused.info-card.account=Credential account
mail.template.overuse-paused.info-card.tasks=Affected tasks
mail.template.overuse-paused.info-card.task-list=Task list
mail.template.overuse-paused.info-card.warning-time=Policy event time
mail.template.overuse-paused.info-card.trigger-time=Paused at
mail.template.overuse-paused.note.label=Policy details:
mail.template.overuse-paused.note.text=Below is a safe summary supplied by the credential policy. Follow the source plugin guidance when deciding how to resume.

# ── auth-expired: task credential unavailable and suspended (published id retained) ──
mail.template.auth-expired.subject=🔑 Scheduled task credential unavailable; update required
mail.template.auth-expired.category=Credential Unavailable
mail.template.auth-expired.eyebrow=CREDENTIAL UNAVAILABLE
mail.template.auth-expired.heading=🔑 Scheduled task credential is unavailable
mail.template.auth-expired.body-para1=The source policy has marked the credential bound to the scheduled task below as unavailable. The task was suspended automatically so it does not continue before the credential issue is resolved.
mail.template.auth-expired.body-para2=Update or rebind the credential using the method supplied by the source plugin on the "Scheduled Tasks" page; after a successful update, the task resumes and retries previously isolated works first.
mail.template.auth-expired.info-card.label=Details
mail.template.auth-expired.info-card.task=Task name
mail.template.auth-expired.info-card.task-id=Task ID
mail.template.auth-expired.info-card.reason=Reason
mail.template.auth-expired.info-card.trigger-time=Suspended at
mail.template.auth-expired.reason.credential-unavailable=Credential rejected by its source policy or otherwise unavailable
mail.template.auth-expired.note.label=Tip:
mail.template.auth-expired.note.text=Credential format and update steps are defined by the source plugin; this email contains no credential material.

# ── circuit-breaker: consecutive failures open the credential circuit (published id retained) ──
mail.template.circuit-breaker.subject=🛑 Scheduled task circuit-broken ({{consecutive_failures}} consecutive failures)
mail.template.circuit-breaker.category=Circuit Break
mail.template.circuit-breaker.eyebrow=CIRCUIT BREAKER
mail.template.circuit-breaker.heading=🛑 Scheduled task suspended after consecutive failures
mail.template.circuit-breaker.body-para1=The scheduled task below failed individual work execution multiple times in a row within one run and opened the credential-failure circuit. The task was suspended to avoid continuing with a potentially unavailable credential.
mail.template.circuit-breaker.body-para2=Review the latest failure summary, then update or rebind the credential according to its source policy on the "Scheduled Tasks" page; after a successful update, the task resumes and retries previously isolated works first.
mail.template.circuit-breaker.info-card.label=Details
mail.template.circuit-breaker.info-card.task=Task name
mail.template.circuit-breaker.info-card.task-id=Task ID
mail.template.circuit-breaker.info-card.failures=Consecutive failures
mail.template.circuit-breaker.info-card.trigger-time=Suspended at
mail.template.circuit-breaker.note.label=Last failure:
mail.template.circuit-breaker.note.text=Below is an excerpt of the most recent failure reason (redacted, contains no credentials).

# ── pending-exhausted: per-work auto-retry exhausted → manual action ─
mail.template.pending-exhausted.subject=🧩 Scheduled task work exhausted auto-retry, manual action required
mail.template.pending-exhausted.category=Manual Action
mail.template.pending-exhausted.eyebrow=PENDING EXHAUSTED
mail.template.pending-exhausted.heading=🧩 A work has exhausted automatic retries
mail.template.pending-exhausted.body-para1=A work belonging to the scheduled task below still fails after several automatic retries and has reached the "pending retry limit" (schedule.pending-max-attempts). The system will not retry it automatically anymore and is waiting for administrator action.
mail.template.pending-exhausted.body-para2=Open the "🧩 Pending retries" panel for that task on the "Scheduled Tasks" page to review the details. Click "Clear" to remove the work from the isolation table once you confirm it is unrecoverable; if you believe the issue is transient, after clearing, the next discovery loop will re-isolate and retry if the work shows up again.
mail.template.pending-exhausted.info-card.label=Details
mail.template.pending-exhausted.info-card.task=Task name
mail.template.pending-exhausted.info-card.task-id=Task ID
mail.template.pending-exhausted.info-card.work=Work
mail.template.pending-exhausted.info-card.link=Work link
mail.template.pending-exhausted.info-card.attempts=Retry attempts
mail.template.pending-exhausted.info-card.trigger-time=Triggered at
mail.template.pending-exhausted.note.label=Last failure:
mail.template.pending-exhausted.note.text=Below is an excerpt of the most recent failure reason (redacted, contains no credentials).

# ── degraded-anonymous: unavailable credential revoked and restricted capability continued (published id retained) ──
mail.template.degraded-anonymous.subject=ℹ️ Scheduled task credential revoked; continuing with restricted capability
mail.template.degraded-anonymous.category=Restricted Continuation
mail.template.degraded-anonymous.eyebrow=CREDENTIAL REVOKED
mail.template.degraded-anonymous.heading=ℹ️ Run succeeded with restricted capability
mail.template.degraded-anonymous.body-para1=The optional credential bound to the scheduled task below became unavailable. The system revoked the task's credential binding and continued with the restricted capability allowed by the source policy; this run completed successfully.
mail.template.degraded-anonymous.body-para2=The task will keep running with restricted capability. To restore full capability, rebind a valid credential using the method supplied by the source plugin on the "Scheduled Tasks" page.
mail.template.degraded-anonymous.info-card.label=Details
mail.template.degraded-anonymous.info-card.task=Task name
mail.template.degraded-anonymous.info-card.task-id=Task ID
mail.template.degraded-anonymous.note.label=Note:
mail.template.degraded-anonymous.note.text=The source plugin defines the exact restricted capability; this email contains no credential material.

# ── run-failed: whole run failed (non-auth exception) ────────────────
mail.template.run-failed.subject=❌ Scheduled task run failed
mail.template.run-failed.category=Run Failed
mail.template.run-failed.eyebrow=RUN FAILED
mail.template.run-failed.heading=❌ Scheduled task run failed
mail.template.run-failed.body-para1=The scheduled task below failed during this run and could not finish discovery/downloading. The system will retry automatically on the next schedule cycle, no manual action required.
mail.template.run-failed.body-para2=If it keeps failing, check the task configuration, network/proxy and Pixiv availability on the "Scheduled Tasks" page. This notification is sent once when the status changes from non-failed to failed; consecutive failures will not spam you.
mail.template.run-failed.info-card.label=Details
mail.template.run-failed.info-card.task=Task name
mail.template.run-failed.info-card.task-id=Task ID
mail.template.run-failed.info-card.fail-time=Failed at
mail.template.run-failed.note.label=Failure reason:
mail.template.run-failed.note.text=Below is an excerpt of this run's failure reason (redacted, contains no credentials).

# ── run-summary: run succeeded with new downloads ───────────────────
mail.template.run-summary.subject=✅ Scheduled task finished, {{completed}} new download(s)
mail.template.run-summary.category=Run Summary
mail.template.run-summary.eyebrow=RUN SUMMARY
mail.template.run-summary.heading=✅ Scheduled task finished
mail.template.run-summary.body-para1=The scheduled task below ran successfully and downloaded some new works.
mail.template.run-summary.body-para2=The task will keep running on its schedule; the next scheduled run is shown below.
mail.template.run-summary.info-card.label=Details
mail.template.run-summary.info-card.task=Task name
mail.template.run-summary.info-card.task-id=Task ID
mail.template.run-summary.note.label=Note:
mail.template.run-summary.note.text=This is a run-summary notification, sent only when the run produced new downloads; runs with nothing new send no email.

# ── Push-medium Markdown templates ───────────────────────────────────
push.message.overuse-paused.title=⚠️ Credential policy paused scheduled tasks
push.message.overuse-paused.body=The credential policy detected an event for account **{{account_id}}** that requires administrator review, and automatically paused **{{tasks_count}}** scheduled task(s) for that credential account.\n\n- Policy event time: {{warning_time}}\n- Paused at: {{trigger_time}}\n\nAffected tasks:\n{{tasks_list_md}}\n\nReview the policy guidance on the "Scheduled Tasks" page and use the recovery action supplied by the source plugin.
push.message.auth-expired.title=🔑 Scheduled task credential unavailable; update required
push.message.auth-expired.body=The source policy marked the credential bound to scheduled task **{{task_name}}** (ID {{task_id}}) as unavailable, and the task was suspended automatically.\n\n- Task type: {{task_type}}\n- Trigger: {{task_trigger}}\n- Suspended at: {{trigger_time}}\n- Recovery: resumes only after updating or rebinding the credential according to its source policy (no automatic retry)\n\nUse the credential action supplied by the source plugin on the "Scheduled Tasks" page; after a successful update, the task resumes and retries isolated works first.
push.message.circuit-breaker.title=🛑 Scheduled task circuit-broken
push.message.circuit-breaker.body=Scheduled task **{{task_name}}** (ID {{task_id}}) failed **{{consecutive_failures}}** times in a row, opened the credential-failure circuit, and was suspended.\n\n- Task type: {{task_type}}\n- Trigger: {{task_trigger}}\n- Suspended at: {{trigger_time}}\n- Recovery: resumes only after updating or rebinding the credential according to its source policy (no automatic retry)\n- Last failure: {{last_error_excerpt}}\n\nReview the failure summary and use the credential action supplied by the source plugin on the "Scheduled Tasks" page.
push.message.pending-exhausted.title=🧩 Work exhausted auto-retry, manual action required
push.message.pending-exhausted.body=The {{work_kind}} work **{{work_id}}** in scheduled task **{{task_name}}** (ID {{task_id}}) still fails after **{{attempts}}** automatic retries, so auto-retry has stopped.\n\n- Task type: {{task_type}}\n- Trigger: {{task_trigger}}\n- Work link: {{work_url}}\n- Triggered at: {{trigger_time}}\n- Next scheduled run: {{next_run_time}}\n- Last failure: {{last_error_excerpt}}\n\nOpen the "🧩 Pending retries" panel on the "Scheduled Tasks" page to handle it manually.
push.message.degraded-anonymous.title=ℹ️ Scheduled task credential revoked; continuing with restricted capability
push.message.degraded-anonymous.body=The optional credential bound to scheduled task **{{task_name}}** (ID {{task_id}}) became unavailable. The system revoked the credential binding and continued with the restricted capability allowed by the source policy; this run completed successfully.\n\n- Task type: {{task_type}}\n- Trigger: {{task_trigger}}\n- New downloads this run: {{completed}}\n- Run time: {{trigger_time}}\n- Next scheduled run: {{next_run_time}}\n\nTo restore full capability, rebind a valid credential using the method supplied by the source plugin on the "Scheduled Tasks" page.
push.message.run-failed.title=❌ Scheduled task run failed
push.message.run-failed.body=Scheduled task **{{task_name}}** (ID {{task_id}}) failed this run and could not finish discovery/downloading; it will retry on the next cycle.\n\n- Task type: {{task_type}}\n- Trigger: {{task_trigger}}\n- Failed at: {{trigger_time}}\n- Next scheduled run: {{next_run_time}}\n- Failure reason: {{last_error_excerpt}}\n\nIf it keeps failing, check the configuration and network/proxy on the "Scheduled Tasks" page (sent once when the status turns failed).
push.message.run-summary.title=✅ Scheduled task finished, {{completed}} new download(s)
push.message.run-summary.body=Scheduled task **{{task_name}}** (ID {{task_id}}) ran successfully with **{{completed}}** new download(s).\n\n- Task type: {{task_type}}\n- Trigger: {{task_trigger}}\n- Run time: {{trigger_time}}\n- Next scheduled run: {{next_run_time}}
