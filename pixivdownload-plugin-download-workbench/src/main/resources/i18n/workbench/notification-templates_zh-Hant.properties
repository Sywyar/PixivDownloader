mail.template.run-summary.subject=✅ 排程工作執行完成，新增 {{completed}} 個下載
mail.template.run-summary.category=執行摘要
mail.template.run-summary.eyebrow=RUN SUMMARY
mail.template.run-summary.heading=✅ 排程工作執行完成
mail.template.run-summary.body-para1=以下排程工作本輪執行成功，並下載了若干新作品。
mail.template.run-summary.body-para2=工作將依既定週期繼續執行；下次預定執行時間請查看下方。
mail.template.run-summary.info-card.label=關鍵資訊
mail.template.run-summary.info-card.task=工作名稱
mail.template.run-summary.info-card.task-id=工作 ID
mail.template.run-summary.note.label=說明：
