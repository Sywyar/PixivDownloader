# 排程工作外掛程式擁有的通知範本文案；啟動時會具體化為 mail／push／inbox 的穩定貢獻值。

# ── 排程器主動傳送通知範本的共用文案 ──────────────────────────────────────
mail.template.common.brand=Pixiv 下載助手
mail.template.common.greeting=您好，{{username}}：
mail.template.common.signature=— Pixiv 下載助手團隊
mail.template.common.footer.auto=此郵件由系統自動傳送，請勿直接回覆。
mail.template.common.footer.copyright=© 2026 PixivDownloader · AGPL-3.0 LICENSED
# 共用資訊卡列標籤（工作層級通知共用）
mail.template.common.info-card.type=工作類型
mail.template.common.info-card.trigger=觸發方式
mail.template.common.info-card.next-run=下次預定執行
# 執行成功／降級／摘要類通知共用：本輪新增下載數量 + 執行時間
mail.template.common.info-card.completed=本輪新增下載
mail.template.common.info-card.run-time=執行時間
# 掛起類通知的復原方式列（工作已掛起，不會自動繼續執行，因此不顯示下次執行時間）
mail.template.common.info-card.recovery=復原方式
mail.template.common.recovery.reauthorize=需要在「排程工作」頁面依來源策略更新或重新綁定憑證後才會繼續（不會自動重試）
# ── overuse-paused：憑證策略要求帳戶層級暫停（外部 id 保持相容）──────────
mail.template.overuse-paused.subject=⚠️ 憑證策略已暫停排程工作
mail.template.overuse-paused.category=策略暫停
mail.template.overuse-paused.eyebrow=CREDENTIAL POLICY
mail.template.overuse-paused.heading=⚠️ 憑證策略已暫停同一帳戶的排程工作
mail.template.overuse-paused.body-para1=憑證策略偵測到需要手動確認的帳戶層級事件。為避免在策略風險尚未確認時繼續執行，系統已自動暫停此憑證帳戶下的排程工作。
mail.template.overuse-paused.body-para2=請前往「排程工作」頁面查看策略提示，並使用來源外掛程式提供的復原操作；在確認處理方式前，請保持工作暫停。
mail.template.overuse-paused.info-card.label=關鍵資訊
mail.template.overuse-paused.info-card.account=憑證帳戶
mail.template.overuse-paused.info-card.tasks=受影響的工作數
mail.template.overuse-paused.info-card.task-list=工作清單
mail.template.overuse-paused.info-card.warning-time=策略事件時間
mail.template.overuse-paused.info-card.trigger-time=暫停時間
mail.template.overuse-paused.note.label=策略詳情：
mail.template.overuse-paused.note.text=以下是憑證策略提供的安全摘要，請依來源外掛程式提示決定如何復原。

# ── auth-expired：工作憑證無法使用並掛起（外部 id 保持相容）────────────
mail.template.auth-expired.subject=🔑 排程工作憑證無法使用，需要更新憑證
mail.template.auth-expired.category=憑證無法使用
mail.template.auth-expired.eyebrow=CREDENTIAL UNAVAILABLE
mail.template.auth-expired.heading=🔑 排程工作憑證已無法使用
mail.template.auth-expired.body-para1=以下排程工作綁定的憑證已被來源策略判定為無法使用，系統已自動掛起該工作，避免在憑證問題尚未處理時繼續執行。
mail.template.auth-expired.body-para2=請前往「排程工作」頁面，依來源外掛程式提供的方式更新或重新綁定憑證；處理成功後會自動恢復執行，並優先重試先前被隔離的作品。
mail.template.auth-expired.info-card.label=關鍵資訊
mail.template.auth-expired.info-card.task=工作名稱
mail.template.auth-expired.info-card.task-id=工作 ID
mail.template.auth-expired.info-card.reason=原因
mail.template.auth-expired.info-card.trigger-time=掛起時間
mail.template.auth-expired.reason.credential-unavailable=憑證遭來源策略拒絕或已無法使用
mail.template.auth-expired.note.label=提示：
mail.template.auth-expired.note.text=憑證格式與更新方式由來源外掛程式定義；本郵件不包含任何憑證內容。

# ── circuit-breaker：連續失敗觸發憑證故障熔斷（外部 id 保持相容）────
mail.template.circuit-breaker.subject=🛑 排程工作熔斷掛起（連續失敗 {{consecutive_failures}} 次）
mail.template.circuit-breaker.category=熔斷掛起
mail.template.circuit-breaker.eyebrow=CIRCUIT BREAKER
mail.template.circuit-breaker.heading=🛑 排程工作因連續失敗已熔斷掛起
mail.template.circuit-breaker.body-para1=以下排程工作在同一輪執行中連續多次執行單一工作失敗，已觸發憑證故障熔斷；系統已掛起該工作，避免繼續使用可能無法使用的憑證空跑。
mail.template.circuit-breaker.body-para2=請檢查最近一次失敗摘要，並前往「排程工作」頁面依來源策略更新或重新綁定憑證；處理成功後會自動恢復執行，並優先重試先前被隔離的作品。
mail.template.circuit-breaker.info-card.label=關鍵資訊
mail.template.circuit-breaker.info-card.task=工作名稱
mail.template.circuit-breaker.info-card.task-id=工作 ID
mail.template.circuit-breaker.info-card.failures=連續失敗次數
mail.template.circuit-breaker.info-card.trigger-time=掛起時間
mail.template.circuit-breaker.note.label=最近一次失敗：
mail.template.circuit-breaker.note.text=以下是最近一次失敗的原因摘要（已去識別，不含任何憑證）。

# ── pending-exhausted：單一作品自動重試達上限 → 需要手動處理 ──────────────
mail.template.pending-exhausted.subject=🧩 排程工作作品自動重試已達上限，需要手動處理
mail.template.pending-exhausted.category=需要手動處理
mail.template.pending-exhausted.eyebrow=PENDING EXHAUSTED
mail.template.pending-exhausted.heading=🧩 單一作品自動重試已達上限
mail.template.pending-exhausted.body-para1=以下排程工作中的某個作品經多輪自動重試後仍然失敗，已達到「待重試上限」（schedule.pending-max-attempts），系統不會再自動重試該作品，等待管理員手動介入。
mail.template.pending-exhausted.body-para2=請前往「排程工作」頁面，展開該工作中的「🧩 待重試」面板查看詳情，並依需求操作：確認作品確實無法復原時，按一下「清除」從隔離表中移除；如果認為是暫時性問題，刪除後下次發現循環若再次遇到，會重新隔離並重試。
mail.template.pending-exhausted.info-card.label=關鍵資訊
mail.template.pending-exhausted.info-card.task=工作名稱
mail.template.pending-exhausted.info-card.task-id=工作 ID
mail.template.pending-exhausted.info-card.work=作品
mail.template.pending-exhausted.info-card.link=作品連結
mail.template.pending-exhausted.info-card.attempts=已重試次數
mail.template.pending-exhausted.info-card.trigger-time=觸發時間
mail.template.pending-exhausted.note.label=最近一次失敗：
mail.template.pending-exhausted.note.text=以下是最近一次失敗的原因摘要（已去識別，不含任何憑證）。

# ── degraded-anonymous：撤銷無法使用的憑證並以受限能力繼續（外部 id 保持相容）──
mail.template.degraded-anonymous.subject=ℹ️ 排程工作憑證已撤銷，改用受限能力繼續執行
mail.template.degraded-anonymous.category=受限繼續
mail.template.degraded-anonymous.eyebrow=CREDENTIAL REVOKED
mail.template.degraded-anonymous.heading=ℹ️ 執行成功，已改用受限能力
mail.template.degraded-anonymous.body-para1=以下排程工作綁定的可選憑證已無法使用，系統已撤銷該工作的憑證綁定，並改用來源策略允許的受限能力繼續執行；本輪已成功完成。
mail.template.degraded-anonymous.body-para2=工作將繼續以受限能力執行；如需恢復完整能力，請前往「排程工作」頁面，依來源外掛程式提供的方式重新綁定有效憑證。
mail.template.degraded-anonymous.info-card.label=關鍵資訊
mail.template.degraded-anonymous.info-card.task=工作名稱
mail.template.degraded-anonymous.info-card.task-id=工作 ID
mail.template.degraded-anonymous.note.label=提示：
mail.template.degraded-anonymous.note.text=受限能力的具體範圍由來源外掛程式定義；本郵件不包含任何憑證內容。

# ── run-failed：整輪執行失敗（非驗證類例外） ─────────────────────────
mail.template.run-failed.subject=❌ 排程工作執行失敗
mail.template.run-failed.category=執行失敗
mail.template.run-failed.eyebrow=RUN FAILED
mail.template.run-failed.heading=❌ 排程工作本輪執行失敗
mail.template.run-failed.body-para1=以下排程工作在本輪執行中失敗，未能完成發現／下載。系統會在下一個排程週期自動重試，無需手動介入。
mail.template.run-failed.body-para2=若持續失敗，請前往「排程工作」頁面檢查工作設定、網路／代理伺服器與 Pixiv 可用性。本通知只會在狀態從非失敗轉為失敗時傳送一次，連續失敗不會重複通知。
mail.template.run-failed.info-card.label=關鍵資訊
mail.template.run-failed.info-card.task=工作名稱
mail.template.run-failed.info-card.task-id=工作 ID
mail.template.run-failed.info-card.fail-time=失敗時間
mail.template.run-failed.note.label=失敗原因：
mail.template.run-failed.note.text=以下是本輪失敗的原因摘要（已去識別，不含任何憑證）。

