# ── 推送媒介 Markdown 範本 ───────────────────────────────────────────
push.message.overuse-paused.title=⚠️ 憑證策略已暫停排程工作
push.message.overuse-paused.body=憑證策略偵測到帳戶 **{{account_id}}** 發生需要手動確認的事件，已自動暫停此憑證帳戶下的 **{{tasks_count}}** 個排程工作。\n\n- 策略事件時間：{{warning_time}}\n- 暫停時間：{{trigger_time}}\n\n受影響的工作：\n{{tasks_list_md}}\n\n請前往「排程工作」頁面查看策略提示，並使用來源外掛程式提供的復原操作。
push.message.auth-expired.title=🔑 排程工作憑證無法使用，需要更新憑證
push.message.auth-expired.body=排程工作 **{{task_name}}**（ID {{task_id}}）綁定的憑證已被來源策略判定為無法使用，工作已自動掛起。\n\n- 工作類型：{{task_type}}\n- 觸發方式：{{task_trigger}}\n- 掛起時間：{{trigger_time}}\n- 復原方式：需依來源策略更新或重新綁定憑證後才會繼續（不會自動重試）\n\n請前往「排程工作」頁面使用來源外掛程式提供的憑證操作；處理成功後會自動復原，並優先重試被隔離的作品。
push.message.circuit-breaker.title=🛑 排程工作熔斷掛起
push.message.circuit-breaker.body=排程工作 **{{task_name}}**（ID {{task_id}}）連續失敗 **{{consecutive_failures}}** 次，已觸發憑證故障熔斷並掛起。\n\n- 工作類型：{{task_type}}\n- 觸發方式：{{task_trigger}}\n- 掛起時間：{{trigger_time}}\n- 復原方式：需依來源策略更新或重新綁定憑證後才會繼續（不會自動重試）\n- 最近一次失敗：{{last_error_excerpt}}\n\n請檢查失敗摘要，並前往「排程工作」頁面使用來源外掛程式提供的憑證操作。
push.message.pending-exhausted.title=🧩 作品自動重試已達上限，需要手動處理
push.message.pending-exhausted.body=排程工作 **{{task_name}}**（ID {{task_id}}）中的{{work_kind}}作品 **{{work_id}}** 自動重試 **{{attempts}}** 次後仍然失敗，已停止自動重試。\n\n- 工作類型：{{task_type}}\n- 觸發方式：{{task_trigger}}\n- 作品連結：{{work_url}}\n- 觸發時間：{{trigger_time}}\n- 下次預定執行：{{next_run_time}}\n- 最近一次失敗：{{last_error_excerpt}}\n\n請前往「排程工作」頁面展開「🧩 待重試」面板手動處理。
push.message.degraded-anonymous.title=ℹ️ 排程工作憑證已撤銷，改用受限能力繼續執行
push.message.degraded-anonymous.body=排程工作 **{{task_name}}**（ID {{task_id}}）綁定的可選憑證已無法使用，系統已撤銷憑證綁定，並改用來源策略允許的受限能力繼續執行；本輪已成功完成。\n\n- 工作類型：{{task_type}}\n- 觸發方式：{{task_trigger}}\n- 本輪新增下載：{{completed}}\n- 執行時間：{{trigger_time}}\n- 下次預定執行：{{next_run_time}}\n\n如需恢復完整能力，請前往「排程工作」頁面，依來源外掛程式提供的方式重新綁定有效憑證。
push.message.run-failed.title=❌ 排程工作執行失敗
push.message.run-failed.body=排程工作 **{{task_name}}**（ID {{task_id}}）本輪執行失敗，未能完成發現／下載，將在下一個週期自動重試。\n\n- 工作類型：{{task_type}}\n- 觸發方式：{{task_trigger}}\n- 失敗時間：{{trigger_time}}\n- 下次預定執行：{{next_run_time}}\n- 失敗原因：{{last_error_excerpt}}\n\n若持續失敗，請前往「排程工作」頁面檢查設定與網路／代理伺服器（僅在狀態轉為失敗時通知一次）。
push.message.run-summary.title=✅ 排程工作執行完成，新增 {{completed}} 個下載
push.message.run-summary.body=排程工作 **{{task_name}}**（ID {{task_id}}）本輪執行成功，新增 **{{completed}}** 個下載。\n\n- 工作類型：{{task_type}}\n- 觸發方式：{{task_trigger}}\n- 執行時間：{{trigger_time}}\n- 下次預定執行：{{next_run_time}}
