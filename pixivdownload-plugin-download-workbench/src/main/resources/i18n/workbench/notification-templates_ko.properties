push.message.overuse-paused.title=⚠️ 자격 증명 정책으로 예약 작업이 일시 중지됨
push.message.overuse-paused.body=자격 증명 정책에서 계정 **{{account_id}}**에 수동 확인이 필요한 이벤트가 발생한 것을 감지하여 이 자격 증명 계정의 예약 작업 **{{tasks_count}}**개를 자동으로 일시 중지했습니다.\n\n- 정책 이벤트 시간: {{warning_time}}\n- 일시 중지 시간: {{trigger_time}}\n\n영향받은 작업:\n{{tasks_list_md}}\n\n「예약 작업」 페이지에서 정책 안내를 확인하고 원본 플러그인이 제공하는 복구 작업을 사용하세요.
push.message.auth-expired.title=🔑 예약 작업 자격 증명을 사용할 수 없음, 자격 증명 업데이트 필요
push.message.auth-expired.body=예약 작업 **{{task_name}}**(ID {{task_id}})에 연결된 자격 증명을 원본 정책에서 사용할 수 없는 것으로 판단하여 작업을 자동으로 보류했습니다.\n\n- 작업 유형: {{task_type}}\n- 트리거 방식: {{task_trigger}}\n- 보류 시간: {{trigger_time}}\n- 복구 방식: 원본 정책에 따라 자격 증명을 업데이트하거나 다시 연결해야 계속 실행됩니다(자동으로 재시도하지 않음)\n\n「예약 작업」 페이지에서 원본 플러그인이 제공하는 자격 증명 작업을 사용하세요. 처리가 성공하면 자동으로 재개하고 격리된 작품을 우선 재시도합니다.
push.message.circuit-breaker.title=🛑 예약 작업 회로 차단 보류
push.message.circuit-breaker.body=예약 작업 **{{task_name}}**(ID {{task_id}})이 **{{consecutive_failures}}**회 연속 실패하여 자격 증명 장애 회로 차단을 트리거하고 보류했습니다.\n\n- 작업 유형: {{task_type}}\n- 트리거 방식: {{task_trigger}}\n- 보류 시간: {{trigger_time}}\n- 복구 방식: 원본 정책에 따라 자격 증명을 업데이트하거나 다시 연결해야 계속 실행됩니다(자동으로 재시도하지 않음)\n- 최근 실패: {{last_error_excerpt}}\n\n실패 요약을 확인하고 「예약 작업」 페이지에서 원본 플러그인이 제공하는 자격 증명 작업을 사용하세요.
push.message.pending-exhausted.title=🧩 작품 자동 재시도 한도 도달, 수동 처리 필요
push.message.pending-exhausted.body=예약 작업 **{{task_name}}**(ID {{task_id}})의 {{work_kind}} 작품 **{{work_id}}**이(가) **{{attempts}}**회 자동 재시도 후에도 실패하여 자동 재시도를 중지했습니다.\n\n- 작업 유형: {{task_type}}\n- 트리거 방식: {{task_trigger}}\n- 작품 링크: {{work_url}}\n- 트리거 시간: {{trigger_time}}\n- 다음 예정 실행: {{next_run_time}}\n- 최근 실패: {{last_error_excerpt}}\n\n「예약 작업」 페이지에서 「🧩 재시도 대기」 패널을 펼쳐 수동으로 처리하세요.
push.message.degraded-anonymous.title=ℹ️ 예약 작업 자격 증명이 취소되어 제한된 기능으로 계속 실행됨
push.message.degraded-anonymous.body=예약 작업 **{{task_name}}**(ID {{task_id}})에 연결된 선택적 자격 증명을 사용할 수 없어 시스템이 자격 증명 연결을 취소하고 원본 정책에서 허용하는 제한된 기능으로 계속 실행했습니다. 이번 실행은 성공적으로 완료되었습니다.\n\n- 작업 유형: {{task_type}}\n- 트리거 방식: {{task_trigger}}\n- 이번 실행의 새 다운로드: {{completed}}\n- 실행 시간: {{trigger_time}}\n- 다음 예정 실행: {{next_run_time}}\n\n전체 기능을 복구하려면 「예약 작업」 페이지에서 원본 플러그인이 제공하는 방식으로 유효한 자격 증명을 다시 연결하세요.
push.message.run-failed.title=❌ 예약 작업 실행 실패
push.message.run-failed.body=예약 작업 **{{task_name}}**(ID {{task_id}})이(가) 이번 실행에서 실패하여 발견/다운로드를 완료하지 못했습니다. 다음 주기에 자동으로 재시도합니다.\n\n- 작업 유형: {{task_type}}\n- 트리거 방식: {{task_trigger}}\n- 실패 시간: {{trigger_time}}\n- 다음 예정 실행: {{next_run_time}}\n- 실패 원인: {{last_error_excerpt}}\n\n계속 실패하면 「예약 작업」 페이지에서 설정과 네트워크/프록시를 확인하세요(상태가 실패로 전환될 때만 한 번 알림).
push.message.run-summary.title=✅ 예약 작업 실행 완료, {{completed}}개 다운로드 추가
push.message.run-summary.body=예약 작업 **{{task_name}}**(ID {{task_id}})이(가) 이번 실행을 성공적으로 완료했으며 **{{completed}}**개의 다운로드를 추가했습니다.\n\n- 작업 유형: {{task_type}}\n- 트리거 방식: {{task_trigger}}\n- 실행 시간: {{trigger_time}}\n- 다음 예정 실행: {{next_run_time}}
