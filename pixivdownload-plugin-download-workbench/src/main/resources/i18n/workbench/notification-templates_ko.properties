mail.template.pending-exhausted.body-para1=다음 예약 작업의 작품 하나가 여러 차례 자동 재시도 후에도 실패하여 「재시도 대기 한도」(schedule.pending-max-attempts)에 도달했습니다. 시스템은 이 작품의 자동 재시도를 중지하고 관리자의 수동 처리를 기다립니다.
mail.template.pending-exhausted.body-para2=「예약 작업」 페이지에서 해당 작업의 「🧩 재시도 대기」 패널을 펼쳐 세부 정보를 확인하고 필요에 따라 처리하세요. 작품을 복구할 수 없다고 판단되면 「지우기」를 눌러 격리 표에서 제거하고, 일시적인 문제라고 판단되면 삭제하세요. 다음 발견 주기에서 다시 발견되면 다시 격리하고 재시도합니다.
