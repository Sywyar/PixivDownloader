schema.DownloadSubmission.artwork.field.options.field.pages=페이지 지정은 권장하지 않습니다. 특정 페이지만 필요한 경우를 제외하고는 pages를 생략해 작품 전체를 다운로드하세요. 정지 이미지의 원래 페이지 번호는 0부터 시작하며 쉼표로 구분합니다. 예를 들어 0,2는 첫 번째와 세 번째 페이지를 뜻합니다. 페이지를 추가할 때는 기존 폴더와 출력 설정을 사용하세요. 서버는 원본과 저장 파일을 확인한 뒤 모든 페이지가 모이면 작품을 등록합니다. 등록된 작품을 덮어쓰려면 전체 작품을 다운로드하세요.
schema.DownloadSubmission.artwork.description=**페이지 선택.** 특정 페이지만 필요한 경우를 제외하고 `options.pages`를 생략해 작품 전체를 다운로드하세요. 서버가 Pixiv에서 작품 정보와 순서가 있는 전체 원본 URL 목록을 가져옵니다. 정지 이미지와 만화에 `"0,2"`를 지정하면 원래 페이지 번호와 파일명으로 첫째·셋째 페이지를 저장합니다. 빈 문자열, 중복, 공백, 앞자리 0, 음수, 범위 밖 번호, 애니메이션에 대한 페이지 지정은 제출 시 422 `DOWNLOAD_TASK_REJECTED`로 거부됩니다. 모든 페이지를 명시하거나 단일 페이지 작품에 `"0"`을 지정해도 선택 다운로드입니다. 이미 전체가 등록된 작품은 `FAILED`와 `OUTPUT_ALREADY_REGISTERED`를 반환합니다.\n\n\
    **이어받기와 검증.** 호환되는 작업은 최초 파일명을 유지합니다. 서버는 페이지 수, 모든 원본 URL과 순서, 제공된 Pixiv 업로드 시각, 폴더, 명시한 파일명 템플릿, 이미지 출력 설정을 비교합니다. 호환되지 않는 선택은 `OUTPUT_LAYOUT_CONFLICT`로 실패합니다. 새 `requestId`로 `pages`를 생략해 다시 구성하세요. 업로드 시각과 URL이 그대로이고 원격 데이터만 바뀌면 감지할 수 없습니다. 기존 페이지를 재사용하기 전에 모든 출력 파일의 길이와 SHA-256을 검증합니다. 파일이 없거나 잘렸거나 같은 길이로 손상되면 그 페이지를 다시 요청할 때 다운로드합니다. `pages`를 생략하면 검증에 실패한 모든 페이지를 받습니다.\n\n\
    **저장과 복구.** 요청한 페이지가 모두 저장되면 작업은 `COMPLETED`가 될 수 있습니다. 미완성 작품의 총 페이지 수, 폴더, 저장 파일은 `GET /api/library/artworks/{artworkId}/partial`로 조회합니다. 모든 페이지가 모이면 라이브러리에 등록됩니다. 호환되지 않는 부분 저장본을 교체할 때는 전체 다운로드가 모든 새 페이지를 임시 저장한 뒤 파일과 데이터베이스 기록을 함께 커밋합니다. 커밋 전 취소, 다운로드 실패, 커밋 실패 시 기존 파일과 페이지 진행 상태가 보존됩니다. 커밋 결과가 불확실하면 서비스가 복구합니다. 일반 이어받기에서도 저장에 성공한 페이지가 남습니다. 한 번의 재구성으로 교체하거나 삭제할 수 있는 대상 파일은 합계 10,000개까지입니다. 한도를 넘으면 기존 부분 저장본이 유지됩니다.\n\n\
    **출력.** 정지 이미지는 기본적으로 원본을 보관합니다. `imageFormats`에 `original`과 원래 형식이 모두 없으면 변환 성공 후 원본을 삭제합니다. 애니메이션은 `ugoiraFormats`로 전체를 출력합니다. 일부 페이지만 성공해도 선택한 Pixiv 북마크나 로컬 컬렉션 추가를 실행할 수 있습니다. 완성된 작품의 폴더는 `GET /api/library/artworks/{artworkId}`에서 확인하고(이동 후 `moveFolder`, 그 외 `folder`), 파일은 `GET /api/downloaded/rawfile/{artworkId}/{page}`로 받습니다. 라이브러리 조회에는 `core:library.read`, 원본 파일 내보내기에는 `core:assets.export`가 필요합니다.
