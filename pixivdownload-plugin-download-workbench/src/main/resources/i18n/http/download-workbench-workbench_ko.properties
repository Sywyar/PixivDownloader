title=다운로드 작업대
BatchStateController.getState.GET.summary=저장된 작업대 상태 조회
BatchStateController.getState.GET.description=solo 모드 전용입니다. state는 마지막으로 저장한 작업대 JSON 객체이며 초기값은 {}입니다.
BatchStateController.getState.GET.success=저장된 작업대 상태.
BatchStateController.saveState.POST.summary=작업대 상태 저장
BatchStateController.saveState.POST.description=solo 전용입니다. {"state":{…}}로 전체 상태를 바꿉니다. state는 JSON 객체여야 하며 성공 응답의 본문은 비어 있습니다.
BatchStateController.saveState.POST.success=작업대 상태를 저장했습니다.
DownloadPageController.select.POST.summary=다운로드 화면 레이아웃 설정
DownloadPageController.select.POST.description=page에 pixiv-batch.html 또는 pixiv-batch-alt.html을 지정합니다. 저장하면 204를 반환하며 다음에 해당 페이지가 열립니다.
DownloadPageController.select.POST.success=다운로드 화면 레이아웃을 저장했습니다.
DownloadProfilesController.read.GET.summary=다운로드 프로필 목록 조회
DownloadProfilesController.read.GET.description=현재 revision과 전체 profiles 목록을 반환합니다. 다음 PUT에 이 revision을 사용하세요.
DownloadProfilesController.read.GET.success=다운로드 프로필.
DownloadProfilesController.save.PUT.summary=다운로드 프로필 저장
DownloadProfilesController.save.PUT.description=GET으로 revision을 읽고 최대 64개 프로필의 전체 배열을 보냅니다. 빈 배열은 모두 삭제합니다. 각 항목에는 고유한 id와 name, settings와 filters 객체가 필요합니다. 이전 revision이면 409입니다.
DownloadProfilesController.save.PUT.success=다운로드 프로필을 저장했습니다.
DownloadStatusController.getDownloadStatus.GET.summary=작품 다운로드 진행률 조회
DownloadStatusController.getDownloadStatus.GET.description=작품 다운로드 진행률과 완료, 실패, 취소 상태를 조회합니다. 조회 가능한 작업이 없으면 HTTP 200과 success=false를 반환합니다. 프로그램에서는 제출 응답의 `Location`(`GET /api/download/tasks/{taskId}`)을 조회하세요. 작품 ID만 알면 `GET /api/download/tasks`에서 `attempt.workType=artwork`이고 `attempt.workId`가 일치하는 항목을 찾습니다. 한 작품에 여러 시도가 있을 수 있으므로 추적할 항목의 `attempt.attemptId`를 `taskId`로 사용하세요.
DownloadStatusController.getDownloadStatus.GET.success=작품 다운로드 진행률.
DownloadStatusController.getActiveDownload.GET.summary=진행 중인 다운로드 조회
DownloadStatusController.getActiveDownload.GET.description=현재 사용자가 볼 수 있는 진행 중인 작품 다운로드 ID를 반환합니다. 관리자는 전체를, 다른 사용자는 자신의 다운로드만 볼 수 있습니다. 프로그램에서는 `GET /api/download/tasks`를 호출하세요. 이 키로 조회 가능한 항목 중 `attempt.workType=artwork`이고 `phase`가 `ACCEPTED`, `QUEUED`, `STARTED`인 항목을 선택합니다.
DownloadStatusController.getActiveDownload.GET.success=진행 중인 다운로드.
DownloadTaskController.downloadPixivImages.POST.summary=Pixiv 작품 다운로드 시작
DownloadTaskController.downloadPixivImages.POST.description=artworkId, title, 페이지 순서의 imageUrls로 비동기 다운로드를 시작합니다. 이미 다운로드한 경우에도 HTTP 200입니다. artworkId로 진행률을 조회하며 경로를 선택해야 하면 409입니다. 프로그램 키를 사용할 때는 POST /api/download/tasks에 workType=artwork를 보내고 202 응답의 Location에서 진행 상황을 확인하세요.
DownloadTaskController.downloadPixivImages.POST.success=Pixiv 작품 다운로드.
LayoutFeedbackStateController.getState.GET.summary=레이아웃 피드백 상태 조회
LayoutFeedbackStateController.getState.GET.description=surveyId의 레이아웃 설문 상태를 조회합니다. solo 모드는 저장 상태와 리비전을, 다른 모드는 설문 식별 정보만 반환합니다.
LayoutFeedbackStateController.getState.GET.success=레이아웃 피드백 상태.
LayoutFeedbackStateController.saveState.POST.summary=레이아웃 피드백 상태 저장
LayoutFeedbackStateController.saveState.POST.description=record_seen에는 pixiv-batch-landscape, pixiv-batch-portrait, pixiv-batch-alt 중 서로 다른 1~3개를 layoutIds에 넣습니다. snooze(7일), never, submitted에는 레이아웃 ID를 보내지 않습니다.
LayoutFeedbackStateController.saveState.POST.success=레이아웃 피드백 상태를 저장했습니다.
SSEController.createSSEConnection.GET.summary=개별 작품 다운로드 이벤트 구독
SSEController.createSSEConnection.GET.description=이 작품의 download-status와 heartbeat를 구독합니다. 연결을 닫아도 다운로드는 계속됩니다. download-status의 data는 JSON입니다. artworkId는 작품, progress는 백분율, completed·failed·cancelled는 종료 상태입니다. heartbeat는 ping이며 sse-closing과 plugin-unavailable은 종료 알림입니다. totalImages가 양수이면 download-status의 progress를 읽으세요. 세션 클라이언트는 기존 상태 API에서 progressPercentage를 읽습니다. 프로그램 키는 GET /api/download/tasks 또는 GET /api/download/tasks/{taskId}에서 phase와 null일 수 있는 progress(unit, completed, total)를 조회하세요. success는 이벤트의 성공 여부이므로 작업 실패나 취소 시에도 true일 수 있습니다.
SSEController.createSSEConnection.GET.success=개별 작품 다운로드 이벤트.
SSEController.createAggregatedSSEConnection.GET.summary=통합 다운로드 이벤트 구독
SSEController.createAggregatedSSEConnection.GET.description=aggregated-ready에서 구독 토큰을 읽습니다. download-status는 진행 상황을, heartbeat는 연결 유지 신호를 보냅니다. 이 토큰으로 구독을 닫습니다. download-status의 data는 JSON입니다. artworkId는 작품, progress는 백분율, completed·failed·cancelled는 종료 상태입니다. heartbeat는 ping이며 sse-closing과 plugin-unavailable은 종료 알림입니다. totalImages가 양수이면 download-status의 progress를 읽으세요. 세션 클라이언트는 기존 상태 API에서 progressPercentage를 읽습니다. 프로그램 키는 GET /api/download/tasks 또는 GET /api/download/tasks/{taskId}에서 phase와 null일 수 있는 progress(unit, completed, total)를 조회하세요. success는 이벤트의 성공 여부이므로 작업 실패나 취소 시에도 true일 수 있습니다.
SSEController.createAggregatedSSEConnection.GET.success=통합 다운로드 이벤트.
SSEController.closeSSEConnection.POST.summary=개별 작품 이벤트 구독 종료
SSEController.closeSSEConnection.POST.description=이 작품의 이벤트 연결을 닫습니다. 다운로드 자체를 중지하려면 다운로드 취소 API를 호출하세요.
SSEController.closeSSEConnection.POST.success=개별 작품 이벤트 구독을 닫았습니다.
SSEController.closeAggregatedSSEConnection.POST.summary=통합 이벤트 구독 종료
SSEController.closeAggregatedSSEConnection.POST.description=구독을 연 신원으로 aggregated-ready의 token을 보내 집계 스트림을 닫습니다.
SSEController.closeAggregatedSSEConnection.POST.success=통합 이벤트 구독을 닫았습니다.
parameter.artworkId=Pixiv 작품 ID입니다.
parameter.token=작업이나 구독을 만들 때 받은 토큰입니다.
parameter.surveyId=필수 설문 ID입니다. 표준 UUID 또는 영문·숫자·밑줄·하이픈 8~128자를 사용합니다.
schema.top.sywyar.pixivdownload.download.request.LayoutFeedbackCommandRequest.field.surveyId=설문 식별자입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.field.artworkId=Pixiv 작품 ID입니다.
DownloadProfilesController.save.PUT.body=저장할 다운로드 프로필입니다.
LayoutFeedbackStateController.saveState.POST.body=설문 ID, 피드백 작업 및 선택한 레이아웃입니다.
DownloadTaskController.downloadPixivImages.POST.body=작품 ID, 원본 이미지 및 다운로드 옵션입니다.
BatchStateController.saveState.POST.body=저장할 다운로드 작업대 상태입니다.
DownloadPageController.select.POST.body=다운로드 작업대에서 기억할 페이지입니다.
schema.top.sywyar.pixivdownload.download.response.status.DownloadResponse.description=다운로드 제어 요청 결과입니다.
schema.top.sywyar.pixivdownload.download.request.LayoutFeedbackCommandRequest.description=레이아웃 설문에 적용할 작업입니다.
schema.top.sywyar.pixivdownload.download.response.feedback.LayoutFeedbackStateResponse.description=서버가 반환한 현재 레이아웃 설문 상태입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesDescription=Pixiv 시리즈 소개입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesCoverUrl=Pixiv 시리즈 표지 이미지 URL입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.illustType=Pixiv 작품 유형입니다. 0은 일러스트, 1은 만화, 2는 움짤입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.rawMetaJson=다운로드 후 메타데이터 저장에 사용할 Pixiv /ajax/illust/{id} 응답 body 객체의 JSON 문자열입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.processing=같은 작품에서 아직 처리 중인 이미지
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.fileNameTemplate=작품 파일명 템플릿입니다. 사용 가능한 변수는 {downloadVariables}입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.username=사용자 모드 다운로드에 적용할 사용자 이름입니다. 최대 512자입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.acquisitionMode=저장 경로 템플릿을 선택합니다. single-import는 개별 작품, user는 작가 페이지, series는 시리즈 또는 컬렉션, search는 검색 결과, quick은 빠른 다운로드입니다. 생략하거나 해당 템플릿이 비어 있으면 기본 템플릿을 사용합니다. 다운로드할 작품 범위는 그대로입니다. 이전 형식의 요청에서 isUserDownload=true이고 acquisitionMode를 생략하면 user를 사용합니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.pathOverflowAction=경로 길이 초과 시 ASK는 확인 요청, TRUNCATE는 단축, DEFAULT_NAME은 기본 이름 사용, CANCEL은 취소입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.bookmark=true이면 다운로드 중에 Pixiv 북마크에 추가합니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.collectionId=다운로드한 작품을 추가할 로컬 컬렉션 ID입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.imageFormats=정지 이미지에서 보관할 형식입니다. original(기본값), png, jpg, webp 중 중복 없이 쉼표로 구분합니다. 원본이 JPG일 때 webp는 변환 성공 후 로컬 JPG를 삭제하고, original,webp는 두 파일을 모두 보관하며, jpg는 원본 JPG를 보관합니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraFormats=움짤 출력 형식입니다. webp, gif, apng, mp4, zip 중 여러 값을 쉼표로 연결합니다. 기본값은 webp입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaQuality=손실 인코딩 품질입니다. 1~100의 정수이며 기본값은 90입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaWebpLossless=WebP 출력 시 무손실 인코딩을 사용할지 지정합니다. 기본값은 false입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaMaximumEdge=출력 이미지의 긴 변 제한입니다. 0~16383픽셀이며 0이면 원본 크기를 유지합니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isUserDownload=이전 사용자 다운로드 표시입니다. acquisitionMode 생략 시 true이면 user 모드를 사용합니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.authorId=작가의 Pixiv 사용자 ID입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.authorName=Pixiv에서 표시하는 작가 이름입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.xRestrict=Pixiv 연령 등급입니다. 0은 전체, 1은 R-18, 2는 R-18G입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isAi=Pixiv에서 AI 생성 작품으로 표시하는지 여부입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isUgoira=Pixiv 움짤 여부입니다. 프레임과 시간은 ugoiraZipUrl과 ugoiraDelays로 지정합니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraZipUrl=Pixiv가 제공하는 움짤 프레임 ZIP의 URL입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraDelays=ZIP 프레임 순서대로 지정하는 각 프레임의 표시 시간(밀리초)입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.delayMs=페이지 다운로드 간 대기 시간(밀리초)입니다. 기본값은 0입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.description=소개에는 `<br>` 줄바꿈이나 링크 같은 Pixiv HTML이 포함될 수 있습니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.tags=작품과 함께 저장할 Pixiv 태그와 번역입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.fileNames=imageUrls와 같은 페이지 순서의 기본 파일 이름입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.fileNameTimestamp=파일 이름 템플릿을 펼칠 때 사용하는 Unix 타임스탬프(밀리초)입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesId=작품이 속한 Pixiv 시리즈 ID입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesOrder=Pixiv 시리즈 안에서 작품이 차지하는 순서입니다.
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesTitle=Pixiv 시리즈 제목입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.status=처리 상태입니다. running, completed, failed 중 하나입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.phase=이미지 다운로드 또는 변환의 현재 단계입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.outputFormat=현재 생성하는 미디어 출력 형식입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.outputIndex=선택한 출력 형식 중 현재 형식의 번호입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.outputCount=선택한 미디어 출력 형식의 총수입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.imageNumber=현재 처리 중인 이미지 번호입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.totalImages=작품의 이미지 총수입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.downloadedBytes=현재까지 받은 바이트 수입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.totalBytes=예상되는 전체 바이트 수입니다.
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.progress=이 처리의 완료율(%)입니다.
schema.top.sywyar.pixivdownload.download.UgoiraProgress.field.phase=움짤 처리 단계입니다. zip, extract, ffmpeg-waiting, ffmpeg, finalizing 중 하나입니다.
schema.top.sywyar.pixivdownload.download.UgoiraProgress.field.status=처리 상태입니다. running, completed, failed 중 하나입니다.
schema.top.sywyar.pixivdownload.download.UgoiraProgress.field.message=사용자에게 표시할 결과 또는 진행 메시지입니다.
schema.top.sywyar.pixivdownload.download.UgoiraProgress.field.attempt=현재 시도 번호입니다.
schema.top.sywyar.pixivdownload.download.UgoiraProgress.field.maxAttempts=최대 시도 횟수입니다.
