schema.top.sywyar.pixivdownload.download.UgoiraProgress.field.ffmpegDurationMs=인코딩할 전체 미디어 길이(밀리초)입니다.
schema.top.sywyar.pixivdownload.download.UgoiraProgress.field.ffmpegProgress=이 처리의 완료율(%)입니다.
