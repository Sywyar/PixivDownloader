schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.presentationAttributes=用於顯示的作品屬性，值為字串，例如 `ai` 和 `illustType`。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.status=依訂閱語言顯示的狀態文字，例如「連線中」或「進度更新」。判斷下載結果請讀取 `completed`、`failed` 和 `cancelled`。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.message=供使用者閱讀的本地化訊息，說明連線、進度或工作結束的原因。
