schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.xRestrict=Pixiv 年齡分級，0 為全年齡，1 為 R-18，2 為 R-18G。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isAi=作品在 Pixiv 上是否標為 AI 生成。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isUgoira=作品是否為 Pixiv 動圖。動圖的幀和時長由 ugoiraZipUrl 與 ugoiraDelays 提供。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraZipUrl=Pixiv 提供的動圖原始幀 ZIP 地址。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraDelays=動圖各幀的顯示時長，單位毫秒，按 ZIP 中的幀順序排列。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.delayMs=多頁下載的等待時間，單位毫秒，預設 0。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.description=簡介可能包含 Pixiv HTML，例如 `<br>` 換行或連結。
