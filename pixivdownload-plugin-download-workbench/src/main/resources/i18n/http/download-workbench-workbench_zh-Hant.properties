title=下載工作臺
BatchStateController.getState.GET.summary=檢視工作臺儲存的狀態
BatchStateController.getState.GET.description=僅限 solo 模式。state 為最近儲存的工作臺 JSON 物件，初始值為空物件 {}。
BatchStateController.getState.GET.success=工作臺儲存的狀態。
BatchStateController.saveState.POST.summary=儲存工作臺狀態
BatchStateController.saveState.POST.description=僅限 solo。傳送 {"state":{…}} 替換完整狀態。state 必須是 JSON 物件；成功時返回空響應。
BatchStateController.saveState.POST.success=已儲存工作臺狀態。
DownloadPageController.select.POST.summary=設定下載頁面佈局
DownloadPageController.select.POST.description=page 接受 pixiv-batch.html 或 pixiv-batch-alt.html。儲存成功返回 204，下次開啟工作臺時跳轉到所選頁面。
DownloadPageController.select.POST.success=已儲存下載頁面佈局。
DownloadProfilesController.read.GET.summary=列出下載方案
DownloadProfilesController.read.GET.description=返回當前 revision 和完整 profiles 列表。將該 revision 用於下一次 PUT。
DownloadProfilesController.read.GET.success=下載方案。
DownloadProfilesController.save.PUT.summary=儲存下載方案
DownloadProfilesController.save.PUT.description=先 GET 取得 revision，再提交完整的 profiles 陣列，最多 64 項，空陣列清空方案。每項包含唯一 id、name，以及 settings 和 filters 物件。版本過期返回 409。
DownloadProfilesController.save.PUT.success=已儲存下載方案。
DownloadStatusController.getDownloadStatus.GET.summary=檢視作品下載進度
DownloadStatusController.getDownloadStatus.GET.description=讀取該作品下載的進度和完成、失敗或取消狀態。找不到可見任務時返回 HTTP 200 和 success=false。 程式應輪詢提交回執的 `Location`（`GET /api/download/tasks/{taskId}`）。只有作品 ID 時，透過 `GET /api/download/tasks` 尋找 `attempt.workType=artwork` 且 `attempt.workId` 相符的可見記錄。同一作品可以有多次嘗試，`taskId` 取自所需記錄的 `attempt.attemptId`。
DownloadStatusController.getDownloadStatus.GET.success=作品下載進度。
DownloadStatusController.getActiveDownload.GET.summary=檢視活動下載
DownloadStatusController.getActiveDownload.GET.description=返回當前身份可檢視的進行中作品下載 ID，管理員可檢視全部，其他使用者僅能檢視自己的下載。 程式使用 `GET /api/download/tasks`，在該金鑰可見的任務中選取 `attempt.workType=artwork` 且 `phase` 為 `ACCEPTED`、`QUEUED` 或 `STARTED` 的項目。
DownloadStatusController.getActiveDownload.GET.success=活動下載。
DownloadTaskController.downloadPixivImages.POST.summary=提交Pixiv 作品下載
DownloadTaskController.downloadPixivImages.POST.description=以 artworkId、title 和按頁排列的 imageUrls 啟動非同步下載。HTTP 200 也可能表示作品已下載；啟動後按 artworkId 查詢進度，路徑需要選擇時返回 409。 使用程式金鑰時，向 POST /api/download/tasks 提交 workType=artwork，再輪詢 202 回應的 Location。
DownloadTaskController.downloadPixivImages.POST.success=Pixiv 作品下載。
LayoutFeedbackStateController.getState.GET.summary=檢視佈局反饋狀態
LayoutFeedbackStateController.getState.GET.description=按 surveyId 讀取佈局反饋狀態。solo 模式返回撥查狀態和修訂號，其他模式只提供調查身份。
LayoutFeedbackStateController.getState.GET.success=佈局反饋狀態。
LayoutFeedbackStateController.saveState.POST.summary=儲存佈局反饋狀態
LayoutFeedbackStateController.saveState.POST.description=command=record_seen 時，layoutIds 接受 1–3 個不重複的佈局標識：pixiv-batch-landscape、pixiv-batch-portrait、pixiv-batch-alt。snooze、never、submitted 均不帶佈局標識；snooze 延後七天。
LayoutFeedbackStateController.saveState.POST.success=已儲存佈局反饋狀態。
SSEController.createSSEConnection.GET.summary=訂閱單幅作品的下載事件
SSEController.createSSEConnection.GET.description=訂閱該作品的 download-status 和 heartbeat 事件。關閉 SSE 只結束監聽，正在進行的下載繼續執行。 download-status 的 data 是 JSON 物件，artworkId 標識作品，progress 為百分比，completed、failed、cancelled 表示最終狀態。heartbeat 的 data 是 ping，sse-closing 和 plugin-unavailable 通知訂閱結束。 totalImages 大於 0 時，讀取 download-status 的 progress；工作階段用戶端可從舊狀態介面取得 progressPercentage。程式金鑰輪詢 GET /api/download/tasks 或 GET /api/download/tasks/{taskId}，讀取 phase 和可為空的 progress（unit、completed、total）。success 表示事件成功送出，任務失敗或取消時也可能是 true。
SSEController.createSSEConnection.GET.success=單幅作品的下載事件。
SSEController.createAggregatedSSEConnection.GET.summary=訂閱彙總下載事件
SSEController.createAggregatedSSEConnection.GET.description=從 aggregated-ready 事件讀取本次訂閱令牌。download-status 推送進度，heartbeat 保活。關閉訂閱時使用該令牌。 download-status 的 data 是 JSON 物件，artworkId 標識作品，progress 為百分比，completed、failed、cancelled 表示最終狀態。heartbeat 的 data 是 ping，sse-closing 和 plugin-unavailable 通知訂閱結束。 totalImages 大於 0 時，讀取 download-status 的 progress；工作階段用戶端可從舊狀態介面取得 progressPercentage。程式金鑰輪詢 GET /api/download/tasks 或 GET /api/download/tasks/{taskId}，讀取 phase 和可為空的 progress（unit、completed、total）。success 表示事件成功送出，任務失敗或取消時也可能是 true。
SSEController.createAggregatedSSEConnection.GET.success=彙總下載事件。
SSEController.closeSSEConnection.POST.summary=關閉單幅作品的事件訂閱
SSEController.closeSSEConnection.POST.description=關閉該作品的事件連線；取消下載請呼叫下載取消介面。
SSEController.closeSSEConnection.POST.success=已關閉單幅作品的事件訂閱。
SSEController.closeAggregatedSSEConnection.POST.summary=關閉彙總事件訂閱
SSEController.closeAggregatedSSEConnection.POST.description=傳入 aggregated-ready 返回的 token，使用建立訂閱時的身份關閉彙總流。
SSEController.closeAggregatedSSEConnection.POST.success=已關閉彙總事件訂閱。
parameter.artworkId=Pixiv 作品 ID。
parameter.token=建立操作或訂閱時返回的令牌。
