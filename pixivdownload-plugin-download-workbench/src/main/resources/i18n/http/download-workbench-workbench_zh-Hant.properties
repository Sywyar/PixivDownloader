schema.DownloadSubmission.artwork.field.options.field.pages=不建議指定頁碼。除非只需要部分頁面，請省略 pages，下載完整作品。靜態圖片的原始頁碼從 0 開始，以逗號分隔。例如 0,2 會下載第 1 和第 3 頁。補頁時請沿用原目錄與輸出設定。服務會核對來源和已儲存的檔案，所有頁面到齊後才登錄作品。已登錄的作品只能透過完整下載覆寫。
schema.DownloadSubmission.artwork.description=**選頁。** 非必要時請省略 `options.pages`，下載完整作品。服務端會先向 Pixiv 取得作品資訊和完整的原圖清單。靜態插畫或漫畫可傳 `"0,2"` 下載第 1、3 頁，沿用原頁碼和檔名。空字串、重複、空格、前導零、負數、超出範圍的頁碼，以及對動圖指定頁碼都會在提交時回傳 422 `DOWNLOAD_TASK_REJECTED`。明列所有頁碼仍屬選頁，單頁作品傳 `"0"` 也一樣。對已完整入庫的作品選頁會得到 `FAILED` 與 `OUTPUT_ALREADY_REGISTERED`。\n\n\
    **續傳與校驗。** 相容的工作沿用第一次選頁的檔名。服務端比對頁數、全部原圖 URL 及順序、Pixiv 上傳時間（若有）、資料夾、明確指定的檔名範本與影像輸出設定。不相容時選頁工作會回報 `OUTPUT_LAYOUT_CONFLICT`，請使用新的 `requestId` 並省略 `pages` 重建。若 Pixiv 保持上傳時間及 URL 不變，只更換遠端檔案的內容，續傳無法辨識。重用本機頁面前會逐一校驗輸出檔案的長度與 SHA-256。缺失、截短或長度相同但已損壞的頁面，會在下次要求該頁時重新下載。省略 `pages` 時會補齊所有未通過校驗的頁面。\n\n\
    **寫入與復原。** 選取的頁面全部儲存後，該工作即可為 `COMPLETED`。缺頁時可用 `GET /api/library/artworks/{artworkId}/partial` 查詢總頁數、資料夾及已儲存的檔案。全部頁面齊備後才登錄作品。若既有選頁與新配置不相容，完整下載會先暫存所有新頁，再一併提交檔案及資料庫記錄。提交前取消、下載或資料庫提交失敗時會保留原檔及選頁進度。提交結果待確認時由服務復原。一般補頁也會保留已成功寫入的頁面。 一次重建的檔案交易最多處理 10,000 個目標檔案（含取代與刪除）。超過上限時保留原選頁。\n\n\
    **輸出。** 靜態圖片預設保留原圖。`imageFormats` 同時省略 `original` 和來源格式時，轉換成功後會刪除原圖。動圖依 `ugoiraFormats` 整部輸出。選頁成功後也可執行選用的 Pixiv 收藏和加入本機收藏夾操作。完整作品以 `GET /api/library/artworks/{artworkId}` 查詢路徑（移動後看 `moveFolder`，其餘看 `folder`），以 `GET /api/downloaded/rawfile/{artworkId}/{page}` 取得檔案。查詢作品庫需要 `core:library.read`，匯出原始檔案需要 `core:assets.export`。
