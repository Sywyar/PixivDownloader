schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.description=單一作品串流和彙總串流中 `download-status` 事件的 JSON 資料。建立連線時只傳送作品 ID、狀態文字、訊息、`success` 和兩個可為空值的媒體進度欄位。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.artworkId=此事件對應的 Pixiv 作品 ID。彙總串流用它區分不同作品的更新。
