schema.top.sywyar.pixivdownload.download.response.status.DownloadResponse.description=下載控制請求的結果。
schema.top.sywyar.pixivdownload.download.request.LayoutFeedbackCommandRequest.description=對佈局問卷執行的操作。
schema.top.sywyar.pixivdownload.download.response.feedback.LayoutFeedbackStateResponse.description=伺服器返回的當前佈局問卷狀態。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesDescription=Pixiv 系列簡介。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesCoverUrl=Pixiv 系列封面圖片地址。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.illustType=Pixiv 作品型別，0 為插畫，1 為漫畫，2 為動圖。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.rawMetaJson=可選字串，內容為 Pixiv /ajax/illust/{id} 的 body 物件序列化後的 JSON，供下載後儲存後設資料。
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.processing=同一作品仍在處理的圖片；只包含一層快照，不重複攜帶傳輸位元組。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.fileNameTemplate=作品檔名模板，可用變數為 {downloadVariables}。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.username=按使用者下載時使用的使用者名稱稱，最多 512 個字元。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.acquisitionMode=來源與目錄範本：single-import 單一作品匯入，user 作者頁面，series 系列或收藏集，search 搜尋結果，quick 快速下載。省略或對應範本為空時使用預設目錄範本。此值不會改變提交的作品範圍。 舊版呼叫若指定 isUserDownload=true 並省略 acquisitionMode，會採用 user。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.pathOverflowAction=路徑過長時執行的操作。ASK 詢問，TRUNCATE 截短，DEFAULT_NAME 使用預設名稱，CANCEL 取消。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.bookmark=設為 true，在下載流程中向 Pixiv 新增書籤。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.collectionId=下載後收錄此作品的本地收藏夾 ID。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.imageFormats=靜態圖片最終保留的格式，可用 original、png、jpg、webp，多個值用逗號分隔且不能重複。預設 original。對於 JPG 來源，webp 在轉換成功後刪除本機 JPG，original,webp 保留兩份，jpg 保留來源 JPG。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraFormats=動圖輸出格式，多個值以逗號連線。可用 webp、gif、apng、mp4、zip，預設 webp。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaQuality=有損媒體編碼質量，整數 1–100，預設 90。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaWebpLossless=指定 WebP 輸出是否採用無損編碼，預設 false。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaMaximumEdge=輸出最長邊的畫素上限，0 保留原始尺寸，可取 0–16383。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isUserDownload=舊版使用者下載標記。未提供 acquisitionMode 且本項為 true 時按 user 模式處理。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.authorId=畫師的 Pixiv 使用者 ID。
