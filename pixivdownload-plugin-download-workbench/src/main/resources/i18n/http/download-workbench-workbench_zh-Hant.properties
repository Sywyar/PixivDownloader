schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesId=作品所屬 Pixiv 系列 ID。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesOrder=作品在該 Pixiv 系列中的順序。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesTitle=Pixiv 系列標題。
