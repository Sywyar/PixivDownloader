title=Pixiv 插畫
AuthorBatchController.create.POST.summary=下載一位 Pixiv 作者的作品
AuthorBatchController.create.POST.description=依作者 ID 提交背景下載。預設下載插畫、漫畫和動圖，小說請用 `kind=novel`。
AuthorBatchController.create.POST.details=作者 ID 須為正整數。無須請求本文或 `activationToken`，伺服器會選取目前的 `user-new` 來源。程式金鑰需要 `core:batches.create`、`download-workbench:batches.execute` 和對應作品執行器的 `batches.execute`。插畫和小說採用各自的預設目錄範本。要使用作者目錄範本，請在一般批次的 `source` 傳入 `acquisitionMode=user` 和 `username`。\n\n\
    `202` 表示已受理。背景工作接著會向 Pixiv 取得目前身分可見的作者作品，依類型處理。本機已完成的作品可略過。提交時若本機來源不存在或提供者不符，會回傳 HTTP `404` 和 `batch.not-found`。若向 Pixiv 查詢作者時收到 404（例如已退會或 ID 不存在），以 `GET` 輪詢 `Location` 會取得 `state=FAILED`、`code=schedule.pixiv.discovery-not-found`。 請確認作者 ID 正確，且目前的帳號能查看該作者。\n\n\
    使用 `core:batches.read` 讀取批次和 `/items`。若探索作者失敗，可能沒有任何作品項目，請查看批次的 `code`。`resume` 可重新掃描來源，`retry` 只會重試已發現的項目。暫停、取消、刪除與容量限制沿用 `POST /api/download/batches`。
AuthorBatchController.create.POST.parameter.userId=請以十進位字串傳入作者的 Pixiv 使用者 ID，範圍為 1 到 9223372036854775807。提交批次時會移除前置零。
AuthorBatchController.create.POST.parameter.kind=illust 代表插畫、漫畫和動圖，novel 代表小說。省略時採用 illust。
AuthorBatchController.create.POST.success=已受理批次的 UUID。
AuthorBatchController.create.POST.response.400=作者 ID、作品類型或擷取憑證標頭無效。
AuthorBatchController.create.POST.response.404=提交時找不到本機 user-new 來源，或來源提供者不符（batch.not-found）。作者是否存在由背景工作查詢。
AuthorBatchController.create.POST.response.409=已有批次或應用程式正在停止。請先停止並刪除先前的批次。
schema.top.sywyar.pixivdownload.download.controller.AuthorBatchController.Receipt.field.id=已受理批次的 UUID。
PixivProxyController.getUserArtworks.GET.summary=列出作者的 Pixiv 作品
PixivProxyController.getUserArtworks.GET.description=返回該作者的作品 ID，按數值從大到小排列。需要卡片時將所選 ID 傳給同一作者的 cards 介面。
PixivProxyController.getUserArtworks.GET.success=作者的 Pixiv 作品。
PixivProxyController.getUserRequestArtworks.GET.summary=列出作者的約稿作品
PixivProxyController.getUserRequestArtworks.GET.description=返回該作者已完成並公開的約稿作品 ID。可透過 illust-cards 批次讀取對應卡片。
PixivProxyController.getUserRequestArtworks.GET.success=作者的約稿作品。
PixivProxyController.getArtworkMeta.GET.summary=檢視插畫後設資料
PixivProxyController.getArtworkMeta.GET.description=返回可見作品的 Pixiv 後設資料。原圖地址列表和動圖幀資訊分別透過同一作品的 pages 和 ugoira 介面取得。
PixivProxyController.getArtworkMeta.GET.success=插畫後設資料。
PixivProxyController.getArtworkPages.GET.summary=列出插畫分頁
PixivProxyController.getArtworkPages.GET.description=依 Pixiv 頁序傳回 i.pximg.net 的原圖 URL。直接 GET 可能收到 403。請求圖片時使用 Referer: https://www.pixiv.net/artworks/{artworkId}。程式金鑰僅用於本服務。要讓伺服器下載作品可直接呼叫 POST /api/download/tasks。
PixivProxyController.getArtworkPages.GET.success=插畫分頁。
PixivProxyController.getUgoiraMeta.GET.summary=檢視動圖幀資訊
PixivProxyController.getUgoiraMeta.GET.description=用於動圖作品。返回幀 ZIP 地址和逐幀延時，供還原播放順序與速度。
PixivProxyController.getUgoiraMeta.GET.success=動圖幀資訊。
PixivProxyController.searchArtworks.GET.summary=搜尋Pixiv 插畫
PixivProxyController.searchArtworks.GET.description=word 為關鍵詞，頁碼從 1 開始。order 支援 date_d、date、popular_d，mode 支援 all、safe、r18，sMode 支援 s_tag、s_tc。範圍查詢以每頁 60 筆估算，實際筆數由 Pixiv 決定，無法指定 pageSize。total 是 Pixiv 回報的作品數。
PixivProxyController.searchArtworks.GET.success=Pixiv 插畫。
PixivProxyController.rangeSearchArtworks.GET.summary=搜尋指定範圍的插畫
PixivProxyController.rangeSearchArtworks.GET.description=按閉區間抓取搜尋頁，並按作品 ID 去重。響應區分 requestedPages、acceptedPages 和 fetchedPages；到達 Pixiv 最後一頁可能提前結束。 本介面按每頁 60 筆估算末頁，單頁實際回傳的筆數可能不同。
PixivProxyController.rangeSearchArtworks.GET.success=指定範圍的插畫。
PixivProxyController.getSeries.GET.summary=檢視Pixiv 插畫系列
PixivProxyController.getSeries.GET.description=按 Pixiv 系列 ID 讀取系列資料及指定頁的作品。頁碼從 1 開始。
PixivProxyController.getSeries.GET.success=Pixiv 插畫系列。
PixivProxyController.getUserIllustCards.GET.summary=列出作者的插畫卡片
PixivProxyController.getUserIllustCards.GET.description=傳入同一作者的 ids 列表，例如 ids=123&ids=456。結果按請求的 ID 順序排列。
PixivProxyController.getUserIllustCards.GET.success=作者的插畫卡片。
PixivProxyController.getMyIllustBookmarks.GET.summary=列出當前賬號收藏的插畫
PixivProxyController.getMyIllustBookmarks.GET.description=需要能識別當前 Pixiv 使用者的採集憑據，否則返回 400 ACQUISITION_CREDENTIAL_REQUIRED。rest=show 獲取公開項，hide 獲取非公開項。offset 從 0 開始，limit 限定為 1–100。
PixivProxyController.getMyIllustBookmarks.GET.success=當前賬號收藏的插畫。
PixivProxyController.getMyFollowing.GET.summary=列出當前賬號關注的作者
PixivProxyController.getMyFollowing.GET.description=需要能識別當前 Pixiv 使用者的採集憑據，否則返回 400 ACQUISITION_CREDENTIAL_REQUIRED。rest=show 獲取公開項，hide 獲取非公開項。offset 從 0 開始，limit 限定為 1–100。
PixivProxyController.getMyFollowing.GET.success=當前賬號關注的作者。
PixivProxyController.getMyFollowLatest.GET.summary=列出關注作者的新作
PixivProxyController.getMyFollowLatest.GET.description=按 p 從第 1 頁起查詢當前 Pixiv 賬號的關注新作。響應中的 hasNext 表示是否可繼續翻頁。
PixivProxyController.getMyFollowLatest.GET.success=關注作者的新作。
PixivProxyController.getMyCollections.GET.summary=列出當前賬號的 Pixiv 收藏集
PixivProxyController.getMyCollections.GET.description=讀取採集憑據對應賬號的 Pixiv 珍藏集 ID 和摘要。使用返回的 ID 查詢 /api/pixiv/me/collection/{collectionId}/works。
PixivProxyController.getMyCollections.GET.success=當前賬號的 Pixiv 收藏集。
PixivProxyController.getMyCollectionWorks.GET.summary=列出Pixiv 收藏集中的作品
PixivProxyController.getMyCollectionWorks.GET.description=collectionId 來自 GET /api/pixiv/me/collections。使用同一 Pixiv 賬號的採集憑據，返回該珍藏集內的作品。
PixivProxyController.getMyCollectionWorks.GET.success=Pixiv 收藏集中的作品。
parameter.userId=作者的 Pixiv 使用者 ID。
parameter.X-Acquisition-Credential=請求 Pixiv 上游時使用的 Pixiv 會話 Cookie。可選，檢視賬號專屬內容時需要。去除首尾空白後最多 16384 字元。 公開查詢成功不代表 Cookie 的有效期已獲驗證。 一般單憑據代理請求若被 Pixiv 以 401 或 403 拒絕，本服務回傳 502 error.pixiv.upstream.unauthorized。
parameter.seriesId=作品或小說系列的 ID。
parameter.word=Pixiv 搜尋關鍵詞。
parameter.mode=搜尋模式支援 all、safe、r18。mode=r18 會原樣傳給 Pixiv。匿名搜尋（沒有有效的 Pixiv Cookie）或帳號隱藏年齡限制作品時，上游可能回傳全年齡作品或空結果。請依各項的 xRestrict 判斷分級（0 全年齡、1 R-18、2 R-18G）。
parameter.sMode=Pixiv 匹配搜尋詞的方式。
parameter.startPage=搜尋範圍的起始頁。
parameter.endPage=搜尋範圍的結束頁。
parameter.rest=當前賬號條目的 Pixiv 公開範圍篩選條件。
parameter.tag=篩選列表時使用的收藏標籤。
parameter.p=要返回的新作頁碼。
parameter.collectionId=所選收藏夾或收藏集的 ID。
parameter.artworkId=Pixiv 作品 ID。 傳入 1 至 19 位十進位數字，數值須為有號 64 位正整數。
