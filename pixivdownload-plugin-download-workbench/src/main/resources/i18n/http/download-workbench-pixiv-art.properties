PixivProxyController.getMyFollowLatest.GET.summary=列出关注作者的新作
PixivProxyController.getMyFollowLatest.GET.description=按 p 从第 1 页起查询当前 Pixiv 账号的关注新作。响应中的 hasNext 表示是否可继续翻页。
PixivProxyController.getMyFollowLatest.GET.success=关注作者的新作。
PixivProxyController.getMyCollections.GET.summary=列出当前账号的 Pixiv 收藏集
PixivProxyController.getMyCollections.GET.description=读取采集凭据对应账号的 Pixiv 珍藏集 ID 和摘要。使用返回的 ID 查询 /api/pixiv/me/collection/{collectionId}/works。
PixivProxyController.getMyCollections.GET.success=当前账号的 Pixiv 收藏集。
PixivProxyController.getMyCollectionWorks.GET.summary=列出Pixiv 收藏集中的作品
PixivProxyController.getMyCollectionWorks.GET.description=collectionId 来自 GET /api/pixiv/me/collections。使用同一 Pixiv 账号的采集凭据，返回该珍藏集内的作品。
PixivProxyController.getMyCollectionWorks.GET.success=Pixiv 收藏集中的作品。
parameter.userId=作者的 Pixiv 用户 ID。
parameter.X-Acquisition-Credential=请求 Pixiv 上游时使用的 Pixiv 会话 Cookie。可选，查看账号专属内容时需要。去除首尾空白后最多 16384 字符。 公开查询成功并不验证 Cookie 有效期。 普通单凭据代理请求若被 Pixiv 以 401 或 403 拒绝，本服务返回 502 error.pixiv.upstream.unauthorized。
parameter.seriesId=作品或小说系列的 ID。
parameter.word=Pixiv 搜索关键词。
parameter.mode=搜索模式支持 all、safe、r18。mode=r18 会原样传给 Pixiv。匿名搜索（没有有效的 Pixiv Cookie）或账号隐藏年龄限制作品时，上游可能返回全年龄作品或空结果。请按每项的 xRestrict 判断分级（0 全年龄、1 R-18、2 R-18G）。
parameter.sMode=Pixiv 匹配搜索词的方式。
parameter.startPage=搜索范围的起始页。
parameter.endPage=搜索范围的结束页。
parameter.rest=当前账号条目的 Pixiv 公开范围筛选条件。
parameter.tag=筛选列表时使用的收藏标签。
parameter.p=要返回的新作页码。
parameter.collectionId=所选收藏夹或收藏集的 ID。
parameter.artworkId=Pixiv 作品 ID。 传入 1 至 19 位十进制数字，数值须为有符号 64 位正整数。
