title=Pixiv 插画
AuthorBatchController.create.POST.summary=下载一位 Pixiv 作者的作品
AuthorBatchController.create.POST.description=按作者 ID 提交一次后台下载。默认为插画、漫画和动图，下载小说请传 `kind=novel`。
AuthorBatchController.create.POST.details=路径中的作者 ID 必须为正整数。无需请求体或 `activationToken`，服务端选用当前 `user-new` 来源。程序密钥需有 `core:batches.create`、`download-workbench:batches.execute` 以及对应作品执行器的 `batches.execute`。插画和小说使用各自默认目录模板。要使用作者目录模板，请通过通用批次在 `source` 里传 `acquisitionMode=user` 和 `username`。\n\n\
    `202` 表示已受理。后台随后向 Pixiv 获取该作者对当前身份可见的作品，并按所选类型处理。本地已完成的作品可直接跳过。提交时若本地来源缺失或提供者不匹配，会返回 HTTP `404` 和 `batch.not-found`。若 Pixiv 查询作者时返回 404（例如已退会或 ID 不存在），用 `GET` 轮询 `Location` 会读到 `state=FAILED`、`code=schedule.pixiv.discovery-not-found`。 请核对作者 ID 及当前账号的可见性。\n\n\
    用 `core:batches.read` 查询本批次及 `/items`。发现作者时失败可能没有任何作品条目，这时查看批次的 `code`。`resume` 可重新扫描来源，`retry` 只重试已发现的条目。暂停、取消、删除和容量限制与 `POST /api/download/batches` 共用。
AuthorBatchController.create.POST.parameter.userId=以十进制字符串传入作者的 Pixiv 用户 ID，范围为 1 到 9223372036854775807。提交批次时会移除前导零。
AuthorBatchController.create.POST.parameter.kind=illust 为画作、漫画和动图，novel 为小说。省略时为 illust。
AuthorBatchController.create.POST.success=已受理批次的 UUID。
AuthorBatchController.create.POST.response.400=作者 ID、作品类型或凭据头无效。
AuthorBatchController.create.POST.response.404=提交时找不到本地 user-new 来源或来源提供者不匹配（batch.not-found）。作者是否存在由后台查询。
AuthorBatchController.create.POST.response.409=已有批次或应用正在停止。先停止并删除旧批次。
schema.top.sywyar.pixivdownload.download.controller.AuthorBatchController.Receipt.field.id=已受理批次的 UUID。
PixivProxyController.getUserArtworks.GET.summary=列出作者的 Pixiv 作品
PixivProxyController.getUserArtworks.GET.description=返回该作者的作品 ID，按数值从大到小排列。需要卡片时将所选 ID 传给同一作者的 cards 接口。
PixivProxyController.getUserArtworks.GET.success=作者的 Pixiv 作品。
PixivProxyController.getUserRequestArtworks.GET.summary=列出作者的约稿作品
PixivProxyController.getUserRequestArtworks.GET.description=返回该作者已完成并公开的约稿作品 ID。可通过 illust-cards 批量读取对应卡片。
PixivProxyController.getUserRequestArtworks.GET.success=作者的约稿作品。
PixivProxyController.getArtworkMeta.GET.summary=查看插画元数据
PixivProxyController.getArtworkMeta.GET.description=返回可见作品的 Pixiv 元数据。原图地址列表和动图帧信息分别通过同一作品的 pages 和 ugoira 接口取得。
PixivProxyController.getArtworkMeta.GET.success=插画元数据。
PixivProxyController.getArtworkPages.GET.summary=列出插画分页
PixivProxyController.getArtworkPages.GET.description=按 Pixiv 页序返回 i.pximg.net 的原图 URL。直接 GET 可能收到 403；请求图片时使用 Referer: https://www.pixiv.net/artworks/{artworkId}。程序密钥仅用于本服务。让服务器下载作品可直接 POST /api/download/tasks。
PixivProxyController.getArtworkPages.GET.success=插画分页。
PixivProxyController.getUgoiraMeta.GET.summary=查看动图帧信息
PixivProxyController.getUgoiraMeta.GET.description=用于动图作品。返回帧 ZIP 地址和逐帧延时，供还原播放顺序与速度。
PixivProxyController.getUgoiraMeta.GET.success=动图帧信息。
PixivProxyController.searchArtworks.GET.summary=搜索Pixiv 插画
PixivProxyController.searchArtworks.GET.description=word 为关键词，页码从 1 开始。order 支持 date_d、date、popular_d，mode 支持 all、safe、r18，sMode 支持 s_tag、s_tc。范围查询时按每页 60 条估算，实际条数由 Pixiv 决定，无法指定 pageSize。total 是 Pixiv 报告的作品数。
PixivProxyController.searchArtworks.GET.success=Pixiv 插画。
PixivProxyController.rangeSearchArtworks.GET.summary=搜索指定范围的插画
PixivProxyController.rangeSearchArtworks.GET.description=按闭区间抓取搜索页，并按作品 ID 去重。响应区分 requestedPages、acceptedPages 和 fetchedPages；到达 Pixiv 最后一页可能提前结束。 本接口按每页 60 条估算末页，单页实际返回的条数可能不同。
PixivProxyController.rangeSearchArtworks.GET.success=指定范围的插画。
PixivProxyController.getSeries.GET.summary=查看Pixiv 插画系列
PixivProxyController.getSeries.GET.description=按 Pixiv 系列 ID 读取系列资料及指定页的作品。页码从 1 开始。
PixivProxyController.getSeries.GET.success=Pixiv 插画系列。
PixivProxyController.getUserIllustCards.GET.summary=列出作者的插画卡片
PixivProxyController.getUserIllustCards.GET.description=传入同一作者的 ids 列表，例如 ids=123&ids=456。结果按请求的 ID 顺序排列。
PixivProxyController.getUserIllustCards.GET.success=作者的插画卡片。
PixivProxyController.getMyIllustBookmarks.GET.summary=列出当前账号收藏的插画
PixivProxyController.getMyIllustBookmarks.GET.description=需要能识别当前 Pixiv 用户的采集凭据，否则返回 400 ACQUISITION_CREDENTIAL_REQUIRED。rest=show 获取公开项，hide 获取非公开项。offset 从 0 开始，limit 限定为 1–100。
PixivProxyController.getMyIllustBookmarks.GET.success=当前账号收藏的插画。
PixivProxyController.getMyFollowing.GET.summary=列出当前账号关注的作者
PixivProxyController.getMyFollowing.GET.description=需要能识别当前 Pixiv 用户的采集凭据，否则返回 400 ACQUISITION_CREDENTIAL_REQUIRED。rest=show 获取公开项，hide 获取非公开项。offset 从 0 开始，limit 限定为 1–100。
