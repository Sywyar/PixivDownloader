schema.DownloadSubmission.artwork.field.options.field.pages=不推荐指定页码，非必要时请省略 pages，下载完整作品。仅需要部分静态图片时，传从 0 开始的原页码，用逗号分隔。例如 0,2 下载第 1 和第 3 页。补页时须沿用原目录和输出设置；服务会校验来源和已有文件，全部页齐备后才登记作品。已入库的作品只能通过完整下载重写。
schema.DownloadSubmission.artwork.description=**选页。** 非必要时请省略 `options.pages`，下载完整作品。服务端先从 Pixiv 读取作品信息和完整原图清单。静态插画或漫画可传 `"0,2"` 下载第 1、3 页，文件沿用原页码和文件名。空串、重复、空格、前导零、负数、越界页码以及给动图指定页码都会在提交时返回 422 `DOWNLOAD_TASK_REJECTED`。显式列出所有页仍是选页，单页作品传 `"0"` 也一样。已完整入库的作品会以 `FAILED` 和 `OUTPUT_ALREADY_REGISTERED` 拒绝选页覆盖。\n\n\
    **补页和校验。** 兼容的任务沿用第一次选页时的文件名。服务端比对页数、所有原图 URL 及顺序、Pixiv 上传时间（若有）、目录、显式文件名模板和图片输出设置。任一项不兼容时，选页任务报告 `OUTPUT_LAYOUT_CONFLICT`，请用新的 `requestId` 省略 `pages` 重建。若 Pixiv 保持上传时间和所有 URL 不变，仅替换远端字节，续传无法识别这一变化。复用本地页前会逐份校验输出文件的长度与 SHA-256。缺失、截短或同长度损坏的页会在下次请求包含它时重新下载。省略 `pages` 时会补齐所有未通过校验的页。\n\n\
    **写入与恢复。** 选中页全部保存后，本次任务即可为 `COMPLETED`。缺页时用 `GET /api/library/artworks/{artworkId}/partial` 查询总页数、目录及已保存文件。只有整作齐备才登记到作品库。已有选页与新布局冲突时，完整下载会先暂存所有新页，再一起发布文件和数据库记录。提交前取消、下载或数据库提交失败时，旧文件和选页进度保留；提交状态待确认时由服务恢复。正常补页会保留已成功写入的页。 重建的一次文件事务最多涉及 10,000 个目标文件（含替换和删除）。超过上限时保留原选页。\n\n\
    **成品。** 静态图默认保留原图。若 `imageFormats` 同时省略 `original` 和源格式，转换成功后会删除原图。动图按 `ugoiraFormats` 整部输出。可选的 Pixiv 收藏和本地收藏夹操作也可在选页成功后执行。完整作品用 `GET /api/library/artworks/{artworkId}` 查目录（移动后看 `moveFolder`，否则看 `folder`），用 `GET /api/downloaded/rawfile/{artworkId}/{page}` 取文件。库查询需要 `core:library.read`，原文件导出需要 `core:assets.export`。
