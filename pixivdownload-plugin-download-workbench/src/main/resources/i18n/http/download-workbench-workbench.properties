title=下载工作台
BatchStateController.getState.GET.summary=查看工作台保存的状态
BatchStateController.getState.GET.description=仅限 solo 模式。state 为最近保存的工作台 JSON 对象，初始值为空对象 {}。
BatchStateController.getState.GET.success=工作台保存的状态。
BatchStateController.saveState.POST.summary=保存工作台状态
BatchStateController.saveState.POST.description=仅限 solo。发送 {"state":{…}} 替换完整状态。state 必须是 JSON 对象；成功时返回空响应。
BatchStateController.saveState.POST.success=已保存工作台状态。
DownloadPageController.select.POST.summary=设置下载页面布局
DownloadPageController.select.POST.description=page 接受 pixiv-batch.html 或 pixiv-batch-alt.html。保存成功返回 204，下次打开工作台时跳转到所选页面。
DownloadPageController.select.POST.success=已保存下载页面布局。
DownloadProfilesController.read.GET.summary=列出下载方案
DownloadProfilesController.read.GET.description=返回当前 revision 和完整 profiles 列表。将该 revision 用于下一次 PUT。
DownloadProfilesController.read.GET.success=下载方案。
DownloadProfilesController.save.PUT.summary=保存下载方案
DownloadProfilesController.save.PUT.description=先 GET 取得 revision，再提交完整的 profiles 数组，最多 64 项，空数组清空方案。每项包含唯一 id、name，以及 settings 和 filters 对象。版本过期返回 409。
DownloadProfilesController.save.PUT.success=已保存下载方案。
DownloadStatusController.getDownloadStatus.GET.summary=查看作品下载进度
DownloadStatusController.getDownloadStatus.GET.description=读取该作品下载的进度和完成、失败或取消状态。找不到可见任务时返回 HTTP 200 和 success=false。 程序应轮询提交回执的 `Location`（`GET /api/download/tasks/{taskId}`）。只有作品 ID 时，通过 `GET /api/download/tasks` 查找 `attempt.workType=artwork` 且 `attempt.workId` 匹配的可见记录。同一作品可以有多次尝试，`taskId` 取所需记录的 `attempt.attemptId`。
DownloadStatusController.getDownloadStatus.GET.success=作品下载进度。
DownloadStatusController.getActiveDownload.GET.summary=查看活动下载
DownloadStatusController.getActiveDownload.GET.description=返回当前身份可查看的进行中作品下载 ID，管理员可查看全部，其他用户仅能查看自己的下载。 程序使用 `GET /api/download/tasks`，在该密钥可见的任务中取 `attempt.workType=artwork` 且 `phase` 为 `ACCEPTED`、`QUEUED` 或 `STARTED` 的记录。
DownloadStatusController.getActiveDownload.GET.success=活动下载。
DownloadTaskController.downloadPixivImages.POST.summary=提交Pixiv 作品下载
DownloadTaskController.downloadPixivImages.POST.description=以 artworkId、title 和按页排列的 imageUrls 启动异步下载。HTTP 200 也可能表示作品已下载；启动后按 artworkId 查询进度，路径需要选择时返回 409。 使用程序密钥时，向 POST /api/download/tasks 提交 workType=artwork，再轮询 202 回执的 Location。
DownloadTaskController.downloadPixivImages.POST.success=Pixiv 作品下载。
LayoutFeedbackStateController.getState.GET.summary=查看布局反馈状态
LayoutFeedbackStateController.getState.GET.description=按 surveyId 读取布局反馈状态。solo 模式返回调查状态和修订号，其他模式只提供调查身份。
LayoutFeedbackStateController.getState.GET.success=布局反馈状态。
LayoutFeedbackStateController.saveState.POST.summary=保存布局反馈状态
LayoutFeedbackStateController.saveState.POST.description=command=record_seen 时，layoutIds 接受 1–3 个不重复的布局标识：pixiv-batch-landscape、pixiv-batch-portrait、pixiv-batch-alt。snooze、never、submitted 均不带布局标识；snooze 延后七天。
LayoutFeedbackStateController.saveState.POST.success=已保存布局反馈状态。
SSEController.createSSEConnection.GET.summary=订阅单幅作品的下载事件
SSEController.createSSEConnection.GET.description=订阅该作品的 download-status 和 heartbeat 事件。关闭 SSE 只结束监听，正在进行的下载继续执行。 download-status 的 data 是 JSON 对象，artworkId 标识作品，progress 为百分比，completed、failed、cancelled 表示最终状态。heartbeat 的 data 是 ping，sse-closing 和 plugin-unavailable 通知订阅结束。 totalImages 大于 0 时，读取 download-status 的 progress；会话客户端从旧状态接口读取 progressPercentage。程序密钥轮询 GET /api/download/tasks 或 GET /api/download/tasks/{taskId}，读取 phase 和可空的 progress（unit、completed、total）。success 表示事件成功发出，任务失败或取消时也可能为 true。
SSEController.createSSEConnection.GET.success=单幅作品的下载事件。
SSEController.createAggregatedSSEConnection.GET.summary=订阅汇总下载事件
SSEController.createAggregatedSSEConnection.GET.description=从 aggregated-ready 事件读取本次订阅令牌。download-status 推送进度，heartbeat 保活。关闭订阅时使用该令牌。 download-status 的 data 是 JSON 对象，artworkId 标识作品，progress 为百分比，completed、failed、cancelled 表示最终状态。heartbeat 的 data 是 ping，sse-closing 和 plugin-unavailable 通知订阅结束。 totalImages 大于 0 时，读取 download-status 的 progress；会话客户端从旧状态接口读取 progressPercentage。程序密钥轮询 GET /api/download/tasks 或 GET /api/download/tasks/{taskId}，读取 phase 和可空的 progress（unit、completed、total）。success 表示事件成功发出，任务失败或取消时也可能为 true。
SSEController.createAggregatedSSEConnection.GET.success=汇总下载事件。
SSEController.closeSSEConnection.POST.summary=关闭单幅作品的事件订阅
SSEController.closeSSEConnection.POST.description=关闭该作品的事件连接；取消下载请调用下载取消接口。
SSEController.closeSSEConnection.POST.success=已关闭单幅作品的事件订阅。
SSEController.closeAggregatedSSEConnection.POST.summary=关闭汇总事件订阅
SSEController.closeAggregatedSSEConnection.POST.description=传入 aggregated-ready 返回的 token，使用创建订阅时的身份关闭汇总流。
SSEController.closeAggregatedSSEConnection.POST.success=已关闭汇总事件订阅。
parameter.artworkId=Pixiv 作品 ID。
parameter.token=创建操作或订阅时返回的令牌。
parameter.surveyId=布局调查标识，使用标准 UUID 或 8–128 个 ASCII 字母、数字、下划线、连字符。
schema.top.sywyar.pixivdownload.download.request.LayoutFeedbackCommandRequest.field.surveyId=问卷标识。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.field.artworkId=Pixiv 作品 ID。
DownloadProfilesController.save.PUT.body=要保存的下载配置档。
LayoutFeedbackStateController.saveState.POST.body=问卷 ID、反馈操作和所选布局。
DownloadTaskController.downloadPixivImages.POST.body=作品 ID、来源图片和下载选项。
BatchStateController.saveState.POST.body=要保存的下载工作台状态。
DownloadPageController.select.POST.body=要在下载工作台中记住的页面。
schema.top.sywyar.pixivdownload.download.response.status.DownloadResponse.description=下载控制请求的结果。
schema.top.sywyar.pixivdownload.download.request.LayoutFeedbackCommandRequest.description=对布局问卷执行的操作。
schema.top.sywyar.pixivdownload.download.response.feedback.LayoutFeedbackStateResponse.description=服务器返回的当前布局问卷状态。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesDescription=Pixiv 系列简介。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesCoverUrl=Pixiv 系列封面图片地址。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.illustType=Pixiv 作品类型，0 为插画，1 为漫画，2 为动图。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.rawMetaJson=可选字符串，内容为 Pixiv /ajax/illust/{id} 的 body 对象序列化后的 JSON，供下载后保存元数据。
schema.top.sywyar.pixivdownload.download.ImageDownloadProgress.field.processing=同一作品仍在处理的图片；只包含一层快照，不重复携带传输字节。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.fileNameTemplate=作品文件名模板，可用变量为 {downloadVariables}。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.username=按用户下载时使用的用户名称，最多 512 个字符。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.acquisitionMode=来源与目录模板：single-import 单作品导入，user 作者主页，series 系列或集合，search 搜索结果，quick 快捷下载。省略或对应模板为空时使用默认目录模板。此值不改变提交的作品范围。 旧调用同时指定 isUserDownload=true 时，省略 acquisitionMode 按 user 处理。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.pathOverflowAction=路径过长时执行的操作。ASK 询问，TRUNCATE 截短，DEFAULT_NAME 使用默认名称，CANCEL 取消。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.bookmark=设为 true，在下载流程中向 Pixiv 添加书签。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.collectionId=下载后收录此作品的本地收藏夹 ID。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.imageFormats=静态图片最终保留的格式，可用 original、png、jpg、webp，多个值用逗号分隔且不能重复。默认 original。对于 JPG 源图，webp 在转换成功后删除本地 JPG，original,webp 保留两份，jpg 保留源 JPG。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraFormats=动图输出格式，多个值以逗号连接。可用 webp、gif、apng、mp4、zip，默认 webp。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaQuality=有损媒体编码质量，整数 1–100，默认 90。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaWebpLossless=指定 WebP 输出是否采用无损编码，默认 false。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaMaximumEdge=输出最长边的像素上限，0 保留原始尺寸，可取 0–16383。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isUserDownload=旧版用户下载标记。未提供 acquisitionMode 且本项为 true 时按 user 模式处理。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.authorId=画师的 Pixiv 用户 ID。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.authorName=作品所属画师在 Pixiv 上的显示名称。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.xRestrict=Pixiv 年龄分级，0 为全年龄，1 为 R-18，2 为 R-18G。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isAi=作品在 Pixiv 上是否标为 AI 生成。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isUgoira=作品是否为 Pixiv 动图。动图的帧和时长由 ugoiraZipUrl 与 ugoiraDelays 提供。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraZipUrl=Pixiv 提供的动图原始帧 ZIP 地址。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraDelays=动图各帧的显示时长，单位毫秒，按 ZIP 中的帧顺序排列。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.delayMs=多页下载的等待时间，单位毫秒，默认 0。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.description=简介可能包含 Pixiv HTML，例如 `<br>` 换行或链接。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.tags=随作品保存的 Pixiv 标签及其翻译。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.fileNames=按页顺序提供的文件基本名，顺序与 imageUrls 对应。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.fileNameTimestamp=用于展开文件名模板的 Unix 时间戳，单位毫秒。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesId=作品所属 Pixiv 系列 ID。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesOrder=作品在该 Pixiv 系列中的顺序。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesTitle=Pixiv 系列标题。
