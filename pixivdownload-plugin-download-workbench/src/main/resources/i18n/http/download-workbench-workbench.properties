schema.top.sywyar.pixivdownload.download.request.LayoutFeedbackCommandRequest.field.layoutIds=record_seen 需要 1 至 3 个不同的布局 ID。其他命令可省略此字段或传空列表。
schema.top.sywyar.pixivdownload.download.response.feedback.LayoutFeedbackStateResponse.field.available=此能力当前是否可用。
