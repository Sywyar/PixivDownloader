schema.top.sywyar.pixivdownload.download.UgoiraProgress.field.ffmpegProgress=该项处理的完成百分比。
schema.top.sywyar.pixivdownload.download.UgoiraProgress.field.outputFormat=当前正在生成的媒体格式。
