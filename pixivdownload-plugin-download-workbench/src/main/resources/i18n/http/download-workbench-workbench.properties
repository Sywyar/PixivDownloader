schema.top.sywyar.pixivdownload.download.response.status.DownloadResponse.field.message=供用户查看的结果或进度说明。
schema.top.sywyar.pixivdownload.download.response.status.DownloadResponse.field.downloadPath=作品下载路径或下载开始时的待定路径提示。
schema.top.sywyar.pixivdownload.download.response.status.DownloadResponse.field.downloadedCount=此下载响应报告的图片或作品数。开始响应为受理数量，进度响应为已处理数量。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.description=单作品流和汇总流中 `download-status` 事件的 JSON 数据。建连通知只包含作品 ID、状态文案、消息、`success` 和两个可为空的媒体进度字段。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.artworkId=本事件对应的 Pixiv 作品 ID。汇总流用它区分不同作品的更新。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.title=作品标题，有下载状态时提供。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.presentationAttributes=用于展示的作品属性，值为字符串，例如 `ai` 和 `illustType`。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.status=按订阅语言显示的状态文案，如“连接中”或“进度更新”。判断下载结果请读取 `completed`、`failed` 和 `cancelled`。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.message=供用户阅读的本地化消息，说明连接、进度或任务结束的原因。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.success=事件本身的成功标记。下载失败或取消时，此值仍可为 `true`。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.currentImageIndex=当前图片在本次请求所选页面中的序号，从 0 开始。没有当前图片时为 -1。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.totalImages=本次请求的图片数。指定页面时只统计所选页面。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.downloadedCount=本次请求中已成功处理的图片数，包含已验证且可复用的页面。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.completed=下载已结束，失败或取消也可为 `true`。判断结果还需查看 `failed` 和 `cancelled`。
