schema.top.sywyar.pixivdownload.download.response.feedback.LayoutFeedbackStateResponse.field.distinctId=当前安装针对本次调查生成的匿名身份标识。
schema.top.sywyar.pixivdownload.download.response.feedback.LayoutFeedbackStateResponse.field.submissionId=此安装在本次调查活动中使用的稳定提交 ID。
