title=Pixiv イラスト
AuthorBatchController.create.POST.summary=Pixiv 作者の作品をダウンロード
AuthorBatchController.create.POST.description=作者 ID を指定してバックグラウンドでダウンロードします。既定はイラスト・漫画・うごイラです。小説には `kind=novel` を指定します。
AuthorBatchController.create.POST.details=作者 ID には正の整数を指定します。本文と `activationToken` は不要で、サーバーが現在の `user-new` を選びます。プログラムキーには `core:batches.create`、`download-workbench:batches.execute` および作品の実行プラグインの `batches.execute` が必要です。作品種別ごとの既定ディレクトリを使用します。作者用テンプレートは通常のバッチの `source` に `acquisitionMode=user` と `username` を指定して使用します。\n\n\
    `202` はバッチの受付を示します。作者の作品はその後 Pixiv に照会し、現在の認証状態で閲覧できる指定種別の作品を処理します。ローカルで完了済みの作品はスキップされることがあります。受付時にローカルの取得元が見つからない場合や提供元が一致しない場合は HTTP `404` と `batch.not-found` が返ります。退会済みや不明な ID などで Pixiv が 404 を返した場合は、`Location` を `GET` すると `state=FAILED`、`code=schedule.pixiv.discovery-not-found` が返ります。 作者 ID と、現在のアカウントでその作者を閲覧できるかを確認してください。\n\n\
    `core:batches.read` でバッチと `/items` を確認します。作者の照会中に失敗し作品が一件もない場合は、バッチの `code` を確認してください。`resume` は取得元を再走査し、`retry` は検出済みの項目だけを再試行します。一時停止・キャンセル・削除・容量制限は `POST /api/download/batches` と共通です。
AuthorBatchController.create.POST.parameter.userId=作者の Pixiv ユーザー ID を、1 から 9223372036854775807 までの 10 進数の文字列で指定します。バッチの登録時に先頭のゼロを取り除きます。
AuthorBatchController.create.POST.parameter.kind=illust はイラスト、漫画、うごイラ、novel は小説を指定します。省略時は illust です。
AuthorBatchController.create.POST.success=受け付けたバッチの UUID。
AuthorBatchController.create.POST.response.400=作者 ID、作品種別、取得用認証ヘッダーのいずれかが無効です。
AuthorBatchController.create.POST.response.404=ローカルの user-new ソースが見つからないか、提供元が一致しません（batch.not-found）。作者の存在は受付後に確認します。
AuthorBatchController.create.POST.response.409=バッチが既に存在するか、アプリが停止中です。以前のバッチを停止して削除してください。
schema.top.sywyar.pixivdownload.download.controller.AuthorBatchController.Receipt.field.id=受け付けたバッチの UUID。
