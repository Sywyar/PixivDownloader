PixivProxyController.getMyFollowLatest.GET.description=p は1始まりです。フォロー中の作者の新着作品を返し、hasNext で次のページの有無を示します。
PixivProxyController.getMyFollowLatest.GET.success=フォロー中の作者の新着作品。
PixivProxyController.getMyCollections.GET.summary=ログイン中のアカウントの Pixiv コレクションの一覧
PixivProxyController.getMyCollections.GET.description=取得用認証情報のアカウントが持つ Pixiv コレクションを返します。内容は返された ID を /api/pixiv/me/collection/{collectionId}/works に渡して取得します。
PixivProxyController.getMyCollections.GET.success=ログイン中のアカウントの Pixiv コレクション。
PixivProxyController.getMyCollectionWorks.GET.summary=Pixiv コレクション内の作品の一覧
PixivProxyController.getMyCollectionWorks.GET.description=GET /api/pixiv/me/collections で取得した collectionId と同じアカウントの取得用認証情報を使って作品を列挙します。
PixivProxyController.getMyCollectionWorks.GET.success=Pixiv コレクション内の作品。
parameter.userId=作者の Pixiv ユーザー ID。
parameter.X-Acquisition-Credential=Pixiv への要求時に使用するセッション Cookie。アカウント固有の情報では必須です。前後空白を除いて最大 16384 文字。 公開情報の取得に成功しても、Cookie の有効期限は確認されません。 単一の認証情報を使うプロキシ要求を Pixiv が 401 または 403 で拒否した場合、本サービスは 502 error.pixiv.upstream.unauthorized を返します。
parameter.seriesId=作品または小説シリーズの ID。
parameter.word=Pixiv の検索キーワード。
parameter.mode=検索モードは all、safe、r18 です。mode=r18 はそのまま Pixiv に送信されます。Pixiv の Cookie を使わず匿名で検索する場合やアカウントが年齢制限作品を非表示にしている場合、全年齢作品が返るか、結果が空になることがあります。各作品の xRestrict（0 は全年齢、1 は R-18、2 は R-18G）で確認してください。
parameter.sMode=Pixiv での検索語の照合方法。
parameter.startPage=検索範囲の開始ページ。
parameter.endPage=検索範囲の終了ページ。
parameter.rest=アカウント内の項目の公開範囲を指定する Pixiv の条件。
parameter.tag=一覧の絞り込みに使うブックマークタグ。
parameter.p=取得する新着作品のページ。
parameter.collectionId=選択したコレクションの ID。
parameter.artworkId=Pixiv の作品 ID。 符号付き 64 ビット整数の正の範囲で、1〜19 桁の十進数字を指定します。
