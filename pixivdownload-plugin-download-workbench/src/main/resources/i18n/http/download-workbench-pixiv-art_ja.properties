PixivProxyController.getUgoiraMeta.GET.success=うごイラのフレーム情報。
PixivProxyController.searchArtworks.GET.summary=Pixiv イラストを検索
PixivProxyController.searchArtworks.GET.description=word に検索語、ページには1以上を指定します。order は date_d、date、popular_d、mode は all、safe、r18、sMode は s_tag、s_tc です。範囲検索では 1 ページ 60 件として見積もります。実際の件数は Pixiv が決めます。pageSize は指定できません。total は Pixiv が返した作品数です。
PixivProxyController.searchArtworks.GET.success=Pixiv イラスト。
PixivProxyController.rangeSearchArtworks.GET.summary=指定範囲のイラストを検索
PixivProxyController.rangeSearchArtworks.GET.description=指定範囲の両端を含めて検索し、作品 ID の重複を除きます。requestedPages、acceptedPages、fetchedPages で要求数、許可数、実取得数が分かります。Pixiv の最終ページで終了します。 最終ページは 1 ページ 60 件として推定します。実際のページごとの件数は変動します。
PixivProxyController.rangeSearchArtworks.GET.success=指定範囲のイラスト。
PixivProxyController.getSeries.GET.summary=Pixiv の作品シリーズを取得
PixivProxyController.getSeries.GET.description=Pixiv のシリーズ ID を使い、シリーズ情報と指定ページの作品を取得します。ページは1始まりです。
PixivProxyController.getSeries.GET.success=Pixiv の作品シリーズ。
