PixivProxyController.getArtworkPages.GET.summary=イラストのページの一覧
PixivProxyController.getArtworkPages.GET.description=Pixiv のページ順に i.pximg.net の原画像 URL を返します。直接 GET すると 403 が返る場合があります。画像の取得には Referer: https://www.pixiv.net/artworks/{artworkId} を指定してください。プログラムキーはこのサービス内でのみ使用します。サーバーにダウンロードさせる場合は POST /api/download/tasks を直接呼び出せます。
PixivProxyController.getArtworkPages.GET.success=イラストのページ。
