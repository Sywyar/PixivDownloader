title=Pixiv 일러스트
AuthorBatchController.create.POST.summary=Pixiv 작가의 작품 다운로드
AuthorBatchController.create.POST.description=작가 ID로 백그라운드 다운로드를 시작합니다. 기본값은 일러스트, 만화, 우고이라입니다. 소설에는 `kind=novel`을 사용하세요.
AuthorBatchController.create.POST.details=작가 ID는 양의 정수여야 합니다. 서버가 현재 `user-new` 소스를 선택하므로 요청 본문과 `activationToken`은 필요 없습니다. 프로그램 키에는 `core:batches.create`, `download-workbench:batches.execute`, 해당 작품 실행 플러그인의 `batches.execute`가 필요합니다. 작품 유형별 기본 디렉터리 템플릿을 사용합니다. 작가 디렉터리 템플릿은 일반 배치의 `source`에 `acquisitionMode=user`와 `username`을 지정해 사용하세요.\n\n\
    `202`는 배치가 접수되었다는 뜻입니다. 이후 Pixiv에서 현재 계정이나 익명 사용자가 볼 수 있는 작가의 작품을 조회하고 선택한 유형을 처리합니다. 로컬에서 이미 완료한 작품은 건너뛸 수 있습니다. 접수 시 로컬 소스가 없거나 제공자가 일치하지 않으면 HTTP `404`와 `batch.not-found`가 반환됩니다. 탈퇴하거나 존재하지 않는 작가 ID 등으로 Pixiv가 404를 반환하면 `Location`을 `GET`으로 조회한 결과에 `state=FAILED`, `code=schedule.pixiv.discovery-not-found`가 표시됩니다. 작성자 ID가 맞는지, 현재 계정으로 해당 작성자를 볼 수 있는지 확인하세요.\n\n\
    `core:batches.read`로 배치와 `/items`를 조회하세요. 작가를 조회하다 실패하면 작품 항목이 없을 수 있으므로 배치의 `code`를 확인하세요. `resume`은 소스를 다시 검색하고 `retry`는 이미 찾은 항목만 재시도합니다. 일시 정지, 취소, 삭제, 용량 제한은 `POST /api/download/batches`와 같습니다.
AuthorBatchController.create.POST.parameter.userId=작가의 Pixiv 사용자 ID를 1에서 9223372036854775807 사이의 십진수 문자열로 전달하세요. 배치를 제출할 때 앞의 0은 제거됩니다.
AuthorBatchController.create.POST.parameter.kind=illust는 일러스트, 만화, 우고이라를, novel은 소설을 선택합니다. 기본값은 illust입니다.
AuthorBatchController.create.POST.success=접수된 배치의 UUID입니다.
AuthorBatchController.create.POST.response.400=작가 ID, 작품 유형 또는 수집 자격 증명 헤더가 유효하지 않습니다.
AuthorBatchController.create.POST.response.404=로컬 user-new 소스가 없거나 소스 제공자가 일치하지 않습니다(batch.not-found). 작가의 존재 여부는 접수 후에 확인합니다.
AuthorBatchController.create.POST.response.409=기존 배치가 있거나 앱이 종료 중입니다. 기존 배치를 중지한 후 삭제하세요.
schema.top.sywyar.pixivdownload.download.controller.AuthorBatchController.Receipt.field.id=접수된 배치의 UUID입니다.
PixivProxyController.getUserArtworks.GET.summary=작가의 Pixiv 작품 목록 조회
PixivProxyController.getUserArtworks.GET.description=작가의 작품 ID를 숫자 내림차순으로 반환합니다. 카드가 필요하면 같은 작가의 cards API에 선택한 ID를 보내세요.
PixivProxyController.getUserArtworks.GET.success=작가의 Pixiv 작품.
PixivProxyController.getUserRequestArtworks.GET.summary=작가의 리퀘스트 작품 목록 조회
PixivProxyController.getUserRequestArtworks.GET.description=작가가 완료하여 공개한 커미션 작품의 ID를 반환합니다. illust-cards로 카드를 일괄 조회할 수 있습니다.
PixivProxyController.getUserRequestArtworks.GET.success=작가의 리퀘스트 작품.
PixivProxyController.getArtworkMeta.GET.summary=일러스트 메타데이터 조회
PixivProxyController.getArtworkMeta.GET.description=볼 수 있는 작품의 Pixiv 메타데이터를 반환합니다. 이미지 URL은 pages, 움짤 정보는 ugoira에서 조회하세요.
PixivProxyController.getArtworkMeta.GET.success=일러스트 메타데이터.
PixivProxyController.getArtworkPages.GET.summary=일러스트 페이지 목록 조회
PixivProxyController.getArtworkPages.GET.description=Pixiv 페이지 순서대로 i.pximg.net 원본 URL을 반환합니다. 단순 GET 요청은 403을 받을 수 있습니다. 이미지 요청에는 Referer: https://www.pixiv.net/artworks/{artworkId} 를 사용하세요. 프로그램 키는 이 서비스에만 보냅니다. 서버에서 다운로드하려면 POST /api/download/tasks 를 직접 호출하세요.
PixivProxyController.getArtworkPages.GET.success=일러스트 페이지.
PixivProxyController.getUgoiraMeta.GET.summary=움짤 프레임 정보 조회
PixivProxyController.getUgoiraMeta.GET.description=움짤 작품의 프레임 ZIP 주소와 재생에 사용할 프레임별 지연 시간을 반환합니다.
PixivProxyController.getUgoiraMeta.GET.success=움짤 프레임 정보.
PixivProxyController.searchArtworks.GET.summary=Pixiv 일러스트 검색
PixivProxyController.searchArtworks.GET.description=word에 검색어를 넣고 페이지는 1부터 시작합니다. order는 date_d, date, popular_d, mode는 all, safe, r18, sMode는 s_tag, s_tc입니다. 범위 검색은 페이지당 60개로 계산합니다. 실제 페이지 크기는 Pixiv가 정하며 pageSize를 지정할 수 없습니다. total은 Pixiv가 보고한 작품 수입니다.
PixivProxyController.searchArtworks.GET.success=Pixiv 일러스트.
PixivProxyController.rangeSearchArtworks.GET.summary=지정 범위의 일러스트 검색
PixivProxyController.rangeSearchArtworks.GET.description=양 끝을 포함한 검색 페이지를 읽고 작품 ID를 기준으로 중복을 제거합니다. requestedPages, acceptedPages, fetchedPages는 요청, 허용, 실제 조회 페이지 수입니다. Pixiv의 마지막 페이지에서 종료합니다. 마지막 페이지는 페이지당 60개로 추정합니다. 실제 반환 건수는 달라질 수 있습니다.
PixivProxyController.rangeSearchArtworks.GET.success=지정 범위의 일러스트.
PixivProxyController.getSeries.GET.summary=Pixiv 일러스트 시리즈 조회
PixivProxyController.getSeries.GET.description=Pixiv 시리즈 ID로 시리즈 정보와 해당 페이지의 작품을 조회합니다. 페이지는 1부터 시작합니다.
PixivProxyController.getSeries.GET.success=Pixiv 일러스트 시리즈.
PixivProxyController.getUserIllustCards.GET.summary=작가의 일러스트 카드 목록 조회
PixivProxyController.getUserIllustCards.GET.description=같은 작가의 ID를 ids=123&ids=456처럼 전달합니다. 카드는 요청한 순서대로 반환됩니다.
PixivProxyController.getUserIllustCards.GET.success=작가의 일러스트 카드.
PixivProxyController.getMyIllustBookmarks.GET.summary=현재 계정이 북마크한 일러스트 목록 조회
PixivProxyController.getMyIllustBookmarks.GET.description=Pixiv 계정을 식별하는 수집 자격 증명이 필요하며 없으면 400 ACQUISITION_CREDENTIAL_REQUIRED입니다. rest=show는 공개, hide는 비공개 항목입니다. offset은 0부터 시작하고 limit은 1~100으로 제한됩니다.
PixivProxyController.getMyIllustBookmarks.GET.success=현재 계정이 북마크한 일러스트.
PixivProxyController.getMyFollowing.GET.summary=팔로우 중인 작가 목록 조회
PixivProxyController.getMyFollowing.GET.description=Pixiv 계정을 식별하는 수집 자격 증명이 필요하며 없으면 400 ACQUISITION_CREDENTIAL_REQUIRED입니다. rest=show는 공개, hide는 비공개 항목입니다. offset은 0부터 시작하고 limit은 1~100으로 제한됩니다.
PixivProxyController.getMyFollowing.GET.success=팔로우 중인 작가.
PixivProxyController.getMyFollowLatest.GET.summary=팔로우한 작가의 신작 목록 조회
PixivProxyController.getMyFollowLatest.GET.description=p는 1부터 시작합니다. 팔로우 중인 작가의 신작을 반환하며 hasNext로 다음 페이지 유무를 확인합니다.
PixivProxyController.getMyFollowLatest.GET.success=팔로우한 작가의 신작.
PixivProxyController.getMyCollections.GET.summary=현재 계정의 Pixiv 컬렉션 목록 조회
PixivProxyController.getMyCollections.GET.description=수집 자격 증명에 해당하는 계정의 Pixiv 컬렉션을 반환합니다. ID를 /api/pixiv/me/collection/{collectionId}/works에 전달해 내용물을 조회하세요.
PixivProxyController.getMyCollections.GET.success=현재 계정의 Pixiv 컬렉션.
PixivProxyController.getMyCollectionWorks.GET.summary=Pixiv 컬렉션의 작품 목록 조회
PixivProxyController.getMyCollectionWorks.GET.description=GET /api/pixiv/me/collections의 collectionId와 동일한 계정 자격 증명으로 컬렉션의 작품을 조회합니다.
PixivProxyController.getMyCollectionWorks.GET.success=Pixiv 컬렉션의 작품.
parameter.userId=작가의 Pixiv 사용자 ID입니다.
parameter.X-Acquisition-Credential=Pixiv 요청에 쓸 세션 쿠키입니다. 계정 전용 콘텐츠에는 필요하며 앞뒤 공백 제거 후 최대 16384자입니다. 공개 정보 조회에 성공해도 Cookie의 유효 기간이 확인되지는 않습니다. 단일 자격 증명으로 보낸 프록시 요청을 Pixiv가 401 또는 403으로 거부하면 이 서비스는 502 error.pixiv.upstream.unauthorized를 반환합니다.
parameter.seriesId=작품 또는 소설 시리즈 ID입니다.
parameter.word=Pixiv 검색어입니다.
parameter.mode=검색 모드는 all, safe, r18입니다. mode=r18은 Pixiv에 그대로 전달됩니다. Pixiv 쿠키 없이 익명으로 검색하거나 계정이 연령 제한 작품을 숨기면 전체 이용가 작품이 반환되거나 결과가 비어 있을 수 있습니다. 각 항목의 xRestrict 등급(0 전체 이용가, 1 R-18, 2 R-18G)을 확인하세요.
parameter.sMode=Pixiv 검색어 일치 방식입니다.
parameter.startPage=검색 범위의 시작 페이지입니다.
parameter.endPage=검색 범위의 마지막 페이지입니다.
parameter.rest=현재 계정 항목의 공개 범위에 대한 Pixiv 필터입니다.
parameter.tag=목록을 필터링할 북마크 태그입니다.
parameter.p=조회할 신작 페이지 번호입니다.
parameter.collectionId=선택한 컬렉션 ID입니다.
parameter.artworkId=Pixiv 작품 ID입니다. 부호 있는 64비트 정수의 양수 범위에서 1~19자리 십진 숫자를 지정하세요.
