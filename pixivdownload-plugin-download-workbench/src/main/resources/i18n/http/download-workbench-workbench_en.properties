schema.DownloadSubmission.artwork.field.options.field.pages=Selecting pages is discouraged. Unless you need specific pages, omit pages to download the entire artwork. For still images, use comma-separated, zero-based page indices. For example, 0,2 downloads the first and third pages. Keep the original folder and output settings when adding pages. The server checks the source and saved files before registering the complete artwork. Only a full download can replace a registered work.
schema.DownloadSubmission.artwork.description=**Page selection.** Omit `options.pages` to download the entire work unless you only need specific pages. The server fetches the work metadata and complete ordered list of originals from Pixiv. For still illustrations and manga, `"0,2"` downloads the first and third pages with their original page numbers and filenames. Empty strings, duplicates, whitespace, leading zeros, negative or out-of-range indices, and any selection for an animation return 422 `DOWNLOAD_TASK_REJECTED` on submission. Listing every page explicitly still counts as a selection, including `"0"` for a single-page work. A selection targeting a complete library work ends in `FAILED` with `OUTPUT_ALREADY_REGISTERED`.\n\n\
    **Resume and verification.** Compatible requests reuse the initial filenames. The server compares the page count, every original URL in order, the Pixiv upload time when available, the folder, an explicitly supplied filename template and image output settings. If they conflict, a selection reports `OUTPUT_LAYOUT_CONFLICT`. Submit a new `requestId` without `pages` to rebuild. Remote byte changes cannot be detected from an unchanged upload time and unchanged URLs. Before reusing a local page, the server checks the length and SHA-256 of each output. A missing, truncated or same-length damaged page is downloaded again when requested. Omitting `pages` repairs all pages that fail verification.\n\n\
    **Publication and recovery.** The task can reach `COMPLETED` once all requested pages are saved. While the work is incomplete, `GET /api/library/artworks/{artworkId}/partial` lists the total page count, folder and saved files. The work enters the library only when all pages are present. To replace an incompatible partial layout, a full download stages every new page and commits files and database records together. Cancellation before commit, a download failure or a failed commit preserves the old files and page progress. The service recovers an uncertain commit. On an ordinary resume, successfully saved pages remain available. A rebuild transaction can replace or delete up to 10,000 target files in total. Exceeding that limit preserves the original selection.\n\n\
    **Outputs.** Still images retain the original by default. If `imageFormats` omits both `original` and the source format, successful conversion removes the original. Animations are downloaded as a whole using `ugoiraFormats`. Optional Pixiv bookmark and local collection actions can run even after a partial selection succeeds. For a complete work, get the folder from `GET /api/library/artworks/{artworkId}` (`moveFolder` after a move, otherwise `folder`) and the file from `GET /api/downloaded/rawfile/{artworkId}/{page}`. Library queries need `core:library.read` and raw export needs `core:assets.export`.
