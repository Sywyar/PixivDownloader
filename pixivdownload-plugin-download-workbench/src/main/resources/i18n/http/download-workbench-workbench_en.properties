schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.acquisitionMode=Selects the directory template by source: single-import for an individual work, user for an artist profile, series for a series or collection, search for search results, and quick for quick downloads. Omitting the mode or leaving its template empty uses the default directory template. The set of works submitted stays the same. Legacy requests with isUserDownload=true use user when acquisitionMode is omitted.
