title=Download workbench
BatchStateController.getState.GET.summary=Get workbench state
BatchStateController.getState.GET.description=Solo mode only. state contains the last saved workbench JSON object, initially {}.
BatchStateController.getState.GET.success=Workbench state.
BatchStateController.saveState.POST.summary=Save workbench state
BatchStateController.saveState.POST.description=Solo mode only. Send {"state":{…}} to replace the entire state. The state field must be a JSON object. Success has an empty body.
BatchStateController.saveState.POST.success=Workbench state saved.
DownloadPageController.select.POST.summary=Set the download page layout
DownloadPageController.select.POST.description=Set page to pixiv-batch.html or pixiv-batch-alt.html. A 204 confirms the preference for future workbench visits.
DownloadPageController.select.POST.success=Download page layout saved.
DownloadProfilesController.read.GET.summary=List download profiles
DownloadProfilesController.read.GET.description=Returns the current revision and the complete profiles list. Use that revision in the next PUT.
DownloadProfilesController.read.GET.success=Download profiles.
DownloadProfilesController.save.PUT.summary=Save download profiles
DownloadProfilesController.save.PUT.description=GET the revision first. PUT replaces all profiles (up to 64); an empty array clears them. Each entry needs a unique id and name and both settings and filters objects. A stale revision returns 409.
DownloadProfilesController.save.PUT.success=Download profiles saved.
DownloadStatusController.getDownloadStatus.GET.summary=Get artwork download progress
DownloadStatusController.getDownloadStatus.GET.description=Read progress and completion, failure or cancellation for this artwork download. An absent or invisible task returns HTTP 200 with success=false. Program clients poll the submission receipt’s `Location` (`GET /api/download/tasks/{taskId}`). With only an artwork ID, call `GET /api/download/tasks` and match `attempt.workType=artwork` and `attempt.workId` among the visible entries. One artwork can have several attempts. Use the chosen entry’s `attempt.attemptId` as `taskId`.
DownloadStatusController.getDownloadStatus.GET.success=Artwork download progress.
DownloadStatusController.getActiveDownload.GET.summary=Get active downloads
DownloadStatusController.getActiveDownload.GET.description=Return IDs of active artwork downloads visible to this identity. Administrators see all downloads and other users see their own. Program clients can call `GET /api/download/tasks` and select visible entries with `attempt.workType=artwork` and `phase` set to `ACCEPTED`, `QUEUED` or `STARTED`.
DownloadStatusController.getActiveDownload.GET.success=Active downloads.
DownloadTaskController.downloadPixivImages.POST.summary=Start a Pixiv artwork download
DownloadTaskController.downloadPixivImages.POST.description=Start an asynchronous artwork download with artworkId, title and page-ordered imageUrls. HTTP 200 may also report an existing download. Poll status by artworkId. A required path decision returns 409. With a program key, submit workType=artwork to POST /api/download/tasks and poll the Location in the 202 receipt.
DownloadTaskController.downloadPixivImages.POST.success=Pixiv artwork download.
LayoutFeedbackStateController.getState.GET.summary=Get layout feedback state
LayoutFeedbackStateController.getState.GET.description=Read layout feedback for surveyId. Solo mode returns saved state and revision. Other modes return survey identity only.
LayoutFeedbackStateController.getState.GET.success=Layout feedback state.
LayoutFeedbackStateController.saveState.POST.summary=Save layout feedback state
LayoutFeedbackStateController.saveState.POST.description=For record_seen, send 1–3 distinct layoutIds from pixiv-batch-landscape, pixiv-batch-portrait and pixiv-batch-alt. Send no layout IDs for snooze (seven days), never or submitted.
LayoutFeedbackStateController.saveState.POST.success=Layout feedback state saved.
SSEController.createSSEConnection.GET.summary=Subscribe to download events for one artwork
SSEController.createSSEConnection.GET.description=Subscribe to download-status and heartbeat for this artwork. Closing the stream stops updates and leaves the download running. download-status data is JSON. artworkId identifies the work, progress is a percentage, and completed, failed and cancelled indicate terminal states. heartbeat carries ping. sse-closing and plugin-unavailable announce closure. Read progress from download-status when totalImages is positive. Session clients can read progressPercentage from the legacy status endpoint. Program keys poll GET /api/download/tasks or GET /api/download/tasks/{taskId} for phase and nullable progress (unit, completed, total). success describes the event, including events reporting failure or cancellation.
SSEController.createSSEConnection.GET.success=Download events for one artwork.
SSEController.createAggregatedSSEConnection.GET.summary=Subscribe to aggregated download events
SSEController.createAggregatedSSEConnection.GET.description=Read the subscription token from aggregated-ready. download-status carries progress and heartbeat keeps the stream alive. Use the token to close this subscription. download-status data is JSON. artworkId identifies the work, progress is a percentage, and completed, failed and cancelled indicate terminal states. heartbeat carries ping. sse-closing and plugin-unavailable announce closure. Read progress from download-status when totalImages is positive. Session clients can read progressPercentage from the legacy status endpoint. Program keys poll GET /api/download/tasks or GET /api/download/tasks/{taskId} for phase and nullable progress (unit, completed, total). success describes the event, including events reporting failure or cancellation.
SSEController.createAggregatedSSEConnection.GET.success=Aggregated download events.
SSEController.closeSSEConnection.POST.summary=Close an artwork event subscription
SSEController.closeSSEConnection.POST.description=Close the event connection for this artwork. Use the download cancellation endpoint to stop the work itself.
SSEController.closeSSEConnection.POST.success=Artwork event subscription closed.
SSEController.closeAggregatedSSEConnection.POST.summary=Close an aggregated event subscription
SSEController.closeAggregatedSSEConnection.POST.description=Close an aggregate stream using its aggregated-ready token and the identity that opened it.
SSEController.closeAggregatedSSEConnection.POST.success=Aggregated event subscription closed.
parameter.artworkId=Pixiv artwork ID.
parameter.token=Token returned when this operation or subscription was created.
parameter.surveyId=Required survey ID. Use a standard UUID or 8–128 ASCII letters, digits, underscores or hyphens.
