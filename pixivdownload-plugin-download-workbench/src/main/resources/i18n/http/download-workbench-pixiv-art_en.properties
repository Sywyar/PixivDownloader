title=Pixiv artworks
AuthorBatchController.create.POST.summary=Download a Pixiv artist’s works
AuthorBatchController.create.POST.description=Start a background download by author ID. The default includes illustrations, manga and animations. Use `kind=novel` for novels.
AuthorBatchController.create.POST.details=Use a positive author ID. The server selects the current `user-new` source. No request body or `activationToken` is needed. Program keys need `core:batches.create`, `download-workbench:batches.execute` and `batches.execute` for the selected work executor. Downloads use the default directory template for their work type. For the author directory template, submit `acquisitionMode=user` and `username` in the generic batch’s `source`.\n\n\
    A `202` accepts the batch. The worker then asks Pixiv for works visible to the current identity and processes the selected type. Locally completed works can be skipped. A missing local source or a provider mismatch returns HTTP `404` with `batch.not-found` at submission. If Pixiv returns 404 while looking up the author, for example after an account closure or for an unknown ID, polling `Location` with `GET` returns `state=FAILED` and `code=schedule.pixiv.discovery-not-found`. Check the author ID and whether the current account can view the author.\n\n\
    Use `core:batches.read` to read this batch and `/items`. If author discovery fails before any works are found, inspect the batch `code`. `resume` rescans the source. `retry` only retries discovered items. Pause, cancel, delete and capacity limits follow `POST /api/download/batches`.
AuthorBatchController.create.POST.parameter.userId=Pass the author’s Pixiv user ID as a decimal string from 1 to 9223372036854775807. Leading zeros are removed before batch submission.
AuthorBatchController.create.POST.parameter.kind=illust includes illustrations, manga and ugoira. novel selects novels. Defaults to illust.
AuthorBatchController.create.POST.success=UUID of the accepted batch.
AuthorBatchController.create.POST.response.400=Invalid artist ID, work kind or acquisition credential header.
AuthorBatchController.create.POST.response.404=The local user-new source is missing or belongs to a different provider (batch.not-found). The worker checks the author later.
AuthorBatchController.create.POST.response.409=A batch already exists or the application is stopping. Stop and delete the previous batch first.
schema.top.sywyar.pixivdownload.download.controller.AuthorBatchController.Receipt.field.id=UUID of the accepted batch.
PixivProxyController.getUserArtworks.GET.summary=List an author's Pixiv artworks
PixivProxyController.getUserArtworks.GET.description=Returns this artist’s work IDs in descending numeric order. Pass selected IDs to the corresponding cards endpoint for the same artist.
PixivProxyController.getUserArtworks.GET.success=Author's Pixiv artworks.
PixivProxyController.getUserRequestArtworks.GET.summary=List commissioned artworks
PixivProxyController.getUserRequestArtworks.GET.description=Returns IDs of completed public requests by this artist. Use illust-cards to fetch their cards in batches.
PixivProxyController.getUserRequestArtworks.GET.success=Commissioned artworks.
PixivProxyController.getArtworkMeta.GET.summary=Get artwork metadata
PixivProxyController.getArtworkMeta.GET.description=Returns metadata for a visible Pixiv artwork. Use its pages endpoint for image URLs or ugoira for animation frames.
PixivProxyController.getArtworkMeta.GET.success=Artwork metadata.
PixivProxyController.getArtworkPages.GET.summary=List artwork pages
PixivProxyController.getArtworkPages.GET.description=Returns original i.pximg.net URLs in Pixiv page order. A bare GET may return 403. Use Referer: https://www.pixiv.net/artworks/{artworkId} for the image request. Use the program key only with this service. To download through the server, POST /api/download/tasks directly.
PixivProxyController.getArtworkPages.GET.success=Artwork pages.
PixivProxyController.getUgoiraMeta.GET.summary=Get Ugoira animation metadata
PixivProxyController.getUgoiraMeta.GET.description=For an animated artwork, returns its frame ZIP URL and per-frame delays for playback.
PixivProxyController.getUgoiraMeta.GET.success=Ugoira animation metadata.
PixivProxyController.searchArtworks.GET.summary=Search Pixiv artworks
PixivProxyController.searchArtworks.GET.description=Supply word and a one-based page. order accepts date_d, date or popular_d; mode accepts all, safe or r18; sMode accepts s_tag or s_tc. Range queries estimate 60 results per page. Pixiv controls the actual page size. The API accepts no pageSize parameter. total is the work count reported by Pixiv.
PixivProxyController.searchArtworks.GET.success=Pixiv artworks.
PixivProxyController.rangeSearchArtworks.GET.summary=Search artworks within a range
PixivProxyController.rangeSearchArtworks.GET.description=Fetch an inclusive range of search pages and deduplicate works by ID. requestedPages, acceptedPages and fetchedPages distinguish the requested, allowed and actually read counts. Fetching stops at the last Pixiv page. This operation estimates the last page using 60 works per page. Actual page lengths can vary. To pace a preview, set startPage and endPage to the same page and wait on the client before requesting the next page.
PixivProxyController.rangeSearchArtworks.GET.success=Artworks within a range.
PixivProxyController.getSeries.GET.summary=Get a Pixiv artwork series
PixivProxyController.getSeries.GET.description=Returns Pixiv series metadata and the works on the requested page. Page numbers start at 1.
PixivProxyController.getSeries.GET.success=Pixiv artwork series.
PixivProxyController.getUserIllustCards.GET.summary=List an author's artwork cards
PixivProxyController.getUserIllustCards.GET.description=Pass IDs belonging to the same creator, for example ids=123&ids=456. Cards follow the requested ID order.
PixivProxyController.getUserIllustCards.GET.success=Author's artwork cards.
PixivProxyController.getMyIllustBookmarks.GET.summary=List bookmarked illustrations
PixivProxyController.getMyIllustBookmarks.GET.description=Supply an acquisition credential identifying the Pixiv account or the request returns 400 ACQUISITION_CREDENTIAL_REQUIRED. rest=show selects public entries and hide selects private entries. offset starts at 0; limit is clamped to 1–100.
PixivProxyController.getMyIllustBookmarks.GET.success=Bookmarked illustrations.
PixivProxyController.getMyFollowing.GET.summary=List followed creators
PixivProxyController.getMyFollowing.GET.description=Supply an acquisition credential identifying the Pixiv account or the request returns 400 ACQUISITION_CREDENTIAL_REQUIRED. rest=show selects public entries and hide selects private entries. offset starts at 0; limit is clamped to 1–100.
PixivProxyController.getMyFollowing.GET.success=Followed creators.
PixivProxyController.getMyFollowLatest.GET.summary=List new works by followed creators
PixivProxyController.getMyFollowLatest.GET.description=Read new works from followed creators using one-based p. hasNext indicates whether another page is available.
PixivProxyController.getMyFollowLatest.GET.success=New works by followed creators.
PixivProxyController.getMyCollections.GET.summary=List Pixiv collections
PixivProxyController.getMyCollections.GET.description=Lists the Pixiv collections of the account identified by the acquisition credential. Pass an ID to /api/pixiv/me/collection/{collectionId}/works for its contents.
PixivProxyController.getMyCollections.GET.success=Pixiv collections.
PixivProxyController.getMyCollectionWorks.GET.summary=List works in a Pixiv collection
PixivProxyController.getMyCollectionWorks.GET.description=Use a collectionId from GET /api/pixiv/me/collections with the same Pixiv account credential to list its works.
PixivProxyController.getMyCollectionWorks.GET.success=Works in a Pixiv collection.
parameter.userId=Pixiv user ID of the author.
parameter.X-Acquisition-Credential=Pixiv session cookie for upstream Pixiv requests. Optional except for account-specific content. Maximum 16384 characters after trimming. A successful public query does not verify that the Cookie is still valid. For a single-credential proxy request, an upstream Pixiv 401 or 403 returns 502 error.pixiv.upstream.unauthorized from this service.
parameter.seriesId=Identifier of the artwork or novel series.
parameter.word=Pixiv search keyword.
parameter.mode=Search mode accepts all, safe or r18. The API forwards mode=r18 to Pixiv. When searching without a Pixiv cookie or with an account that hides age-restricted works, you may receive unrestricted works or an empty result. Check each item’s xRestrict rating (0 unrestricted, 1 R-18, 2 R-18G).
parameter.sMode=How Pixiv matches the search term.
parameter.startPage=First page in the requested search range.
parameter.endPage=Last page in the requested search range.
parameter.rest=Pixiv visibility filter for the account's entries.
parameter.tag=Bookmark tag used to filter the list.
parameter.p=Page of recent works to retrieve.
parameter.collectionId=Identifier of the selected collection.
parameter.artworkId=Pixiv artwork ID. Use 1–19 decimal digits representing a positive signed 64-bit integer.
