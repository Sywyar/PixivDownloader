schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.description=説明文には `<br>` による改行やリンクなどの Pixiv HTML が含まれる場合があります。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.tags=作品とともに保存する Pixiv タグとその翻訳。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.fileNames=imageUrls と同じページ順のベースファイル名。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.fileNameTimestamp=ファイル名テンプレートの展開に使う Unix 時間（ミリ秒）。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.seriesId=作品が属する Pixiv シリーズ ID。
