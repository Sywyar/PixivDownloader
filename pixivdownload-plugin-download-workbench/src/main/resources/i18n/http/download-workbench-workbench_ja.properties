schema.DownloadSubmission.artwork.field.options.field.pages=ページ指定は推奨しません。特定のページだけが必要な場合を除き、pages を省略して作品全体をダウンロードしてください。静止画の元のページ番号を 0 から数え、カンマで区切ります。例として 0,2 は 1 ページ目と 3 ページ目を指定します。追加取得時は同じ保存先と出力設定を使ってください。取得元と保存済みファイルを照合し、全ページが揃った時点で作品を登録します。登録済み作品を上書きするには全ページのダウンロードが必要です。
schema.DownloadSubmission.artwork.description=**ページ指定。** 特定のページだけが必要な場合を除き、`options.pages` を省略して作品全体をダウンロードしてください。サーバーは Pixiv から作品情報と全ページの原画像 URL を順番に取得します。静止画や漫画に `"0,2"` を指定すると、元の番号とファイル名で 1・3 ページ目を保存します。空文字、重複、空白、先頭の余分なゼロ、負数、範囲外の番号、うごイラへのページ指定は送信時に 422 `DOWNLOAD_TASK_REJECTED` になります。全ページを明示してもページ指定として扱われ、1 ページの作品に `"0"` を指定した場合も同様です。全ページが登録済みの作品への指定は `FAILED` となり、理由は `OUTPUT_ALREADY_REGISTERED` です。\n\n\
    **再開と検証。** 互換性があれば初回のファイル名を引き継ぎます。ページ数、すべての原画像 URL とその順序、Pixiv のアップロード日時（取得できた場合）、保存先、明示したファイル名テンプレート、画像出力設定を照合します。一致しないページ指定は `OUTPUT_LAYOUT_CONFLICT` になります。新しい `requestId` で `pages` を省略して再構築してください。URL とアップロード日時を維持したまま上流の内容だけが差し替わった場合は検出できません。保存済みページの再利用前に各出力の長さと SHA-256 を照合します。欠落、切り詰め、同じ長さの破損があるページは次にそのページを要求したときに再取得します。`pages` を省略すると検証に失敗した全ページが対象です。\n\n\
    **保存と復旧。** 指定ページがすべて保存されると、そのタスクは `COMPLETED` になります。未完の作品の総ページ数・保存先・保存ファイルは `GET /api/library/artworks/{artworkId}/partial` で確認できます。全ページが揃うとライブラリに登録されます。互換性のない部分保存を置き換える場合、全作品のダウンロードは新しい全ページを一時保存し、ファイルとデータベースの記録をまとめて確定します。確定前のキャンセル、ダウンロード失敗、コミット失敗時は元ファイルと進捗が残ります。確定結果が不明な場合はサービスが復旧します。通常の再開時も保存済みのページは残ります。 1 回の再構築で置換・削除できる対象ファイルは合計 10,000 件までです。上限を超えると元の部分保存が残ります。\n\n\
    **出力。** 静止画は既定で原画像を保持します。`imageFormats` に `original` と元形式のどちらも含まない場合、変換成功後に原画像を削除します。うごイラは `ugoiraFormats` で作品全体を出力します。ページ指定が成功した場合も、任意の Pixiv ブックマークやローカルコレクションへの追加が実行されます。登録済み作品の保存先は `GET /api/library/artworks/{artworkId}` の `moveFolder`（移動後）または `folder` で確認し、ファイルは `GET /api/downloaded/rawfile/{artworkId}/{page}` で取得します。照会には `core:library.read`、原ファイルの取得には `core:assets.export` が必要です。
