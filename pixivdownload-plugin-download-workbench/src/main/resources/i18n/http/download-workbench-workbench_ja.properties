schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.description=作品別ストリームと集約ストリームで配信する `download-status` イベントの JSON データ。作品別ストリームの接続通知には、作品 ID、状態の表示文言、メッセージ、`success`、および null を許容する 2 つのメディア進捗フィールドが含まれます。
schema.top.sywyar.pixivdownload.download.response.status.SseStatusData.field.artworkId=このイベントに対応する Pixiv 作品 ID。集約ストリームでは、この ID で作品ごとの更新を識別します。
