schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.illustType=Pixiv 作品の種類。0 はイラスト、1 は漫画、2 はうごイラです。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.rawMetaJson=ダウンロード後のメタデータ保存に使う、Pixiv /ajax/illust/{id} の body オブジェクトを JSON 化した任意の文字列。
