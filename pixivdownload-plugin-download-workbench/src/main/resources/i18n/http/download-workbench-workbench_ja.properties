schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.fileNameTemplate=作品のファイル名テンプレート。使用できる変数は {downloadVariables} です。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.username=ユーザーモードで使用するユーザー名。最大 512 文字です。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.acquisitionMode=取得元に応じて保存先テンプレートを選びます。single-import は単一作品、user は作者ページ、series はシリーズまたはコレクション、search は検索結果、quick はクイックダウンロードです。省略時や専用テンプレートが空の場合は既定値を使います。対象作品の範囲は変わりません。 旧形式のリクエストで isUserDownload=true かつ acquisitionMode を省略した場合は user を使用します。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.pathOverflowAction=パスが長すぎる場合の処理。ASK は確認、TRUNCATE は短縮、DEFAULT_NAME は既定名、CANCEL は中止です。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.bookmark=true の場合、ダウンロード時に Pixiv のブックマークに追加します。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.collectionId=ダウンロードした作品の登録先となるローカルコレクション ID。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.imageFormats=静止画で保存する形式です。original（既定）、png、jpg、webp から重複せずにカンマで指定します。元が JPG の場合、webp は変換成功後に元の JPG を削除し、original,webp は両方を、jpg は元の JPG を残します。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraFormats=うごイラの出力形式をカンマ区切りで指定します。webp、gif、apng、mp4、zip があり、既定は webp です。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaQuality=非可逆エンコードの品質。1～100 の整数で既定は 90 です。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaWebpLossless=WebP を可逆圧縮で出力するか。既定は false です。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.mediaMaximumEdge=出力画像の長辺の上限。0～16383 ピクセルで、0 は元の寸法を維持します。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isUserDownload=旧ユーザーダウンロード指定。acquisitionMode 省略時に true なら user モードになります。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.authorId=作者の Pixiv ユーザー ID。
