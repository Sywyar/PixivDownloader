schema.top.sywyar.pixivdownload.download.request.DownloadRequest.field.artworkId=Pixiv の作品 ID。
DownloadProfilesController.save.PUT.body=保存するダウンロードプロファイル。
LayoutFeedbackStateController.saveState.POST.body=アンケート ID、回答操作、選択したレイアウト。
DownloadTaskController.downloadPixivImages.POST.body=作品 ID、元画像、ダウンロード設定。
BatchStateController.saveState.POST.body=保存するダウンロードワークベンチの状態。
DownloadPageController.select.POST.body=ダウンロード画面で記憶するページ。
