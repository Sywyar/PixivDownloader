schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.xRestrict=Pixiv の年齢制限。0 は全年齢、1 は R-18、2 は R-18G です。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isAi=Pixiv で AI 生成作品と指定されているか。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.isUgoira=Pixiv のうごイラかどうか。フレームと再生間隔は ugoiraZipUrl と ugoiraDelays で指定します。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraZipUrl=うごイラの元フレームを含む Pixiv ZIP の URL。
schema.top.sywyar.pixivdownload.download.request.DownloadRequest.Other.field.ugoiraDelays=ZIP 内の順に指定する各フレームの表示時間（ミリ秒）。
