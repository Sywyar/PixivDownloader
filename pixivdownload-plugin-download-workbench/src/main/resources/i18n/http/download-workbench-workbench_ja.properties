title=ダウンロードワークベンチ
BatchStateController.getState.GET.summary=保存済みのワークベンチ状態を取得
BatchStateController.getState.GET.description=solo モード専用。state は最後に保存したワークベンチの JSON オブジェクトです。初期値は {} です。
BatchStateController.getState.GET.success=保存済みのワークベンチ状態。
BatchStateController.saveState.POST.summary=ワークベンチの状態を保存
BatchStateController.saveState.POST.description=solo 専用です。{"state":{…}} で状態全体を置き換えます。state は JSON オブジェクトです。成功時は本文を返しません。
BatchStateController.saveState.POST.success=ワークベンチの状態を保存しました。
DownloadPageController.select.POST.summary=ダウンロード画面のレイアウトを設定
DownloadPageController.select.POST.description=page には pixiv-batch.html または pixiv-batch-alt.html を指定します。保存すると204を返し、次回からそのページを開きます。
DownloadPageController.select.POST.success=ダウンロード画面のレイアウトを保存しました。
DownloadProfilesController.read.GET.summary=ダウンロードプロファイルの一覧
DownloadProfilesController.read.GET.description=現在の revision と profiles の全件を返します。次の PUT にこの revision を渡してください。
DownloadProfilesController.read.GET.success=ダウンロードプロファイル。
DownloadProfilesController.save.PUT.summary=ダウンロードプロファイルを保存
DownloadProfilesController.save.PUT.description=GET で revision を取得し、最大64件の profiles 全体を送信します。空配列で全削除します。各項目に一意の id、name と settings、filters の両オブジェクトが必要です。古い revision は409になります。
DownloadProfilesController.save.PUT.success=ダウンロードプロファイルを保存しました。
DownloadStatusController.getDownloadStatus.GET.summary=作品のダウンロード進捗を取得
DownloadStatusController.getDownloadStatus.GET.description=作品のダウンロード進捗、完了・失敗・中止状態を取得します。参照できるタスクがなければ HTTP 200、success=false です。 プログラムからは送信結果の `Location`（`GET /api/download/tasks/{taskId}`）をポーリングします。作品 ID だけが分かっている場合は `GET /api/download/tasks` で `attempt.workType=artwork` かつ `attempt.workId` が一致するタスクを探します。同じ作品に複数の試行がある場合は、追跡する試行の `attempt.attemptId` を `taskId` に使います。
DownloadStatusController.getDownloadStatus.GET.success=作品のダウンロード進捗。
DownloadStatusController.getActiveDownload.GET.summary=実行中のダウンロードを取得
DownloadStatusController.getActiveDownload.GET.description=実行中の作品ダウンロード ID を返します。管理者は全件、他の利用者は自分の分を参照できます。 プログラムからは `GET /api/download/tasks` を呼び、キーから見えるタスクのうち `attempt.workType=artwork` で、`phase` が `ACCEPTED`、`QUEUED`、`STARTED` のものを選びます。
DownloadStatusController.getActiveDownload.GET.success=実行中のダウンロード。
DownloadTaskController.downloadPixivImages.POST.summary=Pixiv 作品のダウンロードを開始
DownloadTaskController.downloadPixivImages.POST.description=artworkId、title、ページ順の imageUrls で非同期取得を開始します。保存済みでも HTTP 200 です。進捗は artworkId で取得し、パスの選択が必要な場合は 409 です。 プログラムキーを使う場合は POST /api/download/tasks に workType=artwork を送信し、202 応答の Location で進行状況を確認します。
DownloadTaskController.downloadPixivImages.POST.success=Pixiv 作品のダウンロード。
LayoutFeedbackStateController.getState.GET.summary=レイアウトのフィードバック状態を取得
LayoutFeedbackStateController.getState.GET.description=surveyId のレイアウト調査状態を取得します。solo は保存済み状態とリビジョン、他のモードは調査用の識別情報を返します。
LayoutFeedbackStateController.getState.GET.success=レイアウトのフィードバック状態。
LayoutFeedbackStateController.saveState.POST.summary=レイアウトのフィードバック状態を保存
LayoutFeedbackStateController.saveState.POST.description=record_seen では pixiv-batch-landscape、pixiv-batch-portrait、pixiv-batch-alt から重複のない1～3個を layoutIds に指定します。snooze（7日間）、never、submitted には指定しません。
LayoutFeedbackStateController.saveState.POST.success=レイアウトのフィードバック状態を保存しました。
SSEController.createSSEConnection.GET.summary=作品ごとのダウンロードイベントを購読
SSEController.createSSEConnection.GET.description=この作品の download-status と heartbeat を購読します。接続を閉じてもダウンロードは続きます。 download-status の data は JSON です。artworkId は作品、progress は進捗率、completed・failed・cancelled は終了状態を示します。heartbeat は ping、sse-closing と plugin-unavailable は終了通知です。 totalImages が正なら download-status の progress。セッションでは旧ステータス API の progressPercentage を利用できます。プログラムキーは GET /api/download/tasks または GET /api/download/tasks/{taskId} の phase と任意の progress（unit、completed、total）を参照してください。success はイベントの成否を表すため、タスクが失敗またはキャンセルされた場合も true になります。
SSEController.createSSEConnection.GET.success=作品ごとのダウンロードイベント。
SSEController.createAggregatedSSEConnection.GET.summary=集約されたダウンロードイベントを購読
SSEController.createAggregatedSSEConnection.GET.description=aggregated-ready から購読トークンを取得します。進捗は download-status、接続維持は heartbeat で届きます。終了時はこのトークンを使います。 download-status の data は JSON です。artworkId は作品、progress は進捗率、completed・failed・cancelled は終了状態を示します。heartbeat は ping、sse-closing と plugin-unavailable は終了通知です。 totalImages が正なら download-status の progress。セッションでは旧ステータス API の progressPercentage を利用できます。プログラムキーは GET /api/download/tasks または GET /api/download/tasks/{taskId} の phase と任意の progress（unit、completed、total）を参照してください。success はイベントの成否を表すため、タスクが失敗またはキャンセルされた場合も true になります。
SSEController.createAggregatedSSEConnection.GET.success=集約されたダウンロードイベント。
SSEController.closeSSEConnection.POST.summary=作品ごとのイベント購読を終了
SSEController.closeSSEConnection.POST.description=作品のイベント接続を閉じます。処理自体を中止するときはダウンロード取消 API を使います。
SSEController.closeSSEConnection.POST.success=作品ごとのイベント購読を終了しました。
SSEController.closeAggregatedSSEConnection.POST.summary=集約イベントの購読を終了
SSEController.closeAggregatedSSEConnection.POST.description=開いた時と同じ認証情報で aggregated-ready の token を渡し、集約ストリームを閉じます。
SSEController.closeAggregatedSSEConnection.POST.success=集約イベントの購読を終了しました。
parameter.artworkId=Pixiv の作品 ID。
parameter.token=操作または購読の作成時に返されたトークン。
parameter.surveyId=必須の調査 ID。標準 UUID または英数字・下線・ハイフンの 8～128 文字を指定します。
