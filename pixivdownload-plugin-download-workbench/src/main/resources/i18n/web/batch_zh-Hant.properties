mode.schedule=⏰ 排程工作
schedule.title=排程工作管理
schedule.intro=背景依固定週期或 Cron 表達式自動發現並下載新作品。排程工作以管理員身分執行，僅管理員可見。若要建立排程工作，請切換到 User／Search／系列模式，設定好下載與篩選設定後，在下方「儲存為排程工作」中儲存；也可在「快速取得」中點入某個畫師（或開啟「我的作品」）預覽作品後，依該畫師儲存為 User 模式排程工作。
schedule.save.title=⏰ 儲存為排程工作
schedule.save.intro=將目前模式的來源（畫師／搜尋／系列）連同上方全部下載與篩選設定製成快照，建立一個在背景自動執行的排程工作（僅限管理員）。工作會依設定的觸發方式週期性發現新作品、略過已下載項目，再依快照中的設定自動下載，整個過程不需要瀏覽器或油猴腳本在場。請先在 User／Search／系列模式中設定好來源、下載與篩選，再到這裡命名並儲存；在「快速取得」中點入某個畫師（或開啟「我的作品」）預覽作品後，也會出現此卡片，可依該畫師建立 User 模式排程工作。
schedule.save.quick-source=將建立排程工作：{type}・{label}
schedule.save.quick-source-editing=編輯中（來源唯讀，如需更換來源請刪除後重建）：{type}・{label}
schedule.save.quick-hint=請先展開具體作品清單（點開收藏／我的作品／關注新作，或點入某個畫師／珍藏集）後再建立排程工作
