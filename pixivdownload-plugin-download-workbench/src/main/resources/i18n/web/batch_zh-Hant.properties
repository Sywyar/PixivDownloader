schedule.field.interval.hint=從上次執行算起，每隔這麼多分鐘自動執行一次（例如 1440 = 每天一次，60 = 每小時一次）。
schedule.field.cron.hint=使用 Spring 的 6 位格式「秒 分 時 日 月 週」（含秒，比常見的 5 位 Unix Cron 多出最前面的秒位）。範例：0 0 3 * * * = 每天 03:00:00；0 0 */6 * * * = 每 6 小時；0 30 8 * * 1 = 每週一 08:30:00。
schedule.field.fetch-limit=首次擷取上限：
schedule.field.fetch-limit.hint.watermark=僅排程工作生效。首次執行最多將最新的這麼多個作品納入本輪佇列（已下載略過／篩選略過也會佔用額度）；之後每輪只增量追蹤新作，不再補取更早的歷史。0 表示不限上限，大型來源可能產生較多請求，儲存時會提示確認。
schedule.field.fetch-limit.hint.per-run=僅排程工作生效。此來源沒有可靠的最新順序，依每輪上限執行：每次執行最多將這麼多個作品納入本輪佇列（已下載略過／篩選略過也會佔用額度），分多輪逐步處理積壓。0 表示不限上限，大型來源可能產生較多請求，儲存時會提示確認。
schedule.pixiv.fetch-limit.hint.watermark=僅排程工作生效。首次執行最多將最新的這麼多個作品納入本輪佇列（已下載略過／篩選略過也會佔用額度）；之後每輪只增量追蹤新作，不再補下載更早的歷史。0 = 全量擷取：首次執行會嘗試下載此來源的全部歷史，作品很多時可能觸發 Pixiv 過度存取警告甚至導致帳號遭封鎖，儲存時會提示確認。
schedule.pixiv.fetch-limit.hint.per-run=僅排程工作生效。此來源沒有可靠的「最新」順序，依「每輪上限」執行：每次執行最多下載這麼多個尚未下載的作品（已下載作品會免費略過、不佔額度，但被篩選條件略過的仍會佔額度），分多輪逐步清空積壓。若希望永遠完整下載全部作品，設為 0 即可（不限上限）——但首輪 0 會一次嘗試下載全部作品，作品很多時可能觸發 Pixiv 過度存取警告，儲存時會提示確認。
