quick.schedule.rest.hide=非公開
schedule.field.interval.hint=前回の実行からこの分数ごとに自動実行します（例：1440 = 1 日に 1 回、60 = 1 時間に 1 回）。
schedule.field.cron.hint=Spring の 6 フィールド形式「秒 分 時 日 月 曜日」を使用します（秒を含むため、一般的な 5 フィールド Unix Cron の先頭に秒フィールドが追加されます）。例：0 0 3 * * * = 毎日 03:00:00、0 0 */6 * * * = 6 時間ごと、0 30 8 * * 1 = 毎週月曜 08:30:00。
schedule.field.fetch-limit=初回取得上限：
schedule.field.fetch-limit.hint.watermark=スケジュールタスクでのみ有効。初回実行では最新の作品を最大この数まで今回のキューに追加します（ダウンロード済み / フィルターによるスキップも枠を消費）。以後は新しい作品だけを増分検出し、過去の履歴は再取得しません。0 は上限なし。大きな提供元ではリクエストが増える可能性があり、保存時に確認を表示します。
schedule.field.fetch-limit.hint.per-run=スケジュールタスクでのみ有効。この提供元には信頼できる新着順がないため、1 回の上限で実行します。1 回にこの数まで今回のキューへ追加し（ダウンロード済み / フィルターによるスキップも枠を消費）、複数回に分けて未処理分を処理します。0 は上限なし。大きな提供元ではリクエストが増える可能性があり、保存時に確認を表示します。
schedule.pixiv.fetch-limit.hint.watermark=スケジュールタスクでのみ有効。初回実行では最新の作品を最大この数まで今回のキューに追加します（ダウンロード済み / フィルターによるスキップも枠を消費）。以後は新しい作品だけを増分検出し、過去の履歴は再ダウンロードしません。0 = 全量取得：初回実行で提供元の全履歴を取得しようとします。作品が多いと Pixiv の過剰アクセス警告やアカウント停止につながる可能性があり、保存時に確認を表示します。
schedule.pixiv.fetch-limit.hint.per-run=スケジュールタスクでのみ有効。この提供元には信頼できる「新着」順がないため、1 回の上限で実行します。1 回に未ダウンロード作品を最大この数まで取得します（ダウンロード済みは無料でスキップされ枠を消費しませんが、フィルターでスキップされた作品は枠を消費）。複数回に分けて未処理分を処理します。すべての作品を常に完全にダウンロードする場合は 0（上限なし）に設定できます。ただし初回の 0 は全量を一度に試みるため、作品が多いと Pixiv の過剰アクセス警告が発生する可能性があり、保存時に確認を表示します。
