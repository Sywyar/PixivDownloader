cookie.import-hint.prefix=「Cookie をワンクリックインポート」を使うには、Tampermonkey の「設定 → 設定モードで『高度』を選択 → セキュリティ → スクリプトによる Cookie へのアクセスを許可」を All に設定する必要があります。ただし、この設定を長期間有効にすることは推奨しません。有効にするとインストール済みの他の UserScript も Pixiv のログイン認証情報を自由に読み取れるためです。インストール済みのすべてのスクリプトを信頼している場合を除き、インポート時だけ一時的に All に設定し、取得成功後すぐに「HttpOnly 以外」に戻してください。最初の方法で手動取得することを推奨します。詳しくは
cookie.guide.url=https://sywyar.github.io/PixivDownloader/#/zh-cn/first-download
cookie.guide.link=Cookie 取得ガイド
cookie.import-hint.suffix=。
cookie.hint.prefix=3 つの形式に対応：Header String（ブラウザーのリクエストヘッダーを直接コピー）、JSON（オブジェクト形式）、Netscape（EditThisCookie などのツールが出力）。具体的な取得方法は
cookie.hint.suffix= を参照してください。
cookie.hint.server=Cookie はサーバーに保存され、すべてのデバイスで同じ設定を共有します。3 つの形式に対応：Header String（ブラウザーのリクエストヘッダーを直接コピー）、JSON（オブジェクト形式）、Netscape（EditThisCookie などのツールが出力）。取得方法は下の「Cookie 取得ガイド」を参照してください。
