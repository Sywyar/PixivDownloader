# --- スケジュールタスク（管理者専用） ---
mode.schedule=⏰ スケジュールタスク
schedule.title=スケジュールタスク管理
schedule.intro=バックグラウンドで固定周期または Cron 式に従い、新しい作品を自動検出してダウンロードします。スケジュールタスクは管理者として実行され、管理者だけに表示されます。新しいタスクを作成するには User / Search / シリーズモードに切り替え、ダウンロードとフィルターを設定してから、下の「スケジュールタスクとして保存」で保存してください。「クイック取得」で作者（または「自分の作品」）を開いて作品をプレビューした後、その作者を User モードのスケジュールタスクとして保存することもできます。
schedule.save.title=⏰ スケジュールタスクとして保存
schedule.save.intro=現在のモードの提供元（作者 / 検索 / シリーズ）と、上のすべてのダウンロード・フィルター設定をスナップショットとして保存し、バックグラウンドで自動実行するスケジュールタスクを作成します（管理者のみ）。設定したトリガーに従って新しい作品を定期的に検出し、ダウンロード済みをスキップして、スナップショットの設定で自動ダウンロードします。ブラウザーや UserScript は必要ありません。先に User / Search / シリーズモードで提供元、ダウンロード、フィルターを設定し、ここで名前を付けて保存してください。「クイック取得」で作者（または「自分の作品」）を開いて作品をプレビューした後にもこのカードが表示され、その作者の User モードタスクを作成できます。
schedule.save.quick-source=作成するスケジュールタスク：{type} · {label}
schedule.save.quick-source-editing=編集中（提供元は読み取り専用。変更する場合は削除して作り直します）：{type} · {label}
schedule.save.quick-hint=具体的な作品一覧（ブックマーク / 自分の作品 / フォロー中の新作を開く、または作者 / コレクションを開く）を先に展開してから、スケジュールタスクを作成してください
