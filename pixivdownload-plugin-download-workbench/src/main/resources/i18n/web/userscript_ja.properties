script.meta.all-in-one.description=Pixiv の多機能ダウンロードスクリプト。ページ一括ダウンロード、User 一括ダウンロード、作品リンクの一括インポート、作品単体のダウンロード（Java バックエンド版）を統合します。All-in-One スクリプトで問題が起きた場合は、先に対応する独立スクリプトを試し、両方の結果を添えて issue を報告してください。
script.meta.all-in-one.name=Pixiv All-in-One Downloader
script.meta.artwork-java.description=Java バックエンドサービスで Pixiv の作品単体画像をダウンロード
