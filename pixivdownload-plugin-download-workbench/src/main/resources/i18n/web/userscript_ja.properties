script.meta.artwork-local.description=Pixiv の作品単体に含まれるすべての画像をダウンロードし、ダウンロード済み作品を記録（ローカル保存、バックエンドデータベースは使用しません）
script.meta.artwork-local.name=Pixiv 作品画像ダウンローダー（ローカルダウンロード）
script.meta.experience-toolbox.description=Pixiv 閲覧体験強化ツールボックス。各機能は独立しており、必要に応じて切り替えできます。今後も拡張予定です。現在は、サーバーにダウンロード済みの作品のサムネイルに枠線を表示します。
script.meta.experience-toolbox.name=Pixiv 閲覧体験強化ツールボックス
script.meta.import-batch.description=作品単体リンクの一覧を貼り付けて一括ダウンロード。url | title 形式で、One-Tab、N-Tab などのタブ管理プラグインのエクスポート形式に対応し、厳密なダウンロード状態検証を行います。
script.meta.import-batch.name=Pixiv 作品リンク一括インポートダウンローダー
script.meta.page-batch.description=現在の Pixiv ページ（検索ページ、フォロー中のフィード、ランキング、ホームなど）にあるすべての作品を取得
script.meta.page-batch.name=Pixiv ページ一括ダウンローダー
script.meta.user-batch.description=Pixiv ユーザーページに対応し、すべての作品 ID を自動取得してローカル Java バックエンドと連携
script.meta.user-batch.name=Pixiv User 一括ダウンローダー
