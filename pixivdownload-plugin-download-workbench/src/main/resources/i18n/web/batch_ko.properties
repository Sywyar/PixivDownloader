mode.schedule=⏰ 예약 작업
schedule.title=예약 작업 관리
schedule.intro=백그라운드에서 고정 주기 또는 Cron 표현식으로 새 작품을 자동으로 발견하고 다운로드합니다. 예약 작업은 관리자 권한으로 실행되며 관리자에게만 표시됩니다. 예약 작업을 새로 만들려면 User/검색/시리즈 모드로 전환하고 다운로드 및 필터 설정을 구성한 후 아래의 「예약 작업으로 저장」에서 저장하세요. 「빠른 가져오기」에서 작가로 들어가거나 「내 작품」을 열어 작품 미리 보기를 표시한 뒤 해당 작가의 User 모드 예약 작업으로 저장할 수도 있습니다.
schedule.save.title=⏰ 예약 작업으로 저장
schedule.save.intro=현재 모드의 원본(작가/검색/시리즈)과 위의 모든 다운로드 및 필터 설정을 스냅샷으로 만들어 백그라운드에서 자동 실행되는 예약 작업을 생성합니다(관리자 전용). 작업은 설정한 트리거 방식에 따라 새 작품을 주기적으로 발견하고 다운로드한 작품을 건너뛴 다음 스냅샷 설정으로 자동 다운로드하므로 브라우저나 사용자 스크립트가 실행 중일 필요가 없습니다. 먼저 User/검색/시리즈 모드에서 원본, 다운로드 및 필터를 설정한 후 여기에서 이름을 지정하여 저장하세요. 「빠른 가져오기」에서 작가로 들어가거나 「내 작품」을 열어 작품 미리 보기를 표시하면 이 카드도 나타나며 해당 작가의 User 모드 예약 작업을 만들 수 있습니다.
schedule.save.quick-source=예약 작업을 생성합니다: {type} · {label}
schedule.save.quick-source-editing=편집 중(원본 읽기 전용, 원본 변경은 삭제 후 다시 생성): {type} · {label}
schedule.save.quick-hint=먼저 작품 목록을 펼치세요(즐겨찾기/내 작품/팔로잉 새 작품을 열거나 작가/컬렉션으로 들어가기). 그 후 예약 작업을 생성할 수 있습니다
