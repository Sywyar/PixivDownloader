cookie.import-hint.prefix=「Cookie 한 번에 가져오기」는 Tampermonkey의 「설정 → 구성 모드에서 ‘고급’ 선택 → 보안 → 스크립트가 Cookie에 액세스하도록 허용」을 All로 설정해야 사용할 수 있습니다. 하지만 이 옵션을 오래 켜 두는 것은 권장하지 않습니다. 켜져 있으면 설치한 다른 모든 사용자 스크립트가 Pixiv 로그인 자격 증명을 임의로 읽을 수 있습니다. 설치된 모든 스크립트를 신뢰하지 않는다면 가져올 때만 일시적으로 All로 설정하고 성공한 즉시 「HttpOnly 제외」로 되돌리세요. 첫 번째 방법으로 Cookie를 수동으로 가져오는 것을 권장합니다. 자세한 내용은
cookie.guide.url=https://sywyar.github.io/PixivDownloader/#/zh-cn/first-download
