schedule.field.interval.hint=마지막 실행부터 이 분 수만큼 지나면 자동으로 실행합니다(예: 1440 = 하루에 한 번, 60 = 매시간).
schedule.field.cron.hint=Spring의 6자리 형식 「초 분 시 일 월 요일」을 사용합니다(초를 포함하므로 일반적인 5자리 Unix Cron의 앞에 초가 추가됨). 예: 0 0 3 * * * = 매일 03:00:00; 0 0 */6 * * * = 6시간마다; 0 30 8 * * 1 = 매주 월요일 08:30:00.
schedule.field.fetch-limit=첫 가져오기 한도:
schedule.field.fetch-limit.hint.watermark=예약 작업에만 적용됩니다. 첫 실행에서 최신 작품 중 이 수만큼을 이번 실행 대기열에 포함합니다(다운로드됨/필터로 건너뛴 항목도 한도를 사용). 이후 실행에서는 새 작품만 증분으로 추적하며 더 오래된 기록은 다시 가져오지 않습니다. 0은 제한 없음을 뜻합니다. 대형 원본은 요청이 많아질 수 있으며 저장할 때 확인을 요청합니다.
schedule.field.fetch-limit.hint.per-run=예약 작업에만 적용됩니다. 이 원본에는 신작 순서를 신뢰할 수 없으므로 매 실행 한도를 적용합니다. 한 번 실행할 때 이 수만큼만 이번 실행 대기열에 포함하며(다운로드됨/필터로 건너뛴 항목도 한도를 사용), 여러 번 실행하여 적체를 단계적으로 처리합니다. 0은 제한 없음을 뜻합니다. 대형 원본은 요청이 많아질 수 있으며 저장할 때 확인을 요청합니다.
schedule.pixiv.fetch-limit.hint.watermark=예약 작업에만 적용됩니다. 첫 실행에서 최신 작품 중 이 수만큼을 이번 실행 대기열에 포함합니다(다운로드됨/필터로 건너뛴 항목도 한도를 사용). 이후 실행에서는 새 작품만 증분으로 추적하며 더 오래된 기록은 다시 다운로드하지 않습니다. 0 = 전체 가져오기: 첫 실행에서 원본의 모든 기록을 다운로드하려 하므로 작품이 많으면 Pixiv 과도한 접근 경고나 계정 정지를 유발할 수 있습니다. 저장할 때 확인을 요청합니다.
schedule.pixiv.fetch-limit.hint.per-run=예약 작업에만 적용됩니다. 이 원본에는 「최신」 순서를 신뢰할 수 없으므로 「매 실행 한도」를 적용합니다. 한 번 실행할 때 아직 다운로드하지 않은 작품을 이 수만큼만 다운로드합니다(다운로드한 작품은 한도를 사용하지 않고 건너뛰지만 필터로 건너뛴 작품은 한도를 사용). 여러 번 실행하여 적체를 단계적으로 처리합니다. 모든 작품을 항상 완전히 다운로드하려면 0(제한 없음)으로 설정하세요. 단, 첫 실행에서 0이면 전체를 한 번에 시도하므로 작품이 많을 때 Pixiv 과도한 접근 경고가 발생할 수 있습니다. 저장할 때 확인을 요청합니다.
