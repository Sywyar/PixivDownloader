script.meta.all-in-one.description=Pixiv 多合一下载脚本，整合页面批量下载、User 批量下载、批量导入单作品和单作品下载（Java后端版）。如多合一脚本异常，请先尝试对应独立脚本，再将两种脚本的表现一并附上后提交 issue。
