layout-feedback.title=기본 레이아웃 선택에 도움을 주세요
layout-feedback.description=새 버전에는 세 가지 다운로드 작업대 레이아웃이 제공됩니다. 장기적으로 사용하고 싶은 레이아웃을 선택하세요.
layout-feedback.choices-group=장기적으로 사용하고 싶은 레이아웃 선택
layout-feedback.option-landscape=가로형 작업대
layout-feedback.option-landscape-desc=와이드 모니터에 적합하며 모드, 설정, 다운로드 대기열을 동시에 표시합니다.
layout-feedback.option-portrait=세로형 클래식 레이아웃
layout-feedback.option-portrait-desc=콘텐츠를 세로 순서로 배치하여 기존 사용 방식에 가깝습니다.
layout-feedback.option-alt=새 작업대
layout-feedback.option-alt-desc=독립적인 새 작업대 인터페이스와 다운로드 패널을 사용합니다.
layout-feedback.current-layout=현재 레이아웃
layout-feedback.suggestion-label=개선 제안(선택 사항)
layout-feedback.suggestion-placeholder=예: 정보 밀도, 탐색 위치, 버튼 크기, 대기열 표시 또는 모바일 환경……
layout-feedback.suggestion-counter={count} / {max}
layout-feedback.privacy=이 설문은 고정 버전의 PostHog SDK를 사용하며, 고정된 이벤트 수신 인터페이스로 설문 응답, 설문 식별자, 설문 전용 익명 식별자, 전송 중복 제거용 안정적 이벤트 식별자, 애플리케이션 버전, 현재 레이아웃, 설문 구조 버전, 이벤트 시간 및 전송에 필요한 이벤트 이름과 공개 프로젝트 토큰을 보냅니다. 원본 설치 식별자, 계정, Cookie, 작품 또는 로컬 경로는 전송하지 않습니다.
layout-feedback.github-repo=코드 저장소로 이동
layout-feedback.snooze=나중에
layout-feedback.never=다시 묻지 않기
layout-feedback.submit=피드백 제출
layout-feedback.submitting=제출 중…
layout-feedback.submit-success=피드백을 보내 주셔서 감사합니다. 레이아웃 선호도가 제출되었습니다.
layout-feedback.submit-failed=제출하지 못했습니다. 다시 시도하세요.
layout-feedback.error-required=먼저 레이아웃을 선택하세요.
layout-feedback.error-suggestion-too-long=제안 내용이 너무 깁니다. 1000자 이내로 줄이세요.
layout-feedback.survey-unavailable=설문을 현재 이용할 수 없습니다.
layout-feedback.error-state-verification=설문 상태를 현재 확인할 수 없습니다. 잠시 후 다시 시도하세요.
layout-feedback.handled-elsewhere=이 레이아웃 설문은 다른 탭에서 처리되었습니다.
layout-feedback.close=닫기
layout-feedback.inbox-title=다운로드 작업대 레이아웃 선호도 설문
layout-feedback.inbox-body=사이트 내 메시지에서 장기적으로 사용할 기본 레이아웃을 선택하고 선택적으로 제안을 제출할 수 있습니다.
layout-feedback.embed-completed=이 설문은 완료되었거나 현재 작성할 필요가 없습니다.
layout-feedback.embed-unavailable=이 설문은 종료되었습니다.
layout-feedback.embed-temporarily-unavailable=설문을 일시적으로 불러올 수 없습니다. 잠시 후 다시 시도하세요.
