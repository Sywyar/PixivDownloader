layout-feedback.title=Help us choose the default layout
layout-feedback.description=The new version provides three download workbench layouts. Please choose the one you would prefer to keep using long term.
layout-feedback.choices-group=Choose the layout you would prefer to keep using
layout-feedback.option-landscape=Landscape workbench
layout-feedback.option-landscape-desc=Best for wide screens: modes, settings, and the download queue are shown side by side.
layout-feedback.option-portrait=Portrait classic layout
layout-feedback.option-portrait-desc=Content is arranged in a vertical flow, closer to the original experience.
layout-feedback.option-alt=Alternative workbench
layout-feedback.option-alt-desc=A separate new workbench interface with its own download panel.
layout-feedback.current-layout=Current layout
layout-feedback.suggestion-label=Optimization suggestions (optional)
layout-feedback.suggestion-placeholder=e.g. information density, navigation position, button size, queue layout, or mobile experience...
layout-feedback.suggestion-counter={count} / {max}
layout-feedback.privacy=On submit, your layout choice, optional suggestions, app version, and an anonymous survey identifier are sent to PostHog. In single-user mode the identifier is derived one-way from a random installation identity and the current survey id, and is only used to deduplicate this survey across browsers or devices of the same installation; in multi-user mode a PostHog-generated anonymous browser identifier is used. Pixiv cookies, account information, artwork data, download content, local paths, and the raw installation identity are never sent.
layout-feedback.snooze=Later
layout-feedback.never=Don't ask again
layout-feedback.submit=Submit feedback
layout-feedback.submitting=Submitting...
layout-feedback.submit-success=Thank you! Your layout preference has been submitted.
layout-feedback.submit-failed=Submission failed. Please try again.
layout-feedback.error-required=Please choose a layout first.
layout-feedback.error-suggestion-too-long=Suggestion is too long. Please keep it within 1000 characters.
layout-feedback.survey-unavailable=The survey is currently unavailable.
layout-feedback.error-state-verification=The survey state could not be verified. Please try again later.
layout-feedback.handled-elsewhere=This layout survey was already handled in another tab.
