<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="media.tools.title"></title>
    <script src="/js/pixiv-i18n.js"></script>
    <script src="/js/pixiv-theme.js"></script>
    <script src="/js/pixiv-feedback.js"></script>
    <link rel="stylesheet" href="/css/pixiv-feedback.css">
    <link rel="stylesheet" href="/css/pixiv-scrollbar.css">
    <link rel="stylesheet" href="/pixiv-batch/media-settings.css">
    <link rel="stylesheet" href="/pixiv-batch/media-tools.css">
    <script src="/pixiv-batch/media-settings.js" defer></script>
    <script src="/pixiv-batch/media-tools.js" defer></script>
</head>
<body>
<main class="media-tools">
    <h1 data-i18n="media.tools.title"></h1>
    <p data-i18n="media.tools.help"></p>
    <section>
        <label for="media-ids" data-i18n="media.tools.ids"></label>
        <textarea id="media-ids" rows="4" maxlength="11000" aria-describedby="media-scope-help"></textarea>
        <p id="media-scope-help" data-i18n="media.tools.scope-help"></p>
        <div id="media-formats"></div>
        <label class="media-check"><input type="checkbox" id="media-animations"><span data-i18n="media.tools.animations"></span></label>
        <label class="media-check"><input type="checkbox" id="media-thumbnails" checked><span data-i18n="media.tools.thumbnails"></span></label>
        <div class="media-actions">
            <button type="button" id="media-preview" data-i18n="media.tools.preview"></button>
            <button type="button" id="media-start" data-i18n="media.tools.start" disabled></button>
            <button type="button" id="media-cancel" data-i18n="media.tools.cancel" disabled></button>
        </div>
        <p id="media-status" role="status" aria-live="polite"></p>
        <pre id="media-preview-files" tabindex="0"></pre>
    </section>
    <section>
        <h2 data-i18n="media.tools.capabilities"></h2>
        <p data-i18n="media.tools.capabilities-help"></p>
        <button type="button" id="media-check" data-i18n="media.tools.check"></button>
        <p id="media-command"></p>
        <ul id="media-capabilities" aria-live="polite"></ul>
    </section>
</main>
</body>
</html>
