<!DOCTYPE html>
<html lang="zh-CN" class="ab-workbench ios" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载工作台 · Pixiv 下载助手</title>
    <link rel="stylesheet" href="/css/pixiv-layout.css">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/pixiv-tour.css">
    <link rel="stylesheet" href="/css/pixiv-onboarding.css">
    <link rel="stylesheet" href="/css/pixiv-motion.css">
    <link rel="stylesheet" href="/css/pixiv-feedback.css">
    <link rel="stylesheet" href="/css/pixiv-scrollbar.css">
    <link rel="stylesheet" href="/pixiv-layout-feedback/pixiv-layout-feedback.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/vendor/framework7/framework7.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/vendor/framework7/toggle.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/vendor/framework7/progressbar.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/vendor/framework7/preloader.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/experience-tokens.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/pixiv-batch-alt.css">
    <link rel="stylesheet" href="/pixiv-batch/media-settings.css">
    <link rel="stylesheet" href="/pixiv-batch/filename-template-presets.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/pixiv-batch-alt-layout.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/pixiv-batch-alt-dock.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/pixiv-batch-alt-schedule.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/pixiv-batch-alt-overlays.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/pixiv-batch-alt-responsive.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/pixiv-batch-alt-extensions.css">
    <link rel="stylesheet" href="/pixiv-batch-alt/pixiv-batch-alt-motion.css">
    <script src="/js/pixiv-layout.js" defer></script>
    <link rel="stylesheet" href="/pixiv-batch-alt/cupertino.css">
    <link rel="stylesheet" href="/pixiv-batch/pixiv-batch-queue-recovery.css">
</head>
<body class="ab-app layout-flow">
<header class="layout-sticky ab-topbar app-nav" data-layout-height="--layout-header-height">
    <div class="ab-brand">
        <span class="ab-brand-mark ab-icon" id="abBrandMark" data-icon="download" aria-hidden="true"></span>
        <div class="ab-brand-text">
            <strong data-i18n="brand.name">Pixiv 下载助手</strong>
            <span class="ab-brand-sub" data-i18n="brand.sub">批量下载工作台</span>
        </div>
    </div>
    <nav class="ab-topnav" data-nav-slot="app.top" data-nav-current="download-workbench"
         data-nav-link-class="ab-topnav-link" data-nav-active-class="is-active"
         data-nav-target="_blank" data-nav-rel="noopener" aria-label="跨插件导航"></nav>
    <div class="ab-topbar-actions">
        <button type="button" class="ab-chip ab-chip--warn button" id="abCookieChip">
            <span class="ab-chip-dot" aria-hidden="true"></span>
            <span class="ab-chip-label" data-i18n="cookie.status.missing">未保存 Cookie</span>
        </button>
        <div class="ab-version" id="abVersion">
            <button type="button" class="ab-chip ab-chip--ghost button" id="abVersionBtn">
                <span class="ab-icon" data-icon="sliders" aria-hidden="true"></span>
                <span data-i18n="workspace.more">更多</span>
            </button>
            <div class="ab-menu" id="abVersionMenu" hidden>
                <button type="button" class="ab-menu-item button" id="abScriptsBtn" data-i18n-title="scripts.entry" title="油猴脚本">
                    <span class="ab-icon" data-icon="puzzle" aria-hidden="true"></span><span data-i18n="scripts.entry">油猴脚本</span>
                </button>
                <button type="button" class="ab-menu-item button" id="batch-page-layout-switch"
                   data-download-page="pixiv-batch.html" hidden
                   data-i18n-title="page.switch-to-old-layout"
                   data-i18n-aria-label="page.switch-to-old-layout"
                   title="旧布局" aria-label="旧布局">
                    <span class="ab-icon" data-icon="grid" aria-hidden="true"></span><span data-i18n="page.switch-to-old-layout">旧布局</span>
                </button>
                <div class="ab-menu-preferences"><span id="abLangAnchor"></span><span id="abThemeAnchor"></span></div>
                <div class="ab-menu-head">
                    <strong id="abAppName">PixivDownloader</strong>
                    <span class="ab-muted" id="abAppVersion"></span>
                </div>
                <a class="ab-menu-item" id="abLinkGithub" href="#" target="_blank" rel="noopener" data-i18n="app.link.github">GitHub</a>
                <a class="ab-menu-item" id="abLinkReleases" href="#" target="_blank" rel="noopener" data-i18n="app.link.releases">Releases</a>
                <a class="ab-menu-item" id="abLinkDocs" href="#" target="_blank" rel="noopener" data-i18n="app.link.docs">文档</a>
                <a class="ab-menu-item" id="abLinkLicense" href="#" target="_blank" rel="noopener" data-i18n="app.link.license">License</a>
            </div>
        </div>
        <template data-qt-slot="topbar-actions"></template>
        <button type="button" class="ab-btn ab-btn--primary ab-btn--sm button button-fill layout-touch" id="abAuthBtn" data-i18n="auth.login">登录</button>
    </div>
</header>

<div class="ab-backend-banner" id="abBackendBanner" hidden>
    <span class="ab-icon" data-icon="alert" aria-hidden="true"></span>
    <span data-i18n="backend.unavailable">无法连接后端服务，请确认服务已启动后重试。</span>
</div>

<div class="ab-shell" id="abShell">
    <aside class="ab-sidebar">
        <p class="ab-nav-label" data-i18n="workspace.sources">获取方式</p>
        <nav class="ab-rail" id="abRail" aria-label="获取方式" data-i18n-aria-label="workspace.sources">
            <div class="ab-rail-modes" id="abRailModes" role="tablist" aria-orientation="vertical" aria-label="获取方式" data-i18n-aria-label="workspace.sources"></div>
        </nav>
        <nav class="ab-workspaces" aria-label="工作区" data-i18n-aria-label="workspace.navigation">
            <button type="button" class="ab-workspace button" id="abDockToggle" aria-controls="abDock">
                <span class="ab-icon" data-icon="download" aria-hidden="true"></span>
                <span data-i18n="workspace.downloads">下载列表</span>
                <span class="ab-badge" id="abDockBadge" hidden>0</span>
            </button>
            <button type="button" class="ab-workspace button" id="abScheduleTab" aria-controls="abStage" hidden>
                <span class="ab-icon" data-icon="clock" aria-hidden="true"></span>
                <span data-i18n="modes.schedule">计划任务</span>
            </button>
        </nav>
    </aside>
    <div class="ab-content">
        <main class="ab-stage" id="abStage" tabindex="-1">
            <section class="ab-mode-panel" id="abModePanel" role="tabpanel" tabindex="-1"></section>
        </main>
        <section class="ab-dock" id="abDock" aria-labelledby="abDownloadsTitle" tabindex="-1" hidden>
            <div class="ab-dock-head">
                <div>
                    <h1 class="ab-dock-title" id="abDownloadsTitle" data-i18n="workspace.downloads">下载列表</h1>
                    <p class="ab-mode-desc" data-i18n="workspace.downloads.hint">查看进度、处理失败，或继续添加作品。</p>
                </div>
                <div class="ab-mode-actions" id="abDownloadOptions"></div>
            </div>
            <div class="ab-active-filters" data-active-filters="1"></div>
            <div class="ab-dock-body" id="abDockBody"></div>
        </section>
        <div class="ab-selection-bar" id="abSelectionBar" hidden></div>
    </div>
</div>

<dialog class="ab-drawer-root" id="abDrawerRoot"></dialog>
<dialog class="ab-modal-root" id="abModalRoot"></dialog>

<script src="/js/pixiv-i18n.js"></script>
<script src="/js/pixiv-theme.js"></script>
<script src="/js/pixiv-lang-switcher.js"></script>
<script src="/js/pixiv-navigation.js"></script>
<script src="/js/pixiv-tour.js"></script>
<script src="/js/pixiv-onboarding-core.js"></script>
<script src="/js/pixiv-onboarding-overlay.js"></script>
<script src="/js/pixiv-onboarding-download.js"></script>
<script src="/js/pixiv-onboarding-gallery.js"></script>
<script src="/js/pixiv-onboarding.js"></script>
<script src="/js/pixiv-feedback.js"></script>
<!-- Vue 槽位挂载共享 helper（加性、加载即无副作用；运行时单一来源 /vendor/vue/ 由 PixivVue.ensure() 按需懒加载）。
     下载坞统计 / 当前下载 / 队列列表（alt-queue-vue.js）与插件槽位（renderSlots 主路径）据此做 reactive 渲染；
     缺失即优雅回退命令式渲染。 -->
<script src="/js/pixiv-vue.js"></script>
<script src="/pixiv-layout-feedback/release-activation.js"></script>
<script src="/pixiv-posthog/pixiv-posthog.js"></script>
<script src="/pixiv-layout-feedback/posthog-config.js"></script>
<script src="/pixiv-layout-feedback/pixiv-layout-feedback-core.js"></script>
<script src="/pixiv-layout-feedback/pixiv-layout-feedback-server.js"></script>
<script src="/pixiv-layout-feedback/pixiv-layout-feedback-state.js"></script>
<script src="/pixiv-layout-feedback/pixiv-layout-feedback-survey.js"></script>
<script src="/pixiv-layout-feedback/pixiv-layout-feedback-dialog.js"></script>
<script src="/pixiv-layout-feedback/pixiv-layout-feedback.js"></script>
<script src="/pixiv-batch-alt/alt-core.js"></script>
<script src="/pixiv-batch/batch-fetch-json.js"></script>
<script src="/pixiv-batch-alt/alt-state.js"></script>
<script src="/pixiv-batch-alt/alt-cookie.js"></script>
<script src="/pixiv-batch-alt/alt-filters.js"></script>
<script src="/pixiv-batch/media-settings.js"></script>
<script src="/pixiv-batch/filename-template-presets.js"></script>
<script src="/pixiv-batch/page-layout.js"></script>
<script src="/pixiv-batch-alt/alt-settings.js"></script>
<script src="/pixiv-batch-alt/alt-chrome.js"></script>
<script src="/pixiv-batch-alt/alt-selection.js"></script>
<script src="/pixiv-batch-alt/alt-modes.js"></script>
<script src="/pixiv-batch-alt/alt-mode-capture.js"></script>
<script src="/pixiv-batch-alt/alt-mode-discovery.js"></script>
<script src="/pixiv-batch-alt/alt-mode-series.js"></script>
<script src="/pixiv-batch-alt/alt-schedule-presentation.js"></script>
<script src="/pixiv-batch-alt/alt-schedule.js"></script>
<script src="/pixiv-batch-alt/alt-schedule-actions.js"></script>
<script src="/pixiv-batch-alt/alt-schedule-editor.js"></script>
<script src="/pixiv-batch-alt/alt-queue.js"></script>
<script src="/pixiv-batch/batch-media-progress.js"></script>
<!-- 下载坞 Vue 岛：统计卡 / 当前下载卡 / 队列列表 + 计划任务本轮队列详情的 reactive 主渲染，
     命令式为首屏占位与回退（见文件头注释）。 -->
<script src="/pixiv-batch-alt/alt-queue-vue.js"></script>
<script src="/pixiv-batch-alt/alt-engine.js"></script>
<script src="/pixiv-batch-alt/alt-engine-stream.js"></script>
<script src="/pixiv-batch-alt/alt-engine-workers.js"></script>
<script src="/pixiv-batch/batch-queue-types-normalize.js"></script>
<script src="/pixiv-batch/batch-queue-types-runtime.js"></script>
<script src="/pixiv-batch/batch-queue-types.js"></script>
<script src="/pixiv-batch/batch-schedule-sources-normalize.js"></script>
<script src="/pixiv-batch/batch-schedule-sources-runtime.js"></script>
<script src="/pixiv-batch/batch-schedule-sources.js"></script>
<script src="/pixiv-batch-alt/alt-extensions.js"></script>
<script src="/pixiv-batch/batch-path-actions.js"></script>
<script src="/pixiv-batch/batch-queue-recovery.js"></script>
<script src="/pixiv-batch-alt/alt-init.js"></script>
</body>
</html>
