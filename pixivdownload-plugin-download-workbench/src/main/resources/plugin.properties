plugin.id=download-workbench
plugin.version=1.1.0
plugin.requires=1.4
plugin.class=top.sywyar.pixivdownload.download.DownloadWorkbenchPf4jPlugin
plugin.provider=PixivDownloader
plugin.description=Provides the application's main download pages. Disabling or removing this plugin may leave no interface for third-party download types. Existing schedules provided independently by other plugins can continue to run; schedules that depend on this plugin's sources, including Pixiv novel schedules, will be suspended.
plugin.dependencies=posthog?@1.0
pixiv.display-namespace=batch
pixiv.display-name-key=plugin.name
pixiv.description-key=plugin.summary
pixiv.icon-key=download
pixiv.color-token=pixiv
pixiv.kind=feature
pixiv.configuration-classes=top.sywyar.pixivdownload.download.DownloadWorkbenchPluginConfiguration
pixiv.lifecycle-policy=process-restart
pixiv.execution-mode=host-process-full-trust
