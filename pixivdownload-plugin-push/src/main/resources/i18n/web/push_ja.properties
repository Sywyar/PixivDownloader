plugin.name=プッシュ通知
plugin.summary=スケジュールタスクのアラートに使用するマルチチャネルプッシュ通知。
gui.config.notification.service.label=通知サービス
gui.config.notification.hint=有効にしたサービスはすべて同時に有効になります。プルダウンは編集対象のサービス切り替えにのみ使用します
gui.config.push.security.notice=プッシュサービスとカスタム Webhook には通知内容と必要な資格情報が送信されます。信頼できる宛先だけを入力してください。資格情報を含むリクエストは HTTP リダイレクトに追従しません。http:// を使用すると送信内容は暗号化されません
gui.config.notification.service.help=編集する通知サービスをプルダウンで選択します。有効なサービスはすべて同時に通知を送信します
gui.config.notification.service.bark=Bark
gui.config.notification.service.dingtalk=DingTalk
gui.config.notification.service.telegram=Telegram
gui.config.notification.service.feishu=Feishu
gui.config.notification.service.wecom=WeCom
gui.config.notification.service.pushplus=PushPlus
gui.config.notification.service.serverchan=Server 酱
gui.config.notification.service.webhook=カスタム Webhook
gui.config.push.test-current-button.label=このチャネルをテスト
gui.config.push.test-current-button.help=現在のフォーム設定（保存不要）で、現在選択しているチャネルだけにテストメッセージを送信します
gui.config.push.test.notice.current-success=テストプッシュを送信しました
gui.config.push.test.notice.current-failed=テストプッシュに失敗しました：{0}
gui.config.push.test.notice.current-skipped=現在のチャネルの入力が不完全なため、スキップしました
gui.config.push.test-all.button.label=すべてのメッセージテンプレートを送信
gui.config.push.test-all.button.help=現在のフォーム設定（保存不要）で、現在のチャネルへすべての通知メッセージを順番に送信します。そのチャネルでの表示を確認できます
gui.config.push.test-all.notice.sending=すべてのメッセージテンプレートを送信しています。しばらくお待ちください…
gui.config.push.test-all.notice.success=すべてのメッセージテンプレート（{0}件）を送信しました
gui.config.push.test-all.notice.partial=一部のメッセージを送信しました：{0}/{1}件（{2}）
gui.config.push.test-all.notice.skipped=現在のチャネルの入力が不完全なため、スキップしました
gui.config.field.push.enabled.label=プッシュを有効にする
gui.config.field.push.enabled.help=プッシュ通知全体のスイッチ。無効にするとすべてのチャネルから送信しません
gui.config.field.push.use-proxy.help=有効にすると、このチャネルのリクエストは HTTP プロキシを経由します（アドレスはプロキシ設定の host:port）。グローバルプロキシ設定とは独立しています
gui.config.field.push.bark.enabled.label=Bark を有効にする
gui.config.field.push.bark.enabled.help=Bark は iOS のプッシュ通知アプリです。有効にするとテスト／通知メッセージを受信します
gui.config.field.push.bark.server.label=Bark サーバー
gui.config.field.push.bark.server.help=公式の公開サーバーは https://api.day.app です。自分で構築したアドレスも入力できます
gui.config.field.push.bark.device-key.label=デバイス Key
gui.config.field.push.bark.device-key.help=Bark アプリで取得します。ログに表示されることはありません
gui.config.field.push.bark.sound.label=通知音
gui.config.field.push.bark.sound.help=任意の通知音名。空欄の場合はアプリの既定値を使用します
gui.config.field.push.bark.use-proxy.label=Bark でプロキシを使用
gui.config.field.push.dingtalk.enabled.label=DingTalk を有効にする
gui.config.field.push.dingtalk.enabled.help=DingTalk グループのカスタムロボット。有効にするとテスト／通知メッセージを受信します
gui.config.field.push.dingtalk.access-token.label=Access Token
gui.config.field.push.dingtalk.access-token.help=DingTalk ロボットの作成後、https://oapi.dingtalk.com/robot/send?access_token=xxxx の形式の Webhook リンクが得られます。access_token= の後の部分を入力してください。ログに表示されることはありません
gui.config.field.push.dingtalk.secret.label=署名キー
gui.config.field.push.dingtalk.secret.help=DingTalk ロボットの作成時に「セキュリティ設定」で「署名」を選び、SEC で始まる生成キーを入力します（ページを閉じると再表示できないため、すぐにコピーしてください）。「カスタムキーワード」または「IP ホワイトリスト」を使う場合は空欄にします。ログに表示されることはありません
gui.config.field.push.dingtalk.use-proxy.label=DingTalk でプロキシを使用
gui.config.field.push.telegram.enabled.label=Telegram を有効にする
gui.config.field.push.telegram.enabled.help=Telegram Bot。有効にするとテスト／通知メッセージを受信します（中国国内では通常プロキシが必要です）
gui.config.field.push.telegram.bot-token.label=Bot Token
gui.config.field.push.telegram.bot-token.help=@BotFather に申請して取得します。ログに表示されることはありません
gui.config.field.push.telegram.chat-id.label=Chat ID
gui.config.field.push.telegram.chat-id.help=対象会話の ID（ユーザー／グループ／チャンネル）
gui.config.field.push.telegram.use-proxy.label=Telegram でプロキシを使用
gui.config.field.push.feishu.enabled.label=Feishu を有効にする
gui.config.field.push.feishu.enabled.help=Feishu グループのカスタムロボット。有効にするとテスト／通知メッセージを受信します
gui.config.field.push.feishu.webhook-key.label=Webhook Key
gui.config.field.push.feishu.webhook-key.help=Feishu ロボット Webhook アドレス末尾の key（.../bot/v2/hook/ の後の部分）。ログに表示されることはありません
gui.config.field.push.feishu.secret.label=署名キー
gui.config.field.push.feishu.secret.help=ロボットのセキュリティ設定で「署名検証」を選んだ場合に入力します。「カスタムキーワード」または「IP ホワイトリスト」を使う場合は空欄にします。ログに表示されることはありません
gui.config.field.push.feishu.use-proxy.label=Feishu でプロキシを使用
gui.config.field.push.wecom.enabled.label=WeCom を有効にする
gui.config.field.push.wecom.enabled.help=WeCom グループロボット。有効にするとテスト／通知メッセージを受信します
gui.config.field.push.wecom.key.label=ロボット Key
gui.config.field.push.wecom.key.help=WeCom グループロボットの Webhook リンクに含まれる key。ログに表示されることはありません
gui.config.field.push.wecom.use-proxy.label=WeCom でプロキシを使用
gui.config.field.push.pushplus.enabled.label=PushPlus を有効にする
gui.config.field.push.pushplus.enabled.help=PushPlus（推送加）。WeChat に送信します。有効にするとテスト／通知メッセージを受信します
gui.config.field.push.pushplus.token.label=Token
gui.config.field.push.pushplus.token.help=PushPlus ユーザートークン。公式サイトまたは「pushplus 推送加」公式アカウントで token と返信して取得します。ログに表示されることはありません
gui.config.field.push.pushplus.use-proxy.label=PushPlus でプロキシを使用
gui.config.field.push.serverchan.enabled.label=Server 酱を有効にする
gui.config.field.push.serverchan.enabled.help=Server 酱（Turbo / ³）。WeChat に送信します。有効にするとテスト／通知メッセージを受信します
gui.config.field.push.serverchan.send-key.label=SendKey
gui.config.field.push.serverchan.send-key.help=Server 酱 SendKey。sctp プレフィックスは自動的に Server 酱³ エンドポイントを使用します。ログに表示されることはありません
gui.config.field.push.serverchan.use-proxy.label=Server 酱でプロキシを使用
gui.config.field.push.webhook.enabled.label=カスタム Webhook を有効にする
gui.config.field.push.webhook.enabled.help=汎用チャネル。URL とリクエスト本文テンプレートを入力して、Discord / Slack / ntfy / Gotify などに接続できます
gui.config.field.push.webhook.url.label=URL
gui.config.field.push.webhook.url.help=宛先アドレス（http/https）。トークンを含む場合があるため、資格情報として安全に保存され、ログには書き込まれません
gui.config.field.push.webhook.content-type.label=Content-Type
gui.config.field.push.webhook.content-type.help=リクエストの Content-Type。既定値は application/json です
gui.config.field.push.webhook.body-template.label=リクエスト本文テンプレート
gui.config.field.push.webhook.body-template.help={{title}} / {{content}} プレースホルダーに対応します。空欄の場合は {"title":"{{title}}","content":"{{content}}"} を使用します。JSON 形式ではプレースホルダーの値を自動でエスケープします
gui.config.field.push.webhook.use-proxy.label=Webhook でプロキシを使用
gui.config.push.test-button.label=プッシュをテスト
gui.config.push.test-button.help=現在のフォーム設定（保存不要）で、有効に設定したすべてのチャネルへテストメッセージを1件ずつ送信します
gui.config.push.test.notice.sending=テストプッシュを送信しています。しばらくお待ちください…
gui.config.push.test.notice.success=テストプッシュをすべて送信しました（{0}チャネル）
gui.config.push.test.notice.partial=テストプッシュの一部に成功しました：{0}/{1}チャネル（{2}）
gui.config.push.test.notice.none=有効に設定され、入力が完了しているプッシュチャネルはありません
gui.config.push.test.notice.unreachable=バックエンドサービスに接続できません。サービスが実行中か確認してください
