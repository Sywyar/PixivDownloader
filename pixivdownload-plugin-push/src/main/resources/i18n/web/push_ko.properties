plugin.name=푸시 알림
plugin.summary=예약 작업 경고에 사용하는 다중 채널 푸시 알림.
gui.config.notification.service.label=알림 서비스
gui.config.notification.hint=활성화된 서비스는 동시에 적용되며 드롭다운은 현재 편집할 서비스만 전환합니다.
gui.config.push.security.notice=푸시 서비스와 사용자 지정 Webhook은 알림 내용과 필요한 자격 증명을 받습니다. 신뢰할 수 있는 대상만 입력하세요. 자격 증명이 포함된 요청은 HTTP 리디렉션을 따르지 않으며 http://를 사용하면 전송 내용이 암호화되지 않습니다.
gui.config.notification.service.help=드롭다운에서 편집할 알림 서비스를 선택하세요. 활성화된 모든 서비스가 동시에 알림을 보냅니다.
gui.config.notification.service.bark=Bark
gui.config.notification.service.dingtalk=DingTalk
gui.config.notification.service.telegram=Telegram
gui.config.notification.service.feishu=Lark
gui.config.notification.service.wecom=WeCom
gui.config.notification.service.pushplus=PushPlus
gui.config.notification.service.serverchan=Server酱
gui.config.notification.service.webhook=사용자 지정 Webhook
gui.config.push.test-current-button.label=이 채널 테스트
gui.config.push.test-current-button.help=현재 선택한 채널에만 테스트 메시지 하나를 보냅니다(먼저 저장할 필요 없음).
gui.config.push.test.notice.current-success=테스트 푸시를 성공적으로 보냈습니다.
gui.config.push.test.notice.current-failed=테스트 푸시 실패: {0}
gui.config.push.test.notice.current-skipped=현재 채널 설정이 완전하지 않아 건너뛰었습니다.
gui.config.push.test-all.button.label=모든 메시지 템플릿 보내기
gui.config.push.test-all.button.help=현재 채널에 모든 알림 메시지를 하나씩 보내 해당 채널에서 각 알림이 실제로 어떻게 표시되는지 미리 봅니다(먼저 저장할 필요 없음).
gui.config.push.test-all.notice.sending=모든 메시지 템플릿을 보내는 중입니다. 잠시 기다려 주세요…
gui.config.push.test-all.notice.success=모든 메시지 템플릿을 성공적으로 보냈습니다(총 {0}개).
gui.config.push.test-all.notice.partial=일부 메시지를 보냈습니다: {0}/{1}개({2})
gui.config.push.test-all.notice.skipped=현재 채널 설정이 완전하지 않아 건너뛰었습니다.
gui.config.field.push.enabled.label=푸시 활성화
gui.config.field.push.enabled.help=푸시 전체 스위치입니다. 끄면 모든 채널이 전송하지 않습니다.
gui.config.field.push.use-proxy.help=켜면 이 채널의 요청이 프록시 설정의 host:port를 사용하는 HTTP 프록시를 통과합니다. 전역 프록시 스위치와 독립적입니다.
gui.config.field.push.bark.enabled.label=Bark 활성화
gui.config.field.push.bark.enabled.help=Bark는 iOS용 푸시 앱입니다. 켜면 테스트/알림 메시지를 받습니다.
gui.config.field.push.bark.server.label=Bark 서버
gui.config.field.push.bark.server.help=공식 공용 서버는 https://api.day.app이며 직접 만든 주소도 입력할 수 있습니다.
gui.config.field.push.bark.device-key.label=기기 Key
gui.config.field.push.bark.device-key.help=Bark 앱에서 확인할 수 있습니다. 로그에 절대 표시되지 않습니다.
gui.config.field.push.bark.sound.label=알림음
gui.config.field.push.bark.sound.help=선택 사항인 알림음 이름입니다. 비워 두면 앱 기본값을 사용합니다.
gui.config.field.push.bark.use-proxy.label=Bark 프록시 사용
gui.config.field.push.dingtalk.enabled.label=DingTalk 활성화
gui.config.field.push.dingtalk.enabled.help=DingTalk 그룹 사용자 지정 봇입니다. 켜면 테스트/알림 메시지를 받습니다.
gui.config.field.push.dingtalk.access-token.label=Access Token
gui.config.field.push.dingtalk.access-token.help=DingTalk 봇을 만든 후 https://oapi.dingtalk.com/robot/send?access_token=xxxx 형식의 Webhook 링크를 받습니다. access_token= 뒤의 부분을 입력하세요. 로그에 절대 표시되지 않습니다.
gui.config.field.push.dingtalk.secret.label=서명 키
gui.config.field.push.dingtalk.secret.help=DingTalk 봇을 만들 때 "보안 설정"에서 "서명"을 선택하고 생성된 SEC로 시작하는 키를 입력하세요. 페이지를 닫으면 다시 볼 수 없으므로 즉시 복사하세요. "사용자 지정 키워드" 또는 "IP 허용 목록"을 사용하면 비워 둡니다. 로그에 절대 표시되지 않습니다.
gui.config.field.push.dingtalk.use-proxy.label=DingTalk 프록시 사용
gui.config.field.push.telegram.enabled.label=Telegram 활성화
gui.config.field.push.telegram.enabled.help=Telegram Bot입니다. 켜면 테스트/알림 메시지를 받습니다(중국 내에서는 보통 프록시가 필요함).
gui.config.field.push.telegram.bot-token.label=Bot Token
gui.config.field.push.telegram.bot-token.help=@BotFather에 신청하여 받습니다. 로그에 절대 표시되지 않습니다.
gui.config.field.push.telegram.chat-id.label=Chat ID
gui.config.field.push.telegram.chat-id.help=대상 대화 ID(사용자 / 그룹 / 채널)
gui.config.field.push.telegram.use-proxy.label=Telegram 프록시 사용
gui.config.field.push.feishu.enabled.label=Lark 활성화
gui.config.field.push.feishu.enabled.help=Lark 그룹 사용자 지정 봇입니다. 켜면 테스트/알림 메시지를 받습니다.
gui.config.field.push.feishu.webhook-key.label=Webhook Key
gui.config.field.push.feishu.webhook-key.help=Lark 봇 Webhook 주소 마지막 부분의 key(.../bot/v2/hook/ 뒤의 값)입니다. 로그에 절대 표시되지 않습니다.
gui.config.field.push.feishu.secret.label=서명 키
gui.config.field.push.feishu.secret.help=봇 보안 설정에서 "서명 검증"을 선택했을 때 입력합니다. "사용자 지정 키워드" 또는 "IP 허용 목록"을 사용하면 비워 둡니다. 로그에 절대 표시되지 않습니다.
gui.config.field.push.feishu.use-proxy.label=Lark 프록시 사용
gui.config.field.push.wecom.enabled.label=WeCom 활성화
gui.config.field.push.wecom.enabled.help=WeCom 그룹 봇입니다. 켜면 테스트/알림 메시지를 받습니다.
gui.config.field.push.wecom.key.label=봇 Key
gui.config.field.push.wecom.key.help=WeCom 그룹 봇 Webhook 링크의 key입니다. 로그에 절대 표시되지 않습니다.
gui.config.field.push.wecom.use-proxy.label=WeCom 프록시 사용
gui.config.field.push.pushplus.enabled.label=PushPlus 활성화
gui.config.field.push.pushplus.enabled.help=PushPlus(푸시 플러스)로 WeChat에 보냅니다. 켜면 테스트/알림 메시지를 받습니다.
gui.config.field.push.pushplus.token.label=Token
gui.config.field.push.pushplus.token.help=PushPlus 사용자 토큰입니다. 공식 사이트 또는 "pushplus 푸시 플러스" 공식 계정에 token이라고 답장하여 받을 수 있습니다. 로그에 절대 표시되지 않습니다.
gui.config.field.push.pushplus.use-proxy.label=PushPlus 프록시 사용
gui.config.field.push.serverchan.enabled.label=Server酱 활성화
gui.config.field.push.serverchan.enabled.help=Server酱(Turbo / ³)으로 WeChat에 보냅니다. 켜면 테스트/알림 메시지를 받습니다.
gui.config.field.push.serverchan.send-key.label=SendKey
gui.config.field.push.serverchan.send-key.help=Server酱 SendKey입니다. sctp 접두사는 자동으로 Server酱³ 엔드포인트를 사용합니다. 로그에 절대 표시되지 않습니다.
gui.config.field.push.serverchan.use-proxy.label=Server酱 프록시 사용
gui.config.field.push.webhook.enabled.label=사용자 지정 Webhook 활성화
gui.config.field.push.webhook.enabled.help=범용 채널입니다. URL과 요청 본문 템플릿을 직접 입력하여 Discord / Slack / ntfy / Gotify 등에 연결할 수 있습니다.
gui.config.field.push.webhook.url.label=URL
gui.config.field.push.webhook.url.help=대상 주소(http/https)이며 토큰이 포함될 수 있습니다. 자격 증명으로 안전하게 저장되고 로그에는 기록되지 않습니다.
gui.config.field.push.webhook.content-type.label=콘텐츠 유형
gui.config.field.push.webhook.content-type.help=요청 Content-Type이며 기본값은 application/json입니다.
gui.config.field.push.webhook.body-template.label=요청 본문 템플릿
gui.config.field.push.webhook.body-template.help={{title}} / {{content}} 플레이스홀더를 지원합니다. 비워 두면 {"title":"{{title}}","content":"{{content}}"}을 사용합니다. JSON 유형에서는 플레이스홀더 값이 자동으로 이스케이프됩니다.
gui.config.field.push.webhook.use-proxy.label=Webhook 프록시 사용
gui.config.push.test-button.label=푸시 테스트
gui.config.push.test-button.help=활성화로 선택하고 설정이 완전한 모든 채널에 테스트 메시지를 하나씩 보냅니다(먼저 저장할 필요 없음).
gui.config.push.test.notice.sending=테스트 푸시를 보내는 중입니다. 잠시 기다려 주세요…
gui.config.push.test.notice.success=테스트 푸시를 모두 성공적으로 보냈습니다(총 {0}개 채널).
gui.config.push.test.notice.partial=테스트 푸시 일부 성공: {0}/{1}개 채널 성공({2})
gui.config.push.test.notice.none=활성화로 선택되고 설정이 완전한 푸시 채널이 없습니다.
gui.config.push.test.notice.unreachable=백엔드 서비스에 연결할 수 없습니다. 서비스가 실행 중인지 확인하세요.
