plugin.name=推送通知
plugin.summary=排程工作警示使用的多通道推送通知。
gui.config.notification.service.label=通知服務
gui.config.notification.hint=已啟用的服務會同時生效；下拉選單僅用於切換目前編輯的服務
gui.config.push.security.notice=推送服務和自訂 Webhook 會收到通知內容及所需憑證；僅填寫信任的目標。含憑證的請求不會跟隨 HTTP 重新導向；使用 http:// 時傳輸內容不會加密
gui.config.notification.service.help=下拉選擇要編輯的通知服務；所有已啟用的服務會同時發送通知
gui.config.notification.service.bark=Bark
gui.config.notification.service.dingtalk=釘釘
gui.config.notification.service.telegram=Telegram
gui.config.notification.service.feishu=飛書
gui.config.notification.service.wecom=企業微信
gui.config.notification.service.pushplus=PushPlus
gui.config.notification.service.serverchan=Server 醬
gui.config.notification.service.webhook=自訂 Webhook
gui.config.push.test-current-button.label=測試此頻道
gui.config.push.test-current-button.help=使用目前表單設定（不需先儲存）只向目前選取的頻道傳送一則測試訊息
gui.config.push.test.notice.current-success=測試推送已成功傳送
gui.config.push.test.notice.current-failed=測試推送失敗：{0}
gui.config.push.test.notice.current-skipped=目前頻道未填寫完整，已略過
gui.config.push.test-all.button.label=傳送所有訊息範本
gui.config.push.test-all.button.help=使用目前表單設定（不需先儲存）向目前頻道逐一傳送全部通知訊息，方便預覽各類通知在該頻道的實際呈現
gui.config.push.test-all.notice.sending=正在傳送所有訊息範本，請稍候…
gui.config.push.test-all.notice.success=所有訊息範本均已成功傳送（共 {0} 則）
gui.config.push.test-all.notice.partial=部分訊息傳送成功：{0}/{1} 則（{2}）
gui.config.push.test-all.notice.skipped=目前頻道未填寫完整，已略過
gui.config.field.push.enabled.label=啟用推送
gui.config.field.push.enabled.help=推送總開關；關閉時所有頻道都不會傳送
gui.config.field.push.use-proxy.help=開啟後本頻道的請求會經由 HTTP 代理（位址取自代理設定的 host:port）；獨立於全域代理開關
gui.config.field.push.bark.enabled.label=啟用 Bark
gui.config.field.push.bark.enabled.help=Bark 是 iOS 上的推送 App；開啟後接收測試／通知訊息
gui.config.field.push.bark.server.label=Bark 伺服器
gui.config.field.push.bark.server.help=官方公共伺服器為 https://api.day.app，也可填寫自建位址
gui.config.field.push.bark.device-key.label=裝置 Key
gui.config.field.push.bark.device-key.help=在 Bark App 中取得；絕不會出現在記錄中
gui.config.field.push.bark.sound.label=提示音
gui.config.field.push.bark.sound.help=可選提示音名稱，留空則使用 App 預設值
gui.config.field.push.bark.use-proxy.label=Bark 使用代理
gui.config.field.push.dingtalk.enabled.label=啟用釘釘
gui.config.field.push.dingtalk.enabled.help=釘釘群組自訂機器人；開啟後接收測試／通知訊息
gui.config.field.push.dingtalk.access-token.label=Access Token
gui.config.field.push.dingtalk.access-token.help=建立釘釘機器人後會取得類似 https://oapi.dingtalk.com/robot/send?access_token=xxxx 的 Webhook 連結，將 access_token= 後面的部分填入此處；絕不會出現在記錄中
gui.config.field.push.dingtalk.secret.label=加簽密鑰
gui.config.field.push.dingtalk.secret.help=建立釘釘機器人時在「安全設定」中勾選「加簽」，將產生的 SEC 開頭密鑰填入此處（關閉頁面後無法再次檢視，請及時複製）；若改用「自訂關鍵字」或「IP 白名單」則留空。絕不會出現在記錄中
gui.config.field.push.dingtalk.use-proxy.label=釘釘使用代理
gui.config.field.push.telegram.enabled.label=啟用 Telegram
gui.config.field.push.telegram.enabled.help=Telegram Bot；開啟後接收測試／通知訊息（中國大陸通常需要啟用代理）
gui.config.field.push.telegram.bot-token.label=Bot Token
gui.config.field.push.telegram.bot-token.help=向 @BotFather 申請取得；絕不會出現在記錄中
gui.config.field.push.telegram.chat-id.label=Chat ID
gui.config.field.push.telegram.chat-id.help=目標對話 id（使用者／群組／頻道）
gui.config.field.push.telegram.use-proxy.label=Telegram 使用代理
gui.config.field.push.feishu.enabled.label=啟用飛書
gui.config.field.push.feishu.enabled.help=飛書群組自訂機器人；開啟後接收測試／通知訊息
gui.config.field.push.feishu.webhook-key.label=Webhook Key
gui.config.field.push.feishu.webhook-key.help=飛書機器人 Webhook 位址末段的 key（.../bot/v2/hook/ 之後的部分）；絕不會出現在記錄中
gui.config.field.push.feishu.secret.label=簽名密鑰
gui.config.field.push.feishu.secret.help=機器人安全設定選擇「簽名校驗」時填寫；若使用「自訂關鍵字」或「IP 白名單」則留空。絕不會出現在記錄中
gui.config.field.push.feishu.use-proxy.label=飛書使用代理
gui.config.field.push.wecom.enabled.label=啟用企業微信
gui.config.field.push.wecom.enabled.help=企業微信群組機器人；開啟後接收測試／通知訊息
gui.config.field.push.wecom.key.label=機器人 Key
gui.config.field.push.wecom.key.help=企業微信群組機器人 Webhook 連結中的 key；絕不會出現在記錄中
gui.config.field.push.wecom.use-proxy.label=企業微信使用代理
gui.config.field.push.pushplus.enabled.label=啟用 PushPlus
gui.config.field.push.pushplus.enabled.help=PushPlus（推送加），推送到微信；開啟後接收測試／通知訊息
gui.config.field.push.pushplus.token.label=Token
gui.config.field.push.pushplus.token.help=PushPlus 使用者令牌；在官網或「pushplus 推送加」公眾號回覆 token 取得。絕不會出現在記錄中
gui.config.field.push.pushplus.use-proxy.label=PushPlus 使用代理
gui.config.field.push.serverchan.enabled.label=啟用 Server 醬
gui.config.field.push.serverchan.enabled.help=Server 醬（Turbo／³），推送到微信；開啟後接收測試／通知訊息
gui.config.field.push.serverchan.send-key.label=SendKey
gui.config.field.push.serverchan.send-key.help=Server 醬 SendKey；sctp 前綴會自動使用 Server 醬³ 端點。絕不會出現在記錄中
gui.config.field.push.serverchan.use-proxy.label=Server 醬使用代理
gui.config.field.push.webhook.enabled.label=啟用自訂 Webhook
gui.config.field.push.webhook.enabled.help=萬用頻道：自行填寫 URL 與請求本文範本，可串接 Discord／Slack／ntfy／Gotify 等
gui.config.field.push.webhook.url.label=URL
gui.config.field.push.webhook.url.help=目標位址（http/https）；可能包含權杖，請依憑證安全儲存且不會寫入記錄
gui.config.field.push.webhook.content-type.label=內容類型
gui.config.field.push.webhook.content-type.help=請求 Content-Type，預設 application/json
gui.config.field.push.webhook.body-template.label=請求本文範本
gui.config.field.push.webhook.body-template.help=支援 {{title}}／{{content}} 佔位符；留空則使用 {"title":"{{title}}","content":"{{content}}"}。JSON 類型會自動跳脫佔位符值
gui.config.field.push.webhook.use-proxy.label=Webhook 使用代理
gui.config.push.test-button.label=測試推送
gui.config.push.test-button.help=使用目前表單設定（不需先儲存）向所有已勾選啟用的頻道各傳送一則測試訊息
gui.config.push.test.notice.sending=正在傳送測試推送，請稍候…
gui.config.push.test.notice.success=測試推送均已成功傳送（共 {0} 個頻道）
gui.config.push.test.notice.partial=測試推送部分成功：{0}/{1} 個頻道成功（{2}）
gui.config.push.test.notice.none=沒有已勾選啟用且填寫完整的推送頻道
gui.config.push.test.notice.unreachable=無法連線到後端服務，請確認服務正在執行
