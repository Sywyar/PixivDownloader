plugin.id=pixiv-batch-downloader-import
plugin.version=1.0.0
plugin.requires=1.0
plugin.class=top.sywyar.pixivdownload.externalimport.ExternalImportPlugin
plugin.provider=Sywyar
plugin.description=Automatically import new PixivBatchDownloader downloads with the companion userscript after one-time download directory setup; retain original files without scanning past downloads.
pixiv.display-namespace=external-import
pixiv.display-name-key=plugin.name
pixiv.description-key=plugin.summary
pixiv.icon-key=download
pixiv.color-token=blue
pixiv.kind=feature
pixiv.configuration-classes=top.sywyar.pixivdownload.externalimport.ExternalImportConfiguration
pixiv.lifecycle-policy=process-restart
pixiv.execution-mode=host-process-full-trust
pixiv.risk-signals=HOST_DATA_ACCESS
