plugin.name=PixivBatchDownloader インポートサポート
plugin.summary=ブラウザーの PixivBatchDownloader 履歴を直接読み込み、デスクトップからの履歴ファイル取り込みや新規ダウンロードの自動登録にも対応します。元ファイルは保持されます。
script.meta.pixiv-batch-downloader-import.name=PixivBatchDownloader インポートサポート
script.meta.pixiv-batch-downloader-import.description=元ファイルのフォルダーを設定し、ユーザースクリプトの実行を許可して Pixiv を再読み込みしてください。新規ダウンロードの自動登録や、メニューからのブラウザー履歴の直接読み込みが可能です。履歴ファイルの出力は不要で、元ファイルは保持されます。
history.error.root=ローカルプラグインの設定で元ファイルのフォルダーを保存し、履歴を再確認してください。開始するまで設定したフォルダーを変更しないでください。
config.root.label=外部ダウンロードフォルダー
config.root.help=絶対パスを初めて検出すると、候補フォルダーの確認画面が開きます。ここで PixivBatchDownloader が使用するブラウザーのダウンロード先ルートを選ぶこともできます。確認または保存後すぐに反映され、新たにダウンロードが完了した作品が自動登録されます。ギャラリーから削除しても元ファイルは残ります。
error=自動登録が完了していません。ローカルサーバーと保存先を確認してください。
overview.importedWorks=インポート済み作品
overview.importedWorks.help=PixivBatchDownloader インポートサポートで登録に成功した作品の累計です。同じ作品は一度だけ数え、ギャラリーから削除しても件数は減りません。
history.title=PixivBatchDownloader 履歴インポート
history.help=エクスポートした履歴 JSON（または全分割ファイルを含むフォルダー）と元ファイルのフォルダーを選択します。プレビューはローカルデータを確認し、開始後に Pixiv のメタデータを取得して、ファイルが揃った作品をギャラリーに登録します。元ファイルは読み取り専用で扱います。
history.error.busy=別のインポート処理が実行中です。終了をお待ちください。
history.error.format=記録の形式が不正です。エクスポートしたダウンロード履歴 JSON を選択してください。
history.error.limit=読み取り上限（1 ファイル {0} MiB、合計 {1} MiB、JSON は最大 {2} ファイル）を超えたか、1 バッチに作品が集中しています。インポートは開始していません。
history.error.cancelled=確認をキャンセルしました。
history.error.input=記録、元フォルダー、または一時ファイルを読み取れません。パス、権限、空き容量を確認してください。
history.error.unavailable=インポートまたは作品検索が利用できません。バックエンドの起動をお待ちください。
history.error.stale=プレビューが無効です。もう一度確認してください。
history.error.credential=Cookie が長すぎるか、無効な文字を含んでいます。
history.error.statistics=統計を保存できないため処理を停止しました。登録済みの作品は保持されます。
history.error.metadata=完全なメタデータを取得できません。作品の削除、ログインの必要性、または接続状況を確認してください。
history.error.incomplete=ページ数または作品の種類が Pixiv と一致しないため、この作品は登録していません。
history.error.file=元ファイルの不足、未対応形式、または検証失敗により、この作品は登録していません。
