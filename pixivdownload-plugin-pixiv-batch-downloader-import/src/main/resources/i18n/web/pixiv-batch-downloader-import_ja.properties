plugin.name=PixivBatchDownloader インポートサポート
plugin.summary=ブラウザーの PixivBatchDownloader 履歴を直接読み込み、デスクトップからの履歴ファイル取り込みや新規ダウンロードの自動登録にも対応します。元ファイルは保持されます。
script.meta.pixiv-batch-downloader-import.name=PixivBatchDownloader インポートサポート
script.meta.pixiv-batch-downloader-import.description=元ファイルのフォルダーを設定し、ユーザースクリプトの実行を許可して Pixiv を再読み込みしてください。新規ダウンロードの自動登録や、メニューからのブラウザー履歴の直接読み込みが可能です。履歴ファイルの出力は不要で、元ファイルは保持されます。
history.error.root=ダウンロードのルートフォルダーが未設定のため、履歴の確認を続行できません。\nローカルアプリのプラグイン設定で「外部ダウンロードフォルダー」を保存してください。場所が不明な場合は、ユーザースクリプトを有効にしたまま PixivBatchDownloader で作品を1つダウンロードすると、アプリが候補の検出を試みます。候補を確認して保存し、再試行してください。
history.error.root-changed=ダウンロードのルートフォルダーが変更されたため、確認結果は無効になりました。\nこの画面を閉じ、履歴を読み込んで再確認してからインポートしてください。
config.root.label=外部ダウンロードフォルダー
config.root.help=実際のファイル：D:/Downloads/pixiv/作者/123_p0.png\nダウンローダー内の相対フォルダー：pixiv/作者\n選択するルート：D:/Downloads\n\n候補は今回の作品ファイルに共通する親フォルダーです。1 作品のフォルダーの場合もあるため、実際の保存先と照合してください。
error=自動登録が完了していません。ローカルサーバーと保存先を確認してください。
overview.importedWorks=インポート済み作品
overview.importedWorks.help=PixivBatchDownloader インポートサポートで登録に成功した作品の累計です。同じ作品は一度だけ数え、ギャラリーから削除しても件数は減りません。
history.title=PixivBatchDownloader 履歴インポート
history.help=エクスポートした履歴 JSON（または全分割ファイルを含むフォルダー）と元ファイルのフォルダーを選択します。プレビューはローカルデータを確認し、開始後に Pixiv のメタデータを取得して、ファイルが揃った作品をギャラリーに登録します。元ファイルは読み取り専用で扱います。
history.error.busy=別のインポート処理が実行中です。終了をお待ちください。
history.error.format=記録の形式が不正です。エクスポートしたダウンロード履歴 JSON を選択してください。
history.error.limit=読み取り上限（1 ファイル {0} MiB、合計 {1} MiB、JSON は最大 {2} ファイル）を超えたか、1 バッチに作品が集中しています。インポートは開始していません。
history.error.cancelled=確認をキャンセルしました。
history.error.input=記録、元フォルダー、または一時ファイルを読み取れません。パス、権限、空き容量を確認してください。
history.error.unavailable=インポートまたは作品検索が利用できません。バックエンドの起動をお待ちください。
history.error.stale=プレビューが無効です。もう一度確認してください。
history.error.credential=Cookie が長すぎるか、無効な文字を含んでいます。
history.error.statistics=統計を保存できないため処理を停止しました。登録済みの作品は保持されます。
history.error.metadata=完全なメタデータを取得できません。作品の削除、ログインの必要性、または接続状況を確認してください。
history.error.incomplete=ページ数または作品の種類が Pixiv と一致しないため、この作品は登録していません。
history.error.file=元ファイルの不足、未対応形式、または検証失敗により、この作品は登録していません。
log.failure=PixivBatchDownloader インポート失敗：処理={0}、追跡={1}、作品={2}、コード={3}、診断={4}
log.history.inspect=PixivBatchDownloader 履歴の確認を開始：追跡={0}。
log.history.preview=PixivBatchDownloader 履歴の確認が完了：追跡={0}、記録={1}、作品={2}、候補={3}、登録済み={4}、欠落または競合={5}。プレビューの詳細は最大 {6} 件です。
log.history.start=PixivBatchDownloader 履歴のインポートを開始：追跡={0}、対象={1}。
log.history.finish=PixivBatchDownloader 履歴のインポートが終了：追跡={0}、状態={1}、処理済み={2}/{3}、インポート済み={4}、スキップ={5}、失敗={6}、所要時間={7} ミリ秒。失敗の詳細は最大 {8} 件です。
log.history.cancel=PixivBatchDownloader 履歴インポートのキャンセルを要求：追跡={0}。現在の処理の終了を待っています。
log.browser.create=PixivBatchDownloader ブラウザー履歴セッションを作成：追跡={0}。記録のアップロードを待っています。
log.browser.uploaded=PixivBatchDownloader ブラウザー履歴のアップロードが完了：追跡={0}、受信バイト数={1}。確認を開始します。
log.browser.cancel=PixivBatchDownloader ブラウザー履歴セッションをキャンセル：追跡={0}、現在の状態={1}。
log.browser.expired=PixivBatchDownloader ブラウザー履歴セッションがアイドルタイムアウト：追跡={0}、状態={1}。キャンセルして一時データを削除します。
log.automatic.start=PixivBatchDownloader 自動インポートを開始：作品={0}、ファイル={1}。
log.automatic.result=PixivBatchDownloader 自動インポートの結果：作品={0}、結果={1}、ファイル={2}、所要時間={3} ミリ秒。
log.automatic.registered=PixivBatchDownloader 作品は登録済みですが統計を保存できませんでした：作品={0}。元のファイルと登録済み作品は保持されます。次のリクエストで統計の保存を再試行します。
log.request.rejected=PixivBatchDownloader リクエストを拒否：HTTP={0}、コード={1}。
