plugin.name=PixivBatchDownloader 导入支持
plugin.summary=配合油猴脚本，将 PixivBatchDownloader 此后下载完成的作品自动导入画廊，保留原文件；首次使用需配置下载目录。
script.meta.pixiv-batch-downloader-import.name=PixivBatchDownloader 导入支持
script.meta.pixiv-batch-downloader-import.description=首次使用请配置外部下载目录、启用油猴用户脚本权限并刷新 Pixiv 页面。此后自动导入 PixivBatchDownloader 下载完成的插画、漫画、动图和小说；保留原文件，不扫描历史下载。
config.root.label=外部下载目录
config.root.help=首次检测到绝对文件路径时会弹窗提示候选目录，也可在此手动选择 PixivBatchDownloader 使用的浏览器下载根目录。确认或保存后立即生效；新下载完成的作品会自动加入画廊，删除画廊记录保留原文件。
error=自动导入未完成，请检查本机服务和下载目录。
overview.importedWorks=已导入的作品
overview.importedWorks.help=经 PixivBatchDownloader 导入支持累计成功导入的作品，按作品去重；删除画廊记录后仍保留计数。
