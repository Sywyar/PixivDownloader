plugin.name=PixivBatchDownloader 导入支持
plugin.summary=直接读取浏览器中的 PixivBatchDownloader 下载历史，也可从桌面导入历史文件或自动采集新下载，保留原文件。
script.meta.pixiv-batch-downloader-import.name=PixivBatchDownloader 导入支持
script.meta.pixiv-batch-downloader-import.description=配置原文件目录、启用用户脚本权限并刷新 Pixiv 后，可自动导入新下载，或从油猴菜单直接读取此浏览器的下载历史，无需导出文件。原文件保持不变。
history.error.root=尚未设置下载根目录，无法继续检查。\n请在本机软件的插件设置中保存「外部下载目录」。不确定位置时，可保持油猴脚本启用，用 PixivBatchDownloader 下载一部作品，让软件尝试识别候选目录；核对并保存后再试。
history.error.root-changed=下载根目录已更改，当前检查结果已失效。\n请关闭此窗口，重新读取并检查后再导入。
config.root.label=外部下载目录
config.root.help=实际文件：D:/Downloads/pixiv/作者/123_p0.png\n下载器中的相对目录：pixiv/作者\n应选择的根目录：D:/Downloads\n\n候选路径取自本次作品文件的共同父目录，可能只是某部作品的文件夹。请按实际保存位置核对。
error=自动导入未完成，请检查本机服务和下载目录。
overview.importedWorks=已导入的作品
overview.importedWorks.help=经 PixivBatchDownloader 导入支持累计成功导入的作品，按作品去重；删除画廊记录后仍保留计数。
history.title=PixivBatchDownloader 导入支持
history.help=根据下载记录，将本地作品登记到画廊。
history.recommendation=使用「PixivBatchDownloader 导入支持」脚本导入历史下载数据更便捷。
history.error.busy=已有导入操作正在处理，请等待退出。
history.error.format=记录格式不正确，请选择导出的下载历史 JSON。
history.error.limit=记录超过读取预算（单文件 {0} MiB、合计 {1} MiB、最多 {2} 个 JSON），或单批作品过度集中；未开始导入。
history.error.cancelled=已取消检查。
history.error.input=无法读取记录、源目录或临时文件，请检查路径、权限和磁盘空间。
history.error.unavailable=导入服务或作品查询不可用，请等待后端就绪。
history.error.stale=预览已失效，请重新检查。
history.error.credential=本地历史导入不需要 Cookie，请更新导入脚本后重试。
history.error.statistics=统计写入失败，任务已停止；已登记的作品保留。
history.error.incomplete=记录页数或作品类型与 Pixiv 不一致，未登记该作品。
history.error.file=原文件缺失、格式不受支持或校验失败，未登记该作品。
log.failure=PixivBatchDownloader 导入异常：步骤={0}，追踪={1}，作品={2}，原因={3}，诊断={4}
log.history.inspect=PixivBatchDownloader 开始检查历史记录：追踪={0}。
log.history.preview=PixivBatchDownloader 历史检查完成：追踪={0}，记录={1}，作品={2}，待导入={3}，已存在={4}，缺失或冲突={5}；预览明细最多 {6} 条。
log.history.start=PixivBatchDownloader 开始导入历史：追踪={0}，待处理={1}。
log.history.finish=PixivBatchDownloader 历史导入结束：追踪={0}，状态={1}，已处理={2}/{3}，已导入={4}，已跳过={5}，失败={6}，耗时={7} 毫秒；失败明细最多 {8} 条。
log.history.cancel=PixivBatchDownloader 已请求取消历史导入：追踪={0}；等待当前操作退出。
log.browser.create=PixivBatchDownloader 浏览器历史会话已创建：追踪={0}；等待上传记录。
log.browser.uploaded=PixivBatchDownloader 浏览器历史上传完成：追踪={0}，接收字节={1}；开始检查。
log.browser.cancel=PixivBatchDownloader 取消浏览器历史会话：追踪={0}，当前状态={1}。
log.browser.expired=PixivBatchDownloader 浏览器历史会话空闲超时：追踪={0}，状态={1}；取消并清理。
log.automatic.start=PixivBatchDownloader 自动导入开始：作品={0}，文件={1}。
