plugin.name=PixivBatchDownloader import support
plugin.summary=Read PixivBatchDownloader history directly from the browser, import history files from the desktop, or automatically collect new downloads. Original files are retained.
script.meta.pixiv-batch-downloader-import.name=PixivBatchDownloader import support
script.meta.pixiv-batch-downloader-import.description=Configure the original files folder, enable userscripts and refresh Pixiv. Automatically import new downloads or read this browser’s download history directly from the userscript menu, without exporting a file. Original files are retained.
history.error.root=Save the original files folder in the local plugin settings, then check the history again. The configured folder must remain unchanged until import starts.
config.root.label=External download directory
config.root.help=The first observed absolute file path prompts you to confirm a candidate directory. You can also select the browser download root used by PixivBatchDownloader here. Confirmation or saving takes effect immediately. New completed downloads are added to the gallery automatically; deleting gallery records keeps the originals.
error=Automatic import did not finish. Check the local server and download directory.
overview.importedWorks=Imported works
overview.importedWorks.help=Unique works successfully imported through PixivBatchDownloader import support. Deleting gallery records does not reduce this total.
history.title=PixivBatchDownloader history import
history.help=Select exported history JSON (or a folder containing all shards) and the original files folder. Preview checks local data; starting fetches metadata from Pixiv and registers works with complete files in the gallery. Original files remain read-only.
history.error.busy=An import operation is still active. Wait for it to finish.
history.error.format=Invalid record format. Select exported download history JSON.
history.error.limit=The reading budget was exceeded ({0} MiB per file, {1} MiB total, up to {2} JSON files), or too many works fell into one batch. Import has not started.
history.error.cancelled=Check cancelled.
history.error.input=Cannot read records, the source folder or temporary files. Check paths, permissions and disk space.
history.error.unavailable=Import or work lookup is unavailable. Wait for the backend to be ready.
history.error.stale=Preview expired. Check again.
history.error.credential=Cookie is too long or contains invalid characters.
history.error.statistics=Statistics could not be saved. The task stopped; registered works are retained.
history.error.metadata=Complete metadata is unavailable. The work may be deleted, require sign-in, or the network may be unavailable.
history.error.incomplete=Page count or work type differs from Pixiv. This work was not registered.
history.error.file=Original files are missing, unsupported or failed validation. This work was not registered.
