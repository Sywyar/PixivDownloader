plugin.name=PixivBatchDownloader 匯入支援
plugin.summary=直接讀取瀏覽器中的 PixivBatchDownloader 下載歷史，也可從桌面匯入歷史檔案或自動採集新下載，保留原始檔案。
script.meta.pixiv-batch-downloader-import.name=PixivBatchDownloader 匯入支援
script.meta.pixiv-batch-downloader-import.description=設定原始檔案目錄、啟用使用者腳本權限並重新整理 Pixiv 後，可自動匯入新下載，或從腳本選單直接讀取此瀏覽器的下載歷史，無需匯出檔案。原始檔案保持不變。
history.error.root=尚未設定下載根目錄，無法繼續檢查。\n請在本機軟體的外掛設定中儲存「外部下載目錄」。不確定位置時，可保持油猴腳本啟用，用 PixivBatchDownloader 下載一部作品，讓軟體嘗試辨識候選目錄；核對並儲存後再試。
history.error.root-changed=下載根目錄已變更，目前的檢查結果已失效。\n請關閉此視窗，重新讀取並檢查後再匯入。
config.root.label=外部下載目錄
config.root.help=實際檔案：D:/Downloads/pixiv/作者/123_p0.png\n下載器中的相對目錄：pixiv/作者\n應選擇的根目錄：D:/Downloads\n\n候選路徑取自本次作品檔案的共同父目錄，可能只是某部作品的資料夾。請依實際儲存位置核對。
error=自動匯入尚未完成，請檢查本機服務與下載目錄。
overview.importedWorks=已匯入的作品
overview.importedWorks.help=經 PixivBatchDownloader 匯入支援累計成功匯入的作品，同一作品僅計算一次；刪除畫廊記錄後仍保留計數。
history.title=PixivBatchDownloader 歷史匯入
history.help=根據下載記錄，將本機作品登錄至圖庫。
history.error.busy=已有匯入操作正在處理，請等待結束。
history.error.format=記錄格式不正確，請選擇匯出的下載歷史 JSON。
history.error.limit=記錄超過讀取預算（單檔 {0} MiB、合計 {1} MiB、最多 {2} 個 JSON），或單批作品過度集中；尚未開始匯入。
history.error.cancelled=已取消檢查。
history.error.input=無法讀取記錄、來源目錄或暫存檔案，請檢查路徑、權限與磁碟空間。
history.error.unavailable=匯入服務或作品查詢無法使用，請等待後端就緒。
history.error.stale=預覽已失效，請重新檢查。
history.error.credential=本機歷史匯入不需要 Cookie，請更新匯入腳本後重試。
history.error.statistics=統計寫入失敗，工作已停止；保留已登錄的作品。
history.error.incomplete=記錄頁數或作品類型與 Pixiv 不一致，未登錄此作品。
history.error.file=原始檔案缺失、格式不支援或驗證失敗，未登錄此作品。
log.failure=PixivBatchDownloader 匯入異常：步驟={0}，追蹤={1}，作品={2}，原因={3}，診斷={4}
log.history.inspect=PixivBatchDownloader 開始檢查歷史紀錄：追蹤={0}。
log.history.preview=PixivBatchDownloader 歷史檢查完成：追蹤={0}，紀錄={1}，作品={2}，待匯入={3}，已存在={4}，缺失或衝突={5}；預覽明細最多 {6} 筆。
log.history.start=PixivBatchDownloader 開始匯入歷史：追蹤={0}，待處理={1}。
log.history.finish=PixivBatchDownloader 歷史匯入結束：追蹤={0}，狀態={1}，已處理={2}/{3}，已匯入={4}，已略過={5}，失敗={6}，耗時={7} 毫秒；失敗明細最多 {8} 筆。
log.history.cancel=PixivBatchDownloader 已要求取消歷史匯入：追蹤={0}；等待目前操作結束。
log.browser.create=PixivBatchDownloader 瀏覽器歷史工作階段已建立：追蹤={0}；等待上傳紀錄。
log.browser.uploaded=PixivBatchDownloader 瀏覽器歷史上傳完成：追蹤={0}，接收位元組={1}；開始檢查。
log.browser.cancel=PixivBatchDownloader 取消瀏覽器歷史工作階段：追蹤={0}，目前狀態={1}。
log.browser.expired=PixivBatchDownloader 瀏覽器歷史工作階段閒置逾時：追蹤={0}，狀態={1}；取消並清理。
log.automatic.start=PixivBatchDownloader 自動匯入開始：作品={0}，檔案={1}。
log.automatic.result=PixivBatchDownloader 自動匯入結果：作品={0}，結果={1}，檔案={2}，耗時={3} 毫秒。
log.automatic.registered=PixivBatchDownloader 作品已登記但統計尚未儲存：作品={0}；保留原始檔案與已登記作品，後續請求會補寫統計。
log.request.rejected=PixivBatchDownloader 請求遭拒：HTTP={0}，原因={1}。
