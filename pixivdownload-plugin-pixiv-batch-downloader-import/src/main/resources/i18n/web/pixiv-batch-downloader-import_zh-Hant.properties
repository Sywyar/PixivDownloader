plugin.name=PixivBatchDownloader 匯入支援
plugin.summary=直接讀取瀏覽器中的 PixivBatchDownloader 下載歷史，也可從桌面匯入歷史檔案或自動採集新下載，保留原始檔案。
script.meta.pixiv-batch-downloader-import.name=PixivBatchDownloader 匯入支援
script.meta.pixiv-batch-downloader-import.description=設定原始檔案目錄、啟用使用者腳本權限並重新整理 Pixiv 後，可自動匯入新下載，或從腳本選單直接讀取此瀏覽器的下載歷史，無需匯出檔案。原始檔案保持不變。
history.error.root=請先在本機外掛設定中儲存原始檔案目錄，再重新檢查歷史記錄；開始匯入前請保持該設定不變。
config.root.label=外部下載目錄
config.root.help=首次偵測到絕對檔案路徑時會彈窗提示候選目錄，也可在此手動選擇 PixivBatchDownloader 使用的瀏覽器下載根目錄。確認或儲存後立即生效；新下載完成的作品會自動加入畫廊，刪除畫廊記錄會保留原始檔案。
error=自動匯入尚未完成，請檢查本機服務與下載目錄。
overview.importedWorks=已匯入的作品
overview.importedWorks.help=經 PixivBatchDownloader 匯入支援累計成功匯入的作品，同一作品僅計算一次；刪除畫廊記錄後仍保留計數。
history.title=PixivBatchDownloader 歷史匯入
history.help=選擇匯出的下載記錄 JSON（或包含全部分片的目錄）與原始檔案目錄。預覽只檢查本機資料；開始後從 Pixiv 取得中繼資料，將檔案完整的作品登錄至圖庫。原始檔案維持唯讀。
history.error.busy=已有匯入操作正在處理，請等待結束。
history.error.format=記錄格式不正確，請選擇匯出的下載歷史 JSON。
history.error.limit=記錄超過讀取預算（單檔 {0} MiB、合計 {1} MiB、最多 {2} 個 JSON），或單批作品過度集中；尚未開始匯入。
history.error.cancelled=已取消檢查。
history.error.input=無法讀取記錄、來源目錄或暫存檔案，請檢查路徑、權限與磁碟空間。
history.error.unavailable=匯入服務或作品查詢無法使用，請等待後端就緒。
history.error.stale=預覽已失效，請重新檢查。
history.error.credential=Cookie 過長或包含無效字元。
history.error.statistics=統計寫入失敗，工作已停止；保留已登錄的作品。
history.error.metadata=無法取得完整中繼資料。作品可能已刪除、需要登入或網路無法使用。
history.error.incomplete=記錄頁數或作品類型與 Pixiv 不一致，未登錄此作品。
history.error.file=原始檔案缺失、格式不支援或驗證失敗，未登錄此作品。
