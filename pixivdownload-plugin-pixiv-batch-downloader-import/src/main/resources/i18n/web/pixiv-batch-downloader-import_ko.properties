plugin.name=PixivBatchDownloader 가져오기 지원
plugin.summary=브라우저의 PixivBatchDownloader 기록을 직접 읽거나 데스크톱에서 기록 파일을 가져오고 새 다운로드를 자동 등록합니다. 원본 파일은 유지됩니다.
script.meta.pixiv-batch-downloader-import.name=PixivBatchDownloader 가져오기 지원
script.meta.pixiv-batch-downloader-import.description=원본 파일 폴더를 설정하고 유저스크립트 실행을 허용한 뒤 Pixiv를 새로 고치세요. 새 다운로드를 자동 등록하거나 메뉴에서 브라우저 기록을 직접 읽을 수 있습니다. 기록 파일을 내보낼 필요가 없으며 원본 파일은 유지됩니다.
history.error.root=로컬 플러그인 설정에 원본 파일 폴더를 저장한 뒤 기록을 다시 확인하세요. 가져오기를 시작할 때까지 설정한 폴더를 변경하지 마세요.
config.root.label=외부 다운로드 폴더
config.root.help=처음 절대 파일 경로를 감지하면 후보 폴더 확인 창이 열립니다. 여기서 PixivBatchDownloader가 사용하는 브라우저 다운로드 루트 폴더를 직접 선택할 수도 있습니다. 확인하거나 저장하면 즉시 적용되며 새로 다운로드를 완료한 작품이 자동 등록됩니다. 갤러리 기록을 삭제해도 원본 파일은 유지됩니다.
error=자동 가져오기가 완료되지 않았습니다. 로컬 서버와 다운로드 폴더를 확인하세요.
overview.importedWorks=가져온 작품
overview.importedWorks.help=PixivBatchDownloader 가져오기 지원으로 가져오기를 완료한 작품의 누적 수입니다. 같은 작품은 한 번만 집계하며 갤러리에서 삭제해도 수는 줄지 않습니다.
history.title=PixivBatchDownloader 기록 가져오기
history.help=내보낸 기록 JSON(또는 모든 분할 파일이 있는 폴더)과 원본 파일 폴더를 선택하세요. 미리보기에서는 로컬 데이터만 확인합니다. 시작하면 Pixiv에서 메타데이터를 가져와 파일이 모두 있는 작품을 갤러리에 등록합니다. 원본 파일은 읽기 전용으로 유지됩니다.
history.error.busy=다른 가져오기 작업이 진행 중입니다. 종료될 때까지 기다리세요.
history.error.format=기록 형식이 올바르지 않습니다. 내보낸 다운로드 기록 JSON을 선택하세요.
history.error.limit=읽기 한도(파일당 {0} MiB, 합계 {1} MiB, JSON 파일 최대 {2}개)를 초과했거나 한 묶음에 작품이 너무 많이 모였습니다. 가져오기를 시작하지 않았습니다.
history.error.cancelled=확인을 취소했습니다.
history.error.input=기록, 원본 폴더 또는 임시 파일을 읽을 수 없습니다. 경로, 권한 및 디스크 공간을 확인하세요.
history.error.unavailable=가져오기 또는 작품 조회를 사용할 수 없습니다. 백엔드가 준비될 때까지 기다리세요.
history.error.stale=미리보기가 만료되었습니다. 다시 확인하세요.
history.error.credential=Cookie가 너무 길거나 잘못된 문자가 포함되어 있습니다.
history.error.statistics=통계를 저장하지 못해 작업을 중단했습니다. 등록된 작품은 유지됩니다.
history.error.metadata=전체 메타데이터를 가져올 수 없습니다. 작품이 삭제되었거나 로그인이 필요하거나 네트워크를 사용할 수 없습니다.
history.error.incomplete=페이지 수 또는 작품 유형이 Pixiv와 일치하지 않아 이 작품을 등록하지 않았습니다.
history.error.file=원본 파일이 없거나 지원하지 않는 형식이거나 검증에 실패하여 이 작품을 등록하지 않았습니다.
