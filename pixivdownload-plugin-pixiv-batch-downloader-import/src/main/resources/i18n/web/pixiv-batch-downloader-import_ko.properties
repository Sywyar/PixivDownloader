plugin.name=PixivBatchDownloader 가져오기 지원
plugin.summary=브라우저의 PixivBatchDownloader 기록을 직접 읽거나 데스크톱에서 기록 파일을 가져오고 새 다운로드를 자동 등록합니다. 원본 파일은 유지됩니다.
script.meta.pixiv-batch-downloader-import.name=PixivBatchDownloader 가져오기 지원
script.meta.pixiv-batch-downloader-import.description=원본 파일 폴더를 설정하고 유저스크립트 실행을 허용한 뒤 Pixiv를 새로 고치세요. 새 다운로드를 자동 등록하거나 메뉴에서 브라우저 기록을 직접 읽을 수 있습니다. 기록 파일을 내보낼 필요가 없으며 원본 파일은 유지됩니다.
history.error.root=다운로드 루트 폴더가 설정되지 않아 기록 확인을 계속할 수 없습니다.\n로컬 앱의 플러그인 설정에서 ‘외부 다운로드 폴더’를 저장하세요. 위치를 모르면 유저스크립트를 켠 상태로 PixivBatchDownloader에서 작품 하나를 다운로드하여 앱이 폴더 후보를 찾아보도록 할 수 있습니다. 후보를 확인하고 저장한 뒤 다시 시도하세요.
history.error.root-changed=다운로드 루트 폴더가 변경되어 확인 결과가 더 이상 유효하지 않습니다.\n이 창을 닫고 기록을 다시 읽고 확인한 뒤 가져오세요.
config.root.label=외부 다운로드 폴더
config.root.help=실제 파일: D:/Downloads/pixiv/작가/123_p0.png\n다운로더의 상대 폴더: pixiv/작가\n선택할 루트: D:/Downloads\n\n후보 경로는 이번 작품 파일들이 공유하는 상위 폴더입니다. 한 작품의 폴더일 수 있으므로 실제 저장 위치와 비교해 확인하세요.
error=자동 가져오기가 완료되지 않았습니다. 로컬 서버와 다운로드 폴더를 확인하세요.
overview.importedWorks=가져온 작품
overview.importedWorks.help=PixivBatchDownloader 가져오기 지원으로 가져오기를 완료한 작품의 누적 수입니다. 같은 작품은 한 번만 집계하며 갤러리에서 삭제해도 수는 줄지 않습니다.
history.title=PixivBatchDownloader 가져오기 지원
history.help=다운로드 기록을 바탕으로 로컬 작품을 갤러리에 등록합니다.
history.recommendation=“PixivBatchDownloader 가져오기 지원” 스크립트를 사용하면 과거 다운로드 데이터를 더 편리하게 가져올 수 있습니다.
history.error.busy=다른 가져오기 작업이 진행 중입니다. 종료될 때까지 기다리세요.
history.error.format=기록 형식이 올바르지 않습니다. 내보낸 다운로드 기록 JSON을 선택하세요.
history.error.limit=읽기 한도(파일당 {0} MiB, 합계 {1} MiB, JSON 파일 최대 {2}개)를 초과했거나 한 묶음에 작품이 너무 많이 모였습니다. 가져오기를 시작하지 않았습니다.
history.error.cancelled=확인을 취소했습니다.
history.error.input=기록, 원본 폴더 또는 임시 파일을 읽을 수 없습니다. 경로, 권한 및 디스크 공간을 확인하세요.
history.error.unavailable=가져오기 또는 작품 조회를 사용할 수 없습니다. 백엔드가 준비될 때까지 기다리세요.
history.error.stale=미리보기가 만료되었습니다. 다시 확인하세요.
history.error.credential=로컬 기록 가져오기에는 쿠키가 필요하지 않습니다. 가져오기 스크립트를 업데이트한 후 다시 시도하세요.
history.error.statistics=통계를 저장하지 못해 작업을 중단했습니다. 등록된 작품은 유지됩니다.
history.error.incomplete=페이지 수 또는 작품 유형이 Pixiv와 일치하지 않아 이 작품을 등록하지 않았습니다.
history.error.file=원본 파일이 없거나 지원하지 않는 형식이거나 검증에 실패하여 이 작품을 등록하지 않았습니다.
log.failure=PixivBatchDownloader 가져오기 실패: 단계={0}, 추적={1}, 작품={2}, 코드={3}, 진단={4}
log.history.inspect=PixivBatchDownloader 기록 확인 시작: 추적={0}.
log.history.preview=PixivBatchDownloader 기록 확인 완료: 추적={0}, 기록={1}, 작품={2}, 가져올 작품={3}, 등록된 작품={4}, 누락 또는 충돌={5}. 미리보기 상세 정보는 최대 {6}개입니다.
log.history.start=PixivBatchDownloader 기록 가져오기 시작: 추적={0}, 전체={1}.
log.history.finish=PixivBatchDownloader 기록 가져오기 종료: 추적={0}, 상태={1}, 처리={2}/{3}, 가져옴={4}, 건너뜀={5}, 실패={6}, 소요 시간={7}밀리초. 실패 상세 정보는 최대 {8}개입니다.
log.history.cancel=PixivBatchDownloader 기록 가져오기 취소 요청: 추적={0}. 현재 작업이 끝나기를 기다립니다.
log.browser.create=PixivBatchDownloader 브라우저 기록 세션 생성: 추적={0}. 기록 업로드를 기다립니다.
log.browser.uploaded=PixivBatchDownloader 브라우저 기록 업로드 완료: 추적={0}, 수신 바이트={1}. 확인을 시작합니다.
log.browser.cancel=PixivBatchDownloader 브라우저 기록 세션 취소: 추적={0}, 현재 상태={1}.
log.browser.expired=PixivBatchDownloader 브라우저 기록 세션 유휴 시간 초과: 추적={0}, 상태={1}. 취소 후 임시 데이터를 정리합니다.
log.automatic.start=PixivBatchDownloader 자동 가져오기 시작: 작품={0}, 파일={1}.
log.automatic.result=PixivBatchDownloader 자동 가져오기 결과: 작품={0}, 결과={1}, 파일={2}, 소요 시간={3}밀리초.
log.automatic.registered=PixivBatchDownloader 작품은 등록되었지만 통계가 저장되지 않았습니다: 작품={0}. 원본 파일과 등록된 작품은 유지되며 다음 요청에서 통계 저장을 다시 시도합니다.
log.request.rejected=PixivBatchDownloader 요청 거부: HTTP={0}, 코드={1}.
