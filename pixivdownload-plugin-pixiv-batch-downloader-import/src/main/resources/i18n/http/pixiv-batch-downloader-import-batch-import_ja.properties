title=Pixiv Batch Downloader からの取り込み
PixivBatchDownloaderImportController.token.GET.summary=一度限りの取り込みトークンを発行
PixivBatchDownloaderImportController.token.GET.description=solo のローカルリクエストに X-Pixiv-Collector: 1 が必要です。返る token は1回限りで1分間有効です。次のインポートの X-Import-Token に渡します。
PixivBatchDownloaderImportController.token.GET.success=一度限りの取り込みトークンを作成しました。
PixivBatchDownloaderImportController.importWork.POST.summary=ブラウザーで保存した作品を取り込む
PixivBatchDownloaderImportController.importWork.POST.description=ダウンローダーで保存した1作品のメタデータとファイル結果を送信します。ファイルは設定済みのルート内に必要です。X-Pixiv-Collector: 1 と新しい X-Import-Token を付けます。UTF-8 JSON は最大12 MiBです。
PixivBatchDownloaderImportController.importWork.POST.success=ブラウザーで保存した作品。
PixivBatchDownloaderImportController.history.POST.summary=ブラウザーのダウンロード履歴を取り込む
PixivBatchDownloaderImportController.history.POST.description=毎回、新しい X-Import-Token、X-Pixiv-Collector: 1 と Pixiv Origin が必要です。action=create に {} を送り、返った session を X-History-Session に設定します。upload は file と連続した offset を指定し最大1 MiBのバイト列を送ります。inspect は確認、start は開始、status は進捗、cancel は中止です。 インポート後は POST /api/tools/backfill/tasks で未設定のメタデータを補完できます。artworkIds を指定すると、選んだイラストだけを処理します。
PixivBatchDownloaderImportController.history.POST.success=ブラウザーのダウンロード履歴。
parameter.X-Pixiv-Collector=ローカル収集ツールの要求を示す固定値 1。
parameter.X-Import-Token=/api/pixiv-batch-downloader-import/token で発行する使い捨てトークン。要求ごとに取得します。
parameter.Origin=収集元ページのオリジン。https://www.pixiv.net または https://pixiv.net。
parameter.X-History-Session=create 以外で必須。create が返した session を指定します。
parameter.action=create で開始、upload でバイトを追加、inspect で確認、start で取り込み、status で進捗取得、cancel で中止します。
parameter.file=upload で必須。履歴ファイルの 0 始まりの番号。
parameter.offset=upload で必須。対象ファイルの受信済みバイト数。0 から連続したチャンクを送ります。
