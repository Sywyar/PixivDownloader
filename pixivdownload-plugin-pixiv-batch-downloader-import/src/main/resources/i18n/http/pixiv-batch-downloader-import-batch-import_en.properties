schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Observation.field.schemaVersion=Observation format version, the integer 1.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Observation.field.source=Collector identifier, always pixiv-batch-downloader.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Observation.field.taskBatch=Positive numeric ID of the downloader batch that produced this record.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Observation.field.tabId=Integer ID of the browser tab that ran the batch.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Observation.field.metadata=Pixiv work metadata from the same batch as files.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Observation.field.files=Complete set of confirmed-success files, exactly one per page and pageCount entries overall.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.id=Positive Pixiv work ID, 1–16 decimal digits with no leading zero. Accepts a number or string.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.title=Nonblank Pixiv work title.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.type=Work type: 0 illustration, 1 manga, 2 animation, 3 novel.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.pageCount=Page count, 1–1000. Animations and novels require 1.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.authorId=Pixiv author ID, 1–16 decimal digits without a leading zero, as a number or string.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.authorName=Optional Pixiv author display name.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.aiType=Pixiv AI flag, 0–2. Value 2 is stored as AI-generated.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.restriction=Pixiv age restriction code of the work.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.tags=Up to 256 original tag names, each a nonblank string.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.description=Optional work description, up to 32768 characters.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.seriesId=Optional positive series ID of 1–16 decimal digits without a leading zero.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.seriesOrder=Integer position of the work in its series.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.novelContent=Optional text content for novels.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.FileObservation.field.fileId=For illustrations and manga use {id}_p{page}. For animations and novels use the decimal work ID.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.FileObservation.field.page=Zero-based page index below pageCount, unique in this request.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.FileObservation.field.outcome=Only confirmed downloads are imported. The value is success.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.FileObservation.field.path=File path inside the configured downloader root, optionally relative to it. Maximum 4096 characters.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.FileObservation.field.noReply=true marks an unacknowledged file and rejects the import. Omit or set false for confirmed files.
