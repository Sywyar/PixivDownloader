title=Pixiv Batch Downloader import
PixivBatchDownloaderImportController.token.GET.summary=Issue a one-time import token
PixivBatchDownloaderImportController.token.GET.description=Local solo-mode requests must send X-Pixiv-Collector: 1. The returned single-use token expires in one minute. Send it as X-Import-Token on the next import request.
PixivBatchDownloaderImportController.token.GET.success=One-time import token created.
PixivBatchDownloaderImportController.importWork.POST.summary=Import a browser download
PixivBatchDownloaderImportController.importWork.POST.description=Submit metadata and file outcomes for one downloader work. Its files must be available under the configured downloader root. Send X-Pixiv-Collector: 1 and a fresh X-Import-Token. UTF-8 JSON is limited to 12 MiB.
PixivBatchDownloaderImportController.importWork.POST.success=Browser download.
PixivBatchDownloaderImportController.history.POST.summary=Import browser download history
PixivBatchDownloaderImportController.history.POST.description=Every call needs a fresh X-Import-Token, X-Pixiv-Collector: 1 and a Pixiv Origin. Send {} for action=create and reuse the returned session as X-History-Session. For upload send up to 1 MiB of raw bytes with file and consecutive offset. Use inspect, start, status and cancel for preview, import, progress and cancellation. After import, use POST /api/tools/backfill/tasks for missing metadata. Supply artworkIds to process selected illustrations only.
PixivBatchDownloaderImportController.history.POST.success=Browser download history.
parameter.X-Pixiv-Collector=Local collector request marker, always 1.
parameter.X-Import-Token=One-use token from /api/pixiv-batch-downloader-import/token. Obtain a new token for each request.
parameter.Origin=Origin of the Pixiv page running the collector: https://www.pixiv.net or https://pixiv.net.
parameter.X-History-Session=Required for every action except create. Use the session value returned by create.
parameter.action=create opens a session, upload appends bytes, inspect previews, start runs the import, status reads progress and cancel stops it.
parameter.file=Required for upload. Zero-based index of the history file.
parameter.offset=Required for upload. Byte count already received for this file. Start at zero and append contiguous chunks.
