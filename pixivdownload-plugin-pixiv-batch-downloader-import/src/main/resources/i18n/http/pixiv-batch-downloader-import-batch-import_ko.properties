schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.FileObservation.field.noReply=true이면 확인되지 않은 파일로 가져오기를 거부합니다. 확인된 파일은 생략하거나 false입니다.
