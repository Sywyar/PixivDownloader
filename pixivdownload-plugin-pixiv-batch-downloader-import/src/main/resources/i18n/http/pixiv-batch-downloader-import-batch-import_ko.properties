schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Observation.field.files=성공이 확인된 전체 파일입니다. 페이지당 하나씩 총 pageCount개이며 중복은 허용되지 않습니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.id=Pixiv 작품 양수 ID입니다. 앞자리 0이 없는 1~16자리 숫자 또는 문자열입니다.
