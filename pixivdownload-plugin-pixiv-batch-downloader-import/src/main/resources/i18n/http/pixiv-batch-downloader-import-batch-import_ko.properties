title=Pixiv Batch Downloader 가져오기
PixivBatchDownloaderImportController.token.GET.summary=일회용 가져오기 토큰 발급
PixivBatchDownloaderImportController.token.GET.description=solo 모드의 로컬 요청에 X-Pixiv-Collector: 1이 필요합니다. 발급된 token은 1분 동안 한 번만 유효합니다. 다음 가져오기 요청의 X-Import-Token에 넣으세요.
PixivBatchDownloaderImportController.token.GET.success=일회용 가져오기 토큰을 생성했습니다.
PixivBatchDownloaderImportController.importWork.POST.summary=브라우저에서 다운로드한 작품 가져오기
PixivBatchDownloaderImportController.importWork.POST.description=다운로더에서 저장한 한 작품의 메타데이터와 파일 결과를 보냅니다. 파일은 설정된 다운로더 루트 안에 있어야 합니다. X-Pixiv-Collector: 1과 새 X-Import-Token이 필요합니다. UTF-8 JSON은 최대 12 MiB입니다.
PixivBatchDownloaderImportController.importWork.POST.success=브라우저에서 다운로드한 작품.
PixivBatchDownloaderImportController.history.POST.summary=브라우저 다운로드 기록 가져오기
PixivBatchDownloaderImportController.history.POST.description=매번 새 X-Import-Token, X-Pixiv-Collector: 1과 Pixiv Origin이 필요합니다. action=create에 {}를 보내고 반환된 session을 X-History-Session에 넣습니다. upload는 file과 연속된 offset으로 최대 1 MiB의 바이트를 보냅니다. inspect는 미리보기, start는 시작, status는 진행 조회, cancel은 취소입니다. 가져온 후 POST /api/tools/backfill/tasks 로 누락된 메타데이터를 보충할 수 있습니다. artworkIds를 지정하면 선택한 일러스트만 처리합니다.
PixivBatchDownloaderImportController.history.POST.success=브라우저 다운로드 기록.
parameter.X-Pixiv-Collector=로컬 수집기 요청을 나타내는 고정값 1입니다.
parameter.X-Import-Token=/api/pixiv-batch-downloader-import/token에서 발급한 일회용 토큰입니다. 요청마다 다시 발급합니다.
parameter.Origin=수집기를 실행하는 페이지 출처입니다. https://www.pixiv.net 또는 https://pixiv.net입니다.
parameter.X-History-Session=create를 제외한 모든 작업에 필요합니다. create 응답의 session 값을 사용합니다.
parameter.action=create는 세션 생성, upload는 데이터 추가, inspect는 미리 보기, start는 실행, status는 진행 조회, cancel은 취소입니다.
parameter.file=upload에 필요합니다. 기록 파일의 0부터 시작하는 인덱스입니다.
parameter.offset=upload에 필요합니다. 해당 파일에서 이미 받은 바이트 수입니다. 0부터 연속된 청크를 전송합니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.HistoryProblem.field.work=기록 가져오기에서 작품을 식별하는 키입니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.HistoryProblem.field.error=실패 시 사용자에게 표시할 오류 정보입니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.HistoryResponse.field.session=후속 요청의 X-History-Session에 넣을 기록 가져오기 세션 ID입니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.HistoryResponse.field.phase=기록 가져오기 단계입니다. UPLOADING에서 시작하며 inspect 후 start할 수 있습니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.HistoryResponse.field.preview=실행 전에 검사한 가져오기 미리 보기 결과입니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.HistoryResponse.field.total=이 작업에 포함된 전체 항목 수입니다.
