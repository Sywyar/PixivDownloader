schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.FileObservation.field.page=0부터 pageCount 미만의 페이지 인덱스이며 요청 안에서 고유해야 합니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.FileObservation.field.outcome=성공이 확인된 파일만 받아들이며 값은 success입니다.
