schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.aiType=Pixiv AI 표시 0~2입니다. 2이면 AI 생성 작품으로 저장합니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.restriction=작품의 Pixiv 연령 제한 코드입니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.tags=원래 태그 이름 목록입니다. 최대 256개이며 빈 문자열은 허용되지 않습니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.description=선택 사항인 작품 소개입니다. 최대 32768자입니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.seriesId=선택 사항인 시리즈 ID입니다. 앞자리 0이 없는 1~16자리 양수입니다.
