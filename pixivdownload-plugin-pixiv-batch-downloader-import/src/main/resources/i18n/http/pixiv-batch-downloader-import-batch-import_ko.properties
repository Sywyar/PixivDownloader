schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.HistoryResponse.field.problems=가져오기 문제와 해당 작품 ID입니다.
schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.HistoryResponse.field.results=작품별 처리 상태 및 오류입니다.
