schema.top.sywyar.pixivdownload.pixivbatchdownloaderimport.PixivBatchDownloaderImportController.Metadata.field.authorId=작가 Pixiv ID입니다. 앞자리 0이 없는 1~16자리 숫자 또는 문자열입니다.
