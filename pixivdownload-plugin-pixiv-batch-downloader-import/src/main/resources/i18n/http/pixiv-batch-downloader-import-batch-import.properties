title=Pixiv Batch Downloader 导入
PixivBatchDownloaderImportController.token.GET.summary=签发一次性导入令牌
PixivBatchDownloaderImportController.token.GET.description=仅限 solo 模式的本机请求，须带 X-Pixiv-Collector: 1。返回一分钟有效的一次性 token，在下一次导入请求的 X-Import-Token 中使用。
PixivBatchDownloaderImportController.token.GET.success=已创建一次性导入令牌。
PixivBatchDownloaderImportController.importWork.POST.summary=导入浏览器下载的作品
PixivBatchDownloaderImportController.importWork.POST.description=提交下载器完成的一部作品的元数据和文件结果。须在已配置的下载器目录内找到相应文件。带 X-Pixiv-Collector: 1 和新的 X-Import-Token，UTF-8 JSON 最多 12 MiB。
PixivBatchDownloaderImportController.importWork.POST.success=浏览器下载的作品。
PixivBatchDownloaderImportController.history.POST.summary=导入浏览器下载历史
PixivBatchDownloaderImportController.history.POST.description=每次请求都带新的 X-Import-Token、X-Pixiv-Collector: 1 和 Pixiv Origin。action=create 发送 {}，随后将返回的 session 放入 X-History-Session。upload 按 file 和连续 offset 发送最多 1 MiB 原始字节。inspect 预览，start 导入，status 查询，cancel 取消。 导入完成后可用 POST /api/tools/backfill/tasks 补齐缺失元数据，指定 artworkIds 可只处理选中的插画。
PixivBatchDownloaderImportController.history.POST.success=浏览器下载历史。
parameter.X-Pixiv-Collector=标记采集器发起的本地请求，值固定为 1。
parameter.X-Import-Token=由 /api/pixiv-batch-downloader-import/token 签发的一次性令牌，每个请求需要一个新令牌。
parameter.Origin=采集器所在 Pixiv 页面的来源，须为 https://www.pixiv.net 或 https://pixiv.net。
parameter.X-History-Session=除 create 外必填，值为创建历史导入时响应的 session。
parameter.action=create 新建会话，upload 追加数据，inspect 预览，start 执行，status 查询，cancel 取消。
parameter.file=upload 时必填，从 0 开始的历史文件索引。
parameter.offset=upload 时必填，该文件已有字节数，首块为 0，后续块须连续。
