title=Pixiv Batch Downloader 匯入
PixivBatchDownloaderImportController.token.GET.summary=簽發一次性匯入令牌
PixivBatchDownloaderImportController.token.GET.description=僅限 solo 模式的本機請求，須帶 X-Pixiv-Collector: 1。返回一分鐘有效的一次性 token，在下一次匯入請求的 X-Import-Token 中使用。
PixivBatchDownloaderImportController.token.GET.success=已建立一次性匯入令牌。
PixivBatchDownloaderImportController.importWork.POST.summary=匯入瀏覽器下載的作品
PixivBatchDownloaderImportController.importWork.POST.description=提交下載器完成的一部作品的後設資料和檔案結果。須在已配置的下載器目錄內找到相應檔案。帶 X-Pixiv-Collector: 1 和新的 X-Import-Token，UTF-8 JSON 最多 12 MiB。
PixivBatchDownloaderImportController.importWork.POST.success=瀏覽器下載的作品。
PixivBatchDownloaderImportController.history.POST.summary=匯入瀏覽器下載歷史
PixivBatchDownloaderImportController.history.POST.description=每次請求都帶新的 X-Import-Token、X-Pixiv-Collector: 1 和 Pixiv Origin。action=create 傳送 {}，隨後將返回的 session 放入 X-History-Session。upload 按 file 和連續 offset 傳送最多 1 MiB 原始位元組。inspect 預覽，start 匯入，status 查詢，cancel 取消。 匯入完成後可用 POST /api/tools/backfill/tasks 補齊缺漏的中繼資料，指定 artworkIds 可只處理選取的插畫。
PixivBatchDownloaderImportController.history.POST.success=瀏覽器下載歷史。
parameter.X-Pixiv-Collector=標記採集器發起的本地請求，值固定為 1。
parameter.X-Import-Token=由 /api/pixiv-batch-downloader-import/token 簽發的一次性令牌，每個請求需要一個新令牌。
parameter.Origin=採集器所在 Pixiv 頁面的來源，須為 https://www.pixiv.net 或 https://pixiv.net。
parameter.X-History-Session=除 create 外必填，值為建立歷史匯入時響應的 session。
parameter.action=create 新建會話，upload 追加資料，inspect 預覽，start 執行，status 查詢，cancel 取消。
parameter.file=upload 時必填，從 0 開始的歷史檔案索引。
parameter.offset=upload 時必填，該檔案已有位元組數，首塊為 0，後續塊須連續。
