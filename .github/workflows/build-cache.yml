name: Warm build dependencies

on:
  push:
    branches: [master]
    paths:
      - '**/pom.xml'
      - '.mvn/**'
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/gradle-wrapper.properties'
      - 'pixivdownload-sdk-info/src/main/**'
      - 'pixivdownload-plugin-api/src/main/**'
      - 'pixivdownload-core-api/src/main/**'
      - 'pixivdownload-plugin-gui-compose/src/**'
      - 'build-support/proguard/**'
      - '.github/actions/setup-build-cache/**'
      - '.github/workflows/build-cache.yml'

permissions:
  contents: read

concurrency:
  group: build-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # setup-gradle 优先匹配 job id；与产物验收一致才能优先读取主线预热结果。
  release-artifacts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          verify-signature: true
          java-version: '25'
          check-latest: true
          distribution: temurin
          java-package: jdk+jmods
      - uses: ./.github/actions/setup-build-cache
      - name: Resolve third-party Maven dependencies
        shell: bash
        run: mvn -B -ntp dependency:go-offline -DexcludeReactor=true -DexcludeGroupIds=io.github.sywyar.pixivdownloader,top.sywyar.lovepopup
      - name: Warm Compose compilation and ProGuard outputs
        shell: bash
        run: mvn -B -ntp -pl pixivdownload-plugin-gui-compose -am verify -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dgradle.daemon.argument=--daemon
