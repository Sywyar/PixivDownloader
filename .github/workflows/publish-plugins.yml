name: Publish plugins

# 构建官方外置插件 → 发布到独立分发仓库的 Release，并生成 / 提交插件市场 manifest.json。
# 触发：由 release/nightly 复用调用（串行阻塞主产物打包）/ 手动。
# 跨仓库写入用细粒度 PAT（secrets.CROSS_REPO_RELEASE_TOKEN，目标仓库 Contents: 读写 + Metadata: 读），
# 本仓库自带 GITHUB_TOKEN 不能跨仓库写。
on:
  workflow_call:
    outputs:
      trusted_base_sha:
        description: 'Protected predecessor approved by the reusable quality gate'
        value: ${{ jobs.trusted-base.outputs.sha }}
    inputs:
      publish_in_caller:
        description: '由调用方在自己的 release Environment job 中执行实际发布'
        required: true
        type: boolean
      publish_args:
        description: '可选发布参数；填写 -f 时强制重编译并覆盖上传所有插件资产'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      publish_args:
        description: '可选发布参数；填写 -f 时强制重编译并覆盖上传所有插件资产'
        required: false
        type: string
        default: ''

# 本仓库只需读（checkout）；对分发仓库的写全部经 PAT，不靠默认 GITHUB_TOKEN。
permissions:
  contents: read

jobs:
  trusted-base:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # 从受保护默认分支历史解析候选的严格前驱；历史提交仍使用自己的父提交。
      - name: Resolve trusted base
        id: base
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "manual publication requires the protected master branch" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          tip="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
          if git merge-base --is-ancestor "$GITHUB_SHA" "$tip"; then
            base="$(git rev-parse "$GITHUB_SHA^1")"
          else
            base="$(git merge-base "$GITHUB_SHA" "$tip")"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

  quality-gate:
    needs: trusted-base
    uses: ./.github/workflows/quality-gate.yml
    with:
      trusted_base_sha: ${{ needs.trusted-base.outputs.sha }}
      export_release_candidates: true

  publish:
    needs: quality-gate
    if: ${{ github.repository == 'Sywyar/PixivDownloader' }}
    # Windows runner：插件分发脚本面向 Windows PowerShell（plugin-distribution-common.ps1 用 System.IO.Compression / Get-FileHash）。
    runs-on: windows-latest
    environment: release
    steps:
      - name: Checkout main repo
        if: inputs.publish_in_caller != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Publish official plugins
        if: inputs.publish_in_caller != true
        uses: ./.github/actions/publish-official-plugins
        with:
          plugin_signing_private_key_pem_base64: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
          cross_repo_release_token: ${{ secrets.CROSS_REPO_RELEASE_TOKEN }}
          publish_args: ${{ inputs.publish_args || '' }}

      - name: Complete delegated publication gate
        if: inputs.publish_in_caller == true
        shell: bash
        run: |
          echo "Quality Gate passed; the caller will publish from its release Environment job."
