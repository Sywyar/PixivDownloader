name: Publish plugins

# 构建官方外置插件 → 发布到独立分发仓库的 Release，并生成 / 提交插件市场 manifest.json。
# 触发：由 release/nightly 复用调用（串行阻塞主产物打包）/ 手动。
# 跨仓库写入用细粒度 PAT（secrets.PLUGINS_REPO_TOKEN，目标仓库 Contents: 读写 + Metadata: 读），
# 本仓库自带 GITHUB_TOKEN 不能跨仓库写。
on:
  workflow_call:
    outputs:
      trusted_base_sha:
        description: 'Protected predecessor approved by the reusable quality gate'
        value: ${{ jobs.trusted-base.outputs.sha }}
    inputs:
      publish_in_caller:
        description: '由调用方在自己的 release Environment job 中执行实际发布'
        required: true
        type: boolean
      publish_args:
        description: '可选发布参数；填写 -f 时强制重编译并覆盖上传所有插件资产'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      publish_args:
        description: '可选发布参数；填写 -f 时强制重编译并覆盖上传所有插件资产'
        required: false
        type: string
        default: ''

# 本仓库只需读（checkout）；对分发仓库的写全部经 PAT，不靠默认 GITHUB_TOKEN。
permissions:
  contents: read

jobs:
  trusted-base:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Quality Gate 的 workflow_call 要求显式 trusted_base_sha：
      # 解析受保护默认分支的当前远端状态；与候选相同（默认分支 tip 被分发）时用其父提交
      # （此前已过质量门禁的 master 状态）。解析失败 fail closed，绝不回退到未验证的提交。
      - name: Resolve trusted base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch -q origin "refs/heads/$default_branch" 2>/dev/null || true
          tip="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" || true)"
          if [ -z "$tip" ]; then
            echo "cannot resolve the protected default branch remote ref; fail closed" >&2
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            tip="$(git rev-parse --verify --quiet "$tip^{commit}^" || true)"
          fi
          if ! [[ "$tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "cannot resolve a trusted base for $GITHUB_SHA; fail closed" >&2
            exit 1
          fi
          echo "sha=$tip" >> "$GITHUB_OUTPUT"

  quality-gate:
    needs: trusted-base
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/quality-gate.yml
    with:
      trusted_base_sha: ${{ needs.trusted-base.outputs.sha }}

  publish:
    needs: quality-gate
    if: ${{ github.repository == 'Sywyar/PixivDownloader' }}
    # Windows runner：插件分发脚本面向 Windows PowerShell（plugin-distribution-common.ps1 用 System.IO.Compression / Get-FileHash）。
    runs-on: windows-latest
    environment: release
    steps:
      - name: Checkout main repo
        if: inputs.publish_in_caller != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Publish official plugins
        if: inputs.publish_in_caller != true
        uses: ./.github/actions/publish-official-plugins
        with:
          plugin_signing_private_key_pem_base64: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
          plugins_repo_token: ${{ secrets.PLUGINS_REPO_TOKEN }}
          publish_args: ${{ inputs.publish_args || '' }}

      - name: Complete delegated publication gate
        if: inputs.publish_in_caller == true
        shell: bash
        run: |
          echo "Quality Gate passed; the caller will publish from its release Environment job."
