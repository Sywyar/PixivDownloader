name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Draft release tag, for example v1.8.2'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Validate release tag
        id: vars
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-beta\.[1-9][0-9]{0,8})?$ ]]; then
            echo "unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  trusted-base:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Quality Gate 的 workflow_call 要求显式 trusted_base_sha：
      # 解析受保护默认分支的当前远端状态；与候选相同（默认分支 tip 被分发）时用其父提交
      # （此前已过质量门禁的 master 状态）。解析失败 fail closed，绝不回退到未验证的提交。
      - name: Resolve trusted base
        id: base
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          default_branch="$DEFAULT_BRANCH"
          git fetch -q origin "refs/heads/$default_branch" 2>/dev/null || true
          tip="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" || true)"
          if [ -z "$tip" ]; then
            echo "cannot resolve the protected default branch remote ref; fail closed" >&2
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            tip="$(git rev-parse --verify --quiet "$tip^{commit}^" || true)"
          fi
          if ! [[ "$tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "cannot resolve a trusted base for $GITHUB_SHA; fail closed" >&2
            exit 1
          fi
          echo "sha=$tip" >> "$GITHUB_OUTPUT"

  draft-quality-gate:
    needs: trusted-base
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/quality-gate.yml
    with:
      trusted_base_sha: ${{ needs.trusted-base.outputs.sha }}

  publish-plugins:
    needs: validate-release-tag
    if: github.event_name == 'push'
    uses: ./.github/workflows/publish-plugins.yml
    with:
      publish_in_caller: true

  publish-plugin-artifacts:
    needs: publish-plugins
    if: github.event_name == 'push'
    runs-on: windows-latest
    environment: release
    steps:
      - name: Checkout main repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Publish official plugins
        uses: ./.github/actions/publish-official-plugins
        with:
          plugin_signing_private_key_pem_base64: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
          cross_repo_release_token: ${{ secrets.CROSS_REPO_RELEASE_TOKEN }}

  build-jar:
    needs: [validate-release-tag, publish-plugin-artifacts]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ needs.validate-release-tag.outputs.version }}
    env:
      RELEASE_VERSION: ${{ needs.validate-release-tag.outputs.version }}

    steps:
      - name: Fix Git UTF-8 filenames
        run: git config --global core.quotepath false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Package release Java artifacts
        uses: ./.github/actions/package-release-java
        with:
          release_version: ${{ needs.validate-release-tag.outputs.version }}
          distribution_version: ${{ github.ref_name }}
          plugin_credential_master_key_base64: ${{ secrets.PIXIVDOWNLOAD_PLUGIN_CREDENTIAL_MASTER_KEY_BASE64 }}

  build-windows-installer:
    needs: build-jar
    if: github.event_name == 'push'
    runs-on: windows-latest
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.build-jar.outputs.version }}

    steps:
      - name: Fix Git UTF-8 filenames
        run: git config --global core.quotepath false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Package Windows installer
        uses: ./.github/actions/package-windows-installer
        with:
          release_version: ${{ needs.build-jar.outputs.version }}

  release-artifact-e2e:
    needs: [build-jar, build-windows-installer]
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Test final release artifacts
        uses: ./.github/actions/test-release-artifacts
        with:
          release_version: ${{ needs.build-jar.outputs.version }}

  release:
    needs: [publish-plugins, publish-plugin-artifacts, build-jar, build-windows-installer, release-artifact-e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download Windows installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: artifacts/

      - name: Download java distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-distributions
          path: artifacts/java-distributions

      - name: Build release notes
        shell: bash
        run: |
          awk '
            BEGIN {
              version_header = "[" ENVIRON["GITHUB_REF_NAME"] "]"
            }
            /^## \[/ {
              if (found) {
                exit
              }
              if (index($0, version_header) > 0) {
                found = 1
                next
              }
            }
            found {
              print
            }
          ' CHANGELOG.md > CHANGELOG_EXCERPT.md

          if [ ! -s CHANGELOG_EXCERPT.md ]; then
            echo "No changelog entry found for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          cat > RELEASE_BODY.md <<'EOF'
          > [!IMPORTANT]
          > 我们正在收集多人模式的实际使用情况，用于决定后续维护方向。如果您正在使用或计划使用多人模式，请在「下载页」打开「站内信」，进入「多人模式去留调查」填写问卷。您的反馈将帮助我们了解真实需求。

          > [!NOTE]
          > 自v1.14.0 版本起，桌面Gui图形界面默认为Compose界面，如需切换回旧版桌面界面，请在「设置」->「界面」->「桌面界面」中切换到 「Swing 图形界面」并跟随指引完全重启应用。

          EOF
          cat CHANGELOG_EXCERPT.md >> RELEASE_BODY.md

          cat >> RELEASE_BODY.md <<'EOF'

          ## 使用说明

          ### Windows 安装包
          下载并运行 `PixivDownload-*-win-x64-setup.exe`。安装时可以选择界面语言；「附加功能」页还提供「下载并安装 FFmpeg」选项。安装包已预置默认安装的签名官方插件。Douyin 不再由官方仓库或安装包分发，需要从自定义仓库或本地包安装并确认第三方信任。

          FFmpeg 不包含在安装包内。勾选该选项后，安装器会在主程序安装完成后下载 Windows x64 版 FFmpeg，该文件由项目基于官方稳定源码构建。安装器会单独显示下载和解压进度。跳过该选项或下载失败不会影响普通图片下载，之后仍可在 GUI 的「状态」页点击「下载 FFmpeg」重试。安装器中的插件选择页当前不显示。

          ### Java 标准包（跨平台）
          下载 `PixivDownload-*-java.zip` 并完整解压到任意目录，不要只提取其中的 JAR。运行前需要安装 Java 17。Windows 使用 `run.bat`，Linux 和 macOS 在解压目录中执行 `sh run.sh`。

          该包包含核心壳和默认安装的签名官方插件，与 Windows 安装包的默认插件集合一致。Douyin 不再由官方仓库或此发行包分发，需要从自定义仓库或本地包安装并确认第三方信任。包内不含 JRE 或 FFmpeg。在 Windows x64、Linux x64/arm64 与 macOS x64/arm64 系统上，可以在 GUI 的「状态」页下载 FFmpeg；其它系统需要手动安装。

          ### 离线全量包（跨平台）
          下载 `PixivDownload-*-full-offline.zip` 并完整解压。Windows 使用 `run.bat`，Linux 和 macOS 在解压目录中执行 `sh run.sh`。

          该包包含核心壳、完整的签名官方插件分发集合，以及对应的 `.sha256`、`.sig`、provenance sidecar 和 `plugins-manifest.json`，不包含 Douyin。所有官方插件文件均已随包提供。包内不含 JRE 或 FFmpeg。运行前需要自行安装 Java 17；如需使用依赖 FFmpeg 的功能，还应提前安装系统 FFmpeg。

          ### 网页端一站式下载

          正常发行包已包含必需的 `download-workbench` 插件。启动程序后即可打开下载页，默认地址为 `http://localhost:6999/pixiv-batch.html`；无需安装油猴脚本即可完成大部分批量下载操作。下载进度和历史记录位于 `http://localhost:6999/monitor.html`。如果修改了端口、域名或 HTTPS 设置，请使用实际配置的地址。

          ## 详细说明

          完整安装、配置和插件说明请查看仓库 README。
          EOF

      - name: Generate update manifest
        shell: bash
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          INSTALLER=$(ls artifacts/*-win-x64-setup.exe 2>/dev/null | head -n1 || true)
          if [ -z "$INSTALLER" ]; then
            echo "No installer artifact found for update manifest" >&2
            exit 1
          fi

          FILENAME=$(basename "$INSTALLER")
          SHA256=$(sha256sum "$INSTALLER" | awk '{print $1}')
          SIZE=$(stat -c%s "$INSTALLER")
          LATEST_VERSION="${GH_REF_NAME#v}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          EXPIRES_AT=$(date -u -d '+370 days' +%Y-%m-%dT%H:%M:%SZ)
          ASSET_URL="https://github.com/${GH_REPOSITORY}/releases/download/${GH_REF_NAME}/${FILENAME}"
          NOTES_URL="https://github.com/${GH_REPOSITORY}/releases/tag/${GH_REF_NAME}"

          jq -n \
            --arg latestVersion "$LATEST_VERSION" \
            --arg channel "stable" \
            --argjson sequence "$GITHUB_RUN_ID" \
            --arg expiresAt "$EXPIRES_AT" \
            --arg releaseDate "$RELEASE_DATE" \
            --rawfile releaseNotes CHANGELOG_EXCERPT.md \
            --arg releaseNotesUrl "$NOTES_URL" \
            --arg assetUrl "$ASSET_URL" \
            --arg assetSha256 "$SHA256" \
            --argjson assetSize "$SIZE" \
            '{
              channel: $channel,
              sequence: $sequence,
              expiresAt: $expiresAt,
              latestVersion: $latestVersion,
              releaseDate: $releaseDate,
              releaseNotes: $releaseNotes,
              releaseNotesUrl: $releaseNotesUrl,
              assets: {
                "win-x64-installer": {
                  url: $assetUrl,
                  sha256: $assetSha256,
                  sizeBytes: $assetSize
                }
              }
            }' > artifacts/update.json

          echo "Generated update.json:"
          cat artifacts/update.json

      - name: Sign update manifest
        uses: ./.github/actions/sign-update-manifest
        with:
          trusted_base_sha: ${{ needs.publish-plugins.outputs.trusted_base_sha }}
          update_signing_private_key_pem_base64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_BASE64 }}

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          files: |
            artifacts/*-setup.exe
            artifacts/java-distributions/*-java.zip
            artifacts/java-distributions/*-full-offline.zip
            artifacts/update.json
            artifacts/update.json.sig
          body_path: RELEASE_BODY.md

  create-draft-release:
    needs: draft-quality-gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify draft tag targets the tested commit
        shell: bash
        env:
          DRAFT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$DRAFT_TAG" =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-beta\.[1-9][0-9]{0,8})?$ ]]; then
            echo "unsupported draft release tag: $DRAFT_TAG" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$DRAFT_TAG"
          if TAG_COMMIT=$(git rev-parse --verify "refs/tags/$DRAFT_TAG^{commit}" 2>/dev/null); then
            test "$TAG_COMMIT" = "$GITHUB_SHA"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag_name }}
          draft: true
          prerelease: ${{ contains(inputs.tag_name, '-beta') }}
          generate_release_notes: true
