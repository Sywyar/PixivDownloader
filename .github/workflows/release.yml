name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Draft release tag, for example v1.8.2'
        required: true
        type: string

jobs:
  trusted-base:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Quality Gate 的 workflow_call 要求显式 trusted_base_sha：
      # 解析受保护默认分支的当前远端状态；与候选相同（默认分支 tip 被分发）时用其父提交
      # （此前已过质量门禁的 master 状态）。解析失败 fail closed，绝不回退到未验证的提交。
      - name: Resolve trusted base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch -q origin "refs/heads/$default_branch" 2>/dev/null || true
          tip="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" || true)"
          if [ -z "$tip" ]; then
            echo "cannot resolve the protected default branch remote ref; fail closed" >&2
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            tip="$(git rev-parse --verify --quiet "$tip^{commit}^" || true)"
          fi
          if ! [[ "$tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "cannot resolve a trusted base for $GITHUB_SHA; fail closed" >&2
            exit 1
          fi
          echo "sha=$tip" >> "$GITHUB_OUTPUT"

  draft-quality-gate:
    needs: trusted-base
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/quality-gate.yml
    with:
      trusted_base_sha: ${{ needs.trusted-base.outputs.sha }}

  publish-plugins:
    if: github.event_name == 'push'
    uses: ./.github/workflows/publish-plugins.yml
    secrets:
      PLUGINS_REPO_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
      PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
      PLUGIN_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM }}

  build-jar:
    needs: publish-plugins
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fix Git UTF-8 filenames
        run: git config --global core.quotepath false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Prepare production plugin credential key filter
        shell: pwsh
        env:
          PIXIVDOWNLOAD_PLUGIN_CREDENTIAL_MASTER_KEY_BASE64: ${{ secrets.PIXIVDOWNLOAD_PLUGIN_CREDENTIAL_MASTER_KEY_BASE64 }}
        run: |
          $filterPath = Join-Path $env:RUNNER_TEMP "pixivdownload-plugin-credential-key-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.properties"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "PLUGIN_CREDENTIAL_FILTER=$filterPath`n",
            (New-Object System.Text.UTF8Encoding($false)))
          ./scripts/write-plugin-credential-key-filter.ps1 -OutputPath $filterPath

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="0.0.1"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build JAR
        run: >
          mvn package -DskipTests -Dapp.release.version=${{ steps.vars.outputs.version }}
          "-Dplugin.credential.filter=$PLUGIN_CREDENTIAL_FILTER"
          "-Dpixiv.layout-survey.project-token=${{ vars.PIXIV_LAYOUT_SURVEY_PROJECT_TOKEN }}"
          "-Dpixiv.layout-survey.survey-id=${{ vars.PIXIV_LAYOUT_SURVEY_ID }}"
          "-Dpixiv.layout-survey.api-host=${{ vars.PIXIV_LAYOUT_SURVEY_API_HOST }}"
          "-Dpixiv.layout-survey.ui-host=${{ vars.PIXIV_LAYOUT_SURVEY_UI_HOST }}"
          "-Dpixiv.layout-survey.require-config=${{ github.repository == 'Sywyar/PixivDownloader' }}"

      - name: Verify packaged distribution boundaries
        run: |
          mvn -B -ntp -pl pixivdownload-app -am test -Dtest=DistributionPackagingBoundaryTest -Dsurefire.failIfNoSpecifiedTests=false -Ddistribution.packaging.require-artifacts=true -Ddistribution.packaging.require-production-credential-key=true -Dexec.skip=true
          REPORT=$(find pixivdownload-app/target/surefire-reports -name '*DistributionPackagingBoundaryTest.txt' -print -quit)
          test -n "$REPORT"
          grep -Eq 'Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0' "$REPORT"

      - name: Remove production plugin credential key filter
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PLUGIN_CREDENTIAL_FILTER)) {
            Remove-Item -LiteralPath $env:PLUGIN_CREDENTIAL_FILTER -Force -ErrorAction SilentlyContinue
          }

      - name: Stage executable JAR
        run: |
          BOOT_JARS=()
          while IFS= read -r f; do BOOT_JARS+=("$f"); done < <(ls pixivdownload-app/target/PixivDownload-*-boot.jar 2>/dev/null || true)
          if [ "${#BOOT_JARS[@]}" -eq 0 ]; then
            while IFS= read -r f; do BOOT_JARS+=("$f"); done < <(ls pixivdownload-app/target/PixivDownload-*.jar 2>/dev/null | grep -vE '(-sources\.jar|-javadoc\.jar|-original\.jar)$' || true)
          fi
          if [ "${#BOOT_JARS[@]}" -ne 1 ]; then
            echo "Expected exactly one executable app jar, found ${#BOOT_JARS[@]}:" >&2
            printf '%s\n' "${BOOT_JARS[@]}" >&2
            exit 1
          fi
          BOOT_JAR=${BOOT_JARS[0]}
          VERSION=${GITHUB_REF_NAME:-snapshot}
          mkdir -p build/release-jars
          OUTPUT_JAR="build/release-jars/PixivDownload-${VERSION}.jar"
          cp "$BOOT_JAR" "$OUTPUT_JAR"
          test -s "$OUTPUT_JAR"
          jar tf "$OUTPUT_JAR" | grep -q '^BOOT-INF/' || {
            echo "Selected jar is not a Spring Boot executable jar: $OUTPUT_JAR" >&2
            exit 1
          }
          STAGED_COUNT=$(ls build/release-jars/*.jar 2>/dev/null | wc -l)
          test "$STAGED_COUNT" -eq 1
          ls -l build/release-jars/

      - name: Upload internal app-shell JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-shell-jar
          path: build/release-jars/*.jar
          if-no-files-found: error

      - name: Stage official plugin inputs from signed catalog
        shell: pwsh
        run: |
          $signatureTools = @(Get-ChildItem pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-*.jar -File |
            Where-Object { $_.Name -notlike "*-sources.jar" -and $_.Name -notlike "*-javadoc.jar" } |
            Sort-Object LastWriteTime -Descending)
          if ($signatureTools.Count -lt 1) {
            throw "Could not find pixivdownload-plugin-signature tool jar."
          }
          $signatureTool = $signatureTools[0]
          ./scripts/stage-official-plugin-inputs-from-catalog.ps1 `
            -OutputDir build/plugin-inputs `
            -SignatureToolJar $signatureTool.FullName `
            -IncludeOptional

      - name: Assemble Java distributions
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $jars = @(Get-ChildItem build/release-jars/PixivDownload-*.jar -File)
          if ($jars.Count -ne 1) {
            throw "Expected exactly one staged app-shell JAR under build/release-jars, found $($jars.Count)"
          }
          $signatureTools = @(Get-ChildItem pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-*.jar -File |
            Where-Object { $_.Name -notlike "*-sources.jar" -and $_.Name -notlike "*-javadoc.jar" } |
            Sort-Object LastWriteTime -Descending)
          if ($signatureTools.Count -lt 1) {
            throw "Could not find pixivdownload-plugin-signature tool jar."
          }
          $signatureTool = $signatureTools[0]
          ./scripts/package-java-distributions.ps1 `
            -Version $version `
            -PrebuiltJar $jars[0].FullName `
            -PrebuiltPluginsDir build/plugin-inputs `
            -SignatureToolJar $signatureTool.FullName `
            -OutputDir build/plugin-distributions

      - name: Upload plugin inputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-inputs
          path: build/plugin-inputs/*
          if-no-files-found: error

      - name: Upload java distributions artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-distributions
          path: |
            build/plugin-distributions/PixivDownload-*-java.zip
            build/plugin-distributions/PixivDownload-*-full-offline.zip
          if-no-files-found: error

  build-windows-installer:
    needs: build-jar
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Fix Git UTF-8 filenames
        run: git config --global core.quotepath false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="0.0.1"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download internal app-shell JAR
        uses: actions/download-artifact@v4
        with:
          name: app-shell-jar
          path: artifacts/app-shell-jar

      - name: Download plugin inputs artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-inputs
          path: artifacts/plugin-inputs

      - name: Build plugin signature tool
        shell: powershell
        run: .\mvnw.cmd "-pl" "pixivdownload-plugin-signature" "-am" "package" "-DskipTests" "-Dexec.skip=true"

      - name: Package Windows setup
        shell: pwsh
        run: |
          $version = '${{ steps.vars.outputs.version }}'
          $jars = @(Get-ChildItem artifacts/app-shell-jar/PixivDownload-*.jar -File)
          if ($jars.Count -ne 1) {
            throw "Expected exactly one executable JAR artifact under artifacts/app-shell-jar, found $($jars.Count)"
          }
          $jar = $jars[0]
          $pluginsDir = (Resolve-Path artifacts/plugin-inputs).Path
          $signatureTools = @(Get-ChildItem pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-*.jar -File |
            Where-Object { $_.Name -notlike "*-sources.jar" -and $_.Name -notlike "*-javadoc.jar" } |
            Sort-Object LastWriteTime -Descending)
          if ($signatureTools.Count -lt 1) {
            throw "Could not find pixivdownload-plugin-signature tool jar."
          }
          $signatureTool = $signatureTools[0]
          ./scripts/package-local.ps1 `
            -Version $version `
            -PrebuiltJar $jar.FullName `
            -PrebuiltPluginsDir $pluginsDir `
            -SignatureToolJar $signatureTool.FullName `
            -SkipPortable `
            -SkipOfflinePortable

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/out/*-setup.exe

  release:
    needs: [build-jar, build-windows-installer]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download Windows installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

      - name: Download java distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: java-distributions
          path: artifacts/java-distributions

      - name: Build release notes
        shell: bash
        run: |
          awk '
            BEGIN {
              version_header = "[" ENVIRON["GITHUB_REF_NAME"] "]"
            }
            /^## \[/ {
              if (found) {
                exit
              }
              if (index($0, version_header) > 0) {
                found = 1
                next
              }
            }
            found {
              print
            }
          ' CHANGELOG.md > CHANGELOG_EXCERPT.md

          if [ ! -s CHANGELOG_EXCERPT.md ]; then
            echo "No changelog entry found for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          cat > RELEASE_BODY.md <<'EOF'
          > [!NOTE]
          > 自 v1.8.0 版本更新中，我大量优化了网页的布局和功能统一性，希望可以让使用变得更方便和直观，如果有任何优化建议和问题欢迎提出issue
          > 发布附件提供 Windows 安装包、与安装包默认插件集合一致的跨平台 Java 标准包，以及额外包含 Douyin 的离线全量包；核心壳 JAR 仅作为内部构建输入，不再单独提供。

          EOF
          cat CHANGELOG_EXCERPT.md >> RELEASE_BODY.md

          cat >> RELEASE_BODY.md <<'EOF'

          ## 使用说明

          ### Windows 安装包
          下载 `PixivDownload-*-win-x64-setup.exe` 并运行。安装包支持语言选择，并在“附加功能”页提供“下载并安装 FFmpeg”选项；除 Douyin 外的面向用户的官方插件已在构建期预置。

          FFmpeg 不再内置到安装包中；勾选该选项后，安装器会在主程序安装完成后联网下载 FFmpeg，并显示独立下载/解压进度。未勾选或下载失败时，普通图片下载不受影响，后续也可以在 GUI 的“状态”页点击“下载 FFmpeg”重试。
          安装器中的插件选择页当前暂时跳过；Douyin 插件可在启动后从 Web 插件市场按需安装。

          ### Java 标准包（跨平台）
          下载 `PixivDownload-${{ github.ref_name }}-java.zip` 并完整解压到任意目录，不要只提取其中的 JAR。需要自行安装 Java 17。
          Windows 上执行 `run.bat`；Linux / macOS 在解压目录内执行 `sh run.sh`。
          该包包含核心壳与除 Douyin 外的全部面向用户的签名官方插件，与 Windows 安装包默认插件集合一致；Douyin 可在启动后从 Web 插件市场按需安装。包内不包含 JRE，也不包含 FFmpeg。

          ### 离线全量包（跨平台）
          下载 `PixivDownload-${{ github.ref_name }}-full-offline.zip` 并完整解压，Windows 上执行 `run.bat`，Linux / macOS 执行 `sh run.sh`。
          该包包含核心壳、全部面向用户的签名官方插件（含 Douyin）、`.sha256`、`.sig`、provenance sidecar 和 `plugins-manifest.json`，适合离线部署或非 Windows 环境。需要自行安装 Java 17；包内不包含 JRE，也不包含 FFmpeg。

          ### 网页端一站式下载

          确认 `plugins/` 下已有 `download-workbench` 插件后，启动并访问 `http://localhost:6999/pixiv-batch.html`，无需安装油猴脚本即可完成大部分批量下载操作。
          访问 `http://localhost:6999/monitor.html` 查看下载进度和历史记录。

          ## 详细说明请查看 README
          EOF

      - name: Generate update manifest
        shell: bash
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          INSTALLER=$(ls artifacts/*-win-x64-setup.exe 2>/dev/null | head -n1 || true)
          if [ -z "$INSTALLER" ]; then
            echo "No installer artifact found for update manifest" >&2
            exit 1
          fi

          FILENAME=$(basename "$INSTALLER")
          SHA256=$(sha256sum "$INSTALLER" | awk '{print $1}')
          SIZE=$(stat -c%s "$INSTALLER")
          LATEST_VERSION="${GH_REF_NAME#v}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          ASSET_URL="https://github.com/${GH_REPOSITORY}/releases/download/${GH_REF_NAME}/${FILENAME}"
          NOTES_URL="https://github.com/${GH_REPOSITORY}/releases/tag/${GH_REF_NAME}"

          jq -n \
            --arg latestVersion "$LATEST_VERSION" \
            --arg releaseDate "$RELEASE_DATE" \
            --rawfile releaseNotes CHANGELOG_EXCERPT.md \
            --arg releaseNotesUrl "$NOTES_URL" \
            --arg assetUrl "$ASSET_URL" \
            --arg assetSha256 "$SHA256" \
            --argjson assetSize "$SIZE" \
            '{
              latestVersion: $latestVersion,
              releaseDate: $releaseDate,
              releaseNotes: $releaseNotes,
              releaseNotesUrl: $releaseNotesUrl,
              assets: {
                "win-x64-installer": {
                  url: $assetUrl,
                  sha256: $assetSha256,
                  sizeBytes: $assetSize
                }
              }
            }' > artifacts/update.json

          echo "Generated update.json:"
          cat artifacts/update.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          files: |
            artifacts/*-setup.exe
            artifacts/java-distributions/*-java.zip
            artifacts/java-distributions/*-full-offline.zip
            artifacts/update.json
          body_path: RELEASE_BODY.md

  create-draft-release:
    needs: draft-quality-gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify draft tag targets the tested commit
        shell: bash
        env:
          DRAFT_TAG: ${{ inputs.tag_name }}
        run: |
          git check-ref-format "refs/tags/$DRAFT_TAG"
          if TAG_COMMIT=$(git rev-parse --verify "refs/tags/$DRAFT_TAG^{commit}" 2>/dev/null); then
            test "$TAG_COMMIT" = "$GITHUB_SHA"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag_name }}
          draft: true
          prerelease: ${{ contains(inputs.tag_name, '-beta') }}
          generate_release_notes: true
