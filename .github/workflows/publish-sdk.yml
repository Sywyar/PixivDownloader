name: Publish plugin SDK

on:
  push:
    branches: [master]
  workflow_call:
    inputs:
      publish_requested:
        description: '由主程序发行流程请求发布当前 SDK'
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      mode:
        description: '发布新版本，或在 Central 已完成后恢复 SDK Release'
        required: true
        type: choice
        default: publish
        options:
          - publish
          - recover-release

permissions:
  contents: read

env:
  SDK_REPOSITORY: Sywyar/PixivDownloader-Plugin-SDK
  CENTRAL_BASE_URL: https://repo1.maven.org/maven2

jobs:
  release-plan:
    if: inputs.publish_requested == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      mode: ${{ steps.plan.outputs.mode }}
      trusted_base_sha: ${{ steps.plan.outputs.trusted_base_sha }}
      sdk_version: ${{ steps.plan.outputs.sdk_version }}
      release_id: ${{ steps.plan.outputs.release_id }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve SDK release plan
        id: plan
        uses: ./.github/actions/plan-sdk-release
        with:
          mode: ${{ inputs.mode || 'publish' }}

  quality-gate:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.publish == 'true' }}
    uses: ./.github/workflows/quality-gate.yml
    with:
      trusted_base_sha: ${{ needs.release-plan.outputs.trusted_base_sha }}
      export_sdk_candidates: ${{ needs.release-plan.outputs.mode == 'publish' }}
      sdk_publication_mode: latest

  publish:
    needs: [release-plan, quality-gate]
    if: ${{ needs.release-plan.outputs.publish == 'true' && github.repository == 'Sywyar/PixivDownloader' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    concurrency:
      group: sdk-publication-${{ needs.release-plan.outputs.release_id }}
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ secrets.CROSS_REPO_RELEASE_TOKEN }}
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      SDK_VERSION: ${{ needs.release-plan.outputs.sdk_version }}
      RELEASE_ID: ${{ needs.release-plan.outputs.release_id }}
      PRERELEASE: ${{ needs.release-plan.outputs.prerelease }}
      PUBLICATION_MODE: ${{ needs.release-plan.outputs.mode }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish verified SDK
        uses: ./.github/actions/publish-sdk
        with:
          sdk_candidate_id: ${{ needs.quality-gate.outputs.sdk_candidate_id }}
          maven_gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          plugin_signing_private_key_pem_base64: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
