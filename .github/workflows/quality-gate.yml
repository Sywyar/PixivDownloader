              --pr-base "${{ github.event.pull_request.base.sha }}" \
              --merge-group-base "${{ github.event.merge_group.base_sha }}" \
              --input-base "${{ inputs.trusted_base_sha }}" \
              --root-admission "${{ inputs.root_admission }}" \
              --root-candidate-sha "${{ inputs.root_candidate_sha }}" \
              --default-branch "${{ github.event.repository.default_branch }}" \
              --mode)"
            printf '%s' "$helper" > "$gate/helper.json"
            helper_mode="$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(j.mode)' "$gate/helper.json")"
            helper_base="$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(j.base)' "$gate/helper.json")"
            if [ "$helper_mode" != "$mode" ] || [ "$helper_base" != "$base" ]; then
              echo "trusted helper resolved $helper_mode/$helper_base but the bootstrap resolved $mode/$base; fail closed" >&2
              exit 1
            fi
          fi
          if [ -f "$out/scripts/ci/materialize-trusted-gate.sh" ]; then
            out2="$gate/out2"
            bash "$out/scripts/ci/materialize-trusted-gate.sh" \
              --repo-root "$PWD" --base "$base" \
              --output "$out2" --index "$gate/index2" --paths-file "$gate/paths2.txt" \
              --paths 'scripts/i18n scripts/hooks scripts/ci scripts/sync-shared-snippets.ps1 .github/workflows/quality-gate.yml .github/workflows/shared-snippets-check.yml .github/workflows/release.yml .github/workflows/nightly.yml .github/workflows/publish-plugins.yml package.json package-lock.json'
            if ! diff -r "$out" "$out2" >/dev/null 2>&1; then
              echo "materialized gate differs from the trusted helper output; fail closed" >&2
              exit 1
            fi
          fi
          # gate-surface.json 单一事实来源交叉检查：trusted manifest 驱动的物化必须与
          # bootstrap 硬编码 gate surface 完全一致（manifest 与硬编码列表漂移 → fail closed；
          # candidate manifest 只作为被检查对象，不能决定检查范围）
          if [ -f "$out/scripts/ci/gate-surface.json" ]; then
            manifest_paths="$(node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write((m.paths||[]).filter(p=>typeof p==="string").join(" "))' "$out/scripts/ci/gate-surface.json")"
            out3="$gate/out3"
            bash "$out/scripts/ci/materialize-trusted-gate.sh" \
              --repo-root "$PWD" --base "$base" \
              --output "$out3" --index "$gate/index3" --paths-file "$gate/paths3.txt" \
              --paths $manifest_paths
            if ! diff -r "$out" "$out3" >/dev/null 2>&1; then
              echo "gate-surface.json does not match the bootstrap gate surface; fail closed" >&2
              exit 1
            fi
          fi
          echo "GATE_MODE=$mode" >> "$GITHUB_ENV"
          echo "ROOT_SHA=$root" >> "$GITHUB_ENV"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "GATE_DIR=$out" >> "$GITHUB_ENV"
          echo "gate mode: $mode; trusted base: $base; root: $root"

      - name: Trusted base contract validates the candidate
        run: |
          set -euo pipefail
          if [ "$GATE_MODE" = "ROOT_ADMISSION" ]; then
            echo "ROOT ADMISSION MODE: candidate ${{ github.sha }} == Epoch 2 root; running the root gate with the full root self-protection suite."
          fi
          node "$GATE_DIR/scripts/i18n/gate-contract.mjs" \
            --repo-root "$PWD" --report-root "$PWD" \
            --candidate-ref "${{ github.sha }}" \
            --force-self-protection
          echo "trusted base checker checks the candidate ref..."
          node "$GATE_DIR/scripts/i18n/check.mjs" --repo-root "$PWD" --report-root "$PWD" \
            --snapshot ref --ref "${{ github.sha }}"

      - name: Gate parity audit (no gate may be weakened)
        run: |
          set -euo pipefail
          if [ "$GATE_MODE" = "ROOT_ADMISSION" ]; then
            node "$GATE_DIR/scripts/ci/gate-parity.mjs" --repo-root "$PWD" --report-root "$PWD" \
              --candidate-ref "${{ github.sha }}" --invariants
          else
            node "$GATE_DIR/scripts/ci/gate-parity.mjs" --repo-root "$PWD" --report-root "$PWD" \
              --trusted-dir "$GATE_DIR" --candidate-ref "${{ github.sha }}"
          fi

      - name: Upload gate contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-contract-report
          path: build/reports/i18n/
          if-no-files-found: ignore

      # 仓库管理员最终门禁提示：仅靠仓库内 workflow 不能建立绝对不可变的信任根。
      - name: Manual gate notes for repository admins
        if: always()
        run: |
          set -euo pipefail
          echo "REMINDER for repository admins:"
          echo "  - Do NOT allow bypassing branch protection."
          echo "  - Configure Quality Gate jobs (java-tests, javascript-tests, signature-guard,"
          echo "    trusted-gate-contract, i18n-check) as required checks."
          echo "  - Configure 'Shared Snippet Drift Check / check-shared-snippets' as a required"
          echo "    external check (strict required status checks, no permanent always bypass)."
          echo "  - Create the annotated tag i18n-gate-epoch-2-root at the reviewed Epoch 2 root"
          echo "    commit and protect it with a Ruleset (no delete, no force update, no bypass)."
          echo "  - Gate surface (.github/workflows/quality-gate.yml, shared-snippets-check.yml,"
          echo "    release.yml, nightly.yml, publish-plugins.yml, scripts/i18n/**, scripts/hooks/**,"
          echo "    scripts/ci/**, scripts/sync-shared-snippets.ps1, package.json,"
          echo "    package-lock.json; see scripts/ci/gate-surface.json) must go through"
          echo "    protected review."
          echo "  - A stronger setup is an external workflow / separate repository checker that"
          echo "    the candidate commit cannot modify."
          echo "  - A repository-internal workflow cannot establish an absolutely immutable trust root."

  i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # 物化非 tip commit 的 tree 需要完整对象库，浅克隆会碰巧可用但不可依赖
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (yaml parser for the workflow contract)
        run: npm ci

      - name: Set up JDK 17 (properties oracle differential tests)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Resolve Gate Epoch 2 root and trusted base
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          root="$(git rev-parse --verify --quiet "refs/tags/i18n-gate-epoch-2-root^{commit}" 2>/dev/null || printf '%s' '')"
          admission=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.root_admission }}" = "true" ]; then
            admission="1"
          fi
          if [ -n "$admission" ]; then
            root_candidate="${{ inputs.root_candidate_sha }}"
            if [ -n "$root_candidate" ] && [ "$root_candidate" != "$GITHUB_SHA" ]; then
              echo "root_candidate_sha $root_candidate does not equal the dispatched commit $GITHUB_SHA; fail closed" >&2
              exit 1
            fi
          fi
          if [ -n "$root" ]; then
            if [ "$root" = "$GITHUB_SHA" ]; then
              mode="ROOT_ADMISSION"
            elif git merge-base --is-ancestor "$root" "$GITHUB_SHA" >/dev/null 2>&1; then
              mode="NORMAL"
            else
              echo "candidate does not descend from the Gate Epoch 2 trust root" >&2
              exit 1
            fi
          else
            if [ -n "$admission" ]; then
              mode="ROOT_ADMISSION"
              root="$GITHUB_SHA"
            else
              echo "Gate Epoch 2 trust root has not been installed." >&2
              echo "refs/tags/i18n-gate-epoch-2-root is missing; only an explicit workflow_dispatch" >&2
              echo "root_admission=true with root_candidate_sha may enter ROOT_ADMISSION; fail closed" >&2
              exit 1
            fi
          fi
          if [ "$mode" = "NORMAL" ]; then
            base=""
            if [ -n "${{ inputs.trusted_base_sha }}" ]; then
              base="${{ inputs.trusted_base_sha }}"
            else
              case "$GITHUB_EVENT_NAME" in
                pull_request)
                  base="${{ github.event.pull_request.base.sha }}"
                  ;;
                merge_group)
                  base="${{ github.event.merge_group.base_sha }}"
                  ;;
                push)
                  before="${{ github.event.before }}"
                  if [ -n "$before" ] && [ "$before" != "$zero" ] \
                      && git rev-parse --verify --quiet "$before^{commit}" >/dev/null 2>&1; then
                    base="$before"
                  else
                    # 新分支（before 全零）：不伪装成「默认分支 tip → candidate」。
                    # fork base = merge-base(candidate, protected default branch)；
                    # 随后统一验证 root <= forkBase < candidate。
                    default_branch="${{ github.event.repository.default_branch }}"
                    if ! git fetch -q origin "refs/heads/$default_branch" 2>/dev/null; then
                      echo "warning: cannot fetch the default branch; continuing (may fail closed later)" >&2
                    fi
                    default_tip="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" 2>/dev/null || printf '%s' '')"
                    if [ -z "$default_tip" ]; then
                      echo "cannot resolve the protected default branch remote ref for a new branch; fail closed" >&2
                      exit 1
                    fi
                    fork_base="$(git merge-base "$GITHUB_SHA" "$default_tip" 2>/dev/null || printf '%s' '')"
                    if ! [[ "$fork_base" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "cannot determine a fork base between the candidate and the protected default branch; fail closed" >&2
                      exit 1
                    fi
                    base="$fork_base"
                  fi
                  ;;
                workflow_dispatch)
                  default_branch="${{ github.event.repository.default_branch }}"
                  if ! git fetch -q origin "refs/heads/$default_branch" 2>/dev/null; then
                    echo "warning: cannot fetch the default branch; continuing (may fail closed later)" >&2
                  fi
                  base="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" 2>/dev/null || printf '%s' '')"
                  ;;
                *)
                  echo "cannot determine a trusted base for event $GITHUB_EVENT_NAME; fail closed" >&2
                  exit 1
                  ;;
              esac
            fi
            if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
              echo "cannot determine a valid trusted base for $GITHUB_SHA (event $GITHUB_EVENT_NAME); fail closed" >&2
              exit 1
            fi
            if [ "$base" = "$GITHUB_SHA" ]; then
              echo "trusted base $base equals the candidate $GITHUB_SHA; fail closed" >&2
              exit 1
            fi
            if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
              echo "trusted base $base is not present in the local object database; fail closed" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$root" "$base" >/dev/null 2>&1; then
              echo "trusted base $base does not descend from the Gate Epoch 2 trust root $root; fail closed" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$base" "$GITHUB_SHA" >/dev/null 2>&1; then
              echo "trusted base $base is not an ancestor of the candidate $GITHUB_SHA; sibling / unrelated / descendant / pre-root trusted bases are refused; fail closed" >&2
              exit 1
            fi
          else
            base="$root"
            echo "ROOT ADMISSION MODE: candidate is the Gate Epoch 2 trust root candidate; running the root gate with the full root self-protection suite." >&2
          fi
          gate="$RUNNER_TEMP/gate"
          paths_file="$gate/paths.txt"
          index_file="$gate/index"
          out="$gate/out"
          mkdir -p "$gate" "$out"
          rm -f "$paths_file" "$index_file"
          git ls-tree -r --name-only "$base" -- \
            scripts/i18n \
            scripts/hooks \
            scripts/ci \
            scripts/sync-shared-snippets.ps1 \
            .github/workflows/quality-gate.yml \
            .github/workflows/shared-snippets-check.yml \
            .github/workflows/release.yml \
            .github/workflows/nightly.yml \
            .github/workflows/publish-plugins.yml \
            package.json \
            package-lock.json \
            > "$paths_file"
          test -s "$paths_file" || { echo "trusted base $base has no gate paths; fail closed" >&2; exit 1; }
          GIT_INDEX_FILE="$index_file" git read-tree "$base"
          GIT_INDEX_FILE="$index_file" git -c core.autocrlf=false checkout-index \
            --stdin \
            --prefix="$out/" \
            < "$paths_file"
          test -f "$out/scripts/i18n/check.mjs" || { echo "gate materialization is empty; fail closed" >&2; exit 1; }
          test -f "$out/scripts/hooks/pre-push-guard.sh" || { echo "gate materialization misses the guard; fail closed" >&2; exit 1; }
          test -f "$out/scripts/i18n/gate-contract.mjs" || { echo "gate materialization misses the contract; fail closed" >&2; exit 1; }
          test -f "$out/scripts/i18n/gate-policy.json" || { echo "gate materialization misses the policy; fail closed" >&2; exit 1; }
          test -f "$out/scripts/ci/gate-parity.mjs" || { echo "gate materialization misses gate-parity; fail closed" >&2; exit 1; }
          test -f "$out/scripts/ci/gate-invariants.json" || { echo "gate materialization misses gate-invariants; fail closed" >&2; exit 1; }
          # trusted base 早于 gate-surface.json（如 Epoch 2 root cb587e01）时不做硬性物化要求；
          # 引入清单之后的 base 必须完整物化（与 materialize-trusted-gate.sh 的 cat-file -e 模式一致）
          if git cat-file -e "$base:scripts/ci/gate-surface.json" >/dev/null 2>&1; then
            test -f "$out/scripts/ci/gate-surface.json" || { echo "gate materialization misses gate-surface; fail closed" >&2; exit 1; }
          fi
          if [ -f "$out/scripts/ci/resolve-trusted-base.mjs" ]; then
            helper="$(node "$out/scripts/ci/resolve-trusted-base.mjs" \
              --repo-root "$PWD" --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" \
              --before "${{ github.event.before }}" \
              --pr-base "${{ github.event.pull_request.base.sha }}" \
              --merge-group-base "${{ github.event.merge_group.base_sha }}" \
              --input-base "${{ inputs.trusted_base_sha }}" \
              --root-admission "${{ inputs.root_admission }}" \
              --root-candidate-sha "${{ inputs.root_candidate_sha }}" \
              --default-branch "${{ github.event.repository.default_branch }}" \
              --mode)"
            printf '%s' "$helper" > "$gate/helper.json"
            helper_mode="$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(j.mode)' "$gate/helper.json")"
            helper_base="$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(j.base)' "$gate/helper.json")"
            if [ "$helper_mode" != "$mode" ] || [ "$helper_base" != "$base" ]; then
              echo "trusted helper resolved $helper_mode/$helper_base but the bootstrap resolved $mode/$base; fail closed" >&2
              exit 1
            fi
          fi
          if [ -f "$out/scripts/ci/materialize-trusted-gate.sh" ]; then
            out2="$gate/out2"
            bash "$out/scripts/ci/materialize-trusted-gate.sh" \
              --repo-root "$PWD" --base "$base" \
              --output "$out2" --index "$gate/index2" --paths-file "$gate/paths2.txt" \
              --paths 'scripts/i18n scripts/hooks scripts/ci scripts/sync-shared-snippets.ps1 .github/workflows/quality-gate.yml .github/workflows/shared-snippets-check.yml .github/workflows/release.yml .github/workflows/nightly.yml .github/workflows/publish-plugins.yml package.json package-lock.json'
            if ! diff -r "$out" "$out2" >/dev/null 2>&1; then
              echo "materialized gate differs from the trusted helper output; fail closed" >&2
              exit 1
            fi
          fi
          # gate-surface.json 单一事实来源交叉检查：trusted manifest 驱动的物化必须与
          # bootstrap 硬编码 gate surface 完全一致（manifest 与硬编码列表漂移 → fail closed；
          # candidate manifest 只作为被检查对象，不能决定检查范围）
          if [ -f "$out/scripts/ci/gate-surface.json" ]; then
            manifest_paths="$(node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write((m.paths||[]).filter(p=>typeof p==="string").join(" "))' "$out/scripts/ci/gate-surface.json")"
            out3="$gate/out3"
            bash "$out/scripts/ci/materialize-trusted-gate.sh" \
              --repo-root "$PWD" --base "$base" \
              --output "$out3" --index "$gate/index3" --paths-file "$gate/paths3.txt" \
              --paths $manifest_paths
            if ! diff -r "$out" "$out3" >/dev/null 2>&1; then
              echo "gate-surface.json does not match the bootstrap gate surface; fail closed" >&2
              exit 1
            fi
          fi
          echo "GATE_MODE=$mode" >> "$GITHUB_ENV"
          echo "ROOT_SHA=$root" >> "$GITHUB_ENV"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "GATE_DIR=$out" >> "$GITHUB_ENV"
          echo "gate mode: $mode; trusted base: $base; root: $root"

      # 各独立检查尽量都执行：某一项失败不跳过其余项（continue-on-error 收集 outcome，
      # 最后一步统一传播）。不得因为 tests 失败就跳过 trusted / ref / worktree / static。
      - name: Run i18n tests (incl. JVM properties oracle differential)
        id: tests
        continue-on-error: true
        run: npm run test:i18n
        env:
          CI: 'true'

      - name: Trusted base contract validates the candidate
        id: trusted
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$GATE_MODE" = "ROOT_ADMISSION" ]; then
            echo "ROOT ADMISSION MODE: candidate ${{ github.sha }} == Epoch 2 root; running the root gate."
          fi
          node "$GATE_DIR/scripts/i18n/gate-contract.mjs" \
            --repo-root "$PWD" --report-root "$PWD" \
            --candidate-ref "${{ github.sha }}"

      - name: Run i18n check on the tested commit (ref snapshot)
        id: ref
        continue-on-error: true
        run: node scripts/i18n/check.mjs --snapshot ref --ref ${{ github.sha }}

      - name: Run i18n worktree check
        id: worktree
        continue-on-error: true
        run: npm run i18n:check

      - name: Generate static i18n resources (defense-in-depth diff)
        id: static-generate
        continue-on-error: true
        run: npm run i18n:generate-static

      - name: Verify generated resources are in sync
        id: static-diff
        continue-on-error: true
        run: git diff --exit-code -- pixivdownload-app/src/main/resources/static/i18n-static

      - name: Gate parity audit (no gate may be weakened)
        id: parity
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$GATE_MODE" = "ROOT_ADMISSION" ]; then
            node "$GATE_DIR/scripts/ci/gate-parity.mjs" --repo-root "$PWD" --report-root "$PWD" \
              --candidate-ref "${{ github.sha }}" --invariants
          else
            node "$GATE_DIR/scripts/ci/gate-parity.mjs" --repo-root "$PWD" --report-root "$PWD" \
              --trusted-dir "$GATE_DIR" --candidate-ref "${{ github.sha }}"
          fi

      - name: Upload i18n report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i18n-report
          path: |
            build/reports/i18n/
            pixivdownload-app/src/main/resources/static/i18n-static/
          if-no-files-found: ignore

      - name: Propagate result
        if: always()
        run: |
          failed=0
          check_outcome() {
            name="$1"
            value="$2"
            echo "- $name: $value" >> "$GITHUB_STEP_SUMMARY"
            if [ "$value" != "success" ]; then
              failed=1
            fi
          }
          check_outcome tests "${{ steps.tests.outcome }}"
          check_outcome trusted "${{ steps.trusted.outcome }}"
          check_outcome ref "${{ steps.ref.outcome }}"
          check_outcome worktree "${{ steps.worktree.outcome }}"
          check_outcome static-generate "${{ steps.static-generate.outcome }}"
          check_outcome static-diff "${{ steps.static-diff.outcome }}"
          check_outcome parity "${{ steps.parity.outcome }}"
          exit "$failed"
