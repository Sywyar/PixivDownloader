name: Quality Gate

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      trusted_base_sha:
        description: 'Protected predecessor commit (optional)'
        required: false
        type: string
      root_admission:
        description: 'Admit the dispatched commit as the Gate Epoch 4 root'
        required: false
        type: boolean
        default: false
      root_candidate_sha:
        description: 'Root commit; must equal the dispatched commit'
        required: false
        type: string
  workflow_call:
    inputs:
      trusted_base_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  java-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Compile external plugin test fixtures
        run: mvn -B -ntp -pl pixivdownload-official-plugins -am compile -Dexec.skip=true
      - name: Run Java tests
        run: mvn -B -ntp test -Dexec.skip=true -Duser.language=en -Duser.country=US

  javascript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm run test:js
      - name: Run web standards guard
        run: npm run test:web-standards

  signature-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve protected predecessor
        run: |
          node scripts/ci/resolve-trusted-base.mjs --repo-root . --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" --before "${{ github.event.before }}" --ref "$GITHUB_REF" --pr-head "${{ github.event.pull_request.head.sha }}" --pr-base "${{ github.event.pull_request.base.sha }}" --merge-group-base "${{ github.event.merge_group.base_sha }}" --input-base "${{ inputs.trusted_base_sha }}" --default-branch "${{ github.event.repository.default_branch }}" --root-admission "${{ inputs.root_admission }}" --root-candidate-sha "${{ inputs.root_candidate_sha }}" --mode > "$RUNNER_TEMP/gate-base.json"
          node -e 'const j=require(process.argv[1]); for (const [k,v] of Object.entries({GATE_MODE:j.mode,BASE_SHA:j.base,ROOT_SHA:j.root,CANDIDATE_SHA:process.env.GITHUB_SHA})) console.log(`${k}=${v}`)' "$RUNNER_TEMP/gate-base.json" >> "$GITHUB_ENV"
      - name: Materialize protected verifier
        run: |
          GATE_DIR="$RUNNER_TEMP/trusted-gate"
          mkdir -p "$GATE_DIR"
          while IFS= read -r rel; do
            mkdir -p "$GATE_DIR/$(dirname "$rel")"
            git show "$BASE_SHA:$rel" > "$GATE_DIR/$rel"
          done < <(node -e 'const p=require("./scripts/i18n/gate-policy.json"); console.log(p.minimumTrustedVerifier.requiredFiles.join("\n"))')
          echo "GATE_DIR=$GATE_DIR" >> "$GITHUB_ENV"
      - name: Run trusted signature guard
        run: |
          if [ "$GATE_MODE" = "ROOT_ADMISSION" ]; then
            node scripts/ci/gate-parity.mjs --repo-root . --candidate-ref "$CANDIDATE_SHA" --invariants --signature
          else
            node "$GATE_DIR/scripts/ci/gate-parity.mjs" --repo-root . --trusted-dir "$GATE_DIR" --trusted-ref "$BASE_SHA" --candidate-ref "$CANDIDATE_SHA" --signature
          fi

  trusted-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve protected predecessor
        run: |
          node scripts/ci/resolve-trusted-base.mjs --repo-root . --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" --before "${{ github.event.before }}" --ref "$GITHUB_REF" --pr-head "${{ github.event.pull_request.head.sha }}" --pr-base "${{ github.event.pull_request.base.sha }}" --merge-group-base "${{ github.event.merge_group.base_sha }}" --input-base "${{ inputs.trusted_base_sha }}" --default-branch "${{ github.event.repository.default_branch }}" --root-admission "${{ inputs.root_admission }}" --root-candidate-sha "${{ inputs.root_candidate_sha }}" --mode > "$RUNNER_TEMP/gate-base.json"
          node -e 'const j=require(process.argv[1]); for (const [k,v] of Object.entries({GATE_MODE:j.mode,BASE_SHA:j.base,ROOT_SHA:j.root,CANDIDATE_SHA:process.env.GITHUB_SHA})) console.log(`${k}=${v}`)' "$RUNNER_TEMP/gate-base.json" >> "$GITHUB_ENV"
      - name: Materialize protected verifier
        run: |
          GATE_DIR="$RUNNER_TEMP/trusted-gate"
          mkdir -p "$GATE_DIR"
          while IFS= read -r rel; do
            mkdir -p "$GATE_DIR/$(dirname "$rel")"
            git show "$BASE_SHA:$rel" > "$GATE_DIR/$rel"
          done < <(node -e 'const p=require("./scripts/i18n/gate-policy.json"); console.log(p.minimumTrustedVerifier.requiredFiles.join("\n"))')
          echo "GATE_DIR=$GATE_DIR" >> "$GITHUB_ENV"
      - name: Verify trusted release contract
        run: |
          if [ "$GATE_MODE" = "ROOT_ADMISSION" ]; then
            node scripts/ci/gate-parity.mjs --repo-root . --candidate-ref "$CANDIDATE_SHA" --invariants
          else
            node "$GATE_DIR/scripts/ci/gate-parity.mjs" --repo-root . --trusted-dir "$GATE_DIR" --trusted-ref "$BASE_SHA" --candidate-ref "$CANDIDATE_SHA"
          fi

  i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run i18n tests
        run: npm run test:i18n
      - name: Run i18n checks
        run: npm run i18n:check
      - name: Verify generated static resources
        run: npm run i18n:generate-static && git diff --exit-code -- pixivdownload-app/src/main/resources/static/i18n-static
