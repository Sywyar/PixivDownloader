name: Quality Gate

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  java-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile external plugin test fixtures
        run: mvn -B -ntp -pl pixivdownload-official-plugins -am compile -Dexec.skip=true

      - name: Run Java tests
        run: mvn -B -ntp test -Dexec.skip=true -Duser.language=en -Duser.country=US

  signature-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Reject reverse-engineered Douyin signature code
        run: bash scripts/hooks/pre-push-guard.sh

  javascript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Run web standards guard
        run: npm run test:web-standards

  i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run i18n checks
        id: i18n
        continue-on-error: true
        run: npm run test:i18n && npm run i18n:check

      - name: Generate static i18n resources
        id: i18n-static
        continue-on-error: true
        run: npm run i18n:generate-static

      - name: Verify generated resources are in sync
        if: steps.i18n-static.outcome == 'success'
        run: git diff --exit-code -- pixivdownload-app/src/main/resources/static/i18n-static

      - name: Upload i18n report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-report
          path: |
            build/reports/i18n/
            pixivdownload-app/src/main/resources/static/i18n-static/
          if-no-files-found: ignore

      - name: Propagate i18n result
        if: steps.i18n.outcome == 'failure' || steps.i18n-static.outcome == 'failure'
        run: exit 1
