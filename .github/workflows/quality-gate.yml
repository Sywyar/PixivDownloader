name: Quality Gate

on:
  workflow_dispatch:
    inputs:
      trusted_base_sha:
        description: Protected predecessor commit (optional)
        required: false
        type: string
  workflow_call:
    inputs:
      export_sdk_candidates:
        required: false
        type: boolean
        default: false
      export_release_candidates:
        required: false
        type: boolean
        default: false
      sdk_publication_mode:
        required: false
        type: string
        default: none
      trusted_base_sha:
        required: false
        type: string
    outputs:
      release_candidate_id:
        description: Release candidate artifact verified in this workflow run
        value: ${{ jobs.release-artifacts.outputs.candidate_id }}
      sdk_candidate_id:
        description: SDK candidate artifact verified in this workflow run
        value: ${{ jobs.sdk-tests.outputs.candidate_id }}

permissions:
  contents: read

jobs:
  java-tests:
    needs: [java-unit-tests, sdk-tests, release-artifacts, windows-runtime-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm Java verification completed
        run: echo "Java tests, SDK contract and release artifact verification succeeded."

  java-unit-tests:
    needs: [java-app-tests, java-library-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Application and library tests succeeded."

  java-app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          verify-signature: true
          java-version: '17'
          distribution: temurin
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-build-cache
      - name: Compile external plugin test fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn -B -ntp -T 2 -pl pixivdownload-official-plugins -am compile -Dexec.skip=true
      - name: Run Java tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn -B -ntp -T 2 -pl pixivdownload-app -am test -DforkCount=2 -Dexec.skip=true -Duser.language=en -Duser.country=US

  java-library-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          verify-signature: true
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-build-cache
      - name: Compile external plugin test fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn -B -ntp -T 2 -pl pixivdownload-official-plugins -am compile -Dexec.skip=true
      - name: Run library and plugin tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn -B -ntp -T 2 -pl '!pixivdownload-app' test -DforkCount=1 -Dexec.skip=true -Duser.language=en -Duser.country=US

  sdk-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SDK_PUBLICATION_MODE: ${{ github.event_name == 'pull_request' && 'latest' || inputs.sdk_publication_mode || 'none' }}
    outputs:
      candidate_id: ${{ steps.sdk-candidate.outputs.artifact-id }}
      verification_id: ${{ steps.sdk-verification.outputs.artifact-id }}
      verification_sha256: ${{ steps.sdk-archive.outputs.sha256 }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          verify-signature: true
          java-version: '17'
          distribution: temurin
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-build-cache
      - name: Resolve SDK contract predecessor
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          INPUT_TRUSTED_BASE_SHA: ${{ inputs.trusted_base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$SDK_PUBLICATION_MODE" in
            none|current|latest) ;;
            *) echo "Unsupported SDK publication mode: $SDK_PUBLICATION_MODE" >&2; exit 1 ;;
          esac
          node scripts/ci/resolve-trusted-base.mjs --repo-root . --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" --before "$EVENT_BEFORE" --ref "$GITHUB_REF" --pr-head "$EVENT_PR_HEAD_SHA" --pr-base "$EVENT_PR_BASE_SHA" --merge-group-base "$EVENT_MERGE_GROUP_BASE_SHA" --input-base "$INPUT_TRUSTED_BASE_SHA" --default-branch "$DEFAULT_BRANCH" --mode > "$RUNNER_TEMP/sdk-gate-base.json"
          node -e 'const j=require(process.argv[1]); console.log(`SDK_BASE_SHA=${j.base}`)' "$RUNNER_TEMP/sdk-gate-base.json" >> "$GITHUB_ENV"
      - name: Verify official plugin version changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File scripts/ci/verify-plugin-versions.ps1 -BaseRef "$SDK_BASE_SHA"
      - name: Resolve published SDK baseline
        if: env.SDK_PUBLICATION_MODE == 'current' || env.SDK_PUBLICATION_MODE == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_source="$(node scripts/ci/sdk-published-base.mjs "$SDK_PUBLICATION_MODE" .)"
          echo "SDK_BASE_SHA=$published_source" >> "$GITHUB_ENV"
      - name: Build and freeze SDK verification inputs
        uses: ./.github/actions/build-sdk
        with:
          source_sha: ${{ github.sha }}
      - name: Compare SDK public contract
        run: |
          BASE_DIR="$RUNNER_TEMP/sdk-base-source"
          mkdir -p "$BASE_DIR"
          git archive "$SDK_BASE_SHA" | tar -x -C "$BASE_DIR"
          SDK_BASE_MODULES="$(node scripts/ci/sdk-version.mjs --repo-root "$BASE_DIR" --modules)"
          mvn -B -ntp -f "$BASE_DIR/pom.xml" -pl "$SDK_BASE_MODULES" -am package -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dexec.skip=true
          node scripts/ci/sdk-api-surface.mjs --module "sdk-info=$BASE_DIR/pixivdownload-sdk-info/target" --module "plugin-api=$BASE_DIR/pixivdownload-plugin-api/target" --module "core-api=$BASE_DIR/pixivdownload-core-api/target" --output "$RUNNER_TEMP/sdk-base-surface.txt"
          node scripts/ci/sdk-api-surface.mjs --module sdk-info=pixivdownload-sdk-info/target --module plugin-api=pixivdownload-plugin-api/target --module core-api=pixivdownload-core-api/target --output "$RUNNER_TEMP/sdk-candidate-surface.txt"
          node scripts/ci/sdk-contract.mjs --repo-root . --base-ref "$SDK_BASE_SHA" --candidate-ref "$GITHUB_SHA" --base-surface "$RUNNER_TEMP/sdk-base-surface.txt" --candidate-surface "$RUNNER_TEMP/sdk-candidate-surface.txt" --base-sdk-root "$BASE_DIR" --candidate-sdk-root . --report "$RUNNER_TEMP/sdk-contract-report.json" --require-release-identity "$SDK_RELEASE_IDENTITY_REQUIRED"
          cat "$RUNNER_TEMP/sdk-contract-report.json"
        env:
          SDK_RELEASE_IDENTITY_REQUIRED: ${{ env.SDK_PUBLICATION_MODE == 'current' || env.SDK_PUBLICATION_MODE == 'latest' }}
          GH_TOKEN: ${{ github.token }}

      - name: Archive frozen SDK verification inputs
        id: sdk-archive
        run: |
          set -euo pipefail
          tar -cf target/sdk-verification.tar target/sdk-publication-inputs target/sdk-release \
            build/sdk-development-runtime/ci-repository.yaml target/sbt-launch.jar \
            pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-*.jar
          echo "sha256=$(sha256sum target/sdk-verification.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload frozen SDK verification inputs
        id: sdk-verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: target/sdk-verification.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload verified SDK candidate
        id: sdk-candidate
        if: inputs.export_sdk_candidates == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: target/sdk-publication-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sdk-tests:
    needs: [sdk-build, sdk-consumers, sdk-services, sdk-pages, page-bfcache]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_id: ${{ needs.sdk-build.outputs.candidate_id }}
    steps:
      - run: echo "SDK build, public contract and all isolated acceptance jobs succeeded."

  sdk-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: sdk-build
    strategy:
      fail-fast: false
      matrix:
        scope: [templates, build-tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          verify-signature: true
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/setup-build-cache
      - uses: ./.github/actions/restore-sdk-verification
        with:
          artifact_id: ${{ needs.sdk-build.outputs.verification_id }}
          sha256: ${{ needs.sdk-build.outputs.verification_sha256 }}
      - uses: ./.github/actions/verify-sdk-consumers
        with:
          scope: ${{ matrix.scope }}

  sdk-services:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: sdk-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          verify-signature: true
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/setup-build-cache
      - uses: ./.github/actions/restore-sdk-verification
        with:
          artifact_id: ${{ needs.sdk-build.outputs.verification_id }}
          sha256: ${{ needs.sdk-build.outputs.verification_sha256 }}
      - name: Prepare pinned browser and original published plugin fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --no-install playwright install --with-deps chromium
          node scripts/ci/sdk-legacy-plugin.mjs target/sdk-legacy-original.jar
      - name: Build independent typed service fixture from the original SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sdk_version="$(node scripts/ci/sdk-version.mjs --repo-root . --json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')"
          node scripts/ci/sdk-consumer.mjs --typed-service-only --repo-root . \
            --sdk-zip "target/sdk-release/PixivDownloader-Plugin-SDK-$sdk_version.zip" \
            --sdk-repository target/sdk-staging --work-dir target/sdk-service-consumer
      - name: Verify independent service bindings and generated HTTP with a frozen host
        env:
          SDK_OLD_PLUGIN_JAR: target/sdk-legacy-original.jar
        run: |
          set -euo pipefail
          sqlite=(target/sdk-runtime-inputs/plugins/pixivdownload-plugin-database-sqlite-*.jar)
          workbench=(target/sdk-runtime-inputs/plugins/pixivdownload-plugin-download-workbench-*.jar)
          [ "${#sqlite[@]}" -eq 1 ] && [ "${#workbench[@]}" -eq 1 ]
          node scripts/ci/sdk-typed-services.mjs target/sdk-runtime-inputs/host.jar target/sdk-tools.jar target/sdk-staging \
            target/sdk-service-consumer/project/examples/typed-service-plugin "${sqlite[0]}" "${workbench[0]}" \
            target/sdk-typed-services

  sdk-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: sdk-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          verify-signature: true
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/restore-sdk-verification
        with:
          artifact_id: ${{ needs.sdk-build.outputs.verification_id }}
          sha256: ${{ needs.sdk-build.outputs.verification_sha256 }}
      - name: Prepare pinned browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify page editor and ordinary plugin slots with a frozen host
        run: node scripts/ci/page-editor-acceptance.mjs target/sdk-page-editor-acceptance --frozen-inputs target/sdk-runtime-inputs

  page-bfcache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: node scripts/ci/page-bfcache-acceptance.mjs

  release-artifacts:
    outputs:
      candidate_id: ${{ steps.release-candidate.outputs.artifact-id }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          verify-signature: true
          java-version: '17'
          distribution: temurin
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-build-cache
      - name: Build release artifacts with ProGuard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn -B -ntp -T 2 install -Pofficial-surveys -DskipTests '-Dmaven.javadoc.skip=true' '-Dmaven.source.skip=true'
      - name: Run Windows Compose tests using the compiled plugin
        working-directory: pixivdownload-plugin-gui-compose
        shell: pwsh
        run: |
          ./gradlew.bat --daemon mavenTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reports = @(Get-ChildItem build/test-results/test/TEST-*.xml -File)
          if ($reports.Count -eq 0) { throw "Compose test reports are missing." }
          $count = 0
          foreach ($report in $reports) {
            [xml]$xml = Get-Content -LiteralPath $report.FullName -Raw
            $suite = $xml.testsuite
            if ([int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0 -or [int]$suite.skipped -ne 0) {
              throw "Compose tests failed or were skipped: $($report.Name)"
            }
            $count += [int]$suite.tests
          }
          if ($count -eq 0) { throw "No Compose tests ran." }
      - name: Verify compiled plugin SDK requirements
        shell: pwsh
        run: ./scripts/ci/verify-plugin-sdk.ps1
      - name: Verify packaged release boundaries
        uses: ./.github/actions/verify-release-boundaries
        with:
          additional_tests: StagedFileDeletionTest#rejectsWindowsJunctionBeforeStaging,WorkDeletionFileRollbackTest#novelJunctionAbortsFilesAndSoftDelete,DeleteStagingManifestTest#rejectsWindowsJunctionParentDuringRecovery,PluginReleaseScriptsTest#releaseArtifactCleanupHandlesSealedPermissions+releaseArtifactFailurePrintsDiagnosticTail

      - name: Stage unsigned release candidates
        if: inputs.export_release_candidates == true
        shell: pwsh
        run: ./scripts/ci/release-build-candidates.ps1 -Mode Export -Directory build/release-candidates
      - name: Upload verified release candidates
        id: release-candidate
        if: inputs.export_release_candidates == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidates-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release-candidates/
          if-no-files-found: error
          retention-days: 1

  windows-runtime-tests:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          verify-signature: true
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-build-cache
      - name: Verify Gradle classpath cache invalidation
        shell: pwsh
        run: ./scripts/ci/test/gradle-classpath.test.ps1
      - name: Parse PowerShell scripts with Windows PowerShell
        shell: powershell
        run: ./scripts/ci/check-powershell.ps1
      - name: Test release runtime acceptance guards
        shell: pwsh
        run: |
          ./scripts/release-e2e/runtime.test.ps1
          ./scripts/ci/test/workflow-orchestration.test.ps1

  javascript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm run test:js
      - name: Run web standards guard
        run: npm run test:web-standards

  signature-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve protected predecessor
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          INPUT_TRUSTED_BASE_SHA: ${{ inputs.trusted_base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/ci/resolve-trusted-base.mjs --repo-root . --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" --before "$EVENT_BEFORE" --ref "$GITHUB_REF" --pr-head "$EVENT_PR_HEAD_SHA" --pr-base "$EVENT_PR_BASE_SHA" --merge-group-base "$EVENT_MERGE_GROUP_BASE_SHA" --input-base "$INPUT_TRUSTED_BASE_SHA" --default-branch "$DEFAULT_BRANCH" --mode > "$RUNNER_TEMP/gate-base.json"
          node -e 'const j=require(process.argv[1]); for (const [k,v] of Object.entries({GATE_MODE:j.mode,BASE_SHA:j.base,ROOT_SHA:j.root,CANDIDATE_SHA:process.env.GITHUB_SHA})) console.log(`${k}=${v}`)' "$RUNNER_TEMP/gate-base.json" >> "$GITHUB_ENV"
      - name: Materialize protected verifier
        run: |
          GATE_DIR="$RUNNER_TEMP/trusted-gate"
          git merge-base --is-ancestor "$BASE_SHA" refs/remotes/origin/master
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          test "$BASE_SHA" != "$CANDIDATE_SHA"
          if git cat-file -e "$BASE_SHA:scripts/ci/gate-upgrade.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/gate-upgrade.mjs" > "$RUNNER_TEMP/gate-upgrade.mjs"
            node "$RUNNER_TEMP/gate-upgrade.mjs" --repo-root "$GITHUB_WORKSPACE" --trusted-ref "$BASE_SHA" --candidate-ref "$CANDIDATE_SHA" --directory "$GATE_DIR"
            GATE_EPOCH=$(node -e 'console.log(require(process.argv[1]).gateEpoch)' "$GATE_DIR/scripts/ci/release-gate-policy.json")
          else
            mkdir -p "$GATE_DIR"
            git show "$BASE_SHA:scripts/ci/release-gate-policy.json" > "$RUNNER_TEMP/gate-policy.json"
            GATE_EPOCH=$(node -e 'console.log(require(process.argv[1]).gateEpoch)' "$RUNNER_TEMP/gate-policy.json")
            node -e 'const p=require(process.argv[1]); console.log(p.protectedCore.join("\n"))' "$RUNNER_TEMP/gate-policy.json" > "$RUNNER_TEMP/gate-files.txt"
            while IFS= read -r rel; do
              mkdir -p "$GATE_DIR/$(dirname "$rel")"
              git show "$BASE_SHA:$rel" > "$GATE_DIR/$rel"
            done < "$RUNNER_TEMP/gate-files.txt"
            if [ "$GATE_EPOCH" = "5" ] && [ "$(git show "$CANDIDATE_SHA:scripts/ci/release-gate-policy.json" | node -e 'let s=""; process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).gateEpoch))')" = "8" ]; then
              for rel in release-gate-trust.mjs release-gate-verifier.mjs resolve-trusted-base.mjs; do
                git show "$BASE_SHA:scripts/ci/gate-admission/$rel" > "$GATE_DIR/scripts/ci/$rel"
              done
              GATE_EPOCH=8
            fi
            for rel in package.json package-lock.json; do
              git show "$BASE_SHA:$rel" > "$GATE_DIR/$rel"
            done
          fi
          echo "GATE_EPOCH=$GATE_EPOCH" >> "$GITHUB_ENV"
          echo "GATE_DIR=$GATE_DIR" >> "$GITHUB_ENV"
      - name: Run trusted signature guard
        run: |
          node "$GATE_DIR/scripts/ci/release-gate-verifier.mjs" --repo-root . --trusted-ref "$BASE_SHA" --candidate-ref "$CANDIDATE_SHA" --signature

  trusted-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record tested execution
        env:
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_REPOSITORY_ID: ${{ github.repository_id }}
          GATE_MERGE: ${{ github.sha }}
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha }}
          GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GATE_PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module -e '
            const e = process.env;
            console.log("GATE_EXECUTION " + JSON.stringify({schemaVersion: 1,
              repository: e.GATE_REPOSITORY, repositoryId: e.GATE_REPOSITORY_ID,
              event: e.GITHUB_EVENT_NAME, merge: e.GATE_MERGE, base: e.GATE_BASE,
              head: e.GATE_HEAD, baseRef: e.GATE_BASE_REF, pullRequest: e.GATE_PR,
              runId: e.GITHUB_RUN_ID, attempt: e.GITHUB_RUN_ATTEMPT}));'
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Resolve protected predecessor
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          INPUT_TRUSTED_BASE_SHA: ${{ inputs.trusted_base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/ci/resolve-trusted-base.mjs --repo-root . --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" --before "$EVENT_BEFORE" --ref "$GITHUB_REF" --pr-head "$EVENT_PR_HEAD_SHA" --pr-base "$EVENT_PR_BASE_SHA" --merge-group-base "$EVENT_MERGE_GROUP_BASE_SHA" --input-base "$INPUT_TRUSTED_BASE_SHA" --default-branch "$DEFAULT_BRANCH" --mode > "$RUNNER_TEMP/gate-base.json"
          node -e 'const j=require(process.argv[1]); for (const [k,v] of Object.entries({GATE_MODE:j.mode,BASE_SHA:j.base,ROOT_SHA:j.root,CANDIDATE_SHA:process.env.GITHUB_SHA})) console.log(`${k}=${v}`)' "$RUNNER_TEMP/gate-base.json" >> "$GITHUB_ENV"
      - name: Materialize protected verifier
        run: |
          GATE_DIR="$RUNNER_TEMP/trusted-gate"
          git merge-base --is-ancestor "$BASE_SHA" refs/remotes/origin/master
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          test "$BASE_SHA" != "$CANDIDATE_SHA"
          if git cat-file -e "$BASE_SHA:scripts/ci/gate-upgrade.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/gate-upgrade.mjs" > "$RUNNER_TEMP/gate-upgrade.mjs"
            node "$RUNNER_TEMP/gate-upgrade.mjs" --repo-root "$GITHUB_WORKSPACE" --trusted-ref "$BASE_SHA" --candidate-ref "$CANDIDATE_SHA" --directory "$GATE_DIR"
            GATE_EPOCH=$(node -e 'console.log(require(process.argv[1]).gateEpoch)' "$GATE_DIR/scripts/ci/release-gate-policy.json")
          else
            mkdir -p "$GATE_DIR"
            git show "$BASE_SHA:scripts/ci/release-gate-policy.json" > "$RUNNER_TEMP/gate-policy.json"
            GATE_EPOCH=$(node -e 'console.log(require(process.argv[1]).gateEpoch)' "$RUNNER_TEMP/gate-policy.json")
            node -e 'const p=require(process.argv[1]); console.log(p.protectedCore.join("\n"))' "$RUNNER_TEMP/gate-policy.json" > "$RUNNER_TEMP/gate-files.txt"
            while IFS= read -r rel; do
              mkdir -p "$GATE_DIR/$(dirname "$rel")"
              git show "$BASE_SHA:$rel" > "$GATE_DIR/$rel"
            done < "$RUNNER_TEMP/gate-files.txt"
            if [ "$GATE_EPOCH" = "5" ] && [ "$(git show "$CANDIDATE_SHA:scripts/ci/release-gate-policy.json" | node -e 'let s=""; process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).gateEpoch))')" = "8" ]; then
              for rel in release-gate-trust.mjs release-gate-verifier.mjs resolve-trusted-base.mjs; do
                git show "$BASE_SHA:scripts/ci/gate-admission/$rel" > "$GATE_DIR/scripts/ci/$rel"
              done
              GATE_EPOCH=8
            fi
            for rel in package.json package-lock.json; do
              git show "$BASE_SHA:$rel" > "$GATE_DIR/$rel"
            done
          fi
          echo "GATE_EPOCH=$GATE_EPOCH" >> "$GITHUB_ENV"
          echo "GATE_DIR=$GATE_DIR" >> "$GITHUB_ENV"
      - name: Install protected parser
        run: |
          (cd "$GATE_DIR" && npm ci --ignore-scripts --no-audit --no-fund)
          echo "TRUSTED_GATE_PACKAGE_JSON=$GATE_DIR/package.json" >> "$GITHUB_ENV"
      - name: Verify trusted release contract
        run: |
          node "$GATE_DIR/scripts/ci/release-gate-verifier.mjs" --repo-root . --trusted-ref "$BASE_SHA" --candidate-ref "$CANDIDATE_SHA"

  i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run i18n tests
        run: npm run test:i18n
      - name: Run i18n checks
        run: npm run i18n:check
      - name: Verify generated static resources
        run: npm run i18n:generate-static && git diff --exit-code --
          pixivdownload-app/src/main/resources/static/i18n-static

  check-shared-snippets:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Git UTF-8 filenames
        run: git config --global core.quotepath false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Parse PowerShell scripts with PowerShell Core
        shell: pwsh
        run: ./scripts/ci/check-powershell.ps1

      - name: Verify .user.js shared snippets are in sync
        shell: pwsh
        run: ./scripts/sync-shared-snippets.ps1 -Check
