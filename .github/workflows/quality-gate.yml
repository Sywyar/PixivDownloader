name: Quality Gate

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      trusted_base_sha:
        description: 'Explicit trusted base commit for this dispatch (optional; falls back to the protected default branch remote ref)'
        required: false
        type: string
  workflow_call:
    inputs:
      trusted_base_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  java-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile external plugin test fixtures
        run: mvn -B -ntp -pl pixivdownload-official-plugins -am compile -Dexec.skip=true

      - name: Run Java tests
        run: mvn -B -ntp test -Dexec.skip=true -Duser.language=en -Duser.country=US

  signature-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # bootstrap shell：解析 trusted base 并物化可信 gate bundle。
      # 解析逻辑只使用 GitHub 提供的 event 数据（镜像 scripts/ci/resolve-trusted-base.mjs）；
      # 物化逻辑与 scripts/ci/materialize-trusted-gate.sh 完全一致；
      # trusted base 中已有 helper 时再交叉验证，helper 来自 trusted base，候选不能自我批准。
      - name: Determine trusted base and materialize the trusted gate
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          base=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              ;;
            merge_group)
              base="${{ github.event.merge_group.base_sha }}"
              ;;
            push)
              before="${{ github.event.before }}"
              if [ -n "$before" ] && [ "$before" != "$zero" ] \
                  && git rev-parse --verify --quiet "$before^{commit}" >/dev/null 2>&1; then
                base="$before"
              else
                default_branch="${{ github.event.repository.default_branch }}"
                git fetch -q origin "refs/heads/$default_branch" 2>/dev/null || true
                base="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" 2>/dev/null || true)"
              fi
              ;;
            workflow_dispatch)
              base="${{ github.event.inputs.trusted_base_sha }}"
              if [ -z "$base" ]; then
                default_branch="${{ github.event.repository.default_branch }}"
                git fetch -q origin "refs/heads/$default_branch" 2>/dev/null || true
                base="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" 2>/dev/null || true)"
              fi
              ;;
            workflow_call)
              base="${{ inputs.trusted_base_sha }}"
              ;;
          esac
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "cannot determine a valid trusted base for $GITHUB_SHA (event $GITHUB_EVENT_NAME); fail closed" >&2
            exit 1
          fi
          if [ "$base" = "$GITHUB_SHA" ]; then
            echo "trusted base $base equals the candidate $GITHUB_SHA; fail closed" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
            echo "trusted base $base is not present in the local object database; fail closed" >&2
            exit 1
          fi
          # 物化 trusted gate bundle（checkout-index --stdin 必须显式提供 < paths-file）
          gate="$RUNNER_TEMP/gate"
          paths_file="$gate/paths.txt"
          index_file="$gate/index"
          out="$gate/out"
          mkdir -p "$gate" "$out"
          rm -f "$paths_file" "$index_file"
          git ls-tree -r --name-only "$base" -- \
            scripts/i18n \
            scripts/hooks \
            scripts/ci \
            .github/workflows/quality-gate.yml \
            package.json \
            > "$paths_file"
          test -s "$paths_file" || { echo "trusted base $base has no gate paths; fail closed" >&2; exit 1; }
          GIT_INDEX_FILE="$index_file" git read-tree "$base"
          GIT_INDEX_FILE="$index_file" git -c core.autocrlf=false checkout-index \
            --stdin \
            --prefix="$out/" \
            < "$paths_file"
          test -f "$out/scripts/i18n/check.mjs" || { echo "gate materialization is empty; fail closed" >&2; exit 1; }
          test -f "$out/scripts/hooks/pre-push-guard.sh" || { echo "gate materialization misses the guard; fail closed" >&2; exit 1; }
          # 与 trusted helper 交叉验证（helper 来自 trusted base；过渡完成后 helper 成为 required path）
          if [ -f "$out/scripts/ci/resolve-trusted-base.mjs" ]; then
            helper_base="$(node "$out/scripts/ci/resolve-trusted-base.mjs" \
              --repo-root "$PWD" --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" \
              --before "${{ github.event.before }}" \
              --pr-base "${{ github.event.pull_request.base.sha }}" \
              --merge-group-base "${{ github.event.merge_group.base_sha }}" \
              --input-base "${{ github.event.inputs.trusted_base_sha }}" \
              --default-branch "${{ github.event.repository.default_branch }}")"
            if [ "$helper_base" != "$base" ]; then
              echo "trusted base helper resolved $helper_base but the bootstrap resolved $base; fail closed" >&2
              exit 1
            fi
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "GATE_DIR=$out" >> "$GITHUB_ENV"
          echo "trusted base: $base"

      # 签名守卫必须来自 trusted base：候选提交不能用自己的 guard 自我批准
      - name: Reject reverse-engineered Douyin signature code (trusted guard)
        run: |
          set -euo pipefail
          bash "$GATE_DIR/scripts/hooks/pre-push-guard.sh" --repo-root "$PWD" --ref "${{ github.sha }}"

  javascript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Run web standards guard
        run: npm run test:web-standards

  # 升级链：trusted base 的 gate 审核候选（github.sha）。
  # 仓库内 workflow 不能被描述为绝对不可修改；真正的最终门禁必须由 GitHub Ruleset /
  # 分支保护 / required check 提供，且可信检查器不能由同一个候选提交自行批准。
  trusted-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (yaml parser for the workflow contract)
        run: npm ci

      - name: Determine trusted base and materialize the trusted gate
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          base=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              ;;
            merge_group)
              base="${{ github.event.merge_group.base_sha }}"
              ;;
            push)
              before="${{ github.event.before }}"
              if [ -n "$before" ] && [ "$before" != "$zero" ] \
                  && git rev-parse --verify --quiet "$before^{commit}" >/dev/null 2>&1; then
                base="$before"
              else
                default_branch="${{ github.event.repository.default_branch }}"
                git fetch -q origin "refs/heads/$default_branch" 2>/dev/null || true
                base="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" 2>/dev/null || true)"
              fi
              ;;
            workflow_dispatch)
              base="${{ github.event.inputs.trusted_base_sha }}"
              if [ -z "$base" ]; then
                default_branch="${{ github.event.repository.default_branch }}"
                git fetch -q origin "refs/heads/$default_branch" 2>/dev/null || true
                base="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" 2>/dev/null || true)"
              fi
              ;;
            workflow_call)
              base="${{ inputs.trusted_base_sha }}"
              ;;
          esac
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "cannot determine a valid trusted base for $GITHUB_SHA (event $GITHUB_EVENT_NAME); fail closed" >&2
            exit 1
          fi
          if [ "$base" = "$GITHUB_SHA" ]; then
            echo "trusted base $base equals the candidate $GITHUB_SHA; fail closed" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
            echo "trusted base $base is not present in the local object database; fail closed" >&2
            exit 1
          fi
          gate="$RUNNER_TEMP/gate"
          paths_file="$gate/paths.txt"
          index_file="$gate/index"
          out="$gate/out"
          mkdir -p "$gate" "$out"
          rm -f "$paths_file" "$index_file"
          git ls-tree -r --name-only "$base" -- \
            scripts/i18n \
            scripts/hooks \
            scripts/ci \
            .github/workflows/quality-gate.yml \
            package.json \
            > "$paths_file"
          test -s "$paths_file" || { echo "trusted base $base has no gate paths; fail closed" >&2; exit 1; }
          GIT_INDEX_FILE="$index_file" git read-tree "$base"
          GIT_INDEX_FILE="$index_file" git -c core.autocrlf=false checkout-index \
            --stdin \
            --prefix="$out/" \
            < "$paths_file"
          test -f "$out/scripts/i18n/check.mjs" || { echo "gate materialization is empty; fail closed" >&2; exit 1; }
          test -f "$out/scripts/hooks/pre-push-guard.sh" || { echo "gate materialization misses the guard; fail closed" >&2; exit 1; }
          if [ -f "$out/scripts/ci/resolve-trusted-base.mjs" ]; then
            helper_base="$(node "$out/scripts/ci/resolve-trusted-base.mjs" \
              --repo-root "$PWD" --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" \
              --before "${{ github.event.before }}" \
              --pr-base "${{ github.event.pull_request.base.sha }}" \
              --merge-group-base "${{ github.event.merge_group.base_sha }}" \
              --input-base "${{ github.event.inputs.trusted_base_sha }}" \
              --default-branch "${{ github.event.repository.default_branch }}")"
            if [ "$helper_base" != "$base" ]; then
              echo "trusted base helper resolved $helper_base but the bootstrap resolved $base; fail closed" >&2
              exit 1
            fi
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "GATE_DIR=$out" >> "$GITHUB_ENV"
          echo "trusted base: $base"

      - name: Trusted base contract validates the candidate
        run: |
          set -euo pipefail
          test -f "$GATE_DIR/scripts/i18n/gate-contract.mjs" || {
            echo "trusted base $BASE_SHA lacks the gate contract; fail closed (legacy bootstrap paths are retired)" >&2
            exit 1
          }
          test -f "$GATE_DIR/scripts/i18n/gate-policy.json" || {
            echo "trusted base $BASE_SHA lacks the gate policy; fail closed (legacy bootstrap paths are retired)" >&2
            exit 1
          }
          node "$GATE_DIR/scripts/i18n/gate-contract.mjs" \
            --repo-root "$PWD" --report-root "$PWD" \
            --candidate-ref "${{ github.sha }}"
          echo "trusted base checker checks the candidate ref..."
          node "$GATE_DIR/scripts/i18n/check.mjs" --repo-root "$PWD" --report-root "$PWD" \
            --snapshot ref --ref "${{ github.sha }}"

      - name: Upload gate contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-contract-report
          path: build/reports/i18n/
          if-no-files-found: ignore

      # 仓库管理员最终门禁提示：仅靠仓库内 workflow 不能建立绝对不可变的信任根。
      - name: Manual gate notes for repository admins
        if: always()
        run: |
          set -euo pipefail
          echo "REMINDER for repository admins:"
          echo "  - Do NOT allow bypassing branch protection."
          echo "  - Configure Quality Gate jobs (java-tests, javascript-tests, signature-guard,"
          echo "    trusted-gate-contract, i18n-check) as required checks."
          echo "  - Gate / workflow files (.github/workflows/quality-gate.yml, scripts/i18n/**,"
          echo "    scripts/hooks/**, scripts/ci/**, package.json) must go through protected review."
          echo "  - A stronger setup is an external workflow / separate repository checker that"
          echo "    the candidate commit cannot modify."
          echo "  - A repository-internal workflow cannot establish an absolutely immutable trust root."

  i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # 物化非 tip commit 的 tree 需要完整对象库，浅克隆会碰巧可用但不可依赖
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (yaml parser for the workflow contract)
        run: npm ci

      - name: Set up JDK 17 (properties oracle differential tests)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Determine trusted base and materialize the trusted gate
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          base=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              ;;
            merge_group)
              base="${{ github.event.merge_group.base_sha }}"
              ;;
            push)
              before="${{ github.event.before }}"
              if [ -n "$before" ] && [ "$before" != "$zero" ] \
                  && git rev-parse --verify --quiet "$before^{commit}" >/dev/null 2>&1; then
                base="$before"
              else
                default_branch="${{ github.event.repository.default_branch }}"
                git fetch -q origin "refs/heads/$default_branch" 2>/dev/null || true
                base="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" 2>/dev/null || true)"
              fi
              ;;
            workflow_dispatch)
              base="${{ github.event.inputs.trusted_base_sha }}"
              if [ -z "$base" ]; then
                default_branch="${{ github.event.repository.default_branch }}"
                git fetch -q origin "refs/heads/$default_branch" 2>/dev/null || true
                base="$(git rev-parse --verify --quiet "refs/remotes/origin/$default_branch" 2>/dev/null || true)"
              fi
              ;;
            workflow_call)
              base="${{ inputs.trusted_base_sha }}"
              ;;
          esac
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "cannot determine a valid trusted base for $GITHUB_SHA (event $GITHUB_EVENT_NAME); fail closed" >&2
            exit 1
          fi
          if [ "$base" = "$GITHUB_SHA" ]; then
            echo "trusted base $base equals the candidate $GITHUB_SHA; fail closed" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
            echo "trusted base $base is not present in the local object database; fail closed" >&2
            exit 1
          fi
          gate="$RUNNER_TEMP/gate"
          paths_file="$gate/paths.txt"
          index_file="$gate/index"
          out="$gate/out"
          mkdir -p "$gate" "$out"
          rm -f "$paths_file" "$index_file"
          git ls-tree -r --name-only "$base" -- \
            scripts/i18n \
            scripts/hooks \
            scripts/ci \
            .github/workflows/quality-gate.yml \
            package.json \
            > "$paths_file"
          test -s "$paths_file" || { echo "trusted base $base has no gate paths; fail closed" >&2; exit 1; }
          GIT_INDEX_FILE="$index_file" git read-tree "$base"
          GIT_INDEX_FILE="$index_file" git -c core.autocrlf=false checkout-index \
            --stdin \
            --prefix="$out/" \
            < "$paths_file"
          test -f "$out/scripts/i18n/check.mjs" || { echo "gate materialization is empty; fail closed" >&2; exit 1; }
          test -f "$out/scripts/hooks/pre-push-guard.sh" || { echo "gate materialization misses the guard; fail closed" >&2; exit 1; }
          if [ -f "$out/scripts/ci/resolve-trusted-base.mjs" ]; then
            helper_base="$(node "$out/scripts/ci/resolve-trusted-base.mjs" \
              --repo-root "$PWD" --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" \
              --before "${{ github.event.before }}" \
              --pr-base "${{ github.event.pull_request.base.sha }}" \
              --merge-group-base "${{ github.event.merge_group.base_sha }}" \
              --input-base "${{ github.event.inputs.trusted_base_sha }}" \
              --default-branch "${{ github.event.repository.default_branch }}")"
            if [ "$helper_base" != "$base" ]; then
              echo "trusted base helper resolved $helper_base but the bootstrap resolved $base; fail closed" >&2
              exit 1
            fi
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "GATE_DIR=$out" >> "$GITHUB_ENV"
          echo "trusted base: $base"

      # 各独立检查尽量都执行：某一项失败不跳过其余项（continue-on-error 收集 outcome，
      # 最后一步统一传播）。不得因为 tests 失败就跳过 trusted / ref / worktree / static。
      - name: Run i18n tests (incl. JVM properties oracle differential)
        id: tests
        continue-on-error: true
        run: npm run test:i18n
        env:
          CI: 'true'

      - name: Trusted base contract validates the candidate
        id: trusted
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f "$GATE_DIR/scripts/i18n/gate-contract.mjs" || {
            echo "trusted base $BASE_SHA lacks the gate contract; fail closed (legacy bootstrap paths are retired)" >&2
            exit 1
          }
          test -f "$GATE_DIR/scripts/i18n/gate-policy.json" || {
            echo "trusted base $BASE_SHA lacks the gate policy; fail closed (legacy bootstrap paths are retired)" >&2
            exit 1
          }
          node "$GATE_DIR/scripts/i18n/gate-contract.mjs" \
            --repo-root "$PWD" --report-root "$PWD" \
            --candidate-ref "${{ github.sha }}"

      - name: Run i18n check on the tested commit (ref snapshot)
        id: ref
        continue-on-error: true
        run: node scripts/i18n/check.mjs --snapshot ref --ref ${{ github.sha }}

      - name: Run i18n worktree check
        id: worktree
        continue-on-error: true
        run: npm run i18n:check

      - name: Generate static i18n resources (defense-in-depth diff)
        id: static-generate
        continue-on-error: true
        run: npm run i18n:generate-static

      - name: Verify generated resources are in sync
        id: static-diff
        continue-on-error: true
        run: git diff --exit-code -- pixivdownload-app/src/main/resources/static/i18n-static

      - name: Upload i18n report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i18n-report
          path: |
            build/reports/i18n/
            pixivdownload-app/src/main/resources/static/i18n-static/
          if-no-files-found: ignore

      - name: Propagate result
        if: always()
        run: |
          failed=0
          check_outcome() {
            name="$1"
            value="$2"
            echo "- $name: $value" >> "$GITHUB_STEP_SUMMARY"
            if [ "$value" != "success" ]; then
              failed=1
            fi
          }
          check_outcome tests "${{ steps.tests.outcome }}"
          check_outcome trusted "${{ steps.trusted.outcome }}"
          check_outcome ref "${{ steps.ref.outcome }}"
          check_outcome worktree "${{ steps.worktree.outcome }}"
          check_outcome static-generate "${{ steps.static-generate.outcome }}"
          check_outcome static-diff "${{ steps.static-diff.outcome }}"
          exit "$failed"
