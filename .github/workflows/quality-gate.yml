name: Quality Gate

on:
  workflow_dispatch:
    inputs:
      trusted_base_sha:
        description: Protected predecessor commit (optional)
        required: false
        type: string
  workflow_call:
    inputs:
      trusted_base_sha:
        required: false
        type: string

permissions:
  contents: read

jobs:
  java-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Resolve SDK contract predecessor
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          INPUT_TRUSTED_BASE_SHA: ${{ inputs.trusted_base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TRUSTED_BASE_SHA="$INPUT_TRUSTED_BASE_SHA"
          if [ -z "$TRUSTED_BASE_SHA" ] && [ "$INPUT_ROOT_ADMISSION" != "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$EVENT_PR_BASE_REF" != "$DEFAULT_BRANCH" ]; }; then
              git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
              PROTECTED_TIP="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
              if [ "$GITHUB_SHA" = "$PROTECTED_TIP" ]; then
                TRUSTED_BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
              else
                TRUSTED_BASE_SHA="$(git merge-base "$GITHUB_SHA" "$PROTECTED_TIP")"
              fi
            fi
          fi
          node scripts/ci/resolve-trusted-base.mjs --repo-root . --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" --before "$EVENT_BEFORE" --ref "$GITHUB_REF" --pr-head "$EVENT_PR_HEAD_SHA" --pr-base "$EVENT_PR_BASE_SHA" --merge-group-base "$EVENT_MERGE_GROUP_BASE_SHA" --input-base "$TRUSTED_BASE_SHA" --default-branch "$DEFAULT_BRANCH" --mode > "$RUNNER_TEMP/sdk-gate-base.json"
          node -e 'const j=require(process.argv[1]); console.log(`SDK_BASE_SHA=${j.base}`)' "$RUNNER_TEMP/sdk-gate-base.json" >> "$GITHUB_ENV"
      - name: Compile external plugin test fixtures
        run: mvn -B -ntp -pl pixivdownload-official-plugins -am compile -Dexec.skip=true
      - name: Run Java tests
        run: mvn -B -ntp test -Dexec.skip=true -Duser.language=en -Duser.country=US
      - name: Build release artifacts with ProGuard
        run: mvn -B -ntp verify -Pofficial-surveys -DskipTests
      - name: Verify packaged release boundaries
        run: |
          mvn -B -ntp -pl pixivdownload-app -am test -Dtest=DistributionPackagingBoundaryTest -Dsurefire.failIfNoSpecifiedTests=false -Ddistribution.packaging.require-artifacts=true -Dexec.skip=true
          REPORT=$(find pixivdownload-app/target/surefire-reports -name '*DistributionPackagingBoundaryTest.txt' -print -quit)
          test -n "$REPORT"
          grep -Eq 'Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0' "$REPORT"
      - name: Package SDK contract artifacts
        run: mvn -B -ntp -pl
          pixivdownload-sdk-info,pixivdownload-plugin-api,pixivdownload-core-api,pixivdownload-sdk-bom
          package -DskipTests -Dexec.skip=true
      - name: Compare SDK public contract
        run: |
          BASE_DIR="$RUNNER_TEMP/sdk-base-source"
          mkdir -p "$BASE_DIR"
          git archive "$SDK_BASE_SHA" | tar -x -C "$BASE_DIR"
          mvn -B -ntp -f "$BASE_DIR/pom.xml" -pl pixivdownload-sdk-info,pixivdownload-plugin-api,pixivdownload-core-api,pixivdownload-sdk-bom -am package -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dexec.skip=true
          node scripts/ci/sdk-api-surface.mjs --module "sdk-info=$BASE_DIR/pixivdownload-sdk-info/target" --module "plugin-api=$BASE_DIR/pixivdownload-plugin-api/target" --module "core-api=$BASE_DIR/pixivdownload-core-api/target" --output "$RUNNER_TEMP/sdk-base-surface.txt"
          node scripts/ci/sdk-api-surface.mjs --module sdk-info=pixivdownload-sdk-info/target --module plugin-api=pixivdownload-plugin-api/target --module core-api=pixivdownload-core-api/target --output "$RUNNER_TEMP/sdk-candidate-surface.txt"
          node scripts/ci/sdk-contract.mjs --repo-root . --base-ref "$SDK_BASE_SHA" --candidate-ref "$GITHUB_SHA" --base-surface "$RUNNER_TEMP/sdk-base-surface.txt" --candidate-surface "$RUNNER_TEMP/sdk-candidate-surface.txt" --base-sdk-root "$BASE_DIR" --candidate-sdk-root . --report "$RUNNER_TEMP/sdk-contract-report.json"
          cat "$RUNNER_TEMP/sdk-contract-report.json"

  javascript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm run test:js
      - name: Run web standards guard
        run: npm run test:web-standards

  signature-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve protected predecessor
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          INPUT_TRUSTED_BASE_SHA: ${{ inputs.trusted_base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TRUSTED_BASE_SHA="$INPUT_TRUSTED_BASE_SHA"
          if [ -z "$TRUSTED_BASE_SHA" ] && [ "$INPUT_ROOT_ADMISSION" != "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$EVENT_PR_BASE_REF" != "$DEFAULT_BRANCH" ]; }; then
              git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
              PROTECTED_TIP="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
              if [ "$GITHUB_SHA" = "$PROTECTED_TIP" ]; then
                TRUSTED_BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
              else
                TRUSTED_BASE_SHA="$(git merge-base "$GITHUB_SHA" "$PROTECTED_TIP")"
              fi
            fi
          fi
          node scripts/ci/resolve-trusted-base.mjs --repo-root . --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" --before "$EVENT_BEFORE" --ref "$GITHUB_REF" --pr-head "$EVENT_PR_HEAD_SHA" --pr-base "$EVENT_PR_BASE_SHA" --merge-group-base "$EVENT_MERGE_GROUP_BASE_SHA" --input-base "$TRUSTED_BASE_SHA" --default-branch "$DEFAULT_BRANCH" --mode > "$RUNNER_TEMP/gate-base.json"
          node -e 'const j=require(process.argv[1]); for (const [k,v] of Object.entries({GATE_MODE:j.mode,BASE_SHA:j.base,ROOT_SHA:j.root,CANDIDATE_SHA:process.env.GITHUB_SHA})) console.log(`${k}=${v}`)' "$RUNNER_TEMP/gate-base.json" >> "$GITHUB_ENV"
      - name: Materialize protected verifier
        run: |
          GATE_DIR="$RUNNER_TEMP/trusted-gate"
          mkdir -p "$GATE_DIR"
          if git cat-file -e "$BASE_SHA:scripts/ci/release-gate-policy.json" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/release-gate-policy.json" > "$RUNNER_TEMP/gate-policy.json"
            GATE_EPOCH=$(node -e 'console.log(require(process.argv[1]).gateEpoch)' "$RUNNER_TEMP/gate-policy.json")
            node -e 'const p=require(process.argv[1]); console.log(p.protectedCore.join("\n"))' "$RUNNER_TEMP/gate-policy.json" > "$RUNNER_TEMP/gate-files.txt"
          else
            GATE_EPOCH=4
            git show "$BASE_SHA:scripts/i18n/gate-policy.json" > "$RUNNER_TEMP/gate-policy.json"
            node -e 'const p=require(process.argv[1]); console.log(p.minimumTrustedVerifier.requiredFiles.join("\n"))' "$RUNNER_TEMP/gate-policy.json" > "$RUNNER_TEMP/gate-files.txt"
          fi
          while IFS= read -r rel; do
            mkdir -p "$GATE_DIR/$(dirname "$rel")"
            git show "$BASE_SHA:$rel" > "$GATE_DIR/$rel"
          done < "$RUNNER_TEMP/gate-files.txt"
          if [ "$GATE_EPOCH" = "5" ] && [ "$(git show "$CANDIDATE_SHA:scripts/ci/release-gate-policy.json" | node -e 'let s=""; process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).gateEpoch))')" = "7" ]; then
            for rel in release-gate-trust.mjs release-gate-verifier.mjs resolve-trusted-base.mjs; do
              git show "$BASE_SHA:scripts/ci/gate-admission/$rel" > "$GATE_DIR/scripts/ci/$rel"
            done
            GATE_EPOCH=7
          fi
          echo "GATE_EPOCH=$GATE_EPOCH" >> "$GITHUB_ENV"
          echo "GATE_DIR=$GATE_DIR" >> "$GITHUB_ENV"
      - name: Run trusted signature guard
        run: |
          if [ "$GATE_EPOCH" = "5" ] || [ "$GATE_EPOCH" = "7" ]; then
            node "$GATE_DIR/scripts/ci/release-gate-verifier.mjs" --repo-root . --trusted-ref "$BASE_SHA" --candidate-ref "$CANDIDATE_SHA" --signature
          elif [ "$GATE_MODE" = "ROOT_ADMISSION" ]; then
            node scripts/ci/gate-parity.mjs --repo-root . --candidate-ref "$CANDIDATE_SHA" --invariants --signature
          else
            node "$GATE_DIR/scripts/ci/gate-parity.mjs" --repo-root . --trusted-dir "$GATE_DIR" --trusted-ref "$BASE_SHA" --candidate-ref "$CANDIDATE_SHA" --signature
          fi

  trusted-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record tested execution
        env:
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_REPOSITORY_ID: ${{ github.repository_id }}
          GATE_MERGE: ${{ github.sha }}
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha }}
          GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GATE_PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module -e '
            const e = process.env;
            console.log("GATE_EXECUTION " + JSON.stringify({schemaVersion: 1,
              repository: e.GATE_REPOSITORY, repositoryId: e.GATE_REPOSITORY_ID,
              event: e.GITHUB_EVENT_NAME, merge: e.GATE_MERGE, base: e.GATE_BASE,
              head: e.GATE_HEAD, baseRef: e.GATE_BASE_REF, pullRequest: e.GATE_PR,
              runId: e.GITHUB_RUN_ID, attempt: e.GITHUB_RUN_ATTEMPT}));'
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Resolve protected predecessor
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          INPUT_TRUSTED_BASE_SHA: ${{ inputs.trusted_base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TRUSTED_BASE_SHA="$INPUT_TRUSTED_BASE_SHA"
          if [ -z "$TRUSTED_BASE_SHA" ] && [ "$INPUT_ROOT_ADMISSION" != "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$EVENT_PR_BASE_REF" != "$DEFAULT_BRANCH" ]; }; then
              git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
              PROTECTED_TIP="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
              if [ "$GITHUB_SHA" = "$PROTECTED_TIP" ]; then
                TRUSTED_BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
              else
                TRUSTED_BASE_SHA="$(git merge-base "$GITHUB_SHA" "$PROTECTED_TIP")"
              fi
            fi
          fi
          node scripts/ci/resolve-trusted-base.mjs --repo-root . --event-name "$GITHUB_EVENT_NAME" --candidate "$GITHUB_SHA" --before "$EVENT_BEFORE" --ref "$GITHUB_REF" --pr-head "$EVENT_PR_HEAD_SHA" --pr-base "$EVENT_PR_BASE_SHA" --merge-group-base "$EVENT_MERGE_GROUP_BASE_SHA" --input-base "$TRUSTED_BASE_SHA" --default-branch "$DEFAULT_BRANCH" --mode > "$RUNNER_TEMP/gate-base.json"
          node -e 'const j=require(process.argv[1]); for (const [k,v] of Object.entries({GATE_MODE:j.mode,BASE_SHA:j.base,ROOT_SHA:j.root,CANDIDATE_SHA:process.env.GITHUB_SHA})) console.log(`${k}=${v}`)' "$RUNNER_TEMP/gate-base.json" >> "$GITHUB_ENV"
      - name: Materialize protected verifier
        run: |
          GATE_DIR="$RUNNER_TEMP/trusted-gate"
          mkdir -p "$GATE_DIR"
          if git cat-file -e "$BASE_SHA:scripts/ci/release-gate-policy.json" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/release-gate-policy.json" > "$RUNNER_TEMP/gate-policy.json"
            GATE_EPOCH=$(node -e 'console.log(require(process.argv[1]).gateEpoch)' "$RUNNER_TEMP/gate-policy.json")
            node -e 'const p=require(process.argv[1]); console.log(p.protectedCore.join("\n"))' "$RUNNER_TEMP/gate-policy.json" > "$RUNNER_TEMP/gate-files.txt"
          else
            GATE_EPOCH=4
            git show "$BASE_SHA:scripts/i18n/gate-policy.json" > "$RUNNER_TEMP/gate-policy.json"
            node -e 'const p=require(process.argv[1]); console.log(p.minimumTrustedVerifier.requiredFiles.join("\n"))' "$RUNNER_TEMP/gate-policy.json" > "$RUNNER_TEMP/gate-files.txt"
          fi
          while IFS= read -r rel; do
            mkdir -p "$GATE_DIR/$(dirname "$rel")"
            git show "$BASE_SHA:$rel" > "$GATE_DIR/$rel"
          done < "$RUNNER_TEMP/gate-files.txt"
          if [ "$GATE_EPOCH" = "5" ] && [ "$(git show "$CANDIDATE_SHA:scripts/ci/release-gate-policy.json" | node -e 'let s=""; process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).gateEpoch))')" = "7" ]; then
            for rel in release-gate-trust.mjs release-gate-verifier.mjs resolve-trusted-base.mjs; do
              git show "$BASE_SHA:scripts/ci/gate-admission/$rel" > "$GATE_DIR/scripts/ci/$rel"
            done
            GATE_EPOCH=7
          fi
          echo "GATE_EPOCH=$GATE_EPOCH" >> "$GITHUB_ENV"
          echo "GATE_DIR=$GATE_DIR" >> "$GITHUB_ENV"
      - name: Install protected parser
        run: |
          for rel in package.json package-lock.json; do
            git show "$BASE_SHA:$rel" > "$GATE_DIR/$rel"
          done
          (cd "$GATE_DIR" && npm ci --ignore-scripts --no-audit --no-fund)
          echo "TRUSTED_GATE_PACKAGE_JSON=$GATE_DIR/package.json" >> "$GITHUB_ENV"
      - name: Verify trusted release contract
        run: |
          if [ "$GATE_EPOCH" = "5" ] || [ "$GATE_EPOCH" = "7" ]; then
            node "$GATE_DIR/scripts/ci/release-gate-verifier.mjs" --repo-root . --trusted-ref "$BASE_SHA" --candidate-ref "$CANDIDATE_SHA"
          elif [ "$GATE_MODE" = "ROOT_ADMISSION" ]; then
            node scripts/ci/gate-parity.mjs --repo-root . --candidate-ref "$CANDIDATE_SHA" --invariants
          else
            node "$GATE_DIR/scripts/ci/gate-parity.mjs" --repo-root . --trusted-dir "$GATE_DIR" --trusted-ref "$BASE_SHA" --candidate-ref "$CANDIDATE_SHA"
          fi

  i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run i18n tests
        run: npm run test:i18n
      - name: Run i18n checks
        run: npm run i18n:check
      - name: Verify generated static resources
        run: npm run i18n:generate-static && git diff --exit-code --
          pixivdownload-app/src/main/resources/static/i18n-static

  check-shared-snippets:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Git UTF-8 filenames
        run: git config --global core.quotepath false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Verify .user.js shared snippets are in sync
        shell: pwsh
        run: ./scripts/sync-shared-snippets.ps1 -Check
