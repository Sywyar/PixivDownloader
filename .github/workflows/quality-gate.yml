name: Quality Gate

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  java-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile external plugin test fixtures
        run: mvn -B -ntp -pl pixivdownload-official-plugins -am compile -Dexec.skip=true

      - name: Run Java tests
        run: mvn -B -ntp test -Dexec.skip=true -Duser.language=en -Duser.country=US

  signature-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reject reverse-engineered Douyin signature code
        run: bash scripts/hooks/pre-push-guard.sh --ref ${{ github.sha }}

  javascript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Run web standards guard
        run: npm run test:web-standards

  i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # 物化非 tip commit 的 tree 需要完整对象库，浅克隆会碰巧可用但不可依赖
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17 (properties oracle differential tests)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 所有步骤都不使用 continue-on-error：任何一步失败都直接使 job 失败，
      # 状态由 GitHub Actions 原生 outcome 传播，不依赖事后组合判断。
      - name: Run i18n tests (incl. JVM properties oracle differential)
        run: npm run test:i18n
        env:
          CI: 'true'

      - name: Run i18n check on the tested commit (ref snapshot)
        run: node scripts/i18n/check.mjs --snapshot ref --ref ${{ github.sha }}

      - name: Run i18n worktree check
        run: npm run i18n:check

      - name: Generate static i18n resources (defense-in-depth diff)
        run: npm run i18n:generate-static

      - name: Verify generated resources are in sync
        run: git diff --exit-code -- pixivdownload-app/src/main/resources/static/i18n-static

      - name: Upload i18n report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-report
          path: |
            build/reports/i18n/
            pixivdownload-app/src/main/resources/static/i18n-static/
          if-no-files-found: ignore
