name: Nightly Build

on:
  schedule:
    - cron: '33 18 * * *'
  workflow_dispatch:
    inputs:
      skip-changelog-gate:
        description: '填写 true 可跳过 CHANGELOG 门槛强制构建；CHANGELOG 与上次 nightly 基线无差异时沿用上一次发布说明。默认 false'
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      date: ${{ steps.vars.outputs.date }}
      has_changes: ${{ steps.changelog.outputs.has_changes }}

    steps:
      - name: Fix Git UTF-8 filenames
        run: git config --global core.quotepath false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check changelog diff
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin 2>/dev/null || true

          # has_changes = any real Git diff in CHANGELOG.md against the last
          # successful Nightly baseline. Additions, modifications and pure
          # deletions all count; a Git error fails the step instead of being
          # misread as "no changes". First Nightly (no baseline tag yet) uses
          # the [Unreleased] section instead. The decision lives in
          # scripts/nightly-changelog-gate.sh so the exact matrix is tested.
          # Manual dispatch may pass skip-changelog-gate=true to force a build
          # without changelog changes (e.g. to pick up republished plugin
          # artifacts); release notes then fall back to the previous nightly.
          HAS_CHANGES=$(./scripts/nightly-changelog-gate.sh CHANGELOG.md nightly)
          if [ "$HAS_CHANGES" = "false" ] \
             && [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.skip-changelog-gate }}" = "true" ]; then
            HAS_CHANGES=true
          fi
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

      - name: Resolve next version
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag --sort=-v:refname --list 'v*' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          LATEST_VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          if [[ "$PATCH" == *-* ]]; then
            PATCH="${PATCH%%-*}"
            if ! git rev-parse --verify --quiet "refs/tags/v${MAJOR}.${MINOR}.${PATCH}" >/dev/null; then
              PATCH=$((PATCH - 1))
            fi
          fi
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          NIGHTLY_VERSION="${NEXT_VERSION}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=$NIGHTLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

  publish-plugins:
    needs: [resolve-version]
    if: needs.resolve-version.outputs.has_changes == 'true'
    uses: ./.github/workflows/publish-plugins.yml
    secrets:
      PLUGINS_REPO_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
      PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
      PLUGIN_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM }}

  build-jar:
    needs: [resolve-version, publish-plugins]
    if: needs.resolve-version.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fix Git UTF-8 filenames
        run: git config --global core.quotepath false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Prepare production plugin credential key filter
        shell: pwsh
        env:
          PIXIVDOWNLOAD_PLUGIN_CREDENTIAL_MASTER_KEY_BASE64: ${{ secrets.PIXIVDOWNLOAD_PLUGIN_CREDENTIAL_MASTER_KEY_BASE64 }}
        run: |
          $filterPath = Join-Path $env:RUNNER_TEMP "pixivdownload-plugin-credential-key-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.properties"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "PLUGIN_CREDENTIAL_FILTER=$filterPath`n",
            (New-Object System.Text.UTF8Encoding($false)))
          ./scripts/write-plugin-credential-key-filter.ps1 -OutputPath $filterPath

      - name: Build JAR
        run: >
          mvn package -DskipTests -Dapp.release.version=${{ needs.resolve-version.outputs.version }}
          "-Dplugin.credential.filter=$PLUGIN_CREDENTIAL_FILTER"
          "-Dpixiv.layout-survey.project-token=${{ vars.PIXIV_LAYOUT_SURVEY_PROJECT_TOKEN }}"
          "-Dpixiv.layout-survey.survey-id=${{ vars.PIXIV_LAYOUT_SURVEY_ID }}"
          "-Dpixiv.layout-survey.api-host=${{ vars.PIXIV_LAYOUT_SURVEY_API_HOST }}"
          "-Dpixiv.layout-survey.ui-host=${{ vars.PIXIV_LAYOUT_SURVEY_UI_HOST }}"
          "-Dpixiv.layout-survey.require-config=${{ github.repository == 'Sywyar/PixivDownloader' }}"

      - name: Verify packaged distribution boundaries
        run: |
          mvn -B -ntp -pl pixivdownload-app -am test -Dtest=DistributionPackagingBoundaryTest -Dsurefire.failIfNoSpecifiedTests=false -Ddistribution.packaging.require-artifacts=true -Ddistribution.packaging.require-production-credential-key=true -Dexec.skip=true
          REPORT=$(find pixivdownload-app/target/surefire-reports -name '*DistributionPackagingBoundaryTest.txt' -print -quit)
          test -n "$REPORT"
          grep -Eq 'Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0' "$REPORT"

      - name: Remove production plugin credential key filter
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PLUGIN_CREDENTIAL_FILTER)) {
            Remove-Item -LiteralPath $env:PLUGIN_CREDENTIAL_FILTER -Force -ErrorAction SilentlyContinue
          }

      - name: Stage executable JAR
        run: |
          BOOT_JARS=()
          while IFS= read -r f; do BOOT_JARS+=("$f"); done < <(ls pixivdownload-app/target/PixivDownload-*-boot.jar 2>/dev/null || true)
          if [ "${#BOOT_JARS[@]}" -eq 0 ]; then
            while IFS= read -r f; do BOOT_JARS+=("$f"); done < <(ls pixivdownload-app/target/PixivDownload-*.jar 2>/dev/null | grep -vE '(-sources\.jar|-javadoc\.jar|-original\.jar)$' || true)
          fi
          if [ "${#BOOT_JARS[@]}" -ne 1 ]; then
            echo "Expected exactly one executable app jar, found ${#BOOT_JARS[@]}:" >&2
            printf '%s\n' "${BOOT_JARS[@]}" >&2
            exit 1
          fi
          BOOT_JAR=${BOOT_JARS[0]}
          mkdir -p build/release-jars
          OUTPUT_JAR="build/release-jars/PixivDownload-${{ needs.resolve-version.outputs.version }}.jar"
          cp "$BOOT_JAR" "$OUTPUT_JAR"
          test -s "$OUTPUT_JAR"
          jar tf "$OUTPUT_JAR" | grep -q '^BOOT-INF/' || {
            echo "Selected jar is not a Spring Boot executable jar: $OUTPUT_JAR" >&2
            exit 1
          }
          STAGED_COUNT=$(ls build/release-jars/*.jar 2>/dev/null | wc -l)
          test "$STAGED_COUNT" -eq 1
          ls -l build/release-jars/

      - name: Upload internal app-shell JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-shell-jar
          path: build/release-jars/*.jar
          if-no-files-found: error

      - name: Upload update signature tool
        uses: actions/upload-artifact@v7
        with:
          name: update-signature-tool
          path: pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-*.jar
          if-no-files-found: error

      - name: Stage official plugin inputs from signed catalog
        shell: pwsh
        run: |
          $signatureTools = @(Get-ChildItem pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-*.jar -File |
            Where-Object { $_.Name -notlike "*-sources.jar" -and $_.Name -notlike "*-javadoc.jar" } |
            Sort-Object LastWriteTime -Descending)
          if ($signatureTools.Count -lt 1) {
            throw "Could not find pixivdownload-plugin-signature tool jar."
          }
          $signatureTool = $signatureTools[0]
          ./scripts/stage-official-plugin-inputs-from-catalog.ps1 `
            -OutputDir build/plugin-inputs `
            -SignatureToolJar $signatureTool.FullName `
            -IncludeOptional

      - name: Assemble Java distributions
        shell: pwsh
        run: |
          $version = '${{ needs.resolve-version.outputs.version }}'
          $jars = @(Get-ChildItem build/release-jars/PixivDownload-*.jar -File)
          if ($jars.Count -ne 1) {
            throw "Expected exactly one staged app-shell JAR under build/release-jars, found $($jars.Count)"
          }
          $signatureTools = @(Get-ChildItem pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-*.jar -File |
            Where-Object { $_.Name -notlike "*-sources.jar" -and $_.Name -notlike "*-javadoc.jar" } |
            Sort-Object LastWriteTime -Descending)
          if ($signatureTools.Count -lt 1) {
            throw "Could not find pixivdownload-plugin-signature tool jar."
          }
          $signatureTool = $signatureTools[0]
          ./scripts/package-java-distributions.ps1 `
            -Version $version `
            -PrebuiltJar $jars[0].FullName `
            -PrebuiltPluginsDir build/plugin-inputs `
            -SignatureToolJar $signatureTool.FullName `
            -OutputDir build/plugin-distributions

      - name: Upload plugin inputs artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-inputs
          path: build/plugin-inputs/*
          if-no-files-found: error

      - name: Upload java distributions artifact
        uses: actions/upload-artifact@v7
        with:
          name: java-distributions
          path: |
            build/plugin-distributions/PixivDownload-*-java.zip
            build/plugin-distributions/PixivDownload-*-full-offline.zip
          if-no-files-found: error

  build-windows-installer:
    needs: [resolve-version, build-jar]
    if: needs.resolve-version.outputs.has_changes == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Fix Git UTF-8 filenames
        run: git config --global core.quotepath false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download internal app-shell JAR
        uses: actions/download-artifact@v7
        with:
          name: app-shell-jar
          path: artifacts/app-shell-jar

      - name: Download plugin inputs artifact
        uses: actions/download-artifact@v7
        with:
          name: plugin-inputs
          path: artifacts/plugin-inputs

      - name: Build plugin signature tool
        shell: powershell
        run: .\mvnw.cmd "-pl" "pixivdownload-plugin-signature" "-am" "package" "-DskipTests" "-Dexec.skip=true"

      - name: Package Windows setup
        shell: pwsh
        run: |
          $version = '${{ needs.resolve-version.outputs.version }}'
          $jars = @(Get-ChildItem artifacts/app-shell-jar/PixivDownload-*.jar -File)
          if ($jars.Count -ne 1) {
            throw "Expected exactly one executable JAR artifact under artifacts/app-shell-jar, found $($jars.Count)"
          }
          $jar = $jars[0]
          $pluginsDir = (Resolve-Path artifacts/plugin-inputs).Path
          $signatureTools = @(Get-ChildItem pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-*.jar -File |
            Where-Object { $_.Name -notlike "*-sources.jar" -and $_.Name -notlike "*-javadoc.jar" } |
            Sort-Object LastWriteTime -Descending)
          if ($signatureTools.Count -lt 1) {
            throw "Could not find pixivdownload-plugin-signature tool jar."
          }
          $signatureTool = $signatureTools[0]
          ./scripts/package-local.ps1 `
            -Version $version `
            -PrebuiltJar $jar.FullName `
            -PrebuiltPluginsDir $pluginsDir `
            -SignatureToolJar $signatureTool.FullName `
            -SkipPortable `
            -SkipOfflinePortable

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: build/out/*-setup.exe

  release-nightly:
    needs: [resolve-version, build-jar, build-windows-installer]
    if: needs.resolve-version.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download Windows installer artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: artifacts/

      - name: Download java distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: java-distributions
          path: artifacts/java-distributions

      - name: Download update signature tool
        uses: actions/download-artifact@v7
        with:
          name: update-signature-tool
          path: tools/update-signature

      - name: Set up JDK 17 for update signing
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Diff changelog since last nightly
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags origin 2>/dev/null || true

          # Display-only notes for the Release body: this step never decides
          # whether the Nightly runs (that is resolve-version has_changes, a
          # real Git diff that also counts deletions). A deletion-only diff
          # may yield has_notes=false here while the Nightly still publishes.
          if git rev-parse --verify nightly^{commit} >/dev/null 2>&1; then
            # nightly tag exists: diff CHANGELOG.md between last nightly and HEAD
            git diff nightly -- CHANGELOG.md \
              | awk '/^\+\+\+/ { next } /^\+/ { sub(/^\+/, ""); print }' > CHANGELOG_DIFF.md
          else
            # First nightly build: fall back to full [Unreleased] section
            awk '
              /^## \[Unreleased\]/ { found=1; next }
              /^## \[/ { if (found) exit }
              found { print }
            ' CHANGELOG.md > CHANGELOG_DIFF.md
          fi

          if [ -s CHANGELOG_DIFF.md ]; then
            has_notes=true
          else
            has_notes=false
          fi

          # skip-changelog-gate dispatch with an unchanged CHANGELOG reuses the
          # previous nightly release notes (both Release body and update.json),
          # so a forced rebuild never publishes empty or misleading notes.
          if [ "$has_notes" = "false" ] \
             && [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.skip-changelog-gate }}" = "true" ] \
             && git rev-parse --verify nightly^{commit} >/dev/null 2>&1 \
             && git diff --quiet nightly -- CHANGELOG.md; then
            mkdir -p previous-update
            if gh release download nightly \
                 --pattern 'update.json' \
                 --dir previous-update \
                 --clobber >/dev/null 2>&1; then
              jq -r '.releaseNotes // empty' previous-update/update.json > CHANGELOG_DIFF.md
              if [ -s CHANGELOG_DIFF.md ]; then
                has_notes=true
              fi
            fi
          fi

          if [ "$has_notes" = "true" ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate update manifest
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          INSTALLER=$(ls artifacts/*-win-x64-setup.exe 2>/dev/null | head -n1 || true)
          if [ -z "$INSTALLER" ]; then
            echo "No installer artifact found for update manifest" >&2
            exit 1
          fi

          FILENAME=$(basename "$INSTALLER")
          SHA256=$(sha256sum "$INSTALLER" | awk '{print $1}')
          SIZE=$(stat -c%s "$INSTALLER")
          LATEST_VERSION="${{ needs.resolve-version.outputs.version }}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          EXPIRES_AT=$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)
          ASSET_URL="https://github.com/${GH_REPOSITORY}/releases/download/nightly/${FILENAME}"
          NOTES_URL="https://github.com/${GH_REPOSITORY}/releases/tag/nightly"

          jq -n \
            --arg latestVersion "$LATEST_VERSION" \
            --arg channel "nightly" \
            --argjson sequence "$GITHUB_RUN_ID" \
            --arg expiresAt "$EXPIRES_AT" \
            --arg releaseDate "$RELEASE_DATE" \
            --rawfile releaseNotes CHANGELOG_DIFF.md \
            --arg releaseNotesUrl "$NOTES_URL" \
            --arg assetUrl "$ASSET_URL" \
            --arg assetSha256 "$SHA256" \
            --argjson assetSize "$SIZE" \
            '{
              channel: $channel,
              sequence: $sequence,
              expiresAt: $expiresAt,
              latestVersion: $latestVersion,
              releaseDate: $releaseDate,
              releaseNotes: $releaseNotes,
              releaseNotesUrl: $releaseNotesUrl,
              assets: {
                "win-x64-installer": {
                  url: $assetUrl,
                  sha256: $assetSha256,
                  sizeBytes: $assetSize
                }
              }
            }' > artifacts/update.json

          echo "Generated update.json:"
          cat artifacts/update.json

      - name: Sign update manifest
        shell: pwsh
        env:
          PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
          PLUGIN_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          $privateKeyFile = Join-Path $env:RUNNER_TEMP "pixivdownloader-update-signing-key.pem"
          try {
            if ([string]::IsNullOrWhiteSpace($env:PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64) -and [string]::IsNullOrWhiteSpace($env:PLUGIN_SIGNING_PRIVATE_KEY_PEM)) {
              throw "Missing update signing private key secret."
            }
            if (-not [string]::IsNullOrWhiteSpace($env:PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64)) {
              [System.IO.File]::WriteAllBytes($privateKeyFile,
                [System.Convert]::FromBase64String(($env:PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 -replace '\s', '')))
            } else {
              $pem = $env:PLUGIN_SIGNING_PRIVATE_KEY_PEM.Replace('\r\n', "`n").Replace('\n', "`n").Replace('\r', "`n")
              [System.IO.File]::WriteAllText($privateKeyFile, $pem.Trim() + "`n", (New-Object System.Text.UTF8Encoding($false)))
            }
            & chmod 600 -- $privateKeyFile
            if ($LASTEXITCODE -ne 0) { throw "Failed to restrict update signing private key permissions." }
            $tools = @(Get-ChildItem tools/update-signature/pixivdownload-plugin-signature-*.jar -File |
              Where-Object { $_.Name -notlike "*-sources.jar" -and $_.Name -notlike "*-javadoc.jar" })
            if ($tools.Count -ne 1) {
              throw "Expected exactly one update signature tool, found $($tools.Count)."
            }
            & java -cp $tools[0].FullName top.sywyar.pixivdownload.plugin.signature.cli.PluginSignatureTool `
              manifest --manifest artifacts/update.json --repository-id pixivdownloader-update `
              --key-id pixivdownloader-official-root-2026-07 `
              --private-key $privateKeyFile --out artifacts/update.json.sig
            if ($LASTEXITCODE -ne 0) { throw "Update manifest signing failed." }
          } finally {
            Remove-Item -LiteralPath $privateKeyFile -Force -ErrorAction SilentlyContinue
          }

      - name: Build release body
        if: ${{ success() }}
        shell: bash
        run: |
          cat > RELEASE_BODY.md <<'EOF'
          > ⚠️ 这是通过自动化测试的每夜版，但未经正式发布级人工验证，仍可能包含 bug。
          > This nightly build passed automated tests but has not received release-level manual validation and may still contain bugs.

          **构建日期 / Build Date:** ${{ needs.resolve-version.outputs.date }}
          **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

          ## 使用说明 / Usage

          ### Windows 安装包
          下载 `PixivDownload-*-win-x64-setup.exe` 并运行。安装包的“附加功能”页可选安装 FFmpeg；除 Douyin 外的面向用户的官方插件已在构建期预置，安装器中的插件选择页当前暂时跳过，Douyin 可在启动后从 Web 插件市场按需安装。

          ### Java 标准包（跨平台）
          下载 `PixivDownload-*-java.zip` 并完整解压到任意目录，不要只提取其中的 JAR。需要自行安装 Java 17。
          Windows 上执行 `run.bat`；Linux / macOS 在解压目录内执行 `sh run.sh`。
          该包包含核心壳与除 Douyin 外的全部面向用户的签名官方插件，与 Windows 安装包默认插件集合一致；Douyin 可在启动后从 Web 插件市场按需安装。包内不包含 JRE，也不包含 FFmpeg。

          ### 离线全量包（跨平台）
          下载 `PixivDownload-*-full-offline.zip` 并完整解压，Windows 上执行 `run.bat`，Linux / macOS 执行 `sh run.sh`。
          该包包含核心壳、全部面向用户的签名官方插件（含 Douyin）、`.sha256`、`.sig`、provenance sidecar 和 `plugins-manifest.json`。需要自行安装 Java 17；包内不包含 JRE，也不包含 FFmpeg。
          EOF

          if [ "${{ steps.changelog.outputs.has_notes }}" = "true" ]; then
            echo "" >> RELEASE_BODY.md
            echo "## 本日变更 / Today's Changes" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            cat CHANGELOG_DIFF.md >> RELEASE_BODY.md
          fi

      - name: Delete old nightly assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The nightly version embeds a unique build id, so old release assets
          # would otherwise accumulate forever. Remove every existing asset on
          # the `nightly` release before re-uploading.
          if gh release view nightly >/dev/null 2>&1; then
            gh release view nightly --json assets --jq '.assets[].name' \
              | while IFS= read -r asset; do
                  [ -n "$asset" ] || continue
                  echo "Deleting old asset: $asset"
                  gh release delete-asset nightly "$asset" --yes || true
                done
          fi

      - name: Create/Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build ${{ needs.resolve-version.outputs.version }}"
          body_path: RELEASE_BODY.md
          prerelease: true
          files: |
            artifacts/*-setup.exe
            artifacts/java-distributions/*-java.zip
            artifacts/java-distributions/*-full-offline.zip
            artifacts/update.json
            artifacts/update.json.sig

      - name: Advance nightly tag after successful release
        # The nightly tag is the "last successful Nightly baseline" used by the
        # next run's changelog gate. It must only move after the Release action
        # published every attachment: if uploads fail, the tag stays on the old
        # baseline and the next run still sees a CHANGELOG diff and retries.
        # A push failure here fails the workflow on purpose - never swallow it.
        if: ${{ success() }}
        shell: bash
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
