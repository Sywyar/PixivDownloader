name: Verify release boundaries
description: Run the shared Java and PowerShell checks against the current release artifacts

inputs:
  require_production_credential_key:
    description: Require the release credential key in the freshly built app
    default: 'false'
  additional_tests:
    description: Comma-separated Surefire test selectors to run against the same build
    default: ''
  verify_compose_tests:
    description: Run Compose tests and compiled plugin SDK checks alongside AOT acceptance
    default: 'false'

runs:
  using: composite
  steps:
    - name: Verify packaged boundaries and AOT in parallel
      shell: bash
      env:
        REQUIRE_PRODUCTION_CREDENTIAL_KEY: ${{ inputs.require_production_credential_key }}
        ADDITIONAL_TESTS: ${{ inputs.additional_tests }}
        VERIFY_COMPOSE_TESTS: ${{ inputs.verify_compose_tests }}
      run: node scripts/ci/parallel-release-checks.mjs
