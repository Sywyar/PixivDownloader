name: Publish official plugins
description: Build, sign and publish official plugins and refresh the plugin market manifest

outputs:
  manifest_commit:
    description: Commit containing the generated plugin market manifest
    value: ${{ steps.commit-manifest.outputs.manifest_commit }}

inputs:
  plugin_signing_private_key_pem_base64:
    description: Base64-encoded PKCS#8 PEM private key for official plugin signatures
    required: true
  cross_repo_release_token:
    description: Token with write access to PixivDownloader release repositories
    required: true
  publish_args:
    description: Optional plugin publication arguments; only -f is supported
    required: false
    default: ''
  nightly_build_version:
    description: Optional Nightly application build version used to derive per-plugin prerelease versions
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
        cache: maven

    - name: Build plugin signature tool
      shell: powershell
      run: .\mvnw.cmd "-pl" "pixivdownload-plugin-signature" "-am" "package" "-DskipTests" "-Dexec.skip=true"

    - name: Prepare plugin signing private key
      shell: powershell
      env:
        PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64: ${{ inputs.plugin_signing_private_key_pem_base64 }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64)) {
          throw "Missing release Environment secret PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64."
        }
        $signingDir = Join-Path $env:RUNNER_TEMP "pixivdownload-plugin-signing"
        New-Item -ItemType Directory -Force -Path $signingDir | Out-Null
        $privateKeyFile = Join-Path $signingDir "official-ed25519-private-key.pem"
        try {
          $privateKeyPemBase64 = ($env:PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 -replace '\s', '')
          try {
            $privateKeyBytes = [System.Convert]::FromBase64String($privateKeyPemBase64)
          } catch {
            throw "Release Environment secret PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 is not valid Base64."
          }
          [System.IO.File]::WriteAllBytes($privateKeyFile, $privateKeyBytes)
          $privateKeyText = [System.IO.File]::ReadAllText($privateKeyFile, [System.Text.Encoding]::UTF8)
          if ($privateKeyText.Contains("?")) {
            throw "Prepared plugin signing private key contains '?' characters. Re-upload it as PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 from the original PEM bytes."
          }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "PLUGIN_SIGNING_PRIVATE_KEY_FILE=$privateKeyFile`n", (New-Object System.Text.UTF8Encoding($false)))
        } catch {
          Remove-Item -LiteralPath $privateKeyFile -Force -ErrorAction SilentlyContinue
          throw
        }

    - name: Build and publish updated plugins
      shell: powershell
      env:
        GH_TOKEN: ${{ inputs.cross_repo_release_token }}
        PUBLISH_PLUGIN_ARGS: ${{ inputs.publish_args }}
        NIGHTLY_BUILD_VERSION: ${{ inputs.nightly_build_version }}
        PLUGINS_REPO: Sywyar/PixivDownloader-plugins
        PLUGIN_SIGNING_KEY_ID: pixivdownloader-official-root-2026-07
      run: |
        try {
          $publishArgs = @{
            Repo = $env:PLUGINS_REPO
            OfficialKeyId = $env:PLUGIN_SIGNING_KEY_ID
            PrivateKeyFile = $env:PLUGIN_SIGNING_PRIVATE_KEY_FILE
          }
          $inputTokens = @()
          if (-not [string]::IsNullOrWhiteSpace($env:PUBLISH_PLUGIN_ARGS)) {
            $inputTokens = @($env:PUBLISH_PLUGIN_ARGS -split '\s+' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          }
          $unsupportedTokens = @($inputTokens | Where-Object { $_ -notin @("-f", "-Force") })
          if ($unsupportedTokens.Count -gt 0) {
            throw "Unsupported publish_args value(s): $($unsupportedTokens -join ', '). Only -f is supported."
          }
          if (@($inputTokens | Where-Object { $_ -in @("-f", "-Force") }).Count -gt 0) {
            $publishArgs["Force"] = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NIGHTLY_BUILD_VERSION)) {
            $publishArgs["NightlyBuildVersion"] = $env:NIGHTLY_BUILD_VERSION
          }
          .\scripts\publish-plugin-releases.ps1 @publishArgs
        } catch {
          Remove-Item -LiteralPath $env:PLUGIN_SIGNING_PRIVATE_KEY_FILE -Force -ErrorAction SilentlyContinue
          throw
        }

    - name: Generate plugin market manifest
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.cross_repo_release_token }}
        NIGHTLY_BUILD_VERSION: ${{ inputs.nightly_build_version }}
        PLUGINS_REPO: Sywyar/PixivDownloader-plugins
        PLUGIN_SIGNING_KEY_ID: pixivdownloader-official-root-2026-07
      run: |
        try {
          $manifestArgs = @{
            Repo = $env:PLUGINS_REPO
            CurationFile = "scripts/market-curation.json"
            OutputFile = "build/manifest.json"
            OfficialKeyId = $env:PLUGIN_SIGNING_KEY_ID
            PrivateKeyFile = $env:PLUGIN_SIGNING_PRIVATE_KEY_FILE
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NIGHTLY_BUILD_VERSION)) {
            $manifestArgs["NightlyBuildVersion"] = $env:NIGHTLY_BUILD_VERSION
          }
          .\scripts\generate-market-manifest.ps1 @manifestArgs
        } finally {
          Remove-Item -LiteralPath $env:PLUGIN_SIGNING_PRIVATE_KEY_FILE -Force -ErrorAction SilentlyContinue
        }

    - name: Checkout plugins repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: Sywyar/PixivDownloader-plugins
        token: ${{ inputs.cross_repo_release_token }}
        path: plugins-repo

    - name: Commit plugin market manifest to plugins repo
      id: commit-manifest
      shell: powershell
      env:
        NIGHTLY_BUILD_VERSION: ${{ inputs.nightly_build_version }}
      run: |
        $manifestName = if ([string]::IsNullOrWhiteSpace($env:NIGHTLY_BUILD_VERSION)) {
          "manifest.json"
        } else {
          "nightly-manifest.json"
        }
        Copy-Item build/manifest.json "plugins-repo/$manifestName" -Force
        Copy-Item build/manifest.json.sig "plugins-repo/$manifestName.sig" -Force
        Set-Location plugins-repo
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add $manifestName "$manifestName.sig"
        $changed = git status --porcelain
        if ($changed) {
          $commitMessage = if ($manifestName -eq "manifest.json") {
            "chore: refresh plugin market manifest"
          } else {
            "chore: refresh nightly plugin market manifest"
          }
          git commit -m $commitMessage
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit $manifestName in the plugins repository." }
          git push
          if ($LASTEXITCODE -ne 0) { throw "Failed to push $manifestName to the plugins repository." }
        } else {
          Write-Host "$manifestName unchanged; nothing to commit"
        }
        $manifestCommit = (git rev-parse HEAD).Trim()
        if ($manifestCommit -notmatch '^[0-9a-f]{40}$') {
          throw "Invalid plugin manifest commit: $manifestCommit"
        }
        if ($manifestName -eq "nightly-manifest.json") {
          $nightlyTagRefspecs = @()
          $manifest = Get-Content -Raw -LiteralPath $manifestName | ConvertFrom-Json
          foreach ($entry in @($manifest.entries)) {
            $pluginId = [string]$entry.pluginId
            if ($pluginId -notmatch '^[a-z0-9]+(?:-[a-z0-9]+)*$') {
              throw "Invalid Nightly plugin id: $pluginId"
            }
            $nightlyTag = "$pluginId-nightly"
            git tag -f $nightlyTag HEAD
            if ($LASTEXITCODE -ne 0) { throw "Failed to prepare Nightly tag $nightlyTag." }
            $nightlyTagRefspecs += "+refs/tags/${nightlyTag}:refs/tags/${nightlyTag}"
          }
          if ($nightlyTagRefspecs.Count -eq 0) {
            throw "Nightly manifest contains no plugin entries."
          }
          & git push --atomic origin @nightlyTagRefspecs
          if ($LASTEXITCODE -ne 0) { throw "Failed to advance Nightly plugin tags." }
        }
        [System.IO.File]::AppendAllText(
          $env:GITHUB_OUTPUT,
          "manifest_commit=$manifestCommit`n",
          (New-Object System.Text.UTF8Encoding($false)))
