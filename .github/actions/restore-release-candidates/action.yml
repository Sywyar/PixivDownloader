name: Restore verified release candidates
description: Reuse unsigned plugin outputs from this run and source SHA after the complete quality gate
runs:
  using: composite
  steps:
    - name: Download this run's release candidates
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-candidates-${{ github.sha }}
        path: build/release-candidates
    - name: Verify source, run and every candidate digest
      shell: pwsh
      run: ./scripts/ci/release-build-candidates.ps1 -Mode Import -Directory build/release-candidates
