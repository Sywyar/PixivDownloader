name: Verify SDK consumers
description: Validate isolated consumers and both plugin modes against the frozen SDK
inputs:
  source_sha:
    description: Exact source commit recorded in the SDK artifacts
    required: true
  scope:
    description: Consumer group (all, templates, incremental or build-tools)
    required: false
    default: all
runs:
  using: composite
  steps:
    - name: Verify integrated SDK and isolated consumers
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CONSUMER_SCOPE: ${{ inputs.scope }}
      run: |
        set -euo pipefail
        case "$CONSUMER_SCOPE" in
          all|templates|incremental|build-tools) ;;
          *) echo "Unsupported consumer scope: $CONSUMER_SCOPE" >&2; exit 1 ;;
        esac
        sdk_version="$(node scripts/ci/sdk-version.mjs --repo-root . --json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')"
        if [ "$CONSUMER_SCOPE" != build-tools ]; then
          node scripts/ci/sdk-consumer.mjs --repo-root . --scope "$CONSUMER_SCOPE" \
            --sdk-zip "target/sdk-release/PixivDownloader-Plugin-SDK-$sdk_version.zip" \
            --sdk-repository target/sdk-staging --work-dir target/sdk-staged-consumer
        fi
        if [ "$CONSUMER_SCOPE" = all ] || [ "$CONSUMER_SCOPE" = build-tools ]; then
          node scripts/ci/sdk-build-tools.mjs --sdk-repository target/sdk-staging \
            --sdk-zip "target/sdk-release/PixivDownloader-Plugin-SDK-$sdk_version.zip" \
            --sbt-launcher target/sbt-launch.jar
        fi

    - name: Run both SDK plugin modes with the fixed complete host
      if: inputs.scope == 'all' || inputs.scope == 'templates'
      shell: pwsh
      run: |
        $release = Get-Content -Raw -Encoding UTF8 target/sdk-release/sdk-release.json | ConvertFrom-Json
        ./scripts/ci/sdk-runtime-consumer.ps1 -BuiltProject target/sdk-staged-consumer/project `
          -WorkDirectory target/sdk-host-consumer `
          -RuntimeArchive (Join-Path target/sdk-release $release.developmentRuntime.archive.file) `
          -TestRepositoryConfig build/sdk-development-runtime/ci-repository.yaml

    - name: Verify standalone plugin templates
      if: inputs.scope == 'all' || inputs.scope == 'build-tools'
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -euo pipefail
        tools="$GITHUB_WORKSPACE/target/sdk-tools.jar"
        mvn -B -ntp -f plugin-templates/pom.xml verify "-Dpixivdownload.source.sha=$SOURCE_SHA" \
          "-Dpixivdownload.sdk.tools=$tools"
        node --input-type=module -e 'import { verifyTypedServiceArtifacts } from "./scripts/ci/sdk-consumer.mjs"; verifyTypedServiceArtifacts("plugin-templates/typed-service-plugin", process.argv[1]);' "$tools"
        node scripts/ci/sdk-remote.mjs plugin-templates/typed-service-plugin

    - name: Verify single SDK dependency across build tools
      if: inputs.scope == 'all' || inputs.scope == 'build-tools'
      shell: bash
      run: |
        node scripts/ci/sdk-build-tools.mjs --sdk-repository target/sdk-staging --sbt-launcher target/sbt-launch.jar
