name: Publish verified SDK
description: Sign and publish verified SDK inputs, then validate public consumers
inputs:
  sdk_candidate_id:
    description: Immutable SDK candidate artifact ID from the complete Quality Gate
    required: true
  maven_gpg_private_key:
    description: Maven Central signing key
    required: true
  plugin_signing_private_key_pem_base64:
    description: Official plugin signing key
    required: true
runs:
  using: composite
  steps:
    - name: Set up JDK 17 and Maven Central signing
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        verify-signature: true
        distribution: temurin
        java-version: '17'
        cache: maven
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_PASSWORD
        gpg-private-key: ${{ inputs.maven_gpg_private_key }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Set up Node.js 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'
        cache: npm

    - name: Check immutable publication state
      id: state
      shell: bash
      run: |
        set -euo pipefail
        group_path="io/github/sywyar/pixivdownloader"
        sdk_modules="$(node scripts/ci/sdk-version.mjs --modules)"
        IFS=, read -r -a artifacts <<< "$sdk_modules"
        central_count=0
        for artifact in "${artifacts[@]}"; do
          url="$CENTRAL_BASE_URL/$group_path/$artifact/$SDK_VERSION/$artifact-$SDK_VERSION.pom"
          status="$(curl --retry 3 --retry-all-errors -sS -o /dev/null -w '%{http_code}' "$url")"
          case "$status" in
            200) central_count=$((central_count + 1)) ;;
            404) ;;
            *) echo "cannot prove Maven Central state for $artifact: HTTP $status" >&2; exit 1 ;;
          esac
        done
        if [ "$central_count" -ne 0 ] && [ "$central_count" -ne "${#artifacts[@]}" ]; then
          echo "Maven Central exposes only part of SDK $SDK_VERSION; inspect the original Central deployment and wait for all coordinates before recovery. No upload will be attempted." >&2
          exit 1
        fi

        tag_exists=false
        github_exists() {
          local response
          if response="$(gh api "$1" 2>&1)"; then return 0; fi
          if [[ "$response" == *"HTTP 404"* ]]; then return 1; fi
          echo "$response" >&2
          exit 1
        }
        if github_exists "repos/$SDK_REPOSITORY/git/ref/tags/$RELEASE_ID"; then tag_exists=true; fi
        releases="$(gh api --paginate --slurp "repos/$SDK_REPOSITORY/releases?per_page=100" | \
          node -e 'const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8")); process.stdout.write(JSON.stringify(pages.flat().filter(release => release.tag_name === process.env.RELEASE_ID)))')"
        release_count="$(node -pe 'JSON.parse(process.argv[1]).length' "$releases")"
        [ "$release_count" -le 1 ] || { echo 'Duplicate SDK release identity' >&2; exit 1; }
        reuse_release=false
        published=false
        if [ "$release_count" -eq 1 ]; then
          reuse_release=true
          published="$(node -pe '!JSON.parse(process.argv[1])[0].draft' "$releases")"
        fi

        if [ "$PUBLICATION_MODE" != publish ] && [ "$PUBLICATION_MODE" != recover-release ]; then
          echo "unsupported publication mode: $PUBLICATION_MODE" >&2
          exit 1
        fi
        publish_central=false
        if [ "$central_count" -eq "${#artifacts[@]}" ]; then
          if [ "$reuse_release" = false ]; then
            echo "release recovery requires the original frozen SDK Release" >&2
            exit 1
          fi
          echo "Central is complete; restore and verify the original signed SDK assets without redeploying."
        elif [ "$reuse_release" = true ]; then
          echo "SDK $RELEASE_ID already has frozen assets but Central is not publicly readable. A previous upload may still be processing; inspect its deployment ID before retrying. No upload will be attempted." >&2
          exit 1
        elif [ "$PUBLICATION_MODE" = recover-release ] || [ "$tag_exists" = true ]; then
          echo "SDK publication state is incomplete: recovery requires complete Central artifacts and the original frozen SDK Release" >&2
          exit 1
        else
          publish_central=true
        fi
        echo "reuse_release=$reuse_release" >> "$GITHUB_OUTPUT"
        echo "published=$published" >> "$GITHUB_OUTPUT"
        echo "publish_central=$publish_central" >> "$GITHUB_OUTPUT"

    - name: Install Node.js dependencies
      shell: bash
      run: npm ci

    - name: Require SDK candidate from this quality gate
      if: ${{ steps.state.outputs.reuse_release == 'false' }}
      env:
        SDK_CANDIDATE_ID: ${{ inputs.sdk_candidate_id }}
      shell: bash
      run: |
        if ! [[ "$SDK_CANDIDATE_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "Missing verified SDK candidate; rerun the full workflow for this source commit." >&2
          exit 1
        fi

    - name: Restore SDK candidate verified by this run
      if: ${{ steps.state.outputs.reuse_release == 'false' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.sdk_candidate_id }}
        path: target/sdk-publication-inputs
        merge-multiple: true

    - name: Restore exact SDK build inputs
      if: ${{ steps.state.outputs.reuse_release == 'false' }}
      shell: bash
      run: node scripts/ci/sdk-publication-inputs.mjs restore "$GITHUB_SHA"

    - name: Restore original frozen SDK Release
      if: ${{ steps.state.outputs.reuse_release == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p target/sdk-release
        gh release download "$RELEASE_ID" --repo "$SDK_REPOSITORY" --dir target/sdk-release
        cd target/sdk-release
        for file in *.zip sdk-release.json SHA256SUMS; do
          gpg --batch --verify "$file.asc" "$file"
        done
        cd "$GITHUB_WORKSPACE"
        node scripts/ci/sdk-release.mjs --verify-directory target/sdk-release --source-sha "$GITHUB_SHA"

    - name: Build signature verifier for frozen consumers
      shell: bash
      run: mvn -B -ntp -pl pixivdownload-plugin-signature package -DskipTests -Dexec.skip=true

    - name: Sign verified plugin bytes with the official release key
      if: ${{ steps.state.outputs.reuse_release == 'false' }}
      shell: pwsh
      env:
        PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64: ${{ inputs.plugin_signing_private_key_pem_base64 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $inputs = Get-Content -Raw -Encoding UTF8 target/sdk-publication-inputs/inputs.json | ConvertFrom-Json
        $signatures = @(Get-ChildItem pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-*.jar -File)
        if ($signatures.Count -ne 1) { throw 'Expected one signature tool JAR.' }
        $key = Join-Path $env:RUNNER_TEMP 'sdk-plugin-signing.pem'
        try {
          if ([string]::IsNullOrWhiteSpace($env:PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64)) { throw 'Missing official plugin signing key.' }
          [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64))
          ./scripts/assemble-plugin-distribution.ps1 -Version $inputs.hostVersion `
            -PrebuiltJar target/sdk-runtime-inputs/host.jar -PrebuiltPluginsDir target/sdk-runtime-inputs/plugins `
            -SignatureToolJar $signatures[0].FullName -OfficialKeyId pixivdownloader-official-root-2026-07 `
            -PrivateKeyFile $key -OutputDir build/sdk-signed-inputs
        } finally { if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force } }

    - name: Assemble and verify SDK with officially signed runtime
      if: ${{ steps.state.outputs.reuse_release == 'false' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        host_version="$(node -pe 'JSON.parse(require("fs").readFileSync("target/sdk-publication-inputs/inputs.json","utf8")).hostVersion')"
        signatures=(pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-*.jar)
        [ "${#signatures[@]}" -eq 1 ]
        node scripts/ci/sdk-runtime.mjs --repo-root . --source-sha "$GITHUB_SHA" \
          --host-version "$host_version" --host-jar target/sdk-runtime-inputs/host.jar \
          --plugins-directory build/sdk-signed-inputs/plugins --signature-tool "${signatures[0]}"
        node scripts/ci/sdk-release.mjs --repo-root . --output target/sdk-release --source-sha "$GITHUB_SHA" \
          --runtime-manifest build/sdk-development-runtime/sdk-runtime.json --tools-jar target/sdk-tools.jar
        node scripts/ci/sdk-consumer.mjs --repo-root . \
          --sdk-zip "target/sdk-release/PixivDownloader-Plugin-SDK-$SDK_VERSION.zip" \
          --sdk-repository target/sdk-staging --work-dir target/sdk-signed-consumer

    - name: Verify officially signed runtime before freezing release
      if: ${{ steps.state.outputs.reuse_release == 'false' }}
      shell: pwsh
      run: |
        $release = Get-Content -Raw -Encoding UTF8 target/sdk-release/sdk-release.json | ConvertFrom-Json
        ./scripts/ci/sdk-runtime-consumer.ps1 -BuiltProject target/sdk-signed-consumer/project `
          -WorkDirectory target/sdk-signed-host-consumer `
          -RuntimeArchive (Join-Path target/sdk-release $release.developmentRuntime.archive.file)

    - name: Freeze signed SDK assets before Central publication
      if: ${{ steps.state.outputs.reuse_release == 'false' }}
      shell: bash
      run: |
        set -euo pipefail
        node scripts/ci/sdk-release.mjs --verify-directory target/sdk-release --source-sha "$GITHUB_SHA"
        cd target/sdk-release
        files=(*.zip sdk-release.json SHA256SUMS)
        for file in "${files[@]}"; do
          printf '%s' "$MAVEN_GPG_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$file"
        done
        notes="$RUNNER_TEMP/sdk-release-notes.md"
        cat > "$notes" <<EOF
        PixivDownloader Plugin SDK $SDK_VERSION

        Source: https://github.com/Sywyar/PixivDownloader/commit/$GITHUB_SHA
        Maven SDK: io.github.sywyar.pixivdownloader:pixivdownload-sdk:$SDK_VERSION
        Javadocs: docs/javadocs/index.html in the SDK archive
        The separate full-offline runtime is fixed to this SDK release.
        EOF
        args=(--repo "$SDK_REPOSITORY" --title "$RELEASE_ID" --notes-file "$notes" --draft --target master)
        if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
        # 恢复时校验原始冻结附件，缺失或冲突直接失败，禁止覆盖。
        gh release create "$RELEASE_ID" "${args[@]}" "${files[@]}" ./*.asc

    - name: Verify uploaded candidate before Central publication
      if: ${{ steps.state.outputs.reuse_release == 'false' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p target/sdk-frozen-download
        gh release download "$RELEASE_ID" --repo "$SDK_REPOSITORY" --dir target/sdk-frozen-download
        cd target/sdk-frozen-download
        for file in *.zip sdk-release.json SHA256SUMS; do
          gpg --batch --verify "$file.asc" "$file"
        done
        cmp sdk-release.json ../sdk-release/sdk-release.json
        cd "$GITHUB_WORKSPACE"
        node scripts/ci/sdk-release.mjs --verify-directory target/sdk-frozen-download --source-sha "$GITHUB_SHA"

    - name: Publish SDK artifacts to Maven Central
      if: ${{ steps.state.outputs.publish_central == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        sdk_modules="$(node scripts/ci/sdk-version.mjs --modules)"
        ./mvnw -B -ntp -V -P sdk-central -pl "$sdk_modules" deploy \
          -DskipTests -Dexec.skip=true -Dpixivdownload.source.sha="$GITHUB_SHA"

    - name: Download and verify public Maven artifacts
      shell: bash
      run: |
        set -euo pipefail
        repository="$GITHUB_WORKSPACE/target/sdk-public-central"
        rm -rf "$repository"
        group_path="io/github/sywyar/pixivdownloader"
        sdk_modules="$(node scripts/ci/sdk-version.mjs --modules)"
        IFS=, read -r -a artifacts <<< "$sdk_modules"
        for attempt in $(seq 1 30); do
          available=true
          for artifact in "${artifacts[@]}"; do
            url="$CENTRAL_BASE_URL/$group_path/$artifact/$SDK_VERSION/$artifact-$SDK_VERSION.pom"
            if ! curl --retry 2 --retry-all-errors -fsS -o /dev/null "$url"; then available=false; break; fi
          done
          if [ "$available" = true ]; then break; fi
          if [ "$attempt" -eq 30 ]; then echo "SDK coordinates are not publicly readable from Maven Central" >&2; exit 1; fi
          sleep 20
        done

        for artifact in "${artifacts[@]}"; do
          target="$repository/$group_path/$artifact/$SDK_VERSION"
          mkdir -p "$target"
          suffixes=(.pom)
          if [ "$artifact" != "pixivdownload-sdk-bom" ]; then
            suffixes+=(.jar -sources.jar -javadoc.jar)
          fi
          for suffix in "${suffixes[@]}"; do
            name="$artifact-$SDK_VERSION$suffix"
            base="$CENTRAL_BASE_URL/$group_path/$artifact/$SDK_VERSION/$name"
            curl --retry 5 --retry-all-errors -fsSLo "$target/$name" "$base"
            curl --retry 5 --retry-all-errors -fsSLo "$target/$name.asc" "$base.asc"
            curl --retry 5 --retry-all-errors -fsSLo "$target/$name.sha256" "$base.sha256"
            expected="$(awk '{print $1}' "$target/$name.sha256")"
            actual="$(sha256sum "$target/$name" | awk '{print $1}')"
            [ "$expected" = "$actual" ] || { echo "Central checksum mismatch: $name" >&2; exit 1; }
            gpg --batch --verify "$target/$name.asc" "$target/$name"
          done
          node -e '
            const fs = require("node:fs");
            const pom = fs.readFileSync(process.argv[1], "utf8");
            const expected = `<tag>${process.argv[2]}</tag>`;
            if (!pom.includes(expected)) throw new Error(`Central POM does not identify ${process.argv[2]}`);
          ' "$target/$artifact-$SDK_VERSION.pom" "$GITHUB_SHA"
        done

    - name: Verify frozen SDK against public Central
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        node scripts/ci/sdk-consumer.mjs --repo-root . \
          --sdk-zip "target/sdk-release/PixivDownloader-Plugin-SDK-$SDK_VERSION.zip" \
          --sdk-repository target/sdk-public-central --work-dir target/sdk-frozen-public-consumer

    - name: Verify frozen runtime with both current plugins
      shell: pwsh
      run: |
        $release = Get-Content -Raw -Encoding UTF8 target/sdk-release/sdk-release.json | ConvertFrom-Json
        ./scripts/ci/sdk-runtime-consumer.ps1 -BuiltProject target/sdk-frozen-public-consumer/project `
          -WorkDirectory target/sdk-frozen-host-consumer `
          -RuntimeArchive (Join-Path target/sdk-release $release.developmentRuntime.archive.file)

    - name: Publish the verified frozen SDK Release
      if: ${{ steps.state.outputs.published == 'false' }}
      shell: bash
      run: gh release edit "$RELEASE_ID" --repo "$SDK_REPOSITORY" --draft=false

    - name: Verify public SDK Release and clean consumer
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        public_release="$GITHUB_WORKSPACE/target/sdk-public-release"
        rm -rf "$public_release"
        mkdir -p "$public_release"
        gh release download "$RELEASE_ID" --repo "$SDK_REPOSITORY" --dir "$public_release"
        cd "$public_release"
        for file in *.zip sdk-release.json SHA256SUMS; do
          gpg --batch --verify "$file.asc" "$file"
        done
        cd "$GITHUB_WORKSPACE"
        node scripts/ci/sdk-release.mjs --verify-directory "$public_release" --source-sha "$GITHUB_SHA"
        node scripts/ci/sdk-consumer.mjs --repo-root . \
          --sdk-zip "$public_release/PixivDownloader-Plugin-SDK-$SDK_VERSION.zip" \
          --sdk-repository target/sdk-public-central --work-dir target/sdk-public-consumer

    - name: Verify first SDK runtime download from the public Release
      shell: pwsh
      run: |
        ./scripts/ci/sdk-runtime-consumer.ps1 -BuiltProject target/sdk-public-consumer/project `
          -WorkDirectory target/sdk-public-host-consumer
