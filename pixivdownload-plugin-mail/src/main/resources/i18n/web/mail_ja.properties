plugin.name=メール通知
plugin.summary=SMTP メール通知の送信とテンプレート。
gui.config.notification.service.label=通知サービス
gui.config.notification.hint=有効にしたサービスはすべて同時に有効になります。プルダウンは編集対象のサービス切り替えにのみ使用します
gui.config.notification.service.help=編集する通知サービスをプルダウンで選択します。有効なサービスはすべて同時に通知を送信します
gui.config.notification.service.mail=メール / SMTP
gui.config.field.mail.enabled.label=メール送信を有効にする
gui.config.field.mail.enabled.help=無効にするとすべてのメール送信をスキップします。有効にすると、資格情報ポリシーの一時停止や資格情報の利用不能など、手動対応が必要なイベントが発生した際に、スケジュールタスクがこの経路で管理者へ通知します
gui.config.field.mail.host.label=SMTP ホスト
gui.config.field.mail.host.help=smtp.163.com / smtp.qq.com など。左上の「サービスプロバイダーのプリセット」を選ぶと自動入力されます
gui.config.field.mail.port.label=SMTP ポート
gui.config.field.mail.port.help=既定値は587。SSL は通常465、STARTTLS は通常587です
gui.config.field.mail.security.label=暗号化方式
gui.config.field.mail.security.help=none = 平文（ローカル／内部ネットワークのテストのみ）。ssl = TCP 全体を TLS で包む（SMTPS、通常465）。starttls = 平文接続を TLS に昇格（通常587）
gui.config.field.mail.username.label=SMTP ユーザー名
gui.config.field.mail.username.help=通常は完全なメールアドレスです
gui.config.field.mail.password.label=SMTP パスワード / 認証コード
gui.config.field.mail.password.help=注意：多くのメールサービスはログインパスワードを受け付けません。メールサイトで「認証コード／アプリパスワード／クライアント専用パスワード」を申請してください。パスワードがログやメール本文に表示されることはありません
gui.config.field.mail.from.label=送信者メールアドレス
gui.config.field.mail.from.help=空欄の場合は SMTP ユーザー名を使用します
gui.config.field.mail.to.label=受信者メールアドレス
gui.config.field.mail.to.help=カンマ区切りで複数の受信者を指定できます
gui.config.field.mail.socks-proxy.label=SOCKS プロキシ
gui.config.field.mail.socks-proxy.help=任意。host:port（例：127.0.0.1:1080）形式。ネットワーク環境で SMTP が遮断される場合に使用します。既存の HTTP プロキシは SMTP を処理しないため、ここでは独立して設定します
gui.config.field.mail.subject-prefix.label=メール件名の接頭辞
gui.config.field.mail.subject-prefix.help=テンプレートのタイトルの前に付け、クライアントで絞り込みやすくします。既定値は [PixivDownloader]
gui.config.mail.preset.label=サービスプロバイダーのプリセット
gui.config.mail.preset.help=選択するとホスト、ポート、暗号化方式が自動入力されて固定されます。標準以外のポートを使う場合は「カスタム」を選択してください
gui.config.mail.test-button.label=テストメールを送信
gui.config.mail.test-button.help=現在のフォーム設定（保存不要）で受信者へ「メール設定に成功しました」というメールを送信します。受信できれば SMTP 設定が有効です
gui.config.mail.test.notice.sending=テストメールを送信しています。しばらくお待ちください…
gui.config.mail.test.notice.success=テストメールを送信しました。受信者のメールボックスを確認してください
gui.config.mail.test.notice.failed=テストメールの送信に失敗しました。詳細はログを確認してください
gui.config.mail.test.notice.unreachable=バックエンドサービスに接続できません。サービスが実行中か確認してください
gui.config.mail.test-all.button.label=すべてのメールテンプレートを送信
gui.config.mail.test-all.button.help=サンプルデータを使って、すべての通知メールテンプレートを順番に送信します。すべてのメールの見た目を一度に確認できます
gui.config.mail.test-all.notice.sending=すべてのメールテンプレートを順番に送信しています。しばらくお待ちください…
gui.config.mail.test-all.notice.success=すべてのメールテンプレート（{0}通）を送信しました。受信者のメールボックスを確認してください
gui.config.mail.test-all.notice.partial=メールテンプレートを {0} / {1} 通送信しました。一部に失敗しています：{2}
mail.preset.name.netease-163=163 メール（smtp.163.com）
mail.preset.name.netease-126=126 メール（smtp.126.com）
mail.preset.name.netease-yeah=NetEase yeah.net（smtp.yeah.net）
mail.preset.name.qq=QQ メール（smtp.qq.com）
mail.preset.name.sina=Sina メール（smtp.sina.com）
mail.preset.name.gmail=Gmail（個人）
mail.preset.name.outlook=Outlook.com（個人）
mail.preset.name.icloud=iCloud
mail.preset.name.yahoo=Yahoo
mail.preset.name.netease-qiye=NetEase 企業メール
mail.preset.name.tencent-exmail=Tencent 企業メール
mail.preset.name.aliyun-qiye=Alibaba Cloud 企業メール
mail.preset.name.ms365=Microsoft 365（企業）
mail.preset.name.google-workspace=Gmail / Workspace（企業）
mail.preset.name.custom=カスタム
mail.preset.help.authcode=⚠️ 中国国内の主要なメールサービス（163 / 126 / yeah / QQ / Sina）は通常ログインパスワードを拒否します。メールサイトの「設定 → アカウント → クライアント認証コード／サードパーティー認証コード」で専用の認証コードを申請し、SMTP パスワードとして使用してください。
mail.preset.help.app-password=⚠️ 個人メール（Gmail / Outlook.com / iCloud / Yahoo）は通常、2段階認証を有効にしてから「アプリパスワード（App Password）」を生成し、SMTP パスワードとして使用する必要があります。通常のログインパスワードは使えません。
mail.preset.help.netease-qiye=⚠️ NetEase 企業メールではクライアント認証コードが必要です。SMTP アドレスは開設時期によって異なる場合があります（smtphz.qiye.163.com を使うテナントもあります）。送信に失敗した場合は、企業メール管理画面で実際のアドレスを確認してください。
mail.preset.help.tencent-exmail=⚠️ Tencent 企業メールでは、管理者画面または個人設定で SMTP を有効にし、「クライアント専用パスワード」を SMTP パスワードとして使用する必要があります。
mail.preset.help.aliyun-qiye=⚠️ Alibaba Cloud 企業メールでは、メール設定で「サードパーティークライアント用セキュリティパスワード」を有効にし、ログインパスワードではなくそのパスワードを使用してください。
mail.preset.help.ms365=⚠️ Microsoft 365（office365.com）では、2022年10月以降 SMTP AUTH の基本パスワード認証が既定で無効です。管理者がこのメールボックスの SMTP AUTH を明示的に有効にする必要があります。それ以外は OAuth のみ利用できます（本プログラムは現在 OAuth に対応していません）。
mail.preset.help.google-workspace=⚠️ Google Workspace では、2025年5月以降 OAuth ログインが必須となり、基本認証のアプリパスワードは拒否されます。本プログラムは現在 OAuth に対応していないため、企業ユーザーはこのプリセットから直接接続できません。
mail.preset.help.custom=カスタムモード：SMTP ホスト、ポート、暗号化方式を入力してください。パスワード欄には通常、認証コードまたはアプリパスワードを入力します。詳細はメールサービスプロバイダーのドキュメントを確認してください。
