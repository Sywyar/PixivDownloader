plugin.name=메일 알림
plugin.summary=SMTP 메일 알림 전송 및 템플릿.
gui.config.notification.service.label=알림 서비스
gui.config.notification.hint=활성화된 서비스는 동시에 적용되며 드롭다운은 현재 편집할 서비스만 전환합니다.
gui.config.notification.service.help=드롭다운에서 편집할 알림 서비스를 선택하세요. 활성화된 모든 서비스가 동시에 알림을 보냅니다.
gui.config.notification.service.mail=메일 / SMTP
gui.config.field.mail.enabled.label=메일 전송 활성화
gui.config.field.mail.enabled.help=끄면 모든 메일 전송을 건너뛰고, 켜면 자격 증명 정책으로 일시 중지되거나 자격 증명을 사용할 수 없어 수동 개입이 필요한 예약 작업 이벤트를 이 채널로 관리자에게 알립니다.
gui.config.field.mail.host.label=SMTP 호스트
gui.config.field.mail.host.help=smtp.163.com / smtp.qq.com과 같은 주소입니다. 왼쪽 위의 "공급자 사전 설정"을 선택하면 자동으로 입력됩니다.
gui.config.field.mail.port.label=SMTP 포트
gui.config.field.mail.port.help=기본값 587. SSL은 보통 465, STARTTLS는 보통 587입니다.
gui.config.field.mail.security.label=암호화 방식
gui.config.field.mail.security.help=none = 평문(로컬/내부 네트워크 테스트만); ssl = 전체 TCP를 TLS로 감쌈(SMTPS, 보통 465); starttls = 평문 연결 후 TLS로 업그레이드(보통 587)
gui.config.field.mail.username.label=SMTP 사용자 이름
gui.config.field.mail.username.help=일반적으로 전체 이메일 주소입니다.
gui.config.field.mail.password.label=SMTP 비밀번호 / 인증 코드
gui.config.field.mail.password.help=주의: 대부분의 메일 서비스는 로그인 비밀번호를 허용하지 않습니다. 메일 웹사이트에서 "인증 코드 / 앱 전용 비밀번호 / 클라이언트 전용 비밀번호"를 신청해야 합니다. 비밀번호는 로그나 메일 본문에 절대 표시되지 않습니다.
gui.config.field.mail.from.label=발신자 이메일
gui.config.field.mail.from.help=비워 두면 SMTP 사용자 이름을 사용합니다.
gui.config.field.mail.to.label=수신자 이메일
gui.config.field.mail.to.help=쉼표로 여러 수신자를 구분할 수 있습니다.
gui.config.field.mail.socks-proxy.label=SOCKS 프록시
gui.config.field.mail.socks-proxy.help=선택 사항. SMTP가 차단된 네트워크에서 사용하며 host:port 형식(예: 127.0.0.1:1080)입니다. 기존 HTTP 프록시는 SMTP를 전달하지 않으므로 독립적으로 설정합니다.
gui.config.field.mail.subject-prefix.label=메일 제목 접두사
gui.config.field.mail.subject-prefix.help=템플릿 제목 앞에 붙여 클라이언트 필터링을 돕습니다. 기본값 [PixivDownloader]
gui.config.mail.preset.label=공급자 사전 설정
gui.config.mail.preset.help=선택하면 호스트 / 포트 / 암호화 방식을 자동으로 입력하고 잠급니다. 비표준 포트가 필요하면 "사용자 지정"을 선택하세요.
gui.config.mail.test-button.label=테스트 메일 보내기
gui.config.mail.test-button.help=현재 양식 설정으로(먼저 저장할 필요 없음) 수신자에게 "메일 설정 성공" 메일을 보냅니다. 수신하면 SMTP 설정이 적용된 것입니다.
gui.config.mail.test.notice.sending=테스트 메일을 보내는 중입니다. 잠시 기다려 주세요…
gui.config.mail.test.notice.success=테스트 메일을 보냈습니다. 수신자 메일함을 확인하세요.
gui.config.mail.test.notice.failed=테스트 메일 전송 실패. 자세한 내용은 로그를 확인하세요.
gui.config.mail.test.notice.unreachable=백엔드 서비스에 연결할 수 없습니다. 서비스가 실행 중인지 확인하세요.
gui.config.mail.test-all.button.label=모든 메일 템플릿 보내기
gui.config.mail.test-all.button.help=예제 데이터를 사용하여 모든 알림 메일 템플릿을 순서대로 보내 모든 메일 스타일을 한 번에 미리 봅니다.
gui.config.mail.test-all.notice.sending=모든 메일 템플릿을 차례로 보내는 중입니다. 잠시 기다려 주세요…
gui.config.mail.test-all.notice.success=메일 템플릿 {0}개를 모두 보냈습니다. 수신자 메일함을 확인하세요.
gui.config.mail.test-all.notice.partial=메일 템플릿 {0} / {1}개를 보냈으며 일부 실패했습니다: {2}
mail.preset.name.netease-163=163 메일(smtp.163.com)
mail.preset.name.netease-126=126 메일(smtp.126.com)
mail.preset.name.netease-yeah=NetEase yeah.net(smtp.yeah.net)
mail.preset.name.qq=QQ 메일(smtp.qq.com)
mail.preset.name.sina=Sina 메일(smtp.sina.com)
mail.preset.name.gmail=Gmail(개인)
mail.preset.name.outlook=Outlook.com(개인)
mail.preset.name.icloud=iCloud
mail.preset.name.yahoo=Yahoo
mail.preset.name.netease-qiye=NetEase 기업 메일
mail.preset.name.tencent-exmail=Tencent 기업 메일
mail.preset.name.aliyun-qiye=Alibaba Cloud 기업 메일
mail.preset.name.ms365=Microsoft 365(기업)
mail.preset.name.google-workspace=Gmail / Workspace(기업)
mail.preset.name.custom=사용자 지정
mail.preset.help.authcode=⚠️ 중국의 주요 메일 서비스(163 / 126 / yeah / QQ / Sina)는 일반적으로 로그인 비밀번호를 거부합니다. 메일 웹사이트의 "설정 → 계정 → 클라이언트 인증 코드 / 타사 인증 코드"에서 전용 인증 코드를 신청하여 SMTP 비밀번호로 사용하세요.
mail.preset.help.app-password=⚠️ 개인 메일(Gmail / Outlook.com / iCloud / Yahoo)은 일반적으로 2단계 인증을 먼저 활성화한 후 "앱 비밀번호(App Password)"를 생성하여 SMTP 비밀번호로 사용해야 합니다. 일반 로그인 비밀번호는 사용할 수 없습니다.
mail.preset.help.netease-qiye=⚠️ NetEase 기업 메일은 클라이언트 인증 코드를 사용해야 합니다. SMTP 주소는 개설 시기에 따라 다를 수 있으므로(일부 테넌트는 smtphz.qiye.163.com) 전송에 실패하면 기업 메일 관리 콘솔에서 실제 주소를 확인하세요.
mail.preset.help.tencent-exmail=⚠️ Tencent 기업 메일은 관리자 콘솔 또는 개인 설정에서 SMTP를 활성화하고 "클라이언트 전용 비밀번호"를 SMTP 비밀번호로 사용해야 합니다.
mail.preset.help.aliyun-qiye=⚠️ Alibaba Cloud 기업 메일은 메일 설정에서 "타사 클라이언트 보안 비밀번호"를 활성화하고 로그인 비밀번호 대신 해당 비밀번호를 사용해야 합니다.
mail.preset.help.ms365=⚠️ Microsoft 365(office365.com)는 2022-10부터 SMTP AUTH의 기본 비밀번호 인증을 기본적으로 비활성화했습니다. 관리자가 이 사서함에 SMTP AUTH를 명시적으로 활성화해야 하며, 그렇지 않으면 OAuth만 지원됩니다(이 프로그램은 현재 OAuth를 지원하지 않음).
mail.preset.help.google-workspace=⚠️ Google Workspace는 2025-05부터 OAuth 로그인을 강제하며 기본 앱 비밀번호는 거부됩니다. 이 프로그램은 현재 OAuth를 지원하지 않아 기업 사용자는 이 사전 설정으로 직접 연결할 수 없습니다.
mail.preset.help.custom=사용자 지정 모드: SMTP 호스트 / 포트 / 암호화 방식을 직접 입력하세요. 비밀번호 필드에는 일반적으로 인증 코드 / 앱 비밀번호가 필요합니다. 메일 공급자 문서를 확인하세요.
