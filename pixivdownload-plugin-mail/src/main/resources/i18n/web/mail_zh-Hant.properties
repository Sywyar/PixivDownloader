plugin.name=郵件通知
plugin.summary=SMTP 郵件通知傳送與範本。
gui.config.notification.service.label=通知服務
gui.config.notification.hint=已啟用的服務會同時生效；下拉選單僅用於切換目前編輯的服務
gui.config.notification.service.help=從下拉選單選擇要編輯的通知服務；所有已啟用的服務都會同時傳送通知
gui.config.notification.service.mail=郵件／SMTP
gui.config.field.mail.enabled.label=啟用郵件傳送
gui.config.field.mail.enabled.help=停用時會略過所有寄信；啟用後，排程工作在發生憑證策略暫停／憑證無法使用等需要手動介入的事件時，會透過此管道通知管理員
gui.config.field.mail.host.label=SMTP 主機
gui.config.field.mail.host.help=例如 smtp.163.com／smtp.qq.com；選擇左上方的「服務供應商預設值」可自動填入
gui.config.field.mail.port.label=SMTP 連接埠
gui.config.field.mail.port.help=預設 587；SSL 通常使用 465，STARTTLS 通常使用 587
gui.config.field.mail.security.label=加密方式
gui.config.field.mail.security.help=none = 明文（僅限本機／內網測試）；ssl = 整個 TCP 連線由 TLS 包裝（SMTPS，通常為 465）；starttls = 明文連線後升級 TLS（通常為 587）
gui.config.field.mail.username.label=SMTP 使用者名稱
gui.config.field.mail.username.help=通常是完整的電子郵件地址
gui.config.field.mail.password.label=SMTP 密碼／授權碼
gui.config.field.mail.password.help=注意：大多數郵箱不接受登入密碼，需要在郵箱網站申請「授權碼／應用程式專用密碼／用戶端專用密碼」；密碼絕不會出現在日誌或郵件正文中
gui.config.field.mail.from.label=寄件者郵箱
gui.config.field.mail.from.help=留空時會回退使用 SMTP 使用者名稱
gui.config.field.mail.to.label=收件者郵箱
gui.config.field.mail.to.help=支援以逗號分隔多位收件者
gui.config.field.mail.socks-proxy.label=SOCKS 代理伺服器
gui.config.field.mail.socks-proxy.help=可選；格式為 host:port（例如 127.0.0.1:1080），用於網路環境封鎖 SMTP 的情況；既有的 HTTP 代理伺服器不承載 SMTP，因此在此獨立設定
gui.config.field.mail.subject-prefix.label=郵件主旨前綴
gui.config.field.mail.subject-prefix.help=附加在範本標題前，方便用戶端篩選；預設為 [PixivDownloader]
gui.config.mail.preset.label=服務供應商預設值
gui.config.mail.preset.help=選取後會自動填入並鎖定主機／連接埠／加密方式；如需非標準連接埠，請選擇「自訂」
gui.config.mail.test-button.label=傳送測試郵件
gui.config.mail.test-button.help=使用目前表單設定（不需先儲存）向收件者傳送一封「郵件設定成功」郵件；收到即表示 SMTP 設定生效
gui.config.mail.test.notice.sending=正在傳送測試郵件，請稍候…
gui.config.mail.test.notice.success=測試郵件已傳送，請前往收件者郵箱查收
gui.config.mail.test.notice.failed=測試郵件傳送失敗，請查看日誌了解詳情
gui.config.mail.test.notice.unreachable=無法連線至後端服務，請確認服務正在執行
gui.config.mail.test-all.button.label=傳送所有郵件範本
gui.config.mail.test-all.button.help=使用範例資料依序傳送所有通知郵件範本，方便一次預覽所有郵件樣式
gui.config.mail.test-all.notice.sending=正在依序傳送所有郵件範本，請稍候…
gui.config.mail.test-all.notice.success=已傳送全部 {0} 封郵件範本，請前往收件者郵箱查收
gui.config.mail.test-all.notice.partial=已傳送 {0}／{1} 封郵件範本，部分失敗：{2}
mail.preset.name.netease-163=163 郵箱（smtp.163.com）
mail.preset.name.netease-126=126 郵箱（smtp.126.com）
mail.preset.name.netease-yeah=網易 yeah.net（smtp.yeah.net）
mail.preset.name.qq=QQ 郵箱（smtp.qq.com）
mail.preset.name.sina=新浪郵箱（smtp.sina.com）
mail.preset.name.gmail=Gmail（個人）
mail.preset.name.outlook=Outlook.com（個人）
mail.preset.name.icloud=iCloud
mail.preset.name.yahoo=Yahoo
mail.preset.name.netease-qiye=網易企業郵箱
mail.preset.name.tencent-exmail=騰訊企業郵箱
mail.preset.name.aliyun-qiye=阿里雲企業郵箱
mail.preset.name.ms365=Microsoft 365（企業）
mail.preset.name.google-workspace=Gmail／Workspace（企業）
mail.preset.name.custom=自訂
mail.preset.help.authcode=⚠️ 中國大陸常見郵箱（163／126／yeah／QQ／新浪）通常拒絕登入密碼，需要在郵箱網站「設定 → 帳戶 → 用戶端授權碼／第三方授權碼」中申請專用授權碼，作為 SMTP 密碼使用。
mail.preset.help.app-password=⚠️ 個人郵箱（Gmail／Outlook.com／iCloud／Yahoo）通常需要先開啟兩步驟驗證，再產生「應用程式專用密碼（App Password）」作為 SMTP 密碼使用，不能使用一般登入密碼。
mail.preset.help.netease-qiye=⚠️ 網易企業郵箱需要使用用戶端授權碼；SMTP 位址可能因開通時間不同而不同（部分租戶為 smtphz.qiye.163.com），若傳送失敗，請到企業郵箱管理後台核對實際位址。
mail.preset.help.tencent-exmail=⚠️ 騰訊企業郵箱需要在管理員後台或個人設定中開啟 SMTP，並使用「用戶端專用密碼」作為 SMTP 密碼。
mail.preset.help.aliyun-qiye=⚠️ 阿里雲企業郵箱需要在郵箱設定中開啟「第三方用戶端安全密碼」，並使用該密碼而非登入密碼。
mail.preset.help.ms365=⚠️ Microsoft 365（office365.com）自 2022-10 起預設停用 SMTP AUTH 的基本密碼驗證，需要管理員明確為此郵箱開啟 SMTP AUTH；否則只支援 OAuth（本程式目前不支援），基本密碼會被拒絕。
mail.preset.help.google-workspace=⚠️ Google Workspace 自 2025-05 起強制使用 OAuth 登入，基本應用程式密碼會被拒絕；本程式目前不支援 OAuth，企業使用者暫時無法透過此預設值直接連線。
mail.preset.help.custom=自訂模式：請自行填寫 SMTP 主機／連接埠／加密方式。密碼欄位通常需要授權碼／應用程式專用密碼，詳情請參閱您的郵件服務供應商文件。
