mail.template.pending-exhausted.body-para2=请到「计划任务」页面，展开该任务的「🧩 待重试」面板查看详情，并按需操作：确认作品是否真的不可恢复时点击「清除」从隔离表中移除；如认为是瞬时问题，删除后下次发现循环若再次撞到会重新隔离与重试。
