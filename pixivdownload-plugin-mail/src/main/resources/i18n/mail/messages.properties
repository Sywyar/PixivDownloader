# ── overuse-paused：凭证策略要求账号级暂停（外部 id 保持兼容）──────────
mail.template.overuse-paused.subject=⚠️ 凭证策略已暂停计划任务
mail.template.overuse-paused.category=策略暂停
mail.template.overuse-paused.eyebrow=CREDENTIAL POLICY
mail.template.overuse-paused.heading=⚠️ 凭证策略已暂停同账号计划任务
mail.template.overuse-paused.body-para1=凭证策略检测到需要人工确认的账号级事件。为避免在策略风险未确认时继续执行，系统已自动暂停该凭证账号下的计划任务。
mail.template.overuse-paused.body-para2=请到「计划任务」页面查看策略提示，并使用来源插件提供的恢复操作；确认处理方式前请保持任务暂停。
