plugin.name=外部下載自動匯入
plugin.summary=搭配使用者腳本，將 PixivBatchDownloader 此後下載完成的作品自動匯入畫廊，保留原始檔案；首次使用需設定下載目錄。
script.meta.external-download-observer.name=PixivBatchDownloader 自動匯入畫廊
script.meta.external-download-observer.description=首次使用請設定外部下載目錄、啟用 Tampermonkey 使用者腳本權限並重新整理 Pixiv 頁面。此後自動匯入 PixivBatchDownloader 下載完成的插畫、漫畫、動圖和小說；保留原始檔案，不掃描歷史下載。
config.root.label=外部下載目錄
config.root.help=選擇 PixivBatchDownloader 使用的瀏覽器下載根目錄，儲存設定並重新啟動後端。安裝採集腳本後，此目錄內新下載完成的作品會自動加入畫廊；刪除畫廊記錄會保留原始檔案。
error=自動匯入尚未完成，請檢查本機服務與下載目錄。
