plugin.name=外部ダウンロードの自動登録
plugin.summary=連携ユーザースクリプトを使い、PixivBatchDownloader で新たにダウンロードした作品をギャラリーに自動登録します。元ファイルは保持されます。初回のみ保存先の設定が必要です。
script.meta.external-download-observer.name=PixivBatchDownloader ギャラリー自動登録
script.meta.external-download-observer.description=最初に外部ダウンロードフォルダーを設定し、Tampermonkey のユーザースクリプト実行を許可して、Pixiv ページを再読み込みしてください。以後、PixivBatchDownloader でダウンロードが完了したイラスト・漫画・うごイラ・小説を自動登録します。元ファイルは保持され、過去のダウンロードは走査しません。
config.root.label=外部ダウンロードフォルダー
config.root.help=PixivBatchDownloader が使用するブラウザーのダウンロード先ルートフォルダーを選び、設定を保存してバックエンドを再起動してください。収集スクリプトをインストールすると、このフォルダー内で新たにダウンロードが完了した作品がギャラリーに自動登録されます。ギャラリーの記録を削除しても元ファイルは残ります。
error=自動登録が完了していません。ローカルサーバーと保存先を確認してください。
