plugin.name=PixivBatchDownloader 가져오기 지원
plugin.summary=연동 유저스크립트를 사용해 PixivBatchDownloader로 새로 다운로드한 작품을 갤러리에 자동 등록하고 원본은 보존합니다. 처음 사용할 때 다운로드 폴더를 한 번 설정하세요.
script.meta.external-download-observer.name=PixivBatchDownloader 가져오기 지원
script.meta.external-download-observer.description=먼저 외부 다운로드 폴더를 설정하고 Tampermonkey의 유저스크립트 실행을 허용한 뒤 Pixiv 페이지를 새로 고치세요. 이후 PixivBatchDownloader에서 다운로드를 완료한 일러스트, 만화, 애니메이션과 소설을 자동으로 가져옵니다. 원본은 보존되며 이전 다운로드는 검색하지 않습니다.
config.root.label=외부 다운로드 폴더
config.root.help=PixivBatchDownloader에서 사용하는 브라우저 다운로드 루트 폴더를 선택하고 저장한 뒤 백엔드를 다시 시작하세요. 수집 스크립트를 설치하면 이 폴더에서 새로 다운로드가 완료된 작품이 갤러리에 자동으로 추가됩니다. 갤러리 기록을 삭제해도 원본 파일은 보존됩니다.
error=자동 가져오기가 완료되지 않았습니다. 로컬 서버와 다운로드 폴더를 확인하세요.
