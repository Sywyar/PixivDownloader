plugin.name=外部下载自动导入
plugin.summary=配合油猴脚本，将 PixivBatchDownloader 此后下载完成的作品自动导入画廊，保留原文件；首次使用需配置下载目录。
script.meta.external-download-observer.name=PixivBatchDownloader 自动导入画廊
script.meta.external-download-observer.description=首次使用请配置外部下载目录、启用油猴用户脚本权限并刷新 Pixiv 页面。此后自动导入 PixivBatchDownloader 下载完成的插画、漫画、动图和小说；保留原文件，不扫描历史下载。
config.root.label=外部下载目录
config.root.help=选择 PixivBatchDownloader 使用的浏览器下载根目录，保存并重启后端。安装采集脚本后，此目录内新下载完成的作品会自动加入画廊；删除画廊记录保留原文件。
error=自动导入未完成，请检查本机服务和下载目录。
