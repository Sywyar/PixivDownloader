plugin.name=External download auto import
plugin.summary=Use the companion userscript to automatically add new PixivBatchDownloader downloads to the gallery while keeping the originals. Configure the download directory once before use.
script.meta.external-download-observer.name=PixivBatchDownloader gallery auto import
script.meta.external-download-observer.description=First configure the external download directory, allow Tampermonkey to run userscripts and refresh Pixiv. New illustrations, manga, animations and novels completed by PixivBatchDownloader are then imported automatically. Original files are kept; past downloads are not scanned.
config.root.label=External download directory
config.root.help=Select the browser download root used by PixivBatchDownloader, save and restart the backend. After installing the collector userscript, newly completed downloads in this directory are added to the gallery automatically. Deleting gallery records keeps the original files.
error=Automatic import did not finish. Check the local server and download directory.
