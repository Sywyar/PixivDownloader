plugin.name=TTS 朗讀
plugin.summary=線上 TTS 與小說朗讀語音引擎。
gui.config.tts.security.notice=自訂 TTS 位址是高權限網路目標；程式會依引擎向其傳送朗讀文字、音色或參考音訊及服務憑證。僅填寫信任的服務（包括本機或內網服務）；含憑證的請求不會跟隨 HTTP 重新導向
listen=🎧 聽書
play=播放
pause=暫停
prev=上一段
next=下一段
stop=停止
settings=朗讀設定
close=關閉
seek=點選跳轉到對應段落
engine=引擎
engine.browser=瀏覽器（離線）
engine.edge=線上（Edge 神經語音）
engine.narration=豐富情感朗讀（多角色・beta）
engine.narration-debug=豐富情感朗讀（多角色・beta・除錯）
narration-degraded=豐富情感朗讀暫時無法使用，已切換為{engine}
voice=語音
rate=語速
synthesizing=合成中… {cur}/{total}
no-content=沒有可朗讀的內文
browser-unsupported=目前瀏覽器不支援內建語音朗讀
hint.browser=瀏覽器引擎：完全離線、即時、免費；音質與可用語言取決於系統已安裝的語音套件。
hint.edge=線上引擎（Edge 神經語音）：音質自然、語言豐富、免費；需要連線（經後端代理），有輕微合成延遲。
hint.narration=豐富情感朗讀（beta，可用但尚不穩定）：由後端 AI 將整章逐句歸屬至說話者，每個角色使用固定音色，經豐富情感引擎逐句合成多角色有聲書；需要在後端設定朗讀引擎（僅管理員可用）。首次播放才會觸發分析，可在「朗讀分析設定 → 朗讀角色表」中編輯各角色音色、處理衝突。
hint.narration-debug=除錯模式：豐富情感朗讀引擎目前無法使用，允許選取本引擎僅用於執行分析、檢視說話者與音色結果；逐句語音合成會失敗。
gui.config.tts.modality.label=模態
gui.config.tts.modality.help=選擇要設定的 AI 模態：「文字模型」是通用大型語言模型（OpenAI 相容，供翻譯／聽小說劇本分析等使用）；「TTS 模型」是多角色聽小說朗讀的語音合成引擎（beta，可用但尚不穩定）。兩類設定會同時儲存並生效，下拉選單僅切換目前編輯項目
gui.config.tts.modality.tts=TTS 模型（beta）
gui.config.field.narration-tts.engine.label=朗讀引擎
gui.config.field.narration-tts.engine.help=多角色朗讀使用的 TTS 引擎；選定後在下方填寫該引擎對應的位址／密鑰等參數
gui.config.field.narration-tts.engine.value.voxcpm=VoxCPM（本機／自託管）
gui.config.field.narration-tts.engine.value.mimo=小米 MiMo（雲端 API）
gui.config.field.narration-tts.engine.value.cosyvoice=CosyVoice（自建）
gui.config.field.narration-tts.engine.value.fish=Fish Audio（雲端 API）
gui.config.field.narration-tts.engine.value.minimax=MiniMax（雲端 API）
gui.config.field.narration-tts.engine.value.elevenlabs=ElevenLabs（雲端 API）
gui.config.field.narration-tts.engine.value.qwen=阿里通義千問 Qwen3-TTS（百煉）
gui.config.field.narration-tts.engine.value.doubao=字節豆包／Seed-TTS（火山引擎）
gui.config.field.narration-tts.voxcpm.base-url.label=VoxCPM 位址
gui.config.field.narration-tts.voxcpm.base-url.help=VoxCPM 的 OpenAI 相容端點，例如 http://127.0.0.1:8000/v1（需要包含 /v1）。VoxCPM 是需要 GPU 的外部服務，請自行以 vllm serve openbmb/VoxCPM2 --omni 啟動，缺少 --omni 不會公開音訊端點；留空則此引擎無法使用
gui.config.field.narration-tts.voxcpm.api-key.label=API Key
gui.config.field.narration-tts.voxcpm.api-key.help=vLLM 預設可留空；絕不會出現在記錄或任何回應中
gui.config.field.narration-tts.voxcpm.model.label=模型
gui.config.field.narration-tts.voxcpm.model.help=VoxCPM 模型名稱，預設 openbmb/VoxCPM2
gui.config.field.narration-tts.voxcpm.voice.label=voice id
gui.config.field.narration-tts.voxcpm.voice.help=OpenAI 相容 /audio/speech 的 voice 欄位，不決定音色（VoxCPM 音色由內嵌描述／參考音訊承載）。VoxCPM 這類 voice-design／複製模型通常沒有任何預設音色（伺服器回報 Invalid voice '...'. Supported: none 即表示預設清單為空），填入任何 voice 值都會被拒絕；因此預設留空＝不傳送此欄位，僅在某個建置明確要求特定 voice 名稱時才填寫
gui.config.field.narration-tts.voxcpm.response-format.label=輸出格式
gui.config.field.narration-tts.voxcpm.response-format.help=音訊輸出格式：wav 或 pcm，預設 wav
gui.config.field.narration-tts.voxcpm.use-proxy.label=使用代理
gui.config.field.narration-tts.voxcpm.use-proxy.help=開啟後此引擎的請求會經由 HTTP 代理（位址取自代理設定的 host:port）；VoxCPM 多為本機／內網服務，通常不需開啟。獨立於全域代理開關
gui.config.field.narration-tts.voxcpm.enable-clone.label=啟用參考音訊複製
gui.config.field.narration-tts.voxcpm.enable-clone.help=開啟後，為角色產生／上傳「標準音／參考音」時使用其音色複製（逐句情緒仍會生效，音色在不同章節間更一致）；關閉則即使已設定參考音訊，也會退回內嵌音色描述
gui.config.field.narration-tts.voxcpm.clone-mode.label=複製模式
gui.config.field.narration-tts.voxcpm.clone-mode.help=設定參考音訊時的複製方式：controllable（可控複製，預設）只傳送參考音訊、保留逐句情緒，複製的音色也能表現情緒；hifi（Hi-Fi 延續）會額外傳送參考音訊轉錄，保真度最高，但會忽略逐句情緒控制，且僅在該角色的參考音訊附有轉錄時生效，否則該句會自動降回可控複製
gui.config.field.narration-tts.voxcpm.max-new-tokens.label=生成 token 上限
gui.config.field.narration-tts.voxcpm.max-new-tokens.help=所有 VoxCPM 合成請求（voice-design 與複製）的生成 token 上限，用於避開 vllm-omni 已知錯誤（停止符可能未觸發而導致無限生成）。0 表示不限制；長句被截斷時可調高——注意調低也會同時套用於一般 voice-design 朗讀與複製，可能截斷較長的句子
gui.config.field.narration-tts.mimo.base-url.label=MiMo 位址
gui.config.field.narration-tts.mimo.base-url.help=小米 MiMo 開放平台的 OpenAI 相容位址，預設 https://api.xiaomimimo.com/v1（引擎會在其後附加 /chat/completions）
gui.config.field.narration-tts.mimo.api-key.label=API Key
gui.config.field.narration-tts.mimo.api-key.help=MiMo API Key（經 api-key 請求標頭傳送，非 Bearer）；絕不會出現在記錄或任何回應中。未設定則此引擎無法使用
gui.config.field.narration-tts.mimo.model.label=預設音色模型
gui.config.field.narration-tts.mimo.model.help=設定「預設音色 id」時使用的模型，預設 mimo-v2.5-tts
gui.config.field.narration-tts.mimo.voice-design-model.label=描述音色模型
gui.config.field.narration-tts.mimo.voice-design-model.help=未設定預設音色時，依角色音色描述產生音色所用的模型，預設 mimo-v2.5-tts-voicedesign
gui.config.field.narration-tts.mimo.voice-clone-model.label=複製音色模型
gui.config.field.narration-tts.mimo.voice-clone-model.help=角色設定參考音訊時，用於複製其音色的模型，預設 mimo-v2.5-tts-voiceclone
gui.config.field.narration-tts.mimo.voice.label=預設音色 id
gui.config.field.narration-tts.mimo.voice.help=填寫後會使用「預設音色模型」與該音色（例如 Chloe／茉莉），並以角色描述微調風格；留空則使用「描述音色模型」依描述產生音色
gui.config.field.narration-tts.mimo.response-format.label=輸出格式
gui.config.field.narration-tts.mimo.response-format.help=音訊輸出格式：wav 或 pcm16，預設 wav
gui.config.field.narration-tts.mimo.use-proxy.label=使用代理
gui.config.field.narration-tts.mimo.use-proxy.help=開啟後此引擎的請求會經由 HTTP 代理（位址取自代理設定的 host:port）；MiMo 為雲端服務，請依需求開啟。獨立於全域代理開關
gui.config.field.narration-tts.mimo.enable-clone.label=啟用參考音訊複製
gui.config.field.narration-tts.mimo.enable-clone.help=開啟後，角色有參考音訊時使用複製模型重現音色；關閉則即使已設定參考音訊，也會退回描述音色
gui.config.field.narration-tts.cosyvoice.base-url.label=CosyVoice 位址
gui.config.field.narration-tts.cosyvoice.base-url.help=CosyVoice 的 OpenAI 相容位址，例如 http://127.0.0.1:8000/v1（引擎會在其後附加 /audio/speech）。CosyVoice 是需要 GPU 的外部服務，請自行部署（vox-box／Xinference 等）；不同部署的欄位名稱略有差異。留空則此引擎無法使用
gui.config.field.narration-tts.cosyvoice.api-key.label=API Key
gui.config.field.narration-tts.cosyvoice.api-key.help=自建服務預設可留空；絕不會出現在記錄或任何回應中
gui.config.field.narration-tts.cosyvoice.model.label=模型
gui.config.field.narration-tts.cosyvoice.model.help=CosyVoice 模型名稱，預設 CosyVoice2-0.5B
gui.config.field.narration-tts.cosyvoice.voice.label=預設音色
gui.config.field.narration-tts.cosyvoice.voice.help=voice-design 時傳送的預設音色／角色（例如中文女）；不同部署的預設名稱不同，留空則不傳送
gui.config.field.narration-tts.cosyvoice.response-format.label=輸出格式
gui.config.field.narration-tts.cosyvoice.response-format.help=音訊輸出格式：wav／mp3／pcm，預設 wav
gui.config.field.narration-tts.cosyvoice.use-proxy.label=使用代理
gui.config.field.narration-tts.cosyvoice.use-proxy.help=開啟後此引擎的請求會經由 HTTP 代理；CosyVoice 多為本機／內網服務，通常不需開啟。獨立於全域代理開關
gui.config.field.narration-tts.cosyvoice.enable-clone.label=啟用參考音訊複製
gui.config.field.narration-tts.cosyvoice.enable-clone.help=開啟後，角色有參考音訊時以 reference_audio 傳送參考音訊來複製音色（自然語言 instruct 仍會控制逐句情緒）；關閉則退回 instruct 描述
gui.config.field.narration-tts.fish.base-url.label=Fish Audio 位址
gui.config.field.narration-tts.fish.base-url.help=Fish Audio 位址，預設 https://api.fish.audio（引擎會在其後附加 /v1/tts）
gui.config.field.narration-tts.fish.api-key.label=API Key
gui.config.field.narration-tts.fish.api-key.help=Fish Audio API Key（Authorization: Bearer）；絕不會出現在記錄或任何回應中。未設定則此引擎無法使用
gui.config.field.narration-tts.fish.model.label=模型
gui.config.field.narration-tts.fish.model.help=Fish 模型（經 model 請求標頭傳送，例如 s1／s2-pro），預設 s1
gui.config.field.narration-tts.fish.reference-id.label=聲音模型 id
gui.config.field.narration-tts.fish.reference-id.help=在 Fish 控制台預先建立／上傳的聲音模型 id（reference_id），決定音色；留空則使用帳戶預設音色。Fish 不支援「純文字描述產生音色」，逐句情緒會以行內標記注入，且本機參考音訊複製必須先在 Fish 端上傳並取得此 id
gui.config.field.narration-tts.fish.format.label=輸出格式
gui.config.field.narration-tts.fish.format.help=音訊輸出格式：mp3／wav／pcm／opus，預設 mp3
gui.config.field.narration-tts.fish.use-proxy.label=使用代理
gui.config.field.narration-tts.fish.use-proxy.help=開啟後此引擎的請求會經由 HTTP 代理（位址取自代理設定的 host:port），獨立於全域代理開關
gui.config.field.narration-tts.minimax.base-url.label=MiniMax 位址
gui.config.field.narration-tts.minimax.base-url.help=MiniMax 位址，預設 https://api.minimax.io/v1（引擎會在其後附加 /t2a_v2；中國大陸站點為 https://api.minimaxi.chat/v1）
gui.config.field.narration-tts.minimax.api-key.label=API Key
gui.config.field.narration-tts.minimax.api-key.help=MiniMax API Key（Authorization: Bearer）；絕不會出現在記錄或任何回應中。未設定則此引擎無法使用
gui.config.field.narration-tts.minimax.group-id.label=GroupId
gui.config.field.narration-tts.minimax.group-id.help=MiniMax 帳戶 GroupId（控制台可見的 19 位數字）；T2A v2 必填，會作為 URL 查詢參數隨請求傳送，並與 API Key 配對，留空則此引擎無法使用
gui.config.field.narration-tts.minimax.model.label=模型
gui.config.field.narration-tts.minimax.model.help=MiniMax 模型名稱，預設 speech-2.8-hd
gui.config.field.narration-tts.minimax.voice-id.label=預設音色 id
gui.config.field.narration-tts.minimax.voice-id.help=MiniMax 預設音色 id（例如 English_expressive_narrator）。MiniMax 沒有逐句自然語言音色通道，必須指定預設音色，留空則此引擎無法使用
gui.config.field.narration-tts.minimax.emotion.label=情緒
gui.config.field.narration-tts.minimax.emotion.help=可選固定情緒：happy／sad／angry／fearful／disgusted／surprised／calm／fluent／whisper；留空則使用模型預設值。引擎會先依逐句情緒關鍵字自動對應，未命中時再退回此設定
gui.config.field.narration-tts.minimax.format.label=輸出格式
gui.config.field.narration-tts.minimax.format.help=音訊輸出格式：mp3／wav／pcm／flac，預設 mp3
gui.config.field.narration-tts.minimax.sample-rate.label=取樣率
gui.config.field.narration-tts.minimax.sample-rate.help=音訊取樣率（Hz），預設 32000
gui.config.field.narration-tts.minimax.use-proxy.label=使用代理
gui.config.field.narration-tts.minimax.use-proxy.help=開啟後此引擎的請求會經由 HTTP 代理（位址取自代理設定的 host:port），獨立於全域代理開關
gui.config.field.narration-tts.elevenlabs.base-url.label=ElevenLabs 位址
gui.config.field.narration-tts.elevenlabs.base-url.help=ElevenLabs 位址，預設 https://api.elevenlabs.io（引擎會在其後附加 /v1/text-to-speech/{voice_id}）
gui.config.field.narration-tts.elevenlabs.api-key.label=API Key
gui.config.field.narration-tts.elevenlabs.api-key.help=ElevenLabs API Key（經 xi-api-key 請求標頭傳送，非 Bearer）；絕不會出現在記錄或任何回應中。未設定則此引擎無法使用
gui.config.field.narration-tts.elevenlabs.model.label=模型
gui.config.field.narration-tts.elevenlabs.model.help=ElevenLabs 模型 id，預設 eleven_v3；行內情緒標籤僅由 v3 解析，舊模型（例如 eleven_multilingual_v2）會將方括號標籤朗讀出來
gui.config.field.narration-tts.elevenlabs.voice-id.label=聲音 id
gui.config.field.narration-tts.elevenlabs.voice-id.help=ElevenLabs 控制台預先建立／複製的聲音 id（voice_id），決定音色；必填，留空則此引擎無法使用。逐句情緒會以行內方括號音訊標籤注入
gui.config.field.narration-tts.elevenlabs.output-format.label=輸出格式
gui.config.field.narration-tts.elevenlabs.output-format.help=音訊輸出格式（查詢參數 output_format，例如 mp3_44100_128／pcm_24000／opus_48000_128），預設 mp3_44100_128
gui.config.field.narration-tts.elevenlabs.use-proxy.label=使用代理
gui.config.field.narration-tts.elevenlabs.use-proxy.help=開啟後此引擎的請求會經由 HTTP 代理（位址取自代理設定的 host:port），獨立於全域代理開關
gui.config.field.narration-tts.qwen.base-url.label=Qwen／DashScope 位址
gui.config.field.narration-tts.qwen.base-url.help=阿里 DashScope（百煉）位址，預設 https://dashscope.aliyuncs.com/api/v1（北京區；國際區為 https://dashscope-intl.aliyuncs.com/api/v1；引擎會在其後附加 /services/aigc/multimodal-generation/generation）
gui.config.field.narration-tts.qwen.api-key.label=API Key
gui.config.field.narration-tts.qwen.api-key.help=DashScope API Key（Authorization: Bearer）；絕不會出現在記錄或任何回應中。未設定則此引擎無法使用
gui.config.field.narration-tts.qwen.model.label=模型
gui.config.field.narration-tts.qwen.model.help=Qwen TTS 模型名稱，預設 qwen3-tts-flash
gui.config.field.narration-tts.qwen.voice.label=預設音色
gui.config.field.narration-tts.qwen.voice.help=預設音色（例如 Cherry／Ryan／Dylan）；留空則使用模型預設值
gui.config.field.narration-tts.qwen.language-type.label=語言提示
gui.config.field.narration-tts.qwen.language-type.help=可選文字語言提示（例如 Chinese／English／Japanese），留空則自動判別；指定後發音／語調會更自然
gui.config.field.narration-tts.qwen.use-proxy.label=使用代理
gui.config.field.narration-tts.qwen.use-proxy.help=開啟後此引擎的請求會經由 HTTP 代理（位址取自代理設定的 host:port），獨立於全域代理開關
gui.config.field.narration-tts.doubao.base-url.label=豆包／火山位址
gui.config.field.narration-tts.doubao.base-url.help=字節火山引擎語音合成位址，預設 https://openspeech.bytedance.com（引擎會在其後附加 /api/v1/tts，HTTP 非串流 query 路徑）
gui.config.field.narration-tts.doubao.app-id.label=App ID
gui.config.field.narration-tts.doubao.app-id.help=火山語音應用程式 appid（語音控制台）
gui.config.field.narration-tts.doubao.access-token.label=Access Token
gui.config.field.narration-tts.doubao.access-token.help=火山語音 access-token（經 Authorization: Bearer;<token> 傳送，含分號）；絕不會出現在記錄或任何回應中。未設定則此引擎無法使用
gui.config.field.narration-tts.doubao.cluster.label=叢集
gui.config.field.narration-tts.doubao.cluster.help=業務叢集，預設 volcano_tts
gui.config.field.narration-tts.doubao.voice-type.label=預設音色 id
gui.config.field.narration-tts.doubao.voice-type.help=火山預設音色 id（voice_type，例如 zh_female_wanqudashu_moon_bigtts）；必填，留空則此引擎無法使用
gui.config.field.narration-tts.doubao.encoding.label=輸出格式
gui.config.field.narration-tts.doubao.encoding.help=音訊編碼／格式：mp3／wav／pcm／ogg_opus，預設 mp3
gui.config.field.narration-tts.doubao.emotion.label=情緒
gui.config.field.narration-tts.doubao.emotion.help=可選固定情緒（例如 happy／sad／angry／scare／hate／surprise／comfort 等火山支援的列舉值），留空則使用模型預設值。引擎會先依逐句情緒關鍵字自動對應，未命中時再退回此設定；僅支援情緒的音色（例如 *_bigtts）會生效
gui.config.field.narration-tts.doubao.use-proxy.label=使用代理
gui.config.field.narration-tts.doubao.use-proxy.help=開啟後此引擎的請求會經由 HTTP 代理（位址取自代理設定的 host:port），獨立於全域代理開關
