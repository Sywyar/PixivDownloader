plugin.name=TTS 読み上げ
plugin.summary=オンライン TTS と小説読み上げ音声エンジン。
gui.config.tts.security.notice=カスタム TTS アドレスは高権限のネットワーク接続先です。プログラムはエンジンに読み上げテキスト、音声または参照音、サービス認証情報を送信します。信頼できるサービス（ローカルまたは内部ネットワークを含む）だけを入力してください。認証情報を含むリクエストは HTTP リダイレクトに追従しません
listen=🎧 オーディオブック
play=再生
pause=一時停止
prev=前の段落
next=次の段落
stop=停止
settings=読み上げ設定
close=閉じる
seek=クリックして該当する段落へ移動
engine=エンジン
engine.browser=ブラウザー（オフライン）
engine.edge=オンライン（Edge ニューラル音声）
engine.narration=表現豊かな読み上げ（複数役 · beta）
engine.narration-debug=表現豊かな読み上げ（複数役 · beta · デバッグ）
narration-degraded=表現豊かな読み上げは現在利用できないため、{engine} に切り替えました
voice=音声
rate=速度
synthesizing=合成中… {cur}/{total}
no-content=読み上げる本文がありません
browser-unsupported=現在のブラウザーは内蔵音声読み上げに対応していません
hint.browser=ブラウザーエンジン：完全オフラインで即時利用でき、無料です。音質と利用可能な言語は、システムにインストールされた音声パッケージによって異なります。
hint.edge=オンラインエンジン（Edge ニューラル音声）：自然な音質で多言語に対応し、無料です。ネットワーク接続が必要で（バックエンドプロキシ経由）、わずかな合成遅延があります。
hint.narration=表現豊かな読み上げ（beta、利用できますがまだ安定していません）：バックエンド AI が章全体を文ごとに話者へ割り当て、各役に固定した音声で表現豊かなエンジンから一文ずつ合成し、複数役のオーディオブックを作ります。バックエンドで読み上げエンジンの設定が必要です（管理者のみ利用可能）。初回再生時に分析が行われます。「読み上げ分析設定 → 読み上げ名簿」で各役の音声を編集したり、競合を処理したりできます。
hint.narration-debug=デバッグモード：表現豊かな読み上げエンジンは現在利用できません。分析の実行と話者 / 音声の結果確認に限り、このエンジンを選択できます。一文ごとの音声合成は失敗します。
gui.config.tts.modality.label=モダリティ
gui.config.tts.modality.help=設定する AI モダリティを選択：「テキストモデル」は汎用大規模言語モデル（OpenAI 互換。翻訳 / オーディオブックの台本分析などに使用）、「TTS モデル」は複数役の小説読み上げ用音声合成エンジン（beta、利用できますがまだ安定していません）です。両方の設定は同時に保存・反映され、ドロップダウンは現在編集する項目だけを切り替えます
gui.config.tts.modality.tts=TTS モデル（beta）
gui.config.field.narration-tts.engine.label=読み上げエンジン
gui.config.field.narration-tts.engine.help=複数役の読み上げで使用する TTS エンジン。選択後、下にそのエンジンのアドレス / キーなどのパラメーターを入力します
gui.config.field.narration-tts.engine.value.voxcpm=VoxCPM（ローカル / 自ホスト）
gui.config.field.narration-tts.engine.value.mimo=Xiaomi MiMo（クラウド API）
gui.config.field.narration-tts.engine.value.cosyvoice=CosyVoice（自前運用）
gui.config.field.narration-tts.engine.value.fish=Fish Audio（クラウド API）
gui.config.field.narration-tts.engine.value.minimax=MiniMax（クラウド API）
gui.config.field.narration-tts.engine.value.elevenlabs=ElevenLabs（クラウド API）
gui.config.field.narration-tts.engine.value.qwen=Alibaba Qwen Qwen3-TTS（DashScope）
gui.config.field.narration-tts.engine.value.doubao=ByteDance Doubao / Seed-TTS（Volcengine）
gui.config.field.narration-tts.voxcpm.base-url.label=VoxCPM アドレス
gui.config.field.narration-tts.voxcpm.base-url.help=VoxCPM の OpenAI 互換エンドポイント。例：http://127.0.0.1:8000/v1（/v1 が必要）。VoxCPM は GPU が必要な外部サービスで、vllm serve openbmb/VoxCPM2 --omni を使って自分で起動します。--omni がないと音声エンドポイントは公開されません。空欄の場合、このエンジンは利用できません
gui.config.field.narration-tts.voxcpm.api-key.label=API Key
gui.config.field.narration-tts.voxcpm.api-key.help=vLLM ではデフォルトで空欄にできます。ログやレスポンスに表示されることはありません
gui.config.field.narration-tts.voxcpm.model.label=モデル
gui.config.field.narration-tts.voxcpm.model.help=VoxCPM モデル名。デフォルトは openbmb/VoxCPM2
gui.config.field.narration-tts.voxcpm.voice.label=voice id
gui.config.field.narration-tts.voxcpm.voice.help=OpenAI 互換 /audio/speech の voice フィールド。音色は決めません（VoxCPM の音色はインライン説明 / 参照音で指定）。VoxCPM のような voice-design / クローンモデルには通常プリセット音色がなく、サーバーの「Invalid voice '...'. Supported: none」はプリセット一覧が空であることを示します。voice を指定すると拒否されるため、デフォルトは空欄にしてこのフィールドを送信しません。特定のビルドで voice 名が必要な場合だけ入力してください
gui.config.field.narration-tts.voxcpm.response-format.label=出力形式
gui.config.field.narration-tts.voxcpm.response-format.help=音声出力形式：wav または pcm。デフォルトは wav
gui.config.field.narration-tts.voxcpm.use-proxy.label=プロキシを使用
gui.config.field.narration-tts.voxcpm.use-proxy.help=有効にすると、このエンジンへのリクエストは HTTP プロキシを経由します（アドレスはプロキシ設定の host:port）。VoxCPM はローカル / 内部ネットワークサービスが多いため、通常は有効にする必要はありません。全体のプロキシスイッチとは独立しています
gui.config.field.narration-tts.voxcpm.enable-clone.label=参照音のクローンを有効化
gui.config.field.narration-tts.voxcpm.enable-clone.help=有効にすると、役の「標準音 / 参照音」を生成 / アップロードするときに音色をクローンします（一文ごとの感情は引き続き有効で、章をまたいだ音色の一貫性が高まります）。無効にすると参照音を設定していてもインライン音色プロファイルに戻ります
gui.config.field.narration-tts.voxcpm.clone-mode.label=クローンモード
gui.config.field.narration-tts.voxcpm.clone-mode.help=参照音がある場合の方式：controllable（制御可能なクローン、デフォルト）は参照音だけを送り、一文ごとの感情を保ったまま音色をクローンします。hifi（Hi-Fi 続き書き）は参照音の文字起こしも送り、忠実度は最高ですが一文ごとの感情制御を無視します。役の参照音に文字起こしがある場合だけ有効で、ない場合はその文だけ自動的に制御可能なクローンに戻ります
gui.config.field.narration-tts.voxcpm.max-new-tokens.label=生成 token 上限
gui.config.field.narration-tts.voxcpm.max-new-tokens.help=すべての VoxCPM 合成リクエスト（voice-design とクローン）の生成 token 上限。vllm-omni の既知のバグ（停止記号が発火せず無限生成する可能性）への安全策です。0 は無制限。長い文が切れる場合は大きくしてください。小さくすると通常の voice-design 読み上げとクローンの両方に作用し、長い文が切れる可能性があります
gui.config.field.narration-tts.mimo.base-url.label=MiMo アドレス
gui.config.field.narration-tts.mimo.base-url.help=Xiaomi MiMo オープンプラットフォームの OpenAI 互換アドレス。デフォルトは https://api.xiaomimimo.com/v1（エンジンが末尾に /chat/completions を付加）
gui.config.field.narration-tts.mimo.api-key.label=API Key
gui.config.field.narration-tts.mimo.api-key.help=MiMo API Key（api-key リクエストヘッダーで送信、Bearer ではない）。ログやレスポンスに表示されません。未設定の場合、このエンジンは利用できません
gui.config.field.narration-tts.mimo.model.label=プリセット音声モデル
gui.config.field.narration-tts.mimo.model.help=「プリセット音声 ID」を設定した場合に使用するモデル。デフォルトは mimo-v2.5-tts
gui.config.field.narration-tts.mimo.voice-design-model.label=音色説明モデル
gui.config.field.narration-tts.mimo.voice-design-model.help=プリセット音声がない場合に役の音色プロファイルから音色を生成するモデル。デフォルトは mimo-v2.5-tts-voicedesign
gui.config.field.narration-tts.mimo.voice-clone-model.label=音色クローンモデル
gui.config.field.narration-tts.mimo.voice-clone-model.help=役に参照音がある場合に音色をクローンするモデル。デフォルトは mimo-v2.5-tts-voiceclone
gui.config.field.narration-tts.mimo.voice.label=プリセット音声 ID
gui.config.field.narration-tts.mimo.voice.help=入力すると「プリセット音声モデル」+ この音色（例：Chloe / 茉莉）を使用し、役のプロファイルでスタイルを微調整します。空欄の場合は「音色説明モデル」でプロファイルから音色を生成します
gui.config.field.narration-tts.mimo.response-format.label=出力形式
gui.config.field.narration-tts.mimo.response-format.help=音声出力形式：wav または pcm16。デフォルトは wav
gui.config.field.narration-tts.mimo.use-proxy.label=プロキシを使用
gui.config.field.narration-tts.mimo.use-proxy.help=有効にすると、このエンジンへのリクエストは HTTP プロキシを経由します（アドレスはプロキシ設定の host:port）。MiMo はクラウドサービスなので、必要に応じて有効にしてください。全体のプロキシスイッチとは独立しています
gui.config.field.narration-tts.mimo.enable-clone.label=参照音のクローンを有効化
gui.config.field.narration-tts.mimo.enable-clone.help=有効にすると、役に参照音がある場合はクローンモデルで音色を再現します。無効にすると参照音を設定していても音色説明に戻ります
gui.config.field.narration-tts.cosyvoice.base-url.label=CosyVoice アドレス
gui.config.field.narration-tts.cosyvoice.base-url.help=CosyVoice の OpenAI 互換アドレス。例：http://127.0.0.1:8000/v1（エンジンが末尾に /audio/speech を付加）。CosyVoice は GPU が必要な外部サービスで、vox-box / Xinference などを使って自分でデプロイします。デプロイ方法によってフィールド名が少し異なります。空欄の場合、このエンジンは利用できません
gui.config.field.narration-tts.cosyvoice.api-key.label=API Key
gui.config.field.narration-tts.cosyvoice.api-key.help=自前サービスではデフォルトで空欄にできます。ログやレスポンスに表示されることはありません
gui.config.field.narration-tts.cosyvoice.model.label=モデル
gui.config.field.narration-tts.cosyvoice.model.help=CosyVoice モデル名。デフォルトは CosyVoice2-0.5B
gui.config.field.narration-tts.cosyvoice.voice.label=プリセット音声
gui.config.field.narration-tts.cosyvoice.voice.help=voice-design で送るプリセット音声 / 役（例：日本語女性）。デプロイによってプリセット名が異なります。空欄の場合は送信しません
gui.config.field.narration-tts.cosyvoice.response-format.label=出力形式
gui.config.field.narration-tts.cosyvoice.response-format.help=音声出力形式：wav / mp3 / pcm。デフォルトは wav
gui.config.field.narration-tts.cosyvoice.use-proxy.label=プロキシを使用
gui.config.field.narration-tts.cosyvoice.use-proxy.help=有効にすると、このエンジンへのリクエストは HTTP プロキシを経由します。CosyVoice はローカル / 内部ネットワークサービスが多いため、通常は有効にする必要はありません。全体のプロキシスイッチとは独立しています
gui.config.field.narration-tts.cosyvoice.enable-clone.label=参照音のクローンを有効化
gui.config.field.narration-tts.cosyvoice.enable-clone.help=有効にすると、役に参照音がある場合は reference_audio として送り、音色をクローンします（自然言語 instruct で一文ごとの感情も制御）。無効にすると instruct の説明に戻ります
gui.config.field.narration-tts.fish.base-url.label=Fish Audio アドレス
gui.config.field.narration-tts.fish.base-url.help=Fish Audio のアドレス。デフォルトは https://api.fish.audio（エンジンが末尾に /v1/tts を付加）
gui.config.field.narration-tts.fish.api-key.label=API Key
gui.config.field.narration-tts.fish.api-key.help=Fish Audio API Key（Authorization: Bearer）。ログやレスポンスに表示されません。未設定の場合、このエンジンは利用できません
gui.config.field.narration-tts.fish.model.label=モデル
gui.config.field.narration-tts.fish.model.help=Fish モデル（model リクエストヘッダーで送信。例：s1 / s2-pro）。デフォルトは s1
gui.config.field.narration-tts.fish.reference-id.label=音声モデル ID
gui.config.field.narration-tts.fish.reference-id.help=Fish コンソールで事前作成 / アップロードした音声モデル ID（reference_id）。音色を決めます。空欄の場合はアカウントのデフォルト音色を使用します。Fish は「テキスト説明だけで音色を生成」する機能に対応していません。一文ごとの感情はインラインマーカーで注入され、ローカルの参照音クローンを使う場合は先に Fish 側へアップロードして ID を取得する必要があります
gui.config.field.narration-tts.fish.format.label=出力形式
gui.config.field.narration-tts.fish.format.help=音声出力形式：mp3 / wav / pcm / opus。デフォルトは mp3
gui.config.field.narration-tts.fish.use-proxy.label=プロキシを使用
gui.config.field.narration-tts.fish.use-proxy.help=有効にすると、このエンジンへのリクエストは HTTP プロキシを経由します（アドレスはプロキシ設定の host:port）。全体のプロキシスイッチとは独立しています
gui.config.field.narration-tts.minimax.base-url.label=MiniMax アドレス
gui.config.field.narration-tts.minimax.base-url.help=MiniMax のアドレス。デフォルトは https://api.minimax.io/v1（エンジンが末尾に /t2a_v2 を付加。中国国内サイトは https://api.minimaxi.chat/v1）
gui.config.field.narration-tts.minimax.api-key.label=API Key
gui.config.field.narration-tts.minimax.api-key.help=MiniMax API Key（Authorization: Bearer）。ログやレスポンスに表示されません。未設定の場合、このエンジンは利用できません
gui.config.field.narration-tts.minimax.group-id.label=GroupId
gui.config.field.narration-tts.minimax.group-id.help=MiniMax アカウントの GroupId（コンソールで確認できる 19 桁の数字）。T2A v2 では必須で、URL クエリパラメーターとしてリクエストに送信され、API Key と組み合わせて使用します。空欄の場合、このエンジンは利用できません
gui.config.field.narration-tts.minimax.model.label=モデル
gui.config.field.narration-tts.minimax.model.help=MiniMax モデル名。デフォルトは speech-2.8-hd
gui.config.field.narration-tts.minimax.voice-id.label=プリセット音声 ID
gui.config.field.narration-tts.minimax.voice-id.help=MiniMax のプリセット音声 ID（例：English_expressive_narrator）。MiniMax には一文ごとの自然言語音色チャンネルがないため、プリセット音声の指定が必須です。空欄の場合、このエンジンは利用できません
gui.config.field.narration-tts.minimax.emotion.label=感情
gui.config.field.narration-tts.minimax.emotion.help=固定感情を選択：happy / sad / angry / fearful / disgusted / surprised / calm / fluent / whisper。空欄の場合はモデルのデフォルトを使用します。エンジンは一文ごとの感情キーワードを先に自動マッピングし、一致しなければこの設定に戻ります
gui.config.field.narration-tts.minimax.format.label=出力形式
gui.config.field.narration-tts.minimax.format.help=音声出力形式：mp3 / wav / pcm / flac。デフォルトは mp3
gui.config.field.narration-tts.minimax.sample-rate.label=サンプルレート
gui.config.field.narration-tts.minimax.sample-rate.help=音声サンプルレート（Hz）。デフォルトは 32000
gui.config.field.narration-tts.minimax.use-proxy.label=プロキシを使用
gui.config.field.narration-tts.minimax.use-proxy.help=有効にすると、このエンジンへのリクエストは HTTP プロキシを経由します（アドレスはプロキシ設定の host:port）。全体のプロキシスイッチとは独立しています
gui.config.field.narration-tts.elevenlabs.base-url.label=ElevenLabs アドレス
gui.config.field.narration-tts.elevenlabs.base-url.help=ElevenLabs のアドレス。デフォルトは https://api.elevenlabs.io（エンジンが末尾に /v1/text-to-speech/{voice_id} を付加）
gui.config.field.narration-tts.elevenlabs.api-key.label=API Key
gui.config.field.narration-tts.elevenlabs.api-key.help=ElevenLabs API Key（xi-api-key ヘッダーで送信、Bearer ではない）。ログやレスポンスに表示されません。未設定の場合、このエンジンは利用できません
gui.config.field.narration-tts.elevenlabs.model.label=モデル
gui.config.field.narration-tts.elevenlabs.model.help=ElevenLabs のモデル ID。デフォルトは eleven_v3。インライン感情タグを解析するのは v3 だけで、旧モデル（例：eleven_multilingual_v2）では角括弧のタグも読み上げます
gui.config.field.narration-tts.elevenlabs.voice-id.label=音声 ID
gui.config.field.narration-tts.elevenlabs.voice-id.help=ElevenLabs コンソールで事前作成 / クローンした音声 ID（voice_id）。音色を決める必須項目です。空欄の場合、このエンジンは利用できません。一文ごとの感情はインラインの角括弧オーディオタグとして注入されます
gui.config.field.narration-tts.elevenlabs.output-format.label=出力形式
gui.config.field.narration-tts.elevenlabs.output-format.help=音声出力形式（query パラメーター output_format。例：mp3_44100_128 / pcm_24000 / opus_48000_128）。デフォルトは mp3_44100_128
gui.config.field.narration-tts.elevenlabs.use-proxy.label=プロキシを使用
gui.config.field.narration-tts.elevenlabs.use-proxy.help=有効にすると、このエンジンへのリクエストは HTTP プロキシを経由します（アドレスはプロキシ設定の host:port）。全体のプロキシスイッチとは独立しています
gui.config.field.narration-tts.qwen.base-url.label=Qwen / DashScope アドレス
gui.config.field.narration-tts.qwen.base-url.help=Alibaba DashScope のアドレス。デフォルトは https://dashscope.aliyuncs.com/api/v1（北京リージョン。国際リージョンは https://dashscope-intl.aliyuncs.com/api/v1。エンジンが末尾に /services/aigc/multimodal-generation/generation を付加）
gui.config.field.narration-tts.qwen.api-key.label=API Key
gui.config.field.narration-tts.qwen.api-key.help=DashScope API Key（Authorization: Bearer）。ログやレスポンスに表示されません。未設定の場合、このエンジンは利用できません
gui.config.field.narration-tts.qwen.model.label=モデル
gui.config.field.narration-tts.qwen.model.help=Qwen TTS モデル名。デフォルトは qwen3-tts-flash
gui.config.field.narration-tts.qwen.voice.label=プリセット音声
gui.config.field.narration-tts.qwen.voice.help=プリセット音声（例：Cherry / Ryan / Dylan）。空欄の場合はモデルのデフォルトを使用します
gui.config.field.narration-tts.qwen.language-type.label=言語ヒント
gui.config.field.narration-tts.qwen.language-type.help=任意のテキスト言語ヒント（例：Chinese / English / Japanese）。空欄の場合は自動判定します。指定すると発音 / イントネーションが自然になります
gui.config.field.narration-tts.qwen.use-proxy.label=プロキシを使用
gui.config.field.narration-tts.qwen.use-proxy.help=有効にすると、このエンジンへのリクエストは HTTP プロキシを経由します（アドレスはプロキシ設定の host:port）。全体のプロキシスイッチとは独立しています
gui.config.field.narration-tts.doubao.base-url.label=Doubao / Volcengine アドレス
gui.config.field.narration-tts.doubao.base-url.help=ByteDance Volcengine の音声合成アドレス。デフォルトは https://openspeech.bytedance.com（エンジンが末尾に /api/v1/tts を付加。HTTP 非ストリーミングの query パス）
gui.config.field.narration-tts.doubao.app-id.label=App ID
gui.config.field.narration-tts.doubao.app-id.help=Volcengine 音声アプリの appid（音声コンソール）
gui.config.field.narration-tts.doubao.access-token.label=Access Token
gui.config.field.narration-tts.doubao.access-token.help=Volcengine 音声の access-token（Authorization: Bearer;<token> で送信、セミコロンを含む）。ログやレスポンスに表示されません。未設定の場合、このエンジンは利用できません
gui.config.field.narration-tts.doubao.cluster.label=クラスター
gui.config.field.narration-tts.doubao.cluster.help=サービスクラスター。デフォルトは volcano_tts
gui.config.field.narration-tts.doubao.voice-type.label=プリセット音声 ID
gui.config.field.narration-tts.doubao.voice-type.help=Volcengine のプリセット音声 ID（voice_type。例：zh_female_wanqudashu_moon_bigtts）。必須項目です。空欄の場合、このエンジンは利用できません
gui.config.field.narration-tts.doubao.encoding.label=出力形式
gui.config.field.narration-tts.doubao.encoding.help=音声エンコード / 形式：mp3 / wav / pcm / ogg_opus。デフォルトは mp3
gui.config.field.narration-tts.doubao.emotion.label=感情
gui.config.field.narration-tts.doubao.emotion.help=固定感情を選択（例：happy / sad / angry / scare / hate / surprise / comfort など、Volcengine がサポートする列挙値）。空欄の場合はモデルのデフォルトを使用します。エンジンは一文ごとの感情キーワードを先に自動マッピングし、一致しなければこの設定に戻ります。感情対応の音声（*_bigtts など）でのみ有効です
gui.config.field.narration-tts.doubao.use-proxy.label=プロキシを使用
gui.config.field.narration-tts.doubao.use-proxy.help=有効にすると、このエンジンへのリクエストは HTTP プロキシを経由します（アドレスはプロキシ設定の host:port）。全体のプロキシスイッチとは独立しています
