plugin.name=TTS 낭독
plugin.summary=온라인 TTS 및 소설 낭독 음성 엔진.
gui.config.tts.security.notice=사용자 지정 TTS 주소는 높은 권한의 네트워크 대상입니다. 프로그램이 엔진에 따라 낭독 텍스트, 음색 또는 참조 음성과 서비스 자격 증명을 해당 주소로 보냅니다. 신뢰할 수 있는 서비스(로컬 또는 내부 네트워크 포함)만 입력하세요. 자격 증명이 포함된 요청은 HTTP 리디렉션을 따르지 않습니다.
listen=🎧 책 듣기
play=재생
pause=일시 중지
prev=이전 구간
next=다음 구간
stop=중지
settings=낭독 설정
close=닫기
seek=클릭하여 해당 문단으로 이동
engine=엔진
engine.browser=브라우저(오프라인)
engine.edge=온라인(Edge 신경망 음성)
engine.narration=감정 낭독(다중 화자·beta)
engine.narration-debug=감정 낭독(다중 화자·beta·디버그)
narration-degraded=감정 낭독을 현재 사용할 수 없어 {engine}(으)로 전환했습니다.
voice=음성
rate=속도
synthesizing=합성 중… {cur}/{total}
no-content=낭독할 본문이 없습니다.
browser-unsupported=현재 브라우저는 내장 음성 낭독을 지원하지 않습니다.
hint.browser=브라우저 엔진: 완전 오프라인, 즉시 실행, 무료입니다. 음질과 사용 가능한 언어는 시스템에 설치된 음성 패키지에 따라 달라집니다.
hint.edge=온라인 엔진(Edge 신경망 음성): 자연스러운 음질과 풍부한 언어를 무료로 제공하지만 인터넷 연결이 필요합니다(백엔드 프록시를 통해 연결). 합성에 약간의 지연이 있습니다.
hint.narration=감정 낭독(beta, 사용 가능하지만 아직 안정적이지 않음): 백엔드 AI가 장 전체를 문장별 화자에 배정하고 각 캐릭터를 고정 음색의 감정 엔진으로 합성하여 다중 화자 오디오북을 만듭니다. 백엔드에서 낭독 엔진을 설정해야 하며 관리자만 사용할 수 있습니다. 처음 재생할 때 분석이 시작되고 "낭독 분석 설정 → 낭독 배역표"에서 캐릭터 음색을 편집하고 충돌을 처리할 수 있습니다.
hint.narration-debug=디버그 모드: 감정 낭독 엔진을 현재 사용할 수 없지만 분석 실행과 화자/음색 결과 확인을 위해 이 엔진을 선택할 수 있습니다. 문장별 음성 합성은 실패합니다.
gui.config.tts.modality.label=모달리티
gui.config.tts.modality.help=구성할 AI 모달리티를 선택하세요. "텍스트 모델"은 번역/소설 듣기 대본 분석 등에 사용하는 범용 대규모 언어 모델(OpenAI 호환)이며, "TTS 모델"은 다중 화자 소설 듣기 낭독용 음성 합성 엔진입니다(beta, 사용 가능하지만 아직 안정적이지 않음). 두 설정은 모두 저장되고 적용되며 드롭다운은 현재 편집 항목만 전환합니다.
gui.config.tts.modality.tts=TTS 모델(beta)
gui.config.field.narration-tts.engine.label=낭독 엔진
gui.config.field.narration-tts.engine.help=다중 화자 낭독에 사용할 TTS 엔진입니다. 선택한 후 아래에 해당 엔진의 주소 / 키 등을 입력하세요.
gui.config.field.narration-tts.engine.value.voxcpm=VoxCPM(로컬 / 자체 호스팅)
gui.config.field.narration-tts.engine.value.mimo=Xiaomi MiMo(클라우드 API)
gui.config.field.narration-tts.engine.value.cosyvoice=CosyVoice(자체 구축)
gui.config.field.narration-tts.engine.value.fish=Fish Audio(클라우드 API)
gui.config.field.narration-tts.engine.value.minimax=MiniMax(클라우드 API)
gui.config.field.narration-tts.engine.value.elevenlabs=ElevenLabs(클라우드 API)
gui.config.field.narration-tts.engine.value.qwen=Alibaba Qwen3-TTS(DashScope)
gui.config.field.narration-tts.engine.value.doubao=ByteDance Doubao / Seed-TTS(Volcengine)
gui.config.field.narration-tts.voxcpm.base-url.label=VoxCPM 주소
gui.config.field.narration-tts.voxcpm.base-url.help=http://127.0.0.1:8000/v1과 같은 VoxCPM OpenAI 호환 엔드포인트입니다(/v1 필요). VoxCPM은 GPU가 필요한 외부 서비스이며 vllm serve openbmb/VoxCPM2 --omni로 직접 시작해야 합니다. --omni가 없으면 오디오 엔드포인트가 노출되지 않습니다. 비워 두면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.voxcpm.api-key.label=API Key
gui.config.field.narration-tts.voxcpm.api-key.help=vLLM은 기본적으로 비워 둘 수 있습니다. 로그나 응답에 절대 표시되지 않습니다.
gui.config.field.narration-tts.voxcpm.model.label=모델
gui.config.field.narration-tts.voxcpm.model.help=VoxCPM 모델 이름이며 기본값은 openbmb/VoxCPM2입니다.
gui.config.field.narration-tts.voxcpm.voice.label=voice id
gui.config.field.narration-tts.voxcpm.voice.help=OpenAI 호환 /audio/speech의 voice 필드이며 음색을 결정하지 않습니다(VoxCPM 음색은 인라인 설명/참조 음성으로 전달). VoxCPM과 같은 voice-design/클론 모델에는 일반적으로 사전 설정 음색이 없습니다(서버의 Invalid voice '...'. Supported: none은 사전 설정 목록이 비어 있다는 뜻). 어떤 voice 값이든 거부되므로 기본값은 비워 두어 해당 필드를 보내지 않으며 특정 voice 이름을 요구하는 빌드에서만 입력하세요.
gui.config.field.narration-tts.voxcpm.response-format.label=출력 형식
gui.config.field.narration-tts.voxcpm.response-format.help=오디오 출력 형식: wav 또는 pcm, 기본값 wav
gui.config.field.narration-tts.voxcpm.use-proxy.label=프록시 사용
gui.config.field.narration-tts.voxcpm.use-proxy.help=켜면 이 엔진의 요청이 프록시 설정의 host:port를 사용하는 HTTP 프록시를 통과합니다. VoxCPM은 대부분 로컬/내부 네트워크 서비스이므로 일반적으로 켤 필요가 없습니다. 전역 프록시 스위치와 독립적입니다.
gui.config.field.narration-tts.voxcpm.enable-clone.label=참조 음성 클론 활성화
gui.config.field.narration-tts.voxcpm.enable-clone.help=켜면 캐릭터의 "표준 음성 / 참조 음성"을 생성/업로드할 때 해당 음색을 복제합니다(문장별 감정은 계속 적용되어 장을 넘어 음색이 더 일관됨). 끄면 참조 음성이 있어도 인라인 음색 설명으로 돌아갑니다.
gui.config.field.narration-tts.voxcpm.clone-mode.label=클론 모드
gui.config.field.narration-tts.voxcpm.clone-mode.help=참조 음성이 있을 때의 클론 방식: controllable(제어 가능한 클론, 기본값)은 참조 음성만 보내 문장별 감정을 유지하면서 복제 음색으로 감정을 표현합니다. hifi(Hi-Fi 이어쓰기)는 참조 음성 전사도 추가로 보내 충실도가 가장 높지만 문장별 감정 제어를 무시하며, 해당 캐릭터 참조 음성에 전사가 있을 때만 적용되고 없으면 해당 문장은 자동으로 제어 가능한 클론으로 돌아갑니다.
gui.config.field.narration-tts.voxcpm.max-new-tokens.label=생성 token 상한
gui.config.field.narration-tts.voxcpm.max-new-tokens.help=모든 VoxCPM 합성 요청(voice-design 및 클론)의 생성 token 상한입니다. vllm-omni의 알려진 버그(정지 기호가 작동하지 않아 무한 생성될 수 있음)를 방지합니다. 0은 제한 없음입니다. 긴 문장이 잘리면 값을 높이세요. 낮추면 일반 voice-design 낭독과 클론 모두에 적용되어 긴 문장이 잘릴 수 있습니다.
gui.config.field.narration-tts.mimo.base-url.label=MiMo 주소
gui.config.field.narration-tts.mimo.base-url.help=Xiaomi MiMo 공개 플랫폼의 OpenAI 호환 주소이며 기본값은 https://api.xiaomimimo.com/v1입니다(엔진이 뒤에 /chat/completions를 붙임).
gui.config.field.narration-tts.mimo.api-key.label=API Key
gui.config.field.narration-tts.mimo.api-key.help=MiMo API Key(api-key 요청 헤더로 전송하며 Bearer 아님). 로그나 응답에 절대 표시되지 않습니다. 설정하지 않으면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.mimo.model.label=사전 설정 음색 모델
gui.config.field.narration-tts.mimo.model.help="사전 설정 음색 id"를 설정했을 때 사용할 모델이며 기본값은 mimo-v2.5-tts입니다.
gui.config.field.narration-tts.mimo.voice-design-model.label=음색 설명 모델
gui.config.field.narration-tts.mimo.voice-design-model.help=사전 설정 음색이 없을 때 캐릭터 음색 설명으로 음색을 생성하는 모델이며 기본값은 mimo-v2.5-tts-voicedesign입니다.
gui.config.field.narration-tts.mimo.voice-clone-model.label=음색 클론 모델
gui.config.field.narration-tts.mimo.voice-clone-model.help=캐릭터에 참조 음성이 있을 때 음색을 복제하는 모델이며 기본값은 mimo-v2.5-tts-voiceclone입니다.
gui.config.field.narration-tts.mimo.voice.label=사전 설정 음색 id
gui.config.field.narration-tts.mimo.voice.help=입력하면 "사전 설정 음색 모델"과 해당 음색(예: Chloe / 茉莉)을 사용하고 캐릭터 설명으로 스타일을 미세 조정합니다. 비워 두면 "음색 설명 모델"이 설명에 따라 음색을 생성합니다.
gui.config.field.narration-tts.mimo.response-format.label=출력 형식
gui.config.field.narration-tts.mimo.response-format.help=오디오 출력 형식: wav 또는 pcm16, 기본값 wav
gui.config.field.narration-tts.mimo.use-proxy.label=프록시 사용
gui.config.field.narration-tts.mimo.use-proxy.help=켜면 이 엔진의 요청이 프록시 설정의 host:port를 사용하는 HTTP 프록시를 통과합니다. MiMo는 클라우드 서비스이므로 필요에 따라 켜세요. 전역 프록시 스위치와 독립적입니다.
gui.config.field.narration-tts.mimo.enable-clone.label=참조 음성 클론 활성화
gui.config.field.narration-tts.mimo.enable-clone.help=켜면 캐릭터에 참조 음성이 있을 때 클론 모델로 음색을 재현합니다. 꺼도 참조 음성이 있으면 설명 음색으로 돌아갑니다.
gui.config.field.narration-tts.cosyvoice.base-url.label=CosyVoice 주소
gui.config.field.narration-tts.cosyvoice.base-url.help=http://127.0.0.1:8000/v1과 같은 CosyVoice OpenAI 호환 주소입니다(엔진이 뒤에 /audio/speech를 붙임). CosyVoice는 GPU가 필요한 외부 서비스이며 vox-box / Xinference 등으로 직접 배포해야 합니다. 배포 방식에 따라 필드 이름이 조금씩 다릅니다. 비워 두면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.cosyvoice.api-key.label=API Key
gui.config.field.narration-tts.cosyvoice.api-key.help=자체 구축 서비스는 기본적으로 비워 둘 수 있습니다. 로그나 응답에 절대 표시되지 않습니다.
gui.config.field.narration-tts.cosyvoice.model.label=모델
gui.config.field.narration-tts.cosyvoice.model.help=CosyVoice 모델 이름이며 기본값은 CosyVoice2-0.5B입니다.
gui.config.field.narration-tts.cosyvoice.voice.label=사전 설정 음색
gui.config.field.narration-tts.cosyvoice.voice.help=voice-design에서 보내는 사전 설정 음색/캐릭터(예: 中文女)입니다. 배포마다 사전 설정 이름이 다르며 비워 두면 보내지 않습니다.
gui.config.field.narration-tts.cosyvoice.response-format.label=출력 형식
gui.config.field.narration-tts.cosyvoice.response-format.help=오디오 출력 형식: wav / mp3 / pcm, 기본값 wav
gui.config.field.narration-tts.cosyvoice.use-proxy.label=프록시 사용
gui.config.field.narration-tts.cosyvoice.use-proxy.help=켜면 이 엔진의 요청이 HTTP 프록시를 통과합니다. CosyVoice는 대부분 로컬/내부 네트워크 서비스이므로 일반적으로 켤 필요가 없습니다. 전역 프록시 스위치와 독립적입니다.
gui.config.field.narration-tts.cosyvoice.enable-clone.label=참조 음성 클론 활성화
gui.config.field.narration-tts.cosyvoice.enable-clone.help=켜면 캐릭터에 참조 음성이 있을 때 reference_audio로 참조 음성을 보내 음색을 복제합니다(자연어 instruct는 여전히 문장별 감정을 제어). 끄면 instruct 설명으로 돌아갑니다.
gui.config.field.narration-tts.fish.base-url.label=Fish Audio 주소
gui.config.field.narration-tts.fish.base-url.help=Fish Audio 주소이며 기본값은 https://api.fish.audio입니다(엔진이 뒤에 /v1/tts를 붙임).
gui.config.field.narration-tts.fish.api-key.label=API Key
gui.config.field.narration-tts.fish.api-key.help=Fish Audio API Key(Authorization: Bearer). 로그나 응답에 절대 표시되지 않습니다. 설정하지 않으면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.fish.model.label=모델
gui.config.field.narration-tts.fish.model.help=Fish 모델(model 요청 헤더로 전송, 예: s1 / s2-pro)이며 기본값은 s1입니다.
gui.config.field.narration-tts.fish.reference-id.label=음성 모델 id
gui.config.field.narration-tts.fish.reference-id.help=Fish 콘솔에서 미리 생성/업로드한 음성 모델 id(reference_id)로 음색을 결정합니다. 비워 두면 계정 기본 음색을 사용합니다. Fish는 "순수 텍스트 설명으로 음색 생성"을 지원하지 않으며 문장별 감정은 인라인 태그로 주입합니다. 로컬 참조 음성 클론은 먼저 Fish에 업로드하여 이 id를 받아야 합니다.
gui.config.field.narration-tts.fish.format.label=출력 형식
gui.config.field.narration-tts.fish.format.help=오디오 출력 형식: mp3 / wav / pcm / opus, 기본값 mp3
gui.config.field.narration-tts.fish.use-proxy.label=프록시 사용
gui.config.field.narration-tts.fish.use-proxy.help=켜면 이 엔진의 요청이 프록시 설정의 host:port를 사용하는 HTTP 프록시를 통과합니다. 전역 프록시 스위치와 독립적입니다.
gui.config.field.narration-tts.minimax.base-url.label=MiniMax 주소
gui.config.field.narration-tts.minimax.base-url.help=MiniMax 주소이며 기본값은 https://api.minimax.io/v1입니다(엔진이 뒤에 /t2a_v2를 붙임. 중국 사이트는 https://api.minimaxi.chat/v1).
gui.config.field.narration-tts.minimax.api-key.label=API Key
gui.config.field.narration-tts.minimax.api-key.help=MiniMax API Key(Authorization: Bearer). 로그나 응답에 절대 표시되지 않습니다. 설정하지 않으면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.minimax.group-id.label=GroupId
gui.config.field.narration-tts.minimax.group-id.help=MiniMax 계정 GroupId(콘솔에서 확인할 수 있는 19자리 숫자)입니다. T2A v2에 필수이며 URL 쿼리 매개변수로 API Key와 함께 전송됩니다. 비워 두면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.minimax.model.label=모델
gui.config.field.narration-tts.minimax.model.help=MiniMax 모델 이름이며 기본값은 speech-2.8-hd입니다.
gui.config.field.narration-tts.minimax.voice-id.label=사전 설정 음색 id
gui.config.field.narration-tts.minimax.voice-id.help=MiniMax 사전 설정 음색 id(예: English_expressive_narrator)입니다. MiniMax에는 문장별 자연어 음색 채널이 없으므로 사전 설정 음색을 반드시 지정해야 하며 비워 두면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.minimax.emotion.label=감정
gui.config.field.narration-tts.minimax.emotion.help=선택 가능한 고정 감정: happy / sad / angry / fearful / disgusted / surprised / calm / fluent / whisper. 비워 두면 모델 기본값을 사용합니다. 엔진은 먼저 문장별 감정 키워드로 자동 매핑하고 일치하지 않으면 이 설정으로 돌아갑니다.
gui.config.field.narration-tts.minimax.format.label=출력 형식
gui.config.field.narration-tts.minimax.format.help=오디오 출력 형식: mp3 / wav / pcm / flac, 기본값 mp3
gui.config.field.narration-tts.minimax.sample-rate.label=샘플링 레이트
gui.config.field.narration-tts.minimax.sample-rate.help=오디오 샘플링 레이트(Hz), 기본값 32000
gui.config.field.narration-tts.minimax.use-proxy.label=프록시 사용
gui.config.field.narration-tts.minimax.use-proxy.help=켜면 이 엔진의 요청이 프록시 설정의 host:port를 사용하는 HTTP 프록시를 통과합니다. 전역 프록시 스위치와 독립적입니다.
gui.config.field.narration-tts.elevenlabs.base-url.label=ElevenLabs 주소
gui.config.field.narration-tts.elevenlabs.base-url.help=ElevenLabs 주소이며 기본값은 https://api.elevenlabs.io입니다(엔진이 뒤에 /v1/text-to-speech/{voice_id}를 붙임).
gui.config.field.narration-tts.elevenlabs.api-key.label=API Key
gui.config.field.narration-tts.elevenlabs.api-key.help=ElevenLabs API Key(xi-api-key 요청 헤더로 전송하며 Bearer 아님). 로그나 응답에 절대 표시되지 않습니다. 설정하지 않으면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.elevenlabs.model.label=모델
gui.config.field.narration-tts.elevenlabs.model.help=ElevenLabs 모델 id이며 기본값은 eleven_v3입니다. 인라인 감정 태그는 v3만 해석하고, 이전 모델(예: eleven_multilingual_v2)은 대괄호 태그를 그대로 읽습니다.
gui.config.field.narration-tts.elevenlabs.voice-id.label=음성 id
gui.config.field.narration-tts.elevenlabs.voice-id.help=ElevenLabs 콘솔에서 미리 만들거나 복제한 음성 id(voice_id)로 음색을 결정합니다. 필수이며 비워 두면 엔진을 사용할 수 없습니다. 문장별 감정은 인라인 대괄호 오디오 태그로 주입합니다.
gui.config.field.narration-tts.elevenlabs.output-format.label=출력 형식
gui.config.field.narration-tts.elevenlabs.output-format.help=오디오 출력 형식(query 매개변수 output_format, 예: mp3_44100_128 / pcm_24000 / opus_48000_128), 기본값 mp3_44100_128
gui.config.field.narration-tts.elevenlabs.use-proxy.label=프록시 사용
gui.config.field.narration-tts.elevenlabs.use-proxy.help=켜면 이 엔진의 요청이 프록시 설정의 host:port를 사용하는 HTTP 프록시를 통과합니다. 전역 프록시 스위치와 독립적입니다.
gui.config.field.narration-tts.qwen.base-url.label=Qwen / DashScope 주소
gui.config.field.narration-tts.qwen.base-url.help=Alibaba DashScope 주소이며 기본값은 https://dashscope.aliyuncs.com/api/v1입니다(베이징 지역; 국제 지역은 https://dashscope-intl.aliyuncs.com/api/v1. 엔진이 뒤에 /services/aigc/multimodal-generation/generation을 붙임).
gui.config.field.narration-tts.qwen.api-key.label=API Key
gui.config.field.narration-tts.qwen.api-key.help=DashScope API Key(Authorization: Bearer). 로그나 응답에 절대 표시되지 않습니다. 설정하지 않으면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.qwen.model.label=모델
gui.config.field.narration-tts.qwen.model.help=Qwen TTS 모델 이름이며 기본값은 qwen3-tts-flash입니다.
gui.config.field.narration-tts.qwen.voice.label=사전 설정 음색
gui.config.field.narration-tts.qwen.voice.help=사전 설정 음색(예: Cherry / Ryan / Dylan)입니다. 비워 두면 모델 기본값을 사용합니다.
gui.config.field.narration-tts.qwen.language-type.label=언어 힌트
gui.config.field.narration-tts.qwen.language-type.help=선택 사항인 텍스트 언어 힌트(예: Chinese / English / Japanese)입니다. 비워 두면 자동 판별하며 지정하면 발음과 억양이 더 자연스러워집니다.
gui.config.field.narration-tts.qwen.use-proxy.label=프록시 사용
gui.config.field.narration-tts.qwen.use-proxy.help=켜면 이 엔진의 요청이 프록시 설정의 host:port를 사용하는 HTTP 프록시를 통과합니다. 전역 프록시 스위치와 독립적입니다.
gui.config.field.narration-tts.doubao.base-url.label=Doubao / Volcengine 주소
gui.config.field.narration-tts.doubao.base-url.help=ByteDance Volcengine 음성 합성 주소이며 기본값은 https://openspeech.bytedance.com입니다(엔진이 뒤에 /api/v1/tts를 붙이는 HTTP 비스트리밍 query 경로).
gui.config.field.narration-tts.doubao.app-id.label=App ID
gui.config.field.narration-tts.doubao.app-id.help=Volcengine 음성 애플리케이션 appid(음성 콘솔)
gui.config.field.narration-tts.doubao.access-token.label=Access Token
gui.config.field.narration-tts.doubao.access-token.help=Volcengine 음성 access-token(Authorization: Bearer;<token>으로 전송하며 세미콜론 포함). 로그나 응답에 절대 표시되지 않습니다. 설정하지 않으면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.doubao.cluster.label=클러스터
gui.config.field.narration-tts.doubao.cluster.help=비즈니스 클러스터이며 기본값은 volcano_tts입니다.
gui.config.field.narration-tts.doubao.voice-type.label=사전 설정 음색 id
gui.config.field.narration-tts.doubao.voice-type.help=Volcengine 사전 설정 음색 id(voice_type, 예: zh_female_wanqudashu_moon_bigtts)입니다. 필수이며 비워 두면 엔진을 사용할 수 없습니다.
gui.config.field.narration-tts.doubao.encoding.label=출력 형식
gui.config.field.narration-tts.doubao.encoding.help=오디오 인코딩 / 형식: mp3 / wav / pcm / ogg_opus, 기본값 mp3
gui.config.field.narration-tts.doubao.emotion.label=감정
gui.config.field.narration-tts.doubao.emotion.help=선택 가능한 고정 감정(예: happy / sad / angry / scare / hate / surprise / comfort 등 Volcengine이 지원하는 열거형)입니다. 비워 두면 모델 기본값을 사용합니다. 엔진은 먼저 문장별 감정 키워드로 자동 매핑하고 일치하지 않으면 이 설정으로 돌아갑니다. 감정을 지원하는 음색(예: *_bigtts)에서만 적용됩니다.
gui.config.field.narration-tts.doubao.use-proxy.label=프록시 사용
gui.config.field.narration-tts.doubao.use-proxy.help=켜면 이 엔진의 요청이 프록시 설정의 host:port를 사용하는 HTTP 프록시를 통과합니다. 전역 프록시 스위치와 독립적입니다.
