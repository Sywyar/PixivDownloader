scope.cross.title=異なる作品に分散している重複画像だけを表示します（異なる投稿に同じ画像がある場合）。
scope.all.title=作品間の重複に加えて、同一作品内の複数ページ間にある類似画像も表示します
scope.hint=作品間：異なる作品の重複画像だけを表示します。すべて：同一作品内の類似ページも含めます。
