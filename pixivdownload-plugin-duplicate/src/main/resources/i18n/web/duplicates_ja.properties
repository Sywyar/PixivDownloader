controls.label=フィルター操作
controls.threshold=dHash 閾値
controls.ahash-threshold=aHash 閾値
controls.threshold.title=dHash は画像の「構造」（輪郭と形状）を検出します。大きくすると一致条件が緩くなり、より多くの似た画像を見つけられますが、誤検出も増えます。小さくすると条件が厳しくなり、構造がよく似た画像だけを選びます。
controls.ahash-threshold.title=aHash は画像の「明暗」（全体的な輝度分布）を検出し、補助的な確認に使います。大きくすると明暗差を許容し、小さくすると明暗もほぼ一致することを求めます。これにより誤検出をさらに減らせます。
threshold.hint=dHash は「構造」を検出します。大きくすると一致条件が緩くなり、似た画像を多く見つけられますが、誤検出も増えます。小さくすると条件が厳しくなり、構造がよく似た画像だけを選びます。aHash は「明暗」を検出します。大きくすると明暗差をより許容し、小さくすると明暗もほぼ一致することを求めます。補足：2つの閾値はいずれも「許容する差の上限」（ハミング距離0～64）であり、両方を満たした場合のみ類似と判定します。どちらも0（既定値）の場合は、フィンガープリントが完全一致する画像だけを統合します。
