gui.config.group.schedule=排程工作
gui.config.field.schedule.enabled.label=啟用排程工作
gui.config.field.schedule.enabled.help=關閉後會直接略過排程 tick，所有排程工作都不會執行（已建立的工作會保留，不會刪除）。預設啟用
gui.config.field.schedule.tick-interval-ms.label=排程檢查間隔（毫秒）
gui.config.field.schedule.tick-interval-ms.help=每隔多久檢查一次到期工作，預設為 60000（60 秒）。此項目由啟動時的計時器解析，修改後需重新啟動才會生效（不支援熱重載）
gui.config.field.schedule.max-tasks.label=排程工作數上限
gui.config.field.schedule.max-tasks.help=單一資料庫最多可建立的排程工作數量，用於防止濫用。預設為 100
gui.config.field.schedule.inbox-check-every.label=站內信檢查間隔（作品數）
gui.config.field.schedule.inbox-check-every.help=Cookie 綁定工作每成功下載這麼多個作品後，讀取一次站內信，檢查 Pixiv 過度存取警告（略過／篩選的作品不計入）。預設為 500
gui.config.field.schedule.auth-failure-circuit-breaker.label=單一作品連續失敗熔斷閾值
gui.config.field.schedule.auth-failure-circuit-breaker.help=同一輪內，單一作品連續擷取失敗達到此次數，即判定登入狀態失效，暫停工作並等待重新授權。預設為 5
gui.config.field.schedule.pending-max-attempts.label=待重試次數上限
gui.config.field.schedule.pending-max-attempts.help=遭隔離的失敗作品自動重試的最大次數，達到上限後會標記為需要手動處理，並停止自動重試。預設為 5
gui.config.field.schedule.overuse-defer-default-minutes.label=過度存取延遲恢復預設分鐘數
gui.config.field.schedule.overuse-defer-default-minutes.help=帳戶因過度存取而暫停後，「稍後繼續」預設延遲的分鐘數（最低 60）。預設為 60
gui.config.validation.schedule-tick-min=排程檢查間隔不可小於 1000 毫秒
