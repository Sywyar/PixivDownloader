gui.config.field.download.root-folder.help=圖片儲存的根目錄（相對或絕對路徑）
gui.config.field.download.root-folder.label=下載根目錄
gui.config.field.download.user-flat-folder.help=勾選後會使用與批次匯入單一作品相同的扁平結構，否則會在下載根目錄中建立以作者使用者名稱命名的資料夾，以儲存 User 模式下載的作品檔案
gui.config.field.download.user-flat-folder.label=User 模式扁平目錄
gui.config.field.download.max-concurrent.help=同時下載的圖片 / 作品數上限（≥1），使用專用執行緒池，最多排隊 100 個作品，佇列已滿時拒絕新工作；調低此值可降低遭 Pixiv 限流的機率。修改後需重新啟動服務才能生效
gui.config.field.download.max-concurrent.label=最大並行下載數（圖片）
gui.config.field.guest-invite.request-limit-minute.help=每個邀請碼每分鐘最多允許邀請訪客發出的 API 請求次數（0 = 不限制）；solo / multi 兩種模式下均生效，管理員不受限
gui.config.field.guest-invite.request-limit-minute.label=邀請訪客 API 速率限制（次 / 分鐘）
gui.config.field.guest-invite.static-resource-request-limit-minute.help=每個邀請碼每分鐘最多允許邀請訪客發出的 HTML、JS、CSS、字型等靜態資源請求次數（0 = 不限制）；solo / multi 兩種模式下均生效
gui.config.field.guest-invite.static-resource-request-limit-minute.label=邀請訪客靜態資源速率限制（次 / 分鐘）
gui.config.field.guest-invite.tts-request-limit-minute.help=每個邀請碼每分鐘最多允許邀請訪客發出的線上 TTS（語音合成）請求次數（0 = 不限制）；管理員與瀏覽器內建語音均不受限
gui.config.field.guest-invite.tts-request-limit-minute.label=邀請訪客線上語音合成速率限制（次 / 分鐘）
gui.config.field.plugin-catalog.enabled.help=是否啟用插件市場（受信任的 catalog）。預設開啟，僅在管理員開啟或重新整理市場、執行安裝時存取儲存庫；可關閉以禁止儲存庫存取。修改後需重新啟動服務才能生效
gui.config.field.plugin-catalog.enabled.label=啟用插件市場
gui.config.field.plugin-catalog.official-repository-enabled.help=是否啟用內嵌的官方預設儲存庫（預設啟用）。僅在插件市場開啟時生效，可單獨停用以只使用自訂儲存庫。修改後需重新啟動服務才能生效
gui.config.field.plugin-catalog.official-repository-enabled.label=啟用官方預設儲存庫
gui.config.field.plugin-catalog.connect-timeout-ms.help=擷取儲存庫清單 / 下載插件包的全域連線逾時（毫秒），可由個別儲存庫覆寫。修改後需重新啟動服務才能生效
gui.config.field.plugin-catalog.connect-timeout-ms.label=連線逾時（毫秒）
gui.config.field.plugin-catalog.read-timeout-ms.help=擷取儲存庫清單 / 下載插件包的全域讀取逾時（毫秒），可由個別儲存庫覆寫。修改後需重新啟動服務才能生效
gui.config.field.plugin-catalog.read-timeout-ms.label=讀取逾時（毫秒）
gui.config.field.plugin-catalog.max-manifest-bytes.help=單一儲存庫清單允許下載的最大位元組數（預設 1048576 = 1 MB），可防止過大的回應；可由個別儲存庫覆寫。修改後需重新啟動服務才能生效
gui.config.field.plugin-catalog.max-manifest-bytes.label=清單大小上限（位元組）
gui.config.field.plugin-catalog.max-package-bytes.help=單一插件包允許下載的最大位元組數（預設 104857600 = 100 MB）；可由個別儲存庫覆寫。修改後需重新啟動服務才能生效
gui.config.field.plugin-catalog.max-package-bytes.label=插件包大小上限（位元組）
