gui.welcome.config.password-warning.message=本軟體會儲存其他軟體的 Cookie 等敏感憑證，建議使用至少 12 位密碼。若仍要繼續，請再次點擊完成設定。
gui.welcome.config.failed=設定失敗：{0}
gui.welcome.proxy.title=3. 代理設定
gui.welcome.proxy.body=後端對外的網路存取都會經由此 HTTP 代理：存取 Pixiv（瀏覽、搜尋、下載圖片 / 動圖 / 小說 / 封面、收藏）、線上更新（檢查並下載新版本）、下載內建 FFmpeg（動圖轉換所需）、線上 TTS（聽書的 Edge 神經語音）。可在此開啟 / 關閉代理並設定代理位址；之後也可在「設定」分頁隨時修改。
gui.welcome.proxy.enabled=啟用代理
gui.welcome.proxy.host=代理主機
gui.welcome.proxy.port=代理連接埠
gui.welcome.proxy.point.usage=一般本機使用時通常保持開啟，並填寫本機代理（預設 127.0.0.1:7890）。
gui.welcome.proxy.point.docker=在 Docker 容器中執行時，127.0.0.1 通常無法連線至主機代理，請依需求關閉代理，或填入容器可連線的代理位址。
gui.welcome.proxy.point.change=代理設定會儲存至 config.yaml，並立即生效；之後可在「設定」分頁隨時調整。
gui.welcome.proxy.invalid.host=啟用代理時請填寫代理主機
gui.welcome.proxy.invalid.port=代理連接埠必須是介於 1 到 65535 的整數
gui.welcome.proxy.failed=儲存代理設定失敗：{0}
gui.welcome.start.title=4. 開始下載
gui.welcome.start.body=建議使用網頁版下載，無需安裝任何瀏覽器擴充功能。點選下方按鈕開啟下載頁，貼上內容即可批次下載。
gui.welcome.start.button=開啟下載頁
gui.welcome.start.waiting=在瀏覽器開啟下載頁後將自動進入下一步
gui.welcome.scripts.title=進階：站內增強
gui.welcome.scripts.body=兩個油猴腳本可以完成網頁版無法做到的工作：「頁面批次」可在 Pixiv 站內直接擷取目前頁面的作品，「工具箱」可增強 Pixiv 瀏覽體驗。其餘下載使用網頁版即可，無需安裝。
gui.welcome.scripts.button=查看腳本
gui.welcome.ffmpeg.title=進階：動圖支援
gui.welcome.ffmpeg.body=只有下載動圖（Ugoira）才需要 ffmpeg；一般圖片與小說下載不依賴它。
gui.welcome.ffmpeg.button=前往設定
gui.welcome.ffmpeg.state.ready=已偵測到 ffmpeg
gui.welcome.ffmpeg.state.missing=未偵測到 ffmpeg（僅影響動圖）
gui.welcome.status.point1=綠點持續亮起並顯示「執行中」即代表服務已就緒。
gui.welcome.status.point2=顯示「正在啟動」時請稍候，首次啟動可能正在初始化資料庫。
gui.welcome.status.point3=若長時間無法就緒或顯示啟動失敗，可前往「狀態」分頁查看記錄以排查問題。
gui.welcome.config.point.account=使用者名稱 + 密碼用於登入下載頁 / 監控頁等需要驗證的頁面；密碼至少 8 位，建議 12 位以上。
gui.welcome.config.point.change=之後如需修改帳號，可在「設定」分頁調整或重新執行安裝流程。
gui.welcome.config.done.body=首次安裝已完成，可以直接開始下載。點選「下一步」繼續了解後續功能。
gui.welcome.start.point.kinds=支援的內容：單個 / 多個作品連結、畫師首頁（依使用者 ID 下載其全部作品）、關鍵字搜尋、完整系列；插畫 / 漫畫 / 動圖 / 小說皆可。
gui.welcome.start.point.keepopen=下載會在後端進行，但請保持下載頁開啟，直到佇列全部提交完成（頁面會持續將佇列傳送至後端）。
gui.welcome.start.point.formats=可在下載頁設定檔名範本、小說格式（TXT / HTML / EPUB）及系列合訂本等選項。
gui.welcome.scripts.intro=絕大多數下載使用網頁版即可，無需任何腳本。只有以下兩種網頁版無法提供的功能依賴油猴腳本：
gui.welcome.scripts.point.page=「頁面批次」：在 Pixiv 站內（搜尋 / 排行 / 關注動態等任意清單頁）直接擷取目前頁面的作品並批次下載。
gui.welcome.scripts.point.toolbox=「工具箱」：增強 Pixiv 站內瀏覽體驗（例如為已下載過的作品加上標記）。
gui.welcome.scripts.install=安裝方式：先安裝瀏覽器擴充功能 Tampermonkey，再到下載頁的「油猴腳本」卡片一鍵安裝；其餘腳本均非必要。
gui.welcome.ffmpeg.intro=只有「下載動圖（Ugoira）」才需要 ffmpeg：它用於將動圖的逐格圖片合成為 webp。一般圖片、漫畫、小說下載都不需要它。
gui.welcome.ffmpeg.state=目前狀態：{0}
gui.welcome.ffmpeg.install=未偵測到時，可在「狀態」分頁一鍵下載內建 ffmpeg，或自行安裝並將其加入系統 PATH。
gui.welcome.done.reopen.title=隨時重看導覽
gui.welcome.done.reopen=網頁版的「操作指南」可隨時在下載頁 / 畫廊頁左下角的「操作指南」按鈕重新開啟；此導覽首頁在全部完成前每次啟動都會自動顯示。
