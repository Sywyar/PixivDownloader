gui.welcome.title=PixivDownloader へようこそ
gui.welcome.subtitle=インストールが完了しました！以下の手順で最初のダウンロードを始めましょう。
gui.welcome.optional.badge=（任意）
gui.welcome.nav.next=次へ
gui.welcome.nav.prev=戻る
gui.welcome.nav.finish=完了
gui.welcome.done.title=すべて完了しました
gui.welcome.done.body=おめでとうございます。ガイドはすべて完了しました。これでダウンロードと閲覧を始められます。
gui.welcome.done.button=ステータスを開く
gui.welcome.done.point.start=ダウンロード：「ダウンロード」ページに作品リンク、作者 ID、キーワードを貼り付けると一括ダウンロードできます。
gui.welcome.done.point.advanced=高度な機能（Userscript、アニメーション用 ffmpeg）は、前の「高度な機能」ページまたは各ページでいつでも確認できます。
gui.welcome.advanced.title=高度な機能（任意）
gui.welcome.advanced.body=以下は任意の高度な機能です。必要に応じてご確認ください。使わなくても通常のダウンロードや閲覧には影響しません。確認後に「次へ」を押すとガイドが完了します。
gui.welcome.status.subtitle=ここではローカルのバックエンドサービスが正常に動作していることを確認します。すべての機能を使うために必要ですが、操作は不要です。準備ができたら「次へ」を押してください。
gui.welcome.status.title=1. サービスの準備完了
gui.welcome.status.running=実行中です。利用を開始できます
gui.welcome.status.starting=起動中です。しばらくお待ちください…
gui.welcome.status.failed=起動に失敗しました。「ステータス」ページでログを確認してください
gui.welcome.status.stopped=サービスは停止しています
gui.welcome.config.title=2. 設定
gui.welcome.config.body=管理画面へのログインに使う管理者アカウントを設定します。送信すると初回インストールが完了し、すぐにダウンロードを開始できます。この手順は一度だけ必要です。
gui.welcome.config.username=管理者ユーザー名
gui.welcome.config.password=管理者パスワード
gui.welcome.config.submit=設定を完了
gui.welcome.config.submitting=送信中…
gui.welcome.config.done=設定が完了しました
gui.welcome.config.waiting=サービスの起動後に設定できます…
gui.welcome.config.invalid.username=管理者ユーザー名を入力してください
gui.welcome.config.invalid.password=パスワードは 8 文字以上で入力してください
gui.welcome.config.password-warning.message=このソフトウェアは他のソフトウェアの Cookie などの機密情報を保存します。12 文字以上のパスワードを推奨します。それでも続行する場合は、もう一度「設定を完了」をクリックしてください。
gui.welcome.config.failed=設定に失敗しました：{0}
gui.welcome.proxy.title=3. プロキシ設定
gui.welcome.proxy.body=バックエンドから外部へアクセスする際は、すべてこの HTTP プロキシを経由します。Pixiv（閲覧、検索、画像・アニメーション・小説・カバーのダウンロード、ブックマーク）、オンライン更新（新しいバージョンの確認とダウンロード）、内蔵 FFmpeg（アニメーション変換に必要）、オンライン TTS（Edge ニューラル音声による読み上げ）などが対象です。ここでプロキシの有効・無効とアドレスを設定できます。後から「設定」タブで変更することもできます。
gui.welcome.proxy.enabled=プロキシを有効化
gui.welcome.proxy.host=プロキシホスト
gui.welcome.proxy.port=プロキシポート
gui.welcome.proxy.point.usage=通常のローカル環境では有効のまま、ローカルプロキシ（デフォルトは 127.0.0.1:7890）を入力してください。
gui.welcome.proxy.point.docker=Docker コンテナ内で実行する場合、127.0.0.1 からホストのプロキシには通常接続できません。必要に応じてプロキシを無効にするか、コンテナから到達できるアドレスを入力してください。
gui.welcome.proxy.point.change=プロキシ設定は config.yaml に保存され、すぐに反映されます。後から「設定」タブで変更できます。
gui.welcome.proxy.invalid.host=プロキシを有効にする場合はプロキシホストを入力してください
gui.welcome.proxy.invalid.port=プロキシポートは 1～65535 の整数で入力してください
gui.welcome.proxy.failed=プロキシ設定の保存に失敗しました：{0}
gui.welcome.start.title=4. ダウンロードを開始
gui.welcome.start.body=ブラウザー拡張機能をインストールせずに、Web 版からダウンロードすることをおすすめします。下のボタンでダウンロードページを開き、内容を貼り付けると一括ダウンロードできます。
gui.welcome.start.button=ダウンロードページを開く
gui.welcome.start.waiting=ブラウザーでダウンロードページを開くと、次の手順に自動的に進みます
gui.welcome.scripts.title=高度な機能：サイト内拡張
gui.welcome.scripts.body=2 つの Userscript で、Web 版だけではできないことが可能になります。「ページ一括」は Pixiv のページ内から作品を直接取得し、「ツールボックス」は Pixiv の閲覧体験を拡張します。それ以外のダウンロードは Web 版だけで行え、インストールは不要です。
gui.welcome.scripts.button=スクリプトを確認
gui.welcome.ffmpeg.title=高度な機能：アニメーション対応
gui.welcome.ffmpeg.body=ffmpeg が必要なのはアニメーション（Ugoira）のダウンロードだけです。通常の画像や小説のダウンロードには必要ありません。
gui.welcome.ffmpeg.button=設定を開く
gui.welcome.ffmpeg.state.ready=ffmpeg を検出しました
gui.welcome.ffmpeg.state.missing=ffmpeg が見つかりません（アニメーションにのみ影響します）
gui.welcome.status.point1=緑のランプが点灯し、「実行中」と表示されればサービスの準備完了です。
gui.welcome.status.point2=「起動中」と表示されている間はお待ちください。初回起動ではデータベースを初期化する場合があります。
gui.welcome.status.point3=長時間準備が完了しない、または起動に失敗した場合は、「ステータス」タブでログを確認してください。
gui.welcome.config.point.account=ユーザー名とパスワードは、ダウンロードページや監視ページなど認証が必要なページへのログインに使います。パスワードは 8 文字以上、12 文字以上を推奨します。
gui.welcome.config.point.change=後からアカウントを変更する場合は、「設定」タブで変更するか、インストール手順をもう一度実行してください。
gui.welcome.config.done.body=初回インストールが完了しました。すぐにダウンロードを始められます。「次へ」を押して、続く機能を確認してください。
gui.welcome.start.point.kinds=対応する内容：単一・複数の作品リンク、作者ページ（ユーザー ID による全作品のダウンロード）、キーワード検索、シリーズ全体。イラスト、漫画、アニメーション、小説に対応しています。
gui.welcome.start.point.keepopen=ダウンロードはバックエンドで行われますが、キューの送信が完了するまでダウンロードページを開いたままにしてください（ページからバックエンドへキューを継続的に送信します）。
gui.welcome.start.point.formats=ダウンロードページでは、ファイル名テンプレート、小説形式（TXT/HTML/EPUB）、シリーズの合本などを設定できます。
gui.welcome.scripts.intro=ほとんどのダウンロードは Web 版だけで行え、スクリプトは不要です。Userscript が必要なのは、Web 版ではできない次の 2 つの機能だけです。
gui.welcome.scripts.point.page=「ページ一括」：Pixiv 内の検索・ランキング・フォロー中の更新など、任意の一覧ページから作品を直接取得して一括ダウンロードします。
gui.welcome.scripts.point.toolbox=「ツールボックス」：Pixiv 内の閲覧体験を拡張します（ダウンロード済み作品へのマークなど）。
gui.welcome.scripts.install=インストール方法：まずブラウザー拡張機能 Tampermonkey をインストールし、ダウンロードページの「Userscript」カードからワンクリックでインストールします。それ以外のスクリプトは必須ではありません。
gui.welcome.ffmpeg.intro=ffmpeg が必要なのは「アニメーション（Ugoira）のダウンロード」だけです。アニメーションの各フレームを WebP に合成するために使います。通常の画像、漫画、小説のダウンロードには必要ありません。
gui.welcome.ffmpeg.state=現在の状態：{0}
gui.welcome.ffmpeg.install=検出されない場合は、「ステータス」タブから内蔵 ffmpeg をワンクリックでダウンロードするか、自分でインストールしてシステム PATH に追加してください。
gui.welcome.done.reopen.title=ガイドをいつでも見直す
gui.welcome.done.reopen=Web 版の「操作ガイド」は、ダウンロードページやギャラリーページ左下の「操作ガイド」ボタンからいつでも開き直せます。この初回ガイドは、完了するまで起動のたびに自動表示されます。
