gui.config.market.repo.proxy-trusted.risk=「信頼済みプロキシ」はアプリケーションの全体プロキシ（proxy.*）経由で取得し、組み込みホストホワイトリスト内で最大 5 回のリダイレクトだけを追跡します。直接接続・厳格のネットワーク制限の一部が緩和されますが、プラグインパッケージの完全性はサイズ・SHA-256・署名検証（fail-closed）で保護されます。完全に信頼できるリポジトリにだけ有効にしてください。
