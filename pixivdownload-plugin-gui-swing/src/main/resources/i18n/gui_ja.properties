gui.config.market.repo.custom.risk=カスタムポリシーでは通信制限と SSRF 防御が緩和される可能性があります。各リダイレクト先は再検証され、最大 5 回までに制限されます。プロキシ使用時、非公開アドレスの遮断はローカル DNS の結果だけに基づくため、プロキシ側の名前解決結果と異なる場合があります。本当に必要なオプションだけを有効にしてください。
