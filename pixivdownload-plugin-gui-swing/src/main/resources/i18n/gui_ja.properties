gui.migrate-dir.root-sync.message=現在のダウンロードルートディレクトリを変更したことを検出しました：\n旧：{0}\n新：{1}\n\nconfig.yaml のダウンロードルート（download.root-folder）も新しいパスに同期しますか？\n同期しない場合、新しい作品は引き続き古いディレクトリに保存されます。（ダウンロードルートの変更はサービス再起動後に反映されます）\n\nヒント：このツールはレコードだけを変更し、ディスク上のファイルは移動しません。
gui.migrate-dir.root-sync.success={0} 件のディレクトリレコードを移行し、config.yaml のダウンロードルートも更新しました。\nサービスを再起動すると、新しい作品が新しいディレクトリに保存されます。今すぐ再起動しますか？
gui.migrate-dir.root-sync.persist-failed={0} 件のディレクトリレコードを移行しましたが、config.yaml のダウンロードルートの書き込みに失敗しました。download.root-folder を手動で変更してください。
gui.migrate-dir.symbolic-sync.inside.message=現在のダウンロードルートディレクトリを変更したことを検出しました：\n旧：{0}\n新：{1}\n\n新しいディレクトリはまだソフトウェアディレクトリ内にあります。config.yaml のダウンロードルート（download.root-folder）を相対パス「{2}」に変更しますか？\n「はい」：データベースレコードはソフトウェアディレクトリに追従し続けるため、ソフトウェア全体を移動しても自動で場所を特定できます（推奨）。\n「いいえ」：データベースレコードは新しいディレクトリの絶対パスに固定され、config.yaml は変更されません。新しい作品は古いディレクトリに保存されます。\n\nヒント：このツールはレコードだけを変更し、ディスク上のファイルは移動しません。先にファイルを自分で移動してください。（ダウンロードルートの変更はサービス再起動後に反映されます）
gui.migrate-dir.symbolic-sync.outside.message=現在のダウンロードルートディレクトリを変更したことを検出しました：\n旧：{0}\n新：{1}\n\n新しいディレクトリはソフトウェアディレクトリの外にあるため、データベースレコードは新しい絶対パスに固定されます。\nconfig.yaml のダウンロードルート（download.root-folder）も新しいパスに同期しますか？\n「いいえ」を選ぶと config.yaml は変更されず、新しい作品は古いディレクトリに保存されます。（ダウンロードルートの変更はサービス再起動後に反映されます）\n\nヒント：このツールはレコードだけを変更し、ディスク上のファイルは移動しません。先にファイルを自分で移動してください。
gui.migrate-dir.symbolic-sync.config-only.success=config.yaml のダウンロードルートを「{0}」に変更しました。データベースレコードはソフトウェアディレクトリに追従するため、書き換えは不要です。\nサービスを再起動すると、新しい作品が新しいディレクトリに保存されます。今すぐ再起動しますか？
