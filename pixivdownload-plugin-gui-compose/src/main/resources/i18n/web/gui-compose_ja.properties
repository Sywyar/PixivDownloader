plugin.name=Compose Multiplatform GUI
plugin.summary=任意で選択できる Compose Multiplatform デスクトップ UI と、完全な宣言型 UI ノードレンダラーを提供します。
gui.compose.ok=OK
gui.compose.browse=参照...
gui.compose.window.minimize=最小化
gui.compose.window.maximize=最大化
gui.compose.window.restore=元に戻す
gui.compose.window.close=閉じる
