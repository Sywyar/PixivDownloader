gui.compose.onboarding.failed=ローカルサービスを起動できませんでした。ログを確認してから、アプリケーションを再起動してください。
gui.compose.settings.reload-warning=再読み込みすると、未保存の変更がすべて破棄され、ファイルの設定に戻ります。
gui.compose.settings.save-scope=変更は保存時に書き込まれます。言語とテーマはプレビューでき、適用の説明は保存後の動作を示します。
gui.compose.settings.language-help=画面とログの言語をプレビューします。この選択を記憶するには保存してください。
gui.compose.home.open-workbench=ダウンロード画面を開く
gui.compose.settings.discard=変更を破棄
gui.compose.settings.maintenance=設定ファイルと保守
gui.compose.settings.effect.immediate=保存後すぐに適用
gui.compose.settings.effect.backend=保存後にダウンロードサービスの再起動が必要
gui.compose.settings.effect.process=保存後にアプリ全体の再起動が必要
gui.compose.home.storage=使用量 / 総容量。ダウンロード先のボリューム：{0}
gui.compose.expanded=展開済み
gui.compose.collapsed=折りたたみ
gui.compose.home.task-empty=接続中の提供元から実行中のタスクは報告されていません。ここには提供元のタスク状態が表示されます。Web のダウンロードキューはダウンロード画面で確認してください。
gui.compose.tools.classifier=画像分類
gui.compose.tools.folder=フォルダー検査
gui.compose.tools.backfill=データ補完
gui.compose.tools.migration=データベース移行
gui.compose.tools.classifier-description=フォルダーごとに画像を確認・分類します。ダウンロードサービスは停止しません。
gui.compose.tools.folder-description=データベースに記録されたフォルダーにアクセスできるか確認し、修正する記録を選択します。
gui.compose.tools.folder-impact=ツールを開くとダウンロードサービスが一時停止します。閉じると、元々稼働していたサービスの再開を試みます。
gui.compose.tools.backfill-impact=ダウンロードサービスの稼働が必要です。補完はホストのデータベース接続プールを使用し、完了まで他の保守ツールを開始できません。
gui.compose.tools.maintenance-impact=移行中はダウンロードサービスを一時停止し、データベースを排他的に使用します。終了後に元々稼働していたサービスの再開を試みます。実際の状態と結果を確認してください。
gui.compose.automation.intro=提供元が報告した予定と実行結果を確認できます。予定の管理は Web のダウンロード画面で行います。
gui.compose.automation.no-source=予定の状態を提供する接続元がないため、予定の有無を確認できません。
gui.compose.automation.no-tasks=現在の提供元から予定タスクは報告されていません。Web 画面で予定を確認・管理できます。
gui.compose.automation.unavailable=予定の状態を取得できません。タスクがないとは判断できません。提供元の状態を確認して再試行してください。
gui.compose.automation.stale=提供元のデータが古く、現在の予定一覧を確認できません。更新をお待ちください。
gui.compose.settings.provider-help=次回起動時に使用するデスクトップ画面を選びます。
gui.compose.settings.config-menu-expand-all-help=入れ子のグループ内の設定を最上位の分類に表示します。
gui.compose.settings.option-details=設定項目の詳細
gui.compose.about.technical=技術・ビルド情報
gui.compose.number-invalid={0} から {1} まで、増分 {2} の数値を入力してください。
gui.compose.tools.folder-ready=準備ができました。フォルダーを確認してから、修正するレコードを選択してください。
