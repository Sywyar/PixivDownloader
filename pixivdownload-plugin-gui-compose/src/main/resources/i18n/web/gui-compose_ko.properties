plugin.name=Compose Multiplatform GUI
plugin.summary=선택 가능한 Compose Multiplatform 데스크톱 UI와 완전한 선언형 UI 노드 렌더러를 제공합니다.
gui.compose.ok=확인
gui.compose.browse=찾아보기...
gui.compose.window.minimize=최소화
gui.compose.window.maximize=최대화
gui.compose.window.restore=복원
gui.compose.window.close=닫기
gui.compose.settings.reload-warning=다시 불러오면 저장하지 않은 변경 사항이 모두 취소되고 파일의 설정으로 돌아갑니다.
gui.compose.settings.save-scope=변경 사항은 저장할 때 기록됩니다. 언어와 테마는 미리 볼 수 있으며, 적용 안내는 저장 후의 동작을 설명합니다.
gui.compose.settings.language-help=화면과 로그의 언어를 미리 봅니다. 이 선택을 기억하려면 저장하세요.
gui.compose.home.open-workbench=다운로드 작업 공간 열기
gui.compose.settings.discard=변경 사항 버리기
gui.compose.settings.maintenance=설정 파일 및 유지 관리
gui.compose.settings.effect.immediate=저장 후 바로 적용
gui.compose.settings.effect.backend=저장 후 다운로드 서비스 재시작 필요
gui.compose.settings.effect.process=저장 후 앱 전체 재시작 필요
gui.compose.home.storage=사용량 / 전체 용량. 다운로드 폴더가 있는 볼륨: {0}
gui.compose.expanded=펼쳐짐
gui.compose.collapsed=접힘
gui.compose.home.task-empty=연결된 제공자가 실행 중인 작업을 보고하지 않았습니다. 여기는 제공자의 작업 상태를 표시합니다. 웹 다운로드 대기열은 다운로드 작업 공간에서 확인하세요.
gui.compose.tools.classifier=이미지 분류
gui.compose.tools.folder=폴더 검사
gui.compose.tools.backfill=데이터 보충
gui.compose.tools.migration=데이터베이스 이전
gui.compose.tools.classifier-description=폴더별로 이미지를 확인하고 분류합니다. 다운로드 서비스를 중지하지 않습니다.
gui.compose.tools.folder-description=데이터베이스에 기록된 폴더에 접근할 수 있는지 검사한 뒤 수정할 기록을 선택합니다.
gui.compose.tools.folder-impact=이 도구를 열면 다운로드 서비스가 일시 중지됩니다. 도구를 닫으면 이전에 실행 중이던 서비스의 재시작을 시도합니다.
gui.compose.tools.backfill-impact=다운로드 서비스가 실행 중이어야 합니다. 호스트의 데이터베이스 연결 풀을 사용하며 실행 중에는 다른 유지 관리 도구를 시작할 수 없습니다.
gui.compose.tools.maintenance-impact=이전 중에는 다운로드 서비스를 일시 중지하고 데이터베이스를 독점 사용합니다. 완료 후 이전에 실행 중이던 서비스를 재시작하려고 시도합니다. 실제 서비스 상태와 결과를 확인하세요.
gui.compose.automation.intro=제공자가 보고한 일정과 실행 결과를 읽기 전용으로 확인합니다. 일정은 웹 다운로드 작업 공간에서 관리합니다.
gui.compose.automation.no-source=일정 상태 제공자가 연결되어 있지 않아 일정 유무를 확인할 수 없습니다.
gui.compose.automation.no-tasks=현재 제공자가 보고한 예약 작업이 없습니다. 웹 작업 공간에서 일정을 확인하고 관리할 수 있습니다.
gui.compose.automation.unavailable=일정 상태를 읽을 수 없습니다. 작업이 없다는 의미는 아닙니다. 제공자 상태를 확인한 후 다시 시도하세요.
gui.compose.automation.stale=제공자 데이터가 오래되어 현재 일정 목록을 신뢰할 수 없습니다. 새로 고쳐질 때까지 기다려 주세요.
gui.compose.settings.provider-help=다음 실행 시 사용할 데스크톱 인터페이스를 선택합니다.
gui.compose.settings.config-menu-expand-all-help=중첩된 그룹의 설정을 최상위 분류로 표시합니다.
gui.compose.settings.option-details=옵션 설명
gui.compose.about.technical=기술 및 빌드 정보
gui.compose.number-invalid={0}에서 {1} 사이의 숫자를 {2} 간격으로 입력하세요.
gui.compose.tools.folder-ready=준비되었습니다. 폴더를 검사한 뒤 수정할 기록을 선택하세요.
