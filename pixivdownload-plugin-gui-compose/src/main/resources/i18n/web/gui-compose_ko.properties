gui.compose.automation.no-tasks=현재 제공자가 보고한 예약 작업이 없습니다. 웹 작업 공간에서 일정을 확인하고 관리할 수 있습니다.
gui.compose.automation.unavailable=일정 상태를 읽을 수 없습니다. 작업이 없다는 의미는 아닙니다. 제공자 상태를 확인한 후 다시 시도하세요.
