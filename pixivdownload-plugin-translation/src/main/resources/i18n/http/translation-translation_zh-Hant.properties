title=翻譯
TranslationController.submit.POST.summary=提交翻譯任務
TranslationController.submit.POST.description=用客戶端生成的 UUID 作為 requestId 提交非同步翻譯。相同 ID 和請求可安全重試，內容不一致時發生衝突。至少選擇正文、標題、簡介之一；全系列或僅後設資料任務還需要正數 seriesId。
TranslationController.submit.POST.success=翻譯任務。
TranslationController.job.GET.summary=檢視翻譯任務進度
TranslationController.job.GET.description=用提交時的 requestId 查詢任務當前狀態、已儲存步驟、完成章節數與結果。
TranslationController.job.GET.success=翻譯任務進度。
TranslationController.jobs.GET.summary=列出翻譯任務
TranslationController.jobs.GET.description=至少提供一個正整數 ID。正數 seriesId 優先，查詢該系列的全章工作；否則以正數 novelId 查詢。依開始時間倒序。 例如 GET /api/translation/jobs?novelId=42 或 GET /api/translation/jobs?seriesId=7。
TranslationController.jobs.GET.success=翻譯任務。
TranslationController.resume.POST.summary=恢復翻譯任務
TranslationController.resume.POST.description=繼續 PAUSED 或 CANCELLED 的任務，保留已儲存進度，返回當前任務狀態。
TranslationController.resume.POST.success=已恢復翻譯任務。
TranslationController.pause.POST.summary=暫停翻譯任務
TranslationController.pause.POST.description=請求停止正在執行的翻譯並返回當前狀態。停止可能在響應後生效，可憑任務 ID 查詢最終狀態。
TranslationController.pause.POST.success=已暫停翻譯任務。
TranslationController.cancel.POST.summary=取消翻譯任務
TranslationController.cancel.POST.description=請求停止正在執行的翻譯並返回當前狀態。停止可能在響應後生效，可憑任務 ID 查詢最終狀態。
TranslationController.cancel.POST.success=翻譯任務。
TranslationController.discard.DELETE.summary=丟棄翻譯任務記錄
TranslationController.discard.DELETE.description=刪除儲存的翻譯任務記錄。執行中的任務會產生衝突，請先暫停或取消並等待狀態轉換完畢。成功時返回 204。
TranslationController.discard.DELETE.success=已丟棄翻譯任務記錄。
TranslationController.status.GET.summary=檢視翻譯服務狀態
TranslationController.status.GET.description=返回已配置的翻譯引擎、可用引擎列表和術語表能力。將列表中的 id 傳給支援 engine 的翻譯操作。
TranslationController.status.GET.success=翻譯服務狀態。
TranslationController.translate.POST.summary=翻譯單篇小說
TranslationController.translate.POST.description=翻譯指定本地小說的選中部分。目標語言必填，正文、標題、簡介至少選一項。用結果中的 langCode 和 variantKey 讀取譯文。
TranslationController.translate.POST.success=單篇小說。
TranslationController.languages.GET.summary=列出引擎支援的語言
TranslationController.languages.GET.description=根據 engine 查詢翻譯引擎支援的語言。engine 可從 GET /api/translation/status 獲取，省略時使用當前引擎。
TranslationController.languages.GET.success=引擎支援的語言。
TranslationController.series.POST.summary=翻譯小說系列
TranslationController.series.POST.description=翻譯本地小說系列的標題或簡介。傳入目標語言，選中 translateTitle、translateDescription 中至少一項。
TranslationController.series.POST.success=小說系列。
TranslationController.language.POST.summary=查詢引擎的目標語言程式碼
TranslationController.language.POST.description=將目標語言解析為引擎使用的語言程式碼。檢查響應的 valid，無法識別時 code 為空。
TranslationController.language.POST.success=引擎的目標語言程式碼。
parameter.novelId=Pixiv 小說 ID。
parameter.seriesId=作品或小說系列的 ID。
parameter.engine=翻譯引擎標識。
