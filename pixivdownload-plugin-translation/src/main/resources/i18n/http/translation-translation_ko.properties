title=번역
TranslationController.submit.POST.summary=번역 작업 시작
TranslationController.submit.POST.description=클라이언트가 생성한 UUID를 requestId로 비동기 번역을 등록합니다. 같은 ID와 내용으로 재시도할 수 있고 내용이 달라지면 충돌합니다. 본문·제목·설명 중 하나 이상을 선택하고 전체 시리즈 또는 메타데이터만 번역할 때는 양의 seriesId를 지정합니다.
TranslationController.submit.POST.success=번역 작업.
TranslationController.job.GET.summary=번역 작업 진행률 조회
TranslationController.job.GET.description=등록한 requestId로 현재 상태, 저장된 단계, 완료한 장 수와 결과를 확인합니다.
TranslationController.job.GET.success=번역 작업 진행률.
TranslationController.jobs.GET.summary=번역 작업 목록 조회
TranslationController.jobs.GET.description=양의 ID를 하나 이상 지정하세요. 양의 seriesId가 우선하며 해당 시리즈의 전체 장 작업을 조회합니다. 그 밖에는 novelId가 포함된 작업을 조회합니다. 시작 시각이 최신인 순서입니다. 예: GET /api/translation/jobs?novelId=42 또는 GET /api/translation/jobs?seriesId=7.
TranslationController.jobs.GET.success=번역 작업.
TranslationController.resume.POST.summary=번역 작업 다시 시작
TranslationController.resume.POST.description=PAUSED 또는 CANCELLED 작업을 저장된 진행 지점에서 재개하고 현재 상태를 반환합니다.
TranslationController.resume.POST.success=번역 작업을 재개했습니다.
TranslationController.pause.POST.summary=번역 작업 일시 중지
TranslationController.pause.POST.description=중지를 요청하고 현재 상태를 반환합니다. 응답 후에 중지가 완료될 수 있으므로 작업 ID로 최종 상태를 확인합니다.
TranslationController.pause.POST.success=번역 작업을 일시 중지했습니다.
TranslationController.cancel.POST.summary=번역 작업 취소
TranslationController.cancel.POST.description=중지를 요청하고 현재 상태를 반환합니다. 응답 후에 중지가 완료될 수 있으므로 작업 ID로 최종 상태를 확인합니다.
TranslationController.cancel.POST.success=번역 작업.
TranslationController.discard.DELETE.summary=번역 작업 기록 폐기
TranslationController.discard.DELETE.description=저장된 번역 작업을 삭제합니다. 실행 중에는 충돌하므로 일시 중지 또는 취소가 끝난 후 삭제합니다. 성공 시 204입니다.
TranslationController.discard.DELETE.success=번역 작업 기록을 폐기했습니다.
TranslationController.status.GET.summary=번역 서비스 상태 조회
TranslationController.status.GET.description=설정된 번역 엔진, 사용 가능한 엔진과 용어집 지원 여부를 가져옵니다. engine을 받는 작업에 목록의 id를 전달합니다.
TranslationController.status.GET.success=번역 서비스 상태.
TranslationController.translate.POST.summary=개별 소설 번역
TranslationController.translate.POST.description=로컬 소설에서 선택한 부분을 번역합니다. 대상 언어와 본문·제목·설명 중 하나 이상을 지정하고 반환된 langCode와 variantKey로 번역을 조회합니다.
TranslationController.translate.POST.success=개별 소설.
TranslationController.languages.GET.summary=엔진 지원 언어 목록 조회
TranslationController.languages.GET.description=engine이 지원하는 언어를 조회합니다. GET /api/translation/status에서 ID를 얻고 생략하면 현재 엔진을 사용합니다.
TranslationController.languages.GET.success=엔진 지원 언어.
TranslationController.series.POST.summary=소설 시리즈 번역
TranslationController.series.POST.description=로컬 소설 시리즈 제목 또는 설명을 번역합니다. 대상 언어와 translateTitle, translateDescription 중 하나 이상을 지정합니다.
TranslationController.series.POST.success=소설 시리즈.
TranslationController.language.POST.summary=엔진의 대상 언어 코드 조회
TranslationController.language.POST.description=대상 언어를 엔진의 언어 코드로 변환합니다. valid를 확인하세요. 인식하지 못하면 code가 비어 있습니다.
TranslationController.language.POST.success=엔진의 대상 언어 코드.
parameter.novelId=Pixiv 소설 ID입니다.
