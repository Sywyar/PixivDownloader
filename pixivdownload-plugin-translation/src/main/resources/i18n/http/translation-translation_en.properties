title=Translation
TranslationController.submit.POST.summary=Start a translation job
TranslationController.submit.POST.description=Submit an asynchronous translation with a client-generated UUID requestId. Retry with the same ID and identical request. Changed content conflicts. Select body, title or description, and supply a positive seriesId for all-chapter or metadata-only jobs.
TranslationController.submit.POST.success=Translation job.
TranslationController.job.GET.summary=Get translation job progress
TranslationController.job.GET.description=Look up current job state, saved steps, completed chapters and outcome using the UUID submitted as requestId.
TranslationController.job.GET.success=Translation job progress.
TranslationController.jobs.GET.summary=List translation jobs
TranslationController.jobs.GET.description=Supply at least one positive ID. A positive seriesId selects all-chapter jobs for that series and takes precedence over novelId. Otherwise novelId selects jobs containing that novel. Newest starts first. Examples: GET /api/translation/jobs?novelId=42 and GET /api/translation/jobs?seriesId=7.
TranslationController.jobs.GET.success=Translation jobs.
TranslationController.resume.POST.summary=Resume a translation job
TranslationController.resume.POST.description=Resume a PAUSED or CANCELLED job from its saved progress and return the current job view.
TranslationController.resume.POST.success=Translation job resumed.
TranslationController.pause.POST.summary=Pause a translation job
TranslationController.pause.POST.description=Request that execution stop and return the current job state. The transition may finish after this response. Poll the job ID for its final state.
TranslationController.pause.POST.success=Translation job paused.
TranslationController.cancel.POST.summary=Cancel a translation job
TranslationController.cancel.POST.description=Request that execution stop and return the current job state. The transition may finish after this response. Poll the job ID for its final state.
TranslationController.cancel.POST.success=Translation job.
TranslationController.discard.DELETE.summary=Discard a translation job
TranslationController.discard.DELETE.description=Delete a stored translation job. An executing job conflicts, so pause or cancel it and wait for the transition before deleting. Success returns 204.
TranslationController.discard.DELETE.success=Translation job discarded.
TranslationController.status.GET.summary=Get translation service status
TranslationController.status.GET.description=Read configured and available translation engines and glossary support. Use engine IDs from this response in operations accepting engine.
TranslationController.status.GET.success=Translation service status.
TranslationController.translate.POST.summary=Translate a novel
TranslationController.translate.POST.description=Translate selected parts of a local novel. Supply the target language and select at least one of body, title or description. Use the returned langCode and variantKey to read the translation.
TranslationController.translate.POST.success=Novel.
TranslationController.languages.GET.summary=List languages supported by an engine
TranslationController.languages.GET.description=List supported languages for engine. Obtain engine IDs from GET /api/translation/status or omit engine to use the current engine.
TranslationController.languages.GET.success=Languages supported by an engine.
TranslationController.series.POST.summary=Translate a novel series
TranslationController.series.POST.description=Translate a local novel series title or description. Supply the target language and select translateTitle, translateDescription or both.
TranslationController.series.POST.success=Novel series.
TranslationController.language.POST.summary=Look up an engine's target language code
TranslationController.language.POST.description=Resolve the target language to an engine language code. Check valid. An unrecognized language produces an empty code.
TranslationController.language.POST.success=Engine's target language code.
parameter.novelId=Pixiv novel ID.
parameter.seriesId=Identifier of the artwork or novel series.
parameter.engine=Translation engine identifier.
