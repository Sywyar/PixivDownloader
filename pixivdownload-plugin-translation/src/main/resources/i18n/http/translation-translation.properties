title=翻译
TranslationController.submit.POST.summary=提交翻译任务
TranslationController.submit.POST.description=用客户端生成的 UUID 作为 requestId 提交异步翻译。相同 ID 和请求可安全重试，内容不一致时发生冲突。至少选择正文、标题、简介之一；全系列或仅元数据任务还需要正数 seriesId。
TranslationController.submit.POST.success=翻译任务。
TranslationController.job.GET.summary=查看翻译任务进度
TranslationController.job.GET.description=用提交时的 requestId 查询任务当前状态、已保存步骤、完成章节数与结果。
TranslationController.job.GET.success=翻译任务进度。
TranslationController.jobs.GET.summary=列出翻译任务
TranslationController.jobs.GET.description=至少提供一个正整数 ID。正数 seriesId 优先，查询该系列的全章任务；否则按正数 novelId 查询。按开始时间倒序。 例如 GET /api/translation/jobs?novelId=42 或 GET /api/translation/jobs?seriesId=7。
TranslationController.jobs.GET.success=翻译任务。
TranslationController.resume.POST.summary=恢复翻译任务
TranslationController.resume.POST.description=继续 PAUSED 或 CANCELLED 的任务，保留已保存进度，返回当前任务状态。
TranslationController.resume.POST.success=已恢复翻译任务。
TranslationController.pause.POST.summary=暂停翻译任务
TranslationController.pause.POST.description=请求停止正在运行的翻译并返回当前状态。停止可能在响应后生效，可凭任务 ID 查询最终状态。
TranslationController.pause.POST.success=已暂停翻译任务。
TranslationController.cancel.POST.summary=取消翻译任务
TranslationController.cancel.POST.description=请求停止正在运行的翻译并返回当前状态。停止可能在响应后生效，可凭任务 ID 查询最终状态。
TranslationController.cancel.POST.success=翻译任务。
TranslationController.discard.DELETE.summary=丢弃翻译任务记录
TranslationController.discard.DELETE.description=删除保存的翻译任务记录。运行中的任务会产生冲突，请先暂停或取消并等待状态转换完毕。成功时返回 204。
TranslationController.discard.DELETE.success=已丢弃翻译任务记录。
TranslationController.status.GET.summary=查看翻译服务状态
TranslationController.status.GET.description=返回已配置的翻译引擎、可用引擎列表和术语表能力。将列表中的 id 传给支持 engine 的翻译操作。
TranslationController.status.GET.success=翻译服务状态。
TranslationController.translate.POST.summary=翻译单篇小说
TranslationController.translate.POST.description=翻译指定本地小说的选中部分。目标语言必填，正文、标题、简介至少选一项。用结果中的 langCode 和 variantKey 读取译文。
TranslationController.translate.POST.success=单篇小说。
TranslationController.languages.GET.summary=列出引擎支持的语言
TranslationController.languages.GET.description=根据 engine 查询翻译引擎支持的语言。engine 可从 GET /api/translation/status 获取，省略时使用当前引擎。
TranslationController.languages.GET.success=引擎支持的语言。
TranslationController.series.POST.summary=翻译小说系列
TranslationController.series.POST.description=翻译本地小说系列的标题或简介。传入目标语言，选中 translateTitle、translateDescription 中至少一项。
TranslationController.series.POST.success=小说系列。
TranslationController.language.POST.summary=查询引擎的目标语言代码
TranslationController.language.POST.description=将目标语言解析为引擎使用的语言代码。检查响应的 valid，无法识别时 code 为空。
TranslationController.language.POST.success=引擎的目标语言代码。
parameter.novelId=Pixiv 小说 ID。
parameter.seriesId=作品或小说系列的 ID。
parameter.engine=翻译引擎标识。
