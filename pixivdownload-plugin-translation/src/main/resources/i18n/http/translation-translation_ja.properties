title=翻訳
TranslationController.submit.POST.summary=翻訳ジョブを開始
TranslationController.submit.POST.description=クライアント生成 UUID を requestId として非同期翻訳を登録します。再送は同じ ID と内容を使用します。本文・題名・説明のいずれかが必要で、シリーズ全体またはメタデータのみなら正の seriesId も必須です。
TranslationController.submit.POST.success=翻訳ジョブ。
TranslationController.job.GET.summary=翻訳ジョブの進捗を取得
TranslationController.job.GET.description=登録した requestId で現在の状態、保存済みステップ、完了章数、結果を確認します。
TranslationController.job.GET.success=翻訳ジョブの進捗。
TranslationController.jobs.GET.summary=翻訳ジョブの一覧
TranslationController.jobs.GET.description=正の ID を一つ以上指定してください。正の seriesId は novelId に優先し、シリーズの全章ジョブを選択します。それ以外は novelId を含むジョブを開始日時の新しい順に返します。 例：GET /api/translation/jobs?novelId=42 または GET /api/translation/jobs?seriesId=7。
TranslationController.jobs.GET.success=翻訳ジョブ。
TranslationController.resume.POST.summary=翻訳ジョブを再開
TranslationController.resume.POST.description=PAUSED または CANCELLED のジョブを保存済みの進捗から再開して状態を返します。
TranslationController.resume.POST.success=翻訳ジョブを再開しました。
TranslationController.pause.POST.summary=翻訳ジョブを一時停止
TranslationController.pause.POST.description=停止を要求し、その時点の状態を返します。停止完了は応答後になる場合があるため、ジョブ ID で最終状態を確認します。
TranslationController.pause.POST.success=翻訳ジョブを一時停止しました。
TranslationController.cancel.POST.summary=翻訳ジョブをキャンセル
TranslationController.cancel.POST.description=停止を要求し、その時点の状態を返します。停止完了は応答後になる場合があるため、ジョブ ID で最終状態を確認します。
TranslationController.cancel.POST.success=翻訳ジョブ。
TranslationController.discard.DELETE.summary=翻訳ジョブの記録を破棄
TranslationController.discard.DELETE.description=保存された翻訳ジョブを削除します。実行中は競合するため、一時停止または中止が完了してから削除します。成功時は 204 です。
TranslationController.discard.DELETE.success=翻訳ジョブの記録を破棄しました。
TranslationController.status.GET.summary=翻訳サービスの状態を取得
TranslationController.status.GET.description=設定中の翻訳エンジン、利用可能なエンジン、用語集対応状況を取得します。engine を受け取る操作には一覧の id を渡します。
TranslationController.status.GET.success=翻訳サービスの状態。
TranslationController.translate.POST.summary=小説一編を翻訳
TranslationController.translate.POST.description=ローカル小説の対象部分を翻訳します。翻訳先言語と本文・題名・説明のうち 1 つ以上を指定します。訳文の取得には langCode と variantKey を使います。
TranslationController.translate.POST.success=小説一編。
TranslationController.languages.GET.summary=エンジンの対応言語の一覧
TranslationController.languages.GET.description=engine の対応言語を取得します。ID は GET /api/translation/status で確認でき、省略時は現在のエンジンを使用します。
TranslationController.languages.GET.success=エンジンの対応言語。
TranslationController.series.POST.summary=小説シリーズを翻訳
TranslationController.series.POST.description=ローカル小説シリーズの題名または説明を翻訳します。翻訳先言語と translateTitle、translateDescription のいずれかを指定します。
TranslationController.series.POST.success=小説シリーズ。
TranslationController.language.POST.summary=エンジンの翻訳先言語コードを照会
TranslationController.language.POST.description=対象言語をエンジンの言語コードに解決します。valid を確認してください。認識できなければ code は空です。
TranslationController.language.POST.success=エンジンの翻訳先言語コード。
parameter.novelId=Pixiv の小説 ID。
parameter.seriesId=作品または小説シリーズの ID。
parameter.engine=翻訳エンジンの ID。
