dialog.languages-loading=지원 언어를 불러오는 중…
dialog.languages-empty=이 서비스에 사용 가능한 번역 언어가 없습니다. 언어 모델을 설치한 후 다시 불러오세요.
dialog.language-choose=번역할 언어 선택
