translation.interrupted=서비스 중단으로 일시 정지되었습니다. 진행 상황은 저장되어 있습니다. 직접 재개하세요.
translation.configuration-changed=엔진 설정이 변경되었습니다. 이전 설정으로 복원하거나 작업을 버리고 다시 시작하세요.
translation.configuration-unavailable=이 AI 서비스는 복구에 필요한 설정 확인을 지원하지 않습니다.
translation.source-changed=원문이 변경되었거나 삭제되었습니다. 새 번역 작업을 시작하세요.
translation.target-changed=다른 작업이 번역문을 변경했습니다. 덮어쓰려면 새 작업을 시작하세요.
translation.incomplete-response=모델 응답이 중간에 잘렸습니다. 더 작은 구간으로 새 작업을 만들거나 모델 서비스의 출력 제한을 확인한 후 계속하세요.
translation.job-capacity=작업 또는 체크포인트 저장 공간이 가득 찼습니다. 불필요한 일시 정지 작업을 버리세요.
translation.job-storage=진행 상황을 저장할 수 없습니다. 데이터베이스와 저장 공간을 확인하세요.
translation.checkpoint-conflict=저장된 분할 내용이 요청과 일치하지 않습니다. 새 작업을 시작하세요.
translation.language-changed=모델이 다른 대상 언어를 반환하여 번역문이 게시되지 않았습니다.
translation.job-conflict=이 작업 ID는 다른 요청에 사용 중입니다. 번역을 다시 여세요.
translation.job-active=작업이 중지된 후 버리세요.
translation.job-not-found=이 번역 작업이 더 이상 존재하지 않습니다.
