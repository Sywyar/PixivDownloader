gui.config.field.translation.engine.label=번역 엔진
gui.config.field.translation.engine.help=소설 수동 및 자동 번역에 사용합니다. AI 모델은 AI 플러그인 설정을 사용합니다. 플러그인을 사용할 수 없으면 플러그인 관리에서 「AI 모델」을 설치하거나 활성화한 후 앱을 다시 시작하세요.
gui.config.field.translation.youdao-app-key.label=Youdao 앱 ID
gui.config.field.translation.youdao-app-key.help=Youdao 텍스트 번역 API의 앱 ID입니다.
gui.config.field.translation.youdao-app-secret.label=Youdao 앱 비밀 키
gui.config.field.translation.youdao-app-secret.help=번역 플러그인이 저장하는 Youdao 인증 정보입니다.
gui.config.field.translation.libretranslate-url.label=LibreTranslate 서비스 URL
gui.config.field.translation.libretranslate-url.help=예: http://127.0.0.1:5000. 로컬 서비스를 오프라인으로 사용하려면 먼저 모델을 설치하세요.
gui.config.field.translation.libretranslate-api-key.label=API 키 (선택 사항)
gui.config.field.translation.libretranslate-api-key.help=서비스에서 API 키를 요구하지 않으면 비워 두세요.
gui.config.field.translation.max-concurrent.label=동시에 번역할 작업 수
gui.config.field.translation.max-concurrent.help=다운로드 후 자동 번역 작업 수의 상한입니다. 같은 시리즈의 장은 순서대로 실행됩니다. 실제 요청 동시성은 엔진별 요청 설정으로도 제한됩니다.
translation.invalid-request=번역 요청이 올바르지 않습니다. 작품, 대상 언어, 번역 범위를 확인하세요.
gui.config.section.translation.service.help=AI는 「AI 모델」의 설정을 사용합니다. 오프라인 번역을 하려면 먼저 로컬에서 LibreTranslate를 실행하고 언어 모델을 설치하세요.
gui.config.section.translation.automatic.title=자동 번역
gui.config.section.translation.automatic.help=다운로드 후 자동 번역에도 위에서 선택한 엔진을 사용합니다. 여러 시리즈를 동시에 번역할 수 있으며, 같은 시리즈의 장은 순서대로 번역합니다.

dialog.engine=번역 서비스: {engine}
