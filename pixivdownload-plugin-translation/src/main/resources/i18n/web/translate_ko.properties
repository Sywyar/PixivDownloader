dialog.languages-failed=언어를 불러오지 못했습니다. 번역 서비스 연결을 확인한 후 다시 시도하세요.
translation.language-unsupported=선택한 언어 또는 번역 방향을 지원하지 않습니다. 다른 대상 언어를 선택하세요.
translation.credentials-error=번역 서비스 인증에 실패했습니다. 앱 ID, 비밀 키 및 접근 권한을 확인하세요.
translation.service-not-enabled=Youdao 앱에 필요한 텍스트 번역 서비스가 활성화되어 있지 않습니다. Youdao 콘솔에서 서비스 연결과 접속 방식을 확인하세요.
translation.clock-error=Youdao에서 요청 시각을 거부했습니다. 컴퓨터 시계를 맞춘 후 다시 시도하세요.
translation.balance-error=Youdao 계정의 잔액이 부족합니다. Youdao 콘솔에서 잔액을 확인하세요.
translation.rate-limited=번역 요청이 너무 많습니다. 잠시 후 다시 시도하세요.
dialog.machine-segment-label=구간당 최대 문자 수
dialog.ai-segment-hint=0이면 AI 분할 설정(현재 {count}자)을 사용합니다. 해당 설정도 0이면 장 전체를 전송합니다. 모델의 컨텍스트 및 출력 제한은 계속 적용됩니다.
dialog.machine-segment-hint=0이면 현재 서비스 설정(요청당 최대 {count}자)을 사용합니다. 짧은 구간은 묶어서 전송하며, 더 작은 값을 입력하면 추가로 분할합니다.
translation.cancelled=번역이 중지되었습니다. 완료된 장과 체크포인트는 보존됩니다.
translation.invalid-settings=번역 서비스 설정이 허용 범위를 벗어났습니다. 설정을 확인하세요.
gui.config.section.translation.requests.title=번역 요청
gui.config.section.translation.requests.help=현재 서비스에 맞게 긴 텍스트 처리와 요청 간격을 조정합니다. 제공업체 또는 배포 환경의 제한도 적용됩니다.
gui.config.field.translation.ai-segment-size.label=AI 기본 분할 문자 수
gui.config.field.translation.ai-segment-size.help=0이면 장 전체를 보내고, 양수이면 단락을 모아 분할합니다. 문자 수는 토큰 수와 다르므로 모델의 컨텍스트 및 출력 용량에 맞추세요. 개별 작업에서 재정의할 수 있습니다.
gui.config.field.translation.request.request-chars.label=요청당 최대 문자 수
gui.config.field.translation.youdao.request-chars.help=Youdao의 쿼리당 최대 길이는 5000자입니다. 배치 내 모든 텍스트의 유니코드 문자 수를 합산합니다. 계정 제한에 맞게 낮출 수 있습니다.
gui.config.field.translation.libretranslate.request-chars.help=배포 환경 또는 API 키의 문자 수 제한에 맞추세요. 개별 텍스트와 배치 합계 모두에 적용됩니다. 5000자는 클라이언트 기본값이며 LibreTranslate의 공통 상한이 아닙니다.
gui.config.field.translation.request.batch-size.label=배치당 최대 텍스트 수
gui.config.field.translation.request.batch-size.help=줄바꿈과 마크업을 유지하면서 짧은 구간을 묶어 요청합니다. 1이면 개별 전송합니다. 서버의 배치 제한에 맞추세요.
gui.config.field.translation.request.request-interval-ms.label=최소 전송 간격(ms)
gui.config.field.translation.request.request-interval-ms.help=Youdao는 요청 단위로, LibreTranslate는 배치 내 텍스트 수를 곱한 간격을 적용합니다. 0이면 간격을 두지 않습니다. 수동·자동 번역이 공유하며 제공업체 할당량도 적용됩니다.
gui.config.field.translation.request.request-concurrency.label=동시 요청 수
gui.config.field.translation.request.request-concurrency.help=이 엔진의 모든 수동·자동 번역이 공유하는 진행 중 요청의 상한입니다. 동시 요청 수를 늘려도 제공업체의 호출 제한은 늘어나지 않습니다.
gui.config.field.translation.request.max-retries.label=호출 제한 시 최대 재시도 횟수
gui.config.field.translation.request.max-retries.help=명시적인 호출 제한 응답에만 대기 시간을 늘리며 현재 배치를 재시도합니다. 0이면 재시도하지 않습니다. 인증 실패, 시간 초과 및 기타 오류는 재전송하지 않습니다.
gui.config.field.translation.request.read-timeout-seconds.label=응답 제한 시간(초)
gui.config.field.translation.request.read-timeout-seconds.help=한 요청의 응답을 기다리는 상한이며, 대기열 및 호출 제한 대기는 제외합니다. 느린 로컬 모델은 필요에 따라 늘릴 수 있습니다.
gui.config.field.translation.request.use-proxy.label=이 서비스에 프록시 사용
gui.config.field.translation.request.use-proxy.help=호스트에 설정된 프록시를 사용합니다. 로컬 LibreTranslate에서는 보통 끕니다. AI 프록시는 AI 모델 설정에서 관리합니다.
