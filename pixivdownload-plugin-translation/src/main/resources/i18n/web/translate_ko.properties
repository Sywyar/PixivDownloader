progress.warn-long=용어의 앞뒤 일관성을 위해 시리즈 번역은 순차적으로 실행됩니다. 한 편은 약 수십 초, 전체 시리즈는 수 분에서 수십 분이 걸릴 수 있습니다.
progress.warn-cancel="취소"를 클릭하면: 번역을 완료한 장은 로컬 DB에 보존됩니다. 현재 대기 중인 장은 백그라운드에서 DB에 기록될 수 있지만 이번 합본에는 포함되지 않습니다. 시작하지 않은 장은 번역하지 않습니다. 새로 번역된 장이 하나라도 있으면 해당 언어의 합본은 계속 생성됩니다.
