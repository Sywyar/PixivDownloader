gui.config.field.translation.engine.label=Translation engine
gui.config.field.translation.engine.help=Used for manual and automatic novel translation. AI models use the AI plugin settings. If the plugin is unavailable, install or enable “AI models” in plugin management, then restart the app.
gui.config.field.translation.youdao-app-key.label=Youdao application ID
gui.config.field.translation.youdao-app-key.help=Application ID for the Youdao text translation API.
gui.config.field.translation.youdao-app-secret.label=Youdao application secret
gui.config.field.translation.youdao-app-secret.help=Youdao credentials stored by the translation plugin.
gui.config.field.translation.libretranslate-url.label=LibreTranslate service URL
gui.config.field.translation.libretranslate-url.help=Enter the service base URL, for example http://127.0.0.1:5000. Install its models first to use a local service offline.
gui.config.field.translation.libretranslate-api-key.label=API key (optional)
gui.config.field.translation.libretranslate-api-key.help=Leave empty if the service does not require an API key.
gui.config.field.translation.max-concurrent.label=Concurrent translations
gui.config.field.translation.max-concurrent.help=Maximum automatic translation jobs after download; chapters in one series run in order. Each engine’s request settings also limit actual request concurrency.
translation.invalid-request=Invalid translation request. Check the work, target language and selected fields.
gui.config.section.translation.service.help=AI uses the settings in “AI models”. For offline translation, run LibreTranslate locally and install its language models first.
gui.config.section.translation.automatic.title=Automatic translation
gui.config.section.translation.automatic.help=Translation after download uses the engine selected above. Different series can run in parallel; chapters within a series run in order.

