dialog.languages-failed=Could not load languages. Check the translation service connection and retry.
translation.language-unsupported=This service does not support the selected language or translation direction. Choose another target language.
translation.credentials-error=Translation service authentication failed. Check the application ID, secret and access permissions.
translation.service-not-enabled=The Youdao application does not have the required text translation service enabled. Check the service binding and access method in the Youdao console.
translation.clock-error=Youdao rejected the request timestamp. Correct your computer clock and retry.
translation.balance-error=The Youdao account has insufficient balance. Check the balance in the Youdao console.
translation.rate-limited=Too many translation requests. Try again later.
dialog.machine-segment-label=Characters per segment
dialog.ai-segment-hint=0 uses the AI segment setting (currently {count} characters); a setting of 0 sends the whole chapter. Model context and output limits still apply.
dialog.machine-segment-hint=0 uses this service’s setting (up to {count} characters per request). Short segments are batched; enter a smaller value to split further.
translation.cancelled=Translation stopped. Completed chapters and checkpoints are retained.
translation.invalid-settings=Translation service settings are outside the allowed range. Check Settings.
gui.config.section.translation.requests.title=Translation requests
gui.config.section.translation.requests.help=Adjust long-text handling and request pacing for this service. Provider or deployment limits still apply.
gui.config.field.translation.ai-segment-size.label=Default AI segment size
gui.config.field.translation.ai-segment-size.help=0 sends the whole chapter; a positive value groups paragraphs into segments. Match the model’s context and output capacity: characters are not tokens. An individual operation can override this value.
gui.config.field.translation.request.request-chars.label=Maximum characters per request
gui.config.field.translation.youdao.request-chars.help=Youdao allows up to 5,000 characters per query. Counts Unicode characters across all texts in a batch; lower this value if your account requires it.
gui.config.field.translation.libretranslate.request-chars.help=Match the character limit of your deployment or API key. Caps both each text and the batch total. 5,000 is a client default, not a universal LibreTranslate limit.
gui.config.field.translation.request.batch-size.label=Maximum texts per batch
gui.config.field.translation.request.batch-size.help=Groups short segments into batch requests while preserving line breaks and markup. 1 sends texts individually. Match the server’s batch limit.
gui.config.field.translation.request.request-interval-ms.label=Minimum send interval (ms)
gui.config.field.translation.request.request-interval-ms.help=Youdao counts requests; LibreTranslate multiplies the interval by the number of texts in a batch. 0 disables pacing. Shared by manual and automatic translations; provider quotas still apply.
gui.config.field.translation.request.request-concurrency.label=Concurrent requests
gui.config.field.translation.request.request-concurrency.help=Maximum in-flight requests shared by all manual and automatic translations using this engine. More concurrency does not raise the provider’s rate limit.
gui.config.field.translation.request.max-retries.label=Maximum rate-limit retries
gui.config.field.translation.request.max-retries.help=Retries only the current batch after an explicit rate-limit response, with increasing waits. 0 disables retries. Authentication errors, timeouts and other failures are not replayed.
gui.config.field.translation.request.read-timeout-seconds.label=Response timeout (seconds)
gui.config.field.translation.request.read-timeout-seconds.help=Maximum wait for a response to one request, excluding queue and rate-limit waits. Increase for slower local models if needed.
gui.config.field.translation.request.use-proxy.label=Use proxy for this service
gui.config.field.translation.request.use-proxy.help=Uses the host’s configured proxy. Usually off for local LibreTranslate. AI proxy settings remain under AI models.
