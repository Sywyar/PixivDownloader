gui.config.field.translation.engine.label=翻译引擎
gui.config.field.translation.engine.help=用于小说手动翻译和下载后自动翻译。AI 模型沿用 AI 插件的配置；插件不可用时，请在插件管理中安装或启用「AI 模型」，然后重启应用。
