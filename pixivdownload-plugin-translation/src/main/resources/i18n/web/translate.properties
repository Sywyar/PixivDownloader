gui.config.field.translation.youdao-app-secret.help=由翻译插件单独保存的有道凭证。
gui.config.field.translation.libretranslate-url.label=LibreTranslate 服务地址
gui.config.field.translation.libretranslate-url.help=填写服务根地址，例如 http://127.0.0.1:5000。本机服务需先安装模型；准备完成后可离线使用。
gui.config.field.translation.libretranslate-api-key.label=API 密钥（可选）
gui.config.field.translation.libretranslate-api-key.help=服务未启用密钥认证时留空。
gui.config.field.translation.max-concurrent.label=同时翻译的任务数
gui.config.field.translation.max-concurrent.help=下载后自动翻译的任务数上限；同系列章节按顺序执行。实际发送并发还受各引擎请求设置限制。
translation.invalid-request=翻译请求无效，请检查作品、目标语言与翻译范围。
gui.config.section.translation.service.help=AI 使用「AI 模型」中的设置。本地离线翻译需先运行 LibreTranslate 服务并安装语言模型。
gui.config.section.translation.automatic.title=自动翻译
