translation.language-unsupported=此服务不支持所选语言或翻译方向，请选择其他目标语言。
translation.credentials-error=翻译服务验证失败，请检查应用 ID、密钥及访问权限。
translation.service-not-enabled=有道应用尚未开通对应的文本翻译服务，请在有道控制台检查服务绑定和接入方式。
translation.clock-error=有道拒绝了请求时间，请校准电脑时钟后重试。
translation.balance-error=有道账户余额不足，请在有道控制台检查余额。
translation.rate-limited=翻译请求过于频繁，请稍后重试。
dialog.machine-segment-label=每段最多字符
dialog.ai-segment-hint=0 使用 AI 分段设置（当前 {count} 字符）；设置为 0 时发送整章。模型的上下文与输出上限仍然适用。
dialog.machine-segment-hint=0 使用当前服务设置（每次最多 {count} 字符）。短段落会批量发送；填写较小值可进一步分段。
translation.cancelled=翻译已停止。已完成章节和检查点已保留。
translation.invalid-settings=翻译服务参数超出允许范围，请检查设置。
gui.config.section.translation.requests.title=翻译请求
gui.config.section.translation.requests.help=按当前服务调整长文本处理和请求节奏。服务商或本地部署的限制仍然适用。
gui.config.field.translation.ai-segment-size.label=AI 默认分段字数
gui.config.field.translation.ai-segment-size.help=0 发送整章；正数按段落累计分段。按模型上下文和输出容量调整，字符数不等同于 token 数。单次操作可覆盖此值。
gui.config.field.translation.request.request-chars.label=每次请求最多字符
gui.config.field.translation.youdao.request-chars.help=有道单次查询最多 5000 字符。按 Unicode 字符计数，批量请求中的所有文本合计不超过此值；可降低以适应账户限制。
gui.config.field.translation.libretranslate.request-chars.help=按部署方或 API 密钥的字符限制填写。此值限制批次总字符数，也限制单段；5000 是客户端默认预算，不是 LibreTranslate 的统一上限。
gui.config.field.translation.request.batch-size.label=每批最多文本数
gui.config.field.translation.request.batch-size.help=短段落合并为批量请求，仍保留换行和标记。1 表示逐段发送；按服务端批量条数限制调整。
gui.config.field.translation.request.request-interval-ms.label=最小发送间隔（毫秒）
gui.config.field.translation.request.request-interval-ms.help=有道按请求计算；LibreTranslate 按批次内文本条数累计间隔。0 不主动限速。间隔由所有手动和自动翻译共享；账户限额以服务方为准。
gui.config.field.translation.request.request-concurrency.label=同时发送的请求数
gui.config.field.translation.request.request-concurrency.help=此引擎所有手动和自动翻译共用的在途请求上限。增加并发不会提高服务商允许的调用频率。
gui.config.field.translation.request.max-retries.label=限流后最多重试次数
gui.config.field.translation.request.max-retries.help=仅在服务明确返回限流时重试当前批次，逐次延长等待；0 不重试。认证失败、超时和其他错误不会自动重发。
gui.config.field.translation.request.read-timeout-seconds.label=响应等待时间（秒）
gui.config.field.translation.request.read-timeout-seconds.help=单次请求等候响应的上限，不含排队或限流等待。较慢的本地翻译模型可适当调高。
gui.config.field.translation.request.use-proxy.label=此服务使用代理
gui.config.field.translation.request.use-proxy.help=使用宿主中配置的代理。连接本地 LibreTranslate 时通常关闭；AI 的代理在 AI 模型设置中管理。
