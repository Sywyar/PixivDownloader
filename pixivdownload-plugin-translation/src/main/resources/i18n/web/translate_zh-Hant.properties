dialog.machine-segment-label=每段最多字元
dialog.ai-segment-hint=0 使用 AI 分段設定（目前 {count} 字元）；設定為 0 時傳送整章。模型的上下文與輸出上限仍然適用。
dialog.machine-segment-hint=0 使用目前服務設定（每次最多 {count} 字元）。短段落會批次傳送；填寫較小值可進一步分段。
translation.cancelled=翻譯已停止。已完成章節和檢查點已保留。
translation.invalid-settings=翻譯服務參數超出允許範圍，請檢查設定。
gui.config.section.translation.requests.title=翻譯請求
gui.config.section.translation.requests.help=依目前服務調整長文本處理和請求間隔。服務商或本機部署的限制仍然適用。
gui.config.field.translation.ai-segment-size.label=AI 預設分段字數
gui.config.field.translation.ai-segment-size.help=0 傳送整章；正數按段落累計分段。依模型上下文和輸出容量調整，字元數不等同於 token 數。單次操作可覆寫此值。
gui.config.field.translation.request.request-chars.label=每次請求最多字元
gui.config.field.translation.youdao.request-chars.help=有道單次查詢最多 5000 字元。按 Unicode 字元計數，批次請求中的所有文本合計不超過此值；可降低以適應帳戶限制。
gui.config.field.translation.libretranslate.request-chars.help=依部署方或 API 金鑰的字元限制填寫。此值限制批次總字元數，也限制單段；5000 是用戶端預設預算，不是 LibreTranslate 的統一上限。
gui.config.field.translation.request.batch-size.label=每批最多文本數
gui.config.field.translation.request.batch-size.help=短段落合併為批次請求，仍保留換行和標記。1 表示逐段傳送；依伺服器批次條數限制調整。
gui.config.field.translation.request.request-interval-ms.label=最小傳送間隔（毫秒）
gui.config.field.translation.request.request-interval-ms.help=有道按請求計算；LibreTranslate 按批次內文本條數累計間隔。0 不主動限速。間隔由所有手動和自動翻譯共用；帳戶限額以服務方為準。
gui.config.field.translation.request.request-concurrency.label=同時傳送的請求數
gui.config.field.translation.request.request-concurrency.help=此引擎所有手動和自動翻譯共用的進行中請求上限。增加並行數不會提高服務商允許的呼叫頻率。
gui.config.field.translation.request.max-retries.label=限流後最多重試次數
gui.config.field.translation.request.max-retries.help=僅在服務明確回傳限流時重試目前批次，逐次延長等待；0 不重試。驗證失敗、逾時和其他錯誤不會自動重送。
gui.config.field.translation.request.read-timeout-seconds.label=回應等待時間（秒）
gui.config.field.translation.request.read-timeout-seconds.help=單次請求等候回應的上限，不含排隊或限流等待。較慢的本機翻譯模型可適當調高。
gui.config.field.translation.request.use-proxy.label=此服務使用代理
gui.config.field.translation.request.use-proxy.help=使用宿主中設定的代理。連線本機 LibreTranslate 時通常關閉；AI 的代理在 AI 模型設定中管理。
