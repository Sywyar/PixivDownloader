gui.config.field.translation.youdao-app-secret.help=由翻譯插件獨立儲存的有道憑證。
gui.config.field.translation.libretranslate-url.label=LibreTranslate 服務位址
gui.config.field.translation.libretranslate-url.help=填入服務根位址，例如 http://127.0.0.1:5000。本機服務需先安裝模型，準備完成後可離線使用。
gui.config.field.translation.libretranslate-api-key.label=API 金鑰（選填）
gui.config.field.translation.libretranslate-api-key.help=服務未啟用密鑰驗證時留空。
gui.config.field.translation.max-concurrent.label=同時翻譯的工作數
