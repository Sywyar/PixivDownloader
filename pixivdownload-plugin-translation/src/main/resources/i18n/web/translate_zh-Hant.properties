translation.invalid-request=翻譯請求無效，請檢查作品、目標語言與翻譯範圍。
gui.config.section.translation.service.help=AI 使用「AI 模型」中的設定。本機離線翻譯需先執行 LibreTranslate 服務並安裝語言模型。
