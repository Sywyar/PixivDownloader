gui.config.field.translation.engine.help=用於小說手動翻譯和下載後自動翻譯。AI 模型沿用 AI 插件設定；外掛程式無法使用時，請在外掛程式管理中安裝或啟用「AI 模型」，然後重新啟動應用程式。
