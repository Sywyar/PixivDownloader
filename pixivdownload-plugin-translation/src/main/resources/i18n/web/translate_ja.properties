progress.warn-long=用語の一貫性を保つため、シリーズ翻訳は順番に実行します。1件あたり数十秒、シリーズ全体では数分から十数分かかる場合があります。
progress.warn-cancel=「キャンセル」をクリックした場合：翻訳済みの章はローカルデータベースに残ります。現在待機中の章はバックグラウンドでデータベースに書き込まれる可能性がありますが、今回の合本には含まれません。未開始の章は翻訳されません。新しい翻訳済みの章が1つでもあれば、その言語の合本は生成されます。
progress.btn-hide=非表示
