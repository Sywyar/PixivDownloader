gui.config.field.translation.engine.label=翻訳エンジン
gui.config.field.translation.engine.help=小説の手動・自動翻訳に使用します。AI モデルは AI プラグインの設定を使用します。プラグインを利用できない場合は、プラグイン管理で「AI モデル」をインストールまたは有効化し、アプリを再起動してください。
gui.config.field.translation.youdao-app-key.label=Youdao アプリ ID
gui.config.field.translation.youdao-app-key.help=Youdao テキスト翻訳 API のアプリ ID。
gui.config.field.translation.youdao-app-secret.label=Youdao アプリシークレット
gui.config.field.translation.youdao-app-secret.help=翻訳プラグインが保存する Youdao の認証情報。
gui.config.field.translation.libretranslate-url.label=LibreTranslate サービス URL
gui.config.field.translation.libretranslate-url.help=例：http://127.0.0.1:5000。ローカルでオフライン利用するには、先にサービスのモデルをインストールしてください。
gui.config.field.translation.libretranslate-api-key.label=API キー（任意）
gui.config.field.translation.libretranslate-api-key.help=サービスが API キーを要求しない場合は空欄にします。
gui.config.field.translation.max-concurrent.label=同時に翻訳する件数
gui.config.field.translation.max-concurrent.help=ダウンロード後の自動翻訳タスク数の上限です。同じシリーズの章は順番に実行します。実際の送信同時数は各エンジンの設定でも制限されます。
translation.invalid-request=翻訳リクエストが無効です。作品、翻訳先言語、翻訳範囲を確認してください。
gui.config.section.translation.service.help=AI は「AI モデル」の設定を使用します。オフライン翻訳には、ローカルでの LibreTranslate の起動と言語モデルのインストールが必要です。
gui.config.section.translation.automatic.title=自動翻訳
gui.config.section.translation.automatic.help=ダウンロード後の自動翻訳にも上で選んだエンジンを使用します。複数のシリーズを並行して翻訳し、同じシリーズ内の章は順番に翻訳します。

dialog.engine=翻訳サービス：{engine}
dialog.languages-retry=言語を再読み込み
dialog.languages-loading=対応言語を読み込んでいます…
dialog.languages-empty=このサービスには利用可能な翻訳言語がありません。言語モデルをインストールしてから再読み込みしてください。
dialog.language-choose=翻訳先の言語を選択
dialog.languages-hint=このサービスが対応する翻訳先の言語を選択してください。
dialog.languages-failed=言語を読み込めませんでした。翻訳サービスへの接続を確認して再試行してください。
translation.language-unsupported=選択した言語または翻訳方向には対応していません。別の翻訳先言語を選択してください。
translation.credentials-error=翻訳サービスの認証に失敗しました。アプリ ID、シークレット、アクセス権限を確認してください。
translation.service-not-enabled=有道のアプリで必要なテキスト翻訳サービスが有効になっていません。有道コンソールでサービスの紐付けと接続方法を確認してください。
translation.clock-error=有道がリクエストの時刻を拒否しました。パソコンの時計を合わせて再試行してください。
translation.balance-error=有道アカウントの残高が不足しています。有道コンソールで残高を確認してください。
translation.rate-limited=翻訳リクエストが多すぎます。しばらく待ってから再試行してください。
dialog.machine-segment-label=1 区切りの最大文字数
dialog.ai-segment-hint=0 は AI の分割設定（現在 {count} 文字）を使用します。設定が 0 の場合は章全体を送信します。モデルのコンテキストと出力上限は引き続き適用されます。
dialog.machine-segment-hint=0 は現在のサービス設定（1 回につき最大 {count} 文字）を使用します。短い段落はまとめて送信されます。小さい値を指定すると、さらに分割されます。
translation.cancelled=翻訳を停止しました。完了した章とチェックポイントは保持されています。
translation.invalid-settings=翻訳サービスの設定が許容範囲を超えています。設定を確認してください。
gui.config.section.translation.requests.title=翻訳リクエスト
gui.config.section.translation.requests.help=現在のサービスに合わせて長文処理と送信間隔を調整します。提供元またはローカル環境の制限も適用されます。
gui.config.field.translation.ai-segment-size.label=AI の既定の分割文字数
gui.config.field.translation.ai-segment-size.help=0 は章全体を送信し、正の値は段落をまとめて分割します。文字数とトークン数は異なるため、モデルの容量に合わせて調整してください。操作ごとに上書きできます。
gui.config.field.translation.request.request-chars.label=1 リクエストの最大文字数
gui.config.field.translation.youdao.request-chars.help=有道の単一クエリは最大 5000 文字です。バッチ内の全テキストの Unicode 文字数を合計します。アカウントの制限に応じて減らせます。
gui.config.field.translation.libretranslate.request-chars.help=利用環境または API キーの文字数制限に合わせてください。各テキストとバッチ合計の両方を制限します。5000 はクライアントの既定値であり、LibreTranslate 共通の上限ではありません。
gui.config.field.translation.request.batch-size.label=1 バッチの最大テキスト数
gui.config.field.translation.request.batch-size.help=改行と記法を保持しながら短い段落をまとめて送信します。1 は個別送信です。サーバーのバッチ上限に合わせてください。
gui.config.field.translation.request.request-interval-ms.label=最小送信間隔（ミリ秒）
gui.config.field.translation.request.request-interval-ms.help=有道はリクエスト単位、LibreTranslate はバッチ内のテキスト数を掛けた間隔を使います。0 は送信間隔を設けません。手動・自動翻訳で共有し、提供元の制限も適用されます。
gui.config.field.translation.request.request-concurrency.label=同時送信リクエスト数
gui.config.field.translation.request.request-concurrency.help=このエンジンの手動・自動翻訳が共有する同時実行リクエスト上限です。同時数を増やしても提供元の頻度制限は変わりません。
gui.config.field.translation.request.max-retries.label=頻度制限後の最大再試行回数
gui.config.field.translation.request.max-retries.help=明示的な頻度制限応答時のみ、待機時間を延ばして現在のバッチを再試行します。0 は再試行しません。認証失敗、タイムアウト、その他のエラーは再送しません。
gui.config.field.translation.request.read-timeout-seconds.label=応答タイムアウト（秒）
gui.config.field.translation.request.read-timeout-seconds.help=1 回の応答待ちの上限です。キューや頻度制限による待機は含みません。遅いローカルモデルでは必要に応じて増やせます。
gui.config.field.translation.request.use-proxy.label=このサービスでプロキシを使用
gui.config.field.translation.request.use-proxy.help=ホストで設定したプロキシを使用します。ローカルの LibreTranslate では通常オフにします。AI のプロキシは AI モデル設定で管理します。
