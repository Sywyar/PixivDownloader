translation.job-capacity=タスクまたはチェックポイントの容量上限です。不要な一時停止タスクを破棄してください。
translation.job-storage=進捗を保存できません。データベースと空き容量を確認してください。
translation.checkpoint-conflict=保存した分割内容が一致しません。新しいタスクを作成してください。
translation.language-changed=モデルが別の言語を返したため、訳文は公開されませんでした。
translation.job-conflict=このタスク ID は別のリクエストに使われています。「翻訳」を開き直してください。
translation.job-active=タスクが停止してから破棄してください。
