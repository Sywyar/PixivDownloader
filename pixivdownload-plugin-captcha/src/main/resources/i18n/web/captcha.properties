recaptcha-sitekey.help=填写 Google reCAPTCHA 控制台中“v2／我不是机器人”复选框类型的 Site key。修改后需重新发布页面。
recaptcha-secret.help=填写同一站点的 Secret key。加密保存，不会发送给浏览器；留空保存会保留已有密钥。
recaptcha-hostname.help=填写访问站点的主机名，例如 download.example.com，不含协议、端口或路径。本地使用 localhost。修改后需重新发布页面。
recaptcha-test-mode.help=仅用于 Google 官方 v2 测试密钥，不提供防自动化保护；正式站点请关闭。修改后需重新发布页面。
