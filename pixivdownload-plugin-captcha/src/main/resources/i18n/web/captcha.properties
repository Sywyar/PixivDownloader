category=验证码
category.help=选择在线或离线验证，拖入表单后绑定需要保护的操作。
altcha-secret.help=首次启用时自动生成并加密保存，通常无需修改。手动替换须至少 32 字符；留空保存会保留已有密钥。
turnstile-sitekey.help=填写 Cloudflare Turnstile 控制台提供的 Sitekey（站点公钥）。修改后需重新发布使用 Turnstile 的页面。
turnstile-secret.help=填写同一 Turnstile 控件的 Secret key（服务端密钥）。加密保存，不会发送给浏览器；留空保存会保留已有密钥。
turnstile-hostname.help=填写访问站点的主机名，例如 download.example.com，不含协议、端口或路径，并在 Cloudflare 中允许该域名。修改后需重新发布页面。
turnstile-test-mode.help=仅配合 Cloudflare 官方测试密钥使用，测试时预期主机名填 example.com。测试配置不提供防自动化保护，正式站点请关闭。修改后需重新发布页面。
log.unavailable=验证码不可用 id={0} policy={1} reason={2} field={3}
log.rejected=验证码被拒绝 id={0} policy={1} reason={2}
log.key-initialized=验证码本地签名密钥已初始化
