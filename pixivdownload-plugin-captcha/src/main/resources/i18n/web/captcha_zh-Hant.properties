recaptcha-sitekey.help=填入 Google reCAPTCHA 控制台中「v2／我不是機器人」核取方塊類型的 Site key。修改後需重新發佈頁面。
recaptcha-secret.help=填入同一網站的 Secret key。加密儲存，不會傳送至瀏覽器；留白儲存會保留現有密鑰。
recaptcha-hostname.help=填入網站的主機名稱，例如 download.example.com，不含通訊協定、連接埠或路徑。本機使用 localhost。修改後需重新發佈頁面。
recaptcha-test-mode.help=僅用於 Google 官方 v2 測試密鑰，不提供防機器人保護；正式網站請關閉。修改後需重新發佈頁面。
