category=驗證碼
category.help=選擇線上或離線驗證，拖入表單後綁定需要保護的操作。
altcha-secret.help=首次啟用時自動產生並加密儲存，通常無需修改。手動替換須至少 32 字元；留空儲存會保留既有金鑰。
turnstile-sitekey.help=填入 Cloudflare Turnstile 控制台提供的 Sitekey（網站公鑰）。修改後須重新發佈使用 Turnstile 的頁面。
turnstile-secret.help=填入同一 Turnstile 控件的 Secret key（伺服器金鑰）。加密儲存，不會傳送給瀏覽器；留空儲存會保留既有金鑰。
turnstile-hostname.help=填入使用者存取網站的主機名稱，例如 download.example.com，不含通訊協定、連接埠或路徑，並在 Cloudflare 中允許該網域。修改後須重新發佈頁面。
turnstile-test-mode.help=僅搭配 Cloudflare 官方測試金鑰使用，測試時預期主機名稱填 example.com。測試設定不提供防自動化保護，正式網站請關閉。修改後須重新發佈頁面。
log.unavailable=驗證碼無法使用 id={0} policy={1} reason={2} field={3}
log.rejected=驗證碼遭拒絕 id={0} policy={1} reason={2}
log.key-initialized=驗證碼本地簽章金鑰已初始化
