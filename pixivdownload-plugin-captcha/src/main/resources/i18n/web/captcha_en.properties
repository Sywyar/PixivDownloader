recaptcha-sitekey.help=Use the Site key for a Google reCAPTCHA v2 “I'm not a robot” checkbox. Republish the page after changing this setting.
recaptcha-secret.help=Use the Secret key for the same site. Stored encrypted and never sent to the browser; leave blank to keep the saved key.
recaptcha-hostname.help=Enter the site's hostname, such as download.example.com, without a scheme, port or path. Use localhost for local testing. Republish the page after changing this setting.
recaptcha-test-mode.help=Only for Google's official v2 test keys. Provides no bot protection; disable for production. Republish the page after changing this setting.
