category=CAPTCHA
category.help=Choose online or offline verification and drop it into a form to bind the protected operation.
altcha-secret.help=Generated and encrypted on first activation; normally no change is needed. A manual replacement requires at least 32 characters. Leave blank to keep the saved key.
turnstile-sitekey.help=Enter the Sitekey from your Cloudflare Turnstile widget. Republish pages using Turnstile after changing it.
turnstile-secret.help=Enter the Secret key for the same Turnstile widget. It is encrypted and never sent to the browser. Leave blank to keep the saved key.
turnstile-hostname.help=Enter the hostname visitors use, such as download.example.com, without a scheme, port or path, and allow it in Cloudflare. Republish the page after changing it.
turnstile-test-mode.help=Use only with Cloudflare's official test keys and set the expected hostname to example.com. Test configuration provides no bot protection; turn this off in production. Republish the page after changing it.
