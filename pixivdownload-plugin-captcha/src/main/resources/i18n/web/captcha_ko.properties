recaptcha-sitekey.help=Google reCAPTCHA 콘솔에서 v2 ‘로봇이 아닙니다’ 체크박스 유형의 Site key를 입력하세요. 변경 후 페이지를 다시 게시하세요.
recaptcha-secret.help=같은 사이트의 Secret key를 입력하세요. 암호화하여 저장하며 브라우저로 보내지 않습니다. 비워 두면 기존 키를 유지합니다.
recaptcha-hostname.help=download.example.com 같은 호스트 이름을 입력하세요. 프로토콜, 포트, 경로는 제외합니다. 로컬에서는 localhost를 사용하세요. 변경 후 페이지를 다시 게시하세요.
recaptcha-test-mode.help=Google 공식 v2 테스트 키 전용입니다. 봇을 차단하지 않으므로 운영 사이트에서는 끄세요. 변경 후 페이지를 다시 게시하세요.
