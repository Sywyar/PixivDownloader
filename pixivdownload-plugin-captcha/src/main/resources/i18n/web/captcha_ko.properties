category.help=온라인 또는 오프라인 인증을 선택하고 양식에 놓아 보호할 작업에 연결하세요.
altcha-secret.help=처음 활성화할 때 자동으로 생성하여 암호화해 저장하므로 보통 변경할 필요가 없습니다. 직접 교체하려면 32자 이상이어야 합니다. 비워 두고 저장하면 기존 키를 유지합니다.
turnstile-sitekey.help=Cloudflare Turnstile 위젯의 Sitekey(사이트 키)를 입력하세요. 변경한 뒤에는 Turnstile을 사용하는 페이지를 다시 게시하세요.
turnstile-secret.help=같은 Turnstile 위젯의 Secret key(비밀 키)를 입력하세요. 암호화해 저장하며 브라우저로 전송하지 않습니다. 비워 두고 저장하면 기존 키를 유지합니다.
turnstile-hostname.help=download.example.com처럼 사용자가 접속하는 호스트 이름을 입력하고 Cloudflare에서도 허용하세요. 프로토콜, 포트, 경로는 제외합니다. 변경한 뒤에는 페이지를 다시 게시하세요.
turnstile-test-mode.help=Cloudflare 공식 테스트 키와 함께 사용할 때만 켜고 예상 호스트 이름을 example.com으로 설정하세요. 봇을 차단하지 않으므로 운영 환경에서는 끄세요. 변경한 뒤에는 페이지를 다시 게시하세요.
