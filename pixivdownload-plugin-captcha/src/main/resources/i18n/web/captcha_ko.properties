settings.component.help=설정할 구성 요소를 선택하세요. 전환해도 각 구성 요소의 설정과 저장하지 않은 변경 사항은 유지됩니다. 두 ALTCHA 알고리즘은 키를 공유하며, 문자 CAPTCHA와 슬라이더 퍼즐은 설정이 필요하지 않습니다.
