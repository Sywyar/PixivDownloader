recaptcha-sitekey.help=Google reCAPTCHA 管理画面の v2「私はロボットではありません」チェックボックス用 Site key を入力します。変更後はページを再公開してください。
recaptcha-secret.help=同じサイトの Secret key を入力します。暗号化して保存し、ブラウザーには送信しません。空欄で保存すると既存のキーを保持します。
recaptcha-hostname.help=download.example.com などのホスト名を入力します。スキーム、ポート、パスは含めません。ローカルでは localhost を使用します。変更後はページを再公開してください。
recaptcha-test-mode.help=Google 公式 v2 テストキー専用です。ボット対策にはなりません。本番では無効にしてください。変更後はページを再公開してください。
