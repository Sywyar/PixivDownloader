category=CAPTCHA
category.help=オンラインまたはオフラインの検証を選び、フォームに配置して保護する操作に関連付けます。
altcha-secret.help=初回有効化時に自動生成され、暗号化して保存されます。通常は変更不要です。手動で置き換える場合は 32 文字以上が必要です。空欄で保存すると既存のキーを保持します。
turnstile-sitekey.help=Cloudflare Turnstile ウィジェットの Sitekey（サイトキー）を入力します。変更後は Turnstile を使用するページを再公開してください。
turnstile-secret.help=同じ Turnstile ウィジェットの Secret key（シークレットキー）を入力します。暗号化して保存され、ブラウザーには送信されません。空欄で保存すると既存のキーを保持します。
turnstile-hostname.help=download.example.com など、利用者がアクセスするホスト名を入力し、Cloudflare 側でも許可します。プロトコル、ポート、パスは含めません。変更後はページを再公開してください。
turnstile-test-mode.help=Cloudflare の公式テストキーと組み合わせる場合のみ有効にし、想定ホスト名を example.com に設定します。ボット対策にはならないため、本番環境では無効にしてください。変更後はページを再公開してください。
