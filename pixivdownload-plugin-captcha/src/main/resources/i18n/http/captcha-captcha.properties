title=验证码图片
CaptchaImageController.image.GET.summary=查看已签发的验证码图片
CaptchaImageController.image.GET.description=用已签发图形验证的 id 读取第 0 或 1 张 PNG。无效或已失效时返回 404，响应禁止缓存。
CaptchaImageController.image.GET.success=已签发的验证码图片。
CaptchaImageController.image.GET.response.404=挑战 ID 无效、已失效或对应图片不存在。
parameter.id=已签发图形验证的标识，长度必须为 36 个字符。
parameter.index=挑战中的图片序号，只接受 0 和 1。
description=读取验证码挑战中的指定图片。
