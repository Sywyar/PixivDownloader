title=驗證碼圖片
CaptchaImageController.image.GET.summary=檢視已簽發的驗證碼圖片
CaptchaImageController.image.GET.description=用已簽發圖形驗證的 id 讀取第 0 或 1 張 PNG。無效或已失效時返回 404，響應禁止快取。
CaptchaImageController.image.GET.success=已簽發的驗證碼圖片。
CaptchaImageController.image.GET.response.404=挑戰 ID 無效、已失效或對應圖片不存在。
parameter.id=已簽發圖形驗證的標識，長度必須為 36 個字元。
parameter.index=挑戰中的圖片序號，只接受 0 和 1。
description=讀取驗證碼挑戰中的指定圖片。
