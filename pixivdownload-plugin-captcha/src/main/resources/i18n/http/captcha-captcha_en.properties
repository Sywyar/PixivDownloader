title=Verification images
CaptchaImageController.image.GET.summary=Get an issued challenge image
CaptchaImageController.image.GET.description=Read PNG image 0 or 1 of an issued challenge. Invalid or expired images return 404. Responses are not cached.
CaptchaImageController.image.GET.success=Issued challenge image.
CaptchaImageController.image.GET.response.404=The challenge ID is invalid or expired, or the requested image is absent.
parameter.id=Issued challenge identifier, exactly 36 characters.
parameter.index=Image number within the challenge, either 0 or 1.
description=Read an individual image from a CAPTCHA challenge.
