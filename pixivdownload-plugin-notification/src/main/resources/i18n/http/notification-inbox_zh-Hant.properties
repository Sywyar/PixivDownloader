schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxTestController.InboxTestResponse.field.success=本次操作報告的成功標記，HTTP 200 時也應檢查。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxTestController.InboxTestResponse.field.total=本次任務或統計涉及的條目總數。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxTestController.InboxTestResponse.field.succeeded=實際成功的條目數。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxTestController.InboxTestResponse.field.failures=逐項列出的投遞失敗資訊。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.id=此站內信的唯一標識，用於讀取、標記已讀或刪除。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.category=訊息分類，如 download、announcement、survey、system。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.severity=通知的嚴重程度，用於區分訊息級別。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.scenarioId=觸發通知的場景標識。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.title=用於顯示的標題。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.body=顯示在收件箱中的通知正文。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.contentUrl=讀取該訊息正文的地址。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.actionUrl=此通知關聯的使用者操作地址。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.createdTime=訊息的建立時間，Unix 毫秒。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.readTime=訊息被標為已讀的時間，Unix 毫秒，未讀時為空。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.deletable=呼叫者當前能否刪除這封訊息。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.embeddedContentUrl=用於嵌入顯示通知正文的地址。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.hasHtmlContent=此訊息是否提供獨立的 HTML 正文。
