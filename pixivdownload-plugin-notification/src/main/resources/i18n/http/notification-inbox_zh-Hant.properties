title=站內信
NotificationInboxController.latest.GET.summary=列出最近的站內信
NotificationInboxController.latest.GET.description=列出最近通知和未讀計數。可選 category 為 download、announcement、survey、system；unreadOnly=true 只列未讀通知。資料庫不可用時返回 databaseAvailable=false和空列表。
NotificationInboxController.latest.GET.success=最近的站內信。
NotificationInboxController.detail.GET.summary=檢視站內信詳情
NotificationInboxController.detail.GET.description=按訊息 ID 返回收件箱詳情，可用 lang 指定顯示語言。沒有此訊息時返回 404。
NotificationInboxController.detail.GET.success=站內信詳情。
NotificationInboxController.htmlContent.GET.summary=檢視站內信 HTML 正文
NotificationInboxController.htmlContent.GET.description=讀取訊息可渲染的 UTF-8 HTML 正文；該訊息沒有 HTML 內容時返回 404。 請使用 Accept: text/html 或 */*。僅接受 application/json 時回傳 406。
NotificationInboxController.htmlContent.GET.success=站內信 HTML 正文。
NotificationInboxController.markRead.POST.summary=標為已讀：單封站內信
NotificationInboxController.markRead.POST.description=將指定通知標為已讀並返回更新後的通知詳情。
NotificationInboxController.markRead.POST.success=已更新已讀狀態。
NotificationInboxController.markAllRead.POST.summary=標為已讀：全部站內信
NotificationInboxController.markAllRead.POST.description=將所選分類的通知全部標為已讀。省略 category 時覆蓋所有分類，響應整數為本次受影響的條數。
NotificationInboxController.markAllRead.POST.success=已更新已讀狀態。
NotificationInboxController.surveyUnavailable.POST.summary=記錄問卷不可用狀態
NotificationInboxController.surveyUnavailable.POST.description=將指定訊息關聯的問卷登記為不可用。成功返回 204，未找到相應訊息或問卷時返回 404。
NotificationInboxController.surveyUnavailable.POST.success=問卷不可用狀態。
NotificationInboxController.delete.DELETE.summary=刪除站內信
NotificationInboxController.delete.DELETE.description=從收件箱刪除指定 ID 的訊息，成功返回 204，未找到時返回 404。
NotificationInboxController.delete.DELETE.success=已移除站內信。
NotificationInboxTestController.test.POST.summary=傳送站內測試信
NotificationInboxTestController.test.POST.description=在本地通知收件箱建立一條測試通知。
NotificationInboxTestController.test.POST.success=站內測試信。
NotificationInboxTestController.testAdmin.POST.summary=傳送站內測試信
NotificationInboxTestController.testAdmin.POST.description=在本地通知收件箱建立一條測試通知。
NotificationInboxTestController.testAdmin.POST.success=站內測試信。
NotificationInboxTestController.testAll.POST.summary=傳送全部場景的示例站內信
NotificationInboxTestController.testAll.POST.description=在本地收件箱為每個通知場景建立測試通知。檢視 total、succeeded 與 failures 中的 scenarioId 以定位失敗場景。
NotificationInboxTestController.testAll.POST.success=全部場景的示例站內信。
NotificationInboxTestController.testAllAdmin.POST.summary=傳送全部場景的示例站內信
NotificationInboxTestController.testAllAdmin.POST.description=在本地收件箱為每個通知場景建立測試通知。檢視 total、succeeded 與 failures 中的 scenarioId 以定位失敗場景。
NotificationInboxTestController.testAllAdmin.POST.success=全部場景的示例站內信。
parameter.category=篩選條目所用的類別。
parameter.unreadOnly=僅返回未讀站內信。
parameter.id=站內信列表返回的訊息 ID。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.description=已儲存的站內信。時間戳以毫秒錶示。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxController.InboxSnapshot.field.unreadCount=整個收件箱的未讀訊息數。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxController.InboxSnapshot.field.categoryUnreadCount=所選分類的未讀訊息數。省略分類時等於 unreadCount。
