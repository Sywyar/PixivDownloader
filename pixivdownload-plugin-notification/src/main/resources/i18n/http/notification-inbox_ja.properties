title=通知受信箱
NotificationInboxController.latest.GET.summary=最近の通知の一覧
NotificationInboxController.latest.GET.description=最近の通知と未読件数を返します。category は download、announcement、survey、system。unreadOnly=true で未読に限定し、ストレージが利用できなければ応答の可用性で示します。
NotificationInboxController.latest.GET.success=最近の通知。
NotificationInboxController.detail.GET.summary=通知の詳細を取得
NotificationInboxController.detail.GET.description=ID でメッセージの詳細を取得します。lang で表示言語を指定でき、該当がなければ 404 です。
NotificationInboxController.detail.GET.success=通知の詳細。
NotificationInboxController.htmlContent.GET.summary=通知の HTML 本文を取得
NotificationInboxController.htmlContent.GET.description=メッセージの表示用 UTF-8 HTML 本文を取得します。HTML がなければ 404 です。 Accept: text/html または */* を指定してください。JSON のみを指定すると 406 になります。
NotificationInboxController.htmlContent.GET.success=通知の HTML 本文。
NotificationInboxController.markRead.POST.summary=個別の通知を既読にする
NotificationInboxController.markRead.POST.description=指定の通知を既読にし、更新後の詳細を返します。
NotificationInboxController.markRead.POST.success=既読状態を更新しました。
NotificationInboxController.markAllRead.POST.summary=すべての通知を既読にする
NotificationInboxController.markAllRead.POST.description=指定カテゴリを一括で既読にします。category 省略時は全カテゴリが対象で、対象件数を整数で返します。
NotificationInboxController.markAllRead.POST.success=既読状態を更新しました。
NotificationInboxController.surveyUnavailable.POST.summary=アンケートが利用できない状態を記録
NotificationInboxController.surveyUnavailable.POST.description=指定メッセージのアンケートを利用不可として扱います。成功は 204、対応するメッセージまたは調査が見つからなければ 404 です。
NotificationInboxController.surveyUnavailable.POST.success=アンケートが利用できない状態。
NotificationInboxController.delete.DELETE.summary=通知を削除
NotificationInboxController.delete.DELETE.description=ID で受信メッセージを削除します。成功は 204、該当なしは 404 です。
NotificationInboxController.delete.DELETE.success=通知を削除しました。
NotificationInboxTestController.test.POST.summary=テスト用の受信通知を送信
NotificationInboxTestController.test.POST.description=ローカル受信トレイにテスト通知を 1 件作成します。
NotificationInboxTestController.test.POST.success=テスト用の受信通知。
NotificationInboxTestController.testAdmin.POST.summary=テスト用の受信通知を送信
NotificationInboxTestController.testAdmin.POST.description=ローカル受信トレイにテスト通知を 1 件作成します。
NotificationInboxTestController.testAdmin.POST.success=テスト用の受信通知。
NotificationInboxTestController.testAll.POST.summary=全通知シナリオのサンプル受信通知を送信
NotificationInboxTestController.testAll.POST.description=シナリオごとにローカル通知を生成します。total、succeeded、failures[].scenarioId で失敗を確認できます。
NotificationInboxTestController.testAll.POST.success=全通知シナリオのサンプル受信通知。
NotificationInboxTestController.testAllAdmin.POST.summary=全通知シナリオのサンプル受信通知を送信
NotificationInboxTestController.testAllAdmin.POST.description=シナリオごとにローカル通知を生成します。total、succeeded、failures[].scenarioId で失敗を確認できます。
NotificationInboxTestController.testAllAdmin.POST.success=全通知シナリオのサンプル受信通知。
parameter.category=項目の絞り込みに使うカテゴリ。
parameter.unreadOnly=未読のメッセージだけを返します。
parameter.id=受信箱の一覧で返されたメッセージ ID。
