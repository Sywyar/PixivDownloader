title=알림 수신함
NotificationInboxController.latest.GET.summary=최근 알림 목록 조회
NotificationInboxController.latest.GET.description=최근 알림과 읽지 않은 개수를 반환합니다. category는 download, announcement, survey, system이며 unreadOnly=true이면 읽지 않은 알림만 나옵니다. 저장소 사용 여부도 반환합니다.
NotificationInboxController.latest.GET.success=최근 알림.
NotificationInboxController.detail.GET.summary=알림 세부 정보 조회
