NotificationInboxController.markRead.POST.success=읽음 상태를 변경했습니다.
NotificationInboxController.markAllRead.POST.summary=모든 알림 읽음 처리
NotificationInboxController.markAllRead.POST.description=선택한 분류를 모두 읽음으로 표시합니다. category를 생략하면 모든 분류가 대상이며 응답 정수는 변경 건수입니다.
NotificationInboxController.markAllRead.POST.success=읽음 상태를 변경했습니다.
NotificationInboxController.surveyUnavailable.POST.summary=설문 이용 불가 상태 기록
NotificationInboxController.surveyUnavailable.POST.description=지정한 메시지에 연결된 설문을 사용 불가 처리합니다. 성공은 204, 해당 메시지나 설문이 없으면 404입니다.
NotificationInboxController.surveyUnavailable.POST.success=설문 이용 불가 상태.
NotificationInboxController.delete.DELETE.summary=알림 삭제
NotificationInboxController.delete.DELETE.description=ID로 받은 메시지를 삭제합니다. 성공하면 204, 없으면 404입니다.
NotificationInboxController.delete.DELETE.success=알림을 제거했습니다.
