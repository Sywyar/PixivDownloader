NotificationInboxController.detail.GET.success=알림 세부 정보.
NotificationInboxController.htmlContent.GET.summary=알림 HTML 본문 조회
NotificationInboxController.htmlContent.GET.description=메시지의 렌더링 가능한 UTF-8 HTML 본문을 가져옵니다. HTML 내용이 없으면 404입니다. Accept: text/html 또는 */*를 사용하세요. JSON만 허용하면 406을 반환합니다.
NotificationInboxController.htmlContent.GET.success=알림 HTML 본문.
NotificationInboxController.markRead.POST.summary=개별 알림 읽음 처리
