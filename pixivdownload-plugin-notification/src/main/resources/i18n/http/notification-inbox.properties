title=站内信
NotificationInboxController.latest.GET.summary=列出最近的站内信
NotificationInboxController.latest.GET.description=列出最近通知和未读计数。可选 category 为 download、announcement、survey、system；unreadOnly=true 只列未读通知。数据库不可用时返回 databaseAvailable=false和空列表。
NotificationInboxController.latest.GET.success=最近的站内信。
NotificationInboxController.detail.GET.summary=查看站内信详情
NotificationInboxController.detail.GET.description=按消息 ID 返回收件箱详情，可用 lang 指定显示语言。没有此消息时返回 404。
NotificationInboxController.detail.GET.success=站内信详情。
NotificationInboxController.htmlContent.GET.summary=查看站内信 HTML 正文
NotificationInboxController.htmlContent.GET.description=读取消息可渲染的 UTF-8 HTML 正文；该消息没有 HTML 内容时返回 404。 使用 Accept: text/html 或 */*。仅接受 application/json 时返回 406。
NotificationInboxController.htmlContent.GET.success=站内信 HTML 正文。
NotificationInboxController.markRead.POST.summary=标为已读：单封站内信
NotificationInboxController.markRead.POST.description=将指定通知标为已读并返回更新后的通知详情。
NotificationInboxController.markRead.POST.success=已更新已读状态。
NotificationInboxController.markAllRead.POST.summary=标为已读：全部站内信
NotificationInboxController.markAllRead.POST.description=将所选分类的通知全部标为已读。省略 category 时覆盖所有分类，响应整数为本次受影响的条数。
NotificationInboxController.markAllRead.POST.success=已更新已读状态。
NotificationInboxController.surveyUnavailable.POST.summary=记录问卷不可用状态
NotificationInboxController.surveyUnavailable.POST.description=将指定消息关联的问卷登记为不可用。成功返回 204，未找到相应消息或问卷时返回 404。
NotificationInboxController.surveyUnavailable.POST.success=问卷不可用状态。
NotificationInboxController.delete.DELETE.summary=删除站内信
NotificationInboxController.delete.DELETE.description=从收件箱删除指定 ID 的消息，成功返回 204，未找到时返回 404。
NotificationInboxController.delete.DELETE.success=已移除站内信。
NotificationInboxTestController.test.POST.summary=发送站内测试信
NotificationInboxTestController.test.POST.description=在本地通知收件箱创建一条测试通知。
NotificationInboxTestController.test.POST.success=站内测试信。
NotificationInboxTestController.testAdmin.POST.summary=发送站内测试信
NotificationInboxTestController.testAdmin.POST.description=在本地通知收件箱创建一条测试通知。
NotificationInboxTestController.testAdmin.POST.success=站内测试信。
NotificationInboxTestController.testAll.POST.summary=发送全部场景的示例站内信
NotificationInboxTestController.testAll.POST.description=在本地收件箱为每个通知场景创建测试通知。查看 total、succeeded 与 failures 中的 scenarioId 以定位失败场景。
NotificationInboxTestController.testAll.POST.success=全部场景的示例站内信。
NotificationInboxTestController.testAllAdmin.POST.summary=发送全部场景的示例站内信
NotificationInboxTestController.testAllAdmin.POST.description=在本地收件箱为每个通知场景创建测试通知。查看 total、succeeded 与 failures 中的 scenarioId 以定位失败场景。
NotificationInboxTestController.testAllAdmin.POST.success=全部场景的示例站内信。
parameter.category=筛选条目所用的类别。
parameter.unreadOnly=仅返回未读站内信。
parameter.id=站内信列表返回的消息 ID。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.description=已保存的站内信。时间戳以毫秒表示。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxController.InboxSnapshot.field.unreadCount=整个收件箱的未读消息数。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxController.InboxSnapshot.field.categoryUnreadCount=所选分类的未读消息数。省略分类时等于 unreadCount。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxController.InboxSnapshot.field.messages=本次筛选和数量限制内返回的站内信。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxController.InboxSnapshot.field.databaseAvailable=消息数据库是否可用。false 时本次返回空列表和零计数。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxTestController.Failure.field.scenarioId=触发通知的场景标识。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxTestController.InboxTestResponse.field.success=本次操作报告的成功标记，HTTP 200 时也应检查。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxTestController.InboxTestResponse.field.total=本次任务或统计涉及的条目总数。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxTestController.InboxTestResponse.field.succeeded=实际成功的条目数。
schema.top.sywyar.pixivdownload.notificationbase.NotificationInboxTestController.InboxTestResponse.field.failures=逐项列出的投递失败信息。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.id=此站内信的唯一标识，用于读取、标记已读或删除。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.category=消息分类，如 download、announcement、survey、system。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.severity=通知的严重程度，用于区分消息级别。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.scenarioId=触发通知的场景标识。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.title=用于显示的标题。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.body=显示在收件箱中的通知正文。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.contentUrl=读取该消息正文的地址。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.actionUrl=此通知关联的用户操作地址。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.createdTime=消息的创建时间，Unix 毫秒。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.readTime=消息被标为已读的时间，Unix 毫秒，未读时为空。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.deletable=调用者当前能否删除这封消息。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.embeddedContentUrl=用于嵌入显示通知正文的地址。
schema.top.sywyar.pixivdownload.notificationbase.NotificationMessage.field.hasHtmlContent=此消息是否提供独立的 HTML 正文。
