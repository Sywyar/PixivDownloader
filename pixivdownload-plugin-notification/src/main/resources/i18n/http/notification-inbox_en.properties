title=Notification inbox
NotificationInboxController.latest.GET.summary=List recent notifications
NotificationInboxController.latest.GET.description=List recent notifications and unread counts. Optional category values are download, announcement, survey and system. Set unreadOnly=true to list unread messages. The response reports availability when storage is unavailable.
NotificationInboxController.latest.GET.success=Recent notifications.
NotificationInboxController.detail.GET.summary=Get notification details
NotificationInboxController.detail.GET.description=Read inbox message details by ID with an optional display language in lang. A missing message returns 404.
NotificationInboxController.detail.GET.success=Notification details.
NotificationInboxController.htmlContent.GET.summary=Get notification HTML
NotificationInboxController.htmlContent.GET.description=Read the message’s renderable UTF-8 HTML body. Missing HTML content returns 404. Send Accept: text/html or */*. A JSON-only Accept header returns 406.
NotificationInboxController.htmlContent.GET.success=Notification HTML.
NotificationInboxController.markRead.POST.summary=Mark a notification as read
NotificationInboxController.markRead.POST.description=Mark this notification as read and return its updated details.
NotificationInboxController.markRead.POST.success=Read status updated.
NotificationInboxController.markAllRead.POST.summary=Mark all notifications as read
NotificationInboxController.markAllRead.POST.description=Mark the selected category as read, or all categories when category is omitted. The integer response is the number affected.
NotificationInboxController.markAllRead.POST.success=Read status updated.
NotificationInboxController.surveyUnavailable.POST.summary=Record survey unavailability
NotificationInboxController.surveyUnavailable.POST.description=Dismiss the survey linked to this message as unavailable. Success returns 204. A missing matching message or survey returns 404.
NotificationInboxController.surveyUnavailable.POST.success=Survey unavailability.
NotificationInboxController.delete.DELETE.summary=Delete a notification
NotificationInboxController.delete.DELETE.description=Delete an inbox message by ID. Returns 204 on success or 404 if absent.
NotificationInboxController.delete.DELETE.success=Notification removed.
NotificationInboxTestController.test.POST.summary=Send a test inbox notification
NotificationInboxTestController.test.POST.description=Create one test notification in the local inbox.
NotificationInboxTestController.test.POST.success=Test inbox notification.
NotificationInboxTestController.testAdmin.POST.summary=Send a test inbox notification
NotificationInboxTestController.testAdmin.POST.description=Create one test notification in the local inbox.
NotificationInboxTestController.testAdmin.POST.success=Test inbox notification.
NotificationInboxTestController.testAll.POST.summary=Send samples for all inbox scenarios
NotificationInboxTestController.testAll.POST.description=Create a local inbox notification for each scenario. Use total, succeeded and failures[].scenarioId to identify failed scenarios.
NotificationInboxTestController.testAll.POST.success=Samples for all inbox scenarios.
NotificationInboxTestController.testAllAdmin.POST.summary=Send samples for all inbox scenarios
NotificationInboxTestController.testAllAdmin.POST.description=Create a local inbox notification for each scenario. Use total, succeeded and failures[].scenarioId to identify failed scenarios.
NotificationInboxTestController.testAllAdmin.POST.success=Samples for all inbox scenarios.
parameter.category=Category used to filter entries.
parameter.unreadOnly=Return only unread inbox messages.
parameter.id=Message ID returned by the inbox.
