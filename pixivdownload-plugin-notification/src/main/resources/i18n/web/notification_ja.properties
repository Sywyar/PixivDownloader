plugin.name=通知
plugin.summary=通知シナリオ、レベル、管理者向けサイト内メッセージ。
gui.config.notification.service.label=通知サービス
gui.config.notification.service.help=編集する通知サービスをプルダウンで選択します。有効なサービスはすべて同時に通知を送信します
gui.config.notification.service.inbox=サイト内メッセージ
gui.config.field.notification.inbox.enabled.label=サイト内メッセージを有効にする
gui.config.field.notification.inbox.enabled.help=有効にすると、管理者向けサイト内メッセージに通知を保存します。既定で有効です
gui.config.field.notification.inbox.max-messages.label=保存するメッセージ数
gui.config.field.notification.inbox.max-messages.help=ダウンロード通知とシステムメッセージで共有する保存上限。既定値は500通です
gui.config.field.notification.inbox.retention-days.label=保存日数
gui.config.field.notification.inbox.retention-days.help=ダウンロード通知とシステムメッセージを保存する日数。既定値は90日です
gui.config.notification.inbox.test-button.label=テストメッセージを送信
gui.config.notification.inbox.test-button.help=有効化設定に関係なく、実行概要のサンプルをすぐに1件書き込みます。保存前のプレビューに使用できます
gui.config.notification.inbox.test.notice.sending=テストメッセージを書き込んでいます。しばらくお待ちください…
gui.config.notification.inbox.test.notice.success=テストメッセージを書き込みました
gui.config.notification.inbox.test.notice.failed=テストメッセージの書き込みに失敗しました
gui.config.notification.inbox.test.notice.unreachable=バックエンドサービスに接続できません。サービスが実行中か確認してください
gui.config.notification.inbox.test-all.button.label=すべてのメッセージテンプレートを書き込む
gui.config.notification.inbox.test-all.button.help=有効化設定に関係なく、すべての通知シナリオのサンプルメッセージを順番に書き込みます。すべてのテンプレートを一度に確認できます
gui.config.notification.inbox.test-all.notice.sending=すべてのメッセージテンプレートを書き込んでいます。しばらくお待ちください…
gui.config.notification.inbox.test-all.notice.success=すべてのメッセージテンプレート（{0}件）を書き込みました
gui.config.notification.inbox.test-all.notice.partial={0}/{1}件のメッセージテンプレートを書き込みました。失敗したシナリオ：{2}
gui.config.notification.scenario.section.label=通知が必要な種類
gui.config.notification.scenario.section.help=種類の選択を解除すると、その種類の通知（メール、プッシュ、サイト内メッセージ）は送信されません。既定ではすべて選択されています
gui.config.field.notification.scenario.overuse-paused.label=過剰アクセスによる一時停止
gui.config.field.notification.scenario.overuse-paused.help=Pixiv への過剰アクセス警告またはアカウント停止を検出したときに通知します
gui.config.field.notification.scenario.auth-expired.label=ログイン失効による一時停止
gui.config.field.notification.scenario.auth-expired.help=ログイン状態の失効によりスケジュールタスクが停止し、再認証が必要になったときに通知します
gui.config.field.notification.scenario.circuit-breaker.label=失敗サーキットブレーカーによる一時停止
gui.config.field.notification.scenario.circuit-breaker.help=1作品の連続失敗でサーキットブレーカーが作動し、タスクが停止したときに通知します
gui.config.field.notification.scenario.pending-exhausted.label=再試行回数上限到達
gui.config.field.notification.scenario.pending-exhausted.help=1作品の自動再試行が上限に達し、手動対応が必要になったときに通知します
gui.config.field.notification.scenario.degraded-anonymous.label=匿名モードへの降格継続
gui.config.field.notification.scenario.degraded-anonymous.help=ログイン状態が失効したもののログイン不要のタスクを制限モードへ自動降格して継続したときに通知します
gui.config.field.notification.scenario.run-failed.label=実行失敗
gui.config.field.notification.scenario.run-failed.help=スケジュールタスクの1回分全体が失敗したときに通知します
gui.config.field.notification.scenario.run-summary.label=実行概要
gui.config.field.notification.scenario.run-summary.help=スケジュールタスクが正常に完了し、今回新しいダウンロードがあったときに概要を通知します
gui.config.field.notification.scenario.maintenance-task-failed.label=メンテナンスタスクの失敗
gui.config.field.notification.scenario.maintenance-task-failed.help=メンテナンスタスクの今回の実行が失敗し、自動再試行されないときにメール、プッシュ、システムのサイト内メッセージを送信します
