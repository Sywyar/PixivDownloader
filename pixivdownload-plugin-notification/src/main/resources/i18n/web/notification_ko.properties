plugin.name=알림
plugin.summary=알림 시나리오, 수준 및 관리자 받은편지함.
gui.config.notification.service.label=알림 서비스
gui.config.notification.service.help=드롭다운에서 편집할 알림 서비스를 선택하세요. 활성화된 모든 서비스가 동시에 알림을 보냅니다.
gui.config.notification.service.inbox=받은편지함
gui.config.field.notification.inbox.enabled.label=받은편지함 활성화
gui.config.field.notification.inbox.enabled.help=켜면 관리자 받은편지함에 알림을 저장합니다. 기본값은 활성화입니다.
gui.config.field.notification.inbox.max-messages.label=보관할 메시지 수
gui.config.field.notification.inbox.max-messages.help=다운로드 알림과 시스템 메시지에 공유되는 보관 상한입니다. 기본값은 500개입니다.
gui.config.field.notification.inbox.retention-days.label=보관 기간
gui.config.field.notification.inbox.retention-days.help=다운로드 알림과 시스템 메시지를 보관하는 기간입니다. 기본값은 90일입니다.
gui.config.notification.inbox.test-button.label=테스트 받은편지함 메시지 보내기
gui.config.notification.inbox.test-button.help=활성화 스위치와 관계없이 실행 요약 예시 하나를 즉시 기록하여 저장 전에 미리 봅니다.
gui.config.notification.inbox.test.notice.sending=테스트 받은편지함 메시지를 기록하는 중입니다. 잠시 기다려 주세요…
gui.config.notification.inbox.test.notice.success=테스트 받은편지함 메시지를 기록했습니다.
gui.config.notification.inbox.test.notice.failed=테스트 받은편지함 메시지 기록 실패
gui.config.notification.inbox.test.notice.unreachable=백엔드 서비스에 연결할 수 없습니다. 서비스가 실행 중인지 확인하세요.
gui.config.notification.inbox.test-all.button.label=모든 메시지 템플릿 기록
gui.config.notification.inbox.test-all.button.help=활성화 스위치와 관계없이 모든 알림 시나리오의 예시 메시지를 하나씩 기록하여 모든 템플릿을 한 번에 미리 봅니다.
gui.config.notification.inbox.test-all.notice.sending=모든 메시지 템플릿을 기록하는 중입니다. 잠시 기다려 주세요…
gui.config.notification.inbox.test-all.notice.success=메시지 템플릿 {0}개를 모두 기록했습니다.
gui.config.notification.inbox.test-all.notice.partial=메시지 템플릿 {0}/{1}개를 기록했습니다. 실패한 시나리오: {2}
gui.config.notification.scenario.section.label=알림이 필요한 유형
gui.config.notification.scenario.section.help=유형의 선택을 해제하면 해당 유형의 알림(메일, 푸시 및 받은편지함)을 보내지 않습니다. 기본값은 모두 선택입니다.
gui.config.field.notification.scenario.overuse-paused.label=과도한 접근으로 일시 중지
gui.config.field.notification.scenario.overuse-paused.help=Pixiv 과도한 접근 경고가 감지되거나 계정이 일시 중지되면 알립니다.
gui.config.field.notification.scenario.auth-expired.label=로그인 만료로 일시 중지
gui.config.field.notification.scenario.auth-expired.help=로그인 상태가 만료되어 예약 작업이 일시 중지되고 다시 인증해야 할 때 알립니다.
gui.config.field.notification.scenario.circuit-breaker.label=실패 회로 차단으로 일시 중지
gui.config.field.notification.scenario.circuit-breaker.help=한 작품의 연속 실패가 회로 차단을 일으켜 작업이 일시 중지되면 알립니다.
gui.config.field.notification.scenario.pending-exhausted.label=재시도 소진 후 처리 대기
gui.config.field.notification.scenario.pending-exhausted.help=한 작품의 자동 재시도가 한도에 도달하여 수동 처리가 필요할 때 알립니다.
gui.config.field.notification.scenario.degraded-anonymous.label=익명 제한 모드로 계속 실행
gui.config.field.notification.scenario.degraded-anonymous.help=로그인 상태가 만료되었지만 작업에 로그인이 필요하지 않아 제한 모드로 자동 전환하여 계속 실행할 때 알립니다.
gui.config.field.notification.scenario.run-failed.label=실행 실패
gui.config.field.notification.scenario.run-failed.help=예약 작업의 전체 실행 라운드가 실패하면 알립니다.
gui.config.field.notification.scenario.run-summary.label=실행 요약
gui.config.field.notification.scenario.run-summary.help=예약 작업이 성공하고 이번 라운드에 새 다운로드가 있으면 요약 알림을 보냅니다.
gui.config.field.notification.scenario.maintenance-task-failed.label=유지 관리 작업 실패
gui.config.field.notification.scenario.maintenance-task-failed.help=유지 관리 작업이 이번 라운드에 실패하고 자동 재시도하지 않을 때 메일, 푸시 및 시스템 받은편지함으로 보냅니다.
