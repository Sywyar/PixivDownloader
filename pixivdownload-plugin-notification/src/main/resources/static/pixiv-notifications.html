<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self';
                   img-src 'self' data:; connect-src 'self';
                   frame-src 'self'; child-src 'self';
                   object-src 'none'; base-uri 'none'; form-action 'none'; media-src 'none'; worker-src 'none'">
    <title>站内信</title>
    <script src="/js/pixiv-i18n.js"></script>
    <script src="/js/pixiv-lang-switcher.js"></script>
    <script src="/js/pixiv-theme.js"></script>
    <script src="/js/pixiv-feedback.js"></script>
    <link rel="stylesheet" href="/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="/css/lang-theme-switcher.css">
    <link rel="stylesheet" href="/css/pixiv-motion.css">
    <link rel="stylesheet" href="/css/pixiv-feedback.css">
    <link rel="stylesheet" href="/pixiv-notifications/pixiv-notifications.css">
</head>
<body class="notification-page">
<header class="notification-page-topbar">
    <a class="notification-back" href="/pixiv-batch.html" data-i18n-aria-label="inbox.back"
       aria-label="返回下载工作台">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div>
        <p class="notification-eyebrow" data-i18n="inbox.admin-only">管理员消息中心</p>
        <h1 data-i18n="inbox.title">站内信</h1>
    </div>
    <div class="notification-topbar-spacer"></div>
    <div id="langSwitcherAnchor"></div>
</header>

<main class="notification-page-shell">
    <nav class="notification-filters" aria-label="消息分类" data-i18n-aria-label="inbox.categories">
        <button type="button" class="active" aria-pressed="true" data-category=""
                data-i18n="inbox.category.all">全部</button>
        <button type="button" aria-pressed="false" data-category="download"
                data-i18n="inbox.category.download">下载通知</button>
        <button type="button" aria-pressed="false" data-category="announcement"
                data-i18n="inbox.category.announcement">公告</button>
        <button type="button" aria-pressed="false" data-category="survey"
                data-i18n="inbox.category.survey">调查</button>
        <button type="button" aria-pressed="false" data-category="system"
                data-i18n="inbox.category.system">系统</button>
    </nav>

    <div class="notification-page-grid">
        <section class="notification-list-panel" aria-labelledby="notification-list-heading">
            <div class="notification-panel-heading">
                <h2 id="notification-list-heading" data-i18n="inbox.latest">最新消息</h2>
                <span id="notificationUnreadCount" class="notification-count" aria-live="polite"></span>
            </div>
            <div class="notification-list-tools">
                <label class="notification-unread-filter">
                    <input type="checkbox" id="notificationUnreadOnly">
                    <span data-i18n="inbox.unread-only">仅看未读</span>
                </label>
                <button type="button" id="notificationMarkCategoryRead"
                        data-i18n="inbox.mark-category-read">当前分类全部已读</button>
            </div>
            <div id="notificationStatus" class="notification-status" role="status" aria-live="polite"
                 data-i18n="inbox.loading">正在加载消息…</div>
            <div id="notificationList" class="notification-list"></div>
        </section>

        <article class="notification-detail-panel" id="notificationDetail" aria-live="polite">
            <div class="notification-empty-detail">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 4h16v16H4z"></path><path d="m4 7 8 6 8-6"></path>
                </svg>
                <p data-i18n="inbox.select-message">选择一条消息查看详情</p>
            </div>
        </article>
    </div>
</main>
<script src="/pixiv-notifications/pixiv-notifications.js"></script>
</body>
</html>
