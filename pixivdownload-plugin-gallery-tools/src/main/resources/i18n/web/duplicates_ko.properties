controls.ahash-threshold=aHash 임계값
controls.threshold.title=dHash는 이미지의 '구조'(윤곽과 형태)를 감지합니다：값을 높이면 더 느슨하게 일치하여 대략적으로 비슷한 이미지를 더 많이 찾지만 오탐이 늘어납니다. 값을 낮추면 더 엄격하게 구조가 매우 유사한 이미지만 선택합니다.
controls.ahash-threshold.title=aHash는 이미지의 '명암'(전체 밝기 분포)을 보조 확인용으로 감지합니다：값을 높이면 더 큰 명암 차이를 허용하고, 낮추면 명암도 거의 일치해야 하므로 오탐을 더 줄입니다.
threshold.hint=dHash는 '구조'를 감지합니다：높이면 일치 조건이 느슨해져 더 많은 유사 이미지를 찾지만 오탐이 늘고, 낮추면 더 엄격해져 구조가 매우 유사한 이미지만 합칩니다. aHash는 '명암'을 감지합니다：높이면 더 큰 명암 차이를 허용하고, 낮추면 명암도 거의 일치해야 하므로 오탐을 더 줄입니다. 참고：두 임계값 모두 허용되는 차이의 상한(해밍 거리 0~64)이며 동시에 충족해야 유사한 것으로 판정합니다. 둘 다 0(기본값)이면 지문이 완전히 같은 이미지만 합쳐 가장 엄격합니다.
