controls.ahash-threshold=aHash 閾值
controls.threshold.title=dHash 偵測影像的「結構」（輪廓與形狀）：調高 = 比對較寬鬆，可以找出更多大致相似的圖片，但較容易誤判；調低 = 比對較嚴格，只挑出結構高度相似的圖片。
controls.ahash-threshold.title=aHash 偵測影像的「明暗」（整體亮度分布，用於輔助確認）：調高 = 容許更大的明暗差異；調低 = 要求明暗也幾乎一致，進一步減少誤判。
threshold.hint=dHash 偵測「結構」：調高→比對較寬鬆（找出更多相似圖片，但較容易誤判），調低→比對較嚴格（只合併結構高度相似的圖片）。aHash 偵測「明暗」：調高→容許更大的明暗差異，調低→要求明暗也幾乎一致，進一步減少誤判。補充：兩個閾值都是「允許的差異上限」（漢明距離 0–64），必須同時符合才會判定為相似；兩者都是 0（預設）時，只合併指紋完全相同的圖片，最為嚴格。
