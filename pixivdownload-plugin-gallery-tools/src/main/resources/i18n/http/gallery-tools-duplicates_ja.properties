title=重複画像
DuplicateController.groups.GET.summary=類似画像のグループをページ単位で取得
DuplicateController.groups.GET.description=threshold と ahashThreshold はハミング距離の上限（0～32、初期値0）です。cross-artwork は異なる作品間、all は同一作品内も対象です。page は0始まり、size は最大100です。
DuplicateController.groups.GET.success=類似画像のグループ。
DuplicateController.scan.POST.summary=重複画像のスキャンを開始
DuplicateController.scan.POST.description=ハッシュスキャンを開始します。進捗は GET /api/duplicates/scan/status、一致グループは GET /api/duplicates/groups で取得します。
DuplicateController.scan.POST.success=重複画像のスキャン。
DuplicateController.scanStatus.GET.summary=重複画像のスキャン状況を取得
DuplicateController.scanStatus.GET.description=現在のハッシュスキャンの状態と進捗を返します。ポーリングでスキャンが開始されることはありません。
DuplicateController.scanStatus.GET.success=重複画像のスキャン状況。
DuplicateController.rescan.POST.summary=類似画像のグループを更新
DuplicateController.rescan.POST.description=グループキャッシュを破棄し、指定したしきい値、範囲、ページで再集計します。画像ハッシュのスキャンには POST /api/duplicates/scan を使います。
DuplicateController.rescan.POST.success=類似画像のグループを更新しました。
StatsController.dashboard.GET.summary=ギャラリーの統計を取得
StatsController.dashboard.GET.description=ローカル統計を取得します。topAuthors と topTags で作者・タグのランキング件数を個別に指定します。
StatsController.dashboard.GET.success=ギャラリーの統計。
parameter.force=以前の結果があっても再実行します。
parameter.threshold=画像のグループ化に使う類似度のしきい値。
parameter.ahashThreshold=平均ハッシュによる画像照合のしきい値。
parameter.scope=比較対象とする画像の範囲。
parameter.topAuthors=ランキングに含める作者の上限数。
parameter.topTags=ランキングに含めるタグの上限数。
