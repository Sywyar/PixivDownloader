description=類似画像を検索し、グループとギャラリー統計を確認します。
DuplicateController.groups.GET.parameter.page=0 始まりのページ番号。負数は 0 として扱います。
DuplicateController.rescan.POST.parameter.page=0 始まりのページ番号。負数は 0 として扱います。
DuplicateController.groups.GET.parameter.size=1 ページのグループ数。0 以下は 20、100 超は 100 として扱います。
DuplicateController.rescan.POST.parameter.size=1 ページのグループ数。0 以下は 20、100 超は 100 として扱います。
