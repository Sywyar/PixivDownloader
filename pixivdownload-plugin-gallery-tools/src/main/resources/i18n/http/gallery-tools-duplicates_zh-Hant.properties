title=重複圖片
DuplicateController.groups.GET.summary=分頁檢視相似圖片分組
DuplicateController.groups.GET.description=threshold 和 ahashThreshold 分別限制兩種雜湊的漢明距離，均為 0–32，預設 0。scope=cross-artwork 只比較不同作品，all 包括同一作品。page 從 0 開始，size 最多 100。
DuplicateController.groups.GET.success=相似圖片分組。
DuplicateController.scan.POST.summary=提交重複圖片掃描
DuplicateController.scan.POST.description=啟動雜湊掃描，響應為掃描狀態。透過 GET /api/duplicates/scan/status 跟蹤，GET /api/duplicates/groups 讀取比對結果。
DuplicateController.scan.POST.success=重複圖片掃描。
DuplicateController.scanStatus.GET.summary=檢視重複圖片掃描進度
DuplicateController.scanStatus.GET.description=返回當前雜湊掃描的狀態和進度。輪詢此介面不會啟動掃描。
DuplicateController.scanStatus.GET.success=重複圖片掃描進度。
DuplicateController.rescan.POST.summary=重新整理相似圖片分組
DuplicateController.rescan.POST.description=使分組快取失效，並按本次閾值、範圍和頁碼重新查詢分組。需要重算圖片雜湊時，請呼叫 POST /api/duplicates/scan。
DuplicateController.rescan.POST.success=已重新整理相似圖片分組。
StatsController.dashboard.GET.summary=檢視畫廊統計面板
StatsController.dashboard.GET.description=讀取本地統計概覽。topAuthors 和 topTags 分別控製作者與標籤排行榜的條目數。
StatsController.dashboard.GET.success=畫廊統計面板。
parameter.force=即使已有結果，也強制重新執行。
parameter.threshold=圖片分組使用的相似度閾值。
parameter.ahashThreshold=平均雜湊的圖片匹配閾值。
parameter.scope=參與比對的圖片範圍。
parameter.topAuthors=作者排名的最多顯示人數。
parameter.topTags=標籤排名的最多顯示數量。
