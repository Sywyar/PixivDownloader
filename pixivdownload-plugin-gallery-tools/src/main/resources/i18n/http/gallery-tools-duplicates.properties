title=重复图片
DuplicateController.groups.GET.summary=分页查看相似图片分组
DuplicateController.groups.GET.description=threshold 和 ahashThreshold 分别限制两种哈希的汉明距离，均为 0–32，默认 0。scope=cross-artwork 只比较不同作品，all 包括同一作品。page 从 0 开始，size 最多 100。
DuplicateController.groups.GET.success=相似图片分组。
DuplicateController.scan.POST.summary=提交重复图片扫描
DuplicateController.scan.POST.description=启动哈希扫描，响应为扫描状态。通过 GET /api/duplicates/scan/status 跟踪，GET /api/duplicates/groups 读取比对结果。
DuplicateController.scan.POST.success=重复图片扫描。
DuplicateController.scanStatus.GET.summary=查看重复图片扫描进度
DuplicateController.scanStatus.GET.description=返回当前哈希扫描的状态和进度。轮询此接口不会启动扫描。
DuplicateController.scanStatus.GET.success=重复图片扫描进度。
DuplicateController.rescan.POST.summary=刷新相似图片分组
DuplicateController.rescan.POST.description=使分组缓存失效，并按本次阈值、范围和页码重新查询分组。需要重算图片哈希时，请调用 POST /api/duplicates/scan。
DuplicateController.rescan.POST.success=已刷新相似图片分组。
StatsController.dashboard.GET.summary=查看画廊统计面板
StatsController.dashboard.GET.description=读取本地统计概览。topAuthors 和 topTags 分别控制作者与标签排行榜的条目数。
StatsController.dashboard.GET.success=画廊统计面板。
parameter.force=即使已有结果，也强制重新执行。
parameter.threshold=图片分组使用的相似度阈值。
parameter.ahashThreshold=平均哈希的图片匹配阈值。
parameter.scope=参与比对的图片范围。
parameter.topAuthors=作者排名的最多显示人数。
parameter.topTags=标签排名的最多显示数量。
