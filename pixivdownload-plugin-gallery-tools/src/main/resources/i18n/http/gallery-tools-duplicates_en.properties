title=Duplicate images
DuplicateController.groups.GET.summary=Browse similar image groups
DuplicateController.groups.GET.description=threshold and ahashThreshold are Hamming-distance cutoffs from 0 to 32, default 0. cross-artwork compares different works; all includes pages of the same work. page starts at 0; size is capped at 100.
DuplicateController.groups.GET.success=Similar image groups.
DuplicateController.scan.POST.summary=Start a duplicate image scan
DuplicateController.scan.POST.description=Start a hash scan. Poll GET /api/duplicates/scan/status for progress and GET /api/duplicates/groups for matching groups.
DuplicateController.scan.POST.success=Duplicate image scan.
DuplicateController.scanStatus.GET.summary=Get duplicate scan progress
DuplicateController.scanStatus.GET.description=Read the current hash scan status and progress. Polling this endpoint does not start a scan.
DuplicateController.scanStatus.GET.success=Duplicate scan progress.
DuplicateController.rescan.POST.summary=Refresh similar image groups
DuplicateController.rescan.POST.description=Invalidate cached groups and recompute the requested group page with these thresholds and scope. To scan image hashes, use POST /api/duplicates/scan.
DuplicateController.rescan.POST.success=Similar image groups refreshed.
StatsController.dashboard.GET.summary=Get gallery statistics
StatsController.dashboard.GET.description=Read the local statistics dashboard. topAuthors and topTags set the sizes of the author and tag rankings independently.
StatsController.dashboard.GET.success=Gallery statistics.
parameter.force=Force a fresh run even if earlier results exist.
parameter.threshold=Similarity threshold for grouping images.
parameter.ahashThreshold=Average-hash threshold for matching images.
parameter.scope=Range of images to compare.
parameter.topAuthors=Maximum number of authors in the ranking.
parameter.topTags=Maximum number of tags in the ranking.
