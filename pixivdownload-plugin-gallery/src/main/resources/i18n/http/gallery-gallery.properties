GalleryController.listArtworks.GET.summary=分页查看画廊作品
GalleryController.listArtworks.GET.description=分页浏览调用者可见的本地库。page 从 0 开始；ID 集合按逗号分隔，可使用 tagIds、notTagIds、orTagIds 组合标签条件。 按 fileManagement 筛选文件管理方式，省略时包含两类作品。 每个 ID 必须是正整数；空项或无效 ID 会使整个请求返回 400。
GalleryController.listArtworks.GET.success=画廊作品。
GalleryController.listTags.GET.summary=列出画廊标签
GalleryController.listTags.GET.description=用 search 搜索本地标签，用 limit 控制候选数量。返回的标签 ID 可用于作品列表筛选。
GalleryController.listTags.GET.success=画廊标签。
GalleryController.findTag.GET.summary=查询画廊标签
GalleryController.findTag.GET.description=按原名 name 或译名 translatedName 查找本地标签，命中时返回标签选项，找不到时返回 404。 缺少有效名称时返回 400。
GalleryController.findTag.GET.success=画廊标签。
GalleryController.artwork.GET.summary=查看画廊作品详情
GalleryController.artwork.GET.description=按 Pixiv 作品 ID 读取本地保存的详情，访问范围取决于调用者可见的作品记录。 MANAGED 表示文件由应用管理，删除作品时一并清理。EXTERNAL_REFERENCE 表示当前登记引用外部文件，删除作品时保留原件。
GalleryController.artwork.GET.success=画廊作品详情。
GalleryController.related.GET.summary=列出相关作品
GalleryController.related.GET.description=以一部可见的本地作品为起点取得相关作品。limit 默认 12，结果经过访问范围过滤。
GalleryController.related.GET.success=相关作品。
GalleryController.byAuthor.GET.summary=列出同一作者的作品
GalleryController.byAuthor.GET.description=使用 artworkId 确定画师，返回该画师在本地库中的可见作品。limit 默认 12。
GalleryController.byAuthor.GET.success=同一作者的作品。
GalleryController.bySeries.GET.summary=列出同系列作品
GalleryController.bySeries.GET.description=从一部可见作品的 ID 确定所属系列，列出同系列可见作品。limit 默认 30。
GalleryController.bySeries.GET.success=同系列作品。
GalleryController.seriesNav.GET.summary=查看作品系列导航
GalleryController.seriesNav.GET.description=根据作品 ID 返回系列内前后相邻作品和位置信息。不存在系列关系或可见邻项时，相应字段可以为 null。
GalleryController.seriesNav.GET.success=作品系列导航。
GalleryController.deleteArtwork.DELETE.summary=删除画廊中的作品
GalleryController.deleteArtwork.DELETE.description=删除一条本地作品记录，成功时返回 deleted=1，找不到时返回 404。 MANAGED 表示文件由应用管理，删除作品时一并清理。EXTERNAL_REFERENCE 表示当前登记引用外部文件，删除作品时保留原件。 两类作品都从画廊移除，作品库保留查重记录。 只按路径中的作品 ID 删除。请省略请求体；随请求发送的正文会被忽略。
GalleryController.deleteArtwork.DELETE.success=已移除画廊中的作品。
GalleryController.deleteArtworks.POST.summary=删除选中的画廊作品
GalleryController.deleteArtworks.POST.description=按 ids 或当前筛选条件删除匹配的本地作品。excludeIds 从最终选择中剔除，返回实际删除数量。 MANAGED 表示文件由应用管理，删除作品时一并清理。EXTERNAL_REFERENCE 表示当前登记引用外部文件，删除作品时保留原件。 两类作品都从画廊移除，作品库保留查重记录。 空筛选会选中该库全部有效作品。分页和排序不会缩小批量范围。 若筛选归一化后没有条件，删除前必须设置 confirmAll=true。 模糊搜索仅含 % 或 _ 且没有其他条件时，也需要全库确认。
GalleryController.deleteArtworks.POST.success=已移除选中的画廊作品。
GalleryController.collectArtworks.POST.summary=添加多幅作品到收藏夹
GalleryController.collectArtworks.POST.description=将选中的作品加入请求指定的本地收藏夹。count 为选中的数量，changed 为本次实际变更数量。 空筛选会选中该库全部有效作品。分页和排序不会缩小批量范围。
GalleryController.collectArtworks.POST.success=已添加多幅作品到收藏夹。
GalleryController.exportArtworks.POST.summary=导出选中的画廊作品
GalleryController.exportArtworks.POST.description=按所选 ID 或筛选条件创建归档，排除 excludeIds。成功返回 archiveToken、有效秒数和数量；无可归档的文件时返回 204。 成功归档且 deleteAfter=true 时按文件管理方式执行删除。 MANAGED 表示文件由应用管理，删除作品时一并清理。EXTERNAL_REFERENCE 表示当前登记引用外部文件，删除作品时保留原件。 空筛选会选中该库全部有效作品。分页和排序不会缩小批量范围。 若筛选归一化后没有条件，删除前必须设置 confirmAll=true。 导出后删除还要求程序密钥具备 gallery:delete 权限。 模糊搜索仅含 % 或 _ 且没有其他条件时，也需要全库确认。
GalleryController.exportArtworks.POST.success=选中的画廊作品。
