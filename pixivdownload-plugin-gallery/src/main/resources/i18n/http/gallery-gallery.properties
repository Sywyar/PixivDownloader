schema.top.sywyar.pixivdownload.gallery.GalleryController.SeriesNavResponse.description=当前作品的系列位置及可见的相邻作品。没有系列时各字段均为 null。
guide=https://sywyar.github.io/PixivDownloader/#/zh-cn/gallery
GalleryController.listArtworks.GET.parameter.page=页码从 0 开始。负数按 0 查询，响应的 page 返回实际页码。
GalleryController.listArtworks.GET.parameter.size=每页作品数，默认 24。小于 1 时按 1 查询，大于 200 时按 200 查询。响应的 size 是实际采用的值。
schema.top.sywyar.pixivdownload.gallery.web.GalleryArtworkResponse.field.fileManagement=MANAGED 表示文件由应用管理，删除作品时一并清理。EXTERNAL_REFERENCE 表示当前登记引用外部文件，删除作品时保留原件。 只要有一页外部引用与当前作品类型、ID 和登记时间匹配，就返回 EXTERNAL_REFERENCE。此判断不检查文件是否仍在磁盘上。
GalleryController.listArtworks.GET.parameter.fileManagement=按 fileManagement 筛选文件管理方式，省略时包含两类作品。 MANAGED 表示文件由应用管理，删除作品时一并清理。EXTERNAL_REFERENCE 表示当前登记引用外部文件，删除作品时保留原件。 无法识别的值返回 400。
schema.top.sywyar.pixivdownload.gallery.ArtworkBatchRequest.Filter.field.fileManagement=按 fileManagement 筛选文件管理方式，省略时包含两类作品。 MANAGED 表示文件由应用管理，删除作品时一并清理。EXTERNAL_REFERENCE 表示当前登记引用外部文件，删除作品时保留原件。 无法识别的值返回 400。
description=按标签、作者或系列浏览本地插画。
GalleryController.listTags.GET.parameter.limit=最多返回的条数。小于等于 0 取 500，上限为 2000。
GalleryController.related.GET.parameter.limit=最多返回的条数。小于等于 0 取 12，上限为 60。
GalleryController.byAuthor.GET.parameter.limit=最多返回的条数。小于等于 0 取 12，上限为 60。
GalleryController.bySeries.GET.parameter.limit=最多返回的条数。小于等于 0 取 12，上限为 60。
schema.top.sywyar.pixivdownload.gallery.ArtworkBatchRequest.field.confirmAll=设为 true 以确认无筛选条件的全库删除，包括导出后删除。 模糊搜索仅含 % 或 _ 且没有其他条件时，也需要全库确认。
GalleryController.deleteArtworks.POST.response.400=若筛选归一化后没有条件，删除前必须设置 confirmAll=true。
GalleryController.exportArtworks.POST.response.400=若筛选归一化后没有条件，删除前必须设置 confirmAll=true。 归档格式仅支持 `zip`。其他格式返回 `validation.archive.export.format.unsupported`。
