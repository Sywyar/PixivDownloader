title=イラストギャラリー
GalleryController.listArtworks.GET.summary=ギャラリーの作品をページ単位で取得
GalleryController.listArtworks.GET.description=呼び出し元が閲覧できるローカル作品を page=0 から取得します。ID はカンマ区切りで、タグ条件は tagIds、notTagIds、orTagIds を組み合わせます。 fileManagement でファイルの管理方式を指定できます。省略すると両方を含みます。 各 ID は正の整数で指定してください。空の項目や無効な ID が一つでもあると、リクエスト全体が 400 になります。
GalleryController.listArtworks.GET.success=ギャラリーの作品。
GalleryController.listTags.GET.summary=ギャラリーのタグの一覧
GalleryController.listTags.GET.description=search でローカルタグを検索し、limit で件数を指定します。取得したタグ ID は作品一覧の絞り込みに使えます。
GalleryController.listTags.GET.success=ギャラリーのタグ。
GalleryController.findTag.GET.summary=ギャラリーのタグを照会
GalleryController.findTag.GET.description=name または translatedName でローカルタグを検索します。該当タグがなければ 404 です。 name と translatedName の両方が未指定または空白の場合は 400 を返します。
GalleryController.findTag.GET.success=ギャラリーのタグ。
GalleryController.artwork.GET.summary=ギャラリー作品の詳細を取得
GalleryController.artwork.GET.description=閲覧可能なローカル作品の詳細を Pixiv ID で取得します。 MANAGED のファイルは作品の削除時に削除されます。EXTERNAL_REFERENCE は現在の登録が外部ファイルを参照していることを示し、削除時も元ファイルが残ります。
GalleryController.artwork.GET.success=ギャラリー作品の詳細。
GalleryController.related.GET.summary=関連作品の一覧
GalleryController.related.GET.description=参照可能な作品に関連するローカル作品を取得します。limit の既定値は 12 で、閲覧範囲に応じて絞り込みます。
GalleryController.related.GET.success=関連作品。
GalleryController.byAuthor.GET.summary=同じ作者の作品の一覧
GalleryController.byAuthor.GET.description=artworkId から作者を特定し、その作者の閲覧可能なローカル作品を取得します。limit の既定は 12 です。
GalleryController.byAuthor.GET.success=同じ作者の作品。
GalleryController.bySeries.GET.summary=同じシリーズの作品の一覧
GalleryController.bySeries.GET.description=作品 ID から所属シリーズを特定し、参照可能な作品を取得します。limit の既定は 30 です。
GalleryController.bySeries.GET.success=同じシリーズの作品。
GalleryController.seriesNav.GET.summary=作品シリーズのナビゲーションを取得
GalleryController.seriesNav.GET.description=作品 ID からシリーズ内の位置と前後の参照可能な作品を取得します。シリーズや隣接作品がない場合は null です。
GalleryController.seriesNav.GET.success=作品シリーズのナビゲーション。
GalleryController.deleteArtwork.DELETE.summary=ギャラリー内の作品を削除
GalleryController.deleteArtwork.DELETE.description=ローカル作品を 1 件削除します。成功は deleted=1、該当なしは 404 です。 MANAGED のファイルは作品の削除時に削除されます。EXTERNAL_REFERENCE は現在の登録が外部ファイルを参照していることを示し、削除時も元ファイルが残ります。 どちらもギャラリーから消え、重複判定用の記録は残ります。 削除対象はパスの作品 ID で指定します。リクエストボディは省略してください。送信しても無視されます。
GalleryController.deleteArtwork.DELETE.success=ギャラリー内の作品を削除しました。
GalleryController.deleteArtworks.POST.summary=選択した作品を削除
GalleryController.deleteArtworks.POST.description=ids または条件で選んだローカル作品を削除します。excludeIds を除外し、実際の削除件数を返します。 MANAGED のファイルは作品の削除時に削除されます。EXTERNAL_REFERENCE は現在の登録が外部ファイルを参照していることを示し、削除時も元ファイルが残ります。 どちらもギャラリーから消え、重複判定用の記録は残ります。 空のフィルターはこのライブラリ内の有効な作品をすべて選択します。ページと並び順は一括選択の範囲を制限しません。 正規化後に絞り込み条件がない場合、削除には confirmAll=true が必要です。 あいまい検索で % と _ だけを指定した場合、ほかに条件がなければ全件削除の確認が必要です。
GalleryController.deleteArtworks.POST.success=選択した作品を削除しました。
GalleryController.collectArtworks.POST.summary=コレクションへの複数作品を追加
GalleryController.collectArtworks.POST.description=選択した作品を指定のローカルコレクションに追加します。count は選択件数、changed は変更件数です。 空のフィルターはこのライブラリ内の有効な作品をすべて選択します。ページと並び順は一括選択の範囲を制限しません。
GalleryController.collectArtworks.POST.success=コレクションへの複数作品を追加しました。
GalleryController.exportArtworks.POST.summary=選択した作品をエクスポート
GalleryController.exportArtworks.POST.description=ID またはフィルターから excludeIds を除外してアーカイブを作成します。成功時は archiveToken、有効秒数、件数を返し、対象ファイルがなければ 204 です。 アーカイブ作成後、deleteAfter=true の場合は作品の削除処理を行います。 MANAGED のファイルは作品の削除時に削除されます。EXTERNAL_REFERENCE は現在の登録が外部ファイルを参照していることを示し、削除時も元ファイルが残ります。 空のフィルターはこのライブラリ内の有効な作品をすべて選択します。ページと並び順は一括選択の範囲を制限しません。 正規化後に絞り込み条件がない場合、削除には confirmAll=true が必要です。 エクスポート後に削除する場合、プログラムキーには gallery:delete 権限も必要です。 あいまい検索で % と _ だけを指定した場合、ほかに条件がなければ全件削除の確認が必要です。
GalleryController.exportArtworks.POST.success=選択した作品。
