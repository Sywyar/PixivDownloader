GalleryController.listArtworks.GET.parameter.page=ページ番号は 0 始まりです。負の値では 0 ページ目を取得し、レスポンスの page に実際のページ番号を返します。
GalleryController.listArtworks.GET.parameter.size=1 ページの作品数。既定値は 24。1 未満は 1、200 を超える値は 200 として扱い、応答の size に適用値を返します。
schema.top.sywyar.pixivdownload.gallery.web.GalleryArtworkResponse.field.fileManagement=MANAGED のファイルは作品の削除時に削除されます。EXTERNAL_REFERENCE は現在の登録が外部ファイルを参照していることを示し、削除時も元ファイルが残ります。 作品の種類、ID、登録時刻が一致する外部参照が 1 ページでもあれば EXTERNAL_REFERENCE です。元ファイルが見つからなくなっても判定は変わりません。
GalleryController.listArtworks.GET.parameter.fileManagement=fileManagement でファイルの管理方式を指定できます。省略すると両方を含みます。 MANAGED のファイルは作品の削除時に削除されます。EXTERNAL_REFERENCE は現在の登録が外部ファイルを参照していることを示し、削除時も元ファイルが残ります。 未対応の値を指定すると 400 を返します。
schema.top.sywyar.pixivdownload.gallery.ArtworkBatchRequest.Filter.field.fileManagement=fileManagement でファイルの管理方式を指定できます。省略すると両方を含みます。 MANAGED のファイルは作品の削除時に削除されます。EXTERNAL_REFERENCE は現在の登録が外部ファイルを参照していることを示し、削除時も元ファイルが残ります。 未対応の値を指定すると 400 を返します。
description=ローカルのイラストをタグ、作者、シリーズ別に閲覧します。
GalleryController.listTags.GET.parameter.limit=最大取得件数。0 以下は 500、上限は 2000 です。
GalleryController.related.GET.parameter.limit=最大取得件数。0 以下は 12、上限は 60 です。
GalleryController.byAuthor.GET.parameter.limit=最大取得件数。0 以下は 12、上限は 60 です。
GalleryController.bySeries.GET.parameter.limit=最大取得件数。0 以下は 12、上限は 60 です。
schema.top.sywyar.pixivdownload.gallery.ArtworkBatchRequest.field.confirmAll=エクスポート後の削除を含め、絞り込み条件なしで全作品を削除することを確認した場合は true に設定します。 あいまい検索で % と _ だけを指定した場合、ほかに条件がなければ全件削除の確認が必要です。
GalleryController.deleteArtworks.POST.response.400=正規化後に絞り込み条件がない場合、削除には confirmAll=true が必要です。
GalleryController.exportArtworks.POST.response.400=正規化後に絞り込み条件がない場合、削除には confirmAll=true が必要です。 アーカイブ形式は `zip` です。他の形式を指定すると `validation.archive.export.format.unsupported` が返ります。
