title=Artwork gallery
GalleryController.listArtworks.GET.summary=Browse gallery artworks
GalleryController.listArtworks.GET.description=Page through the caller’s visible local library starting with page=0. Supply ID lists as comma-separated values. Combine tagIds, notTagIds and orTagIds to filter by tags. Filter by fileManagement or omit it to include both kinds of work. Each ID must be a positive integer. An empty entry or invalid ID rejects the entire request with 400.
GalleryController.listArtworks.GET.success=Gallery artworks.
GalleryController.listTags.GET.summary=List gallery tags
GalleryController.listTags.GET.description=Search local tags with search and limit the number of matches with limit. Use the returned tag IDs to filter the work list.
GalleryController.listTags.GET.success=Gallery tags.
GalleryController.findTag.GET.summary=Look up a gallery tag
GalleryController.findTag.GET.description=Look up a local tag by its original name or translatedName. Returns the tag option on a match or 404 if absent. Supply at least one nonblank name. Missing both returns 400.
GalleryController.findTag.GET.success=Gallery tag.
GalleryController.artwork.GET.summary=Get artwork details
GalleryController.artwork.GET.description=Read locally stored work details by Pixiv ID within the caller’s visible library. MANAGED files are removed when the work is deleted. EXTERNAL_REFERENCE means the current record references external files, which are kept on deletion.
GalleryController.artwork.GET.success=Artwork details.
GalleryController.related.GET.summary=List related artworks
GalleryController.related.GET.description=Find local works related to this visible artwork. limit defaults to 12 and results respect the caller’s visibility.
GalleryController.related.GET.success=Related artworks.
GalleryController.byAuthor.GET.summary=List other works by the author
GalleryController.byAuthor.GET.description=Use artworkId to identify the artist and list that artist’s visible local works. limit defaults to 12.
GalleryController.byAuthor.GET.success=Other works by the author.
GalleryController.bySeries.GET.summary=List artworks in the same series
GalleryController.bySeries.GET.description=Look up the series of the supplied work and list its visible local members. limit defaults to 30.
GalleryController.bySeries.GET.success=Artworks in the same series.
GalleryController.seriesNav.GET.summary=Get artwork series navigation
GalleryController.seriesNav.GET.description=Return series position and the previous and next visible works for this work ID. Series and neighbor fields may be null when unavailable.
GalleryController.seriesNav.GET.success=Artwork series navigation.
GalleryController.deleteArtwork.DELETE.summary=Delete a gallery artwork
GalleryController.deleteArtwork.DELETE.description=Delete one local work. Success returns deleted=1 and an absent work returns 404. MANAGED files are removed when the work is deleted. EXTERNAL_REFERENCE means the current record references external files, which are kept on deletion. Both leave the gallery and keep their library record for duplicate detection. Only the artwork ID in the path selects the work to delete. Omit the request body. Any supplied body is ignored.
GalleryController.deleteArtwork.DELETE.success=Gallery artwork removed.
GalleryController.deleteArtworks.POST.summary=Delete selected artworks
GalleryController.deleteArtworks.POST.description=Delete local works selected by ids or filter. excludeIds removes works from the final selection. The response reports the number deleted. MANAGED files are removed when the work is deleted. EXTERNAL_REFERENCE means the current record references external files, which are kept on deletion. Both leave the gallery and keep their library record for duplicate detection. An empty filter selects every active work in this library. Pagination and sorting do not narrow a batch selection. If the normalized filter has no selection criteria, deletion requires confirmAll=true. A fuzzy search containing only % or _ also requires full-library confirmation when it is the only criterion.
GalleryController.deleteArtworks.POST.success=Selected artworks removed.
GalleryController.collectArtworks.POST.summary=Add selected artworks to a collection
GalleryController.collectArtworks.POST.description=Add selected works to the specified local collection. count is the selection size and changed is the number of changes applied. An empty filter selects every active work in this library. Pagination and sorting do not narrow a batch selection.
GalleryController.collectArtworks.POST.success=Selected artworks to a collection added.
GalleryController.exportArtworks.POST.summary=Export selected artworks
GalleryController.exportArtworks.POST.description=Create an archive from selected IDs or a filter, excluding excludeIds. Success returns archiveToken, its lifetime in seconds and counts. An empty archive selection returns 204. After a successful export, deleteAfter=true applies the artwork deletion policy. MANAGED files are removed when the work is deleted. EXTERNAL_REFERENCE means the current record references external files, which are kept on deletion. An empty filter selects every active work in this library. Pagination and sorting do not narrow a batch selection. If the normalized filter has no selection criteria, deletion requires confirmAll=true. A program key also needs gallery:delete to delete after export. A fuzzy search containing only % or _ also requires full-library confirmation when it is the only criterion.
GalleryController.exportArtworks.POST.success=Selected artworks.
