GalleryController.listArtworks.GET.parameter.page=頁碼從 0 開始。負數按第 0 頁查詢，回應中的 page 為實際頁碼。
GalleryController.listArtworks.GET.parameter.size=每頁作品數，預設為 24。小於 1 時取 1，大於 200 時取 200。回應的 size 為實際採用的值。
schema.top.sywyar.pixivdownload.gallery.web.GalleryArtworkResponse.field.fileManagement=MANAGED 表示檔案由應用程式管理，刪除作品時一併清理。EXTERNAL_REFERENCE 表示目前的登錄參照外部檔案，刪除作品時保留原檔。 任一頁的外部參照與目前的作品類型、ID 和登錄時間相符，就傳回 EXTERNAL_REFERENCE。即使原檔已不存在，也不影響判定。
GalleryController.listArtworks.GET.parameter.fileManagement=用 fileManagement 篩選檔案管理方式，省略時包含兩類作品。 MANAGED 表示檔案由應用程式管理，刪除作品時一併清理。EXTERNAL_REFERENCE 表示目前的登錄參照外部檔案，刪除作品時保留原檔。 無法辨識的值會回傳 400。
schema.top.sywyar.pixivdownload.gallery.ArtworkBatchRequest.Filter.field.fileManagement=用 fileManagement 篩選檔案管理方式，省略時包含兩類作品。 MANAGED 表示檔案由應用程式管理，刪除作品時一併清理。EXTERNAL_REFERENCE 表示目前的登錄參照外部檔案，刪除作品時保留原檔。 無法辨識的值會回傳 400。
description=依標籤、作者或系列瀏覽本機插畫。
