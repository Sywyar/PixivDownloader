title=插畫畫廊
GalleryController.listArtworks.GET.summary=分頁檢視畫廊作品
GalleryController.listArtworks.GET.description=分頁瀏覽呼叫者可見的本地庫。page 從 0 開始；ID 集合按逗號分隔，可使用 tagIds、notTagIds、orTagIds 組合標籤條件。 用 fileManagement 篩選檔案管理方式，省略時包含兩類作品。 每個 ID 都必須是正整數；空項目或無效 ID 會使整個請求傳回 400。
GalleryController.listArtworks.GET.success=畫廊作品。
GalleryController.listTags.GET.summary=列出畫廊標籤
GalleryController.listTags.GET.description=用 search 搜尋本地標籤，用 limit 控制候選數量。返回的標籤 ID 可用於作品列表篩選。
GalleryController.listTags.GET.success=畫廊標籤。
GalleryController.findTag.GET.summary=查詢畫廊標籤
GalleryController.findTag.GET.description=按原名 name 或譯名 translatedName 查詢本地標籤，命中時返回標籤選項，找不到時返回 404。 缺少有效名稱時傳回 400。
GalleryController.findTag.GET.success=畫廊標籤。
GalleryController.artwork.GET.summary=檢視畫廊作品詳情
GalleryController.artwork.GET.description=按 Pixiv 作品 ID 讀取本地儲存的詳情，訪問範圍取決於呼叫者可見的作品記錄。 MANAGED 表示檔案由應用程式管理，刪除作品時一併清理。EXTERNAL_REFERENCE 表示目前的登錄參照外部檔案，刪除作品時保留原檔。
GalleryController.artwork.GET.success=畫廊作品詳情。
GalleryController.related.GET.summary=列出相關作品
GalleryController.related.GET.description=以一部可見的本地作品為起點取得相關作品。limit 預設 12，結果經過訪問範圍過濾。
GalleryController.related.GET.success=相關作品。
GalleryController.byAuthor.GET.summary=列出同一作者的作品
GalleryController.byAuthor.GET.description=使用 artworkId 確定畫師，返回該畫師在本地庫中的可見作品。limit 預設 12。
GalleryController.byAuthor.GET.success=同一作者的作品。
GalleryController.bySeries.GET.summary=列出同系列作品
GalleryController.bySeries.GET.description=從一部可見作品的 ID 確定所屬系列，列出同系列可見作品。limit 預設 30。
GalleryController.bySeries.GET.success=同系列作品。
GalleryController.seriesNav.GET.summary=檢視作品系列導航
GalleryController.seriesNav.GET.description=根據作品 ID 返回系列內前後相鄰作品和位置資訊。不存在系列關係或可見鄰項時，相應欄位可以為 null。
GalleryController.seriesNav.GET.success=作品系列導航。
GalleryController.deleteArtwork.DELETE.summary=刪除畫廊中的作品
GalleryController.deleteArtwork.DELETE.description=刪除一條本地作品記錄，成功時返回 deleted=1，找不到時返回 404。 MANAGED 表示檔案由應用程式管理，刪除作品時一併清理。EXTERNAL_REFERENCE 表示目前的登錄參照外部檔案，刪除作品時保留原檔。 兩類作品皆從畫廊移除，作品庫保留查重記錄。 僅依路徑中的作品 ID 刪除。請省略請求本文，伺服器會忽略傳入的本文。
GalleryController.deleteArtwork.DELETE.success=已移除畫廊中的作品。
GalleryController.deleteArtworks.POST.summary=刪除選中的畫廊作品
GalleryController.deleteArtworks.POST.description=按 ids 或當前篩選條件刪除匹配的本地作品。excludeIds 從最終選擇中剔除，返回實際刪除數量。 MANAGED 表示檔案由應用程式管理，刪除作品時一併清理。EXTERNAL_REFERENCE 表示目前的登錄參照外部檔案，刪除作品時保留原檔。 兩類作品皆從畫廊移除，作品庫保留查重記錄。 空篩選會選取該庫全部有效作品。分頁和排序不會縮小批次範圍。 若篩選正規化後沒有條件，刪除前必須設定 confirmAll=true。 模糊搜尋只含 % 或 _ 且沒有其他條件時，也需要全庫確認。
GalleryController.deleteArtworks.POST.success=已移除選中的畫廊作品。
GalleryController.collectArtworks.POST.summary=新增多幅作品到收藏夾
GalleryController.collectArtworks.POST.description=將選中的作品加入請求指定的本地收藏夾。count 為選中的數量，changed 為本次實際變更數量。 空篩選會選取該庫全部有效作品。分頁和排序不會縮小批次範圍。
GalleryController.collectArtworks.POST.success=已新增多幅作品到收藏夾。
GalleryController.exportArtworks.POST.summary=匯出選中的畫廊作品
GalleryController.exportArtworks.POST.description=按所選 ID 或篩選條件建立歸檔，排除 excludeIds。成功返回 archiveToken、有效秒數和數量；無可歸檔的檔案時返回 204。 成功封存且 deleteAfter=true 時依檔案管理方式執行刪除。 MANAGED 表示檔案由應用程式管理，刪除作品時一併清理。EXTERNAL_REFERENCE 表示目前的登錄參照外部檔案，刪除作品時保留原檔。 空篩選會選取該庫全部有效作品。分頁和排序不會縮小批次範圍。 若篩選正規化後沒有條件，刪除前必須設定 confirmAll=true。 匯出後刪除還需要程式金鑰具備 gallery:delete 權限。 模糊搜尋只含 % 或 _ 且沒有其他條件時，也需要全庫確認。
GalleryController.exportArtworks.POST.success=選中的畫廊作品。
