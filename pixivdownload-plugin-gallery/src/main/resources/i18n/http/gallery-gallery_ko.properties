title=일러스트 갤러리
GalleryController.listArtworks.GET.summary=갤러리 작품 페이지 조회
GalleryController.listArtworks.GET.description=호출자에게 보이는 로컬 자료를 page=0부터 조회합니다. ID 목록은 쉼표로 구분하고 tagIds, notTagIds, orTagIds로 태그 조건을 조합합니다. fileManagement로 파일 관리 방식을 지정합니다. 생략하면 두 방식 모두 포함합니다. 각 ID는 양의 정수여야 합니다. 빈 항목이나 잘못된 ID가 하나라도 있으면 요청 전체에 400을 반환합니다.
GalleryController.listArtworks.GET.success=갤러리 작품.
GalleryController.listTags.GET.summary=갤러리 태그 목록 조회
GalleryController.listTags.GET.description=search로 로컬 태그를 검색하고 limit으로 결과 개수를 정합니다. 반환된 태그 ID를 작품 목록 필터에 사용할 수 있습니다.
GalleryController.listTags.GET.success=갤러리 태그.
GalleryController.findTag.GET.summary=갤러리 태그 조회
GalleryController.findTag.GET.description=원래 이름 name 또는 번역명 translatedName으로 로컬 태그를 검색합니다. 없으면 404입니다. name과 translatedName이 모두 없거나 비어 있으면 400을 반환합니다.
GalleryController.findTag.GET.success=갤러리 태그.
GalleryController.artwork.GET.summary=갤러리 작품 정보 조회
GalleryController.artwork.GET.description=호출자에게 보이는 로컬 작품의 세부 정보를 Pixiv ID로 조회합니다. MANAGED 파일은 작품을 삭제할 때 함께 삭제됩니다. EXTERNAL_REFERENCE는 현재 기록이 외부 파일을 참조한다는 뜻이며 삭제 후에도 원본이 남습니다.
GalleryController.artwork.GET.success=갤러리 작품 정보.
GalleryController.related.GET.summary=관련 작품 목록 조회
GalleryController.related.GET.description=조회 가능한 로컬 작품과 연관된 작품을 찾습니다. limit 기본값은 12이며 접근 가능한 작품만 반환합니다.
GalleryController.related.GET.success=관련 작품.
GalleryController.byAuthor.GET.summary=같은 작가의 작품 목록 조회
GalleryController.byAuthor.GET.description=artworkId에 해당하는 작가의 로컬 작품 중 볼 수 있는 항목을 반환합니다. limit 기본값은 12입니다.
GalleryController.byAuthor.GET.success=같은 작가의 작품.
GalleryController.bySeries.GET.summary=같은 시리즈 작품 목록 조회
GalleryController.bySeries.GET.description=작품 ID로 시리즈를 찾아 볼 수 있는 로컬 작품을 반환합니다. limit 기본값은 30입니다.
GalleryController.bySeries.GET.success=같은 시리즈 작품.
GalleryController.seriesNav.GET.summary=작품 시리즈 탐색 정보 조회
GalleryController.seriesNav.GET.description=작품 ID를 기준으로 시리즈 내 위치와 접근 가능한 이전·다음 작품을 반환합니다. 시리즈나 인접 항목이 없으면 해당 값은 null일 수 있습니다.
GalleryController.seriesNav.GET.success=작품 시리즈 탐색 정보.
GalleryController.deleteArtwork.DELETE.summary=갤러리 작품 삭제
GalleryController.deleteArtwork.DELETE.description=로컬 작품 한 건을 삭제합니다. 성공 시 deleted=1, 작품이 없으면 404입니다. MANAGED 파일은 작품을 삭제할 때 함께 삭제됩니다. EXTERNAL_REFERENCE는 현재 기록이 외부 파일을 참조한다는 뜻이며 삭제 후에도 원본이 남습니다. 두 경우 모두 갤러리에서 제거되며 중복 확인용 기록은 남습니다. 경로의 작품 ID로 삭제할 작품을 지정합니다. 요청 본문은 생략하세요. 본문을 보내도 무시됩니다.
GalleryController.deleteArtwork.DELETE.success=갤러리 작품을 제거했습니다.
GalleryController.deleteArtworks.POST.summary=선택한 작품 삭제
GalleryController.deleteArtworks.POST.description=ids 또는 필터로 선택한 로컬 작품을 삭제합니다. 최종 선택에서 excludeIds를 제외하고 실제 삭제 건수를 반환합니다. MANAGED 파일은 작품을 삭제할 때 함께 삭제됩니다. EXTERNAL_REFERENCE는 현재 기록이 외부 파일을 참조한다는 뜻이며 삭제 후에도 원본이 남습니다. 두 경우 모두 갤러리에서 제거되며 중복 확인용 기록은 남습니다. 빈 필터는 이 라이브러리의 모든 활성 작품을 선택합니다. 페이지와 정렬은 일괄 선택 범위를 제한하지 않습니다. 정규화한 필터에 조건이 없으면 삭제하려면 confirmAll=true를 지정해야 합니다. 부분 검색에 % 또는 _만 있고 다른 조건이 없으면 전체 삭제를 확인해야 합니다.
GalleryController.deleteArtworks.POST.success=선택한 작품을 제거했습니다.
GalleryController.collectArtworks.POST.summary=컬렉션에 선택한 작품 추가
GalleryController.collectArtworks.POST.description=선택한 작품을 지정한 로컬 컬렉션에 추가합니다. count는 선택 건수, changed는 실제 변경 건수입니다. 빈 필터는 이 라이브러리의 모든 활성 작품을 선택합니다. 페이지와 정렬은 일괄 선택 범위를 제한하지 않습니다.
GalleryController.collectArtworks.POST.success=컬렉션에 선택한 작품을 추가했습니다.
GalleryController.exportArtworks.POST.summary=선택한 작품 내보내기
GalleryController.exportArtworks.POST.description=선택한 ID 또는 필터에서 excludeIds를 빼고 아카이브를 생성합니다. 성공하면 archiveToken, 유효 시간(초), 개수를 반환하며 파일이 없으면 204입니다. 내보내기가 성공하고 deleteAfter=true이면 작품 삭제 정책을 적용합니다. MANAGED 파일은 작품을 삭제할 때 함께 삭제됩니다. EXTERNAL_REFERENCE는 현재 기록이 외부 파일을 참조한다는 뜻이며 삭제 후에도 원본이 남습니다. 빈 필터는 이 라이브러리의 모든 활성 작품을 선택합니다. 페이지와 정렬은 일괄 선택 범위를 제한하지 않습니다. 정규화한 필터에 조건이 없으면 삭제하려면 confirmAll=true를 지정해야 합니다. 내보낸 후 삭제하려면 프로그램 키에 gallery:delete 권한도 필요합니다. 부분 검색에 % 또는 _만 있고 다른 조건이 없으면 전체 삭제를 확인해야 합니다.
GalleryController.exportArtworks.POST.success=선택한 작품.
