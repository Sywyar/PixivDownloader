schema.top.sywyar.pixivdownload.gallery.web.GalleryArtworkResponse.field.fileNameTemplate=작품 파일명 템플릿입니다. 사용 가능한 변수는 {downloadVariables}입니다.
schema.top.sywyar.pixivdownload.gallery.ArtworkBatchRequest.field.mode=mode를 생략하거나 ids로 지정하면 ids에 나열한 작품을 선택합니다. filter 모드에는 filter 객체가 필요합니다. 두 모드 모두 excludeIds에 있는 작품을 제외합니다.
schema.top.sywyar.pixivdownload.gallery.ArtworkBatchRequest.field.filter=filter 모드의 선택 조건입니다. 빈 객체 {}는 모든 작품을 선택합니다. 전체 작품을 삭제하거나 내보낸 뒤 원본을 삭제하려면 confirmAll이 필요합니다. 필터 및 제외 목록의 ID는 양의 JSON 정수여야 합니다.
schema.top.sywyar.pixivdownload.gallery.ArtworkBatchRequest.field.ids=직접 선택할 작품 ID 배열입니다. 모든 항목은 양의 JSON 정수여야 합니다. 중복 ID에 해당하는 작품은 한 번만 선택합니다.
