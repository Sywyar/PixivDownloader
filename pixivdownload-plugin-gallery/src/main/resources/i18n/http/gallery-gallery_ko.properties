schema.top.sywyar.pixivdownload.gallery.ArtworkBatchRequest.field.groupBy=id이면 작품 ID별 폴더로 내보냅니다. 생략하면 작가·작품별로 나눕니다.
schema.top.sywyar.pixivdownload.gallery.ArtworkBatchRequest.field.deleteAfter=원본 압축 파일이 준비된 뒤 선택한 로컬 작품을 삭제합니다. 보존하려면 false 또는 생략합니다.
