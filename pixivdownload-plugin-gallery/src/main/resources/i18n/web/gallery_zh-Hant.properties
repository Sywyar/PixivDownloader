onboarding.gallery.progress=認識畫廊 · {step}/{total}
onboarding.gallery.views.title=① 瀏覽檢視
onboarding.gallery.views.body=左側可在「全部圖片／依作者／依系列漫畫」之間切換，以不同維度瀏覽您下載的作品；下方還有收藏夾與各頁面導覽。
onboarding.gallery.search.title=② 搜尋
onboarding.gallery.search.body=輸入作品標題、畫師名稱、標籤等，即可快速找到已下載內容；左側下拉選單可切換搜尋範圍。
onboarding.gallery.filter.title=③ 篩選
onboarding.gallery.filter.body=開啟篩選後，可依排序、分級、AI、格式、收藏夾、系列等條件組合過濾，精準找到想查看的作品。
onboarding.gallery.grid.title=④ 作品網格
onboarding.gallery.grid.body=下載完成的作品都會展示在此處，按一下任意卡片即可進入作品詳情頁。
onboarding.gallery.card.title=🖼 這是您剛下載的作品
onboarding.gallery.card.body=按一下這張反白的作品卡片，進入作品詳情頁。
onboarding.gallery.card.body-fallback=您下載的作品會出現在此處，按一下任意卡片即可進入作品詳情頁。
onboarding.redirect.title=👋 歡迎使用 PixivDownloader
onboarding.redirect.body=新手指引會從「下載頁」開始，帶您下載第一份範例作品。現在要前往嗎？
onboarding.redirect.later=稍後再說
onboarding.redirect.go=前往下載頁
onboarding.detail.viewer.title=① 作品圖片區
onboarding.detail.viewer.body=此處展示作品圖片，按一下任意圖片即可放大查看；多圖作品會逐頁平鋪瀏覽。
onboarding.detail.actions.title=② 功能區
onboarding.detail.actions.body=作品的操作區：展開／收合多圖、跳轉 Pixiv 原作品、作品展示，以及刪除本機作品等，旁邊還會顯示頁數與格式資訊。
onboarding.detail.meta.title=③ 簡介區
onboarding.detail.meta.body=作品標題、簡介與標籤都在此處。按一下標籤即可在畫廊中篩選相同標籤的作品。
onboarding.detail.author.title=④ 作者區
onboarding.detail.author.body=作品作者（畫師）的資訊。按一下即可查看該作者在本機的其他作品，或跳轉至其 Pixiv 首頁。
onboarding.detail.series.title=⑤ 系列／相關區
onboarding.detail.series.body=如果作品屬於某個系列，可在此翻閱同系列的其他章節；下方還會推薦相關作品。
onboarding.done.title=🎉 新手指引完成！
onboarding.done.body=您已完成從下載到瀏覽的完整流程。接下來可以使用「快速取得／搜尋／系列」等方式批次下載更多作品，盡情探索吧！
onboarding.redirect.unavailable=目前沒有可用的下載入口。你仍可瞭解畫廊的瀏覽方式。
onboarding.redirect.browse=瞭解畫廊
