onboarding.gallery.progress=ギャラリーを確認 · {step}/{total}
onboarding.gallery.views.title=① 表示
onboarding.gallery.views.body=左側で「すべての画像 / 作者別 / シリーズ別マンガ」を切り替え、さまざまな切り口でダウンロード済み作品を閲覧できます。下にはコレクションと各ページへのナビゲーションもあります。
onboarding.gallery.search.title=② 検索
onboarding.gallery.search.body=作品タイトル、作者名、タグなどを入力して、ダウンロード済みの内容をすばやく検索します。左側のドロップダウンで検索範囲を切り替えられます。
onboarding.gallery.filter.title=③ フィルター
onboarding.gallery.filter.body=フィルターを開き、並べ替え、レーティング、AI、形式、コレクション、シリーズなどの条件を組み合わせて、目的の作品を正確に見つけられます。
onboarding.gallery.grid.title=④ 作品グリッド
onboarding.gallery.grid.body=ダウンロード済みの作品をここに表示します。任意のカードをクリックすると作品詳細ページを開けます。
onboarding.gallery.card.title=🖼 今ダウンロードした作品
onboarding.gallery.card.body=ハイライトされている作品カードをクリックして、作品詳細ページを開いてください。
onboarding.gallery.card.body-fallback=ダウンロードした作品はここに表示されます。任意のカードをクリックすると作品詳細ページを開けます。
onboarding.redirect.title=👋 PixivDownloader へようこそ
onboarding.redirect.body=初心者向けガイドは「ダウンロードページ」から始まり、最初のサンプル作品をダウンロードします。今すぐ移動しますか？
onboarding.redirect.later=後で
onboarding.redirect.go=ダウンロードページへ
onboarding.detail.viewer.title=① 作品画像エリア
onboarding.detail.viewer.body=ここに作品の画像を表示します。任意の画像をクリックすると拡大表示できます。複数画像の作品はページごとに並べて閲覧できます。
onboarding.detail.actions.title=② 操作エリア
onboarding.detail.actions.body=作品の操作エリアです。複数画像の展開 / 折りたたみ、Pixiv の原作品への移動、作品の展示、ローカル作品の削除などができます。ページ数と形式もここに表示されます。
onboarding.detail.meta.title=③ 説明エリア
onboarding.detail.meta.body=作品のタイトル、説明、タグをここに表示します。タグをクリックすると、ギャラリーで同じタグの作品を絞り込めます。
onboarding.detail.author.title=④ 作者エリア
onboarding.detail.author.body=作品の作者（イラストレーター）情報です。クリックすると、ローカルにある作者の他の作品を表示したり、Pixiv の作者ページへ移動したりできます。
onboarding.detail.series.title=⑤ シリーズ / 関連作品エリア
onboarding.detail.series.body=作品がシリーズに属している場合は、ここで同じシリーズの他の話を閲覧できます。下には関連作品も表示されます。
onboarding.done.title=🎉 初心者向けガイドが完了しました！
onboarding.done.body=ダウンロードから閲覧までの流れを一通り体験しました。これからは「クイック取得 / 検索 / シリーズ」などを使って、さらに多くの作品を一括ダウンロードしてみてください！
onboarding.redirect.unavailable=現在利用できるダウンロード先はありません。ギャラリーの使い方は引き続き確認できます。
onboarding.redirect.browse=ギャラリーの使い方を見る
