error.origin=リクエストの送信元がこのサイトと一致しないため、操作を拒否しました。このサイトからコンポーネントエディターを直接開いてください。リバースプロキシを使用している場合はサイトのアドレス設定を確認してください。
error.private=このコンポーネントは公開ページに表示できません。削除するか、公開ページに対応したものに変更してください。
error.budget=ページまたはコンポーネントがサイズ、数量、入れ子の上限を超えています。内容を減らして再試行してください。
error.preview=開いているプレビューが多すぎます。不要なプレビューを閉じて再試行してください。
error.storage=変更を保存できませんでした。ディスクの空き容量とデータフォルダーへの書き込み権限を確認し、再試行してください。
error.conflict=下書きまたは公開ページが変更されています。現在の編集内容を控えてから再読み込みし、バージョンを確認してください。
error.stale=確認中にページ、プラグイン、チェック設定が変更されました。公開内容をもう一度確認してください。
error.unavailable=公開ページの状態を読み取れないため、公開や復元ができません。サーバーログとストレージを確認してください。
error.shared=他のページで同じ操作に異なるチェックが設定されています。設定を揃え、「その他」から対象ページをまとめて公開または復元してください。
error.previous=選択したページに復元できる前回の公開版がありません。そのページの選択を解除するか、保存済みの下書きを使用してください。
error.approval=公開に必要な権限が承認されていません。公開内容、コンポーネント、リソースを確認してから承認してください。
error.contract=コンポーネントとフォームのチェックに互換性がないか、プラグイン設定が変更されています。設定を確認し、コンポーネントを再読み込みしてから公開してください。
error.hook=送信チェックまたは結果処理の設定が無効です。対象、実行タイミング、設定、読み取りを許可したデータ項目を確認してください。
error.target=選択した操作が利用できないか、このチェックの接続が許可されていません。対応するプラグインを確認し、フォーム操作を選び直してください。
error.structure=必要な領域がないか、配置が正しくありません。構造を確認するか、既定のレイアウトを読み込んで編集し直してください。
error.connection=コンポーネントの接続が無効か、循環しています。接続元、接続先、データ型を確認し、循環する接続を削除してください。
error.document=ページまたはコンポーネントの形式が無効です。最近の編集内容を確認し、再読み込みの前に必要な変更を控えてください。
error.style=スタイルが無効か未対応です。CSS のプロパティと値を確認してください。外部リソースやスクリプトは使用できません。
publication-operations-help=送信前のチェックを通過すると操作が実行されます。完了後の処理は結果の受け取りのみです。システムの他のチェックも引き続き適用されます。
