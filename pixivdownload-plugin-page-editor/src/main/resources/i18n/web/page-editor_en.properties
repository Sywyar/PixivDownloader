error.duplicate=The same check is attached to this form action more than once. Remove the duplicate verification component or check the duplicate entries under “Submission checks and result handling”.
error.binding=A verification component has no valid form action. Place it inside the intended form and select the action in its properties.
error.capacity=This action has too many checks. Remove extra verification components or check settings.
error.component=A required component or plugin is unavailable. Check that it is installed and enabled in plugin management, then reload the page.
error.configuration=Component properties are invalid. Check required fields, numbers and the configuration version of the selected component.
error.source=Component source contains invalid or unsupported content. Check the HTML, CSS, JavaScript and resource addresses against the editor’s code help.
error.origin=The request origin does not match this site, so the operation was rejected. Open the component editor directly on this site; if using a reverse proxy, check its site address configuration.
error.private=This component cannot appear on a public page. Remove it or choose one that supports public pages.
error.budget=The page or component exceeds a size, count or nesting limit. Reduce its content and try again.
error.preview=Too many previews are open. Close unused previews and try again.
error.storage=Changes could not be saved. Check available disk space and write access to the data directory, then try again.
error.conflict=The draft or published page has changed. Keep a copy of your edits, then reload and review the current version.
error.stale=Pages, plugins or check settings changed during confirmation. Review a new publication plan before confirming.
error.unavailable=The published page state cannot be read. Publishing and recovery are unavailable; check server logs and storage.
error.shared=Other pages use different checks for the same action. Make their settings consistent, then select the pages to publish or restore together under “More”.
error.previous=A selected page has no previous publication to restore. Deselect that page or use its saved draft instead.
error.approval=Required permissions have not been approved. Review the publication plan, components and resources, then confirm.
error.contract=The component and form checks are incompatible, or plugin settings changed. Check plugin configuration, reload the component and publish again.
error.hook=Submission check or result handling settings are invalid. Check the target, timing, configuration and permitted data fields.
error.target=The selected action is unavailable or does not allow this check. Check its plugin and select the form action again.
error.structure=A required page section is missing or misplaced. Check the structure, or load the default layout and edit it again.
error.connection=Component connections are invalid or form a loop. Check sources, destinations and data types, and remove cyclic connections.
error.document=Page or component content is invalid. Check your recent edits and keep a copy of any changes before reloading.
error.style=The style is invalid or unsupported. Check CSS properties and values; external resources and scripts are not allowed.
