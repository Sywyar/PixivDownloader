publication-data-help=페이지별 현재 읽기 권한과 확인 후 적용될 권한을 확인하세요. 필드의 출처와 경로만 표시하며 값은 표시하지 않습니다.
publication-fields-none=호출 메타데이터만 받으며 요청 또는 응답 필드는 읽지 않습니다.
publication-field-QUERY=URL 쿼리 매개변수
publication-field-JSON=요청 본문
publication-field-RESULT=응답 본문
