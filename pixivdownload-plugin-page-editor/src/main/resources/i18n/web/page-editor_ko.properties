error.duplicate=같은 양식 작업에 동일한 검사가 중복되어 있습니다. 중복된 인증 구성 요소를 삭제하거나 “제출 검사 및 결과 처리” 설정을 확인하세요.
error.binding=인증 구성 요소가 유효한 양식 작업에 연결되지 않았습니다. 대상 양식 안에 배치하고 속성에서 작업을 선택하세요.
error.capacity=이 작업의 검사 수가 허용 한도를 초과했습니다. 불필요한 인증 구성 요소나 검사 설정을 삭제하세요.
error.component=필요한 구성 요소 또는 플러그인을 사용할 수 없습니다. 플러그인 관리에서 설치 및 활성화 상태를 확인한 뒤 페이지를 다시 불러오세요.
error.configuration=구성 요소 속성이 올바르지 않습니다. 선택한 구성 요소의 필수 항목, 숫자 및 설정 버전을 확인하세요.
error.source=구성 요소 소스에 잘못되었거나 허용되지 않는 내용이 있습니다. 편집기의 코드 도움말에 따라 HTML, CSS, JavaScript 및 리소스 주소를 확인하세요.
error.origin=요청 출처가 현재 사이트와 일치하지 않아 작업이 거부되었습니다. 이 사이트에서 구성 요소 편집기를 직접 여세요. 리버스 프록시를 사용한다면 사이트 주소 설정을 확인하세요.
error.private=이 구성 요소는 공개 페이지에 표시할 수 없습니다. 삭제하거나 공개 페이지를 지원하는 구성 요소로 바꾸세요.
error.budget=페이지 또는 구성 요소가 크기, 개수 또는 중첩 한도를 초과했습니다. 내용을 줄인 뒤 다시 시도하세요.
error.preview=열려 있는 미리보기가 너무 많습니다. 사용하지 않는 미리보기를 닫고 다시 시도하세요.
error.storage=변경 사항을 저장하지 못했습니다. 디스크 여유 공간과 데이터 폴더의 쓰기 권한을 확인한 뒤 다시 시도하세요.
error.conflict=초안 또는 게시된 페이지가 변경되었습니다. 현재 수정 내용을 따로 보관한 뒤 다시 불러와 버전을 확인하세요.
error.stale=확인 중에 페이지, 플러그인 또는 검사 설정이 변경되었습니다. 게시 계획을 다시 검토하고 확인하세요.
error.unavailable=게시된 페이지 상태를 읽을 수 없어 게시하거나 복원할 수 없습니다. 서버 로그와 저장소 상태를 확인하세요.
error.shared=다른 페이지에서 같은 작업에 다른 검사를 설정했습니다. 관련 페이지의 설정을 일치시킨 뒤 “더 보기”에서 함께 게시하거나 복원하세요.
error.previous=선택한 페이지에 복원할 이전 게시 버전이 없습니다. 해당 페이지의 선택을 해제하거나 저장된 초안을 사용하세요.
error.approval=게시에 필요한 권한이 승인되지 않았습니다. 게시 계획에서 구성 요소와 리소스를 검토한 뒤 확인하세요.
error.contract=구성 요소와 양식의 검사 설정이 호환되지 않거나 플러그인 설정이 변경되었습니다. 플러그인 설정을 확인하고 구성 요소를 다시 불러온 뒤 게시하세요.
error.hook=제출 검사 또는 결과 처리 설정이 올바르지 않습니다. 대상, 실행 시점, 설정 및 읽기가 허용된 데이터 필드를 확인하세요.
error.target=선택한 작업을 사용할 수 없거나 이 검사를 연결할 수 없습니다. 해당 플러그인을 확인하고 양식 작업을 다시 선택하세요.
error.structure=필수 페이지 영역이 없거나 위치가 잘못되었습니다. 구조를 확인하거나 기본 레이아웃을 불러와 다시 편집하세요.
error.connection=구성 요소 연결이 잘못되었거나 순환합니다. 출발점, 대상 및 데이터 형식을 확인하고 순환 연결을 삭제하세요.
error.document=페이지 또는 구성 요소의 내용 형식이 올바르지 않습니다. 최근 수정 내용을 확인하고 다시 불러오기 전에 필요한 변경 사항을 보관하세요.
error.style=스타일이 잘못되었거나 지원되지 않습니다. CSS 속성과 값을 확인하세요. 외부 리소스나 스크립트는 사용할 수 없습니다.
publication-operations-help=제출 전 검사를 통과해야 작업이 실행됩니다. 완료 후 처리는 결과만 확인합니다. 시스템의 다른 검사도 계속 적용됩니다.
publication-before=현재:
publication-after=이번 확인 후:
