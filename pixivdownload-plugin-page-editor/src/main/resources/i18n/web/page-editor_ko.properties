details.box=비어 있는 일반 컨테이너입니다. 텍스트, 링크, 컴포넌트를 넣고 레이아웃, 간격, 배경을 함께 설정할 수 있습니다.
details.text=레이아웃 컨테이너 안에 넣는 텍스트입니다. 글꼴, 색상, 정렬을 설정할 수 있으며 텍스트 요소 안에는 다른 컴포넌트를 넣을 수 없습니다.
details.link=레이아웃 컨테이너 안에 넣는 텍스트 링크입니다. 주소와 모양을 설정할 수 있으며 링크 안에는 다른 컴포넌트를 넣을 수 없습니다.
details.header=사이트 이름과 탐색 메뉴 등을 묶는 비어 있는 머리글 레이아웃 컨테이너입니다.
details.main=주요 콘텐츠를 묶는 비어 있는 레이아웃 컨테이너입니다. 기본적으로 남은 공간을 채웁니다.
details.footer=등록 정보와 저작권 표시 등을 묶는 비어 있는 바닥글 레이아웃 컨테이너입니다.
details.plugins=플러그인이 제공하는 컴포넌트입니다. 추가한 뒤 속성에서 이 인스턴스를 설정할 수 있습니다.
details.custom=이 고정 버전으로 추가합니다. 각 인스턴스는 속성에서 설정하고, 소스는 편집 페이지에서 수정할 수 있습니다.
publish-batch=선택한 초안 게시
publication-select-help=현재 페이지가 선택되어 있습니다. 함께 게시할 다른 초안만 선택한 후 작업 변경 사항과 리소스 권한을 확인하세요.
