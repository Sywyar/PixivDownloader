hook.unavailable=선택한 작업에 연결할 수 없습니다. 해당 플러그인이 활성화되어 있는지 확인한 뒤 작업을 다시 선택하세요.
hook.draft=초안에 추가했습니다. 게시 후 적용됩니다.
hook.invalid=설정은 유효한 JSON이어야 하고 읽기가 허용된 필드는 목록이어야 합니다. 플러그인 안내에 따라 입력하세요.
