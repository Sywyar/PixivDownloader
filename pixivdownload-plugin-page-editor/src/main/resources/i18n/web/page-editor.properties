error.origin=请求来源与当前站点不一致，已拒绝操作。请从本站直接打开组件编辑器；使用反向代理时请检查站点地址配置。
error.private=此组件不允许显示在公开页面。请移除它，或换成支持公开显示的组件。
error.budget=页面或组件内容超过大小、数量或嵌套层级限制。请精简内容后重试。
error.preview=同时打开的预览过多。请关闭不用的预览后重试。
error.storage=未能保存更改。请检查磁盘空间和数据目录的写入权限，再重试。
error.conflict=草稿或正式页面已变化。请先保留当前修改，再重新载入并核对版本。
error.stale=确认期间页面、插件或检查设置已变化。请重新查看发布计划并确认。
error.unavailable=无法读取正式页面状态，暂时不能发布或恢复。请检查服务器日志和存储状态。
error.shared=其他页面对同一操作设置了不同的检查。请将相关页面调整一致，再从“更多”中选择一起发布或恢复。
error.previous=所选页面没有可恢复的上一发布版。请取消选择该页，或改用已保存的草稿。
error.approval=本次发布所需的权限尚未确认。请重新查看发布计划，核对组件及资源后再确认。
error.contract=组件与表单的检查设置不兼容，或插件设置已变化。请检查插件配置，重新载入组件后再发布。
error.hook=提交检查或结果处理设置无效。请核对目标、执行时机、配置和允许读取的数据字段。
error.target=所选操作当前不可用，或不允许连接此检查。请检查对应插件并重新选择表单操作。
error.structure=页面缺少必要区域，或区域位置不正确。请检查结构；也可载入默认布局后重新编辑。
error.connection=组件连接无效或形成了循环。请检查来源、目标和数据类型，移除循环连接。
error.document=页面或组件内容格式无效。请检查最近编辑的内容；重新载入前先保留需要的修改。
error.style=样式无效或不受支持。请检查 CSS 属性和值，不要使用外部资源或脚本。
