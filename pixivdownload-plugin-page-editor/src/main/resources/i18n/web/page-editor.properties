error.capacity=此操作的检查数量超过允许上限。请移除多余的验证组件或检查设置。
error.component=页面所需的组件或插件不可用。请在插件管理中检查是否已安装并启用，再重新载入页面。
error.configuration=组件属性不符合要求。请检查所选组件的必填项、数值和配置版本。
