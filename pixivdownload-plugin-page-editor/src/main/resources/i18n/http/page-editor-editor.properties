title=页面编辑
ComponentLibraryController.catalog.GET.summary=列出页面组件
ComponentLibraryController.catalog.GET.description=列出组件摘要，含 id、enabled 和最近发布的 latest 版本。用 id 读取草稿，用版本标识读取已发布源码。
ComponentLibraryController.catalog.GET.success=页面组件。
ComponentLibraryController.read.GET.summary=查看组件草稿
ComponentLibraryController.read.GET.description=返回组件的 revision、draft、versions 和 latest。编辑草稿后连同本次读取的 revision 一起保存。
ComponentLibraryController.read.GET.success=组件草稿。
ComponentLibraryController.version.GET.summary=查看指定版本的组件
ComponentLibraryController.version.GET.description=version 取组件记录 versions 中的标识。返回该次发布的源码快照。
ComponentLibraryController.version.GET.success=指定版本的组件。
ComponentLibraryController.save.POST.summary=保存组件源代码
ComponentLibraryController.save.POST.description=同源 Origin 必填。新建用 revision=0，修改用读取到的 revision。source 包含 name、html、css、javascript 字符串和 properties 对象；name 不能为空。properties 的每项声明 type、label 和同类型 default，type 支持 string、boolean、number。
ComponentLibraryController.save.POST.success=已保存组件源代码。
ComponentLibraryController.publish.POST.summary=发布组件版本
ComponentLibraryController.publish.POST.description=携带同源 Origin 和当前 revision 发布已保存的 draft。响应中的 latest 是该版本的内容摘要。
ComponentLibraryController.publish.POST.success=已发布组件版本。
ComponentLibraryController.availability.POST.summary=设置组件启用状态
ComponentLibraryController.availability.POST.description=携带同源 Origin、当前 revision 和布尔值 enabled，启用或停用组件。返回更新后的组件状态。
ComponentLibraryController.availability.POST.success=已保存组件启用状态。
ComponentLibraryController.preview.POST.summary=预览组件
ComponentLibraryController.preview.POST.description=携带同源 Origin，提交与组件保存接口相同的 source。响应包含用于打开预览的 url 和用于关闭预览的 token。
ComponentLibraryController.preview.POST.success=组件。
ComponentLibraryController.close.POST.summary=关闭组件预览
ComponentLibraryController.close.POST.description=使用预览返回的 token、同源 Origin 和 JSON 对象 {} 释放预览，响应为 true。
ComponentLibraryController.close.POST.success=已关闭组件预览。
PageEditorController.catalog.GET.summary=列出可编辑页面与组件
PageEditorController.catalog.GET.description=返回可编辑的 pages、已激活的 components、styleProperties、componentCategories 和 customComponents。以此处的页面、组件标识和发布信息构造文档。
PageEditorController.catalog.GET.success=可编辑页面与组件。
PageEditorController.read.GET.summary=查看页面文档
PageEditorController.read.GET.description=返回 revision、draft 及已有的 published 和 previous。保存时提交本次读取的 revision。
PageEditorController.read.GET.success=页面文档。
PageEditorController.defaults.GET.summary=查看页面默认文档
PageEditorController.defaults.GET.description=取得指定页面的初始文档，包括该页面要求的区域。可将此文档作为首次编辑或预览的起点。
PageEditorController.defaults.GET.success=页面默认文档。
PageEditorController.save.POST.summary=保存页面草稿
PageEditorController.save.POST.description=从该页面的 GET /api/page-editor/documents/{id} 取 draft，或从 /default 取初始文档。将编辑后的完整对象作为 document 发送，保留 format、pageId、project 和必需区域。保存另需当前 revision。
PageEditorController.save.POST.success=已保存页面草稿。
PageEditorController.publish.POST.summary=发布页面版本
PageEditorController.publish.POST.description=先对同一组草稿调用 prepare，发布时用 restoring=false，恢复时用 true。确认后将返回的 revision、fingerprint 和同意的权限放入 decision，并提交相同的 drafts；发生 409 后应重新读取和准备。
PageEditorController.publish.POST.success=已发布页面版本。
PageEditorController.restore.POST.summary=还原页面发布版本
PageEditorController.restore.POST.description=先对同一组草稿调用 prepare，发布时用 restoring=false，恢复时用 true。确认后将返回的 revision、fingerprint 和同意的权限放入 decision，并提交相同的 drafts；发生 409 后应重新读取和准备。
PageEditorController.restore.POST.success=已恢复页面发布版本。
PageEditorController.prepare.POST.summary=准备页面发布变更
PageEditorController.prepare.POST.description=传入读取到的 revision、布尔值 restoring 和所选草稿的 page/revision 列表。响应列出影响、所需权限及 fingerprint，供发布或恢复前确认。
PageEditorController.prepare.POST.success=已准备页面发布变更。
PageEditorController.preview.POST.summary=预览编辑后的页面
PageEditorController.preview.POST.description=从该页面的 GET /api/page-editor/documents/{id} 取 draft，或从 /default 取初始文档。将编辑后的完整对象作为 document 发送，保留 format、pageId、project 和必需区域。保存另需当前 revision。
PageEditorController.preview.POST.success=编辑后的页面。
PageEditorController.migrate.POST.summary=转换页面文档格式
PageEditorController.migrate.POST.description=从 catalog 的组件声明取 type 和当前 publication，提交旧 version 和 configuration。响应为迁移后的配置对象，可写入草稿。
PageEditorController.migrate.POST.success=页面文档格式。
PageEditorController.parseStyles.POST.summary=解析页面样式表
PageEditorController.parseStyles.POST.description=在 css 字符串中提交 CSS 声明，响应返回解析结果。支持的样式属性见 GET /api/page-editor/catalog 的 styleProperties。
PageEditorController.parseStyles.POST.success=页面样式表。
parameter.token=创建操作或订阅时返回的令牌。
parameter.Origin=发送请求的同源来源，必须与接口 URL 的协议、主机及端口一致。
