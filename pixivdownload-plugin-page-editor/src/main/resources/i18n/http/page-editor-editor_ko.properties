title=페이지 편집
ComponentLibraryController.catalog.GET.summary=페이지 구성 요소 목록 조회
ComponentLibraryController.catalog.GET.description=id, enabled, 최근 게시 버전 latest를 반환합니다. 초안은 id로, 게시된 소스는 버전으로 조회합니다.
ComponentLibraryController.catalog.GET.success=페이지 구성 요소.
ComponentLibraryController.read.GET.summary=구성 요소 초안 조회
ComponentLibraryController.read.GET.description=revision, draft, versions, latest를 반환합니다. 수정한 초안을 이 revision과 함께 저장하세요.
ComponentLibraryController.read.GET.success=구성 요소 초안.
ComponentLibraryController.version.GET.summary=지정 버전의 구성 요소 조회
ComponentLibraryController.version.GET.description=컴포넌트의 versions 목록에서 버전을 골라 해당 시점에 게시된 소스를 조회합니다.
ComponentLibraryController.version.GET.success=지정 버전의 구성 요소.
ComponentLibraryController.save.POST.summary=구성 요소 소스 코드 저장
ComponentLibraryController.save.POST.description=동일 출처의 Origin이 필요합니다. 새 항목은 revision=0, 수정은 현재 revision을 사용합니다. source에는 문자열 name, html, css, javascript와 properties 객체가 필요합니다. name은 비울 수 없습니다. 각 속성에 type(string, boolean, number), label, 같은 타입의 default를 지정합니다.
ComponentLibraryController.save.POST.success=구성 요소 소스 코드를 저장했습니다.
ComponentLibraryController.publish.POST.summary=구성 요소 버전 게시
ComponentLibraryController.publish.POST.description=동일 출처의 Origin과 현재 revision으로 저장된 draft를 게시합니다. latest는 게시된 내용의 다이제스트입니다.
ComponentLibraryController.publish.POST.success=구성 요소 버전을 게시했습니다.
ComponentLibraryController.availability.POST.summary=구성 요소 활성화 상태 설정
ComponentLibraryController.availability.POST.description=동일 출처 Origin, 현재 revision, 불리언 enabled로 사용 여부를 바꾸고 갱신한 상태를 반환합니다.
ComponentLibraryController.availability.POST.success=구성 요소 활성화 상태를 저장했습니다.
ComponentLibraryController.preview.POST.summary=구성 요소 미리보기
ComponentLibraryController.preview.POST.description=저장할 때와 같은 source와 동일 출처 Origin을 전달합니다. 응답에 미리보기 url과 닫을 때 쓰는 token이 포함됩니다.
ComponentLibraryController.preview.POST.success=구성 요소.
ComponentLibraryController.close.POST.summary=구성 요소 미리보기 종료
ComponentLibraryController.close.POST.description=미리보기 token, 동일 출처 Origin과 빈 JSON 객체 {}를 보내 해제합니다. true를 반환합니다.
ComponentLibraryController.close.POST.success=구성 요소 미리보기를 닫았습니다.
PageEditorController.catalog.GET.summary=편집 가능한 페이지 및 구성 요소 목록 조회
PageEditorController.catalog.GET.description=편집할 pages, 활성 components, styleProperties, componentCategories, customComponents를 반환합니다. 제공된 페이지 ID와 컴포넌트 형식 및 게시 정보를 사용하세요.
PageEditorController.catalog.GET.success=편집 가능한 페이지 및 구성 요소.
PageEditorController.read.GET.summary=페이지 문서 조회
PageEditorController.read.GET.description=revision과 draft를 반환하고 있으면 published와 previous도 반환합니다. 저장할 때 이 revision을 쓰세요.
PageEditorController.read.GET.success=페이지 문서.
PageEditorController.defaults.GET.summary=페이지 기본 문서 조회
PageEditorController.defaults.GET.description=필수 영역이 있는 해당 페이지의 초기 문서를 반환합니다. 편집이나 미리보기의 시작점으로 사용하세요.
PageEditorController.defaults.GET.success=페이지 기본 문서.
PageEditorController.save.POST.summary=페이지 초안 저장
PageEditorController.save.POST.description=GET /api/page-editor/documents/{id}의 draft 또는 /default의 초기 문서를 씁니다. format, pageId, project와 필수 영역을 보존한 전체 객체를 document로 보냅니다. 저장할 때는 현재 revision도 필요합니다.
PageEditorController.save.POST.success=페이지 초안을 저장했습니다.
PageEditorController.publish.POST.summary=페이지 버전 게시
PageEditorController.publish.POST.description=같은 drafts로 먼저 prepare를 호출합니다. 게시는 restoring=false, 복원은 true입니다. revision, fingerprint, 권한을 확인하고 approvals가 있는 decision과 같은 drafts를 보냅니다. 409이면 다시 읽고 준비하세요.
PageEditorController.publish.POST.success=페이지 버전을 게시했습니다.
PageEditorController.restore.POST.summary=페이지 게시 버전 복원
PageEditorController.restore.POST.description=같은 drafts로 먼저 prepare를 호출합니다. 게시는 restoring=false, 복원은 true입니다. revision, fingerprint, 권한을 확인하고 approvals가 있는 decision과 같은 drafts를 보냅니다. 409이면 다시 읽고 준비하세요.
PageEditorController.restore.POST.success=페이지 게시 버전을 복원했습니다.
PageEditorController.prepare.POST.summary=페이지 게시 변경 준비
PageEditorController.prepare.POST.description=현재 revision, 불리언 restoring, 선택한 초안의 page/revision을 보냅니다. 게시나 복원 전에 검토할 영향, 권한과 fingerprint를 반환합니다.
PageEditorController.prepare.POST.success=페이지 게시 변경을 준비했습니다.
PageEditorController.preview.POST.summary=편집한 페이지 미리보기
PageEditorController.preview.POST.description=GET /api/page-editor/documents/{id}의 draft 또는 /default의 초기 문서를 씁니다. format, pageId, project와 필수 영역을 보존한 전체 객체를 document로 보냅니다. 저장할 때는 현재 revision도 필요합니다.
PageEditorController.preview.POST.success=편집한 페이지.
PageEditorController.migrate.POST.summary=페이지 문서 형식 변환
PageEditorController.migrate.POST.description=catalog의 타입과 현재 publication, 이전 version과 configuration을 보내 초안에 쓸 마이그레이션된 설정을 받습니다.
PageEditorController.migrate.POST.success=페이지 문서 형식.
PageEditorController.parseStyles.POST.summary=페이지 스타일 시트 분석
PageEditorController.parseStyles.POST.description=css 문자열로 CSS 선언을 보냅니다. 사용 가능한 속성은 GET /api/page-editor/catalog의 styleProperties에서 확인합니다.
PageEditorController.parseStyles.POST.success=페이지 스타일 시트.
