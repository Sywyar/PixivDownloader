title=頁面編輯
ComponentLibraryController.catalog.GET.summary=列出頁面元件
ComponentLibraryController.catalog.GET.description=列出元件摘要，含 id、enabled 和最近釋出的 latest 版本。用 id 讀取草稿，用版本標識讀取已釋出原始碼。
ComponentLibraryController.catalog.GET.success=頁面元件。
ComponentLibraryController.read.GET.summary=檢視元件草稿
ComponentLibraryController.read.GET.description=返回元件的 revision、draft、versions 和 latest。編輯草稿後連同本次讀取的 revision 一起儲存。
ComponentLibraryController.read.GET.success=元件草稿。
ComponentLibraryController.version.GET.summary=檢視指定版本的元件
ComponentLibraryController.version.GET.description=version 取元件記錄 versions 中的標識。返回該次釋出的原始碼快照。
ComponentLibraryController.version.GET.success=指定版本的元件。
ComponentLibraryController.save.POST.summary=儲存元件原始碼
ComponentLibraryController.save.POST.description=同源 Origin 必填。新建用 revision=0，修改用讀取到的 revision。source 包含 name、html、css、javascript 字串和 properties 物件；name 不能為空。properties 的每項宣告 type、label 和同型別 default，type 支援 string、boolean、number。
ComponentLibraryController.save.POST.success=已儲存元件原始碼。
ComponentLibraryController.publish.POST.summary=釋出元件版本
ComponentLibraryController.publish.POST.description=攜帶同源 Origin 和當前 revision 釋出已儲存的 draft。響應中的 latest 是該版本的內容摘要。
ComponentLibraryController.publish.POST.success=已釋出元件版本。
ComponentLibraryController.availability.POST.summary=設定元件啟用狀態
ComponentLibraryController.availability.POST.description=攜帶同源 Origin、當前 revision 和布林值 enabled，啟用或停用元件。返回更新後的元件狀態。
ComponentLibraryController.availability.POST.success=已儲存元件啟用狀態。
ComponentLibraryController.preview.POST.summary=預覽元件
ComponentLibraryController.preview.POST.description=攜帶同源 Origin，提交與元件儲存介面相同的 source。響應包含用於開啟預覽的 url 和用於關閉預覽的 token。
ComponentLibraryController.preview.POST.success=元件。
ComponentLibraryController.close.POST.summary=關閉元件預覽
ComponentLibraryController.close.POST.description=使用預覽返回的 token、同源 Origin 和 JSON 物件 {} 釋放預覽，響應為 true。
ComponentLibraryController.close.POST.success=已關閉元件預覽。
PageEditorController.catalog.GET.summary=列出可編輯頁面與元件
PageEditorController.catalog.GET.description=返回可編輯的 pages、已啟用的 components、styleProperties、componentCategories 和 customComponents。以此處的頁面、元件標識和釋出資訊構造文件。
PageEditorController.catalog.GET.success=可編輯頁面與元件。
PageEditorController.read.GET.summary=檢視頁面文件
PageEditorController.read.GET.description=返回 revision、draft 及已有的 published 和 previous。儲存時提交本次讀取的 revision。
PageEditorController.read.GET.success=頁面文件。
PageEditorController.defaults.GET.summary=檢視頁面預設文件
PageEditorController.defaults.GET.description=取得指定頁面的初始文件，包括該頁面要求的區域。可將此文件作為首次編輯或預覽的起點。
PageEditorController.defaults.GET.success=頁面預設文件。
PageEditorController.save.POST.summary=儲存頁面草稿
PageEditorController.save.POST.description=從該頁面的 GET /api/page-editor/documents/{id} 取 draft，或從 /default 取初始文件。將編輯後的完整物件作為 document 傳送，保留 format、pageId、project 和必需區域。儲存另需當前 revision。
PageEditorController.save.POST.success=已儲存頁面草稿。
PageEditorController.publish.POST.summary=釋出頁面版本
PageEditorController.publish.POST.description=先對同一組草稿呼叫 prepare，釋出時用 restoring=false，恢復時用 true。確認後將返回的 revision、fingerprint 和同意的許可權放入 decision，並提交相同的 drafts；發生 409 後應重新讀取和準備。
PageEditorController.publish.POST.success=已釋出頁面版本。
PageEditorController.restore.POST.summary=還原頁面釋出版本
PageEditorController.restore.POST.description=先對同一組草稿呼叫 prepare，釋出時用 restoring=false，恢復時用 true。確認後將返回的 revision、fingerprint 和同意的許可權放入 decision，並提交相同的 drafts；發生 409 後應重新讀取和準備。
PageEditorController.restore.POST.success=已恢復頁面釋出版本。
PageEditorController.prepare.POST.summary=準備頁面釋出變更
PageEditorController.prepare.POST.description=傳入讀取到的 revision、布林值 restoring 和所選草稿的 page/revision 列表。響應列出影響、所需許可權及 fingerprint，供釋出或恢復前確認。
PageEditorController.prepare.POST.success=已準備頁面釋出變更。
PageEditorController.preview.POST.summary=預覽編輯後的頁面
PageEditorController.preview.POST.description=從該頁面的 GET /api/page-editor/documents/{id} 取 draft，或從 /default 取初始文件。將編輯後的完整物件作為 document 傳送，保留 format、pageId、project 和必需區域。儲存另需當前 revision。
PageEditorController.preview.POST.success=編輯後的頁面。
PageEditorController.migrate.POST.summary=轉換頁面文件格式
PageEditorController.migrate.POST.description=從 catalog 的元件宣告取 type 和當前 publication，提交舊 version 和 configuration。響應為遷移後的配置物件，可寫入草稿。
PageEditorController.migrate.POST.success=頁面文件格式。
PageEditorController.parseStyles.POST.summary=解析頁面樣式表
PageEditorController.parseStyles.POST.description=在 css 字串中提交 CSS 宣告，響應返回解析結果。支援的樣式屬性見 GET /api/page-editor/catalog 的 styleProperties。
PageEditorController.parseStyles.POST.success=頁面樣式表。
parameter.token=建立操作或訂閱時返回的令牌。
parameter.Origin=傳送請求的同源來源，必須與介面 URL 的協議、主機及埠一致。
