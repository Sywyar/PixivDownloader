title=ページ編集
ComponentLibraryController.catalog.GET.summary=ページコンポーネントの一覧
ComponentLibraryController.catalog.GET.description=id、enabled、最新公開版 latest を返します。下書きは id、公開したソースはバージョンを指定して読みます。
ComponentLibraryController.catalog.GET.success=ページコンポーネント。
ComponentLibraryController.read.GET.summary=コンポーネントの下書きを取得
ComponentLibraryController.read.GET.description=revision、draft、versions、latest を返します。編集した下書きはこの revision と一緒に保存します。
ComponentLibraryController.read.GET.success=コンポーネントの下書き。
ComponentLibraryController.version.GET.summary=指定バージョンのコンポーネントを取得
ComponentLibraryController.version.GET.description=コンポーネントの versions からバージョンを選び、その時点の公開ソースを取得します。
ComponentLibraryController.version.GET.success=指定バージョンのコンポーネント。
ComponentLibraryController.save.POST.summary=コンポーネントのソースを保存
ComponentLibraryController.save.POST.description=同一オリジンの Origin が必要です。新規は revision=0、編集は取得済みの revision です。source には文字列 name、html、css、javascript と properties オブジェクトを含めます。name は必須です。各プロパティは type（string、boolean、number）、label、同型の default を持ちます。
ComponentLibraryController.save.POST.success=コンポーネントのソースを保存しました。
ComponentLibraryController.publish.POST.summary=コンポーネントのバージョンを公開
ComponentLibraryController.publish.POST.description=同一オリジンの Origin と現在の revision を指定して保存済みの draft を公開します。latest は公開内容のダイジェストです。
ComponentLibraryController.publish.POST.success=コンポーネントのバージョンを公開しました。
ComponentLibraryController.availability.POST.summary=コンポーネントの有効化設定を設定
ComponentLibraryController.availability.POST.description=同一オリジンの Origin、現在の revision と真偽値 enabled で有効状態を変更し、更新後の状態を返します。
ComponentLibraryController.availability.POST.success=コンポーネントの有効化設定を保存しました。
ComponentLibraryController.preview.POST.summary=コンポーネントをプレビュー
ComponentLibraryController.preview.POST.description=保存時と同じ source と同一オリジンの Origin を送信します。プレビューの url と終了用 token を返します。
ComponentLibraryController.preview.POST.success=コンポーネント。
ComponentLibraryController.close.POST.summary=コンポーネントのプレビューを終了
ComponentLibraryController.close.POST.description=プレビューの token、同一オリジンの Origin と空の JSON オブジェクト {} で解放します。true を返します。
ComponentLibraryController.close.POST.success=コンポーネントのプレビューを終了しました。
PageEditorController.catalog.GET.summary=編集可能なページとコンポーネントの一覧
PageEditorController.catalog.GET.description=編集可能な pages、有効な components、styleProperties、componentCategories、customComponents を返します。ここにあるページ ID、型、公開情報で文書を作成します。
PageEditorController.catalog.GET.success=編集可能なページとコンポーネント。
PageEditorController.read.GET.summary=ページ文書を取得
PageEditorController.read.GET.description=revision と draft、および存在する場合は published と previous を返します。保存にはこの revision を使います。
PageEditorController.read.GET.success=ページ文書。
PageEditorController.defaults.GET.summary=ページの既定文書を取得
PageEditorController.defaults.GET.description=必須領域を含むページの初期文書を返します。編集やプレビューの出発点に使えます。
PageEditorController.defaults.GET.success=ページの既定文書。
PageEditorController.save.POST.summary=ページの下書きを保存
PageEditorController.save.POST.description=GET /api/page-editor/documents/{id} の draft または /default の初期文書を使います。format、pageId、project と必須領域を保ち、編集後の全体を document として送ります。保存には現在の revision も必要です。
PageEditorController.save.POST.success=ページの下書きを保存しました。
PageEditorController.publish.POST.summary=ページのリビジョンを公開
PageEditorController.publish.POST.description=同じ drafts で prepare し、公開は restoring=false、復元は true を指定します。revision、fingerprint、権限を確認して decision に approvals を含め、同じ drafts を送ります。409の場合は読み直して再度 prepare してください。
PageEditorController.publish.POST.success=ページのリビジョンを公開しました。
PageEditorController.restore.POST.summary=ページの公開版を復元
PageEditorController.restore.POST.description=同じ drafts で prepare し、公開は restoring=false、復元は true を指定します。revision、fingerprint、権限を確認して decision に approvals を含め、同じ drafts を送ります。409の場合は読み直して再度 prepare してください。
PageEditorController.restore.POST.success=ページの公開版を復元しました。
PageEditorController.prepare.POST.summary=ページの公開変更を準備
PageEditorController.prepare.POST.description=現在の revision、真偽値 restoring、選択した下書きの page/revision を送ります。公開・復元前の確認用に影響、権限、fingerprint を返します。
PageEditorController.prepare.POST.success=ページの公開変更を準備しました。
PageEditorController.preview.POST.summary=編集中のページをプレビュー
PageEditorController.preview.POST.description=GET /api/page-editor/documents/{id} の draft または /default の初期文書を使います。format、pageId、project と必須領域を保ち、編集後の全体を document として送ります。保存には現在の revision も必要です。
PageEditorController.preview.POST.success=編集中のページ。
PageEditorController.migrate.POST.summary=ページ文書の形式を変換
PageEditorController.migrate.POST.description=catalog の型と現在の publication に旧 version と configuration を渡し、下書き用の移行済み設定を取得します。
PageEditorController.migrate.POST.success=ページ文書の形式。
PageEditorController.parseStyles.POST.summary=ページのスタイルシートを解析
PageEditorController.parseStyles.POST.description=css 文字列に CSS 宣言を入れて解析します。対応プロパティは GET /api/page-editor/catalog の styleProperties にあります。
PageEditorController.parseStyles.POST.success=ページのスタイルシート。
parameter.token=操作または購読の作成時に返されたトークン。
parameter.Origin=エンドポイント URL とスキーム、ホスト、ポートが一致する Origin。
