title=Page editor
ComponentLibraryController.catalog.GET.summary=List page components
ComponentLibraryController.catalog.GET.description=Lists components with their id, enabled flag and latest published version. Read the draft by id or a published source by version.
ComponentLibraryController.catalog.GET.success=Page components.
ComponentLibraryController.read.GET.summary=Get a component draft
ComponentLibraryController.read.GET.description=Returns revision, draft, versions and latest. Submit the edited draft with this revision to save it.
ComponentLibraryController.read.GET.success=Component draft.
ComponentLibraryController.version.GET.summary=Get a component version
ComponentLibraryController.version.GET.description=Use a version from the component’s versions list to read that immutable published source.
ComponentLibraryController.version.GET.success=Component version.
ComponentLibraryController.save.POST.summary=Save component source
ComponentLibraryController.save.POST.description=A same-origin Origin header is required. Use revision=0 to create or the current revision to edit. source requires strings name, html, css, javascript and an object properties. name must be nonblank. Each property has type (string, boolean or number), label and a matching default.
ComponentLibraryController.save.POST.success=Component source saved.
ComponentLibraryController.publish.POST.summary=Publish a component version
ComponentLibraryController.publish.POST.description=Send a same-origin Origin header and the current revision to publish the saved draft. latest is the published content digest.
ComponentLibraryController.publish.POST.success=Component version published.
ComponentLibraryController.availability.POST.summary=Set component availability
ComponentLibraryController.availability.POST.description=Send a same-origin Origin header, the current revision and a boolean enabled flag. Returns the updated component state.
ComponentLibraryController.availability.POST.success=Component availability saved.
ComponentLibraryController.preview.POST.summary=Preview a component
ComponentLibraryController.preview.POST.description=Send the same source object as for save and a same-origin Origin header. The response contains a preview url and a token for closing it.
ComponentLibraryController.preview.POST.success=Component.
ComponentLibraryController.close.POST.summary=Close a component preview
ComponentLibraryController.close.POST.description=Release the preview with its token, a same-origin Origin header and an empty JSON object {}. Returns true.
ComponentLibraryController.close.POST.success=Component preview closed.
PageEditorController.catalog.GET.summary=List editable pages and components
PageEditorController.catalog.GET.description=Lists editable pages, active components, styleProperties, componentCategories and customComponents. Use these page IDs, component types and publications to construct a document.
PageEditorController.catalog.GET.success=Editable pages and components.
PageEditorController.read.GET.summary=Get a page document
PageEditorController.read.GET.description=Returns revision and draft, plus published and previous when available. Use the returned revision when saving.
PageEditorController.read.GET.success=Page document.
PageEditorController.defaults.GET.summary=Get the default page document
PageEditorController.defaults.GET.description=Returns the page’s initial document including its required regions. Use it as the starting point for edits or previews.
PageEditorController.defaults.GET.success=Default page document.
PageEditorController.save.POST.summary=Save a page draft
PageEditorController.save.POST.description=Get draft from GET /api/page-editor/documents/{id}, or start with /default. Send the entire edited object as document, retaining its format, pageId, project and required regions. Saving also requires the current revision.
PageEditorController.save.POST.success=Page draft saved.
PageEditorController.publish.POST.summary=Publish a page revision
PageEditorController.publish.POST.description=Prepare the same drafts first, using restoring=false to publish or true to restore. Confirm the returned revision, fingerprint and permissions, then send the decision with its approvals and the same drafts. After 409, read and prepare again.
PageEditorController.publish.POST.success=Page revision published.
PageEditorController.restore.POST.summary=Restore a page publication
PageEditorController.restore.POST.description=Prepare the same drafts first, using restoring=false to publish or true to restore. Confirm the returned revision, fingerprint and permissions, then send the decision with its approvals and the same drafts. After 409, read and prepare again.
PageEditorController.restore.POST.success=Page publication restored.
PageEditorController.prepare.POST.summary=Prepare a page publication
PageEditorController.prepare.POST.description=Supply the current revision, a restoring boolean and the page/revision pairs for selected drafts. The result lists impacts, permissions and a fingerprint to review before publishing or restoring.
PageEditorController.prepare.POST.success=Page publication prepared.
PageEditorController.preview.POST.summary=Preview an edited page
PageEditorController.preview.POST.description=Get draft from GET /api/page-editor/documents/{id}, or start with /default. Send the entire edited object as document, retaining its format, pageId, project and required regions. Saving also requires the current revision.
PageEditorController.preview.POST.success=Edited page.
PageEditorController.migrate.POST.summary=Convert a page document
PageEditorController.migrate.POST.description=Use the component type and current publication from catalog and submit the old version and configuration. Returns the migrated configuration for the draft.
PageEditorController.migrate.POST.success=Page document.
PageEditorController.parseStyles.POST.summary=Parse a style sheet
PageEditorController.parseStyles.POST.description=Send CSS declarations in the css string. Look up supported style properties in styleProperties from GET /api/page-editor/catalog.
PageEditorController.parseStyles.POST.success=Style sheet.
parameter.token=Token returned when this operation or subscription was created.
parameter.Origin=Same-origin request origin, matching the scheme, host and port of the endpoint URL.
