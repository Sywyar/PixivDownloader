gui.config.field.download.novel-directory-template.label=Novel directory template
gui.config.field.download.novel-directory-template.help=The final directory template for novels; no folders are appended. Initial setup preserves the previous root and novel-ID layout. The work ID variable remains numeric; novel- can be a fixed prefix. Restart the service after changes. Directory templates support series_id. Missing collection_name, collection_id, series_id and R18 values expand to empty strings. Empty directory segments are omitted; fixed text in the same segment is retained.
gui.config.field.download.novel-mode-templates.single-import.label=Novel Single work directory template
gui.config.field.download.novel-mode-templates.single-import.help=Leave blank to use the novel directory template. A nonempty value replaces the entire directory. Missing required values or invalid templates stop the download. Restart the service after changes.
