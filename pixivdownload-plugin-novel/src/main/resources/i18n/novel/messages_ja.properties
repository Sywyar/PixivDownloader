gui.config.field.download.novel-directory-template.label=小説の保存先テンプレート
gui.config.field.download.novel-directory-template.help=小説専用の最終保存先テンプレートです。フォルダーは自動追加しません。初期設定では従来のルートと novel-ID の構成を維持します。作品 ID 変数は数値のままです。novel- を固定文字として追加できます。変更後はサービスを再起動してください。 保存先では series_idを使用できます。collection_name、collection_id、series_id、R18 の値がない場合は空文字列に展開します。展開後に空になるパス要素は省略し、同じ要素内の固定文字は保持します。
gui.config.field.download.novel-mode-templates.single-import.label=小説・単一作品 モードの保存先テンプレート
gui.config.field.download.novel-mode-templates.single-import.help=空欄の場合は小説の保存先テンプレートを使用します。入力すると保存先全体を置き換えます。必須変数の値がない場合やテンプレートが無効な場合はダウンロードを停止します。変更後はサービスを再起動してください。
