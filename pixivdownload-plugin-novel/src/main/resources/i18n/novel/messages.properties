gui.config.field.download.novel-directory-template.label=小说作品目录模板
gui.config.field.download.novel-directory-template.help=小说独立的最终目录模板，展开后不再追加目录。首次初始化保留旧根与 novel-ID 布局。作品 ID 变量仍是纯数字，可用 novel- 作为固定前缀。更改后重启服务。 目录支持 series_id；collection_name、collection_id、series_id、R18 缺值时按空字符串展开；展开后为空的目录层会省略，同层固定文字保留。
