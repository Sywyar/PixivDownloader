title=小説の朗読
NarrationController.availability.GET.summary=朗読機能の利用状況を取得
NarrationController.availability.GET.description=音声エンジンの利用可否、デバッグモード、台本解析用テキストモデルの設定有無を返します。
NarrationController.availability.GET.success=朗読機能の利用状況。
NarrationController.narratorPresets.GET.summary=ナレーターの音声プリセットの一覧
NarrationController.narratorPresets.GET.description=台本作成時に選べるナレーターのプリセット id と音声指示 instruction を返します。
NarrationController.narratorPresets.GET.success=ナレーターの音声プリセット。
NarrationController.script.POST.summary=章の読み上げ台本を生成
NarrationController.script.POST.description=novelId と lang の台本を行単位で取得します。force=true で再解析します。analyzeIfMissing=false でキャッシュがなければ 204 です。解析には AI が必要です。
NarrationController.script.POST.success=章の読み上げ台本。
NarrationController.cast.GET.summary=使用中のキャストを取得
NarrationController.cast.GET.description=ローカル novelId の既定キャストと音声を取得します。小説がなければ 404、名簿が未作成なら castId=null と既定ナレーターを返します。
NarrationController.cast.GET.success=使用中のキャスト。
NarrationController.listCasts.GET.summary=キャスト一覧の一覧
NarrationController.listCasts.GET.description=保存済みキャストの ID、名前、関連作品、音声数を返します。id で配役の詳細を取得できます。
NarrationController.listCasts.GET.success=キャスト一覧。
NarrationController.createCast.POST.summary=キャストを作成
NarrationController.createCast.POST.description=seriesId または novelId に関連付けます。両方省略で独立した記録を作成します。同じ関連付けの記録は再利用します。
NarrationController.createCast.POST.success=キャストを作成しました。
NarrationController.novelDefaultCast.GET.summary=小説の既定キャストを取得
NarrationController.novelDefaultCast.GET.description=小説の既定キャストを取得します。未作成なら castId は null で、作成時の名前候補を返します。
NarrationController.novelDefaultCast.GET.success=小説の既定キャスト。
NarrationController.castVoices.GET.summary=登場人物の音声の一覧
NarrationController.castVoices.GET.description=キャスト id から各キャラクターの音声指示と参照音声の状態を取得します。名簿がなければ 404 です。
NarrationController.castVoices.GET.success=登場人物の音声。
NarrationController.updateVoice.PUT.summary=登場人物の音声を更新
NarrationController.updateVoice.PUT.description=characterId に空でない controlInstruction を保存します。正の castId が優先で、それ以外は novelId の既定名簿を取得または作成します。成功は本文なしの HTTP 200 です。
NarrationController.updateVoice.PUT.success=登場人物の音声を更新しました。
NarrationReferenceVoiceController.generate.POST.summary=登場人物の参照音声を生成
NarrationReferenceVoiceController.generate.POST.description=castId と characterId の参照音声を生成します。text を省略すると既定の台詞を使用し、サンプルが短すぎる場合は 422 です。
NarrationReferenceVoiceController.generate.POST.success=登場人物の参照音声。
NarrationReferenceVoiceController.upload.POST.summary=参照用の録音をアップロード
NarrationReferenceVoiceController.upload.POST.description=multipart/form-data で castId、characterId と WAV または MP3 の音声 file を送信します。ファイルの上限は 8 MiB で内容と形式が一致する必要があります。refText に文字起こしを指定できます。 音声は最大 60 秒、モノラルまたはステレオ、8～96 kHz です。WAV は 8、16、24、32 ビット PCM に対応します。
NarrationReferenceVoiceController.upload.POST.success=参照用の録音をアップロードしました。
NarrationReferenceVoiceController.delete.DELETE.summary=登場人物の参照用録音を削除
NarrationReferenceVoiceController.delete.DELETE.description=指定キャストのキャラクターの参照録音を削除します。成功は本文なしの HTTP 200 です。
NarrationReferenceVoiceController.delete.DELETE.success=登場人物の参照用録音を削除しました。
NarrationReferenceVoiceController.preview.GET.summary=保存済みの参照音声を取得
NarrationReferenceVoiceController.preview.GET.description=castId と characterId の保存済み参照音声を取得します。録音がなければ 404 です。
NarrationReferenceVoiceController.preview.GET.success=保存済みの参照音声。
NarrationTtsController.line.POST.summary=台詞一行分の音声を生成
NarrationTtsController.line.POST.description=ローカル novelId、lang、0 始まりの lineIndex で台本の 1 行を合成し、音声バイト列を返します。
NarrationTtsController.line.POST.success=台詞一行分の音声。
NarrationTtsController.preview.POST.summary=ボイスの試聴音声を生成
NarrationTtsController.preview.POST.description=最大 4000 文字のテキストで音声を試聴します。形式は成功応答の Content-Type で確認できます。
NarrationTtsController.preview.POST.success=ボイスの試聴音声。
