NarrationReferenceVoiceController.upload.POST.body=file パートに参照用の音声を添付します。 cURL の例では、`INSTANCE` にインスタンスのオリジン（スキーム、ホスト、ポート。末尾のスラッシュは省略）、`PROGRAM_KEY` にこの操作を許可するキーを設定します。 `GET /api/narration/casts` で `CAST_ID` を取得し、`GET /api/narration/casts/{id}/voices` の `voices[].id` を `CHARACTER_ID` に設定します。`reference.wav` はアップロードする録音に置き換えます。任意の `refText` には録音の書き起こしを指定できます。
