title=Novel narration
NarrationController.availability.GET.summary=Get narration availability
NarrationController.availability.GET.description=Read audio engine availability, debug mode and whether a text model is configured for script analysis.
NarrationController.availability.GET.success=Narration availability.
NarrationController.narratorPresets.GET.summary=List narrator voice presets
NarrationController.narratorPresets.GET.description=List narrator presets with their id and voice instruction for selecting a narrator during script generation.
NarrationController.narratorPresets.GET.success=Narrator voice presets.
NarrationController.script.POST.summary=Generate a chapter narration script
NarrationController.script.POST.description=Read the line-by-line script for novelId and lang. Cached scripts are reused unless force=true. With analyzeIfMissing=false a cache miss returns 204. Analysis requires an available AI service.
NarrationController.script.POST.success=Chapter narration script.
NarrationController.cast.GET.summary=Get the active cast
NarrationController.cast.GET.description=Resolve the default cast and voices for a local novelId. A missing novel returns 404. Before a cast is created, castId is null and a default narrator is supplied.
NarrationController.cast.GET.success=Active cast.
NarrationController.listCasts.GET.summary=List casts
NarrationController.listCasts.GET.description=List saved cast IDs, names, bindings and voice counts. Use id to read the characters in a cast.
NarrationController.listCasts.GET.success=Casts.
NarrationController.createCast.POST.summary=Create a cast
NarrationController.createCast.POST.description=Bind to a local seriesId or novelId, or omit both to create an independent record. An existing record with the same binding is reused.
NarrationController.createCast.POST.success=Cast created.
NarrationController.novelDefaultCast.GET.summary=Get a novel's default cast
NarrationController.novelDefaultCast.GET.description=Read the novel’s default cast binding. Before creation, castId is null and name suggests a name for the new cast.
NarrationController.novelDefaultCast.GET.success=Novel's default cast.
NarrationController.castVoices.GET.summary=List character voices
NarrationController.castVoices.GET.description=Read characters, voice instructions and reference audio status by cast id. A missing cast returns 404.
NarrationController.castVoices.GET.success=Character voices.
NarrationController.updateVoice.PUT.summary=Update a character voice
NarrationController.updateVoice.PUT.description=Save a nonblank controlInstruction for characterId. Supply a positive castId, or use novelId to resolve or create its default cast. Success returns HTTP 200 with no body.
NarrationController.updateVoice.PUT.success=Character voice updated.
NarrationReferenceVoiceController.generate.POST.summary=Generate a character reference voice
NarrationReferenceVoiceController.generate.POST.description=Generate reference audio for castId and characterId. Blank text uses the built-in seed phrase. A sample too short for use returns 422.
NarrationReferenceVoiceController.generate.POST.success=Character reference voice.
NarrationReferenceVoiceController.upload.POST.summary=Upload a reference recording
NarrationReferenceVoiceController.upload.POST.description=Upload castId, characterId and a nonempty WAV or MP3 audio file as multipart/form-data. The 8 MiB maximum applies to the file, and its contents must match its declared format. Supply an optional transcript in refText. Audio must be at most 60 seconds, mono or stereo, at 8–96 kHz. WAV accepts 8-, 16-, 24- or 32-bit PCM.
NarrationReferenceVoiceController.upload.POST.success=Reference recording uploaded.
NarrationReferenceVoiceController.delete.DELETE.summary=Delete a reference recording
NarrationReferenceVoiceController.delete.DELETE.description=Remove the saved reference recording for this cast and character. Success returns HTTP 200 with no body.
NarrationReferenceVoiceController.delete.DELETE.success=Reference recording removed.
NarrationReferenceVoiceController.preview.GET.summary=Get a saved reference recording
NarrationReferenceVoiceController.preview.GET.description=Read saved reference audio bytes for castId and characterId. An absent recording returns 404.
NarrationReferenceVoiceController.preview.GET.success=Saved reference recording.
NarrationTtsController.line.POST.summary=Generate a spoken script line
NarrationTtsController.line.POST.description=Synthesize one analyzed script line using local novelId, lang and a zero-based lineIndex. The response body contains audio bytes.
NarrationTtsController.line.POST.success=Spoken script line.
NarrationTtsController.preview.POST.summary=Generate a voice preview
NarrationTtsController.preview.POST.description=Preview the voice using the supplied text, up to 4000 characters. Read the audio format from the success response Content-Type.
NarrationTtsController.preview.POST.success=Voice preview.
parameter.castId=Identifier of the cast containing the character.
