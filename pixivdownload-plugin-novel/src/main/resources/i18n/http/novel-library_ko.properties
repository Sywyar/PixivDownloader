title=소설 라이브러리
NovelExportController.download.GET.summary=소설 EPUB 파일 다운로드
NovelExportController.download.GET.description=로컬 소설 한 편을 EPUB 첨부로 받습니다. 원문은 variant를 생략하고 번역본은 사용 가능한 버전을 지정합니다. 64 MiB를 넘으면 413입니다.
NovelExportController.download.GET.success=소설 EPUB 파일.
NovelGalleryController.listNovels.GET.summary=저장된 소설 페이지 조회
NovelGalleryController.listNovels.GET.description=호출자에게 보이는 로컬 자료를 page=0부터 조회합니다. ID 목록은 쉼표로 구분하고 tagIds, notTagIds, orTagIds로 태그 조건을 조합합니다. 각 ID는 양의 정수여야 합니다. 빈 항목이나 잘못된 ID가 하나라도 있으면 요청 전체에 400을 반환합니다.
NovelGalleryController.listNovels.GET.success=저장된 소설.
NovelGalleryController.listAuthors.GET.summary=소설 작가 목록 조회
NovelGalleryController.listAuthors.GET.description=보이는 로컬 소설의 작가를 검색합니다. page는 0부터 시작하고 size는 기본 24이며 기본 정렬은 name입니다.
NovelGalleryController.listAuthors.GET.success=소설 작가.
NovelGalleryController.listNovelSeries.GET.summary=저장된 소설 시리즈 목록 조회
NovelGalleryController.listNovelSeries.GET.description=로컬 소설 시리즈를 검색합니다. page는 0부터 시작하고 size는 기본 24이며 기본 정렬은 title입니다.
NovelGalleryController.listNovelSeries.GET.success=저장된 소설 시리즈.
NovelGalleryController.listNovelTags.GET.summary=소설 태그 목록 조회
NovelGalleryController.listNovelTags.GET.description=search로 로컬 태그를 검색하고 limit으로 결과 개수를 정합니다. 반환된 태그 ID를 작품 목록 필터에 사용할 수 있습니다.
NovelGalleryController.listNovelTags.GET.success=소설 태그.
NovelGalleryController.findNovel.GET.summary=소설 세부 정보 조회
NovelGalleryController.findNovel.GET.description=호출자에게 보이는 로컬 작품의 세부 정보를 Pixiv ID로 조회합니다.
NovelGalleryController.findNovel.GET.success=소설 세부 정보.
NovelGalleryController.deleteNovel.DELETE.summary=저장한 소설 삭제
NovelGalleryController.deleteNovel.DELETE.description=로컬 작품 한 건을 삭제합니다. 성공 시 deleted=1, 작품이 없으면 404입니다.
NovelGalleryController.deleteNovel.DELETE.success=저장한 소설을 제거했습니다.
NovelGalleryController.deleteNovels.POST.summary=선택한 소설 삭제
NovelGalleryController.deleteNovels.POST.description=ids 또는 필터로 선택한 로컬 작품을 삭제합니다. 최종 선택에서 excludeIds를 제외하고 실제 삭제 건수를 반환합니다. 빈 필터는 이 라이브러리의 모든 활성 작품을 선택합니다. 페이지와 정렬은 일괄 선택 범위를 제한하지 않습니다. 정규화한 필터에 조건이 없으면 삭제하려면 confirmAll=true를 지정해야 합니다.
NovelGalleryController.deleteNovels.POST.success=선택한 소설을 제거했습니다.
NovelGalleryController.collectNovels.POST.summary=컬렉션에 선택한 소설 추가
NovelGalleryController.collectNovels.POST.description=선택한 작품을 지정한 로컬 컬렉션에 추가합니다. count는 선택 건수, changed는 실제 변경 건수입니다. 빈 필터는 이 라이브러리의 모든 활성 작품을 선택합니다. 페이지와 정렬은 일괄 선택 범위를 제한하지 않습니다.
NovelGalleryController.collectNovels.POST.success=컬렉션에 선택한 소설을 추가했습니다.
NovelGalleryController.exportOptions.POST.summary=소설 내보내기 옵션 목록 조회
NovelGalleryController.exportOptions.POST.description=선택한 모든 소설에서 사용할 수 있는 번역 버전을 반환합니다. 같은 선택을 내보낼 때 variants의 값을 전달합니다. 빈 필터는 이 라이브러리의 모든 활성 작품을 선택합니다. 페이지와 정렬은 일괄 선택 범위를 제한하지 않습니다.
NovelGalleryController.exportOptions.POST.success=소설 내보내기 옵션.
NovelGalleryController.exportNovels.POST.summary=선택한 소설 내보내기
NovelGalleryController.exportNovels.POST.description=선택한 ID 또는 필터에서 excludeIds를 빼고 아카이브를 생성합니다. 성공하면 archiveToken, 유효 시간(초), 개수를 반환하며 파일이 없으면 204입니다. 빈 필터는 이 라이브러리의 모든 활성 작품을 선택합니다. 페이지와 정렬은 일괄 선택 범위를 제한하지 않습니다. 정규화한 필터에 조건이 없으면 삭제하려면 confirmAll=true를 지정해야 합니다. 내보낸 후 삭제하려면 프로그램 키에 novel:library.delete 권한도 필요합니다. 삭제 없이 내보내면 다른 작품의 읽기 전용 파일과 현재 관리 디렉터리는 제외됩니다.
NovelGalleryController.exportNovels.POST.success=선택한 소설.
NovelGalleryController.bySeries.GET.summary=같은 시리즈 소설 목록 조회
NovelGalleryController.bySeries.GET.description=작품 ID로 시리즈를 찾아 볼 수 있는 로컬 작품을 반환합니다. limit 기본값은 30입니다.
NovelGalleryController.bySeries.GET.success=같은 시리즈 소설.
NovelGalleryController.seriesNav.GET.summary=소설 시리즈 탐색 정보 조회
NovelGalleryController.seriesNav.GET.description=작품 ID를 기준으로 시리즈 내 위치와 접근 가능한 이전·다음 작품을 반환합니다. 시리즈나 인접 항목이 없으면 해당 값은 null일 수 있습니다.
NovelGalleryController.seriesNav.GET.success=소설 시리즈 탐색 정보.
NovelGalleryController.getNovelCover.GET.summary=소설 표지 조회
NovelGalleryController.getNovelCover.GET.description=응답 Content-Type에 맞게 로컬 표지 이미지 바이트를 읽습니다. 표지 파일이 없으면 404입니다.
NovelGalleryController.getNovelCover.GET.success=소설 표지.
NovelGalleryController.getNovelContent.GET.summary=소설 본문 조회
NovelGalleryController.getNovelContent.GET.description=로컬 원문과 lang 또는 variant로 선택한 기존 번역을 조회합니다. 부분 번역인 경우 제목, 설명, 본문 번역이 각각 없을 수 있습니다.
NovelGalleryController.getNovelContent.GET.success=소설 본문.
NovelGalleryController.translatedTitles.GET.summary=번역된 소설 제목 조회
NovelGalleryController.translatedTitles.GET.description=쉼표로 구분한 ids의 번역 제목을 소설 ID 기준으로 반환합니다. 보이지 않거나 번역 제목이 없는 작품은 생략합니다. 각 ID는 양의 정수여야 합니다. 빈 항목이나 잘못된 ID가 하나라도 있으면 요청 전체에 400을 반환합니다.
NovelGalleryController.translatedTitles.GET.success=번역된 소설 제목.
NovelGalleryController.getNovelEmbeddedImage.GET.summary=소설 삽화 조회
NovelGalleryController.getNovelEmbeddedImage.GET.description=소설 ID와 본문의 imageId로 다운로드된 삽화를 가져옵니다. imageId는 영문·숫자·밑줄·하이픈 1~40자이며 이미지가 없으면 404입니다.
NovelGalleryController.getNovelEmbeddedImage.GET.success=소설 삽화.
NovelGalleryController.getSeries.GET.summary=소설 시리즈 세부 정보 조회
NovelGalleryController.getSeries.GET.description=로컬 소설 시리즈 메타데이터를 조회합니다. lang 또는 variant로 기존 시리즈 제목과 설명 번역을 조회합니다.
NovelGalleryController.getSeries.GET.success=소설 시리즈 세부 정보.
NovelGalleryController.getSeriesCover.GET.summary=소설 시리즈 표지 조회
NovelGalleryController.getSeriesCover.GET.description=응답 Content-Type에 맞게 로컬 표지 이미지 바이트를 읽습니다. 표지 파일이 없으면 404입니다.
NovelGalleryController.getSeriesCover.GET.success=소설 시리즈 표지.
NovelGalleryController.downloadedBatch.POST.summary=여러 소설의 다운로드 상태 조회
NovelGalleryController.downloadedBatch.POST.description=novelIds 중 로컬 다운로드를 완료한 항목을 조회합니다. includeDeleted=true이고 권한이 허용하면 삭제된 ID도 따로 반환합니다.
NovelGalleryController.downloadedBatch.POST.success=여러 소설의 다운로드 상태.
