schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.title=대상 작품 선택
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.excludeIds=최종 선택에서 제외할 작품 ID.
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.collectionId=일괄 추가할 때는 대상 컬렉션의 ID를 양의 JSON 정수로 지정해야 합니다. GET /api/collections에서 ID를 확인할 수 있습니다.
