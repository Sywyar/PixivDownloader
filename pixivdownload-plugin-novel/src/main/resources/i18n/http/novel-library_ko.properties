NovelGalleryController.collectNovels.POST.body=대상 작품 선택
schema.top.sywyar.pixivdownload.novelgallery.NovelTagOption.description=소설 라이브러리 필터에 사용할 태그입니다.
schema.top.sywyar.pixivdownload.novelgallery.NovelSeriesSummary.description=소설 라이브러리의 시리즈 항목입니다.
schema.top.sywyar.pixivdownload.novelgallery.NovelAuthorSummary.description=소설 라이브러리의 작가 항목입니다.
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.mode=mode를 생략하거나 ids로 지정하면 ids에 나열한 작품을 선택합니다. filter 모드에는 filter 객체가 필요합니다. 두 모드 모두 excludeIds에 있는 작품을 제외합니다.
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.filter=filter 모드의 선택 조건입니다. 빈 객체 {}는 모든 작품을 선택합니다. 전체 작품을 삭제하거나 내보낸 뒤 원본을 삭제하려면 confirmAll이 필요합니다. 필터 및 제외 목록의 ID는 양의 JSON 정수여야 합니다.
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.ids=직접 선택할 작품 ID 배열입니다. 모든 항목은 양의 JSON 정수여야 합니다. 중복 ID에 해당하는 작품은 한 번만 선택합니다.
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.format=내보낼 압축 형식. 기본값 zip.
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.groupBy=id이면 작품 ID별 폴더로 내보냅니다. 생략하면 작가·작품별로 나눕니다.
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.deleteAfter=원본 압축 파일이 준비된 뒤 선택한 로컬 작품을 삭제합니다. 보존하려면 false 또는 생략합니다.
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.variant=원문은 생략하거나 비워 둡니다. 번역본은 같은 선택의 export/options에서 고르고 deleteAfter=false로 설정합니다.
