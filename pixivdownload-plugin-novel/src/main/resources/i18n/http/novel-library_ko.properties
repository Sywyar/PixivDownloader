schema.top.sywyar.pixivdownload.novelgallery.controller.NovelGalleryController.NovelDownloadedBatchRequest.field.novelIds=처리할 Pixiv 소설 ID 목록입니다.
schema.top.sywyar.pixivdownload.novelgallery.controller.NovelGalleryController.NovelDownloadedBatchRequest.field.includeDeleted=삭제된 것으로 표시된 작품을 포함합니다.
