title=Novel library
NovelExportController.download.GET.summary=Download a novel as EPUB
NovelExportController.download.GET.description=Download one local novel as an EPUB attachment. Omit variant for the original or supply an available translation variant. Exports over 64 MiB return 413.
NovelExportController.download.GET.success=Novel as EPUB.
NovelGalleryController.listNovels.GET.summary=Browse saved novels
NovelGalleryController.listNovels.GET.description=Page through the caller’s visible local library starting with page=0. Supply ID lists as comma-separated values. Combine tagIds, notTagIds and orTagIds to filter by tags. Each ID must be a positive integer. An empty entry or invalid ID rejects the entire request with 400.
NovelGalleryController.listNovels.GET.success=Saved novels.
NovelGalleryController.listAuthors.GET.summary=List novel authors
NovelGalleryController.listAuthors.GET.description=Search authors of visible local novels. Pages start at zero, size defaults to 24 and the default sort is name.
NovelGalleryController.listAuthors.GET.success=Novel authors.
NovelGalleryController.listNovelSeries.GET.summary=List saved novel series
NovelGalleryController.listNovelSeries.GET.description=Search local novel series. Pages start at zero, size defaults to 24 and the default sort is title.
NovelGalleryController.listNovelSeries.GET.success=Saved novel series.
NovelGalleryController.listNovelTags.GET.summary=List novel tags
NovelGalleryController.listNovelTags.GET.description=Search local tags with search and limit the number of matches with limit. Use the returned tag IDs to filter the work list.
NovelGalleryController.listNovelTags.GET.success=Novel tags.
NovelGalleryController.findNovel.GET.summary=Get novel details
NovelGalleryController.findNovel.GET.description=Read locally stored work details by Pixiv ID within the caller’s visible library.
NovelGalleryController.findNovel.GET.success=Novel details.
NovelGalleryController.deleteNovel.DELETE.summary=Delete a saved novel
NovelGalleryController.deleteNovel.DELETE.description=Delete one local work. Success returns deleted=1 and an absent work returns 404.
NovelGalleryController.deleteNovel.DELETE.success=Saved novel removed.
NovelGalleryController.deleteNovels.POST.summary=Delete selected novels
NovelGalleryController.deleteNovels.POST.description=Delete local works selected by ids or filter. excludeIds removes works from the final selection. The response reports the number deleted. An empty filter selects every active work in this library. Pagination and sorting do not narrow a batch selection. If the normalized filter has no selection criteria, deletion requires confirmAll=true.
NovelGalleryController.deleteNovels.POST.success=Selected novels removed.
NovelGalleryController.collectNovels.POST.summary=Add selected novels to a collection
NovelGalleryController.collectNovels.POST.description=Add selected works to the specified local collection. count is the selection size and changed is the number of changes applied. An empty filter selects every active work in this library. Pagination and sorting do not narrow a batch selection.
NovelGalleryController.collectNovels.POST.success=Selected novels to a collection added.
NovelGalleryController.exportOptions.POST.summary=List novel export options
NovelGalleryController.exportOptions.POST.description=Return translation variants available for every selected novel. Use a value from variants when exporting the same selection. An empty filter selects every active work in this library. Pagination and sorting do not narrow a batch selection.
NovelGalleryController.exportOptions.POST.success=Novel export options.
NovelGalleryController.exportNovels.POST.summary=Export selected novels
NovelGalleryController.exportNovels.POST.description=Create an archive from selected IDs or a filter, excluding excludeIds. Success returns archiveToken, its lifetime in seconds and counts. An empty archive selection returns 204. An empty filter selects every active work in this library. Pagination and sorting do not narrow a batch selection. If the normalized filter has no selection criteria, deletion requires confirmAll=true. A program key also needs novel:library.delete to delete after export.
NovelGalleryController.exportNovels.POST.success=Selected novels.
NovelGalleryController.bySeries.GET.summary=List novels in the same series
NovelGalleryController.bySeries.GET.description=Look up the series of the supplied work and list its visible local members. limit defaults to 30.
NovelGalleryController.bySeries.GET.success=Novels in the same series.
NovelGalleryController.seriesNav.GET.summary=Get novel series navigation
NovelGalleryController.seriesNav.GET.description=Return series position and the previous and next visible works for this work ID. Series and neighbor fields may be null when unavailable.
NovelGalleryController.seriesNav.GET.success=Novel series navigation.
NovelGalleryController.getNovelCover.GET.summary=Get a novel cover
NovelGalleryController.getNovelCover.GET.description=Read the local cover image bytes using the response Content-Type. A missing cover file returns 404.
NovelGalleryController.getNovelCover.GET.success=Novel cover.
NovelGalleryController.getNovelContent.GET.summary=Get novel text
NovelGalleryController.getNovelContent.GET.description=Read the local original and an available translation selected by lang or variant. Translated title, description and body may each be absent if only some parts were translated.
NovelGalleryController.getNovelContent.GET.success=Novel text.
NovelGalleryController.translatedTitles.GET.summary=Look up translated novel titles
NovelGalleryController.translatedTitles.GET.description=Look up translated titles for comma-separated novel ids. The map is keyed by novel ID and skips invisible works and titles without a translation. Each ID must be a positive integer. An empty entry or invalid ID rejects the entire request with 400.
NovelGalleryController.translatedTitles.GET.success=Translated novel titles.
NovelGalleryController.getNovelEmbeddedImage.GET.summary=Get an embedded novel image
NovelGalleryController.getNovelEmbeddedImage.GET.description=Read a downloaded embedded image by novel ID and the imageId from its text. imageId accepts 1–40 ASCII letters, digits, underscores or hyphens. Missing images return 404.
NovelGalleryController.getNovelEmbeddedImage.GET.success=Embedded novel image.
NovelGalleryController.getSeries.GET.summary=Get novel series details
NovelGalleryController.getSeries.GET.description=Read local novel series metadata. Supply lang or variant for existing translations of the series title and description.
NovelGalleryController.getSeries.GET.success=Novel series details.
NovelGalleryController.getSeriesCover.GET.summary=Get a novel series cover
NovelGalleryController.getSeriesCover.GET.description=Read the local cover image bytes using the response Content-Type. A missing cover file returns 404.
NovelGalleryController.getSeriesCover.GET.success=Novel series cover.
NovelGalleryController.downloadedBatch.POST.summary=Look up downloaded novels in bulk
NovelGalleryController.downloadedBatch.POST.description=Check which novelIds have complete local downloads. With includeDeleted=true, deleted record IDs are reported separately when the caller’s scope permits it.
NovelGalleryController.downloadedBatch.POST.success=Downloaded novels in bulk.
