title=小说术语表
NovelGlossaryController.list.GET.summary=列出小说术语表
NovelGlossaryController.list.GET.description=列出术语表摘要，含条目数和系列或小说绑定。用 id 读取包含全部词条的详情。
NovelGlossaryController.list.GET.success=小说术语表。
NovelGlossaryController.create.POST.summary=创建小说术语表
NovelGlossaryController.create.POST.description=可用 seriesId 或 novelId 绑定到本地系列或单本小说，或省略绑定创建独立记录。已有相同绑定时复用现有记录。
NovelGlossaryController.create.POST.success=已创建小说术语表。
NovelGlossaryController.get.GET.summary=查看术语表条目
NovelGlossaryController.get.GET.description=返回指定术语表及其全量原词、译文语言和译词。没有此表时返回 404。
NovelGlossaryController.get.GET.success=术语表条目。
NovelGlossaryController.rename.PUT.summary=重命名术语表
NovelGlossaryController.rename.PUT.description=用请求中的非空 name 重命名指定术语表。成功返回更新后的摘要。
NovelGlossaryController.rename.PUT.success=已更新术语表。
NovelGlossaryController.replaceEntries.PUT.summary=替换术语表全部条目
NovelGlossaryController.replaceEntries.PUT.description=用给定 entries 替换整张术语表。每项包含原词 source、译文语言 lang 和译词 target，空数组清空全部条目。
NovelGlossaryController.replaceEntries.PUT.success=已替换术语表全部条目。
NovelGlossaryController.delete.DELETE.summary=删除术语表
NovelGlossaryController.delete.DELETE.description=删除指定术语表，成功返回 204，没有此表时返回 404。
NovelGlossaryController.delete.DELETE.success=已移除术语表。
NovelGlossaryController.novelDefault.GET.summary=查看小说的默认术语表
NovelGlossaryController.novelDefault.GET.description=读取默认术语表，无绑定时 id 为 null，并返回建议名称和绑定信息。系列小说共享系列默认表。
NovelGlossaryController.novelDefault.GET.success=小说的默认术语表。
NovelGlossaryController.seriesDefault.GET.summary=查看系列的默认术语表
NovelGlossaryController.seriesDefault.GET.description=读取默认术语表，无绑定时 id 为 null，并返回建议名称和绑定信息。系列小说共享系列默认表。
NovelGlossaryController.seriesDefault.GET.success=系列的默认术语表。
parameter.seriesId=作品或小说系列的 ID。
parameter.novelId=Pixiv 小说 ID。
