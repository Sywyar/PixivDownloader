parameter.authorIds=絞り込みに含める作者 ID。
parameter.notAuthorIds=結果から除外する作者 ID。
parameter.orAuthorIds=指定した作者のいずれかの作品を返します。
parameter.authorId=この作者の作品に絞り込みます。
parameter.seriesIds=絞り込みに含めるシリーズ ID。
parameter.notSeriesIds=結果から除外するシリーズ ID。
parameter.seriesId=作品または小説シリーズの ID。
parameter.uploadedFrom=投稿日時の下限（含む）。
parameter.uploadedBefore=投稿日時の上限（含まない）。
parameter.downloadedFrom=ダウンロード日時の下限（含む）。
parameter.downloadedBefore=ダウンロード日時の上限（含まない）。
parameter.sourceTimeField=日付で絞り込む元の時刻項目。
parameter.createdFrom=作成日時の下限（含む）。
parameter.createdBefore=作成日時の上限（含まない）。
parameter.updatedFrom=更新日時の下限（含む）。
