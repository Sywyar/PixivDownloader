schema.top.sywyar.pixivdownload.novelgallery.NovelTagOption.description=小説ライブラリの絞り込みに使うタグ。
schema.top.sywyar.pixivdownload.novelgallery.NovelSeriesSummary.description=小説ライブラリのシリーズ項目。
