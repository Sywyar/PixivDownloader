schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.mode=mode を省略するか ids を指定すると、ids の作品を選択します。filter モードでは filter オブジェクトが必須です。どちらも excludeIds を除外します。
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.filter=filter モードの絞り込み条件。空のオブジェクト {} は全作品に一致します。この範囲を削除するときやエクスポート後に元作品を削除するときは confirmAll が必要です。絞り込みや除外の ID は JSON の正の整数で指定します。
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.ids=個別に選択する作品 ID の配列。各要素は JSON の正の整数で指定します。同じ ID は一度だけ選択されます。
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.format=書き出すアーカイブ形式。既定は zip。
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.groupBy=id で作品 ID ごとのフォルダーに書き出します。省略時は作者・作品別です。
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.deleteAfter=原本のアーカイブの準備後に選択したローカル作品を削除します。残す場合は false または省略。
schema.top.sywyar.pixivdownload.novelgallery.NovelBatchRequest.field.variant=原文なら省略または空にします。訳文は同じ選択の export/options から選び、deleteAfter=false にします。
