title=小説ライブラリ
NovelExportController.download.GET.summary=小説の EPUB ファイルをダウンロード
NovelExportController.download.GET.description=ローカル小説を EPUB 添付で取得します。原文は variant を省略し、訳文は既存バリアントを指定します。64 MiB を超えると 413 です。
NovelExportController.download.GET.success=小説の EPUB ファイル。
NovelGalleryController.listNovels.GET.summary=保存済みの小説をページ単位で取得
NovelGalleryController.listNovels.GET.description=呼び出し元が閲覧できるローカル作品を page=0 から取得します。ID はカンマ区切りで、タグ条件は tagIds、notTagIds、orTagIds を組み合わせます。 各 ID は正の整数で指定してください。空の項目や無効な ID が一つでもあると、リクエスト全体が 400 になります。
NovelGalleryController.listNovels.GET.success=保存済みの小説。
NovelGalleryController.listAuthors.GET.summary=小説の作者の一覧
NovelGalleryController.listAuthors.GET.description=閲覧可能なローカル小説の作者を検索します。page は 0 始まり、size は既定 24、既定順序は name です。
NovelGalleryController.listAuthors.GET.success=小説の作者。
NovelGalleryController.listNovelSeries.GET.summary=保存済みの小説シリーズの一覧
NovelGalleryController.listNovelSeries.GET.description=ローカル小説シリーズを検索します。page は 0 始まり、size は既定 24、既定順序は title です。
NovelGalleryController.listNovelSeries.GET.success=保存済みの小説シリーズ。
NovelGalleryController.listNovelTags.GET.summary=小説のタグの一覧
NovelGalleryController.listNovelTags.GET.description=search でローカルタグを検索し、limit で件数を指定します。取得したタグ ID は作品一覧の絞り込みに使えます。
NovelGalleryController.listNovelTags.GET.success=小説のタグ。
NovelGalleryController.findNovel.GET.summary=小説の詳細を取得
NovelGalleryController.findNovel.GET.description=閲覧可能なローカル作品の詳細を Pixiv ID で取得します。
NovelGalleryController.findNovel.GET.success=小説の詳細。
NovelGalleryController.deleteNovel.DELETE.summary=保存済みの小説を削除
NovelGalleryController.deleteNovel.DELETE.description=ローカル作品を 1 件削除します。成功は deleted=1、該当なしは 404 です。
NovelGalleryController.deleteNovel.DELETE.success=保存済みの小説を削除しました。
NovelGalleryController.deleteNovels.POST.summary=選択した小説を削除
NovelGalleryController.deleteNovels.POST.description=ids または条件で選んだローカル作品を削除します。excludeIds を除外し、実際の削除件数を返します。 空のフィルターはこのライブラリ内の有効な作品をすべて選択します。ページと並び順は一括選択の範囲を制限しません。 正規化後に絞り込み条件がない場合、削除には confirmAll=true が必要です。
NovelGalleryController.deleteNovels.POST.success=選択した小説を削除しました。
NovelGalleryController.collectNovels.POST.summary=コレクションへの複数の小説を追加
NovelGalleryController.collectNovels.POST.description=選択した作品を指定のローカルコレクションに追加します。count は選択件数、changed は変更件数です。 空のフィルターはこのライブラリ内の有効な作品をすべて選択します。ページと並び順は一括選択の範囲を制限しません。
NovelGalleryController.collectNovels.POST.success=コレクションへの複数の小説を追加しました。
NovelGalleryController.exportOptions.POST.summary=小説のエクスポート設定の一覧
NovelGalleryController.exportOptions.POST.description=選択した全小説に共通する翻訳バリアントを返します。同じ選択のエクスポートに variants の値を指定します。 空のフィルターはこのライブラリ内の有効な作品をすべて選択します。ページと並び順は一括選択の範囲を制限しません。
NovelGalleryController.exportOptions.POST.success=小説のエクスポート設定。
NovelGalleryController.exportNovels.POST.summary=選択した小説をエクスポート
NovelGalleryController.exportNovels.POST.description=ID またはフィルターから excludeIds を除外してアーカイブを作成します。成功時は archiveToken、有効秒数、件数を返し、対象ファイルがなければ 204 です。 空のフィルターはこのライブラリ内の有効な作品をすべて選択します。ページと並び順は一括選択の範囲を制限しません。 正規化後に絞り込み条件がない場合、削除には confirmAll=true が必要です。 エクスポート後に削除する場合、プログラムキーには novel:library.delete 権限も必要です。削除を伴わないエクスポートでは、他の作品の読み取り専用ファイルと現在の管理ディレクトリは含まれません。
NovelGalleryController.exportNovels.POST.success=選択した小説。
NovelGalleryController.bySeries.GET.summary=同じシリーズの小説の一覧
NovelGalleryController.bySeries.GET.description=作品 ID から所属シリーズを特定し、参照可能な作品を取得します。limit の既定は 30 です。
NovelGalleryController.bySeries.GET.success=同じシリーズの小説。
NovelGalleryController.seriesNav.GET.summary=小説シリーズのナビゲーションを取得
NovelGalleryController.seriesNav.GET.description=作品 ID からシリーズ内の位置と前後の参照可能な作品を取得します。シリーズや隣接作品がない場合は null です。
NovelGalleryController.seriesNav.GET.success=小説シリーズのナビゲーション。
NovelGalleryController.getNovelCover.GET.summary=小説の表紙を取得
NovelGalleryController.getNovelCover.GET.description=ローカル表紙画像のバイト列を Content-Type に従って読み込みます。ファイルがなければ 404 です。
NovelGalleryController.getNovelCover.GET.success=小説の表紙。
NovelGalleryController.getNovelContent.GET.summary=小説の本文を取得
NovelGalleryController.getNovelContent.GET.description=ローカル原文と lang または variant で選んだ訳文を取得します。部分翻訳の場合、タイトル・説明・本文の訳文は個別に欠けることがあります。
NovelGalleryController.getNovelContent.GET.success=小説の本文。
NovelGalleryController.translatedTitles.GET.summary=小説の翻訳済みタイトルを照会
NovelGalleryController.translatedTitles.GET.description=カンマ区切りの ids に対応する翻訳タイトルを小説 ID をキーに返します。閲覧不可または未翻訳の作品は含みません。 各 ID は正の整数で指定してください。空の項目や無効な ID が一つでもあると、リクエスト全体が 400 になります。
NovelGalleryController.translatedTitles.GET.success=小説の翻訳済みタイトル。
NovelGalleryController.getNovelEmbeddedImage.GET.summary=小説の挿絵を取得
NovelGalleryController.getNovelEmbeddedImage.GET.description=小説 ID と本文の imageId でダウンロード済み挿絵を取得します。imageId は英数字、下線、ハイフンの 1～40 文字。該当なしは 404 です。
NovelGalleryController.getNovelEmbeddedImage.GET.success=小説の挿絵。
NovelGalleryController.getSeries.GET.summary=小説シリーズの詳細を取得
NovelGalleryController.getSeries.GET.description=ローカル小説シリーズのメタデータを取得します。lang または variant で題名と説明の保存済み訳を取得できます。
NovelGalleryController.getSeries.GET.success=小説シリーズの詳細。
NovelGalleryController.getSeriesCover.GET.summary=小説シリーズの表紙を取得
NovelGalleryController.getSeriesCover.GET.description=ローカル表紙画像のバイト列を Content-Type に従って読み込みます。ファイルがなければ 404 です。
NovelGalleryController.getSeriesCover.GET.success=小説シリーズの表紙。
NovelGalleryController.downloadedBatch.POST.summary=複数の小説のダウンロード状況を照会
NovelGalleryController.downloadedBatch.POST.description=novelIds のうちローカルに完全保存された小説を調べます。includeDeleted=true で権限があれば削除済み ID も別途返します。
NovelGalleryController.downloadedBatch.POST.success=複数の小説のダウンロード状況。
parameter.novelId=Pixiv の小説 ID。
