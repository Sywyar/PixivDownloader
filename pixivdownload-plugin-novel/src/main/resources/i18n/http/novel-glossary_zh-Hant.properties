title=小說術語表
NovelGlossaryController.list.GET.summary=列出小說術語表
NovelGlossaryController.list.GET.description=列出術語表摘要，含條目數和系列或小說繫結。用 id 讀取包含全部詞條的詳情。
NovelGlossaryController.list.GET.success=小說術語表。
NovelGlossaryController.create.POST.summary=建立小說術語表
NovelGlossaryController.create.POST.description=可用 seriesId 或 novelId 繫結到本地系列或單本小說，或省略繫結建立獨立記錄。已有相同繫結時複用現有記錄。
NovelGlossaryController.create.POST.success=已建立小說術語表。
NovelGlossaryController.get.GET.summary=檢視術語表條目
NovelGlossaryController.get.GET.description=返回指定術語表及其全量原詞、譯文語言和譯詞。沒有此表時返回 404。
NovelGlossaryController.get.GET.success=術語表條目。
NovelGlossaryController.rename.PUT.summary=重新命名術語表
NovelGlossaryController.rename.PUT.description=用請求中的非空 name 重新命名指定術語表。成功返回更新後的摘要。
NovelGlossaryController.rename.PUT.success=已更新術語表。
NovelGlossaryController.replaceEntries.PUT.summary=替換術語表全部條目
NovelGlossaryController.replaceEntries.PUT.description=用給定 entries 替換整張術語表。每項包含原詞 source、譯文語言 lang 和譯詞 target，空陣列清空全部條目。
NovelGlossaryController.replaceEntries.PUT.success=已替換術語表全部條目。
NovelGlossaryController.delete.DELETE.summary=刪除術語表
NovelGlossaryController.delete.DELETE.description=刪除指定術語表，成功返回 204，沒有此表時返回 404。
NovelGlossaryController.delete.DELETE.success=已移除術語表。
NovelGlossaryController.novelDefault.GET.summary=檢視小說的預設術語表
NovelGlossaryController.novelDefault.GET.description=讀取預設術語表，無繫結時 id 為 null，並返回建議名稱和繫結資訊。系列小說共享系列預設表。
NovelGlossaryController.novelDefault.GET.success=小說的預設術語表。
NovelGlossaryController.seriesDefault.GET.summary=檢視系列的預設術語表
NovelGlossaryController.seriesDefault.GET.description=讀取預設術語表，無繫結時 id 為 null，並返回建議名稱和繫結資訊。系列小說共享系列預設表。
NovelGlossaryController.seriesDefault.GET.success=系列的預設術語表。
parameter.seriesId=作品或小說系列的 ID。
