schema.DownloadSubmission.novel.description=服務端從 Pixiv 取得正文與中繼資料，將整部小說儲存為 `txt`（預設）、`html` 或 `epub`。小說不接受 `pages`。服務端會嘗試下載封面與插圖，成功取得的檔案會隨正文和作品記錄一併提交。Pixiv 收藏及加入本機收藏夾依選項執行。`autoTranslate` 會在下載完成後另行提交翻譯，翻譯失敗仍保留已儲存的小說。作品詳情見 `GET /api/gallery/novel/{novelId}`，翻譯狀態見 `GET /api/novel/translate-status/{novelId}`。
description=提交小說下載、檢視狀態並處理已下載的文字。
