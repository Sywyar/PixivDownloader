title=小說下載
NovelBrowserImportController.issueImportToken.GET.summary=簽發瀏覽器匯入令牌
NovelBrowserImportController.issueImportToken.GET.description=本地 solo 模式簽發一次性瀏覽器匯入令牌。將 token 作為 X-Novel-Import-Token 提交，並在 expiresInSeconds 期限內使用。
NovelBrowserImportController.issueImportToken.GET.success=已建立瀏覽器匯入令牌。
NovelBrowserImportController.importNovel.POST.summary=匯入瀏覽器中的小說
NovelBrowserImportController.importNovel.POST.description=傳送 UTF-8 編碼的 Pixiv 小說原始響應和一次性 X-Novel-Import-Token，body.id 必須匹配路徑，最大 4 MiB。返回的 fetchToken 供 POST /api/novel/download 使用。
NovelBrowserImportController.importNovel.POST.success=瀏覽器中的小說。
NovelDownloadController.downloadNovel.POST.summary=提交小說下載
NovelDownloadController.downloadNovel.POST.description=用 novelId 啟動非同步小說下載，fetchToken 可使用小說後設資料或瀏覽器匯入介面返回的票據。HTTP 200 也可能表示已有副本。按 novelId 查詢下載狀態。 程式金鑰請使用 POST /api/download/tasks，設定 workType="novel"。
NovelDownloadController.downloadNovel.POST.success=小說下載。
NovelDownloadController.getStatus.GET.summary=檢視小說下載進度
NovelDownloadController.getStatus.GET.description=查詢呼叫者可見的小說下載任務，含當前階段、進度和錯誤。沒有可見任務時返回 HTTP 200 和 success=false。
NovelDownloadController.getStatus.GET.success=小說下載進度。
NovelDownloadController.getTranslateStatus.GET.summary=檢視小說翻譯進度
NovelDownloadController.getTranslateStatus.GET.description=讀取該小說下載後自動翻譯的當前階段和進度。沒有狀態記錄時返回 204。
NovelDownloadController.getTranslateStatus.GET.success=小說翻譯進度。
NovelDownloadController.novelDownloadedState.GET.summary=檢視小說的本地下載狀態
NovelDownloadController.novelDownloadedState.GET.description=檢查小說是否已登記下載。已刪除的歷史記錄也算 downloaded=true，可透過 deleted=true 區分；其餘作品需要本地檔案完整。
NovelDownloadController.novelDownloadedState.GET.success=小說的本地下載狀態。
NovelDownloadController.mergeSeries.POST.summary=建立小說系列合訂本
NovelDownloadController.mergeSeries.POST.description=從本地系列章節生成合訂本，預設格式為 epub。variant 優先於 lang，均省略時使用原文。返回儲存路徑、收錄章節數和實際格式。
NovelDownloadController.mergeSeries.POST.success=已建立小說系列合訂本。
NovelDownloadController.downloadMergedSeries.GET.summary=下載小說系列合訂本
NovelDownloadController.downloadMergedSeries.GET.description=按當前資料庫內容重新生成系列合訂本並作為附件下載，預設 epub。variant 優先於 lang，無法生成可見檔案時返回 404。
NovelDownloadController.downloadMergedSeries.GET.success=小說系列合訂本。
NovelDownloadController.translateNovel.POST.summary=翻譯已下載的小說
NovelDownloadController.translateNovel.POST.description=翻譯指定本地小說的選中部分。目標語言必填，正文、標題、簡介至少選一項。用結果中的 langCode 和 variantKey 讀取譯文。
NovelDownloadController.translateNovel.POST.success=已下載的小說。
NovelDownloadController.translateLangProbe.POST.summary=查詢翻譯語言程式碼
NovelDownloadController.translateLangProbe.POST.description=將目標語言解析為引擎使用的語言程式碼。檢查響應的 valid，無法識別時 code 為空。
NovelDownloadController.translateLangProbe.POST.success=翻譯語言程式碼。
NovelDownloadController.translateSeriesTitle.POST.summary=翻譯小說系列標題
NovelDownloadController.translateSeriesTitle.POST.description=翻譯本地小說系列的標題或簡介。傳入目標語言，選中 translateTitle、translateDescription 中至少一項。
NovelDownloadController.translateSeriesTitle.POST.success=小說系列標題。
NovelDownloadController.seriesNovelIds.GET.summary=列出系列內的小說 ID
NovelDownloadController.seriesNovelIds.GET.description=返回在本地庫中登記到該系列的小說 ID 列表，用於選擇合訂或翻譯的章節。
NovelDownloadController.seriesNovelIds.GET.success=系列內的小說 ID。
NovelDownloadLegacyForwardController.forwardDownload.POST.summary=轉發小說下載請求
NovelDownloadLegacyForwardController.forwardDownload.POST.description=將原始請求體轉交 POST /api/novel/download，使用相同的下載引數、路徑衝突處理和結果。 程式金鑰請使用 POST /api/download/tasks，設定 workType="novel"。
NovelDownloadLegacyForwardController.forwardDownload.POST.success=小說下載請求。
NovelDownloadLegacyForwardController.forwardStatus.GET.summary=轉發小說下載狀態查詢
NovelDownloadLegacyForwardController.forwardStatus.GET.description=以相同 novelId 轉交 GET /api/novel/status/{novelId}，返回該小說下載的當前狀態。
NovelDownloadLegacyForwardController.forwardStatus.GET.success=小說下載狀態查詢。
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.summary=轉發小說翻譯狀態查詢
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.description=以相同 novelId 轉交 GET /api/novel/translate-status/{novelId}，返回該小說的自動翻譯進度。
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.success=小說翻譯狀態查詢。
