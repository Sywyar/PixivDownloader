title=小说朗读
NarrationController.availability.GET.summary=查看朗读功能可用状态
NarrationController.availability.GET.description=分别返回朗读引擎是否可用、调试模式是否开启、用于脚本分析的文本模型是否已配置。
NarrationController.availability.GET.success=朗读功能可用状态。
NarrationController.narratorPresets.GET.summary=列出旁白音色预设
NarrationController.narratorPresets.GET.description=列出内置旁白预设，每项返回预设 id 和音色指令 instruction，供生成脚本时选择。
NarrationController.narratorPresets.GET.success=旁白音色预设。
NarrationController.script.POST.summary=生成章节分句朗读脚本
NarrationController.script.POST.description=按 novelId 和 lang 读取逐句脚本。缓存优先，force=true 重新分析。analyzeIfMissing=false 且没有缓存时返回 204，分析需要可用的 AI 服务。
NarrationController.script.POST.success=章节分句朗读脚本。
NarrationController.cast.GET.summary=查看当前角色名册
NarrationController.cast.GET.description=按本地 novelId 解析默认名册并列出音色。小说不存在时返回 404，尚未建册时 castId 为 null，并提供默认旁白。
NarrationController.cast.GET.success=当前角色名册。
NarrationController.listCasts.GET.summary=列出角色名册
NarrationController.listCasts.GET.description=列出已保存名册的 ID、名称、绑定作品和音色数量，用 id 查询具体角色。
NarrationController.listCasts.GET.success=角色名册。
NarrationController.createCast.POST.summary=创建角色名册
NarrationController.createCast.POST.description=可用 seriesId 或 novelId 绑定到本地系列或单本小说，或省略绑定创建独立记录。已有相同绑定时复用现有记录。
NarrationController.createCast.POST.success=已创建角色名册。
NarrationController.novelDefaultCast.GET.summary=查看小说默认角色名册
NarrationController.novelDefaultCast.GET.description=返回小说的默认名册绑定。尚未创建时 castId 为 null，并返回可用于创建名册的建议名称。
NarrationController.novelDefaultCast.GET.success=小说默认角色名册。
NarrationController.castVoices.GET.summary=列出角色音色
NarrationController.castVoices.GET.description=按名册 id 返回角色、音色指令和参考音频状态；没有此名册时返回 404。
NarrationController.castVoices.GET.success=角色音色。
NarrationController.updateVoice.PUT.summary=更新角色音色
NarrationController.updateVoice.PUT.description=为 characterId 保存非空 controlInstruction。优先使用正数 castId，否则使用 novelId 解析或创建默认名册；成功返回 HTTP 200 空正文。
NarrationController.updateVoice.PUT.success=已更新角色音色。
NarrationReferenceVoiceController.generate.POST.summary=生成角色参考音
NarrationReferenceVoiceController.generate.POST.description=为指定 castId 和 characterId 生成参考录音。text 留空使用内置台词；无法获得足够长度的样本时返回 422。
NarrationReferenceVoiceController.generate.POST.success=角色参考音。
NarrationReferenceVoiceController.upload.POST.summary=上传参考录音
NarrationReferenceVoiceController.upload.POST.description=以 multipart/form-data 上传 castId、characterId 和非空 WAV 或 MP3 音频文件 file。文件最多 8 MiB，文件内容须匹配声明格式；可用 refText 提供录音文字。 音频最长 60 秒，1–2 声道，采样率 8–96 kHz；WAV 接受 8、16、24 或 32 位 PCM。
NarrationReferenceVoiceController.upload.POST.success=已上传参考录音。
NarrationReferenceVoiceController.delete.DELETE.summary=删除角色参考录音
NarrationReferenceVoiceController.delete.DELETE.description=删除指定名册角色的参考录音。成功返回 HTTP 200 空正文。
NarrationReferenceVoiceController.delete.DELETE.success=已移除角色参考录音。
NarrationReferenceVoiceController.preview.GET.summary=查看已保存的参考录音
NarrationReferenceVoiceController.preview.GET.description=按 castId 和 characterId 回放已保存的参考录音。返回原始音频字节，未保存录音时返回 404。
NarrationReferenceVoiceController.preview.GET.success=已保存的参考录音。
NarrationTtsController.line.POST.summary=生成单句台词音频
NarrationTtsController.line.POST.description=以本地 novelId、lang 和从 0 开始的 lineIndex 合成已分析脚本中的一句，成功响应为音频字节。
NarrationTtsController.line.POST.success=单句台词音频。
NarrationTtsController.preview.POST.summary=生成音色试听片段
NarrationTtsController.preview.POST.description=为给定文本试听音色。文本限 4000 个字符，成功响应的 Content-Type 标识音频格式。
NarrationTtsController.preview.POST.success=音色试听片段。
parameter.castId=角色所属名册的 ID。
