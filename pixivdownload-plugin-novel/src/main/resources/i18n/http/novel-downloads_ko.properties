schema.DownloadSubmission.novel.description=서버는 Pixiv에서 본문과 메타데이터를 받아 소설 전체를 `txt`(기본값), `html`, `epub` 중 하나로 저장합니다. 소설에는 `pages`를 지정할 수 없습니다. 표지와 삽화는 가져오는 데 성공한 파일만 본문 및 작품 기록과 함께 커밋합니다. Pixiv 북마크와 로컬 컬렉션 추가는 선택 사항입니다. `autoTranslate`는 다운로드 완료 후 번역을 별도로 요청합니다. 번역이 실패해도 저장한 소설은 유지됩니다. 작품 정보는 `GET /api/gallery/novel/{novelId}`, 번역 상태는 `GET /api/novel/translate-status/{novelId}`에서 확인합니다.
description=소설 다운로드를 제출하고 상태를 조회하며 내려받은 본문을 처리합니다.
