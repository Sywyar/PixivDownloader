title=소설 다운로드
NovelBrowserImportController.issueImportToken.GET.summary=브라우저 가져오기 토큰 발급
NovelBrowserImportController.issueImportToken.GET.description=로컬 solo 모드에서 일회용 가져오기 토큰을 발급합니다. expiresInSeconds 이내에 X-Novel-Import-Token으로 전송합니다.
NovelBrowserImportController.issueImportToken.GET.success=브라우저 가져오기 토큰을 생성했습니다.
NovelBrowserImportController.importNovel.POST.summary=브라우저의 소설 가져오기
NovelBrowserImportController.importNovel.POST.description=UTF-8 Pixiv 소설 응답(최대 4 MiB)과 일회용 X-Novel-Import-Token을 보냅니다. body.id가 경로 ID와 같아야 하며 받은 fetchToken은 POST /api/novel/download에 전달합니다.
NovelBrowserImportController.importNovel.POST.success=브라우저의 소설.
NovelDownloadController.downloadNovel.POST.summary=소설 다운로드 시작
NovelDownloadController.downloadNovel.POST.description=novelId로 비동기 소설 다운로드를 시작합니다. 메타데이터나 브라우저 가져오기에서 받은 fetchToken을 사용할 수 있습니다. 기존 사본이 있어도 HTTP 200이며 novelId로 상태를 조회합니다. 프로그램 키는 POST /api/download/tasks에 workType="novel"로 제출하세요.
NovelDownloadController.downloadNovel.POST.success=소설 다운로드.
NovelDownloadController.getStatus.GET.summary=소설 다운로드 진행률 조회
NovelDownloadController.getStatus.GET.description=조회 가능한 소설 다운로드의 단계, 진행률, 오류를 반환합니다. 대상이 없으면 HTTP 200과 success=false입니다.
NovelDownloadController.getStatus.GET.success=소설 다운로드 진행률.
NovelDownloadController.getTranslateStatus.GET.summary=소설 번역 진행률 조회
NovelDownloadController.getTranslateStatus.GET.description=소설 다운로드 후 자동 번역 상태와 진행률을 조회합니다. 상태 기록이 없으면 204입니다.
NovelDownloadController.getTranslateStatus.GET.success=소설 번역 진행률.
NovelDownloadController.novelDownloadedState.GET.summary=소설 로컬 다운로드 상태 조회
NovelDownloadController.novelDownloadedState.GET.description=다운로드 기록과 로컬 파일 완전성을 확인합니다. 삭제 기록은 downloaded=true, deleted=true이며 나머지는 파일이 모두 있을 때만 downloaded=true입니다.
NovelDownloadController.novelDownloadedState.GET.success=소설 로컬 다운로드 상태.
NovelDownloadController.mergeSeries.POST.summary=소설 시리즈 합본 생성
NovelDownloadController.mergeSeries.POST.description=로컬 시리즈의 장을 합본으로 만듭니다. 기본 형식은 epub이며 variant가 lang보다 우선합니다. 둘 다 생략하면 원문입니다. 경로, 장 수, 형식을 반환합니다.
NovelDownloadController.mergeSeries.POST.success=소설 시리즈 합본을 생성했습니다.
NovelDownloadController.downloadMergedSeries.GET.summary=소설 시리즈 합본 다운로드
NovelDownloadController.downloadMergedSeries.GET.description=현재 로컬 시리즈 자료로 합본을 다시 생성해 첨부로 다운로드합니다. 기본 형식은 epub이고 variant가 lang보다 우선합니다. 파일이 없으면 404입니다.
NovelDownloadController.downloadMergedSeries.GET.success=소설 시리즈 합본.
NovelDownloadController.translateNovel.POST.summary=다운로드한 소설 번역
NovelDownloadController.translateNovel.POST.description=로컬 소설에서 선택한 부분을 번역합니다. 대상 언어와 본문·제목·설명 중 하나 이상을 지정하고 반환된 langCode와 variantKey로 번역을 조회합니다.
NovelDownloadController.translateNovel.POST.success=다운로드한 소설.
NovelDownloadController.translateLangProbe.POST.summary=번역 언어 코드 조회
NovelDownloadController.translateLangProbe.POST.description=대상 언어를 엔진의 언어 코드로 변환합니다. valid를 확인하세요. 인식하지 못하면 code가 비어 있습니다.
NovelDownloadController.translateLangProbe.POST.success=번역 언어 코드.
NovelDownloadController.translateSeriesTitle.POST.summary=소설 시리즈 제목 번역
NovelDownloadController.translateSeriesTitle.POST.description=로컬 소설 시리즈 제목 또는 설명을 번역합니다. 대상 언어와 translateTitle, translateDescription 중 하나 이상을 지정합니다.
NovelDownloadController.translateSeriesTitle.POST.success=소설 시리즈 제목.
NovelDownloadController.seriesNovelIds.GET.summary=시리즈에 속한 소설 ID 목록 조회
NovelDownloadController.seriesNovelIds.GET.description=시리즈에 로컬 등록된 소설 ID 목록을 반환합니다. 합본이나 번역할 장을 선택할 때 사용합니다.
NovelDownloadController.seriesNovelIds.GET.success=시리즈에 속한 소설 ID.
NovelDownloadLegacyForwardController.forwardDownload.POST.summary=소설 다운로드 요청 전달
NovelDownloadLegacyForwardController.forwardDownload.POST.description=원래 요청을 POST /api/novel/download로 전달합니다. 다운로드 설정과 경로 충돌 처리 및 결과는 동일합니다. 프로그램 키는 POST /api/download/tasks에 workType="novel"로 제출하세요.
NovelDownloadLegacyForwardController.forwardDownload.POST.success=소설 다운로드 요청.
NovelDownloadLegacyForwardController.forwardStatus.GET.summary=소설 다운로드 상태 조회 전달
NovelDownloadLegacyForwardController.forwardStatus.GET.description=같은 novelId로 GET /api/novel/status/{novelId}에 전달하여 현재 다운로드 상태를 반환합니다.
NovelDownloadLegacyForwardController.forwardStatus.GET.success=소설 다운로드 상태 조회.
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.summary=소설 번역 상태 조회 전달
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.description=같은 novelId로 GET /api/novel/translate-status/{novelId}에 전달하여 자동 번역 진행률을 반환합니다.
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.success=소설 번역 상태 조회.
