NovelPixivProxyController.searchNovels.GET.summary=Pixiv 소설 검색
NovelPixivProxyController.searchNovels.GET.description=word에 검색어를 넣고 페이지는 1부터 시작합니다. order는 date_d, date, popular_d, mode는 all, safe, r18, sMode는 s_tag, s_tc입니다. 범위 검색은 페이지당 24개로 계산합니다. 실제 페이지 크기는 Pixiv가 정하며 pageSize를 지정할 수 없습니다. total은 Pixiv가 보고한 작품 수입니다.
NovelPixivProxyController.searchNovels.GET.success=Pixiv 소설.
NovelPixivProxyController.rangeSearchNovels.GET.summary=지정 범위의 소설 검색
NovelPixivProxyController.rangeSearchNovels.GET.description=양 끝을 포함한 검색 페이지를 읽고 작품 ID를 기준으로 중복을 제거합니다. requestedPages, acceptedPages, fetchedPages는 요청, 허용, 실제 조회 페이지 수입니다. Pixiv의 마지막 페이지에서 종료합니다. 마지막 페이지는 페이지당 24개로 추정합니다. 실제 반환 건수는 달라질 수 있습니다. 미리 보기의 요청 간격을 조절하려면 startPage와 endPage에 같은 페이지 번호를 지정하고 다음 페이지를 요청하기 전에 클라이언트에서 기다리세요.
NovelPixivProxyController.rangeSearchNovels.GET.success=지정 범위의 소설.
NovelPixivProxyController.getUserNovels.GET.summary=Pixiv 작가의 소설 목록 조회
NovelPixivProxyController.getUserNovels.GET.description=작가의 작품 ID를 숫자 내림차순으로 반환합니다. 카드가 필요하면 같은 작가의 cards API에 선택한 ID를 보내세요.
NovelPixivProxyController.getUserNovels.GET.success=Pixiv 작가의 소설.
NovelPixivProxyController.getUserNovelCards.GET.summary=작가의 소설 카드 목록 조회
NovelPixivProxyController.getUserNovelCards.GET.description=같은 작가의 ID를 ids=123&ids=456처럼 전달합니다. 카드는 요청한 순서대로 반환됩니다.
NovelPixivProxyController.getUserNovelCards.GET.success=작가의 소설 카드.
NovelPixivProxyController.getMyNovelBookmarks.GET.summary=현재 계정이 북마크한 소설 목록 조회
NovelPixivProxyController.getMyNovelBookmarks.GET.description=Pixiv 계정을 식별하는 수집 자격 증명이 필요하며 없으면 400 ACQUISITION_CREDENTIAL_REQUIRED입니다. rest=show는 공개, hide는 비공개 항목입니다. offset은 0부터 시작하고 limit은 1~100으로 제한됩니다.
NovelPixivProxyController.getMyNovelBookmarks.GET.success=현재 계정이 북마크한 소설.
parameter.userId=작가의 Pixiv 사용자 ID입니다.
parameter.X-Acquisition-Credential=Pixiv 요청에 쓸 세션 쿠키입니다. 계정 전용 콘텐츠에는 필요하며 앞뒤 공백 제거 후 최대 16384자입니다. 공개 정보 조회에 성공해도 Cookie의 유효 기간이 확인되지는 않습니다. 단일 자격 증명으로 보낸 프록시 요청을 Pixiv가 401 또는 403으로 거부하면 이 서비스는 502 error.pixiv.upstream.unauthorized를 반환합니다.
parameter.novelId=Pixiv 소설 ID입니다.
parameter.seriesId=작품 또는 소설 시리즈 ID입니다.
parameter.word=Pixiv 검색어입니다.
parameter.mode=검색 모드는 all, safe, r18입니다. mode=r18은 Pixiv에 그대로 전달됩니다. Pixiv 쿠키 없이 익명으로 검색하거나 계정이 연령 제한 작품을 숨기면 전체 이용가 작품이 반환되거나 결과가 비어 있을 수 있습니다. 각 항목의 xRestrict 등급(0 전체 이용가, 1 R-18, 2 R-18G)을 확인하세요.
parameter.sMode=Pixiv 검색어 일치 방식입니다.
parameter.startPage=검색 범위의 시작 페이지입니다.
parameter.endPage=검색 범위의 마지막 페이지입니다.
parameter.rest=현재 계정 항목의 공개 범위에 대한 Pixiv 필터입니다.
parameter.tag=목록을 필터링할 북마크 태그입니다.
