title=Pixiv novels
NovelPixivProxyController.getNovelMeta.GET.summary=Get Pixiv novel metadata
NovelPixivProxyController.getNovelMeta.GET.description=Reads Pixiv novel metadata and issues a fetchToken bound to that novel for POST /api/novel/download.
NovelPixivProxyController.getNovelMeta.GET.success=Pixiv novel metadata.
NovelPixivProxyController.getNovelBookmarkCount.GET.summary=Get a novel's bookmark count
NovelPixivProxyController.getNovelBookmarkCount.GET.description=Returns the novel’s Pixiv bookmark count without downloading its text.
NovelPixivProxyController.getNovelBookmarkCount.GET.success=Novel's bookmark count.
NovelPixivProxyController.getNovelSeries.GET.summary=Get a Pixiv novel series
NovelPixivProxyController.getNovelSeries.GET.description=Returns Pixiv series metadata and the works on the requested page. Page numbers start at 1.
NovelPixivProxyController.getNovelSeries.GET.success=Pixiv novel series.
NovelPixivProxyController.searchNovels.GET.summary=Search Pixiv novels
NovelPixivProxyController.searchNovels.GET.description=Supply word and a one-based page. order accepts date_d, date or popular_d; mode accepts all, safe or r18; sMode accepts s_tag or s_tc. Range queries estimate 24 results per page. Pixiv controls the actual page size. The API accepts no pageSize parameter. total is the work count reported by Pixiv.
NovelPixivProxyController.searchNovels.GET.success=Pixiv novels.
NovelPixivProxyController.rangeSearchNovels.GET.summary=Search novels within a range
NovelPixivProxyController.rangeSearchNovels.GET.description=Fetch an inclusive range of search pages and deduplicate works by ID. requestedPages, acceptedPages and fetchedPages distinguish the requested, allowed and actually read counts. Fetching stops at the last Pixiv page. This operation estimates the last page using 24 works per page. Actual page lengths can vary.
NovelPixivProxyController.rangeSearchNovels.GET.success=Novels within a range.
NovelPixivProxyController.getUserNovels.GET.summary=List novels by a Pixiv author
NovelPixivProxyController.getUserNovels.GET.description=Returns this artist’s work IDs in descending numeric order. Pass selected IDs to the corresponding cards endpoint for the same artist.
NovelPixivProxyController.getUserNovels.GET.success=Novels by a Pixiv author.
NovelPixivProxyController.getUserNovelCards.GET.summary=List an author's novel cards
NovelPixivProxyController.getUserNovelCards.GET.description=Pass IDs belonging to the same creator, for example ids=123&ids=456. Cards follow the requested ID order.
NovelPixivProxyController.getUserNovelCards.GET.success=Author's novel cards.
NovelPixivProxyController.getMyNovelBookmarks.GET.summary=List bookmarked novels
NovelPixivProxyController.getMyNovelBookmarks.GET.description=Supply an acquisition credential identifying the Pixiv account or the request returns 400 ACQUISITION_CREDENTIAL_REQUIRED. rest=show selects public entries and hide selects private entries. offset starts at 0; limit is clamped to 1–100.
NovelPixivProxyController.getMyNovelBookmarks.GET.success=Bookmarked novels.
parameter.userId=Pixiv user ID of the author.
parameter.X-Acquisition-Credential=Pixiv session cookie for upstream Pixiv requests. Optional except for account-specific content. Maximum 16384 characters after trimming. A successful public query does not verify that the Cookie is still valid. For a single-credential proxy request, an upstream Pixiv 401 or 403 returns 502 error.pixiv.upstream.unauthorized from this service.
parameter.novelId=Pixiv novel ID.
parameter.seriesId=Identifier of the artwork or novel series.
parameter.word=Pixiv search keyword.
parameter.mode=Search mode accepts all, safe or r18. The API forwards mode=r18 to Pixiv. When searching without a Pixiv cookie or with an account that hides age-restricted works, you may receive unrestricted works or an empty result. Check each item’s xRestrict rating (0 unrestricted, 1 R-18, 2 R-18G).
parameter.sMode=How Pixiv matches the search term.
parameter.startPage=First page in the requested search range.
parameter.endPage=Last page in the requested search range.
parameter.rest=Pixiv visibility filter for the account's entries.
parameter.tag=Bookmark tag used to filter the list.
