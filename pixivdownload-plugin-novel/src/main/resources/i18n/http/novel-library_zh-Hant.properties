title=小說書庫
NovelExportController.download.GET.summary=下載小說 EPUB 檔案
NovelExportController.download.GET.description=下載單部本地小說的 EPUB 附件。variant 可使用此作品已有的譯文版本；省略時匯出原文。檔案超過 64 MiB 返回 413。
NovelExportController.download.GET.success=小說 EPUB 檔案。
NovelGalleryController.listNovels.GET.summary=分頁檢視本地小說
NovelGalleryController.listNovels.GET.description=分頁瀏覽呼叫者可見的本地庫。page 從 0 開始；ID 集合按逗號分隔，可使用 tagIds、notTagIds、orTagIds 組合標籤條件。 每個 ID 都必須是正整數；空項目或無效 ID 會使整個請求傳回 400。
NovelGalleryController.listNovels.GET.success=本地小說。
NovelGalleryController.listAuthors.GET.summary=列出小說作者
NovelGalleryController.listAuthors.GET.description=分頁搜尋可見本地小說的作者。page 從 0 開始，size 預設 24，預設按名稱排序。
NovelGalleryController.listAuthors.GET.success=小說作者。
NovelGalleryController.listNovelSeries.GET.summary=列出本地小說系列
NovelGalleryController.listNovelSeries.GET.description=分頁搜尋本地小說系列。page 從 0 開始，size 預設 24，預設按標題排序。
NovelGalleryController.listNovelSeries.GET.success=本地小說系列。
NovelGalleryController.listNovelTags.GET.summary=列出小說標籤
NovelGalleryController.listNovelTags.GET.description=用 search 搜尋本地標籤，用 limit 控制候選數量。返回的標籤 ID 可用於作品列表篩選。
NovelGalleryController.listNovelTags.GET.success=小說標籤。
NovelGalleryController.findNovel.GET.summary=檢視小說詳情
NovelGalleryController.findNovel.GET.description=按 Pixiv 作品 ID 讀取本地儲存的詳情，訪問範圍取決於呼叫者可見的作品記錄。
NovelGalleryController.findNovel.GET.success=小說詳情。
NovelGalleryController.deleteNovel.DELETE.summary=刪除已儲存的小說
NovelGalleryController.deleteNovel.DELETE.description=刪除一條本地作品記錄，成功時返回 deleted=1，找不到時返回 404。
NovelGalleryController.deleteNovel.DELETE.success=已移除已儲存的小說。
NovelGalleryController.deleteNovels.POST.summary=刪除選中的小說
NovelGalleryController.deleteNovels.POST.description=按 ids 或當前篩選條件刪除匹配的本地作品。excludeIds 從最終選擇中剔除，返回實際刪除數量。 空篩選會選取該庫全部有效作品。分頁和排序不會縮小批次範圍。 若篩選正規化後沒有條件，刪除前必須設定 confirmAll=true。
NovelGalleryController.deleteNovels.POST.success=已移除選中的小說。
NovelGalleryController.collectNovels.POST.summary=新增多篇小說到收藏夾
NovelGalleryController.collectNovels.POST.description=將選中的作品加入請求指定的本地收藏夾。count 為選中的數量，changed 為本次實際變更數量。 空篩選會選取該庫全部有效作品。分頁和排序不會縮小批次範圍。
NovelGalleryController.collectNovels.POST.success=已新增多篇小說到收藏夾。
NovelGalleryController.exportOptions.POST.summary=列出小說匯出選項
NovelGalleryController.exportOptions.POST.description=計算所選全部小說共同擁有的譯文版本。將 variants 中的值傳給相同選擇的批次匯出。 空篩選會選取該庫全部有效作品。分頁和排序不會縮小批次範圍。
NovelGalleryController.exportOptions.POST.success=小說匯出選項。
NovelGalleryController.exportNovels.POST.summary=匯出選中的小說
NovelGalleryController.exportNovels.POST.description=按所選 ID 或篩選條件建立歸檔，排除 excludeIds。成功返回 archiveToken、有效秒數和數量；無可歸檔的檔案時返回 204。 空篩選會選取該庫全部有效作品。分頁和排序不會縮小批次範圍。 若篩選正規化後沒有條件，刪除前必須設定 confirmAll=true。 匯出後刪除還需要程式金鑰具備 novel:library.delete 權限。只匯出時會排除其他作品的唯讀匯入檔案及目前的受管目錄。
NovelGalleryController.exportNovels.POST.success=選中的小說。
NovelGalleryController.bySeries.GET.summary=列出同系列小說
NovelGalleryController.bySeries.GET.description=從一部可見作品的 ID 確定所屬系列，列出同系列可見作品。limit 預設 30。
NovelGalleryController.bySeries.GET.success=同系列小說。
NovelGalleryController.seriesNav.GET.summary=檢視小說系列導航
NovelGalleryController.seriesNav.GET.description=根據作品 ID 返回系列內前後相鄰作品和位置資訊。不存在系列關係或可見鄰項時，相應欄位可以為 null。
NovelGalleryController.seriesNav.GET.success=小說系列導航。
NovelGalleryController.getNovelCover.GET.summary=檢視小說封面
NovelGalleryController.getNovelCover.GET.description=讀取本地封面的影象位元組，按響應 Content-Type 解碼。找不到封面檔案時返回 404。
NovelGalleryController.getNovelCover.GET.success=小說封面。
NovelGalleryController.getNovelContent.GET.summary=檢視小說正文
NovelGalleryController.getNovelContent.GET.description=返回本地原文，並按 lang 或 variant 讀取已有譯文。只有部分內容譯好時，標題、簡介、正文的譯文可能分別缺失。
NovelGalleryController.getNovelContent.GET.success=小說正文。
NovelGalleryController.translatedTitles.GET.summary=查詢小說譯名
NovelGalleryController.translatedTitles.GET.description=以逗號分隔的 ids 批次查詢指定語言的譯名。結果按小說 ID 對映，跳過不可見作品及沒有譯名的作品。 每個 ID 都必須是正整數；空項目或無效 ID 會使整個請求傳回 400。
NovelGalleryController.translatedTitles.GET.success=小說譯名。
NovelGalleryController.getNovelEmbeddedImage.GET.summary=檢視小說內嵌插圖
NovelGalleryController.getNovelEmbeddedImage.GET.description=按小說 ID 和正文中的 imageId 讀取已下載的內嵌圖。imageId 接受 1–40 個 ASCII 字母、數字、下劃線或連字元，找不到時返回 404。
NovelGalleryController.getNovelEmbeddedImage.GET.success=小說內嵌插圖。
NovelGalleryController.getSeries.GET.summary=檢視小說系列詳情
NovelGalleryController.getSeries.GET.description=讀取已收錄小說系列的後設資料。可提供 lang 或 variant 讀取已儲存的系列標題和簡介譯文。
NovelGalleryController.getSeries.GET.success=小說系列詳情。
NovelGalleryController.getSeriesCover.GET.summary=檢視小說系列封面
NovelGalleryController.getSeriesCover.GET.description=讀取本地封面的影象位元組，按響應 Content-Type 解碼。找不到封面檔案時返回 404。
NovelGalleryController.getSeriesCover.GET.success=小說系列封面。
NovelGalleryController.downloadedBatch.POST.summary=查詢多篇小說的下載狀態
NovelGalleryController.downloadedBatch.POST.description=檢查 novelIds 中哪些小說已完整下載。includeDeleted=true 且訪問範圍允許時，另行返回已刪除記錄的 ID。
NovelGalleryController.downloadedBatch.POST.success=多篇小說的下載狀態。
