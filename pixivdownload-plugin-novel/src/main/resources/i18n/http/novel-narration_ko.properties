NarrationController.script.POST.success=장별 낭독 대본.
NarrationController.cast.GET.summary=현재 등장인물 명단 조회
NarrationController.cast.GET.description=로컬 novelId의 기본 배역과 음성을 조회합니다. 소설이 없으면 404이며 아직 명단이 없으면 castId=null과 기본 내레이터를 반환합니다.
NarrationController.cast.GET.success=현재 등장인물 명단.
