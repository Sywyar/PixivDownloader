NarrationReferenceVoiceController.preview.GET.description=castId와 characterId에 저장한 참조 오디오 바이트를 반환합니다. 녹음이 없으면 404입니다.
NarrationReferenceVoiceController.preview.GET.success=저장된 참조 녹음.
