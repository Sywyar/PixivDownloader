NarrationTtsController.line.POST.success=대사 한 줄의 음성.
NarrationTtsController.preview.POST.summary=음색 미리듣기 생성
NarrationTtsController.preview.POST.description=최대 4000자의 입력 텍스트로 음성을 미리 듣습니다. 성공 응답의 Content-Type에서 오디오 형식을 확인하세요.
NarrationTtsController.preview.POST.success=음색 미리듣기.
