NarrationReferenceVoiceController.generate.POST.description=castId와 characterId의 참조 음성을 생성합니다. text가 비면 기본 대사를 쓰고 샘플이 너무 짧으면 422입니다.
NarrationReferenceVoiceController.generate.POST.success=등장인물 참조 음성.
NarrationReferenceVoiceController.upload.POST.summary=참조 녹음 업로드
NarrationReferenceVoiceController.upload.POST.description=multipart/form-data로 castId, characterId 및 비어 있지 않은 WAV 또는 MP3 오디오 file을 보냅니다. 최대 8 MiB이며 내용은 선언 형식과 일치해야 합니다. refText에 녹취문을 전달할 수 있습니다. 오디오는 최대 60초, 1~2채널, 8~96 kHz여야 합니다. WAV는 8, 16, 24, 32비트 PCM을 허용합니다.
NarrationReferenceVoiceController.upload.POST.success=참조 녹음을 업로드했습니다.
