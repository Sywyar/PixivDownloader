NarrationController.novelDefaultCast.GET.description=소설의 기본 배역 연결을 조회합니다. 아직 생성하지 않았으면 castId가 null이며 생성할 때 쓸 제안 이름을 반환합니다.
NarrationController.novelDefaultCast.GET.success=소설 기본 등장인물 명단.
NarrationController.castVoices.GET.summary=등장인물 음색 목록 조회
NarrationController.castVoices.GET.description=배역 명단 id로 캐릭터, 음성 지시문과 참조 오디오 상태를 조회합니다. 명단이 없으면 404입니다.
NarrationController.castVoices.GET.success=등장인물 음색.
NarrationController.updateVoice.PUT.summary=등장인물 음색 수정
NarrationController.updateVoice.PUT.description=characterId에 비어 있지 않은 controlInstruction을 저장합니다. 양수 castId를 우선하고 없으면 novelId로 기본 명단을 찾거나 만듭니다. 성공 시 본문 없는 HTTP 200입니다.
NarrationController.updateVoice.PUT.success=등장인물 음색을 변경했습니다.
