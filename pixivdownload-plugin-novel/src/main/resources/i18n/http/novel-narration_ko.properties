NarrationController.listCasts.GET.description=저장한 배역 명단의 ID, 이름, 연결된 작품과 음성 수를 반환합니다. id로 개별 캐릭터를 조회합니다.
NarrationController.listCasts.GET.success=등장인물 명단.
NarrationController.createCast.POST.summary=등장인물 명단 생성
NarrationController.createCast.POST.description=seriesId 또는 novelId에 연결합니다. 둘 다 생략하면 독립 항목을 생성하며 같은 연결의 기존 항목이 있으면 재사용합니다.
NarrationController.createCast.POST.success=등장인물 명단을 생성했습니다.
