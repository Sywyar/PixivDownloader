title=Novel downloads
NovelBrowserImportController.issueImportToken.GET.summary=Issue a browser import token
NovelBrowserImportController.issueImportToken.GET.description=In local solo mode, issue a one-use import token. Send it as X-Novel-Import-Token before expiresInSeconds elapses.
NovelBrowserImportController.issueImportToken.GET.success=Browser import token created.
NovelBrowserImportController.importNovel.POST.summary=Import a novel from the browser
NovelBrowserImportController.importNovel.POST.description=Send the UTF-8 Pixiv novel response and a one-use X-Novel-Import-Token, up to 4 MiB. body.id must match the path ID. Pass the returned fetchToken to POST /api/novel/download.
NovelBrowserImportController.importNovel.POST.success=Novel from the browser.
NovelDownloadController.downloadNovel.POST.summary=Start a novel download
NovelDownloadController.downloadNovel.POST.description=Start an asynchronous novel download by novelId. Use a fetchToken returned by novel metadata or browser import if available. HTTP 200 can also report an existing copy. Poll download status by novelId. Program key clients submit to POST /api/download/tasks with workType="novel".
NovelDownloadController.downloadNovel.POST.success=Novel download.
NovelDownloadController.getStatus.GET.summary=Get novel download progress
NovelDownloadController.getStatus.GET.description=Look up the visible novel download, including stage, progress and error. An absent or invisible task returns HTTP 200 with success=false.
NovelDownloadController.getStatus.GET.success=Novel download progress.
NovelDownloadController.getTranslateStatus.GET.summary=Get novel translation progress
NovelDownloadController.getTranslateStatus.GET.description=Read the state and progress of post-download translation for this novel. No state record returns 204.
NovelDownloadController.getTranslateStatus.GET.success=Novel translation progress.
NovelDownloadController.novelDownloadedState.GET.summary=Get local novel download status
NovelDownloadController.novelDownloadedState.GET.description=Check download history and local file completeness. Deleted history records report downloaded=true and deleted=true. Other records count as downloaded only when their files are complete.
NovelDownloadController.novelDownloadedState.GET.success=Local novel download status.
NovelDownloadController.mergeSeries.POST.summary=Create a collected edition
NovelDownloadController.mergeSeries.POST.description=Build a volume from local series chapters. The default format is epub. variant takes precedence over lang. Omit both for the original. Returns the saved path, chapter count and format.
NovelDownloadController.mergeSeries.POST.success=Collected edition created.
NovelDownloadController.downloadMergedSeries.GET.summary=Download a collected edition
NovelDownloadController.downloadMergedSeries.GET.description=Rebuild the volume from current local series data and download it as an attachment, defaulting to epub. variant takes precedence over lang. No available file returns 404.
NovelDownloadController.downloadMergedSeries.GET.success=Collected edition.
NovelDownloadController.translateNovel.POST.summary=Translate a downloaded novel
NovelDownloadController.translateNovel.POST.description=Translate selected parts of a local novel. Supply the target language and select at least one of body, title or description. Use the returned langCode and variantKey to read the translation.
NovelDownloadController.translateNovel.POST.success=Downloaded novel.
NovelDownloadController.translateLangProbe.POST.summary=Look up a translation language code
NovelDownloadController.translateLangProbe.POST.description=Resolve the target language to an engine language code. Check valid. An unrecognized language produces an empty code.
NovelDownloadController.translateLangProbe.POST.success=Translation language code.
NovelDownloadController.translateSeriesTitle.POST.summary=Translate a series title
NovelDownloadController.translateSeriesTitle.POST.description=Translate a local novel series title or description. Supply the target language and select translateTitle, translateDescription or both.
NovelDownloadController.translateSeriesTitle.POST.success=Series title.
NovelDownloadController.seriesNovelIds.GET.summary=List novel IDs in a series
NovelDownloadController.seriesNovelIds.GET.description=List IDs of novels recorded locally for this series, for selecting chapters to merge or translate.
NovelDownloadController.seriesNovelIds.GET.success=Novel IDs in a series.
NovelDownloadLegacyForwardController.forwardDownload.POST.summary=Forward a novel download request
NovelDownloadLegacyForwardController.forwardDownload.POST.description=Forward the original request to POST /api/novel/download with the same download parameters, path-conflict handling and result. Program key clients submit to POST /api/download/tasks with workType="novel".
NovelDownloadLegacyForwardController.forwardDownload.POST.success=Novel download request.
NovelDownloadLegacyForwardController.forwardStatus.GET.summary=Forward a download status request
NovelDownloadLegacyForwardController.forwardStatus.GET.description=Forward to GET /api/novel/status/{novelId} and return current download status for that same novel.
NovelDownloadLegacyForwardController.forwardStatus.GET.success=Download status request.
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.summary=Forward a translation status request
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.description=Forward to GET /api/novel/translate-status/{novelId} and return automatic translation progress for that novel.
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.success=Translation status request.
