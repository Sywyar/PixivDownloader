schema.DownloadSubmission.novel.description=The server fetches the text and metadata from Pixiv and saves the whole novel as `txt` (default), `html` or `epub`. Novels do not accept `pages`. Cover and embedded images are best effort. Images obtained are committed with the text and library record. Pixiv bookmarking and local collection membership are optional. With `autoTranslate`, translation is submitted separately after the download completes. A translation failure leaves the saved novel intact. Read the work at `GET /api/gallery/novel/{novelId}` and check translation at `GET /api/novel/translate-status/{novelId}`.
description=Submit novel downloads, inspect status and process downloaded text.
