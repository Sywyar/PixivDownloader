title=小说书库
NovelExportController.download.GET.summary=下载小说 EPUB 文件
NovelExportController.download.GET.description=下载单部本地小说的 EPUB 附件。variant 可使用此作品已有的译文版本；省略时导出原文。文件超过 64 MiB 返回 413。
NovelExportController.download.GET.success=小说 EPUB 文件。
NovelGalleryController.listNovels.GET.summary=分页查看本地小说
NovelGalleryController.listNovels.GET.description=分页浏览调用者可见的本地库。page 从 0 开始；ID 集合按逗号分隔，可使用 tagIds、notTagIds、orTagIds 组合标签条件。 每个 ID 必须是正整数；空项或无效 ID 会使整个请求返回 400。
NovelGalleryController.listNovels.GET.success=本地小说。
NovelGalleryController.listAuthors.GET.summary=列出小说作者
NovelGalleryController.listAuthors.GET.description=分页搜索可见本地小说的作者。page 从 0 开始，size 默认 24，默认按名称排序。
NovelGalleryController.listAuthors.GET.success=小说作者。
NovelGalleryController.listNovelSeries.GET.summary=列出本地小说系列
NovelGalleryController.listNovelSeries.GET.description=分页搜索本地小说系列。page 从 0 开始，size 默认 24，默认按标题排序。
NovelGalleryController.listNovelSeries.GET.success=本地小说系列。
NovelGalleryController.listNovelTags.GET.summary=列出小说标签
NovelGalleryController.listNovelTags.GET.description=用 search 搜索本地标签，用 limit 控制候选数量。返回的标签 ID 可用于作品列表筛选。
NovelGalleryController.listNovelTags.GET.success=小说标签。
NovelGalleryController.findNovel.GET.summary=查看小说详情
NovelGalleryController.findNovel.GET.description=按 Pixiv 作品 ID 读取本地保存的详情，访问范围取决于调用者可见的作品记录。
NovelGalleryController.findNovel.GET.success=小说详情。
NovelGalleryController.deleteNovel.DELETE.summary=删除已保存的小说
NovelGalleryController.deleteNovel.DELETE.description=删除一条本地作品记录，成功时返回 deleted=1，找不到时返回 404。
NovelGalleryController.deleteNovel.DELETE.success=已移除已保存的小说。
NovelGalleryController.deleteNovels.POST.summary=删除选中的小说
NovelGalleryController.deleteNovels.POST.description=按 ids 或当前筛选条件删除匹配的本地作品。excludeIds 从最终选择中剔除，返回实际删除数量。 空筛选会选中该库全部有效作品。分页和排序不会缩小批量范围。 若筛选归一化后没有条件，删除前必须设置 confirmAll=true。
NovelGalleryController.deleteNovels.POST.success=已移除选中的小说。
NovelGalleryController.collectNovels.POST.summary=添加多篇小说到收藏夹
NovelGalleryController.collectNovels.POST.description=将选中的作品加入请求指定的本地收藏夹。count 为选中的数量，changed 为本次实际变更数量。 空筛选会选中该库全部有效作品。分页和排序不会缩小批量范围。
NovelGalleryController.collectNovels.POST.success=已添加多篇小说到收藏夹。
NovelGalleryController.exportOptions.POST.summary=列出小说导出选项
NovelGalleryController.exportOptions.POST.description=计算所选全部小说共同拥有的译文版本。将 variants 中的值传给相同选择的批量导出。 空筛选会选中该库全部有效作品。分页和排序不会缩小批量范围。
NovelGalleryController.exportOptions.POST.success=小说导出选项。
NovelGalleryController.exportNovels.POST.summary=导出选中的小说
NovelGalleryController.exportNovels.POST.description=按所选 ID 或筛选条件创建归档，排除 excludeIds。成功返回 archiveToken、有效秒数和数量；无可归档的文件时返回 204。 空筛选会选中该库全部有效作品。分页和排序不会缩小批量范围。 若筛选归一化后没有条件，删除前必须设置 confirmAll=true。 导出后删除还要求程序密钥具备 novel:library.delete 权限。仅导出时会排除其他作品的只读导入文件及当前受管目录。
NovelGalleryController.exportNovels.POST.success=选中的小说。
NovelGalleryController.bySeries.GET.summary=列出同系列小说
NovelGalleryController.bySeries.GET.description=从一部可见作品的 ID 确定所属系列，列出同系列可见作品。limit 默认 30。
NovelGalleryController.bySeries.GET.success=同系列小说。
NovelGalleryController.seriesNav.GET.summary=查看小说系列导航
NovelGalleryController.seriesNav.GET.description=根据作品 ID 返回系列内前后相邻作品和位置信息。不存在系列关系或可见邻项时，相应字段可以为 null。
NovelGalleryController.seriesNav.GET.success=小说系列导航。
NovelGalleryController.getNovelCover.GET.summary=查看小说封面
NovelGalleryController.getNovelCover.GET.description=读取本地封面的图像字节，按响应 Content-Type 解码。找不到封面文件时返回 404。
NovelGalleryController.getNovelCover.GET.success=小说封面。
NovelGalleryController.getNovelContent.GET.summary=查看小说正文
NovelGalleryController.getNovelContent.GET.description=返回本地原文，并按 lang 或 variant 读取已有译文。只有部分内容译好时，标题、简介、正文的译文可能分别缺失。
NovelGalleryController.getNovelContent.GET.success=小说正文。
NovelGalleryController.translatedTitles.GET.summary=查询小说译名
NovelGalleryController.translatedTitles.GET.description=以逗号分隔的 ids 批量查找指定语言的译名。结果按小说 ID 映射，跳过不可见作品及没有译名的作品。 每个 ID 必须是正整数；空项或无效 ID 会使整个请求返回 400。
NovelGalleryController.translatedTitles.GET.success=小说译名。
NovelGalleryController.getNovelEmbeddedImage.GET.summary=查看小说内嵌插图
NovelGalleryController.getNovelEmbeddedImage.GET.description=按小说 ID 和正文中的 imageId 读取已下载的内嵌图。imageId 接受 1–40 个 ASCII 字母、数字、下划线或连字符，找不到时返回 404。
NovelGalleryController.getNovelEmbeddedImage.GET.success=小说内嵌插图。
NovelGalleryController.getSeries.GET.summary=查看小说系列详情
NovelGalleryController.getSeries.GET.description=读取已收录小说系列的元数据。可提供 lang 或 variant 读取已保存的系列标题和简介译文。
NovelGalleryController.getSeries.GET.success=小说系列详情。
NovelGalleryController.getSeriesCover.GET.summary=查看小说系列封面
NovelGalleryController.getSeriesCover.GET.description=读取本地封面的图像字节，按响应 Content-Type 解码。找不到封面文件时返回 404。
NovelGalleryController.getSeriesCover.GET.success=小说系列封面。
NovelGalleryController.downloadedBatch.POST.summary=查询多篇小说的下载状态
NovelGalleryController.downloadedBatch.POST.description=检查 novelIds 中哪些小说已完整下载。includeDeleted=true 且访问范围允许时，另行返回已删除记录的 ID。
NovelGalleryController.downloadedBatch.POST.success=多篇小说的下载状态。
