title=Pixiv 小说
NovelPixivProxyController.getNovelMeta.GET.summary=查看Pixiv 小说元数据
NovelPixivProxyController.getNovelMeta.GET.description=查询 Pixiv 小说元数据，同时签发与该小说绑定的 fetchToken，可用于 POST /api/novel/download。
NovelPixivProxyController.getNovelMeta.GET.success=Pixiv 小说元数据。
NovelPixivProxyController.getNovelBookmarkCount.GET.summary=查看小说收藏数
NovelPixivProxyController.getNovelBookmarkCount.GET.description=查询该小说当前的 Pixiv 收藏数，不下载小说正文。
NovelPixivProxyController.getNovelBookmarkCount.GET.success=小说收藏数。
NovelPixivProxyController.getNovelSeries.GET.summary=查看Pixiv 小说系列
NovelPixivProxyController.getNovelSeries.GET.description=按 Pixiv 系列 ID 读取系列资料及指定页的作品。页码从 1 开始。
NovelPixivProxyController.getNovelSeries.GET.success=Pixiv 小说系列。
NovelPixivProxyController.searchNovels.GET.summary=搜索Pixiv 小说
NovelPixivProxyController.searchNovels.GET.description=word 为关键词，页码从 1 开始。order 支持 date_d、date、popular_d，mode 支持 all、safe、r18，sMode 支持 s_tag、s_tc。范围查询时按每页 24 条估算，实际条数由 Pixiv 决定，无法指定 pageSize。total 是 Pixiv 报告的作品数。
NovelPixivProxyController.searchNovels.GET.success=Pixiv 小说。
NovelPixivProxyController.rangeSearchNovels.GET.summary=搜索指定范围的小说
NovelPixivProxyController.rangeSearchNovels.GET.description=按闭区间抓取搜索页，并按作品 ID 去重。响应区分 requestedPages、acceptedPages 和 fetchedPages；到达 Pixiv 最后一页可能提前结束。 本接口按每页 24 条估算末页，单页实际返回的条数可能不同。
NovelPixivProxyController.rangeSearchNovels.GET.success=指定范围的小说。
NovelPixivProxyController.getUserNovels.GET.summary=列出Pixiv 作者的小说
NovelPixivProxyController.getUserNovels.GET.description=返回该作者的作品 ID，按数值从大到小排列。需要卡片时将所选 ID 传给同一作者的 cards 接口。
NovelPixivProxyController.getUserNovels.GET.success=Pixiv 作者的小说。
NovelPixivProxyController.getUserNovelCards.GET.summary=列出作者的小说卡片
NovelPixivProxyController.getUserNovelCards.GET.description=传入同一作者的 ids 列表，例如 ids=123&ids=456。结果按请求的 ID 顺序排列。
NovelPixivProxyController.getUserNovelCards.GET.success=作者的小说卡片。
NovelPixivProxyController.getMyNovelBookmarks.GET.summary=列出当前账号收藏的小说
NovelPixivProxyController.getMyNovelBookmarks.GET.description=需要能识别当前 Pixiv 用户的采集凭据，否则返回 400 ACQUISITION_CREDENTIAL_REQUIRED。rest=show 获取公开项，hide 获取非公开项。offset 从 0 开始，limit 限定为 1–100。
NovelPixivProxyController.getMyNovelBookmarks.GET.success=当前账号收藏的小说。
parameter.userId=作者的 Pixiv 用户 ID。
parameter.X-Acquisition-Credential=请求 Pixiv 上游时使用的 Pixiv 会话 Cookie。可选，查看账号专属内容时需要。去除首尾空白后最多 16384 字符。 公开查询成功并不验证 Cookie 有效期。 普通单凭据代理请求若被 Pixiv 以 401 或 403 拒绝，本服务返回 502 error.pixiv.upstream.unauthorized。
parameter.novelId=Pixiv 小说 ID。
parameter.seriesId=作品或小说系列的 ID。
parameter.word=Pixiv 搜索关键词。
parameter.mode=搜索模式支持 all、safe、r18。mode=r18 会原样传给 Pixiv。匿名搜索（没有有效的 Pixiv Cookie）或账号隐藏年龄限制作品时，上游可能返回全年龄作品或空结果。请按每项的 xRestrict 判断分级（0 全年龄、1 R-18、2 R-18G）。
parameter.sMode=Pixiv 匹配搜索词的方式。
parameter.startPage=搜索范围的起始页。
parameter.endPage=搜索范围的结束页。
parameter.rest=当前账号条目的 Pixiv 公开范围筛选条件。
parameter.tag=筛选列表时使用的收藏标签。
