title=Novel glossaries
NovelGlossaryController.list.GET.summary=List glossaries
NovelGlossaryController.list.GET.description=List glossary summaries, entry counts and series or novel bindings. Use id to read a glossary’s entries.
NovelGlossaryController.list.GET.success=Glossaries.
NovelGlossaryController.create.POST.summary=Create a glossary
NovelGlossaryController.create.POST.description=Bind to a local seriesId or novelId, or omit both to create an independent record. An existing record with the same binding is reused.
NovelGlossaryController.create.POST.success=Glossary created.
NovelGlossaryController.get.GET.summary=Get glossary entries
NovelGlossaryController.get.GET.description=Read a glossary with all its source terms, translation languages and translated terms. A missing glossary returns 404.
NovelGlossaryController.get.GET.success=Glossary entries.
NovelGlossaryController.rename.PUT.summary=Rename a glossary
NovelGlossaryController.rename.PUT.description=Rename the glossary using a nonblank name. Success returns the updated summary.
NovelGlossaryController.rename.PUT.success=Glossary updated.
NovelGlossaryController.replaceEntries.PUT.summary=Replace glossary entries
NovelGlossaryController.replaceEntries.PUT.description=Replace all glossary entries. Each entry has the source term, lang for the translation language and target for the translated term. An empty array clears the glossary.
NovelGlossaryController.replaceEntries.PUT.success=Glossary entries replaced.
NovelGlossaryController.delete.DELETE.summary=Delete a glossary
NovelGlossaryController.delete.DELETE.description=Delete the specified glossary. Returns 204 on success or 404 if it does not exist.
NovelGlossaryController.delete.DELETE.success=Glossary removed.
NovelGlossaryController.novelDefault.GET.summary=Get a novel's default glossary
NovelGlossaryController.novelDefault.GET.description=Read the default glossary. If none exists, id is null and the response supplies a suggested name and binding. Novels in a series share its default glossary.
NovelGlossaryController.novelDefault.GET.success=Novel's default glossary.
NovelGlossaryController.seriesDefault.GET.summary=Get a series' default glossary
NovelGlossaryController.seriesDefault.GET.description=Read the default glossary. If none exists, id is null and the response supplies a suggested name and binding. Novels in a series share its default glossary.
NovelGlossaryController.seriesDefault.GET.success=Series' default glossary.
parameter.seriesId=Identifier of the artwork or novel series.
