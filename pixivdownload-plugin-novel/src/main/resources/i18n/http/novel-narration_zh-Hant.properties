title=小說朗讀
NarrationController.availability.GET.summary=檢視朗讀功能可用狀態
NarrationController.availability.GET.description=分別返回朗讀引擎是否可用、除錯模式是否開啟、用於指令碼分析的文字模型是否已配置。
NarrationController.availability.GET.success=朗讀功能可用狀態。
NarrationController.narratorPresets.GET.summary=列出旁白音色預設
NarrationController.narratorPresets.GET.description=列出內建旁白預設，每項返回預設 id 和音色指令 instruction，供生成指令碼時選擇。
NarrationController.narratorPresets.GET.success=旁白音色預設。
NarrationController.script.POST.summary=生成章節分句朗讀指令碼
NarrationController.script.POST.description=按 novelId 和 lang 讀取逐句指令碼。快取優先，force=true 重新分析。analyzeIfMissing=false 且沒有快取時返回 204，分析需要可用的 AI 服務。
NarrationController.script.POST.success=章節分句朗讀指令碼。
NarrationController.cast.GET.summary=檢視當前角色名冊
NarrationController.cast.GET.description=按本地 novelId 解析預設名冊並列出音色。小說不存在時返回 404，尚未建冊時 castId 為 null，並提供預設旁白。
NarrationController.cast.GET.success=當前角色名冊。
NarrationController.listCasts.GET.summary=列出角色名冊
NarrationController.listCasts.GET.description=列出已儲存名冊的 ID、名稱、繫結作品和音色數量，用 id 查詢具體角色。
NarrationController.listCasts.GET.success=角色名冊。
NarrationController.createCast.POST.summary=建立角色名冊
NarrationController.createCast.POST.description=可用 seriesId 或 novelId 繫結到本地系列或單本小說，或省略繫結建立獨立記錄。已有相同繫結時複用現有記錄。
NarrationController.createCast.POST.success=已建立角色名冊。
NarrationController.novelDefaultCast.GET.summary=檢視小說預設角色名冊
NarrationController.novelDefaultCast.GET.description=返回小說的預設名冊繫結。尚未建立時 castId 為 null，並返回可用於建立名冊的建議名稱。
NarrationController.novelDefaultCast.GET.success=小說預設角色名冊。
NarrationController.castVoices.GET.summary=列出角色音色
NarrationController.castVoices.GET.description=按名冊 id 返回角色、音色指令和參考音訊狀態；沒有此名冊時返回 404。
NarrationController.castVoices.GET.success=角色音色。
NarrationController.updateVoice.PUT.summary=更新角色音色
NarrationController.updateVoice.PUT.description=為 characterId 儲存非空 controlInstruction。優先使用正數 castId，否則使用 novelId 解析或建立預設名冊；成功返回 HTTP 200 空正文。
NarrationController.updateVoice.PUT.success=已更新角色音色。
NarrationReferenceVoiceController.generate.POST.summary=生成角色參考音
NarrationReferenceVoiceController.generate.POST.description=為指定 castId 和 characterId 生成參考錄音。text 留空使用內建臺詞；無法獲得足夠長度的樣本時返回 422。
NarrationReferenceVoiceController.generate.POST.success=角色參考音。
NarrationReferenceVoiceController.upload.POST.summary=上傳參考錄音
NarrationReferenceVoiceController.upload.POST.description=以 multipart/form-data 上傳 castId、characterId 和非空 WAV 或 MP3 音訊檔案 file。檔案最多 8 MiB，檔案內容須匹配宣告格式；可用 refText 提供錄音文字。 音訊最長 60 秒，1–2 聲道，取樣率 8–96 kHz；WAV 接受 8、16、24 或 32 位 PCM。
NarrationReferenceVoiceController.upload.POST.success=已上傳參考錄音。
NarrationReferenceVoiceController.delete.DELETE.summary=刪除角色參考錄音
NarrationReferenceVoiceController.delete.DELETE.description=刪除指定名冊角色的參考錄音。成功返回 HTTP 200 空正文。
NarrationReferenceVoiceController.delete.DELETE.success=已移除角色參考錄音。
NarrationReferenceVoiceController.preview.GET.summary=檢視已儲存的參考錄音
NarrationReferenceVoiceController.preview.GET.description=按 castId 和 characterId 回放已儲存的參考錄音。返回原始音訊位元組，未儲存錄音時返回 404。
NarrationReferenceVoiceController.preview.GET.success=已儲存的參考錄音。
NarrationTtsController.line.POST.summary=生成單句臺詞音訊
NarrationTtsController.line.POST.description=以本地 novelId、lang 和從 0 開始的 lineIndex 合成已分析指令碼中的一句，成功響應為音訊位元組。
NarrationTtsController.line.POST.success=單句臺詞音訊。
NarrationTtsController.preview.POST.summary=生成音色試聽片段
NarrationTtsController.preview.POST.description=為給定文字試聽音色。文字限 4000 個字元，成功響應的 Content-Type 標識音訊格式。
NarrationTtsController.preview.POST.success=音色試聽片段。
