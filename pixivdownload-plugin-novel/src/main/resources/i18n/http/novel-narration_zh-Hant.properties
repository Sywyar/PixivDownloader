NarrationReferenceVoiceController.upload.POST.body=在 file 欄位中上傳參考錄音。 在 cURL 範例中，`INSTANCE` 是執行個體的來源位址（含通訊協定及連接埠，結尾不加斜線），`PROGRAM_KEY` 是有權呼叫此操作的金鑰。 透過 `GET /api/narration/casts` 取得 `CAST_ID`，再從 `GET /api/narration/casts/{id}/voices` 的 `voices[].id` 取得 `CHARACTER_ID`。將 `reference.wav` 換成錄音檔。選填的 `refText` 是錄音的逐字稿。
