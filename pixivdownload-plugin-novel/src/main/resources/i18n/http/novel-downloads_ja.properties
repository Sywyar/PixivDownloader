schema.DownloadSubmission.novel.description=サーバーは Pixiv から本文とメタデータを取得し、小説全体を `txt`（既定）、`html`、`epub` のいずれかで保存します。小説は `pages` を受け付けません。表紙と挿絵は取得できたものを本文・作品記録と一緒に確定します。Pixiv ブックマークとローカルコレクションへの追加は任意です。`autoTranslate` はダウンロード完了後に翻訳を別途依頼します。翻訳に失敗しても小説は残ります。作品情報は `GET /api/gallery/novel/{novelId}`、翻訳状況は `GET /api/novel/translate-status/{novelId}` で確認できます。
description=小説のダウンロードを送信し、状態の確認や保存済み本文の処理を行います。
