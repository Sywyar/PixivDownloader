title=小説のダウンロード
NovelBrowserImportController.issueImportToken.GET.summary=ブラウザー取り込み用トークンを発行
NovelBrowserImportController.issueImportToken.GET.description=ローカル solo モードで一度限りのインポートトークンを発行します。expiresInSeconds 内に X-Novel-Import-Token に指定します。
NovelBrowserImportController.issueImportToken.GET.success=ブラウザー取り込み用トークンを作成しました。
NovelBrowserImportController.importNovel.POST.summary=ブラウザー上の小説を取り込む
NovelBrowserImportController.importNovel.POST.description=UTF-8 の Pixiv 小説応答（最大 4 MiB）を一度限りの X-Novel-Import-Token とともに送ります。body.id はパス ID に合わせ、返された fetchToken を POST /api/novel/download に渡します。
NovelBrowserImportController.importNovel.POST.success=ブラウザー上の小説。
NovelDownloadController.downloadNovel.POST.summary=小説のダウンロードを開始
NovelDownloadController.downloadNovel.POST.description=novelId で非同期ダウンロードを開始します。メタデータ取得またはブラウザー登録の fetchToken を指定できます。保存済みでも HTTP 200 です。状態は novelId で取得します。 プログラムキーでは POST /api/download/tasks に workType="novel" を指定してください。
NovelDownloadController.downloadNovel.POST.success=小説のダウンロード。
NovelDownloadController.getStatus.GET.summary=小説のダウンロード進捗を取得
NovelDownloadController.getStatus.GET.description=閲覧可能な小説ダウンロードの段階・進捗・エラーを取得します。該当がない場合は HTTP 200 と success=false です。
NovelDownloadController.getStatus.GET.success=小説のダウンロード進捗。
NovelDownloadController.getTranslateStatus.GET.summary=小説の翻訳状況を取得
NovelDownloadController.getTranslateStatus.GET.description=小説のダウンロード後自動翻訳の状態と進捗を取得します。状態記録がなければ 204 です。
NovelDownloadController.getTranslateStatus.GET.success=小説の翻訳状況。
NovelDownloadController.novelDownloadedState.GET.summary=小説のローカル保存状況を取得
NovelDownloadController.novelDownloadedState.GET.description=ダウンロード履歴とファイルの完全性を調べます。削除済みの履歴は downloaded=true、deleted=true。他はファイルが揃っている場合に downloaded=true です。
NovelDownloadController.novelDownloadedState.GET.success=小説のローカル保存状況。
NovelDownloadController.mergeSeries.POST.summary=小説シリーズの合本を作成
NovelDownloadController.mergeSeries.POST.description=保存済みのシリーズ全章を合本にします。既定形式は epub。variant が lang より優先され、両方省略で原文です。保存先、章数、形式を返します。
NovelDownloadController.mergeSeries.POST.success=小説シリーズの合本を作成しました。
NovelDownloadController.downloadMergedSeries.GET.summary=小説シリーズの合本をダウンロード
NovelDownloadController.downloadMergedSeries.GET.description=現在のローカルシリーズ情報から合本を再生成し、添付ファイルとして取得します。既定は epub で variant が lang より優先されます。該当ファイルがなければ 404 です。
NovelDownloadController.downloadMergedSeries.GET.success=小説シリーズの合本。
NovelDownloadController.translateNovel.POST.summary=ダウンロード済みの小説を翻訳
NovelDownloadController.translateNovel.POST.description=ローカル小説の対象部分を翻訳します。翻訳先言語と本文・題名・説明のうち 1 つ以上を指定します。訳文の取得には langCode と variantKey を使います。
NovelDownloadController.translateNovel.POST.success=ダウンロード済みの小説。
NovelDownloadController.translateLangProbe.POST.summary=翻訳言語のコードを照会
NovelDownloadController.translateLangProbe.POST.description=対象言語をエンジンの言語コードに解決します。valid を確認してください。認識できなければ code は空です。
NovelDownloadController.translateLangProbe.POST.success=翻訳言語のコード。
NovelDownloadController.translateSeriesTitle.POST.summary=小説シリーズのタイトルを翻訳
NovelDownloadController.translateSeriesTitle.POST.description=ローカル小説シリーズの題名または説明を翻訳します。翻訳先言語と translateTitle、translateDescription のいずれかを指定します。
NovelDownloadController.translateSeriesTitle.POST.success=小説シリーズのタイトル。
NovelDownloadController.seriesNovelIds.GET.summary=シリーズに含まれる小説 IDの一覧
NovelDownloadController.seriesNovelIds.GET.description=ローカルに登録済みのシリーズ各章の小説 ID を返します。合本・翻訳対象の選択に使えます。
NovelDownloadController.seriesNovelIds.GET.success=シリーズに含まれる小説 ID。
NovelDownloadLegacyForwardController.forwardDownload.POST.summary=小説のダウンロード要求を転送
NovelDownloadLegacyForwardController.forwardDownload.POST.description=元のリクエストを POST /api/novel/download に転送します。ダウンロード設定、パス競合、応答は転送先と同じです。 プログラムキーでは POST /api/download/tasks に workType="novel" を指定してください。
NovelDownloadLegacyForwardController.forwardDownload.POST.success=小説のダウンロード要求。
NovelDownloadLegacyForwardController.forwardStatus.GET.summary=小説のダウンロード状況の照会を転送
NovelDownloadLegacyForwardController.forwardStatus.GET.description=同じ novelId で GET /api/novel/status/{novelId} に転送し、現在のダウンロード状態を返します。
NovelDownloadLegacyForwardController.forwardStatus.GET.success=小説のダウンロード状況の照会。
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.summary=小説の翻訳状況の照会を転送
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.description=同じ novelId で GET /api/novel/translate-status/{novelId} に転送し、自動翻訳の進捗を返します。
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.success=小説の翻訳状況の照会。
parameter.novelId=Pixiv の小説 ID。
