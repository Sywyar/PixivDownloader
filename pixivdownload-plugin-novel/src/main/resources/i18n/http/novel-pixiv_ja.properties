title=Pixiv 小説
NovelPixivProxyController.getNovelMeta.GET.summary=Pixiv 小説のメタデータを取得
NovelPixivProxyController.getNovelMeta.GET.description=Pixiv 小説のメタデータを取得し、POST /api/novel/download に使用する小説専用の fetchToken を発行します。
NovelPixivProxyController.getNovelMeta.GET.success=Pixiv 小説のメタデータ。
NovelPixivProxyController.getNovelBookmarkCount.GET.summary=小説のブックマーク数を取得
NovelPixivProxyController.getNovelBookmarkCount.GET.description=小説本文をダウンロードせずに Pixiv のブックマーク数を取得します。
NovelPixivProxyController.getNovelBookmarkCount.GET.success=小説のブックマーク数。
NovelPixivProxyController.getNovelSeries.GET.summary=Pixiv の小説シリーズを取得
NovelPixivProxyController.getNovelSeries.GET.description=Pixiv のシリーズ ID を使い、シリーズ情報と指定ページの作品を取得します。ページは1始まりです。
NovelPixivProxyController.getNovelSeries.GET.success=Pixiv の小説シリーズ。
NovelPixivProxyController.searchNovels.GET.summary=Pixiv 小説を検索
NovelPixivProxyController.searchNovels.GET.description=word に検索語、ページには1以上を指定します。order は date_d、date、popular_d、mode は all、safe、r18、sMode は s_tag、s_tc です。範囲検索では 1 ページ 24 件として見積もります。実際の件数は Pixiv が決めます。pageSize は指定できません。total は Pixiv が返した作品数です。
NovelPixivProxyController.searchNovels.GET.success=Pixiv 小説。
NovelPixivProxyController.rangeSearchNovels.GET.summary=指定範囲の小説を検索
NovelPixivProxyController.rangeSearchNovels.GET.description=指定範囲の両端を含めて検索し、作品 ID の重複を除きます。requestedPages、acceptedPages、fetchedPages で要求数、許可数、実取得数が分かります。Pixiv の最終ページで終了します。 最終ページは 1 ページ 24 件として推定します。実際のページごとの件数は変動します。
NovelPixivProxyController.rangeSearchNovels.GET.success=指定範囲の小説。
NovelPixivProxyController.getUserNovels.GET.summary=Pixiv 作者の小説の一覧
NovelPixivProxyController.getUserNovels.GET.description=作者の作品 ID を数値の降順で返します。カードが必要な ID を同じ作者の cards API に渡してください。
NovelPixivProxyController.getUserNovels.GET.success=Pixiv 作者の小説。
NovelPixivProxyController.getUserNovelCards.GET.summary=作者の小説カードの一覧
NovelPixivProxyController.getUserNovelCards.GET.description=同一作者の ID を ids=123&ids=456 のように渡します。カードは指定順で返ります。
NovelPixivProxyController.getUserNovelCards.GET.success=作者の小説カード。
NovelPixivProxyController.getMyNovelBookmarks.GET.summary=ログイン中のアカウントのブックマーク小説の一覧
NovelPixivProxyController.getMyNovelBookmarks.GET.description=Pixiv アカウントを識別できる取得用認証情報が必要です。なければ400 ACQUISITION_CREDENTIAL_REQUIREDです。rest=show は公開、hide は非公開を選びます。offset は0始まり、limit は1～100です。
NovelPixivProxyController.getMyNovelBookmarks.GET.success=ログイン中のアカウントのブックマーク小説。
parameter.userId=作者の Pixiv ユーザー ID。
parameter.X-Acquisition-Credential=Pixiv への要求時に使用するセッション Cookie。アカウント固有の情報では必須です。前後空白を除いて最大 16384 文字。 公開情報の取得に成功しても、Cookie の有効期限は確認されません。 単一の認証情報を使うプロキシ要求を Pixiv が 401 または 403 で拒否した場合、本サービスは 502 error.pixiv.upstream.unauthorized を返します。
parameter.novelId=Pixiv の小説 ID。
parameter.seriesId=作品または小説シリーズの ID。
parameter.word=Pixiv の検索キーワード。
parameter.mode=検索モードは all、safe、r18 です。mode=r18 はそのまま Pixiv に送信されます。Pixiv の Cookie を使わず匿名で検索する場合やアカウントが年齢制限作品を非表示にしている場合、全年齢作品が返るか、結果が空になることがあります。各作品の xRestrict（0 は全年齢、1 は R-18、2 は R-18G）で確認してください。
parameter.sMode=Pixiv での検索語の照合方法。
parameter.startPage=検索範囲の開始ページ。
parameter.endPage=検索範囲の終了ページ。
parameter.rest=アカウント内の項目の公開範囲を指定する Pixiv の条件。
parameter.tag=一覧の絞り込みに使うブックマークタグ。
