title=小説の用語集
NovelGlossaryController.list.GET.summary=小説の用語集の一覧
NovelGlossaryController.list.GET.description=用語集の概要、項目数、関連するシリーズまたは小説を取得します。id で全項目を取得できます。
NovelGlossaryController.list.GET.success=小説の用語集。
NovelGlossaryController.create.POST.summary=小説の用語集を作成
NovelGlossaryController.create.POST.description=seriesId または novelId に関連付けます。両方省略で独立した記録を作成します。同じ関連付けの記録は再利用します。
NovelGlossaryController.create.POST.success=小説の用語集を作成しました。
NovelGlossaryController.get.GET.summary=用語集の項目を取得
NovelGlossaryController.get.GET.description=指定用語集の原語・翻訳先言語・訳語をすべて返します。存在しなければ 404 です。
NovelGlossaryController.get.GET.success=用語集の項目。
NovelGlossaryController.rename.PUT.summary=用語集の名前を変更
NovelGlossaryController.rename.PUT.description=空でない name で用語集の名前を変更し、更新後の概要を返します。
NovelGlossaryController.rename.PUT.success=用語集を更新しました。
NovelGlossaryController.replaceEntries.PUT.summary=用語集の全項目を置き換える
NovelGlossaryController.replaceEntries.PUT.description=用語集の全項目を置き換えます。項目は原語 source、訳文言語 lang、訳語 target を持ち、空配列で全項目を削除します。
NovelGlossaryController.replaceEntries.PUT.success=用語集の全項目を置き換えました。
NovelGlossaryController.delete.DELETE.summary=用語集を削除
NovelGlossaryController.delete.DELETE.description=用語集を削除します。成功は 204、存在しなければ 404 です。
NovelGlossaryController.delete.DELETE.success=用語集を削除しました。
NovelGlossaryController.novelDefault.GET.summary=小説の既定の用語集を取得
NovelGlossaryController.novelDefault.GET.description=既定の用語集を取得します。未作成なら id は null で、名前候補と関連付けを返します。シリーズの小説は既定用語集を共有します。
NovelGlossaryController.novelDefault.GET.success=小説の既定の用語集。
NovelGlossaryController.seriesDefault.GET.summary=シリーズの既定の用語集を取得
NovelGlossaryController.seriesDefault.GET.description=既定の用語集を取得します。未作成なら id は null で、名前候補と関連付けを返します。シリーズの小説は既定用語集を共有します。
NovelGlossaryController.seriesDefault.GET.success=シリーズの既定の用語集。
parameter.seriesId=作品または小説シリーズの ID。
parameter.novelId=Pixiv の小説 ID。
