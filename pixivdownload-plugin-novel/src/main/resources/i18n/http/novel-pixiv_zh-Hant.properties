title=Pixiv 小說
NovelPixivProxyController.getNovelMeta.GET.summary=檢視Pixiv 小說後設資料
NovelPixivProxyController.getNovelMeta.GET.description=查詢 Pixiv 小說後設資料，同時簽發與該小說繫結的 fetchToken，可用於 POST /api/novel/download。
NovelPixivProxyController.getNovelMeta.GET.success=Pixiv 小說後設資料。
NovelPixivProxyController.getNovelBookmarkCount.GET.summary=檢視小說收藏數
NovelPixivProxyController.getNovelBookmarkCount.GET.description=查詢該小說當前的 Pixiv 收藏數，不下載小說正文。
NovelPixivProxyController.getNovelBookmarkCount.GET.success=小說收藏數。
NovelPixivProxyController.getNovelSeries.GET.summary=檢視Pixiv 小說系列
NovelPixivProxyController.getNovelSeries.GET.description=按 Pixiv 系列 ID 讀取系列資料及指定頁的作品。頁碼從 1 開始。
NovelPixivProxyController.getNovelSeries.GET.success=Pixiv 小說系列。
NovelPixivProxyController.searchNovels.GET.summary=搜尋Pixiv 小說
NovelPixivProxyController.searchNovels.GET.description=word 為關鍵詞，頁碼從 1 開始。order 支援 date_d、date、popular_d，mode 支援 all、safe、r18，sMode 支援 s_tag、s_tc。範圍查詢以每頁 24 筆估算，實際筆數由 Pixiv 決定，無法指定 pageSize。total 是 Pixiv 回報的作品數。
NovelPixivProxyController.searchNovels.GET.success=Pixiv 小說。
NovelPixivProxyController.rangeSearchNovels.GET.summary=搜尋指定範圍的小說
NovelPixivProxyController.rangeSearchNovels.GET.description=按閉區間抓取搜尋頁，並按作品 ID 去重。響應區分 requestedPages、acceptedPages 和 fetchedPages；到達 Pixiv 最後一頁可能提前結束。 本介面按每頁 24 筆估算末頁，單頁實際回傳的筆數可能不同。
NovelPixivProxyController.rangeSearchNovels.GET.success=指定範圍的小說。
NovelPixivProxyController.getUserNovels.GET.summary=列出Pixiv 作者的小說
NovelPixivProxyController.getUserNovels.GET.description=返回該作者的作品 ID，按數值從大到小排列。需要卡片時將所選 ID 傳給同一作者的 cards 介面。
NovelPixivProxyController.getUserNovels.GET.success=Pixiv 作者的小說。
NovelPixivProxyController.getUserNovelCards.GET.summary=列出作者的小說卡片
NovelPixivProxyController.getUserNovelCards.GET.description=傳入同一作者的 ids 列表，例如 ids=123&ids=456。結果按請求的 ID 順序排列。
NovelPixivProxyController.getUserNovelCards.GET.success=作者的小說卡片。
NovelPixivProxyController.getMyNovelBookmarks.GET.summary=列出當前賬號收藏的小說
NovelPixivProxyController.getMyNovelBookmarks.GET.description=需要能識別當前 Pixiv 使用者的採集憑據，否則返回 400 ACQUISITION_CREDENTIAL_REQUIRED。rest=show 獲取公開項，hide 獲取非公開項。offset 從 0 開始，limit 限定為 1–100。
NovelPixivProxyController.getMyNovelBookmarks.GET.success=當前賬號收藏的小說。
parameter.userId=作者的 Pixiv 使用者 ID。
parameter.X-Acquisition-Credential=請求 Pixiv 上游時使用的 Pixiv 會話 Cookie。可選，檢視賬號專屬內容時需要。去除首尾空白後最多 16384 字元。 公開查詢成功不代表 Cookie 的有效期已獲驗證。 一般單憑據代理請求若被 Pixiv 以 401 或 403 拒絕，本服務回傳 502 error.pixiv.upstream.unauthorized。
parameter.novelId=Pixiv 小說 ID。
parameter.seriesId=作品或小說系列的 ID。
parameter.word=Pixiv 搜尋關鍵詞。
parameter.mode=搜尋模式支援 all、safe、r18。mode=r18 會原樣傳給 Pixiv。匿名搜尋（沒有有效的 Pixiv Cookie）或帳號隱藏年齡限制作品時，上游可能回傳全年齡作品或空結果。請依各項的 xRestrict 判斷分級（0 全年齡、1 R-18、2 R-18G）。
parameter.sMode=Pixiv 匹配搜尋詞的方式。
parameter.startPage=搜尋範圍的起始頁。
parameter.endPage=搜尋範圍的結束頁。
parameter.rest=當前賬號條目的 Pixiv 公開範圍篩選條件。
parameter.tag=篩選列表時使用的收藏標籤。
