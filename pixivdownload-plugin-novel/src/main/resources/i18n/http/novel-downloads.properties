title=小说下载
NovelBrowserImportController.issueImportToken.GET.summary=签发浏览器导入令牌
NovelBrowserImportController.issueImportToken.GET.description=本地 solo 模式签发一次性浏览器导入令牌。将 token 作为 X-Novel-Import-Token 提交，并在 expiresInSeconds 期限内使用。
NovelBrowserImportController.issueImportToken.GET.success=已创建浏览器导入令牌。
NovelBrowserImportController.importNovel.POST.summary=导入浏览器中的小说
NovelBrowserImportController.importNovel.POST.description=发送 UTF-8 编码的 Pixiv 小说原始响应和一次性 X-Novel-Import-Token，body.id 必须匹配路径，最大 4 MiB。返回的 fetchToken 供 POST /api/novel/download 使用。
NovelBrowserImportController.importNovel.POST.success=浏览器中的小说。
NovelDownloadController.downloadNovel.POST.summary=提交小说下载
NovelDownloadController.downloadNovel.POST.description=用 novelId 启动异步小说下载，fetchToken 可使用小说元数据或浏览器导入接口返回的票据。HTTP 200 也可能表示已有副本。按 novelId 查询下载状态。 程序密钥使用 POST /api/download/tasks，设置 workType="novel"。
NovelDownloadController.downloadNovel.POST.success=小说下载。
NovelDownloadController.getStatus.GET.summary=查看小说下载进度
NovelDownloadController.getStatus.GET.description=查询调用者可见的小说下载任务，含当前阶段、进度和错误。没有可见任务时返回 HTTP 200 和 success=false。
NovelDownloadController.getStatus.GET.success=小说下载进度。
NovelDownloadController.getTranslateStatus.GET.summary=查看小说翻译进度
NovelDownloadController.getTranslateStatus.GET.description=读取该小说下载后自动翻译的当前阶段和进度。没有状态记录时返回 204。
NovelDownloadController.getTranslateStatus.GET.success=小说翻译进度。
NovelDownloadController.novelDownloadedState.GET.summary=查看小说的本地下载状态
NovelDownloadController.novelDownloadedState.GET.description=检查小说是否已登记下载。已删除的历史记录也算 downloaded=true，可通过 deleted=true 区分；其余作品需要本地文件完整。
NovelDownloadController.novelDownloadedState.GET.success=小说的本地下载状态。
NovelDownloadController.mergeSeries.POST.summary=创建小说系列合订本
NovelDownloadController.mergeSeries.POST.description=从本地系列章节生成合订本，默认格式为 epub。variant 优先于 lang，均省略时使用原文。返回保存路径、收录章节数和实际格式。
NovelDownloadController.mergeSeries.POST.success=已创建小说系列合订本。
NovelDownloadController.downloadMergedSeries.GET.summary=下载小说系列合订本
NovelDownloadController.downloadMergedSeries.GET.description=按当前数据库内容重新生成系列合订本并作为附件下载，默认 epub。variant 优先于 lang，无法生成可见文件时返回 404。
NovelDownloadController.downloadMergedSeries.GET.success=小说系列合订本。
NovelDownloadController.translateNovel.POST.summary=翻译已下载的小说
NovelDownloadController.translateNovel.POST.description=翻译指定本地小说的选中部分。目标语言必填，正文、标题、简介至少选一项。用结果中的 langCode 和 variantKey 读取译文。
NovelDownloadController.translateNovel.POST.success=已下载的小说。
NovelDownloadController.translateLangProbe.POST.summary=查询翻译语言代码
NovelDownloadController.translateLangProbe.POST.description=将目标语言解析为引擎使用的语言代码。检查响应的 valid，无法识别时 code 为空。
NovelDownloadController.translateLangProbe.POST.success=翻译语言代码。
NovelDownloadController.translateSeriesTitle.POST.summary=翻译小说系列标题
NovelDownloadController.translateSeriesTitle.POST.description=翻译本地小说系列的标题或简介。传入目标语言，选中 translateTitle、translateDescription 中至少一项。
NovelDownloadController.translateSeriesTitle.POST.success=小说系列标题。
NovelDownloadController.seriesNovelIds.GET.summary=列出系列内的小说 ID
NovelDownloadController.seriesNovelIds.GET.description=返回在本地库中登记到该系列的小说 ID 列表，用于选择合订或翻译的章节。
NovelDownloadController.seriesNovelIds.GET.success=系列内的小说 ID。
NovelDownloadLegacyForwardController.forwardDownload.POST.summary=转发小说下载请求
NovelDownloadLegacyForwardController.forwardDownload.POST.description=将原始请求体转交 POST /api/novel/download，使用相同的下载参数、路径冲突处理和结果。 程序密钥使用 POST /api/download/tasks，设置 workType="novel"。
NovelDownloadLegacyForwardController.forwardDownload.POST.success=小说下载请求。
NovelDownloadLegacyForwardController.forwardStatus.GET.summary=转发小说下载状态查询
NovelDownloadLegacyForwardController.forwardStatus.GET.description=以相同 novelId 转交 GET /api/novel/status/{novelId}，返回该小说下载的当前状态。
NovelDownloadLegacyForwardController.forwardStatus.GET.success=小说下载状态查询。
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.summary=转发小说翻译状态查询
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.description=以相同 novelId 转交 GET /api/novel/translate-status/{novelId}，返回该小说的自动翻译进度。
NovelDownloadLegacyForwardController.forwardTranslateStatus.GET.success=小说翻译状态查询。
