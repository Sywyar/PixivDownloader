schema.DownloadSubmission.novel.description=服务端从 Pixiv 取得正文和元数据，整部保存为 `txt`（默认）、`html` 或 `epub`。小说不接受 `pages`。封面和内嵌图片会尽量下载，成功取得的文件随正文和作品记录一同提交。Pixiv 收藏及加入本地收藏夹按选项执行。`autoTranslate` 在下载完成后单独提交翻译，翻译失败不撤销已保存的小说。作品详情见 `GET /api/gallery/novel/{novelId}`，翻译状态见 `GET /api/novel/translate-status/{novelId}`。
description=提交小说下载，查看状态并处理已下载的文本。
