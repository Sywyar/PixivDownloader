sdk.usage=사용법: java -jar sdk-tools.jar prepare|stop <프로젝트>, 또는 run|debug <프로젝트> <현재 빌드 산출물> [--no-gui] [--debug-port=5005] [--debug-connect]. 호스트와 같은 프로세스에서 개발하려면 프로젝트의 .dev 디렉터리에서 develop <프로젝트 절대 경로> <target/classes 절대 경로> [--no-gui]를 사용하세요.
sdk.error=SDK 작업 실패: {0}
sdk.prepared=SDK {0}에 고정된 실행 패키지가 준비되었습니다.
sdk.running=플러그인 {0}({1})을 실행하고 있습니다.
sdk.debug=플러그인 {0}({1})을 디버깅하고 있습니다. 디버그 주소: 127.0.0.1:{2}.
