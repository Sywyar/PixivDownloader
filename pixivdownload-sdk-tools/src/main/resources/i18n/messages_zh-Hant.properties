sdk.usage=用法：java -jar sdk-tools.jar prepare|stop <專案>，或 run|debug <專案> <本次產物> [--no-gui] [--debug-port=5005] [--debug-connect]；在專案的 .dev 目錄中使用 develop <專案絕對路徑> <target/classes 絕對路徑> [--no-gui]，於宿主程序內開發。
sdk.error=SDK 操作失敗：{0}
