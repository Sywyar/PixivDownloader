plugin.id=pixiv-content
plugin.version=1.0.0
plugin.requires=2.0
plugin.class=top.sywyar.pixivdownload.pixivcontent.PixivContentPf4jPlugin
plugin.provider=Sywyar
plugin.description=Browse Pixiv artwork and novels, rankings, creators and series. Read images, APNG animations, illustrated novels and the selected account's bookmarks, follows and collections.
pixiv.display-namespace=pixiv-content
