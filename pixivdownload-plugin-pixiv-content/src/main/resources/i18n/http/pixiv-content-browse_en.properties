title=Pixiv content
description=Read Pixiv works, rankings, bookmarks and new works from followed artists without creating download tasks.
PixivContentController.search.GET.summary=Search artworks
PixivContentController.search.GET.description=Search by keyword and work type. Pixiv filters before pagination, so total counts matches of the selected type.
PixivContentController.rankings.GET.summary=Get an artwork ranking
PixivContentController.rankings.GET.description=Read one page of a ranking with the original Pixiv ranks. Omit the date for the latest published edition. The response reports its rankingDate.
PixivContentController.artwork.GET.summary=Get artwork details
PixivContentController.artwork.GET.description=Get the description, bookmark count, page dimensions and image paths, plus the age rating, AI flag and posting time when supplied by Pixiv. Ugoira also include animationPath. xRestrict values 0, 1 and 2 mean all ages, R-18 and R-18G. aiType values 0, 1 and 2 mean unspecified, not marked AI-generated and AI-generated. Unavailable values are null.
PixivContentController.image.GET.summary=Read a page image
PixivContentController.image.GET.description=Stream the preview or original image bytes. Use pageIndex 0 for the first image. Content-Type identifies the returned format. The page list can be reused for 30 seconds for the same work and credential. Image bytes are fetched from the CDN per page.
PixivContentController.user.GET.summary=Get an artist profile
PixivContentController.user.GET.description=Read the artist's public name, profile description and avatar URL.
PixivContentController.userArtworks.GET.summary=List an artist's artworks
PixivContentController.userArtworks.GET.description=List illustrations and manga by descending artwork ID, up to 48 per page.
PixivContentController.series.GET.summary=Browse an artwork series
PixivContentController.series.GET.description=Read series details and one page of chapters in Pixiv's newest-first order, retaining the original chapter numbers.
parameter.page=List page number, starting at 1.
parameter.pageIndex=Zero-based image index within the artwork.
parameter.id=Positive decimal Pixiv ID of the artwork, artist or series.
parameter.word=Nonblank search term.
parameter.order=Newest first, oldest first or most popular first.
parameter.sMode=s_tag matches part of a tag, s_tag_full matches a whole tag, and s_tc searches titles and descriptions.
PixivContentController.search.GET.parameter.mode=Content rating for the search.
PixivContentController.rankings.GET.parameter.mode=Public modes include daily, weekly, monthly, rookie, original, daily_ai, male and female. Restricted modes require an eligible account.
parameter.date=Edition date as YYYY-MM-DD. Omit for the latest published edition.
parameter.size=Use preview for a preview image or original for the full-size image.
PixivContentController.bookmarks.GET.summary=Read my bookmarks
PixivContentController.bookmarks.GET.description=Read public or private bookmarks for the selected Pixiv account, optionally filtered by tag. A valid acquisition credential is required.
PixivContentController.followLatest.GET.summary=Read new works from artists I follow
PixivContentController.followLatest.GET.description=Get new works in Pixiv feed order for the selected account. A valid acquisition credential is required.
PixivContentController.searchNovels.GET.summary=Search novels
PixivContentController.searchNovels.GET.description=Search by keyword for novel summaries and links to their text.
PixivContentController.novel.GET.summary=Read a novel
PixivContentController.novel.GET.description=The content field uses pixiv-novel-text and preserves line breaks and Pixiv page, chapter and image markers. Available covers and illustrations have image paths on this instance. Entries in images map text markers to imagePath. coverPath points to the cover. Reading images requires image.read.
PixivContentController.novelSeries.GET.summary=Browse a novel series
PixivContentController.novelSeries.GET.description=List chapters in ascending reading order, up to 30 per page.
PixivContentController.animation.GET.summary=Play an Ugoira
PixivContentController.animation.GET.description=Stream a looping image/apng at Pixiv’s playback size with the original frame timing. Illustrations and manga have no animation resource.
parameter.type=artwork includes illustrations, manga and Ugoira. Use novel for novels.
parameter.rest=Use show for public bookmarks or hide for private ones.
parameter.tag=Bookmark tag. Omit to include all tags.
PixivContentController.searchNovels.GET.parameter.mode=Age-rating scope for the novel search.
PixivContentController.search.GET.parameter.type=Use all for any artwork, illustration for still illustrations, manga for manga or ugoira for animations.
PixivContentController.userNovels.GET.summary=Browse an author's novels
PixivContentController.userNovels.GET.description=List the author's novels by descending work ID, up to 24 per page.
PixivContentController.novelRankings.GET.summary=Read novel rankings
PixivContentController.novelRankings.GET.description=Get one page of ranked novels. rankingDate is the chart date. Charts covering a period also include periodStart. Omit the date for the latest edition.
PixivContentController.novelRankings.GET.parameter.mode=Select the novel chart. Restricted charts require an eligible Pixiv credential.
PixivContentController.novelCover.GET.summary=Read a novel cover
PixivContentController.novelCover.GET.description=Return the cover image bytes. Returns 404 when no readable cover is available.
PixivContentController.novelImage.GET.summary=Read an uploaded novel illustration
PixivContentController.novelImage.GET.description=Return an image uploaded to this novel. References to existing artwork use the artwork's page-image path.
PixivContentController.following.GET.summary=Read my following list
PixivContentController.following.GET.description=List the authors followed by the selected Pixiv account, up to 24 per page.
PixivContentController.following.GET.parameter.rest=Use show for public follows or hide for private follows.
PixivContentController.collections.GET.summary=Read my collections
PixivContentController.collections.GET.description=List the selected Pixiv account's collections, up to 48 per page. Covers are omitted when work visibility is restricted.
PixivContentController.collectionWorks.GET.summary=Browse works in my collection
PixivContentController.collectionWorks.GET.description=List artwork and novels in collection order, up to 48 per page. Only collections belonging to the selected account are accessible.
parameter.collectionId=Collection ID. Keep the full decimal string, which can exceed the 64-bit integer range.
parameter.imageId=Positive integer ID of an image uploaded to this novel.
PixivContentController.rankings.GET.parameter.content=Use all for the overall chart. illust and manga support daily, weekly, monthly and rookie. ugoira supports daily and weekly. Restricted category charts use daily_r18 or weekly_r18.
parameter.startDate=First publication date, inclusive, in YYYY-MM-DD format.
parameter.endDate=Last publication date, inclusive. It can equal the first date.
parameter.limit=Maximum number of recommendations, from 1 to 48. Defaults to 18.
PixivContentController.related.GET.summary=Browse related artworks
PixivContentController.related.GET.description=Read visible artworks in recommendation order. Continue with nextCursor and the same limit. Recommendation cursors last up to five minutes. After a 410, start with the first batch.
PixivContentController.comments.GET.summary=Read artwork comments
PixivContentController.comments.GET.description=Returns 20 top-level comments per page. hasReplies indicates replies and stampId identifies a stamp. commentDate keeps Pixiv’s date text.
PixivContentController.userSeries.GET.summary=Browse a creator’s series
PixivContentController.userSeries.GET.description=Returns up to 24 series per page in Pixiv order. Follow detailPath to read a series. Covers are omitted for restricted viewers.
PixivContentController.userSeries.GET.parameter.type=Use manga for manga series (default) or novel for novel series.
PixivContentController.suggestTags.GET.summary=Suggest tags
PixivContentController.suggestTags.GET.description=Returns matching tags and their English translations when available. Queries Pixiv anonymously.
PixivContentController.avatar.GET.summary=Read a creator’s avatar
PixivContentController.avatar.GET.description=Returns the avatar image. A missing avatar returns 404.
PixivContentController.me.GET.summary=View the current Pixiv account
PixivContentController.me.GET.description=Verifies the selected acquisition credential and returns that account’s ID, name, biography and avatar path.
PixivContentController.searchUsers.GET.summary=Search Pixiv users
PixivContentController.searchTags.GET.summary=Search tags
PixivContentController.publicBookmarks.GET.summary=Browse a user’s public bookmarks
PixivContentController.bookmarkTags.GET.summary=List my bookmark tags
PixivContentController.watchlist.GET.summary=Read my series watchlist
PixivContentController.relatedNovels.GET.summary=Browse related novels
PixivContentController.novelComments.GET.summary=Read novel comments
PixivContentController.artworkReplies.GET.summary=Read replies to an artwork comment
PixivContentController.novelReplies.GET.summary=Read replies to a novel comment
PixivContentController.searchCollections.GET.summary=Search public collections
PixivContentController.userCollections.GET.summary=Browse a creator’s public collections
PixivContentController.publicCollectionWorks.GET.summary=Browse works in a public collection
PixivContentController.discover.GET.summary=Discover works
PixivContentController.recommendations.GET.summary=Read my home recommendations
PixivContentController.latest.GET.summary=Browse new works across Pixiv
PixivContentController.searchNovelSeries.GET.summary=Search novels grouped by series
PixivContentController.searchUsers.GET.description=Match nicknames, ten users per page. Supply an acquisition credential if Pixiv requires login.
PixivContentController.searchTags.GET.description=Combines Pixiv suggestions and related tags. Each page holds ten distinct tags. The total counts this result set.
PixivContentController.publicBookmarks.GET.description=Filter the account’s public bookmarks by work type and bookmark tag.
PixivContentController.bookmarkTags.GET.description=Read tags and counts for the selected account’s public or private bookmarks.
PixivContentController.watchlist.GET.description=Returns watched series in Pixiv update order. Use detailPath to open the chapters.
PixivContentController.relatedNovels.GET.description=Read visible novels in recommendation order. Continue with nextCursor and the same limit. Recommendation cursors last up to five minutes. After a 410, start with the first batch.
PixivContentController.novelComments.GET.description=Read up to 20 root comments per page. hasReplies indicates replies.
PixivContentController.artworkReplies.GET.description=rootPage locates the parent comment and page selects its replies. Both start at 1.
PixivContentController.searchCollections.GET.description=Find public collections by keyword and open their worksPath.
PixivContentController.userCollections.GET.description=Read up to 48 public collections per page.
PixivContentController.publicCollectionWorks.GET.description=Read up to 48 artworks and novels per page in collection order.
PixivContentController.discover.GET.description=Read a selection of artworks or novels from Pixiv’s Discover feed.
PixivContentController.recommendations.GET.description=Verify the selected account and read its home feed in recommendation order.
PixivContentController.latest.GET.description=Read recent submissions. Pass nextCursor for the next batch. A null cursor marks the end.
PixivContentController.searchNovelSeries.GET.description=Matches one-shots and series. type and detailPath identify the novel or series to open.
PixivContentController.novelReplies.GET.description=rootPage locates the parent comment and page selects its replies. Both start at 1.
parameter.exact=Use true to match the entire nickname.
parameter.cursor=Omit on the first request. Pass the previous nextCursor to continue.
parameter.rootPage=Page containing the parent comment, starting at 1.
parameter.commentId=Positive ID of the parent comment.
parameter.minBookmarks=Minimum bookmark count. Requires an acquisition credential for a Pixiv Premium account.
parameter.maxBookmarks=Maximum bookmark count. Requires an acquisition credential for a Pixiv Premium account.
parameter.minWidth=Minimum width in pixels.
parameter.maxWidth=Maximum width in pixels.
parameter.minHeight=Minimum height in pixels.
parameter.maxHeight=Maximum height in pixels.
parameter.aspectRatio=Filter by landscape, portrait or square orientation.
parameter.minCharacters=Minimum novel character count.
parameter.maxCharacters=Maximum novel character count.
parameter.language=Novel language code, such as ja, en or zh-cn.
PixivContentController.watchlist.GET.parameter.type=Choose manga or novel series.
PixivContentController.latest.GET.parameter.type=Choose illust, manga or novel.
PixivContentController.searchUsersAndTags.GET.summary=Search users and tags together
PixivContentController.searchUsersAndTags.GET.description=Search nicknames and related tags with one term. The users and tags groups have independent pages. exact applies to nicknames. Supply an acquisition credential if Pixiv requires login.
parameter.userPage=User results page, starting at 1.
parameter.tagPage=Tag results page, starting at 1.
PixivContentController.userArtworks.GET.parameter.tag=Work tag. Repeat tag to require all of up to ten distinct tags. Spaces cannot appear within a tag.
PixivContentController.userNovels.GET.parameter.tag=Work tag. Repeat tag to require all of up to ten distinct tags. Spaces cannot appear within a tag.
