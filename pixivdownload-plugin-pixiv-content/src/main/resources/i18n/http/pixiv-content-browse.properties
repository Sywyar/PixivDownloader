title=Pixiv 内容
description=从 Pixiv 读取作品、排行榜、个人收藏和关注更新，无需创建下载任务。
PixivContentController.search.GET.summary=搜索作品
PixivContentController.search.GET.description=按关键词和作品类型搜索。Pixiv 先筛选再分页，total 对应所选类型。
PixivContentController.rankings.GET.summary=读取作品排行榜
PixivContentController.rankings.GET.description=返回指定榜期的一页，保留 Pixiv 名次。省略日期时读取最近已发布的一期，实际榜期见 rankingDate。
PixivContentController.artwork.GET.summary=查看作品详情
PixivContentController.artwork.GET.description=返回作品说明、收藏数、逐页尺寸和取图路径，以及 Pixiv 提供的分级、AI 标记和投稿时间。动图另有 animationPath。xRestrict 取 0、1、2 分别表示全年龄、R-18、R-18G。aiType 取 0、1、2 分别表示未设置、未标记为 AI 生成、AI 生成。Pixiv 未提供的值为 null。
PixivContentController.image.GET.summary=读取一页图片
PixivContentController.image.GET.description=直接返回指定页的预览或原图字节。第一页的 pageIndex 为 0。响应的 Content-Type 标识图片格式。同一作品和凭据的页清单可复用 30 秒，图片字节按页从 CDN 读取。
PixivContentController.user.GET.summary=查看画师资料
PixivContentController.user.GET.description=读取画师公开名称、简介及头像地址。
PixivContentController.userArtworks.GET.summary=浏览画师作品
PixivContentController.userArtworks.GET.description=按作品 ID 从大到小返回插画和漫画，每页最多 48 项。
PixivContentController.series.GET.summary=浏览插画或漫画系列
PixivContentController.series.GET.description=返回系列资料和一页章节，按 Pixiv 的最新章节在前排序，保留原章节序号。
parameter.page=列表页码，从 1 开始。
parameter.pageIndex=作品内的图片下标，从 0 开始。
parameter.id=作品、画师或系列的正整数 Pixiv ID，十进制数字。
parameter.word=非空搜索词。
parameter.order=日期降序、日期升序或人气降序。
parameter.sMode=s_tag 匹配部分标签，s_tag_full 匹配完整标签，s_tc 匹配标题和说明。
PixivContentController.search.GET.parameter.mode=搜索分级范围。
PixivContentController.rankings.GET.parameter.mode=公开榜支持 daily、weekly、monthly、rookie、original、daily_ai、male、female。R-18 模式需要有浏览权限的账号。
parameter.date=榜期日期，格式 YYYY-MM-DD。省略时使用最近已发布榜期。
parameter.size=preview 为预览图，original 为原图。
PixivContentController.bookmarks.GET.summary=查看我的收藏
PixivContentController.bookmarks.GET.description=读取所选 Pixiv 账号的公开或非公开收藏，可按标签筛选。请求需要有效的采集凭据。
PixivContentController.followLatest.GET.summary=查看我的关注更新
PixivContentController.followLatest.GET.description=按 Pixiv 的顺序返回所选账号关注的作者发布的新作。请求需要有效的采集凭据。
PixivContentController.searchNovels.GET.summary=搜索小说
PixivContentController.searchNovels.GET.description=按关键词返回小说摘要和正文接口路径。
PixivContentController.novel.GET.summary=读取小说正文
PixivContentController.novel.GET.description=content 使用 pixiv-novel-text，保留换行、分页、章节和插图标记。可用的封面与插图提供本实例的取图路径。images 将正文标记映射到 imagePath，coverPath 指向封面。取图需要 image.read。
PixivContentController.novelSeries.GET.summary=浏览小说系列
PixivContentController.novelSeries.GET.description=按章节序号升序返回系列目录，每页最多 30 章。
PixivContentController.animation.GET.summary=播放动图
PixivContentController.animation.GET.description=直接返回可循环播放的 image/apng，使用 Pixiv 播放尺寸和原始帧时长。普通插画和漫画没有动画资源。
parameter.type=artwork 包含插画、漫画和动图，novel 表示小说。
parameter.rest=show 为公开收藏，hide 为非公开收藏。
parameter.tag=收藏标签，省略时包含所有标签。
PixivContentController.searchNovels.GET.parameter.mode=小说搜索的分级范围。
PixivContentController.search.GET.parameter.type=all 搜索所有图像作品。illustration、manga、ugoira 分别只搜插画、漫画、动图。
PixivContentController.userNovels.GET.summary=浏览作者的小说
PixivContentController.userNovels.GET.description=按作品 ID 从大到小返回作者的小说，每页最多 24 项。
PixivContentController.novelRankings.GET.summary=读取小说排行榜
PixivContentController.novelRankings.GET.description=返回一页小说及各自名次。rankingDate 表示榜期日期，区间榜另有 periodStart。省略日期时读取最新榜期。
PixivContentController.novelRankings.GET.parameter.mode=选择小说榜类。受限榜单需要具备相应浏览资格的 Pixiv 凭据。
PixivContentController.novelCover.GET.summary=读取小说封面
PixivContentController.novelCover.GET.description=直接返回封面图片字节。没有可读取的封面时返回 404。
PixivContentController.novelImage.GET.summary=读取小说上传插图
PixivContentController.novelImage.GET.description=直接返回作者上传到该小说的插图。正文引用的已有插画使用作品逐页取图路径。
PixivContentController.following.GET.summary=查看我的关注列表
PixivContentController.following.GET.description=列出所选 Pixiv 账号关注的作者，每页最多 24 位。
PixivContentController.following.GET.parameter.rest=show 查看公开关注，hide 查看非公开关注。
PixivContentController.collections.GET.summary=查看我的珍藏集
PixivContentController.collections.GET.description=按页列出所选 Pixiv 账号的珍藏集，每页最多 48 个。受作品可见性限制时省略封面。
PixivContentController.collectionWorks.GET.summary=浏览我的珍藏集作品
PixivContentController.collectionWorks.GET.description=按珍藏集内顺序返回插画、漫画、动图和小说，每页最多 48 项。仅可读取所选账号名下的珍藏集。
parameter.collectionId=珍藏集 ID。保留完整十进制字符串，可能超过 64 位整数范围。
parameter.imageId=小说上传插图的正整数 ID。
PixivContentController.rankings.GET.parameter.content=all 为综合榜；illust、manga 支持 daily、weekly、monthly、rookie，ugoira 支持 daily、weekly。分类限制榜使用 daily_r18 或 weekly_r18。
parameter.startDate=投稿开始日期，格式 YYYY-MM-DD，包含当天。
parameter.endDate=投稿结束日期，包含当天，可以与开始日期相同。
parameter.limit=最多返回的推荐数，1 至 48，默认 18。
PixivContentController.related.GET.summary=查看相关作品
PixivContentController.related.GET.description=按推荐顺序返回可见作品。续取时传回 nextCursor 并保持相同 limit。 推荐游标最多保留 5 分钟；收到 410 时从第一批重新读取。
PixivContentController.comments.GET.summary=读取作品评论
PixivContentController.comments.GET.description=每页 20 条顶层评论。hasReplies 表示有回复，贴图评论可通过 stampId 识别。commentDate 保留 Pixiv 的时间文本。
PixivContentController.userSeries.GET.summary=查看作者系列目录
PixivContentController.userSeries.GET.description=按 Pixiv 顺序分页，每页 24 个系列。detailPath 可打开系列，无法确认作品可见性时省略封面。
PixivContentController.userSeries.GET.parameter.type=manga 为漫画系列（默认），novel 为小说系列。
PixivContentController.suggestTags.GET.summary=获取标签建议
PixivContentController.suggestTags.GET.description=按输入词返回标签及可用的英文翻译。该查询匿名访问 Pixiv。
PixivContentController.avatar.GET.summary=读取画师头像
PixivContentController.avatar.GET.description=直接返回头像图片。没有可读取的头像时返回 404。
PixivContentController.me.GET.summary=查看当前 Pixiv 账号
PixivContentController.me.GET.description=核验所选采集凭据，返回该账号的 ID、名称、简介及头像路径。
PixivContentController.searchUsers.GET.summary=搜索 Pixiv 用户
PixivContentController.searchTags.GET.summary=搜索标签
PixivContentController.publicBookmarks.GET.summary=浏览用户的公开收藏
PixivContentController.bookmarkTags.GET.summary=列出我的收藏标签
PixivContentController.watchlist.GET.summary=查看系列追更列表
PixivContentController.relatedNovels.GET.summary=浏览相关小说
PixivContentController.novelComments.GET.summary=查看小说评论
PixivContentController.artworkReplies.GET.summary=展开作品评论的回复
PixivContentController.novelReplies.GET.summary=展开小说评论的回复
PixivContentController.searchCollections.GET.summary=搜索公开珍藏集
PixivContentController.userCollections.GET.summary=浏览作者发布的珍藏集
PixivContentController.publicCollectionWorks.GET.summary=查看公开珍藏集中的作品
PixivContentController.discover.GET.summary=发现作品
PixivContentController.recommendations.GET.summary=查看我的首页推荐
PixivContentController.latest.GET.summary=浏览全站新作
PixivContentController.searchNovelSeries.GET.summary=按系列搜索小说
PixivContentController.searchUsers.GET.description=按昵称匹配，每页 10 位用户。Pixiv 需要登录时请指定采集凭据。
PixivContentController.searchTags.GET.description=合并 Pixiv 的补全候选和相关标签，去重后每页 10 项。total 统计本次候选范围。
PixivContentController.publicBookmarks.GET.description=按作品类型和收藏标签查看指定账号的公开收藏。
PixivContentController.bookmarkTags.GET.description=分别读取所选账号的公开或非公开收藏标签及数量。
PixivContentController.watchlist.GET.description=按 Pixiv 的更新顺序返回追更系列，detailPath 指向章节列表。
PixivContentController.relatedNovels.GET.description=按推荐顺序读取可见小说。续取时传回 nextCursor 并保持相同 limit。 推荐游标最多保留 5 分钟；收到 410 时从第一批重新读取。
PixivContentController.novelComments.GET.description=每页 20 条顶层评论，hasReplies 表示有回复。
PixivContentController.artworkReplies.GET.description=rootPage 指定原评论所在页，page 指定回复页。两者均从 1 开始。
PixivContentController.searchCollections.GET.description=按关键词搜索公开珍藏集，可通过 worksPath 浏览集内作品。
PixivContentController.userCollections.GET.description=每页最多 48 个公开珍藏集。
PixivContentController.publicCollectionWorks.GET.description=按珍藏集内的顺序返回插画和小说，每页最多 48 项。
PixivContentController.discover.GET.description=从 Pixiv 发现页读取一批图像作品或小说。
PixivContentController.recommendations.GET.description=核验所选账号后，按其首页推荐顺序返回作品。
PixivContentController.latest.GET.description=读取最近投稿的作品。下一批使用响应中的 nextCursor；为空时已到末尾。
PixivContentController.searchNovelSeries.GET.description=同时匹配单篇与系列，type 和 detailPath 标明该打开小说还是系列目录。
PixivContentController.novelReplies.GET.description=rootPage 指定原评论所在页，page 指定回复页。两者均从 1 开始。
parameter.exact=true 表示完整昵称匹配。
parameter.cursor=续取时使用上次返回的 nextCursor。首次省略。
parameter.rootPage=顶层评论所在页，从 1 开始。
parameter.commentId=顶层评论的正整数 ID。
parameter.minBookmarks=收藏数下限。 需使用具有 Pixiv Premium 会员资格的采集凭据。
parameter.maxBookmarks=收藏数上限。 需使用具有 Pixiv Premium 会员资格的采集凭据。
parameter.minWidth=最小宽度，单位为像素。
parameter.maxWidth=最大宽度，单位为像素。
parameter.minHeight=最小高度，单位为像素。
parameter.maxHeight=最大高度，单位为像素。
parameter.aspectRatio=按横图、竖图或方图筛选。
parameter.minCharacters=小说字数下限。
parameter.maxCharacters=小说字数上限。
parameter.language=小说的语言代码，例如 ja、en 或 zh-cn。
PixivContentController.watchlist.GET.parameter.type=选择 manga 或 novel 系列。
PixivContentController.latest.GET.parameter.type=选择 illust、manga 或 novel。
PixivContentController.searchUsersAndTags.GET.summary=同时搜索用户和标签
PixivContentController.searchUsersAndTags.GET.description=按同一个关键词查找用户和相关标签。users 和 tags 各自分页。exact 只影响昵称匹配。Pixiv 要求登录时需提供采集凭据。
parameter.userPage=用户结果页，从 1 开始。
parameter.tagPage=标签结果页，从 1 开始。
PixivContentController.userArtworks.GET.parameter.tag=作品标签。每个 tag 参数填写一个标签，最多 10 个不同标签。重复传参时只返回同时含有全部标签的投稿。标签内不能含空格。
PixivContentController.userNovels.GET.parameter.tag=作品标签。每个 tag 参数填写一个标签，最多 10 个不同标签。重复传参时只返回同时含有全部标签的投稿。标签内不能含空格。
