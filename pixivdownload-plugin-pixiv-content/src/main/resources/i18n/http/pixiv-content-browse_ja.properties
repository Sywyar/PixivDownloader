title=Pixiv のコンテンツ
description=ダウンロードタスクを作らずに、Pixiv の作品、ランキング、ブックマーク、フォロー中の作者の新着作品を取得します。
PixivContentController.search.GET.summary=作品を検索
PixivContentController.search.GET.description=キーワードと作品の種類で検索します。Pixiv 側で絞り込んでからページ分割するため、total は選択した種類の件数です。
PixivContentController.rankings.GET.summary=作品ランキングを取得
PixivContentController.rankings.GET.description=Pixiv の順位を保持したランキングを1ページ取得します。日付を省略すると最新の公開分を返し、対象日は rankingDate で確認できます。
PixivContentController.artwork.GET.summary=作品の詳細を取得
PixivContentController.artwork.GET.description=説明文、ブックマーク数、各ページの寸法と画像パス、および Pixiv が提供する閲覧制限、AI 区分、投稿日時を返します。うごイラには animationPath もあります。xRestrict の 0、1、2 は全年齢、R-18、R-18G を示します。aiType の 0、1、2 は未設定、AI 生成の指定なし、AI 生成を示します。取得できない値は null です。
PixivContentController.image.GET.summary=指定ページの画像を取得
PixivContentController.image.GET.description=指定ページのプレビューまたは原寸画像のバイト列を返します。先頭の pageIndex は 0 です。形式は Content-Type で確認できます。同じ作品と認証情報のページ一覧は 30 秒間再利用できます。画像本体はページごとに CDN から取得します。
PixivContentController.user.GET.summary=作者のプロフィールを取得
PixivContentController.user.GET.description=作者の公開名、紹介文、プロフィール画像の URL を取得します。
PixivContentController.userArtworks.GET.summary=作者の作品一覧を取得
PixivContentController.userArtworks.GET.description=作品 ID の降順でイラストとマンガを一覧表示します。1ページ最大48件です。
PixivContentController.series.GET.summary=イラスト・マンガシリーズを取得
PixivContentController.series.GET.description=シリーズ情報と1ページ分の収録作品を取得します。Pixiv と同じ新しい順で、各作品の通し番号を保持します。
parameter.page=一覧のページ番号。先頭は 1 です。
parameter.pageIndex=作品内の画像番号。先頭は 0 です。
parameter.id=作品、作者、シリーズの Pixiv ID。正の10進整数です。
parameter.word=空でない検索キーワード。
parameter.order=新しい順、古い順、人気順。
parameter.sMode=s_tag はタグの部分一致、s_tag_full は完全一致、s_tc はタイトルと説明文を検索します。
PixivContentController.search.GET.parameter.mode=検索対象の閲覧制限。
PixivContentController.rankings.GET.parameter.mode=公開ランキングは daily、weekly、monthly、rookie、original、daily_ai、male、female に対応します。年齢制限付きは閲覧可能なアカウントが必要です。
parameter.date=対象日を YYYY-MM-DD で指定します。省略時は最新の公開分です。
parameter.size=preview はプレビュー、original は原寸画像です。
PixivContentController.bookmarks.GET.summary=自分のブックマークを表示
PixivContentController.bookmarks.GET.description=選択した Pixiv アカウントの公開・非公開ブックマークを取得します。タグで絞り込めます。有効な取得用認証情報が必要です。
PixivContentController.followLatest.GET.summary=フォロー中の作者の新着作品を表示
PixivContentController.followLatest.GET.description=選択したアカウントがフォローしている作者の新着作品を Pixiv の表示順で取得します。有効な取得用認証情報が必要です。
PixivContentController.searchNovels.GET.summary=小説を検索
PixivContentController.searchNovels.GET.description=キーワードで小説を検索し、概要と本文へのパスを取得します。
PixivContentController.novel.GET.summary=小説の本文を取得
PixivContentController.novel.GET.description=content は pixiv-novel-text 形式で、改行・改ページ・章・挿絵の記法を保持します。取得できる表紙と挿絵にはこのインスタンスの画像パスが付きます。images は本文の記法を imagePath に対応付けます。表紙のパスは coverPath です。画像取得には image.read が必要です。
PixivContentController.novelSeries.GET.summary=小説シリーズを表示
PixivContentController.novelSeries.GET.description=章番号の昇順で、1 ページあたり最大 30 章を取得します。
PixivContentController.animation.GET.summary=うごイラを再生
PixivContentController.animation.GET.description=Pixiv の再生サイズと各フレームの表示時間を保ったループ再生用の image/apng を返します。通常のイラストやマンガには動画リソースはありません。
parameter.type=artwork はイラスト・マンガ・うごイラ、novel は小説を指定します。
parameter.rest=show は公開、hide は非公開のブックマークです。
parameter.tag=ブックマークタグ。省略すると全タグを対象にします。
PixivContentController.searchNovels.GET.parameter.mode=小説検索の年齢制限区分。
PixivContentController.search.GET.parameter.type=all は全作品、illustration はイラスト、manga はマンガ、ugoira はうごイラを検索します。
PixivContentController.userNovels.GET.summary=作者の小説を閲覧
PixivContentController.userNovels.GET.description=作者の小説を作品 ID の降順で、1 ページあたり最大 24 件返します。
PixivContentController.novelRankings.GET.summary=小説ランキングを取得
PixivContentController.novelRankings.GET.description=小説とその順位を 1 ページ分返します。rankingDate は集計日で、期間集計には periodStart も付きます。日付を省略すると最新のランキングを取得します。
PixivContentController.novelRankings.GET.parameter.mode=小説ランキングの種類です。閲覧制限付きのランキングには条件を満たす Pixiv の認証情報が必要です。
PixivContentController.novelCover.GET.summary=小説の表紙を取得
PixivContentController.novelCover.GET.description=表紙画像を直接返します。取得できる表紙がない場合は 404 を返します。
PixivContentController.novelImage.GET.summary=小説にアップロードした挿絵を取得
PixivContentController.novelImage.GET.description=作者がこの小説にアップロードした画像を返します。既存のイラストを参照する挿絵は作品のページ画像パスを使用します。
PixivContentController.following.GET.summary=自分のフォロー一覧を表示
PixivContentController.following.GET.description=選択した Pixiv アカウントのフォロー中の作者を、1 ページあたり最大 24 人返します。
PixivContentController.following.GET.parameter.rest=show は公開フォロー、hide は非公開フォローです。
PixivContentController.collections.GET.summary=自分のコレクションを表示
PixivContentController.collections.GET.description=選択した Pixiv アカウントのコレクションを、1 ページあたり最大 48 件返します。作品の閲覧範囲が制限されている場合は表紙を省略します。
PixivContentController.collectionWorks.GET.summary=自分のコレクション内の作品を閲覧
PixivContentController.collectionWorks.GET.description=選択したアカウントのコレクションに含まれるイラスト・マンガ・うごイラ・小説を、登録順に 1 ページあたり最大 48 件返します。
parameter.collectionId=コレクション ID。64 ビット整数の範囲を超えることがあるため、十進数の文字列のまま扱ってください。
parameter.imageId=この小説にアップロードした挿絵の正整数 ID。
PixivContentController.rankings.GET.parameter.content=all は総合です。illust と manga は daily、weekly、monthly、rookie、ugoira は daily、weekly に対応します。年齢制限付きの種別別は daily_r18、weekly_r18 です。
parameter.startDate=投稿期間の開始日（YYYY-MM-DD）。指定日を含みます。
parameter.endDate=投稿期間の終了日。指定日を含み、開始日と同じ日も指定できます。
parameter.limit=推薦件数の上限。1～48 件、初期値は 18 件です。
PixivContentController.related.GET.summary=関連作品を表示
PixivContentController.related.GET.description=閲覧できる作品をおすすめ順に返します。続きには同じ limit と nextCursor を指定します。 おすすめのカーソルは最長5分間有効です。410の場合は初回から取得してください。
PixivContentController.comments.GET.summary=作品のコメントを取得
PixivContentController.comments.GET.description=トップレベルのコメントを 1 ページに 20 件返します。hasReplies は返信の有無、stampId はスタンプの ID です。commentDate は Pixiv の日時表記です。
PixivContentController.userSeries.GET.summary=作者のシリーズ一覧を表示
PixivContentController.userSeries.GET.description=Pixiv の順序で 1 ページに最大 24 シリーズを返します。detailPath からシリーズを開けます。閲覧制限がある場合は表紙を省略します。
PixivContentController.userSeries.GET.parameter.type=manga は漫画シリーズ（初期値）、novel は小説シリーズです。
PixivContentController.suggestTags.GET.summary=タグ候補を取得
PixivContentController.suggestTags.GET.description=入力語に合うタグと、英訳があればその訳を返します。Pixiv には匿名で問い合わせます。
PixivContentController.avatar.GET.summary=作者のアイコン画像を取得
PixivContentController.avatar.GET.description=アイコン画像を返します。取得できる画像がない場合は 404 を返します。
PixivContentController.me.GET.summary=現在の Pixiv アカウントを確認
PixivContentController.me.GET.description=選択した取得用認証情報を検証し、アカウントの ID、名前、自己紹介、アイコン画像のパスを返します。
PixivContentController.searchUsers.GET.summary=pixivユーザーを検索
PixivContentController.searchTags.GET.summary=タグを検索
PixivContentController.publicBookmarks.GET.summary=ユーザーの公開ブックマークを見る
PixivContentController.bookmarkTags.GET.summary=自分のブックマークタグを取得
PixivContentController.watchlist.GET.summary=ウォッチリストを取得
PixivContentController.relatedNovels.GET.summary=関連小説を見る
PixivContentController.novelComments.GET.summary=小説のコメントを取得
PixivContentController.artworkReplies.GET.summary=作品コメントへの返信を取得
PixivContentController.novelReplies.GET.summary=小説コメントへの返信を取得
PixivContentController.searchCollections.GET.summary=公開コレクションを検索
PixivContentController.userCollections.GET.summary=作者の公開コレクションを見る
PixivContentController.publicCollectionWorks.GET.summary=公開コレクション内の作品を見る
PixivContentController.discover.GET.summary=作品を見つける
PixivContentController.recommendations.GET.summary=自分のホームのおすすめを取得
PixivContentController.latest.GET.summary=みんなの新着作品を見る
PixivContentController.searchNovelSeries.GET.summary=シリーズ単位で小説を検索
PixivContentController.searchUsers.GET.description=ニックネームで検索します。1ページ10件。ログインを求められた場合は取得用認証情報を指定してください。
PixivContentController.searchTags.GET.description=入力候補と関連タグを重複なくまとめ、1ページ10件で返します。total は今回の候補数です。
PixivContentController.publicBookmarks.GET.description=指定したユーザーの公開ブックマークを作品種別とタグで絞り込みます。
PixivContentController.bookmarkTags.GET.description=選択したアカウントの公開・非公開別にブックマークタグと件数を返します。
PixivContentController.watchlist.GET.description=更新順にシリーズを返します。detailPath で各話を開けます。
PixivContentController.relatedNovels.GET.description=閲覧できる小説をおすすめ順に返します。続きは同じ limit と nextCursor で取得します。 おすすめのカーソルは最長5分間有効です。410の場合は初回から取得してください。
PixivContentController.novelComments.GET.description=最上位のコメントを1ページ20件まで取得します。hasReplies は返信の有無です。
PixivContentController.artworkReplies.GET.description=rootPage は親コメントのページ、page は返信のページです。どちらも1から始まります。
PixivContentController.searchCollections.GET.description=キーワードで公開コレクションを検索し、worksPath で作品を開けます。
PixivContentController.userCollections.GET.description=公開コレクションを1ページ48件まで取得します。
PixivContentController.publicCollectionWorks.GET.description=コレクション内の順番でイラストと小説を1ページ48件まで取得します。
PixivContentController.discover.GET.description=ディスカバリーからイラスト作品または小説を取得します。
PixivContentController.recommendations.GET.description=選択したアカウントを確認し、ホームのおすすめ順に作品を返します。
PixivContentController.latest.GET.description=新着投稿を取得します。次は nextCursor を指定し、null なら末尾です。
PixivContentController.searchNovelSeries.GET.description=読み切りとシリーズを検索し、type と detailPath で小説またはシリーズを開けます。
PixivContentController.novelReplies.GET.description=rootPage は親コメントのページ、page は返信のページです。どちらも1から始まります。
parameter.exact=true はニックネームの完全一致です。
parameter.cursor=初回は省略し、続きには前回の nextCursor を指定します。
parameter.rootPage=親コメントがあるページ。1から開始します。
parameter.commentId=親コメントの正の整数 ID。
parameter.minBookmarks=ブックマーク数の下限。 pixivプレミアムの取得用認証情報が必要です。
parameter.maxBookmarks=ブックマーク数の上限。 pixivプレミアムの取得用認証情報が必要です。
parameter.minWidth=最小幅（ピクセル）。
parameter.maxWidth=最大幅（ピクセル）。
parameter.minHeight=最小高さ（ピクセル）。
parameter.maxHeight=最大高さ（ピクセル）。
parameter.aspectRatio=横長、縦長、正方形で絞り込みます。
parameter.minCharacters=小説の最小文字数。
parameter.maxCharacters=小説の最大文字数。
parameter.language=小説の言語コード。例は ja、en、zh-cn です。
PixivContentController.watchlist.GET.parameter.type=manga または novel のシリーズを選択します。
PixivContentController.latest.GET.parameter.type=illust、manga、novel から選択します。
PixivContentController.searchUsersAndTags.GET.summary=ユーザーとタグをまとめて検索
PixivContentController.searchUsersAndTags.GET.description=同じキーワードでニックネームと関連タグを検索します。users と tags は個別にページを指定できます。exact はニックネームに適用されます。Pixiv がログインを求める場合は取得用の認証情報が必要です。
parameter.userPage=ユーザーの結果ページ（1 始まり）。
parameter.tagPage=タグの結果ページ（1 始まり）。
PixivContentController.userArtworks.GET.parameter.tag=作品タグ。tag を繰り返すと、指定したすべてのタグを含む投稿を返します。異なるタグは 10 個まで指定できます。タグ名に空白は使えません。
PixivContentController.userNovels.GET.parameter.tag=作品タグ。tag を繰り返すと、指定したすべてのタグを含む投稿を返します。異なるタグは 10 個まで指定できます。タグ名に空白は使えません。
