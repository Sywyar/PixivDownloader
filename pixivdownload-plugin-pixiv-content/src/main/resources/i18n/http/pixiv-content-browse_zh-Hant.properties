title=Pixiv 內容
description=從 Pixiv 讀取作品、排行榜、個人收藏及追蹤動態，無需建立下載工作。
PixivContentController.search.GET.summary=搜尋作品
PixivContentController.search.GET.description=依關鍵字和作品類型搜尋。Pixiv 先篩選再分頁，total 對應所選類型。
PixivContentController.rankings.GET.summary=讀取作品排行榜
PixivContentController.rankings.GET.description=讀取指定榜期的一頁並保留 Pixiv 名次。省略日期時讀取最近已發布的一期，實際榜期見 rankingDate。
PixivContentController.artwork.GET.summary=查看作品詳情
PixivContentController.artwork.GET.description=傳回作品說明、收藏數、各頁尺寸與取圖路徑，以及 Pixiv 提供的分級、AI 標記和投稿時間。動圖另有 animationPath。xRestrict 取 0、1、2 依序表示全年齡、R-18、R-18G。aiType 取 0、1、2 依序表示未設定、未標記為 AI 生成、AI 生成。Pixiv 未提供的值為 null。
PixivContentController.image.GET.summary=讀取單頁圖片
PixivContentController.image.GET.description=直接傳回指定頁的預覽圖或原圖位元組。第一頁的 pageIndex 為 0。回應的 Content-Type 指出圖片格式。同一作品和憑證的頁面清單可重用 30 秒，圖片按頁從 CDN 讀取。
PixivContentController.user.GET.summary=查看繪師資料
PixivContentController.user.GET.description=讀取繪師的公開名稱、簡介及頭像網址。
PixivContentController.userArtworks.GET.summary=瀏覽繪師作品
PixivContentController.userArtworks.GET.description=依作品 ID 由大到小列出插畫和漫畫，每頁最多 48 筆。
PixivContentController.series.GET.summary=瀏覽插畫或漫畫系列
PixivContentController.series.GET.description=傳回系列資料和一頁章節，依 Pixiv 的最新章節在前排序，保留原章節序號。
parameter.page=清單頁碼，從 1 開始。
parameter.pageIndex=作品內的圖片索引，從 0 開始。
parameter.id=作品、繪師或系列的正整數 Pixiv ID，以十進位表示。
parameter.word=非空白的搜尋詞。
parameter.order=日期降冪、日期升冪或人氣降冪。
parameter.sMode=s_tag 搜尋部分符合的標籤，s_tag_full 搜尋完全符合的標籤，s_tc 搜尋標題和說明。
PixivContentController.search.GET.parameter.mode=搜尋的分級範圍。
PixivContentController.rankings.GET.parameter.mode=公開榜支援 daily、weekly、monthly、rookie、original、daily_ai、male、female。年齡限制榜需要可瀏覽的帳號。
parameter.date=榜期日期，格式為 YYYY-MM-DD。省略時使用最近已發布的榜期。
parameter.size=preview 為預覽圖，original 為原圖。
PixivContentController.bookmarks.GET.summary=查看我的收藏
PixivContentController.bookmarks.GET.description=讀取所選 Pixiv 帳號的公開或非公開收藏，可依標籤篩選。請求需要有效的擷取憑證。
PixivContentController.followLatest.GET.summary=查看我的追蹤動態
PixivContentController.followLatest.GET.description=依 Pixiv 的順序傳回所選帳號追蹤的作者發表的新作。請求需要有效的擷取憑證。
PixivContentController.searchNovels.GET.summary=搜尋小說
PixivContentController.searchNovels.GET.description=依關鍵字傳回小說摘要及正文的介面路徑。
PixivContentController.novel.GET.summary=讀取小說正文
PixivContentController.novel.GET.description=content 使用 pixiv-novel-text，保留換行、分頁、章節及插圖標記。可用的封面及插圖均提供本執行個體的取圖路徑。images 將正文標記對應至 imagePath，coverPath 指向封面。取圖需要 image.read。
PixivContentController.novelSeries.GET.summary=瀏覽小說系列
PixivContentController.novelSeries.GET.description=依章節編號遞增列出系列目錄，每頁最多 30 章。
PixivContentController.animation.GET.summary=播放動圖
PixivContentController.animation.GET.description=直接傳回可循環播放的 image/apng，保留 Pixiv 播放尺寸及各影格時長。一般插畫和漫畫沒有動畫資源。
parameter.type=artwork 包含插畫、漫畫及動圖，novel 表示小說。
parameter.rest=show 為公開收藏，hide 為非公開收藏。
parameter.tag=收藏標籤，省略時包含所有標籤。
PixivContentController.searchNovels.GET.parameter.mode=小說搜尋的分級範圍。
PixivContentController.search.GET.parameter.type=all 搜尋所有圖像作品。illustration、manga、ugoira 分別只搜尋插畫、漫畫、動圖。
PixivContentController.userNovels.GET.summary=瀏覽作者的小說
PixivContentController.userNovels.GET.description=依作品 ID 遞減列出作者的小說，每頁最多 24 部。
PixivContentController.novelRankings.GET.summary=讀取小說排行榜
PixivContentController.novelRankings.GET.description=傳回一頁小說及名次。rankingDate 表示榜期日期，區間榜另有 periodStart。省略日期時讀取最新一期。
PixivContentController.novelRankings.GET.parameter.mode=選擇小說榜類。限制級榜單需要具備相應瀏覽資格的 Pixiv 憑證。
PixivContentController.novelCover.GET.summary=讀取小說封面
PixivContentController.novelCover.GET.description=直接傳回封面圖片。沒有可讀取的封面時傳回 404。
PixivContentController.novelImage.GET.summary=讀取小說上傳的插圖
PixivContentController.novelImage.GET.description=直接傳回作者上傳至該小說的插圖。正文引用的既有插畫使用作品逐頁取圖路徑。
PixivContentController.following.GET.summary=查看我的追蹤清單
PixivContentController.following.GET.description=列出所選 Pixiv 帳號追蹤的作者，每頁最多 24 位。
PixivContentController.following.GET.parameter.rest=show 查看公開追蹤，hide 查看非公開追蹤。
PixivContentController.collections.GET.summary=瀏覽我的珍藏集
PixivContentController.collections.GET.description=列出所選 Pixiv 帳號的珍藏集，每頁最多 48 個。若作品可見性受限，則省略封面。
PixivContentController.collectionWorks.GET.summary=瀏覽我的珍藏集作品
PixivContentController.collectionWorks.GET.description=依珍藏集內順序傳回插畫、漫畫、動圖和小說，每頁最多 48 筆。僅可讀取所選帳號的珍藏集。
parameter.collectionId=珍藏集 ID。請保留完整的十進位字串，可能超出 64 位元整數範圍。
parameter.imageId=小說上傳插圖的正整數 ID。
PixivContentController.rankings.GET.parameter.content=all 為綜合榜；illust、manga 支援 daily、weekly、monthly、rookie，ugoira 支援 daily、weekly。分類限制榜使用 daily_r18 或 weekly_r18。
parameter.startDate=投稿起始日期，格式為 YYYY-MM-DD，包含當天。
parameter.endDate=投稿截止日期，包含當天，可與起始日期相同。
parameter.limit=推薦作品數量上限為 1 至 48，預設為 18。
PixivContentController.related.GET.summary=瀏覽相關作品
PixivContentController.related.GET.description=依推薦順序傳回可見作品。續取時傳回 nextCursor 並維持相同 limit。 推薦游標最長保留 5 分鐘。收到 410 時請從第一批重新讀取。
PixivContentController.comments.GET.summary=讀取作品留言
PixivContentController.comments.GET.description=每頁傳回 20 則頂層留言。hasReplies 表示有回覆，stampId 是貼圖編號。commentDate 保留 Pixiv 的時間文字。
PixivContentController.userSeries.GET.summary=瀏覽創作者的系列目錄
PixivContentController.userSeries.GET.description=依 Pixiv 順序每頁傳回最多 24 個系列，可透過 detailPath 開啟系列。瀏覽權限受限時省略封面。
PixivContentController.userSeries.GET.parameter.type=manga 為漫畫系列（預設），novel 為小說系列。
PixivContentController.suggestTags.GET.summary=取得標籤建議
PixivContentController.suggestTags.GET.description=依輸入詞傳回標籤，有英文翻譯時一併傳回。以匿名方式查詢 Pixiv。
PixivContentController.avatar.GET.summary=讀取創作者的大頭貼
PixivContentController.avatar.GET.description=直接傳回大頭貼圖片。沒有可讀取的圖片時傳回 404。
PixivContentController.me.GET.summary=檢視目前的 Pixiv 帳號
PixivContentController.me.GET.description=驗證所選的擷取憑證，傳回帳號 ID、名稱、簡介與大頭貼路徑。
PixivContentController.searchUsers.GET.summary=搜尋 Pixiv 使用者
PixivContentController.searchTags.GET.summary=搜尋標籤
PixivContentController.publicBookmarks.GET.summary=瀏覽使用者的公開收藏
PixivContentController.bookmarkTags.GET.summary=列出我的收藏標籤
PixivContentController.watchlist.GET.summary=查看系列追更清單
PixivContentController.relatedNovels.GET.summary=瀏覽相關小說
PixivContentController.novelComments.GET.summary=查看小說留言
PixivContentController.artworkReplies.GET.summary=展開作品留言的回覆
PixivContentController.novelReplies.GET.summary=展開小說留言的回覆
PixivContentController.searchCollections.GET.summary=搜尋公開珍藏集
PixivContentController.userCollections.GET.summary=瀏覽作者發表的珍藏集
PixivContentController.publicCollectionWorks.GET.summary=查看公開珍藏集內的作品
PixivContentController.discover.GET.summary=探索作品
PixivContentController.recommendations.GET.summary=查看我的首頁推薦
PixivContentController.latest.GET.summary=瀏覽全站新作
PixivContentController.searchNovelSeries.GET.summary=依系列搜尋小說
PixivContentController.searchUsers.GET.description=依暱稱比對，每頁 10 位。Pixiv 要求登入時請指定擷取憑證。
PixivContentController.searchTags.GET.description=合併 Pixiv 的自動完成候選與相關標籤，去重後每頁 10 項。total 為本次候選數量。
PixivContentController.publicBookmarks.GET.description=依作品類型和收藏標籤查看指定帳號的公開收藏。
PixivContentController.bookmarkTags.GET.description=分別讀取所選帳號的公開或非公開收藏標籤與數量。
PixivContentController.watchlist.GET.description=依 Pixiv 更新順序傳回追更系列，detailPath 指向章節清單。
PixivContentController.relatedNovels.GET.description=依推薦順序讀取可見小說。續取時傳回 nextCursor 並維持相同 limit。 推薦游標最長保留 5 分鐘。收到 410 時請從第一批重新讀取。
PixivContentController.novelComments.GET.description=每頁最多 20 則頂層留言，hasReplies 表示有回覆。
PixivContentController.artworkReplies.GET.description=rootPage 指定原留言所在頁，page 指定回覆頁。兩者均從 1 開始。
PixivContentController.searchCollections.GET.description=依關鍵字搜尋公開珍藏集，可透過 worksPath 瀏覽作品。
PixivContentController.userCollections.GET.description=每頁最多 48 個公開珍藏集。
PixivContentController.publicCollectionWorks.GET.description=依珍藏集內的順序傳回插畫和小說，每頁最多 48 項。
PixivContentController.discover.GET.description=從 Pixiv 探索頁讀取一批圖像作品或小說。
PixivContentController.recommendations.GET.description=驗證所選帳號後，依其首頁推薦順序傳回作品。
PixivContentController.latest.GET.description=讀取最近投稿的作品。下一批使用回應中的 nextCursor，空值表示已到底。
PixivContentController.searchNovelSeries.GET.description=同時比對單篇與系列，type 和 detailPath 指出小說或系列目錄。
PixivContentController.novelReplies.GET.description=rootPage 指定原留言所在頁，page 指定回覆頁。兩者均從 1 開始。
parameter.exact=true 表示完整暱稱比對。
parameter.cursor=首次省略。續取時使用上次傳回的 nextCursor。
parameter.rootPage=頂層留言所在頁，從 1 開始。
parameter.commentId=頂層留言的正整數 ID。
parameter.minBookmarks=收藏數下限。 需使用具備 Pixiv Premium 會員資格的擷取憑證。
parameter.maxBookmarks=收藏數上限。 需使用具備 Pixiv Premium 會員資格的擷取憑證。
parameter.minWidth=最小寬度，單位為像素。
parameter.maxWidth=最大寬度，單位為像素。
parameter.minHeight=最小高度，單位為像素。
parameter.maxHeight=最大高度，單位為像素。
parameter.aspectRatio=依橫圖、直圖或方圖篩選。
parameter.minCharacters=小說字數下限。
parameter.maxCharacters=小說字數上限。
parameter.language=小說的語言代碼，例如 ja、en 或 zh-cn。
PixivContentController.watchlist.GET.parameter.type=選擇 manga 或 novel 系列。
PixivContentController.latest.GET.parameter.type=選擇 illust、manga 或 novel。
PixivContentController.searchUsersAndTags.GET.summary=同時搜尋使用者和標籤
PixivContentController.searchUsersAndTags.GET.description=以同一個關鍵字查詢暱稱和相關標籤。users 和 tags 可分別翻頁。exact 只套用於暱稱。Pixiv 要求登入時須提供擷取憑證。
parameter.userPage=使用者結果頁，從 1 開始。
parameter.tagPage=標籤結果頁，從 1 開始。
PixivContentController.userArtworks.GET.parameter.tag=作品標籤。每個 tag 參數填一個標籤，最多 10 個不同標籤。重複傳入時只傳回含有全部指定標籤的投稿。標籤值不可含有空格。
PixivContentController.userNovels.GET.parameter.tag=作品標籤。每個 tag 參數填一個標籤，最多 10 個不同標籤。重複傳入時只傳回含有全部指定標籤的投稿。標籤值不可含有空格。
