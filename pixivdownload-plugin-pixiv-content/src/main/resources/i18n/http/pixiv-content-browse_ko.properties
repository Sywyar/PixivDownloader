title=Pixiv 콘텐츠
description=다운로드 작업을 만들지 않고 Pixiv 작품, 랭킹, 북마크와 팔로우한 작가의 새 작품을 읽습니다.
PixivContentController.search.GET.summary=작품 검색
PixivContentController.search.GET.description=키워드와 작품 유형으로 검색합니다. Pixiv에서 유형을 먼저 적용하므로 total은 선택한 유형의 검색 결과 수입니다.
PixivContentController.rankings.GET.summary=작품 랭킹 조회
PixivContentController.rankings.GET.description=Pixiv의 원래 순위를 유지한 랭킹 한 페이지를 읽습니다. 날짜를 생략하면 가장 최근에 발표된 랭킹을 반환하며 기준일은 rankingDate에 표시됩니다.
PixivContentController.artwork.GET.summary=작품 상세 조회
PixivContentController.artwork.GET.description=작품 설명, 북마크 수, 페이지별 크기와 이미지 경로, Pixiv가 제공하는 연령 등급, AI 표시 및 게시 시간을 반환합니다. 우고이라에는 animationPath도 있습니다. xRestrict 값 0, 1, 2는 각각 전 연령, R-18, R-18G입니다. aiType 값 0, 1, 2는 각각 미설정, AI 생성 표시 없음, AI 생성입니다. 제공되지 않은 값은 null입니다.
PixivContentController.image.GET.summary=페이지 이미지 읽기
PixivContentController.image.GET.description=지정한 페이지의 미리보기 또는 원본 이미지를 스트리밍합니다. 첫 이미지의 pageIndex는 0이며, 형식은 응답의 Content-Type에 표시됩니다. 같은 작품과 인증 정보의 페이지 목록은 30초간 재사용할 수 있습니다. 이미지는 페이지별로 CDN에서 읽습니다.
PixivContentController.user.GET.summary=작가 프로필 조회
PixivContentController.user.GET.description=작가의 공개 이름, 소개와 프로필 이미지 URL을 조회합니다.
PixivContentController.userArtworks.GET.summary=작가의 작품 목록 조회
PixivContentController.userArtworks.GET.description=작품 ID 내림차순으로 일러스트와 만화를 한 페이지에 최대 48개씩 반환합니다.
PixivContentController.series.GET.summary=일러스트·만화 시리즈 조회
PixivContentController.series.GET.description=시리즈 정보와 한 페이지의 회차를 최신 회차부터 조회합니다. Pixiv의 원래 회차 번호를 유지합니다.
parameter.page=1부터 시작하는 목록 페이지 번호입니다.
parameter.pageIndex=작품 내 이미지 인덱스이며 0부터 시작합니다.
parameter.id=작품, 작가 또는 시리즈의 양의 십진수 Pixiv ID입니다.
parameter.word=비어 있지 않은 검색어입니다.
parameter.order=최신순, 오래된순 또는 인기순입니다.
parameter.sMode=s_tag는 태그 부분 일치, s_tag_full은 태그 완전 일치, s_tc는 제목과 설명을 검색합니다.
PixivContentController.search.GET.parameter.mode=검색할 작품 등급입니다.
PixivContentController.rankings.GET.parameter.mode=공개 순위는 daily, weekly, monthly, rookie, original, daily_ai, male, female을 지원합니다. 성인 순위에는 열람 가능한 계정이 필요합니다.
parameter.date=랭킹 기준일을 YYYY-MM-DD 형식으로 지정합니다. 생략하면 최근 발표된 랭킹을 사용합니다.
parameter.size=preview는 미리보기, original은 원본 이미지입니다.
PixivContentController.bookmarks.GET.summary=내 북마크 보기
PixivContentController.bookmarks.GET.description=선택한 Pixiv 계정의 공개 또는 비공개 북마크를 조회합니다. 태그로 필터링할 수 있으며 유효한 수집 인증 정보가 필요합니다.
PixivContentController.followLatest.GET.summary=팔로우한 작가의 새 작품 보기
PixivContentController.followLatest.GET.description=선택한 계정이 팔로우하는 작가의 새 작품을 Pixiv 피드 순서로 조회합니다. 유효한 수집 인증 정보가 필요합니다.
PixivContentController.searchNovels.GET.summary=소설 검색
PixivContentController.searchNovels.GET.description=키워드로 소설을 검색하여 요약 정보와 본문 경로를 가져옵니다.
PixivContentController.novel.GET.summary=소설 본문 읽기
PixivContentController.novel.GET.description=content는 pixiv-novel-text 형식으로 원문의 줄바꿈과 페이지, 장, 삽화 표기를 유지합니다. 이용 가능한 표지와 삽화에는 이 인스턴스의 이미지 경로가 제공됩니다. images는 본문 표기를 imagePath에 연결하며 coverPath는 표지를 가리킵니다. 이미지를 읽으려면 image.read 권한이 필요합니다.
PixivContentController.novelSeries.GET.summary=소설 시리즈 보기
PixivContentController.novelSeries.GET.description=장 번호 오름차순으로 페이지당 최대 30개 장을 조회합니다.
PixivContentController.animation.GET.summary=우고이라 재생
PixivContentController.animation.GET.description=Pixiv 재생 크기와 각 프레임의 표시 시간을 유지한 반복 재생용 image/apng를 반환합니다. 일반 일러스트와 만화에는 애니메이션 리소스가 없습니다.
parameter.type=artwork는 일러스트, 만화, 우고이라를 포함합니다. 소설은 novel을 사용합니다.
parameter.rest=공개 북마크는 show, 비공개 북마크는 hide를 사용합니다.
parameter.tag=북마크 태그입니다. 생략하면 모든 태그를 포함합니다.
PixivContentController.searchNovels.GET.parameter.mode=소설 검색의 연령 등급 범위입니다.
PixivContentController.search.GET.parameter.type=all은 전체 이미지 작품, illustration은 일러스트, manga는 만화, ugoira는 우고이라를 검색합니다.
PixivContentController.userNovels.GET.summary=작가의 소설 보기
PixivContentController.userNovels.GET.description=작가의 소설을 작품 ID 내림차순으로 페이지당 최대 24편 반환합니다.
PixivContentController.novelRankings.GET.summary=소설 랭킹 조회
PixivContentController.novelRankings.GET.description=소설과 순위를 한 페이지씩 반환합니다. rankingDate는 집계일이며 기간별 랭킹에는 periodStart도 포함됩니다. 날짜를 생략하면 최신 랭킹을 조회합니다.
PixivContentController.novelRankings.GET.parameter.mode=소설 랭킹 종류입니다. 열람이 제한된 랭킹에는 해당 자격을 갖춘 Pixiv 인증 정보가 필요합니다.
PixivContentController.novelCover.GET.summary=소설 표지 읽기
PixivContentController.novelCover.GET.description=표지 이미지 바이트를 반환합니다. 읽을 수 있는 표지가 없으면 404를 반환합니다.
PixivContentController.novelImage.GET.summary=소설에 업로드한 삽화 읽기
PixivContentController.novelImage.GET.description=작가가 이 소설에 업로드한 이미지를 반환합니다. 기존 일러스트를 인용한 삽화는 해당 작품의 페이지별 이미지 경로를 사용합니다.
PixivContentController.following.GET.summary=내 팔로우 목록 보기
PixivContentController.following.GET.description=선택한 Pixiv 계정이 팔로우하는 작가를 페이지당 최대 24명 반환합니다.
PixivContentController.following.GET.parameter.rest=show는 공개 팔로우, hide는 비공개 팔로우입니다.
PixivContentController.collections.GET.summary=내 컬렉션 보기
PixivContentController.collections.GET.description=선택한 Pixiv 계정의 컬렉션을 페이지당 최대 48개 반환합니다. 작품 열람 범위가 제한된 경우 표지는 생략됩니다.
PixivContentController.collectionWorks.GET.summary=내 컬렉션의 작품 보기
PixivContentController.collectionWorks.GET.description=선택한 계정이 소유한 컬렉션의 일러스트, 만화, 우고이라와 소설을 컬렉션 순서대로 페이지당 최대 48개 반환합니다.
parameter.collectionId=컬렉션 ID입니다. 64비트 정수 범위를 넘을 수 있으므로 전체 십진수 문자열을 그대로 사용하세요.
parameter.imageId=소설에 업로드한 삽화의 양의 정수 ID입니다.
PixivContentController.rankings.GET.parameter.content=all은 종합 순위입니다. illust와 manga는 daily, weekly, monthly, rookie를, ugoira는 daily, weekly를 지원합니다. 종류별 성인 순위에는 daily_r18 또는 weekly_r18을 사용합니다.
parameter.startDate=게시 기간의 시작일입니다. YYYY-MM-DD 형식이며 해당 날짜를 포함합니다.
parameter.endDate=게시 기간의 종료일입니다. 해당 날짜를 포함하며 시작일과 같아도 됩니다.
parameter.limit=추천 작품 수는 1~48개이며 기본값은 18개입니다.
PixivContentController.related.GET.summary=관련 작품 보기
PixivContentController.related.GET.description=볼 수 있는 작품을 추천 순으로 반환합니다. 다음 요청에 같은 limit와 nextCursor를 사용하세요. 추천 커서는 최대 5분간 유효합니다. 410을 받으면 처음부터 요청하세요.
PixivContentController.comments.GET.summary=작품 댓글 읽기
PixivContentController.comments.GET.description=페이지당 최상위 댓글 20개를 반환합니다. hasReplies는 답글 유무, stampId는 스탬프 ID입니다. commentDate는 Pixiv의 날짜 표기를 유지합니다.
PixivContentController.userSeries.GET.summary=작가의 시리즈 목록 보기
PixivContentController.userSeries.GET.description=Pixiv 순서대로 페이지당 최대 24개를 반환합니다. detailPath로 시리즈를 열 수 있습니다. 열람 제한이 있으면 표지는 생략합니다.
PixivContentController.userSeries.GET.parameter.type=manga는 만화 시리즈(기본값), novel은 소설 시리즈입니다.
PixivContentController.suggestTags.GET.summary=태그 추천받기
PixivContentController.suggestTags.GET.description=입력과 일치하는 태그와 사용 가능한 영어 번역을 반환합니다. Pixiv에 익명으로 요청합니다.
PixivContentController.avatar.GET.summary=작가 프로필 이미지 읽기
PixivContentController.avatar.GET.description=프로필 이미지를 반환합니다. 가져올 이미지가 없으면 404를 반환합니다.
PixivContentController.me.GET.summary=현재 Pixiv 계정 확인
PixivContentController.me.GET.description=선택한 수집 인증 정보를 검증하고 계정 ID, 이름, 소개 및 프로필 이미지 경로를 반환합니다.
PixivContentController.searchUsers.GET.summary=pixiv 사용자 검색
PixivContentController.searchTags.GET.summary=태그 검색
PixivContentController.publicBookmarks.GET.summary=사용자의 공개 북마크 보기
PixivContentController.bookmarkTags.GET.summary=내 북마크 태그 조회
PixivContentController.watchlist.GET.summary=시리즈 관심 목록 조회
PixivContentController.relatedNovels.GET.summary=관련 소설 보기
PixivContentController.novelComments.GET.summary=소설 댓글 보기
PixivContentController.artworkReplies.GET.summary=작품 댓글의 답글 보기
PixivContentController.novelReplies.GET.summary=소설 댓글의 답글 보기
PixivContentController.searchCollections.GET.summary=공개 컬렉션 검색
PixivContentController.userCollections.GET.summary=작가의 공개 컬렉션 보기
PixivContentController.publicCollectionWorks.GET.summary=공개 컬렉션의 작품 보기
PixivContentController.discover.GET.summary=작품 발견
PixivContentController.recommendations.GET.summary=내 홈 추천 보기
PixivContentController.latest.GET.summary=pixiv 전체 신작 보기
PixivContentController.searchNovelSeries.GET.summary=시리즈별로 소설 검색
PixivContentController.searchUsers.GET.description=닉네임으로 검색하며 페이지당 10명을 표시합니다. pixiv가 로그인을 요구하면 수집 자격 증명을 지정하세요.
PixivContentController.searchTags.GET.description=자동 완성과 관련 태그를 합쳐 중복을 제거하고 페이지당 10개를 반환합니다. total은 이번 결과의 개수입니다.
PixivContentController.publicBookmarks.GET.description=해당 계정의 공개 북마크를 작품 종류와 북마크 태그로 필터링합니다.
PixivContentController.bookmarkTags.GET.description=선택한 계정의 공개 또는 비공개 북마크 태그와 개수를 조회합니다.
PixivContentController.watchlist.GET.description=업데이트 순으로 관심 시리즈를 반환합니다. detailPath에서 회차를 볼 수 있습니다.
PixivContentController.relatedNovels.GET.description=볼 수 있는 소설을 추천 순으로 반환합니다. 다음 요청에 같은 limit와 nextCursor를 사용하세요. 추천 커서는 최대 5분간 유효합니다. 410을 받으면 처음부터 요청하세요.
PixivContentController.novelComments.GET.description=최상위 댓글을 페이지당 20개까지 반환합니다. hasReplies는 답글 여부입니다.
PixivContentController.artworkReplies.GET.description=rootPage는 원댓글 페이지, page는 답글 페이지입니다. 둘 다 1부터 시작합니다.
PixivContentController.searchCollections.GET.description=키워드로 공개 컬렉션을 찾고 worksPath로 작품을 엽니다.
PixivContentController.userCollections.GET.description=공개 컬렉션을 페이지당 최대 48개 반환합니다.
PixivContentController.publicCollectionWorks.GET.description=컬렉션 순서대로 그림과 소설을 페이지당 최대 48개 반환합니다.
PixivContentController.discover.GET.description=발견 피드에서 그림 작품 또는 소설을 가져옵니다.
PixivContentController.recommendations.GET.description=선택한 계정을 확인하고 해당 홈의 추천 순서대로 작품을 반환합니다.
PixivContentController.latest.GET.description=최근 투고작을 조회합니다. 다음 묶음은 nextCursor를 사용하며 null이면 마지막입니다.
PixivContentController.searchNovelSeries.GET.description=단편과 시리즈를 함께 검색합니다. type과 detailPath로 소설 또는 시리즈를 구분합니다.
PixivContentController.novelReplies.GET.description=rootPage는 원댓글 페이지, page는 답글 페이지입니다. 둘 다 1부터 시작합니다.
parameter.exact=true이면 닉네임 전체가 일치해야 합니다.
parameter.cursor=처음에는 생략하고 이어서 조회할 때 이전 nextCursor를 전달하세요.
parameter.rootPage=원댓글이 있는 페이지로 1부터 시작합니다.
parameter.commentId=원댓글의 양의 정수 ID입니다.
parameter.minBookmarks=최소 북마크 수입니다. pixiv 프리미엄 계정의 수집 자격 증명이 필요합니다.
parameter.maxBookmarks=최대 북마크 수입니다. pixiv 프리미엄 계정의 수집 자격 증명이 필요합니다.
parameter.minWidth=최소 너비(픽셀)입니다.
parameter.maxWidth=최대 너비(픽셀)입니다.
parameter.minHeight=최소 높이(픽셀)입니다.
parameter.maxHeight=최대 높이(픽셀)입니다.
parameter.aspectRatio=가로, 세로, 정사각형 비율로 필터링합니다.
parameter.minCharacters=소설 최소 글자 수입니다.
parameter.maxCharacters=소설 최대 글자 수입니다.
parameter.language=소설 언어 코드입니다. 예를 들어 ja, en, zh-cn입니다.
PixivContentController.watchlist.GET.parameter.type=manga 또는 novel 시리즈를 선택하세요.
PixivContentController.latest.GET.parameter.type=illust, manga 또는 novel을 선택하세요.
PixivContentController.searchUsersAndTags.GET.summary=사용자와 태그 함께 검색
PixivContentController.searchUsersAndTags.GET.description=같은 검색어로 닉네임과 관련 태그를 검색합니다. users와 tags는 따로 페이지를 지정합니다. exact는 닉네임에만 적용됩니다. Pixiv가 로그인을 요구하면 수집 자격 증명이 필요합니다.
parameter.userPage=사용자 결과 페이지. 1부터 시작합니다.
parameter.tagPage=태그 결과 페이지. 1부터 시작합니다.
PixivContentController.userArtworks.GET.parameter.tag=작품 태그. tag를 반복하면 지정한 모든 태그가 붙은 작품을 반환합니다. 서로 다른 태그를 최대 10개까지 지정할 수 있습니다. 태그 값에 공백은 사용할 수 없습니다.
PixivContentController.userNovels.GET.parameter.tag=작품 태그. tag를 반복하면 지정한 모든 태그가 붙은 작품을 반환합니다. 서로 다른 태그를 최대 10개까지 지정할 수 있습니다. 태그 값에 공백은 사용할 수 없습니다.
