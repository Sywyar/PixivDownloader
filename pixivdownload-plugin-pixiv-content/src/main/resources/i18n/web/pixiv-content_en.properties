permission.novel.read=Search novels and read rankings, authors' novels, text and series
permission.animation.read=Read playable Ugoira
error.credentialRequired=Select a valid Pixiv acquisition credential or supply an acquisition cookie containing PHPSESSID.
error.animationBusy=All animation conversion slots are in use. Try again later.
error.premiumRequired=Pixiv requires a Premium account to filter by bookmark count.
error.recommendationExpired=This recommendation cursor has expired. Start again with the first batch.
