plugin.name=Pixiv コンテンツ API
plugin.summary=作品と小説の検索、ランキング、作者、シリーズ、ブックマーク、新着作品の閲覧、画像・うごイラ・小説本文の取得ができます。
permission.metadata.read=作品、関連作品、コメント、タグ候補、ランキング、作者のシリーズを読む
permission.image.read=作品画像、作者のアイコン、小説の表紙と挿絵を読む
error.notFound=Pixiv のリソースまたは作品ページが見つかりません。
error.access=Pixiv の認証情報の有効期限が切れているか、このリソースにアクセスする権限がありません。
error.rate=Pixiv がリクエストを制限しています。しばらくしてからもう一度お試しください。
error.invalidResponse=Pixiv から無効な応答が返されました。
error.tooLarge=Pixiv の応答が転送サイズの上限を超えています。
error.transport=Pixiv の応答を読み取れませんでした。
permission.personal.read=選択したアカウントのプロフィール、ブックマーク、フォロー、フォロー中の新作、コレクションを読む
permission.novel.read=小説を検索し、ランキング、作者の作品、本文、シリーズを閲覧
permission.animation.read=再生可能なうごイラを取得
error.credentialRequired=有効な Pixiv 取得用認証情報を選ぶか、PHPSESSID を含む取得用 Cookie を指定してください。
error.animationBusy=うごイラの変換処理が混み合っています。しばらくしてから再試行してください。
error.premiumRequired=ブックマーク数で絞り込むには pixivプレミアムが必要です。
error.recommendationExpired=おすすめのカーソルが失効しました。最初のページから取得し直してください。
error.tagSearchTooBroad=指定したタグはどれも、この作者の 2048 件を超える作品に付いています。より絞り込めるタグを追加するか、タグごとにページを表示してください。
