plugin.name=Pixiv 內容 API
plugin.summary=搜尋作品和小說，查看排行榜、作者、系列、個人收藏及追蹤動態，直接讀取圖片、動圖及小說正文。
permission.metadata.read=讀取作品、相關作品、留言、標籤建議、排行榜及創作者系列
permission.image.read=讀取作品圖片、創作者大頭貼、小說封面和上傳的插圖
error.notFound=找不到這項 Pixiv 資源或作品頁面。
error.access=Pixiv 憑證已失效，或沒有權限存取此資源。
error.rate=Pixiv 已限制請求頻率，請稍後再試。
error.invalidResponse=Pixiv 傳回的回應無效。
error.tooLarge=Pixiv 回應超過傳輸大小限制。
error.transport=無法讀取 Pixiv 回應。
permission.personal.read=讀取所選帳號的資料、收藏、追蹤名單、追蹤動態及珍藏集
permission.novel.read=讀取小說搜尋、榜單、作者作品、正文及系列
permission.animation.read=讀取可播放的動圖
error.credentialRequired=請選擇有效的 Pixiv 擷取憑證，或提供包含 PHPSESSID 的擷取 Cookie。
error.animationBusy=動圖轉換名額已滿，請稍後再試。
error.premiumRequired=Pixiv 收藏數篩選需要所選帳號具備 Premium 會員資格。
error.recommendationExpired=推薦游標已失效，請從第一批重新讀取。
error.tagSearchTooBroad=每個指定標籤都符合這位作者超過 2048 件作品。請加入更具體的標籤，或逐一按單一標籤分頁查詢。
