plugin.name=Pixiv 콘텐츠 API
plugin.summary=작품과 소설을 검색하고 랭킹, 작가, 시리즈, 북마크와 팔로우 피드를 조회하며 이미지, 우고이라와 소설 본문을 직접 읽습니다.
permission.metadata.read=작품, 관련 작품, 댓글, 태그 추천, 랭킹 및 작가 시리즈 읽기
permission.image.read=작품 이미지, 작가 프로필 이미지, 소설 표지 및 업로드된 삽화 읽기
error.notFound=Pixiv 리소스 또는 작품 페이지를 찾을 수 없습니다.
error.access=Pixiv 인증 정보가 만료되었거나 해당 리소스에 접근할 권한이 없습니다.
error.rate=Pixiv에서 요청 횟수를 제한했습니다. 잠시 후 다시 시도하세요.
error.invalidResponse=Pixiv에서 잘못된 응답을 반환했습니다.
error.tooLarge=Pixiv 응답이 전송 크기 제한을 초과했습니다.
error.transport=Pixiv 응답을 읽을 수 없습니다.
permission.personal.read=선택한 계정의 프로필, 북마크, 팔로우, 팔로우한 작가의 신작 및 컬렉션 읽기
permission.novel.read=소설 검색 및 랭킹, 작가 작품, 본문과 시리즈 읽기
permission.animation.read=재생 가능한 우고이라 읽기
error.credentialRequired=유효한 Pixiv 수집 인증 정보를 선택하거나 PHPSESSID가 포함된 수집 쿠키를 제공하세요.
error.animationBusy=우고이라 변환 작업이 모두 사용 중입니다. 잠시 후 다시 시도하세요.
error.premiumRequired=북마크 수 필터에는 pixiv 프리미엄 계정이 필요합니다.
error.recommendationExpired=추천 커서가 만료되었습니다. 처음부터 다시 요청하세요.
error.tagSearchTooBroad=선택한 태그 각각에 이 작가의 작품이 2048개를 초과합니다. 더 구체적인 태그를 추가하거나 태그 하나로 페이지를 조회하세요.
