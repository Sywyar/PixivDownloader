plugin.name=AI 翻訳
plugin.summary=OpenAI 互換チャットと自動翻訳機能を提供します。
gui.config.ai.modality.label=モダリティ
gui.config.ai.modality.help=設定する AI モダリティを選択します。「テキストモデル」は汎用の大規模言語モデル（OpenAI 互換で、翻訳や小説朗読の台本分析などに使用）です。「TTS モデル」は複数役の小説朗読に使う音声合成エンジンです（beta。利用できますが、まだ安定していません）。両方の設定が同時に保存されて有効になります。プルダウンは編集対象の切り替えにのみ使用します
gui.config.ai.modality.text=テキストモデル
gui.config.ai.modality.tts=TTS モデル（beta）
gui.config.ai.security.notice=カスタム API アドレスは高権限のネットワーク宛先です。プロンプト、作品本文、API Key が送信されます。信頼できるサービス（ローカルまたは内部ネットワークのサービスを含む）のみ入力してください。資格情報を含むリクエストは HTTP リダイレクトに追従しません
gui.config.field.ai.enabled.label=AI を有効にする
gui.config.field.ai.enabled.help=無効にするとすべての AI 呼び出しが拒否されます。有効にすると、設定した大規模言語モデルを関連機能から呼び出せます
gui.config.field.ai.base-url.label=API アドレス
gui.config.field.ai.base-url.help=https://api.openai.com/v1 などの OpenAI 互換エンドポイント。上の「サービスプロバイダーのプリセット」を選ぶと自動入力されます
gui.config.field.ai.api-key.label=API Key
gui.config.field.ai.api-key.help=各サービスプロバイダーのコンソールで作成します。ログやレスポンスに表示されることはありません。ローカルモデル（Ollama / LM Studio など）では通常、空欄にできます
gui.config.field.ai.model.label=モデル
gui.config.field.ai.model.help=呼び出すモデル名（gpt-4o-mini / deepseek-chat / qwen-plus など）。モデルは頻繁に更新されるため、サービスプロバイダーのドキュメントを確認してください
gui.config.field.ai.use-proxy.label=プロキシを使用
gui.config.field.ai.use-proxy.help=有効にすると、この設定のリクエストは HTTP プロキシを経由します（アドレスはプロキシ設定の host:port）。海外サービスでは通常有効にし、国内サービスでは不要です。グローバルプロキシ設定とは独立しています
gui.config.ai.preset.label=サービスプロバイダーのプリセット
gui.config.ai.preset.help=選択すると API アドレスが自動入力されて固定され、プリセットに応じてモデルと「プロキシを使用」の推奨値が設定されます。カスタムエンドポイントを使う場合は「カスタム」を選択してください
gui.config.ai.test-button.label=AI 接続をテスト
gui.config.ai.test-button.help=現在のフォーム設定（保存不要）でモデルに非常に短いテストメッセージを送り、アドレス、キー、モデル、ネットワークが利用可能か確認します
gui.config.ai.test.notice.sending=AI 接続をテストしています。しばらくお待ちください…
gui.config.ai.test.notice.success=AI 接続に成功しました。モデルの応答：{0}
gui.config.ai.test.notice.failed=AI 接続に失敗しました。詳細はログを確認してください
gui.config.ai.test.notice.unreachable=バックエンドサービスに接続できません。サービスが実行中か確認してください
