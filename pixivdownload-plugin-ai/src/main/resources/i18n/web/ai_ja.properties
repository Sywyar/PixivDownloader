ai.preset.name.siliconflow=SiliconFlow（アグリゲーター）
ai.preset.name.custom=カスタム
ai.preset.help.api-key=サービスプロバイダーのオープンプラットフォームまたはコンソールで API Key を作成し、下の「API Key」に貼り付けます。料金と上限は各社の公式ドキュメントを確認してください。
ai.preset.help.anthropic=Claude は OpenAI 互換エンドポイント（/v1/chat/completions、API Key を Bearer として使用）から接続します。Anthropic コンソールで API Key を作成してください。互換エンドポイントでは一部のネイティブ機能を利用できません。
ai.preset.help.gemini=Gemini は OpenAI 互換エンドポイント（/v1beta/openai）から接続します。Google AI Studio で API Key を作成してください。
ai.preset.help.dashscope=Alibaba Cloud 百錬（DashScope）コンソールで API Key（sk-... の形式）を作成してください。
ai.preset.help.doubao=Volcano Engine 方舟（Ark）コンソールで API Key を作成してください。「モデル」にはモデル名またはエンドポイント ID（ep-...）を入力できます。
ai.preset.help.ernie=Baidu 千帆 V2 では、アカウントのセキュリティ認証キーを Bearer Token として使用します。取得方法は千帆コンソールのドキュメントを確認してください。
ai.preset.help.spark=科大訊飛 Spark では、コンソールの HTTP サービスインターフェース用認証キー（APIPassword）を API Key として使用します。
ai.preset.help.minimax=MiniMax オープンプラットフォームで API Key を作成してください（中国国内サイトは api.minimaxi.com、海外サイトは api.minimax.io を使用）。一部のインターフェースでは GroupId も必要です。詳細は公式ドキュメントを確認してください。
ai.preset.help.local=ローカルまたはセルフホスト（Ollama、LM Studio、vLLM など）。実際の API Key は不要です（空欄または任意の値にできます）。MiMo などのオープンモデルをセルフホストし、対応するモデル名を入力できます。
ai.preset.help.aggregator=アグリゲーターまたはルーティングプラットフォーム。1つの Key で複数のモデルにアクセスできます。「モデル」にはプラットフォームの完全なモデル識別子（openai/gpt-4o-mini など）を指定します。
ai.preset.help.custom=カスタム：OpenAI 互換エンドポイントの API アドレスとモデルを入力します。API Key はサービスプロバイダーの要件に従って入力してください。
batch.auto-translate-label=新しくダウンロードした小説を自動翻訳
batch.translate-lang-label=対象言語：
batch.translate-lang-default=簡体字中国語
batch.translate-seg-label=分割文字数：
batch.translate-glossary-hint=自動翻訳では、この小説またはシリーズの既定の用語マッピングだけを使用します。ここで別のマッピングを指定することはできません。分割文字数を0にすると章全体を一度に翻訳します。管理者のみ利用でき、先に AI の設定が必要です。
