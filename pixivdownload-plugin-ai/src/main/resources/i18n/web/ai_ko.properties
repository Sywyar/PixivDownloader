plugin.name=AI 번역
plugin.summary=OpenAI 호환 채팅 및 자동 번역 기능.
gui.config.ai.modality.label=모달리티
gui.config.ai.modality.help=구성할 AI 모달리티를 선택하세요. "텍스트 모델"은 번역/소설 듣기 대본 분석 등에 사용하는 범용 대규모 언어 모델(OpenAI 호환)이며, "TTS 모델"은 다중 화자 소설 듣기 낭독용 음성 합성 엔진입니다(beta, 사용 가능하지만 아직 안정적이지 않음). 두 설정은 모두 저장되고 적용되며 드롭다운은 현재 편집 항목만 전환합니다.
gui.config.ai.modality.text=텍스트 모델
gui.config.ai.modality.tts=TTS 모델(beta)
gui.config.ai.security.notice=사용자 지정 API 주소는 높은 권한의 네트워크 대상입니다. 프로그램이 프롬프트, 작품 텍스트 및 API Key를 해당 주소로 보냅니다. 신뢰할 수 있는 서비스(로컬 또는 내부 네트워크 포함)만 입력하세요. 자격 증명이 포함된 요청은 HTTP 리디렉션을 따르지 않습니다.
gui.config.field.ai.enabled.label=AI 활성화
gui.config.field.ai.enabled.help=끄면 모든 AI 호출이 거부되며, 켜면 관련 기능이 설정한 대규모 언어 모델을 호출할 수 있습니다.
gui.config.field.ai.base-url.label=API 주소
gui.config.field.ai.base-url.help=https://api.openai.com/v1과 같은 OpenAI 호환 엔드포인트입니다. 위의 "공급자 사전 설정"을 선택하면 자동으로 입력됩니다.
gui.config.field.ai.api-key.label=API Key
gui.config.field.ai.api-key.help=해당 공급자의 콘솔에서 생성하세요. 로그나 응답에 절대 표시되지 않습니다. Ollama / LM Studio와 같은 로컬 모델은 일반적으로 비워 둘 수 있습니다.
gui.config.field.ai.model.label=모델
gui.config.field.ai.model.help=gpt-4o-mini / deepseek-chat / qwen-plus와 같은 호출할 모델 이름입니다. 모델은 빠르게 변경되므로 공급자 문서를 기준으로 하세요.
gui.config.field.ai.use-proxy.label=프록시 사용
gui.config.field.ai.use-proxy.help=켜면 이 설정의 요청이 프록시 설정의 host:port를 사용하는 HTTP 프록시를 통과합니다. 해외 공급자는 일반적으로 켜야 하고 국내 공급자는 필요하지 않습니다. 전역 프록시 스위치와 독립적입니다.
gui.config.ai.preset.label=공급자 사전 설정
gui.config.ai.preset.help=선택하면 API 주소를 자동 입력하고 잠그며, 사전 설정에 따라 모델과 "프록시 사용" 권장값을 채웁니다. 사용자 지정 엔드포인트가 필요하면 "사용자 지정"을 선택하세요.
gui.config.ai.test-button.label=AI 연결 테스트
gui.config.ai.test-button.help=현재 양식 설정을 사용하여(먼저 저장할 필요 없음) 모델에 아주 짧은 탐색 메시지를 보냅니다. 성공하면 주소 / 키 / 모델 / 네트워크를 사용할 수 있다는 뜻입니다.
gui.config.ai.test.notice.sending=AI 연결을 테스트하는 중입니다. 잠시 기다려 주세요…
gui.config.ai.test.notice.success=AI 연결 성공, 모델 응답: {0}
gui.config.ai.test.notice.failed=AI 연결 실패. 자세한 내용은 로그를 확인하세요.
gui.config.ai.test.notice.unreachable=백엔드 서비스에 연결할 수 없습니다. 서비스가 실행 중인지 확인하세요.
ai.preset.name.openai=OpenAI(ChatGPT)
ai.preset.name.anthropic=Anthropic(Claude)
ai.preset.name.gemini=Google Gemini
ai.preset.name.xai=xAI(Grok)
ai.preset.name.mistral=Mistral
ai.preset.name.groq=Groq
ai.preset.name.deepseek=DeepSeek
ai.preset.name.qwen=Alibaba Qwen(DashScope)
ai.preset.name.zhipu=Zhipu GLM
ai.preset.name.moonshot=Moonshot Kimi
ai.preset.name.doubao=ByteDance Doubao(Volcengine Ark)
ai.preset.name.hunyuan=Tencent Hunyuan
ai.preset.name.ernie=Baidu Ernie(Qianfan)
ai.preset.name.spark=iFlytek Spark
ai.preset.name.minimax=MiniMax
ai.preset.name.ollama=Ollama(로컬)
ai.preset.name.lmstudio=LM Studio(로컬)
ai.preset.name.openrouter=OpenRouter(집계)
ai.preset.name.siliconflow=SiliconFlow(집계)
ai.preset.name.custom=사용자 지정
ai.preset.help.api-key=해당 공급자의 공개 플랫폼 / 콘솔에서 API Key를 생성한 후 아래 "API Key"에 붙여 넣으세요. 요금과 한도는 각 공식 문서를 기준으로 하세요.
ai.preset.help.anthropic=Claude는 OpenAI 호환 엔드포인트(/v1/chat/completions, API Key를 Bearer로 사용)를 통해 연결합니다. Anthropic 콘솔에서 API Key를 생성하세요. 일부 기본 기능은 호환 엔드포인트에서 사용할 수 없습니다.
ai.preset.help.gemini=Gemini는 OpenAI 호환 엔드포인트(/v1beta/openai)를 통해 연결합니다. Google AI Studio에서 API Key를 생성하세요.
ai.preset.help.dashscope=Alibaba Cloud DashScope 콘솔에서 API Key(sk-... 형식)를 생성하세요.
ai.preset.help.doubao=Volcengine Ark 콘솔에서 API Key를 생성하세요. "모델"에는 모델 이름 또는 엔드포인트 ID(ep-...)를 입력할 수 있습니다.
ai.preset.help.ernie=Baidu Qianfan V2는 계정의 보안 인증 키를 Bearer Token으로 사용합니다. 구체적인 발급 방법은 Qianfan 콘솔 문서를 확인하세요.
ai.preset.help.spark=iFlytek Spark는 콘솔의 HTTP 서비스 인터페이스 인증 키(APIPassword)를 API Key로 사용합니다.
ai.preset.help.minimax=MiniMax 공개 플랫폼에서 API Key를 생성하세요(중국 사이트는 api.minimaxi.com, 국제 사이트는 api.minimax.io로 변경). 일부 인터페이스에는 GroupId도 필요합니다. 공식 문서를 확인하세요.
ai.preset.help.local=로컬 / 자체 호스팅(Ollama, LM Studio, vLLM 등)입니다. 실제 API Key는 필요하지 않으며 비워 두거나 임의로 입력할 수 있습니다. MiMo와 같은 오픈 소스 모델을 자체 호스팅한 후 해당 모델 이름을 입력하세요.
ai.preset.help.aggregator=집계 / 라우팅 플랫폼으로, 하나의 Key로 여러 모델에 접근합니다. "모델"에는 플랫폼의 전체 모델 식별자(예: openai/gpt-4o-mini)를 사용해야 합니다.
ai.preset.help.custom=사용자 지정: OpenAI 호환 엔드포인트의 API 주소 / 모델을 직접 입력합니다. API Key는 공급자 요구 사항에 따라 입력하세요.
batch.auto-translate-label=새로 다운로드한 소설 자동 번역
batch.translate-lang-label=대상 언어:
batch.translate-lang-default=간체 중국어
batch.translate-seg-label=분할 글자 수:
batch.translate-glossary-hint=자동 번역은 해당 소설/시리즈의 기본 용어집만 사용하며 여기에서 다른 용어집을 지정할 수 없습니다. 분할 글자 수를 0으로 설정하면 장 전체를 한 번에 번역합니다. 관리자만 사용할 수 있고 AI 설정이 먼저 필요합니다.
