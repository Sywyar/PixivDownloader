plugin.name=AI 翻譯
plugin.summary=OpenAI 相容聊天與自動翻譯功能。
gui.config.ai.modality.label=模態
gui.config.ai.modality.help=選擇要設定的 AI 模態：「文字模型」是通用大型語言模型（OpenAI 相容，用於翻譯／小說朗讀腳本分析等）；「TTS 模型」是多角色小說朗讀的語音合成引擎（beta，可以使用但尚不穩定）。兩類設定會同時儲存並生效，下拉選單僅切換目前編輯的項目
gui.config.ai.modality.text=文字模型
gui.config.ai.modality.tts=TTS 模型（beta）
gui.config.ai.security.notice=自訂 API 位址是高權限網路目標；程式會向其傳送提示詞、作品文字與 API Key。僅填寫可信任的服務（包括本機或內網服務）；含憑證的請求不會跟隨 HTTP 重新導向
gui.config.field.ai.enabled.label=啟用 AI
gui.config.field.ai.enabled.help=停用時所有 AI 呼叫都會被拒絕；啟用後相關功能可呼叫所設定的大型語言模型
gui.config.field.ai.base-url.label=API 位址
gui.config.field.ai.base-url.help=OpenAI 相容端點，例如 https://api.openai.com/v1；選擇上方的「服務供應商預設值」可自動填入
gui.config.field.ai.api-key.label=API Key
gui.config.field.ai.api-key.help=在對應服務供應商的控制台建立；絕不會出現在日誌或任何回應中。本機模型（例如 Ollama／LM Studio）通常可留空
gui.config.field.ai.model.label=模型
gui.config.field.ai.model.help=要呼叫的模型名稱，例如 gpt-4o-mini／deepseek-chat／qwen-plus；模型更新較快，請以服務供應商文件為準
gui.config.field.ai.use-proxy.label=使用代理伺服器
gui.config.field.ai.use-proxy.help=開啟後，此設定的請求會經由 HTTP 代理伺服器（位址取自代理設定的 host:port）；海外供應商通常需要開啟，中國大陸供應商通常不需要。此選項獨立於全域代理開關
gui.config.ai.preset.label=服務供應商預設值
gui.config.ai.preset.help=選取後會自動填入並鎖定 API 位址，並依預設值填入模型與「使用代理伺服器」建議值；如需自訂端點，請選擇「自訂」
gui.config.ai.test-button.label=測試 AI 連線
gui.config.ai.test-button.help=使用目前表單設定（不需先儲存）向模型傳送一則極短的探測訊息，成功即表示位址／金鑰／模型／網路都可使用
gui.config.ai.test.notice.sending=正在測試 AI 連線，請稍候…
gui.config.ai.test.notice.success=AI 連線成功，模型回覆：{0}
gui.config.ai.test.notice.failed=AI 連線失敗，請查看日誌了解詳情
gui.config.ai.test.notice.unreachable=無法連線至後端服務，請確認服務正在執行
