ai.preset.name.zhipu=智譜 GLM
ai.preset.name.moonshot=月之暗面 Kimi（Moonshot）
ai.preset.name.doubao=字節豆包（火山方舟）
ai.preset.name.hunyuan=騰訊混元
ai.preset.name.ernie=百度文心一言（千帆）
