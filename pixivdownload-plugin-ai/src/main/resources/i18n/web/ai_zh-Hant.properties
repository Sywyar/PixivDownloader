ai.preset.name.minimax=MiniMax
ai.preset.name.ollama=Ollama（本機）
ai.preset.name.lmstudio=LM Studio（本機）
ai.preset.name.openrouter=OpenRouter（聚合）
ai.preset.name.siliconflow=矽基流動 SiliconFlow（聚合）
ai.preset.name.custom=自訂
ai.preset.help.api-key=在該服務供應商的開放平台／控制台建立 API Key，貼到下方的「API Key」。各家的計費與限額請以官方文件為準。
ai.preset.help.anthropic=Claude 透過其 OpenAI 相容端點接入（/v1/chat/completions，以 API Key 作為 Bearer）。請在 Anthropic 控制台建立 API Key；部分原生功能在相容端點下不可用。
ai.preset.help.gemini=Gemini 透過其 OpenAI 相容端點接入（/v1beta/openai）。請在 Google AI Studio 建立 API Key。
ai.preset.help.dashscope=請在阿里雲百鍊（DashScope）控制台建立 API Key（形如 sk-...）。
ai.preset.help.doubao=請在火山引擎方舟（Ark）控制台建立 API Key；「模型」欄可填寫模型名稱或接入點 ID（ep-...）。
ai.preset.help.ernie=百度千帆 V2 使用帳戶的安全驗證金鑰作為 Bearer Token；具體取得方式請參閱千帆控制台文件。
ai.preset.help.spark=訊飛星火使用控制台中 HTTP 服務介面的驗證金鑰（APIPassword）作為 API Key。
ai.preset.help.minimax=請在 MiniMax 開放平台建立 API Key（中國大陸站 api.minimaxi.com，國際站請改用 api.minimax.io）；部分介面還需要 GroupId，詳情請參閱官方文件。
ai.preset.help.local=本機／自託管（Ollama、LM Studio、vLLM 等）。不需要真實 API Key（可留空或隨意填寫）；開放原始碼模型（例如 MiMo 等）自託管後，在此填入對應模型名稱即可。
ai.preset.help.aggregator=聚合／路由平台，一個 Key 可存取多家模型。「模型」需使用該平台的完整模型識別碼（例如 openai/gpt-4o-mini）。
ai.preset.help.custom=自訂：自行填寫 OpenAI 相容端點的 API 位址／模型；API Key 依服務供應商要求填寫。
batch.auto-translate-label=自動翻譯新下載的小說
batch.translate-lang-label=目標語言：
batch.translate-lang-default=簡體中文
batch.translate-seg-label=分段字數：
batch.translate-glossary-hint=自動翻譯固定使用此小說／系列的預設術語對照表，不支援在此指定其他對照表；分段字數填 0 表示一次翻譯整章。僅限管理員使用，且需要先設定 AI。
