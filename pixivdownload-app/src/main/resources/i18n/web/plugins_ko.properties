page.subtitle=다운로드 도우미의 기능을 확장하세요 — 번역, 변환, 백업 및 알림을 필요에 따라 활성화하거나 비활성화할 수 있습니다.
security.notice.title=플러그인 권한 및 서명 안내
security.notice.desc=타사 플러그인은 기본적으로 별도의 JVM에서 실행되며 제한된 프로세스 간 프로토콜을 통해 지원되는 선언형 기여만 게시할 수 있습니다. 하지만 격리 프로세스도 애플리케이션과 같은 OS 계정을 사용하므로 완전한 OS 샌드박스는 아닙니다. ‘동일 프로세스 완전 신뢰’로 표시된 플러그인은 애플리케이션 JVM에서 실행되며 호스트의 모든 권한을 가집니다. 서명은 게시자 신원과 콘텐츠 무결성만 증명하며 보안 심사를 뜻하지 않습니다. 신뢰하는 플러그인만 설치하세요.
