common.help=사용 안내
common.progress={0} / {1}
common.skip=건너뛰기
common.prev=이전
common.next=다음
common.done=완료

batch.cookie.title=① Pixiv Cookie 입력
batch.cookie.body=로그인이 필요한 작품(R-18, 팔로워 한정 등)을 다운로드하려면 여기에 Pixiv Cookie를 붙여 넣으세요. 공개 작품만 다운로드한다면 이 단계를 건너뛰어도 됩니다.
batch.mode.title=② 다운로드 방식 선택
batch.mode.body=필요에 따라 작품 링크 일괄 가져오기, 작가 ID로 모든 작품 다운로드, 키워드 검색 다운로드 또는 전체 시리즈 다운로드를 선택하세요.
batch.start.title=③ 다운로드 시작
batch.start.body=다운로드할 항목을 추가한 뒤 여기를 클릭하여 시작하세요. 다운로드 중에는 이 페이지를 열어 두세요(대기열이 계속 백엔드로 전송됩니다). 모두 완료된 후 닫으세요.
batch.queue.title=④ 진행률 확인
batch.queue.body=여기에서 다운로드 상태와 대기열을 실시간으로 확인할 수 있으며 실패한 항목은 한 번에 다시 시도할 수 있습니다.
batch.gallery.title=⑤ 결과 탐색
batch.gallery.body=다운로드한 모든 작품은 로컬 갤러리에 들어갑니다. 여기를 클릭하여 언제든 다시 보고 관리하세요.

batch.cookie-import.install.title=① 기능 강화 도구 설치
batch.cookie-import.install.body=한 번에 가져오려면 pixiv.net의 "기능 강화 도구"가 필요합니다. 안내 중에는 페이지의 다른 내용을 클릭할 수 없습니다. 아래에서 강조 표시된 "기능 강화 도구" 설치 버튼을 클릭해야 다음 단계로 이동할 수 있습니다. 도구가 포함된 All-in-One 합본을 이미 설치했다면 "All-in-One을 설치했습니다"를 바로 클릭하세요.
batch.cookie-import.install.have-aio=All-in-One을 설치했습니다
batch.cookie-import.ready.title=② 가져오기 시작
batch.cookie-import.ready.body=이 브라우저에서 Pixiv에 로그인되어 있는지 확인하세요. "완료"를 클릭하면 Pixiv 페이지를 열어 Cookie를 자동으로 가져온 뒤 돌아옵니다. 몇 초 안에 완료됩니다.

gallery.search.title=① 다운로드한 작품 검색
gallery.search.body=작품 제목 또는 작가 이름을 입력하여 다운로드한 콘텐츠를 빠르게 찾으세요. 검색 범위는 왼쪽 드롭다운에서 전환할 수 있습니다.
gallery.filter.title=② 조건으로 필터링
gallery.filter.body=필터를 열어 태그, 작가, 등급 등을 조합하여 정밀하게 원하는 작품을 찾으세요.
gallery.views.title=③ 보기 전환
gallery.views.body=모든 이미지, 작가별, 시리즈 만화별 보기 사이를 전환하여 여러 기준으로 보관 작품을 탐색하세요.
gallery.grid.title=④ 탐색 및 관리
gallery.grid.body=여기에 다운로드한 작품이 표시됩니다. 클릭하여 큰 이미지를 보거나 북마크에 추가하거나 추가로 관리할 수 있습니다.
gallery.download.title=⑤ 더 많이 다운로드
gallery.download.body=새 작품을 다운로드하려면 여기에서 다운로드 페이지로 돌아가세요. "완료"를 눌러 이 안내를 끝낸 후 PixivDownloader 프로그램 창으로 돌아가면 후속 안내가 자동으로 계속됩니다.

# ── 새 사용자 페이지 간 안내(onboarding.*) ──────────────────────────────────────
onboarding.common.skip=안내 건너뛰기
onboarding.common.next=다음
onboarding.common.done=완료
onboarding.common.copy=복사
onboarding.common.copied=복사됨

onboarding.welcome.title=👋 PixivDownloader에 오신 것을 환영합니다
onboarding.welcome.intro=처음 뵙겠습니다! 첫 번째 예제 작품을 다운로드하며 전체 과정을 익힐 수 있도록 안내하겠습니다. 먼저 어떻게 불러 드리면 될까요?
onboarding.welcome.name-placeholder=호칭 입력(비워 둘 수 있음)
onboarding.welcome.default-name=친구

onboarding.network.title=① 네트워크 연결 확인
onboarding.network.intro=안녕하세요, {name}님! 시작하기 전에 백엔드가 Pixiv에 연결할 수 있는지 확인합니다(설정한 프록시를 통해 연결).
onboarding.network.checking=네트워크 확인 중…
onboarding.network.checking-btn=확인 중…
onboarding.network.ok=Pixiv 연결 가능: {ping}ms
onboarding.network.fail=Pixiv에 연결할 수 없습니다. 프록시 / 네트워크 설정을 확인하세요.
onboarding.network.fail-hint=흔한 원인: 프록시가 꺼져 있거나 포트가 잘못되었습니다. 프로그램의 "설정 / config.yaml"에서 proxy.host / proxy.port를 설정한 뒤 다시 시도하세요.
onboarding.network.retry=다시 시도
onboarding.network.start-download=첫 번째 작품 다운로드 시작

onboarding.orient.progress=다운로드 페이지 알아보기 · {step}/4
onboarding.orient.cookie.title=① Cookie 영역
onboarding.orient.cookie.body=여기에 Pixiv Cookie를 입력합니다. 로그인이 필요한 작품(R-18, 팔로워 한정 등)을 다운로드하려면 먼저 Cookie를 저장해야 합니다. 이번 예제는 전연령 작품이므로 지금 설정하지 않아도 됩니다.
onboarding.orient.scripts.title=② Tampermonkey 스크립트 영역
onboarding.orient.scripts.body=여기에서 함께 사용할 Tampermonkey 스크립트를 설치할 수 있습니다. Pixiv에서 로그인 Cookie를 한 번에 가져오고, 작품 링크를 수집하고, 일괄 다운로드하는 등의 기능을 제공합니다. 이번 예제에는 필요하지 않으므로 먼저 알아보기만 하세요.
onboarding.orient.tabs.title=③ 다운로드 방식
onboarding.orient.tabs.body=여기에서 다운로드 방식을 전환합니다: 내 북마크 / 팔로우 / 작품 빠른 가져오기, 작품 링크 일괄 가져오기, 작가 ID로 다운로드, 키워드 검색, 전체 시리즈 다운로드.
onboarding.orient.choose.title=④ 다운로드 방식 선택
onboarding.orient.choose.body=처음에는 "작품 링크 일괄 가져오기"를 예제로 사용합니다. 이 모드로 전환해 두었으니 "다음"을 눌러 예제 작품을 다운로드하세요.

onboarding.download.progress=예제 다운로드 · {step}/5
onboarding.download.paste.title=① 예제 작품 링크 붙여 넣기
onboarding.download.paste.body=아래 예제 작품 링크를 복사하여 강조 표시된 입력란에 붙여 넣으세요:
onboarding.download.paste.ok=✓ 예제 작품을 인식했습니다. "다음"을 눌러 계속하세요.
onboarding.download.paste.foreign=다른 콘텐츠가 감지되었습니다. 먼저 안내를 완료하세요~ 이 단계에서는 위의 예제 링크만 붙여 넣습니다.
onboarding.download.queue.title=② 다운로드 대기열에 추가
onboarding.download.queue.body=강조 표시된 "가져와서 대기열에 추가" 버튼을 클릭하여 예제 작품을 다운로드 대기열에 추가하세요.
onboarding.download.filters.title=③ 추가 필터
onboarding.download.filters.body=콘텐츠 등급, AI, 태그, 유형, 페이지 수, 북마크 수 등의 조건으로 다운로드할 작품을 필터링할 수 있습니다. 조건에 맞지 않는 항목은 다운로드할 때 자동으로 건너뜁니다. 먼저 알아보기만 하고 이 단계에서는 변경하지 않습니다.
onboarding.download.settings.title=④ 다운로드 설정
onboarding.download.settings.body=작품 간 간격, 동시 다운로드 수, 이미 다운로드한 작품 건너뛰기, 다운로드 후 자동 북마크, 파일명 형식 등을 설정합니다. 먼저 알아보기만 하고 이 단계에서는 변경하지 않습니다.
onboarding.download.start.title=⑤ 다운로드 시작
onboarding.download.start.body=강조 표시된 "다운로드 시작" 버튼을 클릭하세요. 다운로드 중에는 이 페이지를 열어 두세요.

onboarding.monitor.title=⏳ 예제 작품 다운로드 중
onboarding.monitor.body=다운로드 중입니다. 잠시 기다려 주세요… 아래 상태 표시줄과 다운로드 대기열에 진행률이 실시간으로 표시되며, 완료되면 갤러리로 이동합니다.
onboarding.monitor.body.no-result=다운로드 중입니다. 잠시 기다려 주세요… 아래 상태 표시줄과 다운로드 대기열에 진행률이 실시간으로 표시되며, 완료되면 다운로드 결과를 확인하라는 안내가 표시됩니다.
onboarding.monitor.success.title=🎉 다운로드 성공!
onboarding.monitor.success.body=첫 번째 작품을 로컬에 다운로드했습니다. 강조 표시된 "갤러리" 진입점을 클릭하여 결과를 확인하세요.
onboarding.monitor.success.no-result.body=첫 번째 작품을 로컬에 다운로드했습니다. 현재 열 수 있는 다운로드 결과 진입점이 없어 안내를 완료했습니다.
onboarding.monitor.fail.title=다운로드 실패
onboarding.monitor.fail.body=예제 작품을 다운로드하지 못했습니다. Cookie와 네트워크 / 프록시를 확인한 후 다시 시도하세요.
onboarding.monitor.fail.retry=다시 다운로드

onboarding.gallery.progress=갤러리 알아보기 · {step}/{total}
onboarding.gallery.views.title=① 보기
onboarding.gallery.views.body=왼쪽에서 "모든 이미지 / 작가별 / 시리즈 만화별" 사이를 전환하여 여러 기준으로 다운로드한 작품을 탐색하세요. 아래에는 북마크와 각 페이지 탐색도 있습니다.
onboarding.gallery.search.title=② 검색
onboarding.gallery.search.body=작품 제목, 작가 이름, 태그 등을 입력하여 다운로드한 콘텐츠를 빠르게 찾으세요. 왼쪽 드롭다운에서 검색 범위를 전환할 수 있습니다.
onboarding.gallery.filter.title=③ 필터
onboarding.gallery.filter.body=필터를 열어 정렬, 등급, AI, 형식, 북마크, 시리즈 등의 조건을 조합하여 원하는 작품을 정밀하게 찾으세요.
onboarding.gallery.grid.title=④ 작품 그리드
onboarding.gallery.grid.body=다운로드한 작품이 모두 여기에 표시됩니다. 카드를 클릭하면 작품 상세 페이지로 이동합니다.
onboarding.gallery.card.title=🖼 방금 다운로드한 작품입니다
onboarding.gallery.card.body=강조 표시된 작품 카드를 클릭하여 작품 상세 페이지로 이동하세요.
onboarding.gallery.card.body-fallback=다운로드한 작품이 여기에 표시됩니다. 카드를 클릭하면 작품 상세 페이지로 이동합니다.

onboarding.redirect.title=👋 PixivDownloader에 오신 것을 환영합니다
onboarding.redirect.body=초보자 안내는 "다운로드 페이지"에서 시작하여 첫 번째 예제 작품을 다운로드합니다. 지금 이동하시겠습니까?
onboarding.redirect.later=나중에
onboarding.redirect.go=다운로드 페이지로 이동

onboarding.detail.viewer.title=① 작품 이미지 영역
onboarding.detail.viewer.body=여기에 작품 이미지가 표시됩니다. 이미지를 클릭하면 확대해서 볼 수 있으며, 여러 이미지 작품은 페이지별로 펼쳐집니다.
onboarding.detail.actions.title=② 기능 영역
onboarding.detail.actions.body=작품 작업 영역입니다. 여러 이미지 펼치기/접기, Pixiv 원작으로 이동, 작품 표시 및 로컬 작품 삭제 등을 수행하며 옆에 페이지 수와 형식 정보도 표시됩니다.
onboarding.detail.meta.title=③ 설명 영역
onboarding.detail.meta.body=작품 제목, 설명, 태그가 여기에 표시됩니다. 태그를 클릭하면 갤러리에서 같은 태그의 작품을 필터링할 수 있습니다.
onboarding.detail.author.title=④ 작가 영역
onboarding.detail.author.body=작품 작가 정보입니다. 클릭하여 이 작가의 다른 로컬 작품을 보거나 Pixiv 홈페이지로 이동할 수 있습니다.
onboarding.detail.series.title=⑤ 시리즈 / 관련 영역
onboarding.detail.series.body=작품이 시리즈에 속하면 여기에서 같은 시리즈의 다른 장을 볼 수 있습니다. 아래에는 관련 작품도 추천됩니다.

onboarding.done.title=🎉 초보자 안내 완료!
onboarding.done.body=다운로드부터 탐색까지 전체 과정을 마쳤습니다. 이제 "빠른 가져오기 / 검색 / 시리즈" 등으로 더 많은 작품을 일괄 다운로드하며 자유롭게 탐색해 보세요!
onboarding.done.close=사용 시작
