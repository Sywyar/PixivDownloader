keys.title=プログラム用アクセスキー
keys.description=スクリプトや外部プログラムごとにキーを作成し、権限と許可する接続元 IP を指定します。
back=ホームに戻る
create=キーを作成
refresh=更新
name=名前
permissions=権限
permissions.help=プログラムに必要な権限を選択してください。共通の設定、ツール、ダウンロード、バッチには、コア操作と対象プラグインの両方の権限が必要です。プラグイン全体を選択しても、対象は現在表示されている権限のみで、今後追加される機能は含まれません。
permissions.none=権限が選択されていません。このキーでは業務 API を呼び出せません。
permissions.unavailable=以前の権限の一部は現在利用できず、保存時に削除されます。選択内容を確認してください。
source=接続元 IP
source.restricted=指定したアドレスまたはネットワークを許可
source.any=すべての接続元
source.addresses=許可する IP アドレスまたは CIDR ネットワーク
source.help=IPv4、IPv6、CIDR ネットワークを1行に1つ入力します。例：192.0.2.10、2001:db8::/64。リバースプロキシを使用する場合は、先に信頼するプロキシを設定してください。
source.required=接続元アドレスを1つ以上入力するか、「すべての接続元」を選択してください。
cancel=キャンセル
review=確認して続行
review.title=権限と接続元の確認
created.title=キーを作成しました
created.help=キー全体は一度だけ表示されます。この画面を離れる前に、プログラムの安全な設定先にコピーしてください。
created.secret=キー全体
copy=キーをコピー
done=完了
copied=キーをコピーしました。
copy.manual=自動コピーに失敗しました。選択されたキーを手動でコピーしてください。
empty=プログラム用アクセスキーはまだありません。
summary=権限 {count} 件
unused=今回の起動後は未使用
times=作成日時：{created} · 最終使用：{used}
edit=権限を編集
revoke=キーを失効
revoke.help=「{name}」を使う新しいリクエストは拒否されます。失効は取り消せません。
select.current=現在の権限をすべて選択
save=権限を保存
request.failed=リクエストに失敗しました。接続とログイン状態を確認してください。
request.check-before-retry=保存結果が不明な場合は、一覧に戻って更新し、結果を確認してから再試行してください。
