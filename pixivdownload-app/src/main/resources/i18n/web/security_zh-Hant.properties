permissions=權限
permissions.help=只選擇程式需要的權限。共用設定、工具、下載與批次需要同時選擇核心入口與目標外掛權限。選取整個外掛只包含目前列出的權限，不會自動授予未來新增的功能。
permissions.none=未選擇任何權限，此金鑰無法呼叫業務 API。
permissions.unavailable=部分原有權限目前不可用，儲存時將移除。請檢查目前的選擇。
