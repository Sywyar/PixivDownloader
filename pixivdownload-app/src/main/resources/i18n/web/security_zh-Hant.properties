instructions.restricted=介面文件：{0}\n此金鑰無法讀取介面目錄。請讓我提供文件，再使用另外提供的金鑰，在授權範圍內協助我完成任務。每個請求都在請求標頭中傳送 Authorization: Bearer <金鑰>，可先呼叫 GET /api/security/program-keys/self 確認這把金鑰的權限。
instructions.unavailable=無法讀取執行個體位址。請先儲存金鑰。
instructions.title=給 Agent 的提示詞
instructions.help=提示詞只包含介面文件位址和使用要求，不含金鑰。請將金鑰另外設定到 Agent 的執行環境。
created.instructions=請使用另外提供的程式金鑰讀取 PixivDownloader 的 OpenAPI 文件：\n{0}\n每個請求都在請求標頭中傳送 Authorization: Bearer <金鑰>。開始前先呼叫 GET /api/security/program-keys/self 確認這把金鑰的權限；介面回傳 401 或 403 時，programPermission 欄位會寫明缺少的權限。請依文件選擇介面，在授權範圍內協助我完成任務。
