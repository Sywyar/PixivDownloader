security.notice.desc=プラグインは既定でホストプロセスの完全信頼モードで実行され、アプリケーションを実行しているユーザーの OS 権限を継承するため、ファイルの読み書き、ネットワークアクセス、プロセスの起動が可能です。「宣言型の分離 JVM（限定的な隔離）」を明示した場合のみ、制限付きの宣言型 worker で実行されます。worker も同じ OS アカウントを使うため、完全なサンドボックスではありません。署名は発行者の身元と内容の完全性のみを証明し、安全性の審査を意味しません。明示的に信頼できるプラグインだけを実行してください。
