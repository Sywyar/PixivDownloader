intro=在桌面端「安全 → 程序访问密钥」或用命令行 `--program-key-create` 创建程序密钥，通过 HTTPS 在请求头中发送 `Authorization: Bearer <key>`。在线试调仅适用于 HTTPS 或本机回环地址。 OpenAPI 操作中 `responses[status].links` 给出可接续执行的请求，`externalDocs` 打开对应指南。`x-related-operations` 供查找相关方法；调用前请核对目标方法的用途和权限。 `x-related-guides` 列出这些方法引用的指南。
pagination=分页参数因接口而异。`GET /api/gallery/artworks` 使用 `page` 和 `size`，从第 0 页开始。`GET /api/download/batches/{id}/items` 使用 `offset` 和 `limit`。`GET /api/download/tasks/history` 首页省略 `beforeTime` 和 `beforeId`，续页时一起传回上一页返回的两个值。\n\n插件市场使用 `cursor` 和 `limit`，首页省略 `cursor`。读取下一页时，`/api/plugin-market/catalog` 用响应的 `nextCursor` 作为 `cursor`，`/api/plugin-market/plugins/{repositoryId}/{pluginId}` 则用 `nextVersionCursor`。Pixiv 的插画和小说搜索、系列查询只用 `page` 分页，从 1 开始。 关注动态使用 p，两条范围搜索使用 startPage 和 endPage。
permissions=每个操作列出路由策略、可用身份和所需权限。部分操作还会检查目标插件权限。管理员可用 GET /api/security/program-keys/permissions 查看权限。使用程序密钥时，请单独发送 Bearer，勿同时发送会话或邀请 Cookie、X-Session-Token 或 X-GUI-Token。 /api/gui/ 供本地桌面使用。程序客户端请选择声明 programKey 的操作，并遵循该操作的响应契约。 `x-program-permissions` 中各阶段、条件字段和上下文表达式的定义见本文档顶层 `x-program-permission-conditions`。 单独发送有效密钥访问未声明 `programKey` 的操作会收到 `403 auth.program.unsupported`，包括允许匿名访问的操作。无效密钥或混用凭据可能返回 `401 auth.program.invalid`。\n\n轮换密钥时，管理员在桌面端「安全 → 程序访问密钥」、命令行 `--program-key-create` 或管理员会话中创建新密钥。客户端切换后，用 `GET /api/security/program-keys/self` 核对新密钥的身份和权限，再由管理员撤销旧密钥。新密钥无法读取旧密钥提交的任务，可在撤销前轮询至终态，或用管理员会话跟踪。
