response.serverFailure=请求处理期间发生未单独映射的异常时，服务器返回 HTTP 500，JSON 包含 code（error.unexpected）和按请求语言生成的 error。各操作下列出的业务失败另有具体状态和错误码。 实例维护、恢复模式或插件暂停接收请求时也可能返回 503。若包含 `Retry-After`，请在指定时间后重试。
guide.url=https://sywyar.github.io/PixivDownloader/#/zh-cn/http-api
integration=程序密钥可通过 `GET /api/security/program-keys/self` 查看自己的授权。轮询 `GET /api/download/tasks` 或单个任务可读取 `phase`、`updatedAt`、`revision`。执行器提供计数时，`progress` 包含单位、已完成数和总数。订阅下载事件需要会话。 建议每 2 秒读取一次。`revision` 持续不变时逐步延长至 10 秒，有更新时恢复到 2 秒。`phase` 为 `COMPLETED`、`FAILED` 或 `CANCELLED` 时停止。收到 `Retry-After` 时，至少等待指定时间再请求。\n\n写操作的 `x-csrf-origin` 同样适用于 Bearer 客户端。`origin-or-referer` 要求同源 Origin 或 Referer，`origin-required` 要求满足该操作说明的 Origin。\n\n默认部署仅支持网页同源调用 API（协议、主机和端口均相同）。其他来源的网页可通过自己的后端转发请求。OpenAPI 中的 `/` 指文档所在源的根路径。独立客户端请配置实例的完整地址。
key.self=每把已认证的程序密钥都能读取自身的授权，无需额外权限。
comparison=## 跨接口字段与分页对照\n\n- **作品 ID** — 画廊的 `artworkId` 和导出请求的 `ids[]` 使用 JSON 整数，如 `42`。下载任务的 `workId`、Pixiv 搜索结果的 `id`、批次条目的 `key.id` 使用字符串，如 `"42"`。提交插画时使用 `workType="artwork"`，回执的 `queueType="illust"` 是队列名。\n- **下载选项** — 单任务的 `options` 使用字符串值。批量任务的 `definition.download` 对同一选项使用 JSON 布尔值或整数。两个完整请求见下方示例。\n- **路径** — 任务的 `outputPath` 表示预计输出目录，可能为空。画廊的 `folder` 是已登记的目录。两者的路径分隔符可能不同，关联记录时使用作品 ID。\n- **时间** — 任务的 `updatedAt` 是 ISO 8601 时间，可含小数秒。批次的 `createdTime`、画廊的 `time` 和计划的 `nextRunTime` 使用 Unix 毫秒。任务历史续页时原样传回 `beforeTime`，保留全部小数位。\n- **响应外形** — `GET /api/authors` 返回数组。`GET /api/authors/paged` 把数组放在 `content` 中，并返回分页信息。`GET /api/downloaded/statistics` 返回含 `success` 和计数的对象。\n- **读取插画**：下载记录和文件校验用 `GET /api/library/artworks/{artworkId}`（无记录时 400，空响应体）；画廊元数据用 `GET /api/gallery/artwork/{artworkId}`（不可见或不存在时 404）；本机界面使用 `GET /api/downloaded/{artworkId}`，程序密钥请用 library。\n- **筛选条件**：画廊查询使用逗号分隔，例如 `?format=jpg,png&collectionIds=12,34`；导出请求的 `filter` 使用 JSON 数组，例如 `{"formats":["jpg","png"],"collectionIds":[12,34]}`。\n\n### 分页与续页
comparison.task=### 同一件 Pixiv 插画的两种提交方式\n\n选择其中一种，将示例的作品 ID `42` 换成当前账号可访问的作品 ID。向 `POST /api/download/tasks` 提交新任务时生成新的 `requestId`。重试同一请求时保留原值。
comparison.batch=向 `POST /api/download/batches` 提交前，先调用 `GET /api/schedule/sources`，用 `sources` 中 `sourceType` 为 `explicit-list` 的条目所返回的 `activationToken` 替换占位符。示例依赖实例已启用对应的下载类型和来源。
binding.in=参数所在的位置。
binding.field=路径、查询、请求头或表单分段的名称。请求体字段使用 JSON Pointer。
binding.reason=供程序判断的校验原因，例如 required（缺失）、type（类型错误）或 invalid_value（无效值）。
response.maintenance=维护期间返回 auth.maintenance，Retry-After 表示建议等待的秒数。
response.quiesced=负责此路由的插件暂停接收请求时返回 plugin.unavailable.quiesced。
missing=### 记录缺失时的响应\n\n| 读取的资源 | 响应 | 客户端处理 |\n| --- | --- | --- |\n| 本地作品下载记录 `GET /api/library/artworks/{artworkId}` | `400` | 空响应体。先判断状态和响应体，再解析 JSON。 |\n| 部分下载记录 `GET /api/library/artworks/{artworkId}/partial` | `404 error.request.not-found` | 该作品没有未完成的分页记录。 |\n| 指定 UUID 的下载任务 `GET /api/download/tasks/{taskId}` | `404 DOWNLOAD_TASK_NOT_FOUND` | 检查回执与调用身份。未知和不可见任务返回相同错误。 |\n| 按作品查询下载进度 `GET /api/download/status/{artworkId}` | `200 success=false` | 当前没有可见的进度记录。 |\n| 归档状态 `GET /api/archive/status/{token}` | `200 status=expired` | 令牌未知或已过期，结束轮询。 |\n| 归档文件 `GET /api/archive/download/{token}` | `410` | 如仍需要文件，重新打包。 |
