hints.lead=다음 방법을 시도해 보세요
action.home=홈으로 돌아가기
action.retry=다시 시도
action.login=로그인하기
theme.to-dark=다크 모드로 전환
theme.to-light=라이트 모드로 전환

400.doc-title=400 · 잘못된 요청 형식
400.title=이 요청은<em>맞지 않습니다</em>
400.description=서버가 이 요청을 이해하지 못했습니다(400 Bad Request). 링크가 일부 빠졌거나 매개변수 형식이 잘못되었거나 페이지 상태가 만료되었을 수 있습니다.
400.hint-1=주소 표시줄의 링크가 완전한지 확인하세요.
400.hint-2=페이지를 새로 고쳐 상태를 다시 시작하세요.
400.hint-3=홈에서 다시 들어와 작업을 반복하세요.
400.art-label=틈 위에 떠 있는 퍼즐 조각이 맞지 않음

403.doc-title=403 · 접근 권한 없음
403.title=이 문은 잠시<em>열려 있지 않습니다</em>
403.description=현재 계정에는 이 페이지에 접근할 권한이 없습니다(403 Forbidden). 관리자 전용이거나 초대 링크의 표시 범위 밖일 수 있습니다.
403.hint-1=관리자라면 먼저 로그인하세요.
403.hint-2=초대 링크를 사용했다면 초대한 사람에게 표시 범위를 확인하세요.
403.hint-3=홈으로 돌아가 권한이 있는 곳으로 이동하세요.
403.art-label=잠긴 자물쇠가 걸린 닫힌 문

404.doc-title=404 · 페이지를 찾을 수 없음
404.title=이곳은 어쩌면<em>예전에 존재했을지도 모릅니다</em>
404.description=요청한 페이지가 존재하지 않습니다(404 Not Found). 이동되었거나 삭제되었거나, 처음부터 주소에 글자가 하나 더 있었을 수 있습니다.
404.hint-1=주소 표시줄 링크의 오탈자를 확인하세요.
404.hint-2=홈으로 돌아가 탐색 메뉴에서 다시 찾으세요.
404.hint-3=원래 있어야 하는 페이지라면(예: 기능 페이지가 사라진 경우) GitHub에서 알려 주세요.
404.art-label=점선 경로의 끝이 X로 표시된 지도

429.doc-title=429 · 요청이 너무 많음
429.title=조금 천천히,<em>숨을 고르세요</em>
429.description=요청이 너무 많아 속도 제한 보호가 작동했습니다(429 Too Many Requests). 차단된 것은 아니며 잠시 기다리면 카운트다운이 끝난 뒤 정상으로 돌아옵니다.
429.hint-1=약 30초 기다린 후 새로 고치거나 다시 시도하세요.
429.hint-2=동시에 연 페이지와 병렬 작업을 줄이세요.
429.art-label=모래가 떨어지는 모래시계

500.doc-title=500 · 서버 내부 오류
500.title=당신의 잘못이 아닙니다. 아마<em>서버가 지친 것</em>일 수 있습니다.
500.description=요청을 처리하는 동안 서버에서 예상하지 못한 내부 오류가 발생했습니다(500 Internal Server Error). 요청은 완료되지 않았지만 이로 인해 데이터가 손상되지는 않습니다.
500.hint-1=잠시 기다린 후 다시 시도하세요.
500.hint-2=반복되면 로그 파일(log 디렉터리)을 열어 구체적인 예외를 확인하세요.
500.hint-3=로그의 오류 정보를 가지고 GitHub에 issue를 열어 주세요.
500.art-label=엎드려 졸고 있는 서버

502.doc-title=502 · 외부 서비스 오류
502.title=다리<em>건너편</em>에서 응답하지 않음
502.description=서버가 Pixiv와 같은 업스트림 서비스로 요청을 전달하는 중 잘못된 응답을 받았습니다(502 Bad Gateway). 대개 기기보다 업스트림이나 네트워크 경로의 문제입니다.
502.hint-1=업스트림의 일시적인 불안정일 수 있으니 잠시 후 다시 시도하세요.
502.hint-2=프록시와 네트워크 연결이 정상인지 확인하세요.
502.hint-3=Pixiv Cookie가 여전히 유효한지 확인하고 만료되었다면 다시 저장하세요.
502.art-label=끊어진 다리와 건너편의 구름

503.doc-title=503 · 서비스를 일시적으로 사용할 수 없음
503.title=잠시 쉬었다가<em>곧 돌아옵니다</em>
503.description=서비스를 일시적으로 사용할 수 없습니다(503 Service Unavailable). 유지 보수, 재시작 또는 일시적인 과부하 때문일 수 있으며 보통 수십 초 안에 복구됩니다.
503.hint-1=잠시 기다린 후 다시 새로 고치세요.
503.hint-2=오래 복구되지 않으면 로그를 확인하거나 GitHub에 알려 주세요.
503.art-label=김이 나는 커피 한 잔

4xx.doc-title=4xx · 요청 오류
4xx.title=요청 측에서<em>문제가 발생했습니다</em>
4xx.description=이 요청이 수락되지 않았습니다(4xx 클라이언트 오류). 형식, 권한, 빈도 또는 대상 리소스 상태처럼 요청 자체와 관련된 문제일 수 있습니다.
4xx.hint-1=입력 내용과 링크가 올바른지 확인하세요.
4xx.hint-2=페이지를 새로 고친 후 다시 작업하세요.
4xx.hint-3=홈으로 돌아가 정상적인 진입점에서 다시 시작하세요.
4xx.art-label=반송된 편지

5xx.doc-title=5xx · 서버 오류
5xx.title=서버 측에서<em>문제가 발생했습니다</em>
5xx.description=서버가 요청을 처리하는 동안 오류가 발생했습니다(5xx 서버 오류). 작업 때문에 발생한 것이 아니라 서버 측의 문제입니다.
5xx.hint-1=잠시 기다린 후 다시 시도하세요.
5xx.hint-2=반복되면 로그 파일(log 디렉터리)을 열어 구체적인 예외를 확인하세요.
5xx.hint-3=현상과 로그를 가지고 GitHub에 issue를 열어 주세요.
5xx.art-label=톱니바퀴와 렌치
