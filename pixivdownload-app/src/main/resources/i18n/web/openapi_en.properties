intro=Create a program key under Security → Program access keys on the desktop, or with the `--program-key-create` command. Send it over HTTPS in the `Authorization: Bearer <key>` header. You can test requests here over HTTPS or on loopback. The OpenAPI operation’s `responses[status].links` describe follow-up requests. Open `externalDocs` for the guide. Use `x-related-operations` to discover related methods, then check the target operation and permissions before calling it. `x-related-guides` lists guides linked by those operations.
pagination=Pagination depends on the endpoint. `GET /api/gallery/artworks` uses `page` and `size`, starting at page 0. `GET /api/download/batches/{id}/items` uses `offset` and `limit`. For `GET /api/download/tasks/history`, omit `beforeTime` and `beforeId` on the first request. To continue, send both values returned by the previous page.\n\nThe plugin market uses `cursor` and `limit`. Omit `cursor` on the first request. For the next page, set `cursor` to `nextCursor` from `/api/plugin-market/catalog` or `nextVersionCursor` from `/api/plugin-market/plugins/{repositoryId}/{pluginId}`. Pixiv artwork and novel searches and series lookups take only `page` for pagination, starting at 1. The followed-creators feed uses p. Range searches use startPage and endPage.
permissions=Each operation lists its route policy, authentication alternatives and permissions. Some also check the target plugin. Administrators can list permissions at GET /api/security/program-keys/permissions. Send the Bearer key by itself, without a session or invitation cookie, X-Session-Token or X-GUI-Token. Routes under /api/gui/ serve the local desktop. Program clients should choose an operation that declares programKey and use its documented response. See the top-level `x-program-permission-conditions` for the phases, fields and context expressions used in `x-program-permissions`. A valid Bearer key sent on its own to an operation without `programKey` receives `403 auth.program.unsupported`, even when anonymous access is allowed. An invalid key or mixed credentials can return `401 auth.program.invalid`.\n\nTo rotate a key, an administrator creates its replacement under Security → Program access keys on the desktop, with `--program-key-create`, or through an administrator session. Switch the client, verify the new identity and grants with `GET /api/security/program-keys/self`, then have the administrator revoke the old key. Tasks submitted with the old key remain scoped to it. Finish polling them before revocation or follow them with an administrator session.
