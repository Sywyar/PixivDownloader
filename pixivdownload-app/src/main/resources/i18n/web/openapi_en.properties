response.serverFailure=An unhandled exception during request processing returns HTTP 500 with code set to error.unexpected and a localized error message. Each operation lists its specific business failures. Instance maintenance, recovery mode or a plugin no longer accepting requests can also return 503. If the response includes `Retry-After`, wait until the indicated time before retrying.
guide.url=https://sywyar.github.io/PixivDownloader/#/en/http-api
integration=Use `GET /api/security/program-keys/self` to read this key’s grants. Poll `GET /api/download/tasks` or an individual task for `phase`, `updatedAt` and `revision`. When the worker reports counts, `progress` gives the unit, completed count and total. Download event streams require a session. Start polling every 2 seconds. If `revision` stays the same, increase the interval up to 10 seconds. Return to 2 seconds after an update. Stop when `phase` is `COMPLETED`, `FAILED` or `CANCELLED`. If a response includes `Retry-After`, wait at least that long before the next request.\n\nThe `x-csrf-origin` rule on a write operation also applies to Bearer clients. `origin-or-referer` requires a same-origin Origin or Referer. For `origin-required`, send an Origin that meets the operation’s requirements.\n\nBy default, a web page can call the API directly only from the same origin (scheme, host and port). Pages on other origins can send requests through their own backend. The OpenAPI server URL `/` is the root of the origin serving this document. Configure the full instance URL in standalone clients.
key.self=Every authenticated program key can read its own grants without an additional permission.
comparison=## Fields and pagination across endpoints\n\n- **Work IDs** — Gallery `artworkId` and export `ids[]` use JSON integers such as `42`. Task `workId`, Pixiv search `id` and batch item `key.id` use strings such as `"42"`. Submit illustrations with `workType="artwork"`. The receipt’s `queueType="illust"` names the queue.\n- **Download options** — A single task takes string values in `options`. A batch takes JSON booleans or integers for the same settings in `definition.download`. Both request bodies appear below.\n- **Paths** — Task `outputPath` is the planned output directory and can be null. Gallery `folder` is the registered directory. Path separators can differ. Join records by work ID.\n- **Times** — Task `updatedAt` uses ISO 8601 and can include fractional seconds. Batch `createdTime`, gallery `time` and schedule `nextRunTime` use Unix milliseconds. Send the history cursor’s `beforeTime` back with its full precision.\n- **Response bodies** — `GET /api/authors` returns an array. `GET /api/authors/paged` returns the array in `content` with pagination metadata. `GET /api/downloaded/statistics` returns an object with `success` and counts.\n- **Reading an illustration** — Use `GET /api/library/artworks/{artworkId}` for the download record and optional file verification (missing record: empty 400). Use `GET /api/gallery/artwork/{artworkId}` for visible gallery metadata (404 if unavailable). The local interface uses `GET /api/downloaded/{artworkId}`; program keys use the library route.\n- **Filters** — Gallery queries use comma-separated values, for example `?format=jpg,png&collectionIds=12,34`. An export request uses JSON arrays inside `filter`, for example `{"formats":["jpg","png"],"collectionIds":[12,34]}`.\n\n### Pagination and continuation
comparison.task=### Two ways to submit the same Pixiv illustration\n\nChoose one request and replace the sample work ID `42` with a work your account can access. For `POST /api/download/tasks`, generate a new `requestId` for each new task and reuse it when retrying the same request.
comparison.batch=For `POST /api/download/batches`, first call `GET /api/schedule/sources`. Replace the placeholder with the `activationToken` of the `sources` entry whose `sourceType` is `explicit-list`. These examples require the corresponding download type and source to be active on the instance.
binding.in=Where the invalid input was supplied.
binding.field=Name of the path parameter, query parameter, header or multipart part. Body fields use a JSON Pointer.
binding.reason=Machine-readable validation reason, such as required, type or invalid_value.
response.maintenance=During maintenance, auth.maintenance includes Retry-After in seconds.
response.quiesced=When the plugin serving this route stops accepting requests, the code is plugin.unavailable.quiesced.
missing=### When a record is missing\n\n| Resource | Response | Client action |\n| --- | --- | --- |\n| Local download record `GET /api/library/artworks/{artworkId}` | `400` | The body is empty. Check status and body before parsing JSON. |\n| Partial download record `GET /api/library/artworks/{artworkId}/partial` | `404 error.request.not-found` | There is no unfinished page selection for this artwork. |\n| Download task UUID `GET /api/download/tasks/{taskId}` | `404 DOWNLOAD_TASK_NOT_FOUND` | Check the receipt and caller identity. Unknown and invisible tasks give the same error. |\n| Download progress by artwork `GET /api/download/status/{artworkId}` | `200 success=false` | There is no visible progress record. |\n| Archive status `GET /api/archive/status/{token}` | `200 status=expired` | The token is unknown or expired. Stop polling. |\n| Archive file `GET /api/archive/download/{token}` | `410` | Request a new archive if the file is still needed. |
