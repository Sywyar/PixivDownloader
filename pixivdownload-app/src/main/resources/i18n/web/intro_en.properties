# 首屏
hero.badge=Open source · Runs on your own computer
hero.title=The art you love,<br>kept in your hands.
hero.lead=PixivDownloader saves illustrations, manga, ugoira and novels from Pixiv to your disk, then organizes them into a local gallery you can search and read.
hero.cta.download=Download latest release
hero.cta.docs=Read the docs

