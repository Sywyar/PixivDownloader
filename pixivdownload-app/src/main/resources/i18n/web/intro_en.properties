# 获取
collect.eyebrow=Collect
collect.title=From a single link<br>to an artist's entire catalog.
collect.lead=Paste a link, pick an artist, set up a search, or pull in your own bookmarks. The download queue takes care of the rest.
collect.s1.name=Artwork links
collect.s1.desc=Paste one link or a whole batch and they go straight into the queue.
collect.s2.name=Artists
collect.s2.desc=Fetch everything an artist has posted.
collect.s3.name=Search
collect.s3.desc=Search by keyword, filter the results, then download them in bulk.
collect.s3.sample=landscape night
collect.s4.name=Series
collect.s4.desc=Save manga and novel series as complete sets, in order.
collect.s5.name=My bookmarks
collect.s5.desc=Pull in your own bookmarks, new works from users you follow, and your collections.
collect.s5.sample=My bookmarks · All
collect.note=You can also install the companion userscripts and add tasks straight from Pixiv pages.
collect.queue.title=Download queue
collect.queue.waiting=Waiting
collect.queue.active=Downloading
collect.queue.done=Saved

# 格式
formats.eyebrow=Formats
formats.title=Saved<br>the way you want.
formats.lead=Conversion happens as part of the download, so there is nothing to process afterwards.
formats.original=Original
formats.c1.title=Illustrations and manga
formats.c1.body=Keep the original format, or save PNG, JPG or WebP copies alongside it.
formats.c2.title=Ugoira
formats.c2.body=Convert ugoira to WebP, GIF, APNG or MP4, or keep the original ZIP.
formats.c3.title=Novels
formats.c3.body=Save as TXT, HTML or EPUB. A series can be bound into a single book.

# 画廊
gallery.eyebrow=Gallery
gallery.title=It only counts<br>if you can find it.
gallery.lead=The author, tags and rating of every work are recorded in a local database. Set tags to include or exclude, and combine them into exactly the range you want to see.
gallery.demo.label=Tag filter
gallery.demo.unit=works
gallery.demo.hint=Try clicking a tag: include, exclude, then once more to reset.
gallery.state.include=Include
gallery.state.exclude=Exclude
gallery.state.ignore=Not filtered
gallery.tag.landscape=Landscape
gallery.tag.people=People
gallery.tag.night=Night
gallery.tag.flower=Flowers
gallery.tag.sea=Sea
gallery.f1.title=Local collections
gallery.f1.body=File works into collections you create and sort them your own way.
gallery.f2.title=Suspected duplicates
gallery.f2.body=Perceptual hashing finds works that look alike, which makes clearing out duplicates easier.
gallery.f3.title=Bulk export
gallery.f3.body=Pack the works you select into a ZIP and take them with you.

# 更多
more.eyebrow=More
more.title=Leave it alone.<br>It keeps working.
more.b1.title=Scheduled tasks
more.b1.body=Check for updates in the background on a fixed interval or a cron expression. New works from your artists are added automatically.
more.b1.note=Checks for new works every day at 03:00
more.b2.title=It tells you when something breaks
more.b2.body=When your login expires, access is restricted or tasks keep failing, you get an alert by email and push notification.
more.b2.toast=Login has expired
more.b3.title=Read-only guests
more.b3.body=Issue invite codes so friends see only the tags, authors and ratings you allow.
more.b4.title=Novels are more than files
more.b4.body=Search the full text, translate it, or let AI read it aloud with a voice for each character.
more.b5.title=Plugins and SDK
more.b5.body=Install the features you need from the plugin market, or write your own plugin with the public SDK.
more.b6.title=Desktop interface and database
more.b6.body=A desktop interface is included. Records are stored in SQLite by default, and you can switch to PostgreSQL.
more.b7.title=Languages and dark mode
more.b7.body=Switch the interface language and the light or dark theme at any time. This page works the same way.

# 开始使用
start.eyebrow=Get started
start.title=Up and running in three steps.
start.s1.title=Download and launch
start.s1.body=The Windows installer bundles its own runtime. The ZIP package needs Java 25.
start.s2.title=Finish first-time setup
start.s2.body=On first launch, set up the admin account and your proxy.
start.s3.title=Add your first artwork
start.s3.body=Open the download page and paste a link. When it finishes, take a look in the gallery.

