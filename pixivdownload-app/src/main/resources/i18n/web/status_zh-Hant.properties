400.art-label=一塊拼圖懸浮在缺口的斜上方，無法拼合
400.description=伺服器無法理解這次請求（400 Bad Request）——連結可能不完整、參數格式不正確，或頁面狀態已過期。
400.doc-title=400 · 請求格式錯誤
400.hint-1=核對網址列中的連結是否完整
400.hint-2=重新整理頁面，讓狀態重新開始
400.hint-3=從首頁重新進入，再操作一次
400.title=這個請求<em>拼不起來</em>
403.art-label=一扇關閉的門，門上掛著一把鎖
403.description=您目前的身分沒有權限存取此頁面（403 Forbidden）。它可能只對管理員開放，或者不在您的邀請連結可見範圍內。
403.doc-title=403 · 沒有存取權限
403.hint-1=如果您就是管理員，請先登入再繼續
403.hint-2=如果您使用邀請連結，請向邀請人確認可見範圍
403.hint-3=回到首頁，前往您有權限存取的地方
403.title=這扇門暫時<em>不對您開放</em>
404.art-label=一張地圖，虛線路徑的終點是叉號
404.description=您要找的頁面不存在（404 Not Found）——它可能已移動、刪除，或者從一開始就只是網址中多了一個字母。
404.doc-title=404 · 頁面不存在
404.hint-1=檢查網址列中的連結是否有拼寫錯誤
404.hint-2=回到首頁，從導覽重新找到它
404.hint-3=如果它原本應該存在（例如某個功能頁消失了），請到 GitHub 告訴我們
404.title=這個地方或許<em>曾經存在</em>
429.art-label=一只沙漏，砂粒正在落下
429.description=您的請求過於頻繁，觸發了流量限制保護（429 Too Many Requests）。這不是封鎖，只是請稍候片刻——倒數結束後，一切恢復正常。
429.doc-title=429 · 請求過於頻繁
429.hint-1=等待約半分鐘，再重新整理或重試
429.hint-2=減少同時開啟的頁面與並行操作
429.title=慢一點，<em>喘口氣</em>
4xx.art-label=一封被退回的信
4xx.description=這次請求無法被接受（4xx 用戶端錯誤）。具體原因與請求本身有關——可能是格式、權限、頻率，或目標資源的狀態問題。
4xx.doc-title=4xx · 請求錯誤
4xx.hint-1=檢查輸入內容與連結是否正確
4xx.hint-2=重新整理頁面後再操作一次
4xx.hint-3=回到首頁，從正常入口重新開始
4xx.title=請求這一側<em>出了點問題</em>
500.art-label=一台趴著打盹的伺服器
500.description=伺服器處理請求時發生未預期的內部錯誤（500 Internal Server Error）。這次請求未完成，但您的資料不會因此損壞。
500.doc-title=500 · 伺服器內部錯誤
500.hint-1=稍候片刻，再試一次
500.hint-2=如果反覆出現，開啟記錄檔（log 目錄）查看具體例外
500.hint-3=將記錄中的錯誤資訊帶到 GitHub 提交 issue，讓我們修復
500.title=這不是您的錯，或許是<em>伺服器累了</em>
502.art-label=一座斷開的橋，橋的另一端是一朵雲
502.description=伺服器向上游服務（例如 Pixiv）轉送請求時收到錯誤回應（502 Bad Gateway）。問題多半出在上游或網路鏈路，而不是您的裝置。
502.doc-title=502 · 外部服務錯誤
502.hint-1=稍候片刻再試，上游可能只是暫時不穩定
502.hint-2=檢查代理與網路連線是否正常
502.hint-3=確認 Pixiv Cookie 仍然有效，失效後請重新儲存一份
502.title=橋的<em>另一端</em>沒有回應
503.art-label=一杯冒著熱氣的咖啡
503.description=服務暫時無法使用（503 Service Unavailable）——可能正在維護、重新啟動，或只是暫時過載。通常幾十秒內就會恢復。
503.doc-title=503 · 服務暫時無法使用
503.hint-1=稍候片刻，再重新整理一次
503.hint-2=如果長時間未恢復，查看記錄或到 GitHub 回報
503.title=稍作休息，<em>馬上回來</em>
5xx.art-label=一個齒輪和一把扳手
5xx.description=伺服器處理請求時發生錯誤（5xx 伺服器錯誤）。這不是您的操作造成的——問題出在我們這邊。
5xx.doc-title=5xx · 伺服器錯誤
5xx.hint-1=稍候片刻，再試一次
5xx.hint-2=如果反覆出現，開啟記錄檔（log 目錄）查看具體例外
5xx.hint-3=將現象和記錄帶到 GitHub 提交 issue，讓我們修復
5xx.title=伺服器這一側<em>出了點問題</em>
action.home=回到首頁
action.login=前往登入
action.retry=再試一次
hints.lead=您可以試試
theme.to-dark=切換至深色模式
theme.to-light=切換至淺色模式
