# 特色
features.eyebrow=Features · 特色
features.title=不只下載，而是一整套<em style="font-family:'Instrument Serif',serif;font-style:italic;background:linear-gradient(120deg,var(--accent),var(--accent-3));-webkit-background-clip:text;color:transparent"> 收藏管線。</em>
features.f1.title=漫畫 · 動圖 · 小說全格式
features.f1.body=插畫／漫畫／動圖（Ugoira → WebP）／小說（TXT／HTML／EPUB + 封面 + 合訂本）四條獨立管線，共用同一個 SQLite 歷史資料庫。
features.f2.title=本機畫廊 + 作品詳情
features.f2.body=側欄搜尋／標籤 - 作者三種模式篩選／燈箱預覽／系列上下章／相關作品／同作者其他作品。下載完成後即可在本機瀏覽。
features.f3.title=收藏夾歸檔 + 自訂範本
features.f3.body=支援自訂圖示／獨立下載目錄的收藏夾；檔名範本：<code>{artwork_id}_p{page}</code>、<code>{author_name}</code>、<code>{R18+}</code> 等佔位符可自由組合。
features.f4.title=多人模式 · 配額 · 邀請碼
features.f4.body=solo／multi 兩種模式。多人模式下每個 UUID 都有獨立配額，超額內容會打包歸檔為 ZIP；可簽發限定 Tag／作者／分級的邀請碼，訪客只能查看您允許的作品。
features.f5.title=深色模式 + 多語言
features.f5.body=所有面向使用者的新頁面都使用 i18n bundle（中文／English），佈景主題切換會持久化。由 CSS 變數驅動，深色模式與淺色模式保持視覺一致。
features.f6.title=SQLite WAL + GUI 工具
features.f6.body=本機資料庫記錄每件作品的 ID／標題／資料夾／格式／R-18／AI／標籤。Swing GUI 內建狀態面板、設定編輯、圖片分類、目錄有效性檢查與資料回填工具。

# 行動呼籲
cta.eyebrow=Get Started · 開始使用
cta.title=三步，讓它<em style="font-family:'Instrument Serif',serif;font-style:italic;background:linear-gradient(120deg,var(--accent-2),var(--accent-3));-webkit-background-clip:text;color:transparent">執行起來。</em>
cta.lead=Windows 安裝程式一鍵安裝；其他平台只需 Java 17 + HTTP 代理伺服器。
cta.step1.title=下載並啟動
cta.step1.body=Windows 直接安裝 <code>*-win-x64-setup.exe</code>（含 GUI 管家）；其他平台從 Releases 下載 <code>PixivDownload.jar</code>，再執行 <code>java -jar</code>。
cta.step2.title=首次設定 setup
cta.step2.body=瀏覽器會自動開啟 <code>/setup.html</code>，選擇 <code>solo</code>／<code>multi</code> 模式，設定使用者名稱與密碼，完成設定後即可開始搜尋。
cta.step3.title=直接使用 pixiv-batch
cta.step3.body=前往 <code>/pixiv-batch.html</code>，四個分頁任選；若想在原頁面使用下載按鈕，可在 <code>🧩 油猴腳本</code> 卡片中一鍵安裝。
