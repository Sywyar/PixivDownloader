# 获取
collect.eyebrow=取得
collect.title=從一個連結，<br>到畫師的全部作品。
collect.lead=貼上連結、選定畫師、設好搜尋條件，或者直接取回自己的收藏。剩下的交給下載佇列。
collect.s1.name=作品連結
collect.s1.desc=貼上一個或一批作品連結，直接加入佇列。
collect.s2.name=畫師
collect.s2.desc=取回一位畫師的全部投稿。
collect.s3.name=搜尋
collect.s3.desc=依關鍵字搜尋，篩選之後批次下載。
collect.s3.sample=風景 夜景
collect.s4.name=系列
collect.s4.desc=漫畫和小說系列依順序整套儲存。
collect.s5.name=我的收藏
collect.s5.desc=取回自己的收藏、已關注使用者的新作和珍藏集。
collect.s5.sample=我的收藏 · 全部
collect.note=也可以安裝配套的油猴腳本，在 Pixiv 頁面上直接新增工作。
collect.queue.title=下載佇列
collect.queue.waiting=等待中
collect.queue.active=下載中
collect.queue.done=已儲存

# 格式
formats.eyebrow=格式
formats.title=儲存成<br>你要的樣子。
formats.lead=格式轉換在下載時就完成，不必事後再處理一遍。
formats.original=原始格式
formats.c1.title=插畫與漫畫
formats.c1.body=保留原始格式，也可以同時另存為 PNG、JPG 或 WebP。
formats.c2.title=動圖
formats.c2.body=Ugoira 可以轉成 WebP、GIF、APNG 或 MP4，也可以保留原始 ZIP。
formats.c3.title=小說
formats.c3.body=儲存為 TXT、HTML 或 EPUB，系列還可以合成一本。

# 画廊
gallery.eyebrow=畫廊
gallery.title=找得到，<br>才算收藏。
gallery.lead=每件作品的作者、標籤和分級都記錄在本機資料庫裡。標籤可以設為包含或排除，組合出你想看的範圍。
gallery.demo.label=標籤篩選
gallery.demo.unit=件作品
gallery.demo.hint=點一下標籤試試：包含、排除，再點一次恢復。
gallery.state.include=包含
gallery.state.exclude=排除
gallery.state.ignore=未篩選
gallery.tag.landscape=風景
gallery.tag.people=人物
gallery.tag.night=夜景
gallery.tag.flower=花
gallery.tag.sea=海
gallery.f1.title=本機收藏夾
gallery.f1.body=把作品歸入自己建立的收藏夾，依你的方式分類。
gallery.f2.title=疑似重複偵測
gallery.f2.body=用感知雜湊找出畫面相近的作品，清理重複更省事。
gallery.f3.title=批次匯出
gallery.f3.body=選取的作品可以打包成 ZIP 帶走。

# 更多
more.eyebrow=更多
more.title=放著不管，<br>它也在工作。
more.b1.title=排程工作
more.b1.body=依固定週期或 Cron 運算式在背景追蹤更新，畫師的新作品自動入庫。
more.b1.note=每天 03:00 檢查新作品
more.b2.title=出問題會通知你
more.b2.body=登入失效、存取受限或連續失敗時，透過郵件和推送提醒。
more.b2.toast=登入狀態已失效
more.b3.title=唯讀訪客
more.b3.body=簽發邀請碼，讓朋友只看到你允許的標籤、作者和分級。
more.b4.title=小說不只是儲存
more.b4.body=內文可以全文檢索、翻譯，還能讓 AI 分角色朗讀。
more.b5.title=外掛程式與 SDK
more.b5.body=從插件市場依需求安裝功能，也可以用公開的 SDK 撰寫自己的外掛程式。
more.b6.title=桌面介面與資料庫
more.b6.body=內建桌面介面。作品記錄預設存入 SQLite，也可以換成 PostgreSQL。
more.b7.title=多語言與深色模式
more.b7.body=介面語言和明暗佈景主題隨時切換，這個頁面也一樣。

# 开始使用
start.eyebrow=開始使用
start.title=三步，就能用上。
start.s1.title=下載並啟動
start.s1.body=Windows 安裝包內建執行環境；ZIP 套件需要 Java 25。
start.s2.title=完成首次設定
start.s2.body=第一次啟動時，設定管理員帳號和代理。
start.s3.title=新增第一件作品
start.s3.body=開啟下載頁，貼上連結。下載完成後，到畫廊裡看看。

