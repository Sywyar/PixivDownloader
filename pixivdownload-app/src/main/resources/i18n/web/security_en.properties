instructions.restricted=API reference: {0}\nThis key cannot read the catalog. Ask me for the document, then use the separately supplied key to help with my task within its permissions. Send Authorization: Bearer <key> with every request; you can call GET /api/security/program-keys/self first to confirm this key’s permissions.\nIf you support Agent Skills, ask me before running npx skills add Sywyar/PixivDownloader --skill pixivdownloader -g to install the PixivDownloader skill. It describes the common endpoints and how to call them.
instructions.unavailable=The instance address is unavailable. Save your key.
instructions.title=Agent prompt
instructions.help=The prompt contains only the API reference address and how to use it, not the key. Configure the key separately in the agent’s runtime environment.
created.instructions=Read the PixivDownloader OpenAPI document using the program key provided separately:\n{0}\nSend Authorization: Bearer <key> with every request. Before you start, call GET /api/security/program-keys/self to confirm this key’s permissions. A 401 or 403 response names the missing permission in its programPermission field. Use the documented endpoints to help me with my task within the permissions granted.\nIf you support Agent Skills, ask me before running npx skills add Sywyar/PixivDownloader --skill pixivdownloader -g to install the PixivDownloader skill. It describes the common endpoints and how to call them.
