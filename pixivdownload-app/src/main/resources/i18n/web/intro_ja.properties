page.title=PixivDownloader — 好きな作品を手元に残す
page.description=Pixiv のイラスト、漫画、うごイラ、小説を自分のディスクに保存し、検索して読めるローカルギャラリーに整理します。
a11y.skip=本文へスキップ

# 顶部导航
nav.label=ページ内ナビゲーション
nav.docs=ドキュメント
nav.download=ダウンロード

# 首屏
hero.badge=オープンソース · 自分のパソコンで動作
hero.title=好きな作品を、<br>自分の手元に。
hero.lead=PixivDownloader は Pixiv のイラスト、漫画、うごイラ、小説をあなたのディスクに保存し、検索して読めるローカルギャラリーに整理します。
hero.cta.download=最新版をダウンロード
hero.cta.docs=ドキュメントを読む

# 首屏：作品汇成的画廊窗口
scene.title=これが、あなたのギャラリー。
scene.body=ダウンロードした作品はここに集まります。作者、タグ、コレクションから探して、いつでも開けます。
win.nav.gallery=ギャラリー
win.nav.novels=小説
win.nav.collections=コレクション
win.nav.stats=統計
win.search=タイトル、作者、タグで検索
win.chip.all=すべて
win.chip.illust=イラスト
win.chip.manga=漫画
win.chip.ugoira=うごイラ
win.count=1,284 作品

# 获取
collect.eyebrow=取得
collect.title=リンクひとつから、<br>作者の全作品まで。
collect.lead=リンクを貼る、作者を選ぶ、検索条件を決める、あるいは自分のブックマークをそのまま取り込む。あとはダウンロードキューにおまかせです。
collect.s1.name=作品リンク
collect.s1.desc=作品リンクを 1 件でもまとめてでも貼り付ければ、そのままキューに追加されます。
collect.s2.name=作者
collect.s2.desc=ひとりの作者の投稿をすべて取得します。
collect.s3.name=検索
collect.s3.desc=キーワードで検索し、絞り込んでから一括ダウンロードします。
collect.s3.sample=風景 夜景
collect.s4.name=シリーズ
collect.s4.desc=漫画や小説のシリーズを、順番どおりにまるごと保存します。
collect.s5.name=自分のブックマーク
collect.s5.desc=自分のブックマーク、フォロー中ユーザーの新作、コレクションを取り込みます。
collect.s5.sample=自分のブックマーク · すべて
collect.note=付属の UserScript をインストールすれば、Pixiv のページから直接タスクを追加できます。
collect.queue.title=ダウンロードキュー
collect.queue.waiting=待機中
collect.queue.active=ダウンロード中
collect.queue.done=保存済み

# 格式
formats.eyebrow=形式
formats.title=欲しい形で、<br>保存する。
formats.lead=形式の変換はダウンロードと同時に終わるので、あとから処理し直す必要はありません。
formats.original=元の形式
formats.c1.title=イラストと漫画
formats.c1.body=元の形式のまま残すことも、PNG、JPG、WebP で同時に保存することもできます。
formats.c2.title=うごイラ
formats.c2.body=うごイラは WebP、GIF、APNG、MP4 に変換でき、元の ZIP のまま残すこともできます。
formats.c3.title=小説
formats.c3.body=TXT、HTML、EPUB で保存できます。シリーズは 1 冊にまとめることもできます。

# 画廊
gallery.eyebrow=ギャラリー
gallery.title=見つけられてこそ、<br>コレクション。
gallery.lead=すべての作品の作者、タグ、レーティングがローカルのデータベースに記録されます。タグは「含む」「除外」を指定でき、組み合わせて見たい範囲を絞り込めます。
gallery.demo.label=タグで絞り込み
gallery.demo.unit=作品
gallery.demo.hint=タグをクリックしてみてください。含む、除外、もう一度で解除です。
gallery.state.include=含む
gallery.state.exclude=除外
gallery.state.ignore=指定なし
gallery.tag.landscape=風景
gallery.tag.people=人物
gallery.tag.night=夜景
gallery.tag.flower=花
gallery.tag.sea=海
gallery.f1.title=ローカルコレクション
gallery.f1.body=自分で作ったコレクションに作品を振り分け、好きなように整理できます。
gallery.f2.title=類似重複の検出
gallery.f2.body=知覚ハッシュで見た目の近い作品を見つけ出し、重複の整理を楽にします。
gallery.f3.title=一括エクスポート
gallery.f3.body=選んだ作品を ZIP にまとめて持ち出せます。

# 更多
more.eyebrow=その他
more.title=放っておいても、<br>働き続ける。
more.b1.title=スケジュールタスク
more.b1.body=一定の間隔または Cron 式でバックグラウンド更新し、作者の新作を自動で取り込みます。
more.b1.note=毎日 03:00 に新作をチェック
more.b2.title=問題が起きたら知らせます
more.b2.body=ログインの失効、アクセス制限、連続した失敗が起きたときは、メールとプッシュ通知でお知らせします。
more.b2.toast=ログインが失効しました
more.b3.title=閲覧専用のゲスト
more.b3.body=招待コードを発行すれば、許可したタグ、作者、レーティングの作品だけを友人に見せられます。
more.b4.title=小説は保存するだけじゃない
more.b4.body=本文の全文検索や翻訳に加えて、AI による登場人物ごとの朗読もできます。
more.b5.title=プラグインと SDK
more.b5.body=プラグインマーケットから必要な機能だけをインストールできます。公開されている SDK で自作することもできます。
more.b6.title=デスクトップ UI とデータベース
more.b6.body=デスクトップ UI が付属します。作品の記録は標準で SQLite に保存され、PostgreSQL に切り替えることもできます。
more.b7.title=多言語とダークモード
more.b7.body=表示言語とライト／ダークのテーマはいつでも切り替えられます。このページも同じです。

# 开始使用
start.eyebrow=はじめる
start.title=3 ステップで使い始める。
start.s1.title=ダウンロードして起動
start.s1.body=Windows インストーラーには実行環境が含まれています。ZIP パッケージには Java 25 が必要です。
start.s2.title=初回設定を完了
start.s2.body=初回起動時に、管理者アカウントとプロキシを設定します。
start.s3.title=最初の作品を追加
start.s3.body=ダウンロードページを開いてリンクを貼り付けます。完了したら、ギャラリーをのぞいてみてください。

# 收尾
finale.title=好きな作品に、<br>居場所をつくる。
finale.github=GitHub で見る

