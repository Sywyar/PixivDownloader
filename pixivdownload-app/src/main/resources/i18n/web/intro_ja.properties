# 機能
features.eyebrow=Features · 機能
features.title=ダウンロードだけではない、<em style="font-family:'Instrument Serif',serif;font-style:italic;background:linear-gradient(120deg,var(--accent),var(--accent-3));-webkit-background-clip:text;color:transparent">作品を保存するパイプライン。</em>
features.f1.title=マンガ · うごイラ · 小説の全形式
features.f1.body=イラスト / マンガ / うごイラ（Ugoira → WebP）/ 小説（TXT / HTML / EPUB + 表紙 + 合本）の 4 つの独立した処理系が、同じ SQLite 履歴データベースを共有します。
features.f2.title=ローカルギャラリー + 作品詳細
features.f2.body=サイドバー検索 / タグ - 作者の 3 種類のフィルター / ライトボックスプレビュー / シリーズの前後話 / 関連作品 / 同じ作者の他作品。ダウンロード後すぐにローカルで閲覧できます。
features.f3.title=ブックマークのアーカイブ + カスタムテンプレート
features.f3.body=カスタムアイコン / 専用ダウンロードフォルダーに対応したブックマーク。ファイル名テンプレート：<code>{artwork_id}_p{page}</code>、<code>{author_name}</code>、<code>{R18+}</code> などのプレースホルダーを自由に組み合わせ可能。
features.f4.title=複数ユーザー · クォータ · 招待コード
features.f4.body=solo / multi の 2 つのモード。複数ユーザーモードでは UUID ごとに独立したクォータを持ち、超過分は ZIP にアーカイブされます。タグ / 作者 / レーティングを限定した招待コードを発行でき、ゲストには許可した作品だけを表示します。
features.f5.title=ダークモード + 多言語
features.f5.body=ユーザー向けの新しいページはすべて i18n バンドル（日本語 / English）を使用し、テーマ切り替えを永続化します。CSS 変数で駆動し、ダークモードとライトモードの見た目を揃えています。
features.f6.title=SQLite WAL + GUI ツール
features.f6.body=ローカルデータベースに各作品の ID / タイトル / フォルダー / 形式 / R-18 / AI / タグを記録します。Swing GUI には状態パネル、設定編集、画像分類、フォルダーの有効性チェック、データ補完ツールが備わっています。

# CTA
cta.eyebrow=Get Started · はじめる
cta.title=3 ステップで、<em style="font-family:'Instrument Serif',serif;font-style:italic;background:linear-gradient(120deg,var(--accent-2),var(--accent-3));-webkit-background-clip:text;color:transparent">動かそう。</em>
cta.lead=Windows インストーラーならワンクリックでインストール。その他のプラットフォームでは Java 17 + HTTP プロキシがあれば利用できます。
cta.step1.title=ダウンロードして起動
cta.step1.body=Windows では <code>*-win-x64-setup.exe</code>（GUI マネージャーを含む）を直接インストール。その他のプラットフォームでは Releases から <code>PixivDownload.jar</code> をダウンロードして <code>java -jar</code> を実行します。
cta.step2.title=初回設定 setup
cta.step2.body=ブラウザーで <code>/setup.html</code> が自動的に開きます。<code>solo</code> / <code>multi</code> モードを選択し、ユーザー名とパスワードを設定すれば検索を開始できます。
cta.step3.title=pixiv-batch をすぐに使う
cta.step3.body=<code>/pixiv-batch.html</code> にアクセスし、4 つのタブから選択します。Pixiv 原ページのダウンロードボタンが必要なら、<code>🧩 UserScript</code> カードからワンクリックでインストールできます。
foot.line1=PixivDownloader · Spring Boot 3.5.7 · Java 17 · SQLite WAL
foot.line2=Sywyar が ♥ を込めて制作
