batch.cookie.title=① Pixiv Cookie を入力
batch.cookie.body=R-18 やフォロー限定など、ログインが必要な作品をダウンロードする場合は、ここに Pixiv Cookie を貼り付けます。公開作品だけをダウンロードする場合は、この手順をスキップできます。
batch.mode.title=② ダウンロード方法を選択
batch.mode.body=必要に応じて切り替え：作品リンクの一括インポート、作者 ID による全作品のダウンロード、キーワード検索、シリーズ全体のダウンロード。
batch.start.title=③ ダウンロードを開始
batch.start.body=ダウンロードする内容を追加したら、ここをクリックして開始します。ダウンロード中はこのページを開いたままにしてください（キューはバックエンドへ継続的に送信されます）。すべて完了してからページを閉じてください。
batch.queue.title=④ 進捗を確認
batch.queue.body=ここにダウンロード状態とキューをリアルタイムで表示します。失敗した項目はワンクリックで再試行できます。
batch.gallery.title=⑤ 成果を閲覧
batch.gallery.body=ダウンロードした作品はすべてローカルギャラリーに入ります。ここをクリックすれば、いつでも閲覧・管理できます。

batch.cookie-import.install.title=① 機能強化ツールボックスをインストール
batch.cookie-import.install.body=ワンクリックインポートには pixiv.net で動作する「機能強化ツールボックス」が必要です。強調表示されたインストールボタンからツールボックスをインストールするか、ツールボックスを含む All-in-One 統合版をインストールしてください。その後このページに戻り、「再確認」をクリックします。スクリプトが検出されると次へ進めます。
batch.cookie-import.ready.title=② インポートを開始
batch.cookie-import.ready.body=このブラウザーで Pixiv にログインしていることを確認してください。「完了」をクリックすると Pixiv ページを開き、Cookie の自動取得を試みます。ブラウザーやユーザースクリプト管理拡張機能で読み取れない場合は、ダウンロードページに戻り、Cookie 取得ガイドに従って手動で設定してください。

gallery.search.title=① ダウンロード済み作品を検索
gallery.search.body=作品タイトルまたは作者名を入力して、ダウンロード済みの内容をすばやく検索します。検索範囲は左側のドロップダウンで切り替えられます。
gallery.filter.title=② 条件で絞り込む
gallery.filter.body=フィルターを開くと、タグ、作者、レーティングなどを組み合わせて絞り込み、目的の作品を正確に見つけられます。
gallery.views.title=③ 表示を切り替える
gallery.views.body=すべての画像、作者別、シリーズ別マンガなどの表示を切り替え、さまざまな切り口で作品を閲覧できます。
gallery.grid.title=④ 閲覧・管理
gallery.grid.body=ここにダウンロード済みの作品を表示します。クリックすると画像を大きく表示したり、コレクションに追加したり、さらに管理したりできます。
gallery.download.title=⑤ さらにダウンロード
gallery.download.body=新しい作品をダウンロードするときは、ここからダウンロードページに戻ります。「完了」をクリックしてこの案内を終了したら、PixivDownloader のプログラムウィンドウに戻ってください。そこで後続の案内が自動的に続きます。

