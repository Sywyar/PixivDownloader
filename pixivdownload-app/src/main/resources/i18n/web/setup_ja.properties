proxy.title=プロキシ設定
proxy.hint=バックエンドから外部ネットワークへアクセスする際は、すべてこの HTTP プロキシを経由します。Pixiv（閲覧、検索、画像・アニメーション・小説・カバーのダウンロード、コレクション）、オンライン更新（新バージョンの確認とダウンロード）、内蔵 FFmpeg のダウンロード（アニメーション変換に必要）、オンライン TTS（Edge のニューラル音声による読み上げ）に使用されます。Docker コンテナ内で実行する場合、通常 127.0.0.1 からホストのプロキシには接続できません。必要に応じて無効にするか、コンテナから到達可能なプロキシアドレスを入力してください。
proxy.enabled=プロキシを有効にする
proxy.host=プロキシホスト
proxy.host.placeholder=例：127.0.0.1
proxy.port=プロキシポート
proxy.port.placeholder=例：7890
proxy.validation.host-required=プロキシを有効にする場合はプロキシホストを入力してください
proxy.validation.port-invalid=プロキシポートは1～65535の整数で指定してください
button.submit=設定を完了
validation.username-required=ユーザー名を入力してください
validation.password-short=パスワードは8文字以上で入力してください
password-warning.message=このソフトウェアは他のソフトウェアの Cookie などの機密情報を保存します。12文字以上のパスワードを推奨します。それでも続行する場合は、設定を完了ボタンをもう一度クリックしてください。
