proxy.hint=有効にすると、全体のプロキシ設定を使うリクエストはこの HTTP プロキシを経由します。直接接続や個別のプロキシを指定したリクエストには、この切り替えは影響しません。Docker コンテナ内では、通常 127.0.0.1 からホストのプロキシには接続できません。コンテナから到達できるアドレスを入力するか、必要に応じてプロキシを無効にしてください。
