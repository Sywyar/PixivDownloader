# 获取
collect.eyebrow=获取
collect.title=从一个链接，<br>到画师的全部作品。
collect.lead=贴上链接、选定画师、设好搜索条件，或者直接取回自己的收藏。剩下的交给下载队列。
collect.s1.name=作品链接
collect.s1.desc=粘贴一个或一批作品链接，直接加入队列。
collect.s2.name=画师
collect.s2.desc=取回一位画师的全部投稿。
collect.s3.name=搜索
collect.s3.desc=按关键词搜索，筛选之后批量下载。
collect.s3.sample=风景 夜景
collect.s4.name=系列
collect.s4.desc=漫画和小说系列按顺序整套保存。
collect.s5.name=我的收藏
collect.s5.desc=取回自己的收藏、关注新作和珍藏集。
collect.s5.sample=我的收藏 · 全部
collect.note=也可以安装配套的油猴脚本，在 Pixiv 页面上直接添加任务。
collect.queue.title=下载队列
collect.queue.waiting=等待中
collect.queue.active=下载中
collect.queue.done=已保存

# 格式
formats.eyebrow=格式
formats.title=保存成<br>你要的样子。
formats.lead=格式转换在下载时就完成，不用事后再处理一遍。
formats.original=原始格式
formats.c1.title=插画与漫画
formats.c1.body=保留原始格式，也可以同时另存为 PNG、JPG 或 WebP。
formats.c2.title=动图
formats.c2.body=Ugoira 可以转成 WebP、GIF、APNG 或 MP4，也可以保留原始 ZIP。
formats.c3.title=小说
formats.c3.body=保存为 TXT、HTML 或 EPUB，系列还可以合成一本。

# 画廊
gallery.eyebrow=画廊
gallery.title=找得到，<br>才算收藏。
gallery.lead=每件作品的作者、标签和分级都记在本地数据库里。标签可以设为包含或排除，组合出你想看的范围。
gallery.demo.label=标签筛选
gallery.demo.unit=件作品
gallery.demo.hint=点一下标签试试：包含、排除，再点一次恢复。
gallery.state.include=包含
gallery.state.exclude=排除
gallery.state.ignore=未筛选
gallery.tag.landscape=风景
gallery.tag.people=人物
gallery.tag.night=夜景
gallery.tag.flower=花
gallery.tag.sea=海
gallery.f1.title=本地收藏夹
gallery.f1.body=把作品归进自己建的收藏夹，按你的方式分类。
gallery.f2.title=疑似重复检测
gallery.f2.body=用感知哈希找出画面相近的作品，清理重复更省事。
gallery.f3.title=批量导出
gallery.f3.body=选中的作品可以打包成 ZIP 带走。

# 更多
more.eyebrow=更多
more.title=放着不管，<br>它也在工作。
more.b1.title=计划任务
more.b1.body=按固定周期或 Cron 表达式在后台追更，画师的新作品自动入库。
more.b1.note=每天 03:00 检查新作品
more.b2.title=出问题会告诉你
more.b2.body=登录失效、访问受限或连续失败时，通过邮件和推送提醒。
more.b2.toast=登录状态已失效
more.b3.title=只读访客
more.b3.body=签发邀请码，让朋友只看到你允许的标签、作者和分级。
more.b4.title=小说不只是保存
more.b4.body=正文可以全文检索、翻译，还能让 AI 分角色朗读。
more.b5.title=插件与 SDK
more.b5.body=从插件市场按需安装功能，也可以用公开的 SDK 写自己的插件。
more.b6.title=桌面界面与数据库
more.b6.body=自带桌面界面。作品记录默认存入 SQLite，也可以换成 PostgreSQL。
more.b7.title=多语言与深色模式
more.b7.body=界面语言和明暗主题随时切换，这个页面也一样。

