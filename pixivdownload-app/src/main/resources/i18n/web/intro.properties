start.title=三步，就能用上。
start.s1.title=下载并启动
start.s1.body=Windows 安装包自带运行环境；ZIP 包需要 Java 25。
start.s2.title=完成首次配置
start.s2.body=第一次启动时，设置管理员账号和代理。
start.s3.title=添加第一件作品
start.s3.body=打开下载页，贴上链接。下载完成后，到画廊里看看。

