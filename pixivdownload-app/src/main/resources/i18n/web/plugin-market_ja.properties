installation.state.disabled=ローカルプラグインは無効です
installation.state.stopped=ローカルプラグインは停止中です
installation.state.not-loaded=保存済み・読み込み状態を取得できません
installation.same-version-mismatch=ローカルと選択中の市場パッケージは同一バージョンですが、SHA-256 が異なります。詳細でハッシュと入手元を確認してください。市場の署名や審査はローカルパッケージを保証しません。内容の違いは破損とは限りません。置き換えが必要な場合のみインストールしてください。
installation.advice.unknown=ローカルパッケージを確認できませんが、未インストールとは限りません。再起動して状態を更新し、続く場合はエラー概要で権限、ロック、インストール処理を確認してください。
installation.advice.runtime-different=保存済みと実行中のバージョンが異なります。再起動後に再確認し、続く場合は繰り返し上書きせず、実際の読み込み先と起動ログを確認してください。
installation.advice.runtime-only=現在のインスタンスは実行中ですが、ディスク上に対応するパッケージが見つかりません。読み込み先とログで移動や削除を確認してください。インストールボタンだけで実行状態を判断しないでください。
installation.advice.disabled=必要な場合はプラグイン管理で有効にしてから再起動してください。無効であることはパッケージの破損を意味しません。
installation.advice.stopped=プラグインは停止中です。まず再起動してください。再び停止する場合は起動ログと依存関係を確認してから再インストールを判断してください。
installation.advice.not-loaded=パッケージは保存済みですが、読み込み結果を取得できません。再起動してプラグイン管理と起動ログを確認してください。インストール成功は有効化済みを意味しません。
install.action.distribution=配布パッケージをインストール
installation.state.incompatible=ローカルプラグインまたは依存先が非互換
installation.state.dependency=ローカルプラグインの依存先が利用不可
installation.state.not-started=ローカルプラグインは未起動
installation.advice.incompatible=エラー概要でローカルプラグイン、依存先、アプリのバージョン要件を確認し、互換性のある組み合わせを選んでください。同じ非互換バージョンを再インストールしても解決しません。
installation.advice.dependency=依存先の不足、無効化、起動失敗を確認し、該当する依存先を対処して再起動してください。依存する側の再インストールは不要な場合があります。
installation.advice.not-started=ローカルプラグインは検出されましたが、未実行です。まず再起動し、起動しない場合は起動ログ、有効化設定、依存関係を確認してください。

database.title=データベースの選択と接続
database.notice=接続設定を変更したら、接続を確認してから変更内容を確認してください。データの検証に成功してからデータベースを切り替えます。
database.migrate=確認して続行
database.migration.confirm=移行して再起動
database.migration.confirm-notice=確定すると他の設定を保存して再起動し、以下の一覧に従ってデータを処理します。すべての確認に成功してから切り替えます。失敗した場合は元の設定と移行済みのデータを保持します。
database.migration.ready=確認が完了しました。データの処理内容を確認してください。
database.migration.failed=移行を開始できませんでした。結果を更新し、設定と移行状況を確認してから再試行してください。
database.migration.rebuild=再作成する補助オブジェクト：{objects}
database.migration.phase.ready=移行可能
database.migration.phase.empty-source=移行元は空です。起動時に移行先を初期化します
database.migration.phase.same-target=同じデータベースです。接続設定のみ更新します
database.migration.phase.blocked=確認失敗
database.migration.phase.not-started=未開始
database.migration.phase.preparing=準備中
database.migration.phase.copying=コピー中
database.migration.phase.verified=データ検証済み、未保存
database.migration.phase.committing=データを保存中
database.migration.phase.committed=データを移行して保存しました
database.migration.phase.rolled-back=この項目は保存されていません。書き込みを取り消しました
database.migration.phase.unknown=このデータが保存されたか確認できません。再確認してから続行してください。
database.migration.status.pending=移行を予約しました。処理を停止して再起動します。
database.migration.status.running=移行と検証を実行中です。自動起動をお待ちください。
database.migration.status.switching=すべてのデータベースの検証が完了しました。設定を切り替えています。
database.migration.status.succeeded=データベース設定を適用しました。
database.migration.status.failed=移行は未完了です。元のデータベースを引き続き使用します。移行済みのデータは保持されます。再確認後に再試行できます。
database.migration.source=移行元：{target}
database.migration.target=移行先：{target}
database.loading=データベース設定を読み込み中…
database.unavailable=データベースを利用できません
database.current=現在使用中：{target}
database.next=再起動後：{target}
database.overridden=環境変数や起動引数など、優先度の高い設定で上書きされる項目：{keys}
database.redacted=保存済みの接続を検証できないため、URL を表示していません。再入力してください。パスワードは空欄で保持されます。
database.provider=データベースプラグイン
database.select=読み込み済みのデータベースプラグインを選択
database.jdbcUrl=接続先（JDBC URL）
database.username=ユーザー名
database.password=パスワード
database.password-kept=保存済み。空欄で保持
database.password-empty=保存済みパスワードなし
database.clear-password=保存時にパスワードを削除
database.check=接続をテスト
database.checking=接続をテスト中…
database.saving=移行条件を確認中…
database.saved=保存しました。完全な再起動が必要です。現在の接続は変更されていません。
database.stale=確認中に下書きが変更されました。再確認してください。
database.connected=接続の確認に成功しました。設定はまだ保存されておらず、データも移行していません。
database.not-created=SQLite ファイルはまだありません：{target}。確認では作成していません。
database.connection-failed=接続失敗：{target}（SQLState {sqlState}）。接続先、アカウント、パスワード、schema を確認してください。
database.busy=接続確認が実行中です。しばらくして再試行してください。
database.failed=設定を読み込めないか確認できません。再試行してください。
database.save-failed=保存の成功は未確認です。下書きは保持されています。状態を更新してから再試行してください。
database.save-invalid=設定が無効か、既存のプラグイン専用データの移行と検証が未完了です。保存していません。入力内容または移行手順を確認してください。

category.database=データベース
category.database.description=メインデータベースとプラグイン専用ストレージの接続を提供します。
recovery.focus.database=データベース候補 · 確認を推奨
database.enable={owner} を有効にする
database.enable-confirm=有効化後はアプリを完全に終了して再起動してください。データベースの選択と既存データは保持されます。
database.enabled=有効化設定を保存しました。完全に終了して再起動してください。データベースはまだ有効になっていません。
database.saved-status-unavailable=設定は保存されましたが、最新の状態を取得できませんでした。更新して確認し、完全に終了して再起動してください。

database.migration.phase.connection-repair=元の接続設定を解析できません。接続設定を修正して再起動します。元のデータベースのデータは移行しません
database.migration.phase.replace-target=移行先の既存データをバックアップしてから置き換えます
database.details=接続の詳細
database.history=前回のデータベース変更
database.diagnostic-code=診断コード：{code}
database.migration.title=データベースの変更を確認
database.migration.confirm-connection=接続設定を適用して再起動
database.migration.details=技術的な詳細
database.migration.main=アプリのデータ
database.migration.plugin=プラグインのデータ · {owner}
database.migration.summary=続行する前に、{count} 件のデータを確認してください。
database.migration.phase.reuse=コピー済みです。再検証してから切り替えます。
database.migration.replacement-notice=移行先の既存データは置き換える前にバックアップします。各データベースのコピーを検証してから置き換えます。バックアップはデータベース移行記録のフォルダーに残ります。
database.error.authentication=データベースのユーザー名またはパスワードが正しくありません。ユーザー名を確認し、パスワードを再入力してください。
database.error.authorization=データベースがこのアカウントまたは端末からの接続を拒否しました。アカウントがログイン可能か確認し、データベース管理者に接続許可の確認を依頼してください。
database.error.connection=データベースに接続できません。アドレス、ポート、ネットワーク、およびデータベースサービスが起動しているか確認してください。
database.error.database-missing=指定したデータベースが見つかりません。接続先に指定したデータベース名を確認し、作成済みであることを確認してください。
database.error.schema-missing=指定したデータ領域（スキーマ）を利用できません。接続先の schema 設定と、このアカウントのアクセス権を確認してください。
database.error.permission=このアカウントには操作に必要なデータベース権限がありません。必要な読み書き権限を持つアカウントを使用してください。
database.error.busy=データベースまたは移行処理が使用中です。現在の操作が完了してから再試行してください。
database.error.username-required=データベースのユーザー名を入力してください。
database.error.configuration=接続設定が無効です。アドレスの形式と接続オプションを確認し、ユーザー名とパスワードはそれぞれ専用の欄に入力してください。
database.error.product=現在のデータベースプラグインは、このデータベースの種類またはバージョンに対応していません。プラグインの対応条件を確認してください。
database.error.encoding=データベースの文字コードに対応していません。データベースプラグインが対応する文字コードを使用してください。
database.error.target-mismatch=接続したデータベースが選択した移行先と一致しません。アドレスを確認してから再確認してください。
database.error.provider-unavailable=選択したデータベースプラグインを利用できません。インストール済みで有効になっていることを確認し、アプリを再起動してください。
database.error.file=データベースファイルを開けません。ファイルの場所とフォルダーの読み書き権限を確認してください。
database.error.target-not-empty=移行先には既存のデータがあり、安全に置き換えられません。空の移行先を選ぶか、データベース管理者に既存データの処理を依頼してください。
database.error.data-mismatch=移行したデータの検証に失敗したため、データベースは切り替えていません。元のデータベースとバックアップを保持し、もう一度確認してください。
database.error.source-changed=確認後に元のデータベースが変更されました。もう一度確認してから移行を確定してください。
database.error.plan-changed=設定、プラグイン、またはデータの一覧が変更されました。もう一度確認してから確定してください。
database.error.overridden=一部のデータベース設定は環境変数または起動引数で指定されています。先にそれらの指定を変更または削除してください。
database.error.schema=データ構造を安全に移行できません。関連プラグインが対応するバージョンでインストールされていることを確認し、もう一度確認してください。
database.error.private-storage=プラグインのデータにアクセスできません。データベースアカウントの権限とプラグインの状態を確認してから再試行してください。
database.error.restart=続行するにはアプリの完全な再起動が必要です。アプリを終了して開き直し、データベース設定を確認してください。
database.error.interrupted=移行がキャンセルまたは中断されました。元のデータベースとバックアップを保持し、再確認してから続行してください。
database.error.unknown=操作を完了できませんでした。接続設定を確認して再試行してください。解決しない場合は、診断の詳細をサポートに提供してください。
database.error.target-read-only=移行先のデータベースに書き込めません。データベースアカウントの権限、または移行先フォルダーの書き込み権限を確認してください。
database.error.source-unavailable=元のデータベースを読み取れません。ファイルが存在しないか、破損している可能性があります。元のデータベースの場所と整合性を確認してから再試行してください。
database.error.backup-exists=バックアップ先にはすでにファイルがあります。既存のバックアップを保持し、再確認してから移行を開始してください。
database.error.unsupported=データベースがこの操作に対応していません。データベースプラグインとサーバーの互換性を確認してください。
database.migration.cancel=キャンセル
