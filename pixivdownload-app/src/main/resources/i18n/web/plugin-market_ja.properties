install.trust.title=プラグイン実行の信頼を確認
install.trust.risk=このプラグインは PixivDownloader プロセス内で実行され、PixivDownloader と同じローカル権限を持ちます。現在のユーザーがアクセスできるファイルやネットワークへのアクセス、バックグラウンドタスクの実行、ローカル API の登録、PixivDownloader ページ内でのスクリプト実行が可能です。プラグインのインストールはローカルアプリケーションの実行と同等です。信頼できる提供元だけをインストールしてください。
