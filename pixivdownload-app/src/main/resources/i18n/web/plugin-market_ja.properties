installation.development=現在のマルチモジュール開発モードはソースのビルド成果物のみを読み込みます。パッケージはディスクに保存されますが、同じモードで再起動しても読み込まれません。このインストール先を使用する通常実行モードで起動し、起動時の検証を通過する必要があります。
