cta.step1.body=GitHub Release에서 자신의 운영 체제에 맞는 패키지를 받으세요.
cta.step2.title=설정 완료
cta.step2.body=Cookie, 프록시와 다운로드 디렉터리를 설정하세요.
cta.step3.title=첫 작품 다운로드
cta.step3.body=작품 링크를 붙여 넣고 다운로드 대기열에 추가하세요.
