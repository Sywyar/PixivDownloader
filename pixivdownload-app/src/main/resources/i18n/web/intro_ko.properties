# Features
features.eyebrow=Features · 기능
features.title=단순한 다운로드를 넘어,<em style="font-family:'Instrument Serif',serif;font-style:italic;background:linear-gradient(120deg,var(--accent),var(--accent-3));-webkit-background-clip:text;color:transparent"> 완전한 보관 파이프라인.</em>
features.f1.title=만화 · 애니메이션 · 소설 모든 형식
features.f1.body=일러스트 / 만화 / 애니메이션(Ugoira → WebP) / 소설(TXT / HTML / EPUB + 표지 + 합본)의 네 가지 독립 파이프라인이 하나의 SQLite 기록을 공유합니다.
features.f2.title=로컬 갤러리 + 작품 상세
features.f2.body=사이드바 검색 / 태그-작가 세 가지 모드 필터 / 라이트박스 미리보기 / 시리즈 이전·다음 장 / 관련 작품 / 같은 작가의 다른 작품. 다운로드 후 바로 로컬에서 탐색하세요.
features.f3.title=북마크 보관 + 사용자 지정 템플릿
features.f3.body=사용자 지정 아이콘과 별도 다운로드 디렉터리를 지원하는 북마크. 파일명 템플릿은 <code>{artwork_id}_p{page}</code>, <code>{author_name}</code>, <code>{R18+}</code> 등의 플레이스홀더를 자유롭게 조합할 수 있습니다.
features.f4.title=다중 사용자 + 초대 링크
features.f4.body=solo / multi 모드, 사용자별 다운로드 할당량, R-18 / Tag / 작가 표시 제한이 있는 초대 링크.
features.f5.title=안전한 로컬 실행
features.f5.body=Cookie와 설정은 자신의 서버에 보관됩니다. 네트워크 요청은 명시적으로 설정한 프록시 경계를 따릅니다.
features.f6.title=번역 가능한 인터페이스
features.f6.body=내장 i18n 번들과 다크 모드를 지원하며, 페이지를 다시 로드하지 않고 언어를 전환할 수 있습니다.

