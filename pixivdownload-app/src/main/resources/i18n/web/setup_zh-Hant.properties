proxy.title=代理設定
proxy.hint=後端對外的網路存取都會經由此 HTTP 代理：存取 Pixiv（瀏覽、搜尋、下載圖片 / 動圖 / 小說 / 封面、收藏）、線上更新（檢查並下載新版本）、下載內建 FFmpeg（動圖轉換所需）、線上 TTS（聽書的 Edge 神經語音）。若在 Docker 容器中執行，127.0.0.1 通常無法連線至主機代理，請依需求關閉或填入容器可連線的代理位址。
