submission.workType=下載提交處理器註冊的作品類型。請依所選類型傳入對應的 workId 和 options。
response.bearerChallenge=Bearer 憑證無效、混用身分或伺服器提示使用程式金鑰時，會傳回此驗證標頭。
response.serverFailure=請求處理期間若發生未個別對應的例外，伺服器會傳回 HTTP 500。JSON 包含 code（error.unexpected）與依請求語言產生的 error。各操作另列其特定的業務錯誤。 執行個體維護、復原模式或外掛暫停接收請求時，也可能收到 503。若包含 `Retry-After`，請在指定時間後重試。
guide.url=https://sywyar.github.io/PixivDownloader/#/zh-hant/http-api
integration=程式金鑰可透過 `GET /api/security/program-keys/self` 查看自己的權限。輪詢 `GET /api/download/tasks` 或個別任務可讀取 `phase`、`updatedAt` 和 `revision`。執行器提供計數時，`progress` 會列出單位、已完成數和總數。訂閱下載事件需要工作階段。 建議每 2 秒讀取一次。`revision` 持續不變時逐步延長至 10 秒，有更新時恢復到 2 秒。`phase` 為 `COMPLETED`、`FAILED` 或 `CANCELLED` 時停止。收到 `Retry-After` 時，至少等候指定時間再請求。\n\n寫入操作的 `x-csrf-origin` 也適用於 Bearer 用戶端。`origin-or-referer` 要求同源的 Origin 或 Referer，`origin-required` 則要求符合該操作說明的 Origin。\n\n預設只有同源網頁能直接呼叫 API（通訊協定、主機和連接埠均相同）。其他來源的網頁可透過自己的後端轉送請求。OpenAPI 中的伺服器網址 `/` 指向這份文件所在來源的根路徑。獨立用戶端請設定執行個體的完整網址。
key.self=每把已驗證的程式金鑰都能讀取自身的授權，無須額外權限。
comparison=## 跨介面欄位與分頁對照\n\n- **作品 ID** — 圖庫的 `artworkId` 和匯出請求的 `ids[]` 使用 JSON 整數，例如 `42`。下載任務的 `workId`、Pixiv 搜尋結果的 `id`、批次項目的 `key.id` 使用字串，例如 `"42"`。提交插畫時使用 `workType="artwork"`，回執中的 `queueType="illust"` 是佇列名稱。\n- **下載選項** — 單一任務的 `options` 使用字串值。批次任務的 `definition.download` 對相同選項使用 JSON 布林值或整數。下方提供兩個完整請求。\n- **路徑** — 任務的 `outputPath` 是預計輸出目錄，可能為空值。圖庫的 `folder` 是已登錄的目錄。兩者的路徑分隔符號可能不同，關聯記錄時請使用作品 ID。\n- **時間** — 任務的 `updatedAt` 使用 ISO 8601，可含小數秒。批次的 `createdTime`、圖庫的 `time` 和排程的 `nextRunTime` 使用 Unix 毫秒。讀取下一頁任務歷史時，請原樣傳回 `beforeTime`，保留所有小數位。\n- **回應結構** — `GET /api/authors` 傳回陣列。`GET /api/authors/paged` 以 `content` 傳回陣列及分頁資訊。`GET /api/downloaded/statistics` 傳回含 `success` 和計數的物件。\n- **讀取插畫**：下載紀錄與檔案校驗使用 `GET /api/library/artworks/{artworkId}`（無紀錄時 400，回應本文為空）；圖庫資料使用 `GET /api/gallery/artwork/{artworkId}`（不可見或不存在時 404）；本機介面使用 `GET /api/downloaded/{artworkId}`，程式金鑰請使用 library。\n- **篩選條件**：圖庫查詢使用逗號分隔，例如 `?format=jpg,png&collectionIds=12,34`；匯出請求的 `filter` 使用 JSON 陣列，例如 `{"formats":["jpg","png"],"collectionIds":[12,34]}`。\n\n### 分頁與續頁
comparison.task=### 提交同一件 Pixiv 插畫的兩種方式\n\n請擇一使用，並將範例中的作品 ID `42` 換成目前帳號可存取的作品 ID。向 `POST /api/download/tasks` 提交新任務時產生新的 `requestId`。重試同一請求時沿用原值。
comparison.batch=向 `POST /api/download/batches` 提交前，請先呼叫 `GET /api/schedule/sources`，以 `sources` 中 `sourceType` 為 `explicit-list` 的項目所傳回的 `activationToken` 取代預留位置。範例需要執行個體已啟用對應的下載類型和來源。
binding.in=參數所在的位置。
binding.field=路徑、查詢、請求標頭或表單分段的名稱。請求本文的欄位使用 JSON Pointer。
binding.reason=供程式判斷的驗證原因，例如 required（缺少必填值）、type（型別錯誤）或 invalid_value（無效值）。
response.maintenance=維護期間會回傳 auth.maintenance，Retry-After 表示建議等候的秒數。
response.quiesced=負責此路由的外掛程式暫停接收請求時，會回傳 plugin.unavailable.quiesced。
missing=### 記錄缺失時的回應\n\n| 讀取的資源 | 回應 | 用戶端處理 |\n| --- | --- | --- |\n| 本機作品下載記錄 `GET /api/library/artworks/{artworkId}` | `400` | 回應本文為空。先檢查狀態與本文，再解析 JSON。 |\n| 部分下載記錄 `GET /api/library/artworks/{artworkId}/partial` | `404 error.request.not-found` | 這個作品沒有未完成的分頁記錄。 |\n| 指定 UUID 的下載任務 `GET /api/download/tasks/{taskId}` | `404 DOWNLOAD_TASK_NOT_FOUND` | 檢查回執與呼叫身分。未知或不可見的任務會傳回相同錯誤。 |\n| 依作品查詢下載進度 `GET /api/download/status/{artworkId}` | `200 success=false` | 目前沒有可見的進度記錄。 |\n| 封存狀態 `GET /api/archive/status/{token}` | `200 status=expired` | 權杖未知或已過期，結束輪詢。 |\n| 封存檔案 `GET /api/archive/download/{token}` | `410` | 若仍需要檔案，請重新封裝。 |
