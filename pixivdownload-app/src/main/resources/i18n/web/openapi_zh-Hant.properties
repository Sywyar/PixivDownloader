intro=在桌面端「安全 → 程式存取金鑰」或用命令列 `--program-key-create` 建立程式金鑰，透過 HTTPS 在請求標頭中傳送 `Authorization: Bearer <key>`。線上測試僅適用於 HTTPS 或本機回送位址。 OpenAPI 操作中的 `responses[status].links` 提供後續請求，`externalDocs` 可開啟對應指南。`x-related-operations` 可用來查找相關方法；呼叫前請核對目標方法的用途及權限。 `x-related-guides` 列出這些方法引用的指南。
pagination=分頁參數依端點而異。`GET /api/gallery/artworks` 使用 `page` 和 `size`，從第 0 頁開始。`GET /api/download/batches/{id}/items` 使用 `offset` 和 `limit`。`GET /api/download/tasks/history` 的第一頁省略 `beforeTime` 和 `beforeId`，讀取下一頁時一併傳回上一頁回傳的兩個值。\n\n外掛市集使用 `cursor` 和 `limit`，第一頁省略 `cursor`。讀取下一頁時，`/api/plugin-market/catalog` 使用回應中的 `nextCursor` 作為 `cursor`，`/api/plugin-market/plugins/{repositoryId}/{pluginId}` 則使用 `nextVersionCursor`。Pixiv 的插畫與小說搜尋、系列查詢都只用 `page` 分頁，從 1 開始。 追蹤動態使用 p，範圍搜尋使用 startPage 和 endPage。
permissions=每個操作列出路由策略、可用身分及所需權限。部分操作還會檢查目標外掛權限。管理員可用 GET /api/security/program-keys/permissions 查看權限。使用程式金鑰時，請單獨傳送 Bearer，勿同時傳送工作階段或邀請 Cookie、X-Session-Token 或 X-GUI-Token。 /api/gui/ 供本機桌面使用。程式用戶端請選擇宣告 programKey 的操作，並依照該操作的回應規格處理。 `x-program-permissions` 各階段、條件欄位與上下文運算式的定義，請見本文件頂層的 `x-program-permission-conditions`。 單獨傳送有效金鑰存取未宣告 `programKey` 的操作，會收到 `403 auth.program.unsupported`，包括允許匿名存取的操作。金鑰無效或混用憑證時，可能收到 `401 auth.program.invalid`。\n\n輪換金鑰時，管理員在桌面端「安全 → 程式存取金鑰」、命令列 `--program-key-create` 或管理員工作階段中建立新金鑰。用戶端切換後，以 `GET /api/security/program-keys/self` 核對新金鑰的身分和權限，再由管理員撤銷舊金鑰。新金鑰無法讀取舊金鑰提交的任務，可在撤銷前輪詢至終態，或以管理員工作階段追蹤。
