gui.config.symbolic-pin.title=ダウンロードルートディレクトリを変更
gui.config.symbolic-pin.message=変更前のダウンロードルートは、アプリケーションのディレクトリに追従する相対パスでした：\n{0}\n\n続行すると、既存のダウンロード記録は上記の絶対パスに固定されます。今後アプリケーション全体を移動する場合は、ステータスページの「ダウンロードディレクトリを移行」で再度更新してください。\n\n既存の記録を固定して保存を続行しますか？
gui.config.symbolic-pin.cancelled=保存をキャンセルしました。ダウンロードルートディレクトリは変更されていません
gui.config.symbolic-pin.failed=既存のダウンロードレコードの固定に失敗したため、設定は保存されませんでした。しばらくしてから再試行するか、先にステータスページの「ダウンロードディレクトリを移行」で処理してからダウンロードルートディレクトリを変更してください。
gui.config.notice.restarting=設定を保存しました。バックエンドサービスを再起動中...
gui.config.dialog.save-failed.message=設定の保存に失敗しました：{0}
gui.config.field.download.root-folder.help=画像を保存するルートディレクトリ（相対パスまたは絶対パス）。変更後はアプリ全体の再起動が必要です
gui.config.field.download.root-folder.label=ダウンロードルートディレクトリ
gui.config.field.download.user-flat-folder.help=オンにすると、一括インポートの単一作品と同じフラットな構成になります。オフの場合、ダウンロードルートに作者ユーザー名のフォルダーを作成して User モードの作品を保存します
gui.config.field.download.user-flat-folder.label=User モードのフラット構成
gui.config.field.download.max-concurrent.help=同時にダウンロードする画像・作品数の上限（1 以上）。専用スレッドプールを使用し、最大 100 作品まで待機できます。キューが満杯の場合は新しいタスクを拒否します。小さくすると Pixiv のレート制限にかかる可能性を下げられます。変更後はサービスの再起動が必要です
gui.config.field.download.max-concurrent.label=最大同時ダウンロード数（画像）
gui.config.field.guest-invite.request-limit-minute.help=招待されたゲストが招待コード 1 件につき 1 分間に実行できる API リクエスト数の上限（0 = 無制限）。solo / multi の両モードで有効で、管理者には適用されません
gui.config.field.guest-invite.request-limit-minute.label=招待ゲスト API レート制限（回/分）
gui.config.field.guest-invite.static-resource-request-limit-minute.help=招待されたゲストが招待コード 1 件につき 1 分間に実行できる HTML、JS、CSS、フォントなどの静的リソースリクエスト数の上限（0 = 無制限）。solo / multi の両モードで有効です
gui.config.field.guest-invite.static-resource-request-limit-minute.label=招待ゲスト静的リソースレート制限（回/分）
gui.config.field.guest-invite.tts-request-limit-minute.help=招待されたゲストが招待コード 1 件につき 1 分間に実行できるオンライン TTS（音声合成）リクエスト数の上限（0 = 無制限）。管理者とブラウザー内蔵音声には適用されません
gui.config.field.guest-invite.tts-request-limit-minute.label=招待ゲストオンライン音声合成レート制限（回/分）
gui.config.field.plugin-catalog.enabled.help=プラグインマーケット（信頼済みカタログ）を有効にするかどうか。デフォルトは有効で、管理者がマーケットを開く・更新する、またはインストールを実行する場合だけリポジトリにアクセスします。無効にするとリポジトリへのアクセスを禁止できます。変更後はサービスの再起動が必要です
gui.config.field.plugin-catalog.enabled.label=プラグインマーケットを有効化
gui.config.field.plugin-catalog.official-repository-enabled.help=組み込みの公式デフォルトリポジトリを有効にするかどうか（デフォルトは有効）。プラグインマーケットが有効な場合のみ適用され、個別に無効にしてカスタムリポジトリだけを使うこともできます。変更後はサービスの再起動が必要です
gui.config.field.plugin-catalog.official-repository-enabled.label=公式デフォルトリポジトリを有効化
gui.config.field.plugin-catalog.connect-timeout-ms.help=リポジトリ一覧の取得・プラグインパッケージのダウンロードに使う全体の接続タイムアウト（ミリ秒）。個別のリポジトリで上書きできます。変更後はサービスの再起動が必要です
gui.config.field.plugin-catalog.connect-timeout-ms.label=接続タイムアウト（ミリ秒）
gui.config.field.plugin-catalog.read-timeout-ms.help=リポジトリ一覧の取得・プラグインパッケージのダウンロードに使う全体の読み取りタイムアウト（ミリ秒）。個別のリポジトリで上書きできます。変更後はサービスの再起動が必要です
gui.config.field.plugin-catalog.read-timeout-ms.label=読み取りタイムアウト（ミリ秒）
gui.config.field.plugin-catalog.max-manifest-bytes.help=1 つのリポジトリ一覧でダウンロードできる最大バイト数（デフォルト 1048576 = 1 MB）。過大なレスポンスを防ぎます。個別のリポジトリで上書きできます。変更後はサービスの再起動が必要です
gui.config.field.plugin-catalog.max-manifest-bytes.label=一覧サイズ上限（バイト）
