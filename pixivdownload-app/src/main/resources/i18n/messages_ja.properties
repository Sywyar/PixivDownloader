gui.config.field.schedule.enabled.help=無効にするとスケジューラーの tick をスキップし、すべてのスケジュールタスクを実行しません（作成済みのタスクは保持され、削除されません）。デフォルトは有効です
gui.config.field.schedule.tick-interval-ms.label=スケジューラー確認間隔（ミリ秒）
gui.config.field.schedule.tick-interval-ms.help=期限切れのタスクを確認する間隔。デフォルトは 60000（60 秒）です。起動時のタイマーがこの値を解析するため、変更後は再起動が必要です（ホットリロードには対応していません）
gui.config.field.schedule.max-tasks.label=スケジュールタスクの最大数
gui.config.field.schedule.max-tasks.help=1 つのデータベースで作成できるスケジュールタスク数の上限。悪用を防ぎます。デフォルトは 100 です
gui.config.field.schedule.inbox-check-every.label=Pixiv 受信箱の確認間隔（作品数）
gui.config.field.schedule.inbox-check-every.help=cookie バインドタスクが指定数の作品を正常にダウンロードするたびに受信箱を読み込み、Pixiv の過剰アクセス警告を確認します（スキップ・フィルターされた作品は数えません）。デフォルトは 500 です
gui.config.field.schedule.auth-failure-circuit-breaker.label=単一作品の連続失敗遮断しきい値
gui.config.field.schedule.auth-failure-circuit-breaker.help=同じラウンドで単一作品の取得にこの回数連続して失敗すると、ログイン状態が無効と判断し、再認証を待つためタスクを一時停止します。デフォルトは 5 です
gui.config.field.schedule.pending-max-attempts.label=保留中の最大再試行回数
gui.config.field.schedule.pending-max-attempts.help=隔離された失敗作品を自動再試行する最大回数。上限に達すると手動対応が必要とマークし、自動再試行を停止します。デフォルトは 5 です
