gui.welcome.start.point.formats=ダウンロードページでは、ファイル名テンプレート、小説形式（TXT/HTML/EPUB）、シリーズの合本などを設定できます。
gui.welcome.start.waiting=ブラウザーでダウンロードページを開くと、次の手順に自動的に進みます
gui.welcome.advanced.title=高度な機能（任意）
gui.welcome.advanced.body=以下は任意の高度な機能です。必要に応じてご確認ください。使わなくても通常のダウンロードや閲覧には影響しません。確認後に「次へ」を押すとガイドが完了します。
gui.welcome.scripts.title=高度な機能：サイト内拡張
gui.welcome.scripts.intro=ほとんどのダウンロードは Web 版だけで行え、スクリプトは不要です。Userscript が必要なのは、Web 版ではできない次の 2 つの機能だけです。
gui.welcome.scripts.point.page=「ページ一括」：Pixiv 内の検索・ランキング・フォロー中の更新など、任意の一覧ページから作品を直接取得して一括ダウンロードします。
gui.welcome.scripts.point.toolbox=「ツールボックス」：Pixiv 内の閲覧体験を拡張します（ダウンロード済み作品へのマークなど）。
gui.welcome.scripts.install=インストール方法：まずブラウザー拡張機能 Tampermonkey をインストールし、ダウンロードページの「Userscript」カードからワンクリックでインストールします。それ以外のスクリプトは必須ではありません。
gui.welcome.ffmpeg.title=高度な機能：アニメーション対応
gui.welcome.ffmpeg.intro=ffmpeg が必要なのは「アニメーション（Ugoira）のダウンロード」だけです。アニメーションの各フレームを WebP に合成するために使います。通常の画像、漫画、小説のダウンロードには必要ありません。
gui.welcome.ffmpeg.state=現在の状態：{0}
gui.welcome.ffmpeg.state.ready=ffmpeg を検出しました
gui.welcome.ffmpeg.state.missing=ffmpeg が見つかりません（アニメーションにのみ影響します）
gui.welcome.ffmpeg.install=検出されない場合は、「ステータス」タブから内蔵 ffmpeg をワンクリックでダウンロードするか、自分でインストールしてシステム PATH に追加してください。
gui.welcome.done.reopen.title=ガイドをいつでも見直す
gui.welcome.done.reopen=Web 版の「操作ガイド」は、ダウンロードページやギャラリーページ左下の「操作ガイド」ボタンからいつでも開き直せます。この初回ガイドは、完了するまで起動のたびに自動表示されます。
gui.welcome.done.title=すべて完了しました
gui.welcome.done.body=おめでとうございます。ガイドはすべて完了しました。これでダウンロードと閲覧を始められます。
gui.welcome.done.button=ステータスを開く
gui.welcome.done.point.start=ダウンロード：「ダウンロード」ページに作品リンク、作者 ID、キーワードを貼り付けると一括ダウンロードできます。
gui.welcome.done.point.advanced=高度な機能（Userscript、アニメーション用 ffmpeg）は、前の「高度な機能」ページまたは各ページでいつでも確認できます。
