gui.ffmpeg.dialog.unsupported.message=현재 시스템에서는 FFmpeg 자동 다운로드를 지원하지 않습니다. PATH에 수동으로 설치한 뒤 움짤을 WebP로 변환하세요.
gui.ffmpeg.dialog.install.title=FFmpeg 다운로드
gui.ffmpeg.dialog.install.confirm.message=FFmpeg를 소프트웨어 디렉터리에 다운로드하여 Ugoira 움짤을 WebP로 변환합니다. 일반 이미지 다운로드에는 영향이 없습니다.\n\n계속하시겠습니까?
