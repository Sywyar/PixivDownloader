gui.ffmpeg.panel.title=FFmpeg / 움짤 지원
gui.ffmpeg.panel.intro=<html><b>Ugoira 움짤을 WebP로 변환하려면 FFmpeg가 필요합니다.</b><br/>설치 프로그램과 온라인 휴대용 버전에는 FFmpeg가 포함되어 있지 않습니다. 전체 휴대용 버전에는 포함되어 있으며 여기서 추가할 수도 있습니다.</html>
