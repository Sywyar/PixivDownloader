gui.ffmpeg.dialog.install-failed.title=다운로드 실패
gui.ffmpeg.dialog.open-dir-failed.message=FFmpeg 디렉터리를 열 수 없습니다：{0}
gui.ffmpeg.install.unsupported=현재 시스템에서는 FFmpeg 자동 다운로드를 지원하지 않습니다. 직접 설치하여 PATH에 추가하세요.
