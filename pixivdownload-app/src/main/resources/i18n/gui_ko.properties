gui.welcome.title=PixivDownloader에 오신 것을 환영합니다
gui.welcome.subtitle=설치가 완료되었습니다! 다음 몇 단계를 따라 첫 다운로드를 시작하세요.
gui.welcome.optional.badge=(선택 사항)
gui.welcome.nav.next=다음
gui.welcome.nav.prev=이전
gui.welcome.nav.finish=완료
gui.welcome.done.title=모두 완료
gui.welcome.done.body=축하합니다. 안내를 모두 완료했습니다! 이제 다운로드와 탐색을 시작할 수 있습니다.
gui.welcome.done.button=상태 페이지로 이동
gui.welcome.done.point.start=다운로드：'다운로드 페이지'에 작품 링크, 작가 ID 또는 키워드를 붙여 넣으면 일괄 다운로드할 수 있습니다.
gui.welcome.done.point.advanced=고급 기능(Userscript, 움짤 ffmpeg)은 이전 단계의 '고급 기능' 페이지나 해당 페이지에서 언제든 확인할 수 있습니다.
gui.welcome.advanced.title=고급 기능(선택 사항)
gui.welcome.advanced.body=다음은 선택 가능한 고급 기능입니다. 필요한 경우에만 확인하세요. 사용하지 않아도 일상적인 다운로드와 탐색에는 전혀 영향을 주지 않습니다. 확인한 뒤 '다음'을 누르면 안내가 완료됩니다.
gui.welcome.status.subtitle=이 단계에서는 로컬 백엔드 서비스가 정상적으로 실행 중인지 확인합니다. 모든 기능을 사용하기 위한 전제 조건이며 별도로 조작할 필요가 없습니다. 준비되면 '다음'을 누르세요.
gui.welcome.status.title=1. 서비스 준비 완료
gui.welcome.status.running=실행 중입니다. 사용할 수 있습니다
gui.welcome.status.starting=시작 중입니다. 잠시 기다리세요…
gui.welcome.status.failed=시작하지 못했습니다. '상태' 페이지에서 로그를 확인하세요
gui.welcome.status.stopped=서비스가 실행 중이 아닙니다
gui.welcome.config.title=2. 설정
gui.welcome.config.body=관리자 페이지에 로그인할 관리자 계정을 설정합니다. 제출하면 초기 설치가 완료되어 바로 다운로드를 시작할 수 있습니다. 이 단계는 한 번만 수행하면 됩니다.
gui.welcome.config.username=관리자 사용자 이름
gui.welcome.config.password=관리자 비밀번호
gui.welcome.config.submit=설정 완료
gui.welcome.config.submitting=제출 중…
gui.welcome.config.done=설정이 완료되었습니다
gui.welcome.config.waiting=서비스가 시작될 때까지 기다리면 설정할 수 있습니다…
gui.welcome.config.invalid.username=관리자 사용자 이름을 입력하세요
gui.welcome.config.invalid.password=비밀번호는 8자 이상이어야 합니다
gui.welcome.config.password-warning.message=이 소프트웨어는 다른 소프트웨어의 Cookie 등 민감한 자격 증명을 저장합니다. 12자 이상의 비밀번호를 사용하는 것이 좋습니다. 계속하려면 설정 완료를 다시 클릭하세요.
gui.welcome.config.failed=설정 실패：{0}
gui.welcome.proxy.title=3. 프록시 설정
gui.welcome.proxy.body=백엔드의 외부 네트워크 요청은 모두 이 HTTP 프록시를 거칩니다：Pixiv 방문·검색·이미지/움짤/소설/표지 다운로드·컬렉션 접근, 온라인 업데이트(새 버전 확인 및 다운로드), 내장 FFmpeg 다운로드(움짤 변환에 필요), 온라인 TTS(소설 듣기의 Edge 신경망 음성). 여기서 프록시와 주소를 설정할 수 있으며 이후 '설정' 탭에서 언제든 변경할 수 있습니다.
gui.welcome.proxy.enabled=프록시 사용
gui.welcome.proxy.host=프록시 호스트
gui.welcome.proxy.port=프록시 포트
gui.welcome.proxy.point.usage=일반적인 로컬 사용에서는 보통 켜 둔 상태로 로컬 프록시를 입력합니다(기본값 127.0.0.1:7890).
gui.welcome.proxy.point.docker=Docker 컨테이너에서 실행할 때는 127.0.0.1로 호스트의 프록시에 연결할 수 없는 경우가 많습니다. 필요에 따라 프록시를 끄거나 컨테이너에서 접근 가능한 주소를 입력하세요.
gui.welcome.proxy.point.change=프록시 설정은 config.yaml에 저장되어 즉시 적용됩니다. 이후 '설정' 탭에서 언제든 조정할 수 있습니다.
gui.welcome.proxy.invalid.host=프록시를 사용할 때는 프록시 호스트를 입력하세요
gui.welcome.proxy.invalid.port=프록시 포트는 1~65535 사이의 정수여야 합니다
gui.welcome.proxy.failed=프록시 설정을 저장하지 못했습니다：{0}
gui.welcome.start.title=4. 다운로드 시작
gui.welcome.start.body=웹에서 다운로드하는 것을 권장합니다. 브라우저 확장 프로그램을 설치할 필요가 없습니다. 아래 버튼을 눌러 다운로드 페이지를 열고 내용을 붙여 넣으면 일괄 다운로드할 수 있습니다.
gui.welcome.start.button=다운로드 페이지 열기
gui.welcome.start.waiting=브라우저에서 다운로드 페이지를 열면 자동으로 다음 단계로 이동합니다
gui.welcome.scripts.title=고급：사이트 내 기능 강화
gui.welcome.scripts.body=두 Userscript는 웹에서 할 수 없는 작업을 수행합니다. '페이지 일괄 다운로드'는 Pixiv 사이트에서 현재 페이지의 작품을 직접 가져오고, '도구 상자'는 Pixiv 탐색 환경을 개선합니다. 그 밖의 다운로드에는 웹 페이지만 사용하면 됩니다.
gui.welcome.scripts.button=스크립트 보기
gui.welcome.ffmpeg.title=고급：움짤 지원
gui.welcome.ffmpeg.body=움짤(Ugoira)을 다운로드할 때만 ffmpeg가 필요합니다. 일반 이미지와 소설 다운로드에는 필요하지 않습니다.
gui.welcome.ffmpeg.button=설정으로 이동
gui.welcome.ffmpeg.state.ready=ffmpeg가 감지되었습니다
gui.welcome.ffmpeg.state.missing=ffmpeg가 감지되지 않았습니다(움짤에만 영향)
gui.welcome.status.point1=초록색 점이 켜져 있고 '실행 중'으로 표시되면 서비스가 준비된 것입니다.
gui.welcome.status.point2='시작 중'으로 표시되면 잠시 기다리세요. 처음 시작할 때 데이터베이스를 초기화할 수 있습니다.
gui.welcome.status.point3=오랫동안 준비되지 않거나 시작 실패가 표시되면 '상태' 탭에서 로그를 확인하세요.
gui.welcome.config.point.account=사용자 이름과 비밀번호는 다운로드 페이지, 모니터 페이지 등 인증이 필요한 페이지에 로그인할 때 사용합니다. 비밀번호는 8자 이상, 12자 이상을 권장합니다.
gui.welcome.config.point.change=계정을 변경하려면 이후 '설정' 탭에서 조정하거나 설치 절차를 다시 실행하세요.
gui.welcome.config.done.body=초기 설치가 완료되었습니다. 바로 다운로드를 시작할 수 있습니다. '다음'을 눌러 다른 기능을 확인하세요.
gui.welcome.start.point.kinds=지원 콘텐츠：단일/여러 작품 링크, 작가 페이지(사용자 ID로 모든 작품 다운로드), 키워드 검색, 전체 시리즈. 일러스트, 만화, 움짤, 소설을 지원합니다.
gui.welcome.start.point.keepopen=다운로드는 백엔드에서 수행되지만 대기열 제출이 모두 끝날 때까지 다운로드 페이지를 열어 두세요(페이지가 계속 대기열을 백엔드로 전송합니다).
gui.welcome.start.point.formats=다운로드 페이지에서 파일 이름 템플릿, 소설 형식(TXT/HTML/EPUB), 시리즈 합본 등의 옵션을 설정할 수 있습니다.
gui.welcome.scripts.intro=대부분의 다운로드에는 웹 페이지만 사용하면 되며 스크립트가 필요하지 않습니다. 웹에서 할 수 없는 다음 두 기능만 Userscript에 의존합니다.
gui.welcome.scripts.point.page='페이지 일괄 다운로드'：Pixiv 사이트(검색, 순위, 팔로잉 피드 등 모든 목록 페이지)에서 현재 페이지의 작품을 직접 가져와 일괄 다운로드합니다.
gui.welcome.scripts.point.toolbox='도구 상자'：Pixiv 사이트 탐색 환경을 강화합니다(예: 이미 다운로드한 작품에 표시 추가).
gui.welcome.scripts.install=설치 방법：먼저 브라우저 확장 프로그램 Tampermonkey를 설치한 다음 다운로드 페이지의 'Userscript' 카드에서 한 번에 설치하세요. 그 밖의 스크립트는 필수가 아닙니다.
gui.welcome.ffmpeg.intro='움짤 다운로드(Ugoira)'에만 ffmpeg가 필요합니다. 움짤의 프레임 이미지를 webp로 합치는 데 사용하며 일반 이미지, 만화, 소설에는 필요하지 않습니다.
gui.welcome.ffmpeg.state=현재 상태：{0}
gui.welcome.ffmpeg.install=감지되지 않으면 '상태' 탭에서 내장 ffmpeg를 한 번에 다운로드하거나 직접 설치하여 시스템 PATH에 추가할 수 있습니다.
gui.welcome.done.reopen.title=언제든 안내 다시 보기
gui.welcome.done.reopen=웹의 '사용 안내'는 다운로드 페이지나 갤러리 페이지 왼쪽 아래의 '사용 안내' 버튼으로 언제든 다시 열 수 있습니다. 이 안내의 홈은 모두 완료하기 전까지 시작할 때마다 자동으로 표시됩니다.
