gui.ffmpeg.hint.missing=일반 이미지 다운로드에는 영향이 없습니다. Ugoira 움짤을 처리해야 할 때 오른쪽 버튼을 누르세요.
gui.ffmpeg.path.managed=소프트웨어 디렉터리 설치 위치：{0}
