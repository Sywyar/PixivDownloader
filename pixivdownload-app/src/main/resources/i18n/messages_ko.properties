cli.reset-password.warning=주의: 이 명령은 현재 비밀번호를 확인하지 않습니다. 비밀번호를 정말 잊은 경우에만 사용하세요.
cli.reset-password.success=비밀번호가 재설정되었습니다. 기존의 모든 로그인 세션이 로그아웃되었으므로 새 비밀번호로 다시 로그인하세요.
