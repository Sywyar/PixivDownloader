gui.welcome.start.body=웹에서 다운로드하는 것을 권장합니다. 브라우저 확장 프로그램을 설치할 필요가 없습니다. 아래 버튼을 눌러 다운로드 페이지를 열고 내용을 붙여 넣으면 일괄 다운로드할 수 있습니다.
gui.welcome.start.button=다운로드 페이지 열기
