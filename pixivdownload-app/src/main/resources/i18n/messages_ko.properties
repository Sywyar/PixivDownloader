gui.welcome.nav.next=다음
gui.welcome.nav.prev=이전
gui.welcome.status.subtitle=이 단계에서는 로컬 백엔드 서비스가 정상적으로 실행 중인지 확인합니다. 모든 기능을 사용하기 위한 전제 조건이며 별도로 조작할 필요가 없습니다. 준비되면 '다음'을 누르세요.
gui.welcome.status.point1=초록색 점이 켜져 있고 '실행 중'으로 표시되면 서비스가 준비된 것입니다.
gui.welcome.status.point2='시작 중'으로 표시되면 잠시 기다리세요. 처음 시작할 때 데이터베이스를 초기화할 수 있습니다.
gui.welcome.status.point3=오랫동안 준비되지 않거나 시작 실패가 표시되면 '상태' 탭에서 로그를 확인하세요.
gui.welcome.config.point.account=사용자 이름과 비밀번호는 다운로드 페이지, 모니터 페이지 등 인증이 필요한 페이지에 로그인할 때 사용합니다. 비밀번호는 8자 이상, 12자 이상을 권장합니다.
gui.welcome.config.point.change=계정을 변경하려면 이후 '설정' 탭에서 조정하거나 설치 절차를 다시 실행하세요.
gui.welcome.config.submitting=제출 중…
gui.welcome.config.password-warning.message=이 소프트웨어는 다른 소프트웨어의 Cookie 등 민감한 자격 증명을 저장합니다. 12자 이상의 비밀번호를 사용하는 것이 좋습니다. 계속하려면 설정 완료를 다시 클릭하세요.
gui.welcome.proxy.point.usage=일반적인 로컬 사용에서는 보통 켜 둔 상태로 로컬 프록시를 입력합니다(기본값 127.0.0.1:7890).
gui.welcome.proxy.point.docker=Docker 컨테이너에서 실행할 때는 127.0.0.1로 호스트의 프록시에 연결할 수 없는 경우가 많습니다. 필요에 따라 프록시를 끄거나 컨테이너에서 접근 가능한 주소를 입력하세요.
gui.welcome.proxy.point.change=프록시 설정은 config.yaml에 저장되어 즉시 적용됩니다. 이후 '설정' 탭에서 언제든 조정할 수 있습니다.
gui.welcome.start.point.kinds=지원 콘텐츠：단일/여러 작품 링크, 작가 페이지(사용자 ID로 모든 작품 다운로드), 키워드 검색, 전체 시리즈. 일러스트, 만화, 움짤, 소설을 지원합니다.
gui.welcome.start.point.keepopen=다운로드는 백엔드에서 수행되지만 대기열 제출이 모두 끝날 때까지 다운로드 페이지를 열어 두세요(페이지가 계속 대기열을 백엔드로 전송합니다).
gui.welcome.start.point.formats=다운로드 페이지에서 파일 이름 템플릿, 소설 형식(TXT/HTML/EPUB), 시리즈 합본 등의 옵션을 설정할 수 있습니다.
gui.welcome.start.waiting=브라우저에서 다운로드 페이지를 열면 자동으로 다음 단계로 이동합니다
gui.welcome.advanced.title=고급 기능(선택 사항)
gui.welcome.advanced.body=다음은 선택 가능한 고급 기능입니다. 필요한 경우에만 확인하세요. 사용하지 않아도 일상적인 다운로드와 탐색에는 전혀 영향을 주지 않습니다. 확인한 뒤 '다음'을 누르면 안내가 완료됩니다.
gui.welcome.scripts.title=고급：사이트 내 기능 강화
gui.welcome.scripts.intro=대부분의 다운로드에는 웹 페이지만 사용하면 되며 스크립트가 필요하지 않습니다. 웹에서 할 수 없는 다음 두 기능만 Userscript에 의존합니다.
gui.welcome.scripts.point.page='페이지 일괄 다운로드'：Pixiv 사이트(검색, 순위, 팔로잉 피드 등 모든 목록 페이지)에서 현재 페이지의 작품을 직접 가져와 일괄 다운로드합니다.
gui.welcome.scripts.point.toolbox='도구 상자'：Pixiv 사이트 탐색 환경을 강화합니다(예: 이미 다운로드한 작품에 표시 추가).
gui.welcome.scripts.install=설치 방법：먼저 브라우저 확장 프로그램 Tampermonkey를 설치한 다음 다운로드 페이지의 'Userscript' 카드에서 한 번에 설치하세요. 그 밖의 스크립트는 필수가 아닙니다.
gui.welcome.ffmpeg.title=고급：움짤 지원
gui.welcome.ffmpeg.intro='움짤 다운로드(Ugoira)'에만 ffmpeg가 필요합니다. 움짤의 프레임 이미지를 webp로 합치는 데 사용하며 일반 이미지, 만화, 소설에는 필요하지 않습니다.
gui.welcome.ffmpeg.state=현재 상태：{0}
