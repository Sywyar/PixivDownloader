cli.setup.mode.intro=실행 모드를 선택하세요(두 모드의 차이는 다음과 같습니다):
cli.setup.mode.solo.desc=- solo(개인 사용 모드): 개인만 사용합니다. 접속 시 로그인이 필요하며 로그인 상태 유지 여부를 선택할 수 있습니다. 모든 설정(Cookie, 설정, 대기열)은 서버에 통합 저장되어 여러 기기에서 같은 상태를 공유합니다.
cli.setup.mode.multi.desc=- multi(다중 사용자 모드): 여러 사람이 서비스를 공유합니다. 방문자는 로그인할 필요가 없고 각 사용자의 설정은 각 브라우저 로컬 저장소에 독립적으로 저장되어 서로 영향을 주지 않습니다. 사용자별 다운로드 할당량을 활성화할 수도 있습니다.
