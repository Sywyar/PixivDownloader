config.template.server.port.comment=서비스 수신 대기 포트
config.template.debug.enabled.comment=디버그 모드: 켜면 디버깅 시나리오 전용 기능을 사용함(기본값 꺼짐)
config.template.download.root-folder.comment=다운로드 루트 디렉터리(상대 또는 절대 경로)
config.template.download.user-flat-folder.comment=선택하면 작품 일괄 가져오기와 같은 평면 구조를 사용하고, 선택하지 않으면 다운로드 루트에 작가 사용자 이름의 폴더를 만들어 User 모드 작품을 저장함
config.template.download.max-concurrent.comment=동시에 다운로드할 이미지/작품 수의 상한(≥1, 전용 스레드 풀, 최대 100개 작품 대기, 대기열이 가득 차면 새 작업 거부). 값을 낮추면 Pixiv 요청 제한 가능성을 낮출 수 있으며 변경 후 다시 시작해야 함
task.queue.full=작업 대기열이 가득 찼습니다. 잠시 후 다시 시도하세요
