config.template.plugin-catalog.read-timeout-ms.comment=저장소 목록을 가져오거나 플러그인 패키지를 다운로드할 때의 전역 읽기 시간 초과(밀리초). 개별 저장소에서 덮어쓸 수 있음. 변경 후 다시 시작
config.template.plugin-catalog.max-manifest-bytes.comment=개별 저장소 목록에서 다운로드를 허용하는 최대 바이트 수(기본값 1 MB). 개별 저장소에서 덮어쓸 수 있음. 변경 후 다시 시작
config.template.plugin-catalog.max-package-bytes.comment=개별 플러그인 패키지에서 허용하는 최대 바이트 수(기본값 100 MB). 개별 저장소에서 덮어쓸 수 있음. 변경 후 다시 시작
config.template.plugin-catalog.repositories.comment=사용자 지정 플러그인 저장소 목록(기본값 비어 있음, 서드파티 주소에 접근하지 않음). GUI '플러그인' 설정 페이지에서 관리하거나 https 목록 주소를 직접 입력함. 변경 후 다시 시작
