gui.migrate-dir.symbolic-sync.inside.message=현재 다운로드 루트 디렉터리를 변경했습니다：\n이전：{0}\n새 경로：{1}\n\n새 디렉터리가 여전히 소프트웨어 디렉터리 안에 있습니다. config.yaml의 다운로드 루트 디렉터리(download.root-folder)를 상대 경로 “{2}”로 변경하시겠습니까?\n“예”를 선택하면 데이터베이스 기록이 소프트웨어 디렉터리를 계속 따르므로 소프트웨어 전체를 이동한 뒤에도 자동으로 찾을 수 있습니다(권장).\n“아니요”를 선택하면 데이터베이스 기록이 새 디렉터리의 절대 경로로 고정되고 config.yaml은 바뀌지 않아 새 다운로드가 이전 디렉터리에 저장됩니다.\n\n안내：이 도구는 기록만 수정하며 디스크의 파일은 이동하지 않습니다. 먼저 파일을 새 디렉터리로 직접 이동하세요. (다운로드 루트 변경은 서비스를 다시 시작해야 적용됩니다)
gui.migrate-dir.symbolic-sync.outside.message=현재 다운로드 루트 디렉터리를 변경했습니다：\n이전：{0}\n새 경로：{1}\n\n새 디렉터리가 소프트웨어 디렉터리 밖에 있으므로 데이터베이스 기록이 새 디렉터리의 절대 경로로 고정됩니다.\nconfig.yaml의 다운로드 루트 디렉터리(download.root-folder)도 새 경로로 동기화하시겠습니까?\n“아니요”를 선택하면 config.yaml이 바뀌지 않아 새 다운로드가 이전 디렉터리에 저장됩니다. (다운로드 루트 변경은 서비스를 다시 시작해야 적용됩니다)\n\n안내：이 도구는 기록만 수정하며 디스크의 파일은 이동하지 않습니다. 먼저 파일을 새 디렉터리로 직접 이동하세요.
