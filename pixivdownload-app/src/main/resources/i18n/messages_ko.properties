config.template.multi-mode.post-download-mode.never-delete=never-delete     패키징 후 원본 파일 유지. 같은 작품을 다시 다운로드하면 완료로 바로 반환
config.template.multi-mode.post-download-mode.timed-delete=timed-delete     패키징 후 원본 파일 유지. delete-after-hours를 초과하면 자동 삭제
