schema.top.sywyar.pixivdownload.setup.AuthFilter.ProgramCredentialError.title=驗證錯誤
schema.top.sywyar.pixivdownload.setup.AuthFilter.ProgramCredentialError.description=回應同時包含 `code`、`error` 和 `programPermission`。此處的 `code` 列舉只涵蓋帶有具體權限 ID 的回應。其他錯誤結構請見操作的 `responses`，例如 `auth.program.unsupported` 使用 `ProgramKeyUnsupported`。
