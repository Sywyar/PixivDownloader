schema.top.sywyar.pixivdownload.setup.AuthFilter.ProgramCredentialError.field.programPermission=應授予金鑰的完整權限識別碼，例如 core:schedule.create。伺服器提示所需權限時才會傳回。
response.405=此路徑不支援請求使用的 HTTP 方法，Allow 標頭會列出可用方法。
parameter.page.first0=頁碼，第一頁為 0。
parameter.page.first1=頁碼，第一頁為 1。
operation.details=詳細資訊

permissionGrammar.description=本目錄說明操作上的 `x-program-permissions`。請依實際請求、目標資源與執行計畫解析列出的條件。操作說明中也可能列出其他業務權限。
permissionGrammar.phase.route=目前 HTTP 方法與路徑所檢查的完整權限 ID，同一操作的 `x-program-permission` 也列出此值。有效金鑰缺少此權限時，目前的 HTTP 403 回應會指出所需權限。
permissionGrammar.phase.discovery=取得目前來源權杖等輸入時，使用指定的 `permission` 呼叫 `operation`。缺少權限時，由這個查詢回報。
permissionGrammar.phase.submit=目前請求的額外檢查陣列。所有適用項目都必須滿足。帶有 `effect: filter` 的項目控制清單可見性，其餘缺權從 `reportedIn` 指定的位置讀取。
permissionGrammar.phase.execution=批次受理後，背景執行時會複查來源權限，並檢查本次計畫所選作品類型的執行權限。透過 `reportedIn.operation` 查詢批次結果。
permissionGrammar.expression=`#` 左側選擇下列上下文物件，右側是從該物件根開始的 RFC 6901 JSON Pointer。例如 `task#/sourceOwnerPluginId` 會讀取既有工作的 `sourceOwnerPluginId`。 在欄位名稱中用 `~0` 表示 `~`，用 `~1` 表示 `/`。
permissionGrammar.context.request=目前操作送出的 JSON 請求本文。
permissionGrammar.context.query=目前請求的 URL 查詢參數，以參數名稱為鍵。
permissionGrammar.context.task=目前路徑 `{id}` 指定的既有排程工作。
permissionGrammar.context.batch=目前路徑 `{id}` 指定的既有手動批次。繼續與重試都從該批次讀取來源類型。
permissionGrammar.context.item=清單篩選前正在檢查的單一候選項目。
permissionGrammar.field.permission=完整權限 ID，例如 `core:credentials.use`。在 `discovery` 或 `reportedIn` 中，它授予呼叫對應 `operation` 的權限。
permissionGrammar.field.ownerFrom=用上下文運算式讀取權限所屬的 owner，再與 `permissionId` 組合。
permissionGrammar.field.permissionId=局部權限名稱。依序串接 `ownerFrom` 解析出的值、冒號和此名稱，即為完整 ID，例如 `download-workbench:schedule.manage`。
permissionGrammar.field.header=請求使用這個標頭時，還需要同一項目中的 `permission`。
permissionGrammar.field.effect=`filter` 表示逐項檢查。缺少權限的項目會從結果省略，清單請求仍可成功。
permissionGrammar.field.catalog=從目前 OpenAPI 文件根解析 `#/…` JSON Pointer 片段取得目錄。使用 `key`、`keyFrom`、`value` 其中之一選取目錄項目，再讀取 `field`。
permissionGrammar.field.key=用目前 JSON 請求本文中這個頂層欄位的值索引目錄。
permissionGrammar.field.keyFrom=解析上下文運算式，以結果索引目錄，例如 `batch#/sourceType`。
permissionGrammar.field.value=直接用這個固定值索引目錄。
permissionGrammar.field.field=選定目錄項目的屬性名稱。從中讀取完整權限 ID。有 `keyedBy` 時，該屬性是權限對照表。
permissionGrammar.field.keyedBy=`workType` 表示用本次執行計畫實際需要的每個作品類型查 `field` 對照表，各取一個完整權限 ID。
permissionGrammar.field.recheckField=同一目錄項目中另一個屬性的名稱。背景執行時也會複查該屬性中的完整來源權限 ID，例如 `batchSubmitPermission` 對應的權限。
permissionGrammar.field.reportedIn=指定讀取診斷的位置。省略 `operation` 時讀取目前請求的回應本文。指定時讀取該操作的回應本文。兩種情況下，`pointer` 和 `codePointer` 都從對應 JSON 回應本文的根開始。
permissionGrammar.field.operation=HTTP 方法與路徑範本。查詢已受理的批次時，202 回應的 `Location` 會提供該批次的具體位址。
permissionGrammar.field.status=上述回應的 HTTP 狀態碼。輪詢回傳 200 表示成功讀取批次，批次的執行狀態見回應本文的 `state`。
permissionGrammar.field.pointer=從回應本文根讀取缺少權限 ID 的 RFC 6901 JSON Pointer。只有伺服器能確定權限時才有具體值。
permissionGrammar.field.codePointer=從同一回應本文根讀取原因碼的 JSON Pointer。先看批次的 `state`，再讀原因碼。若為 `auth.program.forbidden`，用 `pointer` 讀取已知的缺少權限 ID。
parameter.Range=要求的位元組範圍，例如 bytes=0-99。
parameter.If-Modified-Since=傳入上次回應的 Last-Modified，檔案未修改時傳回 304。
response.206=傳回要求的檔案片段。多個範圍使用 multipart/byteranges，各段均附 Content-Range。
header.contentRange.single=單一範圍的起迄位元組與檔案總長度。
parameter.If-None-Match=傳入上次回應的 ETag。目前傳回的檔案版本相符時回傳 304。
response.304=用戶端快取的檔案仍有效，回應本文為空。
response.416=無法滿足 Range。本文為空，Content-Range 以 bytes */長度 提供檔案總長度。
permissionGrammar.field.when=僅在 keyFrom 指向的 JSON 值等於 value 時才需要此權限。 省略 value 時，keyFrom 指向的欄位存在且不為 null 即需授權。
link.inspectArchive=回應含有 archiveToken 時，可用 core:archives.read 查詢封存狀態。
link.downloadArchive=狀態為 ready 時，可用 core:archives.download 下載封存檔。
schema.top.sywyar.pixivdownload.web.RequestFieldError.description=可識別輸入欄位的錯誤，包含機器碼、說明、欄位路徑及原因。
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.field=失敗欄位在請求本文中的 JSON Pointer。
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.reason=與顯示語言無關的欄位驗證原因碼。
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.code=穩定的錯誤機器碼，可用於程式判斷失敗原因。
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.error=目前請求語言的錯誤說明，供顯示使用。
response.406=Accept 與可用的回應類型不符。回應本文為空。
binding.part=缺少必填檔案時，field 會指出檔案分段的名稱。
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.in=參數所在的位置。
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.field=路徑、查詢、請求標頭或表單分段的名稱。請求本文的欄位使用 JSON Pointer。
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.reason=供程式判斷的驗證原因，例如 required（缺少必填值）、type（型別錯誤）或 invalid_value（無效值）。
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.in=欄位位於 JSON 請求本文時，值為 body。
