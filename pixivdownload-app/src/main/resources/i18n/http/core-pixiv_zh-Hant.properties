title=Pixiv 查詢
PixivSharedProxyController.getScheduleUserMeta.POST.summary=檢視計劃任務所需的 Pixiv 作者資料
PixivSharedProxyController.getScheduleUserMeta.POST.description=讀取計劃任務所選憑據對應的 Pixiv 使用者資料。請求體提供排程上下文，路徑中的 userId 指定要查詢的作者。返回作者名和使用者 ID。請從 GET /api/schedule/sources 的同一筆記錄複製 sourceType 和 activationToken。使用程式金鑰讀取該目錄需要 core:schedule.sources.read。來源重新發布後，請重新取得這兩個值。
PixivSharedProxyController.getScheduleUserMeta.POST.success=計劃任務所需的 Pixiv 作者資料。
PixivSharedProxyController.getUserMeta.GET.summary=檢視Pixiv 作者資料
PixivSharedProxyController.getUserMeta.GET.description=按路徑中的 Pixiv 使用者 ID 向 Pixiv 查詢作者名，響應同時返回該使用者 ID。
PixivSharedProxyController.getUserMeta.GET.success=Pixiv 作者資料。
PixivSharedProxyController.proxyThumbnail.GET.summary=檢視代理縮圖
PixivSharedProxyController.proxyThumbnail.GET.description=透過伺服器取得來源縮圖，響應包含影象內容和媒體型別。
PixivSharedProxyController.proxyThumbnail.GET.success=代理縮圖。
PixivSharedProxyController.getMeUid.GET.summary=檢視當前 Pixiv 賬號 ID
PixivSharedProxyController.getMeUid.GET.description=僅從 Pixiv Cookie 的 PHPSESSID 解析帳號 UID，不連線至 Pixiv 驗證工作階段。缺少可解析的 UID 時回傳 400 ACQUISITION_CREDENTIAL_REQUIRED。
PixivSharedProxyController.getMeUid.GET.success=當前 Pixiv 賬號 ID。
parameter.userId=作者的 Pixiv 使用者 ID。
parameter.X-Acquisition-Credential=可選的臨時 Pixiv 採集 Cookie 原文，最多 16384 個字元。若使用庫中儲存的憑據，改傳 X-Acquisition-Credentials 中的 ID。 公開查詢成功不代表 Cookie 的有效期已獲驗證。
parameter.url=縮圖的來源 URL。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.sourceType=所選來源在 GET /api/schedule/sources 中的 sourceType。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.activationToken=與 sourceType 同一筆目錄記錄中的 activationToken。來源重新發布後須重新取得。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.expectedStateVersion=呼叫方讀取到的任務狀態版本。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.proxy=此次操作使用的代理設定。
PixivSharedProxyController.getScheduleUserMeta.POST.body=本次查詢使用的計劃來源、憑據及代理。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.MeUidResponse.field.uid=從採集 Cookie 讀取的 Pixiv 賬戶 ID。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.UserMetaResponse.field.name=Pixiv 返回的作者顯示名。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.UserMetaResponse.field.userId=所查作者的 Pixiv 使用者 ID。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.taskId=已有任務的 ID，須與 expectedStateVersion 同時提供或同時省略。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.useTaskCredential=true 表示使用所選任務的憑據策略。須指定任務和版本，並省略單獨提供的憑據。
parameter.X-User-UUID=多人模式下的 UUID v4 使用者標識，可使用配額初始化返回的 UUID。已有有效使用者 Cookie 時優先使用 Cookie。
