title=Image sorting
ImageClassifierController.settings.GET.summary=Get image sorting settings
ImageClassifierController.settings.GET.description=Reads the default folder, skip-button setting and targets. The serverUrl returned excludes credentials, query and fragment.
ImageClassifierController.settings.GET.success=Image sorting settings.
ImageClassifierController.settings.PUT.summary=Save image sorting settings
ImageClassifierController.settings.PUT.description=Replaces the classifier settings. Supply at most 20 targets with paths and remarks of up to 4096 characters. Leave serverUrl empty or supply an HTTP(S) URL without user info, query or fragment.
ImageClassifierController.settings.PUT.success=Image sorting settings saved.
ImageClassifierController.folders.GET.summary=Browse subdirectories
ImageClassifierController.folders.GET.description=Lists child directories under path and returns the page and total count. offset starts at 0 and limit is 1–1000.
ImageClassifierController.folders.GET.success=Subdirectories.
ImageClassifierController.images.GET.summary=Browse images in a directory
ImageClassifierController.images.GET.description=Lists supported image paths under path and returns the page and total count. offset starts at 0 and limit is 1–1000.
ImageClassifierController.images.GET.success=Images in a directory.
ImageClassifierController.image.GET.summary=Get an image preview
ImageClassifierController.image.GET.description=Pass a file path from images to download its bytes as an application/octet-stream attachment.
ImageClassifierController.image.GET.success=Image preview.
ImageClassifierController.deleteEmpty.DELETE.summary=Delete an empty directory
ImageClassifierController.deleteEmpty.DELETE.description=Only an empty directory can be removed with this request.
ImageClassifierController.deleteEmpty.DELETE.success=Empty directory removed.
ImageClassifierController.move.POST.summary=Move a classified artwork
ImageClassifierController.move.POST.description=Move the artwork images into the target category and record the new location. Source and target must be distinct and cannot contain one another. Check sourceRemoved, recorded and issues for the outcome.
ImageClassifierController.move.POST.success=Classified artwork.
