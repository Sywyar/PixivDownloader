title=訪客邀請
AdminInviteController.accessCheck.GET.summary=檢查邀請管理許可權
AdminInviteController.accessCheck.GET.description=檢查當前會話能否進入訪客邀請管理。
AdminInviteController.accessCheck.GET.success=邀請管理許可權。
AdminInviteController.create.POST.summary=建立訪客邀請
AdminInviteController.create.POST.description=建立邀請並返回 id、邀請碼 code 和可分享的 url。後續管理操作使用 id。
AdminInviteController.create.POST.success=已建立訪客邀請。
AdminInviteController.list.GET.summary=列出訪客邀請
AdminInviteController.list.GET.description=返回邀請摘要列表。需要單個邀請的配置和詳情時，透過其 id 讀取詳情。
AdminInviteController.list.GET.success=訪客邀請。
AdminInviteController.detail.GET.summary=檢視邀請詳情
AdminInviteController.detail.GET.description=返回指定邀請的完整詳情。路徑使用管理 ID，兌換時才使用 code。
AdminInviteController.detail.GET.success=邀請詳情。
AdminInviteController.update.PUT.summary=更新訪客邀請
AdminInviteController.update.PUT.description=修改路徑 ID 對應邀請的設定並返回修改後的詳情；無需重新建立邀請碼。
AdminInviteController.update.PUT.success=已更新訪客邀請。
AdminInviteController.pause.POST.summary=暫停訪客邀請
AdminInviteController.pause.POST.description=暫停指定邀請並保留其 ID，之後可對同一 ID 呼叫 resume 恢復。
AdminInviteController.pause.POST.success=已暫停訪客邀請。
AdminInviteController.resume.POST.summary=恢復訪客邀請
AdminInviteController.resume.POST.description=恢復已暫停的邀請，沿用原邀請碼和原配置。
AdminInviteController.resume.POST.success=已恢復訪客邀請。
AdminInviteController.deleteExpired.DELETE.summary=清除已過期的邀請
AdminInviteController.deleteExpired.DELETE.description=刪除呼叫時已過期的邀請並返回實際刪除數量。
AdminInviteController.deleteExpired.DELETE.success=已清除已過期的邀請。
AdminInviteController.delete.DELETE.summary=刪除訪客邀請
AdminInviteController.delete.DELETE.description=從訪客邀請清單中移除路徑 ID 指定的記錄。
AdminInviteController.delete.DELETE.success=已移除訪客邀請。
AdminInviteController.stats.GET.summary=檢視邀請使用統計
AdminInviteController.stats.GET.description=按小時返回訪問量。days 支援 1、7、30；其他值按 7 天處理。
AdminInviteController.stats.GET.success=邀請使用統計。
InviteRedeemController.redeem.POST.summary=兌換訪客邀請碼
InviteRedeemController.redeem.POST.description=提交 code。成功時設定訪客會話 Cookie 並返回落地頁，後續請求帶回該 Cookie。無效邀請碼返回 401。
InviteRedeemController.redeem.POST.success=訪客邀請碼。
parameter.days=統計覆蓋的天數。
