title=Software updates
UpdateController.check.GET.summary=Check software updates
UpdateController.check.GET.description=Check for available updates. Set force to true to bypass the check cache. It defaults to false.
UpdateController.check.GET.success=Software updates.
UpdateController.last.GET.summary=Get the last update check
UpdateController.last.GET.description=Read the most recent update check. Returns 204 before a result is available.
UpdateController.last.GET.success=Last update check.
UpdateController.download.POST.summary=Start an update download
UpdateController.download.POST.description=Start an update download in the background. The default channel is official. Select nightly for a nightly build. Returns 202 when accepted.
UpdateController.download.POST.success=Update download.
UpdateController.downloadProgress.GET.summary=Get update download progress
UpdateController.downloadProgress.GET.description=Read bytes received, total bytes, completion state and any failure message for the desktop update. Returns 204 if no download exists.
UpdateController.downloadProgress.GET.success=Update download progress.
UpdateController.install.POST.summary=Install a downloaded update
UpdateController.install.POST.description=Launch the downloaded desktop installer and exit the application. Returns started set to true on success.
UpdateController.install.POST.success=Downloaded update.
UpdateApiController.check.GET.summary=Check software updates
UpdateApiController.check.GET.description=Check for available updates. Set force to true to bypass the check cache. It defaults to false.
UpdateApiController.check.GET.success=Software updates.
UpdateApiController.last.GET.summary=Get the last update check
UpdateApiController.last.GET.description=Read the most recent update check. Returns 204 before a result is available.
UpdateApiController.last.GET.success=Last update check.
UpdateApiController.download.POST.summary=Start an update download
UpdateApiController.download.POST.description=Queue an installer download from the official (default) or nightly channel. A 202 response acknowledges the request. Poll progress for completion.
UpdateApiController.download.POST.success=Update download.
UpdateApiController.progress.GET.summary=Get update download progress
UpdateApiController.progress.GET.description=Read received and expected bytes, completion and failure flags, and the installer receipt when available. Returns 204 if no download exists.
UpdateApiController.progress.GET.success=Update download progress.
UpdateApiController.install.POST.summary=Install a downloaded update
UpdateApiController.install.POST.description=Supply the 64-digit hexadecimal SHA-256 from the progress receipt to launch the matching installer on Windows x64 and exit the application. An unsupported platform or stale receipt returns 409.
UpdateApiController.install.POST.success=Downloaded update.
parameter.channel=Installer channel. Defaults to official. Only lowercase official and nightly are accepted. Other values return 400.
parameter.force=Force a fresh run even if earlier results exist.
