title=Maintenance
BackfillController.defaults.GET.summary=Get backfill defaults
BackfillController.defaults.GET.description=Read the default delay, item limit, dry-run mode and network settings for a backfill.
BackfillController.defaults.GET.success=Backfill defaults.
BackfillController.candidates.POST.summary=Count backfill candidates
BackfillController.candidates.POST.description=Count the works that match the submitted backfill options before starting a task.
BackfillController.candidates.POST.success=Number of matching works.
BackfillController.start.POST.summary=Start a backfill task
BackfillController.start.POST.description=Use artworkIds to fill missing metadata for specific illustrations, including authors, tags and series. Count candidates with POST /api/tools/backfill/candidates, preview changes with dryRun and poll Location after 202. One backfill runs at a time. Its Location remains readable for up to one hour after completion. Only the latest 64 terminal results are retained. After expiry, eviction or a server restart, GET /api/tools/backfill/tasks/{id} returns 404.
BackfillController.start.POST.success=Backfill task.
BackfillController.current.GET.summary=Get the current backfill task
BackfillController.current.GET.description=Returns the most recently started backfill, including its final result. Returns 204 before the first run.
BackfillController.current.GET.success=Current backfill task.
BackfillController.status.GET.summary=Get backfill task progress
BackfillController.status.GET.description=One backfill runs at a time. Its Location remains readable for up to one hour after completion. Only the latest 64 terminal results are retained. After expiry, eviction or a server restart, GET /api/tools/backfill/tasks/{id} returns 404.
BackfillController.status.GET.success=Backfill task progress.
BackfillController.cancel.POST.summary=Cancel a backfill task
BackfillController.cancel.POST.description=Requests cancellation for this ID. Cancelling a retained, completed task returns its original final result and leaves the active task running.
BackfillController.cancel.POST.success=Backfill task.
StartupCacheController.status.GET.summary=Get startup cache status
StartupCacheController.status.GET.description=available indicates whether training is installed. task contains its current snapshot.
StartupCacheController.status.GET.success=Startup cache status.
StartupCacheController.start.POST.summary=Start startup cache training
StartupCacheController.start.POST.description=Send the empty JSON object {} to start training. A 202 contains executionId. If training is unavailable, the server returns 503.
StartupCacheController.start.POST.success=Startup cache training.
StartupCacheController.cancel.POST.summary=Cancel startup cache training
StartupCacheController.cancel.POST.description=Pass the executionId from start. A matching run accepts cancellation with 202. A mismatch returns 409.
StartupCacheController.cancel.POST.success=Startup cache training.
MaintenanceController.status.GET.summary=Get maintenance status
MaintenanceController.status.GET.description=Reads enabled and paused flags, the last start and finish times, and the trigger from the local machine.
MaintenanceController.status.GET.success=Maintenance status.
MaintenanceController.run.POST.summary=Run a maintenance task
MaintenanceController.run.POST.description=Triggers local manual maintenance. started says whether a new run began. Disabled maintenance returns 503.
MaintenanceController.run.POST.success=Maintenance task.
