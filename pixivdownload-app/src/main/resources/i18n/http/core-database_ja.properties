title=データベースと移行
DatabaseSettingsController.settings.GET.summary=データベース設定を取得
DatabaseSettingsController.settings.GET.description=編集可能な接続設定を取得します。providers で選択肢を、status で現在と次回起動時の接続先を確認できます。
DatabaseSettingsController.settings.GET.success=データベース設定。
DatabaseSettingsController.providers.GET.summary=データベースプロバイダーの一覧
DatabaseSettingsController.providers.GET.description=インストール済みデータベース提供元の ID と接続項目を取得します。下書きに選択した提供元の ID を使います。
DatabaseSettingsController.providers.GET.success=データベースプロバイダー。
DatabaseSettingsController.status.GET.summary=データベースの接続状態を取得
DatabaseSettingsController.status.GET.description=稼働中と次回起動時の接続を比較します。restartRequired は保存済み設定の反映に再起動が必要なことを示します。
DatabaseSettingsController.status.GET.success=データベースの接続状態。
DatabaseSettingsController.migration.GET.summary=データベースの移行状況を取得
DatabaseSettingsController.migration.GET.description=POST /api/settings/database/migrations 後の移行状態を取得します。受付時点では移行は完了していません。
DatabaseSettingsController.migration.GET.success=データベースの移行状況。
DatabaseSettingsController.check.POST.summary=データベース接続を確認
DatabaseSettingsController.check.POST.description=保存せず下書きの接続をテストします。passwordAction の既定は KEEP です。SET には空でない password が必要で、CLEAR は下書きのパスワードを消去します。
DatabaseSettingsController.check.POST.success=データベース接続。
DatabaseSettingsController.preview.POST.summary=データベース移行をプレビュー
DatabaseSettingsController.preview.POST.description=下書きの移行先と各ストアの計画を確認します。ready、対象、再構築対象を確認後、このプレビューの token を migrations に渡します。
DatabaseSettingsController.preview.POST.success=データベース移行。
DatabaseSettingsController.start.POST.summary=データベース移行タスクを開始
DatabaseSettingsController.start.POST.description=確認済みプレビューの token で移行とプロセス再起動を要求します。202 は移行状態を返します。続きは GET /api/settings/database/migration で確認できます。
DatabaseSettingsController.start.POST.success=データベース移行タスク。
MigrationController.migrate.POST.summary=JSON から SQLite への移行を実行
MigrationController.migrate.POST.description=ローカルから旧 JSON データの移行を同期実行し、完了後に結果を返します。
MigrationController.migrate.POST.success=JSON から SQLite への移行。
MigrationController.migrateWithProgress.GET.summary=旧版 JSON の移行を実行して進捗を受信する
MigrationController.migrateWithProgress.GET.description=ローカルでこの SSE を開くと移行が開始され、進捗が順に配信されます。移行を実行するときに接続してください。
MigrationController.migrateWithProgress.GET.success=JSON から SQLite への移行状況。
