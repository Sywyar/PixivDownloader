title=已下載作品
AuthorController.getAuthors.GET.summary=列出已儲存作品的作者
AuthorController.getAuthors.GET.description=列出當前身份能看到的本地作者。需要搜尋、排序或分頁時使用 /api/authors/paged。
AuthorController.getAuthors.GET.success=已儲存作品的作者。
AuthorController.getPagedAuthors.GET.summary=分頁檢視作者
AuthorController.getPagedAuthors.GET.description=page 從 0 開始，size 限在 1–200。sort 可選 name、artworks、authorId；未知排序按 name 處理。
AuthorController.getPagedAuthors.GET.success=作者。
WorkAssetFileController.getThumbnail.GET.summary=檢視作品分頁縮圖
WorkAssetFileController.getThumbnail.GET.description=按 artworkId 和 page 讀取本地縮圖。cover 選擇封面縮圖，size 選擇請求尺寸。建議使用 GET /api/downloaded/thumbnail/{artworkId}/{page}。GET /api/downloaded/thumbnail-file/{artworkId}/{page} 是別名；兩者對相同的 cover 和 size 採用相同的縮圖處理流程。
WorkAssetFileController.getThumbnail.GET.success=作品分頁縮圖。
WorkAssetFileController.getImage.GET.summary=檢視作品分頁影象
WorkAssetFileController.getImage.GET.description=返回該頁適合顯示的影象。原檔案是 ZIP 時返回縮圖，需要 ZIP 原件時用 rawfile。重新驗證時，將上次回應的 ETag 填入 If-None-Match。僅傳送 If-Modified-Since 時會傳回目前的檔案。
WorkAssetFileController.getImage.GET.success=作品分頁影象。
WorkAssetFileController.getRawFile.GET.summary=下載作品分頁原檔案
WorkAssetFileController.getRawFile.GET.description=讀取本機儲存的分頁檔案，頁碼從 0 開始。保留原格式時優先傳回原始檔（含 ZIP），僅保留轉換格式時傳回可用的本機格式。程式金鑰需要 core:assets.export。重新驗證時，將上次回應的 ETag 填入 If-None-Match。僅傳送 If-Modified-Since 時會傳回目前的檔案。
WorkAssetFileController.getRawFile.GET.success=作品分頁原檔案。
DownloadedWorkController.getDownloaded.GET.summary=檢視已下載作品詳情
DownloadedWorkController.getDownloaded.GET.description=按作品 ID 查閱本地下載登記。verifyFiles 預設為 false，傳 true 時同時核對檔案。找不到可用登記時返回 400。 程式金鑰請使用 /api/library/artworks/{artworkId}。對應的 /api/downloaded 路徑採用本機存取政策。
DownloadedWorkController.getDownloaded.GET.success=已下載作品詳情。
DownloadedWorkController.recoverMetadata.POST.summary=用已知資料補齊作品欄位
DownloadedWorkController.recoverMetadata.POST.description=請提供至少一個可用欄位。系統會保留既有值；新登錄需要頁數及所有檔案。要從 Pixiv 取得中繼資料、標籤和系列，請使用 POST /api/tools/backfill/tasks。 程式金鑰請使用 /api/library/artworks/{artworkId}/recover-metadata。對應的 /api/downloaded 路徑採用本機存取政策。 新登錄要求每頁恰有一張可用預設檔名找到的非空圖片；同頁若有多個候選檔案則拒絕登錄。逐頁記錄本機檔案的格式，來源原圖的格式維持未知。預設目錄不得與其他作品目錄或唯讀匯入檔案重疊。
DownloadedWorkController.recoverMetadata.POST.success=已恢復作品後設資料。
DownloadedWorkController.getBatchArtworks.POST.summary=查詢多幅作品的下載記錄
DownloadedWorkController.getBatchArtworks.POST.description=按提交的 ID 順序返回已登記且未刪除的作品，忽略未知 ID。includeDeleted 為 true 時，另在 deletedArtworkIds 中返回已刪除的 ID。
DownloadedWorkController.getBatchArtworks.POST.success=多幅作品的下載記錄。
DownloadedWorkController.getStatistics.GET.summary=檢視作品下載統計
DownloadedWorkController.getStatistics.GET.description=libraryArtworks 和 libraryImages 包含匯入並排除已刪除作品。管理員的 totalArtworks 和 totalImages 為累計下載量，受邀訪客只會看到自己可見的收藏庫數量。
DownloadedWorkController.getStatistics.GET.success=作品下載統計。
DownloadedWorkController.moveArtWork.POST.summary=作品移動登記（已退役）
DownloadedWorkController.moveArtWork.POST.description=通過原有權限檢查後傳回空的 HTTP 410 回應。此介面不再修改檔案或作品紀錄。
DownloadedWorkController.moveArtWork.POST.response.410=通過原有權限檢查後傳回空的 HTTP 410 回應。此介面不再修改檔案或作品紀錄。
DownloadedWorkController.getHistory.GET.summary=列出作品下載歷史
DownloadedWorkController.getHistory.GET.description=返回可見的已下載作品 ID 列表。按頁讀取作品記錄請使用 history/paged。
DownloadedWorkController.getHistory.GET.success=作品下載歷史。
DownloadedWorkController.getPagedHistory.GET.summary=分頁檢視作品下載歷史
DownloadedWorkController.getPagedHistory.GET.description=分頁返回下載記錄。sort=author_id 按作者 ID 排序，其他值按下載時間排序。
DownloadedWorkController.getPagedHistory.GET.success=作品下載歷史。
