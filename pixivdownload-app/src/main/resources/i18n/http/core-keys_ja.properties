title=プログラムキー
ApiReferenceController.document.GET.summary=HTTP API リファレンスを読む
ApiReferenceController.document.GET.description=現在読み込まれているエンドポイントの OpenAPI 3 ドキュメントを返します。プラグインの読み込みや権限の宣言に合わせて更新されます。管理者セッション、またはこの権限を持つプログラムキーで読み取れます。未認証のリクエストには、必要な権限を示す 401 が返されます。 サーバーは言語ごとにカタログをキャッシュし、ルート、提供元、インスタンスのアクセス状態が変わると再生成します。アクセス権は毎回確認し、レスポンスには private, no-store を指定します。
ApiReferenceController.document.GET.success=OpenAPI ドキュメント。
ApiReferenceController.probe.HEAD.summary=API リファレンスの閲覧権限を確認
ApiReferenceController.probe.HEAD.description=GET と同じ認証情報で API リファレンスを閲覧できるか確認します。レスポンスヘッダーのみを返します。
ApiReferenceController.probe.HEAD.success=API リファレンスを閲覧できます。
ProgramKeysController.list.GET.summary=プログラムキーの一覧
ProgramKeysController.list.GET.description=各キーの UUID、リビジョン、全権限、送信元ネットワーク制限、通信ポリシーを取得します。秘密値は作成時のみ返ります。
ProgramKeysController.list.GET.success=プログラムキー。
ProgramKeysController.desktopList.GET.summary=デスクトップ用のキー概要の一覧
ProgramKeysController.desktopList.GET.description=デスクトップ用キー一覧に ID、リビジョン、権限数を返します。全権限は ID を指定して個別に取得できます。
ProgramKeysController.desktopList.GET.success=デスクトップ用のキー概要。
ProgramKeysController.desktopKey.GET.summary=プログラムキーのポリシーを取得
ProgramKeysController.desktopKey.GET.description=UUID でキーの全権限と送信元ネットワークのポリシーを取得します。編集・失効には返された revision を使います。
ProgramKeysController.desktopKey.GET.success=プログラムキーのポリシー。
ProgramKeysController.desktopPermissions.GET.summary=権限の表示名の一覧
ProgramKeysController.desktopPermissions.GET.description=権限 ID、宣言元、各言語の表示名を取得します。キーの作成・編集時は選んだ ID を permissions に指定します。
ProgramKeysController.desktopPermissions.GET.success=権限の表示名。
ProgramKeysController.permissions.GET.summary=付与できるプログラム権限の一覧
ProgramKeysController.permissions.GET.description=管理者セッションで、付与できる権限 ID、所有者、対象の HTTP メソッドとパスを取得します。キーの作成・編集時には必要な ID を permissions に指定します。プログラムキーではこの一覧を取得できません。各キーに付与された権限はそのポリシーに記録されます。
ProgramKeysController.permissions.GET.success=付与できるプログラム権限。
ProgramKeysController.createFromGui.POST.summary=プログラムキーを作成
ProgramKeysController.createFromGui.POST.description=キーを作成し、一度だけ返される秘密値を保存します。permissions は権限一覧から選びます。anyIp が true のとき networks は空、それ以外は IP アドレスまたは CIDR を 1 件以上指定します。
ProgramKeysController.createFromGui.POST.success=プログラムキーを作成しました。
