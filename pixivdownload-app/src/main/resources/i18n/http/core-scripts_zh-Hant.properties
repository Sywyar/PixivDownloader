title=使用者指令碼
ScriptController.listScripts.GET.summary=列出可用使用者指令碼
ScriptController.listScripts.GET.description=列出已釋出指令碼的 id、本地化名稱、說明和版本。使用 id 構造安裝或原始碼地址。
ScriptController.listScripts.GET.success=可用使用者指令碼。
ScriptController.installScript.GET.summary=下載可安裝的使用者指令碼
ScriptController.installScript.GET.description=返回可安裝的使用者指令碼。在 .user.js 或 /install 路徑上加 raw=true 可按純文字檢視。
ScriptController.installScript.GET.success=可安裝的使用者指令碼。
ScriptController.viewScriptSource.GET.summary=檢視使用者指令碼原始碼
ScriptController.viewScriptSource.GET.description=讀取原始碼時必須傳 raw=true。直接訪問 /api/scripts/{id} 而未請求原文會得到 404。
ScriptController.viewScriptSource.GET.success=使用者指令碼原始碼。
parameter.raw=請求使用者指令碼原文。
parameter.id=使用者指令碼目錄中的標識。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.description=當前例項提供的使用者指令碼列表。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.field.scripts=當前可安裝的指令碼及各自的標識、名稱、說明和版本。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.field.detectedHost=從請求讀取的伺服器主機名，用於生成指令碼連線目標。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.ScriptItem.field.id=用於安裝或檢視原始碼路徑的指令碼 ID。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.ScriptItem.field.displayName=當前語言的指令碼名稱。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.ScriptItem.field.description=當前語言的指令碼用途說明。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.ScriptItem.field.version=可安裝指令碼宣告的版本。
description=取得執行個體提供的使用者腳本及安裝資訊。
