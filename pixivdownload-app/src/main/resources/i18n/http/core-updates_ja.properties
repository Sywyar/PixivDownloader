UpdateApiController.progress.GET.description=受信済み・予定バイト数、完了・失敗状態、利用可能であればインストーラーの受領情報を取得します。ダウンロードがなければ 204 を返します。
UpdateApiController.progress.GET.success=更新パッケージの進捗。
UpdateApiController.install.POST.summary=ダウンロード済みの更新をインストール
UpdateApiController.install.POST.description=進捗応答にある 64 桁の 16 進 SHA-256 を指定します。Windows x64 で該当インストーラーを起動しアプリを終了します。非対応環境または古い受領情報は 409 です。
UpdateApiController.install.POST.success=ダウンロード済みの更新。
parameter.channel=インストーラーのチャネル。既定は official。小文字の official と nightly のみ有効で、他の値は 400 になります。
parameter.force=以前の結果があっても再実行します。
