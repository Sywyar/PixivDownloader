title=ソフトウェア更新
UpdateController.check.GET.summary=ソフトウェア更新を確認
UpdateController.check.GET.description=更新の有無を確認します。force は既定で false です。true にするとキャッシュを使わず確認します。
UpdateController.check.GET.success=ソフトウェア更新。
UpdateController.last.GET.summary=前回の更新確認結果を取得
UpdateController.last.GET.description=直近の更新チェック結果を取得します。まだ結果がない場合は 204 を返します。
UpdateController.last.GET.success=前回の更新確認結果。
UpdateController.download.POST.summary=更新パッケージのダウンロードを開始
UpdateController.download.POST.description=更新のダウンロードをバックグラウンドで開始します。既定の official のほか nightly を選択できます。受理されると 202 を返します。
UpdateController.download.POST.success=更新パッケージのダウンロード。
UpdateController.downloadProgress.GET.summary=更新パッケージの進捗を取得
UpdateController.downloadProgress.GET.description=デスクトップ更新の受信済み・総バイト数、完了状態、失敗時のメッセージを取得します。ダウンロードがなければ 204 を返します。
UpdateController.downloadProgress.GET.success=更新パッケージの進捗。
UpdateController.install.POST.summary=ダウンロード済みの更新をインストール
UpdateController.install.POST.description=ダウンロード済みのインストーラーを起動し、現在のアプリを終了します。成功時は started が true になります。
UpdateController.install.POST.success=ダウンロード済みの更新。
