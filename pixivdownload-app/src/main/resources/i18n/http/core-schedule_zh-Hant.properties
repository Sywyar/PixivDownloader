title=計劃任務
ScheduleController.sources.GET.summary=列出計劃任務來源
ScheduleController.sources.GET.description=選擇 sourceType，保留同一項目的 activationToken。解析 inputSchemaJson 可取得獨立的 JSON Schema 及 examples。離線文件在 x-schedule-sources[sourceType].inputSchemaJson 提供可解析的文字；null 表示沒有可用宣告。來源版本變更後請重新查詢此端點取得權杖。 兩種表示來自同一份來源宣告。離線驗證時解析 x-schedule-sources[sourceType].inputSchemaJson，以整段 JSON 為根。驗證批次請求或產生 SDK 時，請以整份 OpenAPI 解析對應的 ScheduleDefinition 元件。
ScheduleController.sources.GET.success=計劃任務來源。
ScheduleController.list.GET.summary=列出計劃任務
ScheduleController.list.GET.description=傳回已儲存的工作及目前狀態。程式金鑰只能查到對來源外掛具備 schedule.manage 權限的工作。 排程資料庫無法使用時也會回傳空陣列。
ScheduleController.list.GET.success=計劃任務。
ScheduleController.get.GET.summary=檢視計劃任務詳情
ScheduleController.get.GET.description=傳回工作定義、觸發條件和最新狀態。編輯前請記下 stateVersion。paramsJson 為來源定義，憑證需另外綁定。
ScheduleController.get.GET.success=計劃任務詳情。
ScheduleController.get.GET.response.400=此任務 ID 不存在（schedule.error.not-found）。
ScheduleController.get.GET.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.queue.GET.summary=列出最近一輪執行的佇列
ScheduleController.queue.GET.description=傳回最近一次執行找到的作品及各項結果。尚無執行紀錄時 items 為空。truncated 表示佇列或即時狀態只顯示一部分。
ScheduleController.queue.GET.success=最近一輪執行的佇列。
ScheduleController.queue.GET.response.400=此任務 ID 不存在（schedule.error.not-found）。
ScheduleController.queue.GET.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.create.POST.summary=建立計劃任務
ScheduleController.create.POST.description=先從 GET /api/schedule/sources 取得同一來源的結構和啟用權杖。提交序列化的 definitionJson，並依 triggerKind 填入 intervalMinutes 或 cronExpr。建立時省略 expectedStateVersion。回應包含工作 ID。 建立成功時排程已啟用。需暫存時，請將首次觸發排在未來，然後呼叫 POST /api/schedule/tasks/{id}/enabled?enabled=false 停用。 權限見來源的 schedulePermission。建立時檢查提交的來源。權限不足或來源不可見時回傳 403。已獲授權的來源權杖過期時回傳 409（schedule.error.source-publication-changed），請重新讀取來源清單。
ScheduleController.create.POST.success=已建立計劃任務。
ScheduleController.create.POST.response.400=必要欄位或 JSON 無效、建立時帶入 expectedStateVersion、來源無法使用、定義未通過來源驗證、觸發規則無效或任務數已達上限。來源拒絕定義時 code 為 schedule.error.definition-invalid。
ScheduleController.create.POST.response.409=activationToken 已過期（schedule.error.source-publication-changed），或儲存期間來源已變更（schedule.error.concurrent-change）。請重新讀取來源清單。
ScheduleController.create.POST.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.update.PUT.summary=更新計劃任務
ScheduleController.update.PUT.description=提交完整定義，將開始編輯時讀到的 stateVersion 填入 expectedStateVersion。工作須閒置，來源須屬原外掛。儲存後清除舊檢查點與待處理項目。版本衝突時重新讀取工作。 權限見來源的 schedulePermission。建立時檢查提交的來源，更新時也檢查既有工作的來源。權限不足或來源不可見時回傳 403。已獲授權的來源權杖過期時回傳 409（schedule.error.source-publication-changed），請重新讀取來源清單。
ScheduleController.update.PUT.success=已更新計劃任務。
ScheduleController.update.PUT.response.400=欄位、定義或觸發規則無效、缺少 expectedStateVersion，或任務不存在、執行中或排隊中。來源必須可用、屬於原外掛，且與已繫結的憑證策略相容。
ScheduleController.update.PUT.response.409=開始編輯後任務版本已變更（schedule.error.concurrent-change），或來源已重新發佈（schedule.error.source-publication-changed）。請重新讀取任務及來源清單後再編輯。
ScheduleController.update.PUT.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.delete.DELETE.summary=刪除計劃任務
ScheduleController.delete.DELETE.description=刪除閒置工作、其待處理項目和最近的執行佇列。
ScheduleController.delete.DELETE.success=已移除計劃任務。
ScheduleController.delete.DELETE.response.400=任務不存在、正在執行或排隊，或寫入時狀態已變更。對應代碼為 schedule.error.not-found、schedule.error.busy 和 schedule.error.concurrent-change。
ScheduleController.delete.DELETE.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.setEnabled.POST.summary=設定計劃任務啟用狀態
ScheduleController.setEnabled.POST.description=工作閒置時，以查詢參數 enabled=true 或 false 開關排程。停用會保留工作定義與狀態。
ScheduleController.setEnabled.POST.success=已儲存計劃任務啟用狀態。
ScheduleController.setEnabled.POST.response.400=任務不存在、正在執行或排隊，或寫入時狀態已變更。對應代碼為 schedule.error.not-found、schedule.error.busy 和 schedule.error.concurrent-change。
ScheduleController.setEnabled.POST.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.bindCredential.POST.summary=繫結任務採集憑據
ScheduleController.bindCredential.POST.description=透過 X-Acquisition-Credential 標頭傳送擷取憑證，本文帶入目前來源的 activationToken。憑證策略驗證後綁定，回應傳回綁定狀態。
ScheduleController.bindCredential.POST.success=已繫結任務採集憑據。
ScheduleController.bindCredential.POST.response.400=任務不存在或忙碌、憑證標頭缺失、空白、無效、與原值相同或無法取代固定繫結，或來源無法驗證憑證。無效憑證為 schedule.error.credential-invalid，暫時無法驗證為 schedule.error.credential-probe-failed。
ScheduleController.bindCredential.POST.response.409=驗證憑證期間任務或來源已變更。請重新讀取任務和目前的 activationToken。
ScheduleController.bindCredential.POST.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.revokeCredential.DELETE.summary=撤銷任務憑據繫結
ScheduleController.revokeCredential.DELETE.description=解除此工作儲存的擷取憑證綁定。需要帳號的來源須重新綁定有效憑證才能執行。
ScheduleController.revokeCredential.DELETE.success=已撤銷任務憑據繫結。
ScheduleController.revokeCredential.DELETE.response.400=任務不存在或忙碌、憑證策略無法使用，或固定繫結拒絕解除（schedule.error.credential-fixed）。
ScheduleController.revokeCredential.DELETE.response.409=寫入時任務版本或憑證策略已變更。請重新讀取任務。
ScheduleController.revokeCredential.DELETE.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.applyCredentialPolicyAction.POST.summary=執行憑據策略操作
ScheduleController.applyCredentialPolicyAction.POST.description=依任務 credentialPolicy 的 ownerPluginId、policyId、publicationId 和 accountKey 提交。解析同一投影的 accountActionsSchemaJson，按所選範例填寫 actionId 和 parameters；動作影響該帳號的符合條件任務。
ScheduleController.applyCredentialPolicyAction.POST.success=憑據策略操作。
ScheduleController.applyCredentialPolicyAction.POST.response.400=請求欄位無效、此帳號沒有任務，或策略拒絕動作、參數或執行結果。代碼包括 schedule.error.credential-account-not-found 與 schedule.error.credential-account-action-unsupported。
ScheduleController.applyCredentialPolicyAction.POST.response.409=策略的 publicationId、擁有者或帳號下的任務狀態已變更。請重新讀取策略及相關任務。
ScheduleController.applyCredentialPolicyAction.POST.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.updateProxy.POST.summary=設定任務專用代理
ScheduleController.updateProxy.POST.description=工作閒置時傳入 host:port（例如 127.0.0.1:7890）以覆寫代理。傳入 null 或空字串可恢復全域設定。
ScheduleController.updateProxy.POST.success=已儲存任務專用代理。
ScheduleController.updateProxy.POST.response.400=代理伺服器不符合 host:port（schedule.error.proxy-invalid），或任務不存在、忙碌或狀態已變更。
ScheduleController.updateProxy.POST.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.runOnce.POST.summary=執行單次計劃任務
ScheduleController.runOnce.POST.description=要求在背景執行一次已啟用、閒置且未暫停的工作。傳回 success 後可查詢工作的 queue 查看各作品進度。
ScheduleController.runOnce.POST.success=單次計劃任務。
ScheduleController.runOnce.POST.response.400=任務不存在、執行中、排隊中、已停用（schedule.error.run-disabled）或已暫停（schedule.error.run-suspended）。
ScheduleController.runOnce.POST.response.429=背景執行器拒絕接收本次執行（task.queue.full）。請稍後重試。
ScheduleController.runOnce.POST.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.pause.POST.summary=暫停當前任務執行
ScheduleController.pause.POST.description=暫停執行中或佇列中的工作，並要求停止本次執行。要阻止閒置工作自動啟動，請使用 enabled=false。
ScheduleController.pause.POST.success=已暫停當前任務執行。
ScheduleController.pause.POST.response.400=任務不存在、已暫停、目前沒有可中斷的執行（schedule.error.pause-idle），或寫入時狀態已變更。
ScheduleController.pause.POST.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.resolvePending.POST.summary=處理待處理作品
ScheduleController.resolvePending.POST.description=為因 USER_ACTION_REQUIRED 暫停的閒置工作提交決定。讀取工作的 stateVersion 與 pending 中的 workType、workId，取得更新後的工作再呼叫 resume。
ScheduleController.resolvePending.POST.success=待處理作品。
ScheduleController.resolvePending.POST.response.400=任務不存在或忙碌、請求欄位無效，或任務版本、暫停原因、待處理作品已變更（schedule.error.concurrent-change）。請重新讀取任務和待處理清單。 遇到 DOWNLOAD_PATH_ACTION_REQUIRED 時可選 TRUNCATE、DEFAULT_NAME 或 CANCEL。其他值會回傳 400，欄位為 /userAction。作品仍待確認，可直接修正後重送。
ScheduleController.resolvePending.POST.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.resume.POST.summary=恢復計劃任務
ScheduleController.resume.POST.description=清除 MANUAL 或 USER_ACTION_REQUIRED 暫停狀態。已啟用的工作會立即嘗試執行，停用的工作只解除暫停。
ScheduleController.resume.POST.success=已恢復計劃任務。
ScheduleController.resume.POST.response.400=任務不存在、忙碌、並非因 MANUAL 或 USER_ACTION_REQUIRED 暫停（schedule.error.resume-not-paused），或狀態已變更。
ScheduleController.resume.POST.response.429=背景執行器拒絕接收本次執行（task.queue.full）。請稍後重試。
ScheduleController.resume.POST.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.pending.GET.summary=列出待重試作品
ScheduleController.pending.GET.description=列出已儲存的待重試或待人工決定作品。使用 workType 與 workId 識別項目，讀取 reasonCode、reasonDetailJson 和嘗試次數。
ScheduleController.pending.GET.success=待重試作品。
ScheduleController.pending.GET.response.400=此任務 ID 不存在（schedule.error.not-found）。
ScheduleController.pending.GET.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
ScheduleController.clearPending.DELETE.summary=清除需人工處理的條目
ScheduleController.clearPending.DELETE.description=工作閒置時，用 pending 傳回的 workType 和 workId 移除一筆待處理紀錄，後續不會從該紀錄重試。
ScheduleController.clearPending.DELETE.success=已清除需人工處理的條目。
ScheduleController.clearPending.DELETE.response.400=作品識別資訊無效、任務不存在或忙碌，或清除時記錄已變更（schedule.error.concurrent-change）。
ScheduleController.clearPending.DELETE.response.503=排程資料庫無法使用（DATABASE_UNAVAILABLE）。
parameter.X-Acquisition-Credential=用於存取作品來源的擷取憑證，最長 16384 個字元。程式金鑰另以 Authorization 傳送。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.title=執行計劃和下載來源
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.name=顯示名稱。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.sourceType=從 GET /api/schedule/sources 的選定項目複製 sourceType，並使用同一項目的 activationToken。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.activationToken=選定來源目前發布的 activationToken。重新發布後須重新讀取來源目錄和輸入結構。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.definitionJson=從 OpenAPI 的 x-schedule-sources[sourceType].inputSchemaJson 讀取 JSON Schema，以其中的 examples[0] 建立定義物件，再序列化為此欄位的字串。上限為 1 MiB（UTF-8），請勿寫入憑證。向 GET /api/schedule/sources 取得目前的 activationToken。 離線驗證時取出完整的 schema 作為驗證根，保留 $id 和 $defs。同一份內容在手動批次中傳物件，在排程任務中傳 JSON 字串。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.expectedStateVersion=建立任務時省略或傳入 null。編輯時傳入從該任務讀取的 stateVersion。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.triggerKind=按固定間隔執行傳 interval，按 Cron 執行傳 cron。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.intervalMinutes=triggerKind=interval 時必填正整數，單位為分鐘。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.cronExpr=triggerKind=cron 時必填 Spring Cron 運算式。例如 0 0 9 * * * 代表伺服器當地時間每日 09:00。 GET /api/schedule/sources 的 timeZone 是排程時區；儲存後可讀取任務的 nextRunTime（Unix 毫秒）。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.description=設定執行時間，並選擇提供下載內容的來源。
ScheduleController.update.PUT.body=執行計劃和下載來源
ScheduleController.create.POST.body=執行計劃和下載來源
schema.top.sywyar.pixivdownload.schedule.dto.ProxyOverrideRequest.title=本次執行的代理覆蓋設定
schema.top.sywyar.pixivdownload.schedule.dto.ProxyOverrideRequest.field.proxy=可選的 host:port，例如 127.0.0.1:7890。空值使用全域代理。
ScheduleController.updateProxy.POST.body=本次執行的代理覆蓋設定
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.title=待處理作品的處理決定
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.field.expectedStateVersion=呼叫方讀取到的任務狀態版本。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.field.workType=workId 對應的作品型別。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.field.workId=與 workType 配對的來源作品 ID，請原樣傳入字串。
ScheduleController.resolvePending.POST.body=待處理作品的處理決定
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialBindRequest.title=計劃來源的憑據繫結
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialBindRequest.field.activationToken=當前已釋出來源返回的啟用令牌。
ScheduleController.bindCredential.POST.body=計劃來源的憑據繫結
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialPolicyActionRequest.title=憑據策略操作
ScheduleController.applyCredentialPolicyAction.POST.body=憑據策略操作
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.title=要移出待處理列表的作品
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.field.workType=workId 對應的作品型別。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.field.workId=與 workType 配對的來源作品 ID，請原樣傳入字串。
ScheduleController.clearPending.DELETE.body=要移出待處理列表的作品
parameter.id=計劃任務 ID。
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.description=計劃來源當前的憑據繫結狀態。
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.description=任務的執行計劃、來源和執行狀態，憑據原文不會返回。
schema.top.sywyar.pixivdownload.plugin.api.schedule.source.ScheduledTaskPresentation.description=來源外掛缺席時仍可檢視的任務資訊。
schema.top.sywyar.pixivdownload.schedule.dto.ProxyOverrideRequest.description=為此計劃任務設定或清除 HTTP 代理。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.description=對指定任務版本中的待處理作品提交一次處理決定。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialBindRequest.description=繫結憑據策略所使用的來源釋出標識。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialPolicyActionRequest.description=當前憑據策略支援的賬戶級操作。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleQueueView.description=計劃任務最近一輪執行的佇列。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleQueueView.Item.description=佇列條目，由 workType 與 workId 共同標識。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingView.description=等待重試或需要管理員處理的計劃作品。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.description=當前程序中可用的計劃下載來源。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.description=用作品型別和 ID 指定要移除的待重試記錄。
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.id=持久任務標識
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.enabled=任務的啟用開關，與執行態和掛起態正交
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.ownerPluginId=策略所屬外掛標識；未繫結時可為空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.policyId=策略標識；未繫結時可為空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.accountKey=非敏感賬號身份；未繫結時可為空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.bound=是否存在持久憑證繫結；策略缺席時仍可為真
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.available=當前精確策略 publication 是否可用
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.publicationId=當前 publication 標識；不可用時為空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.statusCode=策略提供的安全狀態碼；無狀態時為空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.acknowledgedEventTime=已確認事件的時間戳（毫秒）；沒有確認時為空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.name=使用者設定的任務名稱
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.sourceType=來源貢獻的穩定型別
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.sourceOwnerPluginId=來源所屬外掛標識
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.definitionSchema=來源定義的 Schema 標識
