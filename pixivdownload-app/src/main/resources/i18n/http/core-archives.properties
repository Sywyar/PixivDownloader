title=下载归档
ArchiveController.initQuota.POST.summary=初始化下载配额
ArchiveController.initQuota.POST.description=读取当前用量和重置倒计时。多人配额启用时，首次请求会设置用户 UUID Cookie；随后打包时应保留它。
ArchiveController.initQuota.POST.success=已初始化下载配额。
ArchiveController.triggerPack.POST.summary=打包当前配额身份已下载的目录
ArchiveController.triggerPack.POST.description=打包当前配额身份已下载的目录。先调用 POST /api/quota/init 并带回 Cookie；没有可打包目录时返回 204，超过频率限制时返回 429。
ArchiveController.triggerPack.POST.success=作品打包任务。
ArchiveController.triggerAdminPack.POST.summary=提交作品打包任务
ArchiveController.triggerAdminPack.POST.description=提交 artworkIds。服务端跳过未登记或目录不存在的作品，对剩余目录去重后打包；全部跳过时返回 204，否则返回 token 和有效秒数。
ArchiveController.triggerAdminPack.POST.success=作品打包任务。
ArchiveController.listAdminArchives.GET.summary=列出作品归档
ArchiveController.listAdminArchives.GET.description=列出管理员打包记录，从返回的 token 查询状态或下载归档。
ArchiveController.listAdminArchives.GET.success=作品归档。
ArchiveController.archiveStatus.GET.summary=查看打包进度
ArchiveController.archiveStatus.GET.description=使用打包返回的 token 查询状态。状态为 ready 时再请求 /api/archive/download/{token}。 令牌未知或已过期时返回 200 和 {"status":"expired"}，省略 token、expireSeconds。 ZIP 就绪后可以下载，包括删源失败或部分完成的情况。通过 sourceDeletion 独立查看删源结果和已提交的作品数。
ArchiveController.archiveStatus.GET.success=打包进度。
ArchiveController.downloadArchive.GET.summary=下载作品归档文件
ArchiveController.downloadArchive.GET.description=返回 ZIP 附件。准备中返回 202；token 已失效返回 410，已就绪但文件缺失返回 404。
ArchiveController.downloadArchive.GET.success=作品归档文件。
parameter.token=创建操作或订阅时返回的令牌。
