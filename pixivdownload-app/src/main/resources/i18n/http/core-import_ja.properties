title=ローカルファイルの取り込み
LocalImportController.presets.GET.summary=取り込みプリセットの一覧
LocalImportController.presets.GET.description=保存済みのプリセットを選び、その `template` を `templates` 配列に追加します。`POST /api/local-import/previews` で一致するファイルをプレビューできます。
LocalImportController.presets.GET.success=取り込みプリセット。
LocalImportController.scan.POST.summary=ローカル作品のスキャンをプレビュー
LocalImportController.scan.POST.description=パステンプレートと選択作品でスキャンを開始し、202 で状態を返します。インポートの前に previews/{id}/items で候補を確認します。
LocalImportController.scan.POST.success=ローカル作品のスキャン。
LocalImportController.status.GET.summary=スキャンまたは取り込みの状況を取得
LocalImportController.status.GET.description=プレビューまたはタスク UUID でスキャン、インポート、取消の状態を取得します。各項目は同じ ID の items で取得します。 登録後は結果の作品 ID を POST /api/tools/backfill/candidates と POST /api/tools/backfill/tasks に渡して、タイトル、作者、タグ、シリーズを補完できます。
LocalImportController.status.GET.success=スキャンまたは取り込みの状況。
LocalImportController.items.GET.summary=スキャンまたは取り込みの項目をページ単位で取得
LocalImportController.items.GET.description=作品ごとの一致ファイルと処理結果を取得します。offset は 0 から、limit は 1～100、既定 20 です。
LocalImportController.items.GET.success=スキャンまたは取り込みの項目。
LocalImportController.start.POST.summary=ローカル作品の取り込みを開始
LocalImportController.start.POST.description=確認した previewId でバックグラウンドインポートを開始します。202 後は返されたタスクで状態と items を取得します。 登録後は結果の作品 ID を POST /api/tools/backfill/candidates と POST /api/tools/backfill/tasks に渡して、タイトル、作者、タグ、シリーズを補完できます。
LocalImportController.start.POST.success=ローカル作品の取り込み。
LocalImportController.cancel.POST.summary=スキャンまたは取り込みタスクをキャンセル
LocalImportController.cancel.POST.description=指定 UUID のスキャンまたはインポートを取り消すよう要求し、その状態を返します。
LocalImportController.cancel.POST.success=スキャンまたは取り込みタスク。
FileImportToolController.tools.GET.summary=ファイル取り込みツールの一覧
FileImportToolController.tools.GET.description=利用できるファイルインポートツールを取得します。以降の要求には選択した identity を generation、publication ごと渡してください。
FileImportToolController.tools.GET.success=ファイル取り込みツール。
