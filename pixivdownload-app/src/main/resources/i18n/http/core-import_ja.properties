FileImportToolController.inspect.POST.description=identity、記録ファイルまたは分割フォルダーの絶対パス recordFile、sourceRoot からプレビューと実行用 token を取得します。
FileImportToolController.inspect.POST.success=ファイルの取り込み内容。
FileImportToolController.start.POST.summary=ファイル取り込みタスクを開始
FileImportToolController.start.POST.description=同じツールの identity とプレビューの token で実行します。requiresCredential の場合は credential を渡します。202 はタスク状態を返します。
FileImportToolController.start.POST.success=ファイル取り込みタスク。
FileImportToolController.status.GET.summary=実行中のファイル取り込み状況を取得
FileImportToolController.status.GET.description=指定したツールの identity で現在のインポート実行を確認します。
FileImportToolController.status.GET.success=実行中のファイル取り込み状況。
FileImportToolController.cancel.POST.summary=実行中のファイル取り込みをキャンセル
FileImportToolController.cancel.POST.description=同じツールの identity と executionId を送り、取消が受理されると最新状態を取得します。
FileImportToolController.cancel.POST.success=実行中のファイル取り込み。
FileImportToolController.acknowledge.POST.summary=ファイル取り込みの完了通知を確認
FileImportToolController.acknowledge.POST.description=指定した identity と completionId に一致する保留中の完了記録を確認済みにします。
FileImportToolController.acknowledge.POST.success=ファイル取り込みの完了通知。
