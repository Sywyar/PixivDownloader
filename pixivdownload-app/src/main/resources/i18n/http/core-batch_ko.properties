title=수동 배치
ManualBatchController.create.POST.summary=수동 다운로드 배치 시작
ManualBatchController.create.POST.description=활성 소스의 정의로 백그라운드 다운로드 배치를 시작합니다.
ManualBatchController.create.POST.details=`GET /api/schedule/sources`의 같은 항목에서 `sourceType`, `activationToken`, `inputSchemaJson`을 읽고 해당 스키마에 맞는 JSON 객체를 `definition`에 넣습니다. 프로그램 키로 목록을 읽으려면 `core:schedule.sources.read`, 배치를 만들려면 `core:batches.create`와 소스 플러그인의 `batches.execute`, 작품을 처리하려면 해당 실행 플러그인의 `batches.execute`가 필요합니다. 요청 본문은 최대 8 MiB, 직렬화한 정의는 최대 1 MiB입니다. 수집 자격 증명은 요청 헤더로 전달합니다.\n\n\
    소스는 배치를 만들기 전에 `definition`을 검증합니다. 정의가 유효하지 않으면 `400 INVALID_TOOL_REQUEST`를 반환합니다. 이때 배치는 생성되지 않으며 `Location` 헤더도 없습니다. `field`(예: `/definition`)와 `reason`을 확인해 정의를 수정한 뒤 다시 제출하세요.\n\n\
    `202` 응답에는 배치 `id`가 들어 있습니다. `Location`을 `GET`으로 조회해 `state`와 `code`를 확인하고 그 아래 `/items`에서 작품별 결과를 페이지 단위로 조회합니다. 프로그램은 배치를 만든 키와 `core:batches.read`를 사용합니다. 접수 후 자격 증명 연결, 작품 탐색 또는 처리 중 오류가 발생하면 배치의 `state`와 `code`에서 결과를 확인할 수 있습니다. 소스가 다시 게시되면 배치가 보류되므로 최신 목록 항목으로 새 배치를 만드세요. 배치가 접수된 뒤에는 백그라운드에서 이번 계획이 선택한 실행기의 `batches.execute` 권한을 검사합니다. 조회 결과의 `code`가 `auth.program.forbidden`이면 같은 응답의 `programPermission`에서 확인된 누락 권한 ID를 읽으세요.\n\n\
    프로세스당 수동 배치는 하나이며 서로 다른 작품 5,000개와 항목 용량 64 MiB가 한도입니다. 어느 하나라도 초과하면 `batch.work.capacity-exceeded`가 기록됩니다. 일시 정지하거나 취소한 뒤에는 해당 실행이 멈출 때까지 기다리세요. `resume`은 완료하거나 건너뛴 항목을 유지하면서 소스를 다시 검색하고, `retry`는 이미 발견한 실패 또는 일시 정지 항목만 재시도합니다. 유휴 배치 기록을 삭제한 뒤 다음 배치를 만들 수 있습니다. 프로세스가 종료되면 배치 기록은 사라지고 저장된 파일과 라이브러리 기록은 남습니다.
ManualBatchController.create.POST.success=배치가 접수되었습니다. 배치를 만든 키와 `core:batches.read` 권한으로 `Location`에 GET 요청을 보내 `state`와 `code`를 확인하세요. 실행 권한이 부족하면 `programPermission`에서 권한 ID를 읽습니다.
ManualBatchController.create.POST.response.400=JSON, 이름, 소스, 활성화 토큰, 정의, 프록시 또는 자격 증명 헤더가 잘못되면 INVALID_TOOL_REQUEST를 반환합니다. 소스 정의는 배치 생성 전에 검증합니다. 필드를 식별할 수 있으면 field와 reason을 반환합니다(예: /definition/source/acquisitionMode 및 required). 실행 결과는 배치 상태에서 확인하세요.
ManualBatchController.create.POST.response.404=프로그램 키가 요청한 소스를 사용할 수 없습니다(batch.not-found). 소스 목록을 다시 조회하세요.
ManualBatchController.create.POST.response.409=기존 배치가 있거나(batch.exists) 서비스가 종료 중입니다(batch.stopping). 기존 배치를 중지하고 삭제하세요.
ManualBatchController.create.POST.response.413=JSON 본문이 8 MiB를 초과합니다(HTTP_BODY_LIMIT).
ManualBatchController.create.POST.response.500=생성 시 데이터베이스를 사용할 수 없거나 분류되지 않은 상태 오류가 발생했습니다(batch.operation-failed). 본문 읽기 실패 시 code는 error.io입니다.
ManualBatchController.current.GET.summary=현재 배치 조회
ManualBatchController.current.GET.description=현재 프로세스가 보관하는 배치를 반환합니다. 호출자에게 보이는 배치가 없으면 204입니다. 재시작하면 기록은 사라집니다.
ManualBatchController.current.GET.success=현재 배치.
ManualBatchController.get.GET.summary=배치 세부 정보 조회
ManualBatchController.get.GET.description=제출 시 받은 UUID로 상태, run, 사유 코드, 건수를 조회합니다. 다른 프로그램 키가 생성한 배치는 404입니다.
ManualBatchController.get.GET.success=배치 세부 정보.
ManualBatchController.get.GET.response.404=이 UUID의 배치가 없거나 다른 프로그램 ID에 속합니다(batch.not-found).
ManualBatchController.items.GET.summary=배치 항목 페이지 조회
ManualBatchController.items.GET.description=발견 순서대로 항목 상태와 결과를 조회합니다. offset은 0부터, limit은 1–200입니다. 배치 UUID와 workType, id를 함께 사용해 작품을 식별하세요.
ManualBatchController.items.GET.success=배치 항목.
ManualBatchController.items.GET.response.400=offset이 음수이거나 limit이 1–200 범위를 벗어났습니다(INVALID_TOOL_REQUEST).
ManualBatchController.items.GET.response.404=이 UUID의 배치가 없거나 다른 프로그램 ID에 속합니다(batch.not-found).
ManualBatchController.pause.POST.summary=배치 일시 중지
ManualBatchController.pause.POST.description=진행 내용을 보존하고 일시 중지를 요청합니다. PAUSING은 실행이 종료 중임을 뜻합니다. PAUSED 후 resume를 호출하세요.
ManualBatchController.pause.POST.success=배치를 일시 중지했습니다.
ManualBatchController.pause.POST.response.404=이 UUID의 배치가 없거나 다른 프로그램 ID에 속합니다(batch.not-found).
ManualBatchController.cancel.POST.summary=배치 취소
ManualBatchController.cancel.POST.description=이번 실행의 취소를 요청합니다. CANCELLING 동안은 아직 종료 중이므로 최종 상태를 조회하세요. 기록은 삭제할 때까지 남습니다.
ManualBatchController.cancel.POST.success=배치.
ManualBatchController.cancel.POST.response.404=이 UUID의 배치가 없거나 다른 프로그램 ID에 속합니다(batch.not-found).
ManualBatchController.resume.POST.summary=배치 다시 시작
ManualBatchController.resume.POST.description=유휴 상태의 미완료 배치를 재개합니다. 소스를 다시 검색하며 완료 및 건너뛴 항목을 보존합니다. 반환된 run 번호는 증가합니다.
ManualBatchController.resume.POST.success=배치를 재개했습니다.
ManualBatchController.resume.POST.response.404=배치가 없거나 다른 프로그램 ID에 속하거나 프로그램 키가 더 이상 소스를 사용할 수 없습니다(batch.not-found).
ManualBatchController.resume.POST.response.409=배치가 실행 중이거나 완료되었거나 서비스가 종료 중입니다(batch.not-idle).
ManualBatchController.retry.POST.summary=실패한 배치 항목 재시도
ManualBatchController.retry.POST.description=이미 발견된 실패 작품만 재시도하며 소스 검색은 재개하지 않습니다. 유휴 상태이며 재시도 가능한 작품이 하나 이상이어야 하며, 아니면 409입니다.
ManualBatchController.retry.POST.success=실패한 배치 항목.
ManualBatchController.retry.POST.response.404=배치가 없거나 다른 프로그램 ID에 속하거나 프로그램 키가 더 이상 소스를 사용할 수 없습니다(batch.not-found).
ManualBatchController.retry.POST.response.409=새 실행을 시작할 수 없거나(batch.not-idle) 재시도할 실패 작품이 없습니다(batch.no-failed-work).
ManualBatchController.credentials.PUT.summary=배치 수집 자격 증명 수정
ManualBatchController.credentials.PUT.description=유휴 상태의 미완료 배치에서 현재 run을 expectedRun으로 보내세요. X-Acquisition-Credential로 수집 자격 증명을 교체하고 헤더를 생략하면 해제합니다. 다음 실행 시 소스를 다시 준비합니다. 계정이 고정된 소스에서는 처음 연결한 인증 정보를 교체하거나 지울 수 없습니다.
ManualBatchController.credentials.PUT.success=배치 수집 자격 증명을 변경했습니다.
ManualBatchController.credentials.PUT.response.400=JSON 요청 또는 수집용 자격 증명 헤더가 잘못되었습니다(INVALID_TOOL_REQUEST). 연결이 고정되었거나(schedule.error.credential-fixed) 정책을 사용할 수 없으면(schedule.error.credential-policy-unavailable) 기존 인증 정보를 유지합니다.
ManualBatchController.credentials.PUT.response.404=이 UUID의 배치가 없거나 다른 프로그램 ID에 속합니다(batch.not-found).
ManualBatchController.credentials.PUT.response.409=expectedRun이 현재 실행과 다르거나 배치가 실행 중 또는 완료되었거나 서비스가 종료 중입니다(batch.not-idle). 배치를 다시 조회하세요. 갱신 중 정책이 바뀌면 schedule.error.credential-policy-publication-changed를 반환합니다.
ManualBatchController.credentials.PUT.response.413=JSON 본문이 16 KiB를 초과합니다(HTTP_BODY_LIMIT).
ManualBatchController.resolve.POST.summary=보류 중인 배치 항목 처리
ManualBatchController.resolve.POST.description=배치가 멈춘 뒤 현재 run과 작품 식별자, 원래 reasonCode와 결정을 보내세요. 아직 사용자 결정이 필요한 항목이어야 합니다. 저장 후 resume 또는 retry를 호출하세요.
ManualBatchController.resolve.POST.success=보류 중인 배치 항목.
ManualBatchController.resolve.POST.response.400=JSON, 작품 식별자 또는 userAction 형식이 잘못되었습니다(INVALID_TOOL_REQUEST). DOWNLOAD_PATH_ACTION_REQUIRED에는 TRUNCATE, DEFAULT_NAME 또는 CANCEL을 지정하세요. 다른 값을 보내면 400 응답의 /userAction 필드에 오류가 표시됩니다. 작품은 확인 대기 상태이므로 값을 고쳐 바로 다시 보낼 수 있습니다.
ManualBatchController.resolve.POST.response.404=이 UUID의 배치가 없거나 다른 프로그램 ID에 속합니다(batch.not-found).
ManualBatchController.resolve.POST.response.409=배치가 실행 중이거나 expectedRun이 오래되었거나(batch.not-idle), 작품·reasonCode·사용자 조치 대기 상태가 일치하지 않습니다(batch.action-changed).
ManualBatchController.resolve.POST.response.413=JSON 본문이 16 KiB를 초과합니다(HTTP_BODY_LIMIT).
ManualBatchController.delete.DELETE.summary=배치 기록 삭제
ManualBatchController.delete.DELETE.description=중지된 배치 기록과 수집 자격 증명을 삭제해 새 배치를 만들 수 있게 합니다. 실행 중이면 409입니다.
ManualBatchController.delete.DELETE.success=배치 기록을 제거했습니다.
ManualBatchController.delete.DELETE.response.404=이 UUID의 배치가 없거나 다른 프로그램 ID에 속합니다(batch.not-found).
ManualBatchController.delete.DELETE.response.409=배치가 실행 중이거나 아직 중지 중입니다(batch.not-idle). 유휴 상태가 된 뒤 삭제하세요.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Credentials.field.expectedRun=현재 배치 상세에서 run을 그대로 보내세요. 실행 회차가 바뀌었으면 409입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.name=배치 표시 이름입니다. 1–200자이며 제어 문자를 포함하거나 공백으로만 이루어질 수 없습니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.sourceType=GET /api/schedule/sources에서 선택한 항목의 sourceType과 같은 항목의 activationToken을 사용하세요.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.activationToken=선택한 소스의 현재 activationToken입니다. 소스가 다시 게시되면 목록과 입력 스키마를 새로 조회하세요.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.definition=소스 정의를 JSON 객체로 전달합니다. OpenAPI의 x-schedule-sources[sourceType].inputSchemaJson를 참고하거나 examples[0]을 수정하세요. 압축한 JSON은 UTF-8 기준 최대 1 MiB입니다. 수집 자격 증명은 요청 헤더로 보냅니다. 두 형식은 같은 공급자 선언에서 생성됩니다. 독립 검증에는 x-schedule-sources[sourceType].inputSchemaJson 전체를 루트로 파싱하세요. 배치 검증이나 SDK 생성에는 전체 OpenAPI 문서를 기준으로 해당 ScheduleDefinition 구성 요소를 해석하세요.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.proxy=선택적 host:port 값입니다(예: 127.0.0.1:7890). 비우면 전역 프록시를 사용합니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.expectedRun=현재 배치 상세에서 run을 그대로 보내세요. 실행 회차가 바뀌었으면 409입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.workType=workId가 가리키는 작품 유형입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.workId=workType과 짝을 이루는 소스 작품 ID로, 원래 문자열을 그대로 보내세요.
ManualBatchController.credentials.PUT.body=수집 자격 증명을 변경할 배치 실행을 지정합니다.
ManualBatchController.create.POST.body=배치 이름, 소스 정의 및 이번 실행의 프록시입니다.
ManualBatchController.resolve.POST.body=실행 식별자, 보류된 작품 및 처리 방법입니다.
parameter.id=수동 배치 제출 시 반환된 ID입니다.
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.description=예약 기능의 소유자, 패키지 및 플러그인 세대입니다.
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkKey.description=workType과 id의 조합으로 식별하는 작품입니다.
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.description=소스 플러그인이 없어도 볼 수 있는 저장된 작품 정보입니다.
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.description=예약 작품 하나의 실행 결과 및 실시간 상태 조회 가능 여부입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.description=대기열 작품 하나의 식별 정보, 표시 데이터 및 실행 상태입니다.
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkKey.field.id=고유 식별자
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.title=제목
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.attributes=추가 속성
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.attributes=추가 속성
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.packageId=패키지 ID
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkKey.field.workType=알려진 경우 작품 유형
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.outcome=작품 실행기가 보고한 결과 분류입니다.
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.author=작가 또는 개발자의 표시 이름
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.featurePluginId=기능을 제공하는 플러그인 ID
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.pluginGeneration=0 이상의 플러그인 세대 번호
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.thumbnailReference=썸네일 참조. 없으면 null
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.resultCode=실행기 결과 코드입니다. 이미 완료된 다운로드는 work.already-completed, 결과 분류 ALREADY_COMPLETED, 항목 상태 skipped-downloaded를 반환할 수 있습니다. 확장은 다른 코드를 반환할 수 있습니다.
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.liveStatusAvailable=같은 작품 실행기에서 실시간 상태를 조회할 수 있는지 여부
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.userAction=사유 코드에 맞는 동작입니다. DOWNLOAD_PATH_ACTION_REQUIRED이면 TRUNCATE(이름 단축), DEFAULT_NAME(기본 짧은 이름), CANCEL(해당 작품 취소) 중 선택하세요.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.rememberForRun=true는 이번 실행에서 같은 사유에 결정을 재사용하고 false는 지정한 작품에만 적용합니다.
parameter.X-Acquisition-Credential=작품 소스에 접근하는 수집 자격 증명으로 최대 16,384자입니다. 프로그램 키는 별도로 Authorization에 보내세요.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.reasonCode=결정을 기다리는 작품의 현재 사유 코드로, 보류 기록과 정확히 일치해야 합니다.
ManualBatchController.items.GET.parameter.limit=조회 개수는 1~200이며 범위를 벗어나면 400을 반환합니다.
ManualBatchController.items.GET.parameter.offset=오프셋은 0부터 시작하며 음수는 400을 반환합니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.id=수동 배치 UUID입니다. 이후 작업의 경로 매개변수 id로 사용합니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Items.field.items=이번 실행에서 등록 순으로 반환된 작품 대기열 항목입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Items.field.total=대기열이나 배치가 보고한 작품 항목 총개수입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.total=대기열이나 배치가 보고한 작품 항목 총개수입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.status=pending은 실행 대기, paused는 일시 정지, downloaded는 완료, skipped-downloaded는 이미 완료, skipped-filter는 실행기가 건너뜀, failed는 실패입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.message=실행기 또는 호스트가 기록한 추가 상태 설명입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.sourceType=생성 시 GET /api/schedule/sources에서 선택한 정식 소스 ID입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.key=작품을 식별하는 workType과 불투명한 workId 쌍입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.presentation=민감 정보를 제외한 작품 표시 스냅샷입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.workExecutorOwner=작품을 처리하는 실행기의 소유자 또는 정확한 게시 인스턴스입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.workExecutorPublicationId=작품을 처리하는 실행기의 소유자 또는 정확한 게시 인스턴스입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.result=실행기가 생성한 작품 결과이며 나올 때까지 비어 있습니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Items.field.offset=현재 페이지 첫 행의 0부터 시작하는 오프셋입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.name=생성 시 지정한 배치 표시 이름입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.state=현재 배치 상태입니다. 일시 중지나 취소 중에는 실행 항목 종료를 기다릴 수 있습니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.code=사유 코드가 없으면 null입니다. 배치 상태는 `state`로 판단하세요. 소스 또는 계정 정책 플러그인이 알 수 없는 코드를 반환할 때도 마찬가지입니다. Pixiv 작가의 작품 목록을 조회할 때 HTTP 404가 반환되면 사유 코드는 `schedule.pixiv.discovery-not-found`입니다. 작가 계정이 존재하지 않거나 작가가 탈퇴한 경우가 이에 해당합니다. `batch.work-failed`이면 실패한 항목을 확인하고, `batch.discovery-incomplete`이면 탐색을 재개하세요. `batch.work.capacity-exceeded`이면 소스 범위를 좁히세요. `schedule.error.source-publication-changed` 또는 `schedule.error.execution-capability-unavailable`이면 소스와 실행기를, `schedule.error.definition-invalid`이면 정의를, `auth.program.forbidden`이면 권한을 확인하세요. `batch.dispatch-failed` 또는 `batch.execution-failed`이면 서버 로그를 확인하세요.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.run=현재 실행 회차입니다. 자격 증명 변경 또는 항목 처리 시 expectedRun으로 제출합니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.createdTime=배치 생성 시각(Unix 밀리초)입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.completed=성공적으로 완료한 작품 수입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.skipped=건너뛴 작품 수입니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.failed=실행에 실패한 작품 수입니다.
guide=https://sywyar.github.io/PixivDownloader/#/ko/batch-download
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.programPermission=이번 실행에서 프로그램 키에 부족했던 권한입니다. 확인할 수 있을 때 반환됩니다.
description=수동 배치를 만들고 항목과 실행 상태를 관리합니다.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.field=요청 본문에서 해당 필드를 가리키는 JSON Pointer.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.reason=언어와 무관한 필드 검증 사유 코드.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.retryAfterMillis=RETRY_LATER일 때 resume을 호출하기 전 권장 대기 시간(밀리초)입니다. 다른 상태에서는 null입니다.
