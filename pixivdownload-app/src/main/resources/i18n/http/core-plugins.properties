title=插件管理
GuiPluginController.status.GET.summary=查看桌面插件运行状态
GuiPluginController.status.GET.description=读取当前运行实例的状态快照，供控制中心展示。
GuiPluginController.status.GET.success=桌面插件运行状态。
PluginManagementController.status.GET.summary=查看插件运行状态
PluginManagementController.status.GET.description=列出各插件的运行阶段、可执行操作及当前恢复模式。
PluginManagementController.status.GET.success=插件运行状态。
PluginManagementController.refreshRevocations.POST.summary=刷新仓库撤销清单
PluginManagementController.refreshRevocations.POST.description=从指定仓库刷新撤销信息。
PluginManagementController.refreshRevocations.POST.success=已刷新仓库撤销清单。
PluginManagementController.impact.GET.summary=预览插件变更影响
PluginManagementController.impact.GET.description=变更前查看受影响的依赖方。后续确认操作使用此次预览返回的指纹。
PluginManagementController.impact.GET.success=插件变更影响。
PluginManagementController.performPreviewed.POST.summary=执行已确认影响的插件操作
PluginManagementController.performPreviewed.POST.description=提交影响预览返回的指纹。依赖关系发生变化时，需要重新预览后再提交。
PluginManagementController.performPreviewed.POST.success=已确认影响的插件操作。
PluginManagementController.enabledPreviewed.PUT.summary=保存已确认影响的插件启用设置
PluginManagementController.enabledPreviewed.PUT.description=用 impact 返回的 fingerprint 确认对依赖方的影响，同时提交布尔值 enabled。预览已过期时重新读取 impact。
PluginManagementController.enabledPreviewed.PUT.success=已保存已确认影响的插件启用设置。
PluginManagementController.load.POST.summary=加载已安装的插件
PluginManagementController.load.POST.description=将已卸载的外置插件重新接入注册中心。先从 GET /api/plugins/status 确认当前可用动作包含 load。
PluginManagementController.load.POST.success=已安装的插件。
PluginManagementController.start.POST.summary=启动插件
PluginManagementController.start.POST.description=为已加载或已停止的外置插件启动服务。当前是否可启动由 status 返回的动作列表决定。
PluginManagementController.start.POST.success=插件。
PluginManagementController.quiesce.POST.summary=等待完成插件的在途工作
PluginManagementController.quiesce.POST.description=停止该插件接收新请求和新计划任务的派发，并清退进行中的工作。
PluginManagementController.quiesce.POST.success=插件的在途工作。
PluginManagementController.stop.POST.summary=停止插件
PluginManagementController.stop.POST.description=停止插件服务并撤下运行期服务注册。后续可用 start 再次启动。
PluginManagementController.stop.POST.success=已停止插件。
PluginManagementController.unload.POST.summary=卸载插件
PluginManagementController.unload.POST.description=停止插件并从核心注册中心卸载，保留磁盘上的插件包供之后 load。
PluginManagementController.unload.POST.success=插件。
PluginManagementController.remove.POST.summary=移除已卸载的插件包
PluginManagementController.remove.POST.description=卸载插件并删除已安装的磁盘插件包。调用前可通过 impact 查看受影响的依赖方。
PluginManagementController.remove.POST.success=已移除已卸载的插件包。
PluginManagementController.restart.POST.summary=重启插件
PluginManagementController.restart.POST.description=重启插件服务，沿用当前 generation 和类加载器。
PluginManagementController.restart.POST.success=插件。
PluginManagementController.reload.POST.summary=重新加载插件
PluginManagementController.reload.POST.description=从插件包重新加载外置插件，创建新的 generation 和类加载器。之后重新查询带 publication 或 generation 的标识。
PluginManagementController.reload.POST.success=插件。
PluginManagementController.updateEnabled.PUT.summary=设置插件启用状态
PluginManagementController.updateEnabled.PUT.description=保存可选外置插件的启用设置。实际生效时间由插件的生命周期策略决定。
PluginManagementController.updateEnabled.PUT.success=已保存插件启用状态。
PluginManagementController.approveTrust.PUT.summary=批准插件包执行信任
PluginManagementController.approveTrust.PUT.description=为指定 SHA-256 摘要对应的已安装包授权执行。更换插件包后需要重新批准。
PluginManagementController.approveTrust.PUT.success=已批准插件包执行信任。
PluginManagementController.revokeTrust.DELETE.summary=撤销插件执行信任
PluginManagementController.revokeTrust.DELETE.description=清除已保存的执行授权。当前运行的实例会继续工作，下次加载时重新检查信任。
PluginManagementController.revokeTrust.DELETE.success=已撤销插件执行信任。
PluginManagementController.restartBackend.POST.summary=重启桌面后端
PluginManagementController.restartBackend.POST.description=请求桌面生命周期管理器重启它持有的后端上下文。
PluginManagementController.restartBackend.POST.success=桌面后端。
PluginManagementController.install.POST.summary=安装本地插件包
PluginManagementController.install.POST.description=以 multipart 文件上传插件包。响应包含安装结果或拒绝原因。
PluginManagementController.install.POST.success=本地插件包。
