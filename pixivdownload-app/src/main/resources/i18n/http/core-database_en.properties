title=Database and migration
DatabaseSettingsController.settings.GET.summary=Get database settings
DatabaseSettingsController.settings.GET.description=Reads editable connection settings. Get provider choices from providers and compare the current and next-start targets in status.
DatabaseSettingsController.settings.GET.success=Database settings.
DatabaseSettingsController.providers.GET.summary=List database providers
DatabaseSettingsController.providers.GET.description=Lists installed database provider IDs and their connection fields. Use the chosen provider’s ID in your draft.
DatabaseSettingsController.providers.GET.success=Database providers.
DatabaseSettingsController.status.GET.summary=Get database connection status
DatabaseSettingsController.status.GET.description=Compares the live connection with the next-start connection. restartRequired indicates a saved change still needs a restart.
DatabaseSettingsController.status.GET.success=Database connection status.
DatabaseSettingsController.migration.GET.summary=Get database migration progress
DatabaseSettingsController.migration.GET.description=Reads migration state after POST /api/settings/database/migrations. Acceptance means the migration was scheduled.
DatabaseSettingsController.migration.GET.success=Database migration progress.
DatabaseSettingsController.check.POST.summary=Check a database connection
DatabaseSettingsController.check.POST.description=Tests the draft connection without saving it. passwordAction defaults to KEEP. SET requires a nonblank password. CLEAR clears the draft password.
DatabaseSettingsController.check.POST.success=Database connection.
DatabaseSettingsController.preview.POST.summary=Preview a database migration
DatabaseSettingsController.preview.POST.description=Inspects the draft destination and returns a per-store plan. Review ready, targets and objects to rebuild, then send this preview’s token to migrations.
DatabaseSettingsController.preview.POST.success=Database migration.
DatabaseSettingsController.start.POST.summary=Start a database migration
DatabaseSettingsController.start.POST.description=Submits the approved preview token to start migration and request a process restart. The 202 response contains migration state. Poll GET /api/settings/database/migration.
DatabaseSettingsController.start.POST.success=Database migration.
MigrationController.migrate.POST.summary=Run JSON-to-SQLite migration
MigrationController.migrate.POST.description=Runs legacy JSON migration synchronously from the local machine and returns the result when it finishes.
MigrationController.migrate.POST.success=JSON-to-SQLite migration.
MigrationController.migrateWithProgress.GET.summary=Run legacy JSON migration and stream progress
MigrationController.migrateWithProgress.GET.description=Opening this local SSE stream starts a migration and sends progress messages as it runs. Connect when you intend to migrate.
MigrationController.migrateWithProgress.GET.success=JSON-to-SQLite migration progress.
