UpdateApiController.install.POST.description=진행 상태 응답의 64자리 16진수 SHA-256을 지정하면 Windows x64에서 해당 설치 파일을 실행하고 앱을 종료합니다. 지원하지 않는 플랫폼이나 오래된 확인 정보는 409를 반환합니다.
UpdateApiController.install.POST.success=다운로드한 업데이트.
parameter.channel=설치 프로그램 채널입니다. 기본값은 official입니다. 소문자 official과 nightly만 허용하며 다른 값은 400을 반환합니다.
parameter.force=기존 결과가 있어도 다시 실행합니다.
