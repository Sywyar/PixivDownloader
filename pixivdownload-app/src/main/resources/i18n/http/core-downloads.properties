schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.CancelResponse.field.result=REQUESTED 表示已发送取消请求，TERMINAL 表示任务已结束。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.HistoryView.field.tasks=此页可见的历史任务，按更新时间和任务 ID 游标分页。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.HistoryView.field.beforeTime=末项的 updatedAt。下一页原样回传；末页为 null。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.HistoryView.field.beforeId=末项的 attemptId，用于区分相同时间戳的任务。末页为 null。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.ReceiptView.field.task=此次提交关联的任务快照；使用 attempt.attemptId 继续查状态或取消。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.ReceiptView.field.duplicate=为 true 时同一提交已被识别并返回既有任务。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.SnapshotView.field.tasks=当前请求身份可见的运行时任务快照列表。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.attempt=宿主分配的尝试 UUID 及提供方的 workType、workId。
