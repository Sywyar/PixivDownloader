schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.title=该任务公开的作品或任务显示标题。 提供方尚未给出标题时使用 workId。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.phase=此执行尝试当前的生命周期阶段。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.updatedAt=任务最近更新的 ISO 8601 时间。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.revision=同一 epoch 内所有任务共用一个计数器。此值是该任务最近一次变更时的计数，归档查询返回 0。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.failureReason=执行器报告的失败原因代码，没有专门原因时为空。 选页来源、页数、目录或输出设置变化时返回 OUTPUT_LAYOUT_CONFLICT；省略 pages 可重新下载整部作品。OUTPUT_ALREADY_REGISTERED 表示作品已完整入库。 `WORK_NOT_FOUND` 表示提交时来源无法按当前身份找到目标作品。 提交被拒时，即使 phase 为 FAILED，此字段也可能为 null。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.outputPath=本次执行的服务器绝对输出目录。插画和小说在入队前确定目录，排队时文件可能尚未写入。准备中、提供方未报告目录或旧回执未记录目录时为 null。作品移动后，这里仍保留执行时的目录。
parameter.X-Acquisition-Credential=可选的临时采集凭据，由所选下载处理器使用。最多 16384 个字符。
DownloadTasksController.submit.POST.response.400=命令无法解析、缺少必填字段、选项超过通用限制，或临时采集凭据超长。 如果 workType 没有已发布的提交提供方，返回 DOWNLOAD_TASK_UNSUPPORTED_WORK_TYPE，且不会创建任务。请选择 x-download-submissions 中的类型；queueType 是队列标识。 能定位输入错误时，field 是请求体中的 JSON Pointer，reason 是稳定原因码。 不支持的作品类型返回 field=/workType、reason=unsupported。
DownloadTasksController.submit.POST.response.409=下载提交发生冲突，例如已使用相同 requestId 提交其他内容。
DownloadTasksController.submit.POST.response.413=请求体超过 128 KiB。
DownloadTasksController.submit.POST.response.404=WORK_NOT_FOUND — 来源按当前身份查询作品元数据时返回未找到。请核对作品 ID 和可见性。 已登记的尝试会以 FAILED 出现在任务列表和历史中。 首次错误响应不含 attemptId 或 Location。任务结束超过 5 分钟且结果保存成功后，幂等记录即可过期。当前进程保留记录期间，同一调用方用相同的 requestId 重试原命令，可取得原任务的 202 回执（duplicate=true）。过期后重试会创建新的尝试。
DownloadTasksController.submit.POST.response.422=提供方或准入策略拒绝执行，例如选项值超出所选类型允许的范围。 已登记的尝试会以 FAILED 出现在任务列表和历史中。 首次错误响应不含 attemptId 或 Location。任务结束超过 5 分钟且结果保存成功后，幂等记录即可过期。当前进程保留记录期间，同一调用方用相同的 requestId 重试原命令，可取得原任务的 202 回执（duplicate=true）。过期后重试会创建新的尝试。 能定位输入错误时，field 是请求体中的 JSON Pointer，reason 是稳定原因码。 内置提供方的字段原因包括 unknown_property, duplicate, invalid_format, invalid_value, not_applicable, out_of_range, too_large；扩展可以返回其他原因。
DownloadTasksController.submit.POST.response.503=处理器或队列暂不可用，或任务容量已满。 登记前失败不会创建任务。登记后失败则可能留下 FAILED 记录，可在幂等记录保留期间原样重试以查询回执。
DownloadQueueController.cancelDownload.POST.response.409=排队项的处理器标识已失效，或处理器不支持取消。请从当前队列读取最新标识和能力。
DownloadTasksController.cancel.POST.response.409=任务存在，但其处理器不支持取消当前执行。
DownloadTasksController.find.GET.response.404=当前调用方可访问的任务中没有此 taskId。
DownloadTasksController.cancel.POST.response.404=当前调用方可访问的任务中没有此 taskId。
DownloadTasksController.submit.POST.details=**提交。** 管理员可提交。程序密钥需要 `core:downloads.create` 及所选类型的 `x-program-permission`。提交 JSON 对象，`options` 的键和值均为字符串，无选项时传 `{}`。请求体最多 128 KiB，选项最多 32 项，键和值合计最多 16 KiB（UTF-8）。采集凭据放在请求头。`X-Acquisition-Credential` 与引用已保存凭据的 `X-Acquisition-Credentials` 只能选一个，程序密钥使用后者还需要 `core:credentials.use`。 命令必须是单个 JSON 对象，重复键、尾随内容及超过四层的嵌套会被拒绝。提供方的参数校验不通过时返回 422 `DOWNLOAD_TASK_REJECTED`。启用的下载策略可拒绝任务，选项扩展可调整文件名模板和输出格式。\n\n\
    **重试。** 同一调用身份在当前进程保留期内，使用同一 `requestId`、作品类型、作品 ID、选项和实际主采集凭据会得到原任务及 `duplicate=true`。更改这些内容后复用 ID 会收到 409。轮询已有任务用 `task.attempt.attemptId`；修改选页、重建或重新执行失败任务时用新的 `requestId`。终态保存后，幂等记录可在五分钟后清理。重启后可查询已保存的终态，重启不重放任务。\n\n\
    **接纳和完成。** 提供方可在提交期间访问上游并校验作品。请求格式无效返回 400，超出请求体上限返回 413，提供方或准入策略拒绝可返回 422，提供方、数据库或任务容量不可用可返回 503。收到 202 后，用 `core:downloads.read` 轮询 `Location`，查看 `phase` 和 `failureReason`。执行可能已经结束。`CREDENTIALS_UNAVAILABLE` 表示执行期间选用的采集凭据不可用。以 `core:downloads.cancel` 调用 `POST /api/download/tasks/{taskId}/cancel` 后仍须轮询终态。程序密钥只能查询和取消其可见的任务。 插画和小说在入队前确定服务器上的绝对输出目录 `task.outputPath`。排队时目录可能尚未创建。若在绑定队列前被拒，`queueType` 为空字符串，`task.outputPath` 为 null。422 或 404 `WORK_NOT_FOUND` 的响应不含任务 ID，但任务列表和历史会记录这次失败。保留期内原样重试可取得该任务的 202 回执。作品不存在时 `failureReason` 为 `WORK_NOT_FOUND`。
description=提交下载，跟踪每次尝试并查询已结束的任务。
DownloadTasksController.history.GET.parameter.limit=每次返回 1–200 条，超出范围返回 400。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.progress=本次执行最近一次可量化的进度。提供方尚未报告或旧归档无记录时为 null。步骤达到总量后仍须检查 phase 判断任务是否成功。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.description=提供方对单个步骤的计数。切换步骤时，单位和总量可能改变。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.unit=PAGES 表示作品页，IMAGES 表示图像，BYTES 表示字节。小说分别报告已处理的内嵌图和已传输的封面字节。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.completed=此步骤已处理的数量，范围为 0 到 total。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.total=以相同单位表示的步骤总量，大于零。
