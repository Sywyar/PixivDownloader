DownloadQueueController.rejectLegacyCancel.POST.description=此旧地址固定返回 409。有任务 UUID 时调用 POST /api/download/tasks/{taskId}/cancel；只有提供方已给出队列项键和发布身份时，才调用 POST /api/download/queue/{queueType}/cancel。
DownloadQueueController.rejectLegacyCancel.POST.success=旧版无队列标识的取消请求。
DownloadQueueController.cancelDownload.POST.summary=取消指定队列中的下载
DownloadQueueController.cancelDownload.POST.description=已从队列提供方取得 workKey 时，请原样传入，并从 GET /api/download/extensions 读取同一次发布的身份信息作为 owner。程序客户端也可以从 GET /api/download/tasks 的可见任务读取 attempt.attemptId，将它作为 taskId 调用 POST /api/download/tasks/{taskId}/cancel。
DownloadQueueController.cancelDownload.POST.success=指定队列中的下载。
DownloadQueueController.clearDownloadQueue.POST.summary=清除下载队列
DownloadQueueController.clearDownloadQueue.POST.description=清理当前调用者可管理的排队任务，并返回处理结果。
DownloadQueueController.clearDownloadQueue.POST.success=已清除下载队列。
DownloadTasksController.submit.POST.summary=提交下载任务
DownloadTasksController.submit.POST.description=从本操作的请求结构选取已启用的 workType，按其示例填写 workId 和 options。也可在文档顶层 x-download-submissions 按类型查找结构和该提供方要求的程序权限。相同命令重试时复用 requestId；更改内容后沿用同一 ID 会冲突。202 回执包含可供轮询的任务 ID。 202 响应的 Location 可直接轮询。路径参数 taskId 取回执的 task.attempt.attemptId。 同一调用方在当前进程仍保留幂等记录时，以相同 `requestId` 重试相同命令可取得原回执。终态结果保存后，幂等记录可在任务结束五分钟后过期，再次提交可能创建新任务。
DownloadTasksController.submit.POST.success=已有任务的重复提交也返回 202。用 task.attempt.attemptId 查询同一次尝试。若在入队前失败，task.outputPath 可为 null。
DownloadTasksController.snapshot.GET.summary=列出当前下载任务
DownloadTasksController.snapshot.GET.description=返回调用者可见的任务快照、进程 epoch 和 revision。进程重启后 epoch 会改变。 重启后可在 GET /api/download/tasks/history 分页查询已归档的终态任务。
DownloadTasksController.snapshot.GET.success=当前下载任务。
DownloadTasksController.find.GET.summary=查看下载任务详情
DownloadTasksController.find.GET.description=outputPath 给出这一次执行的输出目录。 使用提交回执中的任务 UUID 查询执行状态。该身份查不到任务时返回 404。 整部插画下载完成后，用 attempt.workId 调用 GET /api/library/artworks/{artworkId}（core:library.read）。移动过的作品看 moveFolder，其余看 folder。按页取文件用 GET /api/downloaded/rawfile/{artworkId}/{page}（core:assets.export，页码从 0 开始）。 选页尚未凑齐整部作品时，用 GET /api/library/artworks/{artworkId}/partial 查询已写入的页和目录。 建议每 2 秒读取一次。`revision` 持续不变时逐步延长至 10 秒，有更新时恢复到 2 秒。`phase` 为 `COMPLETED`、`FAILED` 或 `CANCELLED` 时停止。收到 `Retry-After` 时，至少等待指定时间再请求。
DownloadTasksController.find.GET.success=下载任务详情。
DownloadTasksController.history.GET.summary=列出已保存的任务历史
DownloadTasksController.history.GET.description=limit 为 1–200，默认 50。首页省略游标；下一页原样传回 beforeTime 和 beforeId，两者必须成对。 重启后可在 GET /api/download/tasks/history 分页查询已归档的终态任务。
DownloadTasksController.history.GET.success=已保存的任务历史。
DownloadTasksController.cancel.POST.summary=取消下载任务
DownloadTasksController.cancel.POST.description=按任务 UUID 请求取消。REQUESTED 表示已申请，TERMINAL 表示已结束；任务不可取消时返回 409。从 GET /api/download/tasks 读取 attempt.attemptId 作为 taskId。若提供方交付的是 workKey 和发布身份，请用 POST /api/download/queue/{queueType}/cancel。
DownloadTasksController.cancel.POST.success=下载任务。
DownloadQueueController.rejectLegacyCancel.POST.response.409=需要指定队列。请使用对应队列的取消接口。
parameter.taskId=提交回执中的 task.attempt.attemptId，也可从 Location 获取查询地址。
parameter.queueType=条目所属队列发布的类型。
parameter.beforeTime=上一页的 beforeTime。与 beforeId 一起回传，保留小数秒精度。
parameter.beforeId=上一页末项的尝试 UUID。与 beforeTime 成对提供。
