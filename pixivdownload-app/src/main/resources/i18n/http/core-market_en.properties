title=Plugin marketplace
RepositorySettingsController.read.GET.summary=Get repository settings
RepositorySettingsController.read.GET.description=Returns configured repository entries and their shared revision. Submit that revision with the complete edited list.
RepositorySettingsController.read.GET.success=Repository settings.
RepositorySettingsController.save.PUT.summary=Save repository settings
RepositorySettingsController.save.PUT.description=Replaces the repository list at revision, up to 256 entries. Adding a repository or changing trust, URLs or network policy requires trustConfirmed. Read again after a revision conflict.
RepositorySettingsController.save.PUT.success=Repository settings saved.
PluginAcquisitionController.prepare.POST.summary=Prepare a plugin acquisition
PluginAcquisitionController.prepare.POST.description=Creates an acquisition record for repositoryId, pluginId, version and the install-preview fingerprint. Use the returned operation ID to execute or discard it.
PluginAcquisitionController.prepare.POST.success=Plugin acquisition prepared.
PluginAcquisitionController.execute.POST.summary=Run a prepared acquisition
PluginAcquisitionController.execute.POST.description=Executes a prepared acquisition and returns its updated state. id is the operation record ID.
PluginAcquisitionController.execute.POST.success=Prepared acquisition.
PluginAcquisitionController.discard.POST.summary=Discard a prepared acquisition
PluginAcquisitionController.discard.POST.description=Discards the pending acquisition for this ID and returns its state.
PluginAcquisitionController.discard.POST.success=Prepared acquisition discarded.
PluginAcquisitionController.get.GET.summary=Get acquisition details
PluginAcquisitionController.get.GET.description=Read an acquisition by the operation ID returned from prepare. Its state includes started and finished flags, an install result or a failure. The record remains available after the marketplace unloads.
PluginAcquisitionController.get.GET.success=Acquisition details.
PluginAcquisitionController.list.GET.summary=List plugin acquisitions
PluginAcquisitionController.list.GET.description=List saved plugin acquisitions with their target versions, transaction IDs and current states.
PluginAcquisitionController.list.GET.success=Plugin acquisitions.
PluginUpdateController.updates.GET.summary=List plugin updates
PluginUpdateController.updates.GET.description=Reads available-update information for installed plugins. This query returns the update summary.
PluginUpdateController.updates.GET.success=Plugin updates.
PluginMarketContentController.document.GET.summary=Get a package document
PluginMarketContentController.document.GET.description=Reads a catalog document for this version. kind is readme, changelog or releaseNotes. locale and sha256 must match the selected document entry.
PluginMarketContentController.document.GET.success=Package document.
PluginMarketContentController.image.GET.summary=Get a marketplace image
PluginMarketContentController.image.GET.description=Select role=icon with index=0 or role=screenshot with a zero-based index. Supply the asset’s catalog sha256 to receive image bytes.
PluginMarketContentController.image.GET.success=Marketplace image.
PluginMarketController.repositories.GET.summary=List plugin repositories
PluginMarketController.repositories.GET.description=Lists market repositories. Use a returned repositoryId for subsequent catalog queries.
PluginMarketController.repositories.GET.success=Plugin repositories.
PluginMarketController.previewRepository.POST.summary=Preview a repository import
PluginMarketController.previewRepository.POST.description=Inspects the repository at descriptorUrl. Review its identity and descriptor SHA-256 before calling import/trust.
PluginMarketController.previewRepository.POST.success=Repository import.
PluginMarketController.trustRepository.POST.summary=Approve a repository import
PluginMarketController.trustRepository.POST.description=Submits the previewed descriptorUrl, its expectedDescriptorSha256 and explicit trustConfirmed decision.
PluginMarketController.trustRepository.POST.success=Repository import approved.
PluginMarketController.catalog.GET.summary=List available plugins
PluginMarketController.catalog.GET.description=Reads a catalog page filtered by repository, query, category, publisher and channel. Pass the returned cursor for the next page. limit defaults to 24 and is capped at 100.
PluginMarketController.catalog.GET.success=Available plugins.
PluginMarketController.pluginDetail.GET.summary=Get a marketplace listing
PluginMarketController.pluginDetail.GET.description=Looks up a plugin and its versions using repositoryId and pluginId from the catalog. Pass the cursor to continue through its versions.
PluginMarketController.pluginDetail.GET.success=Marketplace listing.
PluginMarketController.install.POST.summary=Install a marketplace package
PluginMarketController.install.POST.description=Requests installation of the repository, plugin and version in the path. Use install-preview for that version to review changes first.
PluginMarketController.install.POST.success=Marketplace package.
PluginMarketController.installPreview.GET.summary=Preview package installation
PluginMarketController.installPreview.GET.description=Previews installation of the selected release and returns its impact and confirmation fingerprint.
PluginMarketController.installPreview.GET.success=Package installation.
PluginMarketController.installPreviewed.POST.summary=Install a reviewed package
PluginMarketController.installPreviewed.POST.description=Install the reviewed release using the preview fingerprint. When artifact trust approval is needed, copy trustRequirement.artifactSha256 into confirmTrust.
PluginMarketController.installPreviewed.POST.success=Reviewed package.
PluginMarketController.packageFacts.GET.summary=Get package metadata
PluginMarketController.packageFacts.GET.description=Reads package facts for one repository, plugin and version so the release can be checked before acquisition or installation.
PluginMarketController.packageFacts.GET.success=Package metadata.
parameter.repositoryId=Repository identifier from the marketplace catalog.
parameter.pluginId=Plugin identifier from the selected repository or installation.
parameter.confirmTrust=When installation requests a trust decision, review the artifact and pass the 64-digit hexadecimal value from trustRequirement.artifactSha256.
parameter.cursor=Continuation cursor for the next group of results.
parameter.kind=Kind of resource to retrieve.
parameter.sha256=Expected SHA-256 digest of the selected content.
parameter.role=Role of the image in the marketplace entry.
parameter.category=Category used to filter entries.
parameter.publisher=Publisher used to filter catalog entries.
parameter.channel=Publisher-defined package channel, matched case-insensitively. Omit it or leave it blank for all channels. Packages without a channel match stable. An unmatched channel returns an empty page.
