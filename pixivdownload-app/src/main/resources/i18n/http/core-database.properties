title=数据库与迁移
DatabaseSettingsController.settings.GET.summary=查看数据库设置
DatabaseSettingsController.settings.GET.description=读取已保存的可编辑连接设置。用 providers 查可选 provider；用 status 核对下次启动和当前实际连接的目标。
DatabaseSettingsController.settings.GET.success=数据库设置。
DatabaseSettingsController.providers.GET.summary=列出数据库提供程序
DatabaseSettingsController.providers.GET.description=返回本机数据库提供方的标识及其连接字段。草稿中使用对应提供方的标识。
DatabaseSettingsController.providers.GET.success=数据库提供程序。
DatabaseSettingsController.status.GET.summary=查看数据库连接状态
DatabaseSettingsController.status.GET.description=比较运行中的连接和下次启动时生效的连接。restartRequired 表示已保存的变更尚需重启。
DatabaseSettingsController.status.GET.success=数据库连接状态。
DatabaseSettingsController.migration.GET.summary=查看数据库迁移进度
DatabaseSettingsController.migration.GET.description=返回当前迁移状态。提交 POST /api/settings/database/migrations 后用此接口跟踪，受理只表示已安排迁移。
DatabaseSettingsController.migration.GET.success=数据库迁移进度。
DatabaseSettingsController.check.POST.summary=检查数据库连接
DatabaseSettingsController.check.POST.description=测试草稿中的连接。passwordAction 默认为 KEEP；SET 须传非空 password，CLEAR 会清除草稿密码。测试不会保存设置。
DatabaseSettingsController.check.POST.success=数据库连接。
DatabaseSettingsController.preview.POST.summary=预览数据库迁移
DatabaseSettingsController.preview.POST.description=检查草稿的迁入目标并返回逐库计划。确认 ready、目标与需重建对象后，将本次预览的 token 传给 migrations。
DatabaseSettingsController.preview.POST.success=数据库迁移。
DatabaseSettingsController.start.POST.summary=提交数据库迁移任务
DatabaseSettingsController.start.POST.description=提交已确认预览的 token 以启动迁移并请求进程重启。202 返回迁移状态；后续查询 GET /api/settings/database/migration。
DatabaseSettingsController.start.POST.success=数据库迁移任务。
MigrationController.migrate.POST.summary=执行JSON 到 SQLite 的迁移
MigrationController.migrate.POST.description=本机请求同步执行旧版 JSON 迁移，处理结束后返回结果。
MigrationController.migrate.POST.success=JSON 到 SQLite 的迁移。
MigrationController.migrateWithProgress.GET.summary=执行旧版 JSON 迁移并订阅进度
MigrationController.migrateWithProgress.GET.description=本机打开此 SSE 流会启动一次迁移。处理期间逐条推送进度；需要执行迁移时才连接。
MigrationController.migrateWithProgress.GET.success=JSON 到 SQLite 的迁移进度。
