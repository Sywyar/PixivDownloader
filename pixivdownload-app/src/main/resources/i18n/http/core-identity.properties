SetupController.status.GET.summary=查看安装初始化状态
SetupController.status.GET.description=读取初始化是否完成、当前模式和页数限制，供首次打开应用时判断下一步。
SetupController.status.GET.success=安装初始化状态。
SetupController.init.POST.summary=初始化应用安装
SetupController.init.POST.description=从本机为尚未初始化的安装创建管理员账户。已完成初始化的实例应调用登录接口。
SetupController.init.POST.success=已初始化应用安装。
SetupController.login.POST.summary=创建管理员登录会话
SetupController.login.POST.description=验证用户名和密码后建立管理员会话并设置 Cookie。rememberMe 开启时浏览器 Cookie 可保留 30 天。
SetupController.login.POST.success=已创建管理员登录会话。
SetupController.logout.POST.summary=关闭当前登录会话
SetupController.logout.POST.description=撤销当前请求携带的管理员或受邀请访客会话，并清除相应的会话 Cookie。
SetupController.logout.POST.success=已关闭当前登录会话。
SetupController.check.GET.summary=检查当前登录会话
SetupController.check.GET.description=检查当前请求是否具有有效的管理员登录会话，返回相应的布尔状态。
SetupController.check.GET.success=当前登录会话。
