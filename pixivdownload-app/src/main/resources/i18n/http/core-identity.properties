title=初始化与登录
OnboardingController.completeStep.POST.summary=完成引导步骤
OnboardingController.completeStep.POST.description=从本机将 stepId 标为已完成。标识以小写字母开头，可由小写字母、数字及分隔段的点或连字符组成。
