title=初期設定とログイン
OnboardingController.completeStep.POST.summary=初期設定のステップを完了
OnboardingController.completeStep.POST.description=ローカルから stepId を完了にします。小文字で開始し、小文字と数字の区切りにピリオドまたはハイフンを使えます。
OnboardingController.completeStep.POST.success=初期設定のステップ。
OnboardingController.getProfile.GET.summary=初期設定プロファイルを取得
OnboardingController.getProfile.GET.description=アプリ内で管理者に表示する呼び名 displayName を返します。
OnboardingController.getProfile.GET.success=初期設定プロファイル。
OnboardingController.updateProfile.POST.summary=初期設定プロファイルを保存
OnboardingController.updateProfile.POST.description=displayName を最大 40 文字で保存します。null または空白で呼び名を消去できます。
OnboardingController.updateProfile.POST.success=初期設定プロファイルを保存しました。
OnboardingController.connectivity.GET.summary=初期設定時のネットワーク接続を確認
OnboardingController.connectivity.GET.description=ダウンロード開始前にサーバーから Pixiv への接続を確認できます。
OnboardingController.connectivity.GET.success=初期設定時のネットワーク接続。
SetupController.status.GET.summary=インストールの初期設定状況を取得
SetupController.status.GET.description=初期設定の完了状態、現在のモード、ページ制限を取得します。
SetupController.status.GET.success=インストールの初期設定状況。
SetupController.init.POST.summary=アプリの初期設定を初期化
SetupController.init.POST.description=未設定のインストールでローカルから管理者アカウントを作成します。設定済みならログインを使います。
SetupController.init.POST.success=アプリの初期設定を初期化しました。
SetupController.login.POST.summary=管理者セッションを作成
SetupController.login.POST.description=ユーザー名とパスワードを検証して管理者セッションの Cookie を設定します。rememberMe では Cookie を 30 日間保持できます。
SetupController.login.POST.success=管理者セッションを作成しました。
SetupController.logout.POST.summary=現在のログインセッションを終了
SetupController.logout.POST.description=現在の管理者または招待ゲストのセッションを失効させ、該当 Cookie を消去します。
SetupController.logout.POST.success=現在のログインセッションを終了しました。
SetupController.check.GET.summary=現在のログインセッションを確認
SetupController.check.GET.description=この要求の管理者ログインセッションが有効かどうかを返します。
SetupController.check.GET.success=現在のログインセッション。
parameter.stepId=初期設定ステップの ID。
