title=メンテナンス
BackfillController.defaults.GET.summary=補完処理の初期設定を取得
BackfillController.defaults.GET.description=補完処理の既定の間隔、件数上限、試行モード、ネットワーク設定を返します。
BackfillController.defaults.GET.success=補完処理の初期設定。
BackfillController.candidates.POST.summary=補完対象の作品の件数を取得
BackfillController.candidates.POST.description=補完タスクを始める前に、指定条件に合う作品数を確認できます。
BackfillController.candidates.POST.success=対象作品の件数。
BackfillController.start.POST.summary=作品の補完タスクを開始
BackfillController.start.POST.description=artworkIds で指定したイラストの作者、タグ、シリーズなどを補完します。POST /api/tools/backfill/candidates で件数を確認し、dryRun で試行できます。202 の後は Location で進捗を確認します。 同時に実行できるのは 1 件です。終了後は最長 1 時間、直近 64 件まで元の Location から結果を取得できます。期限切れ、件数超過による削除、サーバー再起動の後は GET /api/tools/backfill/tasks/{id} が 404 を返します。
BackfillController.start.POST.success=作品の補完タスク。
BackfillController.current.GET.summary=実行中の補完タスクを取得
BackfillController.current.GET.description=最後に開始したタスクの状態または最終結果を返します。一度も開始していない場合は 204 を返します。
BackfillController.current.GET.success=実行中の補完タスク。
BackfillController.status.GET.summary=補完タスクの進捗を取得
BackfillController.status.GET.description=同時に実行できるのは 1 件です。終了後は最長 1 時間、直近 64 件まで元の Location から結果を取得できます。期限切れ、件数超過による削除、サーバー再起動の後は GET /api/tools/backfill/tasks/{id} が 404 を返します。
BackfillController.status.GET.success=補完タスクの進捗。
BackfillController.cancel.POST.summary=補完タスクをキャンセル
BackfillController.cancel.POST.description=指定 ID のタスクの取消を要求します。保存期間中の終了済みタスクなら、その最終結果を返し、実行中の別タスクは継続します。
BackfillController.cancel.POST.success=補完タスク。
StartupCacheController.status.GET.summary=起動キャッシュの状態を取得
StartupCacheController.status.GET.description=available は学習サービスの有無、task は現在の状態を示します。
StartupCacheController.status.GET.success=起動キャッシュの状態。
StartupCacheController.start.POST.summary=起動キャッシュの学習を開始
StartupCacheController.start.POST.description=空の JSON オブジェクト {} で学習を開始します。202 は executionId を返し、サービスが利用できない場合は 503 です。
StartupCacheController.start.POST.success=起動キャッシュの学習。
StartupCacheController.cancel.POST.summary=起動キャッシュの学習をキャンセル
StartupCacheController.cancel.POST.description=開始時の executionId を指定します。一致する実行の取消受付は 202、不一致は 409 です。
StartupCacheController.cancel.POST.success=起動キャッシュの学習。
MaintenanceController.status.GET.summary=メンテナンスの状態を取得
MaintenanceController.status.GET.description=ローカルから保守の有効・一時停止状態、前回の開始・終了時刻とトリガーを取得します。
MaintenanceController.status.GET.success=メンテナンスの状態。
MaintenanceController.run.POST.summary=メンテナンスタスクを実行
MaintenanceController.run.POST.description=ローカルから保守を手動実行します。started は新たに開始したかを示し、保守が無効なら 503 です。
MaintenanceController.run.POST.success=メンテナンスタスク。
