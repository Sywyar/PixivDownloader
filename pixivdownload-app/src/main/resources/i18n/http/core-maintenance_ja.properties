StartupCacheController.cancel.POST.response.409=指定した ID は実行中の起動キャッシュタスクに一致しません。
BackfillController.response.400=補完パラメーターが無効です。タスクの開始と候補件数の取得では delayMs と limit に 0 以上の整数を指定します。照会とキャンセルではパスの id に UUID を指定します。
BackfillController.response.409=バックフィルまたはデータベース移行がすでに実行中です。
BackfillController.response.404=この ID の実行中または保存済みタスクはありません。終了済みの結果は期限切れ、件数超過、再起動で失われます。
BackfillController.response.503=バックフィルサービスまたは対象データベースを利用できません。
MaintenanceController.response.503=メンテナンス機能が無効なため実行を開始できません。
