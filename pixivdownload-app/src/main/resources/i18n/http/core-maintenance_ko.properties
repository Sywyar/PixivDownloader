title=유지 관리
BackfillController.defaults.GET.summary=보완 작업 기본 옵션 조회
BackfillController.defaults.GET.description=보완 작업의 기본 간격, 항목 수 제한, 시험 실행 및 네트워크 옵션을 반환합니다.
BackfillController.defaults.GET.success=보완 작업 기본 옵션.
BackfillController.candidates.POST.summary=보완 대상 작품 수 조회
BackfillController.candidates.POST.description=보완 작업을 시작하기 전에 지정 조건과 일치하는 작품 수를 확인합니다.
BackfillController.candidates.POST.success=조건에 맞는 작품 수입니다.
BackfillController.start.POST.summary=작품 보완 작업 시작
BackfillController.start.POST.description=artworkIds로 지정한 일러스트의 작가, 태그, 시리즈 등을 보충합니다. POST /api/tools/backfill/candidates 로 건수를 확인하고 dryRun으로 미리 실행할 수 있습니다. 202 응답 후 Location에서 진행 상황을 확인하세요. 한 번에 한 작업만 실행합니다. 완료 후 최대 1시간 동안 최근 결과 64개를 원래 Location에서 조회할 수 있습니다. 보관 기한이나 건수 한도를 넘거나 서버가 재시작되면 GET /api/tools/backfill/tasks/{id}가 404를 반환합니다.
BackfillController.start.POST.success=작품 보완 작업.
BackfillController.current.GET.summary=현재 보완 작업 조회
BackfillController.current.GET.description=가장 최근에 시작한 작업의 진행 상태 또는 최종 결과를 반환합니다. 실행한 작업이 없으면 204를 반환합니다.
BackfillController.current.GET.success=현재 보완 작업.
BackfillController.status.GET.summary=보완 작업 진행률 조회
BackfillController.status.GET.description=한 번에 한 작업만 실행합니다. 완료 후 최대 1시간 동안 최근 결과 64개를 원래 Location에서 조회할 수 있습니다. 보관 기한이나 건수 한도를 넘거나 서버가 재시작되면 GET /api/tools/backfill/tasks/{id}가 404를 반환합니다.
BackfillController.status.GET.success=보완 작업 진행률.
BackfillController.cancel.POST.summary=보완 작업 취소
BackfillController.cancel.POST.description=지정한 ID의 작업 취소를 요청합니다. 이미 완료되어 보관 중인 작업이면 기존 최종 결과를 반환하며 실행 중인 다른 작업은 계속 진행됩니다.
BackfillController.cancel.POST.success=보완 작업.
StartupCacheController.status.GET.summary=시작 캐시 상태 조회
StartupCacheController.status.GET.description=available은 훈련 서비스 제공 여부이고 task는 현재 상태입니다.
StartupCacheController.status.GET.success=시작 캐시 상태.
StartupCacheController.start.POST.summary=시작 캐시 학습 시작
StartupCacheController.start.POST.description=빈 JSON 객체 {}를 보내 훈련을 시작합니다. 202 응답에 executionId가 있으며 서비스가 없으면 503을 반환합니다.
StartupCacheController.start.POST.success=시작 캐시 학습.
StartupCacheController.cancel.POST.summary=시작 캐시 학습 취소
StartupCacheController.cancel.POST.description=시작할 때 받은 executionId를 보냅니다. 실행이 일치하면 취소 요청에 202를, 일치하지 않으면 409를 반환합니다.
StartupCacheController.cancel.POST.success=시작 캐시 학습.
MaintenanceController.status.GET.summary=유지 관리 작업 상태 조회
MaintenanceController.status.GET.description=로컬에서 활성화와 일시 정지 여부, 최근 시작·종료 시각 및 실행 주체를 조회합니다.
MaintenanceController.status.GET.success=유지 관리 작업 상태.
MaintenanceController.run.POST.summary=유지 관리 작업 실행
MaintenanceController.run.POST.description=로컬에서 유지 관리를 수동 실행합니다. started는 새 실행 시작 여부이며, 비활성 상태이면 503입니다.
MaintenanceController.run.POST.success=유지 관리 작업.
