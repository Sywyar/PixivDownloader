title=수집 자격 증명
AcquisitionCredentialsController.read.GET.summary=수집 자격 증명 목록 조회
AcquisitionCredentialsController.read.GET.description=현재 revision과 각 항목의 id, name, enabled를 조회합니다. 수정 시 해당 revision을 보냅니다. 응답에는 secret이 없습니다.
AcquisitionCredentialsController.read.GET.success=수집 자격 증명 목록.
AcquisitionCredentialsController.save.PUT.summary=수집 자격 증명 설정 저장
AcquisitionCredentialsController.save.PUT.description=entries로 전체 목록을 교체하므로 생략한 항목은 삭제됩니다. 기존 id의 secret을 비우면 이전 값이 유지되고 새 id에는 secret이 필요합니다. 409이면 revision을 다시 조회하세요.
AcquisitionCredentialsController.save.PUT.success=수집 자격 증명 설정을 저장했습니다.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Update.field.revision=마지막으로 읽은 버전입니다. 충돌하면 다시 조회한 뒤 제출하세요.
AcquisitionCredentialsController.save.PUT.body=자격 증명 항목과 편집 전에 읽은 버전입니다.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.id=호출자가 정하는 라이브러리 내 고유 ID. ASCII 영숫자와 하이픈 1~64자로 지정합니다.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.id=호출자가 정하는 라이브러리 내 고유 ID. ASCII 영숫자와 하이픈 1~64자로 지정합니다.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.name=비어 있지 않은 표시 이름, 최대 80 UTF-16 코드 단위.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.name=비어 있지 않은 표시 이름, 최대 80 UTF-16 코드 단위.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.enabled=활성 항목만 ID로 선택해 수집에 사용할 수 있습니다.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.enabled=활성 항목만 ID로 선택해 수집에 사용할 수 있습니다.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.secret=새 ID에는 ASCII 제어 문자가 없는 비어 있지 않은 자격 증명(최대 16,384 UTF-16 코드 단위)이 필요합니다. 기존 ID에 빈 값이나 null을 보내면 이전 값을 유지합니다. 조회는 메타데이터만 반환합니다.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Update.field.entries=교체할 전체 목록으로 최대 8개입니다. 빈 배열은 목록을 비우고, 누락한 기존 항목은 삭제합니다.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Snapshot.field.entries=저장 순서대로 나열한 항목 ID, 이름 및 활성 상태.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Snapshot.field.revision=다음 저장에 이 리비전을 그대로 보냅니다.
AcquisitionCredentialsController.save.PUT.response.409=인증 정보 라이브러리의 리비전이 바뀌었습니다. 최신 스냅샷을 읽은 후 변경을 제출합니다.
AcquisitionCredentialsController.save.PUT.response.413=제출한 인증 정보 라이브러리가 본문 크기 제한을 초과합니다.
description=작품 수집용 자격 증명 목록을 조회하고 갱신합니다.
