schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.title=該任務公開的作品或任務顯示標題。 提供者尚未給出標題時使用 workId。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.phase=此執行嘗試目前的生命週期階段。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.updatedAt=任務最近更新的 ISO 8601 時間。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.revision=同一 epoch 內所有工作共用一個計數器。此值是工作最近一次變更時的計數，封存查詢回傳 0。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.failureReason=執行器回報的失敗原因代碼，無特定原因時為空。 選頁來源、頁數、目錄或輸出設定變更時會傳回 OUTPUT_LAYOUT_CONFLICT。省略 pages 即可重新下載整部作品。OUTPUT_ALREADY_REGISTERED 表示完整作品已在作品庫中。 `WORK_NOT_FOUND` 表示送出工作時，以目前身分在來源網站找不到指定的作品。 提交遭拒時，即使 phase 為 FAILED，此欄位也可能為 null。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.outputPath=這次執行在伺服器上的絕對輸出目錄。插畫和小說會在排入佇列前決定目錄，等候時檔案可能尚未寫入。準備中、提供者未回報目錄，或舊回執未記錄目錄時為 null。作品移動後，這裡仍保留執行當時的目錄。
parameter.X-Acquisition-Credential=可選的臨時採集憑據，由所選下載處理器使用。最多 16384 個字元。
DownloadTasksController.submit.POST.response.400=命令無法剖析、缺少必填欄位、選項超過共用限制，或臨時擷取憑證過長。 若 workType 沒有已發布的提交提供者，會回傳 DOWNLOAD_TASK_UNSUPPORTED_WORK_TYPE，且不會建立工作。請選擇 x-download-submissions 中的類型；queueType 是佇列識別碼。 能識別輸入錯誤時，field 是請求本文中的 JSON Pointer，reason 是穩定的原因碼。 不支援的作品類型回傳 field=/workType、reason=unsupported。
DownloadTasksController.submit.POST.response.409=下載提交發生衝突，例如已使用相同 requestId 提交其他內容。
DownloadTasksController.submit.POST.response.413=請求體超過 128 KiB。
DownloadTasksController.submit.POST.response.404=WORK_NOT_FOUND — 以目前身分查詢作品中繼資料時，來源回報找不到作品。請核對作品 ID 和可見範圍。 已登記的嘗試會以 FAILED 出現在工作清單與歷程中。 首次錯誤回應不含 attemptId 或 Location。工作結束超過 5 分鐘且結果儲存成功後，冪等記錄即可到期。目前程序仍保留記錄時，同一呼叫者以相同的 requestId 重送原命令，可取得原工作的 202 回執（duplicate=true）。到期後重試會建立新的嘗試。
DownloadTasksController.submit.POST.response.422=提供者或受理規則拒絕執行，例如選項值超出所選類型允許的範圍。 已登記的嘗試會以 FAILED 出現在工作清單與歷程中。 首次錯誤回應不含 attemptId 或 Location。工作結束超過 5 分鐘且結果儲存成功後，冪等記錄即可到期。目前程序仍保留記錄時，同一呼叫者以相同的 requestId 重送原命令，可取得原工作的 202 回執（duplicate=true）。到期後重試會建立新的嘗試。 能識別輸入錯誤時，field 是請求本文中的 JSON Pointer，reason 是穩定的原因碼。 內建提供方的欄位原因包括 unknown_property, duplicate, invalid_format, invalid_value, not_applicable, out_of_range, too_large；擴充套件可以回傳其他原因。
DownloadTasksController.submit.POST.response.503=處理器或佇列暫不可用，或任務容量已滿。 登記前失敗不會建立工作。登記後失敗可能留下 FAILED 記錄，可在冪等記錄保留期間重送相同命令以取得回執。
DownloadQueueController.cancelDownload.POST.response.409=排隊項的處理器標識已失效，或處理器不支援取消。請從當前佇列讀取最新標識和能力。
DownloadTasksController.cancel.POST.response.409=任務存在，但其處理器不支援取消當前執行。
DownloadTasksController.find.GET.response.404=當前呼叫方可訪問的任務中沒有此 taskId。
DownloadTasksController.cancel.POST.response.404=當前呼叫方可訪問的任務中沒有此 taskId。
DownloadTasksController.submit.POST.details=**提交。** 管理員可提交工作。程式金鑰需要 `core:downloads.create` 及所選類型的 `x-program-permission`。請傳送 JSON 物件，`options` 的鍵和值均為字串，沒有選項時傳 `{}`。請求本文最多 128 KiB，選項最多 32 項，鍵和值的 UTF-8 總長度最多 16 KiB。擷取憑證放在請求標頭中。`X-Acquisition-Credential` 與參照已儲存憑證的 `X-Acquisition-Credentials` 只能擇一，程式金鑰使用後者還需要 `core:credentials.use`。 請傳送單一 JSON 物件。重複鍵、物件後多餘的內容及超過四層的巢狀結構都會遭拒。提供者的輸入驗證失敗時回傳 422 `DOWNLOAD_TASK_REJECTED`。啟用的受理規則可拒絕工作，選項擴充可調整檔名範本與輸出格式。\n\n\
    **重試。** 同一呼叫身分在目前行程的保留期間內，使用相同的 `requestId`、作品類型、作品 ID、選項及實際主要擷取憑證，會取得原工作及 `duplicate=true`。變更內容後重用 ID 會收到 409。查詢既有工作請使用 `task.attempt.attemptId`；變更選頁、重建或重新執行失敗的工作時，請使用新的 `requestId`。終態結果儲存後，冪等記錄可在工作結束五分鐘後清除。重新啟動後可查詢已儲存的終態，工作不會自動重新執行。\n\n\
    **受理與完成。** 提供者可在回應前向上游取得並驗證作品。請求格式無效回傳 400，本文超過上限回傳 413。提供者或受理規則拒絕時可回傳 422，提供者、資料庫或工作容量無法使用時可回傳 503。收到 202 後，以 `core:downloads.read` 輪詢 `Location`，查看 `phase` 和 `failureReason`。工作可能已經結束。`CREDENTIALS_UNAVAILABLE` 表示執行期間選用的擷取憑證無法使用。以 `core:downloads.cancel` 呼叫 `POST /api/download/tasks/{taskId}/cancel` 後仍須查詢終態。程式金鑰只能查詢及取消對其可見的工作。 插畫與小說會在排入佇列前決定伺服器上的絕對輸出目錄 `task.outputPath`。等候時目錄可能尚未建立。若在綁定佇列前遭拒，`queueType` 為空字串，`task.outputPath` 為 null。422 或 404 `WORK_NOT_FOUND` 回應不含工作 ID，但工作清單與歷程會記錄這次失敗。在保留期間重送相同命令可取得該工作的 202 回執。找不到作品時 `failureReason` 為 `WORK_NOT_FOUND`。
description=提交下載、追蹤每次嘗試並查詢已結束的任務。
DownloadTasksController.history.GET.parameter.limit=每次傳回 1–200 筆，超出範圍傳回 400。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.progress=本次執行最近一次量得的進度。提供方尚未回報或舊封存未記錄時為 null。步驟達到總量後仍須檢查 phase 判斷任務是否成功。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.description=提供方對單一步驟的計數。切換步驟時，單位與總量可能改變。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.unit=PAGES 表示作品頁，IMAGES 表示圖像，BYTES 表示位元組。小說分別回報已處理的插圖和已傳輸的封面位元組。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.completed=此步驟已處理的數量，範圍為 0 到 total。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.total=以相同單位表示的步驟總量，大於零。
