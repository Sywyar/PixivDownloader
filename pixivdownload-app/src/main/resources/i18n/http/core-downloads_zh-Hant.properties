DownloadQueueController.rejectLegacyCancel.POST.parameter.artworkId=舊網址中的作品識別碼。伺服器不解析此值。
DownloadQueueController.rejectLegacyCancel.POST.description=此舊網址固定回傳 409。有工作 UUID 時請使用 POST /api/download/tasks/{taskId}/cancel。只有提供者已給出佇列項目的鍵及發布身分時，才使用 POST /api/download/queue/{queueType}/cancel。
DownloadQueueController.rejectLegacyCancel.POST.success=舊版無佇列標識的取消請求。
DownloadQueueController.cancelDownload.POST.summary=取消指定佇列中的下載
DownloadQueueController.cancelDownload.POST.description=若已從佇列提供者取得 workKey，請原樣傳入，並從 GET /api/download/extensions 讀取同一次發布的識別資訊作為 owner。程式用戶端也可從 GET /api/download/tasks 的可見任務讀取 attempt.attemptId，將其作為 taskId 呼叫 POST /api/download/tasks/{taskId}/cancel。
DownloadQueueController.cancelDownload.POST.success=指定佇列中的下載。
DownloadQueueController.clearDownloadQueue.POST.summary=清除下載佇列
DownloadQueueController.clearDownloadQueue.POST.description=清理當前呼叫者可管理的排隊任務，並返回處理結果。
DownloadQueueController.clearDownloadQueue.POST.success=已清除下載佇列。
DownloadTasksController.submit.POST.summary=提交下載任務
DownloadTasksController.submit.POST.description=從本操作的請求結構選取已啟用的 workType，依範例填寫 workId 和 options。也可在文件頂層 x-download-submissions 依類型查找結構和該提供者要求的程式權限。重試相同命令時重用 requestId。更改內容後沿用同一 ID 會衝突。202 回覆包含可供輪詢的任務 ID。 可直接輪詢 202 回應的 Location。路徑參數 taskId 取回執的 task.attempt.attemptId。 同一呼叫身分在目前程序仍保有冪等記錄時，以相同 `requestId` 重試相同命令可取得原回執。終態結果儲存後，冪等記錄可在任務結束五分鐘後到期，再次提交可能建立新任務。
DownloadTasksController.submit.POST.success=重複提交已登記的工作也會回傳 202。用 task.attempt.attemptId 查詢同一次嘗試。若在排入佇列前失敗，task.outputPath 可為 null。
DownloadTasksController.snapshot.GET.summary=列出當前下載任務
DownloadTasksController.snapshot.GET.description=返回撥用者可見的任務快照、程序 epoch 和 revision。程序重啟後 epoch 會改變。 重新啟動後可在 GET /api/download/tasks/history 分頁查詢已封存的終態任務。
DownloadTasksController.snapshot.GET.success=當前下載任務。
DownloadTasksController.find.GET.summary=檢視下載任務詳情
DownloadTasksController.find.GET.description=outputPath 是這次執行的輸出目錄。 使用提交回執中的任務 UUID 查詢執行狀態。該身份查不到任務時返回 404。 整部插畫下載完成後，用 attempt.workId 呼叫 GET /api/library/artworks/{artworkId}（core:library.read）。移動過的作品看 moveFolder，其餘看 folder。按頁取檔案用 GET /api/downloaded/rawfile/{artworkId}/{page}（core:assets.export，頁碼從 0 開始）。 選頁尚未湊齊整部作品時，用 GET /api/library/artworks/{artworkId}/partial 查詢已寫入的頁面和目錄。 建議每 2 秒讀取一次。`revision` 持續不變時逐步延長至 10 秒，有更新時恢復到 2 秒。`phase` 為 `COMPLETED`、`FAILED` 或 `CANCELLED` 時停止。收到 `Retry-After` 時，至少等候指定時間再請求。
DownloadTasksController.find.GET.success=下載任務詳情。
DownloadTasksController.history.GET.summary=列出已儲存的任務歷史
DownloadTasksController.history.GET.description=limit 為 1–200，預設 50。首頁省略遊標；下一頁原樣傳回 beforeTime 和 beforeId，兩者必須成對。 重新啟動後可在 GET /api/download/tasks/history 分頁查詢已封存的終態任務。
DownloadTasksController.history.GET.success=已儲存的任務歷史。
DownloadTasksController.cancel.POST.summary=取消下載任務
DownloadTasksController.cancel.POST.description=按任務 UUID 請求取消。REQUESTED 表示已申請，TERMINAL 表示已結束；任務不可取消時返回 409。請從 GET /api/download/tasks 取得 attempt.attemptId 作為 taskId。若提供者給出的是 workKey 和發布身分，請使用 POST /api/download/queue/{queueType}/cancel。
DownloadTasksController.cancel.POST.success=下載任務。
DownloadQueueController.rejectLegacyCancel.POST.response.409=需要指定佇列。請使用對應佇列的取消介面。
parameter.taskId=使用提交回條的 task.attempt.attemptId，任務網址也可從 Location 取得。
parameter.queueType=條目所屬佇列釋出的型別。
parameter.beforeTime=與 beforeId 一併傳回上頁的 beforeTime，保留小數秒精度。
parameter.beforeId=上一頁末項的嘗試 UUID，與 beforeTime 一併提供。
