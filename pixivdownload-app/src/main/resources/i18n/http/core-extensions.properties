filter.prepare.summary=准备目标 HTTP 操作的钩子
filter.prepare.description=以目标操作的身份和权限检查同一服务上的请求，不执行目标操作。只需解析端点时设 resolveOnly=true。收到 HOOK_CHALLENGE 后，保留用户 Cookie，将同一请求连同 token 和以钩子 ID 为键的 proofs 再次提交。收到 HOOK_READY 后，用 X-Pixiv-Hook-Ticket 将令牌交给实际目标请求；原生表单可用 nativeSubmit 的 Cookie。
filter.HookPreparation=描述待匹配的目标请求，以及本次要提交的挑战证明。
filter.HookPreparation.method=目标路由实际使用的大写 HTTP 方法。
filter.HookPreparation.url=以 / 起始的同服目标路径，可含查询串。禁止主机名、片段和准备接口本身。
filter.HookPreparation.headers=目标路由匹配所用请求头，最多 16 项，每值最多 1024 字符且不能含控制字符。头名不分大小写，仅接受 Accept、Content-Type 或 X- 开头的名称（最多 96 个字母、数字或连字符）。X-Forwarded-、X-Pixiv-、X-Real- 前缀及含 token、key、auth、cookie 的名称不可用。
filter.HookPreparation.json=以操作绑定声明的 JSON Pointer 为键传递原始字段值，最多 256 项，每键最多 256 字符。
filter.HookPreparation.parameters=表单字段名映射到非空字符串数组。目标 Content-Type 须为 application/x-www-form-urlencoded 或 multipart/form-data。查询串和表单合计最多 128 个值。
filter.HookPreparation.token=响应中的挑战令牌。首次准备时省略，提交证明时与原目标一同发送。
filter.HookPreparation.proofs=以 challenges 返回的钩子 ID 为键提交提供方要求的证明字符串，须携带 token。最多 16 项，每值最多 16384 字符，合计最多 64 KiB UTF-8。
filter.HookPreparation.nativeSubmit=设为 true，在成功暂存证明后通过 Cookie 为同一目标的原生表单提交签发一次性票据。
filter.HookPreparation.resolveOnly=仅匹配目标端点，返回 HOOK_RESOLVED 和 endpoint。
filter.HookTargetMatch=仅解析目标时返回的匹配结果。
filter.HookPreparationResult=钩子批准、挑战、证明暂存或拒绝的结果。
filter.HookTargetMatch.code=目标匹配成功时为 HOOK_RESOLVED。
filter.HookTargetMatch.endpoint=已匹配的目标 HTTP 端点 ID。
filter.HookTargetMatch.invoked=准备请求返回 false，业务操作尚未执行。
filter.HookPreparationResult.invoked=准备请求返回 false，业务操作尚未执行。
filter.HookPreparationResult.code=机器可读的 HOOK_ 结果码。客户端据此区分已批准、需要挑战、已就绪及失败。
filter.HookPreparationResult.error=失败时的本地化说明，成功时为空字符串。
filter.HookPreparationResult.token=发生挑战时签发、证明就绪时返回的令牌。其余情形可为空。
filter.HookPreparationResult.revision=用于处理本次准备请求的发布修订标识，无法取得时为空。
filter.HookPreparationResult.challenges=以钩子 ID 为键的挑战字符串。使用相同的键提交对应证明。
filter.prepare.200=已匹配目标（HOOK_RESOLVED）、准备通过（HOOK_APPROVED）或证明已暂存（HOOK_READY）。
filter.prepare.400=不能用所给方法、路径、头及字段匹配有效目标请求。
filter.prepare.401=目标操作需要有效的登录会话或其支持的程序密钥。
filter.prepare.403=准备请求本身未通过 CSRF 来源校验时返回 FORBIDDEN。目标授权或操作钩子校验也可拒绝请求。
filter.prepare.409=HOOK_CHALLENGE 表示须提交证明。HOOK_STALE 或 HOOK_TARGET_STALE 表示目标或令牌已变化，需重新准备。
filter.prepare.413=准备请求超过 512 KiB。
filter.prepare.429=准备请求过于频繁，或并发准备数达到上限。
filter.prepare.503=钩子提供方或目标操作当前不可用。
filter.X-Acquisition-Credentials=用逗号依优先顺序列出 1 至 8 个凭据库 ID，不可重复。需管理员身份或 core:credentials.use。每个 ID 必须已启用。此头与 X-Acquisition-Credential 互斥。
filter.X-Pixiv-Page-Publication=由页面发起请求时，可附上该页面的发布令牌校验目标路由归属。发布过期或目标不匹配返回 409。
filter.pagePublication=页面请求无法设置 X-Pixiv-Page-Publication 时使用的查询参数。头和参数同时存在时使用头。
filter.X-Pixiv-Ui-Publication=已发布 UI 插槽发起请求时，发送插槽提供的 publication 令牌。插槽版本已撤回时返回 409。
filter.uiPublication=插槽加载所属插件资源时可传的发布令牌查询参数。服务会核对资源归属；X-Pixiv-Ui-Publication 头优先。
filter.X-Pixiv-Hook-Ticket=请求目标曾返回 HOOK_CHALLENGE 时，向同一目标提交 HOOK_READY 返回的一次性令牌。保留准备请求的用户 Cookie。
schema.top.sywyar.pixivdownload.plugin.web.controller.OperationHooksController.Failure.field.code=钩子配置失败的机器可读原因码。
filter.X-Pixiv-Hook=钩子处理器发出的结果标识，如 READY 或 CHALLENGE。仅端点解析成功的响应不携带此头。
filter.prepare.access=准备请求遵循目标接口的准入条件。目标允许匿名时可匿名准备；其他情况下沿用外层请求中该目标支持的会话、GUI 凭据或程序密钥。浏览器需满足同源写入条件。
parameter.page=已发布 Web 页面的标识，与页面发布目录中的页面键一致。
filter.credentials.400=X-Acquisition-Credentials 格式无效、重复发送或与原始凭据头同时使用。
filter.credentials.403=调用方无权使用 X-Acquisition-Credentials 选择凭据库条目。
filter.credentials.503=无法读取凭据库，或选定的凭据已停用或不存在。
filter.csrf.origin=CSRF 来源校验。发送服务的源，例如 https://server.example:8443，协议、主机和有效端口须与请求一致。携带会话、邀请或访客 Cookie 时，须提供同源 Origin 或 Referer。浏览器来源信号也须同源，采集接口为受信脚本声明的来源除外。仅用 Bearer 密钥且没有这些 Cookie 或浏览器来源头的程序客户端可省略两者。
filter.csrf.explicit=此写操作始终检查 CSRF 来源，使用 Bearer 密钥的程序也须发送同源 Origin 或 Referer。Origin 值为服务的协议、主机和有效端口，例如 https://server.example:8443。
filter.csrf.referer=缺少 Origin 时，可发送与服务同源的页面 URL 作为 Referer。若已发送 Origin，CSRF 校验优先使用它。
filter.csrf.error=宿主 CSRF 过滤器拒绝请求时，JSON 错误码为 {code}。
description=查看已注册的网页扩展、操作钩子与页面发布目标。
