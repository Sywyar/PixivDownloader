title=程式金鑰
ApiReferenceController.document.GET.summary=讀取 HTTP 介面參考文件
ApiReferenceController.document.GET.description=傳回目前已載入端點的 OpenAPI 3 文件，會隨外掛程式載入與權限宣告更新。管理員工作階段或具有此權限的程式金鑰皆可讀取；未驗證的請求會收到說明所需權限的 401 回應。 伺服器按語言快取產生的目錄。路由、相關提供者或執行個體的存取狀態變更後會重新產生。每次讀取都驗證權限，回應使用 private, no-store。
ApiReferenceController.document.GET.success=OpenAPI 文件。
ApiReferenceController.probe.HEAD.summary=檢查介面目錄存取權限
ApiReferenceController.probe.HEAD.description=使用與 GET 相同的憑證檢查能否讀取介面目錄，只回傳回應標頭。
ApiReferenceController.probe.HEAD.success=可讀取介面目錄。
ProgramKeysController.list.GET.summary=列出程式金鑰
ProgramKeysController.list.GET.description=列出各金鑰的 UUID、修訂號、完整授權策略、來源網路限制和傳輸策略。金鑰明文僅在建立時返回。
ProgramKeysController.list.GET.success=程式金鑰。
ProgramKeysController.desktopList.GET.summary=列出桌面端金鑰摘要
ProgramKeysController.desktopList.GET.description=列出桌面金鑰摘要，包括 ID、修訂號和許可權數量。用 ID 查詢單個金鑰即可讀取完整授權。
ProgramKeysController.desktopList.GET.success=桌面端金鑰摘要。
ProgramKeysController.desktopKey.GET.summary=檢視程式金鑰策略
ProgramKeysController.desktopKey.GET.description=按 UUID 讀取該金鑰的完整許可權和來源網路策略。修改或撤銷時使用此處的 revision。
ProgramKeysController.desktopKey.GET.success=程式金鑰策略。
ProgramKeysController.desktopPermissions.GET.summary=列出許可權顯示名稱
ProgramKeysController.desktopPermissions.GET.description=列出許可權 ID、宣告方及其本地化名稱。建立或編輯金鑰時將選定的許可權 ID 填入 permissions。
ProgramKeysController.desktopPermissions.GET.success=許可權顯示名稱。
ProgramKeysController.permissions.GET.summary=列出可授予的程式許可權
ProgramKeysController.permissions.GET.description=管理員可透過工作階段查詢可授予的權限 ID、所屬方與對應的 HTTP 方法和路徑。建立或編輯金鑰時，在 permissions 填入所需 ID。程式金鑰無法呼叫此目錄；個別金鑰已獲授的權限記錄在其策略中。
ProgramKeysController.permissions.GET.success=可授予的程式許可權。
ProgramKeysController.createFromGui.POST.summary=建立程式金鑰
ProgramKeysController.createFromGui.POST.description=建立金鑰並一次性返回明文。permissions 取自許可權目錄。anyIp 為 true 時 networks 必須為空，否則至少填寫一個 IP 地址或 CIDR 網段。
ProgramKeysController.createFromGui.POST.success=已建立程式金鑰。
ProgramKeysController.create.POST.summary=建立程式金鑰
