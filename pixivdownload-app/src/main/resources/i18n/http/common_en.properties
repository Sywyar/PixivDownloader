permissionGrammar.description=This catalog defines the conditions published in an operation’s `x-program-permissions`. Resolve them against the request, target resource and execution plan. The operation description may document additional business permissions.
permissionGrammar.phase.route=Full grant checked at the current HTTP method and path, also published as `x-program-permission`. A valid key missing this grant receives an HTTP 403 identifying it.
permissionGrammar.phase.discovery=Use the indicated `permission` to call `operation` for inputs such as the current source token. A missing grant is reported by that lookup.
permissionGrammar.phase.submit=Additional checks for the current request. All applicable entries must be satisfied. An entry with `effect: filter` controls list visibility. Other denials are reported as specified by `reportedIn`.
permissionGrammar.phase.execution=After acceptance the batch worker rechecks the source grant and checks the executors selected by this run’s plan. Read the result from `reportedIn.operation`.
permissionGrammar.expression=The name before `#` selects a context below. The suffix is an RFC 6901 JSON Pointer rooted at that object. For example, `task#/sourceOwnerPluginId` reads `sourceOwnerPluginId` from the stored task. Within a field name, `~0` encodes `~` and `~1` encodes `/`.
permissionGrammar.context.request=JSON request body submitted to the current operation.
permissionGrammar.context.query=URL query parameters of the current request, keyed by parameter name.
permissionGrammar.context.task=Stored scheduled task identified by `{id}` in the current path.
permissionGrammar.context.batch=Existing manual batch identified by `{id}` in the current path. Resume and retry read the source type from this batch.
permissionGrammar.context.item=One candidate item in the list before visibility filtering.
permissionGrammar.field.permission=Complete grant ID, for example `core:credentials.use`. In `discovery` or `reportedIn` it grants access to the associated `operation`.
permissionGrammar.field.ownerFrom=Context expression that reads the owner to combine with `permissionId`.
permissionGrammar.field.permissionId=Local permission name. Join the owner resolved by `ownerFrom`, a colon, and this name to obtain a grant such as `download-workbench:schedule.manage`.
permissionGrammar.field.header=Using this request header requires the grant in the same entry’s `permission`.
permissionGrammar.field.effect=`filter` checks each candidate separately. The list request can succeed while omitting items the key cannot see.
permissionGrammar.field.catalog=Resolve the `#/…` JSON Pointer fragment from the OpenAPI document root. Select a catalog entry using exactly one of `key`, `keyFrom` or `value`, then read `field`.
permissionGrammar.field.key=Use the value of this top-level JSON request field as the catalog index.
permissionGrammar.field.keyFrom=Use the result of a context expression such as `batch#/sourceType` as the catalog index.
permissionGrammar.field.value=Use this literal value as the catalog index.
permissionGrammar.field.field=Property of the selected catalog entry containing the full grant ID, or a map of grants when `keyedBy` is present.
permissionGrammar.field.keyedBy=`workType` selects one full grant ID from the `field` map for each work type required by this run’s plan.
permissionGrammar.field.recheckField=Another property on the same catalog entry. The worker also rechecks the full source grant stored there, for example the grant in `batchSubmitPermission`.
permissionGrammar.field.reportedIn=Identifies the response to inspect. With no `operation`, read the current request’s response body. Otherwise read the indicated operation’s response body. Both `pointer` and `codePointer` start at that JSON body’s root.
permissionGrammar.field.operation=HTTP method and path template. For an accepted batch, the 202 response’s `Location` gives the concrete polling URL.
permissionGrammar.field.status=HTTP status of the indicated response. A polling response of 200 means the batch was retrieved. Its run state is in `state`.
permissionGrammar.field.pointer=RFC 6901 JSON Pointer from the response body root to the missing grant ID. A value is available when the server can identify the grant.
permissionGrammar.field.codePointer=JSON Pointer to the reason code in the same response body. For a batch, inspect `state`, then the reason code. If it is `auth.program.forbidden`, use `pointer` to read the missing grant ID when known.
parameter.Range=Byte ranges to read, such as bytes=0-99.
parameter.If-Modified-Since=Send the previous Last-Modified value to receive 304 if the file is unchanged.
response.206=Requested file bytes. Multiple ranges use multipart/byteranges with a Content-Range in each part.
header.contentRange.single=First and last byte and total file length for a single range.
parameter.If-None-Match=Send the ETag from the previous response. A matching file version returns 304.
response.304=The cached file is still current. The response has no body.
response.416=The Range cannot be served. The body is empty and Content-Range reports bytes */length.
permissionGrammar.field.when=This grant is required only when the JSON value at keyFrom equals value. When value is omitted, the grant applies if keyFrom points to a non-null value.
