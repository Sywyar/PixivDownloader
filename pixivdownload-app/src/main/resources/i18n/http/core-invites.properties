title=访客邀请
AdminInviteController.accessCheck.GET.summary=检查邀请管理权限
AdminInviteController.accessCheck.GET.description=检查当前会话能否进入访客邀请管理。
AdminInviteController.accessCheck.GET.success=邀请管理权限。
AdminInviteController.create.POST.summary=创建访客邀请
AdminInviteController.create.POST.description=创建邀请并返回 id、邀请码 code 和可分享的 url。后续管理操作使用 id。
AdminInviteController.create.POST.success=已创建访客邀请。
AdminInviteController.list.GET.summary=列出访客邀请
AdminInviteController.list.GET.description=返回邀请摘要列表。需要单个邀请的配置和详情时，通过其 id 读取详情。
AdminInviteController.list.GET.success=访客邀请。
AdminInviteController.detail.GET.summary=查看邀请详情
AdminInviteController.detail.GET.description=返回指定邀请的完整详情。路径使用管理 ID，兑换时才使用 code。
AdminInviteController.detail.GET.success=邀请详情。
AdminInviteController.update.PUT.summary=更新访客邀请
AdminInviteController.update.PUT.description=修改路径 ID 对应邀请的设置并返回修改后的详情；无需重新创建邀请码。
AdminInviteController.update.PUT.success=已更新访客邀请。
AdminInviteController.pause.POST.summary=暂停访客邀请
AdminInviteController.pause.POST.description=暂停指定邀请并保留其 ID，之后可对同一 ID 调用 resume 恢复。
AdminInviteController.pause.POST.success=已暂停访客邀请。
AdminInviteController.resume.POST.summary=恢复访客邀请
AdminInviteController.resume.POST.description=恢复已暂停的邀请，沿用原邀请码和原配置。
AdminInviteController.resume.POST.success=已恢复访客邀请。
AdminInviteController.deleteExpired.DELETE.summary=清除已过期的邀请
AdminInviteController.deleteExpired.DELETE.description=删除调用时已过期的邀请并返回实际删除数量。
AdminInviteController.deleteExpired.DELETE.success=已清除已过期的邀请。
AdminInviteController.delete.DELETE.summary=删除访客邀请
AdminInviteController.delete.DELETE.description=从访客邀请清单中移除路径 ID 指定的记录。
AdminInviteController.delete.DELETE.success=已移除访客邀请。
AdminInviteController.stats.GET.summary=查看邀请使用统计
AdminInviteController.stats.GET.description=按小时返回访问量。days 支持 1、7、30；其他值按 7 天处理。
AdminInviteController.stats.GET.success=邀请使用统计。
InviteRedeemController.redeem.POST.summary=兑换访客邀请码
InviteRedeemController.redeem.POST.description=提交 code。成功时设置访客会话 Cookie 并返回落地页，后续请求带回该 Cookie。无效邀请码返回 401。
InviteRedeemController.redeem.POST.success=访客邀请码。
parameter.days=统计覆盖的天数。
