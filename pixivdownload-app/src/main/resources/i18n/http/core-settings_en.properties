schema.top.sywyar.pixivdownload.gui.SettingsController.FieldError.field.in=The value is body when the field is in the JSON request body.
schema.top.sywyar.pixivdownload.gui.SettingsController.FieldError.field.reason=Machine-readable validation reason, such as required, type or invalid_value.
