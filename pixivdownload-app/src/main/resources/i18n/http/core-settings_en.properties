title=Application settings
SettingsController.fields.GET.summary=List editable settings
SettingsController.fields.GET.description=Returns readable field definitions, choices, owner, packageId and generation. Copy those identifiers into edits. Sensitive fields expose only whether a value is stored.
SettingsController.fields.GET.success=Editable settings.
SettingsController.presets.GET.summary=List settings presets
SettingsController.presets.GET.description=Lists readable provider presets and their sections. Use the returned values when preparing settings changes.
SettingsController.presets.GET.success=Settings presets.
SettingsController.validate.POST.summary=Validate proposed settings
SettingsController.validate.POST.description=Sends nonempty changes using owner, packageId, generation and key from GET /api/settings. Validation makes no persistent change. Submit the same draft to POST /api/settings to save it. Use KEEP and CLEAR only on sensitive fields and omit value. An all-KEEP request returns []. A mixed request returns effects only for saved keys.
SettingsController.validate.POST.success=Proposed settings.
SettingsController.save.POST.summary=Save application settings
SettingsController.save.POST.description=Saves the listed changes and returns an effect per saved key. GET /api/settings supplies the current owner, field type and choices. Use KEEP and CLEAR only on sensitive fields and omit value. An all-KEEP request returns []. A mixed request returns effects only for saved keys.
SettingsController.save.POST.success=Application settings saved.
SettingsController.save.POST.body=Configuration keys and proposed values.
SettingsController.validate.POST.body=Configuration keys and proposed values.
schema.top.sywyar.pixivdownload.plugin.api.gui.GuiConfigCondition.description=Condition evaluated against the current configuration.
schema.top.sywyar.pixivdownload.plugin.api.gui.GuiConfigCondition.field.key=Key of the setting whose current value is tested. Resolve it in the setting owner’s configuration.
schema.top.sywyar.pixivdownload.plugin.api.gui.GuiConfigCondition.field.operator=Comparison operator
schema.top.sywyar.pixivdownload.plugin.api.gui.GuiConfigCondition.field.value=String to compare for EQUALS or NOT_EQUALS. Other operators ignore this value and it may be null in the response.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Change.field.owner=Owning plugin ID, or null for host settings.
