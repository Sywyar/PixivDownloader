schema.top.sywyar.pixivdownload.gui.SettingsApiService.Preset.field.owner=Owning plugin ID, or null for host settings.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Saved.field.owner=Owning plugin ID, or null for host settings.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Change.field.packageId=Copy the package ID from the field catalog. Null for host settings.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.packageId=Copy the package ID from the field catalog. Null for host settings.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Preset.field.packageId=Copy the package ID from the field catalog. Null for host settings.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Change.field.generation=Plugin activation generation. Submit the value you read. Host fields use 0.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.generation=Plugin activation generation. Submit the value you read. Host fields use 0.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Preset.field.generation=Plugin activation generation. Submit the value you read. Host fields use 0.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Change.field.key=Setting key within its owner. The pair identifies the field.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.key=Setting key within its owner. The pair identifies the field.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Saved.field.key=Setting key within its owner. The pair identifies the field.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Change.field.action=SET (default) requires value. For a sensitive field, KEEP preserves and CLEAR removes its value. Omit value for both.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Change.field.value=String to store with SET. Sensitive values must be nonblank.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.value=Effective or default value. Always null for sensitive fields. Check stored for presence.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.groupId=Identifier of the field's configuration group.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.labelKey=Message key for the display name in namespace.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Preset.field.labelKey=Message key for the display name in namespace.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.helpKey=Message key for help text in namespace.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Preset.field.helpKey=Message key for help text in namespace.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.namespace=Provider message namespace for labels and help.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Preset.field.namespace=Provider message namespace for labels and help.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.type=Field type that determines the value format and editor.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.effect=When the saved change takes effect.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Saved.field.effect=When the saved change takes effect.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.enumValues=Allowed raw values for an enum field.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.minValue=Lower numeric bound, null if unspecified.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.maxValue=Upper numeric bound, null if unspecified.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.requiredWhen=A nonempty list makes the field required when every condition matches. An empty list imposes no conditional requirement.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.enabledWhen=The field is editable when every condition matches. An empty list imposes no condition on editing.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.visibleWhen=The field is visible when every condition matches. An empty list imposes no condition on visibility.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.sensitive=True when the server suppresses the stored and default values.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.stored=Whether a nonblank sensitive value has been saved.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.defaultValue=Provider-declared default string. Null for sensitive fields.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Field.field.enumValueLabelKeys=Map from raw enum values to display label message keys.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Preset.field.sectionId=Settings section containing the preset.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Preset.field.id=Preset ID within the section.
schema.top.sywyar.pixivdownload.gui.SettingsApiService.Preset.field.values=Map from setting keys to non-sensitive preset string values.
schema.top.sywyar.pixivdownload.gui.SettingsController.Changes.field.changes=Field edits in this save. Each owner/key pair may occur once.
schema.top.sywyar.pixivdownload.gui.SettingsController.FieldError.description=Validation failure for a specific setting.
schema.top.sywyar.pixivdownload.gui.SettingsController.FieldError.field.code=Stable code identifying the error for programmatic handling.
schema.top.sywyar.pixivdownload.gui.SettingsController.FieldError.field.error=Human-readable error message in the request language.
schema.top.sywyar.pixivdownload.gui.SettingsController.FieldError.field.owner=ID of the host or plugin that declares the setting.
schema.top.sywyar.pixivdownload.gui.SettingsController.FieldError.field.key=Key of the setting that failed validation.
schema.top.sywyar.pixivdownload.gui.SettingsController.FieldError.field.variable=Variable that caused template validation to fail. May be absent for other errors.
SettingsController.response.400=Invalid settings change or field value. Field errors identify owner and key. Template errors can also identify a variable.
SettingsController.response.409=The field owner or database configuration changed and the current settings draft cannot be applied.
