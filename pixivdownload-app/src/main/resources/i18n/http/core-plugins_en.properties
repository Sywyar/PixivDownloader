title=Plugin management
GuiPluginController.status.GET.summary=Get desktop plugin status
GuiPluginController.status.GET.description=Read a snapshot of the running installation for the control center.
GuiPluginController.status.GET.success=Desktop plugin status.
PluginManagementController.status.GET.summary=Get plugin status
PluginManagementController.status.GET.description=Inspect each plugin's lifecycle phase and available actions, including recovery mode.
PluginManagementController.status.GET.success=Plugin status.
PluginManagementController.refreshRevocations.POST.summary=Refresh the repository revocation list
PluginManagementController.refreshRevocations.POST.description=Fetch the latest revocation information for the specified repository.
PluginManagementController.refreshRevocations.POST.success=Repository revocation list refreshed.
PluginManagementController.impact.GET.summary=Preview the impact of a plugin change
PluginManagementController.impact.GET.description=Inspect dependent plugins before changing this plugin. Use the returned fingerprint to confirm the reviewed impact.
PluginManagementController.impact.GET.success=Impact of a plugin change.
PluginManagementController.performPreviewed.POST.summary=Run the reviewed plugin action
PluginManagementController.performPreviewed.POST.description=Supply the impact fingerprint from the preview. If dependencies have changed, obtain a new preview before applying the change.
PluginManagementController.performPreviewed.POST.success=Reviewed plugin action.
PluginManagementController.enabledPreviewed.PUT.summary=Save plugin enablement after review
PluginManagementController.enabledPreviewed.PUT.description=Confirms the dependency impact with the fingerprint from impact and a boolean enabled. Read impact again if the preview expired.
PluginManagementController.enabledPreviewed.PUT.success=Plugin enablement after review saved.
PluginManagementController.load.POST.summary=Load an installed plugin
PluginManagementController.load.POST.description=Registers an unloaded external plugin again. Check that load is available in GET /api/plugins/status first.
PluginManagementController.load.POST.success=Installed plugin.
PluginManagementController.start.POST.summary=Start a plugin
PluginManagementController.start.POST.description=Starts services for a loaded or stopped external plugin. Check the actions listed in status for its current availability.
PluginManagementController.start.POST.success=Plugin.
PluginManagementController.quiesce.POST.summary=Drain plugin activity
PluginManagementController.quiesce.POST.description=Stops admission of new requests and scheduled dispatches to this plugin and drains work in flight.
PluginManagementController.quiesce.POST.success=Plugin activity.
PluginManagementController.stop.POST.summary=Stop a plugin
PluginManagementController.stop.POST.description=Stops the plugin’s services and withdraws their runtime registrations. Use start to bring them back.
PluginManagementController.stop.POST.success=Plugin stopped.
PluginManagementController.unload.POST.summary=Unload a plugin
PluginManagementController.unload.POST.description=Stops and unregisters the plugin, keeping its installed package on disk for a later load.
PluginManagementController.unload.POST.success=Plugin.
PluginManagementController.remove.POST.summary=Remove an unloaded plugin
PluginManagementController.remove.POST.description=Unloads the plugin and deletes its installed package from disk. Inspect impact for affected dependents first.
PluginManagementController.remove.POST.success=Unloaded plugin removed.
PluginManagementController.restart.POST.summary=Restart a plugin
PluginManagementController.restart.POST.description=Restarts plugin services while retaining the current generation and class loader.
PluginManagementController.restart.POST.success=Plugin.
PluginManagementController.reload.POST.summary=Reload a plugin
PluginManagementController.reload.POST.description=Reloads the external plugin with a new generation and class loader. Fetch updated identifiers that carry a publication or generation afterwards.
PluginManagementController.reload.POST.success=Plugin.
PluginManagementController.updateEnabled.PUT.summary=Set plugin enablement
PluginManagementController.updateEnabled.PUT.description=Save whether an optional external plugin should be enabled. Its lifecycle policy determines when the change takes effect.
PluginManagementController.updateEnabled.PUT.success=Plugin enablement saved.
PluginManagementController.approveTrust.PUT.summary=Approve a plugin package
PluginManagementController.approveTrust.PUT.description=Approve execution of the installed package with the specified SHA-256 digest. A different package requires its own approval.
PluginManagementController.approveTrust.PUT.success=Plugin package approved.
PluginManagementController.revokeTrust.DELETE.summary=Revoke plugin execution trust
PluginManagementController.revokeTrust.DELETE.description=Remove the saved execution approval. A running instance continues until it stops; the next load checks trust again.
PluginManagementController.revokeTrust.DELETE.success=Plugin execution trust revoked.
PluginManagementController.restartBackend.POST.summary=Restart the desktop backend
PluginManagementController.restartBackend.POST.description=Ask the desktop lifecycle manager to restart the running backend context.
PluginManagementController.restartBackend.POST.success=Desktop backend.
PluginManagementController.install.POST.summary=Install a local plugin package
PluginManagementController.install.POST.description=Upload the plugin package as a multipart file. The installation result identifies the package and reports any rejection.
PluginManagementController.install.POST.success=Local plugin package.
