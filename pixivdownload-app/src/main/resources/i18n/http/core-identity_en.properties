title=Setup and sign-in
OnboardingController.completeStep.POST.summary=Complete an onboarding step
OnboardingController.completeStep.POST.description=Marks stepId complete from the local machine. Start with a lowercase letter. Use lowercase alphanumeric segments separated by dots or hyphens.
OnboardingController.completeStep.POST.success=Onboarding step.
OnboardingController.getProfile.GET.summary=Get the onboarding profile
OnboardingController.getProfile.GET.description=Returns displayName, the name used to address the administrator in the application.
OnboardingController.getProfile.GET.success=Onboarding profile.
OnboardingController.updateProfile.POST.summary=Save the onboarding profile
OnboardingController.updateProfile.POST.description=Saves displayName, retaining at most 40 characters. Supply a null or blank name to clear it.
OnboardingController.updateProfile.POST.success=Onboarding profile saved.
OnboardingController.connectivity.GET.summary=Check onboarding connectivity
OnboardingController.connectivity.GET.description=Check the server's connection to Pixiv before starting a download.
OnboardingController.connectivity.GET.success=Onboarding connectivity.
SetupController.status.GET.summary=Get installation setup status
SetupController.status.GET.description=Reads setup completion, current mode and the page limit to determine whether initial setup is needed.
SetupController.status.GET.success=Installation setup status.
SetupController.init.POST.summary=Initialize the installation
SetupController.init.POST.description=Creates the administrator account locally for an uninitialized installation. Use login when setup is already complete.
SetupController.init.POST.success=Installation initialized.
SetupController.login.POST.summary=Create an administrator session
SetupController.login.POST.description=Validates username and password, creates an admin session and sets its cookie. With rememberMe the cookie can persist for 30 days.
SetupController.login.POST.success=Administrator session created.
SetupController.logout.POST.summary=Close the current session
SetupController.logout.POST.description=Revokes the current administrator or invited guest session and clears its cookie.
SetupController.logout.POST.success=Current session closed.
SetupController.check.GET.summary=Check the current session
SetupController.check.GET.description=Returns whether this request has a valid administrator login session.
SetupController.check.GET.success=Current session.
parameter.stepId=Identifier of the onboarding step.
