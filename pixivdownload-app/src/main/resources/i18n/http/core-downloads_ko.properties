schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.CancelResponse.field.result=REQUESTED는 취소 요청 전송, TERMINAL은 작업이 이미 종료되었음을 뜻합니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.HistoryView.field.tasks=갱신 시각과 작업 ID로 페이징된 현재 페이지의 이력 작업입니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.HistoryView.field.beforeTime=마지막 항목의 updatedAt입니다. 다음 페이지 요청에 그대로 보내세요. 마지막 페이지에서는 null입니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.HistoryView.field.beforeId=마지막 항목의 attemptId로 같은 시각의 작업을 구분합니다. 마지막 페이지에서는 null입니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.ReceiptView.field.task=제출에 연결된 작업입니다. 상태 조회나 취소에는 attempt.attemptId를 사용합니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.ReceiptView.field.duplicate=동일 제출을 인식해 기존 작업을 반환하면 true입니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.SnapshotView.field.tasks=요청한 주체가 볼 수 있는 런타임 작업 스냅샷 목록입니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.attempt=호스트가 부여한 시도 UUID와 제공자의 workType, workId입니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.queueType=제공자가 연결한 큐 유형 ID입니다. 로컬 가져오기나 큐 연결 전에 거부된 작업에서는 빈 문자열일 수 있습니다. 보관 후에도 값은 유지됩니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.title=작업 또는 작품의 공개 표시 제목입니다. 제공자가 제목을 지정하기 전에는 workId를 사용합니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.phase=이번 실행 시도의 현재 수명 주기 단계입니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.updatedAt=작업 최근 갱신 시각(ISO 8601)입니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.revision=같은 epoch의 모든 작업이 카운터 하나를 공유합니다. 이 값은 해당 작업이 마지막으로 변경됐을 때의 값입니다. 보관된 작업은 0을 반환합니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.failureReason=실행기 실패 사유 코드입니다. 구체적 사유가 없으면 비어 있습니다. 원본, 페이지 수, 폴더 또는 출력 설정이 바뀌면 OUTPUT_LAYOUT_CONFLICT가 반환됩니다. pages를 생략하고 작품 전체를 다시 다운로드하세요. OUTPUT_ALREADY_REGISTERED는 작품 전체가 이미 등록되어 있다는 뜻입니다. `WORK_NOT_FOUND`는 제출할 때 현재 계정으로 원본 사이트에서 작품을 찾을 수 없었다는 뜻입니다. 제출이 거부되면 phase가 FAILED여도 이 값은 null일 수 있습니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.outputPath=이번 실행에서 사용하는 서버 출력 디렉터리의 절대 경로입니다. 일러스트와 소설은 대기열에 넣기 전에 경로를 결정합니다. 대기 중에는 파일이 아직 없을 수 있습니다. 준비 중이거나 제공자가 디렉터리를 보고하지 않았거나 이전 기록에 경로가 없으면 null입니다. 작품을 옮겨도 실행 당시의 경로가 유지됩니다.
parameter.X-Acquisition-Credential=선택한 다운로드 처리기에 제공할 선택적 임시 수집 인증 정보. 최대 16384자.
DownloadTasksController.submit.POST.response.400=명령을 파싱할 수 없거나 필수 필드가 없거나 옵션이 공통 제한을 초과했거나 임시 수집 자격 증명이 너무 깁니다. 게시되지 않은 workType은 작업을 생성하지 않고 DOWNLOAD_TASK_UNSUPPORTED_WORK_TYPE을 반환합니다. x-download-submissions에서 유형을 선택하세요. queueType은 대기열 식별자입니다. 필드를 식별할 수 있으면 field는 요청 본문의 JSON Pointer이며 reason은 언어와 무관한 검증 사유 코드입니다. 지원하지 않는 작품 유형은 field=/workType, reason=unsupported를 반환합니다.
DownloadTasksController.submit.POST.response.409=같은 requestId로 다른 내용을 제출하는 등 충돌이 발생했습니다.
DownloadTasksController.submit.POST.response.413=요청 본문이 128 KiB를 초과합니다.
DownloadTasksController.submit.POST.response.404=WORK_NOT_FOUND — 현재 계정으로 메타데이터를 조회했으나 원본 사이트에서 작품을 찾을 수 없습니다. 작품 ID와 공개 범위를 확인하세요. 등록된 시도는 작업 목록과 기록에 FAILED로 남습니다. 첫 오류 응답에는 attemptId와 Location이 없습니다. 작업이 끝난 지 5분이 넘고 결과가 저장되면 멱등성 기록이 만료될 수 있습니다. 이 프로세스에 기록이 남아 있는 동안 같은 호출자가 같은 requestId로 원래 명령을 다시 보내면 원래 작업의 202 응답(duplicate=true)을 받습니다. 만료 후 다시 보내면 새 시도가 생성됩니다.
DownloadTasksController.submit.POST.response.422=제공자 또는 접수 정책이 실행을 거부했습니다. 선택한 유형에서 허용하는 범위를 벗어난 옵션 값 등이 해당합니다. 등록된 시도는 작업 목록과 기록에 FAILED로 남습니다. 첫 오류 응답에는 attemptId와 Location이 없습니다. 작업이 끝난 지 5분이 넘고 결과가 저장되면 멱등성 기록이 만료될 수 있습니다. 이 프로세스에 기록이 남아 있는 동안 같은 호출자가 같은 requestId로 원래 명령을 다시 보내면 원래 작업의 202 응답(duplicate=true)을 받습니다. 만료 후 다시 보내면 새 시도가 생성됩니다. 필드를 식별할 수 있으면 field는 요청 본문의 JSON Pointer이며 reason은 언어와 무관한 검증 사유 코드입니다. 기본 공급자의 필드 사유에는 unknown_property, duplicate, invalid_format, invalid_value, not_applicable, out_of_range, too_large 등이 있습니다. 확장은 다른 사유를 반환할 수 있습니다.
DownloadTasksController.submit.POST.response.503=처리기나 대기열을 사용할 수 없거나 작업 용량이 가득 찼습니다. 등록 전 실패하면 작업이 생성되지 않습니다. 등록 후 실패하면 FAILED 기록이 남을 수 있습니다. 멱등성 기록이 남아 있는 동안 같은 명령을 다시 보내면 접수 내역을 받을 수 있습니다.
DownloadQueueController.cancelDownload.POST.response.409=처리기 식별자가 오래되었거나 취소가 지원되지 않습니다. 대기열의 최신 식별자와 기능을 조회합니다.
DownloadTasksController.cancel.POST.response.409=작업은 존재하지만 현재 실행은 취소할 수 없습니다.
DownloadTasksController.find.GET.response.404=호출자가 조회할 수 있는 작업 중 해당 taskId가 없습니다.
DownloadTasksController.cancel.POST.response.404=호출자가 조회할 수 있는 작업 중 해당 taskId가 없습니다.
DownloadTasksController.submit.POST.details=**제출.** 관리자는 작업을 제출할 수 있습니다. 프로그램 키에는 `core:downloads.create`와 선택한 유형의 `x-program-permission`이 모두 필요합니다. JSON 객체를 보내고, `options`의 키와 값은 문자열로 지정합니다. 옵션이 없으면 `{}`를 보냅니다. 본문은 최대 128 KiB이며, 옵션은 최대 32개이고 키와 값의 UTF-8 합계는 16 KiB까지입니다. 수집 자격 증명은 `X-Acquisition-Credential`에, 저장된 자격 증명 참조는 `X-Acquisition-Credentials`에 넣습니다. 두 헤더를 함께 쓸 수 없습니다. 프로그램 키가 후자를 쓰려면 `core:credentials.use`도 필요합니다. JSON 객체 하나를 보내세요. 중복 키, 객체 뒤에 붙인 데이터, 4단계를 초과하는 중첩은 거부됩니다. 제공자의 입력 검증에 실패하면 422 `DOWNLOAD_TASK_REJECTED`가 반환됩니다. 활성 접수 정책은 작업을 거부할 수 있고 옵션 확장은 파일명 템플릿과 출력 형식을 조정할 수 있습니다.\n\n\
    **재시도.** 현재 프로세스의 보관 기간 내에 같은 호출자가 같은 `requestId`, 작품 유형, 작품 ID, 옵션, 실제 기본 수집 자격 증명을 쓰면 기존 작업과 `duplicate=true`가 반환됩니다. 내용을 바꾸고 ID를 재사용하면 409가 반환됩니다. 기존 작업 조회에는 `task.attempt.attemptId`를 씁니다. 페이지 변경, 전체 재구성, 실패한 작업 재실행에는 새 `requestId`를 사용합니다. 종료 결과가 저장되면 종료 후 5분이 지난 시점부터 멱등성 기록을 정리할 수 있습니다. 재시작 후 저장된 종료 결과는 조회할 수 있고 작업은 자동 재실행되지 않습니다.\n\n\
    **접수와 완료.** 제공자는 응답 전에 원본 작품을 가져와 검증할 수 있습니다. 잘못된 요청은 400, 본문 크기 초과는 413입니다. 제공자나 접수 정책이 거부하면 422, 제공자·데이터베이스·작업 슬롯을 사용할 수 없으면 503이 반환될 수 있습니다. 202를 받으면 `core:downloads.read`로 `Location`을 조회해 `phase`와 `failureReason`을 확인합니다. 작업이 이미 끝났을 수도 있습니다. `CREDENTIALS_UNAVAILABLE`은 실행 중 선택한 수집 자격 증명을 사용할 수 없게 되었음을 뜻합니다. `core:downloads.cancel`로 `POST /api/download/tasks/{taskId}/cancel`을 호출한 뒤에도 종료 상태를 확인하세요. 프로그램 키는 자신에게 보이는 작업만 조회하고 취소할 수 있습니다. 일러스트와 소설은 대기열에 들어가기 전에 서버 출력 디렉터리의 절대 경로를 `task.outputPath`에 기록합니다. 대기 중에는 디렉터리가 아직 없을 수 있습니다. 큐에 연결되기 전에 거부되면 `queueType`은 빈 문자열이고 `task.outputPath`는 null입니다. 422 또는 404 `WORK_NOT_FOUND` 응답에는 작업 ID가 없지만 실패한 시도는 작업 목록과 기록에 남습니다. 보관 기간에 같은 명령을 다시 보내면 원래 작업의 202 응답을 받을 수 있습니다. 작품을 찾을 수 없으면 `failureReason`은 `WORK_NOT_FOUND`입니다.
description=다운로드를 제출하고 각 시도의 상태와 종료된 작업 내역을 조회합니다.
DownloadTasksController.history.GET.parameter.limit=조회 개수는 1~200이며 범위를 벗어나면 400을 반환합니다.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.progress=이 시도의 최근 측정 진행도입니다. 제공자가 아직 보고하지 않았거나 이전 기록에 없으면 null입니다. 단계의 총량에 도달해도 성공 여부는 phase로 확인하세요.
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.description=제공자가 측정한 단계 진행도입니다. 단계가 바뀌면 단위와 총량도 달라질 수 있습니다.
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.unit=PAGES는 작품 페이지, IMAGES는 이미지, BYTES는 바이트 수입니다. 소설은 처리한 삽화와 전송한 표지 바이트를 보고합니다.
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.completed=이 단계에서 처리한 양으로, 0부터 total까지입니다.
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.total=같은 단위로 표시한 단계의 총량으로, 0보다 큽니다.
