DownloadQueueController.rejectLegacyCancel.POST.summary=큐를 지정하지 않는 이전 취소 요청 처리 방식
DownloadQueueController.rejectLegacyCancel.POST.parameter.artworkId=이전 주소에 포함된 작품 식별자입니다. 서버는 이 값을 사용하지 않습니다.
DownloadQueueController.rejectLegacyCancel.POST.description=이전 주소는 항상 409를 반환합니다. 작업 UUID가 있으면 POST /api/download/tasks/{taskId}/cancel 을 사용하세요. 제공자가 항목 키와 게시 식별 정보를 준 경우에만 POST /api/download/queue/{queueType}/cancel 을 사용하세요.
DownloadQueueController.rejectLegacyCancel.POST.success=큐를 지정하지 않는 이전 취소 요청.
DownloadQueueController.cancelDownload.POST.summary=지정 큐의 다운로드 취소
DownloadQueueController.cancelDownload.POST.description=큐 제공자가 workKey를 제공한 경우 그 값을 그대로 보내고 GET /api/download/extensions 에서 같은 배포의 식별 정보를 읽어 owner로 지정합니다. 프로그램 클라이언트는 GET /api/download/tasks 에서 조회할 수 있는 작업의 attempt.attemptId를 taskId로 사용해 POST /api/download/tasks/{taskId}/cancel 을 호출할 수도 있습니다.
DownloadQueueController.cancelDownload.POST.success=지정 큐의 다운로드.
DownloadQueueController.clearDownloadQueue.POST.summary=다운로드 큐 지우기
DownloadQueueController.clearDownloadQueue.POST.description=현재 호출자가 관리할 수 있는 대기 작업을 정리하고 결과를 반환합니다.
DownloadQueueController.clearDownloadQueue.POST.success=다운로드 큐를 지웠습니다.
DownloadTasksController.submit.POST.summary=다운로드 작업 시작
DownloadTasksController.submit.POST.description=요청 스키마에서 활성 workType을 선택하고 예시를 따라 workId와 options를 채웁니다. 문서의 x-download-submissions에서도 제공자별 필요 프로그램 권한과 입력 스키마를 확인할 수 있습니다. 같은 명령 재시도 시 requestId를 재사용하고 내용이 달라지면 새 ID를 사용합니다. 202 응답에 조회할 작업 ID가 있습니다. 202 응답의 Location에서 진행 상황을 확인하세요. 경로의 taskId는 응답의 task.attempt.attemptId입니다. 프로세스가 중복 확인 기록을 보관하는 동안에는 같은 호출자가 동일한 `requestId`와 내용으로 다시 제출하면 원래 영수증을 받습니다. 최종 결과가 저장되면 작업 종료 5분 후에 중복 확인 기록이 만료될 수 있습니다. 이후 다시 제출하면 새 작업이 시작될 수 있습니다.
DownloadTasksController.submit.POST.success=이미 등록된 작업을 다시 제출해도 202를 반환합니다. task.attempt.attemptId로 같은 시도를 조회하세요. 대기열에 들어가기 전에 실패하면 task.outputPath는 null일 수 있습니다.
DownloadTasksController.snapshot.GET.summary=현재 다운로드 작업 목록 조회
DownloadTasksController.snapshot.GET.description=호출자에게 보이는 작업 스냅샷과 프로세스 epoch, revision을 반환합니다. 재시작하면 epoch가 바뀝니다. 재시작 후에는 GET /api/download/tasks/history에서 보관된 종료 작업을 페이지별로 조회할 수 있습니다.
DownloadTasksController.snapshot.GET.success=현재 다운로드 작업.
DownloadTasksController.find.GET.summary=다운로드 작업 세부 정보 조회
DownloadTasksController.find.GET.description=outputPath는 이번 실행의 출력 디렉터리를 나타냅니다. 접수 응답의 작업 UUID로 실행 상태를 조회합니다. 해당 호출자가 조회할 수 없는 작업은 404입니다. 일러스트 전체를 다운로드한 뒤 attempt.workId로 GET /api/library/artworks/{artworkId} (core:library.read)를 호출하세요. 이동한 작품은 moveFolder, 나머지는 folder를 확인합니다. 페이지 파일은 GET /api/downloaded/rawfile/{artworkId}/{page} (core:assets.export, 0부터 시작)로 받습니다. 일부 페이지만 저장한 경우 GET /api/library/artworks/{artworkId}/partial 에서 저장된 페이지와 디렉터리를 확인하세요. 처음에는 2초마다 조회하세요. `revision`이 그대로면 간격을 최대 10초까지 늘리고, 값이 바뀌면 2초로 돌아갑니다. `phase`가 `COMPLETED`, `FAILED`, `CANCELLED` 중 하나이면 조회를 멈춥니다. 응답에 `Retry-After`가 있으면 다음 요청까지 최소한 지정된 시간만큼 기다리세요.
DownloadTasksController.find.GET.success=다운로드 작업 세부 정보.
DownloadTasksController.history.GET.summary=저장된 작업 기록 목록 조회
DownloadTasksController.history.GET.description=limit은 1–200이고 기본값은 50입니다. 첫 페이지에서는 커서를 생략하고 다음 페이지에서는 받은 beforeTime과 beforeId를 함께 보냅니다. 재시작 후에는 GET /api/download/tasks/history에서 보관된 종료 작업을 페이지별로 조회할 수 있습니다.
DownloadTasksController.history.GET.success=저장된 작업 기록.
DownloadTasksController.cancel.POST.summary=다운로드 작업 취소
DownloadTasksController.cancel.POST.description=작업 UUID로 취소를 요청합니다. REQUESTED는 요청 접수, TERMINAL은 이미 종료됨을 뜻하며, 취소할 수 없으면 409입니다. GET /api/download/tasks 의 attempt.attemptId를 taskId로 사용하세요. 제공자가 workKey와 게시 식별 정보를 준 경우에는 POST /api/download/queue/{queueType}/cancel 을 사용하세요.
DownloadTasksController.cancel.POST.success=다운로드 작업.
DownloadQueueController.rejectLegacyCancel.POST.response.409=대상 대기열을 지정하는 취소 엔드포인트를 사용하세요.
parameter.taskId=제출 응답의 task.attempt.attemptId를 사용하세요. 작업 URL은 Location에 있습니다.
parameter.queueType=항목이 속한 큐의 게시 유형입니다.
parameter.beforeTime=이전 페이지의 beforeTime을 소수 초까지 유지해 beforeId와 함께 보내세요.
parameter.beforeId=이전 페이지 마지막 시도의 UUID입니다. beforeTime과 함께 보내세요.
