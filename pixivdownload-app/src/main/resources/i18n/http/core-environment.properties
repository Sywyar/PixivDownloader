EnvironmentTransferController.restore.POST.summary=还原环境归档
EnvironmentTransferController.restore.POST.description=提交预览 token、选中的字段和文件组。mappedPaths 只可映射 selected 内的字段；databasePaths 按数据库索引指定目标路径。202 返回 RESTORE_PENDING。
EnvironmentTransferController.restore.POST.success=已恢复环境归档。
