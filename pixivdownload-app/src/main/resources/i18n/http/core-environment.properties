EnvironmentTransferController.export.POST.description=将所选配置、凭据、数据库、状态或资源导出到 destination。须设置 confirmRestart 为 true；服务会停止后端、写入归档并请求重启。202 表示已受理，重连后查询 GET /api/settings/environment/exports。
