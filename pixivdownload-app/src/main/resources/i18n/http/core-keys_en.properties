title=Program keys
ApiReferenceController.document.GET.summary=Read the HTTP API reference
ApiReferenceController.document.GET.description=Returns the OpenAPI 3 document for the currently loaded endpoints and follows plugin loading and permission declarations. Administrator sessions and program keys holding this permission can read it; unauthenticated requests receive a 401 response naming the required permission. The server caches each language and regenerates the catalog after changes to routes, contributing providers or instance access. Every request is authorized. Responses use private, no-store.
ApiReferenceController.document.GET.success=OpenAPI document.
ApiReferenceController.probe.HEAD.summary=Check access to the API reference
ApiReferenceController.probe.HEAD.description=Checks catalog access using the same credentials as GET. Returns headers only.
ApiReferenceController.probe.HEAD.success=The caller can read the API reference.
ProgramKeysController.list.GET.summary=List program keys
ProgramKeysController.list.GET.description=List each key's UUID, revision, complete grants, source network restrictions and transport policy. The secret is returned only at creation.
ProgramKeysController.list.GET.success=Program keys.
ProgramKeysController.desktopList.GET.summary=List desktop key summaries
ProgramKeysController.desktopList.GET.description=List desktop key summaries with ID, revision and permission count. Retrieve an individual key by ID to read its complete grants.
ProgramKeysController.desktopList.GET.success=Desktop key summaries.
ProgramKeysController.desktopKey.GET.summary=Get a program key policy
ProgramKeysController.desktopKey.GET.description=Look up the key's full grants and source network policy by UUID. Use the returned revision to edit or revoke it.
ProgramKeysController.desktopKey.GET.success=Program key policy.
ProgramKeysController.desktopPermissions.GET.summary=List permission labels
ProgramKeysController.desktopPermissions.GET.description=List permission IDs, owners and localized names. Supply the chosen permission IDs in permissions when creating or editing a key.
ProgramKeysController.desktopPermissions.GET.success=Permission labels.
ProgramKeysController.permissions.GET.summary=List program permissions
ProgramKeysController.permissions.GET.description=An administrator session can list the grantable permission IDs, their owners and their HTTP methods and paths. Use those IDs in permissions when creating or editing a key. Program keys cannot read this catalog. Each key’s policy holds its assigned permissions.
ProgramKeysController.permissions.GET.success=Program permissions.
ProgramKeysController.createFromGui.POST.summary=Create a program key
ProgramKeysController.createFromGui.POST.description=Create a key and copy its one-time secret. Select permissions from the grant catalog. With anyIp true, networks must be empty. Otherwise supply at least one numeric IP address or CIDR network.
ProgramKeysController.createFromGui.POST.success=Program key created.
ProgramKeysController.create.POST.summary=Create a program key
ProgramKeysController.create.POST.description=Create a key and copy its one-time secret. Select permissions from the grant catalog. With anyIp true, networks must be empty. Otherwise supply at least one numeric IP address or CIDR network.
ProgramKeysController.create.POST.success=Program key created.
ProgramKeysController.update.PUT.summary=Update a key policy
ProgramKeysController.update.PUT.description=Replace the complete policy at the supplied revision. Editing resets public transport to HTTPS_REQUIRED. Reload the key on a revision conflict.
ProgramKeysController.update.PUT.success=Key policy updated.
ProgramKeysController.revoke.DELETE.summary=Revoke a program key
ProgramKeysController.revoke.DELETE.description=Submit the key revision. Once revocation succeeds, requests using that key can no longer authenticate.
ProgramKeysController.revoke.DELETE.success=Program key revoked.
ProgramKeysController.changeTransport.POST.summary=Set key transport policy
ProgramKeysController.changeTransport.POST.description=To allow public HTTP, submit REVIEWED at the current revision, then HTTP_ALLOWED at the new revision. Submit HTTPS_REQUIRED to remove the exception.
ProgramKeysController.changeTransport.POST.success=Key transport policy saved.
ProgramKeysController.transportFromGui.POST.summary=Set key transport policy
ProgramKeysController.transportFromGui.POST.description=To allow public HTTP, submit REVIEWED at the current revision, then HTTP_ALLOWED at the new revision. Submit HTTPS_REQUIRED to remove the exception.
ProgramKeysController.transportFromGui.POST.success=Key transport policy saved.
ProgramKeysController.updateFromGui.POST.summary=Update a key policy
ProgramKeysController.updateFromGui.POST.description=Replace the complete policy at the supplied revision. Editing resets public transport to HTTPS_REQUIRED. Reload the key on a revision conflict.
ProgramKeysController.updateFromGui.POST.success=Key policy updated.
ProgramKeysController.revokeFromGui.POST.summary=Revoke a program key
ProgramKeysController.revokeFromGui.POST.description=Submit the key revision. Once revocation succeeds, requests using that key can no longer authenticate.
ProgramKeysController.revokeFromGui.POST.success=Program key revoked.
