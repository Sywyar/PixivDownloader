title=Pixiv lookup
PixivSharedProxyController.getScheduleUserMeta.POST.summary=Get Pixiv author metadata for scheduling
PixivSharedProxyController.getScheduleUserMeta.POST.description=Look up the author identified by userId using the acquisition credentials selected for the supplied schedule context. Returns the author's name and user ID. Copy sourceType and activationToken from the same entry in GET /api/schedule/sources. A program key needs core:schedule.sources.read to read that catalog. Fetch the pair again after the source is republished.
PixivSharedProxyController.getScheduleUserMeta.POST.success=Pixiv author metadata for scheduling.
PixivSharedProxyController.getUserMeta.GET.summary=Get a Pixiv author profile
PixivSharedProxyController.getUserMeta.GET.description=Look up the current author name on Pixiv for the user ID in the path. The response also includes that ID.
PixivSharedProxyController.getUserMeta.GET.success=Pixiv author profile.
PixivSharedProxyController.proxyThumbnail.GET.summary=Get a proxied thumbnail
PixivSharedProxyController.proxyThumbnail.GET.description=Fetch the source thumbnail through the server and return it with its image media type.
PixivSharedProxyController.proxyThumbnail.GET.success=Proxied thumbnail.
PixivSharedProxyController.getMeUid.GET.summary=Get the signed-in Pixiv user ID
PixivSharedProxyController.getMeUid.GET.description=Reads the account UID from PHPSESSID in the Pixiv Cookie without contacting Pixiv to validate the session. A missing or unparseable UID returns 400 ACQUISITION_CREDENTIAL_REQUIRED.
PixivSharedProxyController.getMeUid.GET.success=Signed-in Pixiv user ID.
parameter.userId=Pixiv user ID of the author.
parameter.X-Acquisition-Credential=Optional temporary Pixiv acquisition cookie, up to 16384 characters. To use saved credentials, supply their IDs in X-Acquisition-Credentials instead. A successful public query does not verify that the Cookie is still valid.
parameter.url=Source URL of the thumbnail.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.sourceType=The selected sourceType from GET /api/schedule/sources.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.activationToken=The activationToken from the same catalog entry as sourceType. Fetch it again after the source is republished.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.expectedStateVersion=Task state version observed by the caller.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.proxy=Proxy settings for this operation.
PixivSharedProxyController.getScheduleUserMeta.POST.body=Scheduled source, credential selection and proxy for this lookup.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.MeUidResponse.field.uid=Pixiv account ID extracted from the acquisition cookie.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.UserMetaResponse.field.name=Author display name returned by Pixiv.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.UserMetaResponse.field.userId=Pixiv user ID of the author queried.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.taskId=Existing task ID. Supply it together with expectedStateVersion, or omit both.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.useTaskCredential=Use the selected task’s credential policy. Requires its ID and state version and excludes separately supplied credentials.
parameter.X-User-UUID=Version 4 user UUID in multi-user mode. Use the UUID returned by quota initialization. A valid user cookie takes precedence.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ErrorResponse.field.code=Use code to identify the cause of failure.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.code=pixiv.proxy.rate-limited when the proxy request limit is reached.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.error=Failure explanation returned by the server or Pixiv.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ErrorResponse.field.error=Failure explanation returned by the server or Pixiv.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.maxRequests=Maximum proxy requests permitted in the window.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.windowHours=Proxy request rate-limit window in hours.
PixivSharedProxyController.getMeUid.GET.response.400=A missing Pixiv Cookie or unreadable account UID returns code ACQUISITION_CREDENTIAL_REQUIRED.
description=Look up Pixiv account information and retrieve thumbnails.
PixivSharedProxyController.proxyThumbnail.GET.parameter.url=Absolute HTTPS URL on a subdomain of pximg.net or on embed.pixiv.net. Use the default port or 443. User information and fragments are rejected, and redirects are not followed.
