schema.top.sywyar.pixivdownload.plugin.api.web.page.PageComponentCategory.field.id=분류 ID입니다. 플러그인은 owner:local-id, 호스트 기본 분류는 owner ID입니다.
schema.top.sywyar.pixivdownload.plugin.api.web.page.PageComponentCategory.field.descriptionKey=선택적 분류 설명 번역 키입니다. 설명이 없으면 비어 있습니다.
schema.top.sywyar.pixivdownload.plugin.api.web.page.PageComponentCategory.field.components=소유자가 선언하고 여기에 묶은 구성 요소 유형 목록입니다. 비어 있거나 중복될 수 없습니다.
schema.top.sywyar.pixivdownload.plugin.api.web.page.PagePort.description=구성 요소 인스턴스 사이의 JSON 값 포트입니다. 양 끝의 계약 ID와 스키마가 일치해야 합니다.
schema.top.sywyar.pixivdownload.plugin.api.web.page.PagePort.field.name=구성 요소 안에서 고유한 포트 이름입니다.
schema.top.sywyar.pixivdownload.plugin.api.web.page.PagePort.field.contractId=계약 패키지에서 정의하는 버전 포함 식별자입니다.
schema.top.sywyar.pixivdownload.plugin.api.web.page.PagePort.field.schema=포트에서 주고받는 값의 전체 JSON Schema입니다.
schema.top.sywyar.pixivdownload.plugin.api.web.page.PageRegion.description=소유자가 선언한 필수 영역이며 게시 페이지에 정확히 한 번 있어야 합니다.
schema.top.sywyar.pixivdownload.plugin.api.web.page.PageRegion.field.parent=가장 가까운 상위 관리 영역입니다. 비어 있으면 다른 관리 영역 안에 배치할 수 없습니다.
schema.top.sywyar.pixivdownload.plugin.api.web.page.PageRegion.field.container=이 영역에 레이아웃, 텍스트 및 허용된 구성 요소를 삽입할 수 있는지 나타냅니다.
schema.top.sywyar.pixivdownload.plugin.api.web.page.PageRegion.field.previewHidden=미리보기에서 처음에 이 영역을 숨기는지 나타냅니다. 편집기에서 표시해도 게시 스타일은 바뀌지 않습니다.
schema.top.sywyar.pixivdownload.core.work.service.DownloadPathPlan.Problem.field.originalPath=이름 템플릿이 생성한 길이 제한 초과 원래 경로입니다.
schema.top.sywyar.pixivdownload.core.work.service.DownloadPathPlan.Problem.field.truncatedPath=TRUNCATE 선택 시 제시되는 단축 경로입니다.
schema.top.sywyar.pixivdownload.core.work.service.DownloadPathPlan.Problem.field.defaultPath=DEFAULT_NAME 선택 시 제시되는 기본 이름 경로입니다.
schema.top.sywyar.pixivdownload.core.work.service.DownloadPathPlan.Problem.description=원래 다운로드 경로가 너무 길 때 선택할 수 있는 대체 경로입니다. 후보가 비어 있으면 해당 동작을 선택할 수 없습니다.
binding.body=요청 본문을 읽을 수 없거나 필드 검증에 실패하면 JSON 오류를 반환합니다.
binding.required=필수 쿼리 매개변수나 헤더가 없으면 JSON 오류를 반환합니다.
binding.multipart=멀티파트 양식을 해석할 수 없으면 error.upload.invalid를 반환합니다.
binding.uploadSize=업로드가 서버에 설정된 크기 한도를 초과하면 error.upload.too-large를 반환합니다.
binding.conversion=경로, 쿼리 또는 헤더 값의 자료형이 잘못되면 400을 반환합니다.
schema.top.sywyar.pixivdownload.setup.AuthFilter.ProgramCredentialError.title=인증 오류
schema.top.sywyar.pixivdownload.setup.AuthFilter.ProgramCredentialError.description=이 응답에는 `code`, `error`, `programPermission`이 함께 들어갑니다. `code` 열거형은 구체적인 권한 ID를 제공하는 응답에만 적용됩니다. 다른 오류 형식은 작업의 `responses`에서 확인하세요. 예를 들어 `auth.program.unsupported`는 `ProgramKeyUnsupported` 형식을 사용합니다.
schema.top.sywyar.pixivdownload.setup.AuthFilter.ProgramCredentialError.field.code=접근 실패 원인을 나타내는 고정 코드입니다.
schema.top.sywyar.pixivdownload.setup.AuthFilter.ProgramCredentialError.field.error=요청 언어로 반환하는 오류 메시지입니다.
schema.top.sywyar.pixivdownload.setup.AuthFilter.ProgramCredentialError.field.programPermission=키에 부여할 전체 권한 ID입니다(예: core:schedule.create). 서버가 필요한 권한을 알려줄 때 포함됩니다.
response.405=이 경로는 요청한 HTTP 메서드를 지원하지 않습니다. Allow 헤더에서 지원 메서드를 확인하세요.
parameter.page.first0=페이지 번호입니다. 첫 페이지는 0입니다.
parameter.page.first1=페이지 번호입니다. 첫 페이지는 1입니다.
operation.details=상세 정보

permissionGrammar.description=이 카탈로그는 각 작업의 `x-program-permissions`에 명시된 조건을 설명합니다. 실제 요청, 대상 리소스, 실행 계획을 기준으로 조건을 해석하세요. 작업 설명에 추가 권한이 나올 수 있습니다.
permissionGrammar.phase.route=현재 HTTP 메서드와 경로에서 검사하는 전체 권한 ID로, 작업의 `x-program-permission`과 같습니다. 유효한 키에 이 권한이 없으면 해당 요청의 HTTP 403 응답에 필요한 ID가 표시됩니다.
permissionGrammar.phase.discovery=현재 소스 토큰 등 입력을 조회할 때 지정된 `permission`으로 `operation`을 호출합니다. 권한 부족은 해당 조회의 응답에서 확인합니다.
permissionGrammar.phase.submit=현재 요청의 추가 검사 목록입니다. 적용되는 조건을 모두 충족해야 합니다. `effect: filter`는 목록에 표시할 항목을 결정하며, 그 밖의 권한 부족은 `reportedIn`에 지정된 위치에서 확인합니다.
permissionGrammar.phase.execution=배치가 접수되면 백그라운드에서 소스 권한을 다시 검사하고 이번 실행 계획이 선택한 실행기의 권한을 확인합니다. 결과는 `reportedIn.operation`에서 조회합니다.
permissionGrammar.expression=`#` 앞의 이름으로 아래 컨텍스트를 선택합니다. 뒤쪽은 해당 객체의 루트에서 시작하는 RFC 6901 JSON Pointer입니다. 예를 들어 `task#/sourceOwnerPluginId`는 기존 작업의 `sourceOwnerPluginId`를 읽습니다. 필드 이름 안의 `~`는 `~0`, `/`는 `~1`로 표기합니다.
permissionGrammar.context.request=현재 작업에 보낸 JSON 요청 본문입니다.
permissionGrammar.context.query=현재 요청의 URL 쿼리 매개변수입니다. 키는 매개변수 이름입니다.
permissionGrammar.context.task=현재 경로의 `{id}`가 가리키는 기존 예약 작업입니다.
permissionGrammar.context.batch=현재 경로의 `{id}`가 가리키는 기존 수동 배치입니다. 재개하거나 재시도할 때 이 배치에서 소스 유형을 읽습니다.
permissionGrammar.context.item=목록에서 표시 여부를 검사할 후보 항목 하나입니다.
permissionGrammar.field.permission=`core:credentials.use`와 같은 전체 권한 ID입니다. `discovery` 또는 `reportedIn`에서는 해당 `operation`을 호출할 권한입니다.
permissionGrammar.field.ownerFrom=`permissionId`와 결합할 권한 소유자를 읽는 컨텍스트 표현식입니다.
permissionGrammar.field.permissionId=로컬 권한 이름입니다. `ownerFrom`으로 구한 소유자와 이 이름을 콜론으로 연결하면 `download-workbench:schedule.manage`와 같은 전체 ID가 됩니다.
permissionGrammar.field.header=이 요청 헤더를 사용하면 같은 항목의 `permission`도 필요합니다.
permissionGrammar.field.effect=`filter`는 후보별로 검사합니다. 권한이 없는 항목을 제외하고 목록 요청은 성공할 수 있습니다.
permissionGrammar.field.catalog=OpenAPI 문서 루트에서 `#/…` JSON Pointer 프래그먼트로 카탈로그를 찾습니다. `key`, `keyFrom`, `value` 중 하나로 항목을 선택한 뒤 `field`를 읽습니다.
permissionGrammar.field.key=현재 JSON 요청 본문의 이 최상위 필드 값을 카탈로그 인덱스로 사용합니다.
permissionGrammar.field.keyFrom=`batch#/sourceType` 같은 컨텍스트 표현식의 결과를 카탈로그 인덱스로 사용합니다.
permissionGrammar.field.value=이 고정값을 카탈로그 인덱스로 사용합니다.
permissionGrammar.field.field=선택한 카탈로그 항목에서 전체 권한 ID를 읽을 속성 이름입니다. `keyedBy`가 있으면 이 속성은 권한 맵입니다.
permissionGrammar.field.keyedBy=`workType`은 이번 실행 계획에 필요한 각 작품 유형으로 `field` 맵을 조회해 전체 권한 ID를 하나씩 구한다는 뜻입니다.
permissionGrammar.field.recheckField=같은 카탈로그 항목의 다른 속성 이름입니다. 백그라운드에서 해당 속성에 담긴 소스 권한 ID도 다시 검사합니다. 예를 들어 `batchSubmitPermission`의 값입니다.
permissionGrammar.field.reportedIn=진단 정보를 읽을 응답을 지정합니다. `operation`을 생략하면 현재 요청의 응답 본문을, 지정하면 해당 작업의 응답 본문을 읽습니다. `pointer`와 `codePointer` 모두 그 JSON 본문의 루트에서 시작합니다.
permissionGrammar.field.operation=HTTP 메서드와 경로 템플릿입니다. 접수된 배치의 조회 URL은 202 응답의 `Location`에서 얻습니다.
permissionGrammar.field.status=지정한 응답의 HTTP 상태 코드입니다. 조회 응답 200은 배치 정보를 읽었다는 뜻입니다. 실행 상태는 본문의 `state`에서 확인합니다.
permissionGrammar.field.pointer=응답 본문의 루트에서 누락된 권한 ID를 읽는 RFC 6901 JSON Pointer입니다. 서버가 권한을 특정할 수 있을 때 값이 제공됩니다.
permissionGrammar.field.codePointer=같은 응답 본문의 루트에서 사유 코드를 읽는 JSON Pointer입니다. 배치의 `state`를 먼저 확인한 다음 사유 코드를 읽습니다. `auth.program.forbidden`이면 `pointer`로 확인된 누락 권한 ID를 읽습니다.
parameter.Range=가져올 바이트 범위입니다. 예: bytes=0-99.
parameter.If-Modified-Since=이전 Last-Modified를 보내면 파일에 변경이 없을 때 304를 반환합니다.
response.206=요청한 파일 바이트입니다. 여러 범위는 multipart/byteranges로 반환하며 각 부분에 Content-Range가 있습니다.
header.contentRange.single=단일 범위의 시작과 끝 바이트 및 전체 파일 길이입니다.
parameter.If-None-Match=이전 응답의 ETag를 보내세요. 현재 파일 버전과 일치하면 304를 반환합니다.
response.304=캐시된 파일이 최신 상태입니다. 응답 본문은 비어 있습니다.
response.416=요청한 범위를 제공할 수 없습니다. 본문은 비어 있고 Content-Range는 bytes */길이로 전체 길이를 표시합니다.
permissionGrammar.field.when=keyFrom이 가리키는 JSON 값이 value와 같을 때만 이 권한이 필요합니다. value가 생략되면 keyFrom이 가리키는 값이 null이 아닐 때 권한이 필요합니다.
link.inspectArchive=응답에 archiveToken이 있으면 core:archives.read 권한으로 보관 파일의 상태를 조회할 수 있습니다.
link.downloadArchive=상태가 ready이면 core:archives.download 권한으로 보관 파일을 다운로드할 수 있습니다.
schema.top.sywyar.pixivdownload.web.RequestFieldError.description=코드, 메시지, 필드 경로와 검증 사유가 있는 요청 오류.
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.field=요청 본문에서 해당 필드를 가리키는 JSON Pointer.
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.reason=언어와 무관한 필드 검증 사유 코드.
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.code=프로그램에서 오류를 구분할 수 있는 안정적인 오류 코드입니다.
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.error=요청 언어로 표시되는 오류 메시지입니다.
response.406=Accept와 일치하는 응답 형식이 없습니다. 응답 본문은 비어 있습니다.
binding.part=필수 파일 파트가 누락되면 field에 해당 파트 이름이 표시됩니다.
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.in=잘못된 입력이 전달된 위치입니다.
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.field=경로 매개변수, 쿼리 매개변수, 헤더 또는 멀티파트 파트의 이름입니다. 본문 필드는 JSON Pointer로 표시합니다.
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.reason=프로그램에서 구분할 수 있는 검증 사유입니다. required는 필수 값 누락, type은 유형 오류, invalid_value는 유효하지 않은 값입니다.
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.in=JSON 요청 본문의 필드이면 값은 body입니다.
