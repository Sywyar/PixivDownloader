title=Pixiv 查询
PixivSharedProxyController.getScheduleUserMeta.POST.summary=查看计划任务所需的 Pixiv 作者资料
PixivSharedProxyController.getScheduleUserMeta.POST.description=读取计划任务所选凭据对应的 Pixiv 用户资料。请求体提供调度上下文，路径中的 userId 指定要查询的作者。返回作者名和用户 ID。从 GET /api/schedule/sources 的同一条记录复制 sourceType 和 activationToken。用程序密钥读取该目录需要 core:schedule.sources.read；来源重新发布后，请重新读取这对值。 提供 taskId 时，程序密钥还须具有该任务来源 owner 的 schedule.manage 权限。
PixivSharedProxyController.getScheduleUserMeta.POST.success=计划任务所需的 Pixiv 作者资料。
PixivSharedProxyController.getUserMeta.GET.summary=查看Pixiv 作者资料
PixivSharedProxyController.getUserMeta.GET.description=按路径中的 Pixiv 用户 ID 向 Pixiv 查询作者名，响应同时返回该用户 ID。
PixivSharedProxyController.getUserMeta.GET.success=Pixiv 作者资料。
PixivSharedProxyController.proxyThumbnail.GET.summary=查看代理缩略图
PixivSharedProxyController.proxyThumbnail.GET.description=通过服务器取得来源缩略图，响应包含图像内容和媒体类型。
PixivSharedProxyController.proxyThumbnail.GET.success=代理缩略图。
PixivSharedProxyController.getMeUid.GET.summary=查看当前 Pixiv 账号 ID
PixivSharedProxyController.getMeUid.GET.description=仅从 Pixiv Cookie 的 PHPSESSID 解析账号 UID，不联系 Pixiv 验证会话。缺少可解析的 UID 时返回 400 ACQUISITION_CREDENTIAL_REQUIRED。
PixivSharedProxyController.getMeUid.GET.success=当前 Pixiv 账号 ID。
parameter.userId=作者的 Pixiv 用户 ID。
parameter.X-Acquisition-Credential=可选的临时 Pixiv 采集 Cookie 原文，最多 16384 个字符。若使用库中保存的凭据，改传 X-Acquisition-Credentials 中的 ID。 公开查询成功并不验证 Cookie 有效期。
parameter.url=缩略图的来源 URL。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.sourceType=所选来源在 GET /api/schedule/sources 中的 sourceType。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.activationToken=与 sourceType 同一条目录记录中的 activationToken。来源重新发布后须重新获取。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.expectedStateVersion=调用方读取到的任务状态版本。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.proxy=此次操作使用的代理设置。
PixivSharedProxyController.getScheduleUserMeta.POST.body=本次查询使用的计划来源、凭据及代理。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.MeUidResponse.field.uid=从采集 Cookie 读取的 Pixiv 账户 ID。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.UserMetaResponse.field.name=Pixiv 返回的作者显示名。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.UserMetaResponse.field.userId=所查作者的 Pixiv 用户 ID。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.taskId=已有任务的 ID，须与 expectedStateVersion 同时提供或同时省略。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.useTaskCredential=true 表示使用所选任务的凭据策略。须指定任务和版本，并省略单独提供的凭据。
parameter.X-User-UUID=多人模式下的 UUID v4 用户标识，可使用配额初始化返回的 UUID。已有有效用户 Cookie 时优先使用 Cookie。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ErrorResponse.field.code=按 code 判断失败原因。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.code=代理请求达到上限时为 pixiv.proxy.rate-limited。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.error=服务器或 Pixiv 返回的失败原因。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ErrorResponse.field.error=服务器或 Pixiv 返回的失败原因。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.maxRequests=当前窗口内允许的最大代理请求数。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.windowHours=代理请求次数限制的窗口长度，单位为小时。
PixivSharedProxyController.getMeUid.GET.response.400=缺少含可解析账号 UID 的 Pixiv Cookie 时，code 为 ACQUISITION_CREDENTIAL_REQUIRED。
description=查询 Pixiv 账号信息和缩略图。
PixivSharedProxyController.proxyThumbnail.GET.parameter.url=绝对 HTTPS 地址。仅允许 *.pximg.net 子域或 embed.pixiv.net，端口省略或为 443，不含用户信息和片段；代理不跟随重定向。
