ApiReferenceController.document.GET.summary=HTTP API 레퍼런스 읽기
ApiReferenceController.document.GET.description=현재 로드된 엔드포인트의 OpenAPI 3 문서를 반환하며, 플러그인 로드와 권한 선언에 따라 갱신됩니다. 관리자 세션이나 이 권한이 있는 프로그램 키로 읽을 수 있습니다. 인증되지 않은 요청에는 필요한 권한을 알려 주는 401 응답이 반환됩니다. 서버는 언어별로 문서를 캐시하며 경로, 제공자 또는 인스턴스 접근 상태가 바뀌면 다시 생성합니다. 요청마다 권한을 확인하고 응답에는 private, no-store를 사용합니다.
ApiReferenceController.document.GET.success=OpenAPI 문서.
