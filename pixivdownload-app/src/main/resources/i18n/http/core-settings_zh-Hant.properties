title=應用設定
SettingsController.fields.GET.summary=列出可編輯設定項
SettingsController.fields.GET.description=返回有讀取許可權的欄位定義、可選值、所屬外掛、packageId 和 generation。修改時原樣使用這些身份欄位；敏感值只返回 stored 狀態。
SettingsController.fields.GET.success=可編輯設定項。
SettingsController.presets.GET.summary=列出設定預設
SettingsController.presets.GET.description=列出當前可讀取的提供方設定預設和所屬區段。使用返回的值準備設定草稿。
SettingsController.presets.GET.success=設定預設。
SettingsController.validate.POST.summary=校驗擬儲存的設定
SettingsController.validate.POST.description=傳入非空 changes，使用 GET /api/settings 返回的 owner、packageId、generation 和 key。僅校驗；可用同一草稿呼叫 POST /api/settings 儲存。 KEEP 和 CLEAR 僅適用於敏感欄位，請省略 value。全部為 KEEP 時回傳 []，混合提交只回傳儲存項目的效果。
SettingsController.validate.POST.success=擬儲存的設定。
SettingsController.save.POST.summary=儲存應用設定
SettingsController.save.POST.description=儲存 changes 中列出的修改，響應逐項給出 effect。使用 GET /api/settings 查欄位所屬外掛、值型別及允許的選項。 KEEP 和 CLEAR 僅適用於敏感欄位，請省略 value。全部為 KEEP 時回傳 []，混合提交只回傳儲存項目的效果。
SettingsController.save.POST.success=已儲存應用設定。
SettingsController.save.POST.body=要變更的配置鍵及其新值。
SettingsController.validate.POST.body=要變更的配置鍵及其新值。
