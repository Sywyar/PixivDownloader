title=Acquisition credentials
AcquisitionCredentialsController.read.GET.summary=Get the credential inventory
AcquisitionCredentialsController.read.GET.description=Reads the current revision and each entry’s id, name and enabled flag. Send that revision on update. Secrets are omitted from responses.
AcquisitionCredentialsController.read.GET.success=Credential inventory.
AcquisitionCredentialsController.save.PUT.summary=Save the credential inventory
AcquisitionCredentialsController.save.PUT.description=Replaces the entire list with entries. Omitted entries are removed. An empty secret retains the previous value for the same id. New entries need a secret. On a 409, read the new revision.
AcquisitionCredentialsController.save.PUT.success=Credential inventory saved.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Update.field.revision=Revision from the last read. A conflicting edit requires a fresh revision.
AcquisitionCredentialsController.save.PUT.body=Credential entries and the revision read before editing.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.id=Caller-assigned ID, unique within the library: 1–64 ASCII letters, digits or hyphens.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.id=Caller-assigned ID, unique within the library: 1–64 ASCII letters, digits or hyphens.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.name=Nonblank display name, at most 80 UTF-16 code units.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.name=Nonblank display name, at most 80 UTF-16 code units.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.enabled=Only enabled entries can be selected by ID for acquisition.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.enabled=Only enabled entries can be selected by ID for acquisition.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.secret=For a new ID, provide a nonblank credential of up to 16,384 UTF-16 code units without ASCII controls. Blank or null retains an existing ID’s secret. Reads return metadata only.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Update.field.entries=Entire replacement list, at most 8 entries. An empty array clears the library. Omitted entries are deleted.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Snapshot.field.entries=Current IDs, names and enablement in saved order.
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Snapshot.field.revision=Send this exact revision with the next save.
AcquisitionCredentialsController.save.PUT.response.409=The credential library revision changed. Read the current snapshot before submitting an edit.
AcquisitionCredentialsController.save.PUT.response.413=The submitted credential library exceeds the request body limit.
description=Read and update the credentials used to acquire works.
