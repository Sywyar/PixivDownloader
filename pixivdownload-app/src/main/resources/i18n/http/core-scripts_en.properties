schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.field.detectedHost=Server host detected from the request and used for the script's connection target.
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.ScriptItem.field.id=Script ID to use in installation and source paths.
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.ScriptItem.field.displayName=Script name in the requested language.
