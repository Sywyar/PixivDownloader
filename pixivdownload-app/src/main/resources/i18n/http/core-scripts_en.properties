title=Userscripts
ScriptController.listScripts.GET.summary=List available userscripts
ScriptController.listScripts.GET.description=Lists published script IDs, localized names, descriptions and versions. Use an ID in the installation or source path.
ScriptController.listScripts.GET.success=Available userscripts.
ScriptController.installScript.GET.summary=Download an installable userscript
ScriptController.installScript.GET.description=Returns the installable userscript. Set raw=true on the .user.js or /install path to read it as plain text.
ScriptController.installScript.GET.success=Installable userscript.
ScriptController.viewScriptSource.GET.summary=Get userscript source
ScriptController.viewScriptSource.GET.description=Requires raw=true to serve the source text. /api/scripts/{id} without raw mode returns 404.
ScriptController.viewScriptSource.GET.success=Userscript source.
parameter.raw=Request the raw userscript source.
parameter.id=Identifier from the userscript catalog.
