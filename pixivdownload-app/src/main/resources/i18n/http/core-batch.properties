title=手动批次
ManualBatchController.create.POST.summary=提交手动下载批次
ManualBatchController.create.POST.description=按已启用来源的定义启动一个后台下载批次。
ManualBatchController.create.POST.details=从 `GET /api/schedule/sources` 同一项取得 `sourceType`、`activationToken` 和 `inputSchemaJson`，按该结构把 `definition` 作为 JSON 对象提交。程序密钥读取目录需要 `core:schedule.sources.read`，创建需要 `core:batches.create` 和来源插件的 `batches.execute`，执行作品还需要对应执行器的 `batches.execute`。请求体上限为 8 MiB，序列化后的定义上限为 1 MiB。采集凭据通过请求头传入。\n\n\
    `202` 回执包含批次 `id`。用 `GET` 轮询 `Location` 读取 `state` 和 `code`，在其下的 `/items` 分页查看作品。程序密钥以创建批次的身份及 `core:batches.read` 读取。后台校验来源定义、绑定凭据并发现作品，然后交给相应执行器。定义无效时批次失败。来源重新发布时批次挂起，旧令牌不能用于新发布，须从最新目录重新创建。 批次受理后，后台检查本次计划所需执行器的 `batches.execute` 权限。若查询结果的 `code` 为 `auth.program.forbidden`，从同一响应的 `programPermission` 读取已知的缺失权限 ID。\n\n\
    每个进程只保留一个手动批次，上限为 5,000 个不同作品或 64 MiB 条目预算。达到容量上限会报告 `batch.work.capacity-exceeded`。暂停或取消后等本轮退出。`resume` 重新扫描并保留已完成、已跳过的条目，`retry` 仅处理已发现的失败或暂停条目。空闲后可删除记录再建批次。批次记录随进程结束而消失，已写入的文件和作品库记录保留。
ManualBatchController.create.POST.success=批次已受理。用创建批次的密钥和 `core:batches.read` 权限 GET `Location`。查看 `state` 和 `code`，后台缺权时从 `programPermission` 读取权限 ID。
ManualBatchController.create.POST.response.400=JSON、名称、来源、激活令牌、定义、代理或凭据头无效时返回 INVALID_TOOL_REQUEST。来源的定义校验在批次创建前完成，能定位时返回 field 和 reason，如 /definition/source/acquisitionMode 和 required。执行阶段的结果见批次状态。
ManualBatchController.create.POST.response.404=程序密钥指定的来源当前不可用（batch.not-found）。重新读取来源清单。
ManualBatchController.create.POST.response.409=已有批次（batch.exists），或服务正在停止（batch.stopping）。已有批次须先停止并删除。
ManualBatchController.create.POST.response.413=JSON 请求体超过 8 MiB（HTTP_BODY_LIMIT）。
ManualBatchController.create.POST.response.500=创建时数据库不可用，或服务发生未分类的状态错误（batch.operation-failed）。若读取正文失败，code 为 error.io。
ManualBatchController.current.GET.summary=查看当前批次
ManualBatchController.current.GET.description=返回当前进程保留的批次。没有批次或当前密钥无法查看时返回 204。批次记录不会跨进程重启保留。
ManualBatchController.current.GET.success=当前批次。
ManualBatchController.get.GET.summary=查看批次详情
ManualBatchController.get.GET.description=按提交时返回的 UUID 查询状态、run、原因码与计数。程序密钥只能查询自己创建的批次，否则返回 404。
ManualBatchController.get.GET.success=批次详情。
ManualBatchController.get.GET.response.404=该 UUID 的批次不存在，或批次属于另一程序身份（batch.not-found）。
ManualBatchController.items.GET.summary=分页查看批次条目
ManualBatchController.items.GET.description=按发现顺序返回逐项状态和结果，使用 offset（从 0 开始）与 limit（1–200）分页。作品由批次 UUID、workType 和 id 共同标识。
ManualBatchController.items.GET.success=批次条目。
ManualBatchController.items.GET.response.400=offset 小于 0，或 limit 不在 1–200 范围内（INVALID_TOOL_REQUEST）。
ManualBatchController.items.GET.response.404=该 UUID 的批次不存在，或批次属于另一程序身份（batch.not-found）。
ManualBatchController.pause.POST.summary=暂停批次
ManualBatchController.pause.POST.description=请求后台工作停止并保留进度。PAUSING 表示仍在退出，轮询至 PAUSED 后可调用 resume。
ManualBatchController.pause.POST.success=已暂停批次。
ManualBatchController.pause.POST.response.404=该 UUID 的批次不存在，或批次属于另一程序身份（batch.not-found）。
ManualBatchController.cancel.POST.summary=取消批次
ManualBatchController.cancel.POST.description=请求取消本轮执行。CANCELLING 表示尚未退出，轮询状态确认已停止。记录保留至显式删除。
ManualBatchController.cancel.POST.success=批次。
ManualBatchController.cancel.POST.response.404=该 UUID 的批次不存在，或批次属于另一程序身份（batch.not-found）。
ManualBatchController.resume.POST.summary=恢复批次
ManualBatchController.resume.POST.description=继续空闲且未完成的批次，重新扫描来源并保留已完成和已跳过的条目。返回递增后的 run。
ManualBatchController.resume.POST.success=已恢复批次。
ManualBatchController.resume.POST.response.404=批次不存在、属于另一程序身份，或其来源对程序密钥已不可用（batch.not-found）。
ManualBatchController.resume.POST.response.409=批次正在执行、已经完成或服务正在停止（batch.not-idle）。
ManualBatchController.retry.POST.summary=重试失败的批次条目
ManualBatchController.retry.POST.description=只重试已发现的失败作品；不会继续扫描来源。批次须空闲且至少有一个可重试项，否则返回 409。
ManualBatchController.retry.POST.success=失败的批次条目。
ManualBatchController.retry.POST.response.404=批次不存在、属于另一程序身份，或其来源对程序密钥已不可用（batch.not-found）。
ManualBatchController.retry.POST.response.409=批次不允许启动新一轮（batch.not-idle），或没有可重试的失败作品（batch.no-failed-work）。
ManualBatchController.credentials.PUT.summary=更新批次采集凭据
ManualBatchController.credentials.PUT.description=在空闲且未完成的批次上用当前 run 填写 expectedRun。通过 X-Acquisition-Credential 替换采集凭据，省略该头可清除凭据；下次执行时重新准备来源。
ManualBatchController.credentials.PUT.success=已更新批次采集凭据。
ManualBatchController.credentials.PUT.response.400=JSON 请求或取得凭据头无效（INVALID_TOOL_REQUEST）。
ManualBatchController.credentials.PUT.response.404=该 UUID 的批次不存在，或批次属于另一程序身份（batch.not-found）。
ManualBatchController.credentials.PUT.response.409=expectedRun 与当前轮次不符、批次正在执行或已完成，或服务正在停止（batch.not-idle）。请重新读取批次。
ManualBatchController.credentials.PUT.response.413=JSON 请求体超过 16 KiB（HTTP_BODY_LIMIT）。
ManualBatchController.resolve.POST.summary=处理待处理的批次条目
ManualBatchController.resolve.POST.description=在批次停止后，以当前 run、作品身份和原 reasonCode 提交决定；只接受仍需人工处理的项。保存后调用 resume 或 retry 执行。
ManualBatchController.resolve.POST.success=待处理的批次条目。
ManualBatchController.resolve.POST.response.400=JSON、作品身份或 userAction 格式无效（INVALID_TOOL_REQUEST）。
ManualBatchController.resolve.POST.response.404=该 UUID 的批次不存在，或批次属于另一程序身份（batch.not-found）。
ManualBatchController.resolve.POST.response.409=批次仍在执行或 expectedRun 已变化（batch.not-idle），或作品、reasonCode、待人工处理状态与当前记录不符（batch.action-changed）。
ManualBatchController.resolve.POST.response.413=JSON 请求体超过 16 KiB（HTTP_BODY_LIMIT）。
ManualBatchController.delete.DELETE.summary=删除批次记录
ManualBatchController.delete.DELETE.description=删除已停止批次的内存记录并释放其采集凭据，之后可创建新批次。活动批次返回 409。
ManualBatchController.delete.DELETE.success=已移除批次记录。
ManualBatchController.delete.DELETE.response.404=该 UUID 的批次不存在，或批次属于另一程序身份（batch.not-found）。
ManualBatchController.delete.DELETE.response.409=批次仍在执行或尚未完成停止（batch.not-idle）。等到批次进入空闲状态后再删除。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Credentials.field.expectedRun=从当前批次详情读取 run 并原样传入。运行轮次已经改变时返回 409。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.name=批次显示名称，1–200 个字符，不含控制字符，不可全为空白。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.sourceType=从 GET /api/schedule/sources 的所选条目复制 sourceType，使用同一条目的 activationToken。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.activationToken=所选来源当前发布的 activationToken。来源重新发布后须刷新来源目录和输入结构。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.definition=来源定义是 JSON 对象。按 OpenAPI 的 x-schedule-sources[sourceType].inputSchemaJson 填写，可直接修改 examples[0]。紧凑 JSON 最多 1 MiB（UTF-8），采集凭据请通过请求头发送。 同一来源声明生成两种表示。离线校验时解析 x-schedule-sources[sourceType].inputSchemaJson，以整段 JSON 为根。校验批次请求或生成 SDK 时使用 components.schemas 中对应的 ScheduleDefinition，引用相对整份 OpenAPI 解析。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.proxy=可选的 host:port，例如 127.0.0.1:7890。空值使用全局代理。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.expectedRun=从当前批次详情读取 run 并原样传入。运行轮次已经改变时返回 409。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.workType=workId 对应的作品类型。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.workId=与 workType 配对的来源作品 ID。按原字符串传入。
ManualBatchController.credentials.PUT.body=指定要变更采集凭据的批次执行。
ManualBatchController.create.POST.body=批次名称、来源定义和本次执行的代理设置。
ManualBatchController.resolve.POST.body=批次执行标识、待处理作品及处理决定。
parameter.id=提交手动批次时返回的 ID。
