schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.sourceType=来源的规范 ID，创建时取自 GET /api/schedule/sources。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.key=作品的 workType 和不透明 workId 组合。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.presentation=此作品的非敏感展示快照。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.workExecutorOwner=执行本作品的能力提供方或其精确发布实例。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.workExecutorPublicationId=执行本作品的能力提供方或其精确发布实例。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.result=执行器产生的作品结果，尚无结果时为空。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Items.field.offset=当前页首条记录的零基偏移量。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.name=创建时设置的批次显示名称。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.state=批次当前生命周期状态。暂停或取消中仍会等待运行项结束。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.code=没有原因码时为 null。先按 `state` 判断批次状态；来源或账号策略插件可以返回其他原因码，遇到未知值时仍按 `state` 处理。查询 Pixiv 作者作品列表时，若上游返回 HTTP 404（例如作者不存在或已退会），原因码为 `schedule.pixiv.discovery-not-found`。宿主原因码：`batch.work-failed` 查看失败项；`batch.discovery-incomplete` 恢复批次以继续发现作品；`batch.work.capacity-exceeded` 缩小来源范围；`schedule.error.source-publication-changed` 或 `schedule.error.execution-capability-unavailable` 核对来源及执行器；`schedule.error.definition-invalid` 检查定义；`auth.program.forbidden` 核对权限；`batch.dispatch-failed` 或 `batch.execution-failed` 检查服务端日志。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.run=当前运行轮次。修改凭据或解决作品问题时原样提交 expectedRun。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.createdTime=创建此批次的 Unix 毫秒时间。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.completed=已成功完成的作品条目数。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.skipped=被跳过的作品条目数。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.failed=执行失败的作品条目数。
guide=https://sywyar.github.io/PixivDownloader/#/zh-cn/batch-download
