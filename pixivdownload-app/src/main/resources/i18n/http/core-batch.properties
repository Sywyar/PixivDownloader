schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkKey.description=由 workType 与 id 组成的计划作品标识。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.description=来源插件缺席时仍可查看的作品信息。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.description=单个计划作品的执行结果及实时状态可用性。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.description=队列中一部作品的标识、展示信息和执行状态。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkKey.field.id=来源拥有的不透明作品标识
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.title=标题
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.attributes=通过敏感字段和大小校验的展示属性
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.attributes=执行结果的安全属性
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.packageId=物理插件包标识
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkKey.field.workType=作品类型的稳定机器标识
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.outcome=执行器报告的作品结果类别。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.author=作者
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.featurePluginId=功能插件标识
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.pluginGeneration=非负的插件代次
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.thumbnailReference=缩略图的安全引用；空值表示没有缩略图
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.resultCode=执行器结果码。例如已有下载时为 work.already-completed，对应 ALREADY_COMPLETED 和条目状态 skipped-downloaded。扩展可以返回其他代码。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.liveStatusAvailable=是否允许向同一作品执行器查询安全实时状态
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.userAction=与原因码对应的操作。DOWNLOAD_PATH_ACTION_REQUIRED 接受 TRUNCATE（截短名称）、DEFAULT_NAME（使用短名称）或 CANCEL（取消该作品）。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.rememberForRun=true 表示本轮同一原因可复用该决定，false 只处理指定作品。
parameter.X-Acquisition-Credential=用于访问作品来源的采集凭据，最长 16384 个字符。与 Authorization 中的程序密钥分开传送。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.reasonCode=该作品当前等待人工处理的原因码，必须与原记录精确匹配。
ManualBatchController.items.GET.parameter.limit=每次返回 1–200 条，超出范围返回 400。
ManualBatchController.items.GET.parameter.offset=从 0 开始的偏移量。负数返回 400。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.id=本次手动批次的 UUID，后续操作放入路径参数 id。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Items.field.items=按登记顺序返回的本轮作品队列条目。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Items.field.total=此队列或批次报告的作品条目总数。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.total=此队列或批次报告的作品条目总数。
