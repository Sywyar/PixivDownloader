title=Download archives
ArchiveController.initQuota.POST.summary=Initialize the download quota
ArchiveController.initQuota.POST.description=Reads usage and seconds until reset. With multi-user quotas enabled, the first request sets a user UUID cookie. Keep it for packing.
ArchiveController.initQuota.POST.success=Download quota initialized.
ArchiveController.triggerPack.POST.summary=Pack downloads for the current quota identity
ArchiveController.triggerPack.POST.description=Packs folders downloaded under this quota identity. Send the cookie from POST /api/quota/init. A 204 means there are no folders to pack, and 429 means the packing limit was reached.
ArchiveController.triggerPack.POST.success=Artwork archive.
ArchiveController.triggerAdminPack.POST.summary=Start an artwork archive
ArchiveController.triggerAdminPack.POST.description=Submit artworkIds. The server skips missing records or directories and packs each remaining folder once. It returns 204 for an empty selection, otherwise a token and expiry in seconds.
ArchiveController.triggerAdminPack.POST.success=Artwork archive.
ArchiveController.listAdminArchives.GET.summary=List artwork archives
ArchiveController.listAdminArchives.GET.description=Lists administrative archives. Use a returned token to check status or download its file.
ArchiveController.listAdminArchives.GET.success=Artwork archives.
ArchiveController.archiveStatus.GET.summary=Get archive progress
ArchiveController.archiveStatus.GET.description=Poll with the packing token. When the status is ready, request /api/archive/download/{token}. Unknown and expired tokens return 200 with {"status":"expired"}. Both token and expireSeconds are omitted. A ready ZIP remains downloadable if source deletion fails or completes partially. Read sourceDeletion for the separate outcome and count of confirmed deletions.
ArchiveController.archiveStatus.GET.success=Archive progress.
ArchiveController.downloadArchive.GET.summary=Download an artwork archive
ArchiveController.downloadArchive.GET.description=Returns a ZIP attachment. A 202 means preparation is pending, 410 means the token is gone, and 404 means the ready archive file is missing.
ArchiveController.downloadArchive.GET.success=Artwork archive.
parameter.token=Token returned when this operation or subscription was created.
schema.top.sywyar.pixivdownload.quota.request.AdminPackRequest.title=Artworks to archive
schema.top.sywyar.pixivdownload.quota.request.AdminPackRequest.field.artworkIds=Pixiv artwork IDs to include.
ArchiveController.triggerPack.POST.body=Artworks to archive
ArchiveController.triggerAdminPack.POST.body=Artworks to archive
ArchiveController.downloadArchive.GET.response.202=Archive preparation is still pending. Retry with the same token.
ArchiveController.downloadArchive.GET.response.410=The archive token is unknown or expired.
ArchiveController.downloadArchive.GET.response.404=The archive entry is ready but its file is missing.
ArchiveController.triggerPack.POST.response.204=No downloaded folders are recorded for this user.
ArchiveController.triggerPack.POST.response.429=The pack request limit was reached. The response reports the maximum count and window in minutes.
ArchiveController.triggerAdminPack.POST.response.204=None of the selected artworks has an existing folder to archive.
