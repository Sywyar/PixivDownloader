schema.top.sywyar.pixivdownload.quota.response.ArchiveStatusResponse.field.sourceDeletion=Outcome of the requested source deletion after export.
schema.top.sywyar.pixivdownload.quota.response.AdminArchiveTasksResponse.Task.field.sourceDeletion=Outcome of the requested source deletion after export.
schema.top.sywyar.pixivdownload.quota.response.ArchiveStatusResponse.SourceDeletion.field.status=not_requested means deletion was not requested. pending means waiting for the archive. running means deletion is in progress. not_started means the archive did not complete. succeeded, partial and failed report the outcome based on committed deletions.
schema.top.sywyar.pixivdownload.quota.response.ArchiveStatusResponse.SourceDeletion.field.requestedWorks=Number of distinct works requested for deletion.
schema.top.sywyar.pixivdownload.quota.response.ArchiveStatusResponse.SourceDeletion.field.deletedWorks=Number of works with confirmed deletion commits. Deleting an external reference removes the work registration and preserves its source file.
