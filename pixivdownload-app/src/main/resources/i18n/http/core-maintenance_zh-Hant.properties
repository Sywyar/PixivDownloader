title=維護任務
BackfillController.defaults.GET.summary=檢視補全任務預設選項
BackfillController.defaults.GET.description=返回補全任務的預設間隔、條目上限、試執行和聯網選項。
BackfillController.defaults.GET.success=補全任務預設選項。
BackfillController.candidates.POST.summary=統計待補全的作品
BackfillController.candidates.POST.description=根據提交的補全選項統計候選作品數量，供啟動任務前確認。
BackfillController.candidates.POST.success=符合條件的作品數。
BackfillController.start.POST.summary=提交作品補全任務
BackfillController.start.POST.description=使用 artworkIds 補齊指定插畫缺漏的作者、標籤和系列等資料。先用 POST /api/tools/backfill/candidates 查看候選數，dryRun 可試跑，收到 202 後依 Location 查詢進度。 一次只執行一個回填任務。結束後可透過原 Location 查詢最多 1 小時，僅保留最近 64 個最終結果。工作到期、遭移除或伺服器重新啟動後，GET /api/tools/backfill/tasks/{id} 會回傳 404。
BackfillController.start.POST.success=作品補全任務。
BackfillController.current.GET.summary=檢視當前補全任務
BackfillController.current.GET.description=傳回最近啟動的回填任務，包含已結束的任務。尚未啟動過任務時傳回 204。
BackfillController.current.GET.success=當前補全任務。
BackfillController.status.GET.summary=檢視補全任務進度
BackfillController.status.GET.description=一次只執行一個回填任務。結束後可透過原 Location 查詢最多 1 小時，僅保留最近 64 個最終結果。工作到期、遭移除或伺服器重新啟動後，GET /api/tools/backfill/tasks/{id} 會回傳 404。
BackfillController.status.GET.success=補全任務進度。
BackfillController.cancel.POST.summary=取消補全任務
BackfillController.cancel.POST.description=要求取消此 ID 的回填，回傳該任務的最新狀態。再次取消仍在保留期內的已結束任務，會回傳原本的最終結果。
BackfillController.cancel.POST.success=補全任務。
StartupCacheController.status.GET.summary=檢視啟動快取狀態
StartupCacheController.status.GET.description=available 指示此安裝是否提供訓練服務，task 是該服務的當前快照。
StartupCacheController.status.GET.success=啟動快取狀態。
StartupCacheController.start.POST.summary=提交啟動快取訓練
StartupCacheController.start.POST.description=傳送空 JSON 物件 {} 啟動一輪訓練。202 返回 executionId；訓練服務不可用時返回 503。
StartupCacheController.start.POST.success=啟動快取訓練。
StartupCacheController.cancel.POST.summary=取消啟動快取訓練
StartupCacheController.cancel.POST.description=傳入啟動時的 executionId。正在執行的同一輪訓練接受取消後返回 202；執行記錄不匹配時返回 409。
StartupCacheController.cancel.POST.success=啟動快取訓練。
MaintenanceController.status.GET.summary=檢視維護任務狀態
MaintenanceController.status.GET.description=從本機讀取維護開關、暫停狀態、最近起止時間及觸發者。
MaintenanceController.status.GET.success=維護任務狀態。
MaintenanceController.run.POST.summary=執行維護任務
MaintenanceController.run.POST.description=從本機觸發手動維護。started 表示是否啟動了新一輪；維護框架關閉時返回 503。
MaintenanceController.run.POST.success=維護任務。
