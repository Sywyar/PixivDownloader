title=本地文件导入
LocalImportController.presets.GET.summary=列出本地导入预设
LocalImportController.presets.GET.description=选择已保存的预设，将其 `template` 放入 `templates` 数组，调用 `POST /api/local-import/previews` 预览匹配的文件。
LocalImportController.presets.GET.success=本地导入预设。
LocalImportController.scan.POST.summary=预览本地作品扫描
LocalImportController.scan.POST.description=用文件路径模板和作品选择创建扫描预览。202 返回扫描状态；通过 previews/{id}/items 检查候选文件后再启动导入。
LocalImportController.scan.POST.success=本地作品扫描。
LocalImportController.status.GET.summary=查看扫描或导入进度
LocalImportController.status.GET.description=使用预览或任务的 UUID 读取扫描、导入或取消状态。逐项结果从相同 ID 的 items 路径读取。 导入完成后，从结果取作品 ID，调用 POST /api/tools/backfill/candidates，再用 POST /api/tools/backfill/tasks 补全标题、作者、标签和系列。
LocalImportController.status.GET.success=扫描或导入进度。
LocalImportController.items.GET.summary=分页查看扫描或导入条目
LocalImportController.items.GET.description=读取预览或任务中的作品、匹配文件和处置结果。offset 从 0 开始，limit 为 1–100，默认 20。
LocalImportController.items.GET.success=扫描或导入条目。
LocalImportController.start.POST.summary=提交本地作品导入任务
LocalImportController.start.POST.description=传入已检查预览的 previewId，启动后台导入。202 后按返回的任务身份查询状态和 items。 导入完成后，从结果取作品 ID，调用 POST /api/tools/backfill/candidates，再用 POST /api/tools/backfill/tasks 补全标题、作者、标签和系列。
LocalImportController.start.POST.success=本地作品导入任务。
LocalImportController.cancel.POST.summary=取消扫描或导入任务
LocalImportController.cancel.POST.description=对指定 UUID 的扫描预览或导入任务请求取消，返回该次操作的状态。
LocalImportController.cancel.POST.success=扫描或导入任务。
FileImportToolController.tools.GET.summary=列出文件导入工具
FileImportToolController.tools.GET.description=列出当前可用的文件导入工具。后续调用应复制所选条目的完整 identity，包括 generation 和 publication。
FileImportToolController.tools.GET.success=文件导入工具。
FileImportToolController.inspect.POST.summary=预览文件导入内容
FileImportToolController.inspect.POST.description=提交工具 identity、记录文件或分片目录的绝对路径 recordFile 及来源目录 sourceRoot。返回预览和供执行使用的 token。
FileImportToolController.inspect.POST.success=文件导入内容。
FileImportToolController.start.POST.summary=提交文件导入任务
FileImportToolController.start.POST.description=使用同一工具 identity 和本次预览的 token 启动导入。工具声明 requiresCredential 时提供 credential。202 返回任务快照。
FileImportToolController.start.POST.success=文件导入任务。
FileImportToolController.status.GET.summary=查看当前文件导入进度
FileImportToolController.status.GET.description=按工具 identity 查询该提供方当前的导入执行记录。
FileImportToolController.status.GET.success=当前文件导入进度。
FileImportToolController.cancel.POST.summary=取消当前文件导入任务
FileImportToolController.cancel.POST.description=提交同一工具的 identity 和 executionId；仅当该执行仍可取消时返回更新后的快照。
FileImportToolController.cancel.POST.success=当前文件导入任务。
FileImportToolController.acknowledge.POST.summary=确认文件导入完成提示
FileImportToolController.acknowledge.POST.description=提交工具 identity 和待确认记录的 completionId，只确认该次已完成的导入。
FileImportToolController.acknowledge.POST.success=文件导入完成提示。
