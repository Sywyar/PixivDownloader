title=예약 작업
ScheduleController.sources.GET.summary=예약 작업 소스 목록 조회
ScheduleController.sources.GET.description=sourceType을 선택하고 같은 항목의 activationToken을 보관하세요. inputSchemaJson을 독립 JSON Schema로 파싱해 examples를 확인합니다. 오프라인 문서의 x-schedule-sources[sourceType].inputSchemaJson에도 스키마 문자열이 있으며 유효한 선언이 없으면 null입니다. 소스 버전이 바뀌면 이 API에서 토큰을 다시 조회하세요. 두 형식은 같은 공급자 선언에서 생성됩니다. 독립 검증에는 x-schedule-sources[sourceType].inputSchemaJson 전체를 루트로 파싱하세요. 배치 검증이나 SDK 생성에는 전체 OpenAPI 문서를 기준으로 해당 ScheduleDefinition 구성 요소를 해석하세요.
ScheduleController.sources.GET.success=예약 작업 소스.
ScheduleController.list.GET.summary=예약 작업 목록 조회
ScheduleController.list.GET.description=저장된 작업과 현재 상태를 반환합니다. 프로그램 키는 해당 소스 플러그인에 schedule.manage 권한이 있는 작업만 조회합니다. 일정 데이터베이스를 사용할 수 없는 경우에도 빈 배열을 반환합니다.
ScheduleController.list.GET.success=예약 작업.
ScheduleController.get.GET.summary=예약 작업 세부 정보 조회
ScheduleController.get.GET.description=정의, 트리거, 최신 상태를 반환합니다. 편집 전에 stateVersion을 보관하세요. paramsJson에는 소스 정의가 들어가며 자격 증명은 별도로 연결합니다.
ScheduleController.get.GET.success=예약 작업 세부 정보.
ScheduleController.get.GET.response.400=해당 ID의 작업이 없습니다(schedule.error.not-found).
ScheduleController.get.GET.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.queue.GET.summary=최근 실행의 큐 목록 조회
ScheduleController.queue.GET.description=최근 실행에서 찾은 작품과 항목별 결과를 반환합니다. 실행 기록이 없으면 items가 비어 있습니다. truncated는 대기열 또는 실시간 상태의 일부가 생략됐음을 나타냅니다.
ScheduleController.queue.GET.success=최근 실행의 큐.
ScheduleController.queue.GET.response.400=해당 ID의 작업이 없습니다(schedule.error.not-found).
ScheduleController.queue.GET.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.create.POST.summary=예약 작업 생성
ScheduleController.create.POST.description=GET /api/schedule/sources에서 소스의 스키마와 토큰을 읽고 직렬화한 definitionJson을 보내세요. triggerKind에 따라 intervalMinutes 또는 cronExpr를 지정하고 생성 시 expectedStateVersion은 생략하세요. 응답에 작업 ID가 포함됩니다. 새 일정은 활성 상태로 생성됩니다. 나중에 쓸 일정은 첫 실행을 충분히 먼 미래로 지정한 뒤 별도 요청으로 POST /api/schedule/tasks/{id}/enabled?enabled=false를 호출하세요. 소스의 schedulePermission을 확인하세요. 권한이 없거나 소스를 찾을 수 없으면 403을 반환합니다. 권한이 있는 소스의 토큰이 만료되면 409(schedule.error.source-publication-changed)를 반환합니다. 소스 목록을 다시 조회하세요.
ScheduleController.create.POST.success=예약 작업을 생성했습니다.
ScheduleController.create.POST.response.400=필수 필드나 JSON이 잘못되었거나, 생성 시 expectedStateVersion을 보냈거나, 소스를 사용할 수 없거나, 정의 또는 트리거가 유효하지 않거나 작업 수가 한도에 도달했습니다. 정의 검증에 실패하면 schedule.error.definition-invalid가 반환됩니다.
ScheduleController.create.POST.response.409=activationToken이 오래되었거나(schedule.error.source-publication-changed) 저장 중 소스가 바뀌었습니다(schedule.error.concurrent-change). 소스 목록을 다시 조회하세요.
ScheduleController.create.POST.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.update.PUT.summary=예약 작업 수정
ScheduleController.update.PUT.description=유휴 작업의 정의 전체를 보내고 편집 전에 읽은 stateVersion을 expectedStateVersion에 넣으세요. 같은 소스 플러그인을 사용해야 합니다. 저장하면 이전 체크포인트와 보류 항목이 지워집니다. 버전 충돌 시 작업을 다시 읽으세요. 소스의 schedulePermission을 확인하세요. 수정할 때는 기존 작업의 소유자 권한도 확인합니다. 권한이 없거나 소스를 찾을 수 없으면 403을 반환합니다. 권한이 있는 소스의 토큰이 만료되면 409(schedule.error.source-publication-changed)를 반환합니다. 소스 목록을 다시 조회하세요.
ScheduleController.update.PUT.success=예약 작업을 변경했습니다.
ScheduleController.update.PUT.response.400=필드·정의·트리거가 잘못되었거나 expectedStateVersion이 없거나, 작업이 없거나 실행 또는 대기 중입니다. 사용 가능한 같은 플러그인의 소스여야 하며 기존 자격 증명 정책과 호환되어야 합니다.
ScheduleController.update.PUT.response.409=편집을 시작한 뒤 작업 버전이 바뀌었거나(schedule.error.concurrent-change) 소스가 다시 게시되었습니다(schedule.error.source-publication-changed). 작업과 소스 목록을 다시 조회하세요.
ScheduleController.update.PUT.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.delete.DELETE.summary=예약 작업 삭제
ScheduleController.delete.DELETE.description=유휴 작업과 관련 보류 항목, 최근 실행 대기열을 삭제합니다.
ScheduleController.delete.DELETE.success=예약 작업을 제거했습니다.
ScheduleController.delete.DELETE.response.400=작업이 없거나 실행 또는 대기 중이거나 쓰기 중 상태가 바뀌었습니다. 각각 schedule.error.not-found, schedule.error.busy, schedule.error.concurrent-change로 구분합니다.
ScheduleController.delete.DELETE.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.setEnabled.POST.summary=예약 작업 활성화 상태 설정
ScheduleController.setEnabled.POST.description=유휴 작업에서 쿼리 enabled=true 또는 false로 자동 실행을 설정하세요. 비활성화해도 정의와 상태는 유지됩니다.
ScheduleController.setEnabled.POST.success=예약 작업 활성화 상태를 저장했습니다.
ScheduleController.setEnabled.POST.response.400=작업이 없거나 실행 또는 대기 중이거나 쓰기 중 상태가 바뀌었습니다. 각각 schedule.error.not-found, schedule.error.busy, schedule.error.concurrent-change로 구분합니다.
ScheduleController.setEnabled.POST.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.bindCredential.POST.summary=작업 수집 자격 증명 연결
ScheduleController.bindCredential.POST.description=수집 자격 증명은 X-Acquisition-Credential 헤더에, 소스의 현재 activationToken은 본문에 보내세요. 정책이 검증 후 연결하며 응답은 연결 상태를 반환합니다.
ScheduleController.bindCredential.POST.success=작업 수집 자격 증명을 연결했습니다.
ScheduleController.bindCredential.POST.response.400=작업이 없거나 사용 중이며, 자격 증명 헤더가 누락·공백·무효·기존 값과 동일하거나 고정된 바인딩이거나 소스에서 검증할 수 없습니다. 무효한 자격 증명은 schedule.error.credential-invalid, 확인 실패는 schedule.error.credential-probe-failed입니다.
ScheduleController.bindCredential.POST.response.409=자격 증명 검증 중 작업이나 소스가 바뀌었습니다. 작업과 최신 activationToken을 다시 조회하세요.
ScheduleController.bindCredential.POST.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.revokeCredential.DELETE.summary=작업 자격 증명 연결 철회
ScheduleController.revokeCredential.DELETE.description=작업에 저장된 수집 자격 증명 연결을 해제합니다. 계정이 필수인 소스는 실행하기 전에 유효한 자격 증명을 다시 연결하세요.
ScheduleController.revokeCredential.DELETE.success=작업 자격 증명 연결을 철회했습니다.
ScheduleController.revokeCredential.DELETE.response.400=작업이 없거나 사용 중이거나, 자격 증명 정책을 사용할 수 없거나, 고정된 바인딩은 해제할 수 없습니다(schedule.error.credential-fixed).
ScheduleController.revokeCredential.DELETE.response.409=쓰기 중 작업 버전 또는 자격 증명 정책이 바뀌었습니다. 작업을 다시 조회하세요.
ScheduleController.revokeCredential.DELETE.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.applyCredentialPolicyAction.POST.summary=자격 증명 정책 작업 실행
ScheduleController.applyCredentialPolicyAction.POST.description=작업의 credentialPolicy에서 ownerPluginId, policyId, publicationId, accountKey를 복사합니다. 같은 응답의 accountActionsSchemaJson을 파싱하고 예시에 따라 actionId와 parameters를 지정합니다. 해당 계정에서 조건을 만족하는 작업에 적용됩니다.
ScheduleController.applyCredentialPolicyAction.POST.success=자격 증명 정책 작업.
ScheduleController.applyCredentialPolicyAction.POST.response.400=요청 필드가 잘못되었거나 해당 계정에 작업이 없거나 정책이 동작, 매개변수 또는 결과를 거부했습니다. 예로 schedule.error.credential-account-not-found와 schedule.error.credential-account-action-unsupported가 있습니다.
ScheduleController.applyCredentialPolicyAction.POST.response.409=정책 publicationId나 소유자 또는 계정 작업의 상태가 바뀌었습니다. 정책과 관련 작업을 다시 조회하세요.
ScheduleController.applyCredentialPolicyAction.POST.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.updateProxy.POST.summary=작업 전용 프록시 설정
ScheduleController.updateProxy.POST.description=유휴 작업에 127.0.0.1:7890 같은 host:port를 지정해 프록시를 설정하세요. null 또는 빈 문자열을 쓰면 전역 설정으로 돌아갑니다.
ScheduleController.updateProxy.POST.success=작업 전용 프록시를 저장했습니다.
ScheduleController.updateProxy.POST.response.400=프록시가 host:port 형식이 아니거나(schedule.error.proxy-invalid) 작업이 없거나 사용 중이거나 상태가 바뀌었습니다.
ScheduleController.updateProxy.POST.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.runOnce.POST.summary=예약 작업 즉시 실행 실행
ScheduleController.runOnce.POST.description=활성화되어 있고 일시 중지되지 않은 유휴 작업을 백그라운드로 한 번 실행하도록 요청합니다. success 후 작업의 queue에서 작품별 진행 상태를 조회하세요.
ScheduleController.runOnce.POST.success=예약 작업 즉시 실행.
ScheduleController.runOnce.POST.response.400=작업이 없거나 이미 실행·대기 중이거나 비활성화(schedule.error.run-disabled) 또는 일시 중단(schedule.error.run-suspended) 상태입니다.
ScheduleController.runOnce.POST.response.429=백그라운드 실행기가 이번 실행을 받아들이지 않았습니다(task.queue.full). 잠시 후 다시 시도하세요.
ScheduleController.runOnce.POST.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.pause.POST.summary=현재 작업 실행 일시 중지
ScheduleController.pause.POST.description=실행 중이거나 대기열에 있는 작업을 일시 중지하고 이번 실행 중단을 요청합니다. 유휴 작업의 자동 시작을 막으려면 enabled=false를 사용하세요.
ScheduleController.pause.POST.success=현재 작업 실행을 일시 중지했습니다.
ScheduleController.pause.POST.response.400=작업이 없거나 이미 일시 중단되었거나 중단할 대기·실행 중 작업이 없거나(schedule.error.pause-idle) 쓰기 중 상태가 바뀌었습니다.
ScheduleController.pause.POST.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.resolvePending.POST.summary=보류 중인 작품 처리
ScheduleController.resolvePending.POST.description=USER_ACTION_REQUIRED로 중지된 유휴 작업에 결정을 기록합니다. 작업의 stateVersion과 pending의 workType, workId를 사용하고 갱신된 작업에서 resume를 호출하세요.
ScheduleController.resolvePending.POST.success=보류 중인 작품.
ScheduleController.resolvePending.POST.response.400=작업이 없거나 사용 중이거나 요청 필드가 잘못되었거나 버전, 중단 사유 또는 대기 작품이 바뀌었습니다(schedule.error.concurrent-change). 작업과 대기 목록을 다시 조회하세요. DOWNLOAD_PATH_ACTION_REQUIRED에는 TRUNCATE, DEFAULT_NAME 또는 CANCEL을 지정하세요. 다른 값을 보내면 400 응답의 /userAction 필드에 오류가 표시됩니다. 작품은 확인 대기 상태이므로 값을 고쳐 바로 다시 보낼 수 있습니다.
ScheduleController.resolvePending.POST.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.resume.POST.summary=예약 작업 다시 시작
ScheduleController.resume.POST.description=MANUAL 또는 USER_ACTION_REQUIRED 중지를 해제합니다. 활성화된 작업은 즉시 실행을 요청하며 비활성 작업은 중지만 해제합니다.
ScheduleController.resume.POST.success=예약 작업을 재개했습니다.
ScheduleController.resume.POST.response.400=작업이 없거나 사용 중이거나 MANUAL 또는 USER_ACTION_REQUIRED로 중단된 상태가 아니거나(schedule.error.resume-not-paused) 상태가 바뀌었습니다.
ScheduleController.resume.POST.response.429=백그라운드 실행기가 이번 실행을 받아들이지 않았습니다(task.queue.full). 잠시 후 다시 시도하세요.
ScheduleController.resume.POST.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.pending.GET.summary=재시도 대기 작품 목록 조회
ScheduleController.pending.GET.description=저장된 재시도 및 수동 결정 대기 작품을 반환합니다. workType과 workId로 항목을 식별하고 reasonCode, reasonDetailJson 및 시도 횟수를 확인하세요.
ScheduleController.pending.GET.success=재시도 대기 작품.
ScheduleController.pending.GET.response.400=해당 ID의 작업이 없습니다(schedule.error.not-found).
ScheduleController.pending.GET.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
ScheduleController.clearPending.DELETE.summary=수동 처리가 필요한 항목 지우기
ScheduleController.clearPending.DELETE.description=유휴 작업에서 pending이 반환한 workType과 workId로 보류 기록 하나를 삭제해 해당 기록의 재시도를 중단합니다.
ScheduleController.clearPending.DELETE.success=수동 처리가 필요한 항목을 지웠습니다.
ScheduleController.clearPending.DELETE.response.400=작품 식별자가 잘못되었거나 작업이 없거나 사용 중이거나 삭제 중 기록이 바뀌었습니다(schedule.error.concurrent-change).
ScheduleController.clearPending.DELETE.response.503=일정 데이터베이스를 사용할 수 없습니다(DATABASE_UNAVAILABLE).
parameter.X-Acquisition-Credential=작품 소스에 접근하는 수집 자격 증명으로 최대 16,384자입니다. 프로그램 키는 별도로 Authorization에 보내세요.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.title=실행 일정 및 다운로드 소스
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.name=표시 이름입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.sourceType=GET /api/schedule/sources에서 선택한 항목의 sourceType과 같은 항목의 activationToken을 사용하세요.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.activationToken=선택한 소스의 현재 activationToken입니다. 소스가 다시 게시되면 목록과 입력 스키마를 새로 조회하세요.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.definitionJson=OpenAPI의 x-schedule-sources[sourceType].inputSchemaJson에서 JSON Schema를 조회하고 examples[0]을 바탕으로 정의 객체를 만든 뒤 이 필드에 문자열로 직렬화하세요. UTF-8 기준 최대 1 MiB이며 자격 증명을 포함하지 마세요. 최신 activationToken은 GET /api/schedule/sources에서 가져옵니다. 오프라인 검증 시 $id와 $defs를 포함한 전체 schema를 검증 루트로 사용하세요. 같은 값을 수동 배치에는 객체로, 예약 작업에는 JSON 문자열로 보냅니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.expectedStateVersion=작업을 만들 때는 생략하거나 null을 보냅니다. 수정할 때는 작업에서 읽은 stateVersion을 보냅니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.triggerKind=고정 간격은 interval, Cron 일정은 cron을 사용합니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.intervalMinutes=triggerKind=interval일 때 필요한 양의 정수이며 단위는 분입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.cronExpr=triggerKind=cron일 때 필요한 Spring cron 표현식입니다. 예를 들어 0 0 9 * * *는 서버 현지 시각으로 매일 09:00입니다. GET /api/schedule/sources의 timeZone에서 스케줄러 시간대를 확인할 수 있습니다. 저장 후에는 작업의 nextRunTime(Unix 밀리초)을 확인하세요.
