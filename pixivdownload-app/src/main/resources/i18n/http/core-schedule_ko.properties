schema.top.sywyar.pixivdownload.schedule.dto.ScheduleQueueView.Item.field.status=pending은 실행 대기, paused는 일시 정지, downloaded는 완료, skipped-downloaded는 이미 완료, skipped-filter는 실행기가 건너뜀, failed는 실패입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleQueueView.Item.field.message=실행기 또는 호스트가 기록한 추가 상태 설명입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleQueueView.Item.field.liveStatus=조회 시 실행기가 제공한 실시간 상태 맵입니다. 이용할 수 없으면 {}입니다. 빈 값은 {}입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.field.epoch=현재 프로세스의 목록 세대입니다. 동일 세대 안에서만 revision을 비교합니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.field.revision=현재 epoch에서 소스 목록의 리비전입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.field.sources=호출자에게 보이는 활성 소스 선언입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Frontend.field.contractVersion=소스 프런트엔드를 해석하는 계약 버전입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Presentation.field.colorToken=제공자가 선택한 표시 색상 토큰입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.sourceType=생성 시 GET /api/schedule/sources에서 선택한 정식 소스 ID입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.legacyAliases=이 소스의 기존 별칭입니다. 새 요청은 sourceType을 사용합니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.packageId=제공자 패키지, 활성 세대 또는 게시 인스턴스를 식별합니다. 플러그인 변경 후 다시 조회합니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.pluginGeneration=제공자 패키지, 활성 세대 또는 게시 인스턴스를 식별합니다. 플러그인 변경 후 다시 조회합니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.publicationId=제공자 패키지, 활성 세대 또는 게시 인스턴스를 식별합니다. 플러그인 변경 후 다시 조회합니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.activationToken=선택한 소스의 토큰을 그대로 제출합니다. 만료되면 소스 목록을 다시 조회합니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.definitionSchema=제공자 형식 ID 또는 버전입니다. 같은 항목의 inputSchemaJson에서 필드와 예시를 읽습니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.definitionVersion=제공자 형식 ID 또는 버전입니다. 같은 항목의 inputSchemaJson에서 필드와 예시를 읽습니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.presentation=소스 이름, 설명 및 아이콘 표시 메타데이터입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.acquisitionModes=제공자가 선언한 수집 모드 코드입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.possibleWorkTypes=이 소스가 생성할 수 있는 작품 유형 ID입니다.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.Source.field.frontend=선택적 소스 편집기 모듈과 계약 버전입니다.
guide=https://sywyar.github.io/PixivDownloader/#/ko/scheduled-tasks
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.field.timeZone=서버가 Spring cron 실행 시각을 계산할 때 사용하는 시간대입니다. 예: Asia/Tokyo.
description=소스를 확인하고 트리거와 예약 작업을 관리합니다.
