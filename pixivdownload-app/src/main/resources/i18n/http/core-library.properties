DownloadedWorkController.getPagedHistory.GET.parameter.size=每页条数，默认 10。小于 1 取 1；邀请访客最多 200，管理员和程序密钥可请求更大的页。
AuthorController.getPagedAuthors.GET.parameter.sort=排序字段可选 artworks, authorId 或 name。其他值按 name 排序。
MangaSeriesController.getPagedSeries.GET.parameter.sort=排序字段可选 artworks, seriesId 或 title。其他值按 title 排序。
DownloadedWorkController.getPagedHistory.GET.parameter.sort=排序字段可选 author_id 或 time。其他值按 time 排序。
DownloadedWorkController.moveArtWork.POST.parameter.artworkId=路径中的旧作品标识。接口已退役，鉴权后忽略其值。
