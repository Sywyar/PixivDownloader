AuthorController.getAuthors.GET.summary=列出已保存作品的作者
AuthorController.getAuthors.GET.description=列出当前身份能看到的本地作者。需要搜索、排序或分页时使用 /api/authors/paged。
AuthorController.getAuthors.GET.success=已保存作品的作者。
AuthorController.getPagedAuthors.GET.summary=分页查看作者
AuthorController.getPagedAuthors.GET.description=page 从 0 开始，size 限在 1–200。sort 可选 name、artworks、authorId；未知排序按 name 处理。
AuthorController.getPagedAuthors.GET.success=作者。
WorkAssetFileController.getThumbnail.GET.summary=查看作品分页缩略图
WorkAssetFileController.getThumbnail.GET.description=按 artworkId 和 page 读取本地缩略图。cover 选择封面缩略图，size 选择请求尺寸。首选 GET /api/downloaded/thumbnail/{artworkId}/{page}。GET /api/downloaded/thumbnail-file/{artworkId}/{page} 是别名；相同的 cover 和 size 走同一缩略图处理流程。
WorkAssetFileController.getThumbnail.GET.success=作品分页缩略图。
WorkAssetFileController.getImage.GET.summary=查看作品分页图像
WorkAssetFileController.getImage.GET.description=返回该页适合显示的图像。原文件是 ZIP 时返回缩略图，需要 ZIP 原件时用 rawfile。用上次响应的 ETag 作为 If-None-Match 重新验证。仅发送 If-Modified-Since 时返回当前文件。
WorkAssetFileController.getImage.GET.success=作品分页图像。
WorkAssetFileController.getRawFile.GET.summary=下载作品分页原文件
WorkAssetFileController.getRawFile.GET.description=读取本地保存的该页文件，页码从 0 开始。已保留原格式时优先返回原文件（包括 ZIP），只保留转换格式时返回可用的本地格式。程序密钥需要 core:assets.export。用上次响应的 ETag 作为 If-None-Match 重新验证。仅发送 If-Modified-Since 时返回当前文件。
WorkAssetFileController.getRawFile.GET.success=作品分页原文件。
DownloadedWorkController.getDownloaded.GET.summary=查看已下载作品详情
DownloadedWorkController.getDownloaded.GET.description=按作品 ID 查阅本地下载登记。verifyFiles 默认为 false，传 true 时同时核对文件。找不到可用登记时返回 400。 程序密钥请使用 /api/library/artworks/{artworkId}。对应的 /api/downloaded 路径使用本地访问策略。
DownloadedWorkController.getDownloaded.GET.success=已下载作品详情。
DownloadedWorkController.recoverMetadata.POST.summary=用已知数据补齐作品字段
DownloadedWorkController.recoverMetadata.POST.description=提交至少一个可用字段。已有值会保留；新登记需要页数及全部文件。自动获取 Pixiv 元数据、标签和系列请使用 POST /api/tools/backfill/tasks。 程序密钥请使用 /api/library/artworks/{artworkId}/recover-metadata。对应的 /api/downloaded 路径使用本地访问策略。 新登记要求每页恰有一个可按默认文件名定位的非空图片；同页多个候选会拒绝登记。逐页记录本地文件的格式，上游原图格式保留为未知。默认目录不得与其他作品目录或只读导入文件重叠。
DownloadedWorkController.recoverMetadata.POST.success=已恢复作品元数据。
DownloadedWorkController.getBatchArtworks.POST.summary=查询多幅作品的下载记录
DownloadedWorkController.getBatchArtworks.POST.description=按提交的 ID 顺序返回已登记且未删除的作品，忽略未知 ID。includeDeleted 为 true 时，另在 deletedArtworkIds 中返回已删除的 ID。
DownloadedWorkController.getBatchArtworks.POST.success=多幅作品的下载记录。
DownloadedWorkController.getStatistics.GET.summary=查看作品下载统计
DownloadedWorkController.getStatistics.GET.description=libraryArtworks 和 libraryImages 包含导入并排除已删除记录。管理员的 totalArtworks 和 totalImages 为累计下载量，访客仅看到自己可见的在库数量。
DownloadedWorkController.getStatistics.GET.success=作品下载统计。
DownloadedWorkController.moveArtWork.POST.summary=作品移动登记（已退役）
DownloadedWorkController.moveArtWork.POST.description=通过原有权限检查后返回空响应 HTTP 410。此接口不再修改文件或作品记录。
DownloadedWorkController.moveArtWork.POST.response.410=通过原有权限检查后返回空响应 HTTP 410。此接口不再修改文件或作品记录。
DownloadedWorkController.getHistory.GET.summary=列出作品下载历史
DownloadedWorkController.getHistory.GET.description=返回可见的已下载作品 ID 列表。按页读取作品记录请使用 history/paged。
DownloadedWorkController.getHistory.GET.success=作品下载历史。
DownloadedWorkController.getPagedHistory.GET.summary=分页查看作品下载历史
DownloadedWorkController.getPagedHistory.GET.description=分页返回下载记录。sort=author_id 按作者 ID 排序，其他值按下载时间排序。
DownloadedWorkController.getPagedHistory.GET.success=作品下载历史。
