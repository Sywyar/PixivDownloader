SettingsController.presets.GET.success=설정 프리셋.
SettingsController.validate.POST.summary=저장할 설정 검증
SettingsController.validate.POST.description=GET /api/settings의 owner, packageId, generation, key로 비어 있지 않은 changes를 검증합니다. 저장하려면 같은 초안을 POST /api/settings로 보냅니다. KEEP와 CLEAR는 민감한 필드에만 사용하며 value는 생략하세요. 모두 KEEP이면 []를 반환하고, 혼합 요청에는 저장 대상의 결과만 포함됩니다.
SettingsController.validate.POST.success=저장할 설정.
SettingsController.save.POST.summary=앱 설정 저장
SettingsController.save.POST.description=changes에 나열한 변경을 저장하고 키별 effect를 반환합니다. 현재 소유자, 필드 유형과 선택지는 GET /api/settings에서 확인합니다. KEEP와 CLEAR는 민감한 필드에만 사용하며 value는 생략하세요. 모두 KEEP이면 []를 반환하고, 혼합 요청에는 저장 대상의 결과만 포함됩니다.
SettingsController.save.POST.success=앱 설정을 저장했습니다.
SettingsController.save.POST.body=변경할 설정 키 및 새 값입니다.
SettingsController.validate.POST.body=변경할 설정 키 및 새 값입니다.
