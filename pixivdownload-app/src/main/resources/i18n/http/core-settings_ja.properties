title=アプリ設定
SettingsController.fields.GET.summary=編集可能な設定項目の一覧
SettingsController.fields.GET.description=参照可能な設定定義、選択肢、owner、packageId、generation を返します。編集時にはこれらの識別子をそのまま使います。機密値は保存の有無だけを返します。
SettingsController.fields.GET.success=編集可能な設定項目。
SettingsController.presets.GET.summary=設定プリセットの一覧
SettingsController.presets.GET.description=参照可能な提供元のプリセットとセクションを返します。設定の下書きに応答の値を利用できます。
SettingsController.presets.GET.success=設定プリセット。
SettingsController.validate.POST.summary=保存予定の設定を検証
SettingsController.validate.POST.description=GET /api/settings の owner、packageId、generation、key を使って空でない changes を検証します。保存する場合は同じ下書きを POST /api/settings に送ります。 KEEP と CLEAR は機密項目専用です。value は省略してください。全件 KEEP なら []、混在時は保存対象の結果だけが返ります。
SettingsController.validate.POST.success=保存予定の設定。
SettingsController.save.POST.summary=アプリ設定を保存
SettingsController.save.POST.description=changes に挙げた変更を保存し、各キーの effect を返します。現在の提供元、型、選択肢は GET /api/settings で取得できます。 KEEP と CLEAR は機密項目専用です。value は省略してください。全件 KEEP なら []、混在時は保存対象の結果だけが返ります。
SettingsController.save.POST.success=アプリ設定を保存しました。
SettingsController.save.POST.body=変更する設定キーと値。
SettingsController.validate.POST.body=変更する設定キーと値。
