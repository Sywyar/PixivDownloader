title=作品目录
PathPrefixToolsController.list.GET.summary=列出已登记的路径前缀
PathPrefixToolsController.list.GET.description=分页读取已登记的路径前缀，并返回前缀总数与符号根目录的引用状态。offset 从 0 开始。
PathPrefixToolsController.list.GET.success=已登记的路径前缀。
PathPrefixToolsController.apply.POST.summary=更新作品库路径前缀
PathPrefixToolsController.apply.POST.description=按 GET 返回的 ID 在 `updates` 中改写前缀。`registerPaths` 的每项必须是指向现有目录的绝对路径字符串。两种操作在同一事务中提交，任一写入失败都会回滚整批。若改写改变插画的实际来源，事务会清除对应的查重索引，供下次增量扫描重算。路径与正在执行的文件操作重叠时，返回 `conflict`。
PathPrefixToolsController.apply.POST.response.500=登记或改写写入失败，返回 PATH_PREFIX_WRITE_FAILED。整批已回滚，applied 为 0。
PathPrefixToolsController.pin.POST.response.500=登记或改写写入失败，返回 PATH_PREFIX_WRITE_FAILED。整批已回滚，applied 为 0。
PathPrefixToolsController.apply.POST.success=已更新作品库路径前缀。
PathPrefixToolsController.pin.POST.summary=绑定符号根目录
PathPrefixToolsController.pin.POST.description=将符号根固定到指定的原始路径。先用 GET 查看符号根状态和建议的旧路径。若改写改变插画的实际来源，事务会清除对应的查重索引，供下次增量扫描重算。路径与正在执行的文件操作重叠时，返回 `conflict`。
PathPrefixToolsController.pin.POST.success=已绑定符号根目录。
