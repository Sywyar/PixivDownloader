title=取得用認証情報
AcquisitionCredentialsController.read.GET.summary=取得用認証情報の一覧を取得
AcquisitionCredentialsController.read.GET.description=現在の revision と各項目の id、name、enabled を取得します。保存時に同じ revision を返してください。secret は応答に含まれません。
AcquisitionCredentialsController.read.GET.success=取得用認証情報の一覧。
AcquisitionCredentialsController.save.PUT.summary=取得用認証情報の設定を保存
AcquisitionCredentialsController.save.PUT.description=entries で一覧を置き換え、省略した項目を削除します。既存 id の secret を空にすると以前の値を保持します。新しい id には secret が必要です。409 の場合は revision を再取得してください。
AcquisitionCredentialsController.save.PUT.success=取得用認証情報の設定を保存しました。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Update.field.revision=直前に取得したリビジョン。競合時は再取得してから送信します。
AcquisitionCredentialsController.save.PUT.body=認証情報の項目と編集前のリビジョン。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.id=呼び出し側が付けるライブラリ内で一意の ID。半角英数字とハイフンで 1～64 文字。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.id=呼び出し側が付けるライブラリ内で一意の ID。半角英数字とハイフンで 1～64 文字。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.name=空白以外の表示名。最大 80 UTF-16 コード単位。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.name=空白以外の表示名。最大 80 UTF-16 コード単位。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.enabled=有効な項目だけを ID で取得用認証情報に指定できます。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.enabled=有効な項目だけを ID で取得用認証情報に指定できます。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.secret=新しい ID には空白以外の認証情報が必要です（最大 16384 UTF-16 コード単位、ASCII 制御文字不可）。既存 ID の空欄・null は元の秘密を保持します。読み取り時はメタデータのみ返します。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Update.field.entries=置き換え後の全件、最大 8 件。空配列は全削除、含めなかった既存項目も削除されます。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Snapshot.field.entries=保存順に並んだ ID、名前、有効状態。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Snapshot.field.revision=次回の保存時にこのリビジョンをそのまま指定します。
AcquisitionCredentialsController.save.PUT.response.409=認証情報ライブラリのリビジョンが変わりました。最新のスナップショットを取得してから変更を送信します。
AcquisitionCredentialsController.save.PUT.response.413=認証情報ライブラリのリクエストボディが上限を超えています。
description=作品取得に使う認証情報の一覧を取得・更新します。
