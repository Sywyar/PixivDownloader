title=维护任务
BackfillController.defaults.GET.summary=查看补全任务默认选项
BackfillController.defaults.GET.description=返回补全任务的默认间隔、条目上限、试运行和联网选项。
BackfillController.defaults.GET.success=补全任务默认选项。
BackfillController.candidates.POST.summary=统计待补全的作品
BackfillController.candidates.POST.description=根据提交的补全选项统计候选作品数量，供启动任务前确认。
BackfillController.candidates.POST.success=符合条件的作品数。
BackfillController.start.POST.summary=提交作品补全任务
BackfillController.start.POST.description=按 artworkIds 回填指定插画的缺失数据，包括作者、标签和系列。先用 POST /api/tools/backfill/candidates 查看候选数，dryRun 可预演，202 后按 Location 查询任务。 每次只运行一个回填任务。任务结束后可通过原 Location 查询 1 小时，最多保留最近 64 个终态。任务到期、被移除或服务器重启后，GET /api/tools/backfill/tasks/{id} 返回 404。
BackfillController.start.POST.success=作品补全任务。
BackfillController.current.GET.summary=查看当前补全任务
BackfillController.current.GET.description=返回最近启动的回填任务，包括已结束的任务。尚未启动过任务时返回 204。
BackfillController.current.GET.success=当前补全任务。
BackfillController.status.GET.summary=查看补全任务进度
BackfillController.status.GET.description=每次只运行一个回填任务。任务结束后可通过原 Location 查询 1 小时，最多保留最近 64 个终态。任务到期、被移除或服务器重启后，GET /api/tools/backfill/tasks/{id} 返回 404。
BackfillController.status.GET.success=补全任务进度。
BackfillController.cancel.POST.summary=取消补全任务
BackfillController.cancel.POST.description=请求取消此 ID 的回填，返回该任务的最新快照。对已结束且仍在保留期内的任务再次取消，会返回原终态。
BackfillController.cancel.POST.success=补全任务。
StartupCacheController.status.GET.summary=查看启动缓存状态
StartupCacheController.status.GET.description=available 指示此安装是否提供训练服务，task 是该服务的当前快照。
StartupCacheController.status.GET.success=启动缓存状态。
StartupCacheController.start.POST.summary=提交启动缓存训练
StartupCacheController.start.POST.description=发送空 JSON 对象 {} 启动一轮训练。202 返回 executionId；训练服务不可用时返回 503。
StartupCacheController.start.POST.success=启动缓存训练。
StartupCacheController.cancel.POST.summary=取消启动缓存训练
StartupCacheController.cancel.POST.description=传入启动时的 executionId。正在运行的同一轮训练接受取消后返回 202；运行记录不匹配时返回 409。
StartupCacheController.cancel.POST.success=启动缓存训练。
MaintenanceController.status.GET.summary=查看维护任务状态
MaintenanceController.status.GET.description=从本机读取维护开关、暂停状态、最近起止时间及触发者。
MaintenanceController.status.GET.success=维护任务状态。
MaintenanceController.run.POST.summary=执行维护任务
MaintenanceController.run.POST.description=从本机触发手动维护。started 表示是否启动了新一轮；维护框架关闭时返回 503。
MaintenanceController.run.POST.success=维护任务。
