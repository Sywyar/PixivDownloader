title=Scheduled tasks
ScheduleController.sources.GET.summary=List scheduling sources
ScheduleController.sources.GET.description=Choose a sourceType and keep the activationToken from that entry. Parse inputSchemaJson as a standalone JSON Schema to read its examples. The offline catalog provides schema text at x-schedule-sources[sourceType].inputSchemaJson. Null indicates no usable declaration. Read this endpoint again after the source publication changes. Both forms come from the same provider declaration. For standalone validation, parse x-schedule-sources[sourceType].inputSchemaJson as the schema root. For batch validation or SDK generation, resolve the corresponding ScheduleDefinition component against the complete OpenAPI document.
ScheduleController.sources.GET.success=Scheduling sources.
ScheduleController.list.GET.summary=List scheduled tasks
ScheduleController.list.GET.description=Returns saved tasks and their current state. A program key sees tasks only for source plugins on which it has schedule.manage. An unavailable scheduling database also returns an empty array.
ScheduleController.list.GET.success=Scheduled tasks.
ScheduleController.get.GET.summary=Get scheduled task details
ScheduleController.get.GET.description=Returns the definition, trigger and latest state. Keep stateVersion before editing. paramsJson contains the source definition; credentials are bound separately.
ScheduleController.get.GET.success=Scheduled task details.
ScheduleController.get.GET.response.400=No task has this ID (schedule.error.not-found).
ScheduleController.get.GET.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.queue.GET.summary=List the latest run queue
ScheduleController.queue.GET.description=Returns discovered works and per-item results for the latest run. An empty items array can mean no run is recorded. truncated flags a partial queue or partial live-status data.
ScheduleController.queue.GET.success=Latest run queue.
ScheduleController.queue.GET.response.400=No task has this ID (schedule.error.not-found).
ScheduleController.queue.GET.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.create.POST.summary=Create a scheduled task
ScheduleController.create.POST.description=Read the schema and token for one source from GET /api/schedule/sources. Submit the serialized definitionJson and either intervalMinutes or cronExpr for the chosen triggerKind. Omit expectedStateVersion on creation. The response includes the task ID. New schedules start enabled. To save one for later, choose a first trigger safely in the future, then call POST /api/schedule/tasks/{id}/enabled?enabled=false in a separate request. Check the source’s schedulePermission. Missing grants and unknown sources return 403. A stale token for an authorized source returns 409 (schedule.error.source-publication-changed). Fetch the source list again.
ScheduleController.create.POST.success=Scheduled task created.
ScheduleController.create.POST.response.400=A required field or JSON is invalid, expectedStateVersion was sent on creation, the source is unavailable, its definition or trigger is invalid, or the task limit was reached. A rejected definition returns schedule.error.definition-invalid.
ScheduleController.create.POST.response.409=The activationToken is stale (schedule.error.source-publication-changed), or the source changed during save (schedule.error.concurrent-change). Reload the source catalog.
ScheduleController.create.POST.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.update.PUT.summary=Update a scheduled task
ScheduleController.update.PUT.description=Replace the complete definition on an idle task using the stateVersion observed before editing as expectedStateVersion. Keep the same source plugin. Saving clears the old checkpoint and pending works. Reload the task on a version conflict. Check the source’s schedulePermission. Updates also check the existing task’s owner. Missing grants and unknown sources return 403. A stale token for an authorized source returns 409 (schedule.error.source-publication-changed). Fetch the source list again.
ScheduleController.update.PUT.success=Scheduled task updated.
ScheduleController.update.PUT.response.400=A field, definition or trigger is invalid, expectedStateVersion is missing, or the task is missing, running or queued. The source must be available, belong to the same plugin and remain compatible with any bound credential policy.
ScheduleController.update.PUT.response.409=The task changed after editing began (schedule.error.concurrent-change) or the source was republished (schedule.error.source-publication-changed). Reload the task and source catalog before editing again.
ScheduleController.update.PUT.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.delete.DELETE.summary=Delete a scheduled task
ScheduleController.delete.DELETE.description=Delete an idle task, its associated pending work and its latest run queue.
ScheduleController.delete.DELETE.success=Scheduled task removed.
ScheduleController.delete.DELETE.response.400=The task is missing, running or queued, or its state changed during the write. The codes are schedule.error.not-found, schedule.error.busy and schedule.error.concurrent-change respectively.
ScheduleController.delete.DELETE.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.setEnabled.POST.summary=Set scheduled task enablement
ScheduleController.setEnabled.POST.description=On an idle task, pass enabled=true or false in the query to enable or disable scheduling. Disabling preserves the definition and state.
ScheduleController.setEnabled.POST.success=Scheduled task enablement saved.
ScheduleController.setEnabled.POST.response.400=The task is missing, running or queued, or its state changed during the write. The codes are schedule.error.not-found, schedule.error.busy and schedule.error.concurrent-change respectively.
ScheduleController.setEnabled.POST.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.bindCredential.POST.summary=Bind a task credential
ScheduleController.bindCredential.POST.description=Send the acquisition secret in X-Acquisition-Credential and the current source activationToken in the body. The credential policy validates and binds it. The response reports binding status.
ScheduleController.bindCredential.POST.success=Task credential bound.
ScheduleController.bindCredential.POST.response.400=The task is missing or busy, the credential header is absent, empty, invalid, unchanged or fixed, or the source cannot validate it. Distinguish an invalid credential (schedule.error.credential-invalid) from a failed probe (schedule.error.credential-probe-failed).
ScheduleController.bindCredential.POST.response.409=The task or source changed during credential validation. Reload the task and its current activationToken.
ScheduleController.bindCredential.POST.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.revokeCredential.DELETE.summary=Revoke a task credential binding
ScheduleController.revokeCredential.DELETE.description=Remove this task's saved acquisition credential. Sources requiring an account need a new valid binding before execution.
ScheduleController.revokeCredential.DELETE.success=Task credential binding revoked.
ScheduleController.revokeCredential.DELETE.response.400=The task is missing or busy, its credential policy is unavailable, or the binding is fixed (schedule.error.credential-fixed).
ScheduleController.revokeCredential.DELETE.response.409=The task version or credential policy changed during the write. Reload the task.
ScheduleController.revokeCredential.DELETE.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.applyCredentialPolicyAction.POST.summary=Run a credential policy action
ScheduleController.applyCredentialPolicyAction.POST.description=Copy ownerPluginId, policyId, publicationId and accountKey from the task’s credentialPolicy. Decode accountActionsSchemaJson there and use its example to fill actionId and parameters. The action affects matching tasks for that account.
ScheduleController.applyCredentialPolicyAction.POST.success=Credential policy action.
ScheduleController.applyCredentialPolicyAction.POST.response.400=Request fields are invalid, the account has no tasks, or the policy rejects the action, its parameters or its result. Codes include schedule.error.credential-account-not-found and schedule.error.credential-account-action-unsupported.
ScheduleController.applyCredentialPolicyAction.POST.response.409=The policy publicationId, its owner or the state of tasks on the account changed. Reload the policy and affected tasks.
ScheduleController.applyCredentialPolicyAction.POST.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.updateProxy.POST.summary=Set the task proxy
ScheduleController.updateProxy.POST.description=Set host:port, such as 127.0.0.1:7890, on an idle task to override its proxy. Set proxy to null or an empty string to use global settings again.
ScheduleController.updateProxy.POST.success=Task proxy saved.
ScheduleController.updateProxy.POST.response.400=The proxy is not a valid host:port (schedule.error.proxy-invalid), or the task is missing, busy or changed.
ScheduleController.updateProxy.POST.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.runOnce.POST.summary=Run a scheduled task now
ScheduleController.runOnce.POST.description=Request a background run of an enabled, idle, unsuspended task. After success, read the task's queue for per-work progress.
ScheduleController.runOnce.POST.success=Scheduled task now.
ScheduleController.runOnce.POST.response.400=The task is missing, already running or queued, disabled (schedule.error.run-disabled), or suspended (schedule.error.run-suspended).
ScheduleController.runOnce.POST.response.429=The background executor rejected this run (task.queue.full). Retry later.
ScheduleController.runOnce.POST.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.pause.POST.summary=Pause the current run
ScheduleController.pause.POST.description=Suspend a running or queued task and request cancellation of this run. Use enabled=false to stop an idle task from starting automatically.
ScheduleController.pause.POST.success=Current run paused.
ScheduleController.pause.POST.response.400=The task is missing, already suspended, has no queued or running execution to interrupt (schedule.error.pause-idle), or changed during the write.
ScheduleController.pause.POST.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.resolvePending.POST.summary=Resolve a pending work item
ScheduleController.resolvePending.POST.description=Record a decision on an idle task suspended with USER_ACTION_REQUIRED. Read stateVersion from the task and workType/workId from pending. Use the returned task and call resume to continue.
ScheduleController.resolvePending.POST.success=Pending work item.
ScheduleController.resolvePending.POST.response.400=The task is missing or busy, request fields are invalid, or the version, suspension or pending work changed (schedule.error.concurrent-change). Reload the task and pending items.
ScheduleController.resolvePending.POST.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.resume.POST.summary=Resume a scheduled task
ScheduleController.resume.POST.description=Clear MANUAL or USER_ACTION_REQUIRED suspension. Enabled tasks are submitted for immediate execution. Disabled tasks only have their suspension cleared.
ScheduleController.resume.POST.success=Scheduled task resumed.
ScheduleController.resume.POST.response.400=The task is missing, busy, suspended for a reason other than MANUAL or USER_ACTION_REQUIRED, not suspended (schedule.error.resume-not-paused), or changed.
ScheduleController.resume.POST.response.429=The background executor rejected this run (task.queue.full). Retry later.
ScheduleController.resume.POST.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.pending.GET.summary=List items awaiting retry
ScheduleController.pending.GET.description=List saved retries and works requiring a decision. Identify each entry by workType and workId. Inspect reasonCode, reasonDetailJson and its attempt count.
ScheduleController.pending.GET.success=Items awaiting retry.
ScheduleController.pending.GET.response.400=No task has this ID (schedule.error.not-found).
ScheduleController.pending.GET.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
ScheduleController.clearPending.DELETE.summary=Clear a pending item
ScheduleController.clearPending.DELETE.description=Remove one pending record on an idle task using workType and workId from pending. It will no longer be replayed from that record.
ScheduleController.clearPending.DELETE.success=Pending item cleared.
ScheduleController.clearPending.DELETE.response.400=The work identity is invalid, the task is missing or busy, or the record changed while clearing it (schedule.error.concurrent-change).
ScheduleController.clearPending.DELETE.response.503=The scheduling database is unavailable (DATABASE_UNAVAILABLE).
parameter.X-Acquisition-Credential=Acquisition credential for the work source, up to 16,384 characters. Send the program key separately in Authorization.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.title=Schedule and download source
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.name=Display name.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.sourceType=Copy sourceType from the selected entry in GET /api/schedule/sources and use the activationToken from that same entry.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.activationToken=Current activationToken of the selected source. Refresh its catalog entry and input schema after republication.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.definitionJson=Read the JSON Schema at x-schedule-sources[sourceType].inputSchemaJson in OpenAPI. Start with its examples[0], construct the definition object, then serialize it into this string. Maximum 1 MiB in UTF-8. Keep credentials out of the definition. Get the current activationToken from GET /api/schedule/sources. For offline validation, extract the entire schema as the validation root, including $id and $defs. The same inner value is sent as an object in a manual batch, and as a JSON string in a schedule.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.expectedStateVersion=Omit or send null when creating a task. When editing, send the stateVersion read from the task.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.triggerKind=Use interval for a fixed interval or cron for a cron schedule.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.intervalMinutes=Required positive integer in minutes for triggerKind=interval.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.cronExpr=Required Spring cron expression for triggerKind=cron. For example, 0 0 9 * * * means 09:00 daily in server local time. GET /api/schedule/sources returns the timeZone used by the scheduler; the saved task reports nextRunTime in Unix milliseconds.
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.description=Configure when the task runs and which source provides its downloads.
