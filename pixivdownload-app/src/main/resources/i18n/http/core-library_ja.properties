title=ダウンロード済み作品
AuthorController.getAuthors.GET.summary=保存済み作品の作者の一覧
AuthorController.getAuthors.GET.description=参照可能なローカル作者を取得します。検索、並べ替え、ページングは /api/authors/paged を使います。
AuthorController.getAuthors.GET.success=保存済み作品の作者。
AuthorController.getPagedAuthors.GET.summary=作者をページ単位で取得
AuthorController.getPagedAuthors.GET.description=page は 0 始まり、size は 1～200 に収まります。sort は name、artworks、authorId で、それ以外は name として扱います。
AuthorController.getPagedAuthors.GET.success=作者。
WorkAssetFileController.getThumbnail.GET.summary=作品ページのサムネイルを取得
WorkAssetFileController.getThumbnail.GET.description=artworkId と page でローカルサムネイルを取得します。cover は表紙用、size は希望サイズを指定します。通常は GET /api/downloaded/thumbnail/{artworkId}/{page} を使用します。GET /api/downloaded/thumbnail-file/{artworkId}/{page} はその別名で、cover と size が同じなら処理も同じです。
WorkAssetFileController.getThumbnail.GET.success=作品ページのサムネイル。
WorkAssetFileController.getImage.GET.summary=作品ページの画像を取得
WorkAssetFileController.getImage.GET.description=表示用画像を返します。元が ZIP ならサムネイルを返し、ZIP 自体は rawfile で取得します。再検証には前回の応答の ETag を If-None-Match に指定します。If-Modified-Since だけを送ると現在のファイルを返します。
WorkAssetFileController.getImage.GET.success=作品ページの画像。
WorkAssetFileController.getRawFile.GET.summary=作品ページの元ファイルをダウンロード
WorkAssetFileController.getRawFile.GET.description=0 始まりのページ番号でローカルの保存ファイルを読み取ります。原形式（ZIP を含む）が残っていれば優先し、変換後のファイルだけなら保存済みの形式を返します。プログラムキーには core:assets.export が必要です。再検証には前回の応答の ETag を If-None-Match に指定します。If-Modified-Since だけを送ると現在のファイルを返します。
WorkAssetFileController.getRawFile.GET.success=作品ページの元ファイル。
DownloadedWorkController.getDownloaded.GET.summary=ダウンロード済み作品の詳細を取得
DownloadedWorkController.getDownloaded.GET.description=作品 ID でローカルのダウンロード記録を取得します。verifyFiles は既定で false です。true にするとファイルも確認します。記録がない場合は 400 です。 プログラムキーでは /api/library/artworks/{artworkId} を使用します。対応する /api/downloaded の経路にはローカルアクセスの制限が適用されます。
DownloadedWorkController.getDownloaded.GET.success=ダウンロード済み作品の詳細。
DownloadedWorkController.recoverMetadata.POST.summary=手元の値で作品の未設定項目を補完
DownloadedWorkController.recoverMetadata.POST.description=更新する値を一つ以上指定します。既存の値は保持され、新規登録にはページ数と全ファイルが必要です。Pixiv からメタデータ、タグ、シリーズを取得するには POST /api/tools/backfill/tasks を使用します。 プログラムキーでは /api/library/artworks/{artworkId}/recover-metadata を使用します。対応する /api/downloaded の経路にはローカルアクセスの制限が適用されます。 新規登録には各ページに既定のファイル名で特定できる空でない画像が 1 件ずつ必要です。同じページに候補が複数ある場合は登録しません。ローカルのファイル形式をページごとに記録し、配信元の原画形式は不明として扱います。既定のフォルダーは、他の作品フォルダーや読み取り専用のインポートファイルと重ならないようにしてください。
DownloadedWorkController.recoverMetadata.POST.success=作品のメタデータを復元しました。
DownloadedWorkController.getBatchArtworks.POST.summary=複数作品のダウンロード記録を照会
DownloadedWorkController.getBatchArtworks.POST.description=指定された ID 順に未削除の作品を返し、未知の ID は省略します。includeDeleted が true の場合、削除済み ID を deletedArtworkIds に返します。
DownloadedWorkController.getBatchArtworks.POST.success=複数作品のダウンロード記録。
DownloadedWorkController.getStatistics.GET.summary=作品のダウンロード統計を取得
DownloadedWorkController.getStatistics.GET.description=libraryArtworks と libraryImages はインポートを含み、削除済み作品を除きます。管理者の totalArtworks と totalImages は累計ダウンロード数です。招待ゲストには閲覧可能な蔵書数のみ返します。
DownloadedWorkController.getStatistics.GET.success=作品のダウンロード統計。
DownloadedWorkController.moveArtWork.POST.summary=作品の移動記録（提供終了）
DownloadedWorkController.moveArtWork.POST.description=従来の権限チェックを通過したリクエストには、本文のない HTTP 410 を返します。ファイルや作品の記録は変更されません。
DownloadedWorkController.moveArtWork.POST.response.410=従来の権限チェックを通過したリクエストには、本文のない HTTP 410 を返します。ファイルや作品の記録は変更されません。
DownloadedWorkController.getHistory.GET.summary=作品のダウンロード履歴の一覧
DownloadedWorkController.getHistory.GET.description=表示できるダウンロード済み作品 ID の一覧を返します。作品レコードをページ単位で取得するには history/paged を使います。
DownloadedWorkController.getHistory.GET.success=作品のダウンロード履歴。
DownloadedWorkController.getPagedHistory.GET.summary=作品のダウンロード履歴をページ単位で取得
DownloadedWorkController.getPagedHistory.GET.description=ダウンロード記録をページ単位で取得します。sort=author_id は作者 ID 順、その他はダウンロード時刻順です。
DownloadedWorkController.getPagedHistory.GET.success=作品のダウンロード履歴。
MangaSeriesController.getSeries.GET.summary=保存済みの漫画シリーズの一覧
MangaSeriesController.getSeries.GET.description=参照可能なローカル漫画シリーズを一覧表示します。絞り込みやページングには /api/series/paged を使います。
MangaSeriesController.getSeries.GET.success=保存済みの漫画シリーズ。
MangaSeriesController.getPagedSeries.GET.summary=漫画シリーズをページ単位で取得
MangaSeriesController.getPagedSeries.GET.description=page は 0 始まり、size は 1～200 に収まります。sort は title、artworks、seriesId で、それ以外は title として扱います。
MangaSeriesController.getPagedSeries.GET.success=漫画シリーズ。
MangaSeriesController.getSeriesDetail.GET.summary=漫画シリーズの詳細を取得
MangaSeriesController.getSeriesDetail.GET.description=ID でシリーズ詳細を取得します。ゲストには見える章だけを集計し、存在しないか閲覧不能なシリーズは 404 です。
MangaSeriesController.getSeriesDetail.GET.success=漫画シリーズの詳細。
MangaSeriesController.getSeriesCover.GET.summary=漫画シリーズの表紙を取得
MangaSeriesController.getSeriesCover.GET.description=参照可能なシリーズのローカル表紙画像を返します。シリーズまたは表紙がなければ 404 です。
MangaSeriesController.getSeriesCover.GET.success=漫画シリーズの表紙。
parameter.artworkId=Pixiv の作品 ID。
parameter.seriesId=作品または小説シリーズの ID。
parameter.verifyFiles=登録された作品ファイルがディスク上に存在するか確認します。
parameter.cover=表紙用のサムネイルを要求します。
