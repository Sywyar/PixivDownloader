description=保存済みの作品情報、画像、作者、シリーズを取得します。
DownloadedWorkController.getDownloaded.GET.response.400=利用可能なローカル記録がない場合、400 応答の本文は空で、Content-Type ヘッダーはありません。パスまたはクエリのパラメーターの型が正しくない場合は、コード `error.request.param.invalid` を含む application/json を返します。本文が空でなく、Content-Type が application/json の場合だけ JSON として読み取ってください。
DownloadedWorkController.recoverMetadata.POST.response.400=ページファイルが足りない場合や候補を一つに絞れない場合、応答の本文は空です。他の作品フォルダーまたは読み取り専用のインポートファイルと競合する場合の JSON エラーコードは directory-template.occupied です。
AuthorController.getPagedAuthors.GET.parameter.page=0 始まりのページ番号。負数は 0 として扱います。
MangaSeriesController.getPagedSeries.GET.parameter.page=0 始まりのページ番号。負数は 0 として扱います。
AuthorController.getPagedAuthors.GET.parameter.size=1 ページの件数。1～200 の範囲に補正します。
MangaSeriesController.getPagedSeries.GET.parameter.size=1 ページの件数。1～200 の範囲に補正します。
DownloadedWorkController.getPagedHistory.GET.parameter.page=0 始まりのページ番号。負数は 0 として扱います。
DownloadedWorkController.getPagedHistory.GET.parameter.size=既定は 10 件。1 未満は 1 に補正します。招待ゲストの上限は 200 件で、管理者とプログラムキーはより大きな値を指定できます。
AuthorController.getPagedAuthors.GET.parameter.sort=並べ替えの項目は artworks, authorId または name。その他の値では name を使用します。
MangaSeriesController.getPagedSeries.GET.parameter.sort=並べ替えの項目は artworks, seriesId または title。その他の値では title を使用します。
DownloadedWorkController.getPagedHistory.GET.parameter.sort=並べ替えの項目は author_id または time。その他の値では time を使用します。
DownloadedWorkController.moveArtWork.POST.parameter.artworkId=パスに含まれる旧作品 ID です。この API は提供を終了し、権限の確認後は値を使用しません。
