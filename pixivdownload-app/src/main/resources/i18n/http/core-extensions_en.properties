filter.prepare.summary=Prepare hooks for a target HTTP operation
filter.prepare.description=Prepare a same-server request using the target operation’s access rules, without invoking the business handler. Set resolveOnly=true to identify the endpoint. On HOOK_CHALLENGE, retain the client cookie and resubmit the same target with the token and proofs keyed by hook ID. On HOOK_READY, send the token to the actual target in X-Pixiv-Hook-Ticket, or use the cookie requested by nativeSubmit for a native form.
filter.HookPreparation=Target request to match and any challenge proofs to stage.
filter.HookPreparation.method=Uppercase HTTP method of the target route.
filter.HookPreparation.url=Same-server path beginning with /, optionally including its query string. Hostnames, fragments and the preparation path itself are invalid.
filter.HookPreparation.headers=Up to 16 target-matching headers, with at most 1024 characters per value and no control characters. Names are case-insensitive, up to 96 letters, digits or hyphens. Use Accept, Content-Type or an X- header. X-Forwarded-, X-Pixiv- and X-Real- prefixes and names containing token, key, auth or cookie are rejected.
filter.HookPreparation.json=Original JSON field values keyed by the JSON Pointer paths declared in the operation binding. Up to 256 entries and 256 characters per key.
filter.HookPreparation.parameters=Map of form field names to nonempty arrays of strings. Target Content-Type must be application/x-www-form-urlencoded or multipart/form-data. Query and form together accept up to 128 values.
filter.HookPreparation.token=Challenge token from the response. Omit it on the first call and include it with the original target when staging proofs.
filter.HookPreparation.proofs=Proof strings requested by the providers, keyed by hook IDs from challenges. Requires token. Up to 16 entries, 16384 characters per value and 64 KiB of UTF-8 values in total.
filter.HookPreparation.nativeSubmit=Set true to issue a one-use cookie for native form submission to the same target after proofs are staged.
filter.HookPreparation.resolveOnly=Only match the target endpoint. Returns HOOK_RESOLVED and endpoint.
filter.HookTargetMatch=Target match returned in resolve-only mode.
filter.HookPreparationResult=Result of hook approval, challenge, proof staging or rejection.
filter.HookTargetMatch.code=HOOK_RESOLVED when the target matches.
filter.HookTargetMatch.endpoint=ID of the matched HTTP endpoint.
filter.HookTargetMatch.invoked=False for preparation responses. The business operation has not run.
filter.HookPreparationResult.invoked=False for preparation responses. The business operation has not run.
filter.HookPreparationResult.code=Machine-readable HOOK_ result code indicating approval, challenge, readiness or failure.
filter.HookPreparationResult.error=Localized failure message, empty on success.
filter.HookPreparationResult.token=Token issued on challenge and returned when proofs are ready. It may be empty otherwise.
filter.HookPreparationResult.revision=Publication revision used during preparation, empty if unavailable.
filter.HookPreparationResult.challenges=Challenge strings keyed by hook ID. Use the same keys when submitting proofs.
filter.prepare.200=The target matched (HOOK_RESOLVED), preparation was approved (HOOK_APPROVED), or proofs were staged (HOOK_READY).
filter.prepare.400=The supplied method, URL, headers or fields do not form a valid target request.
filter.prepare.401=The target requires a valid session or a program key supported by that target.
filter.prepare.403=If the preparation request itself fails the CSRF origin check, it returns FORBIDDEN. Target authorization or hook validation can also reject the request.
filter.prepare.409=HOOK_CHALLENGE requires proofs. HOOK_STALE or HOOK_TARGET_STALE means the target or token changed and preparation must be repeated.
filter.prepare.413=The preparation request exceeds 512 KiB.
filter.prepare.429=Preparation request rate or concurrency limit reached.
filter.prepare.503=A hook provider or the target operation is currently unavailable.
filter.X-Acquisition-Credentials=Comma-separated list of 1–8 distinct, enabled credential-library IDs in preference order. Requires an administrator session or core:credentials.use. Mutually exclusive with X-Acquisition-Credential.
filter.X-Pixiv-Page-Publication=When calling from a published page, send its publication token to check the target route owner. A stale publication or mismatched target returns 409.
filter.pagePublication=Query alternative to X-Pixiv-Page-Publication for page requests. The header takes precedence.
filter.X-Pixiv-Ui-Publication=When calling from a published UI slot, send the slot's publication token. A withdrawn publication returns 409.
filter.uiPublication=Publication token in the query when a slot loads its owner's resources. The resource owner is checked. X-Pixiv-Ui-Publication takes precedence.
filter.X-Pixiv-Hook-Ticket=If a target returned HOOK_CHALLENGE, send the one-use token from HOOK_READY to the same target. Keep the client cookie from preparation.
schema.top.sywyar.pixivdownload.plugin.web.controller.OperationHooksController.Failure.field.code=Machine-readable reason the hook configuration request failed.
filter.X-Pixiv-Hook=Result emitted by the hook processor, such as READY or CHALLENGE. A successful resolve-only lookup omits this header.
filter.prepare.access=Access follows the target operation. Anonymous preparation is available for public targets. Otherwise send the session, GUI credential or program key accepted by the target on the outer request. Browser requests must satisfy same-origin write checks.
parameter.page=Published web page identifier, matching the page key in the publication catalog.
filter.credentials.400=X-Acquisition-Credentials was malformed, repeated, or supplied alongside the raw credential header.
filter.credentials.403=The caller lacks permission to select library entries with X-Acquisition-Credentials.
filter.credentials.503=The credential library could not be read, or a selected entry is disabled or missing.
filter.csrf.origin=CSRF origin check. Send the server origin, for example https://server.example:8443, matching the request scheme, host and effective port. A session, invitation or visitor cookie requires a same-origin Origin or Referer. Browser origin signals must also match, except for trusted script origins accepted by a collector endpoint. A native client using only a Bearer key and none of those cookies or browser headers may omit both.
filter.csrf.explicit=This write requires a CSRF origin signal even for a Bearer client. Send a same-origin Origin or Referer. For Origin use the server scheme, host and effective port, for example https://server.example:8443.
filter.csrf.referer=When Origin is absent, a same-origin page URL in Referer satisfies the check. CSRF validation uses Origin first when present.
filter.csrf.error=Requests rejected by the server’s CSRF filter return the JSON error code {code}.
description=Inspect registered web extensions, operation hooks and page publication targets.
