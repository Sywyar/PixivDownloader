title=应用设置
SettingsController.fields.GET.summary=列出可编辑设置项
SettingsController.fields.GET.description=返回有读取权限的字段定义、可选值、所属插件、packageId 和 generation。修改时原样使用这些身份字段；敏感值只返回 stored 状态。
SettingsController.fields.GET.success=可编辑设置项。
SettingsController.presets.GET.summary=列出设置预设
SettingsController.presets.GET.description=列出当前可读取的提供方设置预设和所属区段。使用返回的值准备设置草稿。
SettingsController.presets.GET.success=设置预设。
SettingsController.validate.POST.summary=校验拟保存的设置
SettingsController.validate.POST.description=传入非空 changes，使用 GET /api/settings 返回的 owner、packageId、generation 和 key。仅校验；可用同一草稿调用 POST /api/settings 保存。 KEEP 和 CLEAR 仅适用于敏感字段，须省略 value。全部为 KEEP 时返回 []，混合提交只返回保存项的效果。
SettingsController.validate.POST.success=拟保存的设置。
SettingsController.save.POST.summary=保存应用设置
SettingsController.save.POST.description=保存 changes 中列出的修改，响应逐项给出 effect。使用 GET /api/settings 查字段所属插件、值类型及允许的选项。 KEEP 和 CLEAR 仅适用于敏感字段，须省略 value。全部为 KEEP 时返回 []，混合提交只返回保存项的效果。
SettingsController.save.POST.success=已保存应用设置。
SettingsController.save.POST.body=要变更的配置键及其新值。
SettingsController.validate.POST.body=要变更的配置键及其新值。
