CollectionController.memberships.POST.body=Artworks to look up
CollectionController.uploadIcon.POST.body=Upload the collection image in the file part. For the cURL example, set `INSTANCE` to the instance origin (scheme, host and port, without a trailing slash) and `PROGRAM_KEY` to a key with this operation’s grant. Set `COLLECTION_ID` from `GET /api/collections` and replace `icon.png` with the image to upload.
parameter.id=ID of the collection to read or change.
schema.top.sywyar.pixivdownload.collection.Collection.description=Local collection. A missing icon extension selects the default icon.
schema.top.sywyar.pixivdownload.collection.Collection.field.downloadRoot=Download root for this collection. Blank or null uses the default. Relative paths, including paths with one leading slash, resolve under `download.root-folder`. Supported variables: {collectionRootVariables}. For Favorites, `albums/{collection_name}` expands to `albums/Favorites`. Other brace expressions remain literal. After trimming, the limit is 500 UTF-16 code units and control characters are rejected. Relative paths must stay under the root. Absolute paths recognized by the server resolve to their own location.
