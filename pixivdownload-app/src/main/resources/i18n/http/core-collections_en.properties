title=Collections
CollectionController.list.GET.summary=List collections
CollectionController.list.GET.description=Return the collections visible to the caller. Use a collection ID to manage its icon or contents.
CollectionController.list.GET.success=Collections.
CollectionController.create.POST.summary=Create a collection
CollectionController.create.POST.description=Creates a local collection and returns its assigned numeric ID. You may set its download root in the same request.
CollectionController.create.POST.success=Collection created.
CollectionController.rename.PUT.summary=Rename a collection
CollectionController.rename.PUT.description=Renames the collection. Future downloads expand the new name in its root template. Existing files stay in place.
CollectionController.rename.PUT.success=Collection updated.
CollectionController.updateDownloadRoot.PUT.summary=Set the collection download directory
CollectionController.updateDownloadRoot.PUT.description=Applies to subsequent downloads targeting this collection. When expanding its name, the downloader replaces path separators and other unsafe characters with underscores.
CollectionController.updateDownloadRoot.PUT.success=Collection download directory saved.
CollectionController.updateSortOrder.PUT.summary=Set the collection sort order
CollectionController.updateSortOrder.PUT.description=Collections sort by ascending `sortOrder`, then ascending collection ID. An omitted or null `sortOrder` sets it to 0.
CollectionController.updateSortOrder.PUT.success=Collection sort order saved.
CollectionController.delete.DELETE.summary=Delete a collection
CollectionController.delete.DELETE.description=Delete the collection identified by its numeric ID. Success returns an empty response.
CollectionController.delete.DELETE.success=Collection removed.
CollectionController.uploadIcon.POST.summary=Upload a collection icon
CollectionController.uploadIcon.POST.description=Upload a PNG, JPEG or WebP in the multipart `file` part. Maximum 1 MiB and 2048 pixels on each side. A successful upload replaces the previous icon.
CollectionController.uploadIcon.POST.success=Collection icon uploaded.
CollectionController.clearIcon.DELETE.summary=Clear a collection icon
CollectionController.clearIcon.DELETE.description=Removes the custom icon and returns the collection. The UI shows its default icon again.
CollectionController.clearIcon.DELETE.success=Collection icon cleared.
CollectionController.downloadIcon.GET.summary=Get a collection icon
CollectionController.downloadIcon.GET.description=Returns raw image bytes with their image media type. A missing collection, icon record or icon file yields 404.
CollectionController.downloadIcon.GET.success=Collection icon.
CollectionController.addArtwork.POST.summary=Add an artwork to a collection
CollectionController.addArtwork.POST.description=Links the work to this collection. `added` is true for a new link and false when it already existed.
CollectionController.addArtwork.POST.success=Artwork to a collection added.
CollectionController.removeArtwork.DELETE.summary=Remove an artwork from a collection
CollectionController.removeArtwork.DELETE.description=Unlinks the work. `removed` tells whether a link was removed. Downloaded files stay on disk.
CollectionController.removeArtwork.DELETE.success=Artwork from a collection removed.
CollectionController.collectionsOf.GET.summary=List collections containing an artwork
CollectionController.collectionsOf.GET.description=Use this lookup to show which collections already contain a work before editing its memberships.
CollectionController.collectionsOf.GET.success=Collections containing an artwork.
CollectionController.memberships.POST.summary=Look up artwork memberships in bulk
CollectionController.memberships.POST.description=Returns collection IDs grouped by work ID. Object keys are decimal strings. A work with no visible memberships may be omitted. Invited guests may send up to 500 positive IDs per request.
CollectionController.memberships.POST.success=Artwork memberships in bulk.
CollectionController.addNovel.POST.summary=Add a novel to a collection
CollectionController.addNovel.POST.description=Links the work to this collection. `added` is true for a new link and false when it already existed.
CollectionController.addNovel.POST.success=Novel to a collection added.
CollectionController.removeNovel.DELETE.summary=Remove a novel from a collection
CollectionController.removeNovel.DELETE.description=Unlinks the work. `removed` tells whether a link was removed. Downloaded files stay on disk.
CollectionController.removeNovel.DELETE.success=Novel from a collection removed.
CollectionController.novelCollectionsOf.GET.summary=List collections containing a novel
CollectionController.novelCollectionsOf.GET.description=Use this lookup to show which collections already contain a work before editing its memberships.
CollectionController.novelCollectionsOf.GET.success=Collections containing a novel.
CollectionController.novelMemberships.POST.summary=Look up novel memberships in bulk
CollectionController.novelMemberships.POST.description=Returns collection IDs grouped by work ID. Object keys are decimal strings. A work with no visible memberships may be omitted. Invited guests may send up to 500 positive IDs per request.
CollectionController.novelMemberships.POST.success=Novel memberships in bulk.
CollectionController.uploadIcon.POST.body.field.file=Image to use as the collection icon.
parameter.novelId=Pixiv novel ID.
parameter.artworkId=Pixiv artwork ID.
