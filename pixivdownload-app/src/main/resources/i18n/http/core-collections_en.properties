CollectionController.updateSortOrder.PUT.body=Collection list position
schema.top.sywyar.pixivdownload.collection.request.CollectionDownloadRootRequest.title=Collection download directory
schema.top.sywyar.pixivdownload.collection.request.CollectionDownloadRootRequest.field.downloadRoot=Download root for this collection. Blank or null uses the default. Relative paths, including paths with one leading slash, resolve under `download.root-folder`. Supported variables: {collectionRootVariables}. For Favorites, `albums/{collection_name}` expands to `albums/Favorites`. Other brace expressions remain literal. After trimming, the limit is 500 UTF-16 code units and control characters are rejected. Relative paths must stay under the root. Absolute paths recognized by the server resolve to their own location.
CollectionController.updateDownloadRoot.PUT.body=Collection download directory
schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.title=New collection
schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.field.name=Unique collection name. After trimming, it must contain 1–40 UTF-16 code units.
schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.field.downloadRoot=Download root for this collection. Blank or null uses the default. Relative paths, including paths with one leading slash, resolve under `download.root-folder`. Supported variables: {collectionRootVariables}. For Favorites, `albums/{collection_name}` expands to `albums/Favorites`. Other brace expressions remain literal. After trimming, the limit is 500 UTF-16 code units and control characters are rejected. Relative paths must stay under the root. Absolute paths recognized by the server resolve to their own location.
CollectionController.create.POST.body=New collection
