RepositorySettingsController.read.GET.summary=リポジトリ設定を取得
RepositorySettingsController.read.GET.description=設定済みのリポジトリ一覧と全体の revision を取得します。変更後は一覧全体と取得した revision を送ります。
RepositorySettingsController.read.GET.success=リポジトリ設定。
RepositorySettingsController.save.PUT.summary=リポジトリ設定を保存
RepositorySettingsController.save.PUT.description=revision を指定して最大 256 件の一覧を置き換えます。追加や信頼設定、URL、ネットワーク方針の変更には trustConfirmed が必要です。競合後は一覧を再取得します。
RepositorySettingsController.save.PUT.success=リポジトリ設定を保存しました。
PluginAcquisitionController.prepare.POST.summary=プラグインの取得操作を準備
PluginAcquisitionController.prepare.POST.description=repositoryId、pluginId、version とインストールプレビューの fingerprint で取得処理を準備します。実行・破棄には返された操作 ID を使います。
PluginAcquisitionController.prepare.POST.success=プラグインの取得操作を準備しました。
PluginAcquisitionController.execute.POST.summary=準備済みの取得操作を実行
PluginAcquisitionController.execute.POST.description=準備済みの取得処理を実行し、最新状態を返します。id は操作記録の ID です。
PluginAcquisitionController.execute.POST.success=準備済みの取得操作。
PluginAcquisitionController.discard.POST.summary=準備済みの取得操作を破棄
PluginAcquisitionController.discard.POST.description=指定 ID の保留中の取得処理を破棄し、その状態を返します。
PluginAcquisitionController.discard.POST.success=準備済みの取得操作を破棄しました。
PluginAcquisitionController.get.GET.summary=プラグインの取得状況を取得
PluginAcquisitionController.get.GET.description=prepare で取得した操作 ID を指定し、開始・完了状態、インストール結果や失敗原因を確認します。マーケットをアンロードした後も参照できます。
PluginAcquisitionController.get.GET.success=プラグインの取得状況。
PluginAcquisitionController.list.GET.summary=プラグインの取得履歴の一覧
PluginAcquisitionController.list.GET.description=保存済みのプラグイン取得操作について、対象バージョン、トランザクション ID、現在の状態を一覧表示します。
PluginAcquisitionController.list.GET.success=プラグインの取得履歴。
PluginUpdateController.updates.GET.summary=プラグインの更新候補の一覧
