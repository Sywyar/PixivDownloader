PluginUpdateController.updates.GET.success=プラグインの更新候補。
PluginMarketContentController.document.GET.summary=パッケージの文書を取得
PluginMarketContentController.document.GET.description=このバージョンの文書を取得します。kind は readme、changelog、releaseNotes で、locale と sha256 はカタログの該当文書に一致させます。
PluginMarketContentController.document.GET.success=パッケージの文書。
PluginMarketContentController.image.GET.summary=マーケットの画像を取得
PluginMarketContentController.image.GET.description=role=icon は index=0、role=screenshot は 0 始まりの index を指定します。カタログの画像の sha256 を渡すと画像データを返します。
PluginMarketContentController.image.GET.success=マーケットの画像。
PluginMarketController.repositories.GET.summary=プラグインリポジトリの一覧
