PluginMarketController.installPreviewed.POST.summary=確認済みのパッケージをインストール
PluginMarketController.installPreviewed.POST.description=プレビューの fingerprint を指定して確認済みの版をインストールします。ファイルの信頼確認が必要な場合は trustRequirement.artifactSha256 を confirmTrust に指定します。
PluginMarketController.installPreviewed.POST.success=確認済みのパッケージ。
PluginMarketController.packageFacts.GET.summary=パッケージのメタデータを取得
PluginMarketController.packageFacts.GET.description=取得またはインストールの前に、指定したリポジトリ、プラグイン、バージョンのパッケージ情報を確認します。
PluginMarketController.packageFacts.GET.success=パッケージのメタデータ。
parameter.repositoryId=マーケットに登録されたリポジトリ ID。
parameter.pluginId=選択したリポジトリまたは環境のプラグイン ID。
parameter.confirmTrust=インストール時に信頼確認を求められた場合、ファイルを確認して trustRequirement.artifactSha256 の 64 桁の 16 進数を指定します。
parameter.cursor=続きの結果を取得するためのカーソル。
parameter.kind=取得するリソースの種類。
parameter.sha256=選択したコンテンツに期待する SHA-256。
parameter.role=マーケット内の画像の用途。
parameter.category=項目の絞り込みに使うカテゴリ。
parameter.publisher=一覧を絞り込む発行元。
parameter.channel=発行者が定義したチャネル。大文字小文字を区別しません。未指定または空欄で全件、チャネル未設定のパッケージは stable に一致します。一致しない場合は空ページを返します。
