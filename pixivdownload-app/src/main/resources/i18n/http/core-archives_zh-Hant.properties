schema.top.sywyar.pixivdownload.quota.response.AdminArchiveTasksResponse.description=尚未過期的管理員歸檔任務，最新建立的排在最前面。
schema.top.sywyar.pixivdownload.quota.response.PackRateLimitResponse.field.code=歸檔次數已達上限時為 archive.pack.rate-limited。
