ArchiveController.triggerAdminPack.POST.body=要歸檔的插畫
ArchiveController.downloadArchive.GET.response.202=歸檔正在準備，稍後用同一 token 重試。
ArchiveController.downloadArchive.GET.response.410=歸檔令牌不存在或已過期。
ArchiveController.downloadArchive.GET.response.404=記錄顯示已就緒，但找不到歸檔檔案。
ArchiveController.triggerPack.POST.response.204=此使用者沒有已登記的下載目錄。
ArchiveController.triggerPack.POST.response.429=當前時間視窗內的歸檔請求達到上限，響應給出次數和時間視窗。
ArchiveController.triggerAdminPack.POST.response.204=所選作品沒有可以歸檔的現存下載目錄。
