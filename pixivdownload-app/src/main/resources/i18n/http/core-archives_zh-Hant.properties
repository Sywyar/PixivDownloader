ArchiveController.downloadArchive.GET.response.409=封存檔建立失敗。請建立新的封存檔後再下載。
schema.top.sywyar.pixivdownload.quota.response.ArchiveStatusResponse.field.sourceDeletion=匯出後刪除來源作品的執行結果。
schema.top.sywyar.pixivdownload.quota.response.AdminArchiveTasksResponse.Task.field.sourceDeletion=匯出後刪除來源作品的執行結果。
schema.top.sywyar.pixivdownload.quota.response.ArchiveStatusResponse.SourceDeletion.field.status=未要求刪除時為 not_requested，等待封裝時為 pending，刪除進行中為 running。封存未完成且未開始刪除時為 not_started。依已提交的刪除數量回傳 succeeded、partial 或 failed。
schema.top.sywyar.pixivdownload.quota.response.ArchiveStatusResponse.SourceDeletion.field.requestedWorks=要求刪除的作品數，重複項目僅計一次。
schema.top.sywyar.pixivdownload.quota.response.ArchiveStatusResponse.SourceDeletion.field.deletedWorks=刪除交易已確認提交的作品數。外部參照只移除作品登記，保留外部原始檔。
