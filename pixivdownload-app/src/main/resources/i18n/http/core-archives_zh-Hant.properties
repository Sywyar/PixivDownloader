title=下載歸檔
ArchiveController.initQuota.POST.summary=初始化下載配額
ArchiveController.initQuota.POST.description=讀取當前用量和重置倒計時。多人配額啟用時，首次請求會設定使用者 UUID Cookie；隨後打包時應保留它。
ArchiveController.initQuota.POST.success=已初始化下載配額。
ArchiveController.triggerPack.POST.summary=封裝目前配額身分已下載的目錄
ArchiveController.triggerPack.POST.description=打包當前配額身份已下載的目錄。先呼叫 POST /api/quota/init 並帶回 Cookie；沒有可打包目錄時返回 204，超過頻率限制時返回 429。
ArchiveController.triggerPack.POST.success=作品打包任務。
ArchiveController.triggerAdminPack.POST.summary=提交作品打包任務
ArchiveController.triggerAdminPack.POST.description=提交 artworkIds。服務端跳過未登記或目錄不存在的作品，對剩餘目錄去重後打包；全部跳過時返回 204，否則返回 token 和有效秒數。
ArchiveController.triggerAdminPack.POST.success=作品打包任務。
ArchiveController.listAdminArchives.GET.summary=列出作品歸檔
ArchiveController.listAdminArchives.GET.description=列出管理員打包記錄，從返回的 token 查詢狀態或下載歸檔。
ArchiveController.listAdminArchives.GET.success=作品歸檔。
ArchiveController.archiveStatus.GET.summary=檢視打包進度
ArchiveController.archiveStatus.GET.description=使用打包返回的 token 查詢狀態。狀態為 ready 時再請求 /api/archive/download/{token}。 權杖未知或過期時回傳 200 和 {"status":"expired"}，省略 token、expireSeconds。 ZIP 就緒後即可下載，包括刪除來源作品失敗或部分完成的情況。請透過 sourceDeletion 查看刪除結果及已提交的作品數。
ArchiveController.archiveStatus.GET.success=打包進度。
ArchiveController.downloadArchive.GET.summary=下載作品歸檔檔案
ArchiveController.downloadArchive.GET.description=返回 ZIP 附件。準備中返回 202；token 已失效返回 410，已就緒但檔案缺失返回 404。
ArchiveController.downloadArchive.GET.success=作品歸檔檔案。
parameter.token=建立操作或訂閱時返回的令牌。
