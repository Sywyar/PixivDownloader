title=スケジュールタスク
ScheduleController.sources.GET.summary=スケジュールの取得元の一覧
ScheduleController.sources.GET.description=sourceType を選び、同じ項目の activationToken を保存します。inputSchemaJson を独立した JSON Schema として解析すると examples を取得できます。オフラインでは x-schedule-sources[sourceType].inputSchemaJson にスキーマ文字列があり、利用可能な宣言がなければ null です。取得元の公開版が変わったらこの API からトークンを再取得してください。 どちらも同じ提供元の宣言から生成されます。単独で検証する場合は x-schedule-sources[sourceType].inputSchemaJson 全体をルートとして解析してください。バッチの検証や SDK 生成には、OpenAPI 文書全体を基準に対応する ScheduleDefinition を解決してください。
ScheduleController.sources.GET.success=スケジュールの取得元。
ScheduleController.list.GET.summary=スケジュールタスクの一覧
ScheduleController.list.GET.description=保存済みのタスクと現在の状態を返します。プログラムキーでは、取得元プラグインの schedule.manage 権限を持つタスクのみ表示されます。 スケジュールのデータベースを利用できない場合も空配列が返ります。
ScheduleController.list.GET.success=スケジュールタスク。
ScheduleController.get.GET.summary=スケジュールタスクの詳細を取得
ScheduleController.get.GET.description=定義、トリガー、最新の状態を返します。編集前に stateVersion を控えてください。paramsJson は取得元の定義で、認証情報は個別に紐付けます。
ScheduleController.get.GET.success=スケジュールタスクの詳細。
ScheduleController.get.GET.response.400=この ID のタスクがありません（schedule.error.not-found）。
ScheduleController.get.GET.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.queue.GET.summary=直近の実行キューの一覧
ScheduleController.queue.GET.description=直近の実行で検出した作品と個別の結果を返します。実行記録がなければ items は空です。truncated はキューまたはライブ状態が一部のみであることを示します。
ScheduleController.queue.GET.success=直近の実行キュー。
ScheduleController.queue.GET.response.400=この ID のタスクがありません（schedule.error.not-found）。
ScheduleController.queue.GET.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.create.POST.summary=スケジュールタスクを作成
ScheduleController.create.POST.description=GET /api/schedule/sources で取得元のスキーマとトークンを取得します。シリアライズした definitionJson と、triggerKind に応じて intervalMinutes または cronExpr を送ります。作成時は expectedStateVersion を省略します。応答にタスク ID が含まれます。 作成直後は有効です。下書きとして保存する場合は初回実行を十分先に設定し、別の要求で POST /api/schedule/tasks/{id}/enabled?enabled=false を呼び出します。 必要な権限は取得元の schedulePermission で確認できます。権限不足または取得元が不明な場合は 403 を返します。許可された取得元のトークンが古い場合は 409（schedule.error.source-publication-changed）を返すため、取得元一覧を再取得してください。
ScheduleController.create.POST.success=スケジュールタスクを作成しました。
ScheduleController.create.POST.response.400=必須項目または JSON が不正、作成時に expectedStateVersion を指定、ソースが利用不可、定義またはトリガーが不正、あるいはタスク数が上限に達しています。定義の検証に失敗すると schedule.error.definition-invalid が返ります。
ScheduleController.create.POST.response.409=activationToken が古い（schedule.error.source-publication-changed）、または保存中にソースが更新されました（schedule.error.concurrent-change）。ソース一覧を再取得してください。
ScheduleController.create.POST.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.update.PUT.summary=スケジュールタスクを更新
ScheduleController.update.PUT.description=待機中のタスクに、編集前に取得した stateVersion を expectedStateVersion として定義全体を送ります。取得元プラグインは変更できません。保存すると旧チェックポイントと保留項目が消去されます。競合時は再取得します。 必要な権限は取得元の schedulePermission で確認できます。更新時は既存タスクの所有者も確認します。権限不足または取得元が不明な場合は 403 を返します。許可された取得元のトークンが古い場合は 409（schedule.error.source-publication-changed）を返すため、取得元一覧を再取得してください。
ScheduleController.update.PUT.success=スケジュールタスクを更新しました。
ScheduleController.update.PUT.response.400=項目、定義、トリガーが不正、expectedStateVersion が未指定、またはタスクが存在しないか実行中・待機中です。ソースは利用可能で、同じプラグインに属し、登録済みの認証情報ポリシーと互換性が必要です。
ScheduleController.update.PUT.response.409=編集開始後にタスクのバージョンが変わった（schedule.error.concurrent-change）、またはソースが再公開されました（schedule.error.source-publication-changed）。タスクとソース一覧を取得し直してください。
ScheduleController.update.PUT.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.delete.DELETE.summary=スケジュールタスクを削除
ScheduleController.delete.DELETE.description=待機中のタスク、その保留項目、直近の実行キューを削除します。
ScheduleController.delete.DELETE.success=スケジュールタスクを削除しました。
ScheduleController.delete.DELETE.response.400=タスクが存在しない、実行中・待機中、または書き込み中に状態が変わりました。対応するコードは schedule.error.not-found、schedule.error.busy、schedule.error.concurrent-change です。
ScheduleController.delete.DELETE.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.setEnabled.POST.summary=タスクの有効化設定を設定
ScheduleController.setEnabled.POST.description=待機中のタスクにクエリ enabled=true または false を渡し、自動実行を切り替えます。無効にしても定義と状態は保持されます。
ScheduleController.setEnabled.POST.success=タスクの有効化設定を保存しました。
ScheduleController.setEnabled.POST.response.400=タスクが存在しない、実行中・待機中、または書き込み中に状態が変わりました。対応するコードは schedule.error.not-found、schedule.error.busy、schedule.error.concurrent-change です。
ScheduleController.setEnabled.POST.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.bindCredential.POST.summary=タスクの取得用認証情報を関連付ける
ScheduleController.bindCredential.POST.description=取得用の認証情報は X-Acquisition-Credential ヘッダー、現在の取得元の activationToken は本文に指定します。ポリシーが検証して紐付け、応答には紐付け状態を返します。
ScheduleController.bindCredential.POST.success=タスクの取得用認証情報を関連付けました。
ScheduleController.bindCredential.POST.response.400=タスクが存在しないか使用中、認証情報ヘッダーが未指定・空・不正・変更なし、固定済み、またはソースで検証できません。認証情報が無効なら schedule.error.credential-invalid、検証に失敗した場合は schedule.error.credential-probe-failed です。
ScheduleController.bindCredential.POST.response.409=認証情報の検証中にタスクまたはソースが変更されました。タスクと最新の activationToken を再取得してください。
ScheduleController.bindCredential.POST.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.revokeCredential.DELETE.summary=タスクの認証情報の関連付けを取り消す
ScheduleController.revokeCredential.DELETE.description=このタスクに保存された取得用の認証情報の紐付けを解除します。アカウントが必須の取得元は、次の実行前に新しい認証情報を紐付けてください。
ScheduleController.revokeCredential.DELETE.success=タスクの認証情報の関連付けを取り消しました。
ScheduleController.revokeCredential.DELETE.response.400=タスクが存在しないか使用中、認証情報ポリシーを利用できない、または固定された登録を解除できません（schedule.error.credential-fixed）。
ScheduleController.revokeCredential.DELETE.response.409=書き込み中にタスクのバージョンまたは認証情報ポリシーが変わりました。タスクを再取得してください。
ScheduleController.revokeCredential.DELETE.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.applyCredentialPolicyAction.POST.summary=認証ポリシーの操作を実行
ScheduleController.applyCredentialPolicyAction.POST.description=タスクの credentialPolicy から ownerPluginId、policyId、publicationId、accountKey を転記します。同じ投影の accountActionsSchemaJson を解析し、例に従って actionId と parameters を指定します。操作はこのアカウントの該当タスクに適用されます。
ScheduleController.applyCredentialPolicyAction.POST.success=認証ポリシーの操作。
ScheduleController.applyCredentialPolicyAction.POST.response.400=入力項目が不正、アカウントにタスクがない、またはポリシーが操作・パラメータ・結果を拒否しました。コード例は schedule.error.credential-account-not-found、schedule.error.credential-account-action-unsupported です。
ScheduleController.applyCredentialPolicyAction.POST.response.409=ポリシーの publicationId、所有者、またはアカウントのタスク状態が変わりました。ポリシーと対象タスクを再取得してください。
ScheduleController.applyCredentialPolicyAction.POST.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.updateProxy.POST.summary=タスク専用プロキシを設定
ScheduleController.updateProxy.POST.description=待機中のタスクに 127.0.0.1:7890 のような host:port を指定してプロキシを上書きします。null または空文字で全体設定に戻します。
ScheduleController.updateProxy.POST.success=タスク専用プロキシを保存しました。
ScheduleController.updateProxy.POST.response.400=プロキシが host:port 形式でない（schedule.error.proxy-invalid）、またはタスクが存在しないか、使用中か、状態が変わりました。
ScheduleController.updateProxy.POST.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.runOnce.POST.summary=スケジュールタスクの手動実行を実行
ScheduleController.runOnce.POST.description=有効で待機中かつ一時停止されていないタスクのバックグラウンド実行を要求します。success の後、タスクの queue で作品ごとの進捗を確認できます。
ScheduleController.runOnce.POST.success=スケジュールタスクの手動実行。
ScheduleController.runOnce.POST.response.400=タスクが存在しないか、実行中・待機中、無効（schedule.error.run-disabled）、または一時停止中です（schedule.error.run-suspended）。
ScheduleController.runOnce.POST.response.429=バックグラウンド実行器が今回の実行を受け付けませんでした（task.queue.full）。時間を置いて再試行してください。
ScheduleController.runOnce.POST.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.pause.POST.summary=現在のタスク実行を一時停止
ScheduleController.pause.POST.description=実行中またはキューにあるタスクを一時停止し、今回の実行中止を要求します。待機中のタスクの自動起動を止めるには enabled=false を使います。
ScheduleController.pause.POST.success=現在のタスク実行を一時停止しました。
ScheduleController.pause.POST.response.400=タスクが存在しない、既に一時停止中、中断する待機中・実行中の処理がない（schedule.error.pause-idle）、または書き込み中に状態が変わりました。
ScheduleController.pause.POST.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.resolvePending.POST.summary=保留中の作品に対応
ScheduleController.resolvePending.POST.description=USER_ACTION_REQUIRED で停止した待機中のタスクに判断を記録します。タスクの stateVersion と pending の workType・workId を使い、更新後に resume を呼びます。
ScheduleController.resolvePending.POST.success=保留中の作品。
ScheduleController.resolvePending.POST.response.400=タスクが存在しないか使用中、入力が不正、またはバージョン、停止理由、保留作品が変わりました（schedule.error.concurrent-change）。タスクと保留一覧を再取得してください。
ScheduleController.resolvePending.POST.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.resume.POST.summary=スケジュールタスクを再開
ScheduleController.resume.POST.description=MANUAL または USER_ACTION_REQUIRED の一時停止を解除します。有効なタスクは直ちに実行を要求し、無効なタスクは停止状態の解除のみ行います。
ScheduleController.resume.POST.success=スケジュールタスクを再開しました。
ScheduleController.resume.POST.response.400=タスクが存在しないか使用中、MANUAL または USER_ACTION_REQUIRED による一時停止ではない（schedule.error.resume-not-paused）、または状態が変わりました。
ScheduleController.resume.POST.response.429=バックグラウンド実行器が今回の実行を受け付けませんでした（task.queue.full）。時間を置いて再試行してください。
ScheduleController.resume.POST.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.pending.GET.summary=再試行待ちの作品の一覧
ScheduleController.pending.GET.description=再試行待ちまたは手動判断待ちの作品を返します。各項目は workType と workId で特定し、reasonCode、reasonDetailJson、試行回数を確認できます。
ScheduleController.pending.GET.success=再試行待ちの作品。
ScheduleController.pending.GET.response.400=この ID のタスクがありません（schedule.error.not-found）。
ScheduleController.pending.GET.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
ScheduleController.clearPending.DELETE.summary=手動対応が必要な項目をクリア
ScheduleController.clearPending.DELETE.description=待機中のタスクで pending の workType と workId を指定して該当の保留記録を削除し、その記録からの再試行を終了します。
ScheduleController.clearPending.DELETE.success=手動対応が必要な項目を消去しました。
ScheduleController.clearPending.DELETE.response.400=作品の識別情報が不正、タスクが存在しないか使用中、または削除時に記録が変わりました（schedule.error.concurrent-change）。
ScheduleController.clearPending.DELETE.response.503=スケジュールのデータベースを使用できません（DATABASE_UNAVAILABLE）。
parameter.X-Acquisition-Credential=取得元にアクセスするための認証情報で、最大 16,384 文字です。プログラムキーは別途 Authorization で送ります。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.title=実行スケジュールと取得元
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.name=表示名。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.sourceType=GET /api/schedule/sources の選択した項目の sourceType と、同じ項目の activationToken を使います。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.activationToken=選択した取得元の現在の activationToken。再公開後はカタログと入力スキーマを再取得します。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.definitionJson=OpenAPI の x-schedule-sources[sourceType].inputSchemaJson にある JSON Schema を参照し、examples[0] を基に定義オブジェクトを作成してこの文字列にシリアライズします。UTF-8 で最大 1 MiB です。認証情報は含めないでください。最新の activationToken は GET /api/schedule/sources から取得します。 オフライン検証では $id と $defs を含む schema 全体を検証のルートにします。同じ値を、手動バッチではオブジェクト、スケジュールでは JSON 文字列として送ります。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.expectedStateVersion=作成時は省略するか null を指定します。編集時はタスクから読み取った stateVersion を指定します。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.triggerKind=一定間隔なら interval、Cron 式を使うなら cron。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.intervalMinutes=triggerKind=interval の場合に必須の正の整数で、単位は分です。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.cronExpr=triggerKind=cron のときに必須の Spring cron 式です。例：0 0 9 * * * はサーバーの現地時間で毎日 09:00。 GET /api/schedule/sources の timeZone でスケジューラーのタイムゾーンを確認できます。保存後はタスクの nextRunTime（Unix ミリ秒）を参照してください。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.description=実行時刻とダウンロードの取得元を設定します。
ScheduleController.update.PUT.body=実行スケジュールと取得元
ScheduleController.create.POST.body=実行スケジュールと取得元
schema.top.sywyar.pixivdownload.schedule.dto.ProxyOverrideRequest.title=今回の実行に使うプロキシ
schema.top.sywyar.pixivdownload.schedule.dto.ProxyOverrideRequest.field.proxy=任意の host:port（例：127.0.0.1:7890）。空値は全体設定のプロキシを使用します。
ScheduleController.updateProxy.POST.body=今回の実行に使うプロキシ
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.title=保留中の作品に対する判断
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.field.expectedStateVersion=取得時点のタスクの状態バージョン。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.field.workType=workId が示す作品の種類。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.field.workId=workType と組み合わせる取得元の作品 ID。元の文字列をそのまま渡します。
ScheduleController.resolvePending.POST.body=保留中の作品に対する判断
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialBindRequest.title=スケジュール取得元の認証情報
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialBindRequest.field.activationToken=現在公開されている取得元の有効化トークン。
ScheduleController.bindCredential.POST.body=スケジュール取得元の認証情報
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialPolicyActionRequest.title=認証情報のポリシー操作
ScheduleController.applyCredentialPolicyAction.POST.body=認証情報のポリシー操作
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.title=保留一覧から外す作品
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.field.workType=workId が示す作品の種類。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.field.workId=workType と組み合わせる取得元の作品 ID。元の文字列をそのまま渡します。
ScheduleController.clearPending.DELETE.body=保留一覧から外す作品
parameter.id=スケジュールタスク ID。
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.description=現在のスケジュール取得元の認証情報の関連付け状態。
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.description=タスクのスケジュール、取得元、実行状態。認証情報の値は含みません。
schema.top.sywyar.pixivdownload.plugin.api.schedule.source.ScheduledTaskPresentation.description=提供元が利用できない場合も表示できるタスク情報。
schema.top.sywyar.pixivdownload.schedule.dto.ProxyOverrideRequest.description=このタスク専用の HTTP プロキシの設定または解除。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.description=指定したタスクバージョンの保留作品に対する一回分の判断。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialBindRequest.description=認証情報の関連付けに使う取得元の公開情報。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialPolicyActionRequest.description=現在の認証情報ポリシーが扱うアカウント操作。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleQueueView.description=スケジュールタスクの直近の実行キュー。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleQueueView.Item.description=workType と workId の組で識別するキュー内の作品。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingView.description=再試行または管理者の判断を待つ作品。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.description=現在のプロセスで有効なスケジュール取得元。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.description=作品種別と ID で指定する再試行待ちの記録。
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.id=安定した識別子
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.enabled=この項目を有効にするかどうか
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.ownerPluginId=この項目を所有するプラグイン ID
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.policyId=関連付け済みの場合のポリシー ID
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.accountKey=関連付けたアカウントの識別子（秘密情報を含まない）
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.bound=ポリシーの利用可否にかかわらず保存済みの認証情報との関連付けがあるかどうか
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.available=現在利用できるかどうか
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.publicationId=利用可能な公開版の ID
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.statusCode=取得できる場合は機械可読な状態コード
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.acknowledgedEventTime=最後に確認したイベントの時刻（ミリ秒）
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.name=表示名
