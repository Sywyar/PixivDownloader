PathPrefixToolsController.apply.POST.summary=Update library path prefixes
PathPrefixToolsController.apply.POST.description=Use IDs from GET in `updates`. Each `registerPaths` entry must be a string containing the absolute path of an existing directory. Edits and registrations commit together. A write failure rolls back the entire request. If an artwork’s effective source changes, the transaction clears its duplicate-detection hashes for the next incremental scan. A path that overlaps an active file operation returns `conflict`.
PathPrefixToolsController.apply.POST.response.500=A write failed (PATH_PREFIX_WRITE_FAILED). The transaction was rolled back and applied is zero.
PathPrefixToolsController.pin.POST.response.500=A write failed (PATH_PREFIX_WRITE_FAILED). The transaction was rolled back and applied is zero.
PathPrefixToolsController.apply.POST.success=Library path prefixes updated.
PathPrefixToolsController.pin.POST.summary=Bind a symbolic root directory
PathPrefixToolsController.pin.POST.description=Pins the symbolic root to the supplied original path. Use GET to inspect its status and suggested previous path first. If an artwork’s effective source changes, the transaction clears its duplicate-detection hashes for the next incremental scan. A path that overlaps an active file operation returns `conflict`.
PathPrefixToolsController.pin.POST.success=Symbolic root directory bound.
PathPrefixController.list.GET.summary=List registered path prefixes
PathPrefixController.list.GET.description=Lists registered prefixes and the current application root, including whether the symbolic root is referenced or orphaned.
