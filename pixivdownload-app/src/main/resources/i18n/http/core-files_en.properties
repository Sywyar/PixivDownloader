PathPrefixController.pin.POST.description=Pins the symbolic root to the supplied original path. Use GET to inspect its status and suggested previous path first.
PathPrefixController.pin.POST.success=Symbolic root directory bound.
PathPrefixController.apply.POST.summary=Update library path prefixes
PathPrefixController.apply.POST.description=Use IDs from GET in `updates`. Each `registerPaths` entry must be a string containing the absolute path of an existing directory. Edits and registrations commit together. A write failure rolls back the entire request.
PathPrefixController.apply.POST.success=Check success and errors to see whether the changes were committed.
DirectoryToolsController.check.GET.summary=Check recorded artwork directories
DirectoryToolsController.check.GET.description=Checks registered artwork folders by page. offset starts at 0, limit is 1–1000, and a concurrent check returns 409.
DirectoryToolsController.check.GET.success=Recorded artwork directories.
DirectoryToolsController.update.POST.summary=Update a recorded artwork directory
DirectoryToolsController.update.POST.description=Updates the folder record for a positive artworkId. Supply the new path and use moved to select the moved or original folder record. Files stay in place.
DirectoryToolsController.update.POST.response.409=The requested path overlaps a work deletion in progress. Retry after it finishes.
DirectoryToolsController.update.POST.success=Recorded artwork directory updated.
