schema.top.sywyar.pixivdownload.setup.AuthFilter.ProgramCredentialError.description=この応答は `code`、`error`、`programPermission` を含みます。`code` の列挙値は具体的な権限 ID を返す応答に適用されます。他のエラー形式は各操作の `responses` で確認してください。例えば `auth.program.unsupported` の形式は `ProgramKeyUnsupported` です。
