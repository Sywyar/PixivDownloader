operation.details=詳細情報

permissionGrammar.description=このカタログは各操作の `x-program-permissions` を説明します。記載された条件は要求、対象リソース、実行計画に照らして評価します。操作の説明に追加の権限が記載されている場合もあります。
permissionGrammar.phase.route=この HTTP メソッドとパスの入口で確認する完全な権限 ID です。操作の `x-program-permission` と同じ値です。有効なキーにこの権限がない場合、その要求の HTTP 403 応答に権限 ID が入ります。
permissionGrammar.phase.discovery=現在の取得元トークンなどを調べるときは、指定された `permission` で `operation` を呼びます。権限不足はその照会の応答に現れます。
permissionGrammar.phase.submit=現在の要求に適用する追加条件の配列です。該当する条件はすべて満たす必要があります。`effect: filter` は一覧の表示範囲を制御し、それ以外の権限不足は `reportedIn` の指定先に現れます。
permissionGrammar.phase.execution=バッチ受理後、ワーカーが取得元の権限を再確認し、今回の計画で使用する実行器の権限を確認します。結果は `reportedIn.operation` で取得します。
permissionGrammar.expression=`#` の前の名前で下記の対象を選びます。後半はそのオブジェクトを起点とする RFC 6901 JSON Pointer です。例えば `task#/sourceOwnerPluginId` は既存タスクの `sourceOwnerPluginId` を読みます。 フィールド名に含まれる `~` は `~0`、`/` は `~1` と表記します。
permissionGrammar.context.request=現在の操作に送信した JSON リクエストボディ。
permissionGrammar.context.task=現在のパスの `{id}` が指す既存のスケジュールタスク。
permissionGrammar.context.batch=現在のパスの `{id}` が指す既存の手動バッチ。再開と再試行ではこのバッチから取得元の型を読みます。
permissionGrammar.context.item=表示権限で絞り込む前の一覧の候補 1 件。
permissionGrammar.field.permission=`core:credentials.use` のような完全な権限 ID。`discovery` または `reportedIn` 内では対応する `operation` を呼ぶ権限です。
permissionGrammar.field.ownerFrom=`permissionId` と組み合わせる権限の owner を読むコンテキスト式。
permissionGrammar.field.permissionId=ローカル権限名。`ownerFrom` で求めた owner、コロン、この名前を連結すると `download-workbench:schedule.manage` のような完全な ID になります。
permissionGrammar.field.header=このリクエストヘッダーを使う場合に、同じ項目の `permission` が追加で必要です。
permissionGrammar.field.effect=`filter` は候補ごとの確認です。権限のない項目を除外して一覧の要求は成功します。
permissionGrammar.field.catalog=OpenAPI 文書のルートから `#/…` の JSON Pointer フラグメントでカタログを参照します。`key`、`keyFrom`、`value` のいずれか一つで項目を選び、`field` を読みます。
permissionGrammar.field.key=JSON リクエストボディのこのトップレベルフィールドの値をカタログの索引に使います。
permissionGrammar.field.keyFrom=`batch#/sourceType` などのコンテキスト式を評価し、その値をカタログの索引に使います。
permissionGrammar.field.value=この固定値をカタログの索引に使います。
permissionGrammar.field.field=選んだカタログ項目から完全な権限 ID を読むプロパティ名。`keyedBy` がある場合は権限のマップを指します。
permissionGrammar.field.keyedBy=`workType` は、今回の実行計画に必要な各作品の種類で `field` のマップを引き、それぞれの完全な権限 ID を取得する指定です。
permissionGrammar.field.recheckField=同じカタログ項目内の別のプロパティ名。ワーカーはその値が示す取得元の完全な権限 ID（例：`batchSubmitPermission` の値）も再確認します。
permissionGrammar.field.reportedIn=診断情報を読む応答を指定します。`operation` を省略した場合は現在の要求、それ以外は指定された操作の応答本文を読みます。`pointer` と `codePointer` はどちらもその JSON 本文のルートを起点とします。
permissionGrammar.field.operation=HTTP メソッドとパステンプレート。受理されたバッチの照会先 URL は 202 応答の `Location` で取得します。
permissionGrammar.field.status=対象の応答の HTTP ステータス。照会の 200 はバッチ情報の取得成功を示し、実行状態は本文の `state` にあります。
permissionGrammar.field.pointer=応答本文のルートから不足した権限 ID を読む RFC 6901 JSON Pointer。サーバーが権限を特定できた場合に値を取得できます。
permissionGrammar.field.codePointer=同じ応答本文のルートから理由コードを読む JSON Pointer。バッチでは `state`、次に理由コードを確認します。`auth.program.forbidden` の場合は `pointer` から特定できた不足権限 ID を読みます。
parameter.Range=取得するバイト範囲。例：bytes=0-99。
parameter.If-Modified-Since=前回の Last-Modified を送ると、ファイルに変更がない場合は 304 を返します。
response.206=指定範囲のファイルデータ。複数範囲は multipart/byteranges で返し、各パートに Content-Range が付きます。
header.contentRange.single=単一範囲の開始・終了バイトとファイル全長。
response.304=指定日時以降、ファイルに変更はありません。本文は空です。
response.416=指定範囲を返せません。本文は空で、Content-Range が bytes */長さ の形で全長を示します。
permissionGrammar.field.when=keyFrom が指す JSON 値が value と等しい場合にのみ、この権限が必要です。
link.inspectArchive=応答に archiveToken が含まれる場合、core:archives.read でアーカイブの状態を確認できます。
link.downloadArchive=状態が ready になったら core:archives.download でアーカイブをダウンロードできます。
schema.top.sywyar.pixivdownload.common.web.RequestFieldError.description=エラーコード、メッセージ、項目のパスと検証理由を含むエラー。
schema.top.sywyar.pixivdownload.common.web.RequestFieldError.field.field=リクエスト本文内の対象項目を示す JSON Pointer。
schema.top.sywyar.pixivdownload.common.web.RequestFieldError.field.reason=言語に依存しない項目の検証理由コード。
schema.top.sywyar.pixivdownload.common.web.RequestFieldError.field.code=エラー処理の分岐に使用する安定したコード。
schema.top.sywyar.pixivdownload.common.web.RequestFieldError.field.error=リクエストの言語で表示するエラー説明。
response.406=Accept に一致する応答形式がありません。応答本文は空です。
binding.part=必須のファイルパートがない場合、field にそのパート名が入ります。
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.in=不正な入力の送信箇所。
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.field=パスパラメーター、クエリ、ヘッダーまたはマルチパートのパート名。本文のフィールドは JSON Pointer で示します。
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.reason=プログラムで判別できる検証理由。例：required（必須）、type（型の不一致）、invalid_value（無効な値）。
schema.top.sywyar.pixivdownload.common.web.RequestFieldError.field.in=JSON リクエスト本文のフィールドの場合は body になります。
