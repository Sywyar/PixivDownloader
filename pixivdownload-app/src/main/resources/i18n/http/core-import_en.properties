LocalImportController.status.GET.summary=Get scan or import progress
LocalImportController.status.GET.description=Reads scan, import or cancellation state by preview or task UUID. Read individual results from the items path under the same ID. After import, use the artwork IDs from the results in POST /api/tools/backfill/candidates and POST /api/tools/backfill/tasks to fill missing titles, authors, tags and series.
LocalImportController.status.GET.success=Scan or import progress.
LocalImportController.items.GET.summary=Browse scan or import items
LocalImportController.items.GET.description=Pages through matched files and dispositions by artwork. offset starts at 0 and limit is 1–100, default 20.
LocalImportController.items.GET.success=Scan or import items.
LocalImportController.start.POST.summary=Start a local import
LocalImportController.start.POST.description=Starts background import using the reviewed previewId. After 202, poll the returned task identity for state and items. After import, use the artwork IDs from the results in POST /api/tools/backfill/candidates and POST /api/tools/backfill/tasks to fill missing titles, authors, tags and series.
LocalImportController.start.POST.success=Local import.
LocalImportController.cancel.POST.summary=Cancel a scan or import
LocalImportController.cancel.POST.description=Requests cancellation of the scan preview or import job identified by UUID and returns its state.
LocalImportController.cancel.POST.success=Scan or import.
FileImportToolController.tools.GET.summary=List file import tools
