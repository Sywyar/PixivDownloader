FileImportToolController.start.POST.summary=Start a file import task
FileImportToolController.start.POST.description=Starts import with the same tool identity and preview token. Supply credential when the tool declares requiresCredential. A 202 returns the job snapshot.
FileImportToolController.start.POST.success=File import task.
FileImportToolController.status.GET.summary=Get the current file import
FileImportToolController.status.GET.description=Reads the current import execution for the specified tool identity.
FileImportToolController.status.GET.success=Current file import.
FileImportToolController.cancel.POST.summary=Cancel the current file import
FileImportToolController.cancel.POST.description=Submits identity and executionId for the same tool. Returns the updated snapshot when the execution accepts cancellation.
FileImportToolController.cancel.POST.success=Current file import.
FileImportToolController.acknowledge.POST.summary=Acknowledge file import completion
