FileImportToolController.tools.GET.success=File import tools.
FileImportToolController.inspect.POST.summary=Preview file import contents
FileImportToolController.inspect.POST.description=Submits the tool identity, absolute record file or shard directory in recordFile, and sourceRoot. Returns a preview and execution token.
