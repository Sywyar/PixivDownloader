title=计划任务
ScheduleController.sources.GET.summary=列出计划任务来源
ScheduleController.sources.GET.description=选择 sourceType，保留同项的 activationToken。解析 inputSchemaJson 获得独立的 JSON Schema 和 examples。离线文档在 x-schedule-sources[sourceType].inputSchemaJson 提供同样可解析的文本；null 表示未提供可用声明。来源版本改变时重新读取本接口获取当前令牌。 同一来源声明生成两种表示。离线校验时解析 x-schedule-sources[sourceType].inputSchemaJson，以整段 JSON 为根。校验批次请求或生成 SDK 时使用 components.schemas 中对应的 ScheduleDefinition，引用相对整份 OpenAPI 解析。
ScheduleController.sources.GET.success=计划任务来源。
ScheduleController.list.GET.summary=列出计划任务
ScheduleController.list.GET.description=返回已保存的任务与运行状态。使用程序密钥时，只返回该密钥具有来源插件 schedule.manage 权限的任务。 计划数据库不可用时返回空数组。
ScheduleController.list.GET.success=计划任务。
ScheduleController.get.GET.summary=查看计划任务详情
ScheduleController.get.GET.description=返回任务定义、调度和最近状态。编辑前保存 stateVersion。paramsJson 是该来源的定义文本，凭据需要单独绑定。
ScheduleController.get.GET.success=计划任务详情。
ScheduleController.get.GET.response.400=找不到该任务 ID（schedule.error.not-found）。
ScheduleController.get.GET.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.queue.GET.summary=列出最近一轮执行的队列
ScheduleController.queue.GET.description=返回最近一轮发现的作品和逐项结果。尚无本轮记录时 items 为空；truncated 表示条目或实时状态展示被截断。
ScheduleController.queue.GET.success=最近一轮执行的队列。
ScheduleController.queue.GET.response.400=找不到该任务 ID（schedule.error.not-found）。
ScheduleController.queue.GET.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.create.POST.summary=创建计划任务
ScheduleController.create.POST.description=先从 GET /api/schedule/sources 取得同一来源的结构和激活令牌。提交已序列化的 definitionJson，并按 triggerKind 填写 intervalMinutes 或 cronExpr。创建时省略 expectedStateVersion；返回任务 ID。 创建成功时计划已启用。需暂存时，请将首次触发安排在未来，然后调用 POST /api/schedule/tasks/{id}/enabled?enabled=false 停用。 权限见来源的 schedulePermission。创建时检查提交的来源。缺权或来源不可见时返回 403。已获授权的来源令牌过期时返回 409（schedule.error.source-publication-changed），请重新读取来源清单。
ScheduleController.create.POST.success=已创建计划任务。
ScheduleController.create.POST.response.400=必填字段或 JSON 无效、创建时携带 expectedStateVersion、来源不可用、定义未通过来源校验、触发规则不合法或达到任务数上限。来源拒绝定义时 code 为 schedule.error.definition-invalid。
ScheduleController.create.POST.response.409=activationToken 已过期（schedule.error.source-publication-changed），或保存时来源已换代（schedule.error.concurrent-change）。重新读取来源清单。
ScheduleController.create.POST.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.update.PUT.summary=更新计划任务
ScheduleController.update.PUT.description=提交完整定义和开始编辑时读到的 stateVersion（放入 expectedStateVersion）。任务须空闲且来源属于原插件。保存后清除旧检查点与待处理项；版本冲突时重新读取任务。 权限见来源的 schedulePermission。创建时检查提交的来源，更新时也检查已有任务的来源。缺权或来源不可见时返回 403。已获授权的来源令牌过期时返回 409（schedule.error.source-publication-changed），请重新读取来源清单。
ScheduleController.update.PUT.success=已更新计划任务。
ScheduleController.update.PUT.response.400=字段、定义或触发规则无效，缺少 expectedStateVersion，或任务不存在、正在运行或排队。来源不可用、更换来源插件或新定义与已绑定凭据策略不兼容也会被拒绝。
ScheduleController.update.PUT.response.409=编辑后任务版本已变化（schedule.error.concurrent-change），或来源已重新发布（schedule.error.source-publication-changed）。重新读取任务和来源清单再编辑。
ScheduleController.update.PUT.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.delete.DELETE.summary=删除计划任务
ScheduleController.delete.DELETE.description=仅可删除空闲任务。删除其定义、关联的待处理工作和最近运行队列。
ScheduleController.delete.DELETE.success=已移除计划任务。
ScheduleController.delete.DELETE.response.400=任务不存在、正在运行或排队，或写入时状态已变化。根据 code 区分 schedule.error.not-found、schedule.error.busy 和 schedule.error.concurrent-change。
ScheduleController.delete.DELETE.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.setEnabled.POST.summary=设置计划任务启用状态
ScheduleController.setEnabled.POST.description=任务空闲时，通过查询参数 enabled=true 或 false 开关自动执行。停用保留定义和状态。
ScheduleController.setEnabled.POST.success=已保存计划任务启用状态。
ScheduleController.setEnabled.POST.response.400=任务不存在、正在运行或排队，或写入时状态已变化。根据 code 区分 schedule.error.not-found、schedule.error.busy 和 schedule.error.concurrent-change。
ScheduleController.setEnabled.POST.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.bindCredential.POST.summary=绑定任务采集凭据
ScheduleController.bindCredential.POST.description=在 X-Acquisition-Credential 头中发送采集凭据，请求体携带当前来源的 activationToken。由当前执行计划的凭据策略验证并绑定，响应只返回绑定状态。
ScheduleController.bindCredential.POST.success=已绑定任务采集凭据。
ScheduleController.bindCredential.POST.response.400=任务不存在或非空闲，凭据头缺失、为空、无效、与原值相同或固定绑定不可替换，或来源无法执行凭据验证。code 区分凭据无效（schedule.error.credential-invalid）与暂时无法验证（schedule.error.credential-probe-failed）。
ScheduleController.bindCredential.POST.response.409=任务或来源在验证期间发生变化。重新读取任务及其最新 activationToken。
ScheduleController.bindCredential.POST.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.revokeCredential.DELETE.summary=撤销任务凭据绑定
ScheduleController.revokeCredential.DELETE.description=解除该任务保存的采集凭据绑定。需要已绑定账号的来源须重新绑定有效凭据后才能执行。
ScheduleController.revokeCredential.DELETE.success=已撤销任务凭据绑定。
ScheduleController.revokeCredential.DELETE.response.400=任务不存在或非空闲、所需凭据策略不可用，或固定绑定拒绝解绑（schedule.error.credential-fixed）。
ScheduleController.revokeCredential.DELETE.response.409=写入时任务版本或凭据策略已变更。重新读取任务。
ScheduleController.revokeCredential.DELETE.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.applyCredentialPolicyAction.POST.summary=执行凭据策略操作
ScheduleController.applyCredentialPolicyAction.POST.description=按任务 credentialPolicy 的 ownerPluginId、policyId、publicationId 和 accountKey 提交。解析同一投影的 accountActionsSchemaJson，按所选示例填写 actionId 和 parameters；动作影响该账号的匹配任务。
ScheduleController.applyCredentialPolicyAction.POST.success=凭据策略操作。
ScheduleController.applyCredentialPolicyAction.POST.response.400=请求字段无效、该账号没有任务，或策略拒绝动作、参数或动作结果。code 可为 schedule.error.credential-account-not-found 或 schedule.error.credential-account-action-unsupported。
ScheduleController.applyCredentialPolicyAction.POST.response.409=策略 publicationId、owner 或账号下任务状态已变化。重新读取策略和相关任务。
ScheduleController.applyCredentialPolicyAction.POST.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.updateProxy.POST.summary=设置任务专用代理
ScheduleController.updateProxy.POST.description=空闲时传 host:port（例如 127.0.0.1:7890）覆盖此任务的代理。传 null 或空字符串清除覆盖并恢复全局设置。
ScheduleController.updateProxy.POST.success=已保存任务专用代理。
ScheduleController.updateProxy.POST.response.400=代理不符合 host:port（schedule.error.proxy-invalid），或任务不存在、非空闲或状态已变化。
ScheduleController.updateProxy.POST.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.runOnce.POST.summary=执行单次计划任务
ScheduleController.runOnce.POST.description=请求在后台运行一次已启用、空闲且未挂起的任务。返回 success 后可查询该任务的 queue 查看逐项进度。
ScheduleController.runOnce.POST.success=单次计划任务。
ScheduleController.runOnce.POST.response.400=任务不存在、正在运行或排队、已停用（schedule.error.run-disabled）或处于暂停/挂起状态（schedule.error.run-suspended）。
ScheduleController.runOnce.POST.response.429=后台执行器拒绝接收本轮运行（task.queue.full）。稍后重试。
ScheduleController.runOnce.POST.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.pause.POST.summary=暂停当前任务执行
ScheduleController.pause.POST.description=挂起正在运行或排队且尚未挂起的任务，并请求停止本轮。要阻止空闲任务下次自动运行，请使用 enabled=false。
ScheduleController.pause.POST.success=已暂停当前任务执行。
ScheduleController.pause.POST.response.400=任务不存在、已经暂停或挂起、当前没有排队或运行的任务可中断（schedule.error.pause-idle），或写入时状态已改变。
ScheduleController.pause.POST.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.resolvePending.POST.summary=处理待处理作品
ScheduleController.resolvePending.POST.description=对 USER_ACTION_REQUIRED 的空闲任务提交一项决定。先读任务 stateVersion 和 pending 中的 workType、workId；返回更新后的任务，再调用 resume 继续。
ScheduleController.resolvePending.POST.success=待处理作品。
ScheduleController.resolvePending.POST.response.400=任务不存在或非空闲、请求字段无效，或任务版本、挂起原因、待处理作品已变化（schedule.error.concurrent-change）。重新读取任务及待处理列表。 遇到 DOWNLOAD_PATH_ACTION_REQUIRED 时可选 TRUNCATE、DEFAULT_NAME 或 CANCEL。其他值返回 400，字段为 /userAction。作品仍待确认，可直接改正后重试。
ScheduleController.resolvePending.POST.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.resume.POST.summary=恢复计划任务
ScheduleController.resume.POST.description=清除 MANUAL 或 USER_ACTION_REQUIRED 挂起状态。已启用的任务会立即尝试运行，停用的任务只清除挂起状态。
ScheduleController.resume.POST.success=已恢复计划任务。
ScheduleController.resume.POST.response.400=任务不存在、非空闲、没有因 MANUAL 或 USER_ACTION_REQUIRED 挂起（schedule.error.resume-not-paused），或状态已变化。
ScheduleController.resume.POST.response.429=后台执行器拒绝接收本轮运行（task.queue.full）。稍后重试。
ScheduleController.resume.POST.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.pending.GET.summary=列出待重试作品
ScheduleController.pending.GET.description=列出持久化的待重试或需人工决定的作品。使用 workType 与 workId 标识条目，并读取 reasonCode、reasonDetailJson 和重试次数。
ScheduleController.pending.GET.success=待重试作品。
ScheduleController.pending.GET.response.400=找不到该任务 ID（schedule.error.not-found）。
ScheduleController.pending.GET.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
ScheduleController.clearPending.DELETE.summary=清除需人工处理的条目
ScheduleController.clearPending.DELETE.description=在任务空闲时，用 pending 返回的 workType 和 workId 移除一条待处理记录，后续重试将跳过这条记录。
ScheduleController.clearPending.DELETE.success=已清除需人工处理的条目。
ScheduleController.clearPending.DELETE.response.400=作品身份无效、任务不存在或非空闲，或清除时记录已变化（schedule.error.concurrent-change）。
ScheduleController.clearPending.DELETE.response.503=计划数据库不可用（DATABASE_UNAVAILABLE）。
parameter.X-Acquisition-Credential=用于访问作品来源的采集凭据，最长 16384 个字符。与 Authorization 中的程序密钥分开传送。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.title=执行计划和下载来源
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.name=显示名称。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.sourceType=从 GET /api/schedule/sources 的所选条目复制 sourceType，使用同一条目的 activationToken。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.activationToken=所选来源当前发布的 activationToken。来源重新发布后须刷新来源目录和输入结构。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.definitionJson=从 OpenAPI 的 x-schedule-sources[sourceType].inputSchemaJson 读取 JSON Schema，以其中的 examples[0] 为起点构造对象，再序列化为本字段的字符串。上限为 1 MiB（UTF-8），勿写入凭据。当前 activationToken 从 GET /api/schedule/sources 获取。 离线校验时取出完整 schema 作为校验根，保留 $id 和 $defs。同一份内部值在手动批次中传对象，在计划任务中传 JSON 字符串。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.expectedStateVersion=创建任务时省略或传 null。编辑时传入从该任务读取的 stateVersion。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.triggerKind=按固定间隔运行传 interval，按 Cron 运行传 cron。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.intervalMinutes=triggerKind=interval 时必填正整数，单位为分钟。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.field.cronExpr=triggerKind=cron 时必填 Spring Cron 表达式。例如 0 0 9 * * * 表示服务器本地时间每天 09:00。 GET /api/schedule/sources 的 timeZone 是调度时区；保存后可读取任务的 nextRunTime（Unix 毫秒）。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleTaskRequest.description=设置执行时间，并选择提供下载内容的来源。
ScheduleController.update.PUT.body=执行计划和下载来源
ScheduleController.create.POST.body=执行计划和下载来源
schema.top.sywyar.pixivdownload.schedule.dto.ProxyOverrideRequest.title=本次执行的代理覆盖设置
schema.top.sywyar.pixivdownload.schedule.dto.ProxyOverrideRequest.field.proxy=可选的 host:port，例如 127.0.0.1:7890。空值使用全局代理。
ScheduleController.updateProxy.POST.body=本次执行的代理覆盖设置
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.title=待处理作品的处理决定
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.field.expectedStateVersion=调用方读取到的任务状态版本。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.field.workType=workId 对应的作品类型。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.field.workId=与 workType 配对的来源作品 ID。按原字符串传入。
ScheduleController.resolvePending.POST.body=待处理作品的处理决定
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialBindRequest.title=计划来源的凭据绑定
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialBindRequest.field.activationToken=当前已发布来源返回的激活令牌。
ScheduleController.bindCredential.POST.body=计划来源的凭据绑定
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialPolicyActionRequest.title=凭据策略操作
ScheduleController.applyCredentialPolicyAction.POST.body=凭据策略操作
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.title=要移出待处理列表的作品
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.field.workType=workId 对应的作品类型。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.field.workId=与 workType 配对的来源作品 ID。按原字符串传入。
ScheduleController.clearPending.DELETE.body=要移出待处理列表的作品
parameter.id=计划任务 ID。
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.description=计划来源当前的凭据绑定状态。
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.description=任务的执行计划、来源和运行状态，凭据原文不会返回。
schema.top.sywyar.pixivdownload.plugin.api.schedule.source.ScheduledTaskPresentation.description=来源插件缺席时仍可查看的任务信息。
schema.top.sywyar.pixivdownload.schedule.dto.ProxyOverrideRequest.description=为此计划任务设置或清除 HTTP 代理。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingResolveRequest.description=对指定任务版本中的待处理作品提交一次处理决定。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialBindRequest.description=绑定凭据策略所使用的来源发布标识。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleCredentialPolicyActionRequest.description=当前凭据策略支持的账户级操作。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleQueueView.description=计划任务最近一轮执行的队列。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleQueueView.Item.description=队列条目，由 workType 与 workId 共同标识。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingView.description=等待重试或需要管理员处理的计划作品。
schema.top.sywyar.pixivdownload.schedule.dto.ScheduleSourceManifestView.description=当前进程中可用的计划下载来源。
schema.top.sywyar.pixivdownload.schedule.dto.SchedulePendingDeleteRequest.description=用作品类型和 ID 指定要移除的待重试记录。
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.id=持久任务标识
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.enabled=任务的启用开关，与运行态和挂起态正交
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.ownerPluginId=策略所属插件标识；未绑定时可为空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.policyId=策略标识；未绑定时可为空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.accountKey=非敏感账号身份；未绑定时可为空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.bound=是否存在持久凭证绑定；策略缺席时仍可为真
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.available=当前精确策略 publication 是否可用
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.publicationId=当前 publication 标识；不可用时为空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.statusCode=策略提供的安全状态码；无状态时为空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleCredentialPolicyView.field.acknowledgedEventTime=已确认事件的时间戳（毫秒）；没有确认时为空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.name=用户设置的任务名称
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.sourceType=来源贡献的稳定类型
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.sourceOwnerPluginId=来源所属插件标识
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.definitionSchema=来源定义的 Schema 标识
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.definitionVersion=来源定义的版本
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.paramsJson=不含凭据的来源定义 JSON
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.presentationJson=不含凭据的持久展示 JSON
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.presentation=来源提供的安全展示投影
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.sourceAvailable=当前精确来源 publication 是否可用
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.sourceActivationToken=当前来源的激活令牌；不可用时为空，不能跨代复用
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.triggerKind=触发类型
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.intervalMinutes=间隔触发的分钟数；非间隔触发时可为空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.cronExpr=Cron 表达式；非 Cron 触发时可为空
schema.top.sywyar.pixivdownload.plugin.api.schedule.management.ScheduleTaskView.field.credentialPolicy=不含凭据的绑定及策略状态
