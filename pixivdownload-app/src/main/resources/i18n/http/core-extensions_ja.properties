OperationHooksController.publish.POST.response.409=計画の準備後に公開状態が変わりました。再度計画を準備して確認してください。
filter.prepare.summary=対象 HTTP 操作のフックを準備
filter.prepare.description=対象操作のアクセス条件で同じサーバーへの要求を準備します。対象操作は実行しません。照合だけなら resolveOnly=true にします。HOOK_CHALLENGE 時は Cookie を保持し、同じ対象に token とフック ID ごとの proofs を指定して再送します。HOOK_READY 後、実際の対象に X-Pixiv-Hook-Ticket でトークンを渡します。ネイティブフォームは nativeSubmit で Cookie を使用できます。
filter.HookPreparation=照合する対象リクエストと登録するチャレンジ証明。
filter.HookPreparation.method=対象ルートの大文字 HTTP メソッド。
filter.HookPreparation.url=/ で始まる同じサーバーのパス。クエリ文字列は指定できます。ホスト名、フラグメント、準備用パス自身は使用できません。
filter.HookPreparation.headers=対象の照合用ヘッダーは最大 16 件。値は 1024 文字以内で制御文字は不可です。名前は英数字とハイフンの 96 文字以内で大文字小文字を区別しません。Accept、Content-Type、X- 系のみ使用できます。X-Forwarded-、X-Pixiv-、X-Real- の各接頭辞、および token、key、auth、cookie を含む名前は指定できません。
filter.HookPreparation.json=操作バインディングの JSON Pointer をキーに元のフィールド値を指定します。最大 256 件、キーは 256 文字まで。
filter.HookPreparation.parameters=フォームフィールド名と空でない文字列配列。対象の Content-Type は application/x-www-form-urlencoded または multipart/form-data。クエリとフォームの値は合計 128 件までです。
filter.HookPreparation.token=応答のチャレンジトークン。初回は省略し、証明の登録時に元の対象とともに指定します。
filter.HookPreparation.proofs=challenges のフック ID ごとに提供元の要求する証明文字列を指定します。token は必須です。最大 16 件、値は 16384 文字まで、UTF-8 で合計 64 KiB までです。
filter.HookPreparation.nativeSubmit=true を指定すると、証明登録後、同じ対象へのネイティブフォーム送信用に一度だけ使える Cookie を発行します。
filter.HookPreparation.resolveOnly=対象を照合するだけで、HOOK_RESOLVED と endpoint を返します。
filter.HookTargetMatch=対象照合のみの場合の結果。
filter.HookPreparationResult=フック承認、チャレンジ、証明登録または拒否の結果。
filter.HookTargetMatch.code=対象に一致した場合は HOOK_RESOLVED。
filter.HookTargetMatch.endpoint=照合された HTTP エンドポイント ID。
filter.HookTargetMatch.invoked=準備要求では false。対象の業務操作は実行されていません。
filter.HookPreparationResult.invoked=準備要求では false。対象の業務操作は実行されていません。
filter.HookPreparationResult.code=承認、チャレンジ、準備完了、失敗を示す機械可読の HOOK_ コード。
filter.HookPreparationResult.error=失敗時の翻訳済みメッセージ。成功時は空文字列。
filter.HookPreparationResult.token=チャレンジ時に発行し、証明準備完了時に返すトークン。それ以外では空の場合があります。
filter.HookPreparationResult.revision=準備に使用した公開リビジョン。取得できない場合は空。
filter.HookPreparationResult.challenges=フック ID ごとのチャレンジ文字列。証明送信時に同じキーを使います。
filter.prepare.200=対象を照合（HOOK_RESOLVED）、準備を承認（HOOK_APPROVED）、または証明を登録（HOOK_READY）しました。
filter.prepare.400=指定のメソッド、URL、ヘッダーまたは項目では有効な対象を照合できません。
filter.prepare.401=対象の操作には有効なセッションまたは対象が対応するプログラムキーが必要です。
filter.prepare.403=準備リクエスト自体の CSRF 検証に失敗すると FORBIDDEN が返ります。対象操作の認可またはフックの検証でも拒否されることがあります。
filter.prepare.409=HOOK_CHALLENGE は証明が必要です。HOOK_STALE または HOOK_TARGET_STALE は対象かトークンが変わったため再準備が必要です。
filter.prepare.413=準備要求が 512 KiB を超えています。
filter.prepare.429=準備要求の頻度または同時実行数が上限に達しました。
filter.prepare.503=フック提供元または対象操作を現在利用できません。
filter.X-Acquisition-Credentials=有効な認証情報ライブラリ ID を優先順に 1～8 件、重複なくカンマ区切りで指定します。管理者または core:credentials.use が必要です。X-Acquisition-Credential との併用はできません。
filter.X-Pixiv-Page-Publication=公開ページからの要求で公開トークンを指定すると、対象ルートの所有者を確認します。公開が古いか対象不一致なら 409 を返します。
filter.pagePublication=ページ要求で X-Pixiv-Page-Publication の代わりに使うクエリ項目。ヘッダーを優先します。
filter.X-Pixiv-Ui-Publication=公開 UI スロットからの要求では、スロットの publication トークンを指定します。公開版が撤回されていれば 409 を返します。
filter.uiPublication=スロットが所有元のリソースを読み込む際の公開トークン。リソース所有元を確認します。X-Pixiv-Ui-Publication を優先します。
filter.X-Pixiv-Hook-Ticket=対象が HOOK_CHALLENGE を返した場合、準備時の Cookie を保持し、HOOK_READY の一度限りのトークンを同じ対象に送信します。
schema.top.sywyar.pixivdownload.plugin.web.controller.OperationHooksController.Failure.field.code=フック設定要求の失敗理由コード。
filter.X-Pixiv-Hook=READY、CHALLENGE などフック処理の結果。対象照合のみで成功した場合はこのヘッダーを返しません。
filter.prepare.access=アクセス条件は対象操作に従います。公開対象は匿名で準備できます。その他の場合、対象が受け付けるセッション、GUI 認証情報、またはプログラムキーを外側の要求に含めてください。ブラウザーからは同一オリジンの書き込み条件も満たす必要があります。
parameter.page=公開カタログのページキーに対応する Web ページの識別子です。
filter.credentials.400=X-Acquisition-Credentials の形式が不正、重複、または生の認証情報ヘッダーと併用されています。
filter.credentials.403=呼び出し元には X-Acquisition-Credentials でライブラリの項目を選ぶ権限がありません。
filter.credentials.503=認証情報ライブラリを読み取れないか、選択した項目が無効または存在しません。
filter.csrf.origin=CSRF の送信元検証に使います。リクエストとスキーム、ホスト、実効ポートが一致するサーバーのオリジン（例 https://server.example:8443）を送信します。セッション、招待、訪問者の Cookie を使う場合は、同一オリジンの Origin または Referer が必要です。ブラウザーの送信元も一致する必要がありますが、収集用エンドポイントが許可したスクリプトのオリジンは例外です。これらを使わず Bearer キーだけで呼ぶプログラムは両方とも省略できます。
filter.csrf.explicit=この書き込みには Bearer キーを使用する場合も CSRF 検証用の同一オリジンの Origin または Referer が必要です。Origin にはサーバーのスキーム、ホスト、実効ポートを指定してください（例 https://server.example:8443）。
filter.csrf.referer=Origin がない場合は、同一オリジンのページ URL を Referer に指定できます。Origin がある場合、CSRF 検証ではそちらが優先されます。
filter.csrf.error=サーバーの CSRF フィルターがリクエストを拒否すると、JSON エラーコード {code} が返ります。
description=登録済みの Web 拡張、操作フック、ページの公開先を確認します。
