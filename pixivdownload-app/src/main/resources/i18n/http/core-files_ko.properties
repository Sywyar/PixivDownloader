PathPrefixToolsController.apply.POST.description=`updates`에는 GET으로 조회한 ID를 지정합니다. `registerPaths`의 각 항목에는 기존 디렉터리의 절대 경로를 문자열로 입력하세요. 수정과 등록은 같은 트랜잭션에서 커밋되며, 쓰기에 실패하면 모든 변경이 취소됩니다. 일러스트가 실제로 참조하는 경로가 바뀌면 같은 트랜잭션에서 해당 중복 검사 해시를 지우고 다음 증분 검사에서 다시 계산합니다. 경로가 진행 중인 파일 작업 대상과 겹치면 `conflict`를 반환합니다.
PathPrefixToolsController.apply.POST.response.500=쓰기 실패 시 PATH_PREFIX_WRITE_FAILED를 반환합니다. 모든 변경이 취소되며 applied는 0입니다.
