title=程序密钥
ApiReferenceController.document.GET.summary=读取 HTTP 接口参考文档
ApiReferenceController.document.GET.description=返回当前已加载接口的 OpenAPI 3 文档，随插件装卸与权限声明更新。管理员会话或授予了本权限的程序密钥均可读取；未登录的请求会收到说明所需权限的 401 响应。 服务器按语言缓存生成的目录。路由、相关提供方或实例访问状态变化后重新生成。每次读取都校验权限，响应为 private, no-store。
ApiReferenceController.document.GET.success=OpenAPI 文档。
ApiReferenceController.probe.HEAD.summary=检查接口目录访问权限
ApiReferenceController.probe.HEAD.description=使用与 GET 相同的凭据检查是否可以读取接口目录。只返回响应头。
ApiReferenceController.probe.HEAD.success=可读取接口目录。
ProgramKeysController.list.GET.summary=列出程序密钥
ProgramKeysController.list.GET.description=列出各密钥的 UUID、修订号、完整授权策略、来源网络限制和传输策略。密钥明文仅在创建时返回。
ProgramKeysController.list.GET.success=程序密钥。
ProgramKeysController.desktopList.GET.summary=列出桌面端密钥摘要
ProgramKeysController.desktopList.GET.description=列出桌面密钥摘要，包括 ID、修订号和权限数量。用 ID 查询单个密钥即可读取完整授权。
ProgramKeysController.desktopList.GET.success=桌面端密钥摘要。
ProgramKeysController.desktopKey.GET.summary=查看程序密钥策略
ProgramKeysController.desktopKey.GET.description=按 UUID 读取该密钥的完整权限和来源网络策略。修改或撤销时使用此处的 revision。
ProgramKeysController.desktopKey.GET.success=程序密钥策略。
ProgramKeysController.desktopPermissions.GET.summary=列出权限显示名称
ProgramKeysController.desktopPermissions.GET.description=列出权限 ID、声明方及其本地化名称。创建或编辑密钥时将选定的权限 ID 填入 permissions。
ProgramKeysController.desktopPermissions.GET.success=权限显示名称。
ProgramKeysController.permissions.GET.summary=列出可授予的程序权限
ProgramKeysController.permissions.GET.description=管理员会话可查询可授予的权限 ID、所属方及对应的 HTTP 方法和路径。创建或编辑密钥时，在 permissions 中填写所需 ID。程序密钥无法调用此目录；单个密钥已获授的权限记录在其策略中。
ProgramKeysController.permissions.GET.success=可授予的程序权限。
ProgramKeysController.createFromGui.POST.summary=创建程序密钥
ProgramKeysController.createFromGui.POST.description=创建密钥并一次性返回明文。permissions 取自权限目录。anyIp 为 true 时 networks 必须为空，否则至少填写一个 IP 地址或 CIDR 网段。
ProgramKeysController.createFromGui.POST.success=已创建程序密钥。
ProgramKeysController.create.POST.summary=创建程序密钥
ProgramKeysController.create.POST.description=创建密钥并一次性返回明文。permissions 取自权限目录。anyIp 为 true 时 networks 必须为空，否则至少填写一个 IP 地址或 CIDR 网段。
ProgramKeysController.create.POST.success=已创建程序密钥。
ProgramKeysController.update.PUT.summary=更新密钥权限与来源限制
ProgramKeysController.update.PUT.description=用当前 revision 替换完整策略。修改会将公网传输恢复为 HTTPS_REQUIRED。出现版本冲突时重新读取密钥。
ProgramKeysController.update.PUT.success=已更新密钥权限与来源限制。
ProgramKeysController.revoke.DELETE.summary=撤销程序密钥
ProgramKeysController.revoke.DELETE.description=提交当前密钥修订号。撤销成功后，该密钥无法再用于认证。
ProgramKeysController.revoke.DELETE.success=已撤销程序密钥。
ProgramKeysController.changeTransport.POST.summary=设置密钥传输策略
ProgramKeysController.changeTransport.POST.description=允许公网 HTTP 需先用当前 revision 提交 REVIEWED，再用更新后的 revision 提交 HTTP_ALLOWED。提交 HTTPS_REQUIRED 可撤销此例外。
ProgramKeysController.changeTransport.POST.success=已保存密钥传输策略。
ProgramKeysController.transportFromGui.POST.summary=设置密钥传输策略
ProgramKeysController.transportFromGui.POST.description=允许公网 HTTP 需先用当前 revision 提交 REVIEWED，再用更新后的 revision 提交 HTTP_ALLOWED。提交 HTTPS_REQUIRED 可撤销此例外。
