ProgramKeysController.updateFromGui.POST.description=用当前 revision 替换完整策略。修改会将公网传输恢复为 HTTPS_REQUIRED。出现版本冲突时重新读取密钥。
ProgramKeysController.updateFromGui.POST.success=已更新密钥权限与来源限制。
ProgramKeysController.revokeFromGui.POST.summary=撤销程序密钥
ProgramKeysController.revokeFromGui.POST.description=提交当前密钥修订号。撤销成功后，该密钥无法再用于认证。
ProgramKeysController.revokeFromGui.POST.success=已撤销程序密钥。
ProgramKeysController.create.POST.response.201=已创建密钥，请从本次响应中复制密钥原文。
ProgramKeysController.revoke.DELETE.response.204=已撤销密钥。
