schema.top.sywyar.pixivdownload.plugin.web.page.DeclaredHttpHookBindings.View.field.endpoint=唯一符合的端點 ID，無法唯一符合時為空。
schema.top.sywyar.pixivdownload.plugin.web.page.DeclaredHttpHookBindings.View.field.status=宣告符合及核准狀態，例如 ACTIVE、PENDING_APPROVAL 或 CHANGED。
schema.top.sywyar.pixivdownload.plugin.web.page.DeclaredHttpHookBindings.View.field.approved=是否有已儲存的核准。另查看 status 確認目前繫結是否活動。
