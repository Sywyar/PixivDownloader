schema.top.sywyar.pixivdownload.plugin.security.HttpHookDeclarations.Target.field.params=符合目標的查詢參數條件。空陣列不限制，非空時須整體相符。
schema.top.sywyar.pixivdownload.plugin.security.HttpHookDeclarations.Target.field.headers=符合目標的請求標頭條件。空陣列不限制，非空時須整體相符。
