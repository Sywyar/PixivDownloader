schema.top.sywyar.pixivdownload.plugin.web.page.DeclaredHttpHookBindings.View.field.fingerprint=當前宣告的指紋。宣告或目標變化後須重新讀取。
schema.top.sywyar.pixivdownload.plugin.web.page.DeclaredHttpHookBindings.Selection.field.remove=true 表示準備解除繫結，false 表示準備用此宣告繫結目標。
