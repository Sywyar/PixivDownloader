filter.prepare.summary=準備目標 HTTP 操作的鉤子
filter.prepare.description=以目標操作的身份和許可權檢查同一服務上的請求，不執行目標操作。只需解析端點時設 resolveOnly=true。收到 HOOK_CHALLENGE 後，保留使用者 Cookie，將同一請求連同 token 和以鉤子 ID 為鍵的 proofs 再次提交。收到 HOOK_READY 後，用 X-Pixiv-Hook-Ticket 將令牌交給實際目標請求；原生表單可用 nativeSubmit 的 Cookie。
filter.HookPreparation=描述待匹配的目標請求，以及本次要提交的挑戰證明。
filter.HookPreparation.method=目標路由實際使用的大寫 HTTP 方法。
filter.HookPreparation.url=以 / 起始的同服目標路徑，可含查詢串。禁止主機名、片段和準備介面本身。
filter.HookPreparation.headers=目標路由匹配所用請求頭，最多 16 項，每值最多 1024 字元且不能含控制字元。頭名不分大小寫，僅接受 Accept、Content-Type 或 X- 開頭的名稱（最多 96 個字母、數字或連字元）。X-Forwarded-、X-Pixiv-、X-Real- 字首及含 token、key、auth、cookie 的名稱不可用。
filter.HookPreparation.json=以操作繫結宣告的 JSON Pointer 為鍵傳遞原始欄位值，最多 256 項，每鍵最多 256 字元。
filter.HookPreparation.parameters=表單欄位名對映到非空字串陣列。目標 Content-Type 須為 application/x-www-form-urlencoded 或 multipart/form-data。查詢串和表單合計最多 128 個值。
filter.HookPreparation.token=響應中的挑戰令牌。首次準備時省略，提交證明時與原目標一同傳送。
filter.HookPreparation.proofs=以 challenges 返回的鉤子 ID 為鍵提交提供方要求的證明字串，須攜帶 token。最多 16 項，每值最多 16384 字元，合計最多 64 KiB UTF-8。
filter.HookPreparation.nativeSubmit=設為 true，在成功暫存證明後透過 Cookie 為同一目標的原生表單提交簽發一次性票據。
filter.HookPreparation.resolveOnly=僅匹配目標端點，返回 HOOK_RESOLVED 和 endpoint。
filter.HookTargetMatch=僅解析目標時返回的匹配結果。
filter.HookPreparationResult=鉤子批准、挑戰、證明暫存或拒絕的結果。
filter.HookTargetMatch.code=目標匹配成功時為 HOOK_RESOLVED。
filter.HookTargetMatch.endpoint=已匹配的目標 HTTP 端點 ID。
filter.HookTargetMatch.invoked=準備請求返回 false，業務操作尚未執行。
filter.HookPreparationResult.invoked=準備請求返回 false，業務操作尚未執行。
filter.HookPreparationResult.code=機器可讀的 HOOK_ 結果碼。客戶端據此區分已批准、需要挑戰、已就緒及失敗。
filter.HookPreparationResult.error=失敗時的本地化說明，成功時為空字串。
filter.HookPreparationResult.token=發生挑戰時簽發、證明就緒時返回的令牌。其餘情形可為空。
filter.HookPreparationResult.revision=用於處理本次準備請求的釋出修訂標識，無法取得時為空。
filter.HookPreparationResult.challenges=以鉤子 ID 為鍵的挑戰字串。使用相同的鍵提交對應證明。
filter.prepare.200=已匹配目標（HOOK_RESOLVED）、準備透過（HOOK_APPROVED）或證明已暫存（HOOK_READY）。
filter.prepare.400=不能用所給方法、路徑、頭及欄位匹配有效目標請求。
filter.prepare.401=目標操作需要有效的登入會話或其支援的程式金鑰。
filter.prepare.403=準備請求本身未通過 CSRF 來源驗證時會回傳 FORBIDDEN。目標授權或操作掛鉤驗證也可能拒絕請求。
filter.prepare.409=HOOK_CHALLENGE 表示須提交證明。HOOK_STALE 或 HOOK_TARGET_STALE 表示目標或令牌已變化，需重新準備。
filter.prepare.413=準備請求超過 512 KiB。
filter.prepare.429=準備請求過於頻繁，或併發準備數達到上限。
filter.prepare.503=鉤子提供方或目標操作當前不可用。
filter.X-Acquisition-Credentials=用逗號依優先順序列出 1 至 8 個憑據庫 ID，不可重複。需管理員身份或 core:credentials.use。每個 ID 必須已啟用。此頭與 X-Acquisition-Credential 互斥。
filter.X-Pixiv-Page-Publication=由頁面發起請求時，可附上該頁面的釋出令牌校驗目標路由歸屬。釋出過期或目標不匹配返回 409。
filter.pagePublication=頁面請求無法設定 X-Pixiv-Page-Publication 時使用的查詢引數。頭和引數同時存在時使用頭。
filter.X-Pixiv-Ui-Publication=已釋出 UI 插槽發起請求時，傳送插槽提供的 publication 令牌。插槽版本已撤回時返回 409。
filter.uiPublication=插槽載入所屬外掛資源時可傳的釋出令牌查詢引數。服務會核對資源歸屬；X-Pixiv-Ui-Publication 頭優先。
filter.X-Pixiv-Hook-Ticket=請求目標曾返回 HOOK_CHALLENGE 時，向同一目標提交 HOOK_READY 返回的一次性令牌。保留準備請求的使用者 Cookie。
schema.top.sywyar.pixivdownload.plugin.web.controller.OperationHooksController.Failure.field.code=鉤子配置失敗的機器可讀原因碼。
filter.X-Pixiv-Hook=鉤子處理器發出的結果標識，如 READY 或 CHALLENGE。僅端點解析成功的響應不攜帶此頭。
filter.prepare.access=準備請求遵循目標介面的准入條件。目標允許匿名時可匿名準備；其他情況下沿用外層請求中該目標支援的會話、GUI 憑據或程式金鑰。瀏覽器需滿足同源寫入條件。
parameter.page=已發佈網頁的識別碼，對應頁面發佈目錄中的頁面鍵。
filter.credentials.400=X-Acquisition-Credentials 格式無效、重複傳送或與原始憑據頭同時使用。
filter.credentials.403=呼叫方無權使用 X-Acquisition-Credentials 選擇憑據庫條目。
filter.credentials.503=無法讀取憑據庫，或選定的憑據已停用或不存在。
filter.csrf.origin=CSRF 來源驗證。請傳送服務的來源，例如 https://server.example:8443，通訊協定、主機與有效連接埠須與請求一致。使用工作階段、邀請或訪客 Cookie 時，須提供同源的 Origin 或 Referer。瀏覽器來源也須一致，採集介面為受信任指令碼允許的來源除外。僅使用 Bearer 金鑰且沒有這些 Cookie 或瀏覽器來源標頭的程式用戶端可省略兩者。
filter.csrf.explicit=此寫入操作一律驗證 CSRF 來源，使用 Bearer 金鑰的程式也須傳送同源的 Origin 或 Referer。Origin 值為服務的通訊協定、主機與有效連接埠，例如 https://server.example:8443。
filter.csrf.referer=沒有 Origin 時，可用 Referer 傳送同源頁面的 URL。若已傳送 Origin，CSRF 驗證會優先使用它。
filter.csrf.error=伺服器的 CSRF 篩選器拒絕請求時，JSON 錯誤碼為 {code}。
description=檢視已註冊的網頁擴充、操作掛鉤及頁面發布目標。
