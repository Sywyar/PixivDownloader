title=用户脚本
ScriptController.listScripts.GET.summary=列出可用用户脚本
ScriptController.listScripts.GET.description=列出已发布脚本的 id、本地化名称、说明和版本。使用 id 构造安装或源码地址。
ScriptController.listScripts.GET.success=可用用户脚本。
ScriptController.installScript.GET.summary=下载可安装的用户脚本
ScriptController.installScript.GET.description=返回可安装的用户脚本。在 .user.js 或 /install 路径上加 raw=true 可按纯文本查看。
ScriptController.installScript.GET.success=可安装的用户脚本。
ScriptController.viewScriptSource.GET.summary=查看用户脚本源码
ScriptController.viewScriptSource.GET.description=读取源码时必须传 raw=true。直接访问 /api/scripts/{id} 而未请求原文会得到 404。
ScriptController.viewScriptSource.GET.success=用户脚本源码。
parameter.raw=请求用户脚本原文。
parameter.id=用户脚本目录中的标识。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.description=当前实例提供的用户脚本列表。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.field.scripts=当前可安装的脚本及各自的标识、名称、说明和版本。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.field.detectedHost=从请求读取的服务器主机名，用于生成脚本连接目标。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.ScriptItem.field.id=用于安装或查看源码路径的脚本 ID。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.ScriptItem.field.displayName=当前语言的脚本名称。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.ScriptItem.field.description=当前语言的脚本用途说明。
schema.top.sywyar.pixivdownload.scripts.ScriptListResponse.ScriptItem.field.version=可安装脚本声明的版本。
description=获取实例提供的用户脚本及安装信息。
