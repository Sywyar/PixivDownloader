UpdateApiController.install.POST.summary=安裝已下載的更新包
UpdateApiController.install.POST.description=提交進度回執中的 64 位十六進位制 SHA-256，在 Windows x64 上啟動對應的安裝程式並退出應用。平臺不支援或回執過期時返回 409。
UpdateApiController.install.POST.success=已下載的更新包。
parameter.channel=安裝包渠道。省略時使用 official。只接受小寫 official、nightly，其他值回傳 400。
parameter.force=即使已有結果，也強制重新執行。
