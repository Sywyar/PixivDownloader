title=プラグイン管理
GuiPluginController.status.GET.summary=デスクトップのプラグイン稼働状況を取得
GuiPluginController.status.GET.description=コントロールセンター用に、実行中の環境の状態を取得します。
GuiPluginController.status.GET.success=デスクトップのプラグイン稼働状況。
PluginManagementController.status.GET.summary=プラグインの稼働状況を取得
PluginManagementController.status.GET.description=各プラグインの稼働段階、実行可能な操作、復旧モードの状態を返します。
PluginManagementController.status.GET.success=プラグインの稼働状況。
PluginManagementController.refreshRevocations.POST.summary=リポジトリの失効リストを更新
PluginManagementController.refreshRevocations.POST.description=指定リポジトリの失効情報を再取得します。
PluginManagementController.refreshRevocations.POST.success=リポジトリの失効リストを更新しました。
PluginManagementController.impact.GET.summary=プラグイン変更の影響をプレビュー
PluginManagementController.impact.GET.description=変更の影響を受けるプラグインを確認します。確定時にはこの結果のフィンガープリントを指定します。
PluginManagementController.impact.GET.success=プラグイン変更の影響。
PluginManagementController.performPreviewed.POST.summary=影響を確認済みのプラグイン操作を実行
PluginManagementController.performPreviewed.POST.description=影響確認で取得したフィンガープリントを指定します。依存関係が変わった場合は再度プレビューしてください。
PluginManagementController.performPreviewed.POST.success=影響を確認済みのプラグイン操作。
PluginManagementController.enabledPreviewed.PUT.summary=影響を確認済みのプラグイン有効化設定を保存
PluginManagementController.enabledPreviewed.PUT.description=impact の fingerprint と真偽値 enabled で依存関係への変更を確定します。期限切れ時は impact を再取得してください。
PluginManagementController.enabledPreviewed.PUT.success=影響を確認済みのプラグイン有効化設定を保存しました。
PluginManagementController.load.POST.summary=インストール済みプラグインをロード
PluginManagementController.load.POST.description=アンロード済み外部プラグインを再登録します。GET /api/plugins/status で load が利用可能か確認してください。
PluginManagementController.load.POST.success=インストール済みプラグイン。
PluginManagementController.start.POST.summary=プラグインを起動
PluginManagementController.start.POST.description=ロード済みまたは停止中の外部プラグインのサービスを開始します。実行可能かは status の操作一覧で確認します。
PluginManagementController.start.POST.success=プラグイン。
PluginManagementController.quiesce.POST.summary=プラグインの実行中の処理の終了を待つ
PluginManagementController.quiesce.POST.description=このプラグインへの新規要求とスケジュール配信を停止し、処理中の作業を終了させます。
PluginManagementController.quiesce.POST.success=プラグインの実行中の処理。
PluginManagementController.stop.POST.summary=プラグインを停止
PluginManagementController.stop.POST.description=プラグインサービスを停止して実行時の登録を取り下げます。再開は start で行います。
PluginManagementController.stop.POST.success=プラグインを停止しました。
PluginManagementController.unload.POST.summary=プラグインをアンロード
PluginManagementController.unload.POST.description=プラグインを停止して登録を解除します。インストール済みパッケージはディスクに残り、後から load できます。
PluginManagementController.unload.POST.success=プラグイン。
PluginManagementController.remove.POST.summary=アンロード済みのプラグインパッケージを削除
PluginManagementController.remove.POST.description=プラグインをアンロードし、ディスク上のインストール済みパッケージを削除します。事前に impact で依存先への影響を確認できます。
PluginManagementController.remove.POST.success=アンロード済みのプラグインパッケージを削除しました。
PluginManagementController.restart.POST.summary=プラグインを再起動
PluginManagementController.restart.POST.description=現在の generation とクラスローダーを維持してサービスを再起動します。
PluginManagementController.restart.POST.success=プラグイン。
PluginManagementController.reload.POST.summary=プラグインを再読み込み
PluginManagementController.reload.POST.description=外部プラグインを新しい generation とクラスローダーで再ロードします。その後 publication や generation を含む識別子を再取得してください。
PluginManagementController.reload.POST.success=プラグイン。
PluginManagementController.updateEnabled.PUT.summary=プラグインの有効化設定を変更
PluginManagementController.updateEnabled.PUT.description=任意の外部プラグインを有効にするか保存します。反映時期はプラグインのライフサイクル方針によります。
PluginManagementController.updateEnabled.PUT.success=プラグインの有効化設定を保存しました。
PluginManagementController.approveTrust.PUT.summary=プラグインパッケージの実行を承認
PluginManagementController.approveTrust.PUT.description=指定した SHA-256 に一致するインストール済みパッケージの実行を承認します。別のパッケージには再承認が必要です。
PluginManagementController.approveTrust.PUT.success=プラグインパッケージの実行を承認しました。
PluginManagementController.revokeTrust.DELETE.summary=プラグイン実行の信頼設定を取り消す
PluginManagementController.revokeTrust.DELETE.description=保存した実行許可を解除します。実行中のインスタンスは継続し、次のロード時に信頼状態が確認されます。
PluginManagementController.revokeTrust.DELETE.success=プラグイン実行の信頼設定を取り消しました。
PluginManagementController.restartBackend.POST.summary=デスクトップのバックエンドを再起動
PluginManagementController.restartBackend.POST.description=デスクトップの管理機能に、稼働中のバックエンドの再起動を要求します。
PluginManagementController.restartBackend.POST.success=デスクトップのバックエンド。
PluginManagementController.install.POST.summary=ローカルのプラグインパッケージをインストール
PluginManagementController.install.POST.description=プラグインパッケージを multipart ファイルとして送信します。結果にはインストール結果または拒否理由が含まれます。
PluginManagementController.install.POST.success=ローカルのプラグインパッケージ。
PluginManagementController.install.POST.body.field.file=インストールするプラグインパッケージ。空でないファイルを添付します。
PluginManagementController.install.POST.body.field.signature=発行元の継続性を確認するための任意の分離 JSON 署名。
parameter.id=プラグイン状態に表示されるインストール済みプラグインの ID。
parameter.confirmArtifactSha256=承認するインストール済みパッケージの SHA-256。
PluginManagementController.updateEnabled.PUT.body=このプラグインを有効にするか指定します。
PluginManagementController.updateEnabled.PUT.response.200=プラグインの有効化設定を保存しました。
PluginManagementController.updateEnabled.PUT.response.400=本文に真偽値の enabled が必要です。
PluginManagementController.updateEnabled.PUT.response.404=プラグインが見つからないか、記述子が利用できません。
PluginManagementController.updateEnabled.PUT.response.409=組み込みおよび必須プラグインの有効化設定は変更できません。
PluginManagementController.updateEnabled.PUT.response.500=設定ファイルにプラグインの設定を書き込めませんでした。
