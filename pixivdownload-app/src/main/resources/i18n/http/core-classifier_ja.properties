title=画像の振り分け
ImageClassifierController.settings.GET.summary=画像振り分け設定を取得
ImageClassifierController.settings.GET.description=既定フォルダー、スキップボタン設定、分類先を取得します。serverUrl に認証情報、クエリ、フラグメントは含まれません。
ImageClassifierController.settings.GET.success=画像振り分け設定。
ImageClassifierController.settings.PUT.summary=画像振り分け設定を保存
ImageClassifierController.settings.PUT.description=分類設定を置き換えます。分類先は最大 20 件、パスと備考は各 4096 文字までです。serverUrl は空またはユーザー情報、クエリ、フラグメントを含まない HTTP(S) URL にします。
ImageClassifierController.settings.PUT.success=画像振り分け設定を保存しました。
ImageClassifierController.folders.GET.summary=サブフォルダーをページ単位で取得
ImageClassifierController.folders.GET.description=path 配下の子フォルダーを一覧表示し、このページと総数を返します。offset は 0 から、limit は 1～1000 です。
ImageClassifierController.folders.GET.success=サブフォルダー。
ImageClassifierController.images.GET.summary=フォルダー内の画像をページ単位で取得
ImageClassifierController.images.GET.description=path 配下の対応画像のパスをページと総数で返します。offset は 0 から、limit は 1～1000 です。
ImageClassifierController.images.GET.success=フォルダー内の画像。
ImageClassifierController.image.GET.summary=画像プレビューを取得
ImageClassifierController.image.GET.description=images のファイルパスを指定し、元のバイト列を application/octet-stream の添付ファイルとして取得します。
ImageClassifierController.image.GET.success=画像プレビュー。
ImageClassifierController.deleteEmpty.DELETE.summary=空のフォルダーを削除
ImageClassifierController.deleteEmpty.DELETE.description=この操作で削除できるのは空のフォルダーだけです。
ImageClassifierController.deleteEmpty.DELETE.success=空のフォルダーを削除しました。
ImageClassifierController.move.POST.summary=振り分けた作品を移動
ImageClassifierController.move.POST.description=作品画像を移動して新しい場所を登録します。source と target は異なるディレクトリで、互いに内包できません。sourceRemoved、recorded、issues で結果を確認します。
ImageClassifierController.move.POST.success=振り分けた作品。
