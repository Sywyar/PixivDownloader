title=ゲスト招待
AdminInviteController.accessCheck.GET.summary=招待の管理権限を確認
AdminInviteController.accessCheck.GET.description=現在のセッションでゲスト招待を管理できるかを確認します。
AdminInviteController.accessCheck.GET.success=招待の管理権限。
AdminInviteController.create.POST.summary=ゲスト招待を作成
AdminInviteController.create.POST.description=招待を作成し、id、引換用 code、共有用 url を返します。管理操作には id を使います。
AdminInviteController.create.POST.success=ゲスト招待を作成しました。
AdminInviteController.list.GET.summary=ゲスト招待の一覧
AdminInviteController.list.GET.description=招待の概要一覧を返します。個別の設定と詳細は id で取得します。
AdminInviteController.list.GET.success=ゲスト招待。
AdminInviteController.detail.GET.summary=招待の詳細を取得
AdminInviteController.detail.GET.description=管理用 ID で招待の詳細を取得します。引き換え時には code を使います。
AdminInviteController.detail.GET.success=招待の詳細。
AdminInviteController.update.PUT.summary=ゲスト招待を更新
AdminInviteController.update.PUT.description=パスの ID が示す招待設定を更新し、変更後の詳細を返します。招待の再作成は不要です。
AdminInviteController.update.PUT.success=ゲスト招待を更新しました。
AdminInviteController.pause.POST.summary=ゲスト招待を一時停止
AdminInviteController.pause.POST.description=指定した招待を一時停止します。同じ ID の resume で再開できます。
AdminInviteController.pause.POST.success=ゲスト招待を一時停止しました。
AdminInviteController.resume.POST.summary=ゲスト招待を再開
AdminInviteController.resume.POST.description=既存のコードと設定で一時停止中の招待を再開します。
AdminInviteController.resume.POST.success=ゲスト招待を再開しました。
AdminInviteController.deleteExpired.DELETE.summary=期限切れの招待をクリア
AdminInviteController.deleteExpired.DELETE.description=要求時点で期限切れの招待を削除し、削除件数を返します。
AdminInviteController.deleteExpired.DELETE.success=期限切れの招待を消去しました。
AdminInviteController.delete.DELETE.summary=ゲスト招待を削除
AdminInviteController.delete.DELETE.description=パスの ID で指定した招待をゲスト招待一覧から削除します。
AdminInviteController.delete.DELETE.success=ゲスト招待を削除しました。
AdminInviteController.stats.GET.summary=招待の利用統計を取得
AdminInviteController.stats.GET.description=時間ごとのアクセス数を返します。days は 1、7、30 で、その他の値は 7 日間として扱います。
AdminInviteController.stats.GET.success=招待の利用統計。
InviteRedeemController.redeem.POST.summary=ゲスト招待コードを引き換える
InviteRedeemController.redeem.POST.description=code を送信します。成功時にゲスト用 Cookie と移動先ページが返ります。以降はその Cookie を送ります。無効な code は 401 です。
InviteRedeemController.redeem.POST.success=ゲスト招待コード。
parameter.days=統計の対象日数。
