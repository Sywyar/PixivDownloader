schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.revision=同じ epoch の全タスクがカウンターを共有します。この値は当該タスクが最後に変化した時点の値です。アーカイブでは 0 を返します。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.failureReason=UPSTREAM_RATE_LIMITED は送信時に取得元が要求を制限したことを示します。 実行側の失敗理由コード。特定の理由がなければ空。 取得元、ページ数、保存先、出力設定が変わると OUTPUT_LAYOUT_CONFLICT が返ります。pages を省略して作品全体を再取得してください。OUTPUT_ALREADY_REGISTERED は作品全体が登録済みであることを示します。 `WORK_NOT_FOUND` は、受付時に現在のアカウントでは取得元で作品が見つからなかったことを示します。 送信が拒否された場合、phase が FAILED でもこの値は null になり得ます。 `OUTPUT_FILE_CONFLICT` は、出力先に未登録の同名ファイルがある、作成・置換・削除するパスを別の作品が参照しているか別の処理が使用中である、または検証後に対象が変わったことを示します。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.outputPath=今回の実行で使うサーバー上の出力ディレクトリの絶対パス。イラストと小説ではキュー登録前に決まります。待機中はファイルがまだ存在しない場合があります。準備中、提供元がディレクトリを報告しない場合、または記録のない過去の受付結果では null です。作品を移動しても実行時のパスを保持します。
parameter.X-Acquisition-Credential=選択したダウンロード処理に渡す一時的な取得用認証情報。任意、最大 16384 文字。
DownloadTasksController.submit.POST.response.400=コマンドを解析できない、必須フィールドがない、オプションが共通制限を超える、または一時取得用認証情報が長すぎます。 未公開の workType は DOWNLOAD_TASK_UNSUPPORTED_WORK_TYPE となり、タスクは作成されません。x-download-submissions からタイプを選んでください。queueType はキューの識別子です。 対象項目を特定できる場合、field はリクエスト本文内の JSON Pointer、reason は言語に依存しない理由コードです。 未対応の作品種別では field=/workType、reason=unsupported を返します。
DownloadTasksController.submit.POST.response.409=同じ requestId で別の内容を送信するなど、送信が競合しました。
DownloadTasksController.submit.POST.response.413=リクエストボディが 128 KiB を超えています。
DownloadTasksController.submit.POST.response.404=WORK_NOT_FOUND — 現在のアカウントでメタデータを取得したところ、取得元で作品が見つかりませんでした。作品 ID と公開範囲を確認してください。 登録された試行はタスク一覧と履歴に FAILED として残ります。 最初のエラー応答には attemptId も Location もありません。タスク終了から 5 分を過ぎ、結果の保存が完了すると、冪等性の記録は失効し得ます。同じプロセスに記録が残っている間、同じ呼び出し元が同じ requestId で元のコマンドを再送すると、元のタスクの 202 応答（duplicate=true）を返します。失効後の再送は新しい試行になります。
DownloadTasksController.submit.POST.response.422=プロバイダーまたは受付ポリシーが実行を拒否しました。選んだ種類の許容範囲外のオプションなどが該当します。 登録された試行はタスク一覧と履歴に FAILED として残ります。 最初のエラー応答には attemptId も Location もありません。タスク終了から 5 分を過ぎ、結果の保存が完了すると、冪等性の記録は失効し得ます。同じプロセスに記録が残っている間、同じ呼び出し元が同じ requestId で元のコマンドを再送すると、元のタスクの 202 応答（duplicate=true）を返します。失効後の再送は新しい試行になります。 対象項目を特定できる場合、field はリクエスト本文内の JSON Pointer、reason は言語に依存しない理由コードです。 組み込みプロバイダーのフィールド理由には unknown_property, duplicate, invalid_format, invalid_value, not_applicable, out_of_range, too_large があります。拡張により他の理由も返ります。
DownloadTasksController.submit.POST.response.429=DOWNLOAD_TASK_UPSTREAM_RATE_LIMITED — キュー登録前に取得元が要求を制限しました。待機時間が分かる場合は Retry-After が秒数を示します。試行は FAILED、failureReason は UPSTREAM_RATE_LIMITED になります。待機後、新たに試行するには別の requestId を使用してください。冪等性レコードの保持中に同じ requestId を使うと元の受領情報が返ります。
DownloadTasksController.submit.POST.response.503=処理またはキューを利用できないか、タスク数が上限に達しています。 登録前の失敗ではタスクは作成されません。登録後の失敗は FAILED として残ることがあります。冪等性の記録が残る間に同じコマンドを再送すると受付情報を取得できます。
DownloadQueueController.cancelDownload.POST.response.409=ハンドラーの識別情報が古いか、取り消しに対応していません。キューの最新の識別情報と機能を取得してください。
DownloadTasksController.cancel.POST.response.409=タスクは存在しますが、現在の実行は取り消せません。
DownloadTasksController.find.GET.response.404=呼び出し元が参照できる範囲にこの taskId のタスクはありません。
DownloadTasksController.cancel.POST.response.404=呼び出し元が参照できる範囲にこの taskId のタスクはありません。
DownloadTasksController.submit.POST.details=**送信。** 管理者はタスクを送信できます。プログラムキーには `core:downloads.create` と、選んだ種類の `x-program-permission` が必要です。JSON オブジェクトを送り、`options` のキーと値を文字列にします。オプションがなければ `{}` を指定します。本文の上限は 128 KiB、オプションは最大 32 件で、キーと値の合計は UTF-8 で 16 KiB までです。取得用認証情報は `X-Acquisition-Credential`、保存済み認証情報の参照は `X-Acquisition-Credentials` に指定します。併用はできません。プログラムキーで後者を使うには `core:credentials.use` も必要です。 単一の JSON オブジェクトを送ってください。キーの重複、末尾の余分な内容、4 階層を超えるネストは拒否されます。プロバイダーの入力検証に失敗すると 422 `DOWNLOAD_TASK_REJECTED` になります。有効な受付ポリシーは実行を拒否でき、オプション拡張はファイル名テンプレートや出力形式を変更できます。\n\n\
    **再試行。** 同じプロセスの保持期間中、呼び出し元、`requestId`、作品種別、作品 ID、オプション、解決後の主認証情報が同じであれば、元のタスクと `duplicate=true` が返ります。内容を変えて同じ ID を使うと 409 になります。照会には `task.attempt.attemptId` を使い、ページ変更、再構築、失敗後の再実行には新しい `requestId` を使います。終了結果が保存されると、終了から 5 分後に冪等性の記録が削除される場合があります。再起動後も保存済み結果は参照できますが、タスクは再実行されません。\n\n\
    **受付と完了。** プロバイダーは応答前に作品を取得し検証することがあります。不正なリクエストは 400、本文の上限超過は 413 です。プロバイダーや受付ポリシーが拒否すると 422、プロバイダー、データベースまたはタスク枠が利用できないと 503 になる場合があります。202 を受け取ったら `core:downloads.read` で `Location` を照会し、`phase` と `failureReason` を確認します。すでに終了している場合もあります。`CREDENTIALS_UNAVAILABLE` は実行中に取得用認証情報が利用できなくなったことを示します。`core:downloads.cancel` で `POST /api/download/tasks/{taskId}/cancel` を呼んだ後も終了状態を確認してください。プログラムキーは自身が参照できるタスクのみ照会・キャンセルできます。 イラストと小説ではキューに入る前にサーバー上の絶対出力先 `task.outputPath` が決まります。待機中はまだディレクトリがない場合があります。キュー割り当て前に拒否されると `queueType` は空文字列、`task.outputPath` は null です。422 または 404 `WORK_NOT_FOUND` の応答にはタスク ID が含まれませんが、失敗した試行はタスク一覧と履歴に残ります。保持期間内に同じコマンドを再送すると元のタスクの 202 応答を取得できます。作品が見つからない場合の `failureReason` は `WORK_NOT_FOUND` です。
description=ダウンロードを送信し、各試行の状態と終了したタスクの履歴を確認します。
DownloadTasksController.history.GET.parameter.limit=取得件数は 1～200 件。範囲外は 400 を返します。
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.progress=この試行で最後に計測した進捗。提供元が報告していない場合や古い履歴では null です。ステップが総量に達しても成功は phase で確認してください。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.description=提供元が計測したステップ単位の進捗。ステップが変わると単位と総量も変わることがあります。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.unit=PAGES は作品のページ、IMAGES は画像、BYTES はバイト数です。小説では処理した挿絵と表紙の転送量を示します。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.completed=このステップで処理した量。0 から total までの値です。
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.total=同じ単位で表したステップの総量。0 より大きい値です。
