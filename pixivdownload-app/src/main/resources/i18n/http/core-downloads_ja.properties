DownloadQueueController.rejectLegacyCancel.POST.description=この旧 URL は常に 409 を返します。タスク UUID がある場合は POST /api/download/tasks/{taskId}/cancel を使用します。提供元から項目キーと公開時の識別情報を受け取った場合のみ POST /api/download/queue/{queueType}/cancel を使用してください。
DownloadQueueController.rejectLegacyCancel.POST.success=キューを指定しない旧式のキャンセル要求。
DownloadQueueController.cancelDownload.POST.summary=指定キューのダウンロードをキャンセル
DownloadQueueController.cancelDownload.POST.description=キュー提供元から workKey を取得している場合は、その値をそのまま渡し、GET /api/download/extensions で取得した同じ公開時の識別情報を owner に指定します。プログラムからは GET /api/download/tasks に表示されるタスクの attempt.attemptId を taskId として POST /api/download/tasks/{taskId}/cancel を呼び出すこともできます。
DownloadQueueController.cancelDownload.POST.success=指定キューのダウンロード。
DownloadQueueController.clearDownloadQueue.POST.summary=ダウンロードキューをクリア
