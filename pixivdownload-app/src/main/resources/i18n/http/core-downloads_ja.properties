DownloadQueueController.clearDownloadQueue.POST.success=ダウンロードキューを消去しました。
DownloadTasksController.submit.POST.summary=ダウンロードタスクを開始
DownloadTasksController.submit.POST.description=リクエスト形式から有効な workType を選び、例に従い workId と options を入力します。文書の x-download-submissions にも提供元ごとのプログラム権限とスキーマがあります。同じコマンドの再試行では requestId を再利用し、内容の異なる要求で同じ ID を使うと競合します。202 は照会に使うタスク ID を返します。 202 応答の Location で進捗を確認できます。パスの taskId は応答の task.attempt.attemptId です。 同じ呼び出し元が同じ `requestId` と同じ内容で再送すると、プロセス内に重複判定用の記録がある間は元の受付結果が返ります。終了結果が保存されると、その記録はタスクの終了から 5 分後に失効する場合があります。それ以降の再送で新しいタスクが作成されることがあります。
DownloadTasksController.submit.POST.success=登録済みタスクの再送も 202 を返します。task.attempt.attemptId で同じ試行を照会できます。キュー登録前に失敗した場合、task.outputPath は null になり得ます。
DownloadTasksController.snapshot.GET.summary=現在のダウンロードタスクの一覧
DownloadTasksController.snapshot.GET.description=呼び出し元に表示できるタスク、プロセスの epoch、revision を返します。再起動すると epoch が変わります。 再起動後も GET /api/download/tasks/history で保存済みの終了タスクをページ単位で取得できます。
DownloadTasksController.snapshot.GET.success=現在のダウンロードタスク。
DownloadTasksController.find.GET.summary=ダウンロードタスクの詳細を取得
DownloadTasksController.find.GET.response.503=タスクの記録を読み取れない場合は DOWNLOAD_TASK_RECEIPT_UNAVAILABLE を返します。
DownloadTasksController.find.GET.description=outputPath は今回の実行の出力ディレクトリを示します。 受付結果のタスク UUID で実行状態を取得します。呼び出し元が参照できないタスクは 404 です。 イラスト全体の取得後は attempt.workId で GET /api/library/artworks/{artworkId}（core:library.read）を呼び出します。移動済みの作品は moveFolder、それ以外は folder を参照します。ページのファイルは GET /api/downloaded/rawfile/{artworkId}/{page}（core:assets.export、0 始まり）で取得できます。 一部のページだけを保存した場合は GET /api/library/artworks/{artworkId}/partial で保存済みのページとディレクトリを確認できます。 最初は 2 秒間隔で問い合わせます。`revision` が変わらない間は間隔を徐々に 10 秒まで延ばし、更新されたら 2 秒に戻します。`phase` が `COMPLETED`、`FAILED`、`CANCELLED` のいずれかになったら終了します。`Retry-After` が返った場合は、指定された時間を空けてください。
DownloadTasksController.find.GET.success=ダウンロードタスクの詳細。
DownloadTasksController.history.GET.summary=保存済みのタスク履歴の一覧
DownloadTasksController.history.GET.response.503=タスクの記録を読み取れない場合は DOWNLOAD_TASK_RECEIPT_UNAVAILABLE を返します。
DownloadTasksController.history.GET.description=limit は 1～200、既定値は 50 です。初回はカーソルを省略し、次のページには応答の beforeTime と beforeId を組で渡します。 再起動後も GET /api/download/tasks/history で保存済みの終了タスクをページ単位で取得できます。
DownloadTasksController.history.GET.success=保存済みのタスク履歴。
DownloadTasksController.cancel.POST.summary=ダウンロードタスクをキャンセル
DownloadTasksController.cancel.POST.response.503=タスクの記録を読み取れない場合は DOWNLOAD_TASK_RECEIPT_UNAVAILABLE を返します。
DownloadTasksController.cancel.POST.description=タスク UUID で取消を要求します。REQUESTED は要求受付、TERMINAL は終了済み、409 は取消不可です。GET /api/download/tasks の attempt.attemptId を taskId として指定します。提供元から workKey と公開時の識別情報を受け取った場合は POST /api/download/queue/{queueType}/cancel を使用します。
DownloadTasksController.cancel.POST.success=ダウンロードタスク。
DownloadQueueController.rejectLegacyCancel.POST.response.409=対象キューを指定するキャンセル用エンドポイントを使用してください。
parameter.taskId=送信結果の task.attempt.attemptId を指定します。タスク URL は Location にあります。
parameter.queueType=項目を所有するキューの公開種別。
parameter.beforeTime=前ページの beforeTime を小数秒まで保持し、beforeId と一緒に送ります。
parameter.beforeId=前ページ末尾の試行 UUID。beforeTime と一緒に指定します。
