DownloadQueueController.rejectLegacyCancel.POST.summary=Legacy unscoped cancellation
DownloadQueueController.rejectLegacyCancel.POST.parameter.artworkId=Artwork identifier in the retired URL. The server ignores its value.
DownloadQueueController.rejectLegacyCancel.POST.description=This retired route always returns 409. With a task UUID, use POST /api/download/tasks/{taskId}/cancel. Use POST /api/download/queue/{queueType}/cancel only with the item key and publication identity supplied by the provider.
DownloadQueueController.rejectLegacyCancel.POST.success=Unscoped cancellation.
DownloadQueueController.cancelDownload.POST.summary=Cancel queued downloads
DownloadQueueController.cancelDownload.POST.description=If the queue provider supplied a workKey, pass it unchanged and use the matching publication identity from GET /api/download/extensions as owner. Program clients can also read attempt.attemptId from a visible task in GET /api/download/tasks and use it as taskId in POST /api/download/tasks/{taskId}/cancel.
DownloadQueueController.cancelDownload.POST.success=Queued downloads.
DownloadQueueController.clearDownloadQueue.POST.summary=Clear the download queue
DownloadQueueController.clearDownloadQueue.POST.description=Return the outcome of clearing queued work for the current caller.
DownloadQueueController.clearDownloadQueue.POST.success=Download queue cleared.
DownloadTasksController.submit.POST.summary=Start a download task
DownloadTasksController.submit.POST.description=Choose an active workType in the request schema and use its example to fill workId and options. The document's x-download-submissions catalog also gives each provider's required program permission and input schema. Reuse requestId when retrying an identical command. Reusing it with different content causes a conflict. The 202 receipt identifies the task to poll. Poll the Location header on the 202 response. The taskId path parameter is task.attempt.attemptId in the receipt. An identical submission with the same caller and `requestId` returns the original receipt while the process retains its idempotency entry. Once the terminal result is saved, the entry can expire five minutes after the task ended. A later submission can start a new task.
DownloadTasksController.submit.POST.success=A duplicate submission also returns 202. Poll the same attempt by task.attempt.attemptId. If it failed before queuing, task.outputPath can be null.
DownloadTasksController.snapshot.GET.summary=List download tasks
DownloadTasksController.snapshot.GET.description=Returns the caller’s visible task snapshot, process epoch and revision. A restart changes the epoch. After a restart, use GET /api/download/tasks/history to page through archived terminal tasks.
DownloadTasksController.snapshot.GET.success=Download tasks.
DownloadTasksController.find.GET.summary=Get download task details
DownloadTasksController.find.GET.description=outputPath identifies the output directory for this attempt. Reads execution state by the task UUID from the submission receipt. Returns 404 if the caller cannot find that task. After a full artwork download, use attempt.workId with GET /api/library/artworks/{artworkId} (core:library.read). Read moveFolder for a moved work, otherwise folder. Fetch a zero-based page with GET /api/downloaded/rawfile/{artworkId}/{page} (core:assets.export). For an incomplete page selection, GET /api/library/artworks/{artworkId}/partial lists the saved pages and directory. Start polling every 2 seconds. If `revision` stays the same, increase the interval up to 10 seconds. Return to 2 seconds after an update. Stop when `phase` is `COMPLETED`, `FAILED` or `CANCELLED`. If a response includes `Retry-After`, wait at least that long before the next request.
DownloadTasksController.find.GET.success=Download task details.
DownloadTasksController.history.GET.summary=List saved task history
DownloadTasksController.history.GET.description=limit is 1–200 and defaults to 50. Omit the cursor for the first page. For the next page, return both beforeTime and beforeId exactly as received. After a restart, use GET /api/download/tasks/history to page through archived terminal tasks.
DownloadTasksController.history.GET.success=Saved task history.
DownloadTasksController.cancel.POST.summary=Cancel a download task
DownloadTasksController.cancel.POST.description=Requests cancellation by task UUID. REQUESTED means cancellation was requested, TERMINAL means the task already ended, and 409 means the task cannot be cancelled. Use attempt.attemptId from GET /api/download/tasks as taskId. If the provider supplied a workKey and publication identity, use POST /api/download/queue/{queueType}/cancel.
DownloadTasksController.cancel.POST.success=Download task.
DownloadQueueController.rejectLegacyCancel.POST.response.409=A queue is required. Submit the cancellation to the queue-specific endpoint.
parameter.taskId=Use task.attempt.attemptId from the submission receipt. Location gives the task URL.
parameter.queueType=Published queue type that owns the work item.
parameter.beforeTime=Return the previous page’s beforeTime with beforeId, preserving fractional seconds.
parameter.beforeId=Attempt UUID at the end of the previous page. Send it with beforeTime.
