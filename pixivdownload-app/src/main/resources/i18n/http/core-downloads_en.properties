schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.failureReason=Executor failure reason code, null if no specific reason was reported. OUTPUT_LAYOUT_CONFLICT means the source, page count, folder or output settings changed. Omit pages to rebuild the work. OUTPUT_ALREADY_REGISTERED means the complete work is already in the library. `WORK_NOT_FOUND` means the source could not find the requested work for the current identity during submission. A rejected submission can have phase FAILED and a null failureReason.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.outputPath=Absolute output directory on the server for this attempt. Artwork and novel downloads determine it before queuing. Files may not exist yet. The value is null during preparation, when the provider has no directory to report, or for older receipts without a recorded directory. It retains the original location if the work moves.
parameter.X-Acquisition-Credential=Optional temporary acquisition credential for the selected download handler, up to 16384 characters.
DownloadTasksController.submit.POST.response.400=The command could not be parsed, required fields are missing, options exceed shared limits, or the temporary acquisition credential is too long. An unpublished workType returns DOWNLOAD_TASK_UNSUPPORTED_WORK_TYPE without creating a task. Choose a type from x-download-submissions. queueType identifies a queue. When a field can be identified, field is its JSON Pointer into the request body and reason is a stable validation code. An unsupported work type returns field=/workType and reason=unsupported.
DownloadTasksController.submit.POST.response.409=Conflicting submission, for example reusing a requestId with different content.
DownloadTasksController.submit.POST.response.413=The request body exceeds 128 KiB.
DownloadTasksController.submit.POST.response.404=WORK_NOT_FOUND — The source could not find the requested work during metadata lookup with the current identity. Check the work ID and its visibility. The registered attempt appears as FAILED in the task list and history. The first error carries no attemptId or Location. Once the terminal result is saved, the idempotency entry can expire five minutes after the task ended. Retrying the same command and requestId as the same caller while this process retains the entry returns a 202 receipt for the same attempt with duplicate=true. After expiry, retrying creates a new attempt.
DownloadTasksController.submit.POST.response.422=The provider or an admission policy rejected execution, for example because an option is outside the selected type's accepted range. The registered attempt appears as FAILED in the task list and history. The first error carries no attemptId or Location. Once the terminal result is saved, the idempotency entry can expire five minutes after the task ended. Retrying the same command and requestId as the same caller while this process retains the entry returns a 202 receipt for the same attempt with duplicate=true. After expiry, retrying creates a new attempt. When a field can be identified, field is its JSON Pointer into the request body and reason is a stable validation code. Built-in provider field reasons include unknown_property, duplicate, invalid_format, invalid_value, not_applicable, out_of_range, too_large. Extensions can supply other reasons.
DownloadTasksController.submit.POST.response.503=The handler or queue is unavailable, or task capacity has been reached. Failures before registration create no task. A later failure can leave a FAILED attempt. Retry the identical command while its idempotency entry is retained to retrieve the receipt.
DownloadQueueController.cancelDownload.POST.response.409=The handler identity is stale or the handler does not support cancellation. Read the current queue identity and capabilities.
DownloadTasksController.cancel.POST.response.409=The task exists but its current execution cannot be cancelled.
DownloadTasksController.find.GET.response.404=No task with this taskId is visible to the caller.
DownloadTasksController.cancel.POST.response.404=No task with this taskId is visible to the caller.
DownloadTasksController.submit.POST.details=**Submit.** An administrator can submit a task. A program key needs both `core:downloads.create` and the selected type's `x-program-permission`. Send a JSON object with string keys and values in `options`. Use `{}` for no options. The body limit is 128 KiB. Up to 32 options may use a combined 16 KiB of UTF-8 keys and values. Send acquisition credentials in one header: `X-Acquisition-Credential` for a credential or `X-Acquisition-Credentials` for saved credentials. Program keys also need `core:credentials.use` for saved credentials. Send one JSON object. Duplicate keys, trailing content and nesting beyond four levels are rejected. Provider validation failures return 422 `DOWNLOAD_TASK_REJECTED`. Active admission policies may reject the task and option hooks can adjust the filename template and output format.\n\n\
    **Retry.** During the current process's retention window, the same caller, `requestId`, work type, work ID, options and resolved primary acquisition credential return the original task with `duplicate=true`. Changing the command or primary credential while reusing the ID returns 409. Poll by `task.attempt.attemptId`. Use a new `requestId` to change pages, rebuild or run a failed task again. Idempotency entries can expire five minutes after a task ends once its result has been saved. Saved terminal results are available after restart. Tasks are not replayed.\n\n\
    **Acceptance and completion.** A provider may fetch and validate the work before responding. Invalid requests return 400 and oversized bodies return 413. Provider or admission rejection can return 422. An unavailable provider, database or task slot can return 503. After 202, poll `Location` with `core:downloads.read` and check `phase` and `failureReason`. The task may already have ended. `CREDENTIALS_UNAVAILABLE` means the selected acquisition credentials became unavailable during execution. After `POST /api/download/tasks/{taskId}/cancel` with `core:downloads.cancel`, poll for the final phase. Program keys can read and cancel only tasks visible to them. Artwork and novel providers set the absolute server directory in `task.outputPath` before queuing. The directory may not exist yet. If submission fails before queue binding, `queueType` is empty and `task.outputPath` is null. A 422 or 404 `WORK_NOT_FOUND` response omits the task ID, but the failed attempt appears in the task list and history. Retry the identical command within the retention window to get its 202 receipt. A missing work sets `failureReason` to `WORK_NOT_FOUND`.
description=Submit downloads, follow individual attempts and browse completed task history.
DownloadTasksController.history.GET.parameter.limit=Return 1–200 items. An out-of-range value returns 400.
schema.top.sywyar.pixivdownload.core.download.web.DownloadTasksController.TaskView.field.progress=Latest measured progress for this attempt, or null if the provider has not reported it or an older archive lacks it. Use phase to determine success after a step reaches its total.
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.description=Provider counters for one step. The unit and total can change between steps.
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.unit=PAGES counts work pages, IMAGES counts images, and BYTES counts bytes. Novels report processed illustrations and transferred cover bytes.
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.completed=Amount processed in this step, from zero through total.
schema.top.sywyar.pixivdownload.plugin.api.download.task.DownloadTaskProgress.field.total=Known size of the step in the same unit, greater than zero.
