title=采集凭据
AcquisitionCredentialsController.read.GET.summary=查看采集凭据清单
AcquisitionCredentialsController.read.GET.description=读取当前 revision 和条目的 id、name、enabled。保存修改时回传 revision；响应始终省略 secret。
AcquisitionCredentialsController.read.GET.success=采集凭据清单。
AcquisitionCredentialsController.save.PUT.summary=保存采集凭据库
AcquisitionCredentialsController.save.PUT.description=用 entries 替换整份清单，省略的条目会被删除。已有 id 的 secret 留空会沿用旧值；新 id 必须给出 secret。revision 冲突时返回 409，请重新读取。
AcquisitionCredentialsController.save.PUT.success=已保存采集凭据库。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Update.field.revision=上次读取的修订号。发生编辑冲突时，重新读取后再提交。
AcquisitionCredentialsController.save.PUT.body=凭据条目和编辑前读取的修订号。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.id=调用方分配的稳定 ID，1–64 个 ASCII 字母、数字或连字符，清单内唯一。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.id=调用方分配的稳定 ID，1–64 个 ASCII 字母、数字或连字符，清单内唯一。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.name=显示名，非空，最多 80 个 UTF-16 代码单元。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.name=显示名，非空，最多 80 个 UTF-16 代码单元。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.enabled=仅启用的条目可按 ID 选作采集凭据。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.enabled=仅启用的条目可按 ID 选作采集凭据。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.secret=新 ID 须传非空凭据（最多 16384 个 UTF-16 代码单元，不含 ASCII 控制字符）。已有 ID 传 null 或留空会保留其原值。读取响应仅返回元数据。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Update.field.entries=替换后的完整清单，最多 8 项。提交空数组清空清单；省略的旧条目会删除。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Snapshot.field.entries=当前条目的 ID、名称与启用状态，按保存顺序返回。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Snapshot.field.revision=下次保存必须原样传回此版本。
AcquisitionCredentialsController.save.PUT.response.409=凭据库版本已变更，请重新读取当前快照后提交修改。
AcquisitionCredentialsController.save.PUT.response.413=提交的凭据库请求体超过大小上限。
description=读取和更新采集时使用的凭据列表。
