title=Pixiv 조회
PixivSharedProxyController.getScheduleUserMeta.POST.summary=예약 작업용 Pixiv 작가 정보 조회
PixivSharedProxyController.getScheduleUserMeta.POST.description=요청 본문의 일정 컨텍스트에 선택된 인증 정보로 userId에 해당하는 작가 이름과 사용자 ID를 조회합니다. GET /api/schedule/sources 의 같은 항목에서 sourceType과 activationToken을 복사하세요. 프로그램 키로 목록을 읽으려면 core:schedule.sources.read가 필요합니다. 소스가 다시 게시되면 두 값을 다시 받아야 합니다. taskId를 지정하면 프로그램 키에 해당 작업의 소스 owner에 대한 schedule.manage 권한도 필요합니다.
PixivSharedProxyController.getScheduleUserMeta.POST.success=예약 작업용 Pixiv 작가 정보.
PixivSharedProxyController.getUserMeta.GET.summary=Pixiv 작가 프로필 조회
PixivSharedProxyController.getUserMeta.GET.description=경로의 Pixiv 사용자 ID로 현재 작가 이름을 조회하고 이름과 ID를 반환합니다.
PixivSharedProxyController.getUserMeta.GET.success=Pixiv 작가 프로필.
PixivSharedProxyController.proxyThumbnail.GET.summary=프록시를 통한 미리보기 이미지 조회
PixivSharedProxyController.proxyThumbnail.GET.description=서버를 통해 원본 미리보기 이미지를 가져와 이미지 미디어 유형과 함께 반환합니다.
PixivSharedProxyController.proxyThumbnail.GET.success=프록시를 통한 미리보기 이미지.
PixivSharedProxyController.getMeUid.GET.summary=로그인한 Pixiv 계정 ID 조회
PixivSharedProxyController.getMeUid.GET.description=Pixiv Cookie의 PHPSESSID에서 계정 UID를 읽습니다. Pixiv에 접속하여 세션을 확인하지 않습니다. UID를 읽을 수 없으면 400 ACQUISITION_CREDENTIAL_REQUIRED를 반환합니다.
PixivSharedProxyController.getMeUid.GET.success=로그인한 Pixiv 계정 ID.
parameter.userId=작가의 Pixiv 사용자 ID입니다.
parameter.X-Acquisition-Credential=선택적 임시 Pixiv 수집 Cookie 원문. 최대 16384자. 저장된 인증 정보를 사용하려면 X-Acquisition-Credentials에 해당 ID를 지정합니다. 공개 정보 조회에 성공해도 Cookie의 유효 기간이 확인되지는 않습니다.
parameter.url=미리보기 이미지의 원본 URL입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.sourceType=GET /api/schedule/sources 에서 선택한 소스의 sourceType입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.activationToken=sourceType과 같은 항목의 activationToken입니다. 소스가 다시 게시되면 새 값을 받으세요.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.expectedStateVersion=호출자가 조회한 작업 상태 버전입니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.proxy=이 작업에 사용할 프록시 설정입니다.
PixivSharedProxyController.getScheduleUserMeta.POST.body=조회에 사용할 예약 소스, 자격 증명 및 프록시입니다.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.MeUidResponse.field.uid=수집용 Cookie에서 읽은 Pixiv 계정 ID.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.UserMetaResponse.field.name=Pixiv에서 반환한 작가 표시 이름.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.UserMetaResponse.field.userId=조회한 작가의 Pixiv 사용자 ID.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.taskId=기존 작업 ID. expectedStateVersion과 함께 지정하거나 둘 다 생략합니다.
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.useTaskCredential=선택한 작업의 인증 정책을 사용합니다. 작업 ID와 상태 버전이 필요하며 별도 인증 정보는 생략합니다.
parameter.X-User-UUID=다중 사용자 모드의 UUID v4. 할당량 초기화에서 반환한 UUID를 사용합니다. 유효한 사용자 Cookie가 우선합니다.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ErrorResponse.field.code=code로 실패 원인을 구분합니다.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.code=프록시 요청 한도에 도달하면 pixiv.proxy.rate-limited.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.error=서버 또는 Pixiv가 반환한 실패 사유.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ErrorResponse.field.error=서버 또는 Pixiv가 반환한 실패 사유.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.maxRequests=제한 시간 내 허용되는 최대 프록시 요청 수.
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.windowHours=프록시 요청 횟수 제한 기간(시간).
PixivSharedProxyController.getMeUid.GET.response.400=Pixiv Cookie가 없거나 계정 UID를 읽을 수 없으면 code는 ACQUISITION_CREDENTIAL_REQUIRED입니다.
description=Pixiv 계정 정보와 썸네일을 조회합니다.
PixivSharedProxyController.proxyThumbnail.GET.parameter.url=pximg.net 하위 도메인 또는 embed.pixiv.net의 절대 HTTPS URL입니다. 포트는 생략하거나 443을 사용하세요. 사용자 정보와 프래그먼트는 허용하지 않으며 리디렉션을 따르지 않습니다.
