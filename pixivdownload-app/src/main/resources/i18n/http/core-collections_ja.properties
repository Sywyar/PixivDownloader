CollectionController.uploadIcon.POST.body=file パートにコレクションの画像を添付します。 cURL の例では、`INSTANCE` にインスタンスのオリジン（スキーム、ホスト、ポート。末尾のスラッシュは省略）、`PROGRAM_KEY` にこの操作を許可するキーを設定します。 `GET /api/collections` で `COLLECTION_ID` を取得し、`icon.png` をアップロードする画像に置き換えます。
parameter.id=取得または変更するコレクション ID。
