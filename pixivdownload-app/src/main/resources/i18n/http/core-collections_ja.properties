schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.field.name=前後の空白を除いた名前は一意で、1～40 UTF-16 コード単位です。
schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.field.downloadRoot=コレクションの保存先です。空文字または null は既定値を使います。相対パスと単一のスラッシュで始まるパスは `download.root-folder` が基準です。使用できる変数は {collectionRootVariables} です。名前が Favorites の場合、`albums/{collection_name}` は `albums/Favorites` になり、その他の波括弧はそのまま残ります。 前後の空白を除き最大 500 UTF-16 コード単位で、制御文字は使用できません。相対パスはルート配下に限ります。サーバーが認識する絶対パスはその位置を使います。
