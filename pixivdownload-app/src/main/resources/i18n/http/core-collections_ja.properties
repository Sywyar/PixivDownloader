title=コレクション
CollectionController.list.GET.summary=コレクションの一覧
CollectionController.list.GET.description=閲覧可能なコレクションを返します。ID でアイコンや登録作品を管理できます。
CollectionController.list.GET.success=コレクション。
CollectionController.create.POST.summary=コレクションを作成
CollectionController.create.POST.description=ローカルのコレクションを作成し、割り当てた数値 ID を返します。同時に保存先を指定できます。
CollectionController.create.POST.success=コレクションを作成しました。
CollectionController.rename.PUT.summary=コレクションの名前を変更
CollectionController.rename.PUT.description=名前を変更します。次回のダウンロードから保存先の名前変数に新しい名前を使います。既存のファイルは移動しません。
CollectionController.rename.PUT.success=コレクションを更新しました。
CollectionController.updateDownloadRoot.PUT.summary=コレクションの保存先を設定
CollectionController.updateDownloadRoot.PUT.description=このコレクションを指定した今後のダウンロードに適用します。名前の展開時に区切り文字などはアンダースコアになります。
CollectionController.updateDownloadRoot.PUT.success=コレクションの保存先を保存しました。
CollectionController.updateSortOrder.PUT.summary=コレクションの表示順を設定
CollectionController.updateSortOrder.PUT.description=一覧は `sortOrder` の昇順、同値なら ID の昇順です。`sortOrder` を省略するか null にすると 0 になります。
CollectionController.updateSortOrder.PUT.success=コレクションの表示順を保存しました。
CollectionController.delete.DELETE.summary=コレクションを削除
CollectionController.delete.DELETE.description=数値 ID でコレクションを削除し、成功時には空の応答を返します。
CollectionController.delete.DELETE.success=コレクションを削除しました。
CollectionController.uploadIcon.POST.summary=コレクションのアイコンをアップロード
CollectionController.uploadIcon.POST.description=multipart の `file` に PNG、JPEG、WebP のいずれかを指定します。上限は 1 MiB、縦横各 2048 ピクセルです。成功すると元のアイコンを置き換えます。
CollectionController.uploadIcon.POST.success=コレクションのアイコンをアップロードしました。
CollectionController.clearIcon.DELETE.summary=コレクションのアイコンをクリア
CollectionController.clearIcon.DELETE.description=カスタムアイコンを削除し、コレクションを返します。表示は既定のアイコンに戻ります。
CollectionController.clearIcon.DELETE.success=コレクションのアイコンを消去しました。
CollectionController.downloadIcon.GET.summary=コレクションのアイコンを取得
CollectionController.downloadIcon.GET.description=画像本体を対応するメディアタイプで返します。コレクション、アイコンの登録、またはファイルがなければ 404 です。
CollectionController.downloadIcon.GET.success=コレクションのアイコン。
CollectionController.addArtwork.POST.summary=コレクションへのイラストを追加
CollectionController.addArtwork.POST.description=作品をコレクションに追加します。新しく追加した場合は `added` が true、登録済みなら false です。
CollectionController.addArtwork.POST.success=コレクションへのイラストを追加しました。
CollectionController.removeArtwork.DELETE.summary=コレクション内のイラストの登録を解除
CollectionController.removeArtwork.DELETE.description=作品との関連付けを解除します。解除できたかどうかは `removed` に返ります。保存済みファイルは残ります。
CollectionController.removeArtwork.DELETE.success=コレクション内のイラストを削除しました。
CollectionController.collectionsOf.GET.summary=イラストが含まれるコレクションの一覧
CollectionController.collectionsOf.GET.description=所属先を変更する前に、その作品が既に含まれるコレクションを確認できます。
CollectionController.collectionsOf.GET.success=イラストが含まれるコレクション。
CollectionController.memberships.POST.summary=複数のイラストの所属先を照会
CollectionController.memberships.POST.description=作品 ID の十進文字列をキーとして所属コレクション ID の配列を返します。表示できる関連付けがない作品は省略される場合があります。招待ゲストは正の ID を 1 回に 500 件まで送信できます。
CollectionController.memberships.POST.success=複数のイラストの所属先。
CollectionController.addNovel.POST.summary=コレクションへの小説を追加
CollectionController.addNovel.POST.description=作品をコレクションに追加します。新しく追加した場合は `added` が true、登録済みなら false です。
CollectionController.addNovel.POST.success=コレクションへの小説を追加しました。
CollectionController.removeNovel.DELETE.summary=コレクション内の小説の登録を解除
CollectionController.removeNovel.DELETE.description=作品との関連付けを解除します。解除できたかどうかは `removed` に返ります。保存済みファイルは残ります。
CollectionController.removeNovel.DELETE.success=コレクション内の小説を削除しました。
CollectionController.novelCollectionsOf.GET.summary=小説が含まれるコレクションの一覧
CollectionController.novelCollectionsOf.GET.description=所属先を変更する前に、その作品が既に含まれるコレクションを確認できます。
CollectionController.novelCollectionsOf.GET.success=小説が含まれるコレクション。
CollectionController.novelMemberships.POST.summary=複数の小説の所属先を照会
CollectionController.novelMemberships.POST.description=作品 ID の十進文字列をキーとして所属コレクション ID の配列を返します。表示できる関連付けがない作品は省略される場合があります。招待ゲストは正の ID を 1 回に 500 件まで送信できます。
CollectionController.novelMemberships.POST.success=複数の小説の所属先。
CollectionController.uploadIcon.POST.body.field.file=コレクションのアイコンに使う画像。
parameter.novelId=Pixiv の小説 ID。
parameter.artworkId=Pixiv の作品 ID。
schema.top.sywyar.pixivdownload.collection.request.CollectionRenameRequest.title=コレクションの新しい名前
schema.top.sywyar.pixivdownload.collection.request.CollectionRenameRequest.field.name=前後の空白を除いた名前は一意で、1～40 UTF-16 コード単位です。
CollectionController.rename.PUT.body=コレクションの新しい名前
schema.top.sywyar.pixivdownload.collection.CollectionController.SortOrderRequest.title=コレクションの表示順
schema.top.sywyar.pixivdownload.collection.CollectionController.SortOrderRequest.field.sortOrder=一覧の並び順。小さい値が先です。更新時に省略または null を指定すると 0 になります。
CollectionController.updateSortOrder.PUT.body=コレクションの表示順
schema.top.sywyar.pixivdownload.collection.request.CollectionDownloadRootRequest.title=コレクションの保存先
schema.top.sywyar.pixivdownload.collection.request.CollectionDownloadRootRequest.field.downloadRoot=コレクションの保存先です。空文字または null は既定値を使います。相対パスと単一のスラッシュで始まるパスは `download.root-folder` が基準です。使用できる変数は {collectionRootVariables} です。名前が Favorites の場合、`albums/{collection_name}` は `albums/Favorites` になり、その他の波括弧はそのまま残ります。 前後の空白を除き最大 500 UTF-16 コード単位で、制御文字は使用できません。相対パスはルート配下に限ります。サーバーが認識する絶対パスはその位置を使います。
CollectionController.updateDownloadRoot.PUT.body=コレクションの保存先
