title=ダウンロードアーカイブ
ArchiveController.initQuota.POST.summary=ダウンロード上限を初期化
ArchiveController.initQuota.POST.description=使用量とリセットまでの秒数を取得します。マルチユーザーの割当が有効なら初回にユーザー UUID の Cookie が設定されます。梱包時にも送信してください。
ArchiveController.initQuota.POST.success=ダウンロード上限を初期化しました。
ArchiveController.triggerPack.POST.summary=現在のクォータ利用者がダウンロードしたフォルダーをアーカイブ
ArchiveController.triggerPack.POST.description=POST /api/quota/init の Cookie に紐付いたダウンロード済みフォルダーをまとめます。対象がなければ 204、回数制限に達すると 429 を返します。
ArchiveController.triggerPack.POST.success=作品の圧縮タスク。
ArchiveController.triggerAdminPack.POST.summary=作品の圧縮タスクを開始
ArchiveController.triggerAdminPack.POST.description=artworkIds を渡します。未登録作品と存在しないフォルダーを除き、重複フォルダーは一度だけまとめます。対象がなければ 204、それ以外は token と有効秒数を返します。
ArchiveController.triggerAdminPack.POST.success=作品の圧縮タスク。
ArchiveController.listAdminArchives.GET.summary=作品アーカイブの一覧
ArchiveController.listAdminArchives.GET.description=管理者が作成したアーカイブを一覧表示します。返された token で状態照会やダウンロードができます。
ArchiveController.listAdminArchives.GET.success=作品アーカイブ。
ArchiveController.archiveStatus.GET.summary=アーカイブの作成状況を取得
ArchiveController.archiveStatus.GET.description=梱包時の token で状態を確認し、ready になったら /api/archive/download/{token} を呼び出します。 不明または期限切れのトークンでは 200 と {"status":"expired"} を返し、token と expireSeconds は省略されます。
ArchiveController.archiveStatus.GET.success=アーカイブの作成状況。
ArchiveController.downloadArchive.GET.summary=作品アーカイブをダウンロード
ArchiveController.downloadArchive.GET.description=ZIP を添付ファイルとして返します。準備中は 202、token 失効は 410、準備済みファイルの消失は 404 です。
ArchiveController.downloadArchive.GET.success=作品アーカイブ。
parameter.token=操作または購読の作成時に返されたトークン。
schema.top.sywyar.pixivdownload.quota.request.AdminPackRequest.title=アーカイブに含めるイラスト
schema.top.sywyar.pixivdownload.quota.request.AdminPackRequest.field.artworkIds=対象となる Pixiv イラスト ID の一覧。
ArchiveController.triggerPack.POST.body=アーカイブに含めるイラスト
ArchiveController.triggerAdminPack.POST.body=アーカイブに含めるイラスト
ArchiveController.downloadArchive.GET.response.202=準備中です。同じ token で後ほど再試行してください。
ArchiveController.downloadArchive.GET.response.410=アーカイブのトークンが存在しないか、有効期限が切れています。
ArchiveController.downloadArchive.GET.response.404=準備完了の記録に対応するファイルが見つかりません。
ArchiveController.triggerPack.POST.response.204=このユーザーのダウンロードディレクトリは登録されていません。
ArchiveController.triggerPack.POST.response.429=アーカイブ作成回数が上限に達しました。応答には回数と対象期間（分）が含まれます。
ArchiveController.triggerAdminPack.POST.response.204=選択した作品にはアーカイブ可能な既存ディレクトリがありません。
