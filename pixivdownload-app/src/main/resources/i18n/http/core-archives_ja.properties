schema.top.sywyar.pixivdownload.quota.response.QuotaInitResponse.field.maxArtworks=現在の割当期間に許可される最大作品数。
schema.top.sywyar.pixivdownload.quota.response.QuotaInitResponse.field.resetSeconds=割当がリセットされるまでの秒数。
schema.top.sywyar.pixivdownload.quota.response.QuotaInitResponse.field.archive=ユーザーに関連付けられた現在のアーカイブと有効期間。
parameter.X-User-UUID=マルチユーザーモードの UUID v4。割当の初期化で返された UUID を使います。有効なユーザー Cookie が優先されます。
schema.top.sywyar.pixivdownload.quota.response.AdminArchiveTasksResponse.description=有効期限内の管理者アーカイブタスク。新しいものから順に返します。
schema.top.sywyar.pixivdownload.quota.response.PackRateLimitResponse.field.code=作成回数が上限に達した場合は archive.pack.rate-limited。
schema.top.sywyar.pixivdownload.quota.response.PackRateLimitResponse.field.error=回数制限の理由を示すメッセージ。
schema.top.sywyar.pixivdownload.quota.response.PackRateLimitResponse.field.maxPacks=対象期間内に許可される最大アーカイブ作成回数。
schema.top.sywyar.pixivdownload.quota.response.PackRateLimitResponse.field.windowMinutes=アーカイブ作成の回数制限期間（分）。
description=取得済みの作品をまとめ、状態を確認して ZIP を取得します。
