filter.prepare.summary=대상 HTTP 작업의 훅 준비
filter.prepare.description=대상 작업의 접근 규칙으로 같은 서버의 요청을 준비하며 대상 작업은 실행하지 않습니다. 식별만 하려면 resolveOnly=true를 지정합니다. HOOK_CHALLENGE를 받으면 클라이언트 Cookie를 유지하고 같은 대상에 token과 훅 ID별 proofs를 다시 제출합니다. HOOK_READY 이후 실제 대상에 X-Pixiv-Hook-Ticket으로 토큰을 전달합니다. 기본 폼 제출은 nativeSubmit Cookie를 사용할 수 있습니다.
filter.HookPreparation=확인할 대상 요청과 준비할 챌린지 증명.
filter.HookPreparation.method=대상 경로의 대문자 HTTP 메서드.
filter.HookPreparation.url=/로 시작하는 같은 서버의 경로. 쿼리 문자열을 포함할 수 있습니다. 호스트, 프래그먼트 및 준비 경로 자체는 지정할 수 없습니다.
filter.HookPreparation.headers=대상 확인용 헤더는 최대 16개입니다. 값은 최대 1024자이며 제어 문자를 포함할 수 없습니다. 이름은 대소문자 구분 없이 영숫자와 하이픈으로 최대 96자입니다. Accept, Content-Type, X- 헤더를 사용할 수 있습니다. X-Forwarded-, X-Pixiv-, X-Real- 접두사와 token, key, auth, cookie가 들어간 이름은 허용되지 않습니다.
filter.HookPreparation.json=작업 바인딩에 선언한 JSON Pointer를 키로 원본 필드 값을 지정합니다. 최대 256개, 키당 256자입니다.
filter.HookPreparation.parameters=폼 필드 이름과 비어 있지 않은 문자열 배열. 대상 Content-Type은 application/x-www-form-urlencoded 또는 multipart/form-data여야 합니다. 쿼리와 폼을 합해 최대 128개 값을 받습니다.
filter.HookPreparation.token=응답의 챌린지 토큰. 최초 호출에서는 생략하고 증명 제출 시 원래 대상과 함께 전달합니다.
filter.HookPreparation.proofs=challenges의 훅 ID를 키로 제공자가 요구하는 증명 문자열을 입력합니다. token이 필요합니다. 최대 16개, 값당 16384자, UTF-8 합계 64 KiB입니다.
filter.HookPreparation.nativeSubmit=true이면 증명 준비 후 같은 대상으로 기본 폼을 제출할 수 있는 일회용 Cookie를 발급합니다.
filter.HookPreparation.resolveOnly=대상 엔드포인트만 확인하고 HOOK_RESOLVED 및 endpoint를 반환합니다.
filter.HookTargetMatch=대상만 확인할 때의 일치 결과.
filter.HookPreparationResult=훅 승인, 챌린지, 증명 준비 또는 거부 결과.
filter.HookTargetMatch.code=대상이 일치하면 HOOK_RESOLVED.
filter.HookTargetMatch.endpoint=일치한 HTTP 엔드포인트 ID.
filter.HookTargetMatch.invoked=준비 응답에서는 false입니다. 대상 작업은 실행 전입니다.
filter.HookPreparationResult.invoked=준비 응답에서는 false입니다. 대상 작업은 실행 전입니다.
filter.HookPreparationResult.code=승인, 챌린지, 준비 완료 또는 실패를 나타내는 기계 판독용 HOOK_ 코드.
filter.HookPreparationResult.error=현지화된 실패 메시지. 성공 시 빈 문자열.
filter.HookPreparationResult.token=챌린지 시 발급되고 증명 준비 완료 시 반환되는 토큰. 다른 경우 비어 있을 수 있습니다.
filter.HookPreparationResult.revision=준비에 사용한 게시 리비전. 확인할 수 없으면 비어 있습니다.
filter.HookPreparationResult.challenges=훅 ID별 챌린지 문자열. 증명을 제출할 때 같은 키를 사용합니다.
filter.prepare.200=대상 확인(HOOK_RESOLVED), 준비 승인(HOOK_APPROVED) 또는 증명 준비 완료(HOOK_READY).
filter.prepare.400=지정한 메서드, URL, 헤더 또는 필드로 유효한 대상 요청을 확인할 수 없습니다.
filter.prepare.401=대상 작업에서 유효한 세션 또는 지원하는 프로그램 키를 요구합니다.
filter.prepare.403=준비 요청 자체의 CSRF 출처 검사가 실패하면 FORBIDDEN을 반환합니다. 대상 권한 또는 훅 검증에서도 요청이 거부될 수 있습니다.
filter.prepare.409=HOOK_CHALLENGE이면 증명이 필요합니다. HOOK_STALE 또는 HOOK_TARGET_STALE이면 대상 또는 토큰이 변경되어 다시 준비해야 합니다.
filter.prepare.413=준비 요청이 512 KiB를 초과합니다.
filter.prepare.429=준비 요청 빈도 또는 동시 처리 수가 한도에 도달했습니다.
filter.prepare.503=현재 훅 제공자 또는 대상 작업을 사용할 수 없습니다.
filter.X-Acquisition-Credentials=활성 인증 정보 라이브러리 ID를 우선순위 순으로 1~8개, 중복 없이 쉼표로 구분합니다. 관리자 또는 core:credentials.use 권한이 필요합니다. X-Acquisition-Credential과 함께 사용할 수 없습니다.
filter.X-Pixiv-Page-Publication=게시 페이지에서 요청할 때 게시 토큰으로 대상 경로 소유자를 확인합니다. 오래된 게시 또는 대상 불일치 시 409를 반환합니다.
filter.pagePublication=페이지 요청에서 X-Pixiv-Page-Publication 대신 쓸 수 있는 쿼리 매개변수. 헤더가 우선합니다.
filter.X-Pixiv-Ui-Publication=게시된 UI 슬롯에서 요청할 때 슬롯의 publication 토큰을 보냅니다. 게시가 철회되면 409를 반환합니다.
filter.uiPublication=슬롯이 소유자의 리소스를 로드할 때 전달하는 게시 토큰. 리소스 소유자를 확인하며 X-Pixiv-Ui-Publication 헤더가 우선합니다.
filter.X-Pixiv-Hook-Ticket=대상이 HOOK_CHALLENGE를 반환한 경우 준비 요청의 Cookie를 유지하고 HOOK_READY의 일회용 토큰을 같은 대상으로 전달합니다.
schema.top.sywyar.pixivdownload.plugin.web.controller.OperationHooksController.Failure.field.code=훅 설정 요청의 기계 판독용 실패 사유 코드.
filter.X-Pixiv-Hook=READY, CHALLENGE 등 훅 처리 결과. 대상 확인만 하고 성공한 응답에서는 이 헤더를 생략합니다.
filter.prepare.access=대상 작업의 접근 조건을 따릅니다. 공개 대상은 익명으로 준비할 수 있습니다. 그 외에는 대상이 허용한 세션, GUI 자격 정보 또는 프로그램 키를 외부 요청에 전달합니다. 브라우저 요청은 동일 출처 쓰기 조건도 충족해야 합니다.
parameter.page=게시 목록의 페이지 키에 해당하는 웹 페이지 식별자입니다.
filter.credentials.400=X-Acquisition-Credentials의 형식이 잘못되었거나, 중복되었거나, 원본 자격 증명 헤더와 함께 전송되었습니다.
filter.credentials.403=호출자에게 X-Acquisition-Credentials로 라이브러리 항목을 선택할 권한이 없습니다.
filter.credentials.503=자격 증명 라이브러리를 읽을 수 없거나 선택한 항목이 비활성 상태이거나 존재하지 않습니다.
filter.csrf.origin=CSRF 출처 검사에 사용합니다. 요청의 스킴, 호스트, 유효 포트와 일치하는 서버 출처(예: https://server.example:8443)를 보냅니다. 세션, 초대 또는 방문자 쿠키가 있으면 동일 출처의 Origin 또는 Referer가 필요합니다. 브라우저 출처도 일치해야 하지만, 수집 엔드포인트에서 허용한 스크립트 출처는 예외입니다. 이 쿠키와 브라우저 헤더 없이 Bearer 키만 쓰는 프로그램은 둘 다 생략할 수 있습니다.
filter.csrf.explicit=이 쓰기 작업은 Bearer 키로 호출할 때도 CSRF 검사를 위해 동일 출처의 Origin 또는 Referer가 필요합니다. Origin에는 서버의 스킴, 호스트, 유효 포트를 지정합니다(예: https://server.example:8443).
filter.csrf.referer=Origin이 없으면 동일 출처의 페이지 URL을 Referer로 보낼 수 있습니다. CSRF 검사는 Origin이 있으면 이를 우선 사용합니다.
filter.csrf.error=서버의 CSRF 필터가 요청을 거부하면 JSON 오류 코드 {code}를 반환합니다.
description=등록된 웹 확장, 작업 훅, 페이지 게시 대상을 조회합니다.
