title=手動批次
ManualBatchController.create.POST.summary=提交手動下載批次
ManualBatchController.create.POST.description=依已啟用來源的定義啟動背景下載批次。
ManualBatchController.create.POST.details=從 `GET /api/schedule/sources` 的同一項取得 `sourceType`、`activationToken` 和 `inputSchemaJson`，依該結構將 `definition` 當作 JSON 物件提交。程式金鑰需要 `core:schedule.sources.read` 讀取目錄，建立批次需要 `core:batches.create` 及來源外掛的 `batches.execute`，執行作品還需要對應執行器的 `batches.execute`。請求本文上限為 8 MiB，序列化後的定義上限為 1 MiB。擷取憑證透過請求標頭傳入。\n\n\
    來源會在建立批次前驗證 `definition`。若定義無效，API 會回傳 `400 INVALID_TOOL_REQUEST`，不會建立批次，也不會回傳 `Location`。請依 `field`（例如 `/definition`）與 `reason` 修正定義後重新提交。\n\n\
    `202` 回執包含批次 `id`。以 `GET` 輪詢 `Location` 查看 `state` 和 `code`，在其下的 `/items` 分頁查看作品。程式須使用建立批次的金鑰和 `core:batches.read` 讀取。受理後，若憑證繫結、探索或執行作品時發生錯誤，可從批次的 `state` 和 `code` 查看結果。來源重新發布後批次會掛起，須用最新目錄項目建立新批次。 批次受理後，背景執行時會檢查本次計畫所需執行器的 `batches.execute` 權限。若查詢結果的 `code` 為 `auth.program.forbidden`，從同一回應的 `programPermission` 讀取已知的缺少權限 ID。\n\n\
    每個程序保留一個手動批次，以 5,000 個不同作品和 64 MiB 項目預算為限。超出任一限制會回報 `batch.work.capacity-exceeded`。暫停或取消後等候本輪停止。`resume` 重新掃描來源並保留已完成或略過的項目，`retry` 僅重試已發現的失敗或暫停項目。刪除閒置批次後即可建立下一個。程序結束後批次記錄會消失，已寫入的檔案和作品庫記錄會保留。
ManualBatchController.create.POST.success=批次已受理。用建立批次的金鑰和 `core:batches.read` 權限 GET `Location`。查看 `state` 和 `code`，背景執行缺少權限時從 `programPermission` 讀取權限 ID。
ManualBatchController.create.POST.response.400=JSON、名稱、來源、啟用權杖、定義、代理或憑證標頭無效時會回傳 INVALID_TOOL_REQUEST。來源定義會在建立批次前驗證，可識別時會回傳 field 和 reason，例如 /definition/source/acquisitionMode 和 required。執行結果見批次狀態。
ManualBatchController.create.POST.response.404=程式金鑰指定的來源目前無法使用（batch.not-found）。請重新讀取來源清單。
ManualBatchController.create.POST.response.409=已有批次（batch.exists），或服務正在停止（batch.stopping）。請先停止並刪除現有批次。
ManualBatchController.create.POST.response.413=JSON 請求本文超過 8 MiB（HTTP_BODY_LIMIT）。
ManualBatchController.create.POST.response.500=建立時資料庫無法使用，或服務發生未分類的狀態錯誤（batch.operation-failed）。讀取本文失敗時 code 為 error.io。
ManualBatchController.current.GET.summary=檢視當前批次
ManualBatchController.current.GET.description=傳回目前程序保留的批次。沒有可供呼叫端檢視的批次時傳回 204。重新啟動後不會保留批次紀錄。
ManualBatchController.current.GET.success=當前批次。
ManualBatchController.get.GET.summary=檢視批次詳情
ManualBatchController.get.GET.description=以提交時傳回的 UUID 查詢狀態、run、原因碼和計數。程式金鑰只能查詢自己建立的批次，否則傳回 404。
ManualBatchController.get.GET.success=批次詳情。
ManualBatchController.get.GET.response.404=此 UUID 的批次不存在，或屬於另一程式身分（batch.not-found）。
ManualBatchController.items.GET.summary=分頁檢視批次條目
ManualBatchController.items.GET.description=以 offset（從 0 起）及 limit（1–200）按發現順序取得各項狀態與結果。作品由批次 UUID、workType 和 id 共同識別。
ManualBatchController.items.GET.success=批次條目。
ManualBatchController.items.GET.response.400=offset 小於 0，或 limit 不在 1–200 範圍內（INVALID_TOOL_REQUEST）。
ManualBatchController.items.GET.response.404=此 UUID 的批次不存在，或屬於另一程式身分（batch.not-found）。
ManualBatchController.pause.POST.summary=暫停批次
ManualBatchController.pause.POST.description=要求暫停並保留進度。PAUSING 表示背景工作仍在結束中，輪詢至 PAUSED 後可呼叫 resume。
ManualBatchController.pause.POST.success=已暫停批次。
ManualBatchController.pause.POST.response.404=此 UUID 的批次不存在，或屬於另一程式身分（batch.not-found）。
ManualBatchController.cancel.POST.summary=取消批次
ManualBatchController.cancel.POST.description=要求取消本次執行。CANCELLING 表示仍在結束中，請輪詢確認最終狀態。紀錄保留到明確刪除。
ManualBatchController.cancel.POST.success=批次。
ManualBatchController.cancel.POST.response.404=此 UUID 的批次不存在，或屬於另一程式身分（batch.not-found）。
ManualBatchController.resume.POST.summary=恢復批次
ManualBatchController.resume.POST.description=繼續閒置且未完成的批次，重新掃描來源並保留已完成與已略過的項目。回應中的 run 會遞增。
ManualBatchController.resume.POST.success=已恢復批次。
ManualBatchController.resume.POST.response.404=批次不存在、屬於另一程式身分，或其來源已無法供程式金鑰使用（batch.not-found）。
ManualBatchController.resume.POST.response.409=批次執行中、已完成，或服務正在停止（batch.not-idle）。
ManualBatchController.retry.POST.summary=重試失敗的批次條目
ManualBatchController.retry.POST.description=僅重試已發現的失敗作品，不會繼續掃描來源。批次須閒置且至少有一個可重試項目，否則傳回 409。
ManualBatchController.retry.POST.success=失敗的批次條目。
ManualBatchController.retry.POST.response.404=批次不存在、屬於另一程式身分，或其來源已無法供程式金鑰使用（batch.not-found）。
ManualBatchController.retry.POST.response.409=批次無法開始新一輪（batch.not-idle），或沒有可重試的失敗作品（batch.no-failed-work）。
ManualBatchController.credentials.PUT.summary=更新批次採集憑據
ManualBatchController.credentials.PUT.description=在閒置且未完成的批次上，以目前 run 填入 expectedRun。透過 X-Acquisition-Credential 替換擷取憑證，省略標頭可清除憑證。下次執行時重新準備來源。 固定帳號的來源初次綁定後無法更換或清除憑證。
ManualBatchController.credentials.PUT.success=已更新批次採集憑據。
ManualBatchController.credentials.PUT.response.400=JSON 請求或擷取憑證標頭無效（INVALID_TOOL_REQUEST）。 綁定已固定（schedule.error.credential-fixed）或政策無法使用（schedule.error.credential-policy-unavailable）時會保留原憑證。
ManualBatchController.credentials.PUT.response.404=此 UUID 的批次不存在，或屬於另一程式身分（batch.not-found）。
ManualBatchController.credentials.PUT.response.409=expectedRun 與目前輪次不符、批次執行中或已完成，或服務正在停止（batch.not-idle）。請重新讀取批次。 更新期間政策已更換時會回傳 schedule.error.credential-policy-publication-changed。
ManualBatchController.credentials.PUT.response.413=JSON 請求本文超過 16 KiB（HTTP_BODY_LIMIT）。
ManualBatchController.resolve.POST.summary=處理待處理的批次條目
ManualBatchController.resolve.POST.description=批次停止後，以目前 run、作品識別和原 reasonCode 提交決定。只接受仍需人工處理的項目；儲存後呼叫 resume 或 retry 執行。
ManualBatchController.resolve.POST.success=待處理的批次條目。
ManualBatchController.resolve.POST.response.400=JSON、作品識別資訊或 userAction 格式無效（INVALID_TOOL_REQUEST）。 遇到 DOWNLOAD_PATH_ACTION_REQUIRED 時可選 TRUNCATE、DEFAULT_NAME 或 CANCEL。其他值會回傳 400，欄位為 /userAction。作品仍待確認，可直接修正後重送。
ManualBatchController.resolve.POST.response.404=此 UUID 的批次不存在，或屬於另一程式身分（batch.not-found）。
ManualBatchController.resolve.POST.response.409=批次仍在執行或 expectedRun 已變更（batch.not-idle），或作品、reasonCode、待人工處理狀態與目前記錄不符（batch.action-changed）。
ManualBatchController.resolve.POST.response.413=JSON 請求本文超過 16 KiB（HTTP_BODY_LIMIT）。
ManualBatchController.delete.DELETE.summary=刪除批次記錄
ManualBatchController.delete.DELETE.description=刪除已停止批次的記憶體紀錄並釋放擷取憑證，之後可建立新批次。執行中傳回 409。
ManualBatchController.delete.DELETE.success=已移除批次記錄。
ManualBatchController.delete.DELETE.response.404=此 UUID 的批次不存在，或屬於另一程式身分（batch.not-found）。
ManualBatchController.delete.DELETE.response.409=批次仍在執行或尚未完成停止（batch.not-idle）。請等到批次閒置後再刪除。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Credentials.field.expectedRun=從目前批次詳情讀取 run 並原樣傳入。執行輪次已變更時傳回 409。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.name=批次顯示名稱，1–200 個字元，不得包含控制字元或全為空白。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.sourceType=從 GET /api/schedule/sources 的選定項目複製 sourceType，並使用同一項目的 activationToken。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.activationToken=選定來源目前發布的 activationToken。重新發布後須重新讀取來源目錄和輸入結構。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.definition=來源定義為 JSON 物件。請依 OpenAPI 的 x-schedule-sources[sourceType].inputSchemaJson 填寫，也可以直接修改 examples[0]。緊湊 JSON 以 UTF-8 計算，上限為 1 MiB。請透過請求標頭傳送擷取憑證。 兩種表示來自同一份來源宣告。離線驗證時解析 x-schedule-sources[sourceType].inputSchemaJson，以整段 JSON 為根。驗證批次請求或產生 SDK 時，請以整份 OpenAPI 解析對應的 ScheduleDefinition 元件。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.proxy=可選的 host:port，例如 127.0.0.1:7890。空值使用全域代理。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.expectedRun=從目前批次詳情讀取 run 並原樣傳入。執行輪次已變更時傳回 409。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.workType=workId 對應的作品型別。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.workId=與 workType 配對的來源作品 ID，請原樣傳入字串。
ManualBatchController.credentials.PUT.body=指定要變更採集憑據的批次執行。
ManualBatchController.create.POST.body=批次名稱、來源定義和本次執行的代理設定。
ManualBatchController.resolve.POST.body=批次執行標識、待處理作品及處理決定。
parameter.id=提交手動批次時返回的 ID。
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.description=計劃能力的所屬方、外掛包及執行代次。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkKey.description=由 workType 與 id 組成的計劃作品標識。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.description=來源外掛缺席時仍可檢視的作品資訊。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.description=單個計劃作品的執行結果及實時狀態可用性。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.description=佇列中一部作品的標識、展示資訊和執行狀態。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkKey.field.id=來源擁有的不透明作品標識
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.title=標題
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.attributes=透過敏感欄位和大小校驗的展示屬性
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.attributes=執行結果的安全屬性
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.packageId=物理外掛包標識
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkKey.field.workType=作品型別的穩定機器標識
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.outcome=執行器回報的作品結果類別。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.author=作者
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.featurePluginId=功能外掛標識
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.pluginGeneration=非負的外掛代次
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.thumbnailReference=縮圖的安全引用；空值表示沒有縮圖
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.resultCode=執行器結果碼。例如已有下載時為 work.already-completed，對應 ALREADY_COMPLETED 與項目狀態 skipped-downloaded。擴充套件可回傳其他代碼。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.liveStatusAvailable=是否允許向同一作品執行器查詢安全實時狀態
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.userAction=對應原因碼的操作。DOWNLOAD_PATH_ACTION_REQUIRED 接受 TRUNCATE（截短名稱）、DEFAULT_NAME（使用簡短預設名稱）或 CANCEL（取消此作品）。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.rememberForRun=true 表示本次執行遇到相同原因可沿用此決定，false 僅套用於指定作品。
parameter.X-Acquisition-Credential=用於存取作品來源的擷取憑證，最長 16384 個字元。程式金鑰另以 Authorization 傳送。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.reasonCode=此作品目前等待人工處理的原因碼，須與待處理紀錄完全相符。
ManualBatchController.items.GET.parameter.limit=每次傳回 1–200 筆，超出範圍傳回 400。
ManualBatchController.items.GET.parameter.offset=從 0 起算的偏移量。負數傳回 400。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.id=本次手動批次的 UUID，後續操作放入路徑參數 id。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Items.field.items=依登記順序傳回的本輪作品佇列項目。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Items.field.total=此佇列或批次回報的作品項目總數。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.total=此佇列或批次回報的作品項目總數。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.status=pending 等待執行，paused 已暫停，downloaded 已下載，skipped-downloaded 已有完成紀錄，skipped-filter 已略過，failed 失敗。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.message=執行器或宿主記錄的附加狀態說明。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.sourceType=來源的標準 ID，建立時取自 GET /api/schedule/sources。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.key=作品的 workType 與不透明 workId 組合。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.presentation=此作品的非敏感顯示快照。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.workExecutorOwner=執行本作品的能力提供者或其確切發布實例。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.workExecutorPublicationId=執行本作品的能力提供者或其確切發布實例。
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.result=執行器產生的作品結果，尚無結果時為空。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Items.field.offset=目前頁面首筆紀錄的零基偏移量。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.name=建立時設定的批次顯示名稱。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.state=批次目前生命週期狀態。暫停或取消中仍會等待執行項目結束。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.code=沒有原因碼時為 null。請用 `state` 判斷批次狀態。來源或帳號原則外掛可能提供其他原因碼，遇到未知值時也依 `state` 處理。查詢 Pixiv 作者的作品清單時，若上游回傳 HTTP 404（例如作者帳號不存在或已註銷），原因碼為 `schedule.pixiv.discovery-not-found`。主程式原因碼：`batch.work-failed` 請檢查失敗項目；`batch.discovery-incomplete` 請繼續探索；`batch.work.capacity-exceeded` 請縮小來源範圍；`schedule.error.source-publication-changed` 或 `schedule.error.execution-capability-unavailable` 請檢查來源與執行器；`schedule.error.definition-invalid` 請檢查定義；`auth.program.forbidden` 請核對權限；`batch.dispatch-failed` 或 `batch.execution-failed` 請查看伺服器日誌。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.run=目前執行輪次。修改憑證或解決作品問題時依原值提交 expectedRun。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.createdTime=建立此批次的 Unix 毫秒時間。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.completed=已成功完成的作品項目數。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.skipped=被略過的作品項目數。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.failed=執行失敗的作品項目數。
guide=https://sywyar.github.io/PixivDownloader/#/zh-hant/batch-download
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.programPermission=本次執行中程式金鑰缺少的權限，可確定時傳回。
description=建立手動批次、檢查項目並控制執行。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.field=失敗欄位在請求本文中的 JSON Pointer。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.reason=與顯示語言無關的欄位驗證原因碼。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.retryAfterMillis=狀態為 RETRY_LATER 時，這是呼叫 resume 前建議等待的毫秒數。其他狀態為 null。
