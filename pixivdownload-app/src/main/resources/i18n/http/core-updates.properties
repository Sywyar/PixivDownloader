UpdateApiController.download.POST.summary=提交更新包下载任务
UpdateApiController.download.POST.description=排队下载指定通道的安装包。channel 接受 official（默认）或 nightly。接受后返回 202，进度通过 progress 读取。
UpdateApiController.download.POST.success=更新包下载任务。
UpdateApiController.progress.GET.summary=查看更新包下载进度
UpdateApiController.progress.GET.description=读取已接收和预期字节数、完成或失败状态，以及可用的安装包回执。尚无下载时返回 204。
UpdateApiController.progress.GET.success=更新包下载进度。
UpdateApiController.install.POST.summary=安装已下载的更新包
UpdateApiController.install.POST.description=提交进度回执中的 64 位十六进制 SHA-256，在 Windows x64 上启动对应的安装程序并退出应用。平台不支持或回执过期时返回 409。
UpdateApiController.install.POST.success=已下载的更新包。
parameter.channel=安装包渠道。省略时使用 official。仅接受小写 official、nightly，其他值返回 400。
parameter.force=即使已有结果，也强制重新执行。
