CollectionController.uploadIcon.POST.body=在 file 欄位中上傳收藏夾圖示。 在 cURL 範例中，`INSTANCE` 是執行個體的來源位址（含通訊協定及連接埠，結尾不加斜線），`PROGRAM_KEY` 是有權呼叫此操作的金鑰。 透過 `GET /api/collections` 取得 `COLLECTION_ID`，將 `icon.png` 換成要上傳的圖片。
parameter.id=要讀取或修改的收藏夾 ID。
