title=收藏夾
CollectionController.list.GET.summary=列出收藏夾
CollectionController.list.GET.description=返回撥用者可見的收藏夾。使用收藏夾 ID 可繼續管理圖示和作品。
CollectionController.list.GET.success=收藏夾。
CollectionController.create.POST.summary=建立收藏夾
CollectionController.create.POST.description=建立本機收藏夾並傳回配置的數字 ID，可同時指定下載根目錄。
CollectionController.create.POST.success=已建立收藏夾。
CollectionController.rename.PUT.summary=重新命名收藏夾
CollectionController.rename.PUT.description=重新命名收藏夾。下次下載時會將路徑中的名稱變數展開成新名稱，已下載的檔案保留在原處。
CollectionController.rename.PUT.success=已更新收藏夾。
CollectionController.updateDownloadRoot.PUT.summary=設定收藏夾下載目錄
CollectionController.updateDownloadRoot.PUT.description=適用於之後選用此收藏夾的下載。展開名稱時，路徑分隔符號等不安全字元會換成底線。
CollectionController.updateDownloadRoot.PUT.success=已儲存收藏夾下載目錄。
CollectionController.updateSortOrder.PUT.summary=設定收藏夾排序位置
CollectionController.updateSortOrder.PUT.description=列表依 `sortOrder` 遞增排序；相同時依收藏夾 ID 遞增。省略 `sortOrder` 或傳入 null 會設為 0。
CollectionController.updateSortOrder.PUT.success=已儲存收藏夾排序位置。
CollectionController.delete.DELETE.summary=刪除收藏夾
CollectionController.delete.DELETE.description=按數字 ID 刪除收藏夾，成功後返回空響應。
CollectionController.delete.DELETE.success=已移除收藏夾。
CollectionController.uploadIcon.POST.summary=上傳收藏夾圖示
CollectionController.uploadIcon.POST.description=透過 multipart 的 `file` 欄位上傳 PNG、JPEG 或 WebP，最多 1 MiB，寬高各不超過 2048 像素。上傳成功後取代原圖示。
CollectionController.uploadIcon.POST.success=已上傳收藏夾圖示。
CollectionController.clearIcon.DELETE.summary=清除收藏夾圖示
CollectionController.clearIcon.DELETE.description=移除自訂圖示並傳回收藏夾，介面恢復顯示預設圖示。
CollectionController.clearIcon.DELETE.success=已清除收藏夾圖示。
CollectionController.downloadIcon.GET.summary=檢視收藏夾圖示
CollectionController.downloadIcon.GET.description=傳回原始圖片位元組及其媒體類型。收藏夾、圖示記錄或檔案不存在時傳回 404。
CollectionController.downloadIcon.GET.success=收藏夾圖示。
CollectionController.addArtwork.POST.summary=新增插畫到收藏夾
CollectionController.addArtwork.POST.description=建立作品與收藏夾的關聯。新增關聯時 `added` 為 true，已存在時為 false。
CollectionController.addArtwork.POST.success=已新增插畫到收藏夾。
CollectionController.removeArtwork.DELETE.summary=移除收藏夾中的插畫
CollectionController.removeArtwork.DELETE.description=解除作品與收藏夾的關聯。`removed` 顯示是否實際移除關聯，磁碟上的作品檔案會保留。
CollectionController.removeArtwork.DELETE.success=已移除收藏夾中的插畫。
CollectionController.collectionsOf.GET.summary=列出插畫所屬收藏夾
CollectionController.collectionsOf.GET.description=編輯收藏夾歸屬前，可先查詢作品已經加入了哪些收藏夾。
CollectionController.collectionsOf.GET.success=插畫所屬收藏夾。
CollectionController.memberships.POST.summary=查詢多幅插畫的收藏夾歸屬
CollectionController.memberships.POST.description=以作品 ID 的十進位字串為鍵，傳回收藏夾 ID 陣列。沒有可見關聯時可能省略該鍵。受邀訪客每次可傳入最多 500 個正 ID。
CollectionController.memberships.POST.success=多幅插畫的收藏夾歸屬。
CollectionController.addNovel.POST.summary=新增小說到收藏夾
CollectionController.addNovel.POST.description=建立作品與收藏夾的關聯。新增關聯時 `added` 為 true，已存在時為 false。
CollectionController.addNovel.POST.success=已新增小說到收藏夾。
CollectionController.removeNovel.DELETE.summary=移除收藏夾中的小說
CollectionController.removeNovel.DELETE.description=解除作品與收藏夾的關聯。`removed` 顯示是否實際移除關聯，磁碟上的作品檔案會保留。
CollectionController.removeNovel.DELETE.success=已移除收藏夾中的小說。
CollectionController.novelCollectionsOf.GET.summary=列出小說所屬收藏夾
CollectionController.novelCollectionsOf.GET.description=編輯收藏夾歸屬前，可先查詢作品已經加入了哪些收藏夾。
CollectionController.novelCollectionsOf.GET.success=小說所屬收藏夾。
CollectionController.novelMemberships.POST.summary=查詢多篇小說的收藏夾歸屬
CollectionController.novelMemberships.POST.description=以作品 ID 的十進位字串為鍵，傳回收藏夾 ID 陣列。沒有可見關聯時可能省略該鍵。受邀訪客每次可傳入最多 500 個正 ID。
CollectionController.novelMemberships.POST.success=多篇小說的收藏夾歸屬。
CollectionController.uploadIcon.POST.body.field.file=用作收藏夾圖示的圖片。
parameter.novelId=Pixiv 小說 ID。
parameter.artworkId=Pixiv 作品 ID。
schema.top.sywyar.pixivdownload.collection.request.CollectionRenameRequest.title=收藏夾新名稱
schema.top.sywyar.pixivdownload.collection.request.CollectionRenameRequest.field.name=收藏夾名稱。去除前後空白後須非空、唯一，最多 40 個 UTF-16 碼元。
CollectionController.rename.PUT.body=收藏夾新名稱
schema.top.sywyar.pixivdownload.collection.CollectionController.SortOrderRequest.title=收藏夾列表位置
schema.top.sywyar.pixivdownload.collection.CollectionController.SortOrderRequest.field.sortOrder=清單排序值，較小的排在前面。更新時省略或傳 null 會設為 0。
CollectionController.updateSortOrder.PUT.body=收藏夾列表位置
schema.top.sywyar.pixivdownload.collection.request.CollectionDownloadRootRequest.title=收藏夾下載目錄
schema.top.sywyar.pixivdownload.collection.request.CollectionDownloadRootRequest.field.downloadRoot=此收藏夾的下載根目錄。空值使用預設目錄。相對路徑和單斜線開頭的路徑以 `download.root-folder` 為基準。可用變數：{collectionRootVariables}。例如名稱為 Favorites 時，`albums/{collection_name}` 展開為 `albums/Favorites`，其他大括號文字保留原樣。 去除前後空白後最多 500 個 UTF-16 碼元，不接受控制字元。相對路徑必須留在根目錄內。伺服器識別的絕對路徑依原位置解析。
CollectionController.updateDownloadRoot.PUT.body=收藏夾下載目錄
schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.title=新收藏夾
schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.field.name=收藏夾名稱。去除前後空白後須非空、唯一，最多 40 個 UTF-16 碼元。
schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.field.downloadRoot=此收藏夾的下載根目錄。空值使用預設目錄。相對路徑和單斜線開頭的路徑以 `download.root-folder` 為基準。可用變數：{collectionRootVariables}。例如名稱為 Favorites 時，`albums/{collection_name}` 展開為 `albums/Favorites`，其他大括號文字保留原樣。 去除前後空白後最多 500 個 UTF-16 碼元，不接受控制字元。相對路徑必須留在根目錄內。伺服器識別的絕對路徑依原位置解析。
