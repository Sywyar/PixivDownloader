title=手動バッチ
ManualBatchController.create.POST.summary=手動ダウンロードバッチを開始
ManualBatchController.create.POST.description=有効な取得元を指定してバックグラウンドのダウンロードバッチを開始します。
ManualBatchController.create.POST.details=`GET /api/schedule/sources` の同じ項目から `sourceType`、`activationToken`、`inputSchemaJson` を取得し、そのスキーマに従って `definition` を JSON オブジェクトで送信します。プログラムキーには一覧取得用の `core:schedule.sources.read`、作成用の `core:batches.create` と取得元プラグインの `batches.execute`、作品の処理には該当する実行プラグインの `batches.execute` が必要です。本文は最大 8 MiB、シリアライズした定義は最大 1 MiB です。取得用の認証情報はリクエストヘッダーで渡します。\n\n\
    `202` 応答にはバッチの `id` が含まれます。`Location` を `GET` して `state` と `code` を確認し、その配下の `/items` で作品をページごとに取得します。プログラムは作成時のキーと `core:batches.read` を使用します。定義の検証、認証情報の関連付け、作品の検出と実行はバックグラウンドで行います。定義が無効な場合は失敗します。取得元が再公開されるとバッチは保留になり、最新の一覧から新しいバッチを作成する必要があります。 バッチ受理後、ワーカーは今回の計画で使う実行器の `batches.execute` 権限を確認します。照会結果の `code` が `auth.program.forbidden` の場合、同じ応答の `programPermission` で特定できた不足権限 ID を確認できます。\n\n\
    プロセスごとに保持できる手動バッチは一つです。異なる作品は最大 5,000 件、項目に割り当てる容量は 64 MiB までで、超過すると `batch.work.capacity-exceeded` が返ります。一時停止またはキャンセル後はその回の終了を待ちます。`resume` は完了済みとスキップ済みの項目を保ったまま取得元を再走査し、`retry` は検出済みの失敗・一時停止項目だけを再試行します。次のバッチを作成する前に停止済みの記録を削除します。プロセス終了時にバッチ記録は消えますが、保存済みのファイルとライブラリ登録は残ります。
ManualBatchController.create.POST.success=バッチを受理しました。作成したキーと `core:batches.read` 権限で `Location` を GET し、`state` と `code` を確認してください。実行権限が不足した場合は `programPermission` から権限 ID を読みます。
ManualBatchController.create.POST.response.400=JSON、名前、ソース、アクティベーショントークン、定義、プロキシ、認証情報ヘッダーが無効な場合は INVALID_TOOL_REQUEST を返します。ソース定義はバッチ作成前に検証されます。対象項目を特定できる場合は field と reason（例 /definition/source/acquisitionMode と required）を返します。実行結果はバッチの状態で確認できます。
ManualBatchController.create.POST.response.404=プログラムキーが指定したソースを利用できません（batch.not-found）。ソース一覧を再取得してください。
ManualBatchController.create.POST.response.409=既にバッチが存在する（batch.exists）か、サービスが停止中です（batch.stopping）。既存バッチは停止して削除してください。
ManualBatchController.create.POST.response.413=JSON 本文が 8 MiB を超えています（HTTP_BODY_LIMIT）。
ManualBatchController.create.POST.response.500=作成時にデータベースを利用できないか、分類されていない状態エラーが発生しました（batch.operation-failed）。本文の読み取り失敗は error.io です。
ManualBatchController.current.GET.summary=現在のバッチを取得
ManualBatchController.current.GET.description=このプロセスが保持しているバッチを返します。呼び出し元が参照できるバッチがなければ 204 です。再起動すると記録は失われます。
ManualBatchController.current.GET.success=現在のバッチ。
ManualBatchController.get.GET.summary=バッチの詳細を取得
ManualBatchController.get.GET.description=作成時の UUID で状態、run、理由コード、件数を取得します。プログラムキーが参照できるのは自分のバッチのみで、別のキーでは 404 です。
ManualBatchController.get.GET.success=バッチの詳細。
ManualBatchController.get.GET.response.404=この UUID のバッチは存在しないか、別のプログラム ID に属しています（batch.not-found）。
ManualBatchController.items.GET.summary=バッチの項目をページ単位で取得
ManualBatchController.items.GET.description=検出順の作品状態と結果を offset（0 始まり）と limit（1～200）で取得します。作品はバッチ UUID、workType、id の組で特定します。
ManualBatchController.items.GET.success=バッチの項目。
ManualBatchController.items.GET.response.400=offset が負か、limit が 1～200 の範囲外です（INVALID_TOOL_REQUEST）。
ManualBatchController.items.GET.response.404=この UUID のバッチは存在しないか、別のプログラム ID に属しています（batch.not-found）。
ManualBatchController.pause.POST.summary=バッチを一時停止
ManualBatchController.pause.POST.description=進捗を保持して一時停止を要求します。PAUSING は処理の終了待ちです。PAUSED を確認してから resume を呼びます。
ManualBatchController.pause.POST.success=バッチを一時停止しました。
ManualBatchController.pause.POST.response.404=この UUID のバッチは存在しないか、別のプログラム ID に属しています（batch.not-found）。
ManualBatchController.cancel.POST.summary=バッチをキャンセル
ManualBatchController.cancel.POST.description=今回の実行を中止します。CANCELLING 中は終了処理中です。状態を再取得して停止を確認します。記録は削除するまで残ります。
ManualBatchController.cancel.POST.success=バッチ。
ManualBatchController.cancel.POST.response.404=この UUID のバッチは存在しないか、別のプログラム ID に属しています（batch.not-found）。
ManualBatchController.resume.POST.summary=バッチを再開
ManualBatchController.resume.POST.description=待機中で未完了のバッチを再開します。取得元を再走査し、完了・スキップ済みの項目を保持します。run は増加します。
ManualBatchController.resume.POST.success=バッチを再開しました。
ManualBatchController.resume.POST.response.404=バッチが存在しない、別のプログラム ID に属する、またはプログラムキーがソースを利用できません（batch.not-found）。
ManualBatchController.resume.POST.response.409=バッチが実行中・完了済み、またはサービスが停止中です（batch.not-idle）。
ManualBatchController.retry.POST.summary=失敗したバッチ項目を再試行
ManualBatchController.retry.POST.description=検出済みの失敗作品だけを再試行します。取得元の走査は再開しません。バッチが待機中で再試行対象がある場合のみ実行でき、条件を満たさないと 409 です。
ManualBatchController.retry.POST.success=失敗したバッチ項目。
ManualBatchController.retry.POST.response.404=バッチが存在しない、別のプログラム ID に属する、またはプログラムキーがソースを利用できません（batch.not-found）。
ManualBatchController.retry.POST.response.409=次の実行を開始できない（batch.not-idle）か、再試行できる失敗作品がありません（batch.no-failed-work）。
ManualBatchController.credentials.PUT.summary=バッチの取得用認証情報を更新
ManualBatchController.credentials.PUT.description=待機中で未完了のバッチに、現在の run を expectedRun として送信します。X-Acquisition-Credential で認証情報を置換し、省略すると消去します。次回は取得元を再準備します。
ManualBatchController.credentials.PUT.success=バッチの取得用認証情報を更新しました。
ManualBatchController.credentials.PUT.response.400=JSON リクエストまたは取得用認証情報のヘッダーが不正です（INVALID_TOOL_REQUEST）。
ManualBatchController.credentials.PUT.response.404=この UUID のバッチは存在しないか、別のプログラム ID に属しています（batch.not-found）。
ManualBatchController.credentials.PUT.response.409=expectedRun が現在の回と異なる、バッチが実行中・完了済み、またはサービスが停止中です（batch.not-idle）。バッチを再取得してください。
ManualBatchController.credentials.PUT.response.413=JSON 本文が 16 KiB を超えています（HTTP_BODY_LIMIT）。
ManualBatchController.resolve.POST.summary=保留中のバッチ項目に対応
ManualBatchController.resolve.POST.description=停止後、現在の run、作品識別子、元の reasonCode と判断を送ります。対象は手動判断待ちの項目のみです。保存後は resume または retry で実行します。
ManualBatchController.resolve.POST.success=保留中のバッチ項目。
ManualBatchController.resolve.POST.response.400=JSON、作品の識別情報または userAction の形式が不正です（INVALID_TOOL_REQUEST）。
ManualBatchController.resolve.POST.response.404=この UUID のバッチは存在しないか、別のプログラム ID に属しています（batch.not-found）。
ManualBatchController.resolve.POST.response.409=バッチが実行中か expectedRun が古い（batch.not-idle）、または作品、reasonCode、操作待ちの状態が一致しません（batch.action-changed）。
ManualBatchController.resolve.POST.response.413=JSON 本文が 16 KiB を超えています（HTTP_BODY_LIMIT）。
ManualBatchController.delete.DELETE.summary=バッチ記録を削除
ManualBatchController.delete.DELETE.description=停止済みバッチの記録を削除し、取得用認証情報を解放します。その後、新しいバッチを作成できます。実行中は 409 です。
ManualBatchController.delete.DELETE.success=バッチ記録を削除しました。
ManualBatchController.delete.DELETE.response.404=この UUID のバッチは存在しないか、別のプログラム ID に属しています（batch.not-found）。
ManualBatchController.delete.DELETE.response.409=バッチが実行中または停止処理中です（batch.not-idle）。停止後に削除してください。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Credentials.field.expectedRun=現在のバッチ詳細から run をそのまま渡します。実行回が変わっていれば 409 です。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.name=バッチの表示名。1～200 文字で、制御文字と空白のみの名前は使用できません。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.sourceType=GET /api/schedule/sources の選択した項目の sourceType と、同じ項目の activationToken を使います。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.activationToken=選択した取得元の現在の activationToken。再公開後はカタログと入力スキーマを再取得します。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.definition=取得元の定義を JSON オブジェクトで渡します。OpenAPI の x-schedule-sources[sourceType].inputSchemaJson を参照し、examples[0] を編集して使えます。空白を省いた JSON の上限は UTF-8 で 1 MiB です。取得用の認証情報はヘッダーに指定します。 どちらも同じ提供元の宣言から生成されます。単独で検証する場合は x-schedule-sources[sourceType].inputSchemaJson 全体をルートとして解析してください。バッチの検証や SDK 生成には、OpenAPI 文書全体を基準に対応する ScheduleDefinition を解決してください。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.proxy=任意の host:port（例：127.0.0.1:7890）。空値は全体設定のプロキシを使用します。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.expectedRun=現在のバッチ詳細から run をそのまま渡します。実行回が変わっていれば 409 です。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.workType=workId が示す作品の種類。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.workId=workType と組み合わせる取得元の作品 ID。元の文字列をそのまま渡します。
ManualBatchController.credentials.PUT.body=取得用認証情報を変更するバッチの実行を指定します。
ManualBatchController.create.POST.body=バッチ名、取得元の定義、この実行のプロキシ。
ManualBatchController.resolve.POST.body=実行識別子、保留中の作品、その処理方法。
parameter.id=手動バッチの送信時に返された ID。
