schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.state=バッチの現在状態。一時停止・キャンセル中は実行中項目の完了を待つ場合があります。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.code=理由コードがない場合は null です。バッチの状態は `state` で判定します。取得元やアカウントポリシーのプラグインが未知のコードを返した場合も同様です。Pixiv の作者別作品一覧を取得する際に HTTP 404 が返ると、理由コードは `schedule.pixiv.discovery-not-found` になります。作者のアカウントが存在しない場合や、作者が退会した場合などが該当します。`batch.work-failed` では失敗した項目を確認し、`batch.discovery-incomplete` では探索を再開してください。`batch.work.capacity-exceeded` では対象を絞ります。`schedule.error.source-publication-changed` と `schedule.error.execution-capability-unavailable` では取得元と実行機能、`schedule.error.definition-invalid` では定義、`auth.program.forbidden` では権限を確認します。`batch.dispatch-failed` または `batch.execution-failed` の場合はサーバーログを確認してください。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.run=現在の実行回。認証情報変更や項目解決時は expectedRun として転記。
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.createdTime=バッチ作成時刻（Unix ミリ秒）。
