schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.userAction=理由コードに対応する操作です。DOWNLOAD_PATH_ACTION_REQUIRED の場合は TRUNCATE（名前を短縮）、DEFAULT_NAME（短い既定名を使用）、CANCEL（この作品を中止）から選びます。
