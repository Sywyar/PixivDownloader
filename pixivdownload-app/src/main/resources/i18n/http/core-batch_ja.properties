schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.outcome=作品の実行側が返す結果区分。
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.author=作者または開発者の表示名
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.featurePluginId=機能を提供するプラグイン ID
schema.top.sywyar.pixivdownload.plugin.api.schedule.capability.ScheduleCapabilityOwner.field.pluginGeneration=0 以上のプラグイン世代番号
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.thumbnailReference=サムネイルの参照。未提供時は null
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.resultCode=実行側の結果コード。既に完了したダウンロードは work.already-completed、結果区分 ALREADY_COMPLETED、項目状態 skipped-downloaded になります。拡張機能は別のコードも返せます。
