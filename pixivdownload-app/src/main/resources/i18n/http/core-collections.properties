title=收藏夹
CollectionController.list.GET.summary=列出收藏夹
CollectionController.list.GET.description=返回调用者可见的收藏夹。使用收藏夹 ID 可继续管理图标和作品。
CollectionController.list.GET.success=收藏夹。
CollectionController.create.POST.summary=创建收藏夹
CollectionController.create.POST.description=创建本地收藏夹并返回分配的数字 ID。可在创建时指定此收藏夹的下载根目录。
CollectionController.create.POST.success=已创建收藏夹。
CollectionController.rename.PUT.summary=重命名收藏夹
CollectionController.rename.PUT.description=更新名称并返回收藏夹。使用名称变量的下载目录将在下次下载时展开新名称，已下载文件保持在原位置。
CollectionController.rename.PUT.success=已更新收藏夹。
CollectionController.updateDownloadRoot.PUT.summary=设置收藏夹下载目录
CollectionController.updateDownloadRoot.PUT.description=影响后续选用此收藏夹的下载。路径中引用收藏夹名称时，下载时会将名称中的路径分隔符等不安全字符替换成下划线。
CollectionController.updateDownloadRoot.PUT.success=已保存收藏夹下载目录。
CollectionController.updateSortOrder.PUT.summary=设置收藏夹排序位置
CollectionController.updateSortOrder.PUT.description=列表先按 `sortOrder` 升序，再按收藏夹 ID 升序排列。省略 `sortOrder` 或传 null 会将其设为 0。
CollectionController.updateSortOrder.PUT.success=已保存收藏夹排序位置。
CollectionController.delete.DELETE.summary=删除收藏夹
CollectionController.delete.DELETE.description=按数字 ID 删除收藏夹，成功后返回空响应。
CollectionController.delete.DELETE.success=已移除收藏夹。
CollectionController.uploadIcon.POST.summary=上传收藏夹图标
CollectionController.uploadIcon.POST.description=通过 multipart 的 `file` 字段上传 PNG、JPEG 或 WebP，最多 1 MiB，宽高各不超过 2048 像素。成功后替换原图标。
CollectionController.uploadIcon.POST.success=已上传收藏夹图标。
CollectionController.clearIcon.DELETE.summary=清除收藏夹图标
CollectionController.clearIcon.DELETE.description=移除自定义图标并返回收藏夹，界面恢复显示默认图标。
CollectionController.clearIcon.DELETE.success=已清除收藏夹图标。
CollectionController.downloadIcon.GET.summary=查看收藏夹图标
CollectionController.downloadIcon.GET.description=返回原始图片字节和对应的图片媒体类型。收藏夹、图标记录或图标文件不存在时返回 404。
CollectionController.downloadIcon.GET.success=收藏夹图标。
CollectionController.addArtwork.POST.summary=添加插画到收藏夹
CollectionController.addArtwork.POST.description=创建作品与收藏夹的关联。`added` 表示本次是否新增了关联；重复添加返回 `false`。
CollectionController.addArtwork.POST.success=已添加插画到收藏夹。
CollectionController.removeArtwork.DELETE.summary=移除收藏夹中的插画
CollectionController.removeArtwork.DELETE.description=解除作品与收藏夹的关联。`removed` 表示本次是否移除了关联，磁盘上的作品文件保留。
CollectionController.removeArtwork.DELETE.success=已移除收藏夹中的插画。
CollectionController.collectionsOf.GET.summary=列出插画所属收藏夹
CollectionController.collectionsOf.GET.description=编辑收藏夹归属前，可先查询作品已经加入了哪些收藏夹。
CollectionController.collectionsOf.GET.success=插画所属收藏夹。
CollectionController.memberships.POST.summary=查询多幅插画的收藏夹归属
CollectionController.memberships.POST.description=按作品 ID 返回收藏夹 ID 数组。响应对象的键为作品 ID 的十进制字符串。没有可见关联时该键可能省略。邀请访客每次最多传 500 个正 ID。
CollectionController.memberships.POST.success=多幅插画的收藏夹归属。
CollectionController.addNovel.POST.summary=添加小说到收藏夹
CollectionController.addNovel.POST.description=创建作品与收藏夹的关联。`added` 表示本次是否新增了关联；重复添加返回 `false`。
CollectionController.addNovel.POST.success=已添加小说到收藏夹。
CollectionController.removeNovel.DELETE.summary=移除收藏夹中的小说
CollectionController.removeNovel.DELETE.description=解除作品与收藏夹的关联。`removed` 表示本次是否移除了关联，磁盘上的作品文件保留。
CollectionController.removeNovel.DELETE.success=已移除收藏夹中的小说。
CollectionController.novelCollectionsOf.GET.summary=列出小说所属收藏夹
CollectionController.novelCollectionsOf.GET.description=编辑收藏夹归属前，可先查询作品已经加入了哪些收藏夹。
CollectionController.novelCollectionsOf.GET.success=小说所属收藏夹。
CollectionController.novelMemberships.POST.summary=查询多篇小说的收藏夹归属
CollectionController.novelMemberships.POST.description=按作品 ID 返回收藏夹 ID 数组。响应对象的键为作品 ID 的十进制字符串。没有可见关联时该键可能省略。邀请访客每次最多传 500 个正 ID。
CollectionController.novelMemberships.POST.success=多篇小说的收藏夹归属。
CollectionController.uploadIcon.POST.body.field.file=用作收藏夹图标的图片。
parameter.novelId=Pixiv 小说 ID。
parameter.artworkId=Pixiv 作品 ID。
schema.top.sywyar.pixivdownload.collection.request.CollectionRenameRequest.title=收藏夹新名称
schema.top.sywyar.pixivdownload.collection.request.CollectionRenameRequest.field.name=收藏夹名称。去除首尾空格后须非空、唯一，最多 40 个 UTF-16 代码单元。
CollectionController.rename.PUT.body=收藏夹新名称
schema.top.sywyar.pixivdownload.collection.CollectionController.SortOrderRequest.title=收藏夹列表位置
schema.top.sywyar.pixivdownload.collection.CollectionController.SortOrderRequest.field.sortOrder=列表排序值，较小的排在前面；更新时省略或传 null 取 0。
CollectionController.updateSortOrder.PUT.body=收藏夹列表位置
schema.top.sywyar.pixivdownload.collection.request.CollectionDownloadRootRequest.title=收藏夹下载目录
schema.top.sywyar.pixivdownload.collection.request.CollectionDownloadRootRequest.field.downloadRoot=此收藏夹的下载根目录。空值使用默认目录。相对路径和单斜杠开头的路径从 `download.root-folder` 解析。可用变量：{collectionRootVariables}。例如名称为 Favorites 时，`albums/{collection_name}` 展开为 `albums/Favorites`；其他花括号文本保留原样。 去除首尾空白后最多 500 个 UTF-16 代码单元，禁止控制字符。相对路径须留在根目录内。服务器识别的绝对路径按原位置解析。
CollectionController.updateDownloadRoot.PUT.body=收藏夹下载目录
schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.title=新收藏夹
schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.field.name=收藏夹名称。去除首尾空格后须非空、唯一，最多 40 个 UTF-16 代码单元。
schema.top.sywyar.pixivdownload.collection.request.CollectionCreateRequest.field.downloadRoot=此收藏夹的下载根目录。空值使用默认目录。相对路径和单斜杠开头的路径从 `download.root-folder` 解析。可用变量：{collectionRootVariables}。例如名称为 Favorites 时，`albums/{collection_name}` 展开为 `albums/Favorites`；其他花括号文本保留原样。 去除首尾空白后最多 500 个 UTF-16 代码单元，禁止控制字符。相对路径须留在根目录内。服务器识别的绝对路径按原位置解析。
CollectionController.create.POST.body=新收藏夹
schema.top.sywyar.pixivdownload.collection.CollectionController.NovelMembershipsRequest.title=要查询的小说
schema.top.sywyar.pixivdownload.collection.CollectionController.NovelMembershipsRequest.field.novelIds=要处理的 Pixiv 小说 ID 列表。
CollectionController.novelMemberships.POST.body=要查询的小说
schema.top.sywyar.pixivdownload.collection.CollectionController.ArtworkMembershipsRequest.title=要查询的插画
schema.top.sywyar.pixivdownload.collection.CollectionController.ArtworkMembershipsRequest.field.artworkIds=要处理的 Pixiv 插画 ID 列表。
CollectionController.memberships.POST.body=要查询的插画
CollectionController.uploadIcon.POST.body=在 file 字段中上传收藏夹图标。 在 cURL 示例中，`INSTANCE` 是实例的源地址（含协议及端口，末尾不加斜杠），`PROGRAM_KEY` 是拥有本操作权限的密钥。 从 `GET /api/collections` 取得 `COLLECTION_ID`，将 `icon.png` 换成要上传的图片。
parameter.id=要读取或修改的收藏夹 ID。
