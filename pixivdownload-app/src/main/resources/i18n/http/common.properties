operation.details=详细信息

permissionGrammar.description=本目录解释操作上的 `x-program-permissions`。按实际请求、目标和执行计划解析已列出的条件。操作还可能在自身说明中列出其他业务权限。
permissionGrammar.phase.route=当前 HTTP 方法和路径入口检查的完整权限 ID，与该操作的 `x-program-permission` 相同。有效密钥缺权时，当前 HTTP 403 响应会指出所需权限。
permissionGrammar.phase.discovery=获取当前来源令牌等输入时，调用 `operation` 并使用其 `permission`。缺权由这个查询请求报告。
permissionGrammar.phase.submit=当前请求的附加检查数组。所有适用项都要满足。带 `effect: filter` 的项控制列表可见性，其余缺权从当前请求的 `reportedIn` 读取。
permissionGrammar.phase.execution=批次受理后，后台复核来源权限，并检查本次计划选用的作品类型所需权限。用 `reportedIn.operation` 查询批次结果。
permissionGrammar.expression=`#` 左侧选择下列上下文对象，右侧是从该对象根开始的 RFC 6901 JSON Pointer。例如 `task#/sourceOwnerPluginId` 读取已有任务的 `sourceOwnerPluginId`。 在字段名中用 `~0` 表示 `~`，用 `~1` 表示 `/`。
permissionGrammar.context.request=当前操作提交的 JSON 请求体。
permissionGrammar.context.query=当前请求的 URL 查询参数，以参数名为键。
permissionGrammar.context.task=当前路径 `{id}` 指向的已有定时任务。
permissionGrammar.context.batch=当前路径 `{id}` 指向的已有手动批次。恢复和重试从该批次读取来源类型。
permissionGrammar.context.item=列表过滤前正在判断的单个候选项。
permissionGrammar.field.permission=完整权限 ID，例如 `core:credentials.use`。在 `discovery` 或 `reportedIn` 中，它授予调用对应 `operation` 的权限。
permissionGrammar.field.ownerFrom=用上下文表达式读取权限所属的 owner，与 `permissionId` 组合。
permissionGrammar.field.permissionId=局部权限名。完整 ID 为 `ownerFrom` 解析出的值、冒号和该名称，例如 `download-workbench:schedule.manage`。
permissionGrammar.field.header=请求使用这个标头时，额外要求同一项中的 `permission`。
permissionGrammar.field.effect=`filter` 表示逐项检查。缺权项从结果中省略，列表请求可正常成功。
permissionGrammar.field.catalog=从当前 OpenAPI 文档根解析 `#/…` JSON Pointer 片段得到目录。用 `key`、`keyFrom`、`value` 三者之一选中目录项，再读取 `field`。
permissionGrammar.field.key=用当前 JSON 请求体中这个顶层字段的值索引目录。
permissionGrammar.field.keyFrom=执行上下文表达式，用所得值索引目录，例如 `batch#/sourceType`。
permissionGrammar.field.value=直接用这个固定值索引目录。
permissionGrammar.field.field=选中目录项的属性名。从中读取完整权限 ID。有 `keyedBy` 时，该属性是权限映射表。
permissionGrammar.field.keyedBy=`workType` 表示用本次执行计划实际需要的每个作品类型查 `field` 映射，各取一个完整权限 ID。
permissionGrammar.field.recheckField=同一目录项中另一个属性的名称。后台还会复核该属性里的完整来源权限 ID，例如 `batchSubmitPermission` 对应的权限。
permissionGrammar.field.reportedIn=指定读取诊断的位置。省略 `operation` 时读取当前请求的响应体。指定时读取该操作的响应体。两种情况下，`pointer` 和 `codePointer` 都从对应 JSON 响应体的根开始。
permissionGrammar.field.operation=HTTP 方法与路径模板。查询已受理的批次时，202 响应的 `Location` 提供该批次的具体地址。
permissionGrammar.field.status=上述响应的 HTTP 状态码。轮询返回 200 表示读取批次成功，批次运行状态见响应体的 `state`。
permissionGrammar.field.pointer=从响应体根读取缺失权限 ID 的 RFC 6901 JSON Pointer。只有服务端能确定权限时才有具体值。
permissionGrammar.field.codePointer=从同一响应体根读取原因码的 JSON Pointer。对批次先看 `state`，再读原因码。若为 `auth.program.forbidden`，用 `pointer` 读取已知的缺失权限 ID。
parameter.Range=请求文件的字节范围，如 bytes=0-99。
parameter.If-Modified-Since=填入上次响应的 Last-Modified，文件未修改时返回 304。
response.206=返回请求的文件片段。多个范围以 multipart/byteranges 返回，每段带有自己的 Content-Range。
header.contentRange.single=单段响应的起止字节和文件总长度。
parameter.If-None-Match=填入上次响应的 ETag，当前返回的文件版本与其匹配时返回 304。
response.304=客户端缓存的文件仍有效，响应体为空。
response.416=无法满足 Range。响应体为空，Content-Range 以 bytes */长度 给出文件总长度。
permissionGrammar.field.when=仅当 keyFrom 指向的 JSON 值等于 value 时才需要此权限。 省略 value 时，keyFrom 指向的值存在且非 null 即需授权。
link.inspectArchive=响应含 archiveToken 时，可凭 core:archives.read 查询归档状态。
link.downloadArchive=状态为 ready 时，凭 core:archives.download 下载归档。
schema.top.sywyar.pixivdownload.web.RequestFieldError.description=可定位输入字段的错误，包含机器码、说明、字段路径和原因。
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.field=失败字段在请求体中的 JSON Pointer。
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.reason=与显示语言无关的字段校验原因码。
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.code=稳定的错误机器码，可用于程序判断失败原因。
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.error=当前请求语言下的错误说明，用于显示。
response.406=Accept 与可用的响应类型不匹配。响应体为空。
binding.part=缺少必填文件时，field 给出文件分段的名称。
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.in=参数所在的位置。
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.field=路径、查询、请求头或表单分段的名称。请求体字段使用 JSON Pointer。
schema.top.sywyar.pixivdownload.gui.ToolApiRequests.InvalidRequest.field.reason=供程序判断的校验原因，例如 required（缺失）、type（类型错误）或 invalid_value（无效值）。
schema.top.sywyar.pixivdownload.web.RequestFieldError.field.in=输入字段位于 JSON 请求体时，值为 body。
