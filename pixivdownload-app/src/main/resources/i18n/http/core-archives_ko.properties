ArchiveController.initQuota.POST.success=다운로드 할당량을 초기화했습니다.
ArchiveController.triggerPack.POST.summary=현재 할당량 사용자로 받은 다운로드 폴더 압축
ArchiveController.triggerPack.POST.description=POST /api/quota/init에서 받은 쿠키로 다운로드한 폴더를 압축합니다. 대상이 없으면 204, 횟수 제한에 도달하면 429를 반환합니다.
ArchiveController.triggerPack.POST.success=작품 압축 작업.
ArchiveController.triggerAdminPack.POST.summary=작품 압축 작업 시작
ArchiveController.triggerAdminPack.POST.description=artworkIds를 보냅니다. 등록 정보나 폴더가 없는 작품을 건너뛰고 같은 폴더는 한 번만 압축합니다. 대상이 없으면 204, 있으면 token과 유효 시간을 초로 반환합니다.
ArchiveController.triggerAdminPack.POST.success=작품 압축 작업.
ArchiveController.listAdminArchives.GET.summary=작품 아카이브 목록 조회
ArchiveController.listAdminArchives.GET.description=관리자가 만든 압축 목록을 조회합니다. 반환된 token으로 상태를 확인하거나 파일을 받습니다.
ArchiveController.listAdminArchives.GET.success=작품 아카이브.
ArchiveController.archiveStatus.GET.summary=압축 진행률 조회
ArchiveController.archiveStatus.GET.description=압축 요청의 token으로 상태를 조회합니다. ready가 되면 /api/archive/download/{token}을 호출합니다. 알 수 없거나 만료된 토큰은 200과 {"status":"expired"}를 반환하며 token과 expireSeconds는 생략됩니다.
ArchiveController.archiveStatus.GET.success=압축 진행률.
ArchiveController.downloadArchive.GET.summary=작품 아카이브 다운로드
ArchiveController.downloadArchive.GET.description=ZIP 첨부 파일을 반환합니다. 준비 중이면 202, token이 유효하지 않으면 410, 준비된 파일이 없으면 404입니다.
ArchiveController.downloadArchive.GET.success=작품 아카이브.
