title=Downloaded artworks
AuthorController.getAuthors.GET.summary=List authors of saved works
AuthorController.getAuthors.GET.description=Lists visible local authors. Use /api/authors/paged for search, sorting and pagination.
AuthorController.getAuthors.GET.success=Authors of saved works.
AuthorController.getPagedAuthors.GET.summary=Browse authors
AuthorController.getPagedAuthors.GET.description=page starts at 0 and size is clamped to 1–200. sort supports name, artworks and authorId. Unknown sorts use name.
AuthorController.getPagedAuthors.GET.success=Authors.
WorkAssetFileController.getThumbnail.GET.summary=Get an artwork thumbnail
WorkAssetFileController.getThumbnail.GET.description=Reads a local thumbnail by artworkId and page. cover selects a cover thumbnail and size selects the requested dimensions. Prefer GET /api/downloaded/thumbnail/{artworkId}/{page}. GET /api/downloaded/thumbnail-file/{artworkId}/{page} is an alias. Both process the same cover and size values identically.
WorkAssetFileController.getThumbnail.GET.success=Artwork thumbnail.
WorkAssetFileController.getImage.GET.summary=Get an artwork image
WorkAssetFileController.getImage.GET.description=Returns an image suitable for display. When the original page is a ZIP, returns its thumbnail. Use rawfile for the ZIP itself.
WorkAssetFileController.getImage.GET.success=Artwork image.
WorkAssetFileController.getRawFile.GET.summary=Download the original artwork file
WorkAssetFileController.getRawFile.GET.description=Reads the locally stored file for a zero-based page. Prefers the retained original (including ZIP). When only converted output exists, returns an available local format. A program key needs core:assets.export.
WorkAssetFileController.getRawFile.GET.success=Original artwork file.
DownloadedWorkController.getDownloaded.GET.summary=Get a downloaded artwork
DownloadedWorkController.getDownloaded.GET.description=Read the local download record by artwork ID. Set verifyFiles to true to check the files as well. It defaults to false. Returns 400 when no record is available. With a program key, use /api/library/artworks/{artworkId}. The corresponding /api/downloaded route uses the local access policy.
DownloadedWorkController.getDownloaded.GET.success=Downloaded artwork.
DownloadedWorkController.recoverMetadata.POST.summary=Fill missing artwork fields from supplied values
DownloadedWorkController.recoverMetadata.POST.description=Supply at least one usable field. Existing values are preserved. New records require the page count and all files. To retrieve Pixiv metadata, tags and series, use POST /api/tools/backfill/tasks. With a program key, use /api/library/artworks/{artworkId}/recover-metadata. The corresponding /api/downloaded route uses the local access policy.
DownloadedWorkController.recoverMetadata.POST.success=Artwork metadata restored.
DownloadedWorkController.getBatchArtworks.POST.summary=Look up downloaded artworks in bulk
DownloadedWorkController.getBatchArtworks.POST.description=Return active records in the submitted ID order, skipping unknown IDs. When includeDeleted is true, deletedArtworkIds also lists matching deleted records.
DownloadedWorkController.getBatchArtworks.POST.success=Downloaded artworks in bulk.
DownloadedWorkController.getStatistics.GET.summary=Get download statistics
DownloadedWorkController.getStatistics.GET.description=libraryArtworks and libraryImages include imported works and exclude deleted records. totalArtworks and totalImages are cumulative downloads for administrators. Invited guests see only their visible inventory.
DownloadedWorkController.getStatistics.GET.success=Download statistics.
DownloadedWorkController.getArtworkByMoveFolder.GET.summary=Look up artwork by directory
DownloadedWorkController.getArtworkByMoveFolder.GET.description=Finds artworkId by its recorded moved-folder path. Missing or invisible records return 404.
DownloadedWorkController.getArtworkByMoveFolder.GET.success=Artwork by directory.
DownloadedWorkController.moveArtWork.POST.summary=Move a downloaded artwork
DownloadedWorkController.moveArtWork.POST.description=Records an externally completed move in the library. movePath is the destination folder. The caller moves the files on disk. With a program key, use /api/library/artworks/{artworkId}/move. The corresponding /api/downloaded route uses the local access policy.
DownloadedWorkController.moveArtWork.POST.success=Downloaded artwork.
DownloadedWorkController.getHistory.GET.summary=List artwork download history
DownloadedWorkController.getHistory.GET.description=Lists visible downloaded artwork IDs. Use history/paged for pages of artwork records.
DownloadedWorkController.getHistory.GET.success=Artwork download history.
DownloadedWorkController.getPagedHistory.GET.summary=Browse artwork download history
DownloadedWorkController.getPagedHistory.GET.description=Pages through download records. sort=author_id orders by author ID. Other values order by download time.
DownloadedWorkController.getPagedHistory.GET.success=Artwork download history.
MangaSeriesController.getSeries.GET.summary=List saved manga series
MangaSeriesController.getSeries.GET.description=Lists visible local manga series. Use /api/series/paged to filter or load one page at a time.
MangaSeriesController.getSeries.GET.success=Saved manga series.
MangaSeriesController.getPagedSeries.GET.summary=Browse manga series
MangaSeriesController.getPagedSeries.GET.description=page starts at 0 and size is clamped to 1–200. sort supports title, artworks and seriesId. Unknown sorts use title.
MangaSeriesController.getPagedSeries.GET.success=Manga series.
MangaSeriesController.getSeriesDetail.GET.summary=Get manga series details
MangaSeriesController.getSeriesDetail.GET.description=Reads series details by ID. Only visible chapters count for guests. An absent or invisible series returns 404.
MangaSeriesController.getSeriesDetail.GET.success=Manga series details.
MangaSeriesController.getSeriesCover.GET.summary=Get a manga series cover
MangaSeriesController.getSeriesCover.GET.description=Returns the local cover image of a visible series. A missing series or cover returns 404.
MangaSeriesController.getSeriesCover.GET.success=Manga series cover.
parameter.artworkId=Pixiv artwork ID.
parameter.seriesId=Identifier of the artwork or novel series.
parameter.verifyFiles=Check whether the registered artwork files exist on disk.
parameter.cover=Request the cover thumbnail variant.
