title=다운로드한 작품
AuthorController.getAuthors.GET.summary=저장한 작품의 작가 목록 조회
AuthorController.getAuthors.GET.description=조회 가능한 로컬 작가를 반환합니다. 검색, 정렬, 페이지 조회에는 /api/authors/paged를 사용합니다.
AuthorController.getAuthors.GET.success=저장한 작품의 작가.
AuthorController.getPagedAuthors.GET.summary=작가 페이지 조회
AuthorController.getPagedAuthors.GET.description=page는 0부터이고 size는 1–200 범위로 조정됩니다. sort는 name, artworks, authorId이며 다른 값은 name으로 처리합니다.
AuthorController.getPagedAuthors.GET.success=작가.
WorkAssetFileController.getThumbnail.GET.summary=작품 페이지 미리보기 이미지 조회
WorkAssetFileController.getThumbnail.GET.description=artworkId와 page로 로컬 섬네일을 조회합니다. cover로 표지 섬네일, size로 요청 크기를 선택합니다. 기본 주소는 GET /api/downloaded/thumbnail/{artworkId}/{page} 입니다. GET /api/downloaded/thumbnail-file/{artworkId}/{page} 는 같은 주소의 별칭이며 cover와 size가 같으면 같은 방식으로 처리합니다.
WorkAssetFileController.getThumbnail.GET.success=작품 페이지 미리보기 이미지.
WorkAssetFileController.getImage.GET.summary=작품 페이지 이미지 조회
WorkAssetFileController.getImage.GET.description=표시용 이미지를 반환합니다. 원본이 ZIP이면 섬네일을 반환합니다. ZIP 원본은 rawfile에서 받습니다. 다시 확인하려면 이전 응답의 ETag를 If-None-Match에 지정하세요. If-Modified-Since만 보내면 현재 파일을 반환합니다.
WorkAssetFileController.getImage.GET.success=작품 페이지 이미지.
WorkAssetFileController.getRawFile.GET.summary=작품 페이지의 원본 파일 다운로드
WorkAssetFileController.getRawFile.GET.description=0부터 시작하는 페이지 번호로 로컬 파일을 읽습니다. 원본(ZIP 포함)이 있으면 우선 반환하고 변환본만 있으면 저장된 형식을 반환합니다. 프로그램 키에는 core:assets.export 권한이 필요합니다. 다시 확인하려면 이전 응답의 ETag를 If-None-Match에 지정하세요. If-Modified-Since만 보내면 현재 파일을 반환합니다.
WorkAssetFileController.getRawFile.GET.success=작품 페이지의 원본 파일.
DownloadedWorkController.getDownloaded.GET.summary=다운로드한 작품 정보 조회
DownloadedWorkController.getDownloaded.GET.description=작품 ID로 로컬 다운로드 기록을 조회합니다. verifyFiles는 기본값이 false이며 true이면 파일도 확인합니다. 기록이 없으면 400을 반환합니다. 프로그램 키로 호출할 때는 /api/library/artworks/{artworkId} 경로를 사용하세요. 대응하는 /api/downloaded 경로에는 로컬 접근 정책이 적용됩니다.
DownloadedWorkController.getDownloaded.GET.success=다운로드한 작품 정보.
DownloadedWorkController.recoverMetadata.POST.summary=제공한 값으로 누락된 작품 필드 보충
DownloadedWorkController.recoverMetadata.POST.description=사용할 값을 하나 이상 지정하세요. 기존 값은 유지되며 새로 등록하려면 페이지 수와 모든 파일이 필요합니다. Pixiv 메타데이터, 태그, 시리즈는 POST /api/tools/backfill/tasks 로 가져오세요. 프로그램 키로 호출할 때는 /api/library/artworks/{artworkId}/recover-metadata 경로를 사용하세요. 대응하는 /api/downloaded 경로에는 로컬 접근 정책이 적용됩니다. 새로 등록하려면 각 페이지마다 기본 파일 이름으로 찾을 수 있는 비어 있지 않은 이미지가 하나씩 있어야 합니다. 한 페이지에 후보가 여러 개면 등록하지 않습니다. 페이지별로 로컬 파일 형식을 기록하며 원본 이미지 형식은 알 수 없음으로 남깁니다. 기본 폴더는 다른 작품 폴더나 읽기 전용으로 가져온 파일과 겹치지 않아야 합니다.
DownloadedWorkController.recoverMetadata.POST.success=작품 메타데이터를 복원했습니다.
DownloadedWorkController.getBatchArtworks.POST.summary=여러 작품의 다운로드 기록 조회
DownloadedWorkController.getBatchArtworks.POST.description=제출한 ID 순서로 삭제되지 않은 작품을 반환하고 알 수 없는 ID는 건너뜁니다. includeDeleted가 true이면 삭제된 ID를 deletedArtworkIds에 따로 반환합니다.
DownloadedWorkController.getBatchArtworks.POST.success=여러 작품의 다운로드 기록.
DownloadedWorkController.getStatistics.GET.summary=작품 다운로드 통계 조회
DownloadedWorkController.getStatistics.GET.description=libraryArtworks와 libraryImages는 가져온 작품을 포함하며 삭제된 작품을 제외합니다. 관리자의 totalArtworks와 totalImages는 누적 다운로드 수입니다. 초대 손님은 열람 가능한 소장 수만 볼 수 있습니다.
DownloadedWorkController.getStatistics.GET.success=작품 다운로드 통계.
DownloadedWorkController.moveArtWork.POST.summary=작품 이동 기록 (지원 종료)
DownloadedWorkController.moveArtWork.POST.description=기존 권한 검사를 통과한 요청에는 본문 없이 HTTP 410을 반환합니다. 파일과 작품 기록은 변경되지 않습니다.
DownloadedWorkController.moveArtWork.POST.response.410=기존 권한 검사를 통과한 요청에는 본문 없이 HTTP 410을 반환합니다. 파일과 작품 기록은 변경되지 않습니다.
DownloadedWorkController.getHistory.GET.summary=작품 다운로드 기록 목록 조회
DownloadedWorkController.getHistory.GET.description=조회 가능한 다운로드 작품 ID 목록을 반환합니다. 작품 기록을 페이지별로 보려면 history/paged를 사용합니다.
DownloadedWorkController.getHistory.GET.success=작품 다운로드 기록.
DownloadedWorkController.getPagedHistory.GET.summary=작품 다운로드 기록 페이지 조회
DownloadedWorkController.getPagedHistory.GET.description=다운로드 기록을 페이지별로 조회합니다. sort=author_id는 작가 ID순이며 그 외에는 다운로드 시간순입니다.
DownloadedWorkController.getPagedHistory.GET.success=작품 다운로드 기록.
MangaSeriesController.getSeries.GET.summary=저장한 만화 시리즈 목록 조회
MangaSeriesController.getSeries.GET.description=볼 수 있는 로컬 만화 시리즈를 조회합니다. 필터링 및 페이지 조회에는 /api/series/paged를 사용합니다.
MangaSeriesController.getSeries.GET.success=저장한 만화 시리즈.
MangaSeriesController.getPagedSeries.GET.summary=만화 시리즈 페이지 조회
MangaSeriesController.getPagedSeries.GET.description=page는 0부터이고 size는 1–200 범위로 조정됩니다. sort는 title, artworks, seriesId이며 다른 값은 title로 처리합니다.
MangaSeriesController.getPagedSeries.GET.success=만화 시리즈.
MangaSeriesController.getSeriesDetail.GET.summary=만화 시리즈 세부 정보 조회
MangaSeriesController.getSeriesDetail.GET.description=ID로 시리즈 상세 정보를 조회합니다. 게스트에게 보이는 장만 집계하며 없거나 볼 수 없는 시리즈는 404입니다.
MangaSeriesController.getSeriesDetail.GET.success=만화 시리즈 세부 정보.
MangaSeriesController.getSeriesCover.GET.summary=만화 시리즈 표지 조회
MangaSeriesController.getSeriesCover.GET.description=보이는 시리즈의 로컬 표지 이미지를 반환합니다. 시리즈나 표지가 없으면 404입니다.
MangaSeriesController.getSeriesCover.GET.success=만화 시리즈 표지.
