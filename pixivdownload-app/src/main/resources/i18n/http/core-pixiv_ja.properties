title=Pixiv 照会
PixivSharedProxyController.getScheduleUserMeta.POST.summary=スケジュール用の Pixiv 作者情報を取得
PixivSharedProxyController.getScheduleUserMeta.POST.description=指定したスケジュールの認証情報を使い、userId で指定した作者の名前とユーザー ID を取得します。GET /api/schedule/sources の同じ項目から sourceType と activationToken をコピーします。プログラムキーで一覧を読むには core:schedule.sources.read が必要です。ソースの再公開後に両方の値を再取得してください。 taskId を指定する場合、プログラムキーにはタスクの取得元 owner の schedule.manage 権限も必要です。
PixivSharedProxyController.getScheduleUserMeta.POST.success=スケジュール用の Pixiv 作者情報。
PixivSharedProxyController.getUserMeta.GET.summary=Pixiv の作者情報を取得
PixivSharedProxyController.getUserMeta.GET.description=パスの Pixiv ユーザー ID で作者名を照会し、名前と ID を返します。
PixivSharedProxyController.getUserMeta.GET.success=Pixiv の作者情報。
PixivSharedProxyController.proxyThumbnail.GET.summary=プロキシ経由のサムネイルを取得
PixivSharedProxyController.proxyThumbnail.GET.description=サーバー経由で元のサムネイルを取得し、画像のメディア型とともに返します。
PixivSharedProxyController.proxyThumbnail.GET.success=プロキシ経由のサムネイル。
PixivSharedProxyController.getMeUid.GET.summary=ログイン中の Pixiv ユーザー IDを取得
PixivSharedProxyController.getMeUid.GET.description=Pixiv Cookie の PHPSESSID から UID を読み取ります。Pixiv へのセッション照会は行いません。UID を取得できない場合は 400 ACQUISITION_CREDENTIAL_REQUIRED を返します。
PixivSharedProxyController.getMeUid.GET.success=ログイン中の Pixiv ユーザー ID。
parameter.userId=作者の Pixiv ユーザー ID。
parameter.X-Acquisition-Credential=一時的な Pixiv 取得用 Cookie の値。任意、最大 16384 文字。保存済み認証情報を使う場合は X-Acquisition-Credentials で ID を指定します。 公開情報の取得に成功しても、Cookie の有効期限は確認されません。
parameter.url=サムネイルの取得元 URL。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.sourceType=GET /api/schedule/sources で選択したソースの sourceType。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.activationToken=sourceType と同じ項目の activationToken。ソースの再公開後に再取得してください。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.expectedStateVersion=取得時点のタスクの状態バージョン。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.proxy=この操作に使うプロキシ設定。
PixivSharedProxyController.getScheduleUserMeta.POST.body=照会に使うスケジュール取得元、認証情報、プロキシ。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.MeUidResponse.field.uid=取得用 Cookie から読み取った Pixiv アカウント ID。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.UserMetaResponse.field.name=Pixiv が返した作者の表示名。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.UserMetaResponse.field.userId=照会した作者の Pixiv ユーザー ID。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.taskId=既存タスクの ID。expectedStateVersion と対で指定するか、両方とも省略します。
schema.top.sywyar.pixivdownload.schedule.ScheduleRequestScope.Request.field.useTaskCredential=指定したタスクの認証ポリシーを使います。ID と状態バージョンを指定し、個別の認証情報は省略します。
parameter.X-User-UUID=マルチユーザーモードの UUID v4。割当の初期化で返された UUID を使います。有効なユーザー Cookie が優先されます。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ErrorResponse.field.code=code で失敗の原因を識別します。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.code=プロキシ要求数が上限に達した場合は pixiv.proxy.rate-limited。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.error=サーバーまたは Pixiv が返した失敗理由。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ErrorResponse.field.error=サーバーまたは Pixiv が返した失敗理由。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.maxRequests=対象期間内に許可される最大プロキシ要求数。
schema.top.sywyar.pixivdownload.core.pixiv.web.PixivSharedProxyController.ProxyRateLimitResponse.field.windowHours=プロキシ要求の回数制限期間（時間）。
PixivSharedProxyController.getMeUid.GET.response.400=Pixiv Cookie がない場合や UID を読み取れない場合、code は ACQUISITION_CREDENTIAL_REQUIRED です。
description=Pixiv のアカウント情報とサムネイルを取得します。
PixivSharedProxyController.proxyThumbnail.GET.parameter.url=pximg.net のサブドメインまたは embed.pixiv.net の絶対 HTTPS URL。ポートは省略または 443。ユーザー情報とフラグメントは指定できず、リダイレクトは追跡しません。
