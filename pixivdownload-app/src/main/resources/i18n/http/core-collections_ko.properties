schema.top.sywyar.pixivdownload.collection.request.CollectionDownloadRootRequest.field.downloadRoot=컬렉션 다운로드 루트입니다. 빈 값이나 null이면 기본 경로를 사용합니다. 상대 경로와 슬래시 하나로 시작하는 경로는 `download.root-folder` 기준입니다. 지원 변수는 {collectionRootVariables}입니다. 이름이 Favorites이면 `albums/{collection_name}`은 `albums/Favorites`가 되며 다른 중괄호 표현은 그대로 남습니다. 앞뒤 공백을 제거한 후 최대 500 UTF-16 코드 단위이며 제어 문자는 사용할 수 없습니다. 상대 경로는 루트 안에 있어야 하며 서버에서 인식한 절대 경로는 그 위치를 사용합니다.
