title=資料庫與遷移
DatabaseSettingsController.settings.GET.summary=檢視資料庫設定
DatabaseSettingsController.settings.GET.description=讀取已儲存的可編輯連線設定。用 providers 查可選 provider；用 status 核對下次啟動和當前實際連線的目標。
DatabaseSettingsController.settings.GET.success=資料庫設定。
DatabaseSettingsController.providers.GET.summary=列出資料庫提供程式
DatabaseSettingsController.providers.GET.description=返回本機資料庫提供方的標識及其連線欄位。草稿中使用對應提供方的標識。
DatabaseSettingsController.providers.GET.success=資料庫提供程式。
DatabaseSettingsController.status.GET.summary=檢視資料庫連線狀態
DatabaseSettingsController.status.GET.description=比較執行中的連線和下次啟動時生效的連線。restartRequired 表示已儲存的變更尚需重啟。
DatabaseSettingsController.status.GET.success=資料庫連線狀態。
DatabaseSettingsController.migration.GET.summary=檢視資料庫遷移進度
DatabaseSettingsController.migration.GET.description=返回當前遷移狀態。提交 POST /api/settings/database/migrations 後用此介面跟蹤，受理只表示已安排遷移。
DatabaseSettingsController.migration.GET.success=資料庫遷移進度。
DatabaseSettingsController.check.POST.summary=檢查資料庫連線
DatabaseSettingsController.check.POST.description=測試草稿中的連線。passwordAction 預設為 KEEP；SET 須傳非空 password，CLEAR 會清除草稿密碼。測試不會儲存設定。
DatabaseSettingsController.check.POST.success=資料庫連線。
DatabaseSettingsController.preview.POST.summary=預覽資料庫遷移
DatabaseSettingsController.preview.POST.description=檢查草稿的遷入目標並返回逐庫計劃。確認 ready、目標與需重建物件後，將本次預覽的 token 傳給 migrations。
DatabaseSettingsController.preview.POST.success=資料庫遷移。
DatabaseSettingsController.start.POST.summary=提交資料庫遷移任務
DatabaseSettingsController.start.POST.description=提交已確認預覽的 token 以啟動遷移並請求程序重啟。202 返回遷移狀態；後續查詢 GET /api/settings/database/migration。
DatabaseSettingsController.start.POST.success=資料庫遷移任務。
MigrationController.migrate.POST.summary=執行JSON 到 SQLite 的遷移
MigrationController.migrate.POST.description=本機請求同步執行舊版 JSON 遷移，處理結束後返回結果。
MigrationController.migrate.POST.success=JSON 到 SQLite 的遷移。
MigrationController.migrateWithProgress.GET.summary=執行舊版 JSON 遷移並訂閱進度
MigrationController.migrateWithProgress.GET.description=本機開啟此 SSE 流會啟動一次遷移。處理期間逐條推送進度；需要執行遷移時才連線。
MigrationController.migrateWithProgress.GET.success=JSON 到 SQLite 的遷移進度。
