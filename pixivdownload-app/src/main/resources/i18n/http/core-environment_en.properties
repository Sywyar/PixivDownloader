title=Environment transfer
EnvironmentTransferController.installation.GET.summary=Get installation identity
EnvironmentTransferController.installation.GET.description=Returns installation identity and paths for comparison with an archive’s source installation.
EnvironmentTransferController.installation.GET.success=Installation identity.
EnvironmentTransferController.state.GET.summary=Get restore status
EnvironmentTransferController.state.GET.description=Reads restore progress and results. After RESTORE_PENDING, check this endpoint for subsequent state.
EnvironmentTransferController.state.GET.success=Restore status.
EnvironmentTransferController.export.POST.summary=Create an environment archive
EnvironmentTransferController.export.POST.description=Export the selected data to destination. Set confirmRestart to true. The service stops the backend, writes the archive and requests a restart. After a 202, reconnect and check GET /api/settings/environment/exports.
EnvironmentTransferController.export.POST.success=Environment archive created.
EnvironmentTransferController.exportState.GET.summary=Get environment export status
EnvironmentTransferController.exportState.GET.description=Reads the current export job, or returns 204 when no job exists. Use its ID to download the completed archive.
EnvironmentTransferController.exportState.GET.success=Environment export status.
EnvironmentTransferController.archive.GET.summary=Download an environment archive
EnvironmentTransferController.archive.GET.description=Downloads the environment.pdbackup binary attachment for the specified export ID.
EnvironmentTransferController.archive.GET.success=Environment archive.
EnvironmentTransferController.preview.POST.summary=Preview an environment restore
EnvironmentTransferController.preview.POST.description=Pass the server-side archive path and decryption password to inspect restorable fields and file groups and obtain a confirmation token.
EnvironmentTransferController.preview.POST.success=Environment restore.
EnvironmentTransferController.restore.POST.summary=Restore an environment archive
EnvironmentTransferController.restore.POST.description=Submits the preview token and selected fields and groups. mappedPaths may map only selected fields. databasePaths maps database indexes to destination paths. A 202 returns RESTORE_PENDING.
EnvironmentTransferController.restore.POST.success=Environment archive restored.
