title=採集憑據
AcquisitionCredentialsController.read.GET.summary=檢視採集憑據清單
AcquisitionCredentialsController.read.GET.description=讀取當前 revision 和條目的 id、name、enabled。儲存修改時回傳 revision；響應始終省略 secret。
AcquisitionCredentialsController.read.GET.success=採集憑據清單。
AcquisitionCredentialsController.save.PUT.summary=儲存採集憑據庫
AcquisitionCredentialsController.save.PUT.description=用 entries 替換整份清單，省略的條目會被刪除。已有 id 的 secret 留空會沿用舊值；新 id 必須給出 secret。revision 衝突時返回 409，請重新讀取。
AcquisitionCredentialsController.save.PUT.success=已儲存採集憑據庫。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Update.field.revision=上次讀取的修訂號。發生編輯衝突時，重新讀取後再提交。
AcquisitionCredentialsController.save.PUT.body=憑據條目和編輯前讀取的修訂號。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.id=呼叫端指定的穩定 ID，須於清單內唯一，由 1–64 個 ASCII 英數字或連字號組成。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.id=呼叫端指定的穩定 ID，須於清單內唯一，由 1–64 個 ASCII 英數字或連字號組成。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.name=非空顯示名稱，最多 80 個 UTF-16 碼元。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.name=非空顯示名稱，最多 80 個 UTF-16 碼元。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.enabled=只有啟用的項目可依 ID 選為擷取憑證。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.View.field.enabled=只有啟用的項目可依 ID 選為擷取憑證。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Entry.field.secret=新 ID 須提供非空憑證（最多 16384 個 UTF-16 碼元，不含 ASCII 控制字元）。已有 ID 傳入空值或 null 會保留舊值。讀取時只傳回中繼資料。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Update.field.entries=取代後的完整清單，最多 8 項。空陣列會清空清單，省略的舊項目會刪除。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Snapshot.field.entries=以儲存順序傳回現有項目的 ID、名稱和啟用狀態。
schema.top.sywyar.pixivdownload.config.credential.AcquisitionCredentialLibrary.Snapshot.field.revision=下次儲存須原樣傳回此版本。
AcquisitionCredentialsController.save.PUT.response.409=憑據庫版本已變更，請重新讀取當前快照後提交修改。
AcquisitionCredentialsController.save.PUT.response.413=提交的憑據庫請求體超過大小上限。
description=讀取及更新擷取作品時使用的憑證清單。
