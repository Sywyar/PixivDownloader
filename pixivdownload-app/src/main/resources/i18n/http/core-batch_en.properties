schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.thumbnailReference=Thumbnail reference, or null if absent
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.resultCode=Executor result code. An existing download can return work.already-completed with outcome ALREADY_COMPLETED and item status skipped-downloaded. Extensions may return other codes.
