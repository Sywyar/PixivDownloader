title=Manual batches
ManualBatchController.create.POST.summary=Start a download batch
ManualBatchController.create.POST.description=Start a background download batch using an active source.
ManualBatchController.create.POST.details=Use `sourceType`, `activationToken` and `inputSchemaJson` from the same entry in `GET /api/schedule/sources`. Send `definition` as a JSON object matching that schema. Program keys need `core:schedule.sources.read` for the catalog, `core:batches.create` and the source plugin’s `batches.execute` to create a batch, and `batches.execute` for each work executor used. The request body is limited to 8 MiB and the serialized definition to 1 MiB. Send acquisition credentials in request headers.\n\n\
    The source validates `definition` before the batch is created. If it rejects the definition, the response is `400 INVALID_TOOL_REQUEST`. No batch is created and there is no `Location` header. Use `field` (for example, `/definition`) and `reason` to correct the definition and submit it again.\n\n\
    The `202` receipt contains the batch `id`. Poll `Location` with `GET` for `state` and `code`, and page through `/items` below that URL for individual works. A program uses its creating key with `core:batches.read`. After acceptance, failures during credential binding, work discovery or execution appear in the batch’s `state` and `code`. A republished source suspends it. Create a new batch using the current catalog entry. After acceptance the worker checks `batches.execute` for the executors selected by the plan. If the polling response has `code` equal to `auth.program.forbidden`, read the missing grant ID from `programPermission` in that response when available.\n\n\
    Each process retains one manual batch, with room for up to 5,000 distinct works and a 64 MiB item budget. Exceeding either limit reports `batch.work.capacity-exceeded`. After pausing or cancelling, wait for the run to stop. `resume` rescans the source and keeps completed and skipped items. `retry` processes only failed or paused items already discovered. Delete the idle batch before creating another. Process exit discards the batch record. Files and library entries already written are retained.
ManualBatchController.create.POST.success=Batch accepted. GET `Location` with the creating key and `core:batches.read`. Inspect `state` and `code`. For a missing execution grant, read its ID from `programPermission`.
ManualBatchController.create.POST.response.400=Invalid JSON, name, source, activation token, definition, proxy or credential header returns INVALID_TOOL_REQUEST. The source definition is validated before batch creation. Field errors include a JSON Pointer and reason, for example /definition/source/acquisitionMode and required. Read the batch state for execution results.
ManualBatchController.create.POST.response.404=The program key requested a source that is unavailable (batch.not-found). Reload the source catalog.
ManualBatchController.create.POST.response.409=A batch already exists (batch.exists), or the service is stopping (batch.stopping). Stop and delete the existing batch first.
ManualBatchController.create.POST.response.413=The JSON body exceeds 8 MiB (HTTP_BODY_LIMIT).
ManualBatchController.create.POST.response.500=The database is unavailable at creation or the service encountered an unclassified state error (batch.operation-failed). A body read failure returns error.io.
ManualBatchController.current.GET.summary=Get the current batch
ManualBatchController.current.GET.description=Returns the batch retained in this process. A 204 means none is visible to this caller. Batch records do not survive a restart.
ManualBatchController.current.GET.success=Current batch.
ManualBatchController.get.GET.summary=Get batch details
ManualBatchController.get.GET.description=Look up state, run, reason code and counters by the UUID returned on submission. A program key can read its own batch; another key gets 404.
ManualBatchController.get.GET.success=Batch details.
ManualBatchController.get.GET.response.404=No batch with this UUID exists or the batch belongs to another program identity (batch.not-found).
ManualBatchController.items.GET.summary=Browse batch items
ManualBatchController.items.GET.description=Page through per-work state and results in discovery order using zero-based offset and limit (1–200). Identify a work by the batch UUID, workType and id together.
ManualBatchController.items.GET.success=Batch items.
ManualBatchController.items.GET.response.400=offset is negative or limit is outside 1–200 (INVALID_TOOL_REQUEST).
ManualBatchController.items.GET.response.404=No batch with this UUID exists or the batch belongs to another program identity (batch.not-found).
ManualBatchController.pause.POST.summary=Pause a batch
ManualBatchController.pause.POST.description=Request a pause and retain progress. PAUSING means workers are still exiting. Wait for PAUSED before calling resume.
ManualBatchController.pause.POST.success=Batch paused.
ManualBatchController.pause.POST.response.404=No batch with this UUID exists or the batch belongs to another program identity (batch.not-found).
ManualBatchController.cancel.POST.summary=Cancel a batch
ManualBatchController.cancel.POST.description=Request cancellation of this run. While CANCELLING, workers are still exiting. Poll for the final state. The record remains until deleted.
ManualBatchController.cancel.POST.success=Batch.
ManualBatchController.cancel.POST.response.404=No batch with this UUID exists or the batch belongs to another program identity (batch.not-found).
ManualBatchController.resume.POST.summary=Resume a batch
ManualBatchController.resume.POST.description=Resume an idle, incomplete batch. Rescan the source and retain completed and skipped items. The returned run number increases.
ManualBatchController.resume.POST.success=Batch resumed.
ManualBatchController.resume.POST.response.404=The batch is missing, belongs to another program identity, or its source is no longer available to the program key (batch.not-found).
ManualBatchController.resume.POST.response.409=The batch is active, already completed, or the service is stopping (batch.not-idle).
ManualBatchController.retry.POST.summary=Retry failed batch items
ManualBatchController.retry.POST.description=Retry failed works already discovered. This does not resume source discovery. The batch must be idle with at least one retryable work or the request returns 409.
ManualBatchController.retry.POST.success=Failed batch items.
ManualBatchController.retry.POST.response.404=The batch is missing, belongs to another program identity, or its source is no longer available to the program key (batch.not-found).
ManualBatchController.retry.POST.response.409=The batch cannot start another run (batch.not-idle), or it has no failed works to retry (batch.no-failed-work).
ManualBatchController.credentials.PUT.summary=Update batch credentials
ManualBatchController.credentials.PUT.description=On an idle, incomplete batch, send the current run as expectedRun. Replace the acquisition credentials via X-Acquisition-Credential or omit the header to clear them. The next run prepares the source again. A fixed-account source keeps its original binding. Its credentials cannot be replaced or cleared.
ManualBatchController.credentials.PUT.success=Batch credentials updated.
ManualBatchController.credentials.PUT.response.400=The JSON request or acquisition credential header is invalid (INVALID_TOOL_REQUEST). A fixed binding (schedule.error.credential-fixed) or unavailable policy (schedule.error.credential-policy-unavailable) leaves the credentials in place.
ManualBatchController.credentials.PUT.response.404=No batch with this UUID exists or the batch belongs to another program identity (batch.not-found).
ManualBatchController.credentials.PUT.response.409=expectedRun differs from the current run, the batch is active or complete, or the service is stopping (batch.not-idle). Reload the batch. A policy change during the update returns schedule.error.credential-policy-publication-changed.
ManualBatchController.credentials.PUT.response.413=The JSON body exceeds 16 KiB (HTTP_BODY_LIMIT).
ManualBatchController.resolve.POST.summary=Resolve a pending batch item
ManualBatchController.resolve.POST.description=After the batch stops, submit its current run, the work identity and original reasonCode with the decision. The work must still require user action. Call resume or retry after saving.
ManualBatchController.resolve.POST.success=Pending batch item.
ManualBatchController.resolve.POST.response.400=The JSON, work identity or userAction format is invalid (INVALID_TOOL_REQUEST). For DOWNLOAD_PATH_ACTION_REQUIRED, choose TRUNCATE, DEFAULT_NAME or CANCEL. An unsupported value returns 400 at /userAction. Correct it while the item is still pending.
ManualBatchController.resolve.POST.response.404=No batch with this UUID exists or the batch belongs to another program identity (batch.not-found).
ManualBatchController.resolve.POST.response.409=The batch is active or expectedRun is stale (batch.not-idle), or the work, reasonCode or need for user action no longer matches (batch.action-changed).
ManualBatchController.resolve.POST.response.413=The JSON body exceeds 16 KiB (HTTP_BODY_LIMIT).
ManualBatchController.delete.DELETE.summary=Delete a batch record
ManualBatchController.delete.DELETE.description=Delete the stopped batch record and release its acquisition credentials. A new batch can then be created. Active batches return 409.
ManualBatchController.delete.DELETE.success=Batch record removed.
ManualBatchController.delete.DELETE.response.404=No batch with this UUID exists or the batch belongs to another program identity (batch.not-found).
ManualBatchController.delete.DELETE.response.409=The batch is active or is still stopping (batch.not-idle). Wait until it is idle before deleting it.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Credentials.field.expectedRun=Copy run from the current batch details. A changed run returns 409.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.name=Batch display name, 1–200 characters, with no control characters and at least one nonblank character.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.sourceType=Copy sourceType from the selected entry in GET /api/schedule/sources and use the activationToken from that same entry.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.activationToken=Current activationToken of the selected source. Refresh its catalog entry and input schema after republication.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.definition=The source definition is a JSON object. Follow x-schedule-sources[sourceType].inputSchemaJson in OpenAPI or edit examples[0] directly. Compact JSON is limited to 1 MiB in UTF-8. Send acquisition credentials in the request header. Both forms come from the same provider declaration. For standalone validation, parse x-schedule-sources[sourceType].inputSchemaJson as the schema root. For batch validation or SDK generation, resolve the corresponding ScheduleDefinition component against the complete OpenAPI document.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchController.Create.field.proxy=Optional host:port such as 127.0.0.1:7890. An empty value uses the global proxy.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.expectedRun=Copy run from the current batch details. A changed run returns 409.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.workType=Type of work identified by workId.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.workId=Source work ID paired with workType. Pass the original string unchanged.
ManualBatchController.credentials.PUT.body=Identify the batch run whose acquisition credentials are changing.
ManualBatchController.create.POST.body=Name, source definition and proxy for this batch.
ManualBatchController.resolve.POST.body=Run, pending work and how it should be handled.
parameter.id=ID returned when the manual batch was submitted.
