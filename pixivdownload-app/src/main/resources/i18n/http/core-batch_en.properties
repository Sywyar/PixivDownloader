schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkKey.field.workType=Work type, if known
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkResult.field.outcome=Outcome category reported by the work executor.
schema.top.sywyar.pixivdownload.plugin.api.schedule.work.ScheduledWorkPresentation.field.author=Author or developer display name
