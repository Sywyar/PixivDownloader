schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.userAction=Action for the reported reason. For DOWNLOAD_PATH_ACTION_REQUIRED use TRUNCATE (shorten the name), DEFAULT_NAME (use the short default) or CANCEL (cancel this work).
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.rememberForRun=Set true to reuse the decision for the same reason in this run, or false for this work only.
parameter.X-Acquisition-Credential=Acquisition credential for the work source, up to 16,384 characters. Send the program key separately in Authorization.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Resolve.field.reasonCode=Current reason code for the work awaiting a decision. It must exactly match the pending record.
ManualBatchController.items.GET.parameter.limit=Return 1–200 items. An out-of-range value returns 400.
ManualBatchController.items.GET.parameter.offset=Zero-based offset. A negative value returns 400.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.id=UUID of the manual batch. Use it as the id path parameter.
