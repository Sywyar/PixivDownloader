schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.workExecutorOwner=Owner or exact publication of the executor processing this work.
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.workExecutorPublicationId=Owner or exact publication of the executor processing this work.
schema.top.sywyar.pixivdownload.schedule.ScheduleRunQueue.Item.field.result=Work result produced by the executor, absent until available.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.Items.field.offset=Zero-based offset of the first row on this page.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.name=Batch display name supplied at creation.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.state=Current batch lifecycle state. Pausing or cancelling can wait for in-flight work.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.code=Null when there is no reason code. Use `state` to determine the batch status, including when a source or account policy plugin supplies an unfamiliar code. For a Pixiv author batch, `schedule.pixiv.discovery-not-found` means Pixiv returned HTTP 404 when listing the author's works, for example because the account does not exist or has been closed. Host codes: for `batch.work-failed`, inspect failed items. For `batch.discovery-incomplete`, resume discovery. For `batch.work.capacity-exceeded`, narrow the source. Check the source and executor for `schedule.error.source-publication-changed` or `schedule.error.execution-capability-unavailable`, the definition for `schedule.error.definition-invalid`, and permissions for `auth.program.forbidden`. Check server logs for `batch.dispatch-failed` or `batch.execution-failed`.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.run=Current run number. Echo as expectedRun for credentials or item resolution.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.createdTime=Batch creation time in Unix milliseconds.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.completed=Number of work entries completed successfully.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.skipped=Number of skipped work entries.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.failed=Number of failed work entries.
guide=https://sywyar.github.io/PixivDownloader/#/en/batch-download
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.programPermission=Permission missing from the program key during this run, when known.
description=Create manual batches, inspect their items and control execution.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.field=JSON Pointer to the field in the request body.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.reason=Stable, language-independent field validation reason.
schema.top.sywyar.pixivdownload.schedule.batch.ManualBatchService.View.field.retryAfterMillis=For RETRY_LATER, wait the suggested number of milliseconds before calling resume. Null in other states.
