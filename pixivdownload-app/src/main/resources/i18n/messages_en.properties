config.template.section.plugin-catalog=---- Plugin market / trusted catalog ----
config.template.plugin-catalog.enabled.comment=Whether to enable the plugin market (trusted catalog); on by default and repositories are contacted only when an admin opens or refreshes the market or installs a plugin. Disable it to prevent repository access; restart required
config.template.plugin-catalog.official-repository-enabled.comment=Whether to enable the built-in official default repository (enabled by default); only effective when the plugin market is on, can be disabled to use custom repositories only; restart required
config.template.plugin-catalog.connect-timeout-ms.comment=Global connect timeout (ms) for fetching repository manifests / downloading plugin packages, overridable per repository; restart required
config.template.plugin-catalog.read-timeout-ms.comment=Global read timeout (ms) for fetching repository manifests / downloading plugin packages, overridable per repository; restart required
config.template.plugin-catalog.max-manifest-bytes.comment=Maximum bytes allowed when downloading a single repository manifest (default 1 MB), overridable per repository; restart required
config.template.plugin-catalog.max-package-bytes.comment=Maximum bytes allowed when downloading a single plugin package (default 100 MB), overridable per repository; restart required
config.template.plugin-catalog.repositories.comment=Custom plugin repository list (empty by default, no third-party address is contacted); maintain it on the GUI "Plugins" config page, or fill in https manifest URLs by hand; restart required
