gui.config.market.open.hint=Swing 設定頁只負責設定與開啟入口；瀏覽儲存庫、查看插件詳細資訊及發起安裝，請在 Web 插件市場頁進行。
gui.config.market.repo.risk=安全提示：自訂儲存庫的來源是否可信由您自行負責——請只新增您完全信任的儲存庫。每個儲存庫的網路策略由「代理策略」決定：「嚴格直連」（預設）僅允許 HTTPS、拒絕非公開位址、禁止重新導向；「受信任代理」改經應用程式全域代理，且僅對白名單主機跟隨最多五次重新導向；「自訂」可逐項調整這些限制。無論採用哪種策略，插件包的大小 / SHA-256 / 簽章驗證都會以 fail-closed 作為兜底，但來源是否可信由您負責。
