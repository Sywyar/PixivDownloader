gui.config.market.repo.proxy-trusted.risk=「受信任代理」會經由應用程式全域代理（proxy.*）擷取，且僅在內建主機白名單內跟隨最多五次重新導向，放寬嚴格直連策略的部分網路限制；插件包完整性仍由大小 / SHA-256 / 簽章驗證（fail-closed）兜底。請只對您完全信任的儲存庫啟用。
