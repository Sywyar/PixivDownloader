gui.migrate-dir.symbolic-sync.inside.message=偵測到您修改了目前下載根目錄：\n舊：{0}\n新：{1}\n\n新目錄仍在軟體目錄內。是否將 config.yaml 的下載根目錄（download.root-folder）改為相對路徑「{2}」？\n選「是」：資料庫記錄會繼續跟隨軟體目錄，整體搬遷軟體後仍能自動定位（推薦）。\n選「否」：資料庫記錄會固定為新目錄的絕對路徑，config.yaml 不變，新下載仍會儲存至舊目錄。\n\n提示：本工具只會修改記錄，不會移動磁碟上的檔案，請先自行將檔案移動至新目錄。（修改下載根目錄需重新啟動服務後生效）
