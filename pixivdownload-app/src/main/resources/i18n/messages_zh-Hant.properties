gui.config.market.repo.custom.use-proxy=使用應用程式全域代理（proxy.*）
gui.config.market.repo.custom.risk=自訂策略可能放寬傳輸與 SSRF 防護。每個重新導向目標仍會重新驗證，且最多五次；使用代理時，非公開位址阻斷只能依據本機 DNS 結果，代理端的解析結果可能不同。請只開啟確實需要的選項。
