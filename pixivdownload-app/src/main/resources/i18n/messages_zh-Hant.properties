# --- 本機外掛程式套件安裝後端 API（交易落盤並即時啟用）---
plugin.install.outcome.installed=外掛程式已安裝並啟用
plugin.install.outcome.upgraded=外掛程式已升級並啟用新版本
plugin.install.outcome.downgraded=外掛程式已降級並啟用指定版本
plugin.install.outcome.duplicate=此版本外掛程式已安裝，無需重複安裝
plugin.install.outcome.downgrade-rejected=已安裝較高版本，預設拒絕降級（如需覆寫，請明確允許降級）
plugin.install.outcome.rejected-empty=未上傳外掛程式套件，或外掛程式套件為空
plugin.install.outcome.rejected-malformed=外掛程式套件已損壞，或不是支援的 .jar／.zip 套件
plugin.install.outcome.rejected-no-descriptor=外掛程式套件缺少描述檔（plugin.properties）
plugin.install.outcome.rejected-ambiguous=外掛程式套件版面配置有歧義，無法確定唯一外掛程式
plugin.install.outcome.rejected-invalid=外掛程式描述檔內容無效（id／版本／主類別等不合法）
plugin.install.outcome.rejected-incompatible=外掛程式要求的 SDK 版本與目前宿主 SDK 不相容
plugin.install.outcome.rejected-dependency=外掛程式必要相依項目未滿足，已拒絕安裝目標外掛程式
plugin.install.outcome.rejected-unsafe=外掛程式包含越界路徑項目（Zip Slip），已拒絕
plugin.install.outcome.rejected-too-large=外掛程式套件大小或解壓縮規模超出安全上限，已拒絕安裝
plugin.install.outcome.rejected-integrity=外掛程式套件未通過完整性驗證（缺少必要簽章，或大小／雜湊／簽章驗證失敗），已拒絕安裝
plugin.install.outcome.failed=外掛程式安裝或啟用失敗，請查看交易診斷與回滾結果
plugin.install.recovery-blocked=外掛程式變更已觸及持久化交易，但目前程序無法安全完成復原；請保留交易檔案並重新啟動後修復
# --- 受信任外掛程式目錄（catalog）後端 API（下載位址僅來自伺服器設定的受信任目錄，不接受任意 URL）---
plugin.catalog.error.disabled=受信任外掛程式目錄未啟用（未設定或未開啟），無法從目錄安裝
plugin.catalog.error.unavailable=受信任外掛程式目錄暫時無法使用（清單擷取或解析失敗）
plugin.catalog.error.unknown-repository=沒有此外掛程式儲存庫（不在伺服器設定的儲存庫清單中）
plugin.catalog.error.repository-disabled=此外掛程式儲存庫已停用
plugin.catalog.error.proxy-policy-unsupported=此外掛程式儲存庫的代理伺服器策略暫不支援
plugin.catalog.error.unknown-plugin=受信任外掛程式目錄中沒有此外掛程式
plugin.catalog.error.version-not-found=受信任外掛程式目錄中沒有此外掛程式的指定版本
plugin.catalog.error.insecure-url=外掛程式套件下載位址不安全（僅允許 https），已拒絕
plugin.catalog.error.blocked-address=外掛程式套件下載位址解析至禁止的網路位址（內部網路／本機等），已拒絕
plugin.catalog.error.download-too-large=外掛程式套件下載大小超出上限，已中止
plugin.catalog.error.download-failed=外掛程式套件下載失敗（網路錯誤、異常回應或發生重新導向）
plugin.catalog.error.invalid-package=受信任外掛程式目錄的套件中繼資料不完整（缺少位址／大小／雜湊），無法安全下載

