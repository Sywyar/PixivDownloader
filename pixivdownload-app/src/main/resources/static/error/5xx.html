<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5xx · 服务器错误</title>
    <link rel="icon" href="/favicon.ico">
    <script src="/js/pixiv-i18n.js"></script>
    <script src="/js/pixiv-lang-switcher.js"></script>
    <script src="/js/pixiv-theme.js"></script>
    <link rel="stylesheet" href="/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="/css/pixiv-scrollbar.css">
    <link rel="stylesheet" href="/error/error.css">
</head>
<body data-status="5xx">

<div class="err-controls" id="errControls"></div>

<main class="err-stage">
    <p class="err-code" aria-hidden="true"><span data-error-status-code>5xx</span><span class="err-code-dot">.</span></p>

    <div class="err-art" role="img" data-i18n-aria-label="status:5xx.art-label" aria-label="一只齿轮和一把扳手">
        <svg viewBox="0 0 220 150" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <!-- 齿轮 -->
            <circle cx="96" cy="80" r="30"/>
            <circle class="soft" cx="96" cy="80" r="12"/>
            <path d="M96 42 L96 54"/>
            <path d="M96 106 L96 118"/>
            <path d="M58 80 L70 80"/>
            <path d="M122 80 L134 80"/>
            <path d="M69 53 L78 61"/>
            <path d="M114 99 L123 107"/>
            <path d="M123 53 L114 61"/>
            <path d="M78 99 L69 107"/>
            <!-- 扳手 -->
            <path class="a" d="M150 42 C 158 34, 170 34, 177 41 L168 50 L176 58 L185 49 C 190 58, 186 70, 176 74 L140 110 C 135 115, 127 115, 123 110 C 119 105, 119 98, 124 93 L160 57 C 152 53, 147 46, 150 42 Z"/>
            <!-- 拧紧处的火花 -->
            <path class="a blink" d="M188 84 L196 88"/>
            <path class="soft" d="M192 74 L198 70"/>
        </svg>
    </div>

    <p class="err-eyebrow"><span data-error-status-code>5xx</span> · Server Error</p>
    <h1 class="err-title" data-i18n-html="status:5xx.title">服务器这一侧<em>出了点问题</em></h1>
    <p class="err-desc" data-error-status-text data-i18n="status:5xx.description">服务器在处理请求时发生了错误（5xx 服务器错误）。这不是你的操作导致的——问题在我们这一边。</p>

    <div class="err-hints">
        <p class="err-hints-lead" data-i18n="status:hints.lead">你可以试试</p>
        <ul>
            <li data-i18n="status:5xx.hint-1">稍等片刻，再试一次</li>
            <li data-i18n="status:5xx.hint-2">如果反复出现，打开日志文件（log 目录）查看具体异常</li>
            <li data-i18n="status:5xx.hint-3">把现象和日志带到 GitHub 提个 issue，我们来修</li>
        </ul>
    </div>

    <div class="err-actions">
        <button class="err-btn err-btn--primary" id="errRetry" type="button" data-i18n="status:action.retry">再试一次</button>
        <a class="err-btn err-btn--ghost" href="/" data-i18n="status:action.home">回到首页</a>
    </div>
</main>

<script src="/error/error.js"></script>
</body>
</html>
