<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件市场 · Pixiv 下载助手</title>
    <script src="/js/pixiv-i18n.js"></script>
    <script src="/js/pixiv-feedback.js"></script>
    <script src="/js/pixiv-lang-switcher.js"></script>
    <script src="/js/pixiv-theme.js"></script>
    <script src="/js/pixiv-navigation.js"></script>
    <script src="/js/pixiv-actions.js"></script>
    <!-- 共享 Vue 挂载助手（按需懒加载核心 Vue 运行时；加载即无副作用）。 -->
    <script src="/js/pixiv-vue.js"></script>
    <link rel="stylesheet" href="/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <!-- 全站共享动效层：统一动效令牌与通用微交互，页面自有样式在其后加载、可按需覆盖。 -->
    <link rel="stylesheet" href="/css/pixiv-motion.css">
    <link rel="stylesheet" href="/css/pixiv-feedback.css">
    <link rel="stylesheet" href="/css/pixiv-scrollbar.css">
    <link rel="stylesheet" href="/plugin-market/plugin-market.css">
    <!-- 页面模块按依赖顺序加载：shared token → core（命名空间 / 状态 / i18n / 格式化）→ data（纯数据变换）→
         api（后端调用）→ vue（reactive 主渲染）→ fallback（命令式回退）→ init（启动 + 顶层事件）。 -->
    <script src="/js/pixiv-plugin-presentation-tokens.js"></script>
    <script src="/plugin-market/plugin-market-core.js"></script>
    <script src="/plugin-market/plugin-market-data.js"></script>
    <script src="/plugin-market/plugin-market-api.js"></script>
    <script src="/plugin-market/plugin-market-vue.js"></script>
    <script src="/plugin-market/plugin-market-fallback.js"></script>
    <script src="/plugin-market/plugin-market-init.js"></script>
</head>
<body>

<nav class="app-nav">
    <div class="app-nav-brand-wrap">
        <span class="app-nav-logo"><i class="fa-solid fa-store"></i></span>
        <span class="app-nav-brand" data-i18n="nav.brand">Pixiv 下载助手</span>
    </div>
    <!-- 跨插件导航 slot（app.top placement）：由 /js/pixiv-navigation.js 据 /api/navigation 动态渲染，
         禁用某插件后其入口自然消失；当前页（插件市场）由 pathname 自动识别为激活项。 -->
    <span class="app-nav-links" data-nav-slot="app.top" data-nav-link-class="app-nav-link"
          data-nav-active-class="active" data-nav-target="_blank" data-nav-rel="noopener"></span>
    <div class="app-nav-spacer"></div>
    <div class="app-nav-actions" id="langSwitcherAnchor"></div>
    <button class="app-nav-logout" id="logout-btn" data-pixiv-click="pmkLogout()" data-i18n="logout">退出</button>
</nav>

<section class="pmk-import" id="repository-import" aria-labelledby="pmk-import-title">
    <h2 id="pmk-import-title" data-i18n="import.title">添加第三方仓库</h2>
    <p data-i18n="import.description">填写 repository.json 的公网 HTTPS 地址。软件会先展示发布者、联网主机、完整密钥指纹和更新边界，确认前不会修改配置。</p>
    <form id="pmk-repository-import-form" class="pmk-import-form">
        <label for="pmk-repository-url" data-i18n="import.url">仓库描述符地址</label>
        <div class="pmk-import-row">
            <input id="pmk-repository-url" type="url" required inputmode="url" autocomplete="url"
                   placeholder="https://example.org/repository.json">
            <button class="pmk-btn pmk-btn--gray" type="submit" data-i18n="import.preview">预览信任事实</button>
        </div>
    </form>
    <dl id="pmk-repository-preview" class="pmk-import-preview" aria-live="polite" hidden></dl>
    <label class="pmk-import-confirm">
        <input id="pmk-repository-confirm" type="checkbox" disabled>
        <span data-i18n="import.confirm">我已核对发布者、全部联网主机和完整密钥指纹，并信任该仓库分发可执行代码。</span>
    </label>
    <button id="pmk-repository-trust" class="pmk-btn pmk-btn--teal" type="button" disabled data-i18n="import.trust">信任并保存</button>
</section>

<!-- 市场页内容挂载点：主路径由 plugin-market-vue.js 用 Vue reactive 渲染；Vue 不可用时由 plugin-market-fallback.js
     命令式渲染（可诊断降级）。初始为加载占位，挂载后被替换。 -->
<div id="pmk-app-root">
    <div class="pmk-page">
        <div class="pmk-state"><i class="fa-solid fa-spinner fa-spin"></i><span data-i18n="loading">正在加载…</span></div>
    </div>
</div>

<div class="pmk-toast" id="pmk-toast" role="status" aria-live="polite"></div>

</body>
</html>
