<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixiv 批量下载器 — 初始配置</title>
<script src="/js/pixiv-i18n.js"></script>
<script src="/js/pixiv-feedback.js"></script>
<script src="/js/pixiv-lang-switcher.js"></script>
<script src="/js/pixiv-theme.js"></script>
<script src="/js/pixiv-actions.js"></script>
<!-- 全站共享动效层：统一动效令牌与通用微交互，页面自有样式在其后加载、可按需覆盖。 -->
<link rel="stylesheet" href="/css/pixiv-motion.css">
<link rel="stylesheet" href="/css/pixiv-feedback.css">
<link rel="stylesheet" href="/setup/setup.css">
</head>
<body>

<header>
  <span class="header-title" data-i18n="header.title">Pixiv 批量下载器 — 初始配置</span>
  <span class="header-actions" id="headerActions"></span>
</header>

<div class="page">

  <div class="card">
    <div class="card-title" data-i18n="welcome.title">欢迎使用</div>
    <p class="welcome-text" data-i18n-html="welcome.body">
      检测到这是首次运行，请完成以下初始配置。<br>
      配置完成后将不会再次显示此页面。
    </p>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="account.title">管理员账号</div>
    <div class="field">
      <label data-i18n="field.username">用户名</label>
      <input type="text" id="username" placeholder="设置管理员用户名" autocomplete="username"
             data-i18n-placeholder="field.username.placeholder">
    </div>
    <div class="field">
      <label data-i18n="field.password">密码（至少 12 位）</label>
      <input type="password" id="password" placeholder="设置密码" autocomplete="new-password"
             data-i18n-placeholder="field.password.placeholder">
    </div>
    <div class="field">
      <label data-i18n="field.confirm-password">确认密码</label>
      <input type="password" id="confirm-password" placeholder="再次输入密码" autocomplete="new-password"
             data-i18n-placeholder="field.confirm-password.placeholder">
    </div>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="proxy.title">代理设置</div>
    <p class="proxy-hint" data-i18n="proxy.hint">
      后端的对外网络访问都会经此 HTTP 代理：访问 Pixiv（浏览、搜索，下载图片/动图/小说/封面，收藏）、在线更新（检查并下载新版本）、下载内置 FFmpeg（动图转换所需）、在线 TTS（听书的 Edge 神经语音）。若运行在 Docker 容器中，127.0.0.1 通常无法连到宿主机代理，请按需关闭或填入容器可达的代理地址。
    </p>
    <label class="proxy-toggle">
      <input type="checkbox" id="proxy-enabled" checked data-pixiv-change="syncProxyEnabled()">
      <span data-i18n="proxy.enabled">启用代理</span>
    </label>
    <div class="field">
      <label data-i18n="proxy.host">代理主机</label>
      <input type="text" id="proxy-host" value="127.0.0.1" placeholder="127.0.0.1"
             data-i18n-placeholder="proxy.host.placeholder">
    </div>
    <div class="field">
      <label data-i18n="proxy.port">代理端口</label>
      <input type="text" id="proxy-port" value="7890" inputmode="numeric" placeholder="7890"
             data-i18n-placeholder="proxy.port.placeholder">
    </div>
  </div>

  <div class="card">
    <div id="status-msg"></div>
    <button class="btn btn-green" id="submit-btn" data-pixiv-click="submitSetup()" data-i18n="button.submit">完成配置</button>
  </div>

</div>

<script src="/setup/setup.js"></script>
</body>
</html>
